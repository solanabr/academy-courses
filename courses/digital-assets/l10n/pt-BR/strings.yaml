lessons:
  m01-l1-what-is-this-token:
    # | What is this token, really?
    title: "O que é esse token, de verdade?"  # @src=869933451fcf
    blocks:
      check:                      # quiz
        questions:
          m01-l1-q1:
            # | Your PYUSD decode printed a transferHook extension but the script flagged it
            # | 'dormant.' What did the bytes actually show?
            prompt: "Sua decodificação do PYUSD imprimiu uma extensão transferHook mas o script marcou ela como 'dormente'. O que os bytes de fato mostraram?"  # @src=0df9c714feaa
            # | 'Configured but dormant' is the teachable PYUSD fact: the extension is
            # | really in the bytes, but transferHook.programId = null (and the transfer fee
            # | reads 0 bps), so it has no active effect. Present is not the same as active,
            # | a distinction the whole course leans on.
            explanation: "'Configurado mas dormente' é o fato ensinável do PYUSD: a extensão está mesmo nos bytes, mas transferHook.programId = null (e a taxa de transferência lê 0 bps), então ela não tem efeito ativo. Presente não é a mesma coisa que ativo, uma distinção em que o curso inteiro se apoia."  # @src=e44c16f5e1b7
            options:                 # source order — keep it
              a:
                # | The transferHook extension is present on the mint, but its programId is
                # | null, so no hook program runs on transfers
                label: "A extensão transferHook está presente no mint, mas o programId dela é null, então nenhum programa de hook roda nas transferências"  # @src=7e574b8226a0
                # | The extension occupies a real TLV slot on the mint while its programId
                # | field holds null, which is what the script prints as configured but
                # | dormant.
                feedback: "A extensão ocupa um slot TLV de verdade no mint enquanto o campo programId dela guarda null, que é o que o script imprime como configurado mas dormente."  # @src=2435dc0fcbb8
              d:
                # | The hook slot names a program address that Paxos has not deployed yet,
                # | so the call silently no-ops
                label: "O slot de hook nomeia um endereço de programa cujo deploy a Paxos ainda não fez, então a chamada vira um no-op silencioso"  # @src=d47f0ed5fc3c
                # | The hook entry stores no address at all. The decode printed
                # | transferHook.programId as null, so there is nothing for a transfer to
                # | try to call and nothing to deploy against.
                feedback: "A entrada do hook não guarda endereço nenhum. A decodificação imprimiu transferHook.programId como null, então não há nada para uma transferência tentar chamar e nada contra o que fazer deploy."  # @src=9191256375be
              b:
                # | The transferHook extension runs on every transfer but its logic happens
                # | to be empty this block
                label: "A extensão transferHook roda em cada transferência mas a lógica dela por acaso está vazia neste bloco"  # @src=36469017ff09
                # | A dormant hook is not an empty running hook; PYUSD's slot has programId
                # | = null, so nothing is invoked at all.
                feedback: "Um hook dormente não é um hook rodando vazio; o slot do PYUSD tem programId = null, então nada é invocado."  # @src=4cb508885b99
              c:
                # | The transferHook field is a leftover from an old version and is ignored
                # | by the program
                label: "O campo transferHook é um resto de uma versão antiga e é ignorado pelo programa"  # @src=09fccbd0583b
                # | It is a live, current extension in the TLV, not a fossil; it is simply
                # | configured with a null program, hence dormant.
                feedback: "É uma extensão viva e atual no TLV, não um fóssil; ela simplesmente está configurada com um programa null, por isso dormente."  # @src=cd74c65bdd49
          m01-l1-q2:
            # | A teammate says 'a mint is a mint; reading PYUSD tells us nothing new.' Your
            # | decode found eight TLV extensions on it. What does that prove about the
            # | mental model 'a token is the classic SPL mint I already use'?
            prompt: "Um colega de time diz 'um mint é um mint; ler o PYUSD não nos diz nada de novo'. Sua decodificação achou oito extensões TLV nele. O que isso prova sobre o modelo mental 'um token é o mint SPL clássico que eu já uso'?"  # @src=b0438bd96257
            # | The opener breaks the prior model on purpose: PYUSD is Token-2022, and its
            # | eight extensions (permanent delegate, transfer fee, confidential, metadata
            # | pointer, and more) are shapes the classic SPL program cannot even represent.
            # | 'A token' is a decision across shapes, which is why you must be able to read
            # | the bytes before you choose.
            explanation: "A abertura quebra o modelo anterior de propósito: o PYUSD é Token-2022, e as oito extensões dele (delegado permanente, taxa de transferência, confidencial, ponteiro de metadados e mais) são formatos que o programa SPL clássico não consegue nem representar. 'Um token' é uma decisão entre formatos, que é o motivo de você precisar conseguir ler os bytes antes de escolher."  # @src=873b85c5e167
            options:                 # source order — keep it
              c:
                # | It proves nothing about the model: extensions are display-only metadata
                # | that wallets render and the token program ignores on transfer
                label: "Não prova nada sobre o modelo: extensões são metadados só de exibição que as carteiras renderizam e o programa de token ignora na transferência"  # @src=4c11a21defaa
                # | Extensions like permanent delegate and transfer fee change transfer
                # | behavior and who can move funds, the opposite of cosmetic.
                feedback: "Extensões como delegado permanente e taxa de transferência mudam o comportamento da transferência e quem pode mover fundos, o oposto de cosmético."  # @src=5a33f6b1012c
              a:
                # | It proves classic SPL mints can also carry eight extensions, since the
                # | classic program shares the same TLV region once you initialize one
                label: "Prova que mints SPL clássicos também podem carregar oito extensões, já que o programa clássico compartilha a mesma região TLV assim que você inicializa um"  # @src=fbc3e3bca30c
                # | Classic SPL mints carry no extensions at all. Extensions only exist on
                # | Token-2022, a different program. That is exactly the model break.
                feedback: "Mints SPL clássicos não carregam extensão nenhuma. Extensões só existem no Token-2022, um programa diferente. É exatamente essa a quebra do modelo."  # @src=e6b50855cdc2
              d:
                # | Token-2022 is a compatibility wrapper over the classic program, so
                # | PYUSD's eight extensions are add-ons bolted around the same classic mint
                # | underneath
                label: "Token-2022 é um wrapper de compatibilidade sobre o programa clássico, então as oito extensões do PYUSD são add-ons parafusados em volta do mesmo mint clássico por baixo"  # @src=ed4f1f159e6b
                # | There is no wrapping: the two programs own their accounts separately, a
                # | classic instruction aimed at a Token-2022 mint fails, and USDC's 82-byte
                # | account has no region for an add-on to sit in.
                feedback: "Não existe wrapping: os dois programas são donos das contas deles separadamente, uma instrução clássica mirada em um mint Token-2022 falha, e a conta de 82 bytes do USDC não tem região onde um add-on possa ficar."  # @src=3e219f234f5d
              b:
                # | PYUSD is a Token-2022 mint carrying extensions the classic SPL program
                # | cannot express, so 'a token' is a family of shapes, not one fixed layout
                label: "PYUSD é um mint Token-2022 carregando extensões que o programa SPL clássico não consegue expressar, então 'um token' é uma família de formatos, não um layout fixo"  # @src=0d7d97a5565a
                # | The mint is owned by Token-2022 at the Tokenz address, and a permanent
                # | delegate or a fee schedule are shapes the classic 82-byte layout has no
                # | room to hold.
                feedback: "O mint pertence ao Token-2022 no endereço Tokenz, e um delegado permanente ou uma tabela de taxas são formatos que o layout clássico de 82 bytes não tem espaço para segurar."  # @src=e75f02a07cb5
          m01-l1-q3:
            # | The second micro-demo reported a classic Transfer costing 76 CU. Why does
            # | the course refuse to let you memorize '76 CU' as a fixed fact?
            prompt: "A segunda micro-demo reportou uma Transfer clássica custando 76 CU. Por que o curso se recusa a deixar você memorizar '76 CU' como um fato fixo?"  # @src=64b5df11a652
            # | That 76 CU is the outcome of the p-token engine swap you meet in l3: the
            # | classic transfer used to cost far more. Because the underlying engine can
            # | change, the course's testing thread measures CU in a lab rather than
            # | freezing an engine-dependent number, and this demo is your first taste of
            # | that discipline.
            explanation: "Esses 76 CU são o resultado da troca de motor do p-token que você conhece na l3: a transferência clássica custava muito mais. Porque o motor por baixo pode mudar, a linha de testes do curso mede CU em um lab em vez de congelar um número dependente do motor, e esta demo é o seu primeiro gosto dessa disciplina."  # @src=554014e5c284
            options:                 # source order — keep it
              d:
                # | Because the 76 came from USDC's accounts, and a classic transfer's cost
                # | depends on the particular mint and token accounts involved
                label: "Porque o 76 veio das contas do USDC, e o custo de uma transferência clássica depende do mint e das contas de token específicos envolvidos"  # @src=80dac0187e08
                # | A classic mint is the same 82-byte layout whichever token it is, and the
                # | log line reports the program's cost for the instruction, not a per-mint
                # | price.
                feedback: "Um mint clássico é o mesmo layout de 82 bytes seja qual for o token, e a linha de log reporta o custo do programa para a instrução, não um preço por mint."  # @src=0ac8e556e86c
              b:
                # | Because CU accounting drifts with validator hardware and network load,
                # | so two simulations of the same transfer disagree
                label: "Porque a contabilidade de CU varia com o hardware do validador e a carga da rede, então duas simulações da mesma transferência discordam"  # @src=13b2a9809fb8
                # | They are deterministic enough to simulate and measure; that is exactly
                # | what the demo did. The reason to re-measure is that the engine changed,
                # | not that the number is noise.
                feedback: "Elas são determinísticas o bastante para simular e medir; foi exatamente isso que a demo fez. O motivo para medir de novo é que o motor mudou, não que o número seja ruído."  # @src=dc28b01a36af
              a:
                # | Because 76 CU is only what a devnet simulation reports; on mainnet-beta
                # | the same transfer is billed at a higher rate that shifts with priority
                # | fees
                label: "Porque 76 CU é só o que uma simulação de devnet reporta; na mainnet-beta a mesma transferência é cobrada a uma taxa mais alta que muda com as taxas de prioridade"  # @src=79607657ef32
                # | The figure is not a devnet artifact; it is the real post-p-token
                # | transfer cost, the same story the next lessons unpack. It is not
                # | memorized because it is a measured, movable number, not because clusters
                # | differ.
                feedback: "O número não é um artefato de devnet; é o custo real de transferência pós-p-token, a mesma história que as próximas lições desempacotam. Ele não é memorizado porque é um número medido e móvel, não porque os clusters são diferentes."  # @src=0a4ed667255b
              c:
                # | Because 76 CU reflects the current p-token engine, and the course
                # | measures such numbers rather than freezing an engine-dependent value
                label: "Porque 76 CU reflete o motor p-token atual, e o curso mede números desse tipo em vez de congelar um valor dependente do motor"  # @src=83f3192bdec3
                # | The same instruction billed 4,645 CU under the previous engine, so the
                # | figure belongs to whichever engine is live and gets re-measured rather
                # | than pinned into a doc.
                feedback: "A mesma instrução cobrava 4,645 CU no motor anterior, então o número pertence a qualquer motor que esteja no ar e é medido de novo em vez de ser fixado num doc."  # @src=e7027e6a32bf
  m01-l2-mint-account-anatomy:
    # | Mint & account anatomy from raw bytes
    title: "Anatomia do mint & da conta a partir dos bytes brutos"  # @src=46ffb3da4c98
    blocks:
      check:                      # quiz
        questions:
          m01-l2-q1:
            # | Your inspector reads a mint and the account is 82 bytes exactly. What can
            # | you conclude before looking at anything else?
            prompt: "Seu inspetor lê um mint e a conta tem exatamente 82 bytes. O que você pode concluir antes de olhar qualquer outra coisa?"  # @src=b87ef555963b
            # | The length is the first tell: 82 bytes is exactly the bare classic mint
            # | (authority, supply, decimals, init flag, freeze authority) with no
            # | account-type discriminator and no TLV region. Extensions force the base to
            # | 165 bytes plus a 1-byte type, so an 82-byte read means no extensions, full
            # | stop.
            explanation: "O comprimento é a primeira pista: 82 bytes é exatamente o mint clássico simples (autoridade, supply, decimals, flag de init, autoridade de congelamento) sem discriminador de tipo de conta e sem região TLV. Extensões forçam a base para 165 bytes mais um tipo de 1 byte, então uma leitura de 82 bytes significa nenhuma extensão, ponto final."  # @src=0dfe2abc1397
            options:                 # source order — keep it
              d:
                # | It is a classic-program mint, since Token-2022 pads the base of any mint
                # | it creates to 165 bytes plus an account-type byte
                label: "É um mint do programa clássico, já que o Token-2022 preenche a base de qualquer mint que ele cria até 165 bytes mais um byte de tipo de conta"  # @src=5639afda3685
                # | Size does not name the owner. Token-2022's own length model returns 82
                # | bytes for an empty extension set, so read the owner field to tell the
                # | two programs apart.
                feedback: "Tamanho não nomeia o dono. O próprio modelo de comprimento do Token-2022 devolve 82 bytes para um conjunto de extensões vazio, então leia o campo de dono para distinguir os dois programas."  # @src=44b0f9bf9287
              b:
                # | It is a Token-2022 mint whose TLV entries all carry zero-length values,
                # | so the extension region adds nothing to the size
                label: "É um mint Token-2022 cujas entradas TLV carregam todas valores de comprimento zero, então a região de extensões não acrescenta nada ao tamanho"  # @src=245545a1bd32
                # | Any extension pads the base to 165 bytes plus the account-type byte; an
                # | 82-byte account cannot carry TLV entries at all.
                feedback: "Qualquer extensão preenche a base até 165 bytes mais o byte de tipo de conta; uma conta de 82 bytes não consegue carregar entradas TLV de jeito nenhum."  # @src=994481f48492
              a:
                # | It is a bare mint with no extensions: 82 bytes is the classic base with
                # | no TLV region
                label: "É um mint simples sem extensões: 82 bytes é a base clássica sem região TLV"  # @src=9c097d922ff3
                # | 82 bytes is the whole base with nothing after it, so there is no
                # | account-type byte at offset 165 and no TLV region to walk.
                feedback: "82 bytes é a base inteira sem nada depois dela, então não há byte de tipo de conta no offset 165 e não há região TLV para caminhar."  # @src=91439ec29e06
              c:
                # | It is corrupted: a mint has to reach offset 165 to carry its
                # | account-type byte, so a read ending at 82 lost its tail
                label: "Está corrompido: um mint tem que alcançar o offset 165 para carregar o byte de tipo de conta dele, então uma leitura que termina em 82 perdeu a cauda"  # @src=a4cdad684da1
                # | Only extended accounts are padded out to 165 and given the account-type
                # | byte; a bare mint stops at 82 with nothing after it, and 82 is a
                # | perfectly valid classic size.
                feedback: "Só contas estendidas são preenchidas até 165 e recebem o byte de tipo de conta; um mint simples para em 82 sem nada depois, e 82 é um tamanho clássico perfeitamente válido."  # @src=9517b9e0cb3e
          m01-l2-q2:
            # | Parsing the TLV region, you read a type (u16) and a length (u16) of 32, then
            # | move your cursor 32 bytes forward. Everything after that decodes as garbage.
            # | What went wrong?
            prompt: "Parseando a região TLV, você lê um tipo (u16) e um comprimento (u16) de 32, e então move seu cursor 32 bytes para a frente. Tudo depois disso decodifica como lixo. O que deu errado?"  # @src=9de64336fb4d
            # | A TLV entry is u16 type + u16 length + value, so the header is 4 bytes.
            # | Advancing by the value length alone leaves the cursor 4 bytes short, and
            # | every subsequent type/length read lands mid-field, cascading into garbage.
            # | The fix is to step by 4 + length per entry.
            explanation: "Uma entrada TLV é tipo u16 + comprimento u16 + valor, então o header tem 4 bytes. Avançar só pelo comprimento do valor deixa o cursor 4 bytes antes, e toda leitura seguinte de tipo/comprimento cai no meio de um campo, virando uma cascata de lixo. A correção é andar 4 + comprimento por entrada."  # @src=6565d2c2a3fd
            options:                 # source order — keep it
              b:
                # | You advanced by the value length only; each TLV entry also has a 4-byte
                # | header (2 for type + 2 for length), so you must advance by 4 + length
                label: "Você avançou só pelo comprimento do valor; cada entrada TLV também tem um header de 4 bytes (2 para o tipo + 2 para o comprimento), então você precisa avançar 4 + comprimento"  # @src=2a8450dc6906
                # | The header costs 4 bytes on top of the value, so a cursor stepped by 32
                # | lands inside the pubkey it just read, and every later type and length
                # | parses as plausible garbage.
                feedback: "O header custa 4 bytes além do valor, então um cursor andado em 32 pousa dentro da pubkey que ele acabou de ler, e todo tipo e comprimento posterior parseia como lixo plausível."  # @src=86f1f18ac2da
              c:
                # | TLV entries are 8-byte aligned like the base fields, so you round each
                # | value length up to a multiple of 8 before the next entry
                label: "Entradas TLV são alinhadas em 8 bytes como os campos base, então você arredonda o comprimento de cada valor para cima até um múltiplo de 8 antes da próxima entrada"  # @src=76415d2a3578
                # | Token-2022 TLV entries are not padded to an 8-byte alignment; the miss
                # | is the 4-byte type+length header, not alignment.
                feedback: "Entradas TLV do Token-2022 não são preenchidas até um alinhamento de 8 bytes; o que falta é o header de tipo+comprimento de 4 bytes, não alinhamento."  # @src=8b3380128088
              d:
                # | Type 3's value is a COption pubkey, and the base layout priced those at
                # | 36 bytes, so the declared length under-reports it
                label: "O valor do tipo 3 é uma pubkey COption, e o layout base precificou essas em 36 bytes, então o comprimento declarado o subestima"  # @src=f1bff33e5152
                # | The 36-byte COption belongs to the base fields; a TLV value is the raw
                # | struct, and the walk prices MintCloseAuthority at the 32 bytes its own
                # | header declares.
                feedback: "O COption de 36 bytes pertence aos campos base; um valor TLV é a struct crua, e a caminhada precifica MintCloseAuthority nos 32 bytes que o próprio header dele declara."  # @src=5189a5d427a9
              a:
                # | u16 fields in a TLV header are big-endian, so a length that reads as 32
                # | is really 8192 and the cursor stops far too early
                label: "Campos u16 num header TLV são big-endian, então um comprimento que lê como 32 é na verdade 8192 e o cursor para cedo demais"  # @src=cd304e189adb
                # | Both u16 fields are little-endian, and endianness would corrupt the
                # | length read itself; here the length of 32 is right, and the bug is
                # | stepping 32 bytes instead of 36.
                feedback: "Os dois campos u16 são little-endian, e a endianness corromperia a própria leitura do comprimento; aqui o comprimento de 32 está certo, e o bug é andar 32 bytes em vez de 36."  # @src=e3f0ccacefec
          m01-l2-q3:
            # | You need to pre-fund rent for a new Token-2022 mint that will carry
            # | TransferFeeConfig and MetadataPointer. How do you get the exact byte size to
            # | size the account?
            prompt: "Você precisa pré-financiar rent para um novo mint Token-2022 que vai carregar TransferFeeConfig e MetadataPointer. Como você obtém o tamanho exato em bytes para dimensionar a conta?"  # @src=1e8defd8dea4
            # | try_calculate_account_len is the space-calc model: give it the exact
            # | extension set and it returns the account length including the 165 base, the
            # | account-type byte, and each extension's real TLV size. From TypeScript you
            # | call its mirror, getMintSize, which is the function step 7 of the lab
            # | actually runs. Guessing a flat per-extension number under- or over-sizes the
            # | account and its rent.
            explanation: "try_calculate_account_len é o modelo de cálculo de espaço: dê a ele o conjunto exato de extensões e ele devolve o comprimento da conta incluindo a base de 165, o byte de tipo de conta, e o tamanho TLV real de cada extensão. Do TypeScript você chama o espelho dele, getMintSize, que é a função que o passo 7 do lab de fato roda. Chutar um número fixo por extensão dimensiona a conta e o rent dela para menos ou para mais."  # @src=948891d5a648
            options:                 # source order — keep it
              b:
                # | Deploy with the classic 82-byte size and let the program realloc as
                # | extensions initialize
                label: "Faça o deploy com o tamanho clássico de 82 bytes e deixe o programa dar realloc conforme as extensões inicializam"  # @src=1557e075aad9
                # | Mint extensions are set at creation and the account must be sized up
                # | front; you cannot start at 82 bytes and grow into extensions.
                feedback: "Extensões de mint são definidas na criação e a conta precisa ser dimensionada de antemão; você não pode começar em 82 bytes e crescer para dentro das extensões."  # @src=a0a6dfc1219d
              a:
                # | Add 165 to a fixed 32 bytes per extension and use that
                label: "Some 165 a um valor fixo de 32 bytes por extensão e use isso"  # @src=9180442c4f3c
                # | Extensions are not a fixed 32 bytes each: TokenMetadata is
                # | variable-length; TransferFeeConfig is larger than a pointer. A
                # | fixed-per-extension guess mis-sizes the account.
                feedback: "Extensões não são 32 bytes fixos cada: TokenMetadata é de comprimento variável; TransferFeeConfig é maior que um ponteiro. Um chute fixo por extensão dimensiona a conta errado."  # @src=fc6026dc72d1
              d:
                # | Start from getMintSize() at 82 and add each extension's value length
                label: "Parta de getMintSize() em 82 e some o comprimento de valor de cada extensão"  # @src=0f2e38f8f940
                # | getMintSize() with no arguments prices a bare mint; the moment one
                # | extension exists the base moves to 165 plus the account-type byte, and
                # | every entry also pays its own 4-byte header.
                feedback: "getMintSize() sem argumentos precifica um mint simples; no momento em que uma extensão existe a base se move para 165 mais o byte de tipo de conta, e toda entrada também paga o próprio header de 4 bytes."  # @src=c7edc1aaa11b
              c:
                # | Compute it with ExtensionType::try_calculate_account_len for the chosen
                # | extension set
                label: "Calcule com ExtensionType::try_calculate_account_len para o conjunto de extensões escolhido"  # @src=398dc7c9fbc7
                # | Hand it the exact set and it returns the padded 165-byte base, the
                # | account-type byte, and 4 + value length per entry, which is your TLV
                # | walk run in reverse.
                feedback: "Entregue a ele o conjunto exato e ele devolve a base preenchida de 165 bytes, o byte de tipo de conta, e 4 + comprimento de valor por entrada, que é sua caminhada TLV rodada ao contrário."  # @src=780378ab08b4
  m01-l3-p-token-switch:
    # | The p-token switch: frozen interface, new engine
    title: "A troca do p-token: interface congelada, motor novo"  # @src=9b0649e78dd8
    blocks:
      check:                      # quiz
        questions:
          m01-l3-q1:
            # | A colleague insists 'SIMD-0266 shipped a new token program, so I need to
            # | update my client to the new address.' What is actually true?
            prompt: "Um colega insiste: 'o SIMD-0266 entregou um programa de token novo, então eu preciso atualizar meu cliente para o endereço novo.' O que é de fato verdade?"  # @src=50827076180b
            # | SIMD-0266 swapped the implementation behind the existing classic SPL address
            # | for Anza's Pinocchio rewrite, instruction by instruction and error by error.
            # | The interface (layouts, discriminators, errors) is frozen, so client code is
            # | untouched; the whole point is that nobody had to change anything.
            explanation: "O SIMD-0266 trocou a implementação por trás do endereço clássico do SPL existente pela reescrita em Pinocchio da Anza, instrução por instrução e erro por erro. A interface (layouts, discriminadores, erros) está congelada, então o código de cliente fica intocado; a questão inteira é que ninguém precisou mudar nada."  # @src=92907039ff53
            options:                 # source order — keep it
              b:
                # | p-token deployed at a fresh program address, so clients must swap the
                # | old TokenkegQ program id for the new one before the legacy deployment is
                # | disabled
                label: "o p-token fez deploy em um endereço de programa novo em folha, então clientes precisam trocar o program id antigo TokenkegQ pelo novo antes que o deploy legado seja desativado"  # @src=37780b963d07
                # | There is no new address; p-token runs at the classic TokenkegQ… address.
                # | Nothing to migrate; the interface is frozen.
                feedback: "Não existe endereço novo; o p-token roda no endereço clássico TokenkegQ…. Nada para migrar; a interface está congelada."  # @src=ef7b612ea9ed
              c:
                # | p-token supersedes Token-2022, so clients should port their extension
                # | logic onto the new engine and retire the Tokenz address
                label: "o p-token substitui o Token-2022, então clientes deveriam portar a lógica de extensão deles para o motor novo e aposentar o endereço Tokenz"  # @src=38266ced0273
                # | p-token is the classic SPL engine, not a Token-2022 successor; no
                # | Token-2022 successor exists. Extensions still live only in Token-2022.
                feedback: "o p-token é o motor do SPL clássico, não um sucessor do Token-2022; nenhum sucessor do Token-2022 existe. Extensões continuam morando só no Token-2022."  # @src=f4cdcbbd13fe
              a:
                # | p-token replaced the implementation at the SAME address with
                # | byte-identical layouts and discriminators, so no client changes are
                # | needed
                label: "o p-token substituiu a implementação no MESMO endereço com layouts e discriminadores idênticos byte a byte, então nenhuma mudança de cliente é necessária"  # @src=664f2ebe6f71
                # | Layouts, discriminators and error codes were frozen on purpose, so the
                # | address kept its contract and the engine behind it is the part that
                # | changed.
                feedback: "Layouts, discriminadores e códigos de erro foram congelados de propósito, então o endereço manteve o contrato dele e o motor por trás é a parte que mudou."  # @src=142d6fbf3c18
              d:
                # | The classic program was upgraded in place by its upgrade authority, so
                # | the address is unchanged but clients should re-pin the program hash they
                # | verify
                label: "O programa clássico foi atualizado no lugar pela autoridade de upgrade dele, então o endereço não mudou mas clientes deveriam refixar o hash de programa que eles verificam"  # @src=7bf2804b4b4e
                # | The program account reports Authority: none, so there is no upgrade key
                # | to deploy through. A feature gate activated by consensus is what swapped
                # | the code, and it left the interface untouched.
                feedback: "A conta do programa reporta Authority: none, então não existe chave de upgrade para fazer deploy. Um feature gate ativado por consenso é o que trocou o código, e ele deixou a interface intocada."  # @src=c4cb0a76eaf4
          m01-l3-q2:
            # | You read SIMD-0266's page and its status header says 'Review.' A teammate
            # | concludes p-token is not live yet. How do you correct this precisely?
            prompt: "Você lê a página do SIMD-0266 e o header de status dela diz 'Review.' Um colega de time conclui que o p-token ainda não está no ar. Como você corrige isso com precisão?"  # @src=d6c24b817fb8
            # | Say merged, not accepted or approved: merged is a Git fact (SIMD-0266 merged
            # | 2026-03-13) while its front-matter status still reads 'Review.' What
            # | actually gates activation is the on-chain feature gate ptokF…nSdP, which
            # | activated at slot 419,472,000 (epoch 971). The header is a lagging label;
            # | the gate is the truth.
            explanation: "Diga mergeado, não aceito nem aprovado: mergeado é um fato do Git (o SIMD-0266 foi mergeado em 2026-03-13) enquanto o status no front-matter dele ainda diz 'Review.' O que de fato controla a ativação é o feature gate on-chain ptokF…nSdP, que ativou no slot 419,472,000 (epoch 971). O header é um rótulo atrasado; o gate é a verdade."  # @src=62467eebdb52
            options:                 # source order — keep it
              a:
                # | The teammate is right: a 'Review' header means it has not been accepted,
                # | so p-token is still a proposal
                label: "O colega de time está certo: um header 'Review' quer dizer que não foi aceito, então o p-token ainda é uma proposta"  # @src=3cccddc58e2d
                # | The header lags reality: SIMD-0266 was merged on 2026-03-13 and its gate
                # | is active on mainnet. A 'Review' front-matter status does not mean
                # | unmerged.
                feedback: "O header atrasa em relação à realidade: o SIMD-0266 foi mergeado em 2026-03-13 e o gate dele está ativo na mainnet. Um status 'Review' no front-matter não quer dizer não mergeado."  # @src=3a6eb80a0f32
              b:
                # | SIMD-0266 merged on 2026-03-13 and its feature gate has been active on
                # | mainnet since epoch 971, so p-token is live
                label: "o SIMD-0266 foi mergeado em 2026-03-13 e o feature gate dele está ativo na mainnet desde a epoch 971, então o p-token está no ar"  # @src=ba858c40c883
                # | Merged is a dated Git fact, and liveness is settled by the 9-byte gate
                # | account you can read yourself, which is why chain state outranks a
                # | document header here.
                feedback: "Mergeado é um fato do Git com data, e estar no ar é resolvido pela conta de gate de 9 bytes que você mesmo pode ler, e é por isso que o estado da chain supera o header de um documento aqui."  # @src=aed68b2f1c67
              c:
                # | The header is authoritative, so p-token is live on devnet but not
                # | mainnet until the status flips to 'Accepted'
                label: "O header é a autoridade, então o p-token está no ar na devnet mas não na mainnet até o status virar 'Accepted'"  # @src=2757a8860e88
                # | Activation is governed by the on-chain feature gate, not the document
                # | header; the gate is active on mainnet, so it is live there today.
                feedback: "A ativação é governada pelo feature gate on-chain, não pelo header do documento; o gate está ativo na mainnet, então está no ar lá hoje."  # @src=0178451066ca
              d:
                # | Tell the teammate SIMD-0266 was formally accepted in a governance vote,
                # | and that the vote is what moved p-token from Review to live on mainnet
                label: "Diga ao colega de time que o SIMD-0266 foi formalmente aceito em uma votação de governança, e que a votação é o que moveu o p-token de Review para no ar na mainnet"  # @src=c19c61040ee9
                # | Accepted and approved are governance claims the paper trail does not
                # | support; the PR merged on 2026-03-13, and what put the engine on mainnet
                # | was the feature gate activating at epoch 971.
                feedback: "Aceito e aprovado são alegações de governança que o rastro de papel não sustenta; o PR foi mergeado em 2026-03-13, e o que colocou o motor na mainnet foi o feature gate ativando na epoch 971."  # @src=53fe1a044673
          m01-l3-q3:
            # | You want to explain, at the token layer, WHY a classic transfer now costs 76
            # | CU instead of 4,645. Where does the course say that 'why' properly belongs?
            prompt: "Você quer explicar, na camada de token, POR QUE uma transferência clássica agora custa 76 CU em vez de 4,645. Onde o curso diz que esse 'por que' pertence de fato?"  # @src=1aa000e84ec6
            # | Here you learn the CU drop as a fact and a mental model: frozen interface,
            # | faster engine. The runtime 'why' (loaders, sBPF, compute metering) is
            # | explicitly the planned Low-Level Solana course's territory, cross-referenced
            # | by name rather than re-derived, keeping this a token-layer lesson.
            explanation: "Aqui você aprende a queda de CU como um fato e um modelo mental: interface congelada, motor mais rápido. O 'por que' do runtime (loaders, sBPF, medição de compute) é explicitamente território do curso planejado Low-Level Solana, referenciado pelo nome em vez de rederivado, mantendo esta uma lição da camada de token."  # @src=53212573cd65
            options:                 # source order — keep it
              b:
                # | In this lesson, which derives it by stepping through the Pinocchio
                # | engine's allocator and zero-copy account internals
                label: "Nesta lição, que deriva isso percorrendo o alocador do motor Pinocchio e as entranhas de conta zero-copy"  # @src=58fe64bb426e
                # | This lesson teaches the CU drop as a token-layer mental model and
                # | explicitly refuses the runtime derivation, handing it off.
                feedback: "Esta lição ensina a queda de CU como um modelo mental da camada de token e explicitamente recusa a derivação do runtime, repassando-a."  # @src=29aa0d273bc9
              a:
                # | In Token-2022's extension source, since extensions are what made
                # | transfers cheaper
                label: "No código-fonte de extensões do Token-2022, já que extensões são o que deixou as transferências mais baratas"  # @src=6a12ad583a3d
                # | Extensions are unrelated to the classic transfer cost; this is the
                # | classic SPL engine, and extensions add cost, not remove it.
                feedback: "Extensões não têm relação com o custo da transferência clássica; este é o motor do SPL clássico, e extensões adicionam custo, não removem."  # @src=0ceab06512b7
              c:
                # | In the planned Low-Level Solana course, which owns the loader, sBPF and
                # | CU metering
                label: "No curso planejado Low-Level Solana, que é dono do loader, do sBPF e da medição de CU"  # @src=20297ebbc44b
                # | This lesson stops at what changed and when; where each of the 76 units
                # | goes is a runtime question, and the course that owns the runtime answers
                # | it.
                feedback: "Esta lição para no que mudou e quando; para onde vai cada uma das 76 unidades é uma pergunta de runtime, e o curso que é dono do runtime responde."  # @src=12c977fe9664
              d:
                # | In SIMD-0266 itself, which sets the per-instruction CU budget p-token
                # | had to hit
                label: "No próprio SIMD-0266, que define o orçamento de CU por instrução que o p-token tinha que atingir"  # @src=d9b4de0deffd
                # | The proposal's contract was byte-identical layouts, discriminators and
                # | error codes, not a compute target. Cheaper execution was the result of
                # | the rewrite, not a number the document specified.
                feedback: "O contrato da proposta era layouts, discriminadores e códigos de erro idênticos byte a byte, não um alvo de compute. Execução mais barata foi o resultado da reescrita, não um número que o documento especificou."  # @src=8f0abccd8d11
  m01-l4-decision-framework-conflict-matrix:
    # | Classic SPL vs Token-2022: the decision framework + the conflict matrix
    title: "SPL clássico vs Token-2022: o framework de decisão + a matriz de conflitos"  # @src=32b484a93327
    blocks:
      check-combo:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Rule 3: ConfidentialMintBurn requires ConfidentialTransferMint; reject it if
          # | the set has the former without the latter.
          0: "Regra 3: ConfidentialMintBurn exige ConfidentialTransferMint; rejeite se o conjunto tiver o primeiro sem o segundo."  # @src=fd8ac17f4798
          # | Rule 5 is a conditional: NonTransferable + ConfidentialTransferMint is only
          # | legal when ConfidentialMintBurn is also present.
          1: "A regra 5 é uma condicional: NonTransferable + ConfidentialTransferMint só é legal quando ConfidentialMintBurn também está presente."  # @src=5bb5bc8554a6
          # | Each rule is a guard that returns {valid:false, reason} on violation; if none
          # | fire, return {valid:true}.
          2: "Cada regra é uma trava que retorna {valid:false, reason} quando é violada; se nenhuma disparar, retorne {valid:true}."  # @src=e993f1c4df1b
        tests:                      # keyed by test case id
          t1:
            # | A legal pairing (fee + metadata) passes.
            description: "Um par legal (taxa + metadados) passa."  # @src=ec8148be63f7
          t2:
            # | Rule 4: ScaledUiAmount and InterestBearingConfig are mutually exclusive.
            description: "Regra 4: ScaledUiAmount e InterestBearingConfig são mutuamente exclusivos."  # @src=03193f9a9fc2
          t3:
            # | Rule 3: ConfidentialMintBurn requires ConfidentialTransferMint.
            description: "Regra 3: ConfidentialMintBurn exige ConfidentialTransferMint."  # @src=c8fae9b763ae
          t4:
            # | Rule 2: the fee + confidential pair requires ConfidentialTransferFeeConfig.
            description: "Regra 2: o par taxa + confidencial exige ConfidentialTransferFeeConfig."  # @src=6db7dcfee70d
          t5:
            # | Rule 5: NonTransferable + ConfidentialTransferMint needs
            # | ConfidentialMintBurn.
            description: "Regra 5: NonTransferable + ConfidentialTransferMint precisa de ConfidentialMintBurn."  # @src=021883375acb
          t6:
            # | Rule 5 is satisfied once ConfidentialMintBurn is present.
            description: "A regra 5 é satisfeita assim que ConfidentialMintBurn está presente."  # @src=d929f0e22cfc
      check:                      # quiz
        questions:
          m01-l4-q1:
            # | A product needs a token with confidential balances AND a transfer fee. You
            # | run check-combo on [TransferFeeConfig, ConfidentialTransferMint] and it
            # | rejects the set. Which rule fired, and what is the fix?
            prompt: "Um produto precisa de um token com saldos confidenciais E uma taxa de transferência. Você roda o check-combo em [TransferFeeConfig, ConfidentialTransferMint] e ele rejeita o conjunto. Qual regra disparou, e qual é o conserto?"  # @src=e360d55537a1
            # | Rule 2: TransferFeeConfig + ConfidentialTransferMint together require
            # | ConfidentialTransferFeeConfig. The pair is legal, but only once you add the
            # | extension that makes fees work under encryption; the fix is additive, not
            # | subtractive.
            explanation: "Regra 2: TransferFeeConfig + ConfidentialTransferMint juntos exigem ConfidentialTransferFeeConfig. O par é legal, mas só depois que você adiciona a extensão que faz as taxas funcionarem sob criptografia; o conserto é aditivo, não subtrativo."  # @src=b3656b633ecc
            options:                 # source order — keep it
              b:
                # | Transfer fees and confidential balances are simply incompatible; you
                # | must drop one of them
                label: "Taxas de transferência e saldos confidenciais são simplesmente incompatíveis; você tem que largar uma das duas coisas"  # @src=7e6b02e6525b
                # | They are compatible; the rule requires a third extension
                # | (ConfidentialTransferFeeConfig) rather than forbidding the pair.
                feedback: "Elas são compatíveis; a regra exige uma terceira extensão (ConfidentialTransferFeeConfig) em vez de proibir o par."  # @src=70f89b1e8b11
              a:
                # | The fee + confidential pair requires ConfidentialTransferFeeConfig; add
                # | it to be legal
                label: "O par taxa + confidencial exige ConfidentialTransferFeeConfig; adicione ele para ficar legal"  # @src=70196636cfd0
                # | Rule 2 is the mirror of rule 1: the pair is incomplete rather than
                # | forbidden, and the fix adds an extension instead of dropping a
                # | requirement.
                feedback: "A regra 2 é o espelho da regra 1: o par é incompleto e não proibido, e o conserto adiciona uma extensão em vez de largar um requisito."  # @src=662208e40c95
              d:
                # | Rule 1 fired, the guard against an incomplete confidential-fee bridge;
                # | the fix is to add ConfidentialTransferFeeConfig
                label: "A regra 1 disparou, a trava contra uma ponte de taxa confidencial incompleta; o conserto é adicionar ConfidentialTransferFeeConfig"  # @src=dbf348ede7c5
                # | The fix is right and the rule number is not, which is the whole point of
                # | naming guards: rule 1 keys on the bridge being present without both
                # | endpoints, and this set has no bridge in it yet.
                feedback: "O conserto está certo e o número da regra não está, que é o ponto inteiro de nomear travas: a regra 1 se baseia na ponte estar presente sem as duas pontas, e este conjunto ainda não tem ponte nenhuma dentro dele."  # @src=60ed4bb7e4df
              c:
                # | The set needs ConfidentialMintBurn added, since confidential supply
                # | accounting is what lets the program assess a fee on an encrypted amount
                label: "O conjunto precisa de ConfidentialMintBurn adicionado, já que a contabilidade de supply confidencial é o que permite ao programa calcular uma taxa sobre um valor criptografado"  # @src=2cb87ea2440e
                # | ConfidentialMintBurn is a different rule (confidential supply); the
                # | missing piece for a confidential fee is ConfidentialTransferFeeConfig.
                feedback: "ConfidentialMintBurn é outra regra (supply confidencial); a peça que falta para uma taxa confidencial é ConfidentialTransferFeeConfig."  # @src=b4d7eae13bcf
          m01-l4-q2:
            # | A teammate copies a conflict list from solana.com/docs and it has no
            # | PermissionedBurn entry, so they leave it out of the validator. Why is that a
            # | bug?
            prompt: "Um colega de time copia uma lista de conflitos do solana.com/docs e ela não tem entrada para PermissionedBurn, então ele deixa isso de fora do validador. Por que isso é um bug?"  # @src=fc5813e1b86b
            # | There is no official current matrix, and doc catalogs lag the code: the
            # | course's 2026-08-21 sweep caught solana.com with no PermissionedBurn page
            # | while solana-program.com already carried one, and the gap closed within a
            # | day. The source enum's 29 production variants are the truth, which is the
            # | whole reason this artifact is derived from
            # | check_for_invalid_mint_extension_combinations rather than copied from a
            # | page.
            explanation: "Não existe matriz oficial atual, e catálogos de documentação ficam atrás do código: a varredura de 2026-08-21 do curso pegou o solana.com sem página de PermissionedBurn enquanto o solana-program.com já tinha uma, e a lacuna fechou dentro de um dia. As 29 variantes de produção do enum da fonte são a verdade, que é o motivo inteiro de este artefato ser derivado de check_for_invalid_mint_extension_combinations em vez de copiado de uma página."  # @src=911aa7f48416
            options:                 # source order — keep it
              b:
                # | The source ExtensionType enum has 29 production variants including
                # | PermissionedBurn; the docs catalog lags the code, and the matrix must be
                # | derived from source
                label: "O enum ExtensionType da fonte tem 29 variantes de produção incluindo PermissionedBurn; o catálogo da documentação fica atrás do código, e a matriz tem que ser derivada da fonte"  # @src=be08728be045
                # | The count comes from a pinned commit with the test-only variants
                # | subtracted, so the validator inherits a claim you can date and re-derive
                # | rather than a page's mood on one afternoon.
                feedback: "A contagem vem de um commit fixado com as variantes só-de-teste subtraídas, então o validador herda uma afirmação que você consegue datar e re-derivar em vez do humor de uma página numa tarde qualquer."  # @src=3f906ed61d93
              a:
                # | PermissionedBurn was removed from Token-2022 in a later release, so
                # | keeping it in the matrix is the actual error
                label: "PermissionedBurn foi removido do Token-2022 num release posterior, então mantê-lo na matriz é o erro de verdade"  # @src=8a8f0182aa24
                # | It was not removed; it is one of the newest production variants in the
                # | source enum. The docs omission is the lag, not a removal.
                feedback: "Ele não foi removido; é uma das variantes de produção mais novas do enum da fonte. A omissão na documentação é o atraso, não uma remoção."  # @src=c656e0fde2d7
              d:
                # | The page has since added PermissionedBurn, so the omission was a timing
                # | accident and re-copying the docs later fixes the validator
                label: "A página adicionou PermissionedBurn desde então, então a omissão foi um acidente de timing e recopiar a documentação mais tarde conserta o validador"  # @src=c5d9f65271f6
                # | That page carries no version stamp, so a copy of it cannot say which
                # | world it describes; the enum at a named commit can, which is why the
                # | matrix is derived and not transcribed.
                feedback: "Aquela página não carrega carimbo de versão nenhum, então uma cópia dela não consegue dizer qual mundo descreve; o enum num commit nomeado consegue, que é por que a matriz é derivada e não transcrita."  # @src=1fe14a42d67e
              c:
                # | PermissionedBurn is a test-only variant behind a cfg flag, so both the
                # | docs and the validator should omit it
                label: "PermissionedBurn é uma variante só-de-teste atrás de um flag cfg, então tanto a documentação quanto o validador deveriam omitir ele"  # @src=63592aa91673
                # | The three test-only variants are separate; PermissionedBurn is a real
                # | production extension. The 29-variant count already excludes the
                # | test-only ones.
                feedback: "As três variantes só-de-teste são outra coisa; PermissionedBurn é uma extensão de produção real. A contagem de 29 variantes já exclui as só-de-teste."  # @src=58205392436e
          m01-l4-q3:
            # | Your check-combo validator accepts [TransferFeeConfig, MetadataPointer,
            # | PermanentDelegate]. A colleague says 'great, it will trade on Raydium then.'
            # | What is the precise gap in that reasoning?
            prompt: "O seu validador check-combo aceita [TransferFeeConfig, MetadataPointer, PermanentDelegate]. Um colega diz 'ótimo, então ele vai negociar na Raydium.' Qual é a lacuna precisa nesse raciocínio?"  # @src=cd7865b3c09e
            # | Legality is a floor, not routability. The five rules decide whether the
            # | program will initialize the mint; whether a DEX will pool it is a separate
            # | question governed by that venue's allowlist, and PermanentDelegate is
            # | exactly the kind of power extension Raydium refuses. That
            # | legal-versus-tradeable gap is the thesis Module 5 builds on.
            explanation: "Legalidade é um piso, não roteabilidade. As cinco regras decidem se o programa vai inicializar o mint; se uma DEX vai colocar ele num pool é uma pergunta separada, governada pela allowlist daquele venue, e PermanentDelegate é exatamente o tipo de extensão de poder que a Raydium recusa. Essa lacuna legal-versus-negociável é a tese sobre a qual o Módulo 5 se constrói."  # @src=cf5f9fd84e9b
            options:                 # source order — keep it
              d:
                # | DEX allowlists apply these same five source rules before they pool a
                # | mint, so a set your validator accepts will route on Raydium unless a
                # | guard fires there too
                label: "As allowlists de DEX aplicam estas mesmas cinco regras da fonte antes de colocar um mint num pool, então um conjunto que o seu validador aceita vai rotear na Raydium a menos que uma trava dispare lá também"  # @src=b2e2a609d57f
                # | A venue's allowlist is policy, not the init function: it can refuse an
                # | extension whose behavior the venue did not model, however cleanly the
                # | set clears all five guards.
                feedback: "A allowlist de um venue é política, não a função de init: ela pode recusar uma extensão cujo comportamento o venue não modelou, por mais limpo que o conjunto passe pelas cinco travas."  # @src=b761552ee8c8
              a:
                # | The validator is wrong to accept that set; PermanentDelegate is one of
                # | the five source rules' hard conflicts, so the init itself would fail
                label: "O validador está errado em aceitar esse conjunto; PermanentDelegate é um dos conflitos duros das cinco regras da fonte, então a própria init falharia"  # @src=92d33a3f43ab
                # | PermanentDelegate does not violate the five init rules; the set is legal
                # | to initialize. The gap is about venue acceptance, not init legality.
                feedback: "PermanentDelegate não viola as cinco regras de init; o conjunto é legal de inicializar. A lacuna é sobre aceitação por venue, não sobre legalidade de init."  # @src=42d703250ea6
              b:
                # | check-combo only proves the docs allow the set; the five rules are
                # | advisory lint from the interface crate, and the on-chain program never
                # | enforces them at init
                label: "o check-combo só prova que a documentação permite o conjunto; as cinco regras são lint consultivo do crate da interface, e o programa on-chain nunca as aplica na init"  # @src=c1595ab9b36a
                # | The five rules are code-enforced at initialization, not advisory. The
                # | validator does prove init legality. What it does not prove is downstream
                # | routability.
                feedback: "As cinco regras são aplicadas pelo código na inicialização, não são consultivas. O validador prova sim a legalidade de init. O que ele não prova é a roteabilidade rio abaixo."  # @src=519e58a14944
              c:
                # | check-combo proves the set is LEGAL to initialize, not that a venue
                # | accepts it; DEX allowlists reject extensions like PermanentDelegate
                # | separately
                label: "o check-combo prova que o conjunto é LEGAL de inicializar, não que um venue aceita ele; allowlists de DEX rejeitam extensões como PermanentDelegate à parte"  # @src=56f6ffa7f9f0
                # | Init legality is the floor the program enforces; whether a pool will
                # | hold the mint is a separate policy question per venue, and Module 5
                # | takes that gate apart.
                feedback: "A legalidade de init é o piso que o programa aplica; se um pool vai segurar o mint é uma questão de política separada, por venue, e o Módulo 5 desmonta essa cancela."  # @src=369a5456d385
          m01-l4-q4:
            # | The docs call NonTransferable + TransferFeeConfig incompatible, but your
            # | extracted code rules never reject that pair. How should the lesson (and your
            # | validator) treat this?
            prompt: "A documentação chama NonTransferable + TransferFeeConfig de incompatível, mas as regras de código que você extraiu nunca rejeitam esse par. Como a lição (e o seu validador) deve tratar isso?"  # @src=981513a06fe4
            # | A doc-level 'makes no sense' and a code-enforced init rejection are
            # | different classes of claim. The five extracted rules do not include
            # | NonTransferable + TransferFeeConfig, so the validator follows the code, and
            # | the lesson resolves the delta by attempting the init in a lab rather than
            # | freezing a rule the program does not actually enforce.
            explanation: "Um 'não faz sentido' em nível de documentação e uma rejeição de init aplicada pelo código são classes diferentes de afirmação. As cinco regras extraídas não incluem NonTransferable + TransferFeeConfig, então o validador segue o código, e a lição resolve o delta tentando a init num lab em vez de congelar uma regra que o programa de fato não aplica."  # @src=91005915d08f
            options:                 # source order — keep it
              c:
                # | As a typo in the docs: no code rule backs the claim, so drop the line
                # | and move on without testing it
                label: "Como um erro de digitação na documentação: nenhuma regra de código sustenta a afirmação, então largue a linha e siga em frente sem testar"  # @src=fa2f1559b613
                # | It is not dismissible as a typo: a doc-level 'makes no sense' and a
                # | code-level init-invalid are different classes; the honest move is to
                # | test the init, not to ignore the signal.
                feedback: "Não dá para descartar como erro de digitação: um 'não faz sentido' em nível de documentação e um init-inválido em nível de código são classes diferentes; a jogada honesta é testar a init, não ignorar o sinal."  # @src=5c329edf7283
              a:
                # | As an unresolved docs-vs-code delta: lab-test the actual init rather
                # | than asserting the doc-level conflict
                label: "Como um delta docs-vs-código não resolvido: teste no lab a init de verdade em vez de afirmar o conflito de nível de documentação"  # @src=00039b8ad681
                # | Two claim classes, two names: makes-no-sense is a doc caution,
                # | init-invalid is what the program enforces, and a terminal is the thing
                # | that decides which one you are looking at.
                feedback: "Duas classes de afirmação, dois nomes: não-faz-sentido é uma advertência de documentação, init-inválido é o que o programa aplica, e um terminal é a coisa que decide para qual das duas você está olhando."  # @src=06b757ba3097
              d:
                # | Treat the docs claim as the enforced one and expect the program to
                # | reject the pair at initialization
                label: "Trate a afirmação da documentação como a aplicada e espere que o programa rejeite o par na inicialização"  # @src=1e91b0104356
                # | The challenge probe settles it the other way: create-token succeeded,
                # | and the decoded mint carries both entries at 282 bytes, so the docs are
                # | making a semantic point about dead configuration.
                feedback: "A sondagem do challenge resolve isso do outro jeito: o create-token funcionou, e o mint decodificado carrega as duas entradas em 282 bytes, então a documentação está fazendo um ponto semântico sobre configuração morta."  # @src=7576f8823c4f
              b:
                # | As a sixth hard rule: the docs come from the program's maintainers, so
                # | encode the conflict in check-combo and reject the pair
                label: "Como uma sexta regra dura: a documentação vem dos mantenedores do programa, então codifique o conflito no check-combo e rejeite o par"  # @src=65dd6b2bd9df
                # | The extracted code rules do not list it, and the course derives the
                # | matrix from code; adding a rule the init function does not enforce would
                # | make the validator disagree with the program.
                feedback: "As regras de código extraídas não listam ele, e o curso deriva a matriz do código; adicionar uma regra que a função de init não aplica faria o validador discordar do programa."  # @src=ed8de6e267f9
  m02-l1-economics-extensions:
    # | Economics extensions: fees, interest, scaled UI (and where the fees GO)
    title: "Extensões de economia: taxas, juros, UI escalada (e para ONDE as taxas VÃO)"  # @src=a15780da6234
    blocks:
      fee-calculator:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Ceiling division on bigints: (numerator + 9999n) / 10000n
          0: "Divisão com arredondamento para cima em bigints: (numerador + 9999n) / 10000n"  # @src=532928222d7e
          # | Cap with a min against maximumFee
          1: "Limite com um min contra o maximumFee"  # @src=e67bb7b55eda
          # | Handle basisPoints === 0 and amount === 0n up front
          2: "Trate basisPoints === 0 e amount === 0n logo de cara"  # @src=df286e4f9481
        tests:                      # keyed by test case id
          exact-half-percent:
            # | 0.5% of 1,000,000 divides evenly to 5,000 (no rounding, no cap)
            description: "0.5% de 1,000,000 divide exato dando 5,000 (sem arredondamento, sem teto)"  # @src=c027b8532287
          ceiling-rounds-up:
            # | 1% of 101 is 1.01 and must round UP to 2 (floor would give 1)
            description: "1% de 101 é 1.01 e tem que arredondar para CIMA dando 2 (o floor daria 1)"  # @src=05499d8e1b37
          cap-applies:
            # | 1% of 1e9 is 10,000,000 but is capped at maximumFee 5,000
            description: "1% de 1e9 é 10,000,000 mas é limitado ao maximumFee 5,000"  # @src=6f4ced3f6091
          zero-basis-points:
            # | a 0 bps fee config withholds nothing
            description: "uma config de taxa de 0 bps não retém nada"  # @src=1429dc5f556e
          zero-amount:
            # | a zero-amount transfer withholds nothing
            description: "uma transferência de valor zero não retém nada"  # @src=3a8d1ee47aa2
      check:                      # quiz
        questions:
          q1-where-fees-go:
            # | You set a 1% transfer fee (100 bps) on SPROUT and someone sends 250 SPROUT
            # | to a buyer. The instant that transfer confirms, where does the withheld fee
            # | sit?
            prompt: "Você configura uma taxa de transferência de 1% (100 bps) no SPROUT e alguém manda 250 SPROUT para um comprador. No instante em que essa transferência confirma, onde a taxa retida fica?"  # @src=f131dc4a9276
            # | Token-2022 accrues transfer fees as WITHHELD amounts on each recipient token
            # | account. Routing them anywhere is a two-step job you own:
            # | harvest_withheld_tokens_to_mint sweeps accounts into the mint, then
            # | withdraw_withheld_tokens_from_mint pulls them to a destination. That harvest
            # | mechanic is exactly what m09-l1's fee-routing rail consumes.
            explanation: "O Token-2022 acumula taxas de transferência como valores RETIDOS em cada conta de token de destinatário. Rotear elas para qualquer lugar é um trabalho de dois passos que é seu: harvest_withheld_tokens_to_mint varre contas para dentro do mint, depois withdraw_withheld_tokens_from_mint puxa elas para um destino. Essa mecânica de harvest é exatamente o que o trilho de roteamento de taxas de m09-l1 consome."  # @src=ed0088bab476
            options:                 # source order — keep it
              a:
                # | In a treasury token account, credited automatically because you named a
                # | withdraw-withheld authority at mint creation.
                label: "Numa conta de token de tesouraria, creditada automaticamente porque você nomeou uma autoridade de withdraw-withheld na criação do mint."  # @src=4556582fb22f
                # | Nothing auto-routes to a treasury, and the withdraw-withheld authority
                # | is a KEY, not an account: it is permission to move fees later, never a
                # | destination that gets credited. Fees reach a treasury only when that key
                # | runs the harvest and withdraw steps.
                feedback: "Nada roteia automaticamente para uma tesouraria, e a autoridade de withdraw-withheld é uma CHAVE, não uma conta: ela é permissão para mover taxas depois, nunca um destino que é creditado. Taxas chegam a uma tesouraria só quando essa chave roda os passos de harvest e withdraw."  # @src=f66f59683f47
              c:
                # | Burned from the recipient's balance and re-minted to the fee authority's
                # | own account in one step.
                label: "Queimada do saldo do destinatário e recunhada na própria conta da autoridade de taxa em um passo só."  # @src=bd97344b1e8f
                # | No burn and no mint happen anywhere in a fee transfer. The fee is held
                # | intact in the recipient account's own TransferFeeAmount slot, not
                # | destroyed and recreated somewhere else.
                feedback: "Nenhuma queima e nenhuma cunhagem acontecem em lugar nenhum de uma transferência com taxa. A taxa é guardada intacta no slot TransferFeeAmount da própria conta do destinatário, não destruída e recriada em outro lugar."  # @src=d7a6576bc91e
              d:
                # | In the mint's own withheldAmount field, which the transfer instruction
                # | credits before it returns
                label: "No campo withheldAmount do próprio mint, que a instrução de transferência credita antes de retornar"  # @src=ff4ea50dfa54
                # | That field is real, and it fills only after someone runs the
                # | permissionless harvest; at confirmation time the fee is still scattered
                # | across recipient accounts.
                feedback: "Esse campo é real, e ele só se enche depois que alguém roda o harvest sem permissão; na hora da confirmação a taxa ainda está espalhada pelas contas de destinatário."  # @src=4c8baee2427e
              b:
                # | Withheld on the buyer's (recipient's) token account, until you harvest
                # | it.
                label: "Retida na conta de token do comprador (do destinatário), até você fazer o harvest dela."  # @src=dd8d59db4973
                # | TransferFeeConfig forces a TransferFeeAmount slot onto every account of
                # | the mint, and that slot is where the fee accrues per holder until
                # | someone sweeps it.
                feedback: "O TransferFeeConfig força um slot TransferFeeAmount em toda conta do mint, e esse slot é onde a taxa se acumula por holder até alguém varrer ela."  # @src=947359adb34f
          q2-mutual-exclusion:
            # | You want SPROUT's UI balance to grow with yield (InterestBearingConfig) AND
            # | rebase for a stock-split-style event (ScaledUiAmount). You try to enable
            # | both on one mint. What happens?
            prompt: "Você quer que o saldo de UI do SPROUT cresça com rendimento (InterestBearingConfig) E faça rebase para um evento no estilo desdobramento de ações (ScaledUiAmount). Você tenta habilitar as duas num mint só. O que acontece?"  # @src=82cbc1c6232d
            # | Rule 4 of check_for_invalid_mint_extension_combinations makes ScaledUiAmount
            # | and InterestBearingConfig mutually exclusive: both reshape the displayed
            # | balance, so only one may. The combo validator you built in m01-l4 already
            # | rejects this pairing before you ever hit the chain.
            explanation: "A regra 4 de check_for_invalid_mint_extension_combinations torna ScaledUiAmount e InterestBearingConfig mutuamente exclusivos: as duas remodelam o saldo exibido, então só uma pode. O validador de combo que você construiu em m01-l4 já rejeita esse par antes de você sequer chegar na chain."  # @src=af2fde08e408
            options:                 # source order — keep it
              d:
                # | Your client refuses to build the transaction, so nothing at all reaches
                # | the chain
                label: "O seu cliente se recusa a construir a transação, então nada chega à chain"  # @src=eed7f86ab109
                # | The builders assemble both instructions without complaint and the
                # | transaction is sent; the rejection comes back from the program, which is
                # | what makes this worth watching on a surfnet.
                feedback: "Os builders montam as duas instruções sem reclamar e a transação é enviada; a rejeição volta do programa, que é o que faz valer a pena assistir isso num surfnet."  # @src=49246d00c160
              c:
                # | Initialization fails; they are mutually exclusive by the source rules.
                label: "A inicialização falha; eles são mutuamente exclusivos pelas regras da fonte."  # @src=d3b034c5df7e
                # | Rule 4 is the one true mutual exclusion in the matrix, and the program
                # | delivers it as InvalidExtensionCombination, error 0x33, throwing the
                # | whole transaction away.
                feedback: "A regra 4 é a única exclusão mútua de verdade na matriz, e o programa entrega ela como InvalidExtensionCombination, erro 0x33, jogando a transação inteira fora."  # @src=22c89bfb7cd3
              e:
                # | The second initializer fails and the mint lands with the first
                label: "O segundo inicializador falha e o mint aterrissa com o primeiro"  # @src=18e8e3befd90
                # | Both initializers write their TLV entries happily. It is
                # | initialize_mint, the last instruction, that runs the five rules over the
                # | assembled set, so there is no half-built mint left behind.
                feedback: "Os dois inicializadores escrevem as entradas TLV deles alegremente. É o initialize_mint, a última instrução, que roda as cinco regras sobre o conjunto montado, então não sobra nenhum mint meio construído."  # @src=bbd6eaed9968
              b:
                # | It initializes, but only the extension you set last takes effect.
                label: "Ele inicializa, mas só a extensão que você configurou por último entra em vigor."  # @src=83ef39a62e6f
                # | There's no last-wins fallback; the initialization is rejected outright,
                # | not silently resolved.
                feedback: "Não existe fallback de último-vence; a inicialização é rejeitada de cara, não resolvida em silêncio."  # @src=4704ecc48bde
              a:
                # | Both initialize; the UI multiplies the interest rate by the scale
                # | factor.
                label: "As duas inicializam; a UI multiplica a taxa de juros pelo fator de escala."  # @src=75ee64004326
                # | They don't compose. Both extensions rewrite the displayed amount, so the
                # | runtime can't let both own it.
                feedback: "Elas não compõem. As duas extensões reescrevem o valor exibido, então o runtime não pode deixar as duas serem donas dele."  # @src=73eea2aeeb1a
          q3-measure-cu:
            # | The lab measures each extension's CU/rent cost with simulateTransaction
            # | against surfpool instead of quoting a cost table. Why?
            prompt: "O lab mede o custo de CU/rent de cada extensão com simulateTransaction contra o surfpool em vez de citar uma tabela de custos. Por quê?"  # @src=9bd301b0d556
            # | No per-extension CU/rent table exists in the docs or source. Rather than
            # | freeze an unpublished (and cluster-dependent) number, the testing thread
            # | measures it live with simulateTransaction, the same honest 'measure it,
            # | don't assert it' move you'll reuse for tree-cost and airdrop math later.
            explanation: "Não existe tabela de CU/rent por extensão na documentação nem na fonte. Em vez de congelar um número não publicado (e dependente de cluster), a linha de testes mede ele ao vivo com simulateTransaction, a mesma jogada honesta de 'meça, não afirme' que você vai reaproveitar para a matemática de custo de árvore e de airdrop mais para a frente."  # @src=e611b72ee50a
            options:                 # source order — keep it
              a:
                # | Per-extension CU costs are published nowhere, so you measure them on
                # | your target cluster.
                label: "Custos de CU por extensão não são publicados em lugar nenhum, então você mede eles no seu cluster alvo."  # @src=d8914a094137
                # | The send helper asks the cluster on every run for exactly this reason:
                # | the number is a function of the deployed program, the active features,
                # | and how many extensions your accounts carry.
                feedback: "O helper de envio pergunta ao cluster em toda rodada exatamente por esse motivo: o número é função do programa deployado, das features ativas e de quantas extensões as suas contas carregam."  # @src=139fad44b614
              c:
                # | CU costs are fixed by the runtime and identical across extensions.
                label: "Custos de CU são fixados pelo runtime e idênticos entre extensões."  # @src=1ee0d636f192
                # | Extensions have different processing costs; they are not uniform, which
                # | is exactly why a single table would be misleading.
                feedback: "Extensões têm custos de processamento diferentes; elas não são uniformes, que é exatamente por que uma tabela única seria enganosa."  # @src=80a980adee71
              d:
                # | A published per-extension table prices mainnet, and the lab runs on a
                # | local fork
                label: "Uma tabela publicada por extensão precifica a mainnet, e o lab roda num fork local"  # @src=242ef04fe07d
                # | There is no such table in the docs or the source to be cluster-specific
                # | about, which is the gap the measurement policy fills.
                feedback: "Não existe tabela desse tipo na documentação nem na fonte sobre a qual ser específico por cluster, que é a lacuna que a política de medição preenche."  # @src=5598058bc542
              b:
                # | simulateTransaction is the only way to send a Token-2022 transfer at
                # | all.
                label: "simulateTransaction é o único jeito de sequer mandar uma transferência Token-2022."  # @src=249ed737e1df
                # | It doesn't send anything; it simulates. Real transfers go through normal
                # | signed transactions; simulation is just for measurement here.
                feedback: "Ele não manda nada; ele simula. Transferências reais passam por transações assinadas normais; simulação aqui é só para medição."  # @src=d04fe2f5c0e9
  m02-l2-authority-extensions:
    # | Authority extensions: who can touch your tokens
    title: "Extensões de autoridade: quem pode tocar nos seus tokens"  # @src=3b399439f54b
    blocks:
      check:                      # quiz
        questions:
          q1-cpiguard-bypass:
            # | You enable CpiGuard on a token account to stop programs from moving funds
            # | without the owner. The mint also carries a permanent delegate. A program
            # | moves tokens out of that account through the delegate. What happens?
            prompt: "Você habilita o CpiGuard numa conta de token para impedir programas de mover fundos sem o dono. O mint também carrega um delegado permanente. Um programa move tokens para fora daquela conta através do delegado. O que acontece?"  # @src=6cb21b866969
            # | PermanentDelegate is the one authority that always bypasses CpiGuard, a
            # | mint-level power the account never consented to. This is precisely why
            # | Raydium refuses it: 'a holder of the delegate can sweep any token account,
            # | including the pool vault.'
            explanation: "PermanentDelegate é a única autoridade que sempre passa por cima do CpiGuard, um poder no nível do mint com o qual a conta nunca consentiu. É precisamente por isso que a Raydium a recusa: 'um holder do delegado consegue varrer qualquer conta de token, incluindo o vault do pool.'"  # @src=e18587054a79
            options:                 # source order — keep it
              b:
                # | The transfer succeeds; PermanentDelegate always bypasses CpiGuard.
                label: "A transferência tem sucesso; PermanentDelegate sempre passa por cima do CpiGuard."  # @src=b925eafbeb80
                # | The guard's rule asks whether the signer during a CPI is a delegate, and
                # | the extension guide carves the permanent delegate out by name, so the
                # | move walks through untouched.
                feedback: "A regra da trava pergunta se o signer durante uma CPI é um delegado, e o guia da extensão exclui o delegado permanente nominalmente, então o movimento passa intocado."  # @src=97eac33d288e
              d:
                # | It is blocked, since the delegate lacks the account owner's consent
                label: "É bloqueado, já que o delegado não tem o consentimento do dono da conta"  # @src=7800fc24404c
                # | Consent is what a mint-level power does not need. The holder inherited
                # | the delegate by choosing to hold the token, and the guard defends the
                # | account's own authority surface, not the mint's.
                feedback: "Consentimento é exatamente do que um poder no nível do mint não precisa. O holder herdou o delegado ao escolher segurar o token, e a trava defende a superfície de autoridade da própria conta, não a do mint."  # @src=e64d23f5fefe
              c:
                # | Both are ignored, because a mint extension and an account extension
                # | can't interact.
                label: "As duas são ignoradas, porque uma extensão de mint e uma extensão de conta não conseguem interagir."  # @src=99bd8e423326
                # | They very much interact: the mint-level delegate acts on the account,
                # | and it wins over the account's guard.
                feedback: "Elas interagem e muito: o delegado no nível do mint age sobre a conta, e ele ganha da trava da conta."  # @src=a3799d3f0b29
              a:
                # | CpiGuard blocks it; stopping unauthorized CPI moves is exactly its job.
                label: "O CpiGuard bloqueia; parar movimentos CPI não autorizados é exatamente o trabalho dele."  # @src=1c0cd09f778b
                # | CpiGuard blocks delegate-and-close tricks at the account level, but a
                # | permanent delegate is a mint-level power it cannot override.
                feedback: "O CpiGuard bloqueia truques de delegar-e-fechar no nível da conta, mas um delegado permanente é um poder no nível do mint que ele não consegue anular."  # @src=69571df0adfa
          q2-default-frozen:
            # | Your compliance team wants each new holder locked out until KYC clears, and
            # | they won't control accounts after launch. Which extension gets you that
            # | without chasing accounts one by one?
            prompt: "O seu time de compliance quer cada novo holder trancado do lado de fora até o KYC passar, e eles não vão controlar contas depois do lançamento. Qual extensão te dá isso sem perseguir contas uma por uma?"  # @src=e54d093f3c4d
            # | DefaultAccountState(Frozen) is the frozen-by-default onboarding primitive:
            # | new accounts open frozen and a freeze authority thaws each one after checks.
            # | Pausable, by contrast, halts ALL transfers/mints/burns globally in one flip.
            explanation: "DefaultAccountState(Frozen) é a primitiva de onboarding congelado por padrão: contas novas abrem congeladas e uma autoridade de congelamento descongela cada uma depois das checagens. O Pausable, por contraste, paralisa TODAS as transferências/cunhagens/queimas globalmente em um único acionamento."  # @src=2ca8a293c5df
            options:                 # source order — keep it
              b:
                # | MintCloseAuthority, so ops can close and reopen each account after KYC.
                label: "MintCloseAuthority, para que ops possa fechar e reabrir cada conta depois do KYC."  # @src=c3fab8a093df
                # | MintCloseAuthority closes mints to reclaim rent; it has nothing to do
                # | with gating new holders.
                feedback: "MintCloseAuthority fecha mints para recuperar rent; não tem nada a ver com restringir o acesso de novos holders."  # @src=c3ec56f81af1
              c:
                # | DefaultAccountState set to Frozen, so every new account starts frozen.
                label: "DefaultAccountState definido como Frozen, para que toda conta nova comece congelada."  # @src=4767cdbf2e66
                # | It inverts the default: an account is inert at birth and a holder goes
                # | live only through a deliberate thaw, so onboarding is opt-in by the
                # | issuer rather than a cleanup job.
                feedback: "Ela inverte o default: uma conta é inerte ao nascer e um holder entra no ar só através de um descongelamento deliberado, então o onboarding é opt-in pelo emissor em vez de um trabalho de limpeza."  # @src=583aaffd5a0f
              d:
                # | The mint's freeze authority, used to freeze each new account as soon as
                # | it appears
                label: "A autoridade de congelamento do mint, usada para congelar cada conta nova assim que ela aparece"  # @src=240c7a1910a6
                # | The freeze authority is the thaw side of this design, not the default.
                # | Accounts still open usable, so someone has to catch every new holder in
                # | time, which is the chase the extension removes.
                feedback: "A autoridade de congelamento é o lado do descongelamento desse design, não o default. Contas ainda abrem usáveis, então alguém tem que pegar todo holder novo a tempo, que é a perseguição que a extensão elimina."  # @src=a6e9bbc363bf
              a:
                # | Pausable, so compliance can pause transfers for each new account until
                # | that holder's KYC clears.
                label: "Pausable, para que o compliance possa pausar transferências para cada conta nova até o KYC daquele holder passar."  # @src=70f90b3422f6
                # | Pausable is a global switch for the whole mint, not a per-account
                # | onboarding gate; flipping it freezes everyone at once.
                feedback: "Pausable é uma chave global para o mint inteiro, não uma cancela de onboarding por conta; acioná-la congela todo mundo de uma vez."  # @src=26c455a467e5
          q3-close-revival:
            # | You use MintCloseAuthority to close a spent mint and reclaim its rent.
            # | What's the footgun you have to guard against?
            prompt: "Você usa MintCloseAuthority para fechar um mint gasto e recuperar o rent dele. Qual é a cilada contra a qual você tem que se proteger?"  # @src=b54937259916
            # | Close-and-revival: an account that's been zeroed and rent-drained can be
            # | recreated by anyone who re-funds its address. Mark-closed hygiene (writing a
            # | sentinel byte) stops a revived account from being mistaken for fresh,
            # | trusted state.
            explanation: "Fechar-e-ressuscitar: uma conta que foi zerada e teve o rent drenado pode ser recriada por qualquer um que financie o endereço dela de novo. A higiene de marcar-como-fechado (escrever um byte sentinela) impede que uma conta revivida seja confundida com estado novo e confiável."  # @src=4e6438d80810
            options:                 # source order — keep it
              c:
                # | The close authority is permanently transferred to the system program.
                label: "A autoridade de fechamento é transferida permanentemente para o system program."  # @src=1fae855cb8f7
                # | No authority transfer happens; the account is drained and zeroed, not
                # | handed off.
                feedback: "Nenhuma transferência de autoridade acontece; a conta é drenada e zerada, não repassada."  # @src=728b92ec133b
              b:
                # | Closing the mint automatically burns every outstanding token account.
                label: "Fechar o mint queima automaticamente toda conta de token em aberto."  # @src=febd6469ee54
                # | There is nothing for the close to burn: a mint with outstanding supply
                # | cannot be closed at all (MintHasSupply). Close only succeeds once supply
                # | is zero, so holder accounts are never touched.
                feedback: "Não há nada para o fechamento queimar: um mint com supply em circulação não pode ser fechado de jeito nenhum (MintHasSupply). O fechamento só tem sucesso quando o supply é zero, então contas de holders nunca são tocadas."  # @src=4ef6aaa5f2e6
              a:
                # | A closed account can be revived by re-funding it, so you must mark it
                # | closed to prevent reuse.
                label: "Uma conta fechada pode ser revivida financiando ela de novo, então você precisa marcá-la como fechada para impedir o reúso."  # @src=6d94bcc76165
                # | Closing drains lamports and zeroes data, and the address survives all of
                # | it, so a sentinel byte written before the close is what keeps a revived
                # | account from passing as fresh state.
                feedback: "Fechar drena lamports e zera dados, e o endereço sobrevive a tudo isso, então um byte sentinela escrito antes do fechamento é o que impede uma conta revivida de passar por estado novo."  # @src=c5dcd4ab98f9
              d:
                # | Lamports sent to that address later may be stranded, since it can hold
                # | no account
                label: "Lamports enviados para aquele endereço depois podem ficar encalhados, já que ele não pode segurar nenhuma conta"  # @src=9db37a4df129
                # | The address stays perfectly usable, and that is the problem: re-funding
                # | it creates a live account there, which is why the risk runs toward
                # | revival rather than toward loss.
                feedback: "O endereço continua perfeitamente usável, e esse é o problema: financiá-lo de novo cria uma conta viva ali, que é por que o risco corre na direção da ressurreição em vez da perda."  # @src=939e2624b146
  m02-l3-holder-protection-extensions:
    # | Holder-protection extensions: what accounts can refuse
    title: "Extensões de proteção ao holder: o que as contas podem recusar"  # @src=979676a45286
    blocks:
      check:                      # quiz
        questions:
          q1-forced-pair:
            # | You want soulbound SPROUT badges: non-transferable fungible tokens. You
            # | enable NonTransferable on the mint. Select the two extensions Token-2022
            # | then forces onto every holder account.
            prompt: "Você quer badges SPROUT soulbound: tokens fungíveis não transferíveis. Você habilita NonTransferable no mint. Selecione as duas extensões que o Token-2022 então força em toda conta de holder."  # @src=55e27753641b
            # | A NonTransferable mint forces the [NonTransferableAccount, ImmutableOwner]
            # | pair onto holder accounts, the soulbound-fungible pattern. The account can't
            # | be transferred and its owner can't be reassigned, so the badge truly sticks
            # | to its holder.
            explanation: "Um mint NonTransferable força o par [NonTransferableAccount, ImmutableOwner] nas contas de holder, o padrão soulbound-fungível. A conta não pode ser transferida e o dono dela não pode ser reatribuído, então o badge realmente cola no holder dele."  # @src=3d1657333dd7
            options:                 # source order — keep it
              b:
                # | ImmutableOwner, so the account's owner authority cannot be reassigned by
                # | SetAuthority
                label: "ImmutableOwner, para que a autoridade de dono da conta não possa ser reatribuída por SetAuthority"  # @src=c6eef04085a5
                # | Closing the transfer door means welding the ownership door too, or a
                # | holder sells the whole account instead of the token and the guarantee is
                # | decoration.
                feedback: "Fechar a porta da transferência significa soldar a porta da propriedade também, senão um holder vende a conta inteira em vez do token e a garantia é decoração."  # @src=7f57d739683f
              e:
                # | CpiGuard, so no program can move the badge out through a cross-program
                # | invocation
                label: "CpiGuard, para que nenhum programa possa mover o badge para fora por uma invocação entre programas"  # @src=11fd6c47fda1
                # | CpiGuard is a holder's own opt-in defence, toggled owner-signed on the
                # | account, and a soulbound mint blocks the transfer at the program level
                # | long before a guard would matter.
                feedback: "O CpiGuard é a defesa opt-in do próprio holder, alternada com assinatura do dono na conta, e um mint soulbound bloqueia a transferência no nível do programa muito antes de uma trava importar."  # @src=3c26e98dfac3
              d:
                # | TransferFeeAmount, the per-holder slot the forced-pair lookup attaches
                # | to the account
                label: "TransferFeeAmount, o slot por holder que a consulta de par forçado anexa à conta"  # @src=e320c0824c88
                # | That slot is real and it is forced by TransferFeeConfig, a different row
                # | of the same lookup; a badge mint with no fee has nothing to accrue
                # | there.
                feedback: "Esse slot é real e é forçado por TransferFeeConfig, uma linha diferente da mesma consulta; um mint de badge sem taxa não tem nada para acumular ali."  # @src=368a8390789e
              c:
                # | MemoTransfer, so every badge that arrives leaves a settlement reference
                # | in the log
                label: "MemoTransfer, para que todo badge que chega deixe uma referência de liquidação no log"  # @src=6e45d94dd8f5
                # | MemoTransfer is opt-in, enabled by the account's own owner after
                # | creation, and nothing in the forced-pair lookup attaches it to anything.
                feedback: "O MemoTransfer é opt-in, habilitado pelo próprio dono da conta depois da criação, e nada na consulta de par forçado o anexa a coisa alguma."  # @src=9f4a85affe2c
              a:
                # | NonTransferableAccount, the marker recording that this account holds
                # | soulbound tokens
                label: "NonTransferableAccount, o marcador registrando que esta conta guarda tokens soulbound"  # @src=69314a9b82cb
                # | Type 13, stamped on the account at initialization; without it the
                # | account cannot be created for this mint at all.
                feedback: "Tipo 13, estampado na conta na inicialização; sem ele a conta não pode ser criada para este mint de jeito nenhum."  # @src=f169264c3366
          q2-memo-required:
            # | A partner integrates your MemoTransfer-enabled account and reports that
            # | transfers to it keep failing. What's actually going on?
            prompt: "Um parceiro integra a sua conta com MemoTransfer habilitado e relata que as transferências para ela ficam falhando. O que está realmente acontecendo?"  # @src=49b2a4c5646c
            # | MemoTransfer makes a destination refuse any incoming transfer that doesn't
            # | carry a memo instruction, the integration burden Meteora's checklist warns
            # | about ('ensure destinations accept memo-required'). The sender, not you, has
            # | to attach the memo.
            explanation: "O MemoTransfer faz um destino recusar qualquer transferência que chega sem carregar uma instrução de memo, o fardo de integração sobre o qual o checklist da Meteora avisa ('garanta que os destinos aceitem memo obrigatório'). O remetente, não você, tem que anexar o memo."  # @src=910501f943e3
            options:                 # source order — keep it
              a:
                # | MemoTransfer requires the sender to hold a special memo NFT first.
                label: "O MemoTransfer exige que o remetente tenha antes um NFT de memo especial."  # @src=72729bb81bdf
                # | There's no memo NFT; the requirement is just a memo instruction
                # | alongside the transfer, not a token gate.
                feedback: "Não existe NFT de memo; a exigência é só uma instrução de memo junto com a transferência, não uma cancela por token."  # @src=ecb9a4364013
              b:
                # | MemoTransfer globally pauses transfers the way Pausable does.
                label: "O MemoTransfer pausa transferências globalmente do jeito que o Pausable faz."  # @src=902a75a2a0bf
                # | MemoTransfer is per-account and doesn't halt anything globally; it only
                # | rejects transfers lacking a memo.
                feedback: "O MemoTransfer é por conta e não para nada globalmente; ele só rejeita transferências que não têm memo."  # @src=009e1aa0d640
              c:
                # | Every transfer into a memo-required account must include a memo
                # | instruction, or it reverts.
                label: "Toda transferência para uma conta com memo obrigatório precisa incluir uma instrução de memo, ou ela reverte."  # @src=b834d50efc70
                # | The memo has to sit immediately before the transfer in the same
                # | transaction, which is why perfectly normal partner code reverts against
                # | your account and nowhere else.
                feedback: "O memo tem que ficar imediatamente antes da transferência na mesma transação, que é por isso que código de parceiro perfeitamente normal reverte contra a sua conta e em nenhum outro lugar."  # @src=498e1aea80c9
              d:
                # | The receiving account's owner has to attach the memo, and yours has not
                label: "O dono da conta que recebe tem que anexar o memo, e o seu não anexou"  # @src=09b0b22b54c6
                # | The memo rides in the sender's transaction, so the burden lands on every
                # | partner who transfers to you. That is the integration tax Meteora's
                # | checklist warns its integrators about.
                feedback: "O memo viaja na transação do remetente, então o fardo cai em todo parceiro que transfere para você. Esse é o imposto de integração sobre o qual o checklist da Meteora avisa os integradores dele."  # @src=51f1674ec0ad
          q3-immutable-owner:
            # | Why do Associated Token Accounts ship ImmutableOwner by default?
            prompt: "Por que as contas de token associadas já vêm com ImmutableOwner por padrão?"  # @src=356c8987c7df
            # | ImmutableOwner locks the owner authority so it can never be changed. ATAs
            # | ship it by default because their address is derived deterministically, and
            # | without the lock a program could re-own a derived account out from under its
            # | holder.
            explanation: "O ImmutableOwner imobiliza a autoridade de dono para que ela nunca possa ser mudada. As ATAs já vêm com ele por padrão porque o endereço delas é derivado deterministicamente, e sem essa imobilização um programa poderia re-assumir a posse de uma conta derivada por baixo do holder dela."  # @src=0e119332faee
            options:                 # source order — keep it
              b:
                # | So a single derived account can hold balances of several different mints
                # | at once.
                label: "Para que uma única conta derivada possa guardar saldos de vários mints diferentes ao mesmo tempo."  # @src=96fc8539bc48
                # | An ATA holds exactly one mint; ImmutableOwner has nothing to do with
                # | multi-mint storage.
                feedback: "Uma ATA guarda exatamente um mint; o ImmutableOwner não tem nada a ver com armazenamento de múltiplos mints."  # @src=b3c1e2104481
              d:
                # | Because the classic program enforces the same lock, so ATAs match on
                # | both programs
                label: "Porque o programa clássico impõe a mesma imobilização, então as ATAs batem nos dois programas"  # @src=961d12fc9a97
                # | The classic program stores no extensions at all: it takes the
                # | instruction as a no-op and logs a suggestion to upgrade, so the real
                # | enforcement exists on the Token-2022 side only.
                feedback: "O programa clássico não armazena extensão nenhuma: ele toma a instrução como um no-op e loga uma sugestão para atualizar, então a imposição real existe só do lado do Token-2022."  # @src=de1ca0031034
              c:
                # | So the account can be cheaply handed to a new owner later without
                # | recreating an ATA at a freshly derived address.
                label: "Para que a conta possa ser passada de forma barata para um novo dono mais tarde sem recriar uma ATA em um endereço recém-derivado."  # @src=c504013f40f2
                # | That's the opposite: ImmutableOwner exists specifically to prevent
                # | re-owning the account.
                feedback: "É o contrário: o ImmutableOwner existe especificamente para impedir que alguém re-assuma a posse da conta."  # @src=f9380b3595cb
              a:
                # | So the owner field can never be reassigned, closing a class of
                # | account-takeover tricks.
                label: "Para que o campo de dono nunca possa ser reatribuído, fechando uma classe de truques de tomada de conta."  # @src=390068e9f9cf
                # | An ATA's address derives from its owner, so every future sender computes
                # | it without asking; reassignable ownership would quietly redirect all of
                # | that to somebody else.
                feedback: "O endereço de uma ATA deriva do dono dela, então todo remetente futuro o computa sem perguntar; propriedade reatribuível redirecionaria silenciosamente tudo isso para outra pessoa."  # @src=4c99a8cf140f
  m02-l4-native-metadata:
    # | Native metadata: MetadataPointer + TokenMetadata TLV
    title: "Metadados nativos: MetadataPointer + TokenMetadata TLV"  # @src=4e35fb2f160a
    blocks:
      check:                      # quiz
        questions:
          q1-pointer-target:
            # | You add native metadata to SPROUT. Where should the MetadataPointer point,
            # | and why?
            prompt: "Você adiciona metadados nativos ao SPROUT. Para onde o MetadataPointer deveria apontar, e por quê?"  # @src=c16fe89504e8
            # | The native pattern sets MetadataPointer self-referential: the mint points at
            # | itself and stores the TokenMetadata TLV inline. Because the pointer and the
            # | data are the same account, no third account can masquerade as SPROUT's
            # | metadata; that's the anti-spoofing rationale.
            explanation: "O padrão nativo define o MetadataPointer como autorreferencial: o mint aponta para ele mesmo e guarda o TLV do TokenMetadata inline. Como o ponteiro e os dados são a mesma conta, nenhuma terceira conta pode se passar pelos metadados do SPROUT; essa é a justificativa antifalsificação."  # @src=1ebfe168e940
            options:                 # source order — keep it
              b:
                # | To the mint itself (self-referential), so nothing else can spoof its
                # | metadata.
                label: "Para o próprio mint (autorreferencial), para nada mais poder falsificar os metadados dele."  # @src=580cec3fdeea
                # | Pointer and data in the same account makes the trust loop one account
                # | long: to change what SPROUT claims to be you would need write access to
                # | SPROUT's own mint.
                feedback: "Ponteiro e dados na mesma conta fazem o loop de confiança ter uma conta de comprimento: para mudar o que o SPROUT alega ser você precisaria de acesso de escrita ao próprio mint do SPROUT."  # @src=58c98de1e0ae
              d:
                # | To a PDA derived from the mint that your own program owns, so you
                # | control updates
                label: "Para um PDA derivado do mint de que o seu próprio programa é dono, para você controlar as atualizações"  # @src=fcc93c6e3ddf
                # | Aiming the pointer anywhere but the mint reopens the indirection the
                # | attack lives in, and edit rights already have a home: the
                # | update_authority field inside the metadata entry.
                feedback: "Apontar o ponteiro para qualquer lugar que não o mint reabre a indireção onde o ataque mora, e os direitos de edição já têm uma casa: o campo update_authority dentro da entrada de metadados."  # @src=06e62c6f2dd9
              c:
                # | To the Token-2022 program address, which stores all metadata centrally.
                label: "Para o endereço do programa Token-2022, que guarda todos os metadados centralmente."  # @src=5ef9794fd537
                # | The program doesn't store per-mint metadata centrally; the metadata
                # | lives in the mint's own TLV data.
                feedback: "O programa não guarda metadados por mint centralmente; os metadados moram nos dados TLV do próprio mint."  # @src=4c9883916090
              a:
                # | To a separate Metaplex metadata PDA, for maximum wallet compatibility.
                label: "Para um PDA de metadados separado da Metaplex, para compatibilidade máxima com carteiras."  # @src=9f018c6c9c7f
                # | That's the older separate-account model, not the native pattern, and it
                # | reintroduces the spoofing surface the native design avoids.
                feedback: "Esse é o modelo mais antigo de conta separada, não o padrão nativo, e ele reintroduz a superfície de falsificação que o design nativo evita."  # @src=bf38653319cd
          q2-where-fields-live:
            # | In the Token-2022-native metadata pattern, what actually holds SPROUT's
            # | name, symbol, and uri?
            prompt: "No padrão de metadados nativo do Token-2022, o que de fato guarda o nome, o símbolo e a uri do SPROUT?"  # @src=e7e4ed387fd7
            # | The TokenMetadata TLV (spl_token_metadata_interface: update_authority, mint,
            # | name, symbol, uri, additional_metadata) lives in the mint's own TLV data.
            # | name and symbol are on-chain; the uri references off-chain JSON for the
            # | richer fields.
            explanation: "O TLV do TokenMetadata (spl_token_metadata_interface: update_authority, mint, name, symbol, uri, additional_metadata) mora nos dados TLV do próprio mint. nome e símbolo são on-chain; a uri referencia o JSON off-chain para os campos mais ricos."  # @src=cd01c4267c03
            options:                 # source order — keep it
              d:
                # | The MetadataPointer entry, which holds them inline
                label: "A entrada MetadataPointer, que guarda eles inline"  # @src=975230b8b354
                # | That entry is a fixed 64 bytes, an optional authority plus an optional
                # | address, with no room for a string. It names where the strings live; it
                # | does not hold them.
                feedback: "Aquela entrada é 64 bytes fixos, uma autoridade opcional mais um endereço opcional, sem espaço para uma string. Ela nomeia onde as strings moram; ela não guarda elas."  # @src=5974c2e53be9
              a:
                # | A Metaplex on-chain Data struct owned by the Token Metadata program.
                label: "Uma struct Data on-chain da Metaplex de propriedade do programa Token Metadata."  # @src=79170077c748
                # | That's the Metaplex model, a different program and account. Native
                # | metadata doesn't use it.
                feedback: "Esse é o modelo da Metaplex, um programa e uma conta diferentes. Metadados nativos não usam isso."  # @src=8b9916ce8ee6
              b:
                # | An off-chain JSON file that the pointer links to, with nothing stored
                # | on-chain.
                label: "Um arquivo JSON off-chain para o qual o ponteiro linka, com nada armazenado on-chain."  # @src=ce43c0411e22
                # | The uri points off-chain, but name and symbol are stored on-chain in the
                # | TLV; not everything lives in the JSON.
                feedback: "A uri aponta para off-chain, mas nome e símbolo ficam armazenados on-chain no TLV; não é tudo que mora no JSON."  # @src=e7e7de5d37d7
              e:
                # | A PDA the Token-2022 program derives from the mint address
                label: "Um PDA que o programa Token-2022 deriva do endereço do mint"  # @src=fd1ee01ab645
                # | There is no side account in the native pattern, and no derivation for a
                # | wallet to know. That two-account shape is the Metaplex model this design
                # | replaced.
                feedback: "Não existe conta paralela no padrão nativo, e nenhuma derivação para uma carteira saber. Aquele formato de duas contas é o modelo da Metaplex que este design substituiu."  # @src=f8c168079cd1
              c:
                # | A TokenMetadata TLV entry stored on the mint itself.
                label: "Uma entrada TLV TokenMetadata armazenada no próprio mint."  # @src=9691ea6f22f2
                # | name and symbol are Borsh strings inside the mint's own bytes, so a
                # | wallet renders SPROUT from one getAccountInfo and no HTTP fetch at all.
                feedback: "nome e símbolo são strings Borsh dentro dos bytes do próprio mint, então uma carteira renderiza o SPROUT a partir de um getAccountInfo e nenhum fetch HTTP."  # @src=cf5601808e58
          q3-configured-vs-active:
            # | PYUSD ships both a MetadataPointer and a TokenMetadata extension. When you
            # | read it back on-chain, what does that reinforce about 'configured' versus
            # | 'active' state?
            prompt: "O PYUSD já vem tanto com um MetadataPointer quanto com uma extensão TokenMetadata. Quando você relê isso on-chain, o que isso reforça sobre o estado 'configurado' versus 'ativo'?"  # @src=1e41c61ff5aa
            # | PYUSD's metadata extensions are configured AND in use, while other
            # | extensions it carries are configured-but-dormant. The discipline is the same
            # | one from m01: read the mint's TLV on-chain and confirm which values are
            # | actually set, rather than inferring behavior from an extension's mere
            # | presence.
            explanation: "As extensões de metadados do PYUSD estão configuradas E em uso, enquanto outras extensões que ele carrega estão configuradas-mas-dormentes. A disciplina é a mesma de m01: leia o TLV do mint on-chain e confirme quais valores estão de fato definidos, em vez de inferir comportamento da mera presença de uma extensão."  # @src=67fd0836091d
            options:                 # source order — keep it
              d:
                # | A TLV entry present in the bytes is an extension in use
                label: "Uma entrada TLV presente nos bytes é uma extensão em uso"  # @src=973801540b9c
                # | That is the module-1 trap in reverse. The same mint carries a hook slot
                # | whose programId is null, so an entry existing and an entry doing
                # | something stay two separate reads.
                feedback: "Essa é a cilada do módulo 1 ao contrário. O mesmo mint carrega um slot de hook cujo programId é nulo, então uma entrada existir e uma entrada fazer alguma coisa continuam duas leituras separadas."  # @src=62c016f8e05d
              b:
                # | Every extension PYUSD carries is dormant, its metadata included.
                label: "Toda extensão que o PYUSD carrega é dormente, os metadados dele incluídos."  # @src=7a5378ac83c9
                # | Some of PYUSD's extensions are dormant (its hook is unset, its fee is 0
                # | bps), but its metadata is live and populated; presence alone tells you
                # | nothing until you read the values.
                feedback: "Algumas das extensões do PYUSD são dormentes (o hook dele não está definido, a taxa dele é 0 bps), mas os metadados dele estão vivos e populados; presença sozinha não te diz nada até você ler os valores."  # @src=acfce11ae6ea
              c:
                # | Native metadata can only be read through a Metaplex indexer, never
                # | directly.
                label: "Metadados nativos só podem ser lidos através de um indexador da Metaplex, nunca diretamente."  # @src=9e1d4f4c28bf
                # | Native metadata is in the mint's TLV and reads directly from
                # | getAccountInfo; no Metaplex indexer required.
                feedback: "Metadados nativos estão no TLV do mint e são lidos direto do getAccountInfo; nenhum indexador da Metaplex necessário."  # @src=184429c5615a
              a:
                # | Presence can come with real, in-use values; read the mint to confirm.
                label: "Presença pode vir com valores reais, em uso; leia o mint para confirmar."  # @src=cd8149cd9cd5
                # | PYUSD is the mixed case, some entries live and some dormant on one mint,
                # | so the discipline is to read the values rather than infer behaviour from
                # | the extension list.
                feedback: "O PYUSD é o caso misto, algumas entradas vivas e algumas dormentes em um mint, então a disciplina é ler os valores em vez de inferir comportamento da lista de extensões."  # @src=743c4e4001ee
              e:
                # | A self-referential MetadataPointer is the extension's unset default
                # | value
                label: "Um MetadataPointer autorreferencial é o valor default não definido da extensão"  # @src=b93e8ec605b6
                # | Unset is an empty option, zeroed inside the 64-byte value. A pointer
                # | that names its own mint is a deliberate write, and the metadata entry
                # | beside it carries a real name and symbol.
                feedback: "Não definido é uma option vazia, zerada dentro do valor de 64 bytes. Um ponteiro que nomeia o próprio mint é uma escrita deliberada, e a entrada de metadados ao lado dele carrega um nome e um símbolo reais."  # @src=2ee30a869c56
  m03-l1-write-the-hook:
    # | Write the hook: the interface + your one Rust program
    title: "Escreva o hook: a interface + o seu único programa Rust"  # @src=683bce04c03a
    blocks:
      hook-execute-gate:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The hook has exactly one power on the transfer path: pass or fail. It cannot
          # | move funds.
          0: "O hook tem exatamente um poder no caminho da transferência: passar ou falhar. Ele não consegue mover fundos."  # @src=002bcea30d51
          # | Check the pause flag first: it is the global kill-switch and must beat the
          # | allowlist.
          1: "Cheque a flag de pause primeiro: ela é o botão de desligar global e tem que ganhar da allowlist."  # @src=0b5749ce36e3
          # | Return the amount (as i64) only when the transfer is truly allowed; otherwise
          # | a negative error code.
          2: "Devolva o amount (como i64) só quando a transferência for realmente permitida; caso contrário, um código de erro negativo."  # @src=63bb6c48bbfe
        tests:                      # keyed by test case id
          t1:
            # | Destination allowlisted and hook not paused: the transfer passes and the
            # | amount flows through.
            description: "Destino na allowlist e hook não pausado: a transferência passa e o amount segue adiante."  # @src=9c28aa3b1b37
          t2:
            # | Destination not on the treasury allowlist: the hook rejects with -1.
            description: "Destino fora da allowlist da tesouraria: o hook rejeita com -1."  # @src=719f4d0368a7
          t3:
            # | Hook paused: even an allowlisted destination is rejected with -2.
            description: "Hook pausado: mesmo um destino na allowlist é rejeitado com -2."  # @src=745450d03110
          t4:
            # | Pause takes precedence over the allowlist check.
            description: "O pause tem precedência sobre a checagem de allowlist."  # @src=2e2f9131b2af
          t5:
            # | A zero-amount allowed transfer passes through as 0.
            description: "Uma transferência permitida de amount zero passa adiante como 0."  # @src=910098b34296
      check:                      # quiz
        questions:
          q1:
            # | You seed your ExtraAccountMetaList PDA with ['extra-account-metas', mint]
            # | but compute its address against the Token-2022 program id, and now transfers
            # | fail to resolve the validation account. What is wrong?
            prompt: "Você semeia o seu PDA de ExtraAccountMetaList com ['extra-account-metas', mint] mas computa o endereço dele contra o program id do Token-2022, e agora as transferências falham em resolver a conta de validação. O que está errado?"  # @src=b23cf89ba974
            # | The ExtraAccountMetaList is owned and derived by the hook program, because
            # | it is the hook that needs to advertise which extra accounts the runtime must
            # | forward. Seeds are ['extra-account-metas', mint] but the program id is YOUR
            # | program's, resolved by get_extra_account_metas_address; deriving it against
            # | Token-2022 points at an account that will never exist.
            explanation: "O ExtraAccountMetaList pertence ao programa de hook e é derivado por ele, porque é o hook que precisa anunciar quais contas extras o runtime tem que encaminhar. Os seeds são ['extra-account-metas', mint] mas o program id é o do SEU programa, resolvido por get_extra_account_metas_address; derivar ele contra o Token-2022 aponta para uma conta que nunca vai existir."  # @src=bf1cde329ca3
            options:                 # source order — keep it
              d:
                # | The mint's TransferHook programId should name the validation PDA, not
                # | your hook program
                label: "O programId do TransferHook do mint deveria nomear o PDA de validação, não o seu programa de hook"  # @src=58cec7054bd5
                # | The slot names a program to invoke, and the runtime then resolves the
                # | list from that program's own PDA. Aim the slot at a data account and
                # | there is nothing for Token-2022 to call.
                feedback: "O slot nomeia um programa para invocar, e o runtime então resolve a lista a partir do PDA do próprio programa. Mire o slot numa conta de dados e não sobra nada para o Token-2022 chamar."  # @src=3ac00608e98f
              c:
                # | The validation PDA lives on your hook program, not Token-2022; derive it
                # | with get_extra_account_metas_address.
                label: "O PDA de validação mora no seu programa de hook, não no Token-2022; derive ele com get_extra_account_metas_address."  # @src=b9228192f1bd
                # | The manifest belongs to the program that needs the accounts, so the
                # | derivation takes your program id; pointing it at Token-2022 yields a
                # | valid address no account will ever occupy.
                feedback: "O manifesto pertence ao programa que precisa das contas, então a derivação leva o seu program id; apontar ela para o Token-2022 devolve um endereço válido que nenhuma conta vai ocupar jamais."  # @src=2264e2fb116d
              b:
                # | ExtraAccountMetaList must be seeded by the destination token account, so
                # | each recipient gets its own list.
                label: "O ExtraAccountMetaList tem que ser semeado pela conta de token de destino, para cada destinatário ganhar a lista dele."  # @src=fe70e71297d0
                # | There is exactly one validation account per mint, seeded by the mint,
                # | not per destination.
                feedback: "Existe exatamente uma conta de validação por mint, semeada pelo mint, não por destino."  # @src=bdc931c4c75f
              a:
                # | The seed literal must be 'extra_account_metas' with underscores,
                # | matching the snake_case the SPL crates use elsewhere, not hyphens.
                label: "O literal de seed tem que ser 'extra_account_metas' com underscores, batendo com o snake_case que os crates SPL usam em outros lugares, não com hífens."  # @src=95edc86f93dd
                # | The seed is the hyphenated literal 'extra-account-metas', but a spelling
                # | swap is not the bug here; the account is being derived on the wrong
                # | program.
                feedback: "O seed é o literal com hífens 'extra-account-metas', mas uma troca de grafia não é o bug aqui; a conta está sendo derivada no programa errado."  # @src=bf5a854313fa
          q2:
            # | Your hook program builds and deploys, but the runtime never reaches your
            # | Execute logic on a transfer. Which detail is most likely missing?
            prompt: "O seu programa de hook compila e faz deploy, mas o runtime nunca chega na sua lógica de Execute numa transferência. Qual detalhe é mais provável estar faltando?"  # @src=36e337ddaf4e
            # | The interface is a contract of hashed-string discriminators. Token-2022
            # | invokes your program with the discriminator for
            # | 'spl-transfer-hook-interface:execute'; if your program only recognizes a
            # | custom tag, the dispatch falls through and your logic never runs. The mint's
            # | TransferHook extension pointing at your program id is the whole
            # | registration; there is no separate global config.
            explanation: "A interface é um contrato de discriminadores de string hasheada. O Token-2022 invoca o seu programa com o discriminador de 'spl-transfer-hook-interface:execute'; se o seu programa só reconhecer uma tag customizada, o dispatch cai fora e a sua lógica nunca roda. A extensão TransferHook do mint apontando para o seu program id é o registro inteiro; não existe config global separada."  # @src=dce4410bcb28
            options:                 # source order — keep it
              a:
                # | Your program must answer to the hashed-string discriminator for
                # | 'spl-transfer-hook-interface:execute', not a custom instruction tag.
                label: "O seu programa tem que responder ao discriminador de string hasheada de 'spl-transfer-hook-interface:execute', não a uma tag de instrução customizada."  # @src=06f796aef412
                # | Dispatch falls off the end of your match when the eight bytes do not
                # | line up, and the log then shows a fallback error from a program that
                # | looks like it was never reached.
                feedback: "O dispatch cai para fora do fim do seu match quando os oito bytes não batem, e o log então mostra um erro de fallback de um programa que parece nunca ter sido alcançado."  # @src=381e6dc8a4b8
              d:
                # | Anchor's own discriminator for a method named execute is the one
                # | Token-2022 sends, so a fallback handler has to forward the call to it
                label: "O discriminador do próprio Anchor para um método chamado execute é o que o Token-2022 envia, então um handler de fallback tem que encaminhar a chamada para ele"  # @src=bfd3c90f423b
                # | Two namespaces, two hashes. Token-2022 sends sha256 of
                # | spl-transfer-hook-interface:execute, while an Anchor method named
                # | execute hashes global:execute, which is a different eight bytes.
                feedback: "Dois namespaces, dois hashes. O Token-2022 envia o sha256 de spl-transfer-hook-interface:execute, enquanto um método Anchor chamado execute hasheia global:execute, que são oito bytes diferentes."  # @src=a711b2d3c920
              b:
                # | You must register the hook program in Token-2022's global hook registry,
                # | signed by the mint authority, before the runtime will dispatch to it.
                label: "Você tem que registrar o programa de hook no registro global de hooks do Token-2022, assinado pela autoridade de mint, antes de o runtime despachar para ele."  # @src=a383e569d57f
                # | There is no global registry of any kind; the mint's own TransferHook
                # | extension names your program, and that is the only wiring.
                feedback: "Não existe registro global de nenhum tipo; a extensão TransferHook do próprio mint nomeia o seu programa, e essa é a única fiação."  # @src=ec9b28b1ce0d
              c:
                # | Execute must be marked payable so it can receive the transferred amount
                # | and pass it on to the destination.
                label: "Execute tem que ser marcado como payable para poder receber o valor transferido e repassar ele para o destino."  # @src=b9e20720e267
                # | There is no payable concept; the amount arrives as instruction data and
                # | the funds never route through the hook.
                feedback: "Não existe conceito de payable; o valor chega como dados de instrução e os fundos nunca são roteados pelo hook."  # @src=fbb3a8ceeef8
          q3:
            # | Your finished hook is great, and you want to attach it to the already-live
            # | SPROUT mint from M2 so existing holders get gated. What does the extension
            # | model force you to do?
            prompt: "O seu hook terminado está ótimo, e você quer anexar ele ao mint SPROUT já no ar do M2 para os holders existentes ficarem sob a cancela. O que o modelo de extensões te obriga a fazer?"  # @src=207d219f9973
            # | Almost every Token-2022 extension, TransferHook included, is creation-only:
            # | it must be present when the mint is initialized. An existing mint without
            # | the extension can never grow one, so gating existing SPROUT means minting a
            # | new hooked variant and migrating, which is why the course builds the hook on
            # | a fresh SPROUT variant, not the original.
            explanation: "Quase toda extensão do Token-2022, TransferHook incluída, é só de criação: ela tem que estar presente quando o mint é inicializado. Um mint existente sem a extensão nunca consegue ganhar uma, então colocar o SPROUT existente sob a cancela significa cunhar uma variante nova com hook e migrar, que é por isso que o curso constrói o hook numa variante nova do SPROUT, não na original."  # @src=2e4cd4a2a241
            options:                 # source order — keep it
              d:
                # | Use the mint's transfer-hook authority to aim its existing hook slot at
                # | your newly deployed program
                label: "Use a autoridade de transfer hook do mint para mirar o slot de hook existente dele no seu programa recém-deployado"  # @src=26422d676556
                # | Aiming the slot is real and it needs a slot. The hook authority can
                # | chamber or null a program id on a mint that carried the TransferHook
                # | entry from its first block; the live SPROUT has no such entry.
                feedback: "Mirar o slot é real e precisa de um slot. A autoridade do hook consegue colocar na câmara ou anular um program id num mint que carregou a entrada TransferHook desde o primeiro bloco dele; o SPROUT no ar não tem essa entrada."  # @src=630d68fd8821
              c:
                # | Freeze the mint, patch a new TransferHook extension into its TLV region,
                # | then thaw it and carry on.
                label: "Congele o mint, insira uma extensão TransferHook nova na região TLV dele, depois descongele ele e siga em frente."  # @src=8736a1d988a7
                # | Extension TLV data is not hand-patchable, and there is no
                # | freeze-patch-thaw flow for adding extensions.
                feedback: "Dados TLV de extensão não são editáveis na mão, e não existe fluxo congela-insere-descongela para adicionar extensões."  # @src=307e44e0f9e4
              a:
                # | Call update-extra-account-metas on the live mint, passing your hook's
                # | program id as the list authority, so transfers dispatch to it.
                label: "Chame update-extra-account-metas no mint no ar, passando o program id do seu hook como autoridade da lista, para as transferências despacharem para ele."  # @src=b7cb0d4df4fb
                # | That instruction updates the meta LIST on a mint that already has the
                # | TransferHook extension; it cannot add the extension to a mint that lacks
                # | it.
                feedback: "Essa instrução atualiza a LISTA de metas num mint que já tem a extensão TransferHook; ela não consegue adicionar a extensão a um mint que não tem."  # @src=3843ba333495
              b:
                # | Mint a new SPROUT variant with the TransferHook extension set at
                # | creation; extensions cannot be added after init.
                label: "Cunhe uma variante nova do SPROUT com a extensão TransferHook definida na criação; extensões não podem ser adicionadas depois do init."  # @src=515a1406b00f
                # | The extension set is a birth certificate, so gating today's holders
                # | means a fresh hooked variant and a migration, which is why this hook is
                # | built beside SPROUT rather than on it.
                feedback: "O conjunto de extensões é uma certidão de nascimento, então colocar os holders de hoje sob a cancela significa uma variante nova com hook e uma migração, que é por isso que este hook é construído ao lado do SPROUT em vez de em cima dele."  # @src=49d565b45ac1
  m03-l2-resolving-hooks-composability:
    # | Resolving hooks, and why they break composability
    title: "Resolvendo hooks, e por que eles quebram a composabilidade"  # @src=3e33aa263b1a
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | A user's plain Token-2022 transfer of your hooked SPROUT reverts with
            # | MissingAccount ('An account required by the instruction is missing'), yet
            # | the identical transfer works in your test harness. What is the client
            # | failing to do?
            prompt: "A transferência Token-2022 comum de um usuário do seu SPROUT com hook reverte com MissingAccount ('An account required by the instruction is missing'), mas a transferência idêntica funciona na sua bancada de teste. O que o cliente está deixando de fazer?"  # @src=e8b36138594e
            # | A hooked transfer only works if the client resolves the ExtraAccountMetaList
            # | off-chain and forwards those extra accounts on the transferring instruction.
            # | The harness did this for you; a naive wallet transfer does not, so
            # | Token-2022 never finds the validation account and the runtime cannot invoke
            # | a hook program it was never handed, so the naive case dies with
            # | MissingAccount. Keep the taxonomy straight: 'not enough account keys' is the
            # | different, partial-forwarding failure, the diagnostic trap the challenge
            # | drills. This forwarding burden is the resolution tax hooks push onto every
            # | integrator.
            explanation: "Uma transferência com hook só funciona se o cliente resolver o ExtraAccountMetaList off-chain e encaminhar essas contas extras na instrução de transferência. A bancada fazia isso por você; uma transferência ingênua de carteira não faz, então o Token-2022 nunca acha a conta de validação e o runtime não consegue invocar um programa de hook que nunca lhe foi entregue, então o caso ingênuo morre com MissingAccount. Mantenha a taxonomia em ordem: 'not enough account keys' é a falha diferente, de encaminhamento parcial, a cilada de diagnóstico que o challenge treina. Essa carga de encaminhamento é o imposto de resolução que os hooks empurram para todo integrador."  # @src=1f989c4adf8a
            options:                 # source order — keep it
              e:
                # | Nothing client-side: the harness passes because LiteSVM resolves the
                # | hook's accounts for you, so this is a cluster gap
                label: "Nada do lado do cliente: a bancada passa porque o LiteSVM resolve as contas do hook por você, então isso é uma lacuna de cluster"  # @src=f4a2f787a7be
                # | The harness is where you placed every account by hand. A wallet on any
                # | cluster builds the same four-account transfer, and it dies the same way.
                feedback: "A bancada é onde você colocou cada conta na mão. Uma carteira em qualquer cluster constrói a mesma transferência de quatro contas, e ela morre do mesmo jeito."  # @src=2e023521c1ce
              a:
                # | Raise the compute budget so the hook has enough CU to finish before the
                # | transfer gives up
                label: "Aumentar o compute budget para o hook ter CU suficiente para terminar antes de a transferência desistir"  # @src=94109033d0bc
                # | Compute budget is not the failure here; the transaction is missing
                # | accounts, not compute, and it reverts before the hook even runs out of
                # | CU.
                feedback: "O compute budget não é a falha aqui; o que falta à transação são contas, não compute, e ela reverte antes de o hook sequer ficar sem CU."  # @src=fa6ff13d5b72
              d:
                # | Append the hook program id to the transfer's accounts; the runtime
                # | resolves the rest
                label: "Acrescentar o program id do hook às contas da transferência; o runtime resolve o resto"  # @src=6d51c27bc80b
                # | Token-2022 hunts for the validation account among the accounts you sent.
                # | Missing it, resolution never starts, so there is nothing to forward to
                # | the hook program either.
                feedback: "O Token-2022 caça a conta de validação entre as contas que você mandou. Sem ela, a resolução nunca começa, então também não tem nada para encaminhar ao programa do hook."  # @src=386ab5a0680c
              c:
                # | Fetch the ExtraAccountMetaList and append the hook's resolved extra
                # | accounts to the instruction.
                label: "Buscar o ExtraAccountMetaList e acrescentar as contas extras resolvidas do hook à instrução."  # @src=faadd5157b88
                # | The manifest is the only published statement of what the hook needs, and
                # | a client that does not read it hands Token-2022 a transaction with no
                # | validation account in it.
                feedback: "O manifesto é a única declaração publicada do que o hook precisa, e um cliente que não lê ele entrega ao Token-2022 uma transação sem nenhuma conta de validação dentro."  # @src=20674d08ef63
              b:
                # | Add the hook program's authority as a second signer so it can approve
                # | the move
                label: "Adicionar a autoridade do programa do hook como um segundo signer para ela poder aprovar a movimentação"  # @src=67f38176cce5
                # | The hook has no authority over the transfer: its accounts are read-only
                # | and non-signer, so there is nothing for it to sign.
                feedback: "O hook não tem autoridade nenhuma sobre a transferência: as contas dele são somente leitura e não signatárias, então não tem nada para ele assinar."  # @src=a198e3fa1556
          q2:
            # | A teammate worries your allowlist hook could be rewritten to drain the
            # | sender's tokens mid-transfer. From what the interface guarantees, why can't
            # | any hook do that?
            prompt: "Um colega de time teme que o seu hook de allowlist possa ser reescrito para drenar os tokens do remetente no meio da transferência. Pelo que a interface garante, por que nenhum hook consegue fazer isso?"  # @src=07fbc586fd05
            # | The interface builds the transfer's accounts as
            # | AccountMeta::new_readonly(pubkey, false), read-only AND non-signer, before
            # | invoking the hook. So the hook can inspect the transfer but cannot move its
            # | funds or ride the sender's signature. (A malicious hook can still move funds
            # | ITS OWN PDAs control; the guarantee is only about the transfer's accounts.)
            # | That de-escalation, plus arbitrary CU, is the code-level root of why DEXes
            # | refuse hooks.
            explanation: "A interface constrói as contas da transferência como AccountMeta::new_readonly(pubkey, false), somente leitura E não signatárias, antes de invocar o hook. Então o hook consegue inspecionar a transferência mas não consegue mover os fundos dela nem pegar carona na assinatura do remetente. (Um hook malicioso ainda consegue mover fundos que os PDAs DELE MESMO controlam; a garantia é só sobre as contas da transferência.) Essa de-escalação, mais CU arbitrário, é a raiz no nível do código de por que DEXes recusam hooks."  # @src=e27d69d360d9
            options:                 # source order — keep it
              a:
                # | Inside Execute the transfer's accounts arrive read-only and non-signer,
                # | so the hook can neither spend them nor reuse the sender's signature.
                label: "Dentro do Execute as contas da transferência chegam somente leitura e não signatárias, então o hook não consegue nem gastar elas nem reusar a assinatura do remetente."  # @src=4e46ea1f3307
                # | AccountMeta::new_readonly(pubkey, false) is the whole guarantee, and you
                # | can read it in the interface crate's own builder: no writability to
                # | spend with, no signature to reuse.
                feedback: "AccountMeta::new_readonly(pubkey, false) é a garantia inteira, e você consegue ler ela no próprio builder do crate da interface: nenhuma gravabilidade com que gastar, nenhuma assinatura para reusar."  # @src=c944d3c674ff
              c:
                # | Hooks execute in a sandboxed VM that is handed only the amount, with no
                # | access to the transfer's accounts.
                label: "Hooks executam numa VM em sandbox que recebe só o valor, sem acesso nenhum às contas da transferência."  # @src=28481bef596a
                # | The hook does receive the accounts, since it needs them to make its
                # | decision, but they are de-escalated to read-only; there is no separate
                # | sandbox VM.
                feedback: "O hook recebe sim as contas, já que ele precisa delas para tomar a decisão dele, mas elas são de-escaladas para somente leitura; não existe VM de sandbox separada."  # @src=db6d05b63a46
              d:
                # | The hook runs in a separate transaction after the transfer settles, so
                # | the sender's signature is already spent by the time your code sees the
                # | accounts
                label: "O hook roda numa transação separada depois que a transferência liquida, então a assinatura do remetente já foi gasta quando o seu código vê as contas"  # @src=ae35af9abd43
                # | Execute is a CPI inside the same transaction, which is exactly what lets
                # | a hook veto a transfer at all. The protection is that the inherited
                # | accounts arrive stripped, not that they arrive late.
                feedback: "O Execute é uma CPI dentro da mesma transação, que é exatamente o que permite a um hook vetar uma transferência. A proteção é que as contas herdadas chegam despidas, não que elas chegam tarde."  # @src=003cde909ee6
              b:
                # | The Token-2022 program snapshots every account balance before the hook
                # | runs, then refunds any tokens the hook attempted to move once it
                # | returns.
                label: "O programa Token-2022 tira um snapshot do saldo de cada conta antes de o hook rodar, depois devolve quaisquer tokens que o hook tentou mover assim que ele retorna."  # @src=0b44e3efce99
                # | There is no snapshot-and-refund mechanism; the guarantee is structural:
                # | the hook is never given writable, signed access to the transfer's
                # | accounts in the first place.
                feedback: "Não existe mecanismo de snapshot-e-devolução; a garantia é estrutural: o hook nunca recebe acesso gravável e assinado às contas da transferência, para começo de conversa."  # @src=6d1f49183521
          q3:
            # | You want SPROUT tradeable on Raydium's CP-Swap, but it carries your
            # | TransferHook. What does Raydium's allowlist do, and why?
            prompt: "Você quer o SPROUT negociável no CP-Swap da Raydium, mas ele carrega o seu TransferHook. O que a allowlist da Raydium faz, e por quê?"  # @src=dcb532aad1ca
            # | Raydium's CP-Swap whitelists exactly five extensions (TransferFeeConfig,
            # | MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount); any
            # | other reverts pool creation. TransferHook is rejected by name because
            # | arbitrary per-transfer code with unbounded CU makes a pool un-priceable and
            # | un-safe. This is the compatibility thesis the course keeps returning to: the
            # | extensions that keep you tradeable are the passive fee, display and
            # | accounting ones, not the ones that run code or move other people's tokens
            # | (which is where the compliance-shaped powers land).
            explanation: "O CP-Swap da Raydium coloca exatamente cinco extensões na whitelist (TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount); qualquer outra reverte a criação da pool. O TransferHook é recusado pelo nome porque código arbitrário por transferência com CU ilimitado deixa uma pool impossível de precificar e insegura. Esta é a tese de compatibilidade à qual o curso não para de voltar: as extensões que te mantêm negociável são as passivas, de taxa, de exibição e de contabilidade, não as que rodam código ou movem tokens dos outros (que é onde os poderes com formato de compliance caem)."  # @src=e8f447cbf71d
            options:                 # source order — keep it
              b:
                # | It rejects pool creation; TransferHook is not among the five accepted
                # | extensions, because hooks run arbitrary code per transfer.
                label: "Ela recusa a criação da pool; o TransferHook não está entre as cinco extensões aceitas, porque hooks rodam código arbitrário por transferência."  # @src=bad339b6a53c
                # | The five it accepts are all passive, and arbitrary per-transfer code
                # | with unbounded CU makes a pool impossible to price safely, so creation
                # | reverts rather than degrading.
                feedback: "As cinco que ela aceita são todas passivas, e código arbitrário por transferência com CU ilimitado deixa uma pool impossível de precificar com segurança, então a criação reverte em vez de degradar."  # @src=7482ae648969
              c:
                # | It allows the hook only if the mint also carries a PermanentDelegate the
                # | pool can claw back with.
                label: "Ela permite o hook só se o mint também carregar um PermanentDelegate com que a pool possa reaver."  # @src=8b0c0c5c30cb
                # | PermanentDelegate is itself rejected (Raydium refuses it because a
                # | delegate holder could sweep the pool vault), and pairing two rejected
                # | extensions does not unlock the pool.
                feedback: "O PermanentDelegate é ele mesmo recusado (a Raydium recusa ele porque um holder do delegado poderia varrer o vault da pool), e parear duas extensões recusadas não desbloqueia a pool."  # @src=d13e941dfa29
              d:
                # | It rejects the pool until your hook program itself is vetted onto
                # | Raydium's list of approved hooks, after which the same mint routes
                # | normally
                label: "Ela recusa a pool até o seu próprio programa de hook ser aprovado na lista de hooks aprovados da Raydium, e depois disso o mesmo mint roteia normalmente"  # @src=ed59086b8a34
                # | The door in the pool program is a short hardcoded list of MINT addresses
                # | vetted by hand, plus classic mints and mint-association accounts. No
                # | extension and no hook program is approved as a category.
                feedback: "A porta no programa da pool é uma lista curta de endereços de MINT deixada hardcoded e checada na mão, mais mints clássicos e contas de associação de mint. Nenhuma extensão e nenhum programa de hook é aprovado como categoria."  # @src=ac69f3534e76
              a:
                # | It allows the hook but wraps it in a metered sub-invocation capped at
                # | 5,000 CU per transfer, so pool pricing stays bounded and quotes stay
                # | safe.
                label: "Ela permite o hook mas embrulha ele numa sub-invocação medida com teto de 5,000 CU por transferência, então a precificação da pool fica limitada e as cotações ficam seguras."  # @src=94981f5e3c6e
                # | There is no per-hook CU cap in the allowlist; the extension is simply
                # | not among the five it accepts, so pool creation reverts outright.
                feedback: "Não existe teto de CU por hook na allowlist; a extensão simplesmente não está entre as cinco que ela aceita, então a criação da pool reverte de cara."  # @src=65ed46a1b592
  m04-l1-confidential-model:
    # | The confidential model: encrypted balances on a public chain
    title: "O modelo confidencial: saldos encriptados numa chain pública"  # @src=a449aa80afdc
    blocks:
      check:                      # quiz
        questions:
          m04l1-q1:
            # | You send 5 SPROUT confidentially to a teammate. Which statement about that
            # | on-chain transfer is TRUE?
            prompt: "Você manda 5 SPROUT confidencialmente para um colega de time. Qual afirmação sobre essa transferência on-chain é VERDADEIRA?"  # @src=0a519d7349ac
            # | The confidential-transfer extension encrypts the transferred amount under
            # | Twisted ElGamal. It does nothing to hide who is transacting: both pubkeys
            # | and the transaction itself remain on the public ledger. Confidentiality of
            # | amounts is a different property from anonymity of participants.
            explanation: "A extensão de transferência confidencial encripta o valor transferido sob Twisted ElGamal. Ela não faz nada para esconder quem está transacionando: as duas pubkeys e a própria transação continuam no livro-razão público. Confidencialidade de valores é uma propriedade diferente de anonimato de participantes."  # @src=efe70cd630cd
            options:                 # source order — keep it
              c:
                # | The amount stays public, but both wallet identities are encrypted under
                # | the auditor's key.
                label: "O valor continua público, mas as duas identidades de carteira são encriptadas sob a chave do auditor."  # @src=787d62d657e7
                # | It's the reverse. Token-2022 confidential transfers encrypt the amount,
                # | never the identities: addresses are always visible.
                feedback: "É o contrário. As transferências confidenciais do Token-2022 encriptam o valor, nunca as identidades: os endereços estão sempre visíveis."  # @src=d8a540aed0ac
              b:
                # | Both the amount and the two wallet addresses are hidden from everyone,
                # | including validators, who see only the proofs.
                label: "Tanto o valor quanto os dois endereços de carteira ficam escondidos de todo mundo, inclusive dos validadores, que veem só as provas."  # @src=cd37e5a5cd77
                # | Confidential transfers hide the amount only. The sender and receiver
                # | pubkeys, and the fact that a transfer happened, stay fully public.
                # | Encrypted is not anonymous.
                feedback: "As transferências confidenciais escondem só o valor. As pubkeys de remetente e destinatário, e o fato de uma transferência ter acontecido, continuam totalmente públicas. Encriptado não é anônimo."  # @src=1e3063b9c1d9
              a:
                # | The amount is encrypted, but your address and the recipient's address
                # | are still public on-chain.
                label: "O valor é encriptado, mas o seu endereço e o endereço do destinatário continuam públicos on-chain."  # @src=221d98aefc04
                # | Twisted ElGamal seals the amount and nothing else, so both pubkeys and
                # | the fact of the transfer stay on the public ledger; traffic analysis
                # | still sees the edge, just not its weight.
                feedback: "O Twisted ElGamal lacra o valor e nada mais, então as duas pubkeys e o fato da transferência continuam no livro-razão público; a análise de tráfego ainda vê a aresta, só não vê o peso dela."  # @src=784dbdbf3865
              d:
                # | The amount is encrypted and no on-chain component checks it, since the
                # | proofs are verified off-chain by the wallets that hold the keys
                label: "O valor é encriptado e nenhum componente on-chain o confere, já que as provas são verificadas off-chain pelas carteiras que têm as chaves"  # @src=af514fcb1fe7
                # | A native program at ZkE1Gama1Proof11111111111111111111111111111 verifies
                # | every proof on chain, and Token-2022 confirms that verification before
                # | it touches a balance. Nothing here runs on trust.
                feedback: "Um programa nativo em ZkE1Gama1Proof11111111111111111111111111111 verifica toda prova on-chain, e o Token-2022 confirma essa verificação antes de tocar num saldo. Nada aqui roda na base da confiança."  # @src=de4ab0a2ad69
          m04l1-q2:
            # | A confidential transfer submits three zero-knowledge proofs. Which trio
            # | matches what Token-2022 actually verifies?
            prompt: "Uma transferência confidencial submete três provas de conhecimento zero. Qual trio bate com o que o Token-2022 de fato verifica?"  # @src=03804f422178
            # | The three proofs are CiphertextCommitmentEqualityProof (the debit and the
            # | new balance commit to the same value),
            # | BatchedGroupedCiphertext3HandlesValidityProof (the amount is correctly
            # | encrypted under sender, receiver, and the optional auditor), and
            # | BatchedRangeProofU128 (the amount is in range). All three are checked by the
            # | ZK ElGamal Proof Program (SIMD-0153).
            explanation: "As três provas são CiphertextCommitmentEqualityProof (o débito e o saldo novo se comprometem com o mesmo valor), BatchedGroupedCiphertext3HandlesValidityProof (o valor está corretamente encriptado sob remetente, destinatário e o auditor opcional), e BatchedRangeProofU128 (o valor está dentro do intervalo). Todas as três são conferidas pelo ZK ElGamal Proof Program (SIMD-0153)."  # @src=e00dc872c0b5
            options:                 # source order — keep it
              d:
                # | A range proof, a validity proof, and a sufficient-balance proof against
                # | the sender's ciphertext
                label: "Uma prova de intervalo, uma prova de validade, e uma prova de saldo suficiente contra o ciphertext do remetente"  # @src=0a3bacf02c64
                # | Two of the three land. The missing one is the equality proof: solvency
                # | is never proven directly, it follows from welding the sender's claimed
                # | remainder to the real post-debit ciphertext and range-proving that.
                feedback: "Duas das três aterrissam. A que falta é a prova de igualdade: a solvência nunca é provada diretamente, ela decorre de soldar o restante alegado do remetente ao ciphertext pós-débito real e provar o intervalo disso."  # @src=cfe0729c951d
              a:
                # | A signature proof, a Merkle inclusion proof against the account's state
                # | root, and a nonce-freshness proof that blocks replay.
                label: "Uma prova de assinatura, uma prova de inclusão de Merkle contra a raiz de estado da conta, e uma prova de atualidade de nonce que bloqueia replay."  # @src=b77d23566c90
                # | None of those are part of the confidential-transfer flow; that's a mix
                # | of unrelated primitives from signatures and state compression.
                feedback: "Nenhuma dessas faz parte do fluxo de transferência confidencial; isso é uma mistura de primitivas não relacionadas vindas de assinaturas e de compressão de estado."  # @src=28c78844588b
              c:
                # | A range proof, a hash-preimage proof that opens the commitment, and a
                # | stake-weight proof.
                label: "Uma prova de intervalo, uma prova de pré-imagem de hash que abre o compromisso, e uma prova de peso de stake."  # @src=b7c2aa3cd524
                # | Only the range proof belongs here; hash-preimage and stake-weight proofs
                # | are not part of the confidential-transfer proof set.
                feedback: "Só a prova de intervalo pertence aqui; provas de pré-imagem de hash e de peso de stake não fazem parte do conjunto de provas da transferência confidencial."  # @src=5d672bb1e478
              b:
                # | An equality proof, a grouped-ciphertext validity proof (including the
                # | auditor ciphertext), and a range proof.
                label: "Uma prova de igualdade, uma prova de validade de ciphertext agrupado (incluindo o ciphertext do auditor), e uma prova de intervalo."  # @src=3d4ddd073da2
                # | One proof per available lie: equality welds the claimed remainder to the
                # | chain's post-debit ciphertext, validity forces one amount under three
                # | keys, and the range proof blocks the modular underflow.
                feedback: "Uma prova por mentira disponível: a igualdade solda o restante alegado ao ciphertext pós-débito da chain, a validade força um único valor sob três chaves, e a prova de intervalo bloqueia o underflow modular."  # @src=f89de1415445
          m04l1-q3:
            # | Why does a single confidential transfer take several dependent transactions
            # | today, rather than one?
            prompt: "Por que uma única transferência confidencial leva várias transações dependentes hoje, em vez de uma?"  # @src=5f73c0568e80
            # | The proofs exceed what fits beside the transfer in a single transaction, so
            # | the flow is split across dependent transactions (create context accounts,
            # | verify proofs, apply). Transaction format v1 (SIMD-0296 / SIMD-0385) raises
            # | the envelope to 4,096 bytes and is designed to collapse this to one
            # | transaction — though it raises bytes only: 64 accounts, 64 instructions, and
            # | no lookup tables, so whether a given transfer fits is arithmetic, not a
            # | promise. Probed 2026-09-11, the enable_tx_v1 gate is active on devnet and
            # | staged on mainnet for epoch 1035, so mainnet still splits until that
            # | boundary passes. Re-probe the gate account yourself at write time, per
            # | cluster, and read the owner field: System Program means staged,
            # | Feature111... means live.
            explanation: "As provas excedem o que cabe ao lado da transferência em uma única transação, então o fluxo é dividido em transações dependentes (criar contas de contexto, verificar provas, aplicar). O formato de transação v1 (SIMD-0296 / SIMD-0385) eleva o envelope para 4,096 bytes e foi projetado para colapsar isso em uma única transação — só que ele eleva só os bytes: 64 contas, 64 instruções e nenhuma lookup table, então se uma transferência específica cabe é aritmética, não promessa. Sondado em 2026-09-11, o gate enable_tx_v1 está ativo na devnet e agendado na mainnet para a epoch 1035, então a mainnet ainda divide até essa fronteira passar. Re-sonde a conta do gate você mesmo na hora de escrever, por cluster, e leia o campo owner: System Program significa agendado, Feature111... significa ativo."  # @src=030b985ce918
            options:                 # source order — keep it
              b:
                # | Because each confidential transfer must wait a full epoch for the mint's
                # | auditor to countersign it on chain.
                label: "Porque toda transferência confidencial precisa esperar uma epoch inteira para o auditor do mint contra-assinar ela on-chain."  # @src=98fedee56fd3
                # | There is no per-transfer epoch wait and no auditor countersignature. The
                # | auditor merely receives its own encrypted copy of the amount; it does
                # | not gate the transfer.
                feedback: "Não existe espera de epoch por transferência nem contra-assinatura de auditor. O auditor apenas recebe a própria cópia encriptada do valor; ele não condiciona a transferência."  # @src=40228e80e8d0
              c:
                # | Because the zero-knowledge proofs are too large to fit alongside the
                # | transfer in one transaction; transaction format v1 is meant to relax
                # | this but is not yet active on mainnet.
                label: "Porque as provas de conhecimento zero são grandes demais para caber ao lado da transferência em uma transação; o formato de transação v1 deve afrouxar isso mas ainda não está ativo na mainnet."  # @src=9ffaed12ffac
                # | The proofs ride in context accounts precisely because they do not fit
                # | beside the instruction, and whether v1 has collapsed the dance is a
                # | per-cluster question you re-probe rather than assume.
                feedback: "As provas viajam em contas de contexto precisamente porque não cabem ao lado da instrução, e se o v1 já colapsou a dança é uma pergunta por cluster que você re-sonda em vez de assumir."  # @src=9981ebc32adc
              a:
                # | Because the ZK ElGamal Proof Program is deployed only on devnet, so
                # | mainnet has to route through extra hops.
                label: "Porque o ZK ElGamal Proof Program está implantado só na devnet, então a mainnet tem que rotear por hops extras."  # @src=89a862f9642f
                # | The proof program is a real on-chain component, not a devnet-only stub.
                # | The multi-transaction reality is about proof SIZE, not deployment
                # | location.
                feedback: "O programa de provas é um componente on-chain de verdade, não um stub só de devnet. A realidade de múltiplas transações é sobre o TAMANHO da prova, não sobre o local de deployment."  # @src=66ec20cf8ae6
              d:
                # | Because verifying three proofs exceeds one transaction's compute budget,
                # | so each proof typically needs a transaction of its own
                label: "Porque verificar três provas excede o orçamento de compute de uma transação, então cada prova normalmente precisa de uma transação só para ela"  # @src=5ae65e82a816
                # | The binding limit the source names is bytes: 1,232 per v0 transaction,
                # | which the trio blows past on size alone. That is also why a bigger
                # | transaction envelope is the fix rather than a bigger compute cap.
                feedback: "O limite vinculante que a fonte nomeia é bytes: 1,232 por transação v0, que o trio estoura só no tamanho. É também por isso que um envelope de transação maior é o conserto, em vez de um teto de compute maior."  # @src=47700fec7232
  m04-l2-issuer-ops:
    # | Issuer ops: auditor, registry, and confidential supply
    title: "Ops do emissor: auditor, registro e supply confidencial"  # @src=d60c2acb80e6
    blocks:
      configure-confidential-mint:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the named authority first: an empty string is 'missing-authority'.
          0: "Confira primeiro a autoridade nomeada: uma string vazia é 'missing-authority'."  # @src=2ee1bca04fa1
          # | The auditor pubkey is optional: null must still return ok:true.
          1: "A pubkey do auditor é opcional: null ainda tem que retornar ok:true."  # @src=91aa9cd8668f
          # | Combo rule 5 only bites when NonTransferable and ConfidentialTransferMint are
          # | both present without ConfidentialMintBurn.
          2: "A regra 5 de combo só morde quando NonTransferable e ConfidentialTransferMint estão ambos presentes sem ConfidentialMintBurn."  # @src=84dd6a64367f
        tests:                      # keyed by test case id
          t1:
            # | valid setup with an auditor key and auto-approve off
            description: "configuração válida com uma auditor key e auto-approve desligado"  # @src=52c7fbdb5eda
          t2:
            # | auditor is optional, a null auditor with auto-approve on is still valid
            description: "auditor é opcional, um auditor nulo com auto-approve ligado ainda é válido"  # @src=0f50a44f6679
          t3:
            # | no ConfidentialTransferMint extension, nothing to configure
            description: "sem extensão ConfidentialTransferMint, nada para configurar"  # @src=172334dc99c8
          t4:
            # | combo rule 5: NonTransferable + confidential without ConfidentialMintBurn is
            # | invalid
            description: "regra 5 de combo: NonTransferable + confidencial sem ConfidentialMintBurn é inválido"  # @src=a0dffb5b0e96
          t5:
            # | adding ConfidentialMintBurn makes the NonTransferable + confidential set
            # | legal
            description: "acrescentar ConfidentialMintBurn torna o conjunto NonTransferable + confidencial legal"  # @src=6f28ae7f27be
          t6:
            # | an unset authority is rejected before anything else
            description: "uma autoridade não definida é rejeitada antes de qualquer outra coisa"  # @src=1b4c2a17d1a5
      check:                      # quiz
        questions:
          m04l2-q1:
            # | You configured a confidential SPROUT mint with an auditor ElGamal pubkey.
            # | What does setting that auditor key actually change about every subsequent
            # | confidential transfer?
            prompt: "Você configurou um mint confidencial do SPROUT com uma pubkey ElGamal de auditor. O que definir essa auditor key de fato muda em toda transferência confidencial subsequente?"  # @src=0cc40447b393
            # | The auditor is a single optional global ElGamal pubkey on the
            # | ConfidentialTransferMint. When set, the grouped-ciphertext validity proof
            # | forces each transfer to encrypt its amount under sender, receiver, AND
            # | auditor keys, so the auditor (and only the auditor) can reconcile amounts,
            # | while the public still sees ciphertext.
            explanation: "O auditor é uma única pubkey ElGamal global e opcional no ConfidentialTransferMint. Quando definida, a prova de validade de ciphertext agrupado força cada transferência a encriptar o valor dela sob as chaves de remetente, destinatário E auditor, então o auditor (e só o auditor) consegue reconciliar valores, enquanto o público continua vendo ciphertext."  # @src=ee79b2e071ba
            options:                 # source order — keep it
              d:
                # | Each transfer gains an optional auditor ciphertext, which the sender can
                # | omit whenever an amount is too sensitive to disclose to the mint's
                # | auditor
                label: "Cada transferência ganha um ciphertext de auditor opcional, que o remetente pode omitir sempre que um valor for sensível demais para divulgar ao auditor do mint"  # @src=c3d6965e3449
                # | There is no per-transfer opt-out. While an auditor is configured the
                # | program rejects any transfer whose auditor ciphertext is missing or
                # | malformed, because coverage that a sender can decline is not coverage.
                feedback: "Não existe opt-out por transferência. Enquanto um auditor está configurado, o programa rejeita qualquer transferência cujo ciphertext de auditor esteja faltando ou mal formado, porque cobertura que um remetente pode recusar não é cobertura."  # @src=fc5302aaa81c
              b:
                # | Only the mint authority can now approve new confidential accounts before
                # | those accounts may receive funds.
                label: "Agora só a autoridade de mint pode aprovar novas contas confidenciais antes que essas contas possam receber fundos."  # @src=2b7640d56d2e
                # | That behavior is the separate auto_approve_new_accounts flag, not the
                # | auditor key. The auditor key governs who can DECRYPT transfer amounts,
                # | not who can open accounts.
                feedback: "Esse comportamento é a flag auto_approve_new_accounts, separada, não a auditor key. A auditor key governa quem pode DECRIPTAR valores de transferência, não quem pode abrir contas."  # @src=543555abda75
              a:
                # | Every confidential transfer must additionally encrypt its amount under
                # | the auditor's key, which only the auditor can decrypt.
                label: "Toda transferência confidencial tem que encriptar o valor dela também sob a chave do auditor, que só o auditor consegue decriptar."  # @src=7ae25befe9b9
                # | The grouped-ciphertext validity proof carries three handles, so one
                # | amount is sealed for sender, receiver and auditor at once while the
                # | public still reads ciphertext.
                feedback: "A prova de validade de ciphertext agrupado carrega três handles, então um valor é selado para remetente, destinatário e auditor de uma vez enquanto o público continua lendo ciphertext."  # @src=a1d339d4c9a6
              c:
                # | Transfers become fully public the moment an auditor is set, because the
                # | program stops encrypting amounts once a designated third party can read
                # | them.
                label: "As transferências ficam totalmente públicas no momento em que um auditor é definido, porque o programa para de encriptar valores quando um terceiro designado pode ler eles."  # @src=bee0a91ae6ac
                # | Amounts stay encrypted to the public. The auditor receives its OWN
                # | decryptable ciphertext via the grouped-ciphertext validity proof; that
                # | is targeted visibility, not a public disclosure.
                feedback: "Os valores continuam encriptados para o público. O auditor recebe o PRÓPRIO ciphertext decriptável dele via a prova de validade de ciphertext agrupado; isso é visibilidade direcionada, não uma divulgação pública."  # @src=124e40b075c3
          m04l2-q2:
            # | Your lab targets a cluster where the zk-ElGamal proof gate is off, so
            # | anything that needs it will fail. What's the designed move?
            prompt: "O seu lab tem como alvo um cluster onde o gate de provas do zk-ElGamal está desligado, então qualquer coisa que precise dele vai falhar. Qual é a jogada projetada?"  # @src=f8db37b888cc
            # | The cluster plan is devnet-first (gates active per docs), surfpool
            # | secondary. If the zk-ElGamal gate is off, the transfer proofs will not
            # | verify, so the lab degrades to configuring ConfidentialTransferMint plus the
            # | auditor and proving that extension state on-chain: the same skill, minus the
            # | unavailable verification, stated openly.
            explanation: "O plano de cluster é devnet primeiro (gates ativos conforme a documentação), surfpool secundário. Se o gate do zk-ElGamal estiver desligado, as provas de transferência não vão verificar, então o lab degrada para configurar ConfidentialTransferMint mais o auditor e provar esse estado de extensão on-chain: a mesma habilidade, menos a verificação indisponível, declarado abertamente."  # @src=88f8add0173b
            options:                 # source order — keep it
              d:
                # | Run the transfer flow anyway, and note in the write-up that the proof
                # | step may not verify on this cluster
                label: "Rodar o fluxo de transferência de qualquer jeito, e anotar no write-up que o passo de prova pode não verificar neste cluster"  # @src=1e4d488c4283
                # | Caveating a step that cannot succeed is not the designed fallback. That
                # | path keeps the same mint, the same auditor and the same verify script,
                # | and drops only the live transfer.
                feedback: "Ressalvar um passo que não pode dar certo não é o fallback projetado. Aquele caminho mantém o mesmo mint, o mesmo auditor e o mesmo script de verificação, e descarta só a transferência ao vivo."  # @src=573634f68cce
              b:
                # | Degrade to configuring the extension and proving its state on-chain, and
                # | say so; the proofs cannot verify without the gate.
                label: "Degradar para configurar a extensão e provar o estado dela on-chain, e dizer isso; as provas não podem verificar sem o gate."  # @src=c9958208c025
                # | The issuer skill this lesson grades is the configuration, so the
                # | fallback proves the extension and the auditor on-chain and names what it
                # | could not run, which is what the lab's own script does.
                feedback: "A habilidade de emissor que esta lição avalia é a configuração, então o fallback prova a extensão e o auditor on-chain e nomeia o que não conseguiu rodar, que é o que o próprio script do lab faz."  # @src=d4d810ea1e1b
              c:
                # | Force the gate on with a surfpool override and present the fabricated
                # | activation as a live mainnet transfer.
                label: "Forçar o gate a ficar ligado com um override de surfpool e apresentar a ativação fabricada como uma transferência ao vivo na mainnet."  # @src=e9f283fa70a6
                # | Running on devnet or surfpool is fine, but the honest, designed fallback
                # | is configure-plus-prove-state, not presenting a locally forced gate as
                # | real activation.
                feedback: "Rodar na devnet ou no surfpool é ok, mas o fallback honesto e projetado é configurar-mais-provar-o-estado, não apresentar um gate forçado localmente como ativação real."  # @src=4715bcaa292c
              a:
                # | Abandon confidential transfers for this token and mint a plain SPROUT
                # | instead, since the extension cannot be demonstrated without the gate.
                label: "Abandonar transferências confidenciais para este token e cunhar um SPROUT comum em vez disso, já que a extensão não pode ser demonstrada sem o gate."  # @src=9fdfd1c006a7
                # | The lesson has a designed degrade path precisely so an off gate breaks
                # | nothing. You don't drop the build.
                feedback: "A lição tem um caminho de degradação projetado precisamente para que um gate desligado não quebre nada. Você não abandona o build."  # @src=4a2084a17496
          m04l2-q3:
            # | You want confidential SUPPLY for SPROUT: mint and burn amounts hidden, not
            # | just transfers. Which extension and rule apply?
            prompt: "Você quer SUPPLY confidencial para o SPROUT: valores de cunhagem e de queima escondidos, não só transferências. Qual extensão e qual regra se aplicam?"  # @src=b9a54f1f9e39
            # | ConfidentialMintBurn adds confidential supply (confidential burn,
            # | apply_pending_burn, and rotate_supply_elgamal_pubkey), and combo rule 3
            # | requires ConfidentialTransferMint to be present on the same mint. That's the
            # | issuer branch you enable on a second SPROUT variant.
            explanation: "O ConfidentialMintBurn acrescenta supply confidencial (queima confidencial, apply_pending_burn e rotate_supply_elgamal_pubkey), e a regra 3 de combo exige que ConfidentialTransferMint esteja presente no mesmo mint. Essa é a ramificação de emissor que você habilita em uma segunda variante do SPROUT."  # @src=8f9122676771
            options:                 # source order — keep it
              b:
                # | ConfidentialTransferFeeConfig on its own, since hiding the fee flow is
                # | what makes mint and burn amounts confidential too.
                label: "ConfidentialTransferFeeConfig sozinho, já que esconder o fluxo de taxa é o que torna os valores de cunhagem e de queima confidenciais também."  # @src=42ee88f8ff56
                # | That extension governs withheld fees on confidential transfers, not
                # | confidential mint/burn of supply.
                feedback: "Essa extensão governa taxas retidas em transferências confidenciais, não cunhagem/queima confidencial de supply."  # @src=01430afc619e
              d:
                # | ConfidentialMintBurn on its own; it brings its own supply key and needs
                # | no other extension
                label: "ConfidentialMintBurn sozinho; ele traz a própria chave de supply dele e não precisa de outra extensão"  # @src=c96ece4c99e4
                # | The extension is right and the rule is missing. Combo rule 3 refuses
                # | ConfidentialMintBurn unless ConfidentialTransferMint sits on the same
                # | mint, and your validator has rejected that set since m01-l4.
                feedback: "A extensão está certa e a regra está faltando. A regra 3 de combo recusa ConfidentialMintBurn a não ser que ConfidentialTransferMint esteja no mesmo mint, e o seu validador rejeita esse conjunto desde o m01-l4."  # @src=63e2e93116e1
              c:
                # | ConfidentialMintBurn, which requires ConfidentialTransferMint on the
                # | mint too.
                label: "ConfidentialMintBurn, que exige ConfidentialTransferMint no mint também."  # @src=09aebe1ea26b
                # | Confidential supply on a mint whose transfers are public would protect
                # | nothing, so the dependency runs one way: confidential transfers without
                # | confidential supply is a product, the reverse is not.
                feedback: "Supply confidencial em um mint cujas transferências são públicas não protegeria nada, então a dependência corre em um sentido só: transferências confidenciais sem supply confidencial é um produto, o contrário não é."  # @src=f26c0ddbb5c3
              a:
                # | PermanentDelegate, which can reach into confidential balances to adjust
                # | supply.
                label: "PermanentDelegate, que consegue alcançar saldos confidenciais para ajustar supply."  # @src=09bef1e20d7f
                # | PermanentDelegate explicitly does NOT work on confidential balances, and
                # | it isn't a supply-confidentiality feature in the first place.
                feedback: "O PermanentDelegate explicitamente NÃO funciona em saldos confidenciais, e não é uma feature de confidencialidade de supply para começo de conversa."  # @src=ff780c42afcd
  m05-l1-dex-allowlist-artifact:
    # | The DEX allowlist as a teaching artifact
    title: "A allowlist da DEX como artefato de ensino"  # @src=0943bc5ad976
    blocks:
      routability-predictor:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The allowlist is exactly five extensions: TransferFeeConfig, MetadataPointer,
          # | TokenMetadata, InterestBearingConfig, ScaledUiAmount.
          0: "A allowlist é exatamente cinco extensões: TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount."  # @src=451dddbc271f
          # | Classic SPL and whitelisted mints short-circuit to routable before the
          # | extension check.
          1: "SPL clássico e mints na whitelist fazem curto-circuito para roteável antes da checagem de extensões."  # @src=3e0dc68b4803
          # | One off-list extension taints the whole mint: think 'every', not 'some'.
          2: "Uma extensão fora da lista contamina o mint inteiro: pense 'every', não 'some'."  # @src=5591fe2191a7
        tests:                      # keyed by test case id
          t1-classic-spl:
            # | A classic SPL mint always routes, the check is bypassed for it.
            description: "Um mint SPL clássico sempre roteia, a checagem tem bypass para ele."  # @src=a2d8ac9390ab
          t2-allowlisted-set:
            # | All three extensions are on the allowlist, so the pool is created.
            description: "Todas as três extensões estão na allowlist, então a pool é criada."  # @src=c3fc58846e45
          t3-transfer-hook:
            # | TransferHook is off-list, arbitrary CU per transfer: so it reverts.
            description: "TransferHook está fora da lista, CU arbitrário por transferência: então reverte."  # @src=9030faeef000
          t4-permanent-delegate:
            # | PermanentDelegate can sweep the pool vault: rejected unless whitelisted.
            description: "PermanentDelegate consegue varrer o vault da pool: rejeitado a não ser que esteja na whitelist."  # @src=c8fc77f05194
          t5-whitelisted-permanent-delegate:
            # | A MINT_WHITELIST / mint-association bypass lets a regulated
            # | PermanentDelegate stablecoin route.
            description: "Um bypass de MINT_WHITELIST / associação de mint deixa uma stablecoin PermanentDelegate regulada rotear."  # @src=254efeb1477b
          t6-scaled-ui-amount:
            # | ScaledUiAmount is a display extension on the allowlist: it routes.
            description: "ScaledUiAmount é uma extensão de exibição na allowlist: ela roteia."  # @src=2475d42ea6af
          t7-mixed-taint:
            # | One off-list extension taints the whole mint even when another is
            # | allowlisted.
            description: "Uma extensão fora da lista contamina o mint inteiro mesmo quando outra está na allowlist."  # @src=49ae2793e66f
      check:                      # quiz
        questions:
          m05l1-q1-allowlist-hit:
            # | You try to seed a Raydium CP-Swap pool for a Token-2022 SPROUT carrying
            # | TransferFeeConfig + MetadataPointer + TokenMetadata. What happens, and why?
            prompt: "Você tenta semear uma pool do CP-Swap da Raydium para um SPROUT Token-2022 levando TransferFeeConfig + MetadataPointer + TokenMetadata. O que acontece, e por quê?"  # @src=4286785d8f90
            # | Raydium CP-Swap/CLMM allowlists exactly five extensions: TransferFeeConfig,
            # | MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount. A
            # | mint whose entire extension set falls inside that list creates a pool; the
            # | reject path fires only when an off-list extension is present.
            explanation: "O CP-Swap/CLMM da Raydium coloca na allowlist exatamente cinco extensões: TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount. Um mint cujo conjunto inteiro de extensões cai dentro dessa lista cria uma pool; o caminho de rejeição dispara só quando uma extensão fora da lista está presente."  # @src=08fb0bb2be4f
            options:                 # source order — keep it
              a:
                # | Rejected: CP-Swap refuses every Token-2022 mint at pool creation; only
                # | classic SPL and the four MINT_WHITELIST entries can seed a pool.
                label: "Rejeitado: o CP-Swap recusa todo mint Token-2022 na criação de pool; só SPL clássico e as quatro entradas da MINT_WHITELIST conseguem semear uma pool."  # @src=61e674de008e
                # | CP-Swap does support Token-2022; it allowlists five specific extensions
                # | rather than refusing the program wholesale.
                feedback: "O CP-Swap suporta Token-2022, sim; ele coloca na allowlist cinco extensões específicas em vez de recusar o programa por inteiro."  # @src=34f2100a3e5a
              d:
                # | Created, though a nonzero fee rate would fail this walk; the check reads
                # | the fee's value
                label: "Criada, embora uma alíquota de taxa diferente de zero falharia nesta caminhada; a checagem lê o valor da taxa"  # @src=7dfe9acd3f35
                # | The walk matches extension variants, not their settings. It asks whether
                # | a TransferFeeConfig entry exists, never whether the rate is zero or five
                # | percent.
                feedback: "A caminhada casa variantes de extensão, não as configurações delas. Ela pergunta se uma entrada TransferFeeConfig existe, nunca se a alíquota é zero ou cinco por cento."  # @src=12fc0c776b18
              b:
                # | Created: all three extensions are on the five-extension allowlist, so
                # | the mint passes.
                label: "Criada: todas as três extensões estão na allowlist de cinco extensões, então o mint passa."  # @src=c2400be493ca
                # | The reject path fires when an off-list entry is present, and this set is
                # | three of the five, so the walk finishes and the pool is created.
                feedback: "O caminho de rejeição dispara quando uma entrada fora da lista está presente, e este conjunto é três das cinco, então a caminhada termina e a pool é criada."  # @src=c1027e26ffe7
              c:
                # | Created: Raydium runs the mint's transfer hook to price the fee, so any
                # | fee-bearing mint works.
                label: "Criada: a Raydium roda o transfer hook do mint para precificar a taxa, então qualquer mint que leve taxa funciona."  # @src=6a2cb07255ed
                # | There is no hook on this mint; TransferFeeConfig is allowlisted
                # | outright, and a hook would be the refused extension, not the enabling
                # | one.
                feedback: "Não existe hook neste mint; TransferFeeConfig está na allowlist de saída, e um hook seria a extensão recusada, não a que habilita."  # @src=8a5653d34a17
          m05l1-q2-hook-rationale:
            # | Your SPROUT variant wears the transfer hook you wrote in M3, and the
            # | pool-create reverts. Which of Raydium's own quoted rationales explains the
            # | rejection?
            prompt: "A sua variante do SPROUT veste o transfer hook que você escreveu no M3, e a criação de pool reverte. Qual das justificativas citadas da própria Raydium explica a rejeição?"  # @src=8cdf9650eb07
            # | Each refused extension has its own distinct rationale in Raydium's docs. For
            # | TransferHook it is exactly that it 'invokes a custom program on every
            # | transfer, with arbitrary CU consumption', plus the extra-account forwarding
            # | burden a pool would have to carry on every swap.
            explanation: "Cada extensão recusada tem a própria justificativa distinta nos docs da Raydium. Para TransferHook é exatamente que ele 'invoca um programa customizado em toda transferência, com consumo arbitrário de CU', mais o fardo de encaminhamento de contas extras que uma pool teria que carregar em todo swap."  # @src=5c8df195a08c
            options:                 # source order — keep it
              d:
                # | The hook program is unreviewed, and the venue refuses code it has not
                # | audited
                label: "O programa de hook não é revisado, e o venue recusa código que ele não auditou"  # @src=4a724ac99bd2
                # | Unreviewed is the published rationale for the group and member pointers,
                # | and it would not survive a hook that had been audited. The quoted reason
                # | for hooks is arbitrary per-transfer compute.
                feedback: "Não revisado é a justificativa publicada para os ponteiros de group e de member, e ela não sobreviveria a um hook que tivesse sido auditado. A razão citada para hooks é compute arbitrário por transferência."  # @src=bc1320eae72d
              b:
                # | The hook grants a permanent delegate that can sweep the pool vault.
                label: "O hook concede um delegado permanente que consegue varrer o vault da pool."  # @src=70fe41236049
                # | That is the PermanentDelegate rationale; a hook confers no delegate
                # | authority over the vault.
                feedback: "Essa é a justificativa do PermanentDelegate; um hook não confere nenhuma autoridade de delegado sobre o vault."  # @src=ce3397a87519
              a:
                # | The hook encrypts transfer amounts, so the AMM cannot compute a price.
                label: "O hook encripta os valores de transferência, então a AMM não consegue computar um preço."  # @src=b190cffec420
                # | That is the ConfidentialTransfer rationale; a transfer hook does not
                # | encrypt amounts.
                feedback: "Essa é a justificativa do ConfidentialTransfer; um transfer hook não encripta valores."  # @src=033cbad16c55
              c:
                # | The hook invokes a custom program on every transfer, with arbitrary CU
                # | consumption.
                label: "O hook invoca um programa customizado em toda transferência, com consumo arbitrário de CU."  # @src=b453b3f4a838
                # | Raydium's own words, and the reason is cost rather than theft: module 3
                # | proved a hook cannot move the pool's funds, but it can spend the swap's
                # | compute budget with no ceiling.
                feedback: "As palavras da própria Raydium, e a razão é custo em vez de roubo: o módulo 3 provou que um hook não consegue mover os fundos da pool, mas ele consegue gastar o orçamento de compute do swap sem teto."  # @src=564120275189
          m05l1-q3-whitelist-bypass:
            # | A regulated stablecoin ships a PermanentDelegate extension (for compliance
            # | freeze/clawback) yet trades fine on Raydium CP-Swap. How, if
            # | PermanentDelegate is a refused extension?
            prompt: "Uma stablecoin regulada já vem com uma extensão PermanentDelegate (para congelamento/confisco de compliance) e ainda assim é negociada tranquilo no CP-Swap da Raydium. Como, se PermanentDelegate é uma extensão recusada?"  # @src=3d3cb3622189
            # | The check is skipped for classic SPL, for the hardcoded MINT_WHITELIST, and
            # | for mints with an initialized mint-association account. That bypass, not an
            # | allowlist entry, is how a whitelisted PermanentDelegate stablecoin routes
            # | despite the extension being otherwise refused.
            explanation: "A checagem é pulada para SPL clássico, para a MINT_WHITELIST hardcoded, e para mints com uma conta de associação de mint inicializada. Esse bypass, não uma entrada de allowlist, é como uma stablecoin PermanentDelegate na whitelist roteia apesar de a extensão ser recusada em todo o resto."  # @src=77349115e563
            options:                 # source order — keep it
              d:
                # | An Orca-style Token Badge review approved the mint, and CP-Swap honours
                # | badges issued by other venues
                label: "Uma revisão de Token Badge no estilo da Orca aprovou o mint, e o CP-Swap honra badges emitidos por outros venues"  # @src=c3900f06653f
                # | A Token Badge is Orca's mechanism and it stops at Orca. CP-Swap's own
                # | doors are a hardcoded array of mint addresses and a mint-association
                # | account created through Raydium's admin path.
                feedback: "Um Token Badge é o mecanismo da Orca e ele para na Orca. As portas próprias do CP-Swap são um array hardcoded de endereços de mint e uma conta de associação de mint criada pelo caminho de admin da Raydium."  # @src=cdadfd11209d
              c:
                # | Raydium strips the PermanentDelegate entry from the mint's TLV during
                # | pool creation, neutering the delegate before the pool accepts any
                # | deposits.
                label: "A Raydium remove a entrada PermanentDelegate do TLV do mint durante a criação da pool, neutralizando o delegado antes de a pool aceitar qualquer depósito."  # @src=9486235ceea1
                # | Raydium cannot strip a mint's extension; it bypasses the check for
                # | whitelisted mints and never modifies the mint.
                feedback: "A Raydium não consegue remover a extensão de um mint; ela faz bypass da checagem para mints na whitelist e nunca modifica o mint."  # @src=a91a15aeffad
              a:
                # | It sits in Raydium's static 4-entry MINT_WHITELIST (or carries a
                # | mint-association account), which bypasses the extension check entirely.
                label: "Ela está na MINT_WHITELIST estática de 4 entradas da Raydium (ou leva uma conta de associação de mint), o que faz bypass da checagem de extensões inteira."  # @src=03b825c65533
                # | The doors are per-mint: an address in the source array, or an
                # | association account an admin transaction creates. The extension stays
                # | refused; the token was approved by name.
                feedback: "As portas são por mint: um endereço no array do fonte, ou uma conta de associação que uma transação de admin cria. A extensão continua recusada; o token foi aprovado pelo nome."  # @src=83286fb1cde1
              b:
                # | PermanentDelegate is actually on the five-extension allowlist, right
                # | alongside TransferFeeConfig and metadata.
                label: "PermanentDelegate está na allowlist de cinco extensões, na verdade, logo ao lado de TransferFeeConfig e dos metadados."  # @src=91c46b51047d
                # | It is not; the allowlist is fee, metadata, interest, and scaled-UI only,
                # | and PermanentDelegate never appears on it.
                feedback: "Não está; a allowlist é só taxa, metadados, juros e scaled-UI, e PermanentDelegate nunca aparece nela."  # @src=29ec0ccd78ec
          m05l1-q4-per-venue:
            # | Your Token-2022 SPROUT (fee + metadata) routed on CP-Swap. You want the same
            # | pool on Raydium's older AMM v4 as a fallback. What happens there?
            prompt: "O seu SPROUT Token-2022 (taxa + metadados) roteou no CP-Swap. Você quer a mesma pool na AMM v4 mais antiga da Raydium como fallback. O que acontece lá?"  # @src=b525d744642b
            # | Routability is per-venue, not per-DEX. Raydium's AMM v4 and Stable AMM
            # | predate Token-2022 and accept classic SPL only; Token-2022 support lives in
            # | CP-Swap/CLMM (and Farm v6 reward mints). The same brand runs venues with
            # | different rules.
            explanation: "A roteabilidade é por venue, não por DEX. A AMM v4 e a Stable AMM da Raydium são anteriores ao Token-2022 e aceitam só SPL clássico; o suporte a Token-2022 mora no CP-Swap/CLMM (e nos mints de recompensa do Farm v6). A mesma marca roda venues com regras diferentes."  # @src=78b2470d0da5
            options:                 # source order — keep it
              d:
                # | It routes: AMM v4 predates the Token-2022 allowlist, so it runs no
                # | extension check on any mint
                label: "Roteia: a AMM v4 é anterior à allowlist do Token-2022, então ela não roda nenhuma checagem de extensões em nenhum mint"  # @src=ebf5a783df26
                # | Predating Token-2022 is why it refuses, not why it waves you through.
                # | The program has no branch for a mint owned by a token program it was
                # | never taught about.
                feedback: "Ser anterior ao Token-2022 é por que ela recusa, não por que ela te deixa passar. O programa não tem branch para um mint cujo dono é um programa de token sobre o qual ele nunca foi ensinado."  # @src=7ef298155d18
              a:
                # | It routes: if CP-Swap's allowlist accepts it, AMM v4 inherits the same
                # | allowlist.
                label: "Roteia: se a allowlist do CP-Swap o aceita, a AMM v4 herda a mesma allowlist."  # @src=962d7a8b0f39
                # | AMM v4 does not share CP-Swap's Token-2022 support; the allowlist is a
                # | CP-Swap/CLMM rule.
                feedback: "A AMM v4 não compartilha o suporte a Token-2022 do CP-Swap; a allowlist é uma regra do CP-Swap/CLMM."  # @src=25769737129b
              b:
                # | Rejected: AMM v4 and Stable AMM take classic SPL only; they predate
                # | Token-2022.
                label: "Rejeitado: a AMM v4 e a Stable AMM aceitam só SPL clássico; elas são anteriores ao Token-2022."  # @src=f17f8f362223
                # | One brand, several venues, several rules. Those two programs know only
                # | the classic token program, so no extension set makes a Token-2022 mint
                # | eligible there.
                feedback: "Uma marca, vários venues, várias regras. Esses dois programas conhecem só o programa de token clássico, então nenhum conjunto de extensões torna um mint Token-2022 elegível lá."  # @src=17bd17e7e6f8
              c:
                # | It routes after you remove MetadataPointer: AMM v4's stricter check
                # | treats it as a power extension, the way CP-Swap treats hooks.
                label: "Roteia depois de você remover MetadataPointer: a checagem mais rígida da AMM v4 a trata como uma extensão de poder, do jeito que o CP-Swap trata hooks."  # @src=790a29c4b984
                # | AMM v4 accepts no Token-2022 mint at all, allowlisted or not; dropping
                # | an extension will not help.
                feedback: "A AMM v4 não aceita nenhum mint Token-2022 de jeito nenhum, na allowlist ou não; tirar uma extensão não vai ajudar."  # @src=b9edb8d6014c
  m05-l2-designing-routable-token:
    # | Designing a routable, compliant token
    title: "Projetando um token roteável e em conformidade"  # @src=049d24a8852a
    blocks:
      check:                      # quiz
        questions:
          m05l2-q1-power-extension-cost:
            # | You are finalizing SPROUT's launch-venue extension set and reach for
            # | DefaultAccountState(Frozen) 'for safety.' What does the compatibility thesis
            # | predict?
            prompt: "Você está finalizando o conjunto de extensões de launch-venue do SPROUT e recorre ao DefaultAccountState(Frozen) 'por segurança'. O que a tese de compatibilidade prevê?"  # @src=333e05388f14
            # | The thesis in one line, and note the word it must never contain: fee,
            # | display and accounting extensions (TransferFeeConfig, MetadataPointer,
            # | TokenMetadata, InterestBearingConfig, ScaledUiAmount) get whitelisted;
            # | power/control extensions (hook, permanent delegate, default-frozen,
            # | confidential) get refused. Do NOT say 'compliance gets whitelisted':
            # | DefaultAccountState(Frozen) is the compliance team's favourite primitive and
            # | this question is grading its refusal. Adding a control extension 'just in
            # | case' costs you the venue.
            explanation: "A tese em uma linha, e note a palavra que ela nunca deve conter: extensões de taxa, exibição e contabilidade (TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount) ficam whitelisted; extensões de poder/controle (hook, permanent delegate, default-frozen, confidencial) ficam refused. NÃO diga 'compliance fica whitelisted': o DefaultAccountState(Frozen) é a primitiva favorita do time de compliance e esta questão está avaliando a recusa dele. Adicionar uma extensão de controle 'só por precaução' te custa o venue."  # @src=5e15115c96cf
            options:                 # source order — keep it
              d:
                # | Nothing breaks: the pool's vault is thawed at creation, so the frozen
                # | default never touches it
                label: "Nada quebra: o vault da pool é descongelado na criação, então o default congelado nunca o toca"  # @src=20bc0720b6ca
                # | The walk matches extension variants, so thawing every account in
                # | existence would not help. The DefaultAccountState entry itself is what
                # | pool creation refuses.
                feedback: "A caminhada casa variantes de extensão, então descongelar toda conta existente não ajudaria. A própria entrada DefaultAccountState é o que a criação de pool recusa."  # @src=baf1e1737cc3
              a:
                # | Fine: frozen-by-default is a display concern, so DEXes whitelist it like
                # | MetadataPointer.
                label: "Tudo bem: congelado por padrão é uma questão de exibição, então as DEXes o colocam na whitelist como o MetadataPointer."  # @src=433a5ebfb3f4
                # | DefaultAccountState is a control extension, not a display one; Raydium
                # | explicitly rejects DefaultAccountState(Frozen).
                feedback: "O DefaultAccountState é uma extensão de controle, não uma de exibição; a Raydium rejeita explicitamente o DefaultAccountState(Frozen)."  # @src=052172ca3370
              c:
                # | It breaks routability: power/control extensions get refused; only fee,
                # | display and accounting extensions get whitelisted.
                label: "Isso quebra a roteabilidade: extensões de poder/controle ficam refused; só extensões de taxa, exibição e contabilidade ficam whitelisted."  # @src=cf18572d21f8
                # | Fee, display and accounting extensions get whitelisted; power and
                # | control extensions get refused, and a frozen default is control.
                # | Reaching for one just in case costs you the venue.
                feedback: "Extensões de taxa, exibição e contabilidade ficam whitelisted; extensões de poder e controle ficam refused, e um default congelado é controle. Recorrer a uma só por precaução te custa o venue."  # @src=fce017a24fe9
              b:
                # | Fine: as long as you also add TransferFeeConfig, the allowlisted
                # | extension covers the frozen one.
                label: "Tudo bem: desde que você também adicione o TransferFeeConfig, a extensão da allowlist cobre a congelada."  # @src=5018db45eca9
                # | Allowlisting is not additive; one off-list extension taints the whole
                # | mint regardless of what else is present.
                feedback: "Estar na allowlist não é aditivo; uma extensão fora da lista contamina o mint inteiro, independentemente do que mais esteja presente."  # @src=dc022f430d56
          m05l2-q2-wallet-matrix-honesty:
            # | A teammate wants the README to publish 'Phantom shows the transfer-fee
            # | warning, Backpack doesn't, Solflare greys it out.' You ran no such test.
            # | What is the honest move for the routability report?
            prompt: "Um colega quer que o README publique 'a Phantom mostra o aviso de taxa de transferência, a Backpack não, a Solflare deixa cinza'. Você não rodou teste nenhum desses. Qual é o movimento honesto para o relatório de roteabilidade?"  # @src=bfee27ae69d3
            # | Phantom/Backpack/Solflare per-extension display behavior is unverified, so
            # | the report states it as 'verify in the wallet you target,' never a frozen
            # | matrix. The same honesty applies to Jupiter's Token-2022 routing policy,
            # | which its docs do not pin.
            explanation: "O comportamento de exibição por extensão da Phantom/Backpack/Solflare não é verificado, então o relatório o enuncia como 'verifique na carteira que você tem como alvo', nunca como uma matriz congelada. A mesma honestidade se aplica à política de roteamento de Token-2022 da Jupiter, que os docs dela não fixam."  # @src=48e7e32010cb
            options:                 # source order — keep it
              b:
                # | Publish it: the Token-2022 spec standardizes how each wallet must render
                # | every extension, so the table is safe to assert for any compliant
                # | wallet.
                label: "Publique: a spec do Token-2022 padroniza como cada carteira precisa renderizar toda extensão, então a tabela é segura para afirmar para qualquer carteira em conformidade."  # @src=5bfa871cd328
                # | Per-wallet extension display is not standardized and was unverified this
                # | round; asserting it risks shipping wrong claims.
                feedback: "A exibição de extensões por carteira não é padronizada e ficou sem verificação nesta rodada; afirmá-la arrisca entregar afirmações erradas."  # @src=dc828ee21b8a
              c:
                # | Publish it for Phantom only, since Phantom's behavior is documented in
                # | Raydium's allowlist.
                label: "Publique só para a Phantom, já que o comportamento da Phantom está documentado na allowlist da Raydium."  # @src=db25bf3dea32
                # | Raydium's allowlist is a DEX pool-creation rule, not a wallet display
                # | spec; it says nothing about any wallet's UI.
                feedback: "A allowlist da Raydium é uma regra de criação de pool de uma DEX, não uma spec de exibição de carteira; ela não diz nada sobre a UI de nenhuma carteira."  # @src=26a7436c321d
              a:
                # | Do not freeze the matrix: mark per-wallet display as unverified and
                # | point readers at the wallet they target.
                label: "Não congele a matriz: marque a exibição por carteira como não verificada e aponte os leitores para a carteira que eles têm como alvo."  # @src=996db6dcee4b
                # | Per-wallet extension display is not standardized and was not tested this
                # | round, so the report names it as an open item and sends the reader to
                # | the wallet they actually target.
                feedback: "A exibição de extensões por carteira não é padronizada e não foi testada nesta rodada, então o relatório a nomeia como um item aberto e manda o leitor para a carteira que ele de fato tem como alvo."  # @src=3ce73163b34d
              d:
                # | Publish it with the date you checked attached, since a dated observation
                # | is what the course usually asks for when a claim drifts
                label: "Publique com a data em que você checou anexada, já que uma observação datada é o que o curso normalmente pede quando uma afirmação deriva"  # @src=fc4f0eefd5b2
                # | A date makes an observation checkable; it cannot manufacture one.
                # | Nothing was run here, so the dated version is a guess wearing the
                # | course's own honesty costume.
                feedback: "Uma data torna uma observação checável; ela não consegue fabricar uma. Nada foi rodado aqui, então a versão datada é um chute vestindo a própria fantasia de honestidade do curso."  # @src=61008a6bdc0b
          m05l2-q3-per-venue-scope:
            # | SPROUT ships with TransferFeeConfig + MetadataPointer + TokenMetadata and
            # | routes on Raydium CP-Swap. A colleague asks, 'so it'll route on Jupiter and
            # | in every wallet too, right?'
            prompt: "O SPROUT é entregue com TransferFeeConfig + MetadataPointer + TokenMetadata e roteia no CP-Swap da Raydium. Um colega pergunta: 'então ele vai rotear na Jupiter e em toda carteira também, né?'"  # @src=67fe6407a1f4
            # | Routability is per-venue. Raydium publishes a code allowlist, Orca gates
            # | some extensions behind a Token Badge, and Jupiter's routing policy is not
            # | found in its docs (a verify-at-write gap). The report captures the
            # | verified-routable set and names the venues still to verify, honestly.
            explanation: "A roteabilidade é por venue. A Raydium publica uma allowlist em código, a Orca restringe o acesso de algumas extensões atrás de um Token Badge, e a política de roteamento da Jupiter não é encontrada nos docs dela (uma lacuna de verifique-na-hora-de-escrever). O relatório captura o conjunto verificado-roteável e nomeia os venues que ainda faltam verificar, honestamente."  # @src=2e3afd89be57
            options:                 # source order — keep it
              d:
                # | Mostly: venues key on the extension set, so a mint that clears one code
                # | allowlist usually clears another, and the report can say so with a
                # | caveat attached
                label: "Na maioria das vezes: os venues se baseiam no conjunto de extensões, então um mint que passa por uma allowlist em código normalmente passa por outra, e o relatório pode dizer isso com uma ressalva anexada"  # @src=77d85aa4f52c
                # | The mechanisms are not even the same kind. Orca grants per-mint approval
                # | by human review and Jupiter publishes no policy at all, so there is no
                # | base rate to generalize from, only venues to check.
                feedback: "Os mecanismos não são nem do mesmo tipo. A Orca concede aprovação por mint via revisão humana e a Jupiter não publica política nenhuma, então não existe taxa base a partir da qual generalizar, só venues para checar."  # @src=be1b99784c42
              c:
                # | Only if you also mint a classic SPL twin, since aggregators skip
                # | Token-2022 mints when they build routes.
                label: "Só se você também cunhar um gêmeo SPL clássico, já que os agregadores pulam mints Token-2022 quando montam rotas."  # @src=6efbaf36f44d
                # | Aggregators do handle Token-2022; the point is each has its own
                # | per-extension policy, not that they ignore the program.
                feedback: "Os agregadores lidam com Token-2022 sim; o ponto é que cada um tem a própria política por extensão, não que eles ignorem o programa."  # @src=4bedb5cb549e
              b:
                # | Not necessarily: each venue sets its own rule (Orca's Token Badge,
                # | Jupiter's unstated policy); the report lists what you must still verify.
                label: "Não necessariamente: cada venue define a própria regra (o Token Badge da Orca, a política não enunciada da Jupiter); o relatório lista o que você ainda precisa verificar."  # @src=45e78ee96d32
                # | Each venue sets its own rule and some have not written it down, so the
                # | report ships the verified-routable set beside a named list of what is
                # | still open.
                feedback: "Cada venue define a própria regra e alguns não a escreveram, então o relatório entrega o conjunto verificado-roteável ao lado de uma lista nomeada do que ainda está aberto."  # @src=856ecf57aa05
              a:
                # | Yes: Raydium's five-extension allowlist is the ecosystem standard, and
                # | Jupiter, Orca, and every major wallet mirror it in their own routing and
                # | display checks.
                label: "Sim: a allowlist de cinco extensões da Raydium é o padrão do ecossistema, e a Jupiter, a Orca e toda carteira relevante a espelham nas próprias checagens de roteamento e exibição."  # @src=b7408fa501b0
                # | There is no shared standard; Orca uses a Token Badge review and
                # | Jupiter's Token-2022 policy is not pinned in its docs.
                feedback: "Não existe padrão compartilhado; a Orca usa uma revisão de Token Badge e a política de Token-2022 da Jupiter não está fixada nos docs dela."  # @src=cbfda4e09ed7
  m06-l1-metadata-standards:
    # | The metadata standards wallets actually read
    title: "Os padrões de metadados que as carteiras de fato leem"  # @src=0ce7b0c407cf
    blocks:
      check:                      # quiz
        questions:
          m06-l1-metadata-standards-q1:
            # | You fetch a legacy NFT's on-chain account and it does NOT contain the image
            # | bytes or the trait list. A teammate says the asset is broken. What's
            # | actually going on?
            prompt: "Você busca a conta on-chain de um NFT legado e ela NÃO contém os bytes da imagem nem a lista de traits. Um colega diz que o ativo está quebrado. O que está de fato acontecendo?"  # @src=65db166eda6b
            # | A Metaplex on-chain record is a small struct plus a uri pointer. The rich
            # | content (image, animation_url, attributes) is a JSON document at that uri,
            # | following the Token Metadata JSON standard (whose canonical schema host,
            # | schema.metaplex.com, no longer resolves; the lesson's validator script
            # | carries the field contract). An empty-looking account is normal; you resolve
            # | the uri to see the asset.
            explanation: "Um registro on-chain da Metaplex é uma struct pequena mais um ponteiro uri. O conteúdo rico (image, animation_url, attributes) é um documento JSON nessa uri, seguindo o padrão JSON do Token Metadata (cujo host canônico do schema, schema.metaplex.com, não resolve mais; o script validador da lição carrega o contrato de campos). Uma conta com aparência vazia é normal; você resolve a uri para ver o ativo."  # @src=f69c69a22f96
            options:                 # source order — keep it
              c:
                # | Data holds only name, symbol, uri, seller_fee_basis_points and creators;
                # | the image and traits live in the JSON.
                label: "A Data guarda apenas name, symbol, uri, seller_fee_basis_points e creators; a imagem e os traits vivem no JSON."  # @src=d0c54fe11b78
                # | That is the architecture, and the uri field in their own dump was the
                # | answer: five fields on-chain, everything rich one fetch away.
                feedback: "Essa é a arquitetura, e o campo uri no próprio dump dele era a resposta: cinco campos on-chain, tudo o que é rico a um fetch de distância."  # @src=3f02326f359f
              d:
                # | The image and traits sit in the 65-byte account header the decoder skips
                # | past, so the Data struct legitimately shows neither.
                label: "A imagem e os traits ficam nos 65 bytes de header da conta que o decodificador pula, então a struct Data legitimamente não mostra nenhum dos dois."  # @src=f2dd61d0e149
                # | The skipped 65 bytes are a one-byte account key, the 32-byte update
                # | authority and the 32-byte mint. No room for a PNG, and no traits either.
                feedback: "Os 65 bytes pulados são uma chave de conta de um byte, a autoridade de atualização de 32 bytes e o mint de 32 bytes. Sem espaço para um PNG, e sem traits também."  # @src=16caf2b2d0d1
              b:
                # | The image and traits were pruned by the RPC's default account encoding;
                # | a full archive node would return every missing field.
                label: "A imagem e os traits foram podados pelo encoding de conta default do RPC; um nó de arquivo completo devolveria todo campo faltante."  # @src=003b248a5045
                # | RPCs don't prune asset fields, and no node type or encoding changes
                # | that: the on-chain Data struct genuinely doesn't hold the image or
                # | traits; they live in the off-chain JSON.
                feedback: "RPCs não podam campos de ativo, e nenhum tipo de nó ou encoding muda isso: a struct Data on-chain genuinamente não guarda a imagem nem os traits; eles vivem no JSON off-chain."  # @src=479735828923
              a:
                # | The account was created with the wrong program, so it needs re-minting
                # | with the image bytes embedded in the Data struct.
                label: "A conta foi criada com o programa errado, então ela precisa ser cunhada de novo com os bytes da imagem embutidos na struct Data."  # @src=a5a70a392751
                # | Nothing is broken and nothing needs re-minting: on-chain accounts never
                # | embed the image. The bytes are supposed to be off-chain.
                feedback: "Nada está quebrado e nada precisa ser cunhado de novo: contas on-chain nunca embutem a imagem. Os bytes devem ficar off-chain."  # @src=8ac9e9be479f
          m06-l1-metadata-standards-q2:
            # | For SPROUT's Token-2022 mint you set the MetadataPointer to point at a
            # | separate account you control. What's the risk versus the usual layout?
            prompt: "No mint Token-2022 do SPROUT você configurou o MetadataPointer para apontar para uma conta separada que você controla. Qual é o risco em relação ao layout usual?"  # @src=4d100f2c2283
            # | MetadataPointer tells consumers where the canonical metadata is. Pointing it
            # | at the mint itself (self-referential) means the metadata is inseparable from
            # | the mint and can't be impersonated. Pointing it at an arbitrary account
            # | reintroduces the spoofing surface the pointer was designed to close.
            explanation: "O MetadataPointer diz aos consumidores onde estão os metadados canônicos. Apontá-lo para o próprio mint (autorreferencial) significa que os metadados são inseparáveis do mint e não podem ser personificados. Apontá-lo para uma conta arbitrária reintroduz a superfície de spoofing que o ponteiro foi projetado para fechar."  # @src=01a6e4950497
            options:                 # source order — keep it
              c:
                # | The mint will fail to initialize, because InitializeMint2 validates that
                # | the MetadataPointer target equals the mint address and rejects any
                # | configuration aimed at a separate account.
                label: "O mint vai falhar ao inicializar, porque o InitializeMint2 valida que o alvo do MetadataPointer é igual ao endereço do mint e rejeita qualquer configuração apontada para uma conta separada."  # @src=1db625c2c0ee
                # | It can legally point elsewhere; that's precisely why it's a risk. The
                # | self-referential form is a convention that removes the spoofing surface,
                # | not a hard requirement.
                feedback: "Ele pode legalmente apontar para outro lugar; é precisamente por isso que é um risco. A forma autorreferencial é uma convenção que remove a superfície de spoofing, não um requisito rígido."  # @src=e0d5fffaee62
              a:
                # | A pointer to any account other than the mint itself can be aimed at
                # | spoofed metadata; the self-referential layout is the anti-spoofing
                # | default for exactly this reason.
                label: "Um ponteiro para qualquer conta que não seja o próprio mint pode ser apontado para metadados falsificados; o layout autorreferencial é o default anti-spoofing exatamente por essa razão."  # @src=de858e0c9318
                # | Indirection is the surface: whatever the pointer names is what consumers
                # | treat as canonical, so the only target nobody else can substitute is the
                # | mint itself.
                feedback: "A indireção é a superfície: o que o ponteiro nomeia é o que os consumidores tratam como canônico, então o único alvo que mais ninguém pode substituir é o próprio mint."  # @src=d23e03c62ea4
              b:
                # | None: the pointer target is cosmetic, since wallets ignore it and read
                # | the mint's TLV entry directly either way.
                label: "Nenhum: o alvo do ponteiro é cosmético, já que as carteiras o ignoram e leem a entrada TLV do mint diretamente de qualquer jeito."  # @src=446bac493462
                # | The target is not cosmetic: wallets follow the pointer to find the
                # | canonical metadata, so where it aims determines what they trust.
                feedback: "O alvo não é cosmético: as carteiras seguem o ponteiro para encontrar os metadados canônicos, então para onde ele aponta determina no que elas confiam."  # @src=ae2d99bd3d4a
              d:
                # | A separate account can be closed or repointed later, but wallets
                # | typically fall back to the mint's own TLV, so the exposure is a brief
                # | display gap.
                label: "Uma conta separada pode ser fechada ou reapontada depois, mas as carteiras tipicamente caem de volta no TLV do próprio mint, então a exposição é uma breve lacuna de exibição."  # @src=de7abdc65a76
                # | There is no fallback to fall back to: the pointer is how a consumer
                # | decides which bytes are canonical, so a bad target is bad metadata, not
                # | a gap.
                feedback: "Não existe fallback no qual cair: o ponteiro é como um consumidor decide quais bytes são canônicos, então um alvo ruim é metadado ruim, não uma lacuna."  # @src=e296460e1a39
          m06-l1-metadata-standards-q3:
            # | You're deciding where to host an Almanac asset's JSON so it still resolves
            # | in five years. Which framing is honest?
            prompt: "Você está decidindo onde hospedar o JSON de um ativo do Almanac para que ele ainda resolva em cinco anos. Qual enquadramento é honesto?"  # @src=9466babb27e0
            # | On-chain you store a pointer; permanence is a property of the store behind
            # | it. Irys is Metaplex CLI's documented default uploader and Arweave URIs are
            # | pervasive; IPFS works but relies on continued pinning. The honest rule is
            # | 'the URI is permanent only if the store is.'
            explanation: "On-chain você guarda um ponteiro; a permanência é uma propriedade do armazenamento atrás dele. O Irys é o uploader default documentado da CLI da Metaplex e as URIs do Arweave são difundidas; o IPFS funciona mas depende de pinning contínuo. A regra honesta é 'a URI é permanente só se o armazenamento for'."  # @src=49c6ff91bb22
            options:                 # source order — keep it
              c:
                # | IPFS is the verified market standard for permanence: content addressing
                # | pins the asset to its hash, so the host behind the gateway stops
                # | mattering.
                label: "O IPFS é o padrão de mercado verificado para permanência: o endereçamento por conteúdo prende o ativo ao hash dele, então o host atrás do gateway deixa de importar."  # @src=655c1398be5a
                # | Content addressing is a real integrity upgrade, but availability still
                # | depends on someone continuing to pin the file, and the health of that
                # | pinning market went unverified this round.
                feedback: "O endereçamento por conteúdo é um upgrade de integridade de verdade, mas a disponibilidade ainda depende de alguém continuar pinando o arquivo, e a saúde desse mercado de pinning ficou sem verificação nesta rodada."  # @src=97b613a57b86
              d:
                # | Dropping the update authority makes the asset permanent, because a
                # | record nobody can rewrite will keep resolving to the same file.
                label: "Abandonar a autoridade de atualização torna o ativo permanente, porque um registro que ninguém pode reescrever vai continuar resolvendo para o mesmo arquivo."  # @src=06d00565322d
                # | Immutability and durability are separate decisions. Freezing the record
                # | freezes the pointer, and a frozen pointer at a dead bucket resolves to
                # | nothing forever.
                feedback: "Imutabilidade e durabilidade são decisões separadas. Congelar o registro congela o ponteiro, e um ponteiro congelado em um bucket morto resolve para nada para sempre."  # @src=017210627fee
              b:
                # | The asset is only as durable as the URI it points at; Irys/Arweave are
                # | the documented permanent defaults.
                label: "O ativo é tão durável quanto a URI para a qual ele aponta; Irys/Arweave são os defaults permanentes documentados."  # @src=1455b6b1e070
                # | Permanence is a property of the store, not of the pointer. Irys in front
                # | of Arweave is the documented default precisely because the endowment
                # | outlives the team.
                feedback: "A permanência é uma propriedade do armazenamento, não do ponteiro. O Irys na frente do Arweave é o default documentado precisamente porque a dotação sobrevive ao time."  # @src=bbcd75ff810f
              a:
                # | Any HTTPS URL is fine, because the on-chain account guarantees the
                # | content: the uri is stored on-chain under an update authority, and rent
                # | keeps that record alive forever.
                label: "Qualquer URL HTTPS serve, porque a conta on-chain garante o conteúdo: a uri é guardada on-chain sob uma autoridade de atualização, e o rent mantém esse registro vivo para sempre."  # @src=2c4fafc0a736
                # | Rent keeps the struct alive forever and the struct will point at a 404
                # | just as long. The account stores the uri, never the bytes behind it.
                feedback: "O rent mantém a struct viva para sempre e a struct vai apontar para um 404 pelo mesmo tanto de tempo. A conta guarda a uri, nunca os bytes atrás dela."  # @src=a384ac388cd5
  m06-l2-metaplex-core:
    # | Ship the NFT: Metaplex Core collections, plugins, and editions
    title: "Entregue o NFT: coleções, plugins e edições do Metaplex Core"  # @src=086ab7dacfc3
    blocks:
      royalties-plugin-config:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The starter only checks the shares sum; add the basisPoints range, the ruleSet
          # | membership, the duplicate-address guard, and the per-share range.
          0: "O starter checa só a soma das fatias; adicione o intervalo de basisPoints, a pertinência do ruleSet, a trava de endereço duplicado e o intervalo por fatia."  # @src=ff7f17fc1971
          # | basisPoints is 0..10000 (10000 = 100%), an integer; reject anything outside
          # | that first.
          1: "basisPoints é 0..10000 (10000 = 100%), um inteiro; rejeite qualquer coisa fora disso primeiro."  # @src=c8d0871d5115
          # | Track seen creator addresses in a Set to catch duplicates before you total the
          # | shares.
          2: "Rastreie os endereços de creator já vistos num Set para pegar duplicatas antes de totalizar as fatias."  # @src=e04121ac14b0
        tests:                      # keyed by test case id
          t1-valid-single-creator:
            # | A 5% royalty to one creator with ruleSet None is valid.
            description: "Um royalty de 5% para um creator com ruleSet None é válido."  # @src=a0553f9a1cde
          t2-basis-points-over-max:
            # | basisPoints above 10000 is rejected even when shares sum to 100.
            description: "basisPoints acima de 10000 é rejeitado mesmo quando as fatias somam 100."  # @src=56e44831596e
          t3-shares-do-not-sum:
            # | Two creators whose shares sum to 90 are rejected.
            description: "Dois creators cujas fatias somam 90 são rejeitados."  # @src=8e3a2088afb8
          t4-duplicate-creator:
            # | The same creator address twice is rejected even though shares sum to 100.
            description: "O mesmo endereço de creator duas vezes é rejeitado mesmo que as fatias somem 100."  # @src=f689509b7e9c
          t5-unknown-ruleset:
            # | A ruleSet outside None/ProgramAllowList/ProgramDenyList is rejected.
            description: "Um ruleSet fora de None/ProgramAllowList/ProgramDenyList é rejeitado."  # @src=9a6ac8c64f68
          t6-valid-allowlist-split:
            # | A two-creator 70/30 split with ruleSet ProgramAllowList is valid.
            description: "Um split 70/30 de dois creators com ruleSet ProgramAllowList é válido."  # @src=0cf860f8dedf
      check:                      # quiz
        questions:
          m06-l2-metaplex-core-q1:
            # | You mint three Almanac assets, then try to create the collection and add
            # | them. The downstream membership reads come back empty. What went wrong?
            prompt: "Você cunha três ativos Almanac, depois tenta criar a coleção e adicioná-los. As leituras de pertencimento downstream voltam vazias. O que deu errado?"  # @src=595941390c58
            # | Core's model is collection-first: you create and verify the Almanac
            # | collection, then mint assets INTO it so membership is written at mint. An
            # | after-the-fact update path does exist — a retrofit signed by authorities on
            # | both sides — but nothing runs it for you, which is why the membership reads
            # | came back empty. The collection-first habit stays load-bearing: Bubblegum v2
            # | in the next module mints cNFTs into a Core collection too.
            explanation: "O modelo do Core é coleção-primeiro: você cria e verifica a coleção Almanac, depois cunha ativos DENTRO dela para que o pertencimento seja escrito no mint. Existe um caminho de update depois do fato — um retrofit assinado por autoridades dos dois lados — mas nada o roda para você, que é o motivo pelo qual as leituras de pertencimento voltaram vazias. O hábito coleção-primeiro continua estrutural: o Bubblegum v2 no próximo módulo cunha cNFTs dentro de uma coleção Core também."  # @src=3054302afb41
            options:                 # source order — keep it
              c:
                # | The collection didn't exist when the assets were minted, so they came
                # | out as orphans with Address update authorities; nothing retrofits
                # | membership on its own, and moving an orphan in later takes an explicit
                # | update signed by authorities on both sides.
                label: "A coleção não existia quando os ativos foram cunhados, então eles saíram como órfãos com autoridades de atualização Address; nada faz retrofit de pertencimento por conta própria, e mover um órfão para dentro depois exige um update explícito assinado por autoridades dos dois lados."  # @src=574c047f4bd2
                # | Read the arm and you have your diagnosis: Address means orphan,
                # | Collection means member. Order is the fix, and it has to be the order
                # | you mint in.
                feedback: "Leia o braço e você tem o seu diagnóstico: Address significa órfão, Collection significa membro. A ordem é a correção, e ela tem que ser a ordem em que você cunha."  # @src=12ce4ddbe4d9
              d:
                # | The assets are members already; Core writes membership at mint but
                # | leaves it unverified until the collection authority signs a separate
                # | verify instruction, so run that once per asset and the reads populate.
                label: "Os ativos já são membros; o Core escreve o pertencimento no mint mas o deixa não verificado até a autoridade da coleção assinar uma instrução verify separada, então rode isso uma vez por ativo e as leituras se preenchem."  # @src=13d6be60b711
                # | That is the Token Metadata ritual, and Core deletes it. There is no
                # | verified boolean to flip: membership IS the update authority arm,
                # | writable only when the collection authority signs the mint itself.
                feedback: "Esse é o ritual do Token Metadata, e o Core o apaga. Não existe booleano verified para virar: o pertencimento É o braço de autoridade de atualização, escrevível só quando a autoridade da coleção assina o próprio mint."  # @src=db41ce443487
              b:
                # | The assets need a Royalties plugin attached before a collection will
                # | accept them as members, and the plugin has to be added at mint rather
                # | than later.
                label: "Os ativos precisam de um plugin Royalties anexado antes de uma coleção os aceitar como membros, e o plugin tem que ser adicionado no mint em vez de depois."  # @src=bb021f0f8d97
                # | Royalties and membership are independent plugins/relationships; a
                # | missing Royalties plugin doesn't explain empty membership.
                feedback: "Royalties e pertencimento são plugins/relações independentes; um plugin Royalties faltando não explica pertencimento vazio."  # @src=b71a35f6e8ba
              a:
                # | Core assets minted before their collection can only join it during the
                # | program's scheduled re-index window, when the collection authority
                # | batch-approves pending membership and rewrites their update authorities.
                label: "Ativos Core cunhados antes da coleção deles só podem entrar nela durante a janela de re-index agendada do programa, quando a autoridade da coleção aprova em lote o pertencimento pendente e reescreve as autoridades de atualização deles."  # @src=eb9c6ea58223
                # | There's no re-index window and no batch approval; membership is written
                # | at mint against an existing collection, or afterwards only by an
                # | explicit two-signature update, never by a scheduled program pass.
                feedback: "Não existe janela de re-index nem aprovação em lote; o pertencimento é escrito no mint contra uma coleção existente, ou depois só por um update explícito de duas assinaturas, nunca por uma passada agendada do programa."  # @src=c3e1ef6452c5
          m06-l2-metaplex-core-q2:
            # | A stakeholder wants the ~0.003 SOL Core mint cost printed as a hard
            # | guarantee in your docs. How do you frame it honestly?
            prompt: "Um stakeholder quer que o custo de mint de ~0.003 SOL do Core seja impresso como uma garantia dura nos seus docs. Como você o enquadra honestamente?"  # @src=f5ef2d91c0a9
            # | The cost story is real and load-bearing for choosing Core, but the numbers
            # | are vendor-published (metaplex.com/docs/core) with no independent
            # | third-party measurement found. Attribute them as such, the same discipline
            # | the course applies to every moving number.
            explanation: "A história de custo é real e estrutural para escolher o Core, mas os números são publicados pelo fornecedor (metaplex.com/docs/core) sem nenhuma medição independente de terceiros encontrada. Atribua-os como tal, a mesma disciplina que o curso aplica a todo número que se move."  # @src=cfebe3aaf271
            options:                 # source order — keep it
              c:
                # | As a measured result from this course's own benchmark harness, run
                # | against the same surfnet the lab uses.
                label: "Como um resultado medido pelo próprio harness de benchmark deste curso, rodado contra o mesmo surfnet que o lab usa."  # @src=255c15e55fe3
                # | The course did not measure it: the figure comes from Metaplex's docs.
                # | Presenting it as your own measurement launders a vendor claim.
                feedback: "O curso não mediu isso: o número vem dos docs da Metaplex. Apresentá-lo como a sua própria medição lava uma alegação do fornecedor."  # @src=9f20e31d4728
              b:
                # | As a fixed protocol constant baked into the Core program: every mint
                # | pays exactly 0.003 SOL and 17,000 CU.
                label: "Como uma constante de protocolo fixa embutida no programa Core: todo mint paga exatamente 0.003 SOL e 17,000 CU."  # @src=91e37a3bd9ba
                # | It's not a protocol constant; it's a vendor benchmark that varies with
                # | rent and instruction shape, so it can't be promised as an invariant.
                feedback: "Não é uma constante de protocolo; é um benchmark do fornecedor que varia com o rent e com o formato da instrução, então não pode ser prometido como um invariante."  # @src=354db7f038ff
              a:
                # | As Metaplex's vendor-published figure versus Token Metadata's, cited as
                # | vendor-published rather than as a number this course independently
                # | measured.
                label: "Como o número publicado pelo fornecedor Metaplex contra o do Token Metadata, citado como publicado pelo fornecedor em vez de como um número que este curso mediu independentemente."  # @src=cf28ca643db0
                # | Cite the vendor, show your own account. Attribution costs one clause and
                # | it is what keeps the comparison usable when somebody checks it against
                # | their own mint.
                feedback: "Cite o fornecedor, mostre a sua própria conta. A atribuição custa uma oração e é o que mantém a comparação utilizável quando alguém a confere contra o próprio mint dele."  # @src=45b2c64b0ca4
              d:
                # | As a number you confirmed yourself, since first-mint.ts printed the same
                # | rent for your scratch asset on the surfnet.
                label: "Como um número que você mesmo confirmou, já que o first-mint.ts imprimiu o mesmo rent para o seu ativo de rascunho no surfnet."  # @src=ca219c0a51c9
                # | Your run printed a rent deposit in the low thousandths, not the vendor's
                # | figure: the rent component moves with the name and uri you stored
                # | inline.
                feedback: "A sua rodada imprimiu um depósito de rent nos milésimos baixos, não o número do fornecedor: o componente de rent se move com o nome e a uri que você guardou inline."  # @src=2788282945b6
          m06-l2-metaplex-core-q3:
            # | You apply PermanentFreeze to the Founding-Farmer badge to make it soulbound,
            # | then later get a request to let a farmer transfer their badge to a new
            # | wallet. What's true?
            prompt: "Você aplica o PermanentFreeze ao badge Founding-Farmer para torná-lo soulbound, e depois recebe um pedido para deixar um farmer transferir o badge dele para uma carteira nova. O que é verdade?"  # @src=927a63d49c51
            # | Be precise about where the permanence comes from, because this is the
            # | lesson's most carefully drawn distinction. PermanentFreezeDelegate is freeze
            # | that CAN BE MADE irrevocable, not freeze that is born irrevocable:
            # | frozen=true plus an authority someone holds is thawable. What welds the
            # | Founding-Farmer badge is the authority arm set to None, which removes the
            # | key that could undo it. So the decision is made at mint and it is a decision
            # | about the authority: null it for assets that should never move, retain it
            # | when you might need to transfer later.
            explanation: "Seja preciso sobre de onde vem a permanência, porque esta é a distinção mais cuidadosamente traçada da lição. O PermanentFreezeDelegate é congelamento que PODE SER TORNADO irrevogável, não congelamento que nasce irrevogável: frozen=true mais uma autoridade que alguém detém é descongelável. O que solda o badge Founding-Farmer é o braço de autoridade definido como None, que remove a chave que poderia desfazer isso. Então a decisão é tomada no mint e é uma decisão sobre a autoridade: anule-a para ativos que nunca deveriam se mover, mantenha-a quando você possa precisar transferir depois."  # @src=fd1cae961408
            options:                 # source order — keep it
              a:
                # | You can toggle PermanentFreeze off with the freeze delegate authority
                # | and re-enable it after the move.
                label: "Você consegue desligar o PermanentFreeze com a autoridade do freeze delegate e religá-lo depois da movimentação."  # @src=7d5e92b60adc
                # | Not on this badge, and the reason is the arm rather than the plugin.
                # | PermanentFreezeDelegate CAN be thawed while a freeze authority exists;
                # | the badge is welded because that authority was set to None at mint, and
                # | no key exists that could ever change it back.
                feedback: "Não neste badge, e o motivo é o braço em vez do plugin. O PermanentFreezeDelegate PODE ser descongelado enquanto uma autoridade de congelamento existe; o badge está soldado porque aquela autoridade foi definida como None no mint, e não existe chave que pudesse revertê-la algum dia."  # @src=d37ee3cabd10
              b:
                # | The badge was welded at mint by setting the plugin's authority to None,
                # | so no key can thaw it.
                label: "O badge foi soldado no mint ao definir a autoridade do plugin como None, então nenhuma chave consegue descongelá-lo."  # @src=017144303e6d
                # | The permanence lives in the authority arm, not in the plugin's name.
                # | Frozen plus a live authority is thawable; frozen plus None is frozen the
                # | way a number is even.
                feedback: "A permanência vive no braço de autoridade, não no nome do plugin. Congelado mais uma autoridade viva é descongelável; congelado mais None é congelado do jeito que um número é par."  # @src=467483e59a66
              d:
                # | Since the badge is a collection member, the collection's authority
                # | usually resolves plugin control and can thaw it.
                label: "Como o badge é um membro de coleção, a autoridade da coleção normalmente resolve o controle do plugin e consegue descongelá-lo."  # @src=e28dd562c9c6
                # | Precedence decides which plugin config applies, never who may act on it.
                # | Each entry carries its own authority arm, and this one holds None, so
                # | the collection authority is as powerless as anyone else.
                feedback: "A precedência decide qual config de plugin se aplica, nunca quem pode agir sobre ela. Cada entrada carrega o próprio braço de autoridade dela, e esta tem None, então a autoridade da coleção é tão impotente quanto qualquer outra."  # @src=1a1ab5215693
              c:
                # | The badge can move once, because PermanentFreeze starts blocking only
                # | from the second transfer onward.
                label: "O badge pode se mover uma vez, porque o PermanentFreeze só começa a bloquear a partir da segunda transferência."  # @src=9d458cdc8015
                # | There's no one-free-transfer rule; PermanentFreeze blocks transfers
                # | outright from the moment it's applied.
                feedback: "Não existe regra de uma-transferência-grátis; o PermanentFreeze bloqueia transferências de cara a partir do momento em que é aplicado."  # @src=f27c8d1c79a9
  m06-l3-token-metadata-legacy:
    # | Token Metadata as legacy: pNFTs and the royalty reality
    title: "Token Metadata como legado: pNFTs e a realidade dos royalties"  # @src=d6c9f7438015
    blocks:
      check:                      # quiz
        questions:
          m06-l3-token-metadata-legacy-q1:
            # | A marketplace lists a legacy NFT with seller_fee_basis_points = 500 and
            # | promises a 'guaranteed 5% royalty.' You decode its rule set and every
            # | operation is Pass. What's the accurate read?
            prompt: "Um marketplace anuncia um NFT legado com seller_fee_basis_points = 500 e promete um 'royalty garantido de 5%'. Você decodifica o rule set dele e toda operação é Pass. Qual é a leitura correta?"  # @src=b3488399dff1
            # | For legacy Token Metadata, seller_fee_basis_points is indicative only.
            # | Enforcement would come from a Token Auth Rules RuleSet, but the flagship
            # | Metaplex Foundation Rule Set sets all operations to Pass: armed but idle.
            # | The royalty is a convention marketplaces may or may not honor, not an
            # | on-chain guarantee.
            explanation: "Para o Token Metadata legado, seller_fee_basis_points é apenas indicativo. A imposição viria de um RuleSet do Token Auth Rules, mas o emblemático Metaplex Foundation Rule Set define todas as operações como Pass: armada mas inativa. O royalty é uma convenção que os marketplaces podem ou não honrar, não uma garantia on-chain."  # @src=ca81475303f8
            options:                 # source order — keep it
              a:
                # | The 5% is enforced on-chain, because seller_fee_basis_points is a
                # | protocol-level fee the runtime deducts at transfer.
                label: "Os 5% são impostos on-chain, porque seller_fee_basis_points é uma taxa em nível de protocolo que o runtime desconta na transferência."  # @src=36e866bdc865
                # | The runtime never deducts seller_fee_basis_points; it's a metadata
                # | field, not a fee the protocol collects.
                feedback: "O runtime nunca desconta seller_fee_basis_points; é um campo de metadados, não uma taxa que o protocolo arrecada."  # @src=f5cda2f10959
              d:
                # | The 5% is enforced because Token Metadata reads seller_fee_basis_points
                # | on the pNFT transfer path before it refreezes; the rule set's Pass on
                # | each operation just approves the venue.
                label: "Os 5% são impostos porque o Token Metadata lê seller_fee_basis_points no caminho de transferência do pNFT antes de recongelar; o Pass do rule set em cada operação só aprova o venue."  # @src=808c7f1de059
                # | Token Metadata stores and serves that u16 and never spends it. Even in
                # | the enforcement era the rule set refused venues rather than collecting a
                # | fee.
                feedback: "O Token Metadata armazena e serve esse u16 e nunca o gasta. Mesmo na era da imposição, o rule set recusava venues em vez de arrecadar uma taxa."  # @src=bdfd0dab0969
              c:
                # | seller_fee_basis_points is purely indicative; with the flagship rule set
                # | passing every operation, nothing on-chain enforces the 5%, and
                # | marketplaces choose whether to honor it.
                label: "seller_fee_basis_points é puramente indicativo; com o rule set emblemático passando toda operação, nada on-chain impõe os 5%, e os marketplaces escolhem se honram ou não."  # @src=bc35edba1fab
                # | Armed but idle is the phrase to carry out: the freeze still forces the
                # | pNFT transfer path, and the rule waved through at the end of it collects
                # | nothing.
                feedback: "Armada mas inativa é a frase a carregar para fora: o congelamento ainda força o caminho de transferência do pNFT, e a regra que libera tudo no fim dele não arrecada nada."  # @src=cc7ebe35a43c
              b:
                # | The 5% is enforced only if the buyer opts in through their wallet's
                # | royalty-enforcement setting, which adds an extra instruction routing the
                # | fee to the creator list at purchase time.
                label: "Os 5% são impostos apenas se o comprador optar por participar através da configuração de imposição de royalties da carteira dele, o que adiciona uma instrução extra roteando a taxa para a lista de criadores no momento da compra."  # @src=be5ba3085a88
                # | There's no wallet opt-in mechanism that turns the field into
                # | enforcement; enforcement (when it happens) comes from a rule set, which
                # | here blocks nothing.
                feedback: "Não existe mecanismo de opt-in na carteira que transforme o campo em imposição; a imposição (quando acontece) vem de um rule set, que aqui não bloqueia nada."  # @src=0223e9002a4b
          m06-l3-token-metadata-legacy-q2:
            # | Your team needs to integrate an existing pNFT collection AND launch a new
            # | royalty-bearing drop. What's the right standards call?
            prompt: "Seu time precisa integrar uma coleção de pNFT existente E lançar um novo drop que carrega royalties. Qual é a chamada de padrões correta?"  # @src=6c1f7b0f6a28
            # | The 2026 stance is asymmetric: Token Metadata is officially legacy, so you
            # | must read and integrate against the pNFTs already in the wild, but new-work
            # | royalties belong to Core plugins (what you built in m06-l2) or Bubblegum-v2
            # | rulesets (m07-l1). Legacy is a thing you consume, not a thing you newly
            # | ship.
            explanation: "A postura de 2026 é assimétrica: o Token Metadata é oficialmente legado, então você precisa ler e integrar contra os pNFTs que já estão por aí, mas os royalties de trabalho novo pertencem aos plugins do Core (o que você construiu no m06-l2) ou aos rulesets do Bubblegum v2 (m07-l1). Legado é uma coisa que você consome, não uma coisa que você entrega nova."  # @src=7caeeaeba34a
            options:                 # source order — keep it
              d:
                # | Integrate the existing pNFT collection as is, and ship the new drop as
                # | plain Token Metadata NFTs, since that standard has the widest
                # | marketplace support.
                label: "Integre a coleção de pNFT existente como está, e entregue o novo drop como NFTs Token Metadata simples, já que esse padrão tem o suporte de marketplace mais amplo."  # @src=5ba751ed00b8
                # | Widest support is exactly what makes reading it mandatory and shipping
                # | into it optional. A plain TM drop also has no royalty machinery at all,
                # | which is what this drop was for.
                feedback: "Suporte mais amplo é exatamente o que torna lê-lo obrigatório e entregar nele opcional. Um drop TM simples também não tem maquinaria de royalties nenhuma, que era justamente para o que este drop existia."  # @src=3eeeea8923f2
              b:
                # | Mint the new drop as pNFTs too, so both collections sit on one standard
                # | and your integration code has a single path.
                label: "Cunhe o novo drop como pNFTs também, para que as duas coleções fiquem em um padrão só e o seu código de integração tenha um caminho único."  # @src=3d692e669b64
                # | New pNFTs adopt a deprecated enforcement stack (Token Auth Rules) whose
                # | flagship rule enforces nothing; the course teaches TM/pNFT to evaluation
                # | depth precisely so you don't ship new ones.
                feedback: "pNFTs novos adotam uma pilha de imposição deprecada (Token Auth Rules) cuja regra emblemática não impõe nada; o curso ensina TM/pNFT em profundidade de avaliação precisamente para que você não entregue novos."  # @src=22d45be6c7fc
              a:
                # | Read-and-integrate against the existing pNFTs (TM/pNFT is legacy but
                # | live), and ship the NEW drop on Core plugins or Bubblegum-v2 rulesets;
                # | don't mint new pNFTs.
                label: "Ler-e-integrar contra os pNFTs existentes (TM/pNFT é legado mas vivo), e entregar o NOVO drop em plugins do Core ou rulesets do Bubblegum v2; não cunhe pNFTs novos."  # @src=dfcef933c423
                # | Two different verbs for two different assets. Consuming a legacy
                # | standard costs you nothing; minting into it inherits an enforcement
                # | stack its own vendor walked away from.
                feedback: "Dois verbos diferentes para dois ativos diferentes. Consumir um padrão legado não te custa nada; cunhar nele herda uma pilha de imposição de que o próprio fornecedor se afastou."  # @src=f295c70c0487
              c:
                # | Migrate the existing pNFTs to Core first so both collections share one
                # | standard, then ship everything as pNFTs for compatibility with the
                # | tooling most marketplaces already run.
                label: "Migre os pNFTs existentes para o Core primeiro para que as duas coleções compartilhem um padrão, e então entregue tudo como pNFTs para compatibilidade com o ferramental que a maioria dos marketplaces já roda."  # @src=b0a377b3ffc6
                # | This is self-contradictory and unnecessary: you integrate legacy assets
                # | as-is, and new work goes to Core/Bubblegum-v2. You don't convert to Core
                # | only to mint pNFTs.
                feedback: "Isto é autocontraditório e desnecessário: você integra ativos legados como estão, e trabalho novo vai para Core/Bubblegum v2. Você não converte para o Core só para cunhar pNFTs."  # @src=cc43b8a56d81
          m06-l3-token-metadata-legacy-q3:
            # | The docs page lists 5 TokenStandard variants; the code enum has 6 (it adds
            # | ProgrammableNonFungibleEdition). Which do you build your integration
            # | against, and why?
            prompt: "A página de docs lista 5 variantes de TokenStandard; o enum do código tem 6 (ele adiciona ProgrammableNonFungibleEdition). Contra qual você constrói a sua integração, e por quê?"  # @src=d33b6ca40520
            # | Token Metadata is in maintenance mode, so its docs page trails its source.
            # | The code enum carries 6 variants, adding ProgrammableNonFungibleEdition; an
            # | integration that only knows the documented 5 mishandles the sixth. When docs
            # | and code disagree on a legacy standard, the code is the truth you integrate
            # | against.
            explanation: "O Token Metadata está em modo de manutenção, então a página de docs dele fica atrás do fonte. O enum do código carrega 6 variantes, adicionando ProgrammableNonFungibleEdition; uma integração que só conhece as 5 documentadas trata a sexta de forma errada. Quando docs e código discordam sobre um padrão legado, o código é a verdade contra a qual você integra."  # @src=663a4f5db988
            options:                 # source order — keep it
              b:
                # | The code's 6 variants: for a legacy standard the docs lag the source,
                # | and an asset can carry the 6th (ProgrammableNonFungibleEdition) variant
                # | you'd otherwise fail to handle.
                label: "As 6 variantes do código: para um padrão legado os docs ficam atrás do fonte, e um ativo pode carregar a 6ª variante (ProgrammableNonFungibleEdition) que você de outro modo deixaria de tratar."  # @src=45d3bf84e4fe
                # | Source is present tense, prose is the past tense of whenever someone
                # | last edited it. The variant that is missing from the page is the one
                # | that reaches your match statement in production.
                feedback: "O fonte é o tempo presente, a prosa é o pretérito de quando alguém a editou por último. A variante que falta na página é a que chega no seu match em produção."  # @src=a54861cdef89
              c:
                # | Neither: TokenStandard is deprecated along with the rest of the
                # | standard, so the field can be ignored entirely.
                label: "Nenhuma das duas: TokenStandard está deprecado junto com o resto do padrão, então o campo pode ser ignorado por completo."  # @src=26cb3ddec772
                # | You still have to read the variant to integrate legacy assets correctly;
                # | 'legacy' means you consume it, not that you can ignore its shape.
                feedback: "Você ainda tem que ler a variante para integrar ativos legados corretamente; 'legado' significa que você o consome, não que pode ignorar a forma dele."  # @src=137a11c0ec64
              d:
                # | Against the code's 6 variants, then walk away: a legacy standard whose
                # | docs and source disagree is not safe for a production reader.
                label: "Contra as 6 variantes do código, e depois vá embora: um padrão legado cujos docs e fonte discordam não é seguro para um leitor em produção."  # @src=ec755c67fc4e
                # | Drift is the normal condition of a maintenance-mode standard, not a red
                # | flag. Most NFTs on Solana live here, so a reader that refuses to read
                # | them is a product that cannot ship.
                feedback: "Deriva é a condição normal de um padrão em modo de manutenção, não um sinal de alerta. A maioria dos NFTs na Solana vive aqui, então um leitor que se recusa a lê-los é um produto que não consegue ser entregue."  # @src=9ecb0e6ee4c3
              a:
                # | The docs' 5 variants, because the published page is the canonical
                # | contract that an integration is written against.
                label: "As 5 variantes dos docs, porque a página publicada é o contrato canônico contra o qual uma integração é escrita."  # @src=9220849f8f43
                # | For a legacy, lightly-maintained standard the docs lag the code;
                # | building against 5 variants means an asset of the 6th variant surprises
                # | you at runtime.
                feedback: "Para um padrão legado e pouco mantido, os docs ficam atrás do código; construir contra 5 variantes significa que um ativo da 6ª variante te surpreende em tempo de execução."  # @src=bb7ae9c112b9
  m07-l1-bubblegum-v2-cnfts:
    # | Bubblegum v2: mint a million NFTs for the price of a laptop
    title: "Bubblegum v2: cunhe um milhão de NFTs pelo preço de um laptop"  # @src=1ca6812381d7
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Your Harvest-crate cNFTs mint into the tree and their asset ids resolve. A
            # | teammate asks where a single crate's metadata actually lives on-chain.
            # | What's the accurate answer?
            prompt: "Os seus cNFTs de crate Harvest cunham na árvore e os asset ids deles resolvem. Um colega de equipe pergunta onde os metadados de um único crate de fato moram on-chain. Qual é a resposta precisa?"  # @src=4d272530ec7d
            # | State compression stores only a hash of each asset as a leaf in an on-chain
            # | concurrent Merkle tree. The readable metadata lives in a DAS provider's
            # | index, which is exactly why the next lesson needs a DAS RPC to read a crate
            # | back.
            explanation: "A compressão de estado guarda só um hash de cada ativo como uma folha numa árvore de Merkle concorrente on-chain. Os metadados legíveis moram no índice de um provedor de DAS, que é exatamente por que a próxima lição precisa de um RPC com DAS para ler um crate de volta."  # @src=a65076b4d6af
            options:                 # source order — keep it
              a:
                # | The crate's data is hashed into a leaf of the Merkle tree; the full
                # | metadata is reconstructable only from an RPC provider's off-chain index,
                # | not from any account on-chain.
                label: "Os dados do crate são hasheados numa folha da árvore de Merkle; os metadados completos são reconstruíveis só a partir do índice off-chain de um provedor de RPC, não a partir de qualquer conta on-chain."  # @src=a96fd315caf2
                # | Thirty-two bytes in a slot is the entire on-chain footprint. Everything
                # | a wallet renders was rebuilt by somebody who was watching when the mint
                # | landed.
                feedback: "Trinta e dois bytes num slot são a pegada on-chain inteira. Tudo o que uma carteira renderiza foi reconstruído por alguém que estava olhando quando o mint caiu."  # @src=28e6356a087f
              b:
                # | Each cNFT owns a 165-byte account holding its metadata, the same layout
                # | as a Token-2022 mint account.
                label: "Cada cNFT é dono de uma conta de 165 bytes guardando os metadados dele, o mesmo layout de uma conta de mint Token-2022."  # @src=db3c9250d1d4
                # | That's an SPL token account layout. Compression's whole point is that no
                # | per-asset account exists; only a leaf hash sits in the tree.
                feedback: "Esse é um layout de conta de token SPL. O ponto inteiro da compressão é que não existe conta por ativo; só um hash de folha fica na árvore."  # @src=6110f6483d72
              c:
                # | The metadata is stored inside the Core collection account the tree
                # | belongs to, one record per member crate.
                label: "Os metadados são guardados dentro da conta de coleção Core à qual a árvore pertence, um registro por crate membro."  # @src=c6feee96ce1d
                # | The Core collection verifies membership and holds collection-level
                # | plugins, but it does not store each cNFT's metadata; the leaf hash does.
                feedback: "A coleção Core verifica a filiação e guarda plugins no nível da coleção, mas ela não guarda os metadados de cada cNFT; o hash da folha guarda."  # @src=a48d15bb74ae
              d:
                # | The full metadata sits in the transaction logs the Noop program wrote at
                # | mint, so any RPC can replay that crate's mint against the tree and
                # | reconstruct it.
                label: "Os metadados completos ficam nos logs de transação que o programa Noop escreveu no mint, então qualquer RPC consegue reproduzir o mint daquele crate contra a árvore e reconstruir eles."  # @src=058b84a3cd64
                # | Those logs are why an indexer can rebuild the crate, and they are also
                # | why you need the indexer: logs are transaction output, not queryable
                # | state, and no RPC keeps them forever.
                feedback: "Esses logs são por que um indexador consegue reconstruir o crate, e são também por que você precisa do indexador: logs são saída de transação, não estado consultável, e nenhum RPC guarda eles para sempre."  # @src=43bf17768f00
          q2:
            # | You need roughly one million Harvest crates. A colleague reads the vendor's
            # | ~8.5 SOL figure and budgets 8.5 SOL per crate. What should you tell them?
            prompt: "Você precisa de mais ou menos um milhão de crates Harvest. Um colega lê a figura de ~8.5 SOL do fornecedor e orça 8.5 SOL por crate. O que você deveria dizer para ele?"  # @src=3303c7c02b15
            # | Cost is a property of the tree's depth/buffer/canopy, derived once for the
            # | whole supply, not paid per asset. Vendor figures put ~1M cNFTs at ~8.5 SOL
            # | total and a 16,384-leaf tree at ~0.34 SOL; both were quoted at 6,960
            # | lamports/byte, and SIMD-0437 has since cut that rate, so derive the SOL from
            # | the byte count on your own cluster and treat the vendor number as a sanity
            # | check rather than a quote.
            explanation: "O custo é uma propriedade da profundidade/buffer/canopy da árvore, derivado uma vez para o supply inteiro, não pago por ativo. As figuras do fornecedor põem ~1M de cNFTs em ~8.5 SOL no total e uma árvore de 16,384 folhas em ~0.34 SOL; as duas foram cotadas a 6,960 lamports/byte, e o SIMD-0437 desde então cortou essa taxa, então derive o SOL a partir da contagem de bytes no seu próprio cluster e trate o número do fornecedor como uma checagem de sanidade e não como uma cotação."  # @src=76c253fdbee3
            options:                 # source order — keep it
              c:
                # | About 0.34 SOL flat, the fixed cost of any Bubblegum v2 tree regardless
                # | of depth.
                label: "Uns 0.34 SOL fixos, o custo fixo de qualquer árvore Bubblegum v2 independente da profundidade."  # @src=e198c04e3fd2
                # | 0.34 SOL is the cost of a 16,384-leaf tree specifically; tree cost
                # | scales with depth, buffer, and canopy. It is not a flat fee.
                feedback: "0.34 SOL é o custo de uma árvore de 16,384 folhas especificamente; o custo da árvore escala com profundidade, buffer e canopy. Não é uma taxa fixa."  # @src=3506f94e9a22
              a:
                # | 8.5 SOL per crate is right, because each compressed mint provisions its
                # | own full account.
                label: "8.5 SOL por crate está certo, porque cada mint comprimido provisiona a própria conta completa dele."  # @src=511cc04f66da
                # | The vendor's 8.5 SOL is the total for ~1M cNFTs, not per-asset; each
                # | works out to a few millionths of a SOL.
                feedback: "Os 8.5 SOL do fornecedor são o total para ~1M de cNFTs, não por ativo; cada um dá alguns milionésimos de um SOL."  # @src=7730e394d0ce
              b:
                # | Single-digit SOL for the whole tree of ~1M leaves, a few millionths of a
                # | SOL per cNFT.
                label: "SOL de um dígito para a árvore inteira de ~1M de folhas, alguns milionésimos de um SOL por cNFT."  # @src=8b54bafbfa76
                # | The per-crate figure is that one bill divided by the leaf count, which
                # | is why it falls as the tree fills rather than being charged again.
                feedback: "A figura por crate é aquele custo único dividido pela contagem de folhas, que é por que ela cai conforme a árvore enche em vez de ser cobrada de novo."  # @src=c1e317de09a1
              d:
                # | About 8.5 SOL for the tree, and then a few millionths of rent per crate
                # | as the leaves fill.
                label: "Uns 8.5 SOL pela árvore, e depois alguns milionésimos de rent por crate conforme as folhas enchem."  # @src=9965cee9579b
                # | A leaf costs no rent at all: the tree account is the same size empty or
                # | full, which is the whole reason depth is nearly free and canopy is not.
                feedback: "Uma folha não custa rent nenhum: a conta da árvore tem o mesmo tamanho vazia ou cheia, que é a razão inteira de profundidade ser quase de graça e canopy não ser."  # @src=f44e98c0e635
          q3:
            # | You want the Founding-Farmer achievement crate to be non-transferable.
            # | Someone insists cNFTs can never be soulbound. What's the correct move in
            # | Bubblegum v2?
            prompt: "Você quer que o crate de conquista Founding-Farmer seja não transferível. Alguém insiste que cNFTs nunca podem ser soulbound. Qual é a jogada certa no Bubblegum v2?"  # @src=b0d2950b2e1b
            # | Bubblegum v2's set_non_transferable_v2, combined with a
            # | PermanentFreezeDelegate on the Core collection, produces genuinely soulbound
            # | cNFTs, the reversal of 2024-era folklore that compression couldn't do freeze
            # | or soulbound.
            explanation: "O set_non_transferable_v2 do Bubblegum v2, combinado com um PermanentFreezeDelegate na coleção Core, produz cNFTs genuinamente soulbound, a reversão do folclore da era 2024 de que a compressão não conseguia fazer congelamento nem soulbound."  # @src=674fc76a5418
            options:                 # source order — keep it
              b:
                # | Move the crate into a V1 tree, which enforces immutability at the leaf
                # | level.
                label: "Mova o crate para uma árvore V1, que impõe imutabilidade no nível da folha."  # @src=af1577162699
                # | V2 trees are not backward-compatible with V1 leaves, and immutability
                # | isn't a V1 feature; use set_non_transferable_v2 plus a collection
                # | PermanentFreezeDelegate.
                feedback: "Árvores V2 não são retrocompatíveis com folhas V1, e imutabilidade não é uma feature da V1; use set_non_transferable_v2 mais um PermanentFreezeDelegate de coleção."  # @src=f9149c55edaa
              c:
                # | Use set_non_transferable_v2 (with a collection-level
                # | PermanentFreezeDelegate) to make the cNFT soulbound.
                label: "Use set_non_transferable_v2 (com um PermanentFreezeDelegate no nível da coleção) para tornar o cNFT soulbound."  # @src=f3158d520f1d
                # | Soulbound is bit 2 of the v2 leaf's flags byte, and the collection's
                # | permanent freeze delegate is what authorizes the signer to set it.
                feedback: "Soulbound é o bit 2 do byte de flags da folha v2, e o delegado de congelamento permanente da coleção é o que autoriza o signer a setar ele."  # @src=db8b0b297702
              d:
                # | Call freeze_v2 on the leaf, because freezing is how v2 spells soulbound
                # | and there is no separate flag for it.
                label: "Chame freeze_v2 na folha, porque congelar é como a v2 escreve soulbound e não existe uma flag separada para isso."  # @src=ef529d186b75
                # | Freeze and non-transferable are different bits in the same flags byte,
                # | and freeze has a thaw_v2 to undo it. A frozen crate is parked, not
                # | welded.
                feedback: "Congelamento e não transferível são bits diferentes no mesmo byte de flags, e congelamento tem um thaw_v2 para desfazer. Um crate congelado está estacionado, não soldado."  # @src=656d804cca56
              a:
                # | They're right: mint a Token-2022 NonTransferable mint instead, because
                # | cNFTs are always freely transferable.
                label: "Eles estão certos: cunhe um mint NonTransferable de Token-2022 em vez disso, porque cNFTs são sempre livremente transferíveis."  # @src=a03b1592ccca
                # | That was true in the V1 era, but Bubblegum v2 added
                # | set_non_transferable_v2; a cNFT can be soulbound now.
                feedback: "Isso era verdade na era V1, mas o Bubblegum v2 adicionou set_non_transferable_v2; um cNFT pode ser soulbound agora."  # @src=56ef396cac0c
  m07-l2-reading-assets-das:
    # | Read anything: one DAS script for fungibles, Core assets, and cNFTs
    title: "Leia qualquer coisa: um script DAS para fungíveis, ativos Core e cNFTs"  # @src=89473fc3f4a3
    blocks:
      classify-das-asset:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The NFT interfaces include MplCoreAsset, MplBubblegumV2, V1_NFT,
          # | ProgrammableNFT; the fungible ones are FungibleAsset and FungibleToken.
          0: "As interfaces de NFT incluem MplCoreAsset, MplBubblegumV2, V1_NFT, ProgrammableNFT; as fungíveis são FungibleAsset e FungibleToken."  # @src=994bdaaa7d5b
          # | compressed is asset.compression?.compressed === true, and a compressed NFT is
          # | the only case that requires a DAS RPC.
          1: "compressed é asset.compression?.compressed === true, e um NFT comprimido é o único caso que exige um RPC DAS."  # @src=2dc1c1ca50e9
          # | Price lives at asset.token_info?.price_info?.price_per_token; default it to
          # | null when absent.
          2: "O preço mora em asset.token_info?.price_info?.price_per_token; use null como default quando ele estiver ausente."  # @src=cd5a65dd77dd
        tests:                      # keyed by test case id
          t1:
            # | a Bubblegum v2 cNFT is a compressed NFT and can only be read via a DAS RPC
            description: "um cNFT Bubblegum v2 é um NFT comprimido e só pode ser lido via um RPC DAS"  # @src=811fc5fc077f
          t2:
            # | a Metaplex Core asset is a plain NFT, no DAS-only requirement
            description: "um ativo Metaplex Core é um NFT simples, sem exigência de DAS exclusivo"  # @src=01bc768f5b0a
          t3:
            # | a fungible token surfaces its price from token_info.price_info
            description: "um token fungível traz o preço dele à tona a partir de token_info.price_info"  # @src=22ecbf2ec7ad
          t4:
            # | a legacy NFT still classifies as an NFT
            description: "um NFT legado ainda classifica como um NFT"  # @src=57ee7a02efc8
          t5:
            # | a fungible asset with no price info returns a null price
            description: "um ativo fungível sem price info devolve um preço null"  # @src=2657624c8c1a
      check:                      # quiz
        questions:
          q1:
            # | read-any-asset.ts resolves SPROUT with getAccountInfo-equivalent ease, but
            # | the Harvest crate REQUIRED a DAS-supporting RPC. Why the asymmetry?
            prompt: "read-any-asset.ts resolve o SPROUT com uma facilidade equivalente a getAccountInfo, mas o crate Harvest EXIGIU um RPC com suporte a DAS. Por que a assimetria?"  # @src=a10a97ccf4dd
            # | A compressed NFT is only a leaf hash in a tree; its readable data lives in a
            # | DAS provider's index. Regular mints and Core assets are real accounts, so
            # | any RPC returns them; only cNFTs force a DAS RPC.
            explanation: "Um NFT comprimido é só um hash de folha em uma árvore; os dados legíveis dele vivem no índice de um provedor de DAS. Mints comuns e ativos Core são contas reais, então qualquer RPC devolve eles; só cNFTs forçam um RPC DAS."  # @src=3e64d67d5541
            options:                 # source order — keep it
              a:
                # | A cNFT has no on-chain account of its own: its data lives in the
                # | provider's index, so only a DAS RPC can reconstruct it; SPROUT's mint is
                # | a real account any RPC returns.
                label: "Um cNFT não tem conta on-chain própria: os dados dele vivem no índice do provedor, então só um RPC DAS consegue reconstruir ele; o mint do SPROUT é uma conta real que qualquer RPC devolve."  # @src=5a2cc292dbab
                # | Storage decides the read path, which is why the classifier tracks
                # | compression.compressed rather than the interface name.
                feedback: "O armazenamento decide o caminho de leitura, e é por isso que o classificador acompanha compression.compressed em vez do nome da interface."  # @src=eae719895268
              c:
                # | getAccountInfo is rate-limited for collectibles, so DAS is the only
                # | supported way to read any NFT at any real scale.
                label: "getAccountInfo tem rate limit para colecionáveis, então DAS é o único jeito suportado de ler qualquer NFT em qualquer escala real."  # @src=e83be15e64ee
                # | It's not a rate-limit issue, and regular NFTs read fine without DAS; a
                # | cNFT simply has no standalone account to fetch.
                feedback: "Não é uma questão de rate limit, e NFTs comuns leem bem sem DAS; um cNFT simplesmente não tem conta autônoma para buscar."  # @src=6efa8500df3a
              b:
                # | DAS RPCs are required for any Token-2022 mint: the TLV extension records
                # | live in the provider's off-chain index rather than in the base 82-byte
                # | mint layout, so getAccountInfo cannot see them.
                label: "RPCs DAS são exigidos para qualquer mint Token-2022: os registros de extensão TLV vivem no índice off-chain do provedor em vez de no layout base de 82 bytes do mint, então getAccountInfo não consegue ver eles."  # @src=bc151fc2e221
                # | getAccountInfo returns a Token-2022 mint with its TLV extensions fine;
                # | the DAS requirement is specific to compressed assets, not extensions.
                feedback: "getAccountInfo devolve um mint Token-2022 com as extensões TLV dele sem problema; a exigência de DAS é específica de ativos comprimidos, não de extensões."  # @src=1776f1125616
              d:
                # | DAS is the NFT read path while getAccountInfo is the fungible one, so
                # | the crate needs a DAS provider and SPROUT does not.
                label: "DAS é o caminho de leitura de NFT enquanto getAccountInfo é o de fungível, então o crate precisa de um provedor de DAS e o SPROUT não."  # @src=e77ba96e8128
                # | Your Almanac asset is an NFT and an ordinary account, read either way.
                # | The split is storage, not standard, which is why the flag is called
                # | compressed.
                feedback: "O seu ativo do Almanac é um NFT e uma conta comum, lida dos dois jeitos. A divisão é armazenamento, não padrão, e é por isso que a flag se chama compressed."  # @src=eea992e04da0
          q2:
            # | You point getAssetsByCreator at a pump.fun mint's creator and get an empty
            # | list, even though the token clearly exists and trades. What's happening, and
            # | the fix?
            prompt: "Você aponta getAssetsByCreator para o criador de um mint da pump.fun e recebe uma lista vazia, mesmo com o token claramente existindo e sendo negociado. O que está acontecendo, e a correção?"  # @src=b8218e519f5f
            # | pump.fun leaves the Metaplex creators array unpopulated, so creator-keyed
            # | queries come back empty. The practitioner fix is to index by authority or
            # | subscribe to the program, a gotcha you only hit once.
            explanation: "A pump.fun deixa o array creators da Metaplex sem preencher, então consultas chaveadas por criador voltam vazias. A correção do praticante é indexar por autoridade ou assinar o programa, uma pegadinha em que você só esbarra uma vez."  # @src=871148e3d50b
            options:                 # source order — keep it
              d:
                # | The creators are present but unverified, so getAssetsByCreator returns
                # | an empty list; re-run it with the verified filter off.
                label: "Os creators estão presentes mas não verificados, então getAssetsByCreator devolve uma lista vazia; rode de novo com o filtro de verificado desligado."  # @src=4b3e91099925
                # | There is no unverified entry hiding behind a filter. The array has zero
                # | entries, which the probe prints for you before any query goes out.
                feedback: "Não existe entrada não verificada escondida atrás de um filtro. O array tem zero entradas, que é o que a sonda imprime para você antes de qualquer consulta sair."  # @src=0da3744a709f
              b:
                # | pump.fun mints don't populate the Metaplex creators array, so the query
                # | has nothing to match; key on the update authority instead.
                label: "Mints da pump.fun não preenchem o array creators da Metaplex, então a consulta não tem nada para casar; chaveie pela autoridade de atualização em vez disso."  # @src=1844930aa295
                # | The probe prints creators: 0 before it runs a single query, which is the
                # | whole diagnosis. Check that your assets populate a key before you build
                # | a feature on it.
                feedback: "A sonda imprime creators: 0 antes de rodar uma única consulta, que é o diagnóstico inteiro. Confira que os seus ativos preenchem uma chave antes de construir uma feature sobre ela."  # @src=291aae6012fa
              a:
                # | The mint is compressed, so creator-keyed queries never reach it; switch
                # | to getAssetProof, which is the read path for anything the index holds as
                # | a leaf.
                label: "O mint é comprimido, então consultas chaveadas por criador nunca alcançam ele; troque para getAssetProof, que é o caminho de leitura de qualquer coisa que o índice guarda como folha."  # @src=5f8557656d99
                # | It isn't about compression, and getAssetProof fetches a Merkle proof for
                # | a compressed asset, not owner/creator listings.
                feedback: "Não é sobre compressão, e getAssetProof busca uma prova de Merkle de um ativo comprimido, não listagens de dono/criador."  # @src=a860dd658542
              c:
                # | DAS caches its creator indexes for up to 600 seconds, the same window
                # | that caches price_info, so wait for the refresh and retry the query.
                label: "O DAS mantém em cache os índices de criador dele por até 600 segundos, a mesma janela que faz cache de price_info, então espere a atualização e tente a consulta de novo."  # @src=07fd7194b3f5
                # | The ~600s cache is the price_info TTL, not creator indexing; the
                # | creators array is genuinely empty for pump mints, so waiting changes
                # | nothing.
                feedback: "O cache de ~600s é o TTL de price_info, não a indexação de criador; o array creators é genuinamente vazio para mints da pump, então esperar não muda nada."  # @src=67b368f80592
          q3:
            # | Your dashboard needs SPROUT's live USD price next to holdings, and a
            # | teammate wants to bolt on a second price API. Given what read-any-asset.ts
            # | already does, the cheapest correct move is:
            prompt: "O seu dashboard precisa do preço ao vivo do SPROUT em USD ao lado das posições, e um colega de equipe quer parafusar uma segunda API de preço. Dado o que read-any-asset.ts já faz, a jogada correta mais barata é:"  # @src=c6f8e8c9d8be
            # | DAS is the fungible + price API too: getAsset with showFungible returns
            # | token_info.price_info for top tokens, including Token-2022 mints. Your
            # | reader already speaks DAS, so the price is one flag away; no second provider
            # | is needed.
            explanation: "O DAS também é a API de fungível + preço: getAsset com showFungible devolve token_info.price_info para os tokens do topo, incluindo mints Token-2022. O seu leitor já fala DAS, então o preço está a uma flag de distância; nenhum segundo provedor é necessário."  # @src=6f91d7b41e6c
            options:                 # source order — keep it
              c:
                # | Call getAsset with showFungible and read
                # | token_info.price_info.price_per_token; DAS serves it.
                label: "Chame getAsset com showFungible e leia token_info.price_info.price_per_token; o DAS serve isso."  # @src=c3224d3cc41d
                # | One flag on a call your reader already makes. Render a dash when
                # | price_info is absent, because a token outside the priced slice is the
                # | normal case, not an error.
                feedback: "Uma flag em uma chamada que o seu leitor já faz. Renderize um traço quando price_info estiver ausente, porque um token fora da fatia precificada é o caso normal, não um erro."  # @src=50a03201a14e
              b:
                # | Call getAssetProof with showFungible so the returned proof carries a
                # | price attestation alongside the balance.
                label: "Chame getAssetProof com showFungible para que a prova devolvida carregue uma atestação de preço junto com o saldo."  # @src=3ff674ed162d
                # | getAssetProof returns a Merkle proof for compressed assets; price comes
                # | from getAsset's showFungible, not from a proof call.
                feedback: "getAssetProof devolve uma prova de Merkle de ativos comprimidos; o preço vem do showFungible do getAsset, não de uma chamada de prova."  # @src=07a3b94a7eda
              a:
                # | Add a CoinGecko fetch keyed by mint address, since DAS covers NFTs and
                # | collections but leaves fungible pricing to market-data providers.
                label: "Adicione um fetch da CoinGecko chaveado pelo endereço do mint, já que o DAS cobre NFTs e coleções mas deixa a precificação de fungíveis para provedores de dados de mercado."  # @src=500a70baf6e4
                # | DAS did become the fungible + price API: getAsset with showFungible
                # | returns token_info.price_info for top tokens, so no second API is
                # | needed.
                feedback: "O DAS de fato virou a API de fungível + preço: getAsset com showFungible devolve token_info.price_info para os tokens do topo, então nenhuma segunda API é necessária."  # @src=b987d54c1dc1
              d:
                # | Point the same getAsset call at devnet and read price_per_token: SPROUT
                # | already resolves there, so the price arrives too.
                label: "Aponte a mesma chamada getAsset para a devnet e leia price_per_token: o SPROUT já resolve lá, então o preço chega também."  # @src=4a4deb912e3b
                # | Resolving and being priced are different things. The priced set is a
                # | mainnet slice ranked by 24h volume, which is why the lab probes PYUSD on
                # | mainnet to see the field populated at all.
                feedback: "Resolvida e precificada são coisas diferentes. O conjunto precificado é uma fatia de mainnet ranqueada por volume de 24h, e é por isso que o lab sonda o PYUSD na mainnet para sequer ver o campo preenchido."  # @src=cbc3c3ead892
  m07-l3-zk-compression-frontier:
    # | ZK compression and the Light Token frontier: when NOT to compress
    title: "Compressão ZK e a fronteira do Light Token: quando NÃO comprimir"  # @src=38eaefc8431e
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Overgrowth has to decide which of its state compresses. Select the three
            # | workload shapes this lesson rules out for compression.
            prompt: "A Overgrowth tem que decidir qual parte do estado dela comprime. Selecione os três formatos de carga de trabalho que esta lição descarta para compressão."  # @src=594ef6d4d8d4
            # | Two variables decide it: lifetime writes and bytes per access. Three shapes
            # | lose on them, and the lesson names each one: write-heavy accounts,
            # | same-block repeated updates, and accesses past roughly 1 KB. Holder count is
            # | not on that list, because a tree scales to holders happily, and tradeability
            # | is not either, because decompression is a first-class door. The shape that
            # | wins is state created once, written once or twice, and held by an enormous
            # | number of distinct owners.
            explanation: "Duas variáveis decidem: escritas ao longo da vida e bytes por acesso. Três formatos perdem nelas, e a lição nomeia cada um: contas com muita escrita, atualizações repetidas no mesmo bloco e acessos acima de mais ou menos 1 KB. A contagem de holders não está nessa lista, porque uma árvore escala para holders numa boa, e a negociabilidade também não está, porque a descompressão é uma porta de primeira classe. O formato que ganha é estado criado uma vez, escrito uma ou duas vezes e mantido por um número enorme de donos distintos."  # @src=5ce6852ed7bf
            options:                 # source order — keep it
              c:
                # | Balances that must stay tradeable on a router like Jupiter, because a
                # | compressed balance cannot be decompressed back.
                label: "Saldos que precisam continuar negociáveis em um roteador como a Jupiter, porque um saldo comprimido não pode ser descomprimido de volta."  # @src=3164a555c4b3
                # | Decompression is first-class: you decompress, then you route. The round
                # | trip is the design, and it puts the cost on the holders who actually
                # | showed up.
                feedback: "A descompressão é de primeira classe: você descomprime e depois roteia. A ida e volta é o design, e ela põe o custo sobre os holders que de fato apareceram."  # @src=258b4d7385e2
              a:
                # | An in-game currency ledger debited on every craft, far past the
                # | few-hundred-lifetime-write band.
                label: "Um livro-razão de moeda dentro do jogo debitado a cada craft, bem além da faixa de algumas centenas de escritas ao longo da vida."  # @src=f4672227628f
                # | Write-heavy state is the first losing shape. Past the break-even the
                # | compressed path costs more lamports AND roughly 3,800 times the compute,
                # | forever.
                feedback: "Estado com muita escrita é o primeiro formato perdedor. Passando do break-even o caminho comprimido custa mais lamports E cerca de 3,800 vezes o compute, para sempre."  # @src=6542962b311a
              e:
                # | An AMM pool's state, rewritten several times inside one block by people
                # | who are not you.
                label: "O estado de uma pool de AMM, reescrito várias vezes dentro de um bloco por gente que não é você."  # @src=2424a9bcc70a
                # | The second losing shape, and it is worse than expensive. Every competing
                # | write moves the root, so your proof is stale before the transaction
                # | reaches the leader.
                feedback: "O segundo formato perdedor, e é pior do que caro. Toda escrita concorrente move a raiz, então a sua prova já está velha antes de a transação chegar no leader."  # @src=f456de4a1194
              b:
                # | A holder list past ~16,384 wallets, since a state tree cannot hold more
                # | leaves than that.
                label: "Uma lista de holders acima de ~16,384 carteiras, já que uma árvore de estado não consegue guardar mais folhas que isso."  # @src=ba180a774500
                # | Trees scale far past 16,384 (that's just one example size), and a tree
                # | scales to holders happily. Holder count is the axis people reach for and
                # | it is the wrong one.
                feedback: "Árvores escalam bem além de 16,384 (isso é só um tamanho de exemplo), e uma árvore escala para holders numa boa. A contagem de holders é o eixo que as pessoas procuram e é o errado."  # @src=a2e5c4df8491
              d:
                # | Balances a dashboard reads constantly, because each read has to pull a
                # | fresh 128-byte validity proof from Photon.
                label: "Saldos que um dashboard lê o tempo todo, porque cada leitura tem que puxar uma prova de validade de 128 bytes fresca do Photon."  # @src=eb8c388b3f46
                # | The proof is a write-path artifact, there so the program can be
                # | convinced your leaf was in the tree. Reads are an index query, and
                # | reading a lot is what this rail is best at.
                feedback: "A prova é um artefato do caminho de escrita, ela existe para que o programa possa se convencer de que a sua folha estava na árvore. As leituras são uma consulta ao índice, e ler muito é no que este trilho é melhor."  # @src=3629609611ee
              f:
                # | A four-kilobyte recipe blob, well past the roughly
                # | one-kilobyte-per-access line the guidance draws.
                label: "Um blob de receita de quatro kilobytes, bem além da linha de mais ou menos um kilobyte por acesso que a orientação traça."  # @src=688416cdf889
                # | The third losing shape. Past about 1 KB per access the read and hashing
                # | cost of moving that blob through the machinery outweighs the rent you
                # | saved.
                feedback: "O terceiro formato perdedor. Passando de cerca de 1 KB por acesso o custo de leitura e de hash de mover esse blob pela maquinaria supera o rent que você economizou."  # @src=8b0bba8a4c9b
          q2:
            # | Contrast the proofs behind your Harvest-crate cNFTs with Light's
            # | ZK-compression proofs. What actually differs?
            prompt: "Contraste as provas por trás dos seus cNFTs de Harvest-crate com as provas de compressão ZK da Light. O que de fato difere?"  # @src=4dad02df4ae1
            # | Bubblegum is NFT-specific plain Merkle proofs whose length grows with depth
            # | (canopy trades rent for shorter client proofs). ZK compression generalizes
            # | to accounts/tokens/PDAs with constant 128-byte Groth16 validity proofs and a
            # | different hash function (not built on SPL account-compression).
            explanation: "O Bubblegum são provas de Merkle simples específicas de NFT cujo comprimento cresce com a profundidade (o canopy troca rent por provas de cliente mais curtas). A compressão ZK generaliza para contas/tokens/PDAs com provas de validade Groth16 de 128 bytes constantes e uma função de hash diferente (não construída sobre o SPL account-compression)."  # @src=8988346718d5
            options:                 # source order — keep it
              a:
                # | Both rails verify every write with the same constant-size Groth16 proof;
                # | the only difference is scope, since Bubblegum limits its leaves to NFT
                # | metadata while Light generalizes to token accounts and PDAs.
                label: "Os dois trilhos verificam toda escrita com a mesma prova Groth16 de tamanho constante; a única diferença é o escopo, já que o Bubblegum limita as folhas dele a metadados de NFT enquanto a Light generaliza para contas de token e PDAs."  # @src=c2c0ffb65631
                # | Bubblegum uses plain Merkle proofs that GROW with tree depth; only ZK
                # | compression uses constant 128-byte validity proofs.
                feedback: "O Bubblegum usa provas de Merkle simples que CRESCEM com a profundidade da árvore; só a compressão ZK usa provas de validade de 128 bytes constantes."  # @src=ab0a060586aa
              b:
                # | Bubblegum uses plain Merkle proofs that grow with tree depth; ZK
                # | compression uses constant 128-byte Groth16 validity proofs over
                # | generalized accounts.
                label: "O Bubblegum usa provas de Merkle simples que crescem com a profundidade da árvore; a compressão ZK usa provas de validade Groth16 de 128 bytes constantes sobre contas generalizadas."  # @src=a5aa0d7c74da
                # | Size is the tell. A transcript gets thicker with the history it
                # | recounts; a succinct proof is a statement about the computation, so a
                # | deeper tree changes nothing.
                feedback: "O tamanho é a pista. Uma transcrição fica mais grossa com o histórico que ela reconta; uma prova sucinta é uma declaração sobre a computação, então uma árvore mais profunda não muda nada."  # @src=a61cd5b5f45f
              d:
                # | Bubblegum verifies its proofs on chain, while ZK compression trusts
                # | Photon's prover to verify them off chain, which is why they stay 128
                # | bytes.
                label: "O Bubblegum verifica as provas dele on-chain, enquanto a compressão ZK confia no prover do Photon para verificá-las off-chain, que é por isso que elas ficam em 128 bytes."  # @src=de74ef0f56de
                # | The prover runs off chain and produces the proof; the program still
                # | checks it on chain. Constant size comes from succinctness, not from
                # | anybody being trusted.
                feedback: "O prover roda off-chain e produz a prova; o programa ainda a verifica on-chain. O tamanho constante vem de a prova ser sucinta, não de alguém ser confiável."  # @src=230abefef4f4
              c:
                # | Bubblegum stores full accounts on-chain while ZK compression stores only
                # | their hashes; the two proof formats are otherwise identical.
                label: "O Bubblegum guarda contas inteiras on-chain enquanto a compressão ZK guarda só os hashes delas; fora isso os dois formatos de prova são idênticos."  # @src=6c65bdbcd84d
                # | Neither stores full per-asset accounts on-chain; both store hashes. The
                # | proof mechanism (growing Merkle vs constant validity) is the difference,
                # | not the storage model.
                feedback: "Nenhum dos dois guarda contas inteiras por ativo on-chain; os dois guardam hashes. O mecanismo de prova (Merkle que cresce vs validade constante) é a diferença, não o modelo de armazenamento."  # @src=03931902b9ae
          q3:
            # | A teammate says 'let's ship Overgrowth's currency on the Light Token Program
            # | today; it's the new compressed-token default.' What's the accurate
            # | correction?
            prompt: "Um colega de equipe diz 'vamos entregar a moeda da Overgrowth no Light Token Program hoje; é o novo default de token comprimido.' Qual é a correção correta?"  # @src=d97d28134948
            # | Hold the 'default flipped' framing up to the sources and it falls apart:
            # | Light Token runs on devnet only, publishes no hot-path CU figure, and no doc
            # | names it the default. The supported compressed-token rail remains current;
            # | Light Token is a promising direction, not today's production choice.
            explanation: "Ponha o enquadramento do 'default virou' contra as fontes e ele desmorona: o Light Token roda só na devnet, não publica nenhum número de CU do caminho quente, e nenhum documento o nomeia como o default. O trilho de tokens comprimidos com suporte continua sendo o atual; o Light Token é uma direção promissora, não a escolha de produção de hoje."  # @src=260134c4d88e
            options:                 # source order — keep it
              b:
                # | Light Token is mainnet-live but scoped to distribution flows only (the
                # | Claim and WithdrawFundingPool primitives), so it's the right rail for
                # | the compost drop and nothing else.
                label: "O Light Token está no ar na mainnet mas é limitado só a fluxos de distribuição (as primitivas Claim e WithdrawFundingPool), então é o trilho certo para o compost drop e nada mais."  # @src=b7ee5701f830
                # | It's devnet-only right now, and the airdrop-only framing is part of the
                # | same 'default flipped' story the sources don't support.
                feedback: "Ele é só de devnet agora, e o enquadramento de só airdrop é parte da mesma história do 'default virou' que as fontes não sustentam."  # @src=77a92ccd18e1
              c:
                # | Light Token is an emerging, devnet-only rail; the supported
                # | compressed-token path is still the current one. Treat it as a direction,
                # | not a default.
                label: "O Light Token é um trilho emergente e só de devnet; o caminho de tokens comprimidos com suporte ainda é o atual. Trate-o como uma direção, não como um default."  # @src=83cc86d590fb
                # | The claim that decides architecture is whether the rail is supported on
                # | the cluster you ship on, and it has an owner: the protocol's docs and
                # | its own deployments, with a date beside them.
                feedback: "A afirmação que decide a arquitetura é se o trilho tem suporte no cluster em que você entrega, e ela tem um dono: a documentação do protocolo e os próprios deploys dele, com uma data ao lado."  # @src=046e546a6898
              a:
                # | Correct: Light Token has replaced compressed tokens as the mainnet
                # | default, so start migrating the currency now.
                label: "Correto: o Light Token substituiu os tokens comprimidos como o default da mainnet, então comece a migrar a moeda agora."  # @src=09ff747f880c
                # | No doc positions Light Token as the default, and it isn't on mainnet;
                # | check the sources and this claim falls apart.
                feedback: "Nenhum documento posiciona o Light Token como o default, e ele não está na mainnet; confira as fontes e essa afirmação desmorona."  # @src=7840e2a93322
              d:
                # | Not today, and the reason is compute: Light Token's Pinocchio hot path
                # | costs far more CU per transfer than the compressed-token program you
                # | would be migrating away from.
                label: "Hoje não, e o motivo é compute: o caminho quente em Pinocchio do Light Token custa muito mais CU por transferência do que o programa de tokens comprimidos do qual você estaria migrando."  # @src=23c3e61c8022
                # | Right verdict, invented evidence. No CU figure for that path is
                # | published anywhere, and a number with no source on a program this young
                # | is a number somebody made up.
                feedback: "Veredicto certo, evidência inventada. Nenhum número de CU para esse caminho é publicado em lugar nenhum, e um número sem fonte em um programa tão novo é um número que alguém inventou."  # @src=670abd73c601
  m08-l1-bonding-curves-graduation:
    # | Bonding curves & graduation: pump.fun from constants
    title: "Bonding curves & graduação: pump.fun a partir de constantes"  # @src=d6dd412875ab
    blocks:
      graduation-threshold:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | k = virtualSolReserves × virtualTokenReserves is held constant across the
          # | whole curve.
          0: "k = virtualSolReserves × virtualTokenReserves é mantido constante ao longo da curva inteira."  # @src=d2dd4196c62c
          # | Graduation drains the real reserve, so the final virtual token reserve is
          # | virtualTokenReserves − realTokenReserves.
          1: "A graduação drena a reserva real, então a reserva virtual final de token é virtualTokenReserves − realTokenReserves."  # @src=c84a435f80ed
          # | SOL added = k / finalVirtualToken − virtualSolReserves.
          2: "SOL adicionado = k / finalVirtualToken − virtualSolReserves."  # @src=52de63887b61
        tests:                      # keyed by test case id
          t1-pump-constants:
            # | pump.fun's first-party constants graduate at ~85 SOL, derived from the
            # | invariant: not the ~22 SOL the opening-price sum gives.
            description: "As constantes de primeira mão da pump.fun graduam em ~85 SOL, derivados da invariante: não os ~22 SOL que a soma pelo preço de abertura dá."  # @src=ea542a670cf1
          t2-round-curve:
            # | 30*1000/(1000-800) - 30 = 120: draining 80% of the token reserve takes the
            # | SOL reserve from 30 to 150; the threshold is the 120 SOL added (4x the
            # | initial reserve).
            description: "30*1000/(1000-800) - 30 = 120: drenar 80% da reserva de token leva a reserva de SOL de 30 para 150; o limiar são os 120 SOL adicionados (4x a reserva inicial)."  # @src=46732d69d630
          t3-deeper-sol-reserve:
            # | A deeper starting SOL reserve raises the graduation cost proportionally
            # | along the same curve shape.
            description: "Uma reserva inicial de SOL mais funda eleva o custo de graduação proporcionalmente ao longo da mesma forma de curva."  # @src=71154e437b27
          t4-nothing-sellable:
            # | If no real tokens are sellable off the curve, zero SOL is needed to
            # | graduate: a sanity anchor the opening-price model also passes.
            description: "Se nenhum token real é vendável pela curva, zero SOL é necessário para graduar: uma âncora de sanidade que o modelo de preço de abertura também passa."  # @src=36b4cc0cd492
      check:                      # quiz
        questions:
          m08l1-q1-where-85-lives:
            # | A teammate hardcodes const GRADUATION_SOL = 85 in the launch config.
            # | Reviewing it, which statement is correct?
            prompt: "Um colega de equipe deixa const GRADUATION_SOL = 85 hardcoded na config de lançamento. Ao revisar, qual afirmação está correta?"  # @src=73b8e02e5b26
            # | Graduation is the point where the real token reserve hits zero. The SOL
            # | required is fixed by k = virtualSol × virtualToken and the final virtual
            # | token reserve (virtualToken − realToken). Hardcoding 85 hides that
            # | dependency: change the constants and the number moves. Derive it, do not
            # | memorize it.
            explanation: "A graduação é o ponto em que a reserva real de token chega a zero. O SOL exigido é fixado por k = virtualSol × virtualToken e pela reserva virtual final de token (virtualToken − realToken). Deixar 85 hardcoded esconde essa dependência: mude as constantes e o número se move. Derive, não memorize."  # @src=2df57b0adaef
            options:                 # source order — keep it
              b:
                # | 85 SOL is derived from the invariant on the published reserves, and
                # | moves when they move.
                label: "85 SOL são derivados da invariante sobre as reservas publicadas, e se movem quando elas se movem."  # @src=6bc26ee728ad
                # | Three constants and one invariant, and no 85 anywhere in the inputs.
                # | That is why the derivation survives a config change and a memorised
                # | number does not.
                feedback: "Três constantes e uma invariante, e nenhum 85 em lugar nenhum nas entradas. É por isso que a derivação sobrevive a uma mudança de config e um número memorizado não."  # @src=684fde4082c7
              c:
                # | 85 SOL is the flat 100-bps trading fee accumulated across every buy over
                # | the curve's whole lifetime.
                label: "85 SOL são a taxa de negociação fixa de 100 bps acumulada em toda compra ao longo da vida inteira da curva."  # @src=48c93cdbc711
                # | That conflates two unrelated quantities, trading fees and graduation
                # | liquidity. Fees route to recipients; graduation is about draining the
                # | real reserve.
                feedback: "Isso confunde duas quantidades sem relação, taxas de negociação e liquidez de graduação. Taxas são roteadas para destinatários; graduação é sobre drenar a reserva real."  # @src=db6308e19a7f
              a:
                # | 85 SOL is a graduation_target field stored in pump's BondingCurve
                # | account, read by the migrate instruction at graduation.
                label: "85 SOL são um campo graduation_target armazenado na conta BondingCurve da pump, lido pela instrução migrate na graduação."  # @src=d7100992e468
                # | No such field exists; the curve stores reserves, not a graduation price.
                # | The threshold is implied by those reserves, not stored.
                feedback: "Esse campo não existe; a curva armazena reservas, não um preço de graduação. O limiar está implícito naquelas reservas, não armazenado."  # @src=c93bdc1c6ded
              d:
                # | 85 SOL is the SOL equivalent of the market cap at which coins are
                # | observed to graduate, backed out from that observation.
                label: "85 SOL são o equivalente em SOL do market cap em que se observa moedas graduando, tirado de volta daquela observação."  # @src=dce3e6425f24
                # | That gets you roughly the right number, which is what makes it
                # | dangerous. It measures a population of launches, so it silently absorbs
                # | whatever fee era and curve config those launches ran under.
                feedback: "Isso te dá mais ou menos o número certo, e é isso que o torna perigoso. Mede uma população de lançamentos, então absorve em silêncio qualquer era de taxa e config de curva sob as quais aqueles lançamentos rodaram."  # @src=a781f42b4069
          m08l1-q2-alter-reserves:
            # | You alter a curve so realTokenReserves is a LARGER fraction of
            # | virtualTokenReserves. What happens to the graduation threshold?
            prompt: "Você altera uma curva para realTokenReserves ser uma fração MAIOR de virtualTokenReserves. O que acontece com o limiar de graduação?"  # @src=a9df0bd755f0
            # | finalVirtualSol = k / (virtualToken − realToken). A larger realToken shrinks
            # | the denominator, so finalVirtualSol grows and the SOL added to graduate
            # | rises. This is exactly why a flat opening-price estimate is wrong: the curve
            # | steepens as the reserve drains.
            explanation: "finalVirtualSol = k / (virtualToken − realToken). Um realToken maior encolhe o denominador, então finalVirtualSol cresce e o SOL adicionado para graduar sobe. É exatamente por isso que uma estimativa a preço de abertura fixo está errada: a curva fica mais íngreme conforme a reserva drena."  # @src=ef4f7e9fd99b
            options:                 # source order — keep it
              a:
                # | It falls, because a larger real reserve sells more of the supply at the
                # | cheap early prices near the curve's opening, shrinking the total SOL
                # | collected.
                label: "Cai, porque uma reserva real maior vende mais do supply nos preços baratos do começo, perto da abertura da curva, encolhendo o total de SOL arrecadado."  # @src=1c6c3b7b2bf1
                # | Early prices are cheap, but draining a larger fraction pushes further up
                # | the steepening curve; the final virtual SOL reserve rises, not falls.
                feedback: "Os preços do começo são baratos, mas drenar uma fração maior empurra mais para cima na curva que fica íngreme; a reserva virtual final de SOL sobe, não cai."  # @src=cd027f9a2203
              b:
                # | It stays 85 SOL; graduation is fixed by the program regardless of the
                # | virtual and real token reserve constants.
                label: "Fica em 85 SOL; a graduação é fixada pelo programa independentemente das constantes de reserva virtual e real de token."  # @src=ea01fe2c051d
                # | The threshold is a function of the constants, not a program-level
                # | constant; changing the reserves changes it.
                feedback: "O limiar é uma função das constantes, não uma constante no nível do programa; mudar as reservas o muda."  # @src=ec4b9b2c5ada
              d:
                # | Unchanged unless total supply moves too, since the graduation threshold
                # | tracks the share of the token reserve the curve may sell.
                label: "Inalterado a menos que o total supply se mova também, já que o limiar de graduação acompanha a parcela da reserva de token que a curva pode vender."  # @src=d448a8fc6737
                # | Total supply is the one published constant that never enters this
                # | arithmetic; it only prices the remainder the curve never offers. The
                # | threshold moves on the reserves alone.
                feedback: "O total supply é a única constante publicada que nunca entra nesta aritmética; ele só precifica o resto que a curva nunca oferece. O limiar se move apenas com as reservas."  # @src=a903bbba1961
              c:
                # | It rises: draining a larger fraction of the token reserve forces the
                # | final virtual SOL reserve higher.
                label: "Sobe: drenar uma fração maior da reserva de token força a reserva virtual final de SOL para cima."  # @src=37d4b953a42a
                # | Run the worked variant: 30 virtual SOL, 1B virtual tokens, 800M real
                # | tokens gives 120 SOL. Same formula, a 41% higher bar, no folklore.
                feedback: "Rode a variante trabalhada: 30 SOL virtuais, 1B de tokens virtuais, 800M de tokens reais dá 120 SOL. Mesma fórmula, uma barra 41% mais alta, sem folclore."  # @src=3467abbf6184
          m08l1-q3-migrate-twice:
            # | A pump.fun coin's complete flag flips and two bots both call migrate on the
            # | same curve. What is the outcome?
            prompt: "A flag complete de uma moeda pump.fun vira e dois bots chamam migrate na mesma curva. Qual é o resultado?"  # @src=090627f0a7a8
            # | pump's migrate is permissionless and idempotent: liquidity moves to PumpSwap
            # | and the LP is burnt, and any subsequent call is a no-op.
            # | Permissionless-plus-idempotent is the safe design for a step anyone might
            # | race to trigger.
            explanation: "O migrate da pump é sem permissão e idempotente: a liquidez se move para a PumpSwap e o LP é queimado, e qualquer chamada subsequente é um no-op. Sem permissão mais idempotente é o design seguro para um passo que qualquer um pode correr para disparar."  # @src=b26a1e561654
            options:                 # source order — keep it
              b:
                # | The second call double-mints LP and drains whatever the curve still
                # | holds into the racer's wallet.
                label: "A segunda chamada cunha LP em dobro e drena o que a curva ainda segura para a carteira de quem correu."  # @src=4689d81e4d80
                # | Idempotency exists precisely to prevent this: once migrated, a repeat
                # | call changes nothing.
                feedback: "A idempotência existe precisamente para impedir isso: uma vez migrada, uma chamada repetida não muda nada."  # @src=7ac1fea1c123
              c:
                # | migrate requires the creator's signature, so the second bot's call
                # | reverts for lack of authority.
                label: "migrate exige a assinatura do criador, então a chamada do segundo bot reverte por falta de autoridade."  # @src=3c7264b83eb4
                # | migrate is permissionless (anyone can call it); that is why it must be
                # | idempotent rather than authority-gated.
                feedback: "migrate é sem permissão (qualquer um pode chamar); é por isso que ele tem que ser idempotente em vez de restrito a uma autoridade."  # @src=e78a4c1a15e0
              a:
                # | migrate is permissionless and idempotent, so the second call is simply a
                # | no-op.
                label: "migrate é sem permissão e idempotente, então a segunda chamada é simplesmente um no-op."  # @src=bfc2ef5c685a
                # | Liquidity is already on PumpSwap with the LP burnt. Permissionless plus
                # | idempotent is the pair: either property alone turns the race into dead
                # | liquidity or into an exploit.
                feedback: "A liquidez já está na PumpSwap com o LP queimado. Sem permissão mais idempotente é o par: qualquer uma das propriedades sozinha transforma a corrida em liquidez morta ou em exploit."  # @src=72aa9c8384e1
              d:
                # | The second call lands too and pays the 15,000,001-lamport fee again,
                # | since that fee is a program constant.
                label: "A segunda chamada também passa e paga a taxa de 15,000,001 lamports de novo, já que essa taxa é uma constante do programa."  # @src=bc6f245911d9
                # | Two things off. Only the first migration does any work, and
                # | pool_migration_fee is a Global field an authority can rewrite rather
                # | than a constant.
                feedback: "Duas coisas erradas. Só a primeira migração faz algum trabalho, e pool_migration_fee é um campo do Global que uma autoridade pode reescrever em vez de uma constante."  # @src=c7fa6a3bc2ba
          m08l1-q4-opening-price-bug:
            # | A first attempt prices every real token at the curve's OPENING spot price
            # | and sums them, getting ~22 SOL instead of ~85. Why is it wrong?
            prompt: "Uma primeira tentativa precifica todo token real ao preço spot de ABERTURA da curva e os soma, chegando a ~22 SOL em vez de ~85. Por que está errado?"  # @src=9d19c3fe820f
            # | A constant-product curve steepens as you drain it: each successive token
            # | costs more SOL than the last. Pricing all real tokens at the opening price
            # | treats the curve as flat and badly under-counts. The invariant integrates
            # | that steepening for you, which is the whole point of deriving from k rather
            # | than eyeballing a price.
            explanation: "Uma curva de produto constante fica mais íngreme conforme você a drena: cada token seguinte custa mais SOL que o anterior. Precificar todos os tokens reais ao preço de abertura trata a curva como plana e conta muito menos do que deveria. A invariante integra aquele aumento de inclinação por você, que é todo o sentido de derivar a partir de k em vez de chutar um preço no olho."  # @src=f351d9a34c64
            options:                 # source order — keep it
              a:
                # | It forgot to add pump's 100-bps trading fee, which compounds across
                # | every buy on the way up the curve and accounts for the missing SOL.
                label: "Esqueceu de somar a taxa de negociação de 100 bps da pump, que se acumula em toda compra na subida da curva e responde pelo SOL que falta."  # @src=4e8a44fe8999
                # | The gap is ~63 SOL, far larger than any fee. The error is structural,
                # | not a missing fee.
                feedback: "O vão é de ~63 SOL, muito maior que qualquer taxa. O erro é estrutural, não uma taxa esquecida."  # @src=d8d292ab1e71
              b:
                # | The opening price is the cheapest point on the curve; price rises as the
                # | token reserve shrinks, so a flat-price sum under-counts.
                label: "O preço de abertura é o ponto mais barato da curva; o preço sobe conforme a reserva de token encolhe, então uma soma a preço fixo conta menos do que deveria."  # @src=140b571aa9fa
                # | Pricing 793 million tokens at the opening rate is pricing a flight of
                # | stairs at the height of the first step. The curve steepens as it drains,
                # | by 14.7 times end to end.
                feedback: "Precificar 793 milhões de tokens à taxa de abertura é precificar uma escada pela altura do primeiro degrau. A curva fica mais íngreme conforme drena, 14.7 vezes de ponta a ponta."  # @src=8ee766d3c833
              d:
                # | It should have priced the tokens at the average of the opening and
                # | graduation prices, which is the mean price actually paid on the curve.
                label: "Deveria ter precificado os tokens na média entre os preços de abertura e de graduação, que é o preço médio de fato pago na curva."  # @src=280a86d2298f
                # | Averaging the endpoints at least admits the curve moves, and it still
                # | fails: a constant-product curve is a hyperbola, so the arithmetic mean
                # | of its endpoints is not the mean price paid.
                feedback: "Tirar a média dos extremos pelo menos admite que a curva se move, e ainda falha: uma curva de produto constante é uma hipérbole, então a média aritmética dos extremos dela não é o preço médio pago."  # @src=52c4c693f11c
              c:
                # | It used lamports where it should have used SOL, so the sum comes out off
                # | by a factor of a billion.
                label: "Usou lamports onde deveria ter usado SOL, então a soma sai errada por um fator de um bilhão."  # @src=5fb2b8909520
                # | A unit error would be off by 10^9, not a factor of ~4; the shape of the
                # | curve is what's ignored.
                feedback: "Um erro de unidade erraria por 10^9, não por um fator de ~4; a forma da curva é o que está sendo ignorado."  # @src=d45fa9c86dca
  m08-l2-launchpad-landscape:
    # | The launchpad landscape, anti-snipe & what graduation seeds
    title: "O panorama dos launchpads, anti-snipe & o que a graduação semeia"  # @src=e7b2866ef01a
    blocks:
      check:                      # quiz
        questions:
          m08l2-q1-platform-pda:
            # | You notice LetsBonk transactions and LaunchLab transactions hit the same
            # | program id. What does that tell you?
            prompt: "Você repara que transações do LetsBonk e transações do LaunchLab batem no mesmo program id. O que isso te diz?"  # @src=4643b5ed77f4
            # | LaunchLab exposes a Platform PDA so anyone can run a branded front-end and
            # | fee split on the shared program. LetsBonk is one such skin. Recognizing this
            # | collapses several 'competing' launchpads into one curve with resellers, and
            # | it tells you their mechanics and graduation AMM are LaunchLab's.
            explanation: "O LaunchLab expõe um Platform PDA para qualquer um rodar um front-end com marca própria e uma divisão de taxa no programa compartilhado. O LetsBonk é uma dessas skins. Reconhecer isso colapsa vários launchpads 'concorrentes' em uma curva com revendedores, e te diz que a mecânica e o AMM de graduação deles são os do LaunchLab."  # @src=a64269e84bdf
            options:                 # source order — keep it
              d:
                # | One of them is a thin wrapper program that CPIs into the other, which is
                # | why the same id shows up in both transactions.
                label: "Um deles é um programa wrapper fino que faz CPI para o outro, e é por isso que o mesmo id aparece nas duas transações."  # @src=da7cc7f24e6e
                # | A wrapper would be its own program id invoking a second one, and you
                # | would see two. The probe returned one 32-byte key for both names, which
                # | is identity rather than delegation.
                feedback: "Um wrapper seria o próprio program id dele invocando um segundo, e você veria dois. A sondagem devolveu uma única chave de 32 bytes para os dois nomes, o que é identidade e não delegação."  # @src=03f03cf8864f
              c:
                # | LaunchLab's Platform PDA lets third parties run branded launchpads on
                # | the same program with their own fee structure.
                label: "O Platform PDA do LaunchLab deixa terceiros rodarem launchpads com marca própria no mesmo programa com a própria estrutura de taxas."  # @src=b74a57bb0c86
                # | One kitchen, several signs. The franchisee sets the branding and the
                # | till; what they cannot change is the fryer, which here means the curve
                # | and the graduation AMM.
                feedback: "Uma cozinha, várias placas. O franqueado define a marca e o caixa; o que ele não consegue mudar é a fritadeira, que aqui quer dizer a curva e o AMM de graduação."  # @src=381f6a352f58
              a:
                # | LetsBonk forked LaunchLab's open-source code and redeployed it under its
                # | own upgrade authority, keeping the instruction layout byte-compatible.
                label: "O LetsBonk fez um fork do código aberto do LaunchLab e reimplantou sob a autoridade de upgrade dele, mantendo o layout de instruções compatível byte a byte."  # @src=015a48c8d19a
                # | A fork would deploy at a different program id; sharing the id means they
                # | share the program, not the source.
                feedback: "Um fork seria implantado em um program id diferente; compartilhar o id quer dizer que eles compartilham o programa, não o código-fonte."  # @src=4a86e169bb5b
              b:
                # | It is a coincidence of vanity addresses, since the two teams happened to
                # | grind for similar-looking prefixes.
                label: "É uma coincidência de endereços vanity, já que os dois times por acaso garimparam prefixos parecidos."  # @src=8a1b1b1adf85
                # | Program ids are exact 32-byte keys: a shared id is identity, not
                # | resemblance.
                feedback: "Program ids são chaves exatas de 32 bytes: um id compartilhado é identidade, não semelhança."  # @src=30b3cc05ab89
          m08l2-q2-docs-vs-code:
            # | Meteora DBC's docs say the curve supports up to 16 segments; the on-chain
            # | config struct says up to 20. You are building against DBC. Which do you
            # | trust?
            prompt: "Os docs da Meteora DBC dizem que a curva suporta até 16 segmentos; a struct de config on-chain diz até 20. Você está construindo contra a DBC. Em qual você confia?"  # @src=57a6b29b9349
            # | Read the source, and read enough of it to know which constant governs which
            # | surface: constants.rs declares MAX_CURVE_POINT = 16 with a const_assert
            # | pinning it under MAX_CURVE_POINT_CONFIG = 20. Trust only the docs and you
            # | mis-size a deserializer against the 20-slot array; trust only the struct
            # | width and you pass 20 points into an instruction that validates 16. Same
            # | habit that produced the extension conflict matrix — and the exact numbers
            # | get re-verified at write time.
            explanation: "Leia a fonte, e leia o suficiente dela para saber qual constante governa qual superfície: o constants.rs declara MAX_CURVE_POINT = 16 com um const_assert que o prende abaixo de MAX_CURVE_POINT_CONFIG = 20. Confie só nos docs e você dimensiona errado um deserializador contra o array de 20 slots; confie só na largura da struct e você passa 20 pontos para uma instrução que valida 16. O mesmo hábito que produziu a matriz de conflitos de extensões — e os números exatos são reverificados na hora de escrever."  # @src=372ed52393da
            options:                 # source order — keep it
              b:
                # | The docs' 16 segments, because published documentation is the interface
                # | contract integrators are entitled to rely on when the source disagrees.
                label: "Os 16 segmentos dos docs, porque documentação publicada é o contrato de interface no qual integradores têm o direito de confiar quando a fonte discorda."  # @src=b3bcd2366849
                # | The 16 happens to match the validated cap, but 'trust the docs' is the
                # | wrong habit and misses the second constant: the account still reserves
                # | 20 slots, and a deserializer sized to 16 mis-reads the layout.
                feedback: "O 16 por acaso bate com o teto validado, mas 'confie nos docs' é o hábito errado e passa batido pela segunda constante: a conta ainda reserva 20 slots, e um deserializador dimensionado para 16 lê o layout errado."  # @src=20f813d63621
              c:
                # | Neither, because DBC runs one constant-product curve like pump.fun, so
                # | both segment counts describe a feature the venue does not have.
                label: "Nenhum dos dois, porque a DBC roda uma única curva de produto constante como a pump.fun, então as duas contagens de segmentos descrevem uma feature que o venue não tem."  # @src=316a36ba36ef
                # | DBC is explicitly piecewise over multiple (sqrt_price, liquidity)
                # | segments; that flexibility is its whole pitch.
                feedback: "A DBC é explicitamente por partes sobre múltiplos segmentos (sqrt_price, liquidity); essa flexibilidade é o pitch inteiro dela."  # @src=3f5b9594c3d4
              d:
                # | The struct's 20 slots, because on a live protocol the source usually
                # | beats the docs, so size the curve you submit to the array the account
                # | reserves.
                label: "Os 20 slots da struct, porque em um protocolo ao vivo a fonte geralmente ganha dos docs, então dimensione a curva que você envia pelo array que a conta reserva."  # @src=b3aefc60f817
                # | Right instinct, wrong constant. Reading the source is the habit; reading
                # | enough of it to see which constant guards which surface is the skill,
                # | and twenty points is what the instruction rejects.
                feedback: "Instinto certo, constante errada. Ler a fonte é o hábito; ler o suficiente dela para ver qual constante guarda qual superfície é a habilidade, e vinte pontos é o que a instrução rejeita."  # @src=18528ac0eb65
              a:
                # | Both, because they govern different surfaces: MAX_CURVE_POINT = 16 caps
                # | the curve an instruction will validate, while the 20-slot array is
                # | account-layout headroom your deserializer must size for; re-verify both
                # | at write time.
                label: "Os dois, porque eles governam superfícies diferentes: MAX_CURVE_POINT = 16 limita a curva que uma instrução vai validar, enquanto o array de 20 slots é folga de layout de conta para a qual o seu deserializador tem de se dimensionar; reverifique os dois na hora de escrever."  # @src=cd94f347b112
                # | The const_assert between the two constants is the giveaway: the source
                # | itself declares one a ceiling under the other, so each number governs a
                # | different surface.
                feedback: "O const_assert entre as duas constantes é a entrega: a própria fonte declara uma delas um teto sob a outra, então cada número governa uma superfície diferente."  # @src=d2020309597d
          m08l2-q3-venue-rejects-extension:
            # | SPROUT carries a TransferHook extension. You choose a graduation AMM whose
            # | allowlist rejects hooks. What happens, and what is the fix?
            prompt: "O SPROUT carrega uma extensão TransferHook. Você escolhe um AMM de graduação cuja allowlist rejeita hooks. O que acontece, e qual é o conserto?"  # @src=0b9736e7fd29
            # | The routable extension set from R6 is not advisory: it decides which
            # | graduation AMMs are legal. A hook-bearing SPROUT reverts on Raydium's
            # | allowlist but has a documented path on Meteora DBC, whose docs describe
            # | transfer-hook base tokens — a claim the lesson filed as
            # | documented-but-unverified, so verify it before you launch on it. Choose the
            # | venue to match the token, or change the token.
            explanation: "O conjunto de extensões roteáveis do R6 não é uma sugestão: ele decide quais AMMs de graduação são legais. Um SPROUT com hook reverte na allowlist da Raydium mas tem um caminho documentado na Meteora DBC, cujos docs descrevem tokens base com transfer hook — uma afirmação que a lição arquivou como documentada-mas-não-verificada, então verifique antes de lançar nela. Escolha o venue para casar com o token, ou mude o token."  # @src=1fefb07f38db
            options:                 # source order — keep it
              c:
                # | The launchpad automatically strips the TransferHook extension from the
                # | mint during migration so the graduation pool can be created without it.
                label: "O launchpad tira automaticamente a extensão TransferHook do mint durante a migração para a pool de graduação poder ser criada sem ela."  # @src=6feb736432bd
                # | A launchpad cannot remove a mint-level extension: extensions are fixed
                # | at mint creation. The venue must accept it or you must not ship it.
                feedback: "Um launchpad não consegue remover uma extensão no nível do mint: extensões são fixadas na criação do mint. O venue tem de aceitá-la ou você não pode entregá-la."  # @src=a50f49a154fb
              d:
                # | Pool creation succeeds because allowlists are additive: the AMM accepts
                # | the extensions it knows and ignores the rest.
                label: "A criação da pool tem sucesso porque allowlists são aditivas: o AMM aceita as extensões que conhece e ignora o resto."  # @src=aef3db845c49
                # | An allowlist is a whitelist, not a preference list. One off-list
                # | extension is enough to refuse the mint, which is the same shape the
                # | airdrop tool's supported-extension table has.
                feedback: "Uma allowlist é uma whitelist, não uma lista de preferências. Uma extensão fora da lista já basta para recusar o mint, que é o mesmo formato da tabela de extensões suportadas da ferramenta de airdrop."  # @src=5d7573f13637
              a:
                # | The token graduates fine, because an AMM ignores any mint extension it
                # | does not recognize.
                label: "O token gradua numa boa, porque um AMM ignora qualquer extensão de mint que ele não reconhece."  # @src=fd1656e30494
                # | The allowlist reverts pool creation on any off-list extension; it does
                # | not silently ignore it.
                feedback: "A allowlist reverte a criação da pool em qualquer extensão fora da lista; ela não ignora em silêncio."  # @src=6cbe388a0fb6
              b:
                # | Pool creation reverts on the off-allowlist extension; pick a venue that
                # | accepts your set.
                label: "A criação da pool reverte na extensão fora da allowlist; escolha um venue que aceite o seu conjunto."  # @src=2f1618d21436
                # | The curve was never the risk; the last instruction was. Two fixes and no
                # | third: match the venue to the token, or drop the extension so the token
                # | matches the venue.
                feedback: "O risco nunca foi a curva; foi a última instrução. Dois consertos e não há um terceiro: case o venue com o token, ou largue a extensão para o token casar com o venue."  # @src=5e57336c5a08
  m08-l3-airdrops-at-scale:
    # | Airdrops at scale: cost engineering & vesting claims
    title: "Airdrops em escala: engenharia de custo & claims com vesting"  # @src=7a626a952cd8
    blocks:
      check:                      # quiz
        questions:
          m08l3-q1-100k-cost:
            # | Your cost table shows classic ATAs at ≈186 SOL for 100,000 recipients (293
            # | bytes each at mainnet's 6,333 lamports/byte, read 2026-09-06). What is the
            # | compressed figure and the saving?
            prompt: "A sua tabela de custo mostra ATAs clássicas a ≈186 SOL para 100,000 destinatários (293 bytes cada aos 6,333 lamports/byte da mainnet, lidos em 2026-09-06). Qual é o valor comprimido e a economia?"  # @src=dd1bc972c45c
            # | Per recipient: a classic ATA is 293 bytes of rent, ≈1,855,569 lamports at
            # | mainnet's current per-byte rate; a compressed recipient ≈10,300, which is
            # | not rent and does not move with the rent schedule. At 100k that is ≈186 SOL
            # | vs ≈1.03 SOL, a ~99.4% cut. The exact percentage drifts as SIMD-0437 steps
            # | rent down — it was 99.5% at the old 6,960 rate — which is precisely why
            # | doing this arithmetic live, rather than quoting it, is what makes a mass
            # | airdrop a budget line rather than a fantasy.
            explanation: "Por destinatário: uma ATA clássica é 293 bytes de rent, ≈1,855,569 lamports à taxa por byte atual da mainnet; um destinatário comprimido ≈10,300, que não é rent e não se move com a tabela de rent. Em 100k isso dá ≈186 SOL contra ≈1.03 SOL, um corte de ~99.4%. A porcentagem exata varia conforme o SIMD-0437 baixa o rent em degraus — era 99.5% na antiga taxa de 6,960 — que é precisamente por que fazer esta aritmética ao vivo, em vez de citá-la, é o que faz de um airdrop em massa uma linha de orçamento em vez de uma fantasia."  # @src=6dd6a4c9cae3
            options:                 # source order — keep it
              a:
                # | ≈20 SOL and about 90% saved, on ≈200,000 lamports per recipient.
                label: "≈20 SOL e cerca de 90% economizado, a ≈200,000 lamports por destinatário."  # @src=fce8ec1e0f3b
                # | 20 SOL is roughly the CLASSIC 10k-recipient figure; you are off by a
                # | method and a scale. Compressed is far cheaper.
                feedback: "20 SOL é mais ou menos o valor CLÁSSICO de 10k destinatários; você errou por um método e por uma escala. Comprimido é muito mais barato."  # @src=b0848af4aed4
              e:
                # | ≈186 SOL either way, because each recipient still needs an account
                # | created before any tokens can land.
                label: "≈186 SOL de qualquer jeito, porque cada destinatário ainda precisa de uma conta criada antes que qualquer token possa aterrissar."  # @src=d42c38b5ce64
                # | There is no account to create: a compressed recipient is a hash in a
                # | state tree, which is exactly where the 180x comes from.
                feedback: "Não tem conta para criar: um destinatário comprimido é um hash numa árvore de estado, que é exatamente de onde vem o 180x."  # @src=3d6b5d696d8a
              c:
                # | ≈1.03 SOL, well over 99% saved (≈10,300 lamports/recipient vs ≈1.86M).
                label: "≈1.03 SOL, bem mais de 99% economizado (≈10,300 lamports/destinatário contra ≈1.86M)."  # @src=64ba972d7aea
                # | Bytes times a rate you looked up, against a state cost that is not rent
                # | at all. Recompute the classic side whenever the rate steps; the
                # | compressed side stays put.
                feedback: "Bytes vezes uma taxa que você consultou, contra um custo de estado que não é rent de jeito nenhum. Recalcule o lado clássico toda vez que a taxa der um degrau; o lado comprimido fica onde está."  # @src=7ed8f1d415c9
              d:
                # | ≈1.03 SOL today, and the compressed side falls with the rent schedule
                # | the same way the classic side does.
                label: "≈1.03 SOL hoje, e o lado comprimido cai com a tabela de rent do mesmo jeito que o lado clássico cai."  # @src=5b95d817974b
                # | Right total, wrong mechanism. A compressed recipient pays state cost,
                # | not rent, so SIMD-0437 moves only the classic column and the saving
                # | percentage drifts with it.
                feedback: "Total certo, mecanismo errado. Um destinatário comprimido paga custo de estado, não rent, então o SIMD-0437 move só a coluna clássica e a porcentagem de economia varia junto."  # @src=aebb08d7842c
              b:
                # | ≈10.3 SOL, about 95% saved, since compressed state still pays roughly a
                # | tenth of classic rent per recipient.
                label: "≈10.3 SOL, cerca de 95% economizado, já que o estado comprimido ainda paga mais ou menos um décimo do rent clássico por destinatário."  # @src=5f5e4d7f67e6
                # | 10.3 SOL is the per-1M compressed extrapolation, not the 100k figure. At
                # | 100k it is ten times less.
                feedback: "10.3 SOL é a extrapolação comprimida por 1M, não o valor de 100k. Em 100k é dez vezes menos."  # @src=df83025a4477
          m08l3-q2-airship-discrepancy:
            # | AirShip's marketing says a 10k-recipient drop costs 0.01 SOL; the
            # | zkcompression per-recipient math gives 0.103 SOL (a 10x gap). How do you
            # | handle it in the lab?
            prompt: "O marketing do AirShip diz que um drop de 10k destinatários custa 0.01 SOL; a matemática por destinatário do zkcompression dá 0.103 SOL (uma lacuna de 10x). Como você lida com isso no lab?"  # @src=0294d5e5fcd3
            # | A 10x gap between a vendor claim and first-party math is almost always a
            # | scope difference (what's counted as cost). The honest move is to measure it
            # | in your own lab and teach the method; the disputed number is never the
            # | load-bearing fact.
            explanation: "Uma lacuna de 10x entre uma afirmação de fornecedor e a matemática de primeira mão é quase sempre uma diferença de escopo (o que é contado como custo). A jogada honesta é medir no seu próprio lab e ensinar o método; o número em disputa nunca é o fato estrutural."  # @src=11da10459095
            options:                 # source order — keep it
              d:
                # | Treat one of them as stale and cite the newer number, since two credible
                # | measured costs cannot both be right.
                label: "Tratar um deles como obsoleto e citar o número mais novo, já que dois custos medidos e credíveis não podem estar os dois certos."  # @src=02d4534125d1
                # | Both are current and both are right. They count different things, and
                # | nobody stated the scope, which is what made them look comparable.
                feedback: "Os dois são atuais e os dois estão certos. Eles contam coisas diferentes, e ninguém declarou o escopo, que é o que fez eles parecerem comparáveis."  # @src=d17b502b9779
              b:
                # | Cite AirShip's 0.01 SOL, since the tool's own vendor is the authority on
                # | what the tool costs to run.
                label: "Citar os 0.01 SOL do AirShip, já que o próprio fornecedor da ferramenta é a autoridade sobre quanto custa rodá-la."  # @src=4b4ea03cf266
                # | Vendor marketing numbers often quote a narrower scope; the course's rule
                # | is to measure disputed figures, not repeat them.
                feedback: "Números de marketing de fornecedor costumam citar um escopo mais estreito; a regra do curso é medir valores em disputa, não repeti-los."  # @src=426a7adf3878
              c:
                # | Quote the wider 0.103 SOL figure, so the budget carries margin against
                # | the vendor's scope.
                label: "Citar o valor mais amplo de 0.103 SOL, para que o orçamento carregue margem contra o escopo do fornecedor."  # @src=b84fd45a364b
                # | Conservative and still short. The two figures are addends, not rivals,
                # | so the wider one alone still leaves the sender's fees out of the budget.
                feedback: "Conservador e ainda assim curto. Os dois valores são parcelas de uma soma, não rivais, então o mais amplo sozinho ainda deixa as taxas do remetente fora do orçamento."  # @src=915b887e90ad
              a:
                # | Measure it in the lab and report your own measured number; the gap is a
                # | difference of scope.
                label: "Medir no lab e reportar o seu próprio número medido; a lacuna é uma diferença de escopo."  # @src=0caebd7f9eee
                # | Reading AirShip's constants settles it in a minute: 15,000 lamports per
                # | transaction over 15 recipients is 1,000 each, and the 10,300 is state.
                # | Budget the sum, about 11,300.
                feedback: "Ler as constantes do AirShip resolve isso em um minuto: 15,000 lamports por transação divididos por 15 destinatários dá 1,000 cada, e os 10,300 são estado. Orce a soma, cerca de 11,300."  # @src=95f558bcb9be
          m08l3-q3-vesting-primitive:
            # | You need a subset of airdrop recipients to vest linearly instead of claiming
            # | everything at once. Which primitive do you reach for?
            prompt: "Você precisa que um subconjunto dos destinatários do airdrop faça vesting linearmente em vez de fazer claim de tudo de uma vez. Para qual primitiva você vai?"  # @src=07ea56eaa0f7
            # | The Jito distributor (the one the JTO drop used) carries both an unlocked
            # | portion and a claim_locked path that releases linearly. That is the vesting
            # | primitive to reuse — with the caveat the lesson attaches to it and this
            # | answer inherits: the distributor is an SPL-era program and whether its vault
            # | and claim-time transfer CPI can pay out a fee-bearing Token-2022 mint is
            # | unverified here, so read its transfer CPI and stand up a devnet distributor
            # | before you commit SPROUT to it. LaunchLab's cliff+duration knobs are the
            # | launchpad-side equivalent from the previous lesson.
            explanation: "O distribuidor da Jito (o que o drop do JTO usou) carrega tanto uma porção desbloqueada quanto um caminho claim_locked que libera linearmente. Essa é a primitiva de vesting para reutilizar — com a ressalva que a lição prende a ela e que esta resposta herda: o distribuidor é um programa da era SPL e se o vault dele e a CPI de transferência na hora do claim conseguem pagar um mint Token-2022 que cobra taxa é algo não verificado aqui, então leia a CPI de transferência dele e suba um distribuidor de devnet antes de comprometer o SPROUT com ele. Os botões de cliff+duração do LaunchLab são o equivalente do lado do launchpad da lição anterior."  # @src=34cf21a63449
            options:                 # source order — keep it
              d:
                # | LaunchLab's cliff and unlock-duration knobs, set at launch so the drop
                # | inherits the same vesting schedule.
                label: "Os botões de cliff e de duração de desbloqueio do LaunchLab, definidos no lançamento para que o drop herde o mesmo cronograma de vesting."  # @src=649d9d2dfcf6
                # | Same idea, wrong seat. Those knobs are launch-side and fixed at launch,
                # | so they cannot express a schedule for a subset of a later distribution's
                # | recipients.
                feedback: "Mesma ideia, cadeira errada. Esses botões são do lado do lançamento e fixados no lançamento, então não conseguem expressar um cronograma para um subconjunto dos destinatários de uma distribuição posterior."  # @src=767c71775cdb
              b:
                # | The Jito-style merkle distributor's claim_locked path: unlocked plus
                # | linearly-vesting portions in one distributor.
                label: "O caminho claim_locked do distribuidor de Merkle no estilo Jito: porções desbloqueada e com vesting linear em um distribuidor só."  # @src=d852d6bc0a45
                # | One distributor carries both halves, and the locked half is a pull:
                # | unclaimed allocations sit in the vault costing you nothing until
                # | somebody returns for them.
                feedback: "Um distribuidor carrega as duas metades, e a metade bloqueada é um pull: alocações sem claim ficam paradas no vault sem te custar nada até alguém voltar para buscá-las."  # @src=ed51ded7bc39
              c:
                # | Compressed tokens vest automatically by epoch, so the vesting needs no
                # | distributor of its own.
                label: "Tokens comprimidos fazem vesting automaticamente por epoch, então o vesting não precisa de um distribuidor próprio."  # @src=967312154c0a
                # | Compression is a storage optimization; it has no vesting semantics of
                # | its own.
                feedback: "Compressão é uma otimização de armazenamento; ela não tem semântica de vesting própria."  # @src=24f79f5f70d4
              a:
                # | A second SPL mint whose freeze authority sits behind a timelock, thawing
                # | each recipient's token account as its schedule matures.
                label: "Um segundo mint SPL cuja autoridade de congelamento fica atrás de um timelock, descongelando a conta de token de cada destinatário conforme o cronograma dela amadurece."  # @src=023a09be1dda
                # | Freeze authority is all-or-nothing and manual; it does not express a
                # | per-recipient linear vesting schedule the way a distributor does.
                feedback: "Autoridade de congelamento é tudo-ou-nada e manual; ela não expressa um cronograma de vesting linear por destinatário do jeito que um distribuidor expressa."  # @src=dca771c219ab
          m08l3-q4-stale-proof:
            # | A recipient's compressed-token claim transaction fails shortly after the
            # | tree received new writes. What is the most likely structural cause?
            prompt: "A transação de claim de token comprimido de um destinatário falha logo depois de a árvore receber novas escritas. Qual é a causa estrutural mais provável?"  # @src=5276c8c4876e
            # | Every write to a compression tree changes its root, invalidating outstanding
            # | proofs. A claim built against an old proof reverts. The rule is to re-fetch
            # | the proof immediately before each write/claim; stale proofs are the classic
            # | compressed-airdrop footgun.
            explanation: "Toda escrita numa árvore de compressão muda a raiz dela, invalidando as provas pendentes. Um claim construído contra uma prova antiga reverte. A regra é rebuscar a prova imediatamente antes de cada escrita/claim; provas obsoletas são a cilada clássica do airdrop comprimido."  # @src=8a994fac62cf
            options:                 # source order — keep it
              d:
                # | The ClaimStatus PDA exists already, so the distributor's replay guard
                # | rejected the claim.
                label: "O PDA de ClaimStatus já existe, então a trava de replay do distribuidor rejeitou o claim."  # @src=7c9aebe6694f
                # | That guard fires at account creation and does not care what the tree
                # | did. It is also the distributor's mechanism, not the compressed-token
                # | rail this claim rode.
                feedback: "Essa trava dispara na criação da conta e não liga para o que a árvore fez. Ela também é o mecanismo do distribuidor, não o trilho de token comprimido em que este claim pegou carona."  # @src=77c498f62e30
              a:
                # | The DAS RPC rate-limited the proof read, so the claim was built from an
                # | empty proof.
                label: "O RPC de DAS aplicou rate limit na leitura da prova, então o claim foi construído a partir de uma prova vazia."  # @src=85d0fde1f2c0
                # | Rate limits cause read failures, but the tell here is the timing, right
                # | after tree writes, which points at proof staleness, not throttling.
                feedback: "Rate limits causam falhas de leitura, mas o sinal aqui é o momento, logo depois de escritas na árvore, que aponta para prova obsoleta, não para throttling."  # @src=b6cf78261269
              c:
                # | The merkle proof went stale on the tree write; re-fetch the proof before
                # | submitting the claim.
                label: "A prova de Merkle ficou obsoleta na escrita da árvore; rebusque a prova antes de enviar o claim."  # @src=fa59d901b81b
                # | A proof is a statement about one root, and any write moves the root.
                # | Fetch immediately before you submit, never from a cache and never from a
                # | file you generated last week.
                feedback: "Uma prova é uma declaração sobre uma raiz, e qualquer escrita move a raiz. Busque imediatamente antes de enviar, nunca de um cache e nunca de um arquivo que você gerou semana passada."  # @src=b0db5b844ab1
              e:
                # | The tree's canopy is too shallow, so the proof no longer fits in the
                # | transaction alongside the claim.
                label: "O canopy da árvore é raso demais, então a prova não cabe mais na transação junto com o claim."  # @src=2120b35e01a9
                # | Canopy belongs to Bubblegum's concurrent merkle trees, where proof
                # | length grows with depth. A compressed-token write carries a constant
                # | 128-byte validity proof, so size is not the failure.
                feedback: "Canopy pertence às árvores de Merkle concorrentes do Bubblegum, onde o comprimento da prova cresce com a profundidade. Uma escrita de token comprimido carrega uma prova de validade constante de 128 bytes, então o tamanho não é a falha."  # @src=75988b7f0916
              b:
                # | Compressed tokens cannot be claimed twice by design, and this account
                # | already claimed once.
                label: "Tokens comprimidos não podem ter claim feito duas vezes por design, e esta conta já fez claim uma vez."  # @src=b10099f1bbdf
                # | This is a first claim; the failure correlates with tree writes, not a
                # | double-claim guard.
                feedback: "Este é um primeiro claim; a falha se correlaciona com escritas na árvore, não com uma trava de duplo claim."  # @src=ebe1df963e35
  m09-l1-fee-routing-buyback:
    # | Fee routing & buyback/burn: where the money actually flows
    title: "Roteamento de taxas & buyback/queima: para onde o dinheiro realmente flui"  # @src=2b6399dafe14
    blocks:
      route-fees:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Subtract the burned share from the harvest to get toTreasury.
          0: "Subtraia a fatia queimada do harvest para obter toTreasury."  # @src=bc8ab642d0e0
          # | Buyback tokens = treasurySol / priceLamportsPerToken, floored on bigints.
          1: "Tokens de buyback = treasurySol / priceLamportsPerToken, com piso em bigints."  # @src=34b521cb4651
          # | burnedFromFees + toTreasury must always equal harvested.
          2: "burnedFromFees + toTreasury tem que ser sempre igual a harvested."  # @src=368e7ee517f2
        tests:                      # keyed by test case id
          split-and-buyback:
            # | 20% of 1,000,000 burns 200,000; 800,000 stays; 5,000,000,000 lamports /
            # | 1,000,000 buys 5,000 SPROUT
            description: "20% de 1,000,000 queima 200,000; 800,000 fica; 5,000,000,000 lamports / 1,000,000 compra 5,000 SPROUT"  # @src=0c16d184fbe2
          zero-burn-share:
            # | a 0 bps burn share burns nothing; the whole harvest stays; no SOL means no
            # | buyback
            description: "uma fatia de queima de 0 bps não queima nada; o harvest inteiro fica; sem SOL não há buyback"  # @src=2751d5c710a5
          all-burned:
            # | a 100% burn share burns the whole harvest; 3,000,000 lamports buys 3 SPROUT
            # | to burn
            description: "uma fatia de queima de 100% queima o harvest inteiro; 3,000,000 lamports compram 3 SPROUT para queimar"  # @src=7bc8d523343f
          buyback-floors:
            # | 2,999,999 / 1,000,000 floors to 2 SPROUT: you cannot buy a fractional base
            # | unit
            description: "2,999,999 / 1,000,000 com piso dá 2 SPROUT: você não pode comprar uma fração de unidade base"  # @src=a7cf27e291d7
          conservation-holds:
            # | 33% of 123,457 floors to 40,740 burned; 82,717 stays; the split conserves
            # | the harvest exactly
            description: "33% de 123,457 com piso dá 40,740 queimados; 82,717 fica; o split conserva o harvest exatamente"  # @src=23c174c776a4
      check:                      # quiz
        questions:
          m09l1-q1-where-fees-go:
            # | Your Overgrowth marketplace charges a 1% Token-2022 transfer fee on SPROUT
            # | trades. A week in, your treasury PDA balance is still zero, but transfers
            # | are clearly paying the fee. What happened?
            prompt: "O seu marketplace Overgrowth cobra uma taxa de transferência Token-2022 de 1% nas trocas de SPROUT. Uma semana depois, o saldo do seu PDA de tesouraria ainda é zero, mas as transferências estão claramente pagando a taxa. O que aconteceu?"  # @src=1864a8fa726a
            # | Token-2022 transfer fees accrue WITHHELD on each recipient's token account.
            # | Routing them anywhere requires the harvest crank:
            # | harvest_withheld_tokens_to_mint, then withdraw to the treasury. That's the
            # | first leg of the rail, and exactly the mechanic you built back in the
            # | economics-extensions lesson.
            explanation: "As taxas de transferência do Token-2022 se acumulam RETIDAS na conta de token de cada destinatário. Rotear elas para qualquer lugar exige o crank de harvest: harvest_withheld_tokens_to_mint, depois withdraw para a tesouraria. Essa é a primeira perna do trilho, e exatamente a mecânica que você construiu lá na lição economics-extensions."  # @src=9828a4d46fc3
            options:                 # source order — keep it
              a:
                # | The fee was never configured: a Token-2022 transfer fee needs a
                # | creator_vault set at mint creation, the way pump.fun does it.
                label: "A taxa nunca foi configurada: uma taxa de transferência do Token-2022 precisa de um creator_vault definido na criação do mint, do jeito que a pump.fun faz."  # @src=bca03fd32298
                # | That conflates two models. pump.fun's creator_vault is a program-side
                # | fee account; Token-2022 transfer fees don't use it. The fee IS being
                # | collected; you just looked in the wrong place.
                feedback: "Isso confunde dois modelos. O creator_vault da pump.fun é uma conta de taxa do lado do programa; as taxas de transferência do Token-2022 não usam isso. A taxa ESTÁ sendo arrecadada; você só olhou no lugar errado."  # @src=80769609766e
              d:
                # | Harvest already swept the fees to the mint, which forwards them to the
                # | treasury on its own schedule.
                label: "O harvest já varreu as taxas para o mint, que as encaminha para a tesouraria no cronograma dele."  # @src=e863e7f6774c
                # | Nothing forwards on its own, and nothing had been swept: peek.ts printed
                # | the mint's own withheldAmount as zero. The second leg is an
                # | authority-signed withdraw you have to run.
                feedback: "Nada encaminha sozinho, e nada tinha sido varrido: o peek.ts imprimiu o próprio withheldAmount do mint como zero. A segunda perna é um withdraw assinado pela autoridade que você tem que rodar."  # @src=a1d15b73114b
              c:
                # | The fees are withheld on the recipients' token accounts; the treasury
                # | sees nothing until you harvest and withdraw.
                label: "As taxas ficam retidas nas contas de token dos destinatários; a tesouraria não vê nada até você fazer harvest e withdraw."  # @src=84f4f4638009
                # | Two instructions and a permission boundary between them: consolidation
                # | is permissionless because it cannot steal, and collection is gated
                # | because it can.
                feedback: "Duas instruções e uma fronteira de permissão entre elas: a consolidação é sem permissão porque não consegue roubar, e a arrecadação é restrita porque consegue."  # @src=dd49b5dc2341
              b:
                # | Token-2022 burns transfer fees automatically at transfer time, deflating
                # | supply on every trade, so no treasury is ever supposed to receive them.
                label: "O Token-2022 queima as taxas de transferência automaticamente no momento da transferência, deflacionando o supply a cada troca, então nenhuma tesouraria deveria recebê-las."  # @src=310f007301b0
                # | Token-2022 never burns fees automatically; it withholds them. Nothing is
                # | destroyed: the tokens are sitting on recipient accounts waiting to be
                # | harvested.
                feedback: "O Token-2022 nunca queima taxas automaticamente; ele as retém. Nada é destruído: os tokens estão sentados nas contas dos destinatários esperando o harvest."  # @src=65c67e5fd5c0
          m09l1-q2-buyback-scope:
            # | You wire the treasury to buy SPROUT back and burn it. In this course, how is
            # | that buyback executed?
            prompt: "Você liga a tesouraria para comprar SPROUT de volta e queimar. Neste curso, como esse buyback é executado?"  # @src=064d65f7574f
            # | The buyback leg is deliberately scoped to a client-side purchase followed by
            # | a burn. If SPROUT has a DAMM v2 pool (the venue the launchpad-landscape
            # | decision chose, reachable only if you launched and migrated it yourself)
            # | that purchase is a swap; the course never launches SPROUT, so the guaranteed
            # | path is an OTC buy from a maker you stand up, at a price you set rather than
            # | read. Either way you measure what landed instead of computing it. One
            # | sentence of AMM math is used; none is taught. The depth lives in the planned
            # | DeFi & RWA Engineering course.
            explanation: "A perna do buyback é deliberadamente escopada a uma compra do lado do cliente seguida de uma queima. Se o SPROUT tiver uma pool DAMM v2 (o venue que a decisão de launchpad-landscape escolheu, alcançável só se você lançou e migrou ele você mesmo) essa compra é um swap; o curso nunca lança SPROUT, então o caminho garantido é uma compra OTC de um maker que você levanta, a um preço que você define em vez de ler. De um jeito ou de outro você mede o que chegou em vez de calcular. Uma frase de matemática de AMM é usada; nenhuma é ensinada. A profundidade mora no curso planejado DeFi & RWA Engineering."  # @src=10a7c038f762
            options:                 # source order — keep it
              c:
                # | By calling harvest_withheld_tokens_to_mint a second time, which converts
                # | withheld fees directly into a burn.
                label: "Chamando harvest_withheld_tokens_to_mint uma segunda vez, o que converte taxas retidas diretamente numa queima."  # @src=a62cc1888688
                # | Harvest only moves withheld fees to the mint; it doesn't swap SOL for
                # | tokens or burn anything. The buyback is a separate buy-then-burn.
                feedback: "O harvest só move taxas retidas para o mint; ele não troca SOL por tokens nem queima nada. O buyback é um comprar-depois-queimar separado."  # @src=f3a2924f7adc
              b:
                # | By deploying a custom constant-product AMM pool with treasury-owned LP
                # | positions, so the treasury controls its own liquidity, routing, and
                # | slippage.
                label: "Fazendo deploy de uma pool AMM de produto constante customizada com posições de LP de propriedade da tesouraria, para que a tesouraria controle a própria liquidez, o roteamento e o slippage."  # @src=ea47565c0d88
                # | Pool composition, routing, and LP strategy are the planned DeFi & RWA
                # | Engineering course's material. This course buys client-side from
                # | whichever counterparty it has, and teaches no AMM design.
                feedback: "Composição de pool, roteamento e estratégia de LP são material do curso planejado DeFi & RWA Engineering. Este curso compra do lado do cliente de qualquer contraparte que tiver, e não ensina design de AMM nenhum."  # @src=d68445e78a9f
              a:
                # | As a client-side purchase paying treasury SOL for SPROUT, then a burn: a
                # | DAMM v2 swap if SPROUT has a pool, otherwise an OTC buy from a maker you
                # | stand up.
                label: "Como uma compra do lado do cliente pagando SOL da tesouraria por SPROUT, depois uma queima: um swap DAMM v2 se o SPROUT tiver uma pool, senão uma compra OTC de um maker que você levanta."  # @src=9f9f786f44c5
                # | The rail downstream cannot tell the two doors apart, which is the point.
                # | Only the swap door has slippage and MEV to worry about; both doors pay
                # | SPROUT's own transfer fee on the payout.
                feedback: "O trilho a jusante não consegue diferenciar as duas portas, que é justamente o ponto. Só a porta do swap tem slippage e MEV com que se preocupar; as duas portas pagam a própria taxa de transferência do SPROUT no pagamento."  # @src=6982aedb92c9
              d:
                # | As a burn of the treasury's harvested SPROUT: buying back is just the
                # | name for burning fee income you already hold.
                label: "Como uma queima do SPROUT da tesouraria vindo do harvest: comprar de volta é só o nome de queimar receita de taxa que você já tem."  # @src=b8d366d633ea
                # | That is the fee-split's burn share, which the treasury already holds. A
                # | buyback is funded by a different asset, treasury SOL, and it needs a
                # | counterparty to spend that SOL with.
                feedback: "Essa é a fatia de queima do split da taxa, que a tesouraria já tem. Um buyback é financiado por um ativo diferente, o SOL da tesouraria, e precisa de uma contraparte com quem gastar esse SOL."  # @src=04f5609bab6e
          m09l1-q3-conservation:
            # | In the fee-split challenge you harvest 1,000,000 base units of SPROUT with a
            # | 20% burn share, and separately hold treasury SOL for the buyback. Which
            # | invariant must your function preserve?
            prompt: "No challenge do split de taxa você faz harvest de 1,000,000 unidades base de SPROUT com uma fatia de queima de 20%, e separadamente guarda SOL de tesouraria para o buyback. Qual invariante a sua função tem que preservar?"  # @src=8f2027bff175
            # | The split is a conservation law: whatever you burn from fees plus whatever
            # | stays in the treasury has to add up to exactly what you harvested. The
            # | buyback is funded from SOL and is a separate leg; sizing it is a
            # | floor-division on price, not a mirror of the fee burn.
            explanation: "O split é uma lei de conservação: o que você queima das taxas mais o que fica na tesouraria tem que somar exatamente o que você fez de harvest. O buyback é financiado a partir de SOL e é uma perna separada; dimensionar ele é uma divisão com piso sobre o preço, não um espelho da queima de taxa."  # @src=ec68f58177fa
            options:                 # source order — keep it
              b:
                # | burnedFromFees + toTreasury must equal harvested; the split creates and
                # | destroys nothing.
                label: "burnedFromFees + toTreasury tem que ser igual a harvested; o split não cria e não destrói nada."  # @src=d87ac15ced39
                # | The split only labels. Hold that on every input, including the ugly
                # | ones, and the supply assertion at the end of the run has something to
                # | stand on.
                feedback: "O split só rotula. Sustente isso em toda entrada, inclusive as feias, e a asserção de supply no fim da rodada tem em que se apoiar."  # @src=fbb514a3b7e2
              d:
                # | burnedFromFees plus toTreasury plus the buyback must equal the harvested
                # | total, since all three come from one pile.
                label: "burnedFromFees mais toTreasury mais o buyback tem que ser igual ao total de harvested, já que os três vêm de uma pilha só."  # @src=1e3a23e377be
                # | Three terms, two piles. The buyback is bought with treasury SOL, not
                # | carved out of the harvested SPROUT, so folding it into this identity
                # | breaks on the first run.
                feedback: "Três termos, duas pilhas. O buyback é comprado com SOL da tesouraria, não recortado do SPROUT vindo do harvest, então dobrar ele nessa identidade quebra na primeira rodada."  # @src=ad05e8ecdfac
              c:
                # | toTreasury must equal the full harvested amount, since the burning
                # | happens later at the venue.
                label: "toTreasury tem que ser igual ao valor total de harvested, já que a queima acontece depois no venue."  # @src=3f7bb1e8bdab
                # | If toTreasury equalled the whole harvest you'd have double-counted the
                # | burned share. The split must sum to the harvest, not ignore the burn.
                feedback: "Se toTreasury fosse igual ao harvest inteiro você teria contado duas vezes a fatia queimada. O split tem que somar o harvest, não ignorar a queima."  # @src=a57b8826c1ee
              a:
                # | The buyback token amount must equal the burned-from-fees amount, or
                # | supply isn't conserved.
                label: "O valor de tokens do buyback tem que ser igual ao valor queimado das taxas, senão o supply não é conservado."  # @src=fa211cab0772
                # | Those are two independent legs: the fee-burn and the SOL-funded
                # | buyback-burn. They needn't be equal; conservation is about the fee split
                # | summing back to the harvest.
                feedback: "Essas são duas pernas independentes: a queima de taxa e a queima de buyback financiada em SOL. Elas não precisam ser iguais; conservação é sobre o split da taxa somar de volta ao harvest."  # @src=a4d280c01ac7
  m09-l2-gating-migrations:
    # | Gating & points-to-token migrations: wiring the whole economy
    title: "Cancelas & migrações de pontos para token: ligando a economia inteira"  # @src=98e9b57db3d3
    blocks:
      check:                      # quiz
        questions:
          m09l2-q1-gate-trust:
            # | The alpha channel gates on holding a Founding-Farmer cNFT. A user's client
            # | sends a signed message saying 'I hold it.' How should your gate decide?
            prompt: "O canal alpha restringe o acesso a quem tem um cNFT Founding-Farmer. O cliente de um usuário manda uma mensagem assinada dizendo 'eu tenho ele.' Como a sua cancela deveria decidir?"  # @src=7c415b2474f5
            # | Gating decides on an on-chain reality, so it reads one: resolve the wallet's
            # | assets through DAS (cNFT reads require a DAS-supporting RPC) and confirm the
            # | gating asset resolves to that owner. A signature or a client claim is not
            # | evidence of a current holding. DAS is an index, so this read is fresh to
            # | within the provider's lag rather than instantaneous, which is a bill worth
            # | paying for a chat role and worth topping up with an on-chain confirmation
            # | for anything expensive.
            explanation: "A cancela decide com base em uma realidade on-chain, então ela lê uma: resolva os ativos da carteira pelo DAS (leituras de cNFT exigem um RPC com suporte a DAS) e confirme que o ativo da cancela resolve para aquele dono. Uma assinatura ou uma alegação do cliente não é evidência de uma posse atual. DAS é um índice, então essa leitura é atual até o limite do atraso do provedor em vez de instantânea, o que é um custo que vale pagar por um cargo de chat e vale complementar com uma confirmação on-chain para qualquer coisa cara."  # @src=be2cf904cf97
            options:                 # source order — keep it
              b:
                # | Check the local wallet adapter's cached token list for the
                # | Founding-Farmer cNFT, which is what the portfolio page renders from.
                label: "Conferir a lista de tokens em cache do wallet adapter local procurando o cNFT Founding-Farmer, que é de onde a página de portfólio renderiza."  # @src=b3e2e594328c
                # | A client-side cache is both spoofable and stale. The gate must verify
                # | against a DAS/on-chain source, not the client's own report.
                feedback: "Um cache client-side é ao mesmo tempo falsificável e desatualizado. A cancela tem que verificar contra uma fonte DAS/on-chain, não contra o relato do próprio cliente."  # @src=34d5912fe37c
              d:
                # | Ask for the crate's merkle proof with getAssetProof and verify it
                # | locally, so the decision rests on cryptography instead of on an index
                # | whose freshness you do not control.
                label: "Pedir a prova de Merkle do crate com getAssetProof e verificar ela localmente, para a decisão descansar em criptografia em vez de em um índice cuja atualidade você não controla."  # @src=108114552f48
                # | The proof comes from the same index and describes the same root, so it
                # | buys a round trip and no freshness. For a cNFT there is no account to
                # | fall back on.
                feedback: "A prova vem do mesmo índice e descreve a mesma raiz, então ela compra uma ida e volta e nenhuma atualidade. Para um cNFT não existe conta para a qual recorrer."  # @src=30520d9d3cf8
              c:
                # | Resolve the wallet's assets through a DAS read and confirm the
                # | Founding-Farmer cNFT actually resolves to that owner, accepting a
                # | bounded amount of index lag.
                label: "Resolver os ativos da carteira por uma leitura DAS e confirmar que o cNFT Founding-Farmer de fato resolve para aquele dono, aceitando uma quantidade limitada de atraso de índice."  # @src=ae2809bb7581
                # | A gate decides on a read the applicant cannot write to. Index lag is a
                # | bounded failure; trusting the applicant's own report is bounded by
                # | nothing.
                feedback: "Uma cancela decide com base em uma leitura na qual o candidato não consegue escrever. Atraso de índice é uma falha limitada; confiar no relato do próprio candidato não é limitado por nada."  # @src=8927034116c4
              a:
                # | Accept the wallet-signed message: a valid signature over the gate's
                # | challenge nonce proves the wallet controls its keys and therefore holds
                # | the badge.
                label: "Aceitar a mensagem assinada pela carteira: uma assinatura válida sobre o nonce de challenge da cancela prova que a carteira controla as chaves dela e portanto tem o badge."  # @src=d4fef03f9fd4
                # | A signature proves control of the keypair, not that the wallet currently
                # | holds a specific cNFT. Holdings must be read from the chain, not
                # | asserted by the client.
                feedback: "Uma assinatura prova controle do keypair, não que a carteira tem no momento um cNFT específico. Posses têm que ser lidas da chain, não afirmadas pelo cliente."  # @src=214f8907d6ed
          m09l2-q2-kmno-gap:
            # | You migrate compost points to SPROUT. The lesson points at Kamino's KMNO
            # | points-to-token migration as a case study but flags a gap. What's the honest
            # | way to use it?
            prompt: "Você migra pontos de compost para SPROUT. A lição aponta para a migração de pontos para token do KMNO da Kamino como estudo de caso mas sinaliza uma lacuna. Qual é o jeito honesto de usar ela?"  # @src=4f2eed08463d
            # | Kamino KMNO is a candidate case study with an honest numbers gap: the
            # | conversion tokenomics aren't public. The transferable lesson is the
            # | mechanism, a merkle-claim migration (reusing the conversion-window path you
            # | just built, with claim_locked for any vesting), not a ratio you'd be
            # | inventing.
            explanation: "Kamino KMNO é um estudo de caso candidato com uma lacuna honesta de números: a tokenomics da conversão não é pública. A lição transferível é o mecanismo, uma migração por claim de Merkle (reusando o caminho de janela de conversão que você acabou de construir, com claim_locked para qualquer vesting), não uma razão que você estaria inventando."  # @src=6e73edf3ce66
            options:                 # source order — keep it
              a:
                # | Reuse the mechanism, a merkle-claim path like your airdrop, but don't
                # | cite a KMNO conversion ratio; those numbers aren't published.
                label: "Reusar o mecanismo, um caminho de claim de Merkle como o do seu airdrop, mas não citar uma razão de conversão do KMNO; esses números não estão publicados."  # @src=c647456b6f00
                # | The mechanism is portable and the tokenomics are not. Nobody can hand
                # | you the ratio, which is exactly the gap the case study leaves open.
                feedback: "O mecanismo é portátil e a tokenomics não é. Ninguém consegue te entregar a razão, que é exatamente a lacuna que o estudo de caso deixa aberta."  # @src=afc6d9093ecc
              b:
                # | Copy Kamino's exact points-to-KMNO conversion ratio straight from their
                # | published docs into your migration config, since a shipped mainnet
                # | migration is the best-vetted number you can get.
                label: "Copiar a razão exata de conversão de pontos para KMNO da Kamino direto dos docs publicados deles para a sua config de migração, já que uma migração publicada em mainnet é o número mais bem examinado que você consegue."  # @src=6afb53f9655a
                # | Kamino's conversion tokenomics aren't surfaced in their docs; the
                # | research flags this as a gap. Copy the mechanism, not a number you can't
                # | verify.
                feedback: "A tokenomics de conversão da Kamino não é exposta nos docs deles; a pesquisa sinaliza isso como uma lacuna. Copie o mecanismo, não um número que você não consegue verificar."  # @src=a02afa803924
              c:
                # | Skip the merkle path and mint SPROUT straight to every points holder,
                # | batching them into as few transactions as fit.
                label: "Pular o caminho de Merkle e cunhar SPROUT direto para todo holder de pontos, agrupando eles no menor número de transações que couber."  # @src=c6c9f3be8b95
                # | A single-transaction mint to all holders doesn't scale and throws away
                # | the claim/vesting path you already built; the migration reuses that
                # | merkle path.
                feedback: "Uma cunhagem em uma transação só para todos os holders não escala e joga fora o caminho de claim/vesting que você já construiu; a migração reusa aquele caminho de Merkle."  # @src=70f39f3d956d
              d:
                # | Back the ratio out of KMNO's circulating supply and Kamino's published
                # | points totals, then apply the same implied rate to compost points.
                label: "Deduzir a razão a partir do supply circulante do KMNO e dos totais de pontos publicados da Kamino, depois aplicar a mesma taxa implícita aos pontos de compost."  # @src=6bfc0fc18306
                # | That reconstructs a number the lesson could not source, and it would
                # | still be somebody else's supply math. Your ratio is a decision about
                # | your own dilution.
                feedback: "Isso reconstrói um número que a lição não conseguiu referenciar, e ainda seria a matemática de supply de outra pessoa. A sua razão é uma decisão sobre a sua própria diluição."  # @src=04d91f51771e
          m09l2-q3-stale-index:
            # | Your gate-check just passed a wallet that transferred its Founding-Farmer
            # | cNFT away five seconds ago. What's the most likely cause?
            prompt: "O seu gate-check acabou de passar uma carteira que transferiu o cNFT Founding-Farmer dela para fora cinco segundos atrás. Qual é a causa mais provável?"  # @src=8eb9dc530ae6
            # | DAS is an indexed view of on-chain state, and indexers lag. A holding that
            # | changed seconds ago may not be reflected yet, so a gate can briefly admit a
            # | former holder. Design for freshness: accept the lag, or confirm against a
            # | fresher source for high-stakes gates.
            explanation: "DAS é uma visão indexada do estado on-chain, e indexadores atrasam. Uma posse que mudou segundos atrás pode ainda não estar refletida, então uma cancela pode brevemente admitir um ex-holder. Projete pensando na atualidade: aceite o atraso, ou confirme contra uma fonte mais atual para cancelas de alto risco."  # @src=3a1f06d67c92
            options:                 # source order — keep it
              b:
                # | The DAS index hadn't caught up: a just-transferred asset can still
                # | resolve to the old owner until the indexer updates.
                label: "O índice DAS não tinha alcançado: um ativo recém-transferido ainda pode resolver para o dono antigo até o indexador atualizar."  # @src=d99ee3ca4b7a
                # | Not a bug in your gate and not a bug in the provider. It is what an
                # | index is, which is why a soulbound badge is the fix that removes the
                # | case rather than shrinking it.
                feedback: "Não é um bug na sua cancela e não é um bug no provedor. É o que um índice é, que é o motivo de um badge soulbound ser a correção que remove o caso em vez de encolher ele."  # @src=66d278919c46
              d:
                # | The gate skipped its on-chain confirmation step, which for a cNFT would
                # | have caught the transfer.
                label: "A cancela pulou o passo de confirmação on-chain dela, que para um cNFT teria pego a transferência."  # @src=2051ecf89364
                # | That remedy exists for a fungible balance, where getTokenAccountsByOwner
                # | is a fresher second read. A cNFT has no account to confirm against,
                # | which is why the lag is structural here.
                feedback: "Esse remédio existe para um saldo fungível, onde getTokenAccountsByOwner é uma segunda leitura mais atual. Um cNFT não tem conta contra a qual confirmar, que é o motivo de o atraso ser estrutural aqui."  # @src=38cf85887830
              c:
                # | DAS reads are cryptographically final, so the gate is authoritative and
                # | the old owner cannot still resolve.
                label: "Leituras DAS são criptograficamente finais, então a cancela é autoritativa e o dono antigo não consegue ainda resolver."  # @src=a3dda7078d04
                # | DAS is an indexer view, not a consensus proof; it lags the chain by
                # | design. The issue is freshness, not finality.
                feedback: "DAS é uma visão de indexador, não uma prova de consenso; ele atrasa em relação à chain por design. A questão é atualidade, não finalidade."  # @src=81bf58aa8d60
              a:
                # | cNFTs can't be transferred, so the read must be misreporting the
                # | transfer.
                label: "cNFTs não podem ser transferidos, então a leitura deve estar reportando errado a transferência."  # @src=d37efba0fb3d
                # | cNFTs are transferable via Bubblegum v2 transfer_v2. The badge is
                # | soulbound only because set_non_transferable_v2 was applied; an ordinary
                # | cNFT can move freely.
                feedback: "cNFTs são transferíveis via Bubblegum v2 transfer_v2. O badge é soulbound só porque set_non_transferable_v2 foi aplicado; um cNFT comum consegue se mover livremente."  # @src=06038186c4d2
  m09-l3-production-case-studies:
    # | Production case studies & the frontier: what actually shipped
    title: "Estudos de caso em produção & a fronteira: o que de fato foi entregue"  # @src=668a9ddb0539
    blocks:
      check:                      # quiz
        questions:
          m09l3-q1-pyusd-dormant:
            # | You read PYUSD's live mint on-chain. What does 'configured but dormant' mean
            # | for its extension set?
            prompt: "Você lê o mint ao vivo do PYUSD on-chain. O que 'configurado mas dormente' significa para o conjunto de extensões dele?"  # @src=862b6a783ab6
            # | PYUSD arms a full compliance-shaped set (eight TLV extensions) but reads
            # | inert on-chain: hook programId null, fee 0 bps. 'Configured but dormant' is
            # | the teachable fact. You verify it by reading the mint, not by inferring
            # | behavior from the presence of an extension.
            explanation: "O PYUSD arma um conjunto completo com formato de compliance (oito extensões TLV) mas lê como inerte on-chain: programId do hook null, taxa 0 bps. 'Configurado mas dormente' é o fato ensinável. Você verifica isso lendo o mint, não inferindo comportamento a partir da presença de uma extensão."  # @src=152d7c5afad4
            options:                 # source order — keep it
              c:
                # | The mint carries eight TLV extensions, but the behavior-bearing ones
                # | read inert: hook programId null, transfer fee 0 bps.
                label: "O mint carrega oito extensões TLV, mas as que carregam comportamento leem como inertes: programId do hook null, taxa de transferência 0 bps."  # @src=5944aefa30ee
                # | Presence tells a user what could happen; the field value tells them what
                # | will happen on the next transfer. Those two sentences belong in
                # | different parts of your UI.
                feedback: "Presença diz a um usuário o que poderia acontecer; o valor do campo diz a ele o que vai acontecer na próxima transferência. Essas duas frases pertencem a partes diferentes da sua UI."  # @src=1b0e186683a8
              a:
                # | PYUSD carries seven extensions, and all seven of them actively enforce
                # | on every transfer it makes.
                label: "O PYUSD carrega sete extensões, e todas as sete impõem ativamente em toda transferência que ele faz."  # @src=d36efc78088a
                # | Counting TLV entries, PYUSD carries eight extensions, and the
                # | behavior-bearing ones are inert: the hook programId is null and the
                # | transfer fee is 0 bps.
                feedback: "Contando entradas TLV, o PYUSD carrega oito extensões, e as que carregam comportamento estão inertes: o programId do hook é null e a taxa de transferência é 0 bps."  # @src=33bf6d0e0b06
              b:
                # | The extensions are present in the mint's TLV data, but Token-2022 keeps
                # | each one disabled until an audit.
                label: "As extensões estão presentes nos dados TLV do mint, mas o Token-2022 mantém cada uma desabilitada até uma auditoria."  # @src=3c8276d93f0e
                # | Token-2022 doesn't gate a mint's extensions behind an audit. PYUSD's
                # | issuer configured the extensions without arming them; that's an issuer
                # | choice, not a program lock.
                feedback: "O Token-2022 não condiciona as extensões de um mint a uma auditoria. O emissor do PYUSD configurou as extensões sem armá-las; isso é uma escolha do emissor, não uma trava do programa."  # @src=62a550296121
              d:
                # | A dormant extension has a null authority, so none of them can ever fire
                # | whatever the issuer decides later.
                label: "Uma extensão dormente tem autoridade nula, então nenhuma delas jamais consegue disparar, decida o emissor o que decidir depois."  # @src=cc9012c1f479
                # | A null authority would make a slot inert and dead for good. All eight of
                # | PYUSD's list the same live authority, which is what makes the four idle
                # | ones armed rather than dead.
                feedback: "Uma autoridade nula deixaria um slot inerte e morto de vez. Todas as oito do PYUSD listam a mesma autoridade viva, que é o que faz as quatro paradas serem armadas em vez de mortas."  # @src=ba15cba7bdc3
          m09l3-q2-jto-maps:
            # | Which primitive you built maps most directly onto Jito's JTO airdrop?
            prompt: "Qual primitiva que você construiu mapeia mais diretamente no airdrop JTO da Jito?"  # @src=785b56b967ee
            # | The JTO drop is the canonical merkle-distributor-with-linear-vesting case
            # | study, the very mechanism you reused for the compost-points migration,
            # | including the claim_locked vesting step. That's the point of the case study:
            # | real deployments run the primitives you built.
            explanation: "O drop do JTO é o estudo de caso canônico de distribuidor-de-Merkle-com-vesting-linear, exatamente o mecanismo que você reusou para a migração de pontos de compost, incluindo o passo de vesting do claim_locked. Esse é o ponto do estudo de caso: deployments de verdade rodam as primitivas que você construiu."  # @src=5dac6e8b9459
            options:                 # source order — keep it
              c:
                # | The transfer-hook program, with JTO enforcing its claims through a
                # | custom hook on every transfer.
                label: "O programa de transfer hook, com o JTO impondo os claims dele através de um hook customizado em toda transferência."  # @src=884a867b62a2
                # | JTO used a merkle distributor, not a transfer hook. The linearly-vesting
                # | portion is what maps onto your claim_locked step.
                feedback: "O JTO usou um distribuidor de Merkle, não um transfer hook. A porção com vesting linear é o que mapeia no seu passo de claim_locked."  # @src=79e054527e7f
              a:
                # | The compost-airdrop's merkle-claim path with claim_locked vesting; JTO
                # | ran a merkle distributor with linear vesting.
                label: "O caminho de claim por Merkle do compost-airdrop com vesting de claim_locked; o JTO rodou um distribuidor de Merkle com vesting linear."  # @src=d0dd58ddf380
                # | Same program, in fact: mERKcfxMC5SqJn4Ld4BUris3WKZZ1ojjWJ3A3J5CKxv is
                # | still executable on mainnet, and its claim_locked is the instruction you
                # | ported.
                feedback: "O mesmo programa, na verdade: o mERKcfxMC5SqJn4Ld4BUris3WKZZ1ojjWJ3A3J5CKxv continua executável na mainnet, e o claim_locked dele é a instrução que você portou."  # @src=7f001b858457
              d:
                # | The compressed-token push from the airdrop lab, since JTO went out to
                # | every holder without a claim step.
                label: "O push de tokens comprimidos do lab de airdrop, já que o JTO saiu para todo holder sem um passo de claim."  # @src=9e5e6299c390
                # | A push writes to each recipient whether or not they show up; JTO was a
                # | pull, where recipients brought a proof and opened their own status
                # | account.
                feedback: "Um push escreve para cada destinatário, apareçam eles ou não; o JTO foi um pull, em que destinatários trouxeram uma prova e abriram a própria conta de status."  # @src=e22e2a09157a
              b:
                # | The confidential-transfer variant, in which JTO distributed each
                # | allocation as an encrypted amount.
                label: "A variante de transferência confidencial, em que o JTO distribuiu cada alocação como um valor encriptado."  # @src=ae292a637ab7
                # | JTO's distribution was a public merkle drop with vesting, not a
                # | confidential-transfer deployment.
                feedback: "A distribuição do JTO foi um drop de Merkle público com vesting, não um deployment de transferência confidencial."  # @src=48365a1eabc1
          m09l3-q3-frontier-honesty:
            # | Writing case-study notes, you cite an official Solana page that says
            # | confidential transfers are 'expected EOY 2024,' and you describe Metaplex
            # | Agent Registry as a shipping production standard. What's wrong?
            prompt: "Escrevendo notas de estudo de caso, você cita uma página oficial da Solana que diz que transferências confidenciais são 'previstas para o fim de 2024,' e você descreve o Metaplex Agent Registry como um padrão de produção já entregue. O que está errado?"  # @src=a82d2b7f1eef
            # | Two honesty traps: official pages carry dead dates (confidential transfers
            # | 'expected EOY 2024'), and the agent-identity stack (Metaplex Agent Registry,
            # | the Core AgentIdentity plugin, DAS is_agent as a nullable boolean field) is
            # | a real but unproven 2026 direction. Cite the stale page only for its
            # | audit-firm list, and frame agent identity as a frontier beat.
            explanation: "Duas ciladas de honestidade: páginas oficiais carregam datas mortas (transferências confidenciais 'previstas para o fim de 2024'), e a pilha de identidade de agente (Metaplex Agent Registry, o plugin AgentIdentity do Core, is_agent do DAS como um campo booleano que pode ser nulo) é uma direção de 2026 real mas não comprovada. Cite a página desatualizada só pela lista de firmas de auditoria dela, e enquadre identidade de agente como um assunto de fronteira."  # @src=d34ee8b2ac5e
            options:                 # source order — keep it
              b:
                # | Both: the date is stale text on a live page, and agent identity is a
                # | direction.
                label: "As duas coisas: a data é texto desatualizado numa página viva, e identidade de agente é uma direção."  # @src=d36c08bcf6b8
                # | Confidential transfers have been on mainnet a while; cite that page for
                # | its five-firm audit roster, never for the date. Agent Registry,
                # | AgentIdentity and is_agent add up to a direction.
                feedback: "Transferências confidenciais estão na mainnet há um tempo; cite aquela página pela lista de auditoria de cinco firmas dela, nunca pela data. Agent Registry, AgentIdentity e is_agent somam uma direção."  # @src=b02dcf6a9d9b
              a:
                # | Nothing is wrong: both are current, verified facts and you can cite each
                # | of them as they stand.
                label: "Nada está errado: os dois são fatos atuais e verificados e você pode citar cada um deles como estão."  # @src=2e823b4574e8
                # | Both are traps: the 'EOY 2024' line is dead text on a live page, and
                # | agent identity is a 2026 frontier beat, not a production standard.
                feedback: "Os dois são ciladas: a linha 'fim de 2024' é texto morto numa página viva, e identidade de agente é um assunto de fronteira de 2026, não um padrão de produção."  # @src=47385a99fb74
              c:
                # | The confidential-transfer date is fine, and only the agent-identity
                # | claim is premature.
                label: "A data da transferência confidencial está bem, e só a afirmação de identidade de agente é prematura."  # @src=a404419eef0e
                # | The confidential-transfer page is also stale: a live official page
                # | carrying a dead 2024 claim. Cite it only for its audit-firm list, not
                # | its timeline.
                feedback: "A página de transferência confidencial também está desatualizada: uma página oficial viva carregando uma afirmação morta de 2024. Cite ela só pela lista de firmas de auditoria dela, não pela linha do tempo dela."  # @src=1492b97e46e4
              d:
                # | Only the date is wrong; the Agent Registry, AgentIdentity plugin and
                # | is_agent field do add up to a shipped standard.
                label: "Só a data está errada; o Agent Registry, o plugin AgentIdentity e o campo is_agent somam mesmo um padrão entregue."  # @src=43d012fd4823
                # | Three pieces of plumbing are not convergence. A nullable boolean on a
                # | read interface is what an early field looks like, and its semantics can
                # | still move under you.
                feedback: "Três peças de encanamento não são convergência. Um booleano que pode ser nulo em uma interface de leitura é com o que se parece um campo recente, e a semântica dele ainda pode se mover debaixo de você."  # @src=9f560d983128
  m10-l1-capstone-choose-primitive:
    # | Capstone: choose your primitive and wire the economy
    title: "Capstone: escolha a sua primitiva e ligue a economia"  # @src=8ef4a63f1f48
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Your brief is a regulated payment token that must stay tradeable on Raydium
            # | AND let compliance freeze a bad actor. Which primitive choice is defensible?
            prompt: "O seu brief é um token de pagamento regulado que precisa continuar negociável na Raydium E deixar compliance congelar um ator malicioso. Qual escolha de primitiva é defensável?"  # @src=07be5b1c79a9
            # | The compatibility thesis decides this brief: fee, display, and accounting
            # | extensions get whitelisted, power extensions get refused — and the one-liner
            # | must never contain the word compliance, because compliance-shaped extensions
            # | like PermanentDelegate are exactly the powers the allowlist refuses. The
            # | freeze itself needs no extension at all: it is the mint's base-layer freeze
            # | authority, a day-one field on every mint, which is why it costs nothing on
            # | the allowlist. PermanentDelegate is the clawback power, and keeping it while
            # | staying routable on Raydium means the static MINT_WHITELIST path that
            # | regulated stablecoins use; otherwise you ship display-only extensions and
            # | enforce compliance off the DEX.
            explanation: "A tese de compatibilidade decide este brief: extensões de taxa, de exibição e de contabilidade entram na whitelist, extensões de poder são recusadas — e a frase de uma linha nunca pode conter a palavra compliance, porque extensões com forma de compliance como PermanentDelegate são exatamente os poderes que a allowlist recusa. O congelamento em si não precisa de extensão nenhuma: ele é a autoridade de congelamento da camada base do mint, um campo que existe desde o dia um em todo mint, que é por isso que ele não custa nada na allowlist. PermanentDelegate é o poder de confisco, e mantê-lo enquanto continua roteável na Raydium significa o caminho estático da MINT_WHITELIST que stablecoins reguladas usam; caso contrário você entrega extensões só de exibição e impõe compliance fora da DEX."  # @src=9d36f6f1243b
            options:                 # source order — keep it
              b:
                # | Token-2022 with PermanentDelegate + TransferHook so compliance can
                # | freeze bad actors and screen every transfer against a sanctions list,
                # | since CP-Swap routes Token-2022 like classic SPL
                label: "Token-2022 com PermanentDelegate + TransferHook para que compliance possa congelar atores maliciosos e filtrar toda transferência contra uma lista de sanções, já que o CP-Swap roteia Token-2022 como SPL clássico"  # @src=147d08b0b77c
                # | Raydium's CP-Swap allowlist is exactly five extensions and explicitly
                # | rejects TransferHook and PermanentDelegate; a non-whitelisted mint
                # | carrying them reverts pool creation.
                feedback: "A allowlist do CP-Swap da Raydium é exatamente cinco extensões e rejeita explicitamente TransferHook e PermanentDelegate; um mint fora da whitelist que as carregue reverte a criação da pool."  # @src=9ee44c86c20b
              d:
                # | Copy PYUSD and arm PermanentDelegate plus TransferHook at mint while
                # | leaving both switched off, since a dormant power extension gives a
                # | permissionless pool nothing to object to at pool creation
                label: "Copiar o PYUSD e armar PermanentDelegate mais TransferHook na cunhagem deixando os dois desligados, já que uma extensão de poder dormente não dá a uma pool sem permissão nada a que objetar na criação da pool"  # @src=1593cd61e28c
                # | The allowlist reads the extension type, not your intentions: a dormant
                # | permanent delegate is refused exactly like a live one. PYUSD trades
                # | anyway because it took a business route a course token does not have.
                feedback: "A allowlist lê o tipo de extensão, não as suas intenções: um delegado permanente dormente é recusado exatamente como um vivo. O PYUSD é negociado assim mesmo porque ele pegou uma rota de negócios que um token de curso não tem."  # @src=e12e061e0080
              c:
                # | A Metaplex Core asset with a Freeze delegate plugin, since that is the
                # | cheapest way to get a compliance freeze on a token
                label: "Um ativo Metaplex Core com um plugin Freeze delegate, já que esse é o jeito mais barato de conseguir um congelamento de compliance em um token"  # @src=69c03e8181ce
                # | Core assets are NFTs, not fungible tokens; a divisible payment token
                # | needs a fungible mint, which Core does not provide.
                feedback: "Ativos Core são NFTs, não tokens fungíveis; um token de pagamento divisível precisa de um mint fungível, que o Core não fornece."  # @src=1a2a65ebd8dc
              a:
                # | Token-2022 with display extensions (MetadataPointer + TokenMetadata)
                # | plus a TransferFeeConfig armed at 0 bps, keeping the mint's base-layer
                # | freeze authority for the compliance freeze
                label: "Token-2022 com extensões de exibição (MetadataPointer + TokenMetadata) mais um TransferFeeConfig armado em 0 bps, mantendo a autoridade de congelamento da camada base do mint para o congelamento de compliance"  # @src=d481351033a7
                # | The freeze needs no extension at all: it is a day-one field on every
                # | mint, which is why it costs nothing on the allowlist. Note the fee is
                # | armed at 0 bps and withholds nothing until you raise it, and if
                # | compliance also needs PermanentDelegate clawback the route is Raydium's
                # | hardcoded MINT_WHITELIST, not a smaller extension set.
                feedback: "O congelamento não precisa de extensão nenhuma: ele é um campo que existe desde o dia um em todo mint, que é por isso que ele não custa nada na allowlist. Repare que a taxa está armada em 0 bps e não retém nada até você aumentá-la, e se compliance também precisar do confisco do PermanentDelegate a rota é a MINT_WHITELIST hardcoded da Raydium, não um conjunto de extensões menor."  # @src=fac409edcaa1
          q2:
            # | The musician's-drop brief wants a print run where each piece is numbered and
            # | the creator's cut still means something in 2026. Which primitive fits?
            prompt: "O brief do drop do músico quer uma tiragem em que cada peça é numerada e a fatia do criador ainda significa alguma coisa em 2026. Qual primitiva encaixa?"  # @src=202e3a5c0159
            # | The 2026 ship-path for new NFT work is Metaplex Core; the Edition plugin
            # | gives numbered prints and the Royalties plugin carries the configuration.
            # | This is exactly the worked edition step from the Core lesson, which is why
            # | the brief points here.
            explanation: "O caminho de entrega de 2026 para trabalho novo com NFT é o Metaplex Core; o plugin Edition dá impressões numeradas e o plugin Royalties carrega a configuração. Este é exatamente o passo de edição trabalhado da lição de Core, que é por isso que o brief aponta para cá."  # @src=40e91a127b25
            options:                 # source order — keep it
              c:
                # | A pNFT through Token Metadata with a Token Auth Rules rule set, since
                # | pNFTs were purpose-built to enforce royalties at transfer time
                label: "Um pNFT via Token Metadata com um rule set de Token Auth Rules, já que pNFTs foram feitos de propósito para impor royalties no momento da transferência"  # @src=c5664cc498ab
                # | Token Metadata is officially legacy and pNFT enforcement runs through
                # | Token Auth Rules, which Metaplex marks Deprecated and whose flagship
                # | rule set blocks zero programs. You would ship a deprecated stack for
                # | enforcement that is armed but idle.
                feedback: "O Token Metadata é oficialmente legado e a imposição de pNFT roda através do Token Auth Rules, que a Metaplex marca como Deprecated e cujo rule set emblemático bloqueia zero programas. Você entregaria uma stack deprecada para uma imposição que está armada mas inativa."  # @src=224effd8a5a7
              a:
                # | A classic SPL mint with seller_fee_basis_points set on it, plus an
                # | edition counter you keep
                label: "Um mint SPL clássico com seller_fee_basis_points setado nele, mais um contador de edição que você mantém"  # @src=4a7b9f520862
                # | Classic SPL has no metadata or royalty fields at all;
                # | seller_fee_basis_points lives in Token Metadata and is purely indicative
                # | even there.
                feedback: "O SPL clássico não tem campo nenhum de metadados ou de royalty; seller_fee_basis_points vive no Token Metadata e é puramente indicativo mesmo lá."  # @src=f9d44ff27d4e
              d:
                # | Bubblegum v2 cNFTs, since compression is the 2026 default for any NFT
                # | drop of this shape
                label: "cNFTs Bubblegum v2, já que a compressão é o default de 2026 para qualquer drop de NFT com esse formato"  # @src=9eec65fcffdd
                # | Compression pays when the count is large and the write rate is low. A
                # | numbered print run with a royalty split is the shape the course
                # | deliberately kept on Core accounts.
                feedback: "A compressão compensa quando a contagem é grande e a taxa de escrita é baixa. Uma tiragem numerada com um split de royalty é o formato que o curso deliberadamente manteve em contas Core."  # @src=5c88a176edd2
              b:
                # | A Metaplex Core collection with the Royalties plugin and numbered prints
                # | via the Edition plugin
                label: "Uma coleção Metaplex Core com o plugin Royalties e impressões numeradas via o plugin Edition"  # @src=3a6a7d4e8b13
                # | Royalties is authority-managed, so it survives every resale rather than
                # | being revoked on transfer, and the collection's MasterEdition carries
                # | the cap each print's Edition number reads against.
                feedback: "Royalties é gerenciado por autoridade, então ele sobrevive a toda revenda em vez de ser revogado na transferência, e o MasterEdition da coleção carrega o teto contra o qual o número de Edition de cada impressão é lido."  # @src=56a4a2faf791
          q3:
            # | You shipped a cNFT loot drop, but your verification script's getAsset call
            # | fails against the endpoint you pointed it at. What is the most likely cause?
            prompt: "Você entregou um loot drop de cNFT, mas a chamada getAsset do seu script de verificação falha contra o endpoint para o qual você o apontou. Qual é a causa mais provável?"  # @src=8528f96ebee7
            # | A cNFT's on-chain footprint is a Merkle leaf hash; the full asset is
            # | reconstructed by DAS indexers from off-chain data stores. A verification
            # | script pointed at a non-DAS RPC fails outright — your challenge run's
            # | JSON-RPC method-not-found throw — which is why the integration proof depends
            # | on a DAS endpoint.
            explanation: "A pegada on-chain de um cNFT é um hash de folha de Merkle; o ativo completo é reconstruído por indexadores DAS a partir de data stores off-chain. Um script de verificação apontado para um RPC sem DAS falha de cara — o throw de método-não-encontrado do JSON-RPC da sua rodada do challenge — que é por isso que a prova de integração depende de um endpoint DAS."  # @src=7e8aa7de3e21
            options:                 # source order — keep it
              b:
                # | The memo declared the wrong extension set for the asset
                label: "O memo declarou o conjunto de extensões errado para o ativo"  # @src=154509d5342a
                # | Extension state applies to fungible Token-2022 mints, not to a
                # | compressed-NFT leaf; it has no bearing on whether getAsset resolves.
                feedback: "Estado de extensão se aplica a mints Token-2022 fungíveis, não a uma folha de NFT comprimido; ele não tem influência nenhuma sobre o getAsset resolver ou não."  # @src=c9411fa3a9ff
              d:
                # | The asset id was derived from the wrong leaf index, so nothing exists at
                # | that id
                label: "O asset id foi derivado do índice de folha errado, então não existe nada naquele id"  # @src=148e9ab70558
                # | That would return an empty result from a DAS endpoint, not a failed
                # | call. The asset id is a deterministic PDA over the tree and leaf index,
                # | so it is worth re-deriving, but it is not what breaks the call.
                feedback: "Isso devolveria um resultado vazio de um endpoint DAS, não uma chamada com falha. O asset id é um PDA determinístico sobre a árvore e o índice de folha, então vale a pena re-derivá-lo, mas não é o que quebra a chamada."  # @src=2a04fa211f31
              c:
                # | You are querying an RPC without DAS support, and cNFT reads require a
                # | DAS-supporting RPC
                label: "Você está consultando um RPC sem suporte a DAS, e leituras de cNFT exigem um RPC com suporte a DAS"  # @src=84da9dfd4787
                # | The tell is the error shape: a plain endpoint answers -32601 method not
                # | found. Worse is a provider that swallows it into an empty result, which
                # | is why your reader fails loudly on that code.
                feedback: "O sinal é o formato do erro: um endpoint comum responde -32601 method not found. Pior é um provedor que engole isso em um resultado vazio, que é por isso que o seu leitor falha alto naquele código."  # @src=d7c112f2bc73
              a:
                # | The cNFT was never minted, because a valid cNFT always resolves on any
                # | RPC
                label: "O cNFT nunca foi cunhado, porque um cNFT válido sempre resolve em qualquer RPC"  # @src=1aff78cdf629
                # | cNFT data lives off-chain in RPC-managed data stores; even a validly
                # | minted cNFT cannot resolve through a plain RPC, so the failure proves
                # | nothing about the mint.
                feedback: "Dados de cNFT vivem off-chain em data stores gerenciados por RPC; mesmo um cNFT validamente cunhado não consegue resolver através de um RPC comum, então a falha não prova nada sobre o mint."  # @src=dc1fd17968d8
  m10-l2-cumulative-checkpoint-close:
    # | Cumulative checkpoint and close
    title: "Checkpoint cumulativo e encerramento"  # @src=466bda36c9d2
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Cold brief: a cafe loyalty currency that must stay tradeable on Raydium,
            # | with no compliance controls needed. What is the defensible cold decision?
            prompt: "Brief a frio: uma moeda de fidelidade de um café que precisa continuar negociável na Raydium, sem nenhum controle de compliance necessário. Qual é a decisão a frio defensável?"  # @src=afa62e71ab8f
            # | With no compliance need and a hard tradeability requirement, the thesis
            # | points straight at display-only extensions: they get whitelisted, they add
            # | native metadata, and they keep the token on the allowlist. This is the
            # | checkpoint's simplest row, and getting it cold confirms the compatibility
            # | model transferred.
            explanation: "Sem necessidade de compliance e com um requisito duro de negociabilidade, a tese aponta direto para extensões só de exibição: elas entram na whitelist, elas adicionam metadados nativos, e elas mantêm o token na allowlist. Esta é a linha mais simples do checkpoint, e acertar ela a frio confirma que o modelo de compatibilidade foi transferido."  # @src=a6939efaff2f
            options:                 # source order — keep it
              b:
                # | A classic SPL mint, because a loyalty currency cannot use Token-2022
                # | without inviting extension risk it does not need
                label: "Um mint SPL clássico, porque uma moeda de fidelidade não pode usar Token-2022 sem convidar um risco de extensão de que ela não precisa"  # @src=171a07221dc9
                # | Token-2022 is a superset of classic SPL; display-only extensions are
                # | exactly what keep a token both featureful and routable. Classic SPL
                # | would work but forgoes native metadata for no reason.
                feedback: "Token-2022 é um superconjunto do SPL clássico; extensões só de exibição são exatamente o que mantém um token ao mesmo tempo cheio de features e roteável. SPL clássico funcionaria mas abre mão de metadados nativos sem razão."  # @src=12dc5688d3f9
              d:
                # | Token-2022 with MetadataPointer, TokenMetadata and a PermanentDelegate
                # | for clawbacks, which is still only three of the five allowlist slots
                label: "Token-2022 com MetadataPointer, TokenMetadata e um PermanentDelegate para confiscos, o que ainda é só três dos cinco slots da allowlist"  # @src=e170013ed4a6
                # | The rule is every, not some. Two allowlisted extensions beside one
                # | refused extension is still refused, because the pool's exposure to a
                # | delegate that can sweep its vault does not shrink when a metadata
                # | pointer sits next to it.
                feedback: "A regra é every, não some. Duas extensões da allowlist ao lado de uma extensão recusada continua recusado, porque a exposição da pool a um delegado que pode varrer o vault dela não encolhe quando um ponteiro de metadados senta do lado."  # @src=1384e7d56595
              c:
                # | Token-2022 with a TransferHook that logs every loyalty transfer
                # | on-chain, plus MetadataPointer and TokenMetadata.
                label: "Token-2022 com um TransferHook que loga toda transferência de fidelidade on-chain, mais MetadataPointer e TokenMetadata."  # @src=267d00a9dfde
                # | TransferHook is a power extension Raydium rejects; a currency that must
                # | stay tradeable cannot carry it unless the mint is whitelisted.
                feedback: "TransferHook é uma extensão de poder que a Raydium rejeita; uma moeda que precisa continuar negociável não pode carregar ela a menos que o mint esteja na whitelist."  # @src=8ac0fa41c2ea
              a:
                # | Token-2022 with display-only extensions (MetadataPointer +
                # | TokenMetadata), no power extensions, so it stays on Raydium's
                # | five-extension allowlist
                label: "Token-2022 com extensões só de exibição (MetadataPointer + TokenMetadata), nenhuma extensão de poder, então ele fica na allowlist de cinco extensões da Raydium"  # @src=99de23a27a0f
                # | Cold decisions are the ones you make before a brief tempts you. No
                # | compliance requirement means no power extension has to be argued for,
                # | and the token stays routable by construction.
                feedback: "Decisões a frio são as que você toma antes de um brief te tentar. Nenhum requisito de compliance significa que nenhuma extensão de poder precisa ser defendida, e o token continua roteável por construção."  # @src=35c62c9e8360
          q2:
            # | In the close you place each refused topic with its sibling course. Which
            # | course carries 'how a live RWA issuer structures compliance rails and KYC'?
            prompt: "No encerramento você coloca cada tópico recusado com o curso irmão dele. Qual curso carrega 'como um emissor de RWA ao vivo estrutura trilhos de compliance e KYC'?"  # @src=11eb1bb6095d
            # | This course teaches the compliance-shaped primitives (freeze, permanent
            # | delegate, default-frozen, hooks) but deliberately refuses the legal and
            # | issuer framing. That RWA-specific issuance and compliance work is the
            # | planned DeFi and RWA Engineering course's territory, and it builds directly
            # | on the primitives taught here.
            explanation: "Este curso ensina as primitivas com formato de compliance (congelamento, delegado permanente, congelado por padrão, hooks) mas deliberadamente recusa o enquadramento legal e de emissor. Esse trabalho de emissão e compliance específico de RWA é o território do curso planejado DeFi and RWA Engineering, e ele constrói diretamente sobre as primitivas ensinadas aqui."  # @src=31f8e2df55e9
            options:                 # source order — keep it
              b:
                # | The planned DeFi and RWA Engineering course, where RWA issuance and the
                # | compliance rails around it live
                label: "O curso planejado DeFi and RWA Engineering, onde moram a emissão de RWA e os trilhos de compliance em volta dela"  # @src=2aaad5b4df5c
                # | Everything it assumes on the token layer is what you just built, which
                # | is why the hand-off is a front door rather than a window.
                feedback: "Tudo o que ele assume na camada de token é o que você acabou de construir, que é por que a passagem de bastão é uma porta da frente em vez de uma janela."  # @src=bd8f28c8b5bb
              c:
                # | The Master Anchor V2 course, since compliance rails come down to program
                # | constraints and CPI
                label: "O curso Master Anchor V2, já que trilhos de compliance se resumem a constraints de programa e CPI"  # @src=da9a00460824
                # | That course owns the Anchor framework layer (macros, constraints, CPI,
                # | testing), not RWA compliance rails.
                feedback: "Esse curso é dono da camada do framework Anchor (macros, constraints, CPI, testes), não dos trilhos de compliance de RWA."  # @src=b313052c4d64
              d:
                # | This course already covered it: the compliance-shaped extension set and
                # | a live issuer's dormant powers are that framing, so no sibling course is
                # | needed
                label: "Este curso já cobriu isso: o conjunto de extensões com formato de compliance e os poderes dormentes de um emissor ao vivo são esse enquadramento, então nenhum curso irmão é necessário"  # @src=06ab1e6145d4
                # | This course taught you to read a compliance-shaped mint and refused the
                # | legal and issuer framing that turns one into a regulated instrument.
                # | Reading PYUSD is not structuring an issuance.
                feedback: "Este curso te ensinou a ler um mint com formato de compliance e recusou o enquadramento legal e de emissor que transforma um deles em um instrumento regulado. Ler o PYUSD não é estruturar uma emissão."  # @src=0853a12008f8
              a:
                # | The planned Client-Side Mastery course, since KYC checks and compliance
                # | screens ultimately run in the client and indexing layer the user touches
                label: "O curso planejado Client-Side Mastery, já que checagens de KYC e telas de compliance no fim rodam na camada de cliente e de indexação que o usuário toca"  # @src=0e89cd1cfc50
                # | That course owns indexing infrastructure and transaction-landing, not
                # | RWA issuance or compliance framing.
                feedback: "Esse curso é dono de infraestrutura de indexação e do pouso de transação, não de emissão de RWA nem de enquadramento de compliance."  # @src=baca7cda6890
          q3:
            # | A checkpoint brief asks for a soulbound achievement badge minted to a
            # | million holders cheaply. Which taught primitive fits, and what makes the
            # | answer a 2026 answer?
            prompt: "Um brief de checkpoint pede um badge de conquista soulbound cunhado para um milhão de holders de forma barata. Qual primitiva ensinada serve, e o que faz da resposta uma resposta de 2026?"  # @src=7327100f1bb7
            # | The brief combines two constraints, soulbound AND mass-mint-cheap, that only
            # | compression satisfies together. Bubblegum v2's set_non_transferable_v2 is
            # | exactly the new capability, and naming why it is current (it overturns the
            # | 2024 folklore) is what the close is training you to see.
            explanation: "O brief combina duas restrições, soulbound E cunhagem-em-massa-barata, que só a compressão satisfaz juntas. O set_non_transferable_v2 do Bubblegum v2 é exatamente a nova capacidade, e nomear por que ela é atual (ela derruba o folclore de 2024) é o que o encerramento está te treinando para enxergar."  # @src=af772cfacba5
            options:                 # source order — keep it
              c:
                # | A Bubblegum v2 cNFT with set_non_transferable_v2; soulbound compressed
                # | NFTs are new in v2 and contradict the 2024 'cNFTs can't be soulbound'
                # | folklore
                label: "Um cNFT Bubblegum v2 com set_non_transferable_v2; NFTs comprimidos soulbound são novidade na v2 e contradizem o folclore de 2024 de que 'cNFTs não podem ser soulbound'"  # @src=37cb772df47b
                # | Soulbound is bit 2 of the v2 leaf's flags byte, authorised by a
                # | PermanentFreezeDelegate on the tree's Core collection. Cheap at a
                # | million and non-transferable, which V1 could not do.
                feedback: "Soulbound é o bit 2 do byte de flags da folha v2, autorizado por um PermanentFreezeDelegate na coleção Core da árvore. Barato em um milhão e não transferível, o que a V1 não conseguia fazer."  # @src=ea5ae72b0748
              a:
                # | A Token-2022 NonTransferable fungible mint, because soulbound has long
                # | been a fungible-only pattern
                label: "Um mint fungível Token-2022 NonTransferable, porque soulbound há muito tempo é um padrão exclusivo de fungíveis"  # @src=31ce14b9c46a
                # | NonTransferable does make a soulbound fungible, but 'a million cheap
                # | badges' is a mass-mint NFT problem, not a fungible-supply one.
                feedback: "NonTransferable de fato torna um fungível soulbound, mas 'um milhão de badges baratos' é um problema de NFT de cunhagem em massa, não um problema de supply fungível."  # @src=6f0185e3654e
              b:
                # | A Metaplex Core asset with PermanentFreeze on every badge, because Core
                # | is the only soulbound path there is
                label: "Um ativo Metaplex Core com PermanentFreeze em todo badge, porque Core é o único caminho soulbound que existe"  # @src=43801c0be975
                # | Core soulbound works for individual assets but is not the
                # | cheap-at-a-million answer; minting a million assets cheaply is
                # | compression's job.
                feedback: "Soulbound no Core funciona para ativos individuais mas não é a resposta barata-em-um-milhão; cunhar um milhão de ativos de forma barata é o trabalho da compressão."  # @src=5865c45c6f8c
              d:
                # | A Bubblegum V1 tree, since compression is the cheap path and a V1 leaf
                # | has no transfer instruction to call, which makes it soulbound by
                # | omission anyway
                label: "Uma árvore Bubblegum V1, já que a compressão é o caminho barato e uma folha V1 não tem instrução de transferência para chamar, o que torna ela soulbound por omissão de qualquer jeito"  # @src=b3f955a6891d
                # | V1 leaves transfer fine and carry no flags byte at all, and they are not
                # | upgradeable into v2, so a V1 tree is the one shape that gets the
                # | cheapness and loses the property you needed.
                feedback: "Folhas V1 transferem tranquilamente e não carregam byte de flags nenhum, e elas não são atualizáveis para v2, então uma árvore V1 é o único formato que consegue a barateza e perde a propriedade de que você precisava."  # @src=95b6291eb3e2
