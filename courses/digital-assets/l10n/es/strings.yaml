lessons:
  m01-l1-what-is-this-token:
    # | What is this token, really?
    title: "¿Qué es este token, en realidad?"  # @src=869933451fcf
    blocks:
      check:                      # quiz
        questions:
          m01-l1-q1:
            # | Your PYUSD decode printed a transferHook extension but the script flagged it
            # | 'dormant.' What did the bytes actually show?
            prompt: "Tu decodificación de PYUSD imprimió una extensión transferHook pero el script la marcó como 'dormida'. ¿Qué mostraban en realidad los bytes?"  # @src=0df9c714feaa
            # | 'Configured but dormant' is the teachable PYUSD fact: the extension is
            # | really in the bytes, but transferHook.programId = null (and the transfer fee
            # | reads 0 bps), so it has no active effect. Present is not the same as active,
            # | a distinction the whole course leans on.
            explanation: "'Configurado pero dormido' es el dato enseñable de PYUSD: la extensión está de verdad en los bytes, pero transferHook.programId = null (y la comisión de transferencia lee 0 bps), así que no tiene efecto activo. Presente no es lo mismo que activo, una distinción sobre la que se apoya todo el curso."  # @src=e44c16f5e1b7
            options:                 # source order — keep it
              a:
                # | The transferHook extension is present on the mint, but its programId is
                # | null, so no hook program runs on transfers
                label: "La extensión transferHook está presente en el mint, pero su programId es null, así que ningún programa de hook corre en las transferencias"  # @src=7e574b8226a0
                # | The extension occupies a real TLV slot on the mint while its programId
                # | field holds null, which is what the script prints as configured but
                # | dormant.
                feedback: "La extensión ocupa un slot TLV real en el mint mientras su campo programId guarda null, que es lo que el script imprime como configurado pero dormido."  # @src=2435dc0fcbb8
              d:
                # | The hook slot names a program address that Paxos has not deployed yet,
                # | so the call silently no-ops
                label: "El slot de hook nombra una dirección de programa que Paxos todavía no desplegó, así que la llamada no hace nada en silencio"  # @src=d47f0ed5fc3c
                # | The hook entry stores no address at all. The decode printed
                # | transferHook.programId as null, so there is nothing for a transfer to
                # | try to call and nothing to deploy against.
                feedback: "La entrada de hook no guarda ninguna dirección. La decodificación imprimió transferHook.programId como null, así que no hay nada que una transferencia pueda intentar llamar ni nada contra lo que desplegar."  # @src=9191256375be
              b:
                # | The transferHook extension runs on every transfer but its logic happens
                # | to be empty this block
                label: "La extensión transferHook corre en cada transferencia pero su lógica resulta estar vacía en este bloque"  # @src=36469017ff09
                # | A dormant hook is not an empty running hook; PYUSD's slot has programId
                # | = null, so nothing is invoked at all.
                feedback: "Un hook dormido no es un hook vacío que corre; el slot de PYUSD tiene programId = null, así que no se invoca nada."  # @src=4cb508885b99
              c:
                # | The transferHook field is a leftover from an old version and is ignored
                # | by the program
                label: "El campo transferHook es un resto de una versión vieja y el programa lo ignora"  # @src=09fccbd0583b
                # | It is a live, current extension in the TLV, not a fossil; it is simply
                # | configured with a null program, hence dormant.
                feedback: "Es una extensión viva y actual en el TLV, no un fósil; simplemente está configurada con un programa null, y por eso está dormida."  # @src=cd74c65bdd49
          m01-l1-q2:
            # | A teammate says 'a mint is a mint; reading PYUSD tells us nothing new.' Your
            # | decode found eight TLV extensions on it. What does that prove about the
            # | mental model 'a token is the classic SPL mint I already use'?
            prompt: "Un compañero de equipo dice 'un mint es un mint; leer PYUSD no nos dice nada nuevo'. Tu decodificación encontró ocho extensiones TLV en él. ¿Qué demuestra eso sobre el modelo mental 'un token es el mint SPL clásico que ya uso'?"  # @src=b0438bd96257
            # | The opener breaks the prior model on purpose: PYUSD is Token-2022, and its
            # | eight extensions (permanent delegate, transfer fee, confidential, metadata
            # | pointer, and more) are shapes the classic SPL program cannot even represent.
            # | 'A token' is a decision across shapes, which is why you must be able to read
            # | the bytes before you choose.
            explanation: "La apertura rompe el modelo previo a propósito: PYUSD es Token-2022, y sus ocho extensiones (delegado permanente, comisión de transferencia, confidencial, puntero de metadatos, y más) son formas que el programa SPL clásico ni siquiera puede representar. 'Un token' es una decisión entre formas, y por eso tienes que poder leer los bytes antes de elegir."  # @src=873b85c5e167
            options:                 # source order — keep it
              c:
                # | It proves nothing about the model: extensions are display-only metadata
                # | that wallets render and the token program ignores on transfer
                label: "No demuestra nada sobre el modelo: las extensiones son metadatos solo de visualización que las billeteras renderizan y que el programa de tokens ignora en la transferencia"  # @src=4c11a21defaa
                # | Extensions like permanent delegate and transfer fee change transfer
                # | behavior and who can move funds, the opposite of cosmetic.
                feedback: "Extensiones como el delegado permanente y la comisión de transferencia cambian el comportamiento de la transferencia y quién puede mover fondos, lo opuesto a cosmético."  # @src=5a33f6b1012c
              a:
                # | It proves classic SPL mints can also carry eight extensions, since the
                # | classic program shares the same TLV region once you initialize one
                label: "Demuestra que los mints SPL clásicos también pueden llevar ocho extensiones, ya que el programa clásico comparte la misma región TLV una vez que inicializas uno"  # @src=fbc3e3bca30c
                # | Classic SPL mints carry no extensions at all. Extensions only exist on
                # | Token-2022, a different program. That is exactly the model break.
                feedback: "Los mints SPL clásicos no llevan ninguna extensión. Las extensiones solo existen en Token-2022, un programa distinto. Eso es exactamente la ruptura del modelo."  # @src=e6b50855cdc2
              d:
                # | Token-2022 is a compatibility wrapper over the classic program, so
                # | PYUSD's eight extensions are add-ons bolted around the same classic mint
                # | underneath
                label: "Token-2022 es un envoltorio de compatibilidad sobre el programa clásico, así que las ocho extensiones de PYUSD son complementos atornillados alrededor del mismo mint clásico que hay debajo"  # @src=ed4f1f159e6b
                # | There is no wrapping: the two programs own their accounts separately, a
                # | classic instruction aimed at a Token-2022 mint fails, and USDC's 82-byte
                # | account has no region for an add-on to sit in.
                feedback: "No hay envoltorio: los dos programas son dueños de sus cuentas por separado, una instrucción clásica apuntada a un mint Token-2022 falla, y la cuenta de 82 bytes de USDC no tiene región donde pueda sentarse un complemento."  # @src=3e219f234f5d
              b:
                # | PYUSD is a Token-2022 mint carrying extensions the classic SPL program
                # | cannot express, so 'a token' is a family of shapes, not one fixed layout
                label: "PYUSD es un mint Token-2022 que lleva extensiones que el programa SPL clásico no puede expresar, así que 'un token' es una familia de formas, no un layout fijo"  # @src=0d7d97a5565a
                # | The mint is owned by Token-2022 at the Tokenz address, and a permanent
                # | delegate or a fee schedule are shapes the classic 82-byte layout has no
                # | room to hold.
                feedback: "El mint es propiedad de Token-2022 en la dirección Tokenz, y un delegado permanente o una tabla de comisiones son formas que el layout clásico de 82 bytes no tiene espacio para guardar."  # @src=e75f02a07cb5
          m01-l1-q3:
            # | The second micro-demo reported a classic Transfer costing 76 CU. Why does
            # | the course refuse to let you memorize '76 CU' as a fixed fact?
            prompt: "La segunda micro-demo reportó un Transfer clásico costando 76 CU. ¿Por qué el curso se niega a dejarte memorizar '76 CU' como un dato fijo?"  # @src=64b5df11a652
            # | That 76 CU is the outcome of the p-token engine swap you meet in l3: the
            # | classic transfer used to cost far more. Because the underlying engine can
            # | change, the course's testing thread measures CU in a lab rather than
            # | freezing an engine-dependent number, and this demo is your first taste of
            # | that discipline.
            explanation: "Esos 76 CU son el resultado del cambio de motor de p-token que conoces en l3: la transferencia clásica costaba mucho más. Como el motor de abajo puede cambiar, el hilo de pruebas del curso mide CU en un lab en vez de congelar un número que depende del motor, y esta demo es tu primera probada de esa disciplina."  # @src=554014e5c284
            options:                 # source order — keep it
              d:
                # | Because the 76 came from USDC's accounts, and a classic transfer's cost
                # | depends on the particular mint and token accounts involved
                label: "Porque el 76 salió de las cuentas de USDC, y el costo de una transferencia clásica depende del mint y de las cuentas de token particulares que estén involucrados"  # @src=80dac0187e08
                # | A classic mint is the same 82-byte layout whichever token it is, and the
                # | log line reports the program's cost for the instruction, not a per-mint
                # | price.
                feedback: "Un mint clásico es el mismo layout de 82 bytes sea cual sea el token, y la línea de log reporta el costo del programa para la instrucción, no un precio por mint."  # @src=0ac8e556e86c
              b:
                # | Because CU accounting drifts with validator hardware and network load,
                # | so two simulations of the same transfer disagree
                label: "Porque la contabilidad de CU varía con el hardware del validador y la carga de red, así que dos simulaciones de la misma transferencia no coinciden"  # @src=13b2a9809fb8
                # | They are deterministic enough to simulate and measure; that is exactly
                # | what the demo did. The reason to re-measure is that the engine changed,
                # | not that the number is noise.
                feedback: "Son lo bastante deterministas como para simular y medir; eso es exactamente lo que hizo la demo. La razón para volver a medir es que el motor cambió, no que el número sea ruido."  # @src=dc28b01a36af
              a:
                # | Because 76 CU is only what a devnet simulation reports; on mainnet-beta
                # | the same transfer is billed at a higher rate that shifts with priority
                # | fees
                label: "Porque 76 CU es solo lo que reporta una simulación en devnet; en mainnet-beta la misma transferencia se cobra a una tasa más alta que se mueve con las comisiones de prioridad"  # @src=79607657ef32
                # | The figure is not a devnet artifact; it is the real post-p-token
                # | transfer cost, the same story the next lessons unpack. It is not
                # | memorized because it is a measured, movable number, not because clusters
                # | differ.
                feedback: "La cifra no es un artefacto de devnet; es el costo real de transferencia posterior a p-token, la misma historia que las próximas lecciones desarman. No se memoriza porque es un número medido y movible, no porque los clústeres difieran."  # @src=0a4ed667255b
              c:
                # | Because 76 CU reflects the current p-token engine, and the course
                # | measures such numbers rather than freezing an engine-dependent value
                label: "Porque 76 CU refleja el motor p-token actual, y el curso mide ese tipo de números en vez de congelar un valor que depende del motor"  # @src=83f3192bdec3
                # | The same instruction billed 4,645 CU under the previous engine, so the
                # | figure belongs to whichever engine is live and gets re-measured rather
                # | than pinned into a doc.
                feedback: "La misma instrucción cobraba 4,645 CU con el motor anterior, así que la cifra pertenece al motor que esté vivo y se vuelve a medir en vez de quedar fijada en un doc."  # @src=e7027e6a32bf
  m01-l2-mint-account-anatomy:
    # | Mint & account anatomy from raw bytes
    title: "Anatomía de mint y cuenta desde bytes crudos"  # @src=46ffb3da4c98
    blocks:
      check:                      # quiz
        questions:
          m01-l2-q1:
            # | Your inspector reads a mint and the account is 82 bytes exactly. What can
            # | you conclude before looking at anything else?
            prompt: "Tu inspector lee un mint y la cuenta mide exactamente 82 bytes. ¿Qué puedes concluir antes de mirar cualquier otra cosa?"  # @src=b87ef555963b
            # | The length is the first tell: 82 bytes is exactly the bare classic mint
            # | (authority, supply, decimals, init flag, freeze authority) with no
            # | account-type discriminator and no TLV region. Extensions force the base to
            # | 165 bytes plus a 1-byte type, so an 82-byte read means no extensions, full
            # | stop.
            explanation: "La longitud es la primera señal: 82 bytes es exactamente el mint clásico pelado (autoridad, supply, decimales, bandera de init, autoridad de congelamiento) sin discriminador de tipo de cuenta y sin región TLV. Las extensiones fuerzan la base a 165 bytes más un tipo de 1 byte, así que una lectura de 82 bytes significa sin extensiones, punto final."  # @src=0dfe2abc1397
            options:                 # source order — keep it
              d:
                # | It is a classic-program mint, since Token-2022 pads the base of any mint
                # | it creates to 165 bytes plus an account-type byte
                label: "Es un mint del programa clásico, ya que Token-2022 rellena la base de cualquier mint que crea hasta 165 bytes más un byte de tipo de cuenta"  # @src=5639afda3685
                # | Size does not name the owner. Token-2022's own length model returns 82
                # | bytes for an empty extension set, so read the owner field to tell the
                # | two programs apart.
                feedback: "El tamaño no nombra al dueño. El propio modelo de longitud de Token-2022 devuelve 82 bytes para un conjunto de extensiones vacío, así que lee el campo de dueño para distinguir los dos programas."  # @src=44b0f9bf9287
              b:
                # | It is a Token-2022 mint whose TLV entries all carry zero-length values,
                # | so the extension region adds nothing to the size
                label: "Es un mint de Token-2022 cuyas entradas TLV llevan todas valores de longitud cero, así que la región de extensiones no agrega nada al tamaño"  # @src=245545a1bd32
                # | Any extension pads the base to 165 bytes plus the account-type byte; an
                # | 82-byte account cannot carry TLV entries at all.
                feedback: "Cualquier extensión rellena la base hasta 165 bytes más el byte de tipo de cuenta; una cuenta de 82 bytes no puede llevar ninguna entrada TLV."  # @src=994481f48492
              a:
                # | It is a bare mint with no extensions: 82 bytes is the classic base with
                # | no TLV region
                label: "Es un mint pelado sin extensiones: 82 bytes es la base clásica sin región TLV"  # @src=9c097d922ff3
                # | 82 bytes is the whole base with nothing after it, so there is no
                # | account-type byte at offset 165 and no TLV region to walk.
                feedback: "82 bytes es toda la base sin nada después, así que no hay byte de tipo de cuenta en el offset 165 ni región TLV que recorrer."  # @src=91439ec29e06
              c:
                # | It is corrupted: a mint has to reach offset 165 to carry its
                # | account-type byte, so a read ending at 82 lost its tail
                label: "Está corrupta: un mint tiene que llegar al offset 165 para llevar su byte de tipo de cuenta, así que una lectura que termina en 82 perdió su cola"  # @src=a4cdad684da1
                # | Only extended accounts are padded out to 165 and given the account-type
                # | byte; a bare mint stops at 82 with nothing after it, and 82 is a
                # | perfectly valid classic size.
                feedback: "Solo las cuentas extendidas se rellenan hasta 165 y reciben el byte de tipo de cuenta; un mint pelado para en 82 sin nada después, y 82 es un tamaño clásico perfectamente válido."  # @src=9517b9e0cb3e
          m01-l2-q2:
            # | Parsing the TLV region, you read a type (u16) and a length (u16) of 32, then
            # | move your cursor 32 bytes forward. Everything after that decodes as garbage.
            # | What went wrong?
            prompt: "Parseando la región TLV, lees un tipo (u16) y una longitud (u16) de 32, y después mueves tu cursor 32 bytes hacia adelante. Todo lo que viene después de eso decodifica como basura. ¿Qué salió mal?"  # @src=9de64336fb4d
            # | A TLV entry is u16 type + u16 length + value, so the header is 4 bytes.
            # | Advancing by the value length alone leaves the cursor 4 bytes short, and
            # | every subsequent type/length read lands mid-field, cascading into garbage.
            # | The fix is to step by 4 + length per entry.
            explanation: "Una entrada TLV es tipo u16 + longitud u16 + valor, así que el header es de 4 bytes. Avanzar solo por la longitud del valor deja el cursor 4 bytes corto, y cada lectura posterior de tipo/longitud cae en medio de un campo, en cascada hacia la basura. El arreglo es dar pasos de 4 + longitud por entrada."  # @src=6565d2c2a3fd
            options:                 # source order — keep it
              b:
                # | You advanced by the value length only; each TLV entry also has a 4-byte
                # | header (2 for type + 2 for length), so you must advance by 4 + length
                label: "Avanzaste solo por la longitud del valor; cada entrada TLV también tiene un header de 4 bytes (2 para el tipo + 2 para la longitud), así que tienes que avanzar por 4 + longitud"  # @src=2a8450dc6906
                # | The header costs 4 bytes on top of the value, so a cursor stepped by 32
                # | lands inside the pubkey it just read, and every later type and length
                # | parses as plausible garbage.
                feedback: "El header cuesta 4 bytes encima del valor, así que un cursor que avanza 32 cae dentro de la pubkey que acaba de leer, y cada tipo y longitud posterior parsea como basura plausible."  # @src=86f1f18ac2da
              c:
                # | TLV entries are 8-byte aligned like the base fields, so you round each
                # | value length up to a multiple of 8 before the next entry
                label: "Las entradas TLV están alineadas a 8 bytes como los campos base, así que redondeas cada longitud de valor hacia arriba a un múltiplo de 8 antes de la siguiente entrada"  # @src=76415d2a3578
                # | Token-2022 TLV entries are not padded to an 8-byte alignment; the miss
                # | is the 4-byte type+length header, not alignment.
                feedback: "Las entradas TLV de Token-2022 no se rellenan a una alineación de 8 bytes; lo que se te pasó es el header de tipo+longitud de 4 bytes, no la alineación."  # @src=8b3380128088
              d:
                # | Type 3's value is a COption pubkey, and the base layout priced those at
                # | 36 bytes, so the declared length under-reports it
                label: "El valor del tipo 3 es una pubkey COption, y el layout base les puso precio en 36 bytes, así que la longitud declarada la reporta por debajo"  # @src=f1bff33e5152
                # | The 36-byte COption belongs to the base fields; a TLV value is the raw
                # | struct, and the walk prices MintCloseAuthority at the 32 bytes its own
                # | header declares.
                feedback: "El COption de 36 bytes pertenece a los campos base; un valor TLV es el struct crudo, y el recorrido le pone precio a MintCloseAuthority en los 32 bytes que declara su propio header."  # @src=5189a5d427a9
              a:
                # | u16 fields in a TLV header are big-endian, so a length that reads as 32
                # | is really 8192 and the cursor stops far too early
                label: "Los campos u16 de un header TLV son big-endian, así que una longitud que se lee como 32 en realidad es 8192 y el cursor para mucho antes de tiempo"  # @src=cd304e189adb
                # | Both u16 fields are little-endian, and endianness would corrupt the
                # | length read itself; here the length of 32 is right, and the bug is
                # | stepping 32 bytes instead of 36.
                feedback: "Los dos campos u16 son little-endian, y la endianidad corrompería la lectura de la longitud misma; aquí la longitud de 32 está bien, y el bug es dar pasos de 32 bytes en vez de 36."  # @src=e3f0ccacefec
          m01-l2-q3:
            # | You need to pre-fund rent for a new Token-2022 mint that will carry
            # | TransferFeeConfig and MetadataPointer. How do you get the exact byte size to
            # | size the account?
            prompt: "Necesitas prefinanciar el rent de un nuevo mint de Token-2022 que va a llevar TransferFeeConfig y MetadataPointer. ¿Cómo consigues el tamaño exacto en bytes para dimensionar la cuenta?"  # @src=1e8defd8dea4
            # | try_calculate_account_len is the space-calc model: give it the exact
            # | extension set and it returns the account length including the 165 base, the
            # | account-type byte, and each extension's real TLV size. From TypeScript you
            # | call its mirror, getMintSize, which is the function step 7 of the lab
            # | actually runs. Guessing a flat per-extension number under- or over-sizes the
            # | account and its rent.
            explanation: "try_calculate_account_len es el modelo de cálculo de espacio: dale el conjunto exacto de extensiones y devuelve la longitud de la cuenta incluyendo la base de 165, el byte de tipo de cuenta, y el tamaño TLV real de cada extensión. Desde TypeScript llamas a su espejo, getMintSize, que es la función que el paso 7 del lab realmente corre. Adivinar un número plano por extensión deja la cuenta y su rent sub-dimensionados o sobre-dimensionados."  # @src=948891d5a648
            options:                 # source order — keep it
              b:
                # | Deploy with the classic 82-byte size and let the program realloc as
                # | extensions initialize
                label: "Despliega con el tamaño clásico de 82 bytes y deja que el programa haga realloc a medida que las extensiones se inicializan"  # @src=1557e075aad9
                # | Mint extensions are set at creation and the account must be sized up
                # | front; you cannot start at 82 bytes and grow into extensions.
                feedback: "Las extensiones de un mint se fijan en la creación y la cuenta tiene que dimensionarse por adelantado; no puedes empezar en 82 bytes y crecer hacia las extensiones."  # @src=a0a6dfc1219d
              a:
                # | Add 165 to a fixed 32 bytes per extension and use that
                label: "Suma 165 a 32 bytes fijos por extensión y usa eso"  # @src=9180442c4f3c
                # | Extensions are not a fixed 32 bytes each: TokenMetadata is
                # | variable-length; TransferFeeConfig is larger than a pointer. A
                # | fixed-per-extension guess mis-sizes the account.
                feedback: "Las extensiones no son 32 bytes fijos cada una: TokenMetadata es de longitud variable; TransferFeeConfig es más grande que un puntero. Una suposición fija por extensión dimensiona mal la cuenta."  # @src=fc6026dc72d1
              d:
                # | Start from getMintSize() at 82 and add each extension's value length
                label: "Empieza desde getMintSize() en 82 y suma la longitud de valor de cada extensión"  # @src=0f2e38f8f940
                # | getMintSize() with no arguments prices a bare mint; the moment one
                # | extension exists the base moves to 165 plus the account-type byte, and
                # | every entry also pays its own 4-byte header.
                feedback: "getMintSize() sin argumentos le pone precio a un mint pelado; en el momento en que existe una extensión la base se mueve a 165 más el byte de tipo de cuenta, y cada entrada también paga su propio header de 4 bytes."  # @src=c7edc1aaa11b
              c:
                # | Compute it with ExtensionType::try_calculate_account_len for the chosen
                # | extension set
                label: "Calcúlalo con ExtensionType::try_calculate_account_len para el conjunto de extensiones elegido"  # @src=398dc7c9fbc7
                # | Hand it the exact set and it returns the padded 165-byte base, the
                # | account-type byte, and 4 + value length per entry, which is your TLV
                # | walk run in reverse.
                feedback: "Dale el conjunto exacto y devuelve la base rellenada de 165 bytes, el byte de tipo de cuenta, y 4 + longitud de valor por entrada, que es tu recorrido TLV corrido al revés."  # @src=780378ab08b4
  m01-l3-p-token-switch:
    # | The p-token switch: frozen interface, new engine
    title: "El cambio a p-token: interfaz congelada, motor nuevo"  # @src=9b0649e78dd8
    blocks:
      check:                      # quiz
        questions:
          m01-l3-q1:
            # | A colleague insists 'SIMD-0266 shipped a new token program, so I need to
            # | update my client to the new address.' What is actually true?
            prompt: "Un colega insiste: 'SIMD-0266 entregó un programa de token nuevo, así que necesito actualizar mi cliente a la dirección nueva'. ¿Qué es lo que en realidad es cierto?"  # @src=50827076180b
            # | SIMD-0266 swapped the implementation behind the existing classic SPL address
            # | for Anza's Pinocchio rewrite, instruction by instruction and error by error.
            # | The interface (layouts, discriminators, errors) is frozen, so client code is
            # | untouched; the whole point is that nobody had to change anything.
            explanation: "SIMD-0266 cambió la implementación detrás de la dirección clásica de SPL existente por la reescritura en Pinocchio de Anza, instrucción por instrucción y error por error. La interfaz (layouts, discriminadores, errores) está congelada, así que el código de cliente queda intacto; todo el punto es que nadie tuvo que cambiar nada."  # @src=92907039ff53
            options:                 # source order — keep it
              b:
                # | p-token deployed at a fresh program address, so clients must swap the
                # | old TokenkegQ program id for the new one before the legacy deployment is
                # | disabled
                label: "p-token se desplegó en una dirección de programa nueva, así que los clientes deben cambiar el viejo id de programa TokenkegQ por el nuevo antes de que se deshabilite el despliegue legacy"  # @src=37780b963d07
                # | There is no new address; p-token runs at the classic TokenkegQ… address.
                # | Nothing to migrate; the interface is frozen.
                feedback: "No hay dirección nueva; p-token corre en la dirección clásica TokenkegQ… Nada que migrar; la interfaz está congelada."  # @src=ef7b612ea9ed
              c:
                # | p-token supersedes Token-2022, so clients should port their extension
                # | logic onto the new engine and retire the Tokenz address
                label: "p-token reemplaza a Token-2022, así que los clientes deberían portar su lógica de extensiones al motor nuevo y retirar la dirección Tokenz"  # @src=38266ced0273
                # | p-token is the classic SPL engine, not a Token-2022 successor; no
                # | Token-2022 successor exists. Extensions still live only in Token-2022.
                feedback: "p-token es el motor del SPL clásico, no un sucesor de Token-2022; no existe ningún sucesor de Token-2022. Las extensiones siguen viviendo solo en Token-2022."  # @src=f4cdcbbd13fe
              a:
                # | p-token replaced the implementation at the SAME address with
                # | byte-identical layouts and discriminators, so no client changes are
                # | needed
                label: "p-token reemplazó la implementación en la MISMA dirección con layouts y discriminadores idénticos byte por byte, así que no hace falta ningún cambio de cliente"  # @src=664f2ebe6f71
                # | Layouts, discriminators and error codes were frozen on purpose, so the
                # | address kept its contract and the engine behind it is the part that
                # | changed.
                feedback: "Los layouts, los discriminadores y los códigos de error se congelaron a propósito, así que la dirección conservó su contrato y el motor detrás de ella es la parte que cambió."  # @src=142d6fbf3c18
              d:
                # | The classic program was upgraded in place by its upgrade authority, so
                # | the address is unchanged but clients should re-pin the program hash they
                # | verify
                label: "El programa clásico fue actualizado en el lugar por su autoridad de actualización, así que la dirección no cambia pero los clientes deberían volver a fijar el hash de programa que verifican"  # @src=7bf2804b4b4e
                # | The program account reports Authority: none, so there is no upgrade key
                # | to deploy through. A feature gate activated by consensus is what swapped
                # | the code, and it left the interface untouched.
                feedback: "La cuenta del programa reporta Authority: none, así que no hay ninguna clave de actualización por la cual desplegar. Un feature gate activado por consenso es lo que cambió el código, y dejó la interfaz intacta."  # @src=c4cb0a76eaf4
          m01-l3-q2:
            # | You read SIMD-0266's page and its status header says 'Review.' A teammate
            # | concludes p-token is not live yet. How do you correct this precisely?
            prompt: "Lees la página de SIMD-0266 y su encabezado de estado dice 'Review'. Un compañero concluye que p-token todavía no está vivo. ¿Cómo corriges esto con precisión?"  # @src=d6c24b817fb8
            # | Say merged, not accepted or approved: merged is a Git fact (SIMD-0266 merged
            # | 2026-03-13) while its front-matter status still reads 'Review.' What
            # | actually gates activation is the on-chain feature gate ptokF…nSdP, which
            # | activated at slot 419,472,000 (epoch 971). The header is a lagging label;
            # | the gate is the truth.
            explanation: "Di mergeado, no aceptado ni aprobado: mergeado es un hecho de Git (SIMD-0266 se mergeó el 2026-03-13) mientras que su estado de front-matter todavía dice 'Review'. Lo que de verdad controla la activación es el feature gate on-chain ptokF…nSdP, que se activó en el slot 419,472,000 (epoch 971). El encabezado es una etiqueta que va con retraso; el gate es la verdad."  # @src=62467eebdb52
            options:                 # source order — keep it
              a:
                # | The teammate is right: a 'Review' header means it has not been accepted,
                # | so p-token is still a proposal
                label: "El compañero tiene razón: un encabezado 'Review' quiere decir que no ha sido aceptado, así que p-token sigue siendo una propuesta"  # @src=3cccddc58e2d
                # | The header lags reality: SIMD-0266 was merged on 2026-03-13 and its gate
                # | is active on mainnet. A 'Review' front-matter status does not mean
                # | unmerged.
                feedback: "El encabezado va con retraso respecto de la realidad: SIMD-0266 se mergeó el 2026-03-13 y su gate está activo en mainnet. Un estado de front-matter 'Review' no quiere decir sin mergear."  # @src=3a6eb80a0f32
              b:
                # | SIMD-0266 merged on 2026-03-13 and its feature gate has been active on
                # | mainnet since epoch 971, so p-token is live
                label: "SIMD-0266 se mergeó el 2026-03-13 y su feature gate está activo en mainnet desde el epoch 971, así que p-token está vivo"  # @src=ba858c40c883
                # | Merged is a dated Git fact, and liveness is settled by the 9-byte gate
                # | account you can read yourself, which is why chain state outranks a
                # | document header here.
                feedback: "Mergeado es un hecho de Git con fecha, y que esté vivo lo zanja la cuenta de gate de 9 bytes que puedes leer tú mismo, que es por lo que acá el estado de la blockchain le gana a un encabezado de documento."  # @src=aed68b2f1c67
              c:
                # | The header is authoritative, so p-token is live on devnet but not
                # | mainnet until the status flips to 'Accepted'
                label: "El encabezado es autoritativo, así que p-token está vivo en devnet pero no en mainnet hasta que el estado cambie a 'Accepted'"  # @src=2757a8860e88
                # | Activation is governed by the on-chain feature gate, not the document
                # | header; the gate is active on mainnet, so it is live there today.
                feedback: "La activación la gobierna el feature gate on-chain, no el encabezado del documento; el gate está activo en mainnet, así que hoy está vivo ahí."  # @src=0178451066ca
              d:
                # | Tell the teammate SIMD-0266 was formally accepted in a governance vote,
                # | and that the vote is what moved p-token from Review to live on mainnet
                label: "Dile al compañero que SIMD-0266 fue aceptado formalmente en una votación de gobernanza, y que la votación es lo que movió a p-token de Review a vivo en mainnet"  # @src=c19c61040ee9
                # | Accepted and approved are governance claims the paper trail does not
                # | support; the PR merged on 2026-03-13, and what put the engine on mainnet
                # | was the feature gate activating at epoch 971.
                feedback: "Aceptado y aprobado son afirmaciones de gobernanza que el rastro documental no sostiene; el PR se mergeó el 2026-03-13, y lo que puso el motor en mainnet fue el feature gate activándose en el epoch 971."  # @src=53fe1a044673
          m01-l3-q3:
            # | You want to explain, at the token layer, WHY a classic transfer now costs 76
            # | CU instead of 4,645. Where does the course say that 'why' properly belongs?
            prompt: "Quieres explicar, en la capa de token, POR QUÉ una transferencia clásica ahora cuesta 76 CU en vez de 4,645. ¿Dónde dice el curso que ese 'porqué' pertenece de verdad?"  # @src=1aa000e84ec6
            # | Here you learn the CU drop as a fact and a mental model: frozen interface,
            # | faster engine. The runtime 'why' (loaders, sBPF, compute metering) is
            # | explicitly the planned Low-Level Solana course's territory, cross-referenced
            # | by name rather than re-derived, keeping this a token-layer lesson.
            explanation: "Acá aprendes la caída de CU como un hecho y un modelo mental: interfaz congelada, motor más rápido. El 'porqué' del runtime (loaders, sBPF, medición de cómputo) es explícitamente territorio del curso planificado Low-Level Solana, referenciado por nombre en vez de re-derivado, lo que mantiene esta como una lección de la capa de token."  # @src=53212573cd65
            options:                 # source order — keep it
              b:
                # | In this lesson, which derives it by stepping through the Pinocchio
                # | engine's allocator and zero-copy account internals
                label: "En esta lección, que lo deriva recorriendo paso a paso el allocator del motor Pinocchio y las internas de las cuentas de copia cero"  # @src=58fe64bb426e
                # | This lesson teaches the CU drop as a token-layer mental model and
                # | explicitly refuses the runtime derivation, handing it off.
                feedback: "Esta lección enseña la caída de CU como un modelo mental de la capa de token y se niega explícitamente a la derivación del runtime, cediéndola."  # @src=29aa0d273bc9
              a:
                # | In Token-2022's extension source, since extensions are what made
                # | transfers cheaper
                label: "En el código fuente de las extensiones de Token-2022, ya que las extensiones son lo que abarató las transferencias"  # @src=6a12ad583a3d
                # | Extensions are unrelated to the classic transfer cost; this is the
                # | classic SPL engine, and extensions add cost, not remove it.
                feedback: "Las extensiones no tienen relación con el costo de la transferencia clásica; este es el motor del SPL clásico, y las extensiones agregan costo, no lo quitan."  # @src=0ceab06512b7
              c:
                # | In the planned Low-Level Solana course, which owns the loader, sBPF and
                # | CU metering
                label: "En el curso planificado Low-Level Solana, que es dueño del loader, sBPF y la medición de CU"  # @src=20297ebbc44b
                # | This lesson stops at what changed and when; where each of the 76 units
                # | goes is a runtime question, and the course that owns the runtime answers
                # | it.
                feedback: "Esta lección se detiene en qué cambió y cuándo; a dónde va cada una de las 76 unidades es una pregunta del runtime, y el curso que es dueño del runtime la responde."  # @src=12c977fe9664
              d:
                # | In SIMD-0266 itself, which sets the per-instruction CU budget p-token
                # | had to hit
                label: "En SIMD-0266 mismo, que fija el presupuesto de CU por instrucción que p-token tenía que alcanzar"  # @src=d9b4de0deffd
                # | The proposal's contract was byte-identical layouts, discriminators and
                # | error codes, not a compute target. Cheaper execution was the result of
                # | the rewrite, not a number the document specified.
                feedback: "El contrato de la propuesta eran layouts, discriminadores y códigos de error idénticos byte por byte, no un objetivo de cómputo. La ejecución más barata fue el resultado de la reescritura, no un número que el documento especificara."  # @src=8f0abccd8d11
  m01-l4-decision-framework-conflict-matrix:
    # | Classic SPL vs Token-2022: the decision framework + the conflict matrix
    title: "SPL clásico vs Token-2022: el framework de decisión + la matriz de conflictos"  # @src=32b484a93327
    blocks:
      check-combo:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Rule 3: ConfidentialMintBurn requires ConfidentialTransferMint; reject it if
          # | the set has the former without the latter.
          0: "Regla 3: ConfidentialMintBurn requiere ConfidentialTransferMint; recházalo si el conjunto tiene la primera sin la segunda."  # @src=fd8ac17f4798
          # | Rule 5 is a conditional: NonTransferable + ConfidentialTransferMint is only
          # | legal when ConfidentialMintBurn is also present.
          1: "La regla 5 es una condicional: NonTransferable + ConfidentialTransferMint solo es legal cuando ConfidentialMintBurn también está presente."  # @src=5bb5bc8554a6
          # | Each rule is a guard that returns {valid:false, reason} on violation; if none
          # | fire, return {valid:true}.
          2: "Cada regla es una guarda que devuelve {valid:false, reason} al violarse; si no se dispara ninguna, devuelve {valid:true}."  # @src=e993f1c4df1b
        tests:                      # keyed by test case id
          t1:
            # | A legal pairing (fee + metadata) passes.
            description: "Un emparejamiento legal (comisión + metadatos) pasa."  # @src=ec8148be63f7
          t2:
            # | Rule 4: ScaledUiAmount and InterestBearingConfig are mutually exclusive.
            description: "Regla 4: ScaledUiAmount e InterestBearingConfig son mutuamente excluyentes."  # @src=03193f9a9fc2
          t3:
            # | Rule 3: ConfidentialMintBurn requires ConfidentialTransferMint.
            description: "Regla 3: ConfidentialMintBurn requiere ConfidentialTransferMint."  # @src=c8fae9b763ae
          t4:
            # | Rule 2: the fee + confidential pair requires ConfidentialTransferFeeConfig.
            description: "Regla 2: el par comisión + confidencial requiere ConfidentialTransferFeeConfig."  # @src=6db7dcfee70d
          t5:
            # | Rule 5: NonTransferable + ConfidentialTransferMint needs
            # | ConfidentialMintBurn.
            description: "Regla 5: NonTransferable + ConfidentialTransferMint necesita ConfidentialMintBurn."  # @src=021883375acb
          t6:
            # | Rule 5 is satisfied once ConfidentialMintBurn is present.
            description: "La regla 5 se satisface una vez que ConfidentialMintBurn está presente."  # @src=d929f0e22cfc
      check:                      # quiz
        questions:
          m01-l4-q1:
            # | A product needs a token with confidential balances AND a transfer fee. You
            # | run check-combo on [TransferFeeConfig, ConfidentialTransferMint] and it
            # | rejects the set. Which rule fired, and what is the fix?
            prompt: "Un producto necesita un token con saldos confidenciales Y una comisión de transferencia. Corres check-combo sobre [TransferFeeConfig, ConfidentialTransferMint] y rechaza el conjunto. ¿Qué regla se disparó, y cuál es el arreglo?"  # @src=e360d55537a1
            # | Rule 2: TransferFeeConfig + ConfidentialTransferMint together require
            # | ConfidentialTransferFeeConfig. The pair is legal, but only once you add the
            # | extension that makes fees work under encryption; the fix is additive, not
            # | subtractive.
            explanation: "Regla 2: TransferFeeConfig + ConfidentialTransferMint juntas requieren ConfidentialTransferFeeConfig. El par es legal, pero solo una vez que agregas la extensión que hace que las comisiones funcionen bajo cifrado; el arreglo es aditivo, no sustractivo."  # @src=b3656b633ecc
            options:                 # source order — keep it
              b:
                # | Transfer fees and confidential balances are simply incompatible; you
                # | must drop one of them
                label: "Las comisiones de transferencia y los saldos confidenciales son simplemente incompatibles; tienes que descartar una de las dos"  # @src=7e6b02e6525b
                # | They are compatible; the rule requires a third extension
                # | (ConfidentialTransferFeeConfig) rather than forbidding the pair.
                feedback: "Sí son compatibles; la regla requiere una tercera extensión (ConfidentialTransferFeeConfig) en vez de prohibir el par."  # @src=70f89b1e8b11
              a:
                # | The fee + confidential pair requires ConfidentialTransferFeeConfig; add
                # | it to be legal
                label: "El par comisión + confidencial requiere ConfidentialTransferFeeConfig; agrégala para que sea legal"  # @src=70196636cfd0
                # | Rule 2 is the mirror of rule 1: the pair is incomplete rather than
                # | forbidden, and the fix adds an extension instead of dropping a
                # | requirement.
                feedback: "La regla 2 es el espejo de la regla 1: el par está incompleto y no prohibido, y el arreglo agrega una extensión en vez de descartar un requisito."  # @src=662208e40c95
              d:
                # | Rule 1 fired, the guard against an incomplete confidential-fee bridge;
                # | the fix is to add ConfidentialTransferFeeConfig
                label: "Se disparó la regla 1, la guarda contra un puente de comisión confidencial incompleto; el arreglo es agregar ConfidentialTransferFeeConfig"  # @src=dbf348ede7c5
                # | The fix is right and the rule number is not, which is the whole point of
                # | naming guards: rule 1 keys on the bridge being present without both
                # | endpoints, and this set has no bridge in it yet.
                feedback: "El arreglo está bien y el número de regla no, que es el punto entero de nombrar las guardas: la regla 1 se apoya en que el puente esté presente sin sus dos extremos, y este conjunto todavía no tiene ningún puente adentro."  # @src=60ed4bb7e4df
              c:
                # | The set needs ConfidentialMintBurn added, since confidential supply
                # | accounting is what lets the program assess a fee on an encrypted amount
                label: "Al conjunto le falta agregarle ConfidentialMintBurn, ya que la contabilidad de supply confidencial es lo que le deja al programa tasar una comisión sobre un monto cifrado"  # @src=2cb87ea2440e
                # | ConfidentialMintBurn is a different rule (confidential supply); the
                # | missing piece for a confidential fee is ConfidentialTransferFeeConfig.
                feedback: "ConfidentialMintBurn es otra regla (supply confidencial); la pieza que falta para una comisión confidencial es ConfidentialTransferFeeConfig."  # @src=b4d7eae13bcf
          m01-l4-q2:
            # | A teammate copies a conflict list from solana.com/docs and it has no
            # | PermissionedBurn entry, so they leave it out of the validator. Why is that a
            # | bug?
            prompt: "Un compañero de equipo copia una lista de conflictos de solana.com/docs y no tiene entrada para PermissionedBurn, así que lo deja afuera del validador. ¿Por qué eso es un bug?"  # @src=fc5813e1b86b
            # | There is no official current matrix, and doc catalogs lag the code: the
            # | course's 2026-08-21 sweep caught solana.com with no PermissionedBurn page
            # | while solana-program.com already carried one, and the gap closed within a
            # | day. The source enum's 29 production variants are the truth, which is the
            # | whole reason this artifact is derived from
            # | check_for_invalid_mint_extension_combinations rather than copied from a
            # | page.
            explanation: "No hay matriz oficial actual, y los catálogos de documentación van atrás del código: el barrido del curso del 2026-08-21 agarró a solana.com sin página de PermissionedBurn mientras solana-program.com ya cargaba una, y el hueco se cerró en menos de un día. Las 29 variantes de producción del enum de la fuente son la verdad, que es la razón entera por la que este artefacto se deriva de check_for_invalid_mint_extension_combinations en vez de copiarse de una página."  # @src=911aa7f48416
            options:                 # source order — keep it
              b:
                # | The source ExtensionType enum has 29 production variants including
                # | PermissionedBurn; the docs catalog lags the code, and the matrix must be
                # | derived from source
                label: "El enum ExtensionType de la fuente tiene 29 variantes de producción incluyendo PermissionedBurn; el catálogo de documentación va atrás del código, y la matriz tiene que derivarse de la fuente"  # @src=be08728be045
                # | The count comes from a pinned commit with the test-only variants
                # | subtracted, so the validator inherits a claim you can date and re-derive
                # | rather than a page's mood on one afternoon.
                feedback: "La cuenta sale de un commit fijado con las variantes solo de prueba restadas, así que el validador hereda una afirmación que puedes fechar y volver a derivar, y no el humor de una página en una tarde cualquiera."  # @src=3f906ed61d93
              a:
                # | PermissionedBurn was removed from Token-2022 in a later release, so
                # | keeping it in the matrix is the actual error
                label: "PermissionedBurn fue removida de Token-2022 en un release posterior, así que dejarla en la matriz es el error de verdad"  # @src=8a8f0182aa24
                # | It was not removed; it is one of the newest production variants in the
                # | source enum. The docs omission is the lag, not a removal.
                feedback: "No fue removida; es una de las variantes de producción más nuevas del enum de la fuente. La omisión de la documentación es el atraso, no una remoción."  # @src=c656e0fde2d7
              d:
                # | The page has since added PermissionedBurn, so the omission was a timing
                # | accident and re-copying the docs later fixes the validator
                label: "Desde entonces la página agregó PermissionedBurn, así que la omisión fue un accidente de timing y volver a copiar la documentación más tarde arregla el validador"  # @src=c5d9f65271f6
                # | That page carries no version stamp, so a copy of it cannot say which
                # | world it describes; the enum at a named commit can, which is why the
                # | matrix is derived and not transcribed.
                feedback: "Esa página no carga ningún sello de versión, así que una copia suya no puede decir qué mundo describe; el enum en un commit nombrado sí puede, que es por lo que la matriz se deriva y no se transcribe."  # @src=1fe14a42d67e
              c:
                # | PermissionedBurn is a test-only variant behind a cfg flag, so both the
                # | docs and the validator should omit it
                label: "PermissionedBurn es una variante solo de prueba detrás de una bandera cfg, así que tanto la documentación como el validador deberían omitirla"  # @src=63592aa91673
                # | The three test-only variants are separate; PermissionedBurn is a real
                # | production extension. The 29-variant count already excludes the
                # | test-only ones.
                feedback: "Las tres variantes solo de prueba son aparte; PermissionedBurn es una extensión de producción real. La cuenta de 29 variantes ya excluye las que son solo de prueba."  # @src=58205392436e
          m01-l4-q3:
            # | Your check-combo validator accepts [TransferFeeConfig, MetadataPointer,
            # | PermanentDelegate]. A colleague says 'great, it will trade on Raydium then.'
            # | What is the precise gap in that reasoning?
            prompt: "Tu validador check-combo acepta [TransferFeeConfig, MetadataPointer, PermanentDelegate]. Un colega dice 'genial, entonces se va a negociar en Raydium.' ¿Cuál es exactamente la brecha en ese razonamiento?"  # @src=cd7865b3c09e
            # | Legality is a floor, not routability. The five rules decide whether the
            # | program will initialize the mint; whether a DEX will pool it is a separate
            # | question governed by that venue's allowlist, and PermanentDelegate is
            # | exactly the kind of power extension Raydium refuses. That
            # | legal-versus-tradeable gap is the thesis Module 5 builds on.
            explanation: "La legalidad es un piso, no la enrutabilidad. Las cinco reglas deciden si el programa va a inicializar el mint; si un DEX lo va a poner en un pool es una pregunta aparte que gobierna la allowlist de esa plataforma, y PermanentDelegate es justo el tipo de extensión de poder que Raydium rechaza. Esa brecha entre lo legal y lo negociable es la tesis sobre la que construye el Módulo 5."  # @src=cf5f9fd84e9b
            options:                 # source order — keep it
              d:
                # | DEX allowlists apply these same five source rules before they pool a
                # | mint, so a set your validator accepts will route on Raydium unless a
                # | guard fires there too
                label: "Las allowlists de los DEX aplican estas mismas cinco reglas de la fuente antes de poner un mint en un pool, así que un conjunto que tu validador acepta va a enrutar en Raydium a menos que allá también se dispare una guarda"  # @src=b2e2a609d57f
                # | A venue's allowlist is policy, not the init function: it can refuse an
                # | extension whose behavior the venue did not model, however cleanly the
                # | set clears all five guards.
                feedback: "La allowlist de una plataforma es política, no la función de init: puede negarse a una extensión cuyo comportamiento la plataforma no modeló, por más limpio que el conjunto pase las cinco guardas."  # @src=b761552ee8c8
              a:
                # | The validator is wrong to accept that set; PermanentDelegate is one of
                # | the five source rules' hard conflicts, so the init itself would fail
                label: "El validador se equivoca al aceptar ese conjunto; PermanentDelegate es uno de los conflictos duros de las cinco reglas de la fuente, así que el init mismo fallaría"  # @src=92d33a3f43ab
                # | PermanentDelegate does not violate the five init rules; the set is legal
                # | to initialize. The gap is about venue acceptance, not init legality.
                feedback: "PermanentDelegate no viola las cinco reglas de init; el conjunto es legal de inicializar. La brecha es sobre la aceptación de la plataforma, no sobre la legalidad del init."  # @src=42d703250ea6
              b:
                # | check-combo only proves the docs allow the set; the five rules are
                # | advisory lint from the interface crate, and the on-chain program never
                # | enforces them at init
                label: "check-combo solo prueba que la documentación permite el conjunto; las cinco reglas son lint de recomendación del crate de la interfaz, y el programa on-chain nunca las hace cumplir en el init"  # @src=c1595ab9b36a
                # | The five rules are code-enforced at initialization, not advisory. The
                # | validator does prove init legality. What it does not prove is downstream
                # | routability.
                feedback: "Las cinco reglas las hace cumplir el código en la inicialización, no son de recomendación. El validador sí prueba la legalidad del init. Lo que no prueba es la enrutabilidad río abajo."  # @src=519e58a14944
              c:
                # | check-combo proves the set is LEGAL to initialize, not that a venue
                # | accepts it; DEX allowlists reject extensions like PermanentDelegate
                # | separately
                label: "check-combo prueba que el conjunto es LEGAL de inicializar, no que una plataforma lo acepte; las allowlists de los DEX rechazan extensiones como PermanentDelegate por separado"  # @src=56f6ffa7f9f0
                # | Init legality is the floor the program enforces; whether a pool will
                # | hold the mint is a separate policy question per venue, and Module 5
                # | takes that gate apart.
                feedback: "La legalidad del init es el piso que el programa hace cumplir; si un pool va a tener el mint es una cuestión de política aparte por plataforma, y el Módulo 5 desarma esa barrera."  # @src=369a5456d385
          m01-l4-q4:
            # | The docs call NonTransferable + TransferFeeConfig incompatible, but your
            # | extracted code rules never reject that pair. How should the lesson (and your
            # | validator) treat this?
            prompt: "La documentación llama incompatible a NonTransferable + TransferFeeConfig, pero tus reglas extraídas del código nunca rechazan ese par. ¿Cómo debería tratar esto la lección (y tu validador)?"  # @src=981513a06fe4
            # | A doc-level 'makes no sense' and a code-enforced init rejection are
            # | different classes of claim. The five extracted rules do not include
            # | NonTransferable + TransferFeeConfig, so the validator follows the code, and
            # | the lesson resolves the delta by attempting the init in a lab rather than
            # | freezing a rule the program does not actually enforce.
            explanation: "Un 'no tiene sentido' a nivel de documentación y un rechazo de init que el código hace cumplir son clases distintas de afirmación. Las cinco reglas extraídas no incluyen NonTransferable + TransferFeeConfig, así que el validador sigue al código, y la lección resuelve el delta intentando el init en un lab en vez de congelar una regla que el programa en realidad no hace cumplir."  # @src=91005915d08f
            options:                 # source order — keep it
              c:
                # | As a typo in the docs: no code rule backs the claim, so drop the line
                # | and move on without testing it
                label: "Como un error de tipeo en la documentación: ninguna regla del código respalda la afirmación, así que borra la línea y sigue adelante sin probarla"  # @src=fa2f1559b613
                # | It is not dismissible as a typo: a doc-level 'makes no sense' and a
                # | code-level init-invalid are different classes; the honest move is to
                # | test the init, not to ignore the signal.
                feedback: "No se puede descartar como un error de tipeo: un 'no tiene sentido' a nivel de documentación y un init-inválido a nivel de código son clases distintas; la jugada honesta es probar el init, no ignorar la señal."  # @src=5c329edf7283
              a:
                # | As an unresolved docs-vs-code delta: lab-test the actual init rather
                # | than asserting the doc-level conflict
                label: "Como un delta sin resolver entre documentación y código: prueba en el lab el init de verdad en vez de afirmar el conflicto a nivel de documentación"  # @src=00039b8ad681
                # | Two claim classes, two names: makes-no-sense is a doc caution,
                # | init-invalid is what the program enforces, and a terminal is the thing
                # | that decides which one you are looking at.
                feedback: "Dos clases de afirmación, dos nombres: no-tiene-sentido es una advertencia de la documentación, init-inválido es lo que el programa hace cumplir, y una terminal es lo que decide cuál de las dos estás mirando."  # @src=06b757ba3097
              d:
                # | Treat the docs claim as the enforced one and expect the program to
                # | reject the pair at initialization
                label: "Trata la afirmación de la documentación como la que se hace cumplir y espera que el programa rechace el par en la inicialización"  # @src=1e91b0104356
                # | The challenge probe settles it the other way: create-token succeeded,
                # | and the decoded mint carries both entries at 282 bytes, so the docs are
                # | making a semantic point about dead configuration.
                feedback: "La sonda del challenge lo resuelve al revés: create-token tuvo éxito, y el mint decodificado lleva las dos entradas en 282 bytes, así que la documentación está haciendo un punto semántico sobre configuración muerta."  # @src=7576f8823c4f
              b:
                # | As a sixth hard rule: the docs come from the program's maintainers, so
                # | encode the conflict in check-combo and reject the pair
                label: "Como una sexta regla dura: la documentación viene de quienes mantienen el programa, así que codifica el conflicto en check-combo y rechaza el par"  # @src=65dd6b2bd9df
                # | The extracted code rules do not list it, and the course derives the
                # | matrix from code; adding a rule the init function does not enforce would
                # | make the validator disagree with the program.
                feedback: "Las reglas extraídas del código no lo listan, y el curso deriva la matriz del código; agregar una regla que la función de init no hace cumplir haría que el validador no coincidiera con el programa."  # @src=ed8de6e267f9
  m02-l1-economics-extensions:
    # | Economics extensions: fees, interest, scaled UI (and where the fees GO)
    title: "Extensiones de economía: comisiones, interés, UI escalada (y adónde VAN las comisiones)"  # @src=a15780da6234
    blocks:
      fee-calculator:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Ceiling division on bigints: (numerator + 9999n) / 10000n
          0: "División por techo sobre bigints: (numerator + 9999n) / 10000n"  # @src=532928222d7e
          # | Cap with a min against maximumFee
          1: "Aplica el tope con un min contra maximumFee"  # @src=e67bb7b55eda
          # | Handle basisPoints === 0 and amount === 0n up front
          2: "Maneja basisPoints === 0 y amount === 0n de entrada"  # @src=df286e4f9481
        tests:                      # keyed by test case id
          exact-half-percent:
            # | 0.5% of 1,000,000 divides evenly to 5,000 (no rounding, no cap)
            description: "0.5% de 1,000,000 da exactamente 5,000 (sin redondeo, sin tope)"  # @src=c027b8532287
          ceiling-rounds-up:
            # | 1% of 101 is 1.01 and must round UP to 2 (floor would give 1)
            description: "1% de 101 es 1.01 y tiene que redondear hacia ARRIBA a 2 (floor daría 1)"  # @src=05499d8e1b37
          cap-applies:
            # | 1% of 1e9 is 10,000,000 but is capped at maximumFee 5,000
            description: "1% de 1e9 es 10,000,000 pero queda topado en maximumFee 5,000"  # @src=6f4ced3f6091
          zero-basis-points:
            # | a 0 bps fee config withholds nothing
            description: "una config de comisión de 0 bps no retiene nada"  # @src=1429dc5f556e
          zero-amount:
            # | a zero-amount transfer withholds nothing
            description: "una transferencia de monto cero no retiene nada"  # @src=3a8d1ee47aa2
      check:                      # quiz
        questions:
          q1-where-fees-go:
            # | You set a 1% transfer fee (100 bps) on SPROUT and someone sends 250 SPROUT
            # | to a buyer. The instant that transfer confirms, where does the withheld fee
            # | sit?
            prompt: "Pones una comisión de transferencia del 1% (100 bps) en SPROUT y alguien envía 250 SPROUT a un comprador. En el instante en que esa transferencia se confirma, ¿dónde queda la comisión retenida?"  # @src=f131dc4a9276
            # | Token-2022 accrues transfer fees as WITHHELD amounts on each recipient token
            # | account. Routing them anywhere is a two-step job you own:
            # | harvest_withheld_tokens_to_mint sweeps accounts into the mint, then
            # | withdraw_withheld_tokens_from_mint pulls them to a destination. That harvest
            # | mechanic is exactly what m09-l1's fee-routing rail consumes.
            explanation: "Token-2022 acumula las comisiones de transferencia como montos RETENIDOS en cada cuenta de token de destinatario. Enrutarlas a cualquier lado es un trabajo de dos pasos que te toca a ti: harvest_withheld_tokens_to_mint barre las cuentas hacia el mint, y después withdraw_withheld_tokens_from_mint las lleva a un destino. Esa mecánica de harvest es exactamente lo que consume, en m09-l1, el riel de enrutamiento de comisiones."  # @src=ed0088bab476
            options:                 # source order — keep it
              a:
                # | In a treasury token account, credited automatically because you named a
                # | withdraw-withheld authority at mint creation.
                label: "En una cuenta de token de tesorería, acreditada automáticamente porque nombraste una autoridad de withdraw-withheld en la creación del mint."  # @src=4556582fb22f
                # | Nothing auto-routes to a treasury, and the withdraw-withheld authority
                # | is a KEY, not an account: it is permission to move fees later, never a
                # | destination that gets credited. Fees reach a treasury only when that key
                # | runs the harvest and withdraw steps.
                feedback: "Nada se auto-enruta hacia una tesorería, y la autoridad de withdraw-withheld es una CLAVE, no una cuenta: es permiso para mover comisiones después, nunca un destino al que se le acredita. Las comisiones llegan a una tesorería solo cuando esa clave corre los pasos de harvest y withdraw."  # @src=f66f59683f47
              c:
                # | Burned from the recipient's balance and re-minted to the fee authority's
                # | own account in one step.
                label: "Quemada del saldo del destinatario y vuelta a acuñar en la cuenta propia de la autoridad de comisión, en un solo paso."  # @src=bd97344b1e8f
                # | No burn and no mint happen anywhere in a fee transfer. The fee is held
                # | intact in the recipient account's own TransferFeeAmount slot, not
                # | destroyed and recreated somewhere else.
                feedback: "No ocurre ninguna quema ni ninguna acuñación en ninguna parte de una transferencia con comisión. La comisión se guarda intacta en el slot TransferFeeAmount propio de la cuenta del destinatario, no se destruye y se vuelve a crear en otro lado."  # @src=d7a6576bc91e
              d:
                # | In the mint's own withheldAmount field, which the transfer instruction
                # | credits before it returns
                label: "En el campo withheldAmount propio del mint, que la instrucción de transferencia acredita antes de retornar"  # @src=ff4ea50dfa54
                # | That field is real, and it fills only after someone runs the
                # | permissionless harvest; at confirmation time the fee is still scattered
                # | across recipient accounts.
                feedback: "Ese campo es real, y solo se llena después de que alguien corre el harvest sin permiso; en el momento de la confirmación la comisión sigue desparramada por las cuentas de los destinatarios."  # @src=4c8baee2427e
              b:
                # | Withheld on the buyer's (recipient's) token account, until you harvest
                # | it.
                label: "Retenida en la cuenta de token del comprador (el destinatario), hasta que le hagas harvest."  # @src=dd8d59db4973
                # | TransferFeeConfig forces a TransferFeeAmount slot onto every account of
                # | the mint, and that slot is where the fee accrues per holder until
                # | someone sweeps it.
                feedback: "TransferFeeConfig fuerza un slot TransferFeeAmount en cada cuenta del mint, y ese slot es donde la comisión se acumula por tenedor hasta que alguien la barre."  # @src=947359adb34f
          q2-mutual-exclusion:
            # | You want SPROUT's UI balance to grow with yield (InterestBearingConfig) AND
            # | rebase for a stock-split-style event (ScaledUiAmount). You try to enable
            # | both on one mint. What happens?
            prompt: "Quieres que el saldo de UI de SPROUT crezca con el rendimiento (InterestBearingConfig) Y que haga rebase para un evento estilo split de acciones (ScaledUiAmount). Intentas habilitar las dos en un solo mint. ¿Qué pasa?"  # @src=82cbc1c6232d
            # | Rule 4 of check_for_invalid_mint_extension_combinations makes ScaledUiAmount
            # | and InterestBearingConfig mutually exclusive: both reshape the displayed
            # | balance, so only one may. The combo validator you built in m01-l4 already
            # | rejects this pairing before you ever hit the chain.
            explanation: "La regla 4 de check_for_invalid_mint_extension_combinations hace que ScaledUiAmount e InterestBearingConfig sean mutuamente excluyentes: las dos reconfiguran el saldo mostrado, así que solo una puede. El validador de combos que construiste en m01-l4 ya rechaza este par antes de que llegues siquiera a la blockchain."  # @src=af2fde08e408
            options:                 # source order — keep it
              d:
                # | Your client refuses to build the transaction, so nothing at all reaches
                # | the chain
                label: "Tu cliente se niega a construir la transacción, así que no llega absolutamente nada a la blockchain"  # @src=eed7f86ab109
                # | The builders assemble both instructions without complaint and the
                # | transaction is sent; the rejection comes back from the program, which is
                # | what makes this worth watching on a surfnet.
                feedback: "Los builders ensamblan las dos instrucciones sin quejarse y la transacción se envía; el rechazo vuelve desde el programa, que es lo que hace que valga la pena mirar esto en un surfnet."  # @src=49246d00c160
              c:
                # | Initialization fails; they are mutually exclusive by the source rules.
                label: "La inicialización falla; son mutuamente excluyentes por las reglas de la fuente."  # @src=d3b034c5df7e
                # | Rule 4 is the one true mutual exclusion in the matrix, and the program
                # | delivers it as InvalidExtensionCombination, error 0x33, throwing the
                # | whole transaction away.
                feedback: "La regla 4 es la única exclusión mutua de verdad en la matriz, y el programa la entrega como InvalidExtensionCombination, error 0x33, tirando la transacción entera a la basura."  # @src=22c89bfb7cd3
              e:
                # | The second initializer fails and the mint lands with the first
                label: "El segundo inicializador falla y el mint queda con la primera"  # @src=18e8e3befd90
                # | Both initializers write their TLV entries happily. It is
                # | initialize_mint, the last instruction, that runs the five rules over the
                # | assembled set, so there is no half-built mint left behind.
                feedback: "Los dos inicializadores escriben sus entradas TLV tan contentos. Es initialize_mint, la última instrucción, la que corre las cinco reglas sobre el conjunto ensamblado, así que no queda ningún mint a medio construir."  # @src=bbd6eaed9968
              b:
                # | It initializes, but only the extension you set last takes effect.
                label: "Inicializa, pero solo toma efecto la extensión que pusiste al final."  # @src=83ef39a62e6f
                # | There's no last-wins fallback; the initialization is rejected outright,
                # | not silently resolved.
                feedback: "No hay un fallback de gana-el-último; la inicialización se rechaza de plano, no se resuelve en silencio."  # @src=4704ecc48bde
              a:
                # | Both initialize; the UI multiplies the interest rate by the scale
                # | factor.
                label: "Las dos inicializan; la UI multiplica la tasa de interés por el factor de escala."  # @src=75ee64004326
                # | They don't compose. Both extensions rewrite the displayed amount, so the
                # | runtime can't let both own it.
                feedback: "No componen. Las dos extensiones reescriben el monto mostrado, así que el runtime no puede dejar que las dos sean dueñas de él."  # @src=73eea2aeeb1a
          q3-measure-cu:
            # | The lab measures each extension's CU/rent cost with simulateTransaction
            # | against surfpool instead of quoting a cost table. Why?
            prompt: "El lab mide el costo de CU/rent de cada extensión con simulateTransaction contra surfpool en vez de citar una tabla de costos. ¿Por qué?"  # @src=9bd301b0d556
            # | No per-extension CU/rent table exists in the docs or source. Rather than
            # | freeze an unpublished (and cluster-dependent) number, the testing thread
            # | measures it live with simulateTransaction, the same honest 'measure it,
            # | don't assert it' move you'll reuse for tree-cost and airdrop math later.
            explanation: "No existe ninguna tabla de CU/rent por extensión en la documentación ni en la fuente. En vez de congelar un número no publicado (y dependiente del cluster), el hilo de pruebas lo mide en vivo con simulateTransaction, la misma jugada sincera de 'mídelo, no lo afirmes' que vas a reutilizar después para la matemática de costo de árboles y de airdrops."  # @src=e611b72ee50a
            options:                 # source order — keep it
              a:
                # | Per-extension CU costs are published nowhere, so you measure them on
                # | your target cluster.
                label: "Los costos de CU por extensión no están publicados en ninguna parte, así que los mides en tu cluster objetivo."  # @src=d8914a094137
                # | The send helper asks the cluster on every run for exactly this reason:
                # | the number is a function of the deployed program, the active features,
                # | and how many extensions your accounts carry.
                feedback: "El helper de send le pregunta al cluster en cada corrida exactamente por esta razón: el número es función del programa desplegado, de las features activas, y de cuántas extensiones llevan tus cuentas."  # @src=139fad44b614
              c:
                # | CU costs are fixed by the runtime and identical across extensions.
                label: "Los costos de CU los fija el runtime y son idénticos en todas las extensiones."  # @src=1ee0d636f192
                # | Extensions have different processing costs; they are not uniform, which
                # | is exactly why a single table would be misleading.
                feedback: "Las extensiones tienen costos de procesamiento distintos; no son uniformes, que es exactamente por lo que una sola tabla sería engañosa."  # @src=80a980adee71
              d:
                # | A published per-extension table prices mainnet, and the lab runs on a
                # | local fork
                label: "Una tabla publicada por extensión pone precio a mainnet, y el lab corre en un fork local"  # @src=242ef04fe07d
                # | There is no such table in the docs or the source to be cluster-specific
                # | about, which is the gap the measurement policy fills.
                feedback: "No existe tal tabla en la documentación ni en la fuente como para que sea específica de un cluster, que es el hueco que llena la política de medición."  # @src=5598058bc542
              b:
                # | simulateTransaction is the only way to send a Token-2022 transfer at
                # | all.
                label: "simulateTransaction es la única forma de enviar siquiera una transferencia de Token-2022."  # @src=249ed737e1df
                # | It doesn't send anything; it simulates. Real transfers go through normal
                # | signed transactions; simulation is just for measurement here.
                feedback: "No envía nada; simula. Las transferencias reales pasan por transacciones firmadas normales; la simulación acá es solo para medir."  # @src=d04fe2f5c0e9
  m02-l2-authority-extensions:
    # | Authority extensions: who can touch your tokens
    title: "Extensiones de autoridad: quién puede tocar tus tokens"  # @src=3b399439f54b
    blocks:
      check:                      # quiz
        questions:
          q1-cpiguard-bypass:
            # | You enable CpiGuard on a token account to stop programs from moving funds
            # | without the owner. The mint also carries a permanent delegate. A program
            # | moves tokens out of that account through the delegate. What happens?
            prompt: "Activas CpiGuard en una cuenta de token para impedir que los programas muevan fondos sin el dueño. El mint también lleva un delegado permanente. Un programa saca tokens de esa cuenta a través del delegado. ¿Qué pasa?"  # @src=6cb21b866969
            # | PermanentDelegate is the one authority that always bypasses CpiGuard, a
            # | mint-level power the account never consented to. This is precisely why
            # | Raydium refuses it: 'a holder of the delegate can sweep any token account,
            # | including the pool vault.'
            explanation: "PermanentDelegate es la única autoridad que siempre esquiva CpiGuard, un poder a nivel de mint que la cuenta nunca consintió. Por esto exactamente Raydium la rechaza: 'quien tenga el delegado puede barrer cualquier cuenta de token, incluido el vault del pool.'"  # @src=e18587054a79
            options:                 # source order — keep it
              b:
                # | The transfer succeeds; PermanentDelegate always bypasses CpiGuard.
                label: "La transferencia funciona; PermanentDelegate siempre esquiva CpiGuard."  # @src=b925eafbeb80
                # | The guard's rule asks whether the signer during a CPI is a delegate, and
                # | the extension guide carves the permanent delegate out by name, so the
                # | move walks through untouched.
                feedback: "La regla de la guarda pregunta si el firmante durante una CPI es un delegado, y la guía de extensiones exceptúa al delegado permanente por nombre, así que el movimiento pasa sin que nadie lo toque."  # @src=97eac33d288e
              d:
                # | It is blocked, since the delegate lacks the account owner's consent
                label: "Queda bloqueado, ya que el delegado no tiene el consentimiento del dueño de la cuenta"  # @src=7800fc24404c
                # | Consent is what a mint-level power does not need. The holder inherited
                # | the delegate by choosing to hold the token, and the guard defends the
                # | account's own authority surface, not the mint's.
                feedback: "El consentimiento es justo lo que un poder a nivel de mint no necesita. El tenedor heredó el delegado por elegir tener el token, y la guarda defiende la superficie de autoridad de la propia cuenta, no la del mint."  # @src=e64d23f5fefe
              c:
                # | Both are ignored, because a mint extension and an account extension
                # | can't interact.
                label: "Las dos se ignoran, porque una extensión de mint y una extensión de cuenta no pueden interactuar."  # @src=99bd8e423326
                # | They very much interact: the mint-level delegate acts on the account,
                # | and it wins over the account's guard.
                feedback: "Sí que interactúan: el delegado a nivel de mint actúa sobre la cuenta, y le gana a la guarda de la cuenta."  # @src=a3799d3f0b29
              a:
                # | CpiGuard blocks it; stopping unauthorized CPI moves is exactly its job.
                label: "CpiGuard lo bloquea; detener movimientos CPI no autorizados es exactamente su trabajo."  # @src=1c0cd09f778b
                # | CpiGuard blocks delegate-and-close tricks at the account level, but a
                # | permanent delegate is a mint-level power it cannot override.
                feedback: "CpiGuard bloquea los trucos de delegar-y-cerrar a nivel de cuenta, pero un delegado permanente es un poder a nivel de mint que no puede anular."  # @src=69571df0adfa
          q2-default-frozen:
            # | Your compliance team wants each new holder locked out until KYC clears, and
            # | they won't control accounts after launch. Which extension gets you that
            # | without chasing accounts one by one?
            prompt: "Tu equipo de compliance quiere que cada tenedor nuevo quede fuera hasta que pase el KYC, y no van a controlar cuentas después del lanzamiento. ¿Qué extensión te da eso sin perseguir cuentas una por una?"  # @src=e54d093f3c4d
            # | DefaultAccountState(Frozen) is the frozen-by-default onboarding primitive:
            # | new accounts open frozen and a freeze authority thaws each one after checks.
            # | Pausable, by contrast, halts ALL transfers/mints/burns globally in one flip.
            explanation: "DefaultAccountState(Frozen) es la primitiva de onboarding congelado por defecto: las cuentas nuevas abren congeladas y una autoridad de congelamiento descongela cada una después de las verificaciones. Pausable, en cambio, detiene TODAS las transferencias/acuñaciones/quemas de forma global con un solo giro."  # @src=2ca8a293c5df
            options:                 # source order — keep it
              b:
                # | MintCloseAuthority, so ops can close and reopen each account after KYC.
                label: "MintCloseAuthority, para que ops pueda cerrar y reabrir cada cuenta después del KYC."  # @src=c3fab8a093df
                # | MintCloseAuthority closes mints to reclaim rent; it has nothing to do
                # | with gating new holders.
                feedback: "MintCloseAuthority cierra mints para recuperar el rent; no tiene nada que ver con restringirles el acceso a los tenedores nuevos."  # @src=c3ec56f81af1
              c:
                # | DefaultAccountState set to Frozen, so every new account starts frozen.
                label: "DefaultAccountState puesta en Frozen, para que cada cuenta nueva empiece congelada."  # @src=4767cdbf2e66
                # | It inverts the default: an account is inert at birth and a holder goes
                # | live only through a deliberate thaw, so onboarding is opt-in by the
                # | issuer rather than a cleanup job.
                feedback: "Invierte el defecto: una cuenta es inerte al nacer y un tenedor pasa a estar en vivo solo mediante un descongelamiento deliberado, así que el onboarding es opt-in del emisor y no una tarea de limpieza."  # @src=583aaffd5a0f
              d:
                # | The mint's freeze authority, used to freeze each new account as soon as
                # | it appears
                label: "La autoridad de congelamiento del mint, usada para congelar cada cuenta nueva en cuanto aparece"  # @src=240c7a1910a6
                # | The freeze authority is the thaw side of this design, not the default.
                # | Accounts still open usable, so someone has to catch every new holder in
                # | time, which is the chase the extension removes.
                feedback: "La autoridad de congelamiento es el lado del descongelamiento de este diseño, no el defecto. Las cuentas siguen abriendo usables, así que alguien tiene que atrapar a tiempo a cada tenedor nuevo, que es justo la persecución que la extensión elimina."  # @src=a6e9bbc363bf
              a:
                # | Pausable, so compliance can pause transfers for each new account until
                # | that holder's KYC clears.
                label: "Pausable, para que compliance pueda pausar las transferencias de cada cuenta nueva hasta que pase el KYC de ese tenedor."  # @src=70f90b3422f6
                # | Pausable is a global switch for the whole mint, not a per-account
                # | onboarding gate; flipping it freezes everyone at once.
                feedback: "Pausable es un interruptor global para todo el mint, no una barrera de onboarding por cuenta; activarlo congela a todos a la vez."  # @src=26c455a467e5
          q3-close-revival:
            # | You use MintCloseAuthority to close a spent mint and reclaim its rent.
            # | What's the footgun you have to guard against?
            prompt: "Usas MintCloseAuthority para cerrar un mint gastado y recuperar su rent. ¿Cuál es la trampa contra la que tienes que protegerte?"  # @src=b54937259916
            # | Close-and-revival: an account that's been zeroed and rent-drained can be
            # | recreated by anyone who re-funds its address. Mark-closed hygiene (writing a
            # | sentinel byte) stops a revived account from being mistaken for fresh,
            # | trusted state.
            explanation: "Cierre y resurrección: una cuenta que quedó en cero y drenada de rent puede ser recreada por cualquiera que vuelva a fondear su dirección. La higiene de marcar-como-cerrado (escribir un byte centinela) impide que una cuenta resucitada se confunda con estado nuevo y confiable."  # @src=4e6438d80810
            options:                 # source order — keep it
              c:
                # | The close authority is permanently transferred to the system program.
                label: "La autoridad de cierre se transfiere permanentemente al system program."  # @src=1fae855cb8f7
                # | No authority transfer happens; the account is drained and zeroed, not
                # | handed off.
                feedback: "No ocurre ninguna transferencia de autoridad; la cuenta se drena y se pone en cero, no se entrega a nadie."  # @src=728b92ec133b
              b:
                # | Closing the mint automatically burns every outstanding token account.
                label: "Cerrar el mint quema automáticamente cada cuenta de token en circulación."  # @src=febd6469ee54
                # | There is nothing for the close to burn: a mint with outstanding supply
                # | cannot be closed at all (MintHasSupply). Close only succeeds once supply
                # | is zero, so holder accounts are never touched.
                feedback: "No hay nada que el cierre pueda quemar: un mint con supply en circulación no se puede cerrar en absoluto (MintHasSupply). El cierre solo funciona una vez que el supply es cero, así que las cuentas de los tenedores nunca se tocan."  # @src=4ef6aaa5f2e6
              a:
                # | A closed account can be revived by re-funding it, so you must mark it
                # | closed to prevent reuse.
                label: "Una cuenta cerrada puede resucitarse volviéndola a fondear, así que tienes que marcarla como cerrada para impedir su reutilización."  # @src=6d94bcc76165
                # | Closing drains lamports and zeroes data, and the address survives all of
                # | it, so a sentinel byte written before the close is what keeps a revived
                # | account from passing as fresh state.
                feedback: "Cerrar drena los lamports y pone los datos en cero, y la dirección sobrevive a todo eso, así que un byte centinela escrito antes del cierre es lo que impide que una cuenta resucitada pase por estado nuevo."  # @src=c5dcd4ab98f9
              d:
                # | Lamports sent to that address later may be stranded, since it can hold
                # | no account
                label: "Los lamports que se manden después a esa dirección pueden quedar varados, ya que no puede albergar ninguna cuenta"  # @src=9db37a4df129
                # | The address stays perfectly usable, and that is the problem: re-funding
                # | it creates a live account there, which is why the risk runs toward
                # | revival rather than toward loss.
                feedback: "La dirección se queda perfectamente usable, y ese es el problema: volverla a fondear crea una cuenta viva ahí, que es por lo que el riesgo corre hacia la resurrección y no hacia la pérdida."  # @src=939e2624b146
  m02-l3-holder-protection-extensions:
    # | Holder-protection extensions: what accounts can refuse
    title: "Extensiones de protección del tenedor: lo que las cuentas pueden rechazar"  # @src=979676a45286
    blocks:
      check:                      # quiz
        questions:
          q1-forced-pair:
            # | You want soulbound SPROUT badges: non-transferable fungible tokens. You
            # | enable NonTransferable on the mint. Select the two extensions Token-2022
            # | then forces onto every holder account.
            prompt: "Quieres insignias SPROUT soulbound: tokens fungibles no transferibles. Activas NonTransferable en el mint. Elige las dos extensiones que Token-2022 fuerza entonces sobre cada cuenta de tenedor."  # @src=55e27753641b
            # | A NonTransferable mint forces the [NonTransferableAccount, ImmutableOwner]
            # | pair onto holder accounts, the soulbound-fungible pattern. The account can't
            # | be transferred and its owner can't be reassigned, so the badge truly sticks
            # | to its holder.
            explanation: "Un mint NonTransferable fuerza el par [NonTransferableAccount, ImmutableOwner] sobre las cuentas de tenedor, el patrón soulbound-fungible. La cuenta no se puede transferir y su dueño no se puede reasignar, así que la insignia de verdad se queda pegada a su tenedor."  # @src=3d1657333dd7
            options:                 # source order — keep it
              b:
                # | ImmutableOwner, so the account's owner authority cannot be reassigned by
                # | SetAuthority
                label: "ImmutableOwner, para que SetAuthority no pueda reasignar la autoridad de dueño de la cuenta"  # @src=c6eef04085a5
                # | Closing the transfer door means welding the ownership door too, or a
                # | holder sells the whole account instead of the token and the guarantee is
                # | decoration.
                feedback: "Cerrar la puerta de la transferencia quiere decir soldar también la puerta de la propiedad, o un tenedor vende la cuenta entera en vez del token y la garantía es decoración."  # @src=7f57d739683f
              e:
                # | CpiGuard, so no program can move the badge out through a cross-program
                # | invocation
                label: "CpiGuard, para que ningún programa pueda mover la insignia fuera de la cuenta mediante una invocación entre programas"  # @src=11fd6c47fda1
                # | CpiGuard is a holder's own opt-in defence, toggled owner-signed on the
                # | account, and a soulbound mint blocks the transfer at the program level
                # | long before a guard would matter.
                feedback: "CpiGuard es una defensa voluntaria del propio tenedor, que se conmuta en la cuenta con la firma del dueño, y un mint soulbound bloquea la transferencia a nivel de programa mucho antes de que una guarda importe."  # @src=3c26e98dfac3
              d:
                # | TransferFeeAmount, the per-holder slot the forced-pair lookup attaches
                # | to the account
                label: "TransferFeeAmount, el slot por tenedor que la tabla del par forzado le ata a la cuenta"  # @src=e320c0824c88
                # | That slot is real and it is forced by TransferFeeConfig, a different row
                # | of the same lookup; a badge mint with no fee has nothing to accrue
                # | there.
                feedback: "Ese slot es real y lo fuerza TransferFeeConfig, otra fila de la misma tabla; un mint de insignia sin comisión no tiene nada que acumular ahí."  # @src=368a8390789e
              c:
                # | MemoTransfer, so every badge that arrives leaves a settlement reference
                # | in the log
                label: "MemoTransfer, para que cada insignia que llega deje una referencia de liquidación en el log"  # @src=6e45d94dd8f5
                # | MemoTransfer is opt-in, enabled by the account's own owner after
                # | creation, and nothing in the forced-pair lookup attaches it to anything.
                feedback: "MemoTransfer es voluntaria, la activa el propio dueño de la cuenta después de crearla, y nada en la tabla del par forzado la ata a nada."  # @src=9f4a85affe2c
              a:
                # | NonTransferableAccount, the marker recording that this account holds
                # | soulbound tokens
                label: "NonTransferableAccount, el marcador que deja registrado que esta cuenta guarda tokens soulbound"  # @src=69314a9b82cb
                # | Type 13, stamped on the account at initialization; without it the
                # | account cannot be created for this mint at all.
                feedback: "Tipo 13, estampado en la cuenta al inicializarla; sin él la cuenta no se puede crear en absoluto para este mint."  # @src=f169264c3366
          q2-memo-required:
            # | A partner integrates your MemoTransfer-enabled account and reports that
            # | transfers to it keep failing. What's actually going on?
            prompt: "Un socio integra tu cuenta con MemoTransfer activada y reporta que las transferencias hacia ella siguen fallando. ¿Qué está pasando en realidad?"  # @src=49b2a4c5646c
            # | MemoTransfer makes a destination refuse any incoming transfer that doesn't
            # | carry a memo instruction, the integration burden Meteora's checklist warns
            # | about ('ensure destinations accept memo-required'). The sender, not you, has
            # | to attach the memo.
            explanation: "MemoTransfer hace que un destino rechace cualquier transferencia entrante que no cargue una instrucción de memo, la carga de integración sobre la que advierte la checklist de Meteora ('ensure destinations accept memo-required'). El remitente, no tú, tiene que adjuntar el memo."  # @src=910501f943e3
            options:                 # source order — keep it
              a:
                # | MemoTransfer requires the sender to hold a special memo NFT first.
                label: "MemoTransfer exige que el remitente tenga primero un NFT de memo especial."  # @src=72729bb81bdf
                # | There's no memo NFT; the requirement is just a memo instruction
                # | alongside the transfer, not a token gate.
                feedback: "No existe ningún NFT de memo; el requisito es solo una instrucción de memo junto a la transferencia, no un acceso restringido a quien tenga un token."  # @src=ecb9a4364013
              b:
                # | MemoTransfer globally pauses transfers the way Pausable does.
                label: "MemoTransfer pausa las transferencias de forma global como hace Pausable."  # @src=902a75a2a0bf
                # | MemoTransfer is per-account and doesn't halt anything globally; it only
                # | rejects transfers lacking a memo.
                feedback: "MemoTransfer es por cuenta y no detiene nada de forma global; solo rechaza las transferencias que no llevan memo."  # @src=009e1aa0d640
              c:
                # | Every transfer into a memo-required account must include a memo
                # | instruction, or it reverts.
                label: "Toda transferencia hacia una cuenta con memo obligatorio tiene que incluir una instrucción de memo, o revierte."  # @src=b834d50efc70
                # | The memo has to sit immediately before the transfer in the same
                # | transaction, which is why perfectly normal partner code reverts against
                # | your account and nowhere else.
                feedback: "El memo tiene que ir inmediatamente antes de la transferencia en la misma transacción, y por eso el código perfectamente normal de un socio revierte contra tu cuenta y en ningún otro lado."  # @src=498e1aea80c9
              d:
                # | The receiving account's owner has to attach the memo, and yours has not
                label: "El dueño de la cuenta que recibe tiene que adjuntar el memo, y el tuyo no lo ha hecho"  # @src=09b0b22b54c6
                # | The memo rides in the sender's transaction, so the burden lands on every
                # | partner who transfers to you. That is the integration tax Meteora's
                # | checklist warns its integrators about.
                feedback: "El memo viaja en la transacción del remitente, así que la carga cae sobre cada socio que te transfiera. Ese es el impuesto de integración sobre el que la checklist de Meteora advierte a sus integradores."  # @src=51f1674ec0ad
          q3-immutable-owner:
            # | Why do Associated Token Accounts ship ImmutableOwner by default?
            prompt: "¿Por qué las cuentas de token asociadas ya vienen con ImmutableOwner por defecto?"  # @src=356c8987c7df
            # | ImmutableOwner locks the owner authority so it can never be changed. ATAs
            # | ship it by default because their address is derived deterministically, and
            # | without the lock a program could re-own a derived account out from under its
            # | holder.
            explanation: "ImmutableOwner bloquea la autoridad de dueño para que no se pueda cambiar nunca. Las ATA ya la traen por defecto porque su dirección se deriva de forma determinista, y sin el bloqueo un programa podría reasignarse la propiedad de una cuenta derivada y dejar a su tenedor sin ella."  # @src=0e119332faee
            options:                 # source order — keep it
              b:
                # | So a single derived account can hold balances of several different mints
                # | at once.
                label: "Para que una sola cuenta derivada pueda guardar saldos de varios mints distintos a la vez."  # @src=96fc8539bc48
                # | An ATA holds exactly one mint; ImmutableOwner has nothing to do with
                # | multi-mint storage.
                feedback: "Una ATA guarda exactamente un mint; ImmutableOwner no tiene nada que ver con almacenar varios mints."  # @src=b3c1e2104481
              d:
                # | Because the classic program enforces the same lock, so ATAs match on
                # | both programs
                label: "Porque el programa clásico hace cumplir el mismo bloqueo, así que las ATA coinciden en los dos programas"  # @src=961d12fc9a97
                # | The classic program stores no extensions at all: it takes the
                # | instruction as a no-op and logs a suggestion to upgrade, so the real
                # | enforcement exists on the Token-2022 side only.
                feedback: "El programa clásico no almacena extensiones en absoluto: acepta la instrucción como un no-op y registra una sugerencia de actualizar, así que la aplicación real existe solo del lado de Token-2022."  # @src=de1ca0031034
              c:
                # | So the account can be cheaply handed to a new owner later without
                # | recreating an ATA at a freshly derived address.
                label: "Para que la cuenta se le pueda pasar barato a un dueño nuevo más adelante sin recrear una ATA en una dirección recién derivada."  # @src=c504013f40f2
                # | That's the opposite: ImmutableOwner exists specifically to prevent
                # | re-owning the account.
                feedback: "Es justo lo contrario: ImmutableOwner existe precisamente para evitar que se reasigne la propiedad de la cuenta."  # @src=f9380b3595cb
              a:
                # | So the owner field can never be reassigned, closing a class of
                # | account-takeover tricks.
                label: "Para que el campo de dueño no se pueda reasignar nunca, cerrando una clase de trucos de toma de cuentas."  # @src=390068e9f9cf
                # | An ATA's address derives from its owner, so every future sender computes
                # | it without asking; reassignable ownership would quietly redirect all of
                # | that to somebody else.
                feedback: "La dirección de una ATA se deriva de su dueño, así que cada remitente futuro la computa sin preguntar; una propiedad reasignable redirigiría en silencio todo eso hacia otra persona."  # @src=4c99a8cf140f
  m02-l4-native-metadata:
    # | Native metadata: MetadataPointer + TokenMetadata TLV
    title: "Metadatos nativos: MetadataPointer + TokenMetadata TLV"  # @src=4e35fb2f160a
    blocks:
      check:                      # quiz
        questions:
          q1-pointer-target:
            # | You add native metadata to SPROUT. Where should the MetadataPointer point,
            # | and why?
            prompt: "Le agregas metadatos nativos a SPROUT. ¿A dónde debería apuntar el MetadataPointer, y por qué?"  # @src=c16fe89504e8
            # | The native pattern sets MetadataPointer self-referential: the mint points at
            # | itself and stores the TokenMetadata TLV inline. Because the pointer and the
            # | data are the same account, no third account can masquerade as SPROUT's
            # | metadata; that's the anti-spoofing rationale.
            explanation: "El patrón nativo pone el MetadataPointer autorreferencial: el mint se apunta a sí mismo y guarda el TLV de TokenMetadata en línea. Como el puntero y los datos son la misma cuenta, ninguna tercera cuenta puede hacerse pasar por los metadatos de SPROUT; esa es la razón anti-suplantación."  # @src=1ebfe168e940
            options:                 # source order — keep it
              b:
                # | To the mint itself (self-referential), so nothing else can spoof its
                # | metadata.
                label: "Al mint mismo (autorreferencial), para que nada más pueda suplantar sus metadatos."  # @src=580cec3fdeea
                # | Pointer and data in the same account makes the trust loop one account
                # | long: to change what SPROUT claims to be you would need write access to
                # | SPROUT's own mint.
                feedback: "El puntero y los datos en la misma cuenta hacen que el lazo de confianza mida una cuenta: para cambiar lo que SPROUT afirma ser necesitarías acceso de escritura al propio mint de SPROUT."  # @src=58c98de1e0ae
              d:
                # | To a PDA derived from the mint that your own program owns, so you
                # | control updates
                label: "A una PDA derivada del mint que sea propiedad de tu propio programa, para que tú controles las actualizaciones"  # @src=fcc93c6e3ddf
                # | Aiming the pointer anywhere but the mint reopens the indirection the
                # | attack lives in, and edit rights already have a home: the
                # | update_authority field inside the metadata entry.
                feedback: "Apuntar el puntero a cualquier lado que no sea el mint reabre la indirección en la que vive el ataque, y los derechos de edición ya tienen casa: el campo update_authority dentro de la entrada de metadatos."  # @src=06e62c6f2dd9
              c:
                # | To the Token-2022 program address, which stores all metadata centrally.
                label: "A la dirección del programa Token-2022, que guarda todos los metadatos de forma centralizada."  # @src=5ef9794fd537
                # | The program doesn't store per-mint metadata centrally; the metadata
                # | lives in the mint's own TLV data.
                feedback: "El programa no guarda metadatos por mint de forma centralizada; los metadatos viven en los propios datos TLV del mint."  # @src=4c9883916090
              a:
                # | To a separate Metaplex metadata PDA, for maximum wallet compatibility.
                label: "A una PDA de metadatos de Metaplex aparte, para máxima compatibilidad con billeteras."  # @src=9f018c6c9c7f
                # | That's the older separate-account model, not the native pattern, and it
                # | reintroduces the spoofing surface the native design avoids.
                feedback: "Ese es el modelo más viejo de cuenta aparte, no el patrón nativo, y reintroduce la superficie de suplantación que el diseño nativo evita."  # @src=bf38653319cd
          q2-where-fields-live:
            # | In the Token-2022-native metadata pattern, what actually holds SPROUT's
            # | name, symbol, and uri?
            prompt: "En el patrón de metadatos nativo de Token-2022, ¿qué es lo que de verdad lleva el nombre, el símbolo y la uri de SPROUT?"  # @src=e7e4ed387fd7
            # | The TokenMetadata TLV (spl_token_metadata_interface: update_authority, mint,
            # | name, symbol, uri, additional_metadata) lives in the mint's own TLV data.
            # | name and symbol are on-chain; the uri references off-chain JSON for the
            # | richer fields.
            explanation: "El TLV de TokenMetadata (spl_token_metadata_interface: update_authority, mint, name, symbol, uri, additional_metadata) vive en los propios datos TLV del mint. name y symbol están on-chain; la uri referencia JSON off-chain para los campos más ricos."  # @src=cd01c4267c03
            options:                 # source order — keep it
              d:
                # | The MetadataPointer entry, which holds them inline
                label: "La entrada MetadataPointer, que los lleva en línea"  # @src=975230b8b354
                # | That entry is a fixed 64 bytes, an optional authority plus an optional
                # | address, with no room for a string. It names where the strings live; it
                # | does not hold them.
                feedback: "Esa entrada es de 64 bytes fijos, una autoridad opcional más una dirección opcional, sin espacio para una cadena. Nombra dónde viven las cadenas; no las lleva."  # @src=5974c2e53be9
              a:
                # | A Metaplex on-chain Data struct owned by the Token Metadata program.
                label: "Un struct Data on-chain de Metaplex, propiedad del programa Token Metadata."  # @src=79170077c748
                # | That's the Metaplex model, a different program and account. Native
                # | metadata doesn't use it.
                feedback: "Ese es el modelo de Metaplex, un programa y una cuenta distintos. Los metadatos nativos no lo usan."  # @src=8b9916ce8ee6
              b:
                # | An off-chain JSON file that the pointer links to, with nothing stored
                # | on-chain.
                label: "Un archivo JSON off-chain al que enlaza el puntero, sin nada guardado on-chain."  # @src=ce43c0411e22
                # | The uri points off-chain, but name and symbol are stored on-chain in the
                # | TLV; not everything lives in the JSON.
                feedback: "La uri apunta off-chain, pero name y symbol están guardados on-chain en el TLV; no todo vive en el JSON."  # @src=e7e7de5d37d7
              e:
                # | A PDA the Token-2022 program derives from the mint address
                label: "Una PDA que el programa Token-2022 deriva de la dirección del mint"  # @src=fd1ee01ab645
                # | There is no side account in the native pattern, and no derivation for a
                # | wallet to know. That two-account shape is the Metaplex model this design
                # | replaced.
                feedback: "No hay cuenta lateral en el patrón nativo, ni derivación que una billetera tenga que conocer. Esa forma de dos cuentas es el modelo de Metaplex que este diseño reemplazó."  # @src=f8c168079cd1
              c:
                # | A TokenMetadata TLV entry stored on the mint itself.
                label: "Una entrada TLV de TokenMetadata guardada en el mint mismo."  # @src=9691ea6f22f2
                # | name and symbol are Borsh strings inside the mint's own bytes, so a
                # | wallet renders SPROUT from one getAccountInfo and no HTTP fetch at all.
                feedback: "name y symbol son cadenas Borsh dentro de los propios bytes del mint, así que una billetera renderiza SPROUT desde un solo getAccountInfo y ningún fetch HTTP."  # @src=cf5601808e58
          q3-configured-vs-active:
            # | PYUSD ships both a MetadataPointer and a TokenMetadata extension. When you
            # | read it back on-chain, what does that reinforce about 'configured' versus
            # | 'active' state?
            prompt: "PYUSD ya viene tanto con una extensión MetadataPointer como con una TokenMetadata. Cuando lo lees de vuelta on-chain, ¿qué refuerza eso sobre el estado 'configurado' frente a 'activo'?"  # @src=1e41c61ff5aa
            # | PYUSD's metadata extensions are configured AND in use, while other
            # | extensions it carries are configured-but-dormant. The discipline is the same
            # | one from m01: read the mint's TLV on-chain and confirm which values are
            # | actually set, rather than inferring behavior from an extension's mere
            # | presence.
            explanation: "Las extensiones de metadatos de PYUSD están configuradas Y en uso, mientras que otras extensiones que lleva están configuradas-pero-dormidas. La disciplina es la misma de m01: lee el TLV del mint on-chain y confirma qué valores están de verdad seteados, en vez de inferir el comportamiento de la mera presencia de una extensión."  # @src=67fd0836091d
            options:                 # source order — keep it
              d:
                # | A TLV entry present in the bytes is an extension in use
                label: "Una entrada TLV presente en los bytes es una extensión en uso"  # @src=973801540b9c
                # | That is the module-1 trap in reverse. The same mint carries a hook slot
                # | whose programId is null, so an entry existing and an entry doing
                # | something stay two separate reads.
                feedback: "Esa es la trampa del módulo 1 al revés. El mismo mint lleva un slot de hook cuyo programId es nulo, así que una entrada que existe y una entrada que hace algo siguen siendo dos lecturas separadas."  # @src=62c016f8e05d
              b:
                # | Every extension PYUSD carries is dormant, its metadata included.
                label: "Cada extensión que lleva PYUSD está dormida, sus metadatos incluidos."  # @src=7a5378ac83c9
                # | Some of PYUSD's extensions are dormant (its hook is unset, its fee is 0
                # | bps), but its metadata is live and populated; presence alone tells you
                # | nothing until you read the values.
                feedback: "Algunas de las extensiones de PYUSD están dormidas (su hook está sin setear, su comisión es 0 bps), pero sus metadatos están vivos y poblados; la presencia sola no te dice nada hasta que lees los valores."  # @src=acfce11ae6ea
              c:
                # | Native metadata can only be read through a Metaplex indexer, never
                # | directly.
                label: "Los metadatos nativos solo se pueden leer a través de un indexador de Metaplex, nunca directo."  # @src=9e1d4f4c28bf
                # | Native metadata is in the mint's TLV and reads directly from
                # | getAccountInfo; no Metaplex indexer required.
                feedback: "Los metadatos nativos están en el TLV del mint y se leen directo desde getAccountInfo; no se requiere ningún indexador de Metaplex."  # @src=184429c5615a
              a:
                # | Presence can come with real, in-use values; read the mint to confirm.
                label: "La presencia puede venir con valores reales, en uso; lee el mint para confirmar."  # @src=cd8149cd9cd5
                # | PYUSD is the mixed case, some entries live and some dormant on one mint,
                # | so the discipline is to read the values rather than infer behaviour from
                # | the extension list.
                feedback: "PYUSD es el caso mixto, algunas entradas vivas y algunas dormidas en un mismo mint, así que la disciplina es leer los valores en vez de inferir el comportamiento de la lista de extensiones."  # @src=743c4e4001ee
              e:
                # | A self-referential MetadataPointer is the extension's unset default
                # | value
                label: "Un MetadataPointer autorreferencial es el valor por defecto sin setear de la extensión"  # @src=b93e8ec605b6
                # | Unset is an empty option, zeroed inside the 64-byte value. A pointer
                # | that names its own mint is a deliberate write, and the metadata entry
                # | beside it carries a real name and symbol.
                feedback: "Sin setear es un option vacío, en cero dentro del valor de 64 bytes. Un puntero que nombra su propio mint es una escritura deliberada, y la entrada de metadatos que está al lado lleva un nombre y un símbolo reales."  # @src=2ee30a869c56
  m03-l1-write-the-hook:
    # | Write the hook: the interface + your one Rust program
    title: "Escribe el hook: la interfaz + tu único programa en Rust"  # @src=683bce04c03a
    blocks:
      hook-execute-gate:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The hook has exactly one power on the transfer path: pass or fail. It cannot
          # | move funds.
          0: "El hook tiene exactamente un poder en el camino de la transferencia: pasar o fallar. No puede mover fondos."  # @src=002bcea30d51
          # | Check the pause flag first: it is the global kill-switch and must beat the
          # | allowlist.
          1: "Revisa primero el flag de pausa: es el interruptor de apagado global y tiene que ganarle a la allowlist."  # @src=0b5749ce36e3
          # | Return the amount (as i64) only when the transfer is truly allowed; otherwise
          # | a negative error code.
          2: "Devuelve el monto (como i64) solo cuando la transferencia esté verdaderamente permitida; si no, un código de error negativo."  # @src=63bb6c48bbfe
        tests:                      # keyed by test case id
          t1:
            # | Destination allowlisted and hook not paused: the transfer passes and the
            # | amount flows through.
            description: "Destino en la allowlist y hook sin pausar: la transferencia pasa y el monto fluye."  # @src=9c28aa3b1b37
          t2:
            # | Destination not on the treasury allowlist: the hook rejects with -1.
            description: "Destino que no está en la allowlist de tesorería: el hook rechaza con -1."  # @src=719f4d0368a7
          t3:
            # | Hook paused: even an allowlisted destination is rejected with -2.
            description: "Hook pausado: incluso un destino de la allowlist se rechaza con -2."  # @src=745450d03110
          t4:
            # | Pause takes precedence over the allowlist check.
            description: "La pausa tiene precedencia sobre la verificación de la allowlist."  # @src=2e2f9131b2af
          t5:
            # | A zero-amount allowed transfer passes through as 0.
            description: "Una transferencia permitida con monto cero pasa como 0."  # @src=910098b34296
      check:                      # quiz
        questions:
          q1:
            # | You seed your ExtraAccountMetaList PDA with ['extra-account-metas', mint]
            # | but compute its address against the Token-2022 program id, and now transfers
            # | fail to resolve the validation account. What is wrong?
            prompt: "Siembras tu PDA de ExtraAccountMetaList con ['extra-account-metas', mint] pero computas su dirección contra el program id de Token-2022, y ahora las transferencias no logran resolver la cuenta de validación. ¿Qué está mal?"  # @src=b23cf89ba974
            # | The ExtraAccountMetaList is owned and derived by the hook program, because
            # | it is the hook that needs to advertise which extra accounts the runtime must
            # | forward. Seeds are ['extra-account-metas', mint] but the program id is YOUR
            # | program's, resolved by get_extra_account_metas_address; deriving it against
            # | Token-2022 points at an account that will never exist.
            explanation: "El ExtraAccountMetaList es propiedad del programa del hook y lo deriva él, porque es el hook el que necesita anunciar qué cuentas extra debe reenviar el runtime. Los seeds son ['extra-account-metas', mint] pero el program id es el de TU programa, resuelto por get_extra_account_metas_address; derivarlo contra Token-2022 apunta a una cuenta que nunca va a existir."  # @src=bf1cde329ca3
            options:                 # source order — keep it
              d:
                # | The mint's TransferHook programId should name the validation PDA, not
                # | your hook program
                label: "El programId de TransferHook del mint debería nombrar la PDA de validación, no tu programa de hook"  # @src=58cec7054bd5
                # | The slot names a program to invoke, and the runtime then resolves the
                # | list from that program's own PDA. Aim the slot at a data account and
                # | there is nothing for Token-2022 to call.
                feedback: "El slot nombra un programa para invocar, y el runtime después resuelve la lista desde la PDA propia de ese programa. Apunta el slot a una cuenta de datos y no hay nada que Token-2022 pueda llamar."  # @src=3ac00608e98f
              c:
                # | The validation PDA lives on your hook program, not Token-2022; derive it
                # | with get_extra_account_metas_address.
                label: "La PDA de validación vive en tu programa de hook, no en Token-2022; derívala con get_extra_account_metas_address."  # @src=b9228192f1bd
                # | The manifest belongs to the program that needs the accounts, so the
                # | derivation takes your program id; pointing it at Token-2022 yields a
                # | valid address no account will ever occupy.
                feedback: "El manifiesto pertenece al programa que necesita las cuentas, así que la derivación toma tu program id; apuntarla a Token-2022 da una dirección válida que ninguna cuenta va a ocupar jamás."  # @src=2264e2fb116d
              b:
                # | ExtraAccountMetaList must be seeded by the destination token account, so
                # | each recipient gets its own list.
                label: "ExtraAccountMetaList tiene que sembrarse con la cuenta de token de destination, para que cada destinatario tenga su propia lista."  # @src=fe70e71297d0
                # | There is exactly one validation account per mint, seeded by the mint,
                # | not per destination.
                feedback: "Hay exactamente una cuenta de validación por mint, sembrada con el mint, no una por destination."  # @src=bdc931c4c75f
              a:
                # | The seed literal must be 'extra_account_metas' with underscores,
                # | matching the snake_case the SPL crates use elsewhere, not hyphens.
                label: "El seed literal tiene que ser 'extra_account_metas' con guiones bajos, igual que el snake_case que usan los crates de SPL en otros lados, no con guiones."  # @src=95edc86f93dd
                # | The seed is the hyphenated literal 'extra-account-metas', but a spelling
                # | swap is not the bug here; the account is being derived on the wrong
                # | program.
                feedback: "El seed es el literal con guiones 'extra-account-metas', pero un cambio de escritura no es el bug aquí; la cuenta se está derivando en el programa equivocado."  # @src=bf5a854313fa
          q2:
            # | Your hook program builds and deploys, but the runtime never reaches your
            # | Execute logic on a transfer. Which detail is most likely missing?
            prompt: "Tu programa de hook compila y se despliega, pero el runtime nunca llega a tu lógica de Execute en una transferencia. ¿Qué detalle es más probable que falte?"  # @src=36e337ddaf4e
            # | The interface is a contract of hashed-string discriminators. Token-2022
            # | invokes your program with the discriminator for
            # | 'spl-transfer-hook-interface:execute'; if your program only recognizes a
            # | custom tag, the dispatch falls through and your logic never runs. The mint's
            # | TransferHook extension pointing at your program id is the whole
            # | registration; there is no separate global config.
            explanation: "La interfaz es un contrato de discriminadores de cadena hasheada. Token-2022 invoca tu programa con el discriminador de 'spl-transfer-hook-interface:execute'; si tu programa solo reconoce una etiqueta propia, el dispatch se cae y tu lógica nunca corre. La extensión TransferHook del mint apuntando a tu program id es todo el registro; no hay una config global aparte."  # @src=dce4410bcb28
            options:                 # source order — keep it
              a:
                # | Your program must answer to the hashed-string discriminator for
                # | 'spl-transfer-hook-interface:execute', not a custom instruction tag.
                label: "Tu programa tiene que responder al discriminador de cadena hasheada de 'spl-transfer-hook-interface:execute', no a una etiqueta de instrucción propia."  # @src=06f796aef412
                # | Dispatch falls off the end of your match when the eight bytes do not
                # | line up, and the log then shows a fallback error from a program that
                # | looks like it was never reached.
                feedback: "El dispatch se cae por el final de tu match cuando los ocho bytes no calzan, y el log muestra entonces un error de fallback de un programa que parece que nunca fue alcanzado."  # @src=381e6dc8a4b8
              d:
                # | Anchor's own discriminator for a method named execute is the one
                # | Token-2022 sends, so a fallback handler has to forward the call to it
                label: "El discriminador propio de Anchor para un método llamado execute es el que envía Token-2022, así que un handler de fallback tiene que reenviarle la llamada"  # @src=bfd3c90f423b
                # | Two namespaces, two hashes. Token-2022 sends sha256 of
                # | spl-transfer-hook-interface:execute, while an Anchor method named
                # | execute hashes global:execute, which is a different eight bytes.
                feedback: "Dos namespaces, dos hashes. Token-2022 envía el sha256 de spl-transfer-hook-interface:execute, mientras que un método de Anchor llamado execute hashea global:execute, que son ocho bytes distintos."  # @src=a711b2d3c920
              b:
                # | You must register the hook program in Token-2022's global hook registry,
                # | signed by the mint authority, before the runtime will dispatch to it.
                label: "Tienes que registrar el programa del hook en el registro global de hooks de Token-2022, firmado por la autoridad de mint, antes de que el runtime le haga dispatch."  # @src=a383e569d57f
                # | There is no global registry of any kind; the mint's own TransferHook
                # | extension names your program, and that is the only wiring.
                feedback: "No hay registro global de ningún tipo; la extensión TransferHook del propio mint nombra tu programa, y ese es todo el cableado."  # @src=ec9b28b1ce0d
              c:
                # | Execute must be marked payable so it can receive the transferred amount
                # | and pass it on to the destination.
                label: "Execute tiene que marcarse como payable para que pueda recibir el monto transferido y pasarlo al destination."  # @src=b9e20720e267
                # | There is no payable concept; the amount arrives as instruction data and
                # | the funds never route through the hook.
                feedback: "No existe el concepto de payable; el monto llega como datos de instrucción y los fondos nunca se enrutan a través del hook."  # @src=fbb3a8ceeef8
          q3:
            # | Your finished hook is great, and you want to attach it to the already-live
            # | SPROUT mint from M2 so existing holders get gated. What does the extension
            # | model force you to do?
            prompt: "Tu hook terminado quedó genial, y quieres atarlo al mint SPROUT ya en vivo de M2 para restringirle el acceso a los tenedores existentes. ¿A qué te obliga el modelo de extensiones?"  # @src=207d219f9973
            # | Almost every Token-2022 extension, TransferHook included, is creation-only:
            # | it must be present when the mint is initialized. An existing mint without
            # | the extension can never grow one, so gating existing SPROUT means minting a
            # | new hooked variant and migrating, which is why the course builds the hook on
            # | a fresh SPROUT variant, not the original.
            explanation: "Casi toda extensión de Token-2022, TransferHook incluida, es solo de creación: tiene que estar presente cuando el mint se inicializa. A un mint existente sin la extensión no le puede crecer una nunca, así que restringir el acceso al SPROUT existente quiere decir acuñar una variante nueva con hook y migrar, que es por lo que el curso construye el hook sobre una variante nueva de SPROUT, no sobre la original."  # @src=2e4cd4a2a241
            options:                 # source order — keep it
              d:
                # | Use the mint's transfer-hook authority to aim its existing hook slot at
                # | your newly deployed program
                label: "Usa la autoridad de transfer hook del mint para apuntar su slot de hook existente a tu programa recién desplegado"  # @src=26422d676556
                # | Aiming the slot is real and it needs a slot. The hook authority can
                # | chamber or null a program id on a mint that carried the TransferHook
                # | entry from its first block; the live SPROUT has no such entry.
                feedback: "Apuntar el slot es real y necesita un slot. La autoridad del hook puede poner en la recámara o anular un program id en un mint que llevó la entrada TransferHook desde su primer bloque; el SPROUT en vivo no tiene esa entrada."  # @src=630d68fd8821
              c:
                # | Freeze the mint, patch a new TransferHook extension into its TLV region,
                # | then thaw it and carry on.
                label: "Congela el mint, parchea una extensión TransferHook nueva en su región TLV, después descongélalo y sigue."  # @src=8736a1d988a7
                # | Extension TLV data is not hand-patchable, and there is no
                # | freeze-patch-thaw flow for adding extensions.
                feedback: "Los datos TLV de extensión no se pueden parchear a mano, y no existe un flujo de congelar-parchear-descongelar para agregar extensiones."  # @src=307e44e0f9e4
              a:
                # | Call update-extra-account-metas on the live mint, passing your hook's
                # | program id as the list authority, so transfers dispatch to it.
                label: "Llama a update-extra-account-metas en el mint en vivo, pasando el program id de tu hook como la autoridad de la lista, para que las transferencias le hagan dispatch."  # @src=b7cb0d4df4fb
                # | That instruction updates the meta LIST on a mint that already has the
                # | TransferHook extension; it cannot add the extension to a mint that lacks
                # | it.
                feedback: "Esa instrucción actualiza la LISTA de metas en un mint que ya tiene la extensión TransferHook; no puede agregarle la extensión a un mint que no la tiene."  # @src=3843ba333495
              b:
                # | Mint a new SPROUT variant with the TransferHook extension set at
                # | creation; extensions cannot be added after init.
                label: "Acuña una variante nueva de SPROUT con la extensión TransferHook puesta en la creación; las extensiones no se pueden agregar después del init."  # @src=515a1406b00f
                # | The extension set is a birth certificate, so gating today's holders
                # | means a fresh hooked variant and a migration, which is why this hook is
                # | built beside SPROUT rather than on it.
                feedback: "El conjunto de extensiones es un certificado de nacimiento, así que restringirle el acceso a los tenedores de hoy quiere decir una variante nueva con hook y una migración, que es por lo que este hook se construye al lado de SPROUT y no sobre él."  # @src=49d565b45ac1
  m03-l2-resolving-hooks-composability:
    # | Resolving hooks, and why they break composability
    title: "Resolver hooks, y por qué rompen la componibilidad"  # @src=3e33aa263b1a
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | A user's plain Token-2022 transfer of your hooked SPROUT reverts with
            # | MissingAccount ('An account required by the instruction is missing'), yet
            # | the identical transfer works in your test harness. What is the client
            # | failing to do?
            prompt: "La transferencia Token-2022 común que un usuario hace de tu SPROUT con hook revierte con MissingAccount ('An account required by the instruction is missing'), pero la transferencia idéntica funciona en tu harness de pruebas. ¿Qué es lo que el cliente no está haciendo?"  # @src=e8b36138594e
            # | A hooked transfer only works if the client resolves the ExtraAccountMetaList
            # | off-chain and forwards those extra accounts on the transferring instruction.
            # | The harness did this for you; a naive wallet transfer does not, so
            # | Token-2022 never finds the validation account and the runtime cannot invoke
            # | a hook program it was never handed, so the naive case dies with
            # | MissingAccount. Keep the taxonomy straight: 'not enough account keys' is the
            # | different, partial-forwarding failure, the diagnostic trap the challenge
            # | drills. This forwarding burden is the resolution tax hooks push onto every
            # | integrator.
            explanation: "Una transferencia con hook solo funciona si el cliente resuelve el ExtraAccountMetaList off-chain y reenvía esas cuentas extra en la instrucción de transferencia. El harness hacía esto por ti; una transferencia de billetera ingenua no, así que Token-2022 nunca encuentra la cuenta de validación y el runtime no puede invocar un programa de hook que nunca le entregaron, así que el caso ingenuo muere con MissingAccount. Mantén clara la taxonomía: 'not enough account keys' es la falla distinta, la del reenvío parcial, la trampa de diagnóstico que el challenge ejercita. Esta carga de reenvío es el impuesto de resolución que los hooks le empujan a cada integrador."  # @src=1f989c4adf8a
            options:                 # source order — keep it
              e:
                # | Nothing client-side: the harness passes because LiteSVM resolves the
                # | hook's accounts for you, so this is a cluster gap
                label: "Nada del lado del cliente: el harness pasa porque LiteSVM resuelve las cuentas del hook por ti, así que esto es un hueco del cluster"  # @src=f4a2f787a7be
                # | The harness is where you placed every account by hand. A wallet on any
                # | cluster builds the same four-account transfer, and it dies the same way.
                feedback: "El harness es donde pusiste cada cuenta a mano. Una billetera en cualquier cluster arma la misma transferencia de cuatro cuentas, y muere de la misma manera."  # @src=2e023521c1ce
              a:
                # | Raise the compute budget so the hook has enough CU to finish before the
                # | transfer gives up
                label: "Subir el presupuesto de cómputo para que el hook tenga suficientes CU para terminar antes de que la transferencia se rinda"  # @src=94109033d0bc
                # | Compute budget is not the failure here; the transaction is missing
                # | accounts, not compute, and it reverts before the hook even runs out of
                # | CU.
                feedback: "El presupuesto de cómputo no es la falla aquí; a la transacción le faltan cuentas, no cómputo, y revierte antes de que el hook siquiera se quede sin CU."  # @src=fa6ff13d5b72
              d:
                # | Append the hook program id to the transfer's accounts; the runtime
                # | resolves the rest
                label: "Agregar el program id del hook a las cuentas de la transferencia; el runtime resuelve el resto"  # @src=6d51c27bc80b
                # | Token-2022 hunts for the validation account among the accounts you sent.
                # | Missing it, resolution never starts, so there is nothing to forward to
                # | the hook program either.
                feedback: "Token-2022 caza la cuenta de validación entre las cuentas que mandaste. Al no encontrarla, la resolución nunca arranca, así que tampoco hay nada que reenviarle al programa del hook."  # @src=386ab5a0680c
              c:
                # | Fetch the ExtraAccountMetaList and append the hook's resolved extra
                # | accounts to the instruction.
                label: "Buscar el ExtraAccountMetaList y agregar a la instrucción las cuentas extra resueltas del hook."  # @src=faadd5157b88
                # | The manifest is the only published statement of what the hook needs, and
                # | a client that does not read it hands Token-2022 a transaction with no
                # | validation account in it.
                feedback: "El manifiesto es la única declaración publicada de lo que el hook necesita, y un cliente que no lo lee le entrega a Token-2022 una transacción sin ninguna cuenta de validación adentro."  # @src=20674d08ef63
              b:
                # | Add the hook program's authority as a second signer so it can approve
                # | the move
                label: "Agregar la autoridad del programa del hook como segundo signer para que pueda aprobar el movimiento"  # @src=67f38176cce5
                # | The hook has no authority over the transfer: its accounts are read-only
                # | and non-signer, so there is nothing for it to sign.
                feedback: "El hook no tiene autoridad sobre la transferencia: sus cuentas son de solo lectura y no firmantes, así que no hay nada que pueda firmar."  # @src=a198e3fa1556
          q2:
            # | A teammate worries your allowlist hook could be rewritten to drain the
            # | sender's tokens mid-transfer. From what the interface guarantees, why can't
            # | any hook do that?
            prompt: "A un compañero de equipo le preocupa que tu hook de allowlist se pueda reescribir para drenar los tokens del remitente a mitad de la transferencia. A partir de lo que garantiza la interfaz, ¿por qué ningún hook puede hacer eso?"  # @src=07fbc586fd05
            # | The interface builds the transfer's accounts as
            # | AccountMeta::new_readonly(pubkey, false), read-only AND non-signer, before
            # | invoking the hook. So the hook can inspect the transfer but cannot move its
            # | funds or ride the sender's signature. (A malicious hook can still move funds
            # | ITS OWN PDAs control; the guarantee is only about the transfer's accounts.)
            # | That de-escalation, plus arbitrary CU, is the code-level root of why DEXes
            # | refuse hooks.
            explanation: "La interfaz arma las cuentas de la transferencia como AccountMeta::new_readonly(pubkey, false), de solo lectura Y no firmantes, antes de invocar al hook. Así que el hook puede inspeccionar la transferencia pero no puede mover sus fondos ni montarse en la firma del remitente. (Un hook malicioso igual puede mover fondos que controlan SUS PROPIAS PDAs; la garantía es solo sobre las cuentas de la transferencia.) Esa desescalada, más el CU arbitrario, es la raíz a nivel de código de por qué los DEX rechazan los hooks."  # @src=e27d69d360d9
            options:                 # source order — keep it
              a:
                # | Inside Execute the transfer's accounts arrive read-only and non-signer,
                # | so the hook can neither spend them nor reuse the sender's signature.
                label: "Dentro de Execute las cuentas de la transferencia llegan de solo lectura y no firmantes, así que el hook no puede ni gastarlas ni reusar la firma del remitente."  # @src=4e46ea1f3307
                # | AccountMeta::new_readonly(pubkey, false) is the whole guarantee, and you
                # | can read it in the interface crate's own builder: no writability to
                # | spend with, no signature to reuse.
                feedback: "AccountMeta::new_readonly(pubkey, false) es toda la garantía, y la puedes leer en el builder propio del crate de la interfaz: ninguna capacidad de escritura con la que gastar, ninguna firma que reusar."  # @src=c944d3c674ff
              c:
                # | Hooks execute in a sandboxed VM that is handed only the amount, with no
                # | access to the transfer's accounts.
                label: "Los hooks se ejecutan en una VM aislada a la que solo se le pasa el monto, sin acceso a las cuentas de la transferencia."  # @src=28481bef596a
                # | The hook does receive the accounts, since it needs them to make its
                # | decision, but they are de-escalated to read-only; there is no separate
                # | sandbox VM.
                feedback: "El hook sí recibe las cuentas, porque las necesita para tomar su decisión, pero llegan desescaladas a solo lectura; no hay ninguna VM aislada aparte."  # @src=db6d05b63a46
              d:
                # | The hook runs in a separate transaction after the transfer settles, so
                # | the sender's signature is already spent by the time your code sees the
                # | accounts
                label: "El hook corre en una transacción aparte después de que la transferencia se liquida, así que la firma del remitente ya está gastada para cuando tu código ve las cuentas"  # @src=ae35af9abd43
                # | Execute is a CPI inside the same transaction, which is exactly what lets
                # | a hook veto a transfer at all. The protection is that the inherited
                # | accounts arrive stripped, not that they arrive late.
                feedback: "Execute es una CPI dentro de la misma transacción, que es exactamente lo que le permite a un hook vetar una transferencia siquiera. La protección es que las cuentas heredadas llegan despojadas, no que lleguen tarde."  # @src=003cde909ee6
              b:
                # | The Token-2022 program snapshots every account balance before the hook
                # | runs, then refunds any tokens the hook attempted to move once it
                # | returns.
                label: "El programa Token-2022 saca una instantánea de cada saldo de cuenta antes de que corra el hook, y después reembolsa cualquier token que el hook haya intentado mover una vez que vuelve."  # @src=0b44e3efce99
                # | There is no snapshot-and-refund mechanism; the guarantee is structural:
                # | the hook is never given writable, signed access to the transfer's
                # | accounts in the first place.
                feedback: "No hay ningún mecanismo de instantánea y reembolso; la garantía es estructural: al hook nunca se le da acceso escribible y firmado a las cuentas de la transferencia, de entrada."  # @src=6d1f49183521
          q3:
            # | You want SPROUT tradeable on Raydium's CP-Swap, but it carries your
            # | TransferHook. What does Raydium's allowlist do, and why?
            prompt: "Quieres SPROUT negociable en el CP-Swap de Raydium, pero carga tu TransferHook. ¿Qué hace la allowlist de Raydium, y por qué?"  # @src=dcb532aad1ca
            # | Raydium's CP-Swap whitelists exactly five extensions (TransferFeeConfig,
            # | MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount); any
            # | other reverts pool creation. TransferHook is rejected by name because
            # | arbitrary per-transfer code with unbounded CU makes a pool un-priceable and
            # | un-safe. This is the compatibility thesis the course keeps returning to: the
            # | extensions that keep you tradeable are the passive fee, display and
            # | accounting ones, not the ones that run code or move other people's tokens
            # | (which is where the compliance-shaped powers land).
            explanation: "El CP-Swap de Raydium pone en la whitelist exactamente cinco extensiones (TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount); cualquier otra revierte la creación del pool. TransferHook se rechaza por nombre porque el código arbitrario por transferencia, con CU sin límite, vuelve un pool imposible de valuar e inseguro. Esta es la tesis de compatibilidad a la que el curso vuelve una y otra vez: las extensiones que te mantienen negociable son las pasivas, las de comisión, visualización y contabilidad, no las que corren código o mueven los tokens de otras personas (que es donde caen los poderes con forma de compliance)."  # @src=e8f447cbf71d
            options:                 # source order — keep it
              b:
                # | It rejects pool creation; TransferHook is not among the five accepted
                # | extensions, because hooks run arbitrary code per transfer.
                label: "Rechaza la creación del pool; TransferHook no está entre las cinco extensiones aceptadas, porque los hooks corren código arbitrario por transferencia."  # @src=bad339b6a53c
                # | The five it accepts are all passive, and arbitrary per-transfer code
                # | with unbounded CU makes a pool impossible to price safely, so creation
                # | reverts rather than degrading.
                feedback: "Las cinco que acepta son todas pasivas, y el código arbitrario por transferencia con CU sin límite vuelve un pool imposible de valuar con seguridad, así que la creación revierte en lugar de degradarse."  # @src=7482ae648969
              c:
                # | It allows the hook only if the mint also carries a PermanentDelegate the
                # | pool can claw back with.
                label: "Permite el hook solo si el mint también carga un PermanentDelegate con el que el pool pueda confiscar."  # @src=8b0c0c5c30cb
                # | PermanentDelegate is itself rejected (Raydium refuses it because a
                # | delegate holder could sweep the pool vault), and pairing two rejected
                # | extensions does not unlock the pool.
                feedback: "PermanentDelegate está rechazado por sí mismo (Raydium lo rechaza porque un tenedor del delegate podría barrer el vault del pool), y emparejar dos extensiones rechazadas no desbloquea el pool."  # @src=d13e941dfa29
              d:
                # | It rejects the pool until your hook program itself is vetted onto
                # | Raydium's list of approved hooks, after which the same mint routes
                # | normally
                label: "Rechaza el pool hasta que tu propio programa de hook sea revisado y admitido en la lista de hooks aprobados de Raydium, después de lo cual el mismo mint enruta con normalidad"  # @src=ed59086b8a34
                # | The door in the pool program is a short hardcoded list of MINT addresses
                # | vetted by hand, plus classic mints and mint-association accounts. No
                # | extension and no hook program is approved as a category.
                feedback: "La puerta en el programa del pool es una lista corta y hardcodeada de direcciones de MINT revisadas a mano, más mints clásicos y cuentas de asociación de mint. Ninguna extensión y ningún programa de hook está aprobado como categoría."  # @src=ac69f3534e76
              a:
                # | It allows the hook but wraps it in a metered sub-invocation capped at
                # | 5,000 CU per transfer, so pool pricing stays bounded and quotes stay
                # | safe.
                label: "Permite el hook pero lo envuelve en una subinvocación medida con un tope de 5,000 CU por transferencia, así que el precio del pool queda acotado y las cotizaciones quedan seguras."  # @src=94981f5e3c6e
                # | There is no per-hook CU cap in the allowlist; the extension is simply
                # | not among the five it accepts, so pool creation reverts outright.
                feedback: "No hay ningún tope de CU por hook en la allowlist; la extensión simplemente no está entre las cinco que acepta, así que la creación del pool revierte de plano."  # @src=65ed46a1b592
  m04-l1-confidential-model:
    # | The confidential model: encrypted balances on a public chain
    title: "El modelo confidencial: saldos cifrados en una blockchain pública"  # @src=a449aa80afdc
    blocks:
      check:                      # quiz
        questions:
          m04l1-q1:
            # | You send 5 SPROUT confidentially to a teammate. Which statement about that
            # | on-chain transfer is TRUE?
            prompt: "Mandas 5 SPROUT de forma confidencial a un compañero de equipo. ¿Cuál afirmación sobre esa transferencia on-chain es VERDADERA?"  # @src=0a519d7349ac
            # | The confidential-transfer extension encrypts the transferred amount under
            # | Twisted ElGamal. It does nothing to hide who is transacting: both pubkeys
            # | and the transaction itself remain on the public ledger. Confidentiality of
            # | amounts is a different property from anonymity of participants.
            explanation: "La extensión de transferencia confidencial cifra el monto transferido bajo Twisted ElGamal. No hace nada por ocultar quién transacciona: las dos pubkeys y la transacción misma quedan en el libro mayor público. La confidencialidad de los montos es una propiedad distinta del anonimato de los participantes."  # @src=efe70cd630cd
            options:                 # source order — keep it
              c:
                # | The amount stays public, but both wallet identities are encrypted under
                # | the auditor's key.
                label: "El monto queda público, pero las dos identidades de billetera están cifradas bajo la clave del auditor."  # @src=787d62d657e7
                # | It's the reverse. Token-2022 confidential transfers encrypt the amount,
                # | never the identities: addresses are always visible.
                feedback: "Es al revés. Las transferencias confidenciales de Token-2022 cifran el monto, nunca las identidades: las direcciones siempre son visibles."  # @src=d8a540aed0ac
              b:
                # | Both the amount and the two wallet addresses are hidden from everyone,
                # | including validators, who see only the proofs.
                label: "Tanto el monto como las dos direcciones de billetera quedan ocultos para todos, incluidos los validadores, que solo ven las pruebas."  # @src=cd37e5a5cd77
                # | Confidential transfers hide the amount only. The sender and receiver
                # | pubkeys, and the fact that a transfer happened, stay fully public.
                # | Encrypted is not anonymous.
                feedback: "Las transferencias confidenciales ocultan solo el monto. Las pubkeys del remitente y del destinatario, y el hecho de que hubo una transferencia, quedan completamente públicas. Cifrado no es anónimo."  # @src=1e3063b9c1d9
              a:
                # | The amount is encrypted, but your address and the recipient's address
                # | are still public on-chain.
                label: "El monto está cifrado, pero tu dirección y la dirección del destinatario siguen siendo públicas on-chain."  # @src=221d98aefc04
                # | Twisted ElGamal seals the amount and nothing else, so both pubkeys and
                # | the fact of the transfer stay on the public ledger; traffic analysis
                # | still sees the edge, just not its weight.
                feedback: "Twisted ElGamal sella el monto y nada más, así que las dos pubkeys y el hecho de la transferencia quedan en el libro mayor público; el análisis de tráfico sigue viendo la arista, solo que no su peso."  # @src=784dbdbf3865
              d:
                # | The amount is encrypted and no on-chain component checks it, since the
                # | proofs are verified off-chain by the wallets that hold the keys
                label: "El monto está cifrado y ningún componente on-chain lo verifica, ya que las pruebas se verifican off-chain en las billeteras que tienen las claves"  # @src=af514fcb1fe7
                # | A native program at ZkE1Gama1Proof11111111111111111111111111111 verifies
                # | every proof on chain, and Token-2022 confirms that verification before
                # | it touches a balance. Nothing here runs on trust.
                feedback: "Un programa nativo en ZkE1Gama1Proof11111111111111111111111111111 verifica cada prueba en la blockchain, y Token-2022 confirma esa verificación antes de tocar un saldo. Aquí nada corre sobre confianza."  # @src=de4ab0a2ad69
          m04l1-q2:
            # | A confidential transfer submits three zero-knowledge proofs. Which trio
            # | matches what Token-2022 actually verifies?
            prompt: "Una transferencia confidencial envía tres pruebas de conocimiento cero. ¿Cuál trío coincide con lo que Token-2022 verifica de verdad?"  # @src=03804f422178
            # | The three proofs are CiphertextCommitmentEqualityProof (the debit and the
            # | new balance commit to the same value),
            # | BatchedGroupedCiphertext3HandlesValidityProof (the amount is correctly
            # | encrypted under sender, receiver, and the optional auditor), and
            # | BatchedRangeProofU128 (the amount is in range). All three are checked by the
            # | ZK ElGamal Proof Program (SIMD-0153).
            explanation: "Las tres pruebas son CiphertextCommitmentEqualityProof (el débito y el saldo nuevo se comprometen con el mismo valor), BatchedGroupedCiphertext3HandlesValidityProof (el monto está correctamente cifrado bajo el remitente, el destinatario y el auditor opcional) y BatchedRangeProofU128 (el monto está dentro de rango). Las tres las verifica el ZK ElGamal Proof Program (SIMD-0153)."  # @src=e00dc872c0b5
            options:                 # source order — keep it
              d:
                # | A range proof, a validity proof, and a sufficient-balance proof against
                # | the sender's ciphertext
                label: "Una prueba de rango, una prueba de validez y una prueba de saldo suficiente contra el ciphertext del remitente"  # @src=0a3bacf02c64
                # | Two of the three land. The missing one is the equality proof: solvency
                # | is never proven directly, it follows from welding the sender's claimed
                # | remainder to the real post-debit ciphertext and range-proving that.
                feedback: "Dos de las tres aciertan. La que falta es la prueba de igualdad: la solvencia nunca se prueba directamente, sale de soldar el remanente declarado por el remitente al ciphertext real posterior al débito y probar ese en rango."  # @src=cfe0729c951d
              a:
                # | A signature proof, a Merkle inclusion proof against the account's state
                # | root, and a nonce-freshness proof that blocks replay.
                label: "Una prueba de firma, una prueba de inclusión de Merkle contra la raíz de estado de la cuenta y una prueba de frescura de nonce que bloquea el replay."  # @src=b77d23566c90
                # | None of those are part of the confidential-transfer flow; that's a mix
                # | of unrelated primitives from signatures and state compression.
                feedback: "Ninguna de esas es parte del flujo de transferencia confidencial; eso es una mezcla de primitivas no relacionadas, de firmas y de compresión de estado."  # @src=28c78844588b
              c:
                # | A range proof, a hash-preimage proof that opens the commitment, and a
                # | stake-weight proof.
                label: "Una prueba de rango, una prueba de preimagen de hash que abre el commitment y una prueba de peso de stake."  # @src=b7c2aa3cd524
                # | Only the range proof belongs here; hash-preimage and stake-weight proofs
                # | are not part of the confidential-transfer proof set.
                feedback: "Solo la prueba de rango pertenece aquí; las pruebas de preimagen de hash y de peso de stake no son parte del conjunto de pruebas de la transferencia confidencial."  # @src=5d672bb1e478
              b:
                # | An equality proof, a grouped-ciphertext validity proof (including the
                # | auditor ciphertext), and a range proof.
                label: "Una prueba de igualdad, una prueba de validez de ciphertext agrupado (incluido el ciphertext del auditor) y una prueba de rango."  # @src=3d4ddd073da2
                # | One proof per available lie: equality welds the claimed remainder to the
                # | chain's post-debit ciphertext, validity forces one amount under three
                # | keys, and the range proof blocks the modular underflow.
                feedback: "Una prueba por cada mentira disponible: la de igualdad suelda el remanente declarado al ciphertext posterior al débito de la blockchain, la de validez fuerza un solo monto bajo tres claves, y la prueba de rango bloquea el underflow modular."  # @src=f89de1415445
          m04l1-q3:
            # | Why does a single confidential transfer take several dependent transactions
            # | today, rather than one?
            prompt: "¿Por qué una sola transferencia confidencial hoy toma varias transacciones dependientes en vez de una?"  # @src=5f73c0568e80
            # | The proofs exceed what fits beside the transfer in a single transaction, so
            # | the flow is split across dependent transactions (create context accounts,
            # | verify proofs, apply). Transaction format v1 (SIMD-0296 / SIMD-0385) raises
            # | the envelope to 4,096 bytes and is designed to collapse this to one
            # | transaction — though it raises bytes only: 64 accounts, 64 instructions, and
            # | no lookup tables, so whether a given transfer fits is arithmetic, not a
            # | promise. Probed 2026-09-11, the enable_tx_v1 gate is active on devnet and
            # | staged on mainnet for epoch 1035, so mainnet still splits until that
            # | boundary passes. Re-probe the gate account yourself at write time, per
            # | cluster, and read the owner field: System Program means staged,
            # | Feature111... means live.
            explanation: "Las pruebas exceden lo que cabe al lado de la transferencia en una sola transacción, así que el flujo se parte en transacciones dependientes (crear cuentas de contexto, verificar pruebas, aplicar). El formato de transacción v1 (SIMD-0296 / SIMD-0385) eleva el margen a 4,096 bytes y está diseñado para colapsar esto en una sola transacción — solo que eleva únicamente los bytes: 64 cuentas, 64 instrucciones y ninguna lookup table, así que si una transferencia dada cabe es aritmética, no una promesa. Sondeado el 2026-09-11, el gate enable_tx_v1 está activo en devnet y agendado en mainnet para el epoch 1035, así que mainnet todavía se parte hasta que pase ese límite. Vuelve a sondear la cuenta del gate tú mismo al momento de escribir, por cluster, y lee el campo owner: System Program significa agendado, Feature111... significa activo."  # @src=030b985ce918
            options:                 # source order — keep it
              b:
                # | Because each confidential transfer must wait a full epoch for the mint's
                # | auditor to countersign it on chain.
                label: "Porque cada transferencia confidencial tiene que esperar un epoch entero a que el auditor del mint la refrende en la blockchain."  # @src=98fedee56fd3
                # | There is no per-transfer epoch wait and no auditor countersignature. The
                # | auditor merely receives its own encrypted copy of the amount; it does
                # | not gate the transfer.
                feedback: "No hay espera de un epoch por transferencia ni refrendo del auditor. El auditor simplemente recibe su propia copia cifrada del monto; no condiciona la transferencia."  # @src=40228e80e8d0
              c:
                # | Because the zero-knowledge proofs are too large to fit alongside the
                # | transfer in one transaction; transaction format v1 is meant to relax
                # | this but is not yet active on mainnet.
                label: "Porque las pruebas de conocimiento cero son demasiado grandes para caber junto a la transferencia en una sola transacción; el formato de transacción v1 pretende relajar esto pero todavía no está activo en mainnet."  # @src=9ffaed12ffac
                # | The proofs ride in context accounts precisely because they do not fit
                # | beside the instruction, and whether v1 has collapsed the dance is a
                # | per-cluster question you re-probe rather than assume.
                feedback: "Las pruebas viajan en cuentas de contexto precisamente porque no caben al lado de la instrucción, y si v1 ya colapsó el baile es una pregunta por cluster que vuelves a sondear en vez de asumir."  # @src=9981ebc32adc
              a:
                # | Because the ZK ElGamal Proof Program is deployed only on devnet, so
                # | mainnet has to route through extra hops.
                label: "Porque el ZK ElGamal Proof Program está desplegado solo en devnet, así que mainnet tiene que enrutar por saltos extra."  # @src=89a862f9642f
                # | The proof program is a real on-chain component, not a devnet-only stub.
                # | The multi-transaction reality is about proof SIZE, not deployment
                # | location.
                feedback: "El programa de pruebas es un componente on-chain real, no un stub solo de devnet. La realidad de varias transacciones es sobre el TAMAÑO de la prueba, no sobre el lugar de despliegue."  # @src=66ec20cf8ae6
              d:
                # | Because verifying three proofs exceeds one transaction's compute budget,
                # | so each proof typically needs a transaction of its own
                label: "Porque verificar tres pruebas excede el presupuesto de cómputo de una transacción, así que cada prueba típicamente necesita una transacción propia"  # @src=5ae65e82a816
                # | The binding limit the source names is bytes: 1,232 per v0 transaction,
                # | which the trio blows past on size alone. That is also why a bigger
                # | transaction envelope is the fix rather than a bigger compute cap.
                feedback: "El límite vinculante que nombra la fuente son bytes: 1,232 por transacción v0, que el trío rebasa solo por tamaño. Por eso también el arreglo es un margen de transacción más grande y no un tope de cómputo más grande."  # @src=47700fec7232
  m04-l2-issuer-ops:
    # | Issuer ops: auditor, registry, and confidential supply
    title: "Ops de emisor: auditor, registro y supply confidencial"  # @src=d60c2acb80e6
    blocks:
      configure-confidential-mint:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the named authority first: an empty string is 'missing-authority'.
          0: "Revisa primero el authority nombrado: un string vacío es 'missing-authority'."  # @src=2ee1bca04fa1
          # | The auditor pubkey is optional: null must still return ok:true.
          1: "La pubkey de auditor es opcional: null igual tiene que devolver ok:true."  # @src=91aa9cd8668f
          # | Combo rule 5 only bites when NonTransferable and ConfidentialTransferMint are
          # | both present without ConfidentialMintBurn.
          2: "La regla de combo 5 solo muerde cuando NonTransferable y ConfidentialTransferMint están las dos presentes sin ConfidentialMintBurn."  # @src=84dd6a64367f
        tests:                      # keyed by test case id
          t1:
            # | valid setup with an auditor key and auto-approve off
            description: "configuración válida con un auditor key y auto-approve apagado"  # @src=52c7fbdb5eda
          t2:
            # | auditor is optional, a null auditor with auto-approve on is still valid
            description: "el auditor es opcional, un auditor null con auto-approve encendido sigue siendo válido"  # @src=0f50a44f6679
          t3:
            # | no ConfidentialTransferMint extension, nothing to configure
            description: "sin extensión ConfidentialTransferMint, nada que configurar"  # @src=172334dc99c8
          t4:
            # | combo rule 5: NonTransferable + confidential without ConfidentialMintBurn is
            # | invalid
            description: "regla de combo 5: NonTransferable + confidencial sin ConfidentialMintBurn es inválido"  # @src=a0dffb5b0e96
          t5:
            # | adding ConfidentialMintBurn makes the NonTransferable + confidential set
            # | legal
            description: "agregar ConfidentialMintBurn vuelve legal el conjunto NonTransferable + confidencial"  # @src=6f28ae7f27be
          t6:
            # | an unset authority is rejected before anything else
            description: "un authority sin definir se rechaza antes que cualquier otra cosa"  # @src=1b4c2a17d1a5
      check:                      # quiz
        questions:
          m04l2-q1:
            # | You configured a confidential SPROUT mint with an auditor ElGamal pubkey.
            # | What does setting that auditor key actually change about every subsequent
            # | confidential transfer?
            prompt: "Configuraste un mint confidencial de SPROUT con una pubkey ElGamal de auditor. ¿Qué cambia de verdad poner ese auditor key en cada transferencia confidencial posterior?"  # @src=0cc40447b393
            # | The auditor is a single optional global ElGamal pubkey on the
            # | ConfidentialTransferMint. When set, the grouped-ciphertext validity proof
            # | forces each transfer to encrypt its amount under sender, receiver, AND
            # | auditor keys, so the auditor (and only the auditor) can reconcile amounts,
            # | while the public still sees ciphertext.
            explanation: "El auditor es una sola pubkey ElGamal global y opcional en el ConfidentialTransferMint. Cuando está puesta, la prueba de validez de ciphertext agrupado obliga a cada transferencia a cifrar su monto bajo las claves de remitente, receptor Y auditor, así que el auditor (y solo el auditor) puede conciliar montos, mientras el público sigue viendo ciphertext."  # @src=ee79b2e071ba
            options:                 # source order — keep it
              d:
                # | Each transfer gains an optional auditor ciphertext, which the sender can
                # | omit whenever an amount is too sensitive to disclose to the mint's
                # | auditor
                label: "Cada transferencia gana un ciphertext de auditor opcional, que el remitente puede omitir cuando un monto es demasiado sensible para divulgárselo al auditor del mint"  # @src=c3d6965e3449
                # | There is no per-transfer opt-out. While an auditor is configured the
                # | program rejects any transfer whose auditor ciphertext is missing or
                # | malformed, because coverage that a sender can decline is not coverage.
                feedback: "No hay opt-out por transferencia. Mientras haya un auditor configurado, el programa rechaza cualquier transferencia cuyo ciphertext de auditor falte o esté mal formado, porque una cobertura que un remitente puede declinar no es cobertura."  # @src=fc5302aaa81c
              b:
                # | Only the mint authority can now approve new confidential accounts before
                # | those accounts may receive funds.
                label: "Ahora solo la autoridad de mint puede aprobar cuentas confidenciales nuevas antes de que esas cuentas puedan recibir fondos."  # @src=2b7640d56d2e
                # | That behavior is the separate auto_approve_new_accounts flag, not the
                # | auditor key. The auditor key governs who can DECRYPT transfer amounts,
                # | not who can open accounts.
                feedback: "Ese comportamiento es el flag aparte auto_approve_new_accounts, no el auditor key. El auditor key gobierna quién puede DESCIFRAR montos de transferencia, no quién puede abrir cuentas."  # @src=543555abda75
              a:
                # | Every confidential transfer must additionally encrypt its amount under
                # | the auditor's key, which only the auditor can decrypt.
                label: "Cada transferencia confidencial tiene que cifrar además su monto bajo la clave del auditor, que solo el auditor puede descifrar."  # @src=7ae25befe9b9
                # | The grouped-ciphertext validity proof carries three handles, so one
                # | amount is sealed for sender, receiver and auditor at once while the
                # | public still reads ciphertext.
                feedback: "La prueba de validez de ciphertext agrupado lleva tres handles, así que un mismo monto queda sellado para remitente, receptor y auditor a la vez mientras el público sigue leyendo ciphertext."  # @src=a1d339d4c9a6
              c:
                # | Transfers become fully public the moment an auditor is set, because the
                # | program stops encrypting amounts once a designated third party can read
                # | them.
                label: "Las transferencias se vuelven totalmente públicas en el momento en que se pone un auditor, porque el programa deja de cifrar montos una vez que un tercero designado puede leerlos."  # @src=bee0a91ae6ac
                # | Amounts stay encrypted to the public. The auditor receives its OWN
                # | decryptable ciphertext via the grouped-ciphertext validity proof; that
                # | is targeted visibility, not a public disclosure.
                feedback: "Los montos siguen cifrados para el público. El auditor recibe su PROPIO ciphertext descifrable vía la prueba de validez de ciphertext agrupado; eso es visibilidad dirigida, no una divulgación pública."  # @src=124e40b075c3
          m04l2-q2:
            # | Your lab targets a cluster where the zk-ElGamal proof gate is off, so
            # | anything that needs it will fail. What's the designed move?
            prompt: "Tu lab apunta a un cluster donde el gate de pruebas de zk-ElGamal está apagado, así que todo lo que lo necesite va a fallar. ¿Cuál es la jugada diseñada?"  # @src=f8db37b888cc
            # | The cluster plan is devnet-first (gates active per docs), surfpool
            # | secondary. If the zk-ElGamal gate is off, the transfer proofs will not
            # | verify, so the lab degrades to configuring ConfidentialTransferMint plus the
            # | auditor and proving that extension state on-chain: the same skill, minus the
            # | unavailable verification, stated openly.
            explanation: "El plan de cluster es devnet primero (gates activos según la documentación), surfpool secundario. Si el gate de zk-ElGamal está apagado, las pruebas de transferencia no van a verificar, así que el lab degrada a configurar ConfidentialTransferMint más el auditor y demostrar ese estado de extensión on-chain: la misma habilidad, menos la verificación no disponible, dicho abiertamente."  # @src=88f8add0173b
            options:                 # source order — keep it
              d:
                # | Run the transfer flow anyway, and note in the write-up that the proof
                # | step may not verify on this cluster
                label: "Corre el flujo de transferencia de todas formas, y anota en la redacción que el paso de la prueba puede no verificar en este cluster"  # @src=1e4d488c4283
                # | Caveating a step that cannot succeed is not the designed fallback. That
                # | path keeps the same mint, the same auditor and the same verify script,
                # | and drops only the live transfer.
                feedback: "Poner una advertencia sobre un paso que no puede tener éxito no es el fallback diseñado. Ese camino conserva el mismo mint, el mismo auditor y el mismo script de verificación, y descarta solo la transferencia en vivo."  # @src=573634f68cce
              b:
                # | Degrade to configuring the extension and proving its state on-chain, and
                # | say so; the proofs cannot verify without the gate.
                label: "Degrada a configurar la extensión y demostrar su estado on-chain, y dilo; las pruebas no pueden verificar sin el gate."  # @src=c9958208c025
                # | The issuer skill this lesson grades is the configuration, so the
                # | fallback proves the extension and the auditor on-chain and names what it
                # | could not run, which is what the lab's own script does.
                feedback: "La habilidad de emisor que califica esta lección es la configuración, así que el fallback demuestra la extensión y el auditor on-chain y nombra lo que no pudo correr, que es lo que hace el propio script del lab."  # @src=d4d810ea1e1b
              c:
                # | Force the gate on with a surfpool override and present the fabricated
                # | activation as a live mainnet transfer.
                label: "Fuerza el gate encendido con un override de surfpool y presenta la activación fabricada como una transferencia en vivo de mainnet."  # @src=e9f283fa70a6
                # | Running on devnet or surfpool is fine, but the honest, designed fallback
                # | is configure-plus-prove-state, not presenting a locally forced gate as
                # | real activation.
                feedback: "Correr en devnet o surfpool está bien, pero el fallback honesto y diseñado es configurar-más-demostrar-el-estado, no presentar un gate forzado localmente como activación real."  # @src=4715bcaa292c
              a:
                # | Abandon confidential transfers for this token and mint a plain SPROUT
                # | instead, since the extension cannot be demonstrated without the gate.
                label: "Abandona las transferencias confidenciales para este token y acuña un SPROUT simple en su lugar, ya que la extensión no se puede demostrar sin el gate."  # @src=9fdfd1c006a7
                # | The lesson has a designed degrade path precisely so an off gate breaks
                # | nothing. You don't drop the build.
                feedback: "La lección tiene un camino de degradación diseñado precisamente para que un gate apagado no rompa nada. No abandonas el build."  # @src=4a2084a17496
          m04l2-q3:
            # | You want confidential SUPPLY for SPROUT: mint and burn amounts hidden, not
            # | just transfers. Which extension and rule apply?
            prompt: "Quieres SUPPLY confidencial para SPROUT: montos de acuñación y quema ocultos, no solo transferencias. ¿Qué extensión y qué regla aplican?"  # @src=b9a54f1f9e39
            # | ConfidentialMintBurn adds confidential supply (confidential burn,
            # | apply_pending_burn, and rotate_supply_elgamal_pubkey), and combo rule 3
            # | requires ConfidentialTransferMint to be present on the same mint. That's the
            # | issuer branch you enable on a second SPROUT variant.
            explanation: "ConfidentialMintBurn agrega supply confidencial (quema confidencial, apply_pending_burn y rotate_supply_elgamal_pubkey), y la regla de combo 3 exige que ConfidentialTransferMint esté presente en el mismo mint. Esa es la rama de emisor que habilitas en una segunda variante de SPROUT."  # @src=8f9122676771
            options:                 # source order — keep it
              b:
                # | ConfidentialTransferFeeConfig on its own, since hiding the fee flow is
                # | what makes mint and burn amounts confidential too.
                label: "ConfidentialTransferFeeConfig por su cuenta, ya que esconder el flujo de comisiones es lo que vuelve confidenciales también los montos de acuñación y quema."  # @src=42ee88f8ff56
                # | That extension governs withheld fees on confidential transfers, not
                # | confidential mint/burn of supply.
                feedback: "Esa extensión gobierna las comisiones retenidas en transferencias confidenciales, no la acuñación/quema confidencial del supply."  # @src=01430afc619e
              d:
                # | ConfidentialMintBurn on its own; it brings its own supply key and needs
                # | no other extension
                label: "ConfidentialMintBurn por su cuenta; trae su propia clave de supply y no necesita ninguna otra extensión"  # @src=c96ece4c99e4
                # | The extension is right and the rule is missing. Combo rule 3 refuses
                # | ConfidentialMintBurn unless ConfidentialTransferMint sits on the same
                # | mint, and your validator has rejected that set since m01-l4.
                feedback: "La extensión está bien y falta la regla. La regla de combo 3 no admite ConfidentialMintBurn a menos que ConfidentialTransferMint esté en el mismo mint, y tu validador ha rechazado ese conjunto desde m01-l4."  # @src=63e2e93116e1
              c:
                # | ConfidentialMintBurn, which requires ConfidentialTransferMint on the
                # | mint too.
                label: "ConfidentialMintBurn, que exige ConfidentialTransferMint en el mint también."  # @src=09aebe1ea26b
                # | Confidential supply on a mint whose transfers are public would protect
                # | nothing, so the dependency runs one way: confidential transfers without
                # | confidential supply is a product, the reverse is not.
                feedback: "Un supply confidencial en un mint cuyas transferencias son públicas no protegería nada, así que la dependencia corre en un solo sentido: transferencias confidenciales sin supply confidencial es un producto, al revés no."  # @src=f26c0ddbb5c3
              a:
                # | PermanentDelegate, which can reach into confidential balances to adjust
                # | supply.
                label: "PermanentDelegate, que puede meterse en los saldos confidenciales para ajustar el supply."  # @src=09bef1e20d7f
                # | PermanentDelegate explicitly does NOT work on confidential balances, and
                # | it isn't a supply-confidentiality feature in the first place.
                feedback: "PermanentDelegate explícitamente NO funciona sobre saldos confidenciales, y para empezar no es una feature de confidencialidad del supply."  # @src=ff780c42afcd
  m05-l1-dex-allowlist-artifact:
    # | The DEX allowlist as a teaching artifact
    title: "La allowlist del DEX como artefacto didáctico"  # @src=0943bc5ad976
    blocks:
      routability-predictor:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The allowlist is exactly five extensions: TransferFeeConfig, MetadataPointer,
          # | TokenMetadata, InterestBearingConfig, ScaledUiAmount.
          0: "La allowlist es exactamente cinco extensiones: TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount."  # @src=451dddbc271f
          # | Classic SPL and whitelisted mints short-circuit to routable before the
          # | extension check.
          1: "Los mints de SPL clásico y los que están en la whitelist hacen short-circuit a enrutable antes del chequeo de extensiones."  # @src=3e0dc68b4803
          # | One off-list extension taints the whole mint: think 'every', not 'some'.
          2: "Una extensión fuera de la lista contamina el mint entero: piensa 'every', no 'some'."  # @src=5591fe2191a7
        tests:                      # keyed by test case id
          t1-classic-spl:
            # | A classic SPL mint always routes, the check is bypassed for it.
            description: "Un mint de SPL clásico siempre se enruta, se le salta el chequeo."  # @src=a2d8ac9390ab
          t2-allowlisted-set:
            # | All three extensions are on the allowlist, so the pool is created.
            description: "Las tres extensiones están en la allowlist, así que el pool se crea."  # @src=c3fc58846e45
          t3-transfer-hook:
            # | TransferHook is off-list, arbitrary CU per transfer: so it reverts.
            description: "TransferHook está fuera de la lista, CU arbitrario por transferencia: así que revierte."  # @src=9030faeef000
          t4-permanent-delegate:
            # | PermanentDelegate can sweep the pool vault: rejected unless whitelisted.
            description: "PermanentDelegate puede barrer el vault del pool: rechazado salvo que esté en la whitelist."  # @src=c8fc77f05194
          t5-whitelisted-permanent-delegate:
            # | A MINT_WHITELIST / mint-association bypass lets a regulated
            # | PermanentDelegate stablecoin route.
            description: "Un bypass de MINT_WHITELIST / asociación de mint deja que se enrute una stablecoin regulada con PermanentDelegate."  # @src=254efeb1477b
          t6-scaled-ui-amount:
            # | ScaledUiAmount is a display extension on the allowlist: it routes.
            description: "ScaledUiAmount es una extensión de visualización que está en la allowlist: se enruta."  # @src=2475d42ea6af
          t7-mixed-taint:
            # | One off-list extension taints the whole mint even when another is
            # | allowlisted.
            description: "Una extensión fuera de la lista contamina el mint entero incluso cuando otra está en la allowlist."  # @src=49ae2793e66f
      check:                      # quiz
        questions:
          m05l1-q1-allowlist-hit:
            # | You try to seed a Raydium CP-Swap pool for a Token-2022 SPROUT carrying
            # | TransferFeeConfig + MetadataPointer + TokenMetadata. What happens, and why?
            prompt: "Intentas sembrar un pool de Raydium CP-Swap para un SPROUT de Token-2022 que lleva TransferFeeConfig + MetadataPointer + TokenMetadata. ¿Qué pasa, y por qué?"  # @src=4286785d8f90
            # | Raydium CP-Swap/CLMM allowlists exactly five extensions: TransferFeeConfig,
            # | MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount. A
            # | mint whose entire extension set falls inside that list creates a pool; the
            # | reject path fires only when an off-list extension is present.
            explanation: "Raydium CP-Swap/CLMM pone en la allowlist exactamente cinco extensiones: TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount. Un mint cuyo conjunto entero de extensiones cae dentro de esa lista crea un pool; la ruta de rechazo se dispara solo cuando hay presente una extensión fuera de la lista."  # @src=08fb0bb2be4f
            options:                 # source order — keep it
              a:
                # | Rejected: CP-Swap refuses every Token-2022 mint at pool creation; only
                # | classic SPL and the four MINT_WHITELIST entries can seed a pool.
                label: "Rechazado: CP-Swap rechaza todo mint de Token-2022 en la creación del pool; solo el SPL clásico y las cuatro entradas de MINT_WHITELIST pueden sembrar un pool."  # @src=61e674de008e
                # | CP-Swap does support Token-2022; it allowlists five specific extensions
                # | rather than refusing the program wholesale.
                feedback: "CP-Swap sí soporta Token-2022; pone cinco extensiones específicas en la allowlist en vez de rechazar el programa en bloque."  # @src=34f2100a3e5a
              d:
                # | Created, though a nonzero fee rate would fail this walk; the check reads
                # | the fee's value
                label: "Creado, aunque una tasa de comisión distinta de cero fallaría este recorrido; el chequeo lee el valor de la comisión"  # @src=7dfe9acd3f35
                # | The walk matches extension variants, not their settings. It asks whether
                # | a TransferFeeConfig entry exists, never whether the rate is zero or five
                # | percent.
                feedback: "El recorrido hace match con variantes de extensión, no con sus configuraciones. Pregunta si existe una entrada TransferFeeConfig, nunca si la tasa es cero o cinco por ciento."  # @src=12fc0c776b18
              b:
                # | Created: all three extensions are on the five-extension allowlist, so
                # | the mint passes.
                label: "Creado: las tres extensiones están en la allowlist de cinco extensiones, así que el mint pasa."  # @src=c2400be493ca
                # | The reject path fires when an off-list entry is present, and this set is
                # | three of the five, so the walk finishes and the pool is created.
                feedback: "La ruta de rechazo se dispara cuando hay presente una entrada fuera de la lista, y este conjunto es tres de las cinco, así que el recorrido termina y el pool se crea."  # @src=c1027e26ffe7
              c:
                # | Created: Raydium runs the mint's transfer hook to price the fee, so any
                # | fee-bearing mint works.
                label: "Creado: Raydium corre el transfer hook del mint para fijarle precio a la comisión, así que cualquier mint con comisión funciona."  # @src=6a2cb07255ed
                # | There is no hook on this mint; TransferFeeConfig is allowlisted
                # | outright, and a hook would be the refused extension, not the enabling
                # | one.
                feedback: "No hay hook en este mint; TransferFeeConfig está en la allowlist de plano, y un hook sería la extensión rechazada, no la que habilita."  # @src=8a5653d34a17
          m05l1-q2-hook-rationale:
            # | Your SPROUT variant wears the transfer hook you wrote in M3, and the
            # | pool-create reverts. Which of Raydium's own quoted rationales explains the
            # | rejection?
            prompt: "Tu variante de SPROUT lleva puesto el transfer hook que escribiste en M3, y la creación del pool revierte. ¿Cuál de las justificaciones que Raydium mismo cita explica el rechazo?"  # @src=8cdf9650eb07
            # | Each refused extension has its own distinct rationale in Raydium's docs. For
            # | TransferHook it is exactly that it 'invokes a custom program on every
            # | transfer, with arbitrary CU consumption', plus the extra-account forwarding
            # | burden a pool would have to carry on every swap.
            explanation: "Cada extensión rechazada tiene su propia justificación distinta en los docs de Raydium. Para TransferHook es exactamente que 'invoca un programa custom en cada transferencia, con consumo de CU arbitrario', más la carga de reenvío de cuentas extra que un pool tendría que llevar en cada swap."  # @src=5c8df195a08c
            options:                 # source order — keep it
              d:
                # | The hook program is unreviewed, and the venue refuses code it has not
                # | audited
                label: "El programa del hook está sin revisar, y la plataforma rechaza código que no ha auditado"  # @src=4a724ac99bd2
                # | Unreviewed is the published rationale for the group and member pointers,
                # | and it would not survive a hook that had been audited. The quoted reason
                # | for hooks is arbitrary per-transfer compute.
                feedback: "Sin revisar es la justificación publicada para los punteros de grupo y de miembro, y no sobreviviría a un hook que hubiera sido auditado. La razón citada para los hooks es el cómputo arbitrario por transferencia."  # @src=bc1320eae72d
              b:
                # | The hook grants a permanent delegate that can sweep the pool vault.
                label: "El hook otorga un delegado permanente que puede barrer el vault del pool."  # @src=70fe41236049
                # | That is the PermanentDelegate rationale; a hook confers no delegate
                # | authority over the vault.
                feedback: "Esa es la justificación de PermanentDelegate; un hook no confiere ninguna autoridad de delegado sobre el vault."  # @src=ce3397a87519
              a:
                # | The hook encrypts transfer amounts, so the AMM cannot compute a price.
                label: "El hook cifra los montos de transferencia, así que el AMM no puede computar un precio."  # @src=b190cffec420
                # | That is the ConfidentialTransfer rationale; a transfer hook does not
                # | encrypt amounts.
                feedback: "Esa es la justificación de ConfidentialTransfer; un transfer hook no cifra montos."  # @src=033cbad16c55
              c:
                # | The hook invokes a custom program on every transfer, with arbitrary CU
                # | consumption.
                label: "El hook invoca un programa custom en cada transferencia, con consumo de CU arbitrario."  # @src=b453b3f4a838
                # | Raydium's own words, and the reason is cost rather than theft: module 3
                # | proved a hook cannot move the pool's funds, but it can spend the swap's
                # | compute budget with no ceiling.
                feedback: "Las palabras de Raydium mismo, y la razón es el costo y no el robo: el módulo 3 demostró que un hook no puede mover los fondos del pool, pero sí puede gastar el presupuesto de cómputo del swap sin techo."  # @src=564120275189
          m05l1-q3-whitelist-bypass:
            # | A regulated stablecoin ships a PermanentDelegate extension (for compliance
            # | freeze/clawback) yet trades fine on Raydium CP-Swap. How, if
            # | PermanentDelegate is a refused extension?
            prompt: "Una stablecoin regulada trae una extensión PermanentDelegate (para el congelamiento y el clawback de compliance) y aun así se negocia sin problema en Raydium CP-Swap. ¿Cómo, si PermanentDelegate es una extensión rechazada?"  # @src=3d3cb3622189
            # | The check is skipped for classic SPL, for the hardcoded MINT_WHITELIST, and
            # | for mints with an initialized mint-association account. That bypass, not an
            # | allowlist entry, is how a whitelisted PermanentDelegate stablecoin routes
            # | despite the extension being otherwise refused.
            explanation: "El chequeo se salta para el SPL clásico, para el MINT_WHITELIST hardcodeado, y para los mints con una cuenta de asociación de mint inicializada. Ese bypass, y no una entrada de la allowlist, es cómo se enruta una stablecoin con PermanentDelegate que está en la whitelist, a pesar de que la extensión por lo demás está rechazada."  # @src=77349115e563
            options:                 # source order — keep it
              d:
                # | An Orca-style Token Badge review approved the mint, and CP-Swap honours
                # | badges issued by other venues
                label: "Una revisión de Token Badge al estilo de Orca aprobó el mint, y CP-Swap honra los badges emitidos por otras plataformas"  # @src=c3900f06653f
                # | A Token Badge is Orca's mechanism and it stops at Orca. CP-Swap's own
                # | doors are a hardcoded array of mint addresses and a mint-association
                # | account created through Raydium's admin path.
                feedback: "Un Token Badge es el mecanismo de Orca y se detiene en Orca. Las puertas propias de CP-Swap son un array hardcodeado de direcciones de mint y una cuenta de asociación de mint creada por la ruta de admin de Raydium."  # @src=cdadfd11209d
              c:
                # | Raydium strips the PermanentDelegate entry from the mint's TLV during
                # | pool creation, neutering the delegate before the pool accepts any
                # | deposits.
                label: "Raydium quita la entrada PermanentDelegate del TLV del mint durante la creación del pool, anulando al delegado antes de que el pool acepte ningún depósito."  # @src=9486235ceea1
                # | Raydium cannot strip a mint's extension; it bypasses the check for
                # | whitelisted mints and never modifies the mint.
                feedback: "Raydium no puede quitar una extensión de un mint; hace bypass del chequeo para los mints que están en la whitelist y nunca modifica el mint."  # @src=a91a15aeffad
              a:
                # | It sits in Raydium's static 4-entry MINT_WHITELIST (or carries a
                # | mint-association account), which bypasses the extension check entirely.
                label: "Está en el MINT_WHITELIST estático de 4 entradas de Raydium (o lleva una cuenta de asociación de mint), lo que hace bypass del chequeo de extensiones por completo."  # @src=03b825c65533
                # | The doors are per-mint: an address in the source array, or an
                # | association account an admin transaction creates. The extension stays
                # | refused; the token was approved by name.
                feedback: "Las puertas son por mint: una dirección en el array del código fuente, o una cuenta de asociación que crea una transacción de admin. La extensión sigue rechazada; el token fue aprobado por nombre."  # @src=83286fb1cde1
              b:
                # | PermanentDelegate is actually on the five-extension allowlist, right
                # | alongside TransferFeeConfig and metadata.
                label: "PermanentDelegate en realidad está en la allowlist de cinco extensiones, justo al lado de TransferFeeConfig y los metadatos."  # @src=91c46b51047d
                # | It is not; the allowlist is fee, metadata, interest, and scaled-UI only,
                # | and PermanentDelegate never appears on it.
                feedback: "No lo está; la allowlist es solo comisión, metadatos, intereses y scaled-UI, y PermanentDelegate nunca aparece en ella."  # @src=29ec0ccd78ec
          m05l1-q4-per-venue:
            # | Your Token-2022 SPROUT (fee + metadata) routed on CP-Swap. You want the same
            # | pool on Raydium's older AMM v4 as a fallback. What happens there?
            prompt: "Tu SPROUT de Token-2022 (comisión + metadatos) se enrutó en CP-Swap. Quieres el mismo pool en el AMM v4 más viejo de Raydium como respaldo. ¿Qué pasa ahí?"  # @src=b525d744642b
            # | Routability is per-venue, not per-DEX. Raydium's AMM v4 and Stable AMM
            # | predate Token-2022 and accept classic SPL only; Token-2022 support lives in
            # | CP-Swap/CLMM (and Farm v6 reward mints). The same brand runs venues with
            # | different rules.
            explanation: "La enrutabilidad es por venue, no por DEX. El AMM v4 y el Stable AMM de Raydium son anteriores a Token-2022 y aceptan solo SPL clásico; el soporte de Token-2022 vive en CP-Swap/CLMM (y en los mints de recompensa de Farm v6). La misma marca corre plataformas con reglas distintas."  # @src=78b2470d0da5
            options:                 # source order — keep it
              d:
                # | It routes: AMM v4 predates the Token-2022 allowlist, so it runs no
                # | extension check on any mint
                label: "Se enruta: el AMM v4 es anterior a la allowlist de Token-2022, así que no corre ningún chequeo de extensiones sobre ningún mint"  # @src=ebf5a783df26
                # | Predating Token-2022 is why it refuses, not why it waves you through.
                # | The program has no branch for a mint owned by a token program it was
                # | never taught about.
                feedback: "Ser anterior a Token-2022 es por qué rechaza, no por qué te deja pasar. El programa no tiene ninguna rama para un mint cuyo dueño es un programa de token del que nunca le enseñaron."  # @src=7ef298155d18
              a:
                # | It routes: if CP-Swap's allowlist accepts it, AMM v4 inherits the same
                # | allowlist.
                label: "Se enruta: si la allowlist de CP-Swap lo acepta, el AMM v4 hereda la misma allowlist."  # @src=962d7a8b0f39
                # | AMM v4 does not share CP-Swap's Token-2022 support; the allowlist is a
                # | CP-Swap/CLMM rule.
                feedback: "El AMM v4 no comparte el soporte de Token-2022 de CP-Swap; la allowlist es una regla de CP-Swap/CLMM."  # @src=25769737129b
              b:
                # | Rejected: AMM v4 and Stable AMM take classic SPL only; they predate
                # | Token-2022.
                label: "Rechazado: el AMM v4 y el Stable AMM toman solo SPL clásico; son anteriores a Token-2022."  # @src=f17f8f362223
                # | One brand, several venues, several rules. Those two programs know only
                # | the classic token program, so no extension set makes a Token-2022 mint
                # | eligible there.
                feedback: "Una marca, varias plataformas, varias reglas. Esos dos programas conocen solo el programa de token clásico, así que ningún conjunto de extensiones vuelve elegible ahí a un mint de Token-2022."  # @src=17bd17e7e6f8
              c:
                # | It routes after you remove MetadataPointer: AMM v4's stricter check
                # | treats it as a power extension, the way CP-Swap treats hooks.
                label: "Se enruta después de que quites MetadataPointer: el chequeo más estricto del AMM v4 lo trata como una extensión de poder, de la forma en que CP-Swap trata los hooks."  # @src=790a29c4b984
                # | AMM v4 accepts no Token-2022 mint at all, allowlisted or not; dropping
                # | an extension will not help.
                feedback: "El AMM v4 no acepta ningún mint de Token-2022 en absoluto, esté en la allowlist o no; quitar una extensión no va a ayudar."  # @src=b9edb8d6014c
  m05-l2-designing-routable-token:
    # | Designing a routable, compliant token
    title: "Diseñando un token enrutable y en cumplimiento"  # @src=049d24a8852a
    blocks:
      check:                      # quiz
        questions:
          m05l2-q1-power-extension-cost:
            # | You are finalizing SPROUT's launch-venue extension set and reach for
            # | DefaultAccountState(Frozen) 'for safety.' What does the compatibility thesis
            # | predict?
            prompt: "Estás finalizando el conjunto de extensiones de plataforma de lanzamiento del SPROUT y recurres a DefaultAccountState(Frozen) 'por seguridad'. ¿Qué predice la tesis de compatibilidad?"  # @src=333e05388f14
            # | The thesis in one line, and note the word it must never contain: fee,
            # | display and accounting extensions (TransferFeeConfig, MetadataPointer,
            # | TokenMetadata, InterestBearingConfig, ScaledUiAmount) get whitelisted;
            # | power/control extensions (hook, permanent delegate, default-frozen,
            # | confidential) get refused. Do NOT say 'compliance gets whitelisted':
            # | DefaultAccountState(Frozen) is the compliance team's favourite primitive and
            # | this question is grading its refusal. Adding a control extension 'just in
            # | case' costs you the venue.
            explanation: "La tesis en una línea, y fíjate en la palabra que nunca debe contener: las extensiones de comisión, visualización y contabilidad (TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount) quedan whitelisted; las extensiones de poder/control (hook, permanent delegate, default-frozen, confidencial) quedan refused. NO digas 'compliance queda whitelisted': DefaultAccountState(Frozen) es la primitiva favorita del equipo de cumplimiento y esta pregunta está calificando su rechazo. Agregar una extensión de control 'por si acaso' te cuesta la plataforma."  # @src=5e15115c96cf
            options:                 # source order — keep it
              d:
                # | Nothing breaks: the pool's vault is thawed at creation, so the frozen
                # | default never touches it
                label: "Nada se rompe: el vault del pool se descongela en la creación, así que el default congelado nunca lo toca"  # @src=20bc0720b6ca
                # | The walk matches extension variants, so thawing every account in
                # | existence would not help. The DefaultAccountState entry itself is what
                # | pool creation refuses.
                feedback: "El recorrido coincide con variantes de extensión, así que descongelar cada cuenta existente no ayudaría. La entrada DefaultAccountState en sí es lo que rechaza la creación del pool."  # @src=baf1e1737cc3
              a:
                # | Fine: frozen-by-default is a display concern, so DEXes whitelist it like
                # | MetadataPointer.
                label: "Todo bien: congelado por defecto es un asunto de visualización, así que los DEX lo ponen en la whitelist como MetadataPointer."  # @src=433a5ebfb3f4
                # | DefaultAccountState is a control extension, not a display one; Raydium
                # | explicitly rejects DefaultAccountState(Frozen).
                feedback: "DefaultAccountState es una extensión de control, no de visualización; Raydium rechaza explícitamente DefaultAccountState(Frozen)."  # @src=052172ca3370
              c:
                # | It breaks routability: power/control extensions get refused; only fee,
                # | display and accounting extensions get whitelisted.
                label: "Rompe la enrutabilidad: las extensiones de poder/control quedan refused; solo las extensiones de comisión, visualización y contabilidad quedan whitelisted."  # @src=cf18572d21f8
                # | Fee, display and accounting extensions get whitelisted; power and
                # | control extensions get refused, and a frozen default is control.
                # | Reaching for one just in case costs you the venue.
                feedback: "Las extensiones de comisión, visualización y contabilidad quedan whitelisted; las de poder y control quedan refused, y un default congelado es control. Recurrir a una por si acaso te cuesta la plataforma."  # @src=fce017a24fe9
              b:
                # | Fine: as long as you also add TransferFeeConfig, the allowlisted
                # | extension covers the frozen one.
                label: "Todo bien: siempre que también agregues TransferFeeConfig, la extensión de la allowlist cubre la congelada."  # @src=5018db45eca9
                # | Allowlisting is not additive; one off-list extension taints the whole
                # | mint regardless of what else is present.
                feedback: "Estar en la allowlist no es aditivo; una extensión fuera de la lista contamina el mint entero, sin importar qué más esté presente."  # @src=dc022f430d56
          m05l2-q2-wallet-matrix-honesty:
            # | A teammate wants the README to publish 'Phantom shows the transfer-fee
            # | warning, Backpack doesn't, Solflare greys it out.' You ran no such test.
            # | What is the honest move for the routability report?
            prompt: "Un compañero quiere que el README publique 'Phantom muestra la advertencia de comisión de transferencia, Backpack no, Solflare lo pone en gris'. No corriste ninguna prueba de esas. ¿Cuál es la movida honesta para el informe de enrutabilidad?"  # @src=bfee27ae69d3
            # | Phantom/Backpack/Solflare per-extension display behavior is unverified, so
            # | the report states it as 'verify in the wallet you target,' never a frozen
            # | matrix. The same honesty applies to Jupiter's Token-2022 routing policy,
            # | which its docs do not pin.
            explanation: "El comportamiento de visualización por extensión de Phantom/Backpack/Solflare está sin verificar, así que el informe lo enuncia como 'verifica en la billetera que tienes como objetivo', nunca como una matriz congelada. La misma honestidad se aplica a la política de enrutamiento de Token-2022 de Jupiter, que sus docs no fijan."  # @src=48e7e32010cb
            options:                 # source order — keep it
              b:
                # | Publish it: the Token-2022 spec standardizes how each wallet must render
                # | every extension, so the table is safe to assert for any compliant
                # | wallet.
                label: "Publícalo: la spec de Token-2022 estandariza cómo cada billetera tiene que renderizar cada extensión, así que la tabla es segura de afirmar para cualquier billetera en cumplimiento."  # @src=5bfa871cd328
                # | Per-wallet extension display is not standardized and was unverified this
                # | round; asserting it risks shipping wrong claims.
                feedback: "La visualización de extensiones por billetera no está estandarizada y quedó sin verificar en esta ronda; afirmarla arriesga entregar afirmaciones equivocadas."  # @src=dc828ee21b8a
              c:
                # | Publish it for Phantom only, since Phantom's behavior is documented in
                # | Raydium's allowlist.
                label: "Publícalo solo para Phantom, ya que el comportamiento de Phantom está documentado en la allowlist de Raydium."  # @src=db25bf3dea32
                # | Raydium's allowlist is a DEX pool-creation rule, not a wallet display
                # | spec; it says nothing about any wallet's UI.
                feedback: "La allowlist de Raydium es una regla de creación de pool de un DEX, no una spec de visualización de billetera; no dice nada sobre la UI de ninguna billetera."  # @src=26a7436c321d
              a:
                # | Do not freeze the matrix: mark per-wallet display as unverified and
                # | point readers at the wallet they target.
                label: "No congeles la matriz: marca la visualización por billetera como sin verificar y apunta a los lectores a la billetera que tienen como objetivo."  # @src=996db6dcee4b
                # | Per-wallet extension display is not standardized and was not tested this
                # | round, so the report names it as an open item and sends the reader to
                # | the wallet they actually target.
                feedback: "La visualización de extensiones por billetera no está estandarizada y no se probó en esta ronda, así que el informe la nombra como un ítem abierto y manda al lector a la billetera que de verdad tiene como objetivo."  # @src=3ce73163b34d
              d:
                # | Publish it with the date you checked attached, since a dated observation
                # | is what the course usually asks for when a claim drifts
                label: "Publícalo con la fecha en que revisaste adjunta, ya que una observación fechada es lo que el curso suele pedir cuando una afirmación deriva"  # @src=fc4f0eefd5b2
                # | A date makes an observation checkable; it cannot manufacture one.
                # | Nothing was run here, so the dated version is a guess wearing the
                # | course's own honesty costume.
                feedback: "Una fecha vuelve revisable una observación; no puede fabricarla. Aquí no se corrió nada, así que la versión fechada es una adivinanza con el disfraz de honestidad del propio curso."  # @src=61008a6bdc0b
          m05l2-q3-per-venue-scope:
            # | SPROUT ships with TransferFeeConfig + MetadataPointer + TokenMetadata and
            # | routes on Raydium CP-Swap. A colleague asks, 'so it'll route on Jupiter and
            # | in every wallet too, right?'
            prompt: "El SPROUT se entrega con TransferFeeConfig + MetadataPointer + TokenMetadata y se enruta en CP-Swap de Raydium. Un colega pregunta: '¿entonces se va a enrutar en Jupiter y en cada billetera también, no?'"  # @src=67fe6407a1f4
            # | Routability is per-venue. Raydium publishes a code allowlist, Orca gates
            # | some extensions behind a Token Badge, and Jupiter's routing policy is not
            # | found in its docs (a verify-at-write gap). The report captures the
            # | verified-routable set and names the venues still to verify, honestly.
            explanation: "La enrutabilidad es por plataforma. Raydium publica una allowlist en código, Orca restringe el acceso de algunas extensiones detrás de un Token Badge, y la política de enrutamiento de Jupiter no se encuentra en sus docs (un hueco de verifica-al-escribir). El informe captura el conjunto verificado-enrutable y nombra las plataformas que todavía faltan verificar, con honestidad."  # @src=2e3afd89be57
            options:                 # source order — keep it
              d:
                # | Mostly: venues key on the extension set, so a mint that clears one code
                # | allowlist usually clears another, and the report can say so with a
                # | caveat attached
                label: "En general sí: las plataformas se basan en el conjunto de extensiones, así que un mint que pasa una allowlist en código suele pasar otra, y el informe puede decirlo con una salvedad adjunta"  # @src=77d85aa4f52c
                # | The mechanisms are not even the same kind. Orca grants per-mint approval
                # | by human review and Jupiter publishes no policy at all, so there is no
                # | base rate to generalize from, only venues to check.
                feedback: "Los mecanismos no son ni del mismo tipo. Orca concede aprobación por mint mediante revisión humana y Jupiter no publica ninguna política, así que no hay tasa base desde la cual generalizar, solo plataformas por revisar."  # @src=be1b99784c42
              c:
                # | Only if you also mint a classic SPL twin, since aggregators skip
                # | Token-2022 mints when they build routes.
                label: "Solo si además acuñas un gemelo SPL clásico, ya que los agregadores se saltan los mints Token-2022 cuando construyen rutas."  # @src=6efbaf36f44d
                # | Aggregators do handle Token-2022; the point is each has its own
                # | per-extension policy, not that they ignore the program.
                feedback: "Los agregadores sí manejan Token-2022; el punto es que cada uno tiene su propia política por extensión, no que ignoren el programa."  # @src=4bedb5cb549e
              b:
                # | Not necessarily: each venue sets its own rule (Orca's Token Badge,
                # | Jupiter's unstated policy); the report lists what you must still verify.
                label: "No necesariamente: cada plataforma fija su propia regla (el Token Badge de Orca, la política no enunciada de Jupiter); el informe lista lo que todavía tienes que verificar."  # @src=45e78ee96d32
                # | Each venue sets its own rule and some have not written it down, so the
                # | report ships the verified-routable set beside a named list of what is
                # | still open.
                feedback: "Cada plataforma fija su propia regla y algunas no la escribieron, así que el informe entrega el conjunto verificado-enrutable junto a una lista nombrada de lo que sigue abierto."  # @src=856ecf57aa05
              a:
                # | Yes: Raydium's five-extension allowlist is the ecosystem standard, and
                # | Jupiter, Orca, and every major wallet mirror it in their own routing and
                # | display checks.
                label: "Sí: la allowlist de cinco extensiones de Raydium es el estándar del ecosistema, y Jupiter, Orca y cada billetera relevante la espejan en sus propias revisiones de enrutamiento y visualización."  # @src=b7408fa501b0
                # | There is no shared standard; Orca uses a Token Badge review and
                # | Jupiter's Token-2022 policy is not pinned in its docs.
                feedback: "No hay ningún estándar compartido; Orca usa una revisión de Token Badge y la política de Token-2022 de Jupiter no está fijada en sus docs."  # @src=cbfda4e09ed7
  m06-l1-metadata-standards:
    # | The metadata standards wallets actually read
    title: "Los estándares de metadatos que las billeteras realmente leen"  # @src=0ce7b0c407cf
    blocks:
      check:                      # quiz
        questions:
          m06-l1-metadata-standards-q1:
            # | You fetch a legacy NFT's on-chain account and it does NOT contain the image
            # | bytes or the trait list. A teammate says the asset is broken. What's
            # | actually going on?
            prompt: "Traes la cuenta on-chain de un NFT legado y NO contiene los bytes de la imagen ni la lista de traits. Un compañero dice que el activo está roto. ¿Qué está pasando realmente?"  # @src=65db166eda6b
            # | A Metaplex on-chain record is a small struct plus a uri pointer. The rich
            # | content (image, animation_url, attributes) is a JSON document at that uri,
            # | following the Token Metadata JSON standard (whose canonical schema host,
            # | schema.metaplex.com, no longer resolves; the lesson's validator script
            # | carries the field contract). An empty-looking account is normal; you resolve
            # | the uri to see the asset.
            explanation: "Un registro on-chain de Metaplex es una struct pequeña más un puntero uri. El contenido rico (image, animation_url, attributes) es un documento JSON en esa uri, que sigue el estándar JSON de Token Metadata (cuyo host canónico del schema, schema.metaplex.com, ya no resuelve; el script validador de la lección lleva el contrato de campos). Una cuenta con apariencia vacía es normal; resuelves la uri para ver el activo."  # @src=f69c69a22f96
            options:                 # source order — keep it
              c:
                # | Data holds only name, symbol, uri, seller_fee_basis_points and creators;
                # | the image and traits live in the JSON.
                label: "Data guarda solo name, symbol, uri, seller_fee_basis_points y creators; la imagen y los traits viven en el JSON."  # @src=d0c54fe11b78
                # | That is the architecture, and the uri field in their own dump was the
                # | answer: five fields on-chain, everything rich one fetch away.
                feedback: "Esa es la arquitectura, y el campo uri en su propio dump era la respuesta: cinco campos on-chain, todo lo rico a un fetch de distancia."  # @src=3f02326f359f
              d:
                # | The image and traits sit in the 65-byte account header the decoder skips
                # | past, so the Data struct legitimately shows neither.
                label: "La imagen y los traits están en los 65 bytes de header de la cuenta que el decodificador se saltea, así que la struct Data legítimamente no muestra ninguno de los dos."  # @src=f2dd61d0e149
                # | The skipped 65 bytes are a one-byte account key, the 32-byte update
                # | authority and the 32-byte mint. No room for a PNG, and no traits either.
                feedback: "Los 65 bytes salteados son una clave de cuenta de un byte, la autoridad de actualización de 32 bytes y el mint de 32 bytes. Sin lugar para un PNG, y sin traits tampoco."  # @src=16caf2b2d0d1
              b:
                # | The image and traits were pruned by the RPC's default account encoding;
                # | a full archive node would return every missing field.
                label: "La imagen y los traits fueron podados por el encoding de cuenta por defecto del RPC; un nodo de archivo completo devolvería cada campo faltante."  # @src=003b248a5045
                # | RPCs don't prune asset fields, and no node type or encoding changes
                # | that: the on-chain Data struct genuinely doesn't hold the image or
                # | traits; they live in the off-chain JSON.
                feedback: "Los RPCs no podan campos de activo, y ningún tipo de nodo ni encoding cambia eso: la struct Data on-chain genuinamente no guarda la imagen ni los traits; viven en el JSON off-chain."  # @src=479735828923
              a:
                # | The account was created with the wrong program, so it needs re-minting
                # | with the image bytes embedded in the Data struct.
                label: "La cuenta se creó con el programa equivocado, así que necesita volver a acuñarse con los bytes de la imagen embebidos en la struct Data."  # @src=a5a70a392751
                # | Nothing is broken and nothing needs re-minting: on-chain accounts never
                # | embed the image. The bytes are supposed to be off-chain.
                feedback: "Nada está roto y nada necesita volver a acuñarse: las cuentas on-chain nunca embeben la imagen. Los bytes se supone que van off-chain."  # @src=8ac9e9be479f
          m06-l1-metadata-standards-q2:
            # | For SPROUT's Token-2022 mint you set the MetadataPointer to point at a
            # | separate account you control. What's the risk versus the usual layout?
            prompt: "Para el mint Token-2022 del SPROUT configuras el MetadataPointer para que apunte a una cuenta separada que tú controlas. ¿Cuál es el riesgo frente al layout habitual?"  # @src=4d100f2c2283
            # | MetadataPointer tells consumers where the canonical metadata is. Pointing it
            # | at the mint itself (self-referential) means the metadata is inseparable from
            # | the mint and can't be impersonated. Pointing it at an arbitrary account
            # | reintroduces the spoofing surface the pointer was designed to close.
            explanation: "El MetadataPointer les dice a los consumidores dónde están los metadatos canónicos. Apuntarlo al mint mismo (autorreferencial) significa que los metadatos son inseparables del mint y no pueden suplantarse. Apuntarlo a una cuenta arbitraria reintroduce la superficie de spoofing que el puntero fue diseñado para cerrar."  # @src=01a6e4950497
            options:                 # source order — keep it
              c:
                # | The mint will fail to initialize, because InitializeMint2 validates that
                # | the MetadataPointer target equals the mint address and rejects any
                # | configuration aimed at a separate account.
                label: "El mint va a fallar al inicializar, porque InitializeMint2 valida que el objetivo del MetadataPointer sea igual a la dirección del mint y rechaza cualquier configuración apuntada a una cuenta separada."  # @src=1db625c2c0ee
                # | It can legally point elsewhere; that's precisely why it's a risk. The
                # | self-referential form is a convention that removes the spoofing surface,
                # | not a hard requirement.
                feedback: "Puede apuntar legalmente a otro lado; precisamente por eso es un riesgo. La forma autorreferencial es una convención que elimina la superficie de spoofing, no un requisito duro."  # @src=e0d5fffaee62
              a:
                # | A pointer to any account other than the mint itself can be aimed at
                # | spoofed metadata; the self-referential layout is the anti-spoofing
                # | default for exactly this reason.
                label: "Un puntero a cualquier cuenta que no sea el mint mismo puede apuntarse a metadatos suplantados; el layout autorreferencial es la opción anti-spoofing por defecto exactamente por esta razón."  # @src=de858e0c9318
                # | Indirection is the surface: whatever the pointer names is what consumers
                # | treat as canonical, so the only target nobody else can substitute is the
                # | mint itself.
                feedback: "La indirección es la superficie: lo que sea que el puntero nombre es lo que los consumidores tratan como canónico, así que el único objetivo que nadie más puede sustituir es el mint mismo."  # @src=d23e03c62ea4
              b:
                # | None: the pointer target is cosmetic, since wallets ignore it and read
                # | the mint's TLV entry directly either way.
                label: "Ninguno: el objetivo del puntero es cosmético, ya que las billeteras lo ignoran y leen la entrada TLV del mint directamente de todos modos."  # @src=446bac493462
                # | The target is not cosmetic: wallets follow the pointer to find the
                # | canonical metadata, so where it aims determines what they trust.
                feedback: "El objetivo no es cosmético: las billeteras siguen el puntero para encontrar los metadatos canónicos, así que a dónde apunta determina en qué confían."  # @src=ae2d99bd3d4a
              d:
                # | A separate account can be closed or repointed later, but wallets
                # | typically fall back to the mint's own TLV, so the exposure is a brief
                # | display gap.
                label: "Una cuenta separada puede cerrarse o reapuntarse después, pero las billeteras típicamente caen de vuelta en el TLV del mint mismo, así que la exposición es un breve hueco de visualización."  # @src=de7abdc65a76
                # | There is no fallback to fall back to: the pointer is how a consumer
                # | decides which bytes are canonical, so a bad target is bad metadata, not
                # | a gap.
                feedback: "No hay ningún fallback en el que caer: el puntero es cómo un consumidor decide qué bytes son canónicos, así que un objetivo malo es metadato malo, no un hueco."  # @src=e296460e1a39
          m06-l1-metadata-standards-q3:
            # | You're deciding where to host an Almanac asset's JSON so it still resolves
            # | in five years. Which framing is honest?
            prompt: "Estás decidiendo dónde hospedar el JSON de un activo del Almanac para que siga resolviendo en cinco años. ¿Qué encuadre es honesto?"  # @src=9466babb27e0
            # | On-chain you store a pointer; permanence is a property of the store behind
            # | it. Irys is Metaplex CLI's documented default uploader and Arweave URIs are
            # | pervasive; IPFS works but relies on continued pinning. The honest rule is
            # | 'the URI is permanent only if the store is.'
            explanation: "On-chain guardas un puntero; la permanencia es una propiedad del almacenamiento que está detrás. Irys es el uploader por defecto documentado de la CLI de Metaplex y las URIs de Arweave están difundidas; IPFS funciona pero depende de pinning continuo. La regla honesta es 'la URI es permanente solo si el almacenamiento lo es'."  # @src=49c6ff91bb22
            options:                 # source order — keep it
              c:
                # | IPFS is the verified market standard for permanence: content addressing
                # | pins the asset to its hash, so the host behind the gateway stops
                # | mattering.
                label: "IPFS es el estándar de mercado verificado para la permanencia: el direccionamiento por contenido ata el activo a su hash, así que el host detrás del gateway deja de importar."  # @src=655c1398be5a
                # | Content addressing is a real integrity upgrade, but availability still
                # | depends on someone continuing to pin the file, and the health of that
                # | pinning market went unverified this round.
                feedback: "El direccionamiento por contenido es una mejora de integridad real, pero la disponibilidad sigue dependiendo de que alguien siga pineando el archivo, y la salud de ese mercado de pinning quedó sin verificar en esta ronda."  # @src=97b613a57b86
              d:
                # | Dropping the update authority makes the asset permanent, because a
                # | record nobody can rewrite will keep resolving to the same file.
                label: "Abandonar la autoridad de actualización hace permanente el activo, porque un registro que nadie puede reescribir va a seguir resolviendo al mismo archivo."  # @src=06d00565322d
                # | Immutability and durability are separate decisions. Freezing the record
                # | freezes the pointer, and a frozen pointer at a dead bucket resolves to
                # | nothing forever.
                feedback: "La inmutabilidad y la durabilidad son decisiones separadas. Congelar el registro congela el puntero, y un puntero congelado en un bucket muerto resuelve a nada para siempre."  # @src=017210627fee
              b:
                # | The asset is only as durable as the URI it points at; Irys/Arweave are
                # | the documented permanent defaults.
                label: "El activo es tan durable como la URI a la que apunta; Irys/Arweave son las opciones permanentes por defecto documentadas."  # @src=1455b6b1e070
                # | Permanence is a property of the store, not of the pointer. Irys in front
                # | of Arweave is the documented default precisely because the endowment
                # | outlives the team.
                feedback: "La permanencia es una propiedad del almacenamiento, no del puntero. Irys adelante de Arweave es la opción por defecto documentada precisamente porque la dotación sobrevive al equipo."  # @src=bbcd75ff810f
              a:
                # | Any HTTPS URL is fine, because the on-chain account guarantees the
                # | content: the uri is stored on-chain under an update authority, and rent
                # | keeps that record alive forever.
                label: "Cualquier URL HTTPS sirve, porque la cuenta on-chain garantiza el contenido: la uri se guarda on-chain bajo una autoridad de actualización, y el rent mantiene vivo ese registro para siempre."  # @src=2c4fafc0a736
                # | Rent keeps the struct alive forever and the struct will point at a 404
                # | just as long. The account stores the uri, never the bytes behind it.
                feedback: "El rent mantiene viva la struct para siempre y la struct va a apuntar a un 404 por el mismo tiempo. La cuenta guarda la uri, nunca los bytes que están detrás."  # @src=a384ac388cd5
  m06-l2-metaplex-core:
    # | Ship the NFT: Metaplex Core collections, plugins, and editions
    title: "Entrega el NFT: colecciones, plugins y ediciones de Metaplex Core"  # @src=086ab7dacfc3
    blocks:
      royalties-plugin-config:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The starter only checks the shares sum; add the basisPoints range, the ruleSet
          # | membership, the duplicate-address guard, and the per-share range.
          0: "El starter revisa solo la suma de las participaciones; agrega el rango de basisPoints, la pertenencia del ruleSet, la guarda de direcciones duplicadas, y el rango por participación."  # @src=ff7f17fc1971
          # | basisPoints is 0..10000 (10000 = 100%), an integer; reject anything outside
          # | that first.
          1: "basisPoints es 0..10000 (10000 = 100%), un entero; rechaza primero cualquier cosa fuera de eso."  # @src=c8d0871d5115
          # | Track seen creator addresses in a Set to catch duplicates before you total the
          # | shares.
          2: "Lleva la cuenta de las direcciones de creador vistas en un Set para atrapar duplicados antes de totalizar las participaciones."  # @src=e04121ac14b0
        tests:                      # keyed by test case id
          t1-valid-single-creator:
            # | A 5% royalty to one creator with ruleSet None is valid.
            description: "Una regalía de 5% a un creador con ruleSet None es válida."  # @src=a0553f9a1cde
          t2-basis-points-over-max:
            # | basisPoints above 10000 is rejected even when shares sum to 100.
            description: "Un basisPoints arriba de 10000 se rechaza incluso cuando las participaciones suman 100."  # @src=56e44831596e
          t3-shares-do-not-sum:
            # | Two creators whose shares sum to 90 are rejected.
            description: "Dos creadores cuyas participaciones suman 90 se rechazan."  # @src=8e3a2088afb8
          t4-duplicate-creator:
            # | The same creator address twice is rejected even though shares sum to 100.
            description: "La misma dirección de creador dos veces se rechaza aunque las participaciones sumen 100."  # @src=f689509b7e9c
          t5-unknown-ruleset:
            # | A ruleSet outside None/ProgramAllowList/ProgramDenyList is rejected.
            description: "Un ruleSet fuera de None/ProgramAllowList/ProgramDenyList se rechaza."  # @src=9a6ac8c64f68
          t6-valid-allowlist-split:
            # | A two-creator 70/30 split with ruleSet ProgramAllowList is valid.
            description: "Un reparto 70/30 de dos creadores con ruleSet ProgramAllowList es válido."  # @src=0cf860f8dedf
      check:                      # quiz
        questions:
          m06-l2-metaplex-core-q1:
            # | You mint three Almanac assets, then try to create the collection and add
            # | them. The downstream membership reads come back empty. What went wrong?
            prompt: "Acuñas tres activos Almanac, y después intentas crear la colección y agregarlos. Las lecturas de membresía aguas abajo vuelven vacías. ¿Qué salió mal?"  # @src=595941390c58
            # | Core's model is collection-first: you create and verify the Almanac
            # | collection, then mint assets INTO it so membership is written at mint. An
            # | after-the-fact update path does exist — a retrofit signed by authorities on
            # | both sides — but nothing runs it for you, which is why the membership reads
            # | came back empty. The collection-first habit stays load-bearing: Bubblegum v2
            # | in the next module mints cNFTs into a Core collection too.
            explanation: "El modelo de Core es colección-primero: creas y verificas la colección Almanac, y después acuñas activos DENTRO de ella para que la membresía se escriba al momento del mint. Sí existe un camino de update posterior — una readaptación firmada por autoridades de los dos lados — pero nada lo corre por ti, que es por qué las lecturas de membresía volvieron vacías. El hábito colección-primero sigue siendo estructural: Bubblegum v2 en el módulo siguiente también acuña cNFTs dentro de una colección Core."  # @src=3054302afb41
            options:                 # source order — keep it
              c:
                # | The collection didn't exist when the assets were minted, so they came
                # | out as orphans with Address update authorities; nothing retrofits
                # | membership on its own, and moving an orphan in later takes an explicit
                # | update signed by authorities on both sides.
                label: "La colección no existía cuando se acuñaron los activos, así que salieron como huérfanos con autoridades de actualización Address; nada readapta la membresía por su cuenta, y meter un huérfano después toma un update explícito firmado por autoridades de los dos lados."  # @src=574c047f4bd2
                # | Read the arm and you have your diagnosis: Address means orphan,
                # | Collection means member. Order is the fix, and it has to be the order
                # | you mint in.
                feedback: "Lee la variante y tienes tu diagnóstico: Address quiere decir huérfano, Collection quiere decir miembro. El orden es el arreglo, y tiene que ser el orden en que acuñas."  # @src=12ce4ddbe4d9
              d:
                # | The assets are members already; Core writes membership at mint but
                # | leaves it unverified until the collection authority signs a separate
                # | verify instruction, so run that once per asset and the reads populate.
                label: "Los activos ya son miembros; Core escribe la membresía al momento del mint pero la deja sin verificar hasta que la autoridad de la colección firme una instrucción de verify aparte, así que corre esa una vez por activo y las lecturas se llenan."  # @src=13d6be60b711
                # | That is the Token Metadata ritual, and Core deletes it. There is no
                # | verified boolean to flip: membership IS the update authority arm,
                # | writable only when the collection authority signs the mint itself.
                feedback: "Ese es el ritual de Token Metadata, y Core lo borra. No hay booleano verified que voltear: la membresía ES la variante de autoridad de actualización, escribible solo cuando la autoridad de la colección firma el mint mismo."  # @src=db41ce443487
              b:
                # | The assets need a Royalties plugin attached before a collection will
                # | accept them as members, and the plugin has to be added at mint rather
                # | than later.
                label: "Los activos necesitan un plugin Royalties adjuntado antes de que una colección los acepte como miembros, y el plugin tiene que agregarse al momento del mint en vez de después."  # @src=bb021f0f8d97
                # | Royalties and membership are independent plugins/relationships; a
                # | missing Royalties plugin doesn't explain empty membership.
                feedback: "Royalties y la membresía son plugins/relaciones independientes; un plugin Royalties faltante no explica una membresía vacía."  # @src=b71a35f6e8ba
              a:
                # | Core assets minted before their collection can only join it during the
                # | program's scheduled re-index window, when the collection authority
                # | batch-approves pending membership and rewrites their update authorities.
                label: "Los activos Core acuñados antes que su colección solo pueden unirse a ella durante la ventana de re-indexado programada del programa, cuando la autoridad de la colección aprueba en lote la membresía pendiente y reescribe sus autoridades de actualización."  # @src=eb9c6ea58223
                # | There's no re-index window and no batch approval; membership is written
                # | at mint against an existing collection, or afterwards only by an
                # | explicit two-signature update, never by a scheduled program pass.
                feedback: "No hay ventana de re-indexado ni aprobación en lote; la membresía se escribe al momento del mint contra una colección existente, o después solo por un update explícito de dos firmas, nunca por una pasada programada del programa."  # @src=c3e1ef6452c5
          m06-l2-metaplex-core-q2:
            # | A stakeholder wants the ~0.003 SOL Core mint cost printed as a hard
            # | guarantee in your docs. How do you frame it honestly?
            prompt: "Un stakeholder quiere que los ~0.003 SOL que cuesta un mint de Core se impriman en tus docs como una garantía dura. ¿Cómo lo enmarcas con honestidad?"  # @src=f5ef2d91c0a9
            # | The cost story is real and load-bearing for choosing Core, but the numbers
            # | are vendor-published (metaplex.com/docs/core) with no independent
            # | third-party measurement found. Attribute them as such, the same discipline
            # | the course applies to every moving number.
            explanation: "La historia del costo es real y estructural para elegir Core, pero los números son publicados por el proveedor (metaplex.com/docs/core) sin ninguna medición independiente de terceros encontrada. Atribúyelos como tales, la misma disciplina que el curso aplica a cada número que se mueve."  # @src=cfebe3aaf271
            options:                 # source order — keep it
              c:
                # | As a measured result from this course's own benchmark harness, run
                # | against the same surfnet the lab uses.
                label: "Como un resultado medido por el propio arnés de benchmark de este curso, corrido contra el mismo surfnet que usa el lab."  # @src=255c15e55fe3
                # | The course did not measure it: the figure comes from Metaplex's docs.
                # | Presenting it as your own measurement launders a vendor claim.
                feedback: "El curso no lo midió: la cifra viene de los docs de Metaplex. Presentarla como tu propia medición blanquea una afirmación del proveedor."  # @src=9f20e31d4728
              b:
                # | As a fixed protocol constant baked into the Core program: every mint
                # | pays exactly 0.003 SOL and 17,000 CU.
                label: "Como una constante de protocolo fija cocinada dentro del programa Core: cada mint paga exactamente 0.003 SOL y 17,000 CU."  # @src=91e37a3bd9ba
                # | It's not a protocol constant; it's a vendor benchmark that varies with
                # | rent and instruction shape, so it can't be promised as an invariant.
                feedback: "No es una constante de protocolo; es un benchmark del proveedor que varía con el rent y la forma de la instrucción, así que no se puede prometer como una invariante."  # @src=354db7f038ff
              a:
                # | As Metaplex's vendor-published figure versus Token Metadata's, cited as
                # | vendor-published rather than as a number this course independently
                # | measured.
                label: "Como la cifra publicada por el proveedor Metaplex contra la de Token Metadata, citada como publicada por el proveedor en vez de como un número que este curso midió de forma independiente."  # @src=cf28ca643db0
                # | Cite the vendor, show your own account. Attribution costs one clause and
                # | it is what keeps the comparison usable when somebody checks it against
                # | their own mint.
                feedback: "Cita al proveedor, muestra tu propia cuenta. La atribución cuesta una cláusula y es lo que mantiene la comparación usable cuando alguien la revisa contra su propio mint."  # @src=45b2c64b0ca4
              d:
                # | As a number you confirmed yourself, since first-mint.ts printed the same
                # | rent for your scratch asset on the surfnet.
                label: "Como un número que confirmaste tú mismo, ya que first-mint.ts imprimió el mismo rent para tu activo de borrador en el surfnet."  # @src=ca219c0a51c9
                # | Your run printed a rent deposit in the low thousandths, not the vendor's
                # | figure: the rent component moves with the name and uri you stored
                # | inline.
                feedback: "Tu corrida imprimió un depósito de rent en las milésimas bajas, no la cifra del proveedor: el componente de rent se mueve con el name y el uri que guardaste inline."  # @src=2788282945b6
          m06-l2-metaplex-core-q3:
            # | You apply PermanentFreeze to the Founding-Farmer badge to make it soulbound,
            # | then later get a request to let a farmer transfer their badge to a new
            # | wallet. What's true?
            prompt: "Aplicas PermanentFreeze al badge Founding-Farmer para volverlo soulbound, y después te llega un pedido de dejar que un granjero transfiera su badge a una billetera nueva. ¿Qué es verdad?"  # @src=927a63d49c51
            # | Be precise about where the permanence comes from, because this is the
            # | lesson's most carefully drawn distinction. PermanentFreezeDelegate is freeze
            # | that CAN BE MADE irrevocable, not freeze that is born irrevocable:
            # | frozen=true plus an authority someone holds is thawable. What welds the
            # | Founding-Farmer badge is the authority arm set to None, which removes the
            # | key that could undo it. So the decision is made at mint and it is a decision
            # | about the authority: null it for assets that should never move, retain it
            # | when you might need to transfer later.
            explanation: "Sé preciso sobre el origen de la permanencia, porque esta es la distinción más cuidadosamente trazada de la lección. PermanentFreezeDelegate es congelamiento que SE PUEDE VOLVER irrevocable, no congelamiento que nace irrevocable: frozen=true más una autoridad que alguien tiene es descongelable. Lo que suelda el badge Founding-Farmer es la variante de autoridad puesta en None, que quita la clave que podría deshacerlo. Así que la decisión se toma al momento del mint y es una decisión sobre la autoridad: anúlala para activos que nunca deberían moverse, retenla cuando podrías necesitar transferir después."  # @src=fd1cae961408
            options:                 # source order — keep it
              a:
                # | You can toggle PermanentFreeze off with the freeze delegate authority
                # | and re-enable it after the move.
                label: "Puedes apagar PermanentFreeze con la autoridad del freeze delegate y volver a habilitarlo después del movimiento."  # @src=7d5e92b60adc
                # | Not on this badge, and the reason is the arm rather than the plugin.
                # | PermanentFreezeDelegate CAN be thawed while a freeze authority exists;
                # | the badge is welded because that authority was set to None at mint, and
                # | no key exists that could ever change it back.
                feedback: "No en este badge, y la razón es la variante más que el plugin. PermanentFreezeDelegate SÍ se puede descongelar mientras exista una autoridad de congelamiento; el badge está soldado porque esa autoridad se puso en None al momento del mint, y no existe ninguna clave que pudiera cambiarlo de vuelta alguna vez."  # @src=d37ee3cabd10
              b:
                # | The badge was welded at mint by setting the plugin's authority to None,
                # | so no key can thaw it.
                label: "El badge fue soldado al momento del mint poniendo la autoridad del plugin en None, así que ninguna clave puede descongelarlo."  # @src=017144303e6d
                # | The permanence lives in the authority arm, not in the plugin's name.
                # | Frozen plus a live authority is thawable; frozen plus None is frozen the
                # | way a number is even.
                feedback: "La permanencia vive en la variante de autoridad, no en el nombre del plugin. Congelado más una autoridad viva es descongelable; congelado más None está congelado del modo en que un número es par."  # @src=467483e59a66
              d:
                # | Since the badge is a collection member, the collection's authority
                # | usually resolves plugin control and can thaw it.
                label: "Como el badge es miembro de una colección, la autoridad de la colección normalmente resuelve el control del plugin y puede descongelarlo."  # @src=e28dd562c9c6
                # | Precedence decides which plugin config applies, never who may act on it.
                # | Each entry carries its own authority arm, and this one holds None, so
                # | the collection authority is as powerless as anyone else.
                feedback: "La precedencia decide qué config de plugin aplica, nunca quién puede actuar sobre ella. Cada entrada lleva su propia variante de autoridad, y esta tiene None, así que la autoridad de la colección es tan impotente como cualquier otro."  # @src=1a1ab5215693
              c:
                # | The badge can move once, because PermanentFreeze starts blocking only
                # | from the second transfer onward.
                label: "El badge puede moverse una vez, porque PermanentFreeze empieza a bloquear solo desde la segunda transferencia en adelante."  # @src=9d458cdc8015
                # | There's no one-free-transfer rule; PermanentFreeze blocks transfers
                # | outright from the moment it's applied.
                feedback: "No hay ninguna regla de una-transferencia-gratis; PermanentFreeze bloquea las transferencias de plano desde el momento en que se aplica."  # @src=f27c8d1c79a9
  m06-l3-token-metadata-legacy:
    # | Token Metadata as legacy: pNFTs and the royalty reality
    title: "Token Metadata como legado: pNFTs y la realidad de las regalías"  # @src=d6c9f7438015
    blocks:
      check:                      # quiz
        questions:
          m06-l3-token-metadata-legacy-q1:
            # | A marketplace lists a legacy NFT with seller_fee_basis_points = 500 and
            # | promises a 'guaranteed 5% royalty.' You decode its rule set and every
            # | operation is Pass. What's the accurate read?
            prompt: "Un marketplace lista un NFT legado con seller_fee_basis_points = 500 y promete una 'regalía garantizada del 5%'. Decodificas su rule set y cada operación es Pass. ¿Cuál es la lectura correcta?"  # @src=b3488399dff1
            # | For legacy Token Metadata, seller_fee_basis_points is indicative only.
            # | Enforcement would come from a Token Auth Rules RuleSet, but the flagship
            # | Metaplex Foundation Rule Set sets all operations to Pass: armed but idle.
            # | The royalty is a convention marketplaces may or may not honor, not an
            # | on-chain guarantee.
            explanation: "Para el Token Metadata legado, seller_fee_basis_points es solo indicativo. La imposición vendría de un RuleSet de Token Auth Rules, pero el emblemático Metaplex Foundation Rule Set pone todas las operaciones en Pass: armada pero inactiva. La regalía es una convención que los marketplaces pueden honrar o no, no una garantía on-chain."  # @src=ca81475303f8
            options:                 # source order — keep it
              a:
                # | The 5% is enforced on-chain, because seller_fee_basis_points is a
                # | protocol-level fee the runtime deducts at transfer.
                label: "El 5% se impone on-chain, porque seller_fee_basis_points es una comisión a nivel de protocolo que el runtime descuenta en la transferencia."  # @src=36e866bdc865
                # | The runtime never deducts seller_fee_basis_points; it's a metadata
                # | field, not a fee the protocol collects.
                feedback: "El runtime nunca descuenta seller_fee_basis_points; es un campo de metadatos, no una comisión que el protocolo recauda."  # @src=f5cda2f10959
              d:
                # | The 5% is enforced because Token Metadata reads seller_fee_basis_points
                # | on the pNFT transfer path before it refreezes; the rule set's Pass on
                # | each operation just approves the venue.
                label: "El 5% se impone porque Token Metadata lee seller_fee_basis_points en el camino de transferencia del pNFT antes de recongelar; el Pass del rule set en cada operación solo aprueba la plataforma."  # @src=808c7f1de059
                # | Token Metadata stores and serves that u16 and never spends it. Even in
                # | the enforcement era the rule set refused venues rather than collecting a
                # | fee.
                feedback: "Token Metadata almacena y sirve ese u16 y nunca lo gasta. Incluso en la era de la imposición, el rule set rechazaba plataformas en vez de recaudar una comisión."  # @src=bdfd0dab0969
              c:
                # | seller_fee_basis_points is purely indicative; with the flagship rule set
                # | passing every operation, nothing on-chain enforces the 5%, and
                # | marketplaces choose whether to honor it.
                label: "seller_fee_basis_points es puramente indicativo; con el rule set emblemático pasando cada operación, nada on-chain impone el 5%, y los marketplaces eligen si lo honran."  # @src=bc35edba1fab
                # | Armed but idle is the phrase to carry out: the freeze still forces the
                # | pNFT transfer path, and the rule waved through at the end of it collects
                # | nothing.
                feedback: "Armada pero inactiva es la frase para llevarte: el congelamiento sigue forzando el camino de transferencia del pNFT, y la regla que deja pasar todo al final de él no recauda nada."  # @src=cc7ebe35a43c
              b:
                # | The 5% is enforced only if the buyer opts in through their wallet's
                # | royalty-enforcement setting, which adds an extra instruction routing the
                # | fee to the creator list at purchase time.
                label: "El 5% se impone solo si el comprador opta por participar a través de la configuración de imposición de regalías de su billetera, que agrega una instrucción extra que rutea la comisión a la lista de creadores al momento de la compra."  # @src=be5ba3085a88
                # | There's no wallet opt-in mechanism that turns the field into
                # | enforcement; enforcement (when it happens) comes from a rule set, which
                # | here blocks nothing.
                feedback: "No hay ningún mecanismo de opt-in en la billetera que convierta el campo en imposición; la imposición (cuando ocurre) viene de un rule set, que aquí no bloquea nada."  # @src=0223e9002a4b
          m06-l3-token-metadata-legacy-q2:
            # | Your team needs to integrate an existing pNFT collection AND launch a new
            # | royalty-bearing drop. What's the right standards call?
            prompt: "Tu equipo necesita integrar una colección de pNFT existente Y lanzar un drop nuevo que lleva regalías. ¿Cuál es la llamada de estándares correcta?"  # @src=6c1f7b0f6a28
            # | The 2026 stance is asymmetric: Token Metadata is officially legacy, so you
            # | must read and integrate against the pNFTs already in the wild, but new-work
            # | royalties belong to Core plugins (what you built in m06-l2) or Bubblegum-v2
            # | rulesets (m07-l1). Legacy is a thing you consume, not a thing you newly
            # | ship.
            explanation: "La postura de 2026 es asimétrica: Token Metadata es oficialmente legado, así que tienes que leer e integrar contra los pNFTs que ya están sueltos por ahí, pero las regalías de trabajo nuevo les pertenecen a los plugins de Core (lo que construiste en m06-l2) o a los rulesets de Bubblegum v2 (m07-l1). El legado es algo que consumes, no algo que entregas nuevo."  # @src=7caeeaeba34a
            options:                 # source order — keep it
              d:
                # | Integrate the existing pNFT collection as is, and ship the new drop as
                # | plain Token Metadata NFTs, since that standard has the widest
                # | marketplace support.
                label: "Integra la colección de pNFT existente tal como está, y entrega el drop nuevo como NFTs Token Metadata simples, ya que ese estándar tiene el soporte de marketplace más amplio."  # @src=5ba751ed00b8
                # | Widest support is exactly what makes reading it mandatory and shipping
                # | into it optional. A plain TM drop also has no royalty machinery at all,
                # | which is what this drop was for.
                feedback: "El soporte más amplio es exactamente lo que hace que leerlo sea obligatorio y entregar en él sea opcional. Un drop TM simple además no tiene ninguna maquinaria de regalías, que era justo para lo que existía este drop."  # @src=3eeeea8923f2
              b:
                # | Mint the new drop as pNFTs too, so both collections sit on one standard
                # | and your integration code has a single path.
                label: "Acuña el drop nuevo como pNFTs también, para que las dos colecciones queden sobre un solo estándar y tu código de integración tenga un camino único."  # @src=3d692e669b64
                # | New pNFTs adopt a deprecated enforcement stack (Token Auth Rules) whose
                # | flagship rule enforces nothing; the course teaches TM/pNFT to evaluation
                # | depth precisely so you don't ship new ones.
                feedback: "Los pNFTs nuevos adoptan una pila de imposición deprecada (Token Auth Rules) cuya regla emblemática no impone nada; el curso enseña TM/pNFT a profundidad de evaluación precisamente para que no entregues nuevos."  # @src=22d45be6c7fc
              a:
                # | Read-and-integrate against the existing pNFTs (TM/pNFT is legacy but
                # | live), and ship the NEW drop on Core plugins or Bubblegum-v2 rulesets;
                # | don't mint new pNFTs.
                label: "Leer-e-integrar contra los pNFTs existentes (TM/pNFT es legado pero vivo), y entregar el drop NUEVO sobre plugins de Core o rulesets de Bubblegum v2; no acuñes pNFTs nuevos."  # @src=dfcef933c423
                # | Two different verbs for two different assets. Consuming a legacy
                # | standard costs you nothing; minting into it inherits an enforcement
                # | stack its own vendor walked away from.
                feedback: "Dos verbos distintos para dos activos distintos. Consumir un estándar legado no te cuesta nada; acuñar en él hereda una pila de imposición de la que su propio proveedor se alejó."  # @src=f295c70c0487
              c:
                # | Migrate the existing pNFTs to Core first so both collections share one
                # | standard, then ship everything as pNFTs for compatibility with the
                # | tooling most marketplaces already run.
                label: "Migra primero los pNFTs existentes a Core para que las dos colecciones compartan un estándar, y después entrega todo como pNFTs por compatibilidad con el herramental que ya corre la mayoría de los marketplaces."  # @src=b0a377b3ffc6
                # | This is self-contradictory and unnecessary: you integrate legacy assets
                # | as-is, and new work goes to Core/Bubblegum-v2. You don't convert to Core
                # | only to mint pNFTs.
                feedback: "Esto se contradice a sí mismo y es innecesario: los activos legados se integran tal como están, y el trabajo nuevo va a Core/Bubblegum v2. No conviertes a Core solo para acuñar pNFTs."  # @src=cc43b8a56d81
          m06-l3-token-metadata-legacy-q3:
            # | The docs page lists 5 TokenStandard variants; the code enum has 6 (it adds
            # | ProgrammableNonFungibleEdition). Which do you build your integration
            # | against, and why?
            prompt: "La página de docs lista 5 variantes de TokenStandard; el enum del código tiene 6 (agrega ProgrammableNonFungibleEdition). ¿Contra cuál construyes tu integración, y por qué?"  # @src=d33b6ca40520
            # | Token Metadata is in maintenance mode, so its docs page trails its source.
            # | The code enum carries 6 variants, adding ProgrammableNonFungibleEdition; an
            # | integration that only knows the documented 5 mishandles the sixth. When docs
            # | and code disagree on a legacy standard, the code is the truth you integrate
            # | against.
            explanation: "Token Metadata está en modo de mantenimiento, así que su página de docs va atrás de su fuente. El enum del código lleva 6 variantes, agregando ProgrammableNonFungibleEdition; una integración que solo conoce las 5 documentadas maneja mal la sexta. Cuando los docs y el código no coinciden sobre un estándar legado, el código es la verdad contra la que integras."  # @src=663a4f5db988
            options:                 # source order — keep it
              b:
                # | The code's 6 variants: for a legacy standard the docs lag the source,
                # | and an asset can carry the 6th (ProgrammableNonFungibleEdition) variant
                # | you'd otherwise fail to handle.
                label: "Las 6 variantes del código: para un estándar legado los docs van atrás del fuente, y un activo puede llevar la 6ª variante (ProgrammableNonFungibleEdition) que de otro modo no lograrías manejar."  # @src=45d3bf84e4fe
                # | Source is present tense, prose is the past tense of whenever someone
                # | last edited it. The variant that is missing from the page is the one
                # | that reaches your match statement in production.
                feedback: "El fuente es el tiempo presente, la prosa es el pasado de cuando alguien la editó por última vez. La variante que falta en la página es la que llega a tu match en producción."  # @src=a54861cdef89
              c:
                # | Neither: TokenStandard is deprecated along with the rest of the
                # | standard, so the field can be ignored entirely.
                label: "Ninguna de las dos: TokenStandard está deprecado junto con el resto del estándar, así que el campo se puede ignorar por completo."  # @src=26cb3ddec772
                # | You still have to read the variant to integrate legacy assets correctly;
                # | 'legacy' means you consume it, not that you can ignore its shape.
                feedback: "Igual tienes que leer la variante para integrar bien los activos legados; 'legado' significa que lo consumes, no que puedes ignorar su forma."  # @src=137a11c0ec64
              d:
                # | Against the code's 6 variants, then walk away: a legacy standard whose
                # | docs and source disagree is not safe for a production reader.
                label: "Contra las 6 variantes del código, y después aléjate: un estándar legado cuyos docs y fuente no coinciden no es seguro para un lector en producción."  # @src=ec755c67fc4e
                # | Drift is the normal condition of a maintenance-mode standard, not a red
                # | flag. Most NFTs on Solana live here, so a reader that refuses to read
                # | them is a product that cannot ship.
                feedback: "La deriva es la condición normal de un estándar en modo de mantenimiento, no una señal de alerta. La mayoría de los NFTs en Solana viven aquí, así que un lector que se niega a leerlos es un producto que no se puede entregar."  # @src=9ecb0e6ee4c3
              a:
                # | The docs' 5 variants, because the published page is the canonical
                # | contract that an integration is written against.
                label: "Las 5 variantes de los docs, porque la página publicada es el contrato canónico contra el que se escribe una integración."  # @src=9220849f8f43
                # | For a legacy, lightly-maintained standard the docs lag the code;
                # | building against 5 variants means an asset of the 6th variant surprises
                # | you at runtime.
                feedback: "Para un estándar legado y poco mantenido los docs van atrás del código; construir contra 5 variantes significa que un activo de la 6ª variante te sorprende en tiempo de ejecución."  # @src=bb7ae9c112b9
  m07-l1-bubblegum-v2-cnfts:
    # | Bubblegum v2: mint a million NFTs for the price of a laptop
    title: "Bubblegum v2: acuña un millón de NFTs por el precio de una laptop"  # @src=1ca6812381d7
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Your Harvest-crate cNFTs mint into the tree and their asset ids resolve. A
            # | teammate asks where a single crate's metadata actually lives on-chain.
            # | What's the accurate answer?
            prompt: "Tus cNFTs de crate Harvest se acuñan en el árbol y sus asset ids resuelven. Un compañero de equipo pregunta dónde viven en realidad on-chain los metadatos de un solo crate. ¿Cuál es la respuesta precisa?"  # @src=4d272530ec7d
            # | State compression stores only a hash of each asset as a leaf in an on-chain
            # | concurrent Merkle tree. The readable metadata lives in a DAS provider's
            # | index, which is exactly why the next lesson needs a DAS RPC to read a crate
            # | back.
            explanation: "La compresión de estado guarda solo un hash de cada activo como una hoja en un árbol de Merkle concurrente on-chain. Los metadatos legibles viven en el índice de un proveedor de DAS, que es exactamente por qué la próxima lección necesita un RPC con DAS para volver a leer un crate."  # @src=a65076b4d6af
            options:                 # source order — keep it
              a:
                # | The crate's data is hashed into a leaf of the Merkle tree; the full
                # | metadata is reconstructable only from an RPC provider's off-chain index,
                # | not from any account on-chain.
                label: "Los datos del crate se hashean en una hoja del árbol de Merkle; los metadatos completos son reconstruibles solo desde el índice off-chain de un proveedor de RPC, no desde ninguna cuenta on-chain."  # @src=a96fd315caf2
                # | Thirty-two bytes in a slot is the entire on-chain footprint. Everything
                # | a wallet renders was rebuilt by somebody who was watching when the mint
                # | landed.
                feedback: "Treinta y dos bytes en un slot son toda la huella on-chain. Todo lo que una billetera renderiza fue reconstruido por alguien que estaba mirando cuando el mint aterrizó."  # @src=28e6356a087f
              b:
                # | Each cNFT owns a 165-byte account holding its metadata, the same layout
                # | as a Token-2022 mint account.
                label: "Cada cNFT es dueño de una cuenta de 165 bytes que contiene sus metadatos, el mismo layout que una cuenta de mint de Token-2022."  # @src=db3c9250d1d4
                # | That's an SPL token account layout. Compression's whole point is that no
                # | per-asset account exists; only a leaf hash sits in the tree.
                feedback: "Ese es un layout de cuenta de token SPL. Todo el punto de la compresión es que no existe ninguna cuenta por activo; solo un hash de hoja se sienta en el árbol."  # @src=6110f6483d72
              c:
                # | The metadata is stored inside the Core collection account the tree
                # | belongs to, one record per member crate.
                label: "Los metadatos se guardan dentro de la cuenta de colección Core a la que pertenece el árbol, un registro por crate miembro."  # @src=c6feee96ce1d
                # | The Core collection verifies membership and holds collection-level
                # | plugins, but it does not store each cNFT's metadata; the leaf hash does.
                feedback: "La colección Core verifica la membresía y contiene plugins a nivel de colección, pero no guarda los metadatos de cada cNFT; el hash de hoja sí."  # @src=a48d15bb74ae
              d:
                # | The full metadata sits in the transaction logs the Noop program wrote at
                # | mint, so any RPC can replay that crate's mint against the tree and
                # | reconstruct it.
                label: "Los metadatos completos se sientan en los logs de transacción que el programa Noop escribió en el mint, así que cualquier RPC puede reproducir el mint de ese crate contra el árbol y reconstruirlo."  # @src=058b84a3cd64
                # | Those logs are why an indexer can rebuild the crate, and they are also
                # | why you need the indexer: logs are transaction output, not queryable
                # | state, and no RPC keeps them forever.
                feedback: "Esos logs son por qué un indexador puede reconstruir el crate, y también son por qué necesitas el indexador: los logs son salida de transacción, no estado consultable, y ningún RPC los guarda para siempre."  # @src=43bf17768f00
          q2:
            # | You need roughly one million Harvest crates. A colleague reads the vendor's
            # | ~8.5 SOL figure and budgets 8.5 SOL per crate. What should you tell them?
            prompt: "Necesitas como un millón de crates Harvest. Un colega lee la cifra de ~8.5 SOL del proveedor y presupuesta 8.5 SOL por crate. ¿Qué deberías decirle?"  # @src=3303c7c02b15
            # | Cost is a property of the tree's depth/buffer/canopy, derived once for the
            # | whole supply, not paid per asset. Vendor figures put ~1M cNFTs at ~8.5 SOL
            # | total and a 16,384-leaf tree at ~0.34 SOL; both were quoted at 6,960
            # | lamports/byte, and SIMD-0437 has since cut that rate, so derive the SOL from
            # | the byte count on your own cluster and treat the vendor number as a sanity
            # | check rather than a quote.
            explanation: "El costo es una propiedad de la profundidad/buffer/canopy del árbol, derivada una sola vez para todo el supply, no pagada por activo. Las cifras del proveedor ponen ~1M de cNFTs en ~8.5 SOL en total y un árbol de 16,384 hojas en ~0.34 SOL; las dos fueron cotizadas a 6,960 lamports/byte, y el SIMD-0437 ya recortó esa tasa desde entonces, así que deriva los SOL del conteo de bytes en tu propio cluster y toma el número del proveedor como un chequeo de cordura y no como una cotización."  # @src=76c253fdbee3
            options:                 # source order — keep it
              c:
                # | About 0.34 SOL flat, the fixed cost of any Bubblegum v2 tree regardless
                # | of depth.
                label: "Unos 0.34 SOL planos, el costo fijo de cualquier árbol Bubblegum v2 sin importar la profundidad."  # @src=e198c04e3fd2
                # | 0.34 SOL is the cost of a 16,384-leaf tree specifically; tree cost
                # | scales with depth, buffer, and canopy. It is not a flat fee.
                feedback: "0.34 SOL es el costo de un árbol de 16,384 hojas específicamente; el costo del árbol escala con la profundidad, el buffer y el canopy. No es una comisión plana."  # @src=3506f94e9a22
              a:
                # | 8.5 SOL per crate is right, because each compressed mint provisions its
                # | own full account.
                label: "8.5 SOL por crate es correcto, porque cada mint comprimido provisiona su propia cuenta completa."  # @src=511cc04f66da
                # | The vendor's 8.5 SOL is the total for ~1M cNFTs, not per-asset; each
                # | works out to a few millionths of a SOL.
                feedback: "Los 8.5 SOL del proveedor son el total para ~1M de cNFTs, no por activo; cada uno sale en unas pocas millonésimas de SOL."  # @src=7730e394d0ce
              b:
                # | Single-digit SOL for the whole tree of ~1M leaves, a few millionths of a
                # | SOL per cNFT.
                label: "SOL de un solo dígito para todo el árbol de ~1M de hojas, unas pocas millonésimas de SOL por cNFT."  # @src=8b54bafbfa76
                # | The per-crate figure is that one bill divided by the leaf count, which
                # | is why it falls as the tree fills rather than being charged again.
                feedback: "La cifra por crate es esa única factura dividida por el conteo de hojas, que es por qué cae a medida que el árbol se llena en vez de volver a cobrarse."  # @src=c1e317de09a1
              d:
                # | About 8.5 SOL for the tree, and then a few millionths of rent per crate
                # | as the leaves fill.
                label: "Unos 8.5 SOL para el árbol, y después unas pocas millonésimas de rent por crate a medida que las hojas se llenan."  # @src=9965cee9579b
                # | A leaf costs no rent at all: the tree account is the same size empty or
                # | full, which is the whole reason depth is nearly free and canopy is not.
                feedback: "Una hoja no cuesta ningún rent en absoluto: la cuenta del árbol es del mismo tamaño vacía o llena, que es toda la razón por la que la profundidad es casi gratis y el canopy no."  # @src=f44e98c0e635
          q3:
            # | You want the Founding-Farmer achievement crate to be non-transferable.
            # | Someone insists cNFTs can never be soulbound. What's the correct move in
            # | Bubblegum v2?
            prompt: "Quieres que el crate de logro Founding-Farmer sea no transferible. Alguien insiste en que los cNFTs nunca pueden ser soulbound. ¿Cuál es la jugada correcta en Bubblegum v2?"  # @src=b0d2950b2e1b
            # | Bubblegum v2's set_non_transferable_v2, combined with a
            # | PermanentFreezeDelegate on the Core collection, produces genuinely soulbound
            # | cNFTs, the reversal of 2024-era folklore that compression couldn't do freeze
            # | or soulbound.
            explanation: "El set_non_transferable_v2 de Bubblegum v2, combinado con un PermanentFreezeDelegate sobre la colección Core, produce cNFTs genuinamente soulbound, la reversión del folclore de la era 2024 de que la compresión no podía hacer congelamiento ni soulbound."  # @src=674fc76a5418
            options:                 # source order — keep it
              b:
                # | Move the crate into a V1 tree, which enforces immutability at the leaf
                # | level.
                label: "Mueve el crate a un árbol V1, que impone la inmutabilidad a nivel de hoja."  # @src=af1577162699
                # | V2 trees are not backward-compatible with V1 leaves, and immutability
                # | isn't a V1 feature; use set_non_transferable_v2 plus a collection
                # | PermanentFreezeDelegate.
                feedback: "Los árboles V2 no son retrocompatibles con las hojas V1, y la inmutabilidad no es una característica de V1; usa set_non_transferable_v2 más un PermanentFreezeDelegate de colección."  # @src=f9149c55edaa
              c:
                # | Use set_non_transferable_v2 (with a collection-level
                # | PermanentFreezeDelegate) to make the cNFT soulbound.
                label: "Usa set_non_transferable_v2 (con un PermanentFreezeDelegate a nivel de colección) para hacer el cNFT soulbound."  # @src=f3158d520f1d
                # | Soulbound is bit 2 of the v2 leaf's flags byte, and the collection's
                # | permanent freeze delegate is what authorizes the signer to set it.
                feedback: "Soulbound es el bit 2 del byte flags de la hoja v2, y el delegado de congelamiento permanente de la colección es lo que autoriza al firmante a ponerlo."  # @src=db8b0b297702
              d:
                # | Call freeze_v2 on the leaf, because freezing is how v2 spells soulbound
                # | and there is no separate flag for it.
                label: "Llama a freeze_v2 sobre la hoja, porque congelar es cómo v2 deletrea soulbound y no hay un flag aparte para eso."  # @src=ef529d186b75
                # | Freeze and non-transferable are different bits in the same flags byte,
                # | and freeze has a thaw_v2 to undo it. A frozen crate is parked, not
                # | welded.
                feedback: "Congelar y no transferible son bits distintos en el mismo byte flags, y el congelamiento tiene un thaw_v2 para deshacerlo. Un crate congelado está estacionado, no soldado."  # @src=656d804cca56
              a:
                # | They're right: mint a Token-2022 NonTransferable mint instead, because
                # | cNFTs are always freely transferable.
                label: "Tienen razón: acuña un mint NonTransferable de Token-2022 en su lugar, porque los cNFTs son siempre libremente transferibles."  # @src=a03b1592ccca
                # | That was true in the V1 era, but Bubblegum v2 added
                # | set_non_transferable_v2; a cNFT can be soulbound now.
                feedback: "Eso era verdad en la era V1, pero Bubblegum v2 agregó set_non_transferable_v2; un cNFT puede ser soulbound ahora."  # @src=56ef396cac0c
  m07-l2-reading-assets-das:
    # | Read anything: one DAS script for fungibles, Core assets, and cNFTs
    title: "Lee cualquier cosa: un solo script DAS para fungibles, activos Core y cNFTs"  # @src=89473fc3f4a3
    blocks:
      classify-das-asset:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The NFT interfaces include MplCoreAsset, MplBubblegumV2, V1_NFT,
          # | ProgrammableNFT; the fungible ones are FungibleAsset and FungibleToken.
          0: "Las interfaces de NFT incluyen MplCoreAsset, MplBubblegumV2, V1_NFT, ProgrammableNFT; las fungibles son FungibleAsset y FungibleToken."  # @src=994bdaaa7d5b
          # | compressed is asset.compression?.compressed === true, and a compressed NFT is
          # | the only case that requires a DAS RPC.
          1: "compressed es asset.compression?.compressed === true, y un NFT comprimido es el único caso que requiere un RPC de DAS."  # @src=2dc1c1ca50e9
          # | Price lives at asset.token_info?.price_info?.price_per_token; default it to
          # | null when absent.
          2: "El precio vive en asset.token_info?.price_info?.price_per_token; ponlo en null por defecto cuando no esté."  # @src=cd5a65dd77dd
        tests:                      # keyed by test case id
          t1:
            # | a Bubblegum v2 cNFT is a compressed NFT and can only be read via a DAS RPC
            description: "un cNFT de Bubblegum v2 es un NFT comprimido y solo se puede leer vía un RPC de DAS"  # @src=811fc5fc077f
          t2:
            # | a Metaplex Core asset is a plain NFT, no DAS-only requirement
            description: "un activo de Metaplex Core es un NFT común, sin requisito de solo-DAS"  # @src=01bc768f5b0a
          t3:
            # | a fungible token surfaces its price from token_info.price_info
            description: "un token fungible expone su precio desde token_info.price_info"  # @src=22ecbf2ec7ad
          t4:
            # | a legacy NFT still classifies as an NFT
            description: "un NFT legacy sigue clasificando como NFT"  # @src=57ee7a02efc8
          t5:
            # | a fungible asset with no price info returns a null price
            description: "un activo fungible sin price info devuelve un precio null"  # @src=2657624c8c1a
      check:                      # quiz
        questions:
          q1:
            # | read-any-asset.ts resolves SPROUT with getAccountInfo-equivalent ease, but
            # | the Harvest crate REQUIRED a DAS-supporting RPC. Why the asymmetry?
            prompt: "read-any-asset.ts resuelve SPROUT con la misma facilidad que getAccountInfo, pero el crate Harvest EXIGIÓ un RPC con soporte DAS. ¿Por qué la asimetría?"  # @src=a10a97ccf4dd
            # | A compressed NFT is only a leaf hash in a tree; its readable data lives in a
            # | DAS provider's index. Regular mints and Core assets are real accounts, so
            # | any RPC returns them; only cNFTs force a DAS RPC.
            explanation: "Un NFT comprimido es solo el hash de una hoja en un árbol; sus datos legibles viven en el índice de un proveedor de DAS. Los mints normales y los activos Core son cuentas reales, así que cualquier RPC los devuelve; solo los cNFTs obligan a usar un RPC de DAS."  # @src=3e64d67d5541
            options:                 # source order — keep it
              a:
                # | A cNFT has no on-chain account of its own: its data lives in the
                # | provider's index, so only a DAS RPC can reconstruct it; SPROUT's mint is
                # | a real account any RPC returns.
                label: "Un cNFT no tiene cuenta on-chain propia: sus datos viven en el índice del proveedor, así que solo un RPC de DAS puede reconstruirlo; el mint de SPROUT es una cuenta real que cualquier RPC devuelve."  # @src=5a2cc292dbab
                # | Storage decides the read path, which is why the classifier tracks
                # | compression.compressed rather than the interface name.
                feedback: "El almacenamiento decide el camino de lectura, que es la razón por la que el clasificador sigue compression.compressed y no el nombre de la interface."  # @src=eae719895268
              c:
                # | getAccountInfo is rate-limited for collectibles, so DAS is the only
                # | supported way to read any NFT at any real scale.
                label: "getAccountInfo tiene límite de rate para los coleccionables, así que DAS es la única forma soportada de leer cualquier NFT a una escala real."  # @src=e83be15e64ee
                # | It's not a rate-limit issue, and regular NFTs read fine without DAS; a
                # | cNFT simply has no standalone account to fetch.
                feedback: "No es un problema de límite de rate, y los NFTs normales se leen bien sin DAS; un cNFT simplemente no tiene una cuenta propia que traer."  # @src=6efa8500df3a
              b:
                # | DAS RPCs are required for any Token-2022 mint: the TLV extension records
                # | live in the provider's off-chain index rather than in the base 82-byte
                # | mint layout, so getAccountInfo cannot see them.
                label: "Los RPCs de DAS son obligatorios para cualquier mint de Token-2022: los registros de extensión TLV viven en el índice off-chain del proveedor y no en el layout base de 82 bytes del mint, así que getAccountInfo no puede verlos."  # @src=bc151fc2e221
                # | getAccountInfo returns a Token-2022 mint with its TLV extensions fine;
                # | the DAS requirement is specific to compressed assets, not extensions.
                feedback: "getAccountInfo devuelve bien un mint de Token-2022 con sus extensiones TLV; el requisito de DAS es específico de los activos comprimidos, no de las extensiones."  # @src=1776f1125616
              d:
                # | DAS is the NFT read path while getAccountInfo is the fungible one, so
                # | the crate needs a DAS provider and SPROUT does not.
                label: "DAS es el camino de lectura de NFT mientras que getAccountInfo es el de los fungibles, así que el crate necesita un proveedor de DAS y SPROUT no."  # @src=e77ba96e8128
                # | Your Almanac asset is an NFT and an ordinary account, read either way.
                # | The split is storage, not standard, which is why the flag is called
                # | compressed.
                feedback: "Tu activo Almanac es un NFT y una cuenta común, se lee de cualquiera de las dos formas. La división es de almacenamiento, no de estándar, que es la razón por la que el flag se llama compressed."  # @src=eea992e04da0
          q2:
            # | You point getAssetsByCreator at a pump.fun mint's creator and get an empty
            # | list, even though the token clearly exists and trades. What's happening, and
            # | the fix?
            prompt: "Apuntas getAssetsByCreator al creator de un mint de pump.fun y recibes una lista vacía, aunque el token claramente existe y se negocia. ¿Qué está pasando, y cuál es el arreglo?"  # @src=b8218e519f5f
            # | pump.fun leaves the Metaplex creators array unpopulated, so creator-keyed
            # | queries come back empty. The practitioner fix is to index by authority or
            # | subscribe to the program, a gotcha you only hit once.
            explanation: "pump.fun deja sin llenar el array de creators de Metaplex, así que las consultas que usan creator como clave vuelven vacías. El arreglo de quien trabaja en esto es indexar por authority o suscribirse al programa, una trampa en la que caes una sola vez."  # @src=871148e3d50b
            options:                 # source order — keep it
              d:
                # | The creators are present but unverified, so getAssetsByCreator returns
                # | an empty list; re-run it with the verified filter off.
                label: "Los creators están presentes pero sin verificar, así que getAssetsByCreator devuelve una lista vacía; vuelve a correrlo con el filtro de verificados apagado."  # @src=4b3e91099925
                # | There is no unverified entry hiding behind a filter. The array has zero
                # | entries, which the probe prints for you before any query goes out.
                feedback: "No hay ninguna entrada sin verificar escondida detrás de un filtro. El array tiene cero entradas, que es lo que la sonda te imprime antes de que salga cualquier consulta."  # @src=0da3744a709f
              b:
                # | pump.fun mints don't populate the Metaplex creators array, so the query
                # | has nothing to match; key on the update authority instead.
                label: "Los mints de pump.fun no llenan el array de creators de Metaplex, así que la consulta no tiene nada con qué hacer match; usa la autoridad de actualización como clave en su lugar."  # @src=1844930aa295
                # | The probe prints creators: 0 before it runs a single query, which is the
                # | whole diagnosis. Check that your assets populate a key before you build
                # | a feature on it.
                feedback: "La sonda imprime creators: 0 antes de correr una sola consulta, que es todo el diagnóstico. Revisa que tus activos llenen una clave antes de construir un feature encima."  # @src=291aae6012fa
              a:
                # | The mint is compressed, so creator-keyed queries never reach it; switch
                # | to getAssetProof, which is the read path for anything the index holds as
                # | a leaf.
                label: "El mint está comprimido, así que las consultas que usan creator como clave nunca lo alcanzan; cámbiate a getAssetProof, que es el camino de lectura para cualquier cosa que el índice guarde como hoja."  # @src=5f8557656d99
                # | It isn't about compression, and getAssetProof fetches a Merkle proof for
                # | a compressed asset, not owner/creator listings.
                feedback: "No se trata de compresión, y getAssetProof trae una prueba de Merkle para un activo comprimido, no listados de owner/creator."  # @src=a860dd658542
              c:
                # | DAS caches its creator indexes for up to 600 seconds, the same window
                # | that caches price_info, so wait for the refresh and retry the query.
                label: "DAS cachea sus índices de creator hasta por 600 segundos, la misma ventana que cachea price_info, así que espera el refresco y reintenta la consulta."  # @src=07fd7194b3f5
                # | The ~600s cache is the price_info TTL, not creator indexing; the
                # | creators array is genuinely empty for pump mints, so waiting changes
                # | nothing.
                feedback: "El cache de ~600s es el TTL de price_info, no la indexación de creators; el array de creators está genuinamente vacío para los mints de pump, así que esperar no cambia nada."  # @src=67b368f80592
          q3:
            # | Your dashboard needs SPROUT's live USD price next to holdings, and a
            # | teammate wants to bolt on a second price API. Given what read-any-asset.ts
            # | already does, the cheapest correct move is:
            prompt: "Tu dashboard necesita el precio en vivo de SPROUT en USD al lado de las tenencias, y un compañero de equipo quiere atornillar una segunda API de precios. Dado lo que read-any-asset.ts ya hace, la jugada correcta más barata es:"  # @src=c6f8e8c9d8be
            # | DAS is the fungible + price API too: getAsset with showFungible returns
            # | token_info.price_info for top tokens, including Token-2022 mints. Your
            # | reader already speaks DAS, so the price is one flag away; no second provider
            # | is needed.
            explanation: "DAS también es la API de fungibles + precios: getAsset con showFungible devuelve token_info.price_info para los tokens más grandes, incluidos los mints de Token-2022. Tu lector ya habla DAS, así que el precio está a un flag de distancia; no hace falta un segundo proveedor."  # @src=6f91d7b41e6c
            options:                 # source order — keep it
              c:
                # | Call getAsset with showFungible and read
                # | token_info.price_info.price_per_token; DAS serves it.
                label: "Llama a getAsset con showFungible y lee token_info.price_info.price_per_token; DAS lo sirve."  # @src=c3224d3cc41d
                # | One flag on a call your reader already makes. Render a dash when
                # | price_info is absent, because a token outside the priced slice is the
                # | normal case, not an error.
                feedback: "Un flag en una llamada que tu lector ya hace. Renderiza un guion cuando price_info no esté, porque un token fuera de la rebanada con precio es el caso normal, no un error."  # @src=50a03201a14e
              b:
                # | Call getAssetProof with showFungible so the returned proof carries a
                # | price attestation alongside the balance.
                label: "Llama a getAssetProof con showFungible para que la prueba devuelta lleve una atestación de precio junto al balance."  # @src=3ff674ed162d
                # | getAssetProof returns a Merkle proof for compressed assets; price comes
                # | from getAsset's showFungible, not from a proof call.
                feedback: "getAssetProof devuelve una prueba de Merkle para activos comprimidos; el precio viene del showFungible de getAsset, no de una llamada de prueba."  # @src=07a3b94a7eda
              a:
                # | Add a CoinGecko fetch keyed by mint address, since DAS covers NFTs and
                # | collections but leaves fungible pricing to market-data providers.
                label: "Agrega un fetch a CoinGecko con la dirección del mint como clave, ya que DAS cubre NFTs y colecciones pero le deja el precio de los fungibles a los proveedores de datos de mercado."  # @src=500a70baf6e4
                # | DAS did become the fungible + price API: getAsset with showFungible
                # | returns token_info.price_info for top tokens, so no second API is
                # | needed.
                feedback: "DAS sí se volvió la API de fungibles + precios: getAsset con showFungible devuelve token_info.price_info para los tokens más grandes, así que no hace falta una segunda API."  # @src=b987d54c1dc1
              d:
                # | Point the same getAsset call at devnet and read price_per_token: SPROUT
                # | already resolves there, so the price arrives too.
                label: "Apunta la misma llamada a getAsset a devnet y lee price_per_token: SPROUT ya resuelve ahí, así que el precio llega también."  # @src=4a4deb912e3b
                # | Resolving and being priced are different things. The priced set is a
                # | mainnet slice ranked by 24h volume, which is why the lab probes PYUSD on
                # | mainnet to see the field populated at all.
                feedback: "Resolver y tener precio son cosas distintas. El conjunto con precio es una rebanada de mainnet rankeada por volumen de 24h, que es la razón por la que el lab sondea PYUSD en mainnet para ver el campo poblado siquiera."  # @src=cbc3c3ead892
  m07-l3-zk-compression-frontier:
    # | ZK compression and the Light Token frontier: when NOT to compress
    title: "Compresión ZK y la frontera del Light Token: cuándo NO comprimir"  # @src=38eaefc8431e
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Overgrowth has to decide which of its state compresses. Select the three
            # | workload shapes this lesson rules out for compression.
            prompt: "Overgrowth tiene que decidir cuál de su estado se comprime. Selecciona las tres formas de carga de trabajo que esta lección descarta para compresión."  # @src=594ef6d4d8d4
            # | Two variables decide it: lifetime writes and bytes per access. Three shapes
            # | lose on them, and the lesson names each one: write-heavy accounts,
            # | same-block repeated updates, and accesses past roughly 1 KB. Holder count is
            # | not on that list, because a tree scales to holders happily, and tradeability
            # | is not either, because decompression is a first-class door. The shape that
            # | wins is state created once, written once or twice, and held by an enormous
            # | number of distinct owners.
            explanation: "Dos variables lo deciden: las escrituras de por vida y los bytes por acceso. Tres formas pierden con ellas, y la lección nombra cada una: cuentas con escritura pesada, actualizaciones repetidas en el mismo bloque, y accesos que superan más o menos 1 KB. El conteo de tenedores no está en esa lista, porque un árbol escala a tenedores sin problema, y la negociabilidad tampoco, porque la descompresión es una puerta de primera clase. La forma que gana es estado creado una vez, escrito una o dos veces, y en manos de una cantidad enorme de dueños distintos."  # @src=5ce6852ed7bf
            options:                 # source order — keep it
              c:
                # | Balances that must stay tradeable on a router like Jupiter, because a
                # | compressed balance cannot be decompressed back.
                label: "Balances que tienen que seguir siendo negociables en un router como Jupiter, porque un balance comprimido no se puede volver a descomprimir."  # @src=3164a555c4b3
                # | Decompression is first-class: you decompress, then you route. The round
                # | trip is the design, and it puts the cost on the holders who actually
                # | showed up.
                feedback: "La descompresión es de primera clase: descomprimes, después enrutas. El viaje de ida y vuelta es el diseño, y le pone el costo a los tenedores que de verdad aparecieron."  # @src=258b4d7385e2
              a:
                # | An in-game currency ledger debited on every craft, far past the
                # | few-hundred-lifetime-write band.
                label: "Un libro mayor de moneda del juego debitado en cada crafteo, mucho más allá de la banda de unos cientos de escrituras de por vida."  # @src=f4672227628f
                # | Write-heavy state is the first losing shape. Past the break-even the
                # | compressed path costs more lamports AND roughly 3,800 times the compute,
                # | forever.
                feedback: "El estado con escritura pesada es la primera forma perdedora. Pasado el break-even el camino comprimido cuesta más lamports Y unas 3,800 veces el cómputo, para siempre."  # @src=6542962b311a
              e:
                # | An AMM pool's state, rewritten several times inside one block by people
                # | who are not you.
                label: "El estado del pool de un AMM, reescrito varias veces dentro de un bloque por personas que no eres tú."  # @src=2424a9bcc70a
                # | The second losing shape, and it is worse than expensive. Every competing
                # | write moves the root, so your proof is stale before the transaction
                # | reaches the leader.
                feedback: "La segunda forma perdedora, y es peor que cara. Cada escritura competidora mueve la raíz, así que tu prueba ya está vieja antes de que la transacción llegue al leader."  # @src=f456de4a1194
              b:
                # | A holder list past ~16,384 wallets, since a state tree cannot hold more
                # | leaves than that.
                label: "Una lista de tenedores por encima de ~16,384 billeteras, porque un árbol de estado no puede guardar más hojas que eso."  # @src=ba180a774500
                # | Trees scale far past 16,384 (that's just one example size), and a tree
                # | scales to holders happily. Holder count is the axis people reach for and
                # | it is the wrong one.
                feedback: "Los árboles escalan mucho más allá de 16,384 (ese es solo un tamaño de ejemplo), y un árbol escala a tenedores sin problema. El conteo de tenedores es el eje al que la gente echa mano y es el equivocado."  # @src=a2e5c4df8491
              d:
                # | Balances a dashboard reads constantly, because each read has to pull a
                # | fresh 128-byte validity proof from Photon.
                label: "Balances que un dashboard lee constantemente, porque cada lectura tiene que sacar una prueba de validez fresca de 128 bytes desde Photon."  # @src=eb8c388b3f46
                # | The proof is a write-path artifact, there so the program can be
                # | convinced your leaf was in the tree. Reads are an index query, and
                # | reading a lot is what this rail is best at.
                feedback: "La prueba es un artefacto del camino de escritura, está ahí para que el programa pueda convencerse de que tu hoja estaba en el árbol. Las lecturas son una consulta al índice, y leer mucho es en lo que este riel es mejor."  # @src=3629609611ee
              f:
                # | A four-kilobyte recipe blob, well past the roughly
                # | one-kilobyte-per-access line the guidance draws.
                label: "Un blob de receta de cuatro kilobytes, mucho más allá de la línea de más o menos un kilobyte por acceso que dibuja la guía."  # @src=688416cdf889
                # | The third losing shape. Past about 1 KB per access the read and hashing
                # | cost of moving that blob through the machinery outweighs the rent you
                # | saved.
                feedback: "La tercera forma perdedora. Pasado más o menos 1 KB por acceso, el costo de leer y hashear ese blob a través de la maquinaria pesa más que el rent que ahorraste."  # @src=8b0bba8a4c9b
          q2:
            # | Contrast the proofs behind your Harvest-crate cNFTs with Light's
            # | ZK-compression proofs. What actually differs?
            prompt: "Contrasta las pruebas detrás de tus cNFTs de crate Harvest con las pruebas de compresión ZK de Light. ¿Qué difiere realmente?"  # @src=4dad02df4ae1
            # | Bubblegum is NFT-specific plain Merkle proofs whose length grows with depth
            # | (canopy trades rent for shorter client proofs). ZK compression generalizes
            # | to accounts/tokens/PDAs with constant 128-byte Groth16 validity proofs and a
            # | different hash function (not built on SPL account-compression).
            explanation: "Bubblegum son pruebas de Merkle simples específicas de NFT cuya longitud crece con la profundidad (el canopy cambia rent por pruebas más cortas para el cliente). La compresión ZK generaliza a cuentas/tokens/PDAs con pruebas de validez Groth16 constantes de 128 bytes y una función de hash distinta (no está construida sobre SPL account-compression)."  # @src=8988346718d5
            options:                 # source order — keep it
              a:
                # | Both rails verify every write with the same constant-size Groth16 proof;
                # | the only difference is scope, since Bubblegum limits its leaves to NFT
                # | metadata while Light generalizes to token accounts and PDAs.
                label: "Los dos rieles verifican cada escritura con la misma prueba Groth16 de tamaño constante; la única diferencia es el alcance, porque Bubblegum limita sus hojas a metadatos de NFT mientras que Light generaliza a cuentas de token y PDAs."  # @src=c2c0ffb65631
                # | Bubblegum uses plain Merkle proofs that GROW with tree depth; only ZK
                # | compression uses constant 128-byte validity proofs.
                feedback: "Bubblegum usa pruebas de Merkle simples que CRECEN con la profundidad del árbol; solo la compresión ZK usa pruebas de validez constantes de 128 bytes."  # @src=ab0a060586aa
              b:
                # | Bubblegum uses plain Merkle proofs that grow with tree depth; ZK
                # | compression uses constant 128-byte Groth16 validity proofs over
                # | generalized accounts.
                label: "Bubblegum usa pruebas de Merkle simples que crecen con la profundidad del árbol; la compresión ZK usa pruebas de validez Groth16 constantes de 128 bytes sobre cuentas generalizadas."  # @src=a5aa0d7c74da
                # | Size is the tell. A transcript gets thicker with the history it
                # | recounts; a succinct proof is a statement about the computation, so a
                # | deeper tree changes nothing.
                feedback: "El tamaño es la pista. Una transcripción se pone más gruesa con la historia que relata; una prueba sucinta es una afirmación sobre el cómputo, así que un árbol más profundo no cambia nada."  # @src=a61cd5b5f45f
              d:
                # | Bubblegum verifies its proofs on chain, while ZK compression trusts
                # | Photon's prover to verify them off chain, which is why they stay 128
                # | bytes.
                label: "Bubblegum verifica sus pruebas on-chain, mientras que la compresión ZK confía en que el prover de Photon las verifique off-chain, que es por lo que se quedan en 128 bytes."  # @src=de74ef0f56de
                # | The prover runs off chain and produces the proof; the program still
                # | checks it on chain. Constant size comes from succinctness, not from
                # | anybody being trusted.
                feedback: "El prover corre off-chain y produce la prueba; el programa igual la verifica on-chain. El tamaño constante viene de que la prueba es sucinta, no de que se confíe en nadie."  # @src=230abefef4f4
              c:
                # | Bubblegum stores full accounts on-chain while ZK compression stores only
                # | their hashes; the two proof formats are otherwise identical.
                label: "Bubblegum guarda cuentas completas on-chain mientras que la compresión ZK guarda solo sus hashes; los dos formatos de prueba son por lo demás idénticos."  # @src=6c65bdbcd84d
                # | Neither stores full per-asset accounts on-chain; both store hashes. The
                # | proof mechanism (growing Merkle vs constant validity) is the difference,
                # | not the storage model.
                feedback: "Ninguno guarda cuentas completas por activo on-chain; los dos guardan hashes. El mecanismo de prueba (Merkle que crece vs validez constante) es la diferencia, no el modelo de almacenamiento."  # @src=03931902b9ae
          q3:
            # | A teammate says 'let's ship Overgrowth's currency on the Light Token Program
            # | today; it's the new compressed-token default.' What's the accurate
            # | correction?
            prompt: "Un compañero dice 'lancemos hoy la moneda de Overgrowth sobre el Light Token Program; es el nuevo default de tokens comprimidos.' ¿Cuál es la corrección exacta?"  # @src=d97d28134948
            # | Hold the 'default flipped' framing up to the sources and it falls apart:
            # | Light Token runs on devnet only, publishes no hot-path CU figure, and no doc
            # | names it the default. The supported compressed-token rail remains current;
            # | Light Token is a promising direction, not today's production choice.
            explanation: "Pon el encuadre de 'el default cambió' contra las fuentes y se desarma: Light Token corre solo en devnet, no publica ninguna cifra de CU del hot path, y ningún doc lo nombra el default. El riel de tokens comprimidos soportado sigue siendo el actual; Light Token es una dirección prometedora, no la elección de producción de hoy."  # @src=260134c4d88e
            options:                 # source order — keep it
              b:
                # | Light Token is mainnet-live but scoped to distribution flows only (the
                # | Claim and WithdrawFundingPool primitives), so it's the right rail for
                # | the compost drop and nothing else.
                label: "Light Token está vivo en mainnet pero acotado solo a flujos de distribución (las primitivas Claim y WithdrawFundingPool), así que es el riel correcto para el compost drop y nada más."  # @src=b7ee5701f830
                # | It's devnet-only right now, and the airdrop-only framing is part of the
                # | same 'default flipped' story the sources don't support.
                feedback: "Ahora mismo es solo de devnet, y el encuadre de solo-airdrop es parte de la misma historia de 'el default cambió' que las fuentes no sostienen."  # @src=77a92ccd18e1
              c:
                # | Light Token is an emerging, devnet-only rail; the supported
                # | compressed-token path is still the current one. Treat it as a direction,
                # | not a default.
                label: "Light Token es un riel emergente y solo de devnet; el camino de tokens comprimidos soportado sigue siendo el actual. Trátalo como una dirección, no como un default."  # @src=83cc86d590fb
                # | The claim that decides architecture is whether the rail is supported on
                # | the cluster you ship on, and it has an owner: the protocol's docs and
                # | its own deployments, with a date beside them.
                feedback: "La afirmación que decide la arquitectura es si el riel está soportado en el cluster sobre el que lanzas, y tiene un dueño: los docs del protocolo y sus propios deployments, con una fecha al lado."  # @src=046e546a6898
              a:
                # | Correct: Light Token has replaced compressed tokens as the mainnet
                # | default, so start migrating the currency now.
                label: "Correcto: Light Token reemplazó a los tokens comprimidos como el default de mainnet, así que empieza a migrar la moneda ya."  # @src=09ff747f880c
                # | No doc positions Light Token as the default, and it isn't on mainnet;
                # | check the sources and this claim falls apart.
                feedback: "Ningún doc posiciona a Light Token como el default, y no está en mainnet; revisa las fuentes y esta afirmación se desarma."  # @src=7840e2a93322
              d:
                # | Not today, and the reason is compute: Light Token's Pinocchio hot path
                # | costs far more CU per transfer than the compressed-token program you
                # | would be migrating away from.
                label: "Hoy no, y la razón es el cómputo: el hot path en Pinocchio de Light Token cuesta muchas más CU por transferencia que el programa de tokens comprimidos del que estarías migrando."  # @src=23c3e61c8022
                # | Right verdict, invented evidence. No CU figure for that path is
                # | published anywhere, and a number with no source on a program this young
                # | is a number somebody made up.
                feedback: "Veredicto correcto, evidencia inventada. No hay ninguna cifra de CU para ese camino publicada en ninguna parte, y un número sin fuente en un programa así de joven es un número que alguien se inventó."  # @src=670abd73c601
  m08-l1-bonding-curves-graduation:
    # | Bonding curves & graduation: pump.fun from constants
    title: "Bonding curves & graduación: pump.fun a partir de constantes"  # @src=d6dd412875ab
    blocks:
      graduation-threshold:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | k = virtualSolReserves × virtualTokenReserves is held constant across the
          # | whole curve.
          0: "k = virtualSolReserves × virtualTokenReserves se mantiene constante a lo largo de toda la curva."  # @src=d2dd4196c62c
          # | Graduation drains the real reserve, so the final virtual token reserve is
          # | virtualTokenReserves − realTokenReserves.
          1: "La graduación drena la reserva real, así que la reserva virtual final de token es virtualTokenReserves − realTokenReserves."  # @src=c84a435f80ed
          # | SOL added = k / finalVirtualToken − virtualSolReserves.
          2: "SOL agregado = k / finalVirtualToken − virtualSolReserves."  # @src=52de63887b61
        tests:                      # keyed by test case id
          t1-pump-constants:
            # | pump.fun's first-party constants graduate at ~85 SOL, derived from the
            # | invariant: not the ~22 SOL the opening-price sum gives.
            description: "Las constantes de primera mano de pump.fun se gradúan a ~85 SOL, derivado del invariante: no los ~22 SOL que da la suma del precio de apertura."  # @src=ea542a670cf1
          t2-round-curve:
            # | 30*1000/(1000-800) - 30 = 120: draining 80% of the token reserve takes the
            # | SOL reserve from 30 to 150; the threshold is the 120 SOL added (4x the
            # | initial reserve).
            description: "30*1000/(1000-800) - 30 = 120: drenar el 80% de la reserva de token lleva la reserva de SOL de 30 a 150; el umbral son los 120 SOL agregados (4x la reserva inicial)."  # @src=46732d69d630
          t3-deeper-sol-reserve:
            # | A deeper starting SOL reserve raises the graduation cost proportionally
            # | along the same curve shape.
            description: "Una reserva de SOL inicial más profunda eleva el costo de graduación proporcionalmente a lo largo de la misma forma de curva."  # @src=71154e437b27
          t4-nothing-sellable:
            # | If no real tokens are sellable off the curve, zero SOL is needed to
            # | graduate: a sanity anchor the opening-price model also passes.
            description: "Si no hay tokens reales vendibles desde la curva, se necesita cero SOL para graduarse: un ancla de cordura que el modelo de precio de apertura también pasa."  # @src=36b4cc0cd492
      check:                      # quiz
        questions:
          m08l1-q1-where-85-lives:
            # | A teammate hardcodes const GRADUATION_SOL = 85 in the launch config.
            # | Reviewing it, which statement is correct?
            prompt: "Un compañero de equipo deja hardcoded const GRADUATION_SOL = 85 en la config de lanzamiento. Al revisarlo, ¿qué afirmación es correcta?"  # @src=73b8e02e5b26
            # | Graduation is the point where the real token reserve hits zero. The SOL
            # | required is fixed by k = virtualSol × virtualToken and the final virtual
            # | token reserve (virtualToken − realToken). Hardcoding 85 hides that
            # | dependency: change the constants and the number moves. Derive it, do not
            # | memorize it.
            explanation: "La graduación es el punto donde la reserva real de token llega a cero. El SOL requerido lo fija k = virtualSol × virtualToken y la reserva virtual final de token (virtualToken − realToken). Dejar hardcoded el 85 esconde esa dependencia: cambia las constantes y el número se mueve. Derívalo, no lo memorices."  # @src=2df57b0adaef
            options:                 # source order — keep it
              b:
                # | 85 SOL is derived from the invariant on the published reserves, and
                # | moves when they move.
                label: "Los 85 SOL se derivan del invariante sobre las reservas publicadas, y se mueven cuando ellas se mueven."  # @src=6bc26ee728ad
                # | Three constants and one invariant, and no 85 anywhere in the inputs.
                # | That is why the derivation survives a config change and a memorised
                # | number does not.
                feedback: "Tres constantes y un invariante, y ningún 85 en ninguna parte de las entradas. Por eso la derivación sobrevive a un cambio de config y un número memorizado no."  # @src=684fde4082c7
              c:
                # | 85 SOL is the flat 100-bps trading fee accumulated across every buy over
                # | the curve's whole lifetime.
                label: "Los 85 SOL son la comisión de trading plana de 100-bps acumulada a lo largo de cada compra durante toda la vida de la curva."  # @src=48c93cdbc711
                # | That conflates two unrelated quantities, trading fees and graduation
                # | liquidity. Fees route to recipients; graduation is about draining the
                # | real reserve.
                feedback: "Eso confunde dos cantidades sin relación, las comisiones de trading y la liquidez de graduación. Las comisiones se enrutan a destinatarios; la graduación es sobre drenar la reserva real."  # @src=db6308e19a7f
              a:
                # | 85 SOL is a graduation_target field stored in pump's BondingCurve
                # | account, read by the migrate instruction at graduation.
                label: "Los 85 SOL son un campo graduation_target guardado en la cuenta BondingCurve de pump, leído por la instrucción migrate en la graduación."  # @src=d7100992e468
                # | No such field exists; the curve stores reserves, not a graduation price.
                # | The threshold is implied by those reserves, not stored.
                feedback: "No existe tal campo; la curva guarda reservas, no un precio de graduación. El umbral está implícito en esas reservas, no guardado."  # @src=c93bdc1c6ded
              d:
                # | 85 SOL is the SOL equivalent of the market cap at which coins are
                # | observed to graduate, backed out from that observation.
                label: "Los 85 SOL son el equivalente en SOL de la capitalización de mercado a la que se observa que las monedas se gradúan, sacado de esa observación."  # @src=dce3e6425f24
                # | That gets you roughly the right number, which is what makes it
                # | dangerous. It measures a population of launches, so it silently absorbs
                # | whatever fee era and curve config those launches ran under.
                feedback: "Eso te da más o menos el número correcto, que es lo que lo vuelve peligroso. Mide una población de lanzamientos, así que absorbe en silencio cualquier era de comisiones y config de curva bajo la que corrieron esos lanzamientos."  # @src=a781f42b4069
          m08l1-q2-alter-reserves:
            # | You alter a curve so realTokenReserves is a LARGER fraction of
            # | virtualTokenReserves. What happens to the graduation threshold?
            prompt: "Alteras una curva para que realTokenReserves sea una fracción MÁS GRANDE de virtualTokenReserves. ¿Qué pasa con el umbral de graduación?"  # @src=a9df0bd755f0
            # | finalVirtualSol = k / (virtualToken − realToken). A larger realToken shrinks
            # | the denominator, so finalVirtualSol grows and the SOL added to graduate
            # | rises. This is exactly why a flat opening-price estimate is wrong: the curve
            # | steepens as the reserve drains.
            explanation: "finalVirtualSol = k / (virtualToken − realToken). Un realToken más grande encoge el denominador, así que finalVirtualSol crece y el SOL agregado para graduarse sube. Esto es exactamente por qué una estimación de precio de apertura plano está mal: la curva se empina a medida que la reserva se drena."  # @src=ef4f7e9fd99b
            options:                 # source order — keep it
              a:
                # | It falls, because a larger real reserve sells more of the supply at the
                # | cheap early prices near the curve's opening, shrinking the total SOL
                # | collected.
                label: "Baja, porque una reserva real más grande vende más del supply a los precios tempranos baratos cerca de la apertura de la curva, encogiendo el SOL total recaudado."  # @src=1c6c3b7b2bf1
                # | Early prices are cheap, but draining a larger fraction pushes further up
                # | the steepening curve; the final virtual SOL reserve rises, not falls.
                feedback: "Los precios tempranos son baratos, pero drenar una fracción más grande empuja más arriba en la curva que se empina; la reserva virtual final de SOL sube, no baja."  # @src=cd027f9a2203
              b:
                # | It stays 85 SOL; graduation is fixed by the program regardless of the
                # | virtual and real token reserve constants.
                label: "Se queda en 85 SOL; la graduación la fija el programa sin importar las constantes de reserva virtual y real de token."  # @src=ea01fe2c051d
                # | The threshold is a function of the constants, not a program-level
                # | constant; changing the reserves changes it.
                feedback: "El umbral es una función de las constantes, no una constante a nivel de programa; cambiar las reservas lo cambia."  # @src=ec4b9b2c5ada
              d:
                # | Unchanged unless total supply moves too, since the graduation threshold
                # | tracks the share of the token reserve the curve may sell.
                label: "Sin cambio a menos que total supply se mueva también, ya que el umbral de graduación sigue la porción de la reserva de token que la curva puede vender."  # @src=d448a8fc6737
                # | Total supply is the one published constant that never enters this
                # | arithmetic; it only prices the remainder the curve never offers. The
                # | threshold moves on the reserves alone.
                feedback: "Total supply es la única constante publicada que nunca entra en esta aritmética; solo le pone precio al sobrante que la curva nunca ofrece. El umbral se mueve por las reservas solamente."  # @src=a903bbba1961
              c:
                # | It rises: draining a larger fraction of the token reserve forces the
                # | final virtual SOL reserve higher.
                label: "Sube: drenar una fracción más grande de la reserva de token fuerza la reserva virtual final de SOL más arriba."  # @src=37d4b953a42a
                # | Run the worked variant: 30 virtual SOL, 1B virtual tokens, 800M real
                # | tokens gives 120 SOL. Same formula, a 41% higher bar, no folklore.
                feedback: "Corre la variante trabajada: 30 SOL virtuales, 1B de tokens virtuales, 800M de tokens reales da 120 SOL. Misma fórmula, una vara 41% más alta, nada de folclore."  # @src=3467abbf6184
          m08l1-q3-migrate-twice:
            # | A pump.fun coin's complete flag flips and two bots both call migrate on the
            # | same curve. What is the outcome?
            prompt: "La flag complete de una moneda de pump.fun se da vuelta y dos bots llaman, los dos, a migrate en la misma curva. ¿Cuál es el resultado?"  # @src=090627f0a7a8
            # | pump's migrate is permissionless and idempotent: liquidity moves to PumpSwap
            # | and the LP is burnt, and any subsequent call is a no-op.
            # | Permissionless-plus-idempotent is the safe design for a step anyone might
            # | race to trigger.
            explanation: "El migrate de pump es sin permiso e idempotente: la liquidez se mueve a PumpSwap y el LP se quema, y cualquier llamada posterior es un no-op. Sin-permiso-más-idempotente es el diseño seguro para un paso que cualquiera podría correr a disparar."  # @src=b26a1e561654
            options:                 # source order — keep it
              b:
                # | The second call double-mints LP and drains whatever the curve still
                # | holds into the racer's wallet.
                label: "La segunda llamada acuña LP dos veces y drena lo que la curva todavía sostiene hacia la billetera del que corrió la carrera."  # @src=4689d81e4d80
                # | Idempotency exists precisely to prevent this: once migrated, a repeat
                # | call changes nothing.
                feedback: "La idempotencia existe precisamente para evitar esto: una vez migrada, una llamada repetida no cambia nada."  # @src=7ac1fea1c123
              c:
                # | migrate requires the creator's signature, so the second bot's call
                # | reverts for lack of authority.
                label: "migrate requiere la firma del creador, así que la llamada del segundo bot revierte por falta de autoridad."  # @src=3c7264b83eb4
                # | migrate is permissionless (anyone can call it); that is why it must be
                # | idempotent rather than authority-gated.
                feedback: "migrate es sin permiso (cualquiera puede llamarlo); por eso tiene que ser idempotente en vez de estar restringido a una autoridad."  # @src=e78a4c1a15e0
              a:
                # | migrate is permissionless and idempotent, so the second call is simply a
                # | no-op.
                label: "migrate es sin permiso e idempotente, así que la segunda llamada es simplemente un no-op."  # @src=bfc2ef5c685a
                # | Liquidity is already on PumpSwap with the LP burnt. Permissionless plus
                # | idempotent is the pair: either property alone turns the race into dead
                # | liquidity or into an exploit.
                feedback: "La liquidez ya está en PumpSwap con el LP quemado. Sin permiso más idempotente es el par: cualquiera de las dos propiedades sola convierte la carrera en liquidez muerta o en un exploit."  # @src=72aa9c8384e1
              d:
                # | The second call lands too and pays the 15,000,001-lamport fee again,
                # | since that fee is a program constant.
                label: "La segunda llamada también llega y paga otra vez la comisión de 15,000,001 lamports, ya que esa comisión es una constante del programa."  # @src=bc6f245911d9
                # | Two things off. Only the first migration does any work, and
                # | pool_migration_fee is a Global field an authority can rewrite rather
                # | than a constant.
                feedback: "Dos cosas mal. Solo la primera migración hace algún trabajo, y pool_migration_fee es un campo Global que una autoridad puede reescribir y no una constante."  # @src=c7fa6a3bc2ba
          m08l1-q4-opening-price-bug:
            # | A first attempt prices every real token at the curve's OPENING spot price
            # | and sums them, getting ~22 SOL instead of ~85. Why is it wrong?
            prompt: "Un primer intento le pone a cada token real el precio spot de APERTURA de la curva y los suma, y saca ~22 SOL en vez de ~85. ¿Por qué está mal?"  # @src=9d19c3fe820f
            # | A constant-product curve steepens as you drain it: each successive token
            # | costs more SOL than the last. Pricing all real tokens at the opening price
            # | treats the curve as flat and badly under-counts. The invariant integrates
            # | that steepening for you, which is the whole point of deriving from k rather
            # | than eyeballing a price.
            explanation: "Una curva de producto constante se empina a medida que la drenas: cada token sucesivo cuesta más SOL que el anterior. Ponerle a todos los tokens reales el precio de apertura trata la curva como plana y subestima por mucho. El invariante integra ese empinamiento por ti, que es todo el punto de derivar a partir de k en vez de estimar un precio a ojo."  # @src=f351d9a34c64
            options:                 # source order — keep it
              a:
                # | It forgot to add pump's 100-bps trading fee, which compounds across
                # | every buy on the way up the curve and accounts for the missing SOL.
                label: "Se olvidó de sumar la comisión de trading de 100-bps de pump, que se compone a lo largo de cada compra en el camino de subida de la curva y explica el SOL que falta."  # @src=4e8a44fe8999
                # | The gap is ~63 SOL, far larger than any fee. The error is structural,
                # | not a missing fee.
                feedback: "La brecha es de ~63 SOL, mucho más grande que cualquier comisión. El error es estructural, no una comisión que falta."  # @src=d8d292ab1e71
              b:
                # | The opening price is the cheapest point on the curve; price rises as the
                # | token reserve shrinks, so a flat-price sum under-counts.
                label: "El precio de apertura es el punto más barato de la curva; el precio sube a medida que la reserva de token encoge, así que una suma de precio plano subestima."  # @src=140b571aa9fa
                # | Pricing 793 million tokens at the opening rate is pricing a flight of
                # | stairs at the height of the first step. The curve steepens as it drains,
                # | by 14.7 times end to end.
                feedback: "Ponerle precio a 793 millones de tokens a la tarifa de apertura es ponerle precio a un tramo de escaleras a la altura del primer escalón. La curva se empina a medida que se drena, 14.7 veces de punta a punta."  # @src=8ee766d3c833
              d:
                # | It should have priced the tokens at the average of the opening and
                # | graduation prices, which is the mean price actually paid on the curve.
                label: "Debería haberle puesto a los tokens el promedio de los precios de apertura y de graduación, que es el precio medio realmente pagado en la curva."  # @src=280a86d2298f
                # | Averaging the endpoints at least admits the curve moves, and it still
                # | fails: a constant-product curve is a hyperbola, so the arithmetic mean
                # | of its endpoints is not the mean price paid.
                feedback: "Promediar los extremos al menos admite que la curva se mueve, y sigue fallando: una curva de producto constante es una hipérbola, así que la media aritmética de sus extremos no es el precio medio pagado."  # @src=52c4c693f11c
              c:
                # | It used lamports where it should have used SOL, so the sum comes out off
                # | by a factor of a billion.
                label: "Usó lamports donde debería haber usado SOL, así que la suma sale desviada por un factor de mil millones."  # @src=5fb2b8909520
                # | A unit error would be off by 10^9, not a factor of ~4; the shape of the
                # | curve is what's ignored.
                feedback: "Un error de unidades estaría desviado por 10^9, no por un factor de ~4; la forma de la curva es lo que se ignora."  # @src=d45fa9c86dca
  m08-l2-launchpad-landscape:
    # | The launchpad landscape, anti-snipe & what graduation seeds
    title: "El panorama de los launchpads, anti-snipe y lo que siembra la graduación"  # @src=e7b2866ef01a
    blocks:
      check:                      # quiz
        questions:
          m08l2-q1-platform-pda:
            # | You notice LetsBonk transactions and LaunchLab transactions hit the same
            # | program id. What does that tell you?
            prompt: "Notas que las transacciones de LetsBonk y las transacciones de LaunchLab pegan en el mismo program id. ¿Qué te dice eso?"  # @src=4643b5ed77f4
            # | LaunchLab exposes a Platform PDA so anyone can run a branded front-end and
            # | fee split on the shared program. LetsBonk is one such skin. Recognizing this
            # | collapses several 'competing' launchpads into one curve with resellers, and
            # | it tells you their mechanics and graduation AMM are LaunchLab's.
            explanation: "LaunchLab expone una Platform PDA para que cualquiera pueda correr un frontend de marca y un reparto de comisiones sobre el programa compartido. LetsBonk es uno de esos skins. Reconocer esto colapsa varios launchpads 'competidores' en una sola curva con revendedores, y te dice que su mecánica y su AMM de graduación son los de LaunchLab."  # @src=a64269e84bdf
            options:                 # source order — keep it
              d:
                # | One of them is a thin wrapper program that CPIs into the other, which is
                # | why the same id shows up in both transactions.
                label: "Uno de ellos es un programa wrapper delgado que hace CPI hacia el otro, que es por lo que el mismo id aparece en las dos transacciones."  # @src=da7cc7f24e6e
                # | A wrapper would be its own program id invoking a second one, and you
                # | would see two. The probe returned one 32-byte key for both names, which
                # | is identity rather than delegation.
                feedback: "Un wrapper sería su propio program id invocando a un segundo, y verías dos. El sondeo devolvió una sola clave de 32 bytes para los dos nombres, que es identidad y no delegación."  # @src=03f03cf8864f
              c:
                # | LaunchLab's Platform PDA lets third parties run branded launchpads on
                # | the same program with their own fee structure.
                label: "La Platform PDA de LaunchLab les deja a terceros correr launchpads de marca sobre el mismo programa con su propia estructura de comisiones."  # @src=b74a57bb0c86
                # | One kitchen, several signs. The franchisee sets the branding and the
                # | till; what they cannot change is the fryer, which here means the curve
                # | and the graduation AMM.
                feedback: "Una cocina, varios carteles. El franquiciado fija la marca y la caja; lo que no puede cambiar es la freidora, que aquí quiere decir la curva y el AMM de graduación."  # @src=381f6a352f58
              a:
                # | LetsBonk forked LaunchLab's open-source code and redeployed it under its
                # | own upgrade authority, keeping the instruction layout byte-compatible.
                label: "LetsBonk hizo un fork del código abierto de LaunchLab y lo volvió a desplegar bajo su propia autoridad de upgrade, manteniendo el layout de instrucciones compatible byte a byte."  # @src=015a48c8d19a
                # | A fork would deploy at a different program id; sharing the id means they
                # | share the program, not the source.
                feedback: "Un fork se desplegaría en un program id distinto; compartir el id quiere decir que comparten el programa, no el código fuente."  # @src=4a86e169bb5b
              b:
                # | It is a coincidence of vanity addresses, since the two teams happened to
                # | grind for similar-looking prefixes.
                label: "Es una coincidencia de direcciones vanity, ya que a los dos equipos les tocó buscar por fuerza bruta prefijos de aspecto parecido."  # @src=8a1b1b1adf85
                # | Program ids are exact 32-byte keys: a shared id is identity, not
                # | resemblance.
                feedback: "Los program ids son claves exactas de 32 bytes: un id compartido es identidad, no parecido."  # @src=30b3cc05ab89
          m08l2-q2-docs-vs-code:
            # | Meteora DBC's docs say the curve supports up to 16 segments; the on-chain
            # | config struct says up to 20. You are building against DBC. Which do you
            # | trust?
            prompt: "Los docs de Meteora DBC dicen que la curva soporta hasta 16 segmentos; el struct de config on-chain dice que hasta 20. Estás construyendo contra DBC. ¿En cuál confías?"  # @src=57a6b29b9349
            # | Read the source, and read enough of it to know which constant governs which
            # | surface: constants.rs declares MAX_CURVE_POINT = 16 with a const_assert
            # | pinning it under MAX_CURVE_POINT_CONFIG = 20. Trust only the docs and you
            # | mis-size a deserializer against the 20-slot array; trust only the struct
            # | width and you pass 20 points into an instruction that validates 16. Same
            # | habit that produced the extension conflict matrix — and the exact numbers
            # | get re-verified at write time.
            explanation: "Lee el código fuente, y lee lo suficiente para saber qué constante gobierna qué superficie: constants.rs declara MAX_CURVE_POINT = 16 con un const_assert que lo fija por debajo de MAX_CURVE_POINT_CONFIG = 20. Confía solo en los docs y dimensionas mal un deserializador contra el array de 20 slots; confía solo en el ancho del struct y pasas 20 puntos a una instrucción que valida 16. El mismo hábito que produjo la matriz de conflictos de extensiones — y los números exactos se vuelven a verificar en el momento de escritura."  # @src=372ed52393da
            options:                 # source order — keep it
              b:
                # | The docs' 16 segments, because published documentation is the interface
                # | contract integrators are entitled to rely on when the source disagrees.
                label: "Los 16 segmentos de los docs, porque la documentación publicada es el contrato de interfaz en el que los integradores tienen derecho a confiar cuando el código fuente no coincide."  # @src=b3bcd2366849
                # | The 16 happens to match the validated cap, but 'trust the docs' is the
                # | wrong habit and misses the second constant: the account still reserves
                # | 20 slots, and a deserializer sized to 16 mis-reads the layout.
                feedback: "El 16 casualmente coincide con el tope validado, pero 'confía en los docs' es el hábito equivocado y se pierde la segunda constante: la cuenta igual reserva 20 slots, y un deserializador dimensionado a 16 lee mal el layout."  # @src=20f813d63621
              c:
                # | Neither, because DBC runs one constant-product curve like pump.fun, so
                # | both segment counts describe a feature the venue does not have.
                label: "Ninguno, porque DBC corre una sola curva de producto constante como pump.fun, así que los dos conteos de segmentos describen una feature que la plataforma no tiene."  # @src=316a36ba36ef
                # | DBC is explicitly piecewise over multiple (sqrt_price, liquidity)
                # | segments; that flexibility is its whole pitch.
                feedback: "DBC es explícitamente por tramos sobre múltiples segmentos (sqrt_price, liquidity); esa flexibilidad es todo su argumento de venta."  # @src=3f5b9594c3d4
              d:
                # | The struct's 20 slots, because on a live protocol the source usually
                # | beats the docs, so size the curve you submit to the array the account
                # | reserves.
                label: "Los 20 slots del struct, porque en un protocolo vivo el código fuente normalmente le gana a los docs, así que dimensiona la curva que envías al array que reserva la cuenta."  # @src=b3aefc60f817
                # | Right instinct, wrong constant. Reading the source is the habit; reading
                # | enough of it to see which constant guards which surface is the skill,
                # | and twenty points is what the instruction rejects.
                feedback: "Instinto correcto, constante equivocada. Leer el código fuente es el hábito; leer lo suficiente para ver qué constante resguarda qué superficie es la habilidad, y veinte puntos es lo que la instrucción rechaza."  # @src=18528ac0eb65
              a:
                # | Both, because they govern different surfaces: MAX_CURVE_POINT = 16 caps
                # | the curve an instruction will validate, while the 20-slot array is
                # | account-layout headroom your deserializer must size for; re-verify both
                # | at write time.
                label: "Los dos, porque gobiernan superficies distintas: MAX_CURVE_POINT = 16 le pone techo a la curva que una instrucción va a validar, mientras que el array de 20 slots es margen del layout de la cuenta para el que tu deserializador debe dimensionar; vuelve a verificar los dos en el momento de escritura."  # @src=cd94f347b112
                # | The const_assert between the two constants is the giveaway: the source
                # | itself declares one a ceiling under the other, so each number governs a
                # | different surface.
                feedback: "El const_assert entre las dos constantes es lo que lo delata: el propio código fuente declara una como techo por debajo de la otra, así que cada número gobierna una superficie distinta."  # @src=d2020309597d
          m08l2-q3-venue-rejects-extension:
            # | SPROUT carries a TransferHook extension. You choose a graduation AMM whose
            # | allowlist rejects hooks. What happens, and what is the fix?
            prompt: "SPROUT lleva una extensión TransferHook. Eliges un AMM de graduación cuya allowlist rechaza los hooks. ¿Qué pasa, y cuál es el arreglo?"  # @src=0b9736e7fd29
            # | The routable extension set from R6 is not advisory: it decides which
            # | graduation AMMs are legal. A hook-bearing SPROUT reverts on Raydium's
            # | allowlist but has a documented path on Meteora DBC, whose docs describe
            # | transfer-hook base tokens — a claim the lesson filed as
            # | documented-but-unverified, so verify it before you launch on it. Choose the
            # | venue to match the token, or change the token.
            explanation: "El conjunto de extensiones enrutable de R6 no es un consejo: decide qué AMMs de graduación son legales. Un SPROUT con hook revierte contra la allowlist de Raydium pero tiene un camino documentado en Meteora DBC, cuyos docs describen tokens base con transfer hook — una afirmación que la lección archivó como documentada-pero-sin-verificar, así que verifícala antes de lanzar ahí. Elige la plataforma para que calce con el token, o cambia el token."  # @src=1fefb07f38db
            options:                 # source order — keep it
              c:
                # | The launchpad automatically strips the TransferHook extension from the
                # | mint during migration so the graduation pool can be created without it.
                label: "El launchpad quita automáticamente la extensión TransferHook del mint durante la migración para que el pool de graduación se pueda crear sin ella."  # @src=6feb736432bd
                # | A launchpad cannot remove a mint-level extension: extensions are fixed
                # | at mint creation. The venue must accept it or you must not ship it.
                feedback: "Un launchpad no puede quitar una extensión de nivel mint: las extensiones quedan fijadas en la creación del mint. La plataforma debe aceptarla o tú no debes entregarla."  # @src=a50f49a154fb
              d:
                # | Pool creation succeeds because allowlists are additive: the AMM accepts
                # | the extensions it knows and ignores the rest.
                label: "La creación del pool tiene éxito porque las allowlists son aditivas: el AMM acepta las extensiones que conoce e ignora el resto."  # @src=aef3db845c49
                # | An allowlist is a whitelist, not a preference list. One off-list
                # | extension is enough to refuse the mint, which is the same shape the
                # | airdrop tool's supported-extension table has.
                feedback: "Una allowlist es una whitelist, no una lista de preferencias. Una sola extensión fuera de la lista basta para rechazar el mint, que es la misma forma que tiene la tabla de extensiones soportadas de la herramienta de airdrop."  # @src=5d7573f13637
              a:
                # | The token graduates fine, because an AMM ignores any mint extension it
                # | does not recognize.
                label: "El token se gradúa sin problema, porque un AMM ignora cualquier extensión de mint que no reconozca."  # @src=fd1656e30494
                # | The allowlist reverts pool creation on any off-list extension; it does
                # | not silently ignore it.
                feedback: "La allowlist revierte la creación del pool ante cualquier extensión fuera de la lista; no la ignora en silencio."  # @src=6cbe388a0fb6
              b:
                # | Pool creation reverts on the off-allowlist extension; pick a venue that
                # | accepts your set.
                label: "La creación del pool revierte ante la extensión fuera de la allowlist; elige una plataforma que acepte tu conjunto."  # @src=2f1618d21436
                # | The curve was never the risk; the last instruction was. Two fixes and no
                # | third: match the venue to the token, or drop the extension so the token
                # | matches the venue.
                feedback: "La curva nunca fue el riesgo; la última instrucción sí. Dos arreglos y no hay un tercero: haz que la plataforma calce con el token, o quita la extensión para que el token calce con la plataforma."  # @src=5e57336c5a08
  m08-l3-airdrops-at-scale:
    # | Airdrops at scale: cost engineering & vesting claims
    title: "Airdrops a escala: ingeniería de costos y reclamos con vesting"  # @src=7a626a952cd8
    blocks:
      check:                      # quiz
        questions:
          m08l3-q1-100k-cost:
            # | Your cost table shows classic ATAs at ≈186 SOL for 100,000 recipients (293
            # | bytes each at mainnet's 6,333 lamports/byte, read 2026-09-06). What is the
            # | compressed figure and the saving?
            prompt: "Tu tabla de costos muestra las ATA clásicas a ≈186 SOL para 100,000 destinatarios (293 bytes cada una a los 6,333 lamports/byte de mainnet, leídos el 2026-09-06). ¿Cuál es la cifra comprimida y el ahorro?"  # @src=dd1bc972c45c
            # | Per recipient: a classic ATA is 293 bytes of rent, ≈1,855,569 lamports at
            # | mainnet's current per-byte rate; a compressed recipient ≈10,300, which is
            # | not rent and does not move with the rent schedule. At 100k that is ≈186 SOL
            # | vs ≈1.03 SOL, a ~99.4% cut. The exact percentage drifts as SIMD-0437 steps
            # | rent down — it was 99.5% at the old 6,960 rate — which is precisely why
            # | doing this arithmetic live, rather than quoting it, is what makes a mass
            # | airdrop a budget line rather than a fantasy.
            explanation: "Por destinatario: una ATA clásica son 293 bytes de rent, ≈1,855,569 lamports a la tasa por byte actual de mainnet; un destinatario comprimido ≈10,300, que no es rent y no se mueve con el esquema de renta. Con 100k eso es ≈186 SOL contra ≈1.03 SOL, un recorte de ~99.4%. El porcentaje exacto se corre a medida que el SIMD-0437 baja el rent por escalones — era 99.5% a la vieja tasa de 6,960 — que es precisamente por qué hacer esta aritmética en vivo, en vez de citarla, es lo que convierte un airdrop masivo en una línea de presupuesto y no en una fantasía."  # @src=6dd6a4c9cae3
            options:                 # source order — keep it
              a:
                # | ≈20 SOL and about 90% saved, on ≈200,000 lamports per recipient.
                label: "≈20 SOL y alrededor de 90% ahorrado, sobre ≈200,000 lamports por destinatario."  # @src=fce8ec1e0f3b
                # | 20 SOL is roughly the CLASSIC 10k-recipient figure; you are off by a
                # | method and a scale. Compressed is far cheaper.
                feedback: "20 SOL es más o menos la cifra CLÁSICA de 10k destinatarios; te equivocaste por un método y una escala. Lo comprimido es mucho más barato."  # @src=b0848af4aed4
              e:
                # | ≈186 SOL either way, because each recipient still needs an account
                # | created before any tokens can land.
                label: "≈186 SOL en cualquier caso, porque a cada destinatario igual hay que crearle una cuenta antes de que puedan aterrizar tokens."  # @src=d42c38b5ce64
                # | There is no account to create: a compressed recipient is a hash in a
                # | state tree, which is exactly where the 180x comes from.
                feedback: "No hay cuenta que crear: un destinatario comprimido es un hash en un árbol de estado, que es exactamente de donde viene el 180x."  # @src=3d6b5d696d8a
              c:
                # | ≈1.03 SOL, well over 99% saved (≈10,300 lamports/recipient vs ≈1.86M).
                label: "≈1.03 SOL, bastante más del 99% ahorrado (≈10,300 lamports/destinatario contra ≈1.86M)."  # @src=64ba972d7aea
                # | Bytes times a rate you looked up, against a state cost that is not rent
                # | at all. Recompute the classic side whenever the rate steps; the
                # | compressed side stays put.
                feedback: "Bytes por una tasa que buscaste, contra un costo de estado que no es rent en absoluto. Recalcula el lado clásico cada vez que la tasa dé un escalón; el lado comprimido se queda donde está."  # @src=7ed8f1d415c9
              d:
                # | ≈1.03 SOL today, and the compressed side falls with the rent schedule
                # | the same way the classic side does.
                label: "≈1.03 SOL hoy, y el lado comprimido baja con el esquema de renta igual que el lado clásico."  # @src=5b95d817974b
                # | Right total, wrong mechanism. A compressed recipient pays state cost,
                # | not rent, so SIMD-0437 moves only the classic column and the saving
                # | percentage drifts with it.
                feedback: "Total correcto, mecanismo equivocado. Un destinatario comprimido paga costo de estado, no rent, así que el SIMD-0437 mueve solo la columna clásica y el porcentaje de ahorro se corre con ella."  # @src=aebb08d7842c
              b:
                # | ≈10.3 SOL, about 95% saved, since compressed state still pays roughly a
                # | tenth of classic rent per recipient.
                label: "≈10.3 SOL, alrededor de 95% ahorrado, ya que el estado comprimido todavía paga más o menos una décima parte del rent clásico por destinatario."  # @src=5f5e4d7f67e6
                # | 10.3 SOL is the per-1M compressed extrapolation, not the 100k figure. At
                # | 100k it is ten times less.
                feedback: "10.3 SOL es la extrapolación comprimida por 1M, no la cifra de 100k. Con 100k es diez veces menos."  # @src=df83025a4477
          m08l3-q2-airship-discrepancy:
            # | AirShip's marketing says a 10k-recipient drop costs 0.01 SOL; the
            # | zkcompression per-recipient math gives 0.103 SOL (a 10x gap). How do you
            # | handle it in the lab?
            prompt: "El marketing de AirShip dice que un drop de 10k destinatarios cuesta 0.01 SOL; la matemática por destinatario de zkcompression da 0.103 SOL (una brecha de 10x). ¿Cómo lo manejas en el lab?"  # @src=0294d5e5fcd3
            # | A 10x gap between a vendor claim and first-party math is almost always a
            # | scope difference (what's counted as cost). The honest move is to measure it
            # | in your own lab and teach the method; the disputed number is never the
            # | load-bearing fact.
            explanation: "Una brecha de 10x entre la afirmación de un proveedor y la matemática de primera mano es casi siempre una diferencia de alcance (qué se cuenta como costo). La jugada honesta es medirla en tu propio lab y enseñar el método; el número en disputa nunca es el hecho estructural."  # @src=11da10459095
            options:                 # source order — keep it
              d:
                # | Treat one of them as stale and cite the newer number, since two credible
                # | measured costs cannot both be right.
                label: "Trata uno de ellos como viejo y cita el número más nuevo, ya que dos costos medidos creíbles no pueden ser los dos correctos."  # @src=02d4534125d1
                # | Both are current and both are right. They count different things, and
                # | nobody stated the scope, which is what made them look comparable.
                feedback: "Los dos son actuales y los dos son correctos. Cuentan cosas distintas, y nadie declaró el alcance, que es lo que los hizo parecer comparables."  # @src=d17b502b9779
              b:
                # | Cite AirShip's 0.01 SOL, since the tool's own vendor is the authority on
                # | what the tool costs to run.
                label: "Cita los 0.01 SOL de AirShip, ya que el propio proveedor de la herramienta es la autoridad sobre lo que cuesta correrla."  # @src=4b4ea03cf266
                # | Vendor marketing numbers often quote a narrower scope; the course's rule
                # | is to measure disputed figures, not repeat them.
                feedback: "Los números de marketing de un proveedor a menudo citan un alcance más estrecho; la regla del curso es medir las cifras en disputa, no repetirlas."  # @src=426a7adf3878
              c:
                # | Quote the wider 0.103 SOL figure, so the budget carries margin against
                # | the vendor's scope.
                label: "Cita la cifra más amplia de 0.103 SOL, para que el presupuesto lleve margen contra el alcance del proveedor."  # @src=b84fd45a364b
                # | Conservative and still short. The two figures are addends, not rivals,
                # | so the wider one alone still leaves the sender's fees out of the budget.
                feedback: "Conservador y aun así corto. Las dos cifras son sumandos, no rivales, así que la más amplia por sí sola igual deja las comisiones del remitente fuera del presupuesto."  # @src=915b887e90ad
              a:
                # | Measure it in the lab and report your own measured number; the gap is a
                # | difference of scope.
                label: "Mídelo en el lab y reporta tu propio número medido; la brecha es una diferencia de alcance."  # @src=0caebd7f9eee
                # | Reading AirShip's constants settles it in a minute: 15,000 lamports per
                # | transaction over 15 recipients is 1,000 each, and the 10,300 is state.
                # | Budget the sum, about 11,300.
                feedback: "Leer las constantes de AirShip lo zanja en un minuto: 15,000 lamports por transacción sobre 15 destinatarios son 1,000 cada uno, y los 10,300 son estado. Presupuesta la suma, unos 11,300."  # @src=95f558bcb9be
          m08l3-q3-vesting-primitive:
            # | You need a subset of airdrop recipients to vest linearly instead of claiming
            # | everything at once. Which primitive do you reach for?
            prompt: "Necesitas que un subconjunto de destinatarios del airdrop se consolide linealmente en vez de reclamar todo de una vez. ¿A qué primitiva recurres?"  # @src=07ea56eaa0f7
            # | The Jito distributor (the one the JTO drop used) carries both an unlocked
            # | portion and a claim_locked path that releases linearly. That is the vesting
            # | primitive to reuse — with the caveat the lesson attaches to it and this
            # | answer inherits: the distributor is an SPL-era program and whether its vault
            # | and claim-time transfer CPI can pay out a fee-bearing Token-2022 mint is
            # | unverified here, so read its transfer CPI and stand up a devnet distributor
            # | before you commit SPROUT to it. LaunchLab's cliff+duration knobs are the
            # | launchpad-side equivalent from the previous lesson.
            explanation: "El distributor de Jito (el que usó el drop de JTO) lleva tanto una porción desbloqueada como una ruta claim_locked que libera linealmente. Esa es la primitiva de vesting a reusar — con la advertencia que la lección le ata y que esta respuesta hereda: el distributor es un programa de la era SPL y si su vault y su CPI de transferencia en el momento del reclamo pueden pagar un mint Token-2022 con comisión está sin verificar aquí, así que lee su CPI de transferencia y levanta un distributor en devnet antes de comprometer SPROUT con él. Las perillas de cliff+duración de LaunchLab son el equivalente del lado del launchpad en la lección anterior."  # @src=34cf21a63449
            options:                 # source order — keep it
              d:
                # | LaunchLab's cliff and unlock-duration knobs, set at launch so the drop
                # | inherits the same vesting schedule.
                label: "Las perillas de LaunchLab para el cliff y la duración de desbloqueo, fijadas en el lanzamiento para que el drop herede el mismo calendario de vesting."  # @src=649d9d2dfcf6
                # | Same idea, wrong seat. Those knobs are launch-side and fixed at launch,
                # | so they cannot express a schedule for a subset of a later distribution's
                # | recipients.
                feedback: "Misma idea, asiento equivocado. Esas perillas son del lado del lanzamiento y quedan fijas en el lanzamiento, así que no pueden expresar un calendario para un subconjunto de los destinatarios de una distribución posterior."  # @src=767c71775cdb
              b:
                # | The Jito-style merkle distributor's claim_locked path: unlocked plus
                # | linearly-vesting portions in one distributor.
                label: "La ruta claim_locked del merkle distributor estilo Jito: porciones desbloqueadas más porciones con vesting lineal en un solo distributor."  # @src=d852d6bc0a45
                # | One distributor carries both halves, and the locked half is a pull:
                # | unclaimed allocations sit in the vault costing you nothing until
                # | somebody returns for them.
                feedback: "Un solo distributor lleva las dos mitades, y la mitad bloqueada es un pull: las asignaciones no reclamadas se quedan en el vault sin costarte nada hasta que alguien vuelve por ellas."  # @src=ed51ded7bc39
              c:
                # | Compressed tokens vest automatically by epoch, so the vesting needs no
                # | distributor of its own.
                label: "Los tokens comprimidos se consolidan automáticamente por epoch, así que el vesting no necesita un distributor propio."  # @src=967312154c0a
                # | Compression is a storage optimization; it has no vesting semantics of
                # | its own.
                feedback: "La compresión es una optimización de almacenamiento; no tiene semántica de vesting propia."  # @src=24f79f5f70d4
              a:
                # | A second SPL mint whose freeze authority sits behind a timelock, thawing
                # | each recipient's token account as its schedule matures.
                label: "Un segundo mint SPL cuya autoridad de congelamiento está detrás de un timelock, descongelando la cuenta de token de cada destinatario a medida que su calendario madura."  # @src=023a09be1dda
                # | Freeze authority is all-or-nothing and manual; it does not express a
                # | per-recipient linear vesting schedule the way a distributor does.
                feedback: "La autoridad de congelamiento es todo-o-nada y manual; no expresa un calendario de vesting lineal por destinatario como lo hace un distributor."  # @src=dca771c219ab
          m08l3-q4-stale-proof:
            # | A recipient's compressed-token claim transaction fails shortly after the
            # | tree received new writes. What is the most likely structural cause?
            prompt: "A un destinatario le falla la transacción de reclamo de token comprimido poco después de que el árbol recibió escrituras nuevas. ¿Cuál es la causa estructural más probable?"  # @src=5276c8c4876e
            # | Every write to a compression tree changes its root, invalidating outstanding
            # | proofs. A claim built against an old proof reverts. The rule is to re-fetch
            # | the proof immediately before each write/claim; stale proofs are the classic
            # | compressed-airdrop footgun.
            explanation: "Cada escritura a un árbol de compresión cambia su raíz, e invalida las pruebas pendientes. Un reclamo construido contra una prueba vieja revierte. La regla es volver a traer la prueba inmediatamente antes de cada escritura/reclamo; las pruebas viejas son la trampa clásica del airdrop comprimido."  # @src=8a994fac62cf
            options:                 # source order — keep it
              d:
                # | The ClaimStatus PDA exists already, so the distributor's replay guard
                # | rejected the claim.
                label: "La PDA ClaimStatus ya existe, así que la guarda de replay del distributor rechazó el reclamo."  # @src=7c9aebe6694f
                # | That guard fires at account creation and does not care what the tree
                # | did. It is also the distributor's mechanism, not the compressed-token
                # | rail this claim rode.
                feedback: "Esa guarda se dispara en la creación de la cuenta y no le importa lo que hizo el árbol. Además es el mecanismo del distributor, no el riel de tokens comprimidos sobre el que viajó este reclamo."  # @src=77c498f62e30
              a:
                # | The DAS RPC rate-limited the proof read, so the claim was built from an
                # | empty proof.
                label: "El RPC de DAS limitó por tasa la lectura de la prueba, así que el reclamo se construyó a partir de una prueba vacía."  # @src=85d0fde1f2c0
                # | Rate limits cause read failures, but the tell here is the timing, right
                # | after tree writes, which points at proof staleness, not throttling.
                feedback: "Los límites de tasa causan fallas de lectura, pero la señal aquí es el momento, justo después de escrituras al árbol, que apunta a que la prueba está vieja, no a un estrangulamiento."  # @src=b6cf78261269
              c:
                # | The merkle proof went stale on the tree write; re-fetch the proof before
                # | submitting the claim.
                label: "La prueba merkle quedó vieja con la escritura al árbol; vuelve a traer la prueba antes de enviar el reclamo."  # @src=fa59d901b81b
                # | A proof is a statement about one root, and any write moves the root.
                # | Fetch immediately before you submit, never from a cache and never from a
                # | file you generated last week.
                feedback: "Una prueba es una afirmación sobre una raíz, y cualquier escritura mueve la raíz. Tráela inmediatamente antes de enviarla, nunca de un caché y nunca de un archivo que generaste la semana pasada."  # @src=b0db5b844ab1
              e:
                # | The tree's canopy is too shallow, so the proof no longer fits in the
                # | transaction alongside the claim.
                label: "El canopy del árbol es demasiado superficial, así que la prueba ya no cabe en la transacción junto con el reclamo."  # @src=2120b35e01a9
                # | Canopy belongs to Bubblegum's concurrent merkle trees, where proof
                # | length grows with depth. A compressed-token write carries a constant
                # | 128-byte validity proof, so size is not the failure.
                feedback: "El canopy pertenece a los árboles merkle concurrentes de Bubblegum, donde el largo de la prueba crece con la profundidad. Una escritura de token comprimido lleva una prueba de validez constante de 128 bytes, así que el tamaño no es la falla."  # @src=75988b7f0916
              b:
                # | Compressed tokens cannot be claimed twice by design, and this account
                # | already claimed once.
                label: "Los tokens comprimidos no se pueden reclamar dos veces por diseño, y esta cuenta ya reclamó una vez."  # @src=b10099f1bbdf
                # | This is a first claim; the failure correlates with tree writes, not a
                # | double-claim guard.
                feedback: "Este es un primer reclamo; la falla se correlaciona con escrituras al árbol, no con una guarda contra doble reclamo."  # @src=ebe1df963e35
  m09-l1-fee-routing-buyback:
    # | Fee routing & buyback/burn: where the money actually flows
    title: "Enrutamiento de comisiones y buyback/quema: por dónde fluye realmente el dinero"  # @src=2b6399dafe14
    blocks:
      route-fees:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Subtract the burned share from the harvest to get toTreasury.
          0: "Resta la parte quemada del harvest para sacar toTreasury."  # @src=bc8ab642d0e0
          # | Buyback tokens = treasurySol / priceLamportsPerToken, floored on bigints.
          1: "Tokens del buyback = treasurySol / priceLamportsPerToken, truncado hacia abajo sobre bigints."  # @src=34b521cb4651
          # | burnedFromFees + toTreasury must always equal harvested.
          2: "burnedFromFees + toTreasury siempre tiene que ser igual a harvested."  # @src=368e7ee517f2
        tests:                      # keyed by test case id
          split-and-buyback:
            # | 20% of 1,000,000 burns 200,000; 800,000 stays; 5,000,000,000 lamports /
            # | 1,000,000 buys 5,000 SPROUT
            description: "el 20% de 1,000,000 quema 200,000; quedan 800,000; 5,000,000,000 lamports / 1,000,000 compran 5,000 SPROUT"  # @src=0c16d184fbe2
          zero-burn-share:
            # | a 0 bps burn share burns nothing; the whole harvest stays; no SOL means no
            # | buyback
            description: "una parte quemada de 0 bps no quema nada; queda todo el harvest; sin SOL no hay buyback"  # @src=2751d5c710a5
          all-burned:
            # | a 100% burn share burns the whole harvest; 3,000,000 lamports buys 3 SPROUT
            # | to burn
            description: "una parte quemada del 100% quema todo el harvest; 3,000,000 lamports compran 3 SPROUT para quemar"  # @src=7bc8d523343f
          buyback-floors:
            # | 2,999,999 / 1,000,000 floors to 2 SPROUT: you cannot buy a fractional base
            # | unit
            description: "2,999,999 / 1,000,000 se trunca a 2 SPROUT: no puedes comprar una fracción de unidad base"  # @src=a7cf27e291d7
          conservation-holds:
            # | 33% of 123,457 floors to 40,740 burned; 82,717 stays; the split conserves
            # | the harvest exactly
            description: "el 33% de 123,457 se trunca a 40,740 quemados; quedan 82,717; el reparto conserva el harvest exactamente"  # @src=23c174c776a4
      check:                      # quiz
        questions:
          m09l1-q1-where-fees-go:
            # | Your Overgrowth marketplace charges a 1% Token-2022 transfer fee on SPROUT
            # | trades. A week in, your treasury PDA balance is still zero, but transfers
            # | are clearly paying the fee. What happened?
            prompt: "Tu marketplace de Overgrowth cobra una comisión de transferencia Token-2022 del 1% sobre los canjes de SPROUT. A una semana, el saldo de tu PDA de tesorería sigue en cero, pero las transferencias claramente están pagando la comisión. ¿Qué pasó?"  # @src=1864a8fa726a
            # | Token-2022 transfer fees accrue WITHHELD on each recipient's token account.
            # | Routing them anywhere requires the harvest crank:
            # | harvest_withheld_tokens_to_mint, then withdraw to the treasury. That's the
            # | first leg of the rail, and exactly the mechanic you built back in the
            # | economics-extensions lesson.
            explanation: "Las comisiones de transferencia de Token-2022 se acumulan RETENIDAS en la cuenta de token de cada destinatario. Enrutarlas a cualquier parte requiere el crank de harvest: harvest_withheld_tokens_to_mint, y después el withdraw hacia la tesorería. Ese es el primer tramo del riel, y exactamente la mecánica que construiste allá en la lección de economics-extensions."  # @src=9828a4d46fc3
            options:                 # source order — keep it
              a:
                # | The fee was never configured: a Token-2022 transfer fee needs a
                # | creator_vault set at mint creation, the way pump.fun does it.
                label: "La comisión nunca se configuró: una comisión de transferencia de Token-2022 necesita un creator_vault fijado al crear el mint, como lo hace pump.fun."  # @src=bca03fd32298
                # | That conflates two models. pump.fun's creator_vault is a program-side
                # | fee account; Token-2022 transfer fees don't use it. The fee IS being
                # | collected; you just looked in the wrong place.
                feedback: "Eso confunde dos modelos. El creator_vault de pump.fun es una cuenta de comisiones que vive del lado del programa; las comisiones de transferencia de Token-2022 no lo usan. La comisión SÍ se está recaudando; solo que miraste en el lugar equivocado."  # @src=80769609766e
              d:
                # | Harvest already swept the fees to the mint, which forwards them to the
                # | treasury on its own schedule.
                label: "El harvest ya barrió las comisiones hacia el mint, que las reenvía a la tesorería según su propio calendario."  # @src=e863e7f6774c
                # | Nothing forwards on its own, and nothing had been swept: peek.ts printed
                # | the mint's own withheldAmount as zero. The second leg is an
                # | authority-signed withdraw you have to run.
                feedback: "Nada se reenvía solo, y nada había sido barrido: peek.ts imprimió el withheldAmount del propio mint como cero. El segundo tramo es un withdraw firmado por la autoridad que tienes que correr tú."  # @src=a1d15b73114b
              c:
                # | The fees are withheld on the recipients' token accounts; the treasury
                # | sees nothing until you harvest and withdraw.
                label: "Las comisiones quedan retenidas en las cuentas de token de los destinatarios; la tesorería no ve nada hasta que hagas harvest y withdraw."  # @src=84f4f4638009
                # | Two instructions and a permission boundary between them: consolidation
                # | is permissionless because it cannot steal, and collection is gated
                # | because it can.
                feedback: "Dos instrucciones y un límite de permisos entre ellas: consolidar es sin permiso porque no puede robar, y recaudar está restringido porque sí puede."  # @src=dd49b5dc2341
              b:
                # | Token-2022 burns transfer fees automatically at transfer time, deflating
                # | supply on every trade, so no treasury is ever supposed to receive them.
                label: "Token-2022 quema las comisiones de transferencia automáticamente en el momento de la transferencia, deflactando el supply en cada canje, así que ninguna tesorería debería recibirlas nunca."  # @src=310f007301b0
                # | Token-2022 never burns fees automatically; it withholds them. Nothing is
                # | destroyed: the tokens are sitting on recipient accounts waiting to be
                # | harvested.
                feedback: "Token-2022 nunca quema comisiones automáticamente; las retiene. Nada se destruye: los tokens están sentados en cuentas de destinatarios esperando a que les hagan harvest."  # @src=65c67e5fd5c0
          m09l1-q2-buyback-scope:
            # | You wire the treasury to buy SPROUT back and burn it. In this course, how is
            # | that buyback executed?
            prompt: "Armas la tesorería para recomprar SPROUT y quemarlo. En este curso, ¿cómo se ejecuta ese buyback?"  # @src=064d65f7574f
            # | The buyback leg is deliberately scoped to a client-side purchase followed by
            # | a burn. If SPROUT has a DAMM v2 pool (the venue the launchpad-landscape
            # | decision chose, reachable only if you launched and migrated it yourself)
            # | that purchase is a swap; the course never launches SPROUT, so the guaranteed
            # | path is an OTC buy from a maker you stand up, at a price you set rather than
            # | read. Either way you measure what landed instead of computing it. One
            # | sentence of AMM math is used; none is taught. The depth lives in the planned
            # | DeFi & RWA Engineering course.
            explanation: "El tramo del buyback está acotado a propósito a una compra del lado del cliente seguida de una quema. Si SPROUT tiene un pool DAMM v2 (la plataforma que eligió la decisión de launchpad-landscape, alcanzable solo si lo lanzaste y migraste tú mismo) esa compra es un swap; el curso nunca lanza SPROUT, así que el camino garantizado es una compra OTC a un maker que tú levantas, a un precio que fijas en vez de leer. De cualquier manera mides lo que llegó en vez de calcularlo. Se usa una frase de matemática de AMM; no se enseña ninguna. La profundidad vive en el curso planificado DeFi & RWA Engineering."  # @src=10a7c038f762
            options:                 # source order — keep it
              c:
                # | By calling harvest_withheld_tokens_to_mint a second time, which converts
                # | withheld fees directly into a burn.
                label: "Llamando a harvest_withheld_tokens_to_mint una segunda vez, lo cual convierte las comisiones retenidas directamente en una quema."  # @src=a62cc1888688
                # | Harvest only moves withheld fees to the mint; it doesn't swap SOL for
                # | tokens or burn anything. The buyback is a separate buy-then-burn.
                feedback: "El harvest solo mueve las comisiones retenidas hacia el mint; no cambia SOL por tokens ni quema nada. El buyback es un comprar-después-quemar aparte."  # @src=f3a2924f7adc
              b:
                # | By deploying a custom constant-product AMM pool with treasury-owned LP
                # | positions, so the treasury controls its own liquidity, routing, and
                # | slippage.
                label: "Desplegando un pool AMM de producto constante propio con posiciones de LP que la tesorería posee, para que la tesorería controle su propia liquidez, ruteo y slippage."  # @src=ea47565c0d88
                # | Pool composition, routing, and LP strategy are the planned DeFi & RWA
                # | Engineering course's material. This course buys client-side from
                # | whichever counterparty it has, and teaches no AMM design.
                feedback: "La composición de pools, el ruteo y la estrategia de LP son material del curso planificado DeFi & RWA Engineering. Este curso compra del lado del cliente a la contraparte que tenga, y no enseña ningún diseño de AMM."  # @src=d68445e78a9f
              a:
                # | As a client-side purchase paying treasury SOL for SPROUT, then a burn: a
                # | DAMM v2 swap if SPROUT has a pool, otherwise an OTC buy from a maker you
                # | stand up.
                label: "Como una compra del lado del cliente que paga SOL de la tesorería por SPROUT, y después una quema: un swap DAMM v2 si SPROUT tiene un pool, si no una compra OTC a un maker que tú levantas."  # @src=9f9f786f44c5
                # | The rail downstream cannot tell the two doors apart, which is the point.
                # | Only the swap door has slippage and MEV to worry about; both doors pay
                # | SPROUT's own transfer fee on the payout.
                feedback: "El riel río abajo no puede distinguir las dos puertas, que es justo el punto. Solo la puerta del swap tiene slippage y MEV de qué preocuparse; las dos puertas pagan la propia comisión de transferencia de SPROUT sobre el pago."  # @src=6982aedb92c9
              d:
                # | As a burn of the treasury's harvested SPROUT: buying back is just the
                # | name for burning fee income you already hold.
                label: "Como una quema del SPROUT que la tesorería obtuvo en el harvest: recomprar es solo el nombre de quemar ingresos por comisiones que ya tienes."  # @src=b8d366d633ea
                # | That is the fee-split's burn share, which the treasury already holds. A
                # | buyback is funded by a different asset, treasury SOL, and it needs a
                # | counterparty to spend that SOL with.
                feedback: "Esa es la parte quemada del reparto de comisiones, que la tesorería ya tiene. Un buyback lo financia un activo distinto, el SOL de la tesorería, y necesita una contraparte con quien gastar ese SOL."  # @src=04f5609bab6e
          m09l1-q3-conservation:
            # | In the fee-split challenge you harvest 1,000,000 base units of SPROUT with a
            # | 20% burn share, and separately hold treasury SOL for the buyback. Which
            # | invariant must your function preserve?
            prompt: "En el challenge del reparto de comisiones haces harvest de 1,000,000 de unidades base de SPROUT con una parte quemada del 20%, y aparte tienes SOL de tesorería para el buyback. ¿Qué invariante tiene que preservar tu función?"  # @src=8f2027bff175
            # | The split is a conservation law: whatever you burn from fees plus whatever
            # | stays in the treasury has to add up to exactly what you harvested. The
            # | buyback is funded from SOL and is a separate leg; sizing it is a
            # | floor-division on price, not a mirror of the fee burn.
            explanation: "El reparto es una ley de conservación: lo que quemes de las comisiones más lo que quede en la tesorería tiene que sumar exactamente lo que hiciste harvest. El buyback se financia con SOL y es un tramo aparte; dimensionarlo es una división entera hacia abajo sobre el precio, no un espejo de la quema de comisiones."  # @src=ec68f58177fa
            options:                 # source order — keep it
              b:
                # | burnedFromFees + toTreasury must equal harvested; the split creates and
                # | destroys nothing.
                label: "burnedFromFees + toTreasury tiene que ser igual a harvested; el reparto no crea ni destruye nada."  # @src=d87ac15ced39
                # | The split only labels. Hold that on every input, including the ugly
                # | ones, and the supply assertion at the end of the run has something to
                # | stand on.
                feedback: "El reparto solo etiqueta. Sostén eso en cada entrada, incluidas las feas, y la assertion de supply al final de la corrida tiene sobre qué pararse."  # @src=fbb514a3b7e2
              d:
                # | burnedFromFees plus toTreasury plus the buyback must equal the harvested
                # | total, since all three come from one pile.
                label: "burnedFromFees más toTreasury más el buyback tiene que ser igual al total del harvest, ya que los tres vienen de un mismo montón."  # @src=1e3a23e377be
                # | Three terms, two piles. The buyback is bought with treasury SOL, not
                # | carved out of the harvested SPROUT, so folding it into this identity
                # | breaks on the first run.
                feedback: "Tres términos, dos montones. El buyback se compra con SOL de la tesorería, no se recorta del SPROUT del harvest, así que meterlo en esta identidad se rompe en la primera corrida."  # @src=ad05e8ecdfac
              c:
                # | toTreasury must equal the full harvested amount, since the burning
                # | happens later at the venue.
                label: "toTreasury tiene que ser igual al monto completo del harvest, ya que la quema pasa más tarde en la plataforma."  # @src=3f7bb1e8bdab
                # | If toTreasury equalled the whole harvest you'd have double-counted the
                # | burned share. The split must sum to the harvest, not ignore the burn.
                feedback: "Si toTreasury fuera igual a todo el harvest habrías contado dos veces la parte quemada. El reparto tiene que sumar el harvest, no ignorar la quema."  # @src=a57b8826c1ee
              a:
                # | The buyback token amount must equal the burned-from-fees amount, or
                # | supply isn't conserved.
                label: "El monto de tokens del buyback tiene que ser igual al monto quemado de las comisiones, o el supply no se conserva."  # @src=fa211cab0772
                # | Those are two independent legs: the fee-burn and the SOL-funded
                # | buyback-burn. They needn't be equal; conservation is about the fee split
                # | summing back to the harvest.
                feedback: "Esos son dos tramos independientes: la quema de comisiones y la quema del buyback financiada con SOL. No tienen por qué ser iguales; la conservación va de que el reparto de comisiones vuelva a sumar el harvest."  # @src=a4d280c01ac7
  m09-l2-gating-migrations:
    # | Gating & points-to-token migrations: wiring the whole economy
    title: "Restricción de acceso & migraciones de puntos a token: conectar toda la economía"  # @src=98e9b57db3d3
    blocks:
      check:                      # quiz
        questions:
          m09l2-q1-gate-trust:
            # | The alpha channel gates on holding a Founding-Farmer cNFT. A user's client
            # | sends a signed message saying 'I hold it.' How should your gate decide?
            prompt: "El canal alfa restringe el acceso a quien tenga un cNFT Founding-Farmer. El cliente de un usuario manda un mensaje firmado que dice 'lo tengo.' ¿Cómo debería decidir tu barrera?"  # @src=7c415b2474f5
            # | Gating decides on an on-chain reality, so it reads one: resolve the wallet's
            # | assets through DAS (cNFT reads require a DAS-supporting RPC) and confirm the
            # | gating asset resolves to that owner. A signature or a client claim is not
            # | evidence of a current holding. DAS is an index, so this read is fresh to
            # | within the provider's lag rather than instantaneous, which is a bill worth
            # | paying for a chat role and worth topping up with an on-chain confirmation
            # | for anything expensive.
            explanation: "Una barrera decide sobre una realidad on-chain, así que lee una: resuelve los activos de la billetera mediante DAS (las lecturas de cNFT requieren un RPC con soporte de DAS) y confirma que el activo que condiciona el acceso resuelve a ese dueño. Una firma o una afirmación del cliente no son evidencia de una tenencia actual. DAS es un índice, así que esta lectura es fresca hasta el retraso del proveedor y no instantánea, que es una factura que vale la pena pagar para un rol de chat y que vale la pena reforzar con una confirmación on-chain para cualquier cosa cara."  # @src=be2cf904cf97
            options:                 # source order — keep it
              b:
                # | Check the local wallet adapter's cached token list for the
                # | Founding-Farmer cNFT, which is what the portfolio page renders from.
                label: "Revisa la lista de tokens en caché del wallet adapter local buscando el cNFT Founding-Farmer, que es de donde renderiza la página de portafolio."  # @src=b3e2e594328c
                # | A client-side cache is both spoofable and stale. The gate must verify
                # | against a DAS/on-chain source, not the client's own report.
                feedback: "Un caché del lado del cliente es a la vez falsificable y viejo. La barrera tiene que verificar contra una fuente DAS/on-chain, no contra el reporte del propio cliente."  # @src=34d5912fe37c
              d:
                # | Ask for the crate's merkle proof with getAssetProof and verify it
                # | locally, so the decision rests on cryptography instead of on an index
                # | whose freshness you do not control.
                label: "Pide la prueba de Merkle del crate con getAssetProof y verifícala localmente, para que la decisión descanse en criptografía y no en un índice cuya frescura no controlas."  # @src=108114552f48
                # | The proof comes from the same index and describes the same root, so it
                # | buys a round trip and no freshness. For a cNFT there is no account to
                # | fall back on.
                feedback: "La prueba viene del mismo índice y describe la misma raíz, así que compra un viaje de ida y vuelta y ninguna frescura. Para un cNFT no hay cuenta a la que recurrir."  # @src=30520d9d3cf8
              c:
                # | Resolve the wallet's assets through a DAS read and confirm the
                # | Founding-Farmer cNFT actually resolves to that owner, accepting a
                # | bounded amount of index lag.
                label: "Resuelve los activos de la billetera mediante una lectura de DAS y confirma que el cNFT Founding-Farmer de verdad resuelve a ese dueño, aceptando una cantidad acotada de retraso del índice."  # @src=ae2809bb7581
                # | A gate decides on a read the applicant cannot write to. Index lag is a
                # | bounded failure; trusting the applicant's own report is bounded by
                # | nothing.
                feedback: "Una barrera decide con una lectura en la que el solicitante no puede escribir. El retraso del índice es una falla acotada; confiar en el reporte del propio solicitante no está acotado por nada."  # @src=8927034116c4
              a:
                # | Accept the wallet-signed message: a valid signature over the gate's
                # | challenge nonce proves the wallet controls its keys and therefore holds
                # | the badge.
                label: "Acepta el mensaje firmado por la billetera: una firma válida sobre el nonce de desafío de la barrera demuestra que la billetera controla sus claves y que por lo tanto tiene el badge."  # @src=d4fef03f9fd4
                # | A signature proves control of the keypair, not that the wallet currently
                # | holds a specific cNFT. Holdings must be read from the chain, not
                # | asserted by the client.
                feedback: "Una firma demuestra control del keypair, no que la billetera tenga en este momento un cNFT específico. Las tenencias se leen de la blockchain, no las afirma el cliente."  # @src=214f8907d6ed
          m09l2-q2-kmno-gap:
            # | You migrate compost points to SPROUT. The lesson points at Kamino's KMNO
            # | points-to-token migration as a case study but flags a gap. What's the honest
            # | way to use it?
            prompt: "Migras puntos de compost a SPROUT. La lección apunta a la migración de puntos a token de Kamino hacia KMNO como caso de estudio pero marca un hueco. ¿Cuál es la forma honesta de usarla?"  # @src=4f2eed08463d
            # | Kamino KMNO is a candidate case study with an honest numbers gap: the
            # | conversion tokenomics aren't public. The transferable lesson is the
            # | mechanism, a merkle-claim migration (reusing the conversion-window path you
            # | just built, with claim_locked for any vesting), not a ratio you'd be
            # | inventing.
            explanation: "Kamino KMNO es un caso de estudio candidato con un hueco honesto de números: la tokenomics de la conversión no es pública. La lección transferible es el mecanismo, una migración con reclamo por merkle (reutilizando la ruta de la ventana de conversión que acabas de construir, con claim_locked para cualquier vesting), no un ratio que estarías inventando."  # @src=6e73edf3ce66
            options:                 # source order — keep it
              a:
                # | Reuse the mechanism, a merkle-claim path like your airdrop, but don't
                # | cite a KMNO conversion ratio; those numbers aren't published.
                label: "Reutiliza el mecanismo, una ruta de reclamo por merkle como la de tu airdrop, pero no cites un ratio de conversión de KMNO; esos números no están publicados."  # @src=c647456b6f00
                # | The mechanism is portable and the tokenomics are not. Nobody can hand
                # | you the ratio, which is exactly the gap the case study leaves open.
                feedback: "El mecanismo es portable y la tokenomics no. Nadie puede darte el ratio, que es exactamente el hueco que deja abierto el caso de estudio."  # @src=afc6d9093ecc
              b:
                # | Copy Kamino's exact points-to-KMNO conversion ratio straight from their
                # | published docs into your migration config, since a shipped mainnet
                # | migration is the best-vetted number you can get.
                label: "Copia el ratio exacto de conversión de puntos a KMNO de Kamino directo desde sus docs publicados a tu config de migración, ya que una migración de mainnet publicada es el número mejor revisado que puedes conseguir."  # @src=6afb53f9655a
                # | Kamino's conversion tokenomics aren't surfaced in their docs; the
                # | research flags this as a gap. Copy the mechanism, not a number you can't
                # | verify.
                feedback: "La tokenomics de conversión de Kamino no aparece en sus docs; la investigación marca esto como un hueco. Copia el mecanismo, no un número que no puedes verificar."  # @src=a02afa803924
              c:
                # | Skip the merkle path and mint SPROUT straight to every points holder,
                # | batching them into as few transactions as fit.
                label: "Sáltate la ruta de merkle y acuña SPROUT directo a cada tenedor de puntos, agrupándolos en las menos transacciones que quepan."  # @src=c6c9f3be8b95
                # | A single-transaction mint to all holders doesn't scale and throws away
                # | the claim/vesting path you already built; the migration reuses that
                # | merkle path.
                feedback: "Una acuñación en una sola transacción a todos los tenedores no escala y tira a la basura la ruta de reclamo/vesting que ya construiste; la migración reutiliza esa ruta de merkle."  # @src=70f39f3d956d
              d:
                # | Back the ratio out of KMNO's circulating supply and Kamino's published
                # | points totals, then apply the same implied rate to compost points.
                label: "Deduce el ratio hacia atrás a partir del supply circulante de KMNO y de los totales de puntos publicados de Kamino, después aplica la misma tasa implícita a los puntos de compost."  # @src=6bfc0fc18306
                # | That reconstructs a number the lesson could not source, and it would
                # | still be somebody else's supply math. Your ratio is a decision about
                # | your own dilution.
                feedback: "Eso reconstruye un número que la lección no pudo citar, y aun así sería la matemática de supply de otra persona. Tu ratio es una decisión sobre tu propia dilución."  # @src=04d91f51771e
          m09l2-q3-stale-index:
            # | Your gate-check just passed a wallet that transferred its Founding-Farmer
            # | cNFT away five seconds ago. What's the most likely cause?
            prompt: "Tu comprobación de la barrera acaba de dejar pasar a una billetera que transfirió su cNFT Founding-Farmer hace cinco segundos. ¿Cuál es la causa más probable?"  # @src=8eb9dc530ae6
            # | DAS is an indexed view of on-chain state, and indexers lag. A holding that
            # | changed seconds ago may not be reflected yet, so a gate can briefly admit a
            # | former holder. Design for freshness: accept the lag, or confirm against a
            # | fresher source for high-stakes gates.
            explanation: "DAS es una vista indexada del estado on-chain, y los indexadores se retrasan. Una tenencia que cambió hace segundos puede no estar reflejada todavía, así que una barrera puede admitir brevemente a un antiguo tenedor. Diseña pensando en la frescura: acepta el retraso, o confirma contra una fuente más fresca para barreras con mucho en juego."  # @src=3a1f06d67c92
            options:                 # source order — keep it
              b:
                # | The DAS index hadn't caught up: a just-transferred asset can still
                # | resolve to the old owner until the indexer updates.
                label: "El índice de DAS no se había puesto al día: un activo recién transferido todavía puede resolver al dueño viejo hasta que el indexador se actualice."  # @src=d99ee3ca4b7a
                # | Not a bug in your gate and not a bug in the provider. It is what an
                # | index is, which is why a soulbound badge is the fix that removes the
                # | case rather than shrinking it.
                feedback: "No es un bug de tu barrera y no es un bug del proveedor. Es lo que un índice es, que es por lo que un badge soulbound es el arreglo que elimina el caso en vez de encogerlo."  # @src=66d278919c46
              d:
                # | The gate skipped its on-chain confirmation step, which for a cNFT would
                # | have caught the transfer.
                label: "La barrera se saltó su paso de confirmación on-chain, que para un cNFT habría atrapado la transferencia."  # @src=2051ecf89364
                # | That remedy exists for a fungible balance, where getTokenAccountsByOwner
                # | is a fresher second read. A cNFT has no account to confirm against,
                # | which is why the lag is structural here.
                feedback: "Ese remedio existe para un saldo fungible, donde getTokenAccountsByOwner es una segunda lectura más fresca. Un cNFT no tiene cuenta contra la que confirmar, que es por lo que aquí el retraso es estructural."  # @src=38cf85887830
              c:
                # | DAS reads are cryptographically final, so the gate is authoritative and
                # | the old owner cannot still resolve.
                label: "Las lecturas de DAS son criptográficamente finales, así que la barrera es autoritativa y el dueño viejo no puede seguir resolviendo."  # @src=a3dda7078d04
                # | DAS is an indexer view, not a consensus proof; it lags the chain by
                # | design. The issue is freshness, not finality.
                feedback: "DAS es una vista del indexador, no una prueba de consenso; se retrasa respecto de la blockchain por diseño. El problema es la frescura, no la finalidad."  # @src=81bf58aa8d60
              a:
                # | cNFTs can't be transferred, so the read must be misreporting the
                # | transfer.
                label: "Los cNFTs no se pueden transferir, así que la lectura tiene que estar reportando mal la transferencia."  # @src=d37efba0fb3d
                # | cNFTs are transferable via Bubblegum v2 transfer_v2. The badge is
                # | soulbound only because set_non_transferable_v2 was applied; an ordinary
                # | cNFT can move freely.
                feedback: "Los cNFTs son transferibles mediante transfer_v2 de Bubblegum v2. El badge es soulbound solo porque se aplicó set_non_transferable_v2; un cNFT ordinario se puede mover libremente."  # @src=06038186c4d2
  m09-l3-production-case-studies:
    # | Production case studies & the frontier: what actually shipped
    title: "Casos de producción & la frontera: lo que de verdad se entregó"  # @src=668a9ddb0539
    blocks:
      check:                      # quiz
        questions:
          m09l3-q1-pyusd-dormant:
            # | You read PYUSD's live mint on-chain. What does 'configured but dormant' mean
            # | for its extension set?
            prompt: "Lees el mint en vivo de PYUSD on-chain. ¿Qué quiere decir 'configurado pero dormido' para su conjunto de extensiones?"  # @src=862b6a783ab6
            # | PYUSD arms a full compliance-shaped set (eight TLV extensions) but reads
            # | inert on-chain: hook programId null, fee 0 bps. 'Configured but dormant' is
            # | the teachable fact. You verify it by reading the mint, not by inferring
            # | behavior from the presence of an extension.
            explanation: "PYUSD arma un conjunto completo con forma de compliance (ocho extensiones TLV) pero se lee inerte on-chain: programId del hook null, comisión 0 bps. 'Configurado pero dormido' es el hecho que se puede enseñar. Lo verificas leyendo el mint, no infiriendo el comportamiento a partir de la presencia de una extensión."  # @src=152d7c5afad4
            options:                 # source order — keep it
              c:
                # | The mint carries eight TLV extensions, but the behavior-bearing ones
                # | read inert: hook programId null, transfer fee 0 bps.
                label: "El mint lleva ocho extensiones TLV, pero las que cargan comportamiento se leen inertes: programId del hook null, comisión de transferencia 0 bps."  # @src=5944aefa30ee
                # | Presence tells a user what could happen; the field value tells them what
                # | will happen on the next transfer. Those two sentences belong in
                # | different parts of your UI.
                feedback: "La presencia le dice a un usuario qué podría pasar; el valor del campo le dice qué va a pasar en la siguiente transferencia. Esas dos oraciones van en partes distintas de tu UI."  # @src=1b0e186683a8
              a:
                # | PYUSD carries seven extensions, and all seven of them actively enforce
                # | on every transfer it makes.
                label: "PYUSD lleva siete extensiones, y las siete imponen activamente en cada transferencia que hace."  # @src=d36efc78088a
                # | Counting TLV entries, PYUSD carries eight extensions, and the
                # | behavior-bearing ones are inert: the hook programId is null and the
                # | transfer fee is 0 bps.
                feedback: "Contando entradas TLV, PYUSD lleva ocho extensiones, y las que cargan comportamiento son inertes: el programId del hook es null y la comisión de transferencia es 0 bps."  # @src=33bf6d0e0b06
              b:
                # | The extensions are present in the mint's TLV data, but Token-2022 keeps
                # | each one disabled until an audit.
                label: "Las extensiones están presentes en los datos TLV del mint, pero Token-2022 mantiene cada una desactivada hasta que haya una auditoría."  # @src=3c8276d93f0e
                # | Token-2022 doesn't gate a mint's extensions behind an audit. PYUSD's
                # | issuer configured the extensions without arming them; that's an issuer
                # | choice, not a program lock.
                feedback: "Token-2022 no condiciona las extensiones de un mint a una auditoría. El emisor de PYUSD configuró las extensiones sin armarlas; esa es una decisión del emisor, no un bloqueo del programa."  # @src=62a550296121
              d:
                # | A dormant extension has a null authority, so none of them can ever fire
                # | whatever the issuer decides later.
                label: "Una extensión dormida tiene una autoridad nula, así que ninguna puede llegar a dispararse nunca, decida lo que decida el emisor después."  # @src=cc9012c1f479
                # | A null authority would make a slot inert and dead for good. All eight of
                # | PYUSD's list the same live authority, which is what makes the four idle
                # | ones armed rather than dead.
                feedback: "Una autoridad nula dejaría un slot inerte y muerto para siempre. Las ocho de PYUSD listan la misma autoridad viva, y eso es lo que hace que las cuatro quietas estén armadas y no muertas."  # @src=ba15cba7bdc3
          m09l3-q2-jto-maps:
            # | Which primitive you built maps most directly onto Jito's JTO airdrop?
            prompt: "¿Cuál primitiva que construiste se mapea más directamente al airdrop de JTO de Jito?"  # @src=785b56b967ee
            # | The JTO drop is the canonical merkle-distributor-with-linear-vesting case
            # | study, the very mechanism you reused for the compost-points migration,
            # | including the claim_locked vesting step. That's the point of the case study:
            # | real deployments run the primitives you built.
            explanation: "El drop de JTO es el caso de estudio canónico de merkle-distributor-con-vesting-lineal, el mismísimo mecanismo que reusaste para la migración de los puntos de compost, incluido el paso de vesting de claim_locked. Ese es el punto del caso de estudio: los despliegues reales corren las primitivas que construiste."  # @src=5dac6e8b9459
            options:                 # source order — keep it
              c:
                # | The transfer-hook program, with JTO enforcing its claims through a
                # | custom hook on every transfer.
                label: "El programa de transfer hook, con JTO imponiendo sus reclamos mediante un hook personalizado en cada transferencia."  # @src=884a867b62a2
                # | JTO used a merkle distributor, not a transfer hook. The linearly-vesting
                # | portion is what maps onto your claim_locked step.
                feedback: "JTO usó un merkle distributor, no un transfer hook. La porción con vesting lineal es la que se mapea a tu paso de claim_locked."  # @src=79e054527e7f
              a:
                # | The compost-airdrop's merkle-claim path with claim_locked vesting; JTO
                # | ran a merkle distributor with linear vesting.
                label: "La ruta de reclamo por Merkle del compost-airdrop con vesting de claim_locked; JTO corrió un merkle distributor con vesting lineal."  # @src=d0dd58ddf380
                # | Same program, in fact: mERKcfxMC5SqJn4Ld4BUris3WKZZ1ojjWJ3A3J5CKxv is
                # | still executable on mainnet, and its claim_locked is the instruction you
                # | ported.
                feedback: "El mismo programa, de hecho: mERKcfxMC5SqJn4Ld4BUris3WKZZ1ojjWJ3A3J5CKxv sigue siendo ejecutable en mainnet, y su claim_locked es la instrucción que portaste."  # @src=7f001b858457
              d:
                # | The compressed-token push from the airdrop lab, since JTO went out to
                # | every holder without a claim step.
                label: "El push de tokens comprimidos desde el lab de airdrop, ya que JTO salió a cada tenedor sin un paso de reclamo."  # @src=9e5e6299c390
                # | A push writes to each recipient whether or not they show up; JTO was a
                # | pull, where recipients brought a proof and opened their own status
                # | account.
                feedback: "Un push escribe a cada destinatario aparezca o no; JTO fue un pull, donde los destinatarios traían una prueba de Merkle y abrían su propia cuenta de estado."  # @src=e22e2a09157a
              b:
                # | The confidential-transfer variant, in which JTO distributed each
                # | allocation as an encrypted amount.
                label: "La variante de transferencia confidencial, en la que JTO distribuyó cada asignación como un monto cifrado."  # @src=ae292a637ab7
                # | JTO's distribution was a public merkle drop with vesting, not a
                # | confidential-transfer deployment.
                feedback: "La distribución de JTO fue un drop público por Merkle con vesting, no un despliegue de transferencia confidencial."  # @src=48365a1eabc1
          m09l3-q3-frontier-honesty:
            # | Writing case-study notes, you cite an official Solana page that says
            # | confidential transfers are 'expected EOY 2024,' and you describe Metaplex
            # | Agent Registry as a shipping production standard. What's wrong?
            prompt: "Escribiendo notas de caso de estudio, citas una página oficial de Solana que dice que las transferencias confidenciales están 'expected EOY 2024,' y describes Metaplex Agent Registry como un estándar de producción ya lanzado. ¿Qué está mal?"  # @src=a82d2b7f1eef
            # | Two honesty traps: official pages carry dead dates (confidential transfers
            # | 'expected EOY 2024'), and the agent-identity stack (Metaplex Agent Registry,
            # | the Core AgentIdentity plugin, DAS is_agent as a nullable boolean field) is
            # | a real but unproven 2026 direction. Cite the stale page only for its
            # | audit-firm list, and frame agent identity as a frontier beat.
            explanation: "Dos trampas de honestidad: las páginas oficiales cargan fechas muertas (transferencias confidenciales 'expected EOY 2024'), y el stack de identidad de agentes (Metaplex Agent Registry, el plugin AgentIdentity de Core, is_agent de DAS como campo booleano nullable) es una dirección de 2026 real pero no probada. Cita la página vieja solo para su lista de firmas de auditoría, y encuadra la identidad de agentes como un tema de frontera."  # @src=d34ee8b2ac5e
            options:                 # source order — keep it
              b:
                # | Both: the date is stale text on a live page, and agent identity is a
                # | direction.
                label: "Las dos cosas: la fecha es texto viejo en una página viva, y la identidad de agentes es una dirección."  # @src=d36c08bcf6b8
                # | Confidential transfers have been on mainnet a while; cite that page for
                # | its five-firm audit roster, never for the date. Agent Registry,
                # | AgentIdentity and is_agent add up to a direction.
                feedback: "Las transferencias confidenciales llevan un rato en mainnet; cita esa página por su lista de auditoría de cinco firmas, nunca por la fecha. Agent Registry, AgentIdentity e is_agent suman una dirección."  # @src=b02dcf6a9d9b
              a:
                # | Nothing is wrong: both are current, verified facts and you can cite each
                # | of them as they stand.
                label: "Nada está mal: las dos son hechos actuales y verificados, y puedes citar cada una tal como está."  # @src=2e823b4574e8
                # | Both are traps: the 'EOY 2024' line is dead text on a live page, and
                # | agent identity is a 2026 frontier beat, not a production standard.
                feedback: "Las dos son trampas: la línea de 'EOY 2024' es texto muerto en una página viva, y la identidad de agentes es un tema de frontera de 2026, no un estándar de producción."  # @src=47385a99fb74
              c:
                # | The confidential-transfer date is fine, and only the agent-identity
                # | claim is premature.
                label: "La fecha de la transferencia confidencial está bien, y solo la afirmación sobre identidad de agentes es prematura."  # @src=a404419eef0e
                # | The confidential-transfer page is also stale: a live official page
                # | carrying a dead 2024 claim. Cite it only for its audit-firm list, not
                # | its timeline.
                feedback: "La página de transferencia confidencial también está vieja: una página oficial viva que carga una afirmación muerta de 2024. Cítala solo para su lista de firmas de auditoría, no para su cronología."  # @src=1492b97e46e4
              d:
                # | Only the date is wrong; the Agent Registry, AgentIdentity plugin and
                # | is_agent field do add up to a shipped standard.
                label: "Solo la fecha está mal; el Agent Registry, el plugin AgentIdentity y el campo is_agent sí suman un estándar ya lanzado."  # @src=43d012fd4823
                # | Three pieces of plumbing are not convergence. A nullable boolean on a
                # | read interface is what an early field looks like, and its semantics can
                # | still move under you.
                feedback: "Tres piezas de plomería no son convergencia. Un booleano nullable en una interfaz de lectura es lo que parece un campo temprano, y su semántica todavía puede moverse debajo de ti."  # @src=9f560d983128
  m10-l1-capstone-choose-primitive:
    # | Capstone: choose your primitive and wire the economy
    title: "Capstone: elige tu primitiva y conecta la economía"  # @src=8ef4a63f1f48
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Your brief is a regulated payment token that must stay tradeable on Raydium
            # | AND let compliance freeze a bad actor. Which primitive choice is defensible?
            prompt: "Tu brief es un token de pago regulado que tiene que seguir siendo negociable en Raydium Y dejar que el equipo de cumplimiento congele a un mal actor. ¿Qué elección de primitiva es defendible?"  # @src=07be5b1c79a9
            # | The compatibility thesis decides this brief: fee, display, and accounting
            # | extensions get whitelisted, power extensions get refused — and the one-liner
            # | must never contain the word compliance, because compliance-shaped extensions
            # | like PermanentDelegate are exactly the powers the allowlist refuses. The
            # | freeze itself needs no extension at all: it is the mint's base-layer freeze
            # | authority, a day-one field on every mint, which is why it costs nothing on
            # | the allowlist. PermanentDelegate is the clawback power, and keeping it while
            # | staying routable on Raydium means the static MINT_WHITELIST path that
            # | regulated stablecoins use; otherwise you ship display-only extensions and
            # | enforce compliance off the DEX.
            explanation: "La tesis de compatibilidad decide este brief: las extensiones de comisión, de visualización y de contabilidad entran en la allowlist, las extensiones de poder quedan rechazadas — y el resumen de una línea nunca debe contener la palabra compliance, porque las extensiones con forma de compliance como PermanentDelegate son exactamente los poderes que la allowlist rechaza. El congelamiento en sí no necesita ninguna extensión: es la autoridad de congelamiento de la capa base del mint, un campo del día uno en todo mint, que es por lo que no cuesta nada en la allowlist. PermanentDelegate es el poder de confiscación, y quedárselo mientras sigues siendo enrutable en Raydium significa la ruta estática de MINT_WHITELIST que usan las stablecoins reguladas; si no, entregas extensiones solo de visualización e impones el compliance fuera del DEX."  # @src=9d36f6f1243b
            options:                 # source order — keep it
              b:
                # | Token-2022 with PermanentDelegate + TransferHook so compliance can
                # | freeze bad actors and screen every transfer against a sanctions list,
                # | since CP-Swap routes Token-2022 like classic SPL
                label: "Token-2022 con PermanentDelegate + TransferHook para que el equipo de cumplimiento pueda congelar a los malos actores y filtrar cada transferencia contra una lista de sanciones, ya que CP-Swap enruta Token-2022 igual que SPL clásico"  # @src=147d08b0b77c
                # | Raydium's CP-Swap allowlist is exactly five extensions and explicitly
                # | rejects TransferHook and PermanentDelegate; a non-whitelisted mint
                # | carrying them reverts pool creation.
                feedback: "La allowlist de CP-Swap de Raydium son exactamente cinco extensiones y rechaza explícitamente TransferHook y PermanentDelegate; un mint que no esté en la whitelist y los lleve hace revertir la creación del pool."  # @src=9ee44c86c20b
              d:
                # | Copy PYUSD and arm PermanentDelegate plus TransferHook at mint while
                # | leaving both switched off, since a dormant power extension gives a
                # | permissionless pool nothing to object to at pool creation
                label: "Copiar PYUSD y armar PermanentDelegate más TransferHook en el mint dejando los dos apagados, ya que una extensión de poder dormida no le da a un pool sin permiso nada que objetar en la creación del pool"  # @src=1593cd61e28c
                # | The allowlist reads the extension type, not your intentions: a dormant
                # | permanent delegate is refused exactly like a live one. PYUSD trades
                # | anyway because it took a business route a course token does not have.
                feedback: "La allowlist lee el tipo de extensión, no tus intenciones: un delegado permanente dormido queda rechazado exactamente igual que uno vivo. PYUSD se negocia igual porque tomó una ruta de negocios que un token de curso no tiene."  # @src=e12e061e0080
              c:
                # | A Metaplex Core asset with a Freeze delegate plugin, since that is the
                # | cheapest way to get a compliance freeze on a token
                label: "Un activo de Metaplex Core con un plugin Freeze delegate, ya que esa es la forma más barata de conseguir un congelamiento de compliance en un token"  # @src=69c03e8181ce
                # | Core assets are NFTs, not fungible tokens; a divisible payment token
                # | needs a fungible mint, which Core does not provide.
                feedback: "Los activos Core son NFT, no tokens fungibles; un token de pago divisible necesita un mint fungible, que Core no provee."  # @src=1a2a65ebd8dc
              a:
                # | Token-2022 with display extensions (MetadataPointer + TokenMetadata)
                # | plus a TransferFeeConfig armed at 0 bps, keeping the mint's base-layer
                # | freeze authority for the compliance freeze
                label: "Token-2022 con extensiones de visualización (MetadataPointer + TokenMetadata) más un TransferFeeConfig armado en 0 bps, conservando la autoridad de congelamiento de la capa base del mint para el congelamiento de compliance"  # @src=d481351033a7
                # | The freeze needs no extension at all: it is a day-one field on every
                # | mint, which is why it costs nothing on the allowlist. Note the fee is
                # | armed at 0 bps and withholds nothing until you raise it, and if
                # | compliance also needs PermanentDelegate clawback the route is Raydium's
                # | hardcoded MINT_WHITELIST, not a smaller extension set.
                feedback: "El congelamiento no necesita ninguna extensión: es un campo del día uno en todo mint, que es por lo que no cuesta nada en la allowlist. Ten en cuenta que la comisión está armada en 0 bps y no retiene nada hasta que la subas, y si el equipo de cumplimiento también necesita la confiscación de PermanentDelegate, la ruta es la MINT_WHITELIST hardcodeada de Raydium, no un conjunto de extensiones más chico."  # @src=fac409edcaa1
          q2:
            # | The musician's-drop brief wants a print run where each piece is numbered and
            # | the creator's cut still means something in 2026. Which primitive fits?
            prompt: "El brief del drop del músico quiere una tirada de impresiones donde cada pieza esté numerada y la tajada del creador todavía signifique algo en 2026. ¿Qué primitiva calza?"  # @src=202e3a5c0159
            # | The 2026 ship-path for new NFT work is Metaplex Core; the Edition plugin
            # | gives numbered prints and the Royalties plugin carries the configuration.
            # | This is exactly the worked edition step from the Core lesson, which is why
            # | the brief points here.
            explanation: "La ruta de entrega de 2026 para trabajo nuevo de NFT es Metaplex Core; el plugin Edition da impresiones numeradas y el plugin Royalties lleva la configuración. Este es exactamente el paso de edición resuelto de la lección de Core, que es por lo que el brief apunta hacia aquí."  # @src=40e91a127b25
            options:                 # source order — keep it
              c:
                # | A pNFT through Token Metadata with a Token Auth Rules rule set, since
                # | pNFTs were purpose-built to enforce royalties at transfer time
                label: "Un pNFT a través de Token Metadata con un rule set de Token Auth Rules, ya que los pNFTs se diseñaron a propósito para imponer regalías en el momento de la transferencia"  # @src=c5664cc498ab
                # | Token Metadata is officially legacy and pNFT enforcement runs through
                # | Token Auth Rules, which Metaplex marks Deprecated and whose flagship
                # | rule set blocks zero programs. You would ship a deprecated stack for
                # | enforcement that is armed but idle.
                feedback: "Token Metadata es oficialmente legacy y la imposición en pNFT corre a través de Token Auth Rules, que Metaplex marca como Deprecated y cuyo rule set emblemático bloquea cero programas. Entregarías un stack deprecado para una imposición que está armada pero ociosa."  # @src=224effd8a5a7
              a:
                # | A classic SPL mint with seller_fee_basis_points set on it, plus an
                # | edition counter you keep
                label: "Un mint de SPL clásico con seller_fee_basis_points configurado en él, más un contador de ediciones que mantienes tú"  # @src=4a7b9f520862
                # | Classic SPL has no metadata or royalty fields at all;
                # | seller_fee_basis_points lives in Token Metadata and is purely indicative
                # | even there.
                feedback: "SPL clásico no tiene ningún campo de metadatos ni de regalías; seller_fee_basis_points vive en Token Metadata y hasta ahí es puramente indicativo."  # @src=f9d44ff27d4e
              d:
                # | Bubblegum v2 cNFTs, since compression is the 2026 default for any NFT
                # | drop of this shape
                label: "cNFTs de Bubblegum v2, ya que la compresión es lo que viene por defecto en 2026 para cualquier drop de NFT de esta forma"  # @src=9eec65fcffdd
                # | Compression pays when the count is large and the write rate is low. A
                # | numbered print run with a royalty split is the shape the course
                # | deliberately kept on Core accounts.
                feedback: "La compresión rinde cuando la cantidad es grande y la tasa de escritura es baja. Una tirada de impresiones numerada con un reparto de regalías es la forma que el curso dejó deliberadamente en cuentas Core."  # @src=5c88a176edd2
              b:
                # | A Metaplex Core collection with the Royalties plugin and numbered prints
                # | via the Edition plugin
                label: "Una colección de Metaplex Core con el plugin Royalties e impresiones numeradas vía el plugin Edition"  # @src=3a6a7d4e8b13
                # | Royalties is authority-managed, so it survives every resale rather than
                # | being revoked on transfer, and the collection's MasterEdition carries
                # | the cap each print's Edition number reads against.
                feedback: "Royalties lo gestiona la autoridad, así que sobrevive a cada reventa en vez de quedar revocado en la transferencia, y el MasterEdition de la colección lleva el tope contra el que lee el número de Edition de cada impresión."  # @src=56a4a2faf791
          q3:
            # | You shipped a cNFT loot drop, but your verification script's getAsset call
            # | fails against the endpoint you pointed it at. What is the most likely cause?
            prompt: "Entregaste un loot drop de cNFT, pero la llamada getAsset de tu script de verificación falla contra el endpoint al que lo apuntaste. ¿Cuál es la causa más probable?"  # @src=8528f96ebee7
            # | A cNFT's on-chain footprint is a Merkle leaf hash; the full asset is
            # | reconstructed by DAS indexers from off-chain data stores. A verification
            # | script pointed at a non-DAS RPC fails outright — your challenge run's
            # | JSON-RPC method-not-found throw — which is why the integration proof depends
            # | on a DAS endpoint.
            explanation: "La huella on-chain de un cNFT es un hash de hoja de Merkle; el activo completo lo reconstruyen los indexadores DAS a partir de almacenes de datos off-chain. Un script de verificación apuntado a un RPC sin DAS falla de plano — el throw de método-no-encontrado de JSON-RPC de tu corrida del challenge — que es por lo que la demostración de integración depende de un endpoint DAS."  # @src=7e8aa7de3e21
            options:                 # source order — keep it
              b:
                # | The memo declared the wrong extension set for the asset
                label: "El memo declaró el conjunto de extensiones equivocado para el activo"  # @src=154509d5342a
                # | Extension state applies to fungible Token-2022 mints, not to a
                # | compressed-NFT leaf; it has no bearing on whether getAsset resolves.
                feedback: "El estado de extensiones aplica a mints fungibles de Token-2022, no a una hoja de NFT comprimido; no tiene nada que ver con si getAsset resuelve."  # @src=c9411fa3a9ff
              d:
                # | The asset id was derived from the wrong leaf index, so nothing exists at
                # | that id
                label: "El id del activo se derivó del índice de hoja equivocado, así que no existe nada en ese id"  # @src=148e9ab70558
                # | That would return an empty result from a DAS endpoint, not a failed
                # | call. The asset id is a deterministic PDA over the tree and leaf index,
                # | so it is worth re-deriving, but it is not what breaks the call.
                feedback: "Eso devolvería un resultado vacío desde un endpoint DAS, no una llamada fallida. El id del activo es una PDA determinista sobre el árbol y el índice de hoja, así que vale la pena volver a derivarlo, pero no es lo que rompe la llamada."  # @src=2a04fa211f31
              c:
                # | You are querying an RPC without DAS support, and cNFT reads require a
                # | DAS-supporting RPC
                label: "Estás consultando un RPC sin soporte DAS, y las lecturas de cNFT requieren un RPC con soporte DAS"  # @src=84da9dfd4787
                # | The tell is the error shape: a plain endpoint answers -32601 method not
                # | found. Worse is a provider that swallows it into an empty result, which
                # | is why your reader fails loudly on that code.
                feedback: "La señal es la forma del error: un endpoint común responde -32601 method not found. Peor es un proveedor que se lo traga y lo convierte en un resultado vacío, que es por lo que tu lector falla ruidosamente ante ese código."  # @src=d7c112f2bc73
              a:
                # | The cNFT was never minted, because a valid cNFT always resolves on any
                # | RPC
                label: "El cNFT nunca se acuñó, porque un cNFT válido siempre resuelve en cualquier RPC"  # @src=1aff78cdf629
                # | cNFT data lives off-chain in RPC-managed data stores; even a validly
                # | minted cNFT cannot resolve through a plain RPC, so the failure proves
                # | nothing about the mint.
                feedback: "Los datos de un cNFT viven off-chain en almacenes de datos administrados por el RPC; incluso un cNFT acuñado válidamente no puede resolver a través de un RPC común, así que la falla no demuestra nada sobre el mint."  # @src=dc1fd17968d8
  m10-l2-cumulative-checkpoint-close:
    # | Cumulative checkpoint and close
    title: "Checkpoint acumulativo y cierre"  # @src=466bda36c9d2
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Cold brief: a cafe loyalty currency that must stay tradeable on Raydium,
            # | with no compliance controls needed. What is the defensible cold decision?
            prompt: "Brief en frío: una moneda de lealtad de cafetería que tiene que seguir siendo negociable en Raydium, sin necesidad de controles de compliance. ¿Cuál es la decisión en frío defendible?"  # @src=afa62e71ab8f
            # | With no compliance need and a hard tradeability requirement, the thesis
            # | points straight at display-only extensions: they get whitelisted, they add
            # | native metadata, and they keep the token on the allowlist. This is the
            # | checkpoint's simplest row, and getting it cold confirms the compatibility
            # | model transferred.
            explanation: "Sin necesidad de compliance y con un requisito duro de negociabilidad, la tesis apunta directo a las extensiones de solo display: entran en la whitelist, agregan metadatos nativos, y mantienen al token en la allowlist. Esta es la fila más simple del checkpoint, y sacarla en frío confirma que el modelo de compatibilidad se transfirió."  # @src=a6939efaff2f
            options:                 # source order — keep it
              b:
                # | A classic SPL mint, because a loyalty currency cannot use Token-2022
                # | without inviting extension risk it does not need
                label: "Un mint SPL clásico, porque una moneda de lealtad no puede usar Token-2022 sin invitar riesgo de extensiones que no necesita"  # @src=171a07221dc9
                # | Token-2022 is a superset of classic SPL; display-only extensions are
                # | exactly what keep a token both featureful and routable. Classic SPL
                # | would work but forgoes native metadata for no reason.
                feedback: "Token-2022 es un superconjunto de SPL clásico; las extensiones de solo display son exactamente lo que mantiene a un token a la vez con funcionalidades y enrutable. SPL clásico funcionaría pero renuncia a los metadatos nativos sin razón."  # @src=12dc5688d3f9
              d:
                # | Token-2022 with MetadataPointer, TokenMetadata and a PermanentDelegate
                # | for clawbacks, which is still only three of the five allowlist slots
                label: "Token-2022 con MetadataPointer, TokenMetadata y un PermanentDelegate para clawbacks, que sigue siendo solo tres de los cinco slots de la allowlist"  # @src=e170013ed4a6
                # | The rule is every, not some. Two allowlisted extensions beside one
                # | refused extension is still refused, because the pool's exposure to a
                # | delegate that can sweep its vault does not shrink when a metadata
                # | pointer sits next to it.
                feedback: "La regla es every, no some. Dos extensiones de la allowlist al lado de una extensión rechazada siguen rechazadas, porque la exposición del pool a un delegado que puede barrer su vault no se encoge cuando un puntero de metadatos se sienta al lado."  # @src=1384e7d56595
              c:
                # | Token-2022 with a TransferHook that logs every loyalty transfer
                # | on-chain, plus MetadataPointer and TokenMetadata.
                label: "Token-2022 con un TransferHook que registra cada transferencia de lealtad on-chain, más MetadataPointer y TokenMetadata."  # @src=267d00a9dfde
                # | TransferHook is a power extension Raydium rejects; a currency that must
                # | stay tradeable cannot carry it unless the mint is whitelisted.
                feedback: "TransferHook es una extensión de poder que Raydium rechaza; una moneda que tiene que seguir siendo negociable no puede llevarla a menos que el mint esté en la whitelist."  # @src=8ac0fa41c2ea
              a:
                # | Token-2022 with display-only extensions (MetadataPointer +
                # | TokenMetadata), no power extensions, so it stays on Raydium's
                # | five-extension allowlist
                label: "Token-2022 con extensiones de solo display (MetadataPointer + TokenMetadata), sin extensiones de poder, así que se queda en la allowlist de cinco extensiones de Raydium"  # @src=99de23a27a0f
                # | Cold decisions are the ones you make before a brief tempts you. No
                # | compliance requirement means no power extension has to be argued for,
                # | and the token stays routable by construction.
                feedback: "Las decisiones en frío son las que tomas antes de que un brief te tiente. Ningún requisito de compliance quiere decir que no hay que argumentar por ninguna extensión de poder, y el token se queda enrutable por construcción."  # @src=35c62c9e8360
          q2:
            # | In the close you place each refused topic with its sibling course. Which
            # | course carries 'how a live RWA issuer structures compliance rails and KYC'?
            prompt: "En el cierre colocas cada tema rechazado con su curso hermano. ¿Qué curso lleva 'cómo un emisor de RWA vivo estructura los rieles de compliance y el KYC'?"  # @src=11eb1bb6095d
            # | This course teaches the compliance-shaped primitives (freeze, permanent
            # | delegate, default-frozen, hooks) but deliberately refuses the legal and
            # | issuer framing. That RWA-specific issuance and compliance work is the
            # | planned DeFi and RWA Engineering course's territory, and it builds directly
            # | on the primitives taught here.
            explanation: "Este curso enseña las primitivas con forma de compliance (congelamiento, delegado permanente, congelado por defecto, hooks) pero rechaza deliberadamente el encuadre legal y de emisor. Ese trabajo de emisión y compliance específico de RWA es territorio del curso planificado DeFi and RWA Engineering, y se construye directo sobre las primitivas que se enseñan aquí."  # @src=31f8e2df55e9
            options:                 # source order — keep it
              b:
                # | The planned DeFi and RWA Engineering course, where RWA issuance and the
                # | compliance rails around it live
                label: "El curso planificado DeFi and RWA Engineering, donde viven la emisión de RWA y los rieles de compliance a su alrededor"  # @src=2aaad5b4df5c
                # | Everything it assumes on the token layer is what you just built, which
                # | is why the hand-off is a front door rather than a window.
                feedback: "Todo lo que asume en la capa de tokens es lo que acabas de construir, que es por qué el traspaso es una puerta principal y no una ventana."  # @src=bd8f28c8b5bb
              c:
                # | The Master Anchor V2 course, since compliance rails come down to program
                # | constraints and CPI
                label: "El curso Master Anchor V2, ya que los rieles de compliance se reducen a constraints de programa y CPI"  # @src=da9a00460824
                # | That course owns the Anchor framework layer (macros, constraints, CPI,
                # | testing), not RWA compliance rails.
                feedback: "Ese curso es dueño de la capa del framework de Anchor (macros, constraints, CPI, pruebas), no de los rieles de compliance de RWA."  # @src=b313052c4d64
              d:
                # | This course already covered it: the compliance-shaped extension set and
                # | a live issuer's dormant powers are that framing, so no sibling course is
                # | needed
                label: "Este curso ya lo cubrió: el conjunto de extensiones con forma de compliance y los poderes dormidos de un emisor vivo son ese encuadre, así que no hace falta ningún curso hermano"  # @src=06ab1e6145d4
                # | This course taught you to read a compliance-shaped mint and refused the
                # | legal and issuer framing that turns one into a regulated instrument.
                # | Reading PYUSD is not structuring an issuance.
                feedback: "Este curso te enseñó a leer un mint con forma de compliance y rechazó el encuadre legal y de emisor que convierte uno en un instrumento regulado. Leer PYUSD no es estructurar una emisión."  # @src=0853a12008f8
              a:
                # | The planned Client-Side Mastery course, since KYC checks and compliance
                # | screens ultimately run in the client and indexing layer the user touches
                label: "El curso planificado Client-Side Mastery, ya que las revisiones de KYC y los filtros de compliance al final corren en la capa de cliente e indexación que toca el usuario"  # @src=0e89cd1cfc50
                # | That course owns indexing infrastructure and transaction-landing, not
                # | RWA issuance or compliance framing.
                feedback: "Ese curso es dueño de la infraestructura de indexación y del aterrizaje de transacciones, no de la emisión de RWA ni del encuadre de compliance."  # @src=baca7cda6890
          q3:
            # | A checkpoint brief asks for a soulbound achievement badge minted to a
            # | million holders cheaply. Which taught primitive fits, and what makes the
            # | answer a 2026 answer?
            prompt: "Un brief del checkpoint pide una insignia de logro soulbound acuñada barato para un millón de tenedores. ¿Qué primitiva enseñada encaja, y qué hace que la respuesta sea una respuesta de 2026?"  # @src=7327100f1bb7
            # | The brief combines two constraints, soulbound AND mass-mint-cheap, that only
            # | compression satisfies together. Bubblegum v2's set_non_transferable_v2 is
            # | exactly the new capability, and naming why it is current (it overturns the
            # | 2024 folklore) is what the close is training you to see.
            explanation: "El brief combina dos restricciones, soulbound Y acuñado-masivo-barato, que solo la compresión satisface juntas. El set_non_transferable_v2 de Bubblegum v2 es exactamente la capacidad nueva, y nombrar por qué es actual (revierte el folclore de 2024) es lo que el cierre te está entrenando a ver."  # @src=af772cfacba5
            options:                 # source order — keep it
              c:
                # | A Bubblegum v2 cNFT with set_non_transferable_v2; soulbound compressed
                # | NFTs are new in v2 and contradict the 2024 'cNFTs can't be soulbound'
                # | folklore
                label: "Un cNFT de Bubblegum v2 con set_non_transferable_v2; los NFT comprimidos soulbound son nuevos en v2 y contradicen el folclore de 2024 de que 'los cNFTs no pueden ser soulbound'"  # @src=37cb772df47b
                # | Soulbound is bit 2 of the v2 leaf's flags byte, authorised by a
                # | PermanentFreezeDelegate on the tree's Core collection. Cheap at a
                # | million and non-transferable, which V1 could not do.
                feedback: "Soulbound es el bit 2 en el byte de flags de la hoja v2, autorizado por un PermanentFreezeDelegate en la colección Core del árbol. Barato a un millón y no transferible, que es lo que V1 no podía hacer."  # @src=ea5ae72b0748
              a:
                # | A Token-2022 NonTransferable fungible mint, because soulbound has long
                # | been a fungible-only pattern
                label: "Un mint fungible NonTransferable de Token-2022, porque soulbound ha sido por mucho tiempo un patrón solo para fungibles"  # @src=31ce14b9c46a
                # | NonTransferable does make a soulbound fungible, but 'a million cheap
                # | badges' is a mass-mint NFT problem, not a fungible-supply one.
                feedback: "NonTransferable sí hace un fungible soulbound, pero 'un millón de insignias baratas' es un problema de NFT de acuñado masivo, no uno de supply fungible."  # @src=6f0185e3654e
              b:
                # | A Metaplex Core asset with PermanentFreeze on every badge, because Core
                # | is the only soulbound path there is
                label: "Un activo de Metaplex Core con PermanentFreeze en cada insignia, porque Core es el único camino soulbound que existe"  # @src=43801c0be975
                # | Core soulbound works for individual assets but is not the
                # | cheap-at-a-million answer; minting a million assets cheaply is
                # | compression's job.
                feedback: "El soulbound de Core funciona para activos individuales pero no es la respuesta barata-a-un-millón; acuñar un millón de activos barato es trabajo de la compresión."  # @src=5865c45c6f8c
              d:
                # | A Bubblegum V1 tree, since compression is the cheap path and a V1 leaf
                # | has no transfer instruction to call, which makes it soulbound by
                # | omission anyway
                label: "Un árbol Bubblegum V1, ya que la compresión es el camino barato y una hoja V1 no tiene instrucción de transferencia que llamar, lo que la hace soulbound por omisión de todos modos"  # @src=b3f955a6891d
                # | V1 leaves transfer fine and carry no flags byte at all, and they are not
                # | upgradeable into v2, so a V1 tree is the one shape that gets the
                # | cheapness and loses the property you needed.
                feedback: "Las hojas V1 se transfieren sin problema y no llevan ningún byte de flags, y no se pueden actualizar a v2, así que un árbol V1 es la única forma que consigue lo barato y pierde la propiedad que necesitabas."  # @src=95b6291eb3e2
