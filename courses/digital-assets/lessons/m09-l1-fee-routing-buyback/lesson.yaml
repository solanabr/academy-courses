blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: route-fees
    type: code
    language: typescript
    starter: route-fees/starter.ts
    solution: route-fees/solution.ts
    tests: route-fees/tests.json
    hints:
      - "Subtract the burned share from the harvest to get toTreasury."
      - "Buyback tokens = treasurySol / priceLamportsPerToken, floored on bigints."
      - "burnedFromFees + toTreasury must always equal harvested."
  - key: check
    type: quiz
    questions:
      - id: m09l1-q1-where-fees-go
        prompt: "Your Overgrowth marketplace charges a 1% Token-2022 transfer fee on SPROUT trades. A week in, your treasury PDA balance is still zero, but transfers are clearly paying the fee. What happened?"
        multiSelect: false
        options:
          - id: a
            label: "The fee was never configured: a Token-2022 transfer fee needs a creator_vault set at mint creation, the way pump.fun does it."
            correct: false
            feedback: "That conflates two models. pump.fun's creator_vault is a program-side fee account; Token-2022 transfer fees don't use it. The fee IS being collected; you just looked in the wrong place."
          - id: b
            label: "Token-2022 burns transfer fees automatically at transfer time, deflating supply on every trade, so no treasury is ever supposed to receive them."
            correct: false
            feedback: "Token-2022 never burns fees automatically; it withholds them. Nothing is destroyed: the tokens are sitting on recipient accounts waiting to be harvested."
          - id: c
            label: "The fees are withheld on the recipients' token accounts; the treasury sees nothing until you harvest and withdraw."
            correct: true
        explanation: "Token-2022 transfer fees accrue WITHHELD on each recipient's token account. Routing them anywhere requires the harvest crank: harvest_withheld_tokens_to_mint, then withdraw to the treasury. That's the first leg of the rail, and exactly the mechanic you built back in the economics-extensions lesson."
      - id: m09l1-q2-buyback-scope
        prompt: "You wire the treasury to buy SPROUT back and burn it. In this course, how is that buyback executed?"
        multiSelect: false
        options:
          - id: a
            label: "As a client-side swap (treasury SOL to SPROUT) against SPROUT's own DAMM v2 graduation pool, then a burn."
            correct: true
          - id: b
            label: "By deploying a custom constant-product AMM pool with treasury-owned LP positions, so the treasury controls its own liquidity, routing, and slippage."
            correct: false
            feedback: "Pool composition, routing, and LP strategy are the DeFi & RWA Engineering course's material. This course does a client-side swap against a venue it already stood up, and teaches no AMM design."
          - id: c
            label: "By calling harvest_withheld_tokens_to_mint a second time, which converts withheld fees directly into a burn."
            correct: false
            feedback: "Harvest only moves withheld fees to the mint; it doesn't swap SOL for tokens or burn anything. The buyback is a separate swap-then-burn on the venue."
        explanation: "The buyback leg is deliberately scoped to a client-side swap against the DAMM v2 pool SPROUT's Meteora DBC launch migrated into (the venue the launchpad-landscape decision chose), followed by a burn. One sentence of AMM math is used; none is taught. The depth lives in the DeFi & RWA Engineering course."
      - id: m09l1-q3-conservation
        prompt: "In the fee-split challenge you harvest 1,000,000 base units of SPROUT with a 20% burn share, and separately hold treasury SOL for the buyback. Which invariant must your function preserve?"
        multiSelect: false
        options:
          - id: a
            label: "The buyback token amount must equal the burned-from-fees amount, or supply isn't conserved."
            correct: false
            feedback: "Those are two independent legs: the fee-burn and the SOL-funded buyback-burn. They needn't be equal; conservation is about the fee split summing back to the harvest."
          - id: b
            label: "burnedFromFees + toTreasury must equal the harvested amount; the split creates and destroys nothing."
            correct: true
          - id: c
            label: "toTreasury must equal the full harvested amount, since the burning happens later at the venue."
            correct: false
            feedback: "If toTreasury equalled the whole harvest you'd have double-counted the burned share. The split must sum to the harvest, not ignore the burn."
        explanation: "The split is a conservation law: whatever you burn from fees plus whatever stays in the treasury has to add up to exactly what you harvested. The buyback is funded from SOL and is a separate leg; sizing it is a floor-division on price, not a mirror of the fee burn."
