id: lesson-date-m08-l3-airdrops-at-scale
slug: m08-l3-airdrops-at-scale
title: "Airdrops at scale: cost engineering & vesting claims"
skills:
  - solana-fundamentals
  - transactions
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m08l3-q1-100k-cost
        prompt: "Your cost table shows classic ATAs at ≈204 SOL for 100,000 recipients. What is the compressed figure and the saving?"
        multiSelect: false
        options:
          - id: a
            label: "≈20 SOL, about 90% saved."
            correct: false
            feedback: "20 SOL is roughly the CLASSIC 10k-recipient figure; you are off by a method and a scale. Compressed is far cheaper."
          - id: b
            label: "≈10.3 SOL, about 95% saved, since compressed state still pays roughly a tenth of classic rent per recipient."
            correct: false
            feedback: "10.3 SOL is the per-1M compressed extrapolation, not the 100k figure. At 100k it is ten times less."
          - id: c
            label: "≈1.03 SOL, about 99.5% saved (≈10,300 lamports/recipient vs ≈2.04M)."
            correct: true
        explanation: "Per recipient: a classic ATA is ≈2,039,280 lamports; a compressed recipient ≈10,300. At 100k that is ≈204 SOL vs ≈1.03 SOL, a ~99.5% cut. Doing this arithmetic live is what makes a mass airdrop a budget line rather than a fantasy."
      - id: m08l3-q2-airship-discrepancy
        prompt: "AirShip's marketing says a 10k-recipient drop costs 0.01 SOL; the zkcompression per-recipient math gives 0.103 SOL (a 10x gap). How do you handle it in the lab?"
        multiSelect: false
        options:
          - id: a
            label: "Measure it in the lab and report the measured number; the discrepancy is a scope difference, not a fact to cite."
            correct: true
          - id: b
            label: "Cite AirShip's 0.01 SOL, since the tool's vendor knows its own costs best."
            correct: false
            feedback: "Vendor marketing numbers often quote a narrower scope; the course's rule is to measure disputed figures, not repeat them."
          - id: c
            label: "Average the two to 0.05 SOL and move on."
            correct: false
            feedback: "Averaging two numbers measured over different scopes produces a third meaningless number. Measurement, not arithmetic on marketing, resolves it."
        explanation: "A 10x gap between a vendor claim and first-party math is almost always a scope difference (what's counted as cost). The honest move is to measure it in your own lab and teach the method; the disputed number is never the load-bearing fact."
      - id: m08l3-q3-vesting-primitive
        prompt: "You need a subset of airdrop recipients to vest linearly instead of claiming everything at once. Which primitive do you reach for?"
        multiSelect: false
        options:
          - id: a
            label: "A second SPL mint whose freeze authority sits behind a timelock, thawing each recipient's token account as its schedule matures."
            correct: false
            feedback: "Freeze authority is all-or-nothing and manual; it does not express a per-recipient linear vesting schedule the way a distributor does."
          - id: b
            label: "The Jito-style merkle distributor's claim_locked path: unlocked plus linearly-vesting portions in one distributor."
            correct: true
          - id: c
            label: "Compressed tokens automatically vest by epoch."
            correct: false
            feedback: "Compression is a storage optimization; it has no vesting semantics of its own."
        explanation: "The Jito distributor (the one the JTO drop used) carries both an unlocked portion and a claim_locked path that releases linearly. That is the vesting primitive to reuse; LaunchLab's cliff+duration knobs are the launchpad-side equivalent from the previous lesson."
      - id: m08l3-q4-stale-proof
        prompt: "A recipient's compressed-token claim transaction fails shortly after the tree received new writes. What is the most likely structural cause?"
        multiSelect: false
        options:
          - id: a
            label: "The DAS RPC rate-limited the proof read."
            correct: false
            feedback: "Rate limits cause read failures, but the tell here is the timing, right after tree writes, which points at proof staleness, not throttling."
          - id: b
            label: "Compressed tokens cannot be claimed more than once by design."
            correct: false
            feedback: "This is a first claim; the failure correlates with tree writes, not a double-claim guard."
          - id: c
            label: "The merkle proof went stale on the tree write; re-fetch the proof before submitting the claim."
            correct: true
        explanation: "Every write to a compression tree changes its root, invalidating outstanding proofs. A claim built against an old proof reverts. The rule is to re-fetch the proof immediately before each write/claim; stale proofs are the classic compressed-airdrop footgun."
