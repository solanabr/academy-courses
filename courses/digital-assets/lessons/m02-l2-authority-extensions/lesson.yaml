id: lesson-date-m02-l2-authority-extensions
slug: m02-l2-authority-extensions
title: "Authority extensions: who can touch your tokens"
skills:
  - account-model
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1-cpiguard-bypass
        prompt: "You enable CpiGuard on a token account to stop programs from moving funds without the owner. The mint also carries PermanentDelegate. A program invokes a transfer through that permanent delegate. What happens?"
        multiSelect: false
        options:
          - id: a
            label: "CpiGuard blocks it; stopping unauthorized CPI moves is exactly its job."
            correct: false
            feedback: "CpiGuard blocks delegate-and-close tricks at the account level, but a permanent delegate is a mint-level power it cannot override."
          - id: b
            label: "The transfer succeeds; PermanentDelegate always bypasses CpiGuard."
            correct: true
          - id: c
            label: "Both are ignored, because a mint extension and an account extension can't interact."
            correct: false
            feedback: "They very much interact: the mint-level delegate acts on the account, and it wins over the account's guard."
        explanation: "PermanentDelegate is the one authority that always bypasses CpiGuard, a mint-level power the account never consented to. This is precisely why Raydium refuses it: 'a holder of the delegate can sweep any token account, including the pool vault.'"
      - id: q2-default-frozen
        prompt: "Your compliance team wants every new holder frozen until KYC clears, and they won't control accounts after launch. Which extension gives you frozen-by-default onboarding?"
        multiSelect: false
        options:
          - id: a
            label: "Pausable, so compliance can pause transfers for each new account individually until that holder's KYC clears."
            correct: false
            feedback: "Pausable is a global switch for the whole mint, not a per-account onboarding gate; flipping it freezes everyone at once."
          - id: b
            label: "MintCloseAuthority, to close and reopen each account after KYC."
            correct: false
            feedback: "MintCloseAuthority closes mints to reclaim rent; it has nothing to do with gating new holders."
          - id: c
            label: "DefaultAccountState set to Frozen, so every new account starts frozen."
            correct: true
        explanation: "DefaultAccountState(Frozen) is the frozen-by-default onboarding primitive: new accounts open frozen and a freeze authority thaws each one after checks. Pausable, by contrast, halts ALL transfers/mints/burns globally in one flip."
      - id: q3-close-revival
        prompt: "You use MintCloseAuthority to close a spent mint and reclaim its rent. What's the footgun you have to guard against?"
        multiSelect: false
        options:
          - id: a
            label: "A closed account can be revived by re-funding it, so you must mark it closed to prevent reuse."
            correct: true
          - id: b
            label: "Closing the mint automatically burns every outstanding token account."
            correct: false
            feedback: "Closing a mint doesn't touch holder accounts; outstanding balances aren't burned by the close."
          - id: c
            label: "The close authority is permanently transferred to the system program."
            correct: false
            feedback: "No authority transfer happens; the account is drained and zeroed, not handed off."
        explanation: "Close-and-revival: an account that's been zeroed and rent-drained can be recreated by anyone who re-funds its address. Mark-closed hygiene (writing a sentinel byte) stops a revived account from being mistaken for fresh, trusted state."
