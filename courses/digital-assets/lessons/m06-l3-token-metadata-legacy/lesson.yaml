id: lesson-date-m06-l3-token-metadata-legacy
slug: m06-l3-token-metadata-legacy
title: "Token Metadata as legacy: pNFTs and the royalty reality"
skills:
  - account-model
  - solana-programs
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m06-l3-token-metadata-legacy-q1
        prompt: "A marketplace lists a legacy NFT with seller_fee_basis_points = 500 and promises a 'guaranteed 5% royalty.' You decode its rule set and every operation is Pass. What's the accurate read?"
        multiSelect: false
        options:
          - id: a
            label: "The 5% is enforced on-chain because seller_fee_basis_points is a protocol-level fee the runtime deducts."
            correct: false
            feedback: "The runtime never deducts seller_fee_basis_points; it's a metadata field, not a fee the protocol collects."
          - id: b
            label: "The 5% is enforced only if the buyer opts in through their wallet's royalty-enforcement setting, which adds an extra instruction routing the fee to the creator list at purchase time."
            correct: false
            feedback: "There's no wallet opt-in mechanism that turns the field into enforcement; enforcement (when it happens) comes from a rule set, which here blocks nothing."
          - id: c
            label: "seller_fee_basis_points is purely indicative; with the flagship rule set passing every operation, nothing on-chain enforces the 5%, and marketplaces choose whether to honor it."
            correct: true
        explanation: "For legacy Token Metadata, seller_fee_basis_points is indicative only. Enforcement would come from a Token Auth Rules RuleSet, but the flagship Metaplex Foundation Rule Set sets all operations to Pass: armed but idle. The royalty is a convention marketplaces may or may not honor, not an on-chain guarantee."
      - id: m06-l3-token-metadata-legacy-q2
        prompt: "Your team needs to integrate an existing pNFT collection AND launch a new royalty-bearing drop. What's the right standards call?"
        multiSelect: false
        options:
          - id: a
            label: "Read-and-integrate against the existing pNFTs (TM/pNFT is legacy but live), and ship the NEW drop on Core plugins or Bubblegum-v2 rulesets; don't mint new pNFTs."
            correct: true
          - id: b
            label: "Mint the new drop as pNFTs too, for consistency with the existing collection."
            correct: false
            feedback: "New pNFTs adopt a deprecated enforcement stack (Token Auth Rules) whose flagship rule enforces nothing; the course teaches TM/pNFT to evaluation depth precisely so you don't ship new ones."
          - id: c
            label: "Migrate the existing pNFTs to Core first so both collections share one standard, then ship everything as pNFTs for compatibility with the tooling most marketplaces already run."
            correct: false
            feedback: "This is self-contradictory and unnecessary: you integrate legacy assets as-is, and new work goes to Core/Bubblegum-v2. You don't convert to Core only to mint pNFTs."
        explanation: "The 2026 stance is asymmetric: Token Metadata is officially legacy, so you must read and integrate against the pNFTs already in the wild, but new-work royalties belong to Core plugins (what you built in m06-l2) or Bubblegum-v2 rulesets (m07-l1). Legacy is a thing you consume, not a thing you newly ship."
      - id: m06-l3-token-metadata-legacy-q3
        prompt: "The docs page lists 5 TokenStandard variants; the code enum has 6 (it adds ProgrammableNonFungibleEdition). Which do you build your integration against, and why?"
        multiSelect: false
        options:
          - id: a
            label: "The docs' 5 variants, because published docs are the canonical contract for an integration."
            correct: false
            feedback: "For a legacy, lightly-maintained standard the docs lag the code; building against 5 variants means an asset of the 6th variant surprises you at runtime."
          - id: b
            label: "The code's 6 variants: for a legacy standard the docs lag the source, and an asset can carry the 6th (ProgrammableNonFungibleEdition) variant you'd otherwise fail to handle."
            correct: true
          - id: c
            label: "Neither; TokenStandard is deprecated, so you can ignore the variant entirely."
            correct: false
            feedback: "You still have to read the variant to integrate legacy assets correctly; 'legacy' means you consume it, not that you can ignore its shape."
        explanation: "Token Metadata is in maintenance mode, so its docs page trails its source. The code enum carries 6 variants, adding ProgrammableNonFungibleEdition; an integration that only knows the documented 5 mishandles the sixth. When docs and code disagree on a legacy standard, the code is the truth you integrate against."
