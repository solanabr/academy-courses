id: lesson-date-m04-l1-confidential-model
slug: m04-l1-confidential-model
title: "The confidential model: encrypted balances on a public chain"
skills:
  - transactions
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m04l1-q1
        prompt: "You send 5 SPROUT confidentially to a teammate. Which statement about that on-chain transfer is TRUE?"
        multiSelect: false
        options:
          - id: a
            label: "The amount is encrypted, but your address and the recipient's address are still public on-chain."
            correct: true
          - id: b
            label: "Both the amount and the two wallet addresses are hidden from everyone, including validators, who verify the transfer purely against its zero-knowledge proofs."
            correct: false
            feedback: "Confidential transfers hide the amount only. The sender and receiver pubkeys, and the fact that a transfer happened, stay fully public. Encrypted is not anonymous."
          - id: c
            label: "The amount stays public but the two wallet identities are encrypted."
            correct: false
            feedback: "It's the reverse. Token-2022 confidential transfers encrypt the amount, never the identities: addresses are always visible."
        explanation: "The confidential-transfer extension encrypts the transferred amount under Twisted ElGamal. It does nothing to hide who is transacting: both pubkeys and the transaction itself remain on the public ledger. Confidentiality of amounts is a different property from anonymity of participants."
      - id: m04l1-q2
        prompt: "A confidential transfer submits three zero-knowledge proofs. Which trio matches what Token-2022 actually verifies?"
        multiSelect: false
        options:
          - id: a
            label: "A signature proof, a Merkle inclusion proof against the account's state root, and a nonce-freshness proof that prevents replay of earlier transfers."
            correct: false
            feedback: "None of those are part of the confidential-transfer flow; that's a mix of unrelated primitives from signatures and state compression."
          - id: b
            label: "An equality proof, a grouped-ciphertext validity proof (including the auditor ciphertext), and a range proof."
            correct: true
          - id: c
            label: "A range proof, a hash-preimage proof, and a stake-weight proof."
            correct: false
            feedback: "Only the range proof belongs here; hash-preimage and stake-weight proofs are not part of the confidential-transfer proof set."
        explanation: "The three proofs are CiphertextCommitmentEqualityProof (the debit and the new balance commit to the same value), BatchedGroupedCiphertext3HandlesValidityProof (the amount is correctly encrypted under sender, receiver, and the optional auditor), and BatchedRangeProofU128 (the amount is in range). All three are checked by the ZK ElGamal Proof Program (SIMD-0153)."
      - id: m04l1-q3
        prompt: "Why does a single confidential transfer take several dependent transactions today, rather than one?"
        multiSelect: false
        options:
          - id: a
            label: "Because the ZK ElGamal Proof Program is deployed only on devnet, so mainnet has to route through extra hops."
            correct: false
            feedback: "The proof program is a real on-chain component, not a devnet-only stub. The multi-transaction reality is about proof SIZE, not deployment location."
          - id: b
            label: "Because each confidential transfer must wait a full epoch for the auditor to approve it."
            correct: false
            feedback: "There is no per-transfer epoch wait or auditor approval step. The auditor merely receives its own encrypted copy of the amount; it does not gate the transfer."
          - id: c
            label: "Because the zero-knowledge proofs are too large to fit alongside the transfer in one transaction; transaction format v1 is meant to relax this but is not activated yet."
            correct: true
        explanation: "The proofs exceed what fits beside the transfer in a single transaction, so the flow is split across dependent transactions (create context accounts, verify proofs, apply). Transaction format v1 (SIMD-0296 / SIMD-0385) is designed to collapse this to one transaction but is shipped-but-not-activated. Re-probe its gate status at write time."
