id: lesson-date-m09-l2-gating-migrations
slug: m09-l2-gating-migrations
title: "Gating & points-to-token migrations: wiring the whole economy"
skills:
  - transactions
  - rpc-reads
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m09l2-q1-gate-trust
        prompt: "The alpha channel gates on holding a Founding-Farmer cNFT. A user's client sends a signed message saying 'I hold it.' How should your gate decide?"
        multiSelect: false
        options:
          - id: a
            label: "Accept the wallet-signed message: a valid signature over the gate's challenge nonce proves the wallet controls its keys and therefore holds the badge."
            correct: false
            feedback: "A signature proves control of the keypair, not that the wallet currently holds a specific cNFT. Holdings must be read from the chain, not asserted by the client."
          - id: b
            label: "Check the local wallet adapter's cached token list in the browser."
            correct: false
            feedback: "A client-side cache is both spoofable and stale. The gate must verify against a DAS/on-chain source, not the client's own report."
          - id: c
            label: "Resolve the wallet's assets through a DAS read and confirm the Founding-Farmer cNFT actually resolves to that owner."
            correct: true
        explanation: "Gating decides on an on-chain reality, so it reads one: resolve the wallet's assets through DAS (cNFT reads require a DAS-supporting RPC) and confirm the gating asset resolves to that owner. A signature or a client claim is not evidence of a current holding."
      - id: m09l2-q2-kmno-gap
        prompt: "You migrate compost points to SPROUT. The lesson points at Kamino's KMNO points-to-token migration as a case study but flags a gap. What's the honest way to use it?"
        multiSelect: false
        options:
          - id: a
            label: "Reuse the mechanism, a merkle-claim path like your airdrop, but don't cite a KMNO conversion ratio; those numbers aren't published."
            correct: true
          - id: b
            label: "Copy Kamino's exact points-to-KMNO conversion ratio straight from their published docs into your migration config, since a shipped mainnet migration is the best-vetted number you can get."
            correct: false
            feedback: "Kamino's conversion tokenomics aren't surfaced in their docs; the research flags this as a gap. Copy the mechanism, not a number you can't verify."
          - id: c
            label: "Skip the merkle path and mint SPROUT directly to every points holder in one transaction."
            correct: false
            feedback: "A single-transaction mint to all holders doesn't scale and throws away the claim/vesting path you already built; the migration reuses that merkle path."
        explanation: "Kamino KMNO is a candidate case study with an honest numbers gap: the conversion tokenomics aren't public. The transferable lesson is the mechanism, a merkle-claim migration (reusing your R11 path, with claim_locked for any vesting), not a ratio you'd be inventing."
      - id: m09l2-q3-stale-index
        prompt: "Your gate-check just passed a wallet that transferred its Founding-Farmer cNFT away five seconds ago. What's the most likely cause?"
        multiSelect: false
        options:
          - id: a
            label: "cNFTs can't be transferred, so the read must be misreporting the transfer."
            correct: false
            feedback: "cNFTs are transferable via Bubblegum v2 transfer_v2. The badge is soulbound only because set_non_transferable_v2 was applied; an ordinary cNFT can move freely."
          - id: b
            label: "The DAS index hadn't caught up: a just-transferred asset can still resolve to the old owner until the indexer updates."
            correct: true
          - id: c
            label: "DAS reads are cryptographically final, so the gate result is authoritative and the transfer must have failed."
            correct: false
            feedback: "DAS is an indexer view, not a consensus proof; it lags the chain by design. The issue is freshness, not finality."
        explanation: "DAS is an indexed view of on-chain state, and indexers lag. A holding that changed seconds ago may not be reflected yet, so a gate can briefly admit a former holder. Design for freshness: accept the lag, or confirm against a fresher source for high-stakes gates."
