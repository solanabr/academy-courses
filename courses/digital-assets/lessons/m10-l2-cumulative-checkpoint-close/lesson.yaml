id: lesson-date-m10-l2-cumulative-checkpoint-close
slug: m10-l2-cumulative-checkpoint-close
title: "Cumulative checkpoint and close"
skills:
  - solana-kit
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Cold brief: a cafe loyalty currency that must stay tradeable on Raydium, with no compliance controls needed. What is the defensible cold decision?"
        multiSelect: false
        options:
          - id: a
            label: "Token-2022 with display-only extensions (MetadataPointer + TokenMetadata), no power extensions, so it stays on Raydium's five-extension allowlist"
            correct: true
          - id: b
            label: "A classic SPL mint, because a loyalty currency cannot use Token-2022"
            correct: false
            feedback: "Token-2022 is a superset of classic SPL; display-only extensions are exactly what keep a token both featureful and routable. Classic SPL would work but forgoes native metadata for no reason."
          - id: c
            label: "Token-2022 with a TransferHook that logs every loyalty transfer on-chain, plus MetadataPointer and TokenMetadata so the cafe keeps native metadata alongside the audit trail"
            correct: false
            feedback: "TransferHook is a power extension Raydium rejects; a currency that must stay tradeable cannot carry it unless the mint is whitelisted."
        explanation: "With no compliance need and a hard tradeability requirement, the thesis points straight at display-only extensions: they get whitelisted, they add native metadata, and they keep the token on the allowlist. This is the checkpoint's simplest row, and getting it cold confirms the compatibility model transferred."
      - id: q2
        prompt: "In the close you place each refused topic with its sibling course. Which course carries 'how a live RWA issuer structures compliance rails and KYC'?"
        multiSelect: false
        options:
          - id: a
            label: "The Master Solana Frontend and Client-Side Development course, since KYC checks and compliance screens ultimately run in the client and indexing layer the user touches"
            correct: false
            feedback: "That course owns indexing infrastructure and transaction-landing, not RWA issuance or compliance framing."
          - id: b
            label: "The DeFi and RWA Engineering course, whose tokenization module owns RWA issuance and compliance"
            correct: true
          - id: c
            label: "The Master Anchor V2 course"
            correct: false
            feedback: "That course owns the Anchor framework layer (macros, constraints, CPI, testing), not RWA compliance rails."
        explanation: "This course teaches the compliance-shaped primitives (freeze, permanent delegate, default-frozen, hooks) but deliberately refuses the legal and issuer framing. That RWA-specific issuance and compliance work lives in the DeFi and RWA Engineering course, for which this course is the named prerequisite."
      - id: q3
        prompt: "A checkpoint brief asks for a soulbound achievement badge minted to a million holders cheaply. Which taught primitive fits, and what makes the answer a 2026 answer?"
        multiSelect: false
        options:
          - id: a
            label: "A Token-2022 NonTransferable fungible mint, because soulbound is a fungible-only pattern"
            correct: false
            feedback: "NonTransferable does make a soulbound fungible, but 'a million cheap badges' is a mass-mint NFT problem, not a fungible-supply one."
          - id: b
            label: "A Metaplex Core asset with PermanentFreeze, because Core is the only soulbound path"
            correct: false
            feedback: "Core soulbound works for individual assets but is not the cheap-at-a-million answer; minting a million assets cheaply is compression's job."
          - id: c
            label: "A Bubblegum v2 cNFT with set_non_transferable_v2; soulbound compressed NFTs are new in v2 and contradict the 2024 'cNFTs can't be soulbound' folklore"
            correct: true
        explanation: "The brief combines two constraints, soulbound AND mass-mint-cheap, that only compression satisfies together. Bubblegum v2's set_non_transferable_v2 is exactly the new capability, and naming why it is current (it overturns the 2024 folklore) is what the close is training you to see."
