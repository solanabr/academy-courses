<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
  /* COURSE BANNER: the course name as an Academy push button, being clicked.
     The catalog card crops the bottom 15% (object-position: top) and lays the course title over the
     lower half, so the subject stays in the top 60% and the artwork carries no title.
     Render at 1600x900 with headless Chrome, then export to ../assets/banner.webp. */
  :root { --cream:#fafaf7; --ink:#19231b; --black:#111111; --amber:#f59e0b; --gold-hi:#fde68a; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; position: relative; overflow: hidden; color: var(--ink);
         /* cream paper shading into the black that sits under the card title */
         background: linear-gradient(180deg, var(--cream) 0%, var(--cream) 42%, #dddcd7 52%, #a3a29d 61%,
                     #5b5b57 70%, #2a2a28 79%, var(--black) 88%); }
  .dots { position: absolute; inset: 0;
          background-image: radial-gradient(circle, rgba(25,35,27,.16) 3.2px, transparent 3.6px);
          background-size: 46px 46px; background-position: 12px 14px;
          -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 38%, transparent 64%); }
  .mark { position: absolute; left: 194px; top: 40px; width: 111px; height: 90px; }

  .btn { position: absolute; left: 50%; top: 176px; transform: translate(-50%, 12px); white-space: nowrap;
         font: 800 132px/1 'JetBrains Mono', monospace; letter-spacing: .06em; word-spacing: -.22em;
         padding: 54px 62px 50px 70px; background: var(--amber);
         border: 10px solid var(--ink); border-radius: 52px;
         box-shadow: inset 0 9px 0 var(--gold-hi), 0 14px 0 var(--ink); }
  /* the unpressed position, drawn as the ink "well" the key travels in */
  .well { position: absolute; left: 50%; top: 176px; transform: translateX(-50%); white-space: nowrap;
          font: 800 132px/1 'JetBrains Mono', monospace; letter-spacing: .06em; word-spacing: -.22em; color: transparent;
          padding: 54px 62px 50px 70px; border: 10px solid transparent; border-radius: 52px;
          box-shadow: 0 26px 0 var(--ink); }
  .cursor { position: absolute; left: 1296px; top: 366px; width: 172px; height: 172px; }
  .click { position: absolute; left: 1410px; top: 96px; width: 130px; height: 130px; fill: none;
           stroke: var(--ink); stroke-width: 11; stroke-linecap: round; }
</style></head>
