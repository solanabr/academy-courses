id: lesson-aik-agents-and-commands
slug: agents-and-commands
title: "Agents and commands"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Lucas asks Claude to design a Token-2022 launch with transfer fees. Claude answers at length but the transcript never shows the token-engineer agent starting. What is the most likely reason, and the fix?"
        multiSelect: false
        options:
          - id: c
            label: "The token-engineer agent runs on Opus and his session model is Sonnet, so Claude Code refused to start the subagent."
            correct: false
            feedback: "Every kit agent runs on Opus regardless of the session model. The model is not a gate."
          - id: b
            label: "Agents start inside slash commands alone, so he has to run /build-program first and ask again from inside that command."
            correct: false
            feedback: "Agents start from plain requests as well. Commands can spawn them, but they are not the only route."
          - id: a
            label: "An agent starts on a description match, and this request did not match closely enough. Name the agent in the request."
            correct: true
            feedback: "Yes. Agents start on a description match or on a name. Saying 'use the token-engineer agent' settles it."
          - id: d
            label: "Agent files are gitignored, so they vanished at his first commit and the agents folder has been empty since then."
            correct: false
            feedback: "Ignored files stay on disk. Gitignore only keeps them out of commits."
        explanation: "An agent is a markdown file with a name, a description and a model. Claude Code starts one as a subagent when the description fits the request, or when you name it. A request that reads as general design can go to the main session instead, so when you want a specific specialist, say so."
      - id: q2
        prompt: "Ana edited .claude/commands/deploy.md to add a step that posts to her team's chat. A month later she ran /update and the step is gone. Predict why, and where the step should have lived."
        multiSelect: false
        options:
          - id: d
            label: "/update resets the whole .claude folder to defaults, including any new files she added, so nothing of hers can survive it."
            correct: false
            feedback: "The update refreshes the files the kit ships. A command with a name of her own is not one of them."
          - id: a
            label: "The kit owns that file and /update rewrote it from the new release. Her step belongs in a command under a name of her own."
            correct: true
            feedback: "Right. Kit-owned agents, commands, skills and bin scripts are refreshed by /update. Your own files beside them are left alone."
          - id: b
            label: "The firewall denies edits to .claude/commands on each tier, so her edit was not saved and the step did not run at all."
            correct: false
            feedback: "No tier denies edits to .claude/commands. High protects only settings.json, security.json and .mcp.json; the guard hooks are denied at every tier."
          - id: c
            label: "Claude Code caches command files at install time, so a file edit takes no effect until the kit is reinstalled."
            correct: false
            feedback: "Command files are read when you run them. Her edit worked for a month, then the update replaced the file."
        explanation: "Commands are plain markdown files, and the ones the kit ships are the kit's to refresh. /update pulls the latest release and rewrites them. Anything you want to keep goes in a file the kit does not ship, such as .claude/commands/deploy-and-notify.md, which the update never touches."
      - id: q3
        prompt: "You run /plan-feature with a one-line description of a tip jar. Predict what you get back."
        multiSelect: false
        options:
          - id: c
            label: "A deployment to devnet with the program id printed, since planning and shipping are one step in the kit's workflow."
            correct: false
            feedback: "Nothing in the kit deploys without you asking for it, and a plan is the step before code, not after."
          - id: d
            label: "A refusal, because planning a program needs the Solana CLI installed, which /doctor reported missing on this machine."
            correct: false
            feedback: "Planning reads code and references. It needs no toolchain."
          - id: a
            label: "A written plan with accounts, instructions, risks, tests and phases, ending in open questions, and no code at all."
            correct: true
            feedback: "Yes. The command plans only. It may ask about who signs and who pays rent, and it hands you questions at the end."
          - id: b
            label: "A scaffolded Anchor program with the accounts already written out, ready for /build-program to compile and test."
            correct: false
            feedback: "That is /scaffold followed by a build. /plan-feature writes no code by design."
        explanation: "The command's own file says plan only, write no code. It reads the code the feature would touch, asks about decisions that change the design, may bring in the solana-architect agent for the account model, and writes a plan with a fixed shape that ends in open questions for you."
