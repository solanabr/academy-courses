id: lesson-aik-skills
slug: skills
title: "Skills: what Claude reads before it works"
skills:
  - supply-chain-security
  - version-pinning
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Claude reports that a row in the skill hub links into .claude/skills/ext/sendai/, which does not exist in your project, and offers to run the command printed next to the link. Predict what is going on."
        multiSelect: false
        options:
          - id: d
            label: "Claude is about to fetch an unreviewed repository from the internet, which the firewall should have blocked outright."
            correct: false
            feedback: "The kit pins each extension at a reviewed commit recorded in its registry. The script copies that commit, not whatever upstream is today."
          - id: a
            label: "sendai is an extension the kit pins but does not install by default, and the command copies it in at the pinned commit."
            correct: true
            feedback: "Yes. Core packs come installed, extensions arrive on demand, and the hub prints the install command next to each link into one."
          - id: c
            label: "The hub is out of date and points at a pack that was removed upstream, so the row should be deleted from SKILL.md."
            correct: false
            feedback: "The row is correct. It links into a pack that installs when a task needs it, and it tells you how."
          - id: b
            label: "The install stopped before the skills finished copying, so the kit has to be reinstalled from scratch to get the pack."
            correct: false
            feedback: "A missing extension folder is the normal state of a fresh install. Only the four core packs are present."
        explanation: "Four packs install with the kit. Every other pack in the hub is an extension: pinned at a commit the maintainers reviewed, scanned, and copied into the project only when a task calls for it. The hub gives the install command right next to the link, so a missing ext/ folder is an instruction, not a fault."
      - id: q2
        prompt: "Two things sit in .claude/skills after a fresh install: the three ext/ core packs, and Anthropic's frontend-design and webapp-testing skills at the top level. Which of them costs tokens in every session before you ask for anything?"
        multiSelect: false
        options:
          - id: c
            label: "The three ext/ packs, since they hold the Solana references Claude needs, while the Anthropic skills load on demand."
            correct: false
            feedback: "It is the other way around. The ext/ layout is the one Claude Code does not list, and the top-level one is."
          - id: a
            label: "The two top-level Anthropic skills, around a hundred tokens of descriptions. The ext/ packs cost nothing until routed into."
            correct: true
            feedback: "Right. Claude Code lists top-level skills at session start, and lists nothing from the ext/ packs because of how they are laid out."
          - id: b
            label: "The whole set. Each skill file under .claude/skills is read at session start, which is why the kit keeps the count small."
            correct: false
            feedback: "Skill bodies are read on demand. Only listed descriptions cost standing tokens, and the ext/ packs are not listed."
          - id: d
            label: "Nothing here. A skill costs tokens when you type its name as a slash command or when an agent opens its file directly."
            correct: false
            feedback: "Top-level skills are listed in every session, which is a small but real standing cost."
        explanation: "Claude Code discovers skills at the top of .claude/skills and lists their descriptions every session. The core ext/ packs keep their skills one folder deeper, so nothing from them is listed and they cost nothing standing. The anthropic-skills pack installs top level on purpose, so other agents see it too, and that costs roughly a hundred tokens per session."
      - id: q3
        prompt: "A teammate uses Cursor, not Claude Code, and wants the Foundation's solana-dev skill in her editor. Which route does the website give her?"
        multiSelect: false
        options:
          - id: d
            label: "No route, because skills are a Claude Code feature and Cursor has no equivalent that reads markdown instructions."
            correct: false
            feedback: "Skills are plain markdown in an open format. The site names Cursor, Codex and Windsurf among the tools that read them."
          - id: b
            label: "Run the kit installer inside her project, since the .claude folder it writes is what each editor reads for skills."
            correct: false
            feedback: "The full install targets Claude Code. Other tools read AGENTS.md or a skill URL, not .claude/."
          - id: a
            label: "npx skills add solana-foundation/solana-dev-skill, or hand her agent the skill's URL from the Solana Skills site."
            correct: true
            feedback: "Yes. The site hosts every official skill as plain markdown, and the skills CLI works across Claude Code, Cursor, Codex and others."
          - id: c
            label: "Copy .claude/skills/ext/solana-dev out of your project into hers, because the pack is distributed inside the kit alone."
            correct: false
            feedback: "The pack is the Foundation's own repository, mirrored on the site at a pinned commit. Nothing has to be copied from your project."
        explanation: "The website offers three ways to use any skill: install it with the skills CLI, drop the hosted SKILL.md into a skills folder with curl, or paste the URL into an agent chat. All three work outside Claude Code, which is the point of hosting the skills as markdown at stable addresses."
