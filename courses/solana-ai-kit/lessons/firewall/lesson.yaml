id: lesson-aik-firewall
slug: firewall
title: "The firewall: four tiers and what they do not do"
skills:
  - supply-chain-security
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Mid-session, Beatriz runs /firewall high and then asks Claude to read a file in her home directory. It reads it. Predict why, and what she should do."
        multiSelect: false
        options:
          - id: c
            label: "The switch failed silently because /firewall needs the Solana CLI to regenerate the rules, and it is not installed."
            correct: false
            feedback: "The firewall script needs no toolchain. It rewrote the rules; the running session just has not read them."
          - id: a
            label: "Rules are read once at session start, so this session keeps the Relaxed rules it began with. Restart Claude Code for High."
            correct: true
            feedback: "Yes. A switch takes effect in the next session, whether it tightens or loosens, and the command tells you so when it reports."
          - id: d
            label: "Home-directory files stay readable at High because the sandbox covers just the project folder and its children."
            correct: false
            feedback: "At High the sandbox denies the home directory with a narrow carve-out for the toolchain caches."
          - id: b
            label: "High restricts writes, not reads, so reading a home-directory file is allowed on each of the tiers the kit offers."
            correct: false
            feedback: "High is the tier that narrows reads to the working directory and the toolchain roots. It is reads that change most."
        explanation: "The tier is written to .claude/security.json and the generated rules to .claude/settings.json immediately, but Claude Code reads both at session start. Until she restarts, the session runs on the rules it started with. The command's own file tells Claude to say this when it reports a switch."
      - id: q2
        prompt: "On the default tier, Claude is about to run a devnet program deploy as part of a task you gave it. Predict what the firewall does."
        multiSelect: false
        options:
          - id: a
            label: "It stops the command for your approval and names the cluster it resolved. A local validator alone skips the stop."
            correct: true
            feedback: "Right. On-chain writes pause on every cluster except a local validator at Relaxed, and the irreversible ones are refused outright."
          - id: d
            label: "It runs the deploy and posts a warning afterwards, since a hook observes a command and has no way to stop one."
            correct: false
            feedback: "The guard hooks run before the command and can stop it. That is the mechanism."
          - id: c
            label: "It denies it outright, because program deploys are refused on each tier below High regardless of the cluster."
            correct: false
            feedback: "Deploys ask at Relaxed. Outright refusal is reserved for irreversible actions such as --final or a program close."
          - id: b
            label: "It lets it through without asking, because devnet is a test cluster and mainnet writes are the ones the kit gates."
            correct: false
            feedback: "Relaxed gates every cluster but local. Mainnet is where High denies outright instead of asking."
        explanation: "At Relaxed, the on-chain guard pauses deploys, upgrades and authority changes on every cluster except a local validator, telling you which cluster the command resolved to. Irreversible actions such as a final deploy, a program close or disabling a token authority are refused at every tier. The house rules add that mainnet needs your explicit go-ahead every time, independent of any hook."
      - id: q3
        prompt: "You ask Claude, on the default tier, to read .env and list what is inside. Predict the result."
        multiSelect: false
        options:
          - id: b
            label: "It reads the file, since Relaxed leaves the project's .env readable so the toolchain and the build keep working."
            correct: false
            feedback: "Relaxed does leave .env readable to the toolchain, but the plugin is stricter and refuses it to the agent's reads."
          - id: a
            label: "The read is refused by safe-ai-skill. The kit's answer is env-keys.sh, which prints each key as set or empty, not a value."
            correct: true
            feedback: "Yes. The plugin refuses .env to the file tools and cat-style reads at every tier while it is on."
          - id: c
            label: "It reads the file but masks each value with asterisks before showing you the list, as the tier requires."
            correct: false
            feedback: "Nothing in the kit masks values. The read itself is what is refused."
          - id: d
            label: "It asks you to approve the read once, then remembers that approval for the rest of the project's sessions."
            correct: false
            feedback: "There is no ask here. The plugin denies, and the helper is the designed alternative."
        explanation: "While safe-ai-skill is on it refuses .env and its variants to the Read tool and to cat-style commands at every tier, which is stricter than the tiers' own rules. The reason is that a value read into the transcript has already left the machine. The helper script answers the real question, which keys are set, without exposing any value."
