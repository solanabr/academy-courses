id: lesson-aik-programs
slug: programs
title: "Build the program: anchor-engineer, pinocchio-engineer, solana-qa-engineer"
skills:
  - solana-programs
  - pdas
  - program-testing
  - program-security
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "A LiteSVM test for Stamp's redeem instruction fails with 'custom program error: 0x1770'. Using what /test-rust's own file says about reading failures, what is that?"
        multiSelect: false
        options:
          - id: b
            label: "A constraint violation on the card's seeds, since the 2000 range covers each PDA mismatch between the client and the program."
            correct: false
            feedback: "Seeds mismatches are 2006 in decimal, 0x7d6 in hex. 0x1770 is far above the constraint range."
          - id: d
            label: "A declared program id mismatch, meaning the test loaded the program at an address other than the one in declare_id."
            correct: false
            feedback: "That is 4100, printed as 0x1004. Rebuilding after anchor keys sync fixes it; it is not this error."
          - id: c
            label: "An account that was not initialized, which Anchor reports as 3012 and the test runner prints in hex as 0x1770 by convention."
            correct: false
            feedback: "3012 is 0xbc4. The number in the question decodes to 6000, not to the account-error range."
          - id: a
            label: "Decimal 6000, the first variant of your own error enum, since Anchor custom errors start at that offset unless one is set."
            correct: true
            feedback: "Yes. 0x1770 is 6000. Constraint errors sit at 2000 to 2999 and account errors at 3000 to 3999; 6000 and up are yours."
        explanation: "The test command's file spells out the ranges: 2000 to 2999 are constraint violations, 3000 to 3999 account errors, 4100 a declared program id mismatch, and your own error_code variants start at the enum's offset, 6000 by default, so 0x1770 is the first one you defined. Read the program logs in the failure before touching code."
      - id: q2
        prompt: "You ask the solana-qa-engineer agent to review a diff and it removes a comment reading 'add one stamp' above a checked_add on the stamp count, and a signer check that repeats what the Anchor constraint above it already enforces. Predict which rule it applied."
        multiSelect: false
        options:
          - id: d
            label: "Its harness rule: Mollusk does not load code with duplicate checks, so they are stripped before single-instruction tests run."
            correct: false
            feedback: "Harness choice is about what each tool tests best. It does not constrain the program's source."
          - id: b
            label: "Its CU budget rule: each comment and each duplicate check costs compute units on-chain, so both go to protect the baseline."
            correct: false
            feedback: "Comments cost nothing at runtime. The CU rule is about measured instructions, not source text."
          - id: a
            label: "Its slop criteria: a comment that restates the code and a check that repeats what a constraint already enforces go, real checks stay."
            correct: true
            feedback: "Right. The agent owns slop cleanup before review: restating comments, checks a constraint already enforces, debug logging and verbose error strings."
          - id: c
            label: "Its coverage bar: code that has no test may not carry comments, so the comment goes until the instruction has a test of its own."
            correct: false
            feedback: "The coverage bar is about tests per instruction and error path. It says nothing about comments."
        explanation: "The QA agent's file lists what to strip before review: comments that restate the code, defensive checks around trusted internal calls the codebase does not otherwise use, checks that repeat what a constraint already enforces, verbose error messages and leftover debug logging. It keeps every genuine security check and reports what it removed."
      - id: q3
        prompt: "The anchor-engineer agent finishes Stamp's three instructions. Before it hands back, which commands does its own file require it to run?"
        multiSelect: false
        options:
          - id: a
            label: "/build-program and /test-rust, plus /audit-solana, which the house rules ask for on a program branch, then a report of the changes."
            correct: true
            feedback: "Yes. Build, test, and an audit, which the agent runs for code that holds or moves funds and the house rules ask for anyway, then the report."
          - id: d
            label: "Nothing at all. The agent writes code, and the solana-qa-engineer agent owns each build and test run that follows afterwards."
            correct: false
            feedback: "The QA agent owns strategy and coverage. Implementers still build and unit-test their own code before handing back."
          - id: b
            label: "/deploy devnet, so the instructions exist on a cluster before anyone reviews them, then /generate-idl-client for the TS client."
            correct: false
            feedback: "Deploying is a separate, user-triggered step with an approval stop. It is not part of handing code back."
          - id: c
            label: "/profile-cu and /benchmark, since an Anchor program has to prove its compute budget before its tests are allowed to run at all."
            correct: false
            feedback: "Those are the pinocchio-engineer's closing commands, for measured CU work. Anchor's closing rule is build, test, audit."
        explanation: "The anchor-engineer file ends with a Before handing back section: run /build-program and /test-rust, and for code that holds or moves funds also /audit-solana, then report the instructions and accounts changed and the test results. The pinocchio-engineer adds /profile-cu and /benchmark because its whole reason to exist is measured compute."
