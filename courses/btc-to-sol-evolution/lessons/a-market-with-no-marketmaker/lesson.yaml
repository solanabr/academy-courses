id: lesson-b2s-a-market-with-no-marketmaker
slug: a-market-with-no-marketmaker
title: "A market with no market maker: deploy an AMM and swap against it"
skills:
  - account-model
  - solana-programs
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "A constant-product AMM holds reserves x and y. What must stay true across a swap (ignoring fees), and what does it imply?"
        multiSelect: false
        options:
          - id: a
            label: "x + y = k stays constant, so the pool always trades at the fixed 1:1 price it launched with"
            correct: false
            feedback: "A constant sum really would hold one price, right up to the moment it runs out: a large enough trade takes the last unit of one reserve and the pool is dead. The product rule is what stops that, at the cost of a price that moves with every fill."
          - id: b
            label: "x · y = k stays constant, so the price moves along the curve and no swap can drain either reserve to zero"
            correct: true
            feedback: "Both halves come from the same hyperbola. Its slope at your starting point is the spot price, and it bends away as you trade, so every fill is worse than the quote and the curve approaches each axis without ever reaching it."
          - id: c
            label: "x - y = k stays constant, so the pool rebalances toward equal reserves after every swap"
            correct: false
            feedback: "Nothing pushes the reserves back toward each other. A swap of 100 TKA against a 1000/1000 pool left 1100 and 909, further apart than it started, and the only force that ever pulls a pool back toward an outside price is an arbitrageur trading against it."
          - id: d
            label: "x · y = k stays constant, so a large enough swap can empty one reserve and halt the pool"
            correct: false
            feedback: "The formula is right and the consequence is inverted. Driving a reserve to zero would demand an infinite amount of the other token, because the hyperbola is asymptotic to both axes, so the pool keeps quoting at prices nobody sane would pay rather than running dry."
        explanation: "The invariant is the product: x·y = k. Buying token y removes some y and adds some x, and the curve reprices continuously — the closer a reserve gets to zero, the more of the other token each additional unit costs, approaching infinity. That is why a constant-product pool can always quote a price and can never be swept empty by trading."
      - id: q2
        prompt: "Why can't the AMM contract just call a price API at execution time to get a fair price?"
        multiSelect: false
        options:
          - id: a
            label: "Oracles are banned at the protocol level, and no contract may ever consume data from outside the chain"
            correct: false
            feedback: "Contracts consume off-chain data constantly; that is the entire oracle industry. What is forbidden is fetching it mid-execution, so the data has to arrive as an ordinary transaction that writes it into storage first."
          - id: b
            label: "An HTTP call would take too long: determinism is preserved, but the block-time budget is too tight"
            correct: false
            feedback: "Latency is the smaller problem and determinism is not preserved at all. Two nodes replaying the same block hours apart would receive two different prices, and the block itself would stop being replayable."
          - id: c
            label: "Consensus requires deterministic execution: every node must compute the same result, and a live API call could hand the contract a different price"
            correct: true
            feedback: "This is the same determinism that made module 0's hash reproducible on every machine, pointed at a different job. Every node replays every transaction, so any input that varies by who is asking or when breaks agreement on the block."
          - id: d
            label: "It can: Chainlink and oracles like it let a contract fetch a live price quote during execution, and this pool simply never imported the interface that would do it"
            correct: false
            feedback: "Oracle middleware works the other way round. It gathers and validates prices off-chain, then posts the agreed number on-chain in its own transaction, and the consuming contract does a plain storage read. Nothing reaches outside the machine while a swap is running."
        explanation: "Every validator re-executes every transaction and must arrive at byte-identical state. A live network call injects non-determinism — different responses, timeouts, reorderings — so it cannot exist inside execution. Prices either emerge from the pool's own reserves (the AMM trick) or arrive as signed on-chain data written by an oracle."
      - id: q3
        prompt: "A 0.3% fee (r = 0.997) stays in the pool. What does that do to the invariant k over many swaps?"
        multiSelect: false
        options:
          - id: a
            label: "k grows: the retained fee leaves slightly more in the reserves after every swap, compounding value for liquidity providers"
            correct: true
            feedback: "The full input lands in the reserves while only 99.7% of it counts toward the output math, so the leftover stays behind forever. Your own run showed it, moving the product from 1,000,000 to about 1,000,272.8 on a single trade."
          - id: b
            label: "k stays exactly constant, since the invariant is enforced as an equality and fees accrue in a separate protocol treasury"
            correct: false
            feedback: "The contract's own check is an inequality, requiring only that the product not shrink, and there is no treasury anywhere in the code. Fees never leave the reserves, which is precisely why an LP share is worth more when it is redeemed than when it was minted."
          - id: c
            label: "k shrinks slowly, since fees are paid out to traders as rebates, bleeding the reserves over time"
            correct: false
            feedback: "A shrinking product is the one thing the contract refuses outright: _sync reverts with 'k shrank' if it ever happens. Traders pay the fee rather than receive it, and it is the liquidity providers who collect."
          - id: d
            label: "k grows during a swap and then falls back to its starting value as arbitrageurs restore the pool's ratio"
            correct: false
            feedback: "Arbitrage moves the ratio between the two reserves, never the product they multiply to. An arbitrageur's trade is itself a swap that pays the same 0.3%, so correcting a mispriced pool ratchets k up again rather than unwinding it."
        explanation: "With the fee retained, each swap satisfies x'·y' ≥ k rather than strict equality — the pool keeps 0.3% of every input, so the product grows monotonically with volume. LP tokens redeem a share of the reserves, which is how trading volume translates into LP earnings without any external payout."
