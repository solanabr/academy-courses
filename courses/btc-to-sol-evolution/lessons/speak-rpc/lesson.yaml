id: lesson-b2s-speak-rpc
slug: speak-rpc
title: "Speak RPC: your node is just an API server"
skills:
  - rpc-reads
  - transactions
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Your `bitcoin-cli` commands are a thin wrapper over what, and how does a program talk to the node without the CLI?"
        multiSelect: false
        options:
          - id: a
            label: "JSON-RPC over HTTP: a program POSTs a JSON body naming a method and params to the node's RPC port"
            correct: true
            feedback: "curl, Python's requests and bitcoin-cli all produced the same answer because all three POST the same envelope to the same port. The CLI's whole job is finding the port, reading the cookie, wrapping your arguments and printing the result field."
          - id: b
            label: "gRPC with protobuf schemas, and bitcoin-cli ships the compiled .proto definitions programs must share"
            correct: false
            feedback: "No schema is shared and nothing is compiled. Satoshi bolted an existing web standard, JSON-RPC 1.0, onto bitcoind, which is why a dict and an HTTP request are the only tools you need and why every chain since answers the same shape of POST."
          - id: c
            label: "Direct reads of the node's database files, since bitcoin-cli opens the same LevelDB the daemon writes to"
            correct: false
            feedback: "The CLI never touches the chain files, and two processes reading one LevelDB would corrupt it. It authenticates like any other client, by reading the cookie off disk, and then asks the daemon over the network."
          - id: d
            label: "A local Unix domain socket, since the CLI and the daemon talk over a private channel on disk"
            correct: false
            feedback: "The channel is an ordinary TCP port, which is exactly why curl reaches it at http://127.0.0.1:18443/ and why pointing the same client at a rented node is a one-line change. Nothing about the transport is private to the CLI."
        explanation: "bitcoin-cli is a thin JSON-RPC client. Every command is an HTTP POST carrying {\"method\": ..., \"params\": [...]} to the node's RPC port; the node answers with {\"result\": ..., \"error\": ...}. That is why any language with an HTTP library can drive a node — and why every wallet, explorer, and bot is ultimately this same call."
      - id: q2
        prompt: "Which RPC port does a Bitcoin Core node listen on in regtest mode?"
        multiSelect: false
        options:
          - id: a
            label: "8332"
            correct: false
            feedback: "That is mainnet's RPC port, and pointing a regtest client at it is the footgun that looks like a dead node: nothing is listening, so the OS refuses the connection instantly and the failure is indistinguishable from a crashed daemon."
          - id: b
            label: "18443"
            correct: true
            feedback: "This is the one hardcoded in DEFAULT_URL for exactly that reason: pin it once as a named default and port confusion stops being a class of bug. Every curl, Python and CLI call in the lesson reached the node here."
          - id: c
            label: "18332"
            correct: false
            feedback: "That is testnet's RPC port. Testnet and regtest are different networks with different ports, different genesis blocks and different data directories, so a client aimed here never reaches the chain you mined."
          - id: d
            label: "18444"
            correct: false
            feedback: "18444 is regtest's peer-to-peer port, where nodes gossip blocks and transactions to each other. It speaks Bitcoin's binary wire protocol rather than JSON-RPC, so an HTTP POST arriving there gets nothing a client can parse."
          - id: e
            label: "8333"
            correct: false
            feedback: "8333 is mainnet's peer-to-peer port, the one other nodes connect to. Every network runs two ports, one for peers and one for RPC, and only the RPC side answers the JSON envelope your client builds."
        explanation: "Regtest RPC is 18443; mainnet is 8332 and testnet is 18332. Pointing a client at the wrong port produces 'connection refused' — a transport error that looks exactly like a dead node, which is why the wrapper pins the port in one named constant instead of scattering literals."
