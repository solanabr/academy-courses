id: lesson-b2s-your-first-solana-program
slug: your-first-solana-program
title: "Push code you can never edit: your first program on devnet"
skills:
  - account-model
  - solana-programs
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: ping-program
    type: code
    language: rust
    buildType: buildable
    deployable: true
    starter: ping-program/starter.rs
    solution: ping-program/solution.rs
    tests: ping-program/tests.json
    hints:
      - "The verification harness at the bottom already names both missing pieces — build first and read which names it can't find."
      - "`Context<Ping>` needs `Ping` to carry #[derive(Accounts)] (that derive supplies the Bumps impl), not #[account]."
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "What turns your Rust into a program the Solana runtime can execute, and how is the deployed program account marked?"
        multiSelect: false
        options:
          - id: a
            label: "`cargo build-sbf` compiles it to sBPF; the deployed program account is flagged `executable`"
            correct: true
            feedback: "sBPF is Solana's fork of the BPF bytecode format, and the fork exists so the runtime can meter untrusted code instruction by instruction. `solana account <program-id>` prints the flag straight back at you once the deploy lands."
          - id: b
            label: "`cargo build --release` produces the binary; the runtime marks it executable after its first successful transaction"
            correct: false
            feedback: "A plain release build targets your laptop's architecture, which the on-chain VM cannot run at all. Nothing about the first invocation changes the account either: it comes out of the deploy already flagged and already owned by the loader."
          - id: c
            label: "`anchor deploy` compiles the Rust to sBPF on the validator itself, so nothing is built locally"
            correct: false
            feedback: "Validators never compile anything. Compilation happens on your machine and the deploy uploads the finished `.so`, streaming it through a temporary buffer account because one transaction is far too small to carry a whole binary."
          - id: d
            label: "`cargo build-sbf` compiles it to an sBPF binary, and the deployed program account lists your wallet as its owner"
            correct: false
            feedback: "The build half is right and the ownership half is the confusion worth clearing up. `solana program show` prints two different lines: Owner is BPFLoaderUpgradeab1e11111111111111111111111, while Authority is your CLI wallet. Your wallet can authorize an upgrade; it does not own the account, and no program may write an account it does not own."
        explanation: "cargo build-sbf compiles Rust to sBPF bytecode (Solana's BPF variant) in target/deploy/*.so. On deploy, the program's account is created with executable = true and owned by a BPF loader, which is what lets the runtime dispatch transactions into it."
      - id: q2
        prompt: "You deployed under the BPF Loader Upgradeable. What does 'upgradeable' let you do, and who can?"
        multiSelect: false
        options:
          - id: a
            label: "Anyone can push new bytecode to the program id, so 'upgradeable' means open to community contribution"
            correct: false
            feedback: "Upgrades are gated by a single key. The loader checks the stored upgrade authority against the signer, and a stranger's redeploy is rejected before any bytecode is read, which is why losing that key freezes the program permanently."
          - id: b
            label: "The upgrade authority can migrate the program and all its data accounts to a fresh address in one step"
            correct: false
            feedback: "There is no migration primitive. An upgrade rewrites the bytecode in the ProgramData account and touches nothing else, and data accounts belong to your program rather than to the loader, so moving them would be your own program's job."
          - id: c
            label: "The upgrade authority can replace the program's bytecode at the same program id, without changing its address"
            correct: true
            feedback: "That is what the two-account split buys. The tiny proxy at your program id never moves, so every caller that hardcoded the address keeps landing on the same front door and finds new code behind it."
          - id: d
            label: "The upgrade authority publishes new bytecode at a fresh address, and the loader forwards calls from the old id to it"
            correct: false
            feedback: "Nothing forwards. Collapse identity and implementation into one object and every code change would break everyone pointing at you, which is precisely the problem the separate ProgramData account exists to avoid."
        explanation: "The BPF Loader Upgradeable stores your bytecode in a ProgramData account controlled by an upgrade authority (by default, your deploying wallet). That authority — and only that authority — can redeploy new bytecode to the same program id. Set it to None and the program becomes permanently immutable."
