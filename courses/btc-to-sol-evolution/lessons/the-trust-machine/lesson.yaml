id: lesson-b2s-the-trust-machine
slug: the-trust-machine
title: "Double-spend yourself: the fifty-year bug"
skills:
  - solana-fundamentals
  - keypairs-wallets
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "You copy one coin.json to Bob and Carol and both accept it. What single property of money have you just broken, and what fixes it?"
        multiSelect: false
        options:
          - id: a
            label: "Confidentiality, the coin file should have been encrypted so only its rightful owner could read it"
            correct: false
            feedback: "Encryption cannot help here: Bob and Carol each hold a perfect, decryptable copy, and encrypting a file does not stop cp from duplicating it. The property that broke is scarcity, and only a shared spent-once record restores it."
          - id: b
            label: "Scarcity, and only a shared ledger recording the coin as spent once rejects the second transfer"
            correct: true
            feedback: "The ledger makes history global: your payment to Bob and your payment to Carol stop being independent files and become two entries competing for one row, so the second one loses. Twelve lines of Python is the whole mechanism."
          - id: c
            label: "Integrity, a checksum inside coin.json would have exposed the copies as forgeries"
            correct: false
            feedback: "There is no forgery to detect: the copies are byte-for-byte identical, so every checksum passes. The problem is not a corrupted coin but the same valid coin accepted twice, which is a ledger problem rather than a file problem."
          - id: d
            label: "Authenticity, since a signed coin.json would let Bob and Carol tell the one genuine coin from the two copies"
            correct: false
            feedback: "A signature copies as cleanly as the coin does, so all three files carry the same valid signature and none of them is the forgery. This is the objection the lesson answers at the end: signatures settle authorization, never which of two valid spends came first."
        explanation: "Copying the file twice double-spent it — the one failure a currency cannot survive, because effortless duplication destroys scarcity. No per-file trick (encryption, checksums, signatures) fixes it: the coin needs global history. A ledger makes ownership a shared record where the second spend of the same value is visible and rejected."
      - id: q2
        prompt: "Bitcoin's genesis block (2009-01-03) embeds the headline 'The Times 03/Jan/2009 Chancellor on brink of second bailout for banks.' Why put a newspaper headline in block zero?"
        multiSelect: false
        options:
          - id: a
            label: "It is a timestamp and a statement: proof the chain was not pre-mined before that date, and a jab at the banking system it answers"
            correct: true
            feedback: "Both halves matter. A block quoting that morning's front page cannot have been produced earlier, which is a floor on the chain's start that anyone can check, and the choice of headline points straight at the system the design was answering."
          - id: b
            label: "It seeded the initial mining difficulty, since the headline's hash set the target the first blocks had to beat"
            correct: false
            feedback: "Difficulty came from a hardcoded target, not from hashing news. The headline is a proof of no earlier start, since you cannot cite tomorrow's front page today, plus a pointed editorial choice."
          - id: c
            label: "It was paid for: the genesis coinbase spent its 50 BTC on the front-page slot, which is why that reward is unspendable today"
            correct: false
            feedback: "The reward really is unspendable, but not because it was spent. Block zero's 50 BTC was never written into the set of spendable outputs at all, a quirk of the original client that was never fixed, and the headline rides for free in the coinbase's open text field."
          - id: d
            label: "It pins the exact date, since a headline from 2009-01-03 could only have been written that morning, proving the block was mined that same day"
            correct: false
            feedback: "A quoted headline sets a floor, not a point. Nothing stops anyone embedding a January 2009 front page in a block produced a year afterwards, so the text rules out an earlier start and says nothing about a later one. Proof the chain was not pre-mined is exactly as much as it buys."
        explanation: "The headline does two jobs. Technically it is a timestamp floor: a block containing that day's front page cannot have been mined earlier, so the chain provably was not pre-mined. Rhetorically it names the target — a banking system mid-bailout — making block zero both an experiment's birth certificate and its manifesto."
