id: lesson-b2s-hash-everything
slug: hash-everything
title: "Hash everything: the 64 characters under every blockchain"
skills:
  - solana-fundamentals
  - keypairs-wallets
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "`printf 'solana'` and `printf 'Solana'` produce completely different SHA-256 digests — not similar ones. What property is that, and why does it matter?"
        multiSelect: false
        options:
          - id: a
            label: "Salting — SHA-256 mixes in a per-run salt, so even identical inputs produce unrelated digests"
            correct: false
            feedback: "SHA-256 has no salt — it is a pure function, and identical inputs ALWAYS produce identical digests (that is what makes fingerprinting possible). The scrambling you saw comes from the one changed character, not from randomness."
          - id: b
            label: "The avalanche effect — a one-bit change scrambles the whole output, so a digest cannot leak how similar two inputs are"
            correct: true
          - id: c
            label: "Preimage resistance — the digests differ because you cannot run the function backwards"
            correct: false
            feedback: "Preimage resistance is a real property, but a different one: not being able to find an input that produces a given digest. The total scrambling caused by a one-character change is the avalanche effect."
        explanation: "The avalanche effect: flip one input bit and roughly half the output bits flip, leaving no correlation between digests of near-identical inputs. That is what makes a hash a safe fingerprint — comparing digests reveals equality and nothing else, so an attacker cannot home in on data by watching digests get 'closer'."
      - id: q2
        prompt: "A SHA-256 digest is always the same size regardless of input. How big, expressed as hex characters?"
        multiSelect: false
        options:
          - id: a
            label: "64 hex characters (256 bits)"
            correct: true
          - id: b
            label: "32 hex characters (128 bits)"
            correct: false
            feedback: "32 is the digest size in BYTES. 256 bits = 32 bytes = 64 hex characters, since each hex character encodes 4 bits."
          - id: c
            label: "It depends on the input — longer files produce longer digests"
            correct: false
            feedback: "Fixed output size is the point: any input, from one byte to a terabyte, compresses to exactly 256 bits. That is what lets a short digest stand in for data of any size."
        explanation: "SHA-256 always outputs 256 bits = 32 bytes, written as 64 hexadecimal characters (4 bits per character). The fixed size is a feature: a block header, a file, or a whole chain state all reduce to the same small, comparable fingerprint."
      - id: q3
        prompt: "The 2017 'SHAttered' result produced two different PDF files with the same SHA-1 hash. What does that tell you about algorithm choice?"
        multiSelect: false
        options:
          - id: a
            label: "It shows preimage attacks are practical, so any SHA-1 digest can now be reversed to its input"
            correct: false
            feedback: "SHAttered was a COLLISION — two specially crafted inputs sharing one digest — not a preimage attack; nobody can 'reverse' a digest. But broken collision resistance alone disqualifies SHA-1 wherever two documents must never share a fingerprint."
          - id: b
            label: "Very little — a lab result with two PDFs does not affect real systems that hash other formats"
            correct: false
            feedback: "The PDFs were a demonstration, not the limit: the attack targets the algorithm, not the file format. Git, TLS certificates, and signature schemes all had to migrate off SHA-1 because of it."
          - id: c
            label: "SHA-1's collision resistance is broken; choose a function like SHA-256 wherever two inputs must never share a digest"
            correct: true
        explanation: "SHAttered demonstrated a practical SHA-1 collision: two distinct documents, one digest. Any system that treats a digest as a unique fingerprint — signatures, content addressing, block hashes — is unsafe on SHA-1. SHA-256 has no known collisions and remains the working standard, which is why Bitcoin and Solana are built on it."
