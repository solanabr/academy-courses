id: lesson-b2s-an-anchor-vault
slug: an-anchor-vault
title: "A vault only its program can open"
skills:
  - anchor
  - solana-kit
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: wire-deposit
    type: code
    language: rust
    buildType: buildable
    starter: wire-deposit/starter.rs
    solution: wire-deposit/solution.rs
    tests: wire-deposit/tests.json
    hints:
      - "A PDA has no key; the program signs for it with the vault seeds plus the canonical bump — so the bump must be stored to be reused."
      - "Add `pub vault_bump: u8` and `pub state_bump: u8` to VaultState; field order does not matter to Anchor."
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Your vault is a PDA, an address with no private key. Why does the program STORE the canonical bump in the vault's state account instead of computing it again on each call?"
        multiSelect: false
        options:
          - id: a
            label: "Because find_program_address is non-deterministic: it starts its search at a random bump, so without a stored value the program might land on a different address each call"
            correct: false
            feedback: "The search is completely deterministic. It counts down from 255 and returns the first bump that lands off the curve, so the same seeds and the same program id give the same answer forever. What repeating it costs is compute, not correctness."
          - id: b
            label: "Because the canonical bump can change when the program is upgraded, so state must pin the value from initialization"
            correct: false
            feedback: "An upgrade replaces bytecode and leaves the program id untouched, and the bump is a function of the seeds plus that id. Nothing about redeploying moves it, which is why a vault stays reachable across upgrades."
          - id: c
            label: "Re-deriving scans bump candidates from 255 downward and burns compute on every call; storing it once lets the program sign CPIs with the exact bump cheaply"
            correct: true
            feedback: "Roughly 1,500 compute units per access, paid every time, for an answer that cannot change. Writing it into VaultState during initialize turns a search into a field read, and the withdraw handler then feeds that stored byte straight into its signer seeds."
          - id: d
            label: "Because the runtime only accepts seeds carrying a bump read from account data, and rejects one the program derived during the same call"
            correct: false
            feedback: "The runtime has no idea where your bump came from. It re-runs the derivation over whatever seeds you hand it and checks that they produce this address under your program id, so a freshly computed bump signs exactly as well as a stored one. Storing it is an optimization, not a permission."
        explanation: "PDAs have no private key, so the runtime signs on the program's behalf when handed the right seeds + bump. find_program_address is deterministic but not free: it searches 255 -> 0 for the first off-curve address, burning compute each call. Storing the canonical bump at initialization turns that search into a single field read and lets every later CPI sign with the stored value."
      - id: q2
        prompt: "The deposit path does `balance.checked_add(amount).ok_or(VaultError::Overflow)?` instead of `balance += amount`. Why?"
        multiSelect: false
        options:
          - id: a
            label: "`checked_add` compiles down to one guarded instruction, so it runs faster than a bare `+` and saves compute units on each deposit the vault ever handles"
            correct: false
            feedback: "It is the more expensive of the two, by a margin nobody cares about. The reason to reach for it is the value it returns on failure, which is a thing your handler can name and a client can catch, rather than any saving on the happy path."
          - id: b
            label: "Unchecked addition can overflow or panic; `checked_add` returns None on overflow, which the handler converts into a clean VaultError instead of a crash"
            correct: true
            feedback: "Three outcomes are possible and only one is any good: wrap silently, panic opaquely, or return a named error. The last one is the pattern for all program code, and it comes with the rule that no `unwrap()` or `expect()` belongs anywhere near an instruction handler."
          - id: c
            label: "Anchor's IDL cannot encode the `+` operator on u64 fields, so the checked helpers are required"
            correct: false
            feedback: "The IDL describes your program's external interface, its instructions, arguments and accounts, and never sees the arithmetic inside a handler. Checked math is a Rust discipline you adopt, not a constraint the framework imposes."
          - id: d
            label: "The scaffold already sets overflow-checks = true, so a bare `+` panics instead of wrapping silently, and the checked call is only there as a style convention"
            correct: false
            feedback: "That flag really is in the workspace Cargo.toml and it really does turn a silent wrap into a panic, which is better and still not good enough. A panic aborts the transaction with a failure the client cannot read or branch on, where `checked_add` hands back an error you named yourself."
        explanation: "In release builds Rust wraps on overflow rather than panicking, so a silent wrap could hand an attacker a tiny balance. Anchor's scaffold enables overflow-checks, which turns that into a panic — better, but still an opaque abort. checked_add returns Option, and ok_or maps None to a named program error the client can catch. Checked arithmetic is mandatory in program code; unwrap() and expect() are not allowed."
