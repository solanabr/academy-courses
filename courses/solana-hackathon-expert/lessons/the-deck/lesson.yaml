id: lesson-she-the-deck
slug: the-deck
title: "The hackathon deck, not the investor deck"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Your cover slide carries the product name in large type over a tagline, and the problem first appears on slide 3. Predict what the deck has spent and what the fix is."
        multiSelect: false
        options:
          - id: a
            label: "Nothing much, since a cover is read for a second and the problem slide is where the judge slows down anyway, so the order of the first three holds."
            correct: false
            feedback: "The cover is the only slide a judge reads with fresh eyes, and spending it on a name spends the one read that is free."
          - id: b
            label: "The only slide a judge reads with fresh eyes, so the cover becomes the problem in one sentence with the name small in a corner."
            correct: true
          - id: c
            label: "A little momentum, so the tagline is rewritten to hint at the problem while the name stays large for recall in a stack of forty decks."
            correct: false
            feedback: "The decision the seven headings make first is that the name does not show up until the problem has been said."
        explanation: "A title slide that names the product before the problem is the most common first slide in a hackathon, and it spends the only slide a judge reads with fresh eyes. The judge deck is built from the problem outwards, so the cover is the problem in one sentence with the product name small in a corner. That sentence is the one that becomes pitch final at the end of the lesson."
      - id: q2
        prompt: "You reflow the judge deck into the 10-slide seasonal export and drop the mercado slide because the numbers felt small. Predict the consequence on that surface and the honest fix."
        multiSelect: false
        options:
          - id: a
            label: "A lower market score, so the slide returns with one large figure from a report to make up the ground the small dated numbers lost."
            correct: false
            feedback: "A number that is not in the sizing file is the watch-out by name, and a judge scoring a market-size factor asks whether the number is real."
          - id: b
            label: "No consequence, since a seasonal banca scores the five-minute pitch out loud and skims whatever is on the market slide."
            correct: false
            feedback: "The spec names its sections, and on that surface any missing deliverable disqualifies whatever the banca thought of the pitch."
          - id: c
            label: "Disqualification, since a missing item disqualifies on that spec, so the slide returns with three small dated numbers a judge can click."
            correct: true
        explanation: "The Passo Fundo 2026 spec names capa, problema, solucao, arquitetura, mercado with TAM, SAM and SOM, equipe, proximos passos and CTA, and any missing item disqualifies the team. So the market slide is not optional on that surface, and the honest version is small and dated: three numbers with their sources, each of which traces to the sizing file. Three clickable numbers beat one in the billions a judge cannot check, and the hour goes to the problem slide instead."
      - id: q3
        prompt: "You read the deck to three people for round 3. Only the builder says the problem close to the cover sentence, and the other two describe a category. Predict what happens to the pitch and to the round."
        multiSelect: false
        options:
          - id: a
            label: "The problem slide is rewritten and read again the same day, and the extra entries stay inside round 3."
            correct: true
          - id: b
            label: "The pitch is marked final anyway, since the builder is the reader closest to a judge and two of three is a bar meant for larger rounds."
            correct: false
            feedback: "The rule is two of three landing close to the cover, and the person who knows nothing is the one who tells you whether slide 2 works."
          - id: c
            label: "The round closes and a fresh round 4 opens with three new readers, since the same people cannot fairly score a rewrite they already heard."
            correct: false
            feedback: "The round is the entries and not the day, so a rewrite read again the same day is still round 3 with more than three entries."
        explanation: "Each of the three says the problem in one sentence after the read, and you write down the sentence they said. If two of the three land close to the cover, the pitch is final. If they do not, the problem slide is rewritten and read again the same day, and it is still round 3 with more than three entries, because the round is the entries and not the day. Pitch final is the cover sentence after that, and from there it stops changing."
