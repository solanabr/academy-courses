id: lesson-she-the-record
slug: the-record
title: "Run the record"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "You change the season word in the curl to worldsfair on 2026-09-06 and the endpoint returns an empty list. What does that tell you, and what goes into the prize table?"
        multiSelect: false
        options:
          - id: a
            label: "The path is wrong for that season, so you retry it with an /earn/ prefix and record whatever that fetch returns."
            correct: false
            feedback: "Links with an /earn/ prefix return a 404 to a plain fetch, and the endpoint itself was correct."
          - id: b
            label: "No side tracks were published yet for a season that had not opened, so the empty row goes in with URL and date."
            correct: true
          - id: c
            label: "Earn is not running side tracks for World's Fair, so you drop the row and plan only around the global prize."
            correct: false
            feedback: "An empty list on a season that has not opened says nothing about whether tracks will appear later."
        explanation: "An empty result is part of the record. On 2026-09-06 World's Fair had not opened and no side tracks were listed, so the row goes into the prize table with the URL and the pull date like every other row. That row is what tells you when to come back and pull again, which is the habit the whole lesson is teaching."
      - id: q2
        prompt: "A teammate copies the Frontier row into this season's plan, Superteam Brasil at US$10,000 USDG, and pastes last season's deadline into the calendar. Predict what the record says about that plan."
        multiSelect: false
        options:
          - id: a
            label: "It is safe, because the regional sponsor and amount hold steady between seasons and only the global prize moves."
            correct: false
            feedback: "The Brazilian row changed sponsor and amount between Cypherpunk and Frontier, so it does not hold steady."
          - id: b
            label: "It is mostly safe, because amounts change but the sponsor and dates are fixed by Colosseum's two seasons a year."
            correct: false
            feedback: "The cadence is fixed but the dates, sponsors and amounts are not, and the row you pulled proves it."
          - id: c
            label: "It is already stale, because the Brazilian row moved between seasons and every number carries a pull date."
            correct: true
        explanation: "Between Cypherpunk and Frontier the Brazilian row went from Superteam Brasil x Tangem Wallet at US$11,200 to Side Track Superteam Brasil at US$10,000 USDG, and the track count went from 41 to 54. Every number in the prize table carries a date precisely so you can watch it go stale. A plan built on last season's row or deadline is built on a record that already moved."
      - id: q3
        prompt: "You counted Unruggable's seasons on colosseum.com/companies/unruggable: two honorable mentions, a track win, then the grand prize. Your team lost its first season last month. Predict what the record says about your next twelve months."
        multiSelect: false
        options:
          - id: a
            label: "Two more global seasons will open, April to May and September to October, and the pattern is to enter both."
            correct: true
          - id: b
            label: "One more global season will open this year, and a team that lost once should move to regional side tracks instead."
            correct: false
            feedback: "Colosseum runs two global hackathons a year, and side tracks are won with the same submission, not instead of it."
          - id: c
            label: "The next season is a year away, so the record says to spend that year building before you enter again."
            correct: false
            feedback: "The cadence is two seasons a year, so waiting a year skips two chances to be scored."
        explanation: "Unruggable entered four global seasons and improved each time before taking the Cypherpunk grand prize. Colosseum's hackathon page says it runs two global hackathons a year, April to May and September to October. A team that treats one season as a verdict throws away the second half of the year, which is why the course ends with a next-season plan."
