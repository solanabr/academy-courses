id: lesson-she-submit
slug: submit
title: "The form, the deadline, the rules"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "An Earn listing prints the deadline 2026-09-08T02:59:59Z. A teammate on a laptop set to Brasília time writes: submit on the morning of the 8th. Predict what the conversion command prints and what that plan costs."
        multiSelect: false
        options:
          - id: a
            label: "2026-09-07 23:59:59-03:00, so the plan is already a day late, and the line gets a second tool's agreement and the leader's name next to it."
            correct: true
          - id: b
            label: "2026-09-08 05:59:59-03:00, so the plan is safe with a few hours in hand once the offset is applied in the direction the listing intended."
            correct: false
            feedback: "The offset runs the other way, and a conversion done in your head is the one this lesson tells you never to trust."
          - id: c
            label: "2026-09-08 02:59:59-03:00, so the plan holds, since the trailing Z means the listing already prints the time in local form."
            correct: false
            feedback: "The trailing Z is UTC written short, and the command spells it out as +00:00 before converting."
        explanation: "Pasted into the command, the listing prints 2026-09-08 02:59:59+00:00 and, on a laptop set to Brasília time, 2026-09-07 23:59:59-03:00. The listing says the eighth and the calendar says the seventh one second before midnight, so a team planning for the morning of the 8th has already lost with a working product. The line gets converted a second time with a different tool, marked checked only when both agree, and carries the leader's name because the page says the leader completes the submission."
      - id: q2
        prompt: "Your submission-package.md has no path on the GTM one-pager line, and the portal's last field asks for go-to-market strategy, demand validation and distribution plans. Predict what today is, and what feeds that field once the rung exists."
        multiSelect: false
        options:
          - id: a
            label: "Submission day regardless, since the last field can be composed at the portal from the deck's team slide and the who-pays line."
            correct: false
            feedback: "A line with no path means the rung is missing, and today is the day you finish it, not submission day."
          - id: b
            label: "The day you finish that rung, and the field is then fed by the one-pager, the evidence pack, and a partner named from the partner list."
            correct: true
          - id: c
            label: "Submission day, with the field filled from the description's why-Solana paragraph, which already says where the users come from and how they arrive."
            correct: false
            feedback: "Why Solana is a track argument, and the field asks three questions that the one-pager, the evidence pack and the partner list answer."
        explanation: "If a line in the package file has no path, the rung is missing, and today is the day you finish that rung and not submission day. The last portal field is three questions in one box: go-to-market is the one-pager, demand validation is the evidence pack and whatever traction the month produced, and distribution is the partners named in the partner list. A partner that replied, even with a no, is a better line than a partner category."
      - id: q3
        prompt: "While the leader submits Fiado, a teammate registers a second account and submits a side experiment under their own name, to be safe. Predict which rule that breaks and who should have pressed any button."
        multiSelect: false
        options:
          - id: a
            label: "No rule, since the experiment is a different product and Colosseum counts one product per team rather than per person."
            correct: false
            feedback: "The page says one per team and therefore one per individual, so a person with two submissions in a season breaks it."
          - id: b
            label: "The development-history rule, since the experiment shares code with Fiado and neither submission disclosed the overlap."
            correct: false
            feedback: "Disclosure is a separate line on the checklist, and the rule broken here is the one about one product per individual."
          - id: c
            label: "The one-product-per-individual rule, so nobody on the team submits anything else and the leader alone presses submit."
            correct: true
        explanation: "The page reads: only one product submission is allowed per team, and therefore one per individual, during each hackathon. The way teams break it without meaning to is the second account, a teammate registering to be safe or submitting a side experiment under their own name. So nobody on the team submits anything else, the leader is the only person who presses the button, and the leader signs that box on the checklist."
      - id: q4
        prompt: "Your repo is private. One teammate says access was granted to hackathon@colosseum.com and nobody checked the access list. Predict what the reviewer's completeness pass finds and what the checklist requires."
        multiSelect: false
        options:
          - id: a
            label: "A repo the reviewer cannot open, read as no repo, so a second teammate confirms the grant on the access list and signs the box."
            correct: true
          - id: b
            label: "A repo the reviewer requests access to, so the team waits for the request and grants it during the review week."
            correct: false
            feedback: "The reviewer checks that the repo opens on the first pass, and a repo nobody can open is read as no repo."
          - id: c
            label: "No problem, since the portal link carries the grant and a private repo with a link pasted in is treated the same as a public one by the reviewer."
            correct: false
            feedback: "The page allows a private repo only if access is granted to the address it names, and the link alone grants nothing."
        explanation: "The repository field is the one with a second person in it. A private repo without access granted to hackathon@colosseum.com is a repo the reviewer cannot open, and a repo nobody can open is scored as no repo. The grant is a step one teammate does, and confirming it by reading the access list is a second step by a second teammate, which is why the fourth checklist box is the one the leader does not sign alone."
