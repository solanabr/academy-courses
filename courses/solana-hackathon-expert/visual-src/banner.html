<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<link rel="stylesheet" href="_render.css">
<style>
  @page { size: 1600px 900px; margin: 0; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; position: relative; overflow: hidden;
         background: var(--surface-page); padding: 0; }
  .bg { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; }
  .logo { position: absolute; top: 56px; left: 64px; height: 44px; }
  .title { position: absolute; top: 490px; left: 150px; width: 1300px; margin: 0;
           text-align: center; font-family: var(--font-display);
           font-weight: var(--weight-black); color: var(--text-primary);
           font-size: 76px; line-height: 1.06; letter-spacing: var(--tracking-tight); }
  .meta { position: absolute; top: 718px; left: 0; width: 1600px; text-align: center; }
  /* inline-BLOCK, not inline-flex: WeasyPrint double-draws borders on inline-flex */
  .pill { display: inline-block; margin: 0 7px; padding: 13px 28px;
          border-radius: var(--radius-pill); font-family: var(--font-display);
          font-weight: var(--weight-bold); font-size: 23px; letter-spacing: 0.08em;
          text-transform: uppercase; white-space: nowrap; }
  .pill svg { vertical-align: -4px; margin-right: 8px; }
  .pill--level { background: var(--stbr-emerald); color: var(--text-on-brand); }
  .pill--stat  { border: var(--border-bold) solid var(--stbr-dark);
                 color: var(--text-primary); background: var(--stbr-cream); }
  .pill--xp    { background: var(--stbr-yellow); color: var(--text-on-accent); }
</style></head>
<body>
<!-- banner-bg: blur=0 brightness=1.0 file=banner-bg-sharp.png -->
<!-- COURSE BANNER, photo mode with the owner's Colosseum coin art (2026-09-10):
     the coin and the two corner blobs are baked into the backdrop; type sits
     straight on the cream below the coin. The XP bolt is inline SVG. -->
<img class="bg" src="banner-bg-sharp.png" alt="">
<img class="logo" src="logo.svg" alt="">
<h1 class="title">Solana Hackathon Expert:<br>Build a Winning Project</h1>
<div class="meta">
  <span class="pill pill--level">INTERMEDIATE</span>
  <span class="pill pill--stat">16 LESSONS &middot; 12 HOURS</span>
  <span class="pill pill--xp"><svg width="18" height="26" viewBox="0 0 16 24"><polygon points="9,0 0,14 6,14 5,24 16,9 9,9" fill="#1b231d"/></svg>300 XP</span>
</div>
</body></html>
