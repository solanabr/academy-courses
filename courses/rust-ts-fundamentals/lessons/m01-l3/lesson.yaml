id: lesson-rtf-m01-l3
slug: m01-l3
title: "Green means it ran without you: git, GitHub flow, Actions"
skills: []
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: first-ship-check
    type: quiz
    questions:
      - id: m01-l3-q1
        prompt: "Your cron is `*/30 * * * *` but the run timestamps land at :07 and :41, and one half-hour slot has no run at all. What's happening?"
        multiSelect: false
        options:
          - id: a
            label: "A workflow syntax error, valid cron YAML always fires within the scheduled minute"
            correct: false
            feedback: "A syntax error would disable the workflow entirely, not shift it. Drifting timestamps with occasional gaps is the documented behavior of a healthy schedule on shared infrastructure."
          - id: b
            label: "Free-tier runs are queued behind paid plans, upgrading buys exact-time scheduling"
            correct: false
            feedback: "No plan buys punctual cron, the best-effort language applies to scheduled events across the platform, and GitHub documents no exact-time tier. The fix is designing for drift, not paying."
          - id: c
            label: "Schedules are best-effort, delayed under load, and queued runs can even be dropped"
            correct: true
        explanation: "GitHub's own docs say scheduled events can be delayed during high-load periods, the start of every hour is named, and 'if the load is sufficiently high enough, some queued jobs may be dropped.' No delay bound is documented anywhere, so the station does what monitors do: diff scheduled time against actual commit time and know YOUR skew. A 30-minute heartbeat tolerates this fine; that tolerance is a design decision you just made."
      - id: m01-l3-q2
        prompt: "Your workflow commits status.json back to the repo on every run, a push, to a repo with a push-triggered workflow. Why doesn't this loop forever?"
        multiSelect: false
        options:
          - id: a
            label: "Events triggered by GITHUB_TOKEN don't create new workflow runs, the recursion guard"
            correct: true
          - id: b
            label: "GitHub detects commit loops by content hashing and cancels the repeating runs"
            correct: false
            feedback: "There's no content-based loop detection, the guard is simpler and earlier: the run never starts, because the triggering event came from the workflow's own token."
          - id: c
            label: "Workflows are rate-limited to one run per branch per minute, which breaks the cycle"
            correct: false
            feedback: "A per-minute cap would slow a loop, not stop it, you'd still burn a run every minute forever. The actual mechanism is that token-authored events don't trigger runs at all."
        explanation: "The docs state it directly: events triggered by GITHUB_TOKEN will not create a new workflow run (workflow_dispatch and repository_dispatch excepted), a deliberate guard against accidental recursion. For the station it's a feature, not a limitation: the status commit is data, not a signal. When you someday WANT a downstream workflow to react, the documented path is a PAT or GitHub App token, a bridge m09-l2's alarm work walks past again."
      - id: m01-l3-q3
        prompt: "You return from a two-month break: repo untouched, no failure emails, and status.json's last commit is weeks old. What most likely happened?"
        multiSelect: false
        options:
          - id: a
            label: "The month's free Actions minutes ran out and the workflow paused until the next cycle"
            correct: false
            feedback: "Minutes quotas meter private repos, the station's public repo runs unmetered on standard runners. Nothing here is counting your minutes."
          - id: b
            label: "Public-repo schedules auto-disable after 60 days of inactivity, it needs re-enabling"
            correct: true
          - id: c
            label: "Cron workflows expire after 90 days and must be recreated with a fresh workflow file"
            correct: false
            feedback: "Workflows never expire, the file is fine and nothing needs rewriting. The schedule was switched off by the inactivity rule, and one click (or one commit) brings the existing workflow back."
        explanation: "The documented rule: in a public repository, scheduled workflows are automatically disabled when no repository activity has occurred in 60 days. No failure notification fires because nothing failed, the schedule just stopped, silently. Re-enable it in the Actions tab; the keepalive-commit countermeasure works in practice, though GitHub never defines which activity resets the clock, the lesson teaches the hedge along with the fix. This silent-death mode is exactly why m09-l2 builds an alarm for the monitor itself."
      - id: m01-l3-q4
        prompt: "A friend warns you: 'CI gets expensive, my team burns through the free minutes by mid-month.' Why does the station's pipeline cost nothing, this month and every month?"
        multiSelect: false
        options:
          - id: a
            label: "Every GitHub account gets unlimited Actions minutes across all of its repos, public or private"
            correct: false
            feedback: "Private repos are metered, the Free plan includes 2,000 minutes a month and stops there. Your friend's team is real; they're just on private repos."
          - id: b
            label: "The 2,000 free monthly minutes comfortably cover a probe that only runs every 30 minutes"
            correct: false
            feedback: "The arithmetic might even work, but it's answering the wrong question. The station never touches that quota, because the quota only exists for private repos."
          - id: c
            label: "Public repos on standard runners are unmetered, minutes quotas only meter private repos"
            correct: true
        explanation: "The vendor's line: Actions usage is free for public repositories using standard GitHub-hosted runners; included minutes (Free plan: 2,000/month) are a private-repo concept. Two catches worth keeping: larger runners are ALWAYS charged, even on public repos, so the station stays on ubuntu-latest, and this economics is exactly why m01-l1 made 'your repo is public' a stated prerequisite with its cost said out loud."
