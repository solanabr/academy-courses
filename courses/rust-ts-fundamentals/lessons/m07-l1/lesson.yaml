id: lesson-rtf-m07-l1
slug: m07-l1
title: "A worker in every city: TS at the edge + KV"
skills: []
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: edge-platform-check
    type: quiz
    questions:
      - id: m07-l1-q1
        prompt: "You import pulse-core into the fresh worker project and the build fails on a module that reads the config file from disk. Which parts of pulse-core port to workerd unchanged?"
        multiSelect: false
        options:
          - id: a
            label: "The pure logic, classifiers and result types with no node imports"
            correct: true
          - id: b
            label: "Everything, workerd runs JavaScript, so any JS module loads fine"
            correct: false
            feedback: "workerd runs JS but is not node: fs, process, and node: builtins don't exist there. The build failure you just hit is exactly that seam."
          - id: c
            label: "Only code already bundled for browsers, since workers are browser runtimes"
            correct: false
            feedback: "workerd is its own runtime, not a browser, no DOM, but also more than a browser (KV, cron, bindings). The dividing line is node-specific I/O, not browser bundling."
        explanation: "This is the pure-core/IO-shell seam paying off: because m03-l1 extracted pulse-core with its logic separated from its node I/O, the classifiers and types port to the edge unchanged, while file reads and env access get replaced by platform fetch, bindings, and KV. The purity was never ceremony, it is portability."
      - id: m07-l1-q2
        prompt: "Your deployed worker needs an auth token for one protected probe target. Where does the token go so it works in prod without ever landing in git?"
        multiSelect: false
        options:
          - id: a
            label: "In wrangler.toml under [vars], since that file configures the worker"
            correct: false
            feedback: "[vars] is committed plaintext configuration, anyone with repo access reads your token. Vars are for non-secret config only."
          - id: b
            label: "Set with `wrangler secret put`, with a gitignored .dev.vars copy for local dev"
            correct: true
          - id: c
            label: "In a KV entry the worker reads at startup, since KV is private storage"
            correct: false
            feedback: "KV is data storage, not a secret store, values are readable via the API and your own public endpoint code could leak them. Secrets go through the secrets binding."
        explanation: "The taught split: .dev.vars (dotenv syntax, gitignored) supplies local dev; `wrangler secret put` stores the prod value, which is not visible after set. wrangler.toml vars are for public config. This is the same secrets-hygiene glue beat the m09-l2 four-platform sweep will revisit."
      - id: m07-l1-q3
        prompt: "You add a retry loop that busy-spins computing statistics over probe history, and invocations start erroring on the free tier, but your request count is nowhere near the daily cap. What limit did you hit?"
        multiSelect: false
        options:
          - id: a
            label: "The 100,000 requests/day allowance, cron runs count against it too"
            correct: false
            feedback: "Cron invocations do count as requests, but you just observed the count is far under the daily cap. The symptom (per-invocation error under load) points at a per-invocation limit."
          - id: b
            label: "The KV write limit, each retry writes status and free KV allows 1,000 writes/day"
            correct: false
            feedback: "KV write exhaustion would fail the KV puts, not kill the invocation mid-computation. The busy-spin is CPU, and CPU is what the free tier meters per invocation."
          - id: c
            label: "The 10 ms CPU budget per invocation, compute is metered, waiting on I/O is not"
            correct: true
        explanation: "Workers Free gives 100,000 requests/day and 10 ms of CPU per invocation. Time spent awaiting fetch is not CPU time, which is why a probe worker fits the free tier beautifully and a number-crunching worker does not. Heavy computation belongs in the Docker poller; the edge is for probes."
  - key: edge-ramp-check
    type: quiz
    questions:
      - id: m07-l1-q4
        prompt: "You cache last-known-status in a top-level variable in the worker and it keeps 'resetting'. Why does the lesson store it in KV instead?"
        multiSelect: false
        options:
          - id: a
            label: "Isolates are ephemeral and per-location, memory doesn't survive invocations or span cities"
            correct: true
          - id: b
            label: "Worker memory is capped so small that a status object won't reliably fit in it"
            correct: false
            feedback: "A JSON snapshot fits in memory fine, size is not the issue. The issue is lifetime and locality: the isolate you wrote to may not be the one that serves the next request."
          - id: c
            label: "Top-level variables are read-only in workerd, so writes to them are silently dropped"
            correct: false
            feedback: "Globals are writable within an isolate's lifetime, that's why it works for a few requests before 'resetting'. Nothing is dropped; the isolate simply died or the request landed elsewhere."
        explanation: "Statelessness is the platform's core deal: your code runs as short-lived isolates in many cities, so shared state needs a shared store. KV is the taught answer for last-known-status, eventually consistent, globally readable, and generous enough on the free tier for a probe fleet's write rate."
      - id: m07-l1-q5
        prompt: "A teammate sends you a 2023 tutorial: 'deploy your status page with Cloudflare Pages.' Per the vendor's current docs, what's the right call for a NEW project?"
        multiSelect: false
        options:
          - id: a
            label: "Use Pages, it's the static-site product, and a status page is a static site"
            correct: false
            feedback: "That was the 2023 framing. Cloudflare's own Pages docs now steer new projects away, Workers serves static assets and offers the broader feature set (cron, KV, gradual deploys)."
          - id: b
            label: "Build on Workers, Cloudflare's Pages docs themselves say to start new projects with Workers"
            correct: true
          - id: c
            label: "Use both, Pages for the static assets and a Worker for anything dynamic behind it"
            correct: false
            feedback: "You don't need the split anymore: Workers serves static assets directly, which is exactly why the vendor recommends it for new projects. Two platforms where one suffices is drift waiting to happen."
        explanation: "Probed live 2026-09-01, the Pages docs banner reads: 'Workers supports most Pages use cases and offers a broader feature set... Start new projects with Workers.' The meta-lesson outranks the platform trivia: read the vendor's current docs, not blog posts from the year a tutorial was written."
      - id: m07-l1-q6
        prompt: "Your worker's cron probes the Solana public RPC getHealth endpoint and occasionally gets a 429. What does the station's own discipline say to do?"
        multiSelect: false
        options:
          - id: a
            label: "Retry immediately in a loop until it answers, getHealth is a cheap call"
            correct: false
            feedback: "Immediate retries are exactly what the cap punishes: the public RPC allows 100 requests per 10 seconds per IP, and hammering it digs the hole deeper. This is the naive Promise.all mistake from m02-l3 in new clothes."
          - id: b
            label: "Apply the m02-l3 backoff and treat the cap (100 req/10s/IP) as a budget the probe respects"
            correct: true
          - id: c
            label: "Switch the worker to @solana/kit, which manages public RPC rate limits for you"
            correct: false
            feedback: "kit is a client library, not a rate-limit exemption, the per-IP cap applies regardless of what constructs the request. kit reads arrive in M8 for other reasons; this lesson's ramp is deliberately a plain fetch."
        explanation: "The structural Solana ramp: the chain joins the target list as just another endpoint with real limits, 100 requests per 10 seconds per IP on the public RPC. The backoff-and-budget discipline you built for flaky HTTP in M2 is exactly what chain probing needs, which is the whole argument of M8 in miniature."
