id: lesson-rtf-m08-l3
slug: m08-l3
title: "The Rust path: raw JSON-RPC"
skills:
  - solana-fundamentals
  - solana-kit
  - rpc-reads
  - transactions
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: rust-path-check
    type: quiz
    questions:
      - id: m08-l3-q1
        prompt: "The TS surfaces use a client library; the Rust poller POSTs raw JSON-RPC. Why does the course refuse to reach for the solana-client crate here?"
        multiSelect: false
        options:
          - id: a
            label: "solana-client bundles a QUIC/TPU submission transport a two-read poller never calls"
            correct: true
          - id: b
            label: "solana-client is effectively unmaintained, so depending on it is a supply-chain liability"
            correct: false
            feedback: "It's actively maintained inside the mainline Solana Rust ecosystem, abandonment isn't the argument. The argument is fit: a transaction-submission transport stack is dead weight under a two-read poller."
          - id: c
            label: "solana-client cannot perform reads at all, it exists only to submit transactions"
            correct: false
            feedback: "It reads fine, it's the kitchen-sink client precisely because it does everything. The point is what ELSE it drags in for a program that will only ever ask two questions."
        explanation: "The call this lesson makes: for a fundamentals reader, plain JSON-RPC over reqwest + serde_json reinforces the skills the course already built and carries zero Solana-crate churn. solana-client exists for full clients that submit transactions over QUIC to leaders, a different job. When reads outgrow this pattern, the typed path is solana-rpc-client and the granular crates in the go-deeper box."
      - id: m08-l3-q2
        prompt: "A teammate counters: 'solana-rpc-client has MORE direct dependencies than solana-client, your slim crate argument is backwards.' What's the honest reply?"
        multiSelect: false
        options:
          - id: a
            label: "They must be counting dev-dependencies; by normal deps solana-client is far larger"
            correct: false
            feedback: "No, by raw direct-dep count solana-rpc-client genuinely comes out ahead (light type-crates add up). Disputing their count loses; the count is real and it's the wrong axis."
          - id: b
            label: "They're right on the count, wrong on the axis, slimness means transport scope here"
            correct: true
          - id: c
            label: "Dependency counts don't matter at all in Rust, since the compiler strips unused code"
            correct: false
            feedback: "Dead-code elimination doesn't erase the costs of a big tree, compile time, audit surface, and churn all scale with what you pull in. Counts matter; RAW counts just don't rank these two crates correctly."
        explanation: "The corrected research row exists for this exact exchange: solana-rpc-client has more direct deps by raw count, yet zero of the QUIC/TPU/streamer transport machinery. The defensible claim is scoped, 'no submission transport a reader never uses', and the meta-lesson is to argue from the axis that actually differentiates, because a learner who counts will catch you."
      - id: m08-l3-q3
        prompt: "Your balance probe deserializes cleanly, but a probe against a mistyped method name returns HTTP 200 and your poller marks the target healthy. What did you miss?"
        multiSelect: false
        options:
          - id: a
            label: "A reqwest timeout, the request hung and the stale success from the previous tick leaked through"
            correct: false
            feedback: "A hang would surface as a slow or errored tick, not a clean 200. The response arrived promptly, the problem is what was INSIDE it."
          - id: b
            label: "The retry budget, a single attempt isn't enough to distinguish healthy from unhealthy"
            correct: false
            feedback: "No retry policy fixes this: every attempt would return the same misleading 200. The bug is in classification, not persistence."
          - id: c
            label: "JSON-RPC reports failures inside a 200 response, you must check the envelope's error member"
            correct: true
        explanation: "The transport layer succeeded, HTTP did its job delivering a well-formed reply that happens to say 'error' in JSON-RPC's own envelope. That's why the ProbeRpcError taxonomy gives the in-envelope error its own variant, distinct from transport and status failures: four different failure planes, four different remediations, one greppable name each when m09-l2's logging lands."
      - id: m08-l3-q4
        prompt: "You merged the chain-probe module and pushed. What turns that commit into the re-shipped station, and what did YOU have to do beyond the push?"
        multiSelect: false
        options:
          - id: a
            label: "CI rebuilds and pushes the GHCR image from the same M6 pipeline, nothing new; you pull and run it"
            correct: true
          - id: b
            label: "You rebuild locally with cargo --release and docker push from your machine, as CI can't reach GHCR"
            correct: false
            feedback: "CI has been pushing to GHCR with GITHUB_TOKEN since m06-l4, that was the whole point of ship #3. Hand-pushing from a laptop would bypass the tests-gate and reintroduce works-on-my-machine."
          - id: c
            label: "You cut a GitHub Release so the workflow attaches a new binary, which GHCR then mirrors"
            correct: false
            feedback: "Releases-with-binaries was m05-l3's ship, a different artifact on a different path. GHCR images build from the container workflow on push, no release tag involved, and GHCR mirrors nothing."
        explanation: "The re-ship IS the lesson's demonstration: the M6 pipeline, test, build multi-stage, push to GHCR, consumed the new probe module without a single ops change. Code that lands in an already-shipping system inherits its ship. Your only manual steps were the ones proving it worked: pull the fresh image, run it, curl /status."
