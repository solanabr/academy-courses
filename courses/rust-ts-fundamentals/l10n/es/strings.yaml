                # | lesson pushed them. The gate names what comes after the push, not what
                # | came before.
                feedback: "Esos fueron ESTE módulo: m06-l3 construyó las imágenes multi-stage y esta lección las empujó. La barrera nombra lo que viene después del push, no lo que vino antes."  # @src=f2a9d2249729
              d:
                # | Orchestration and cloud runtimes, deferred to the sibling course this
                # | catalog hands container work off to
                label: "Orquestación y runtimes de nube, postergados al curso hermano al que este catálogo le pasa el trabajo de contenedores"  # @src=d9b0435efc3c
                # | There is no such sibling. The gate says so plainly: Kubernetes is out of
                # | scope with nothing to hand you to, which is why honest signposts are
                # | what this boundary offers instead of a next enrolment.
                feedback: "No existe tal hermano. La barrera lo dice sin adornos: Kubernetes está fuera de alcance sin nada a quien pasarte, que es por qué lo que ofrece este límite son letreros honestos en vez de una próxima inscripción."  # @src=bdd5cdef6921
  m07-l1:
    # | A worker in every city: TS at the edge + KV
    title: "Un worker en cada ciudad: TS en el edge + KV"  # @src=5464c348159b
    blocks:
      edge-platform-check:                      # quiz
        questions:
          m07-l1-q1:
            # | You import pulse-core into the fresh worker project; the build succeeds, but
            # | `wrangler dev` refuses to start on the module that reads the config file
            # | from disk. Which parts of pulse-core port to workerd unchanged?
            prompt: "Importas pulse-core al proyecto de worker nuevo; el build funciona, pero `wrangler dev` se niega a arrancar por el módulo que lee el archivo de config del disco. ¿Qué partes de pulse-core portan a workerd sin cambios?"  # @src=dbd88500f6d9
            # | This is the pure-core/IO-shell seam paying off: because m03-l1 extracted
            # | pulse-core with its logic separated from its node I/O, the classifiers and
            # | types port to the edge unchanged, while file reads and env access get
            # | replaced by platform fetch, bindings, and KV. The purity was never ceremony,
            # | it is portability.
            explanation: "Esta es la costura de núcleo puro y cascarón de I/O pagando: porque m03-l1 extrajo pulse-core con su lógica separada de su I/O de node, los clasificadores y los tipos portan al edge sin cambios, mientras las lecturas de archivos y el acceso a env quedan reemplazados por el fetch de la plataforma, bindings, y KV. La pureza nunca fue ceremonia, es portabilidad."  # @src=6e213860e5c7
            options:                 # source order — keep it
              e:
                # | The logic and backoff helpers, once you re-export them through a
                # | worker-safe entry
                label: "La lógica y los helpers de backoff, una vez que los vuelvas a exportar por una entrada segura para el worker"  # @src=e7abd2c80b93
                # | No second entry point is needed. The published package installs into the
                # | worker exactly as it installed into the dashboard, which is the third
                # | consumer proving the extraction.
                feedback: "No hace falta ningún segundo punto de entrada. El paquete publicado se instala en el worker exactamente como se instaló en el panel, que es el tercer consumidor probando la extracción."  # @src=09f50318160a
              a:
                # | The pure logic, classifiers and result types with no node imports
                label: "La lógica pura, los clasificadores y los tipos de resultado sin imports de node"  # @src=de6c4e93ac68
                # | m03-l1's extraction paying for itself: the classifiers, the types and
                # | backoffDelay are pure functions over plain data with no opinion about
                # | where they run. The port is import the core, rewrite the shell.
                feedback: "La extracción de m03-l1 pagándose sola: los clasificadores, los tipos y backoffDelay son funciones puras sobre datos pelados sin ninguna opinión sobre dónde corren. El port es importa el core, reescribe el cascarón."  # @src=8d7f6ec7f8ae
              b:
                # | Everything, workerd runs JavaScript, so any JS module loads fine
                label: "Todo, workerd corre JavaScript, así que cualquier módulo de JS carga bien"  # @src=9fbd65627aad
                # | workerd runs JS but is not node: the node builtins are only shims with
                # | no OS behind them, and the read-only /bundle mount is the only
                # | filesystem, so the config read dies at startup. The refusal you just hit
                # | is exactly that seam.
                feedback: "workerd corre JS pero no es node: los builtins de node son solo shims sin OS detrás, y el montaje de solo lectura /bundle es el único sistema de archivos, así que la lectura de config se muere al arrancar. El rechazo que acabas de encontrar es exactamente esa costura."  # @src=218b2905f8ab
              d:
                # | The logic plus the config loader, since node builtins resolve under the
                # | compat shim
                label: "La lógica más el cargador de config, porque los builtins de node resuelven bajo el shim de compat"  # @src=09e74566ec64
                # | The resolve is the trap. readFileSync is a real function under the
                # | compat shim and there is still no disk behind it, which is why the
                # | runtime dies naming /bundle/pulse.config.json. The module ported; the
                # | machine did not.
                feedback: "El resolve es la trampa. readFileSync es una función de verdad bajo el shim de compat y sigue sin haber disco detrás, que es por qué el runtime se muere nombrando /bundle/pulse.config.json. El módulo portó; la máquina no."  # @src=59f7ffd498c5
              c:
                # | Only code already bundled for browsers, since workers are browser
                # | runtimes
                label: "Solo código ya bundleado para navegadores, porque los workers son runtimes de navegador"  # @src=5fe5183715ec
                # | workerd is its own runtime, not a browser, no DOM, but also more than a
                # | browser (KV, cron, bindings). The dividing line is node-specific I/O,
                # | not browser bundling.
                feedback: "workerd es su propio runtime, no un navegador, sin DOM, pero también más que un navegador (KV, cron, bindings). La línea divisoria es el I/O específico de node, no el bundling de navegador."  # @src=b099fe34cb81
          m07-l1-q2:
            # | Your deployed worker needs an auth token for one protected probe target.
            # | Where does the token go so it works in prod without ever landing in git?
            prompt: "Tu worker desplegado necesita un token de auth para un target de sonda protegido. ¿Dónde va el token para que funcione en prod sin aterrizar nunca en git?"  # @src=d3db4c1045f3
            # | The taught split: .dev.vars (dotenv syntax, gitignored) supplies local dev;
            # | `wrangler secret put` stores the prod value, which is not visible after set.
            # | wrangler.jsonc vars are for public config. This is the same secrets-hygiene
            # | glue beat the m09-l2 four-platform sweep will revisit.
            explanation: "La partición enseñada: .dev.vars (sintaxis dotenv, gitignoreado) alimenta el dev local; `wrangler secret put` guarda el valor de prod, que no se ve después de fijarlo. Las vars de wrangler.jsonc son para config pública. Este es el mismo beat de pegamento sobre higiene de secretos que va a revisitar el barrido de cuatro plataformas de m09-l2."  # @src=d83549a00451
            options:                 # source order — keep it
              d:
                # | In a .env file the handler reads through process.env, the way the fleet
                # | loaded its token
                label: "En un archivo .env que el handler lee a través de process.env, como la flota cargaba su token"  # @src=8fa830a629de
                # | Nothing is ambient in a worker. Capabilities arrive as one typed env
                # | parameter declared in the config, which is the platform enforcing the
                # | injection your fleet only had by discipline.
                feedback: "Nada es ambiente en un worker. Las capacidades llegan como un único parámetro env tipado declarado en la config, que es la plataforma imponiendo la inyección que tu flota solo tenía por disciplina."  # @src=f317b0f0e800
              a:
                # | In wrangler.jsonc under "vars", since that file is what configures the
                # | deployed worker
                label: "En wrangler.jsonc bajo \"vars\", porque ese archivo es lo que configura el worker desplegado"  # @src=efbbe151eced
                # | "vars" is committed plaintext configuration, anyone with repo access
                # | reads your token. Vars are for non-secret config only.
                feedback: "\"vars\" es configuración commiteada en texto plano, cualquiera con acceso al repo lee tu token. Las vars son solo para config no secreta."  # @src=b0b5618d2dc1
              b:
                # | Set with `wrangler secret put`, with a gitignored .dev.vars copy for
                # | local dev
                label: "Fijado con `wrangler secret put`, con una copia gitignoreada en .dev.vars para el dev local"  # @src=83ea9ce6145f
                # | The prod value is stored encrypted and is never shown again, not in the
                # | dashboard and not by wrangler; only its name is visible. The .dev.vars
                # | half is what keeps `wrangler dev` working without it.
                feedback: "El valor de prod se guarda encriptado y nunca se vuelve a mostrar, ni en el panel ni con wrangler; solo su nombre es visible. La mitad de .dev.vars es lo que mantiene a `wrangler dev` funcionando sin él."  # @src=469b88b869f5
              c:
                # | In a KV entry the worker reads at startup, since only the bound worker
                # | can read that namespace
                label: "En una entrada de KV que el worker lee al arrancar, porque solo el worker con el binding puede leer ese namespace"  # @src=147cc298b40b
                # | KV is data storage, not a secret store, values are readable via the API
                # | and your own public endpoint code could leak them. Secrets go through
                # | the secrets binding.
                feedback: "KV es almacenamiento de datos, no un almacén de secretos, los valores se leen vía la API y el código de tu propio endpoint público podría filtrarlos. Los secretos van por el binding de secrets."  # @src=3bf32b105789
          m07-l1-q3:
            # | You add a retry loop that busy-spins computing statistics over probe
            # | history, and invocations start erroring on the free tier, but your request
            # | count is nowhere near the daily cap. What limit did you hit?
            prompt: "Agregas un loop de retry que gira ocupado computando estadísticas sobre el historial de sondas, y las invocaciones empiezan a tirar error en el tier gratis, pero tu conteo de requests está lejísimos del tope diario. ¿Con qué límite chocaste?"  # @src=703080db01e5
            # | Workers Free gives 100,000 requests/day and 10 ms of CPU per invocation.
            # | Time spent awaiting fetch is not CPU time, which is why a probe worker fits
            # | the free tier beautifully and a number-crunching worker does not. Heavy
            # | computation belongs in the Docker poller; the edge is for probes.
            explanation: "Workers Free da 100,000 requests/día y 10 ms de CPU por invocación. El tiempo gastado esperando fetch no es tiempo de CPU, que es por qué un worker de sondas le entra hermoso al tier gratis y un worker que tritura números no. La computación pesada pertenece al poller de Docker; el edge es para sondas."  # @src=214f532a02da
            options:                 # source order — keep it
              b:
                # | The KV write limit, each retry writes status and free KV allows 1,000
                # | writes/day
                label: "El límite de escrituras de KV, cada retry escribe estado y el KV gratis da 1,000 escrituras/día"  # @src=c8397ebea846
                # | KV write exhaustion would fail the KV puts, not kill the invocation
                # | mid-computation. The busy-spin is CPU, and CPU is what the free tier
                # | meters per invocation.
                feedback: "Agotar las escrituras de KV haría fallar los puts a KV, no matar la invocación a mitad de cómputo. El giro ocupado es CPU, y la CPU es lo que mide el tier gratis por invocación."  # @src=c77f70bab5ff
              a:
                # | The 100,000 requests/day allowance, since scheduled cron invocations
                # | count against it too
                label: "La asignación de 100,000 requests/día, porque las invocaciones de cron planificadas también cuentan contra ella"  # @src=22e1f04a1a48
                # | Cron invocations do count as requests, but you just observed the count
                # | is far under the daily cap. The symptom (per-invocation error under
                # | load) points at a per-invocation limit.
                feedback: "Las invocaciones de cron sí cuentan como requests, pero acabas de observar que el conteo está muy por debajo del tope diario. El síntoma (error por invocación bajo carga) apunta a un límite por invocación."  # @src=9aac6375c34f
              c:
                # | The 10 ms CPU budget per invocation, compute is metered, waiting on I/O
                # | is not
                label: "El presupuesto de 10 ms de CPU por invocación, el cómputo se mide, esperar en I/O no"  # @src=0ec8a2c0a3d2
                # | That asymmetry is the free tier's whole personality: a probe worker
                # | whose life is 99% waiting fits it beautifully, and number crunching
                # | belongs back in the Docker poller where CPU is yours by the hour.
                feedback: "Esa asimetría es toda la personalidad del tier gratis: un worker de sondas cuya vida es 99% esperar le entra hermoso, y triturar números pertenece de vuelta al poller de Docker donde la CPU es tuya por hora."  # @src=2ba13a2f1ef8
              d:
                # | The 10 ms budget, typically spent by awaiting fetches not by your loop
                label: "El presupuesto de 10 ms, gastado típicamente esperando fetches y no por tu loop"  # @src=035d77db2480
                # | Right limit, wrong spender. Awaiting a fetch costs no CPU at all, which
                # | is why three sequential probes in the cron handler are free and one
                # | tight synchronous loop is not.
                feedback: "Límite correcto, gastador equivocado. Esperar un fetch no cuesta ninguna CPU, que es por qué tres sondas secuenciales en el handler del cron son gratis y un solo loop síncrono apretado no."  # @src=2c4c0b0b7f59
      edge-ramp-check:                      # quiz
        questions:
          m07-l1-q4:
            # | You cache last-known-status in a top-level variable in the worker and it
            # | keeps 'resetting'. Why does the lesson store it in KV instead?
            prompt: "Cacheas el último estado conocido en una variable de nivel superior en el worker y sigue 'reseteándose'. ¿Por qué la lección lo guarda en KV en cambio?"  # @src=23ea51bb86d8
            # | Statelessness is the platform's core deal: your code runs as short-lived
            # | isolates in many cities, so shared state needs a shared store. KV is the
            # | taught answer for last-known-status, eventually consistent, globally
            # | readable, and generous enough on the free tier for a probe fleet's write
            # | rate.
            explanation: "La falta de estado es el trato central de la plataforma: tu código corre como isolates de vida corta en muchas ciudades, así que el estado compartido necesita un almacén compartido. KV es la respuesta enseñada para el último estado conocido, eventualmente consistente, legible globalmente, y lo bastante generoso en el tier gratis para la tasa de escrituras de una flota de sondas."  # @src=d275952eb83f
            options:                 # source order — keep it
              b:
                # | Worker memory is capped so small that a status object won't reliably fit
                # | in it
                label: "La memoria del worker tiene un tope tan chico que un objeto de estado no entra en ella de forma confiable"  # @src=3f15d06fd949
                # | A JSON snapshot fits in memory fine, size is not the issue. The issue is
                # | lifetime and locality: the isolate you wrote to may not be the one that
                # | serves the next request.
                feedback: "Un snapshot de JSON entra bien en memoria, el tamaño no es el problema. El problema es el tiempo de vida y la localidad: el isolate al que escribiste puede no ser el que sirva el siguiente request."  # @src=cf6b07a33da8
              d:
                # | A wrangler dev artifact: dev reloads the module each request, a deployed
                # | isolate keeps it
                label: "Un artefacto de wrangler dev: dev recarga el módulo en cada request, un isolate desplegado lo conserva"  # @src=690316958838
                # | Backwards. Dev is the friendlier case, one machine and one isolate,
                # | which is why it worked in dev is the classic bug here. Production
                # | spreads you across cities that never shared the variable.
                feedback: "Al revés. Dev es el caso más amigable, una máquina y un isolate, que es por qué funcionaba en dev es el bug clásico acá. Producción te reparte por ciudades que nunca compartieron la variable."  # @src=3075f7f3e604
              c:
                # | Top-level variables are read-only in workerd, so writes to them are
                # | silently dropped
                label: "Las variables de nivel superior son de solo lectura en workerd, así que las escrituras a ellas se descartan calladamente"  # @src=a15dacd090de
                # | Globals are writable within an isolate's lifetime, that's why it works
                # | for a few requests before 'resetting'. Nothing is dropped; the isolate
                # | simply died or the request landed elsewhere.
                feedback: "Las globales son escribibles dentro del tiempo de vida de un isolate, por eso funciona por unos cuantos requests antes de 'resetearse'. Nada se descarta; el isolate simplemente se murió o el request aterrizó en otro lado."  # @src=a953e98b0de2
              a:
                # | Isolates are ephemeral and per-location, memory doesn't survive
                # | invocations or span cities
                label: "Los isolates son efímeros y por ubicación, la memoria no sobrevive a las invocaciones ni abarca ciudades"  # @src=4dea89b238e8
                # | Statelessness is the platform's core deal, so shared state needs a
                # | shared store. KV's eventual consistency is fine here precisely because
                # | each entry carries its own checkedAt.
                feedback: "La falta de estado es el trato central de la plataforma, así que el estado compartido necesita un almacén compartido. La consistencia eventual de KV está bien acá precisamente porque cada entrada lleva su propio checkedAt."  # @src=6c56f18a4232
          m07-l1-q5:
            # | A teammate sends you a 2023 tutorial: 'deploy your status page with
            # | Cloudflare Pages.' Per the vendor's current docs, what's the right call for
            # | a NEW project?
            prompt: "Un compañero de equipo te manda un tutorial de 2023: 'despliega tu página de estado con Cloudflare Pages.' Según los docs actuales del vendor, ¿cuál es la decisión correcta para un proyecto NUEVO?"  # @src=1ce415562df5
            # | Probed live 2026-09-01, the Pages docs banner reads: 'Workers supports most
            # | Pages use cases and offers a broader feature set... Start new projects with
            # | Workers.' The meta-lesson outranks the platform trivia: read the vendor's
            # | current docs, not blog posts from the year a tutorial was written.
            explanation: "Sondeado en vivo el 2026-09-01, el banner de los docs de Pages dice: 'Workers soporta la mayoría de los casos de uso de Pages y ofrece un conjunto de funcionalidades más amplio... Empieza los proyectos nuevos con Workers.' La meta-lección le gana a la trivia de plataforma: lee los docs actuales del vendor, no posts de blog del año en que se escribió un tutorial."  # @src=a85cc84ece33
            options:                 # source order — keep it
              c:
                # | Use both, Pages for the static assets and a Worker for anything dynamic
                # | behind it
                label: "Usa las dos, Pages para los assets estáticos y un Worker para cualquier cosa dinámica detrás"  # @src=29b8f5b2b570
                # | You don't need the split anymore: Workers serves static assets directly,
                # | which is exactly why the vendor recommends it for new projects. Two
                # | platforms where one suffices is drift waiting to happen.
                feedback: "Ya no necesitas la partición: Workers sirve assets estáticos directamente, que es exactamente por qué el vendor lo recomienda para proyectos nuevos. Dos plataformas donde alcanza una es deriva esperando a pasar."  # @src=2e7dd987570d
              b:
                # | Build on Workers, Cloudflare's Pages docs themselves say to start new
                # | projects with Workers
                label: "Construye sobre Workers, los propios docs de Pages de Cloudflare dicen que empieces los proyectos nuevos con Workers"  # @src=a8539145eafa
                # | The durable habit outranks the platform trivia: the banner that settles
                # | this is on the vendor's own current docs, and a 2023 tutorial cannot
                # | know what 2026 recommends.
                feedback: "El hábito durable le gana a la trivia de plataforma: el banner que zanja esto está en los propios docs actuales del vendor, y un tutorial de 2023 no puede saber qué recomienda 2026."  # @src=2507ad9bc5bc
              a:
                # | Use Pages, it's the static-site product, and a status page is a static
                # | site
                label: "Usa Pages, es el producto de sitios estáticos, y una página de estado es un sitio estático"  # @src=353806dc6dff
                # | That was the 2023 framing. Cloudflare's own Pages docs now steer new
                # | projects away, Workers serves static assets and offers the broader
                # | feature set (cron, KV, gradual deploys).
                feedback: "Ese era el encuadre de 2023. Los propios docs de Pages de Cloudflare ahora mandan los proyectos nuevos para otro lado, Workers sirve assets estáticos y ofrece el conjunto de funcionalidades más amplio (cron, KV, deploys graduales)."  # @src=28b367ea4c4b
              d:
                # | Pages is being deprecated, so start on Workers and migrate anything
                # | still on Pages too
                label: "Pages está siendo deprecado, así que empieza en Workers y migra también cualquier cosa que siga en Pages"  # @src=a54a37a01e00
                # | The banner steers NEW projects; it announces no end-of-life and asks
                # | nobody to migrate. Reading a recommendation as a deadline is its own way
                # | of not reading the current docs.
                feedback: "El banner orienta a los proyectos NUEVOS; no anuncia ningún fin de vida y no le pide a nadie que migre. Leer una recomendación como una fecha límite es su propia forma de no leer los docs actuales."  # @src=f8192cd09c5f
          m07-l1-q6:
            # | Your worker's cron probes the Solana public RPC getHealth endpoint and
            # | occasionally gets a 429. What does the station's own discipline say to do?
            prompt: "El cron de tu worker sondea el endpoint getHealth del RPC público de Solana y de vez en cuando recibe un 429. ¿Qué dice que hagas la propia disciplina de la estación?"  # @src=9cfb4de8b3d1
            # | The structural Solana ramp: the chain joins the target list as just another
            # | endpoint with real limits, 100 requests per 10 seconds per IP on the public
            # | RPC. The backoff-and-budget discipline you built for flaky HTTP in M2 is
            # | exactly what chain probing needs, which is the whole argument of M8 in
            # | miniature.
            explanation: "La rampa estructural de Solana: la blockchain se suma a la lista de targets como un endpoint más con límites de verdad, 100 requests por cada 10 segundos por IP en el RPC público. La disciplina de backoff-y-presupuesto que construiste para HTTP inestable en M2 es exactamente lo que necesita sondear la blockchain, que es todo el argumento de M8 en miniatura."  # @src=eb5c14befbbb
            options:                 # source order — keep it
              a:
                # | Retry immediately in a loop until it answers, getHealth is a cheap call
                label: "Reintenta de inmediato en un loop hasta que responda, getHealth es una llamada barata"  # @src=e8e035ad4bec
                # | Immediate retries are exactly what the cap punishes: the public RPC
                # | allows 100 requests per 10 seconds per IP, and hammering it digs the
                # | hole deeper. This is the naive Promise.all mistake from m02-l3 in new
                # | clothes.
                feedback: "Los retries inmediatos son exactamente lo que castiga el tope: el RPC público deja pasar 100 requests por cada 10 segundos por IP, y martillarlo cava el pozo más hondo. Este es el error ingenuo de Promise.all de m02-l3 con ropa nueva."  # @src=60fb045969e3
              d:
                # | Cache each getHealth response for ten seconds so repeated cron probes
                # | stop reaching the cap
                label: "Cachea cada respuesta de getHealth por diez segundos para que las sondas repetidas del cron dejen de llegar al tope"  # @src=1170a83aa3fe
                # | A cached liveness answer is a monitor lying on purpose. The probe's
                # | entire product is whether the RPC answered YOU, just now, and how fast;
                # | serve a ten-second-old ok and the status page reports a node it never
                # | spoke to.
                feedback: "Una respuesta de vida cacheada es un monitor mintiendo a propósito. Todo el producto de la sonda es si el RPC TE respondió, recién ahora, y qué tan rápido; sirve un ok de hace diez segundos y la página de estado reporta un nodo con el que nunca habló."  # @src=f68b440ff410
              c:
                # | Switch the worker over to @solana/kit, whose client handles the public
                # | RPC's rate limits for you
                label: "Cambia el worker a @solana/kit, cuyo cliente te maneja los rate limits del RPC público"  # @src=b98d6bbc651c
                # | kit is a client library, not a rate-limit exemption, the per-IP cap
                # | applies regardless of what constructs the request. kit reads arrive in
                # | M8 for other reasons; this lesson's ramp is deliberately a plain fetch.
                feedback: "kit es una librería cliente, no una exención de rate-limit, el tope por IP aplica sin importar qué construya el request. Las lecturas con kit llegan en M8 por otras razones; la rampa de esta lección es deliberadamente un fetch pelado."  # @src=d8a5a9c3f7b3
              b:
                # | Apply the m02-l3 backoff and treat the cap (100 req/10s/IP) as a budget
                # | the probe respects
                label: "Aplica el backoff de m02-l3 y trata el tope (100 req/10s/IP) como un presupuesto que la sonda respeta"  # @src=3cc831602f70
                # | The chain arrives as one more endpoint with real limits, and
                # | backoffDelay plus equal jitter comes through the pulse-core import
                # | already written. That is M8's whole argument in one paragraph.
                feedback: "La blockchain llega como un endpoint más con límites de verdad, y backoffDelay más jitter equitativo viene a través del import de pulse-core ya escrito. Ese es todo el argumento de M8 en un párrafo."  # @src=ea4b93772654
  m07-l2:
    # | The payoff: Rust on the same edge
    title: "El pago: Rust en el mismo edge"  # @src=591455eed576
    blocks:
      edge-tier-gate-check:                      # quiz
        questions:
          m07-l2-q1:
            # | Your engine crate compiled to wasm32 first try, but a teammate's 'quick fix'
            # | adding reqwest to it breaks the build. Why does one of them cross the seam
            # | and the other refuse?
            prompt: "El crate de tu motor compiló a wasm32 al primer intento, pero el 'arreglo rápido' de un compañero de equipo que le agrega reqwest rompe el build. ¿Por qué uno de ellos cruza la costura y el otro se rehúsa?"  # @src=b0351ca12235
            # | wasm32-unknown-unknown means unknown OS: no sockets, no threads, no
            # | filesystem. Pure computation, classifiers, state machines, serde types,
            # | compiles clean; anything that opens a connection needs the platform's fetch
            # | via the worker crate instead. This is the M4 purity bet paying out, and the
            # | same seam m07-l1 taught in TS.
            explanation: "wasm32-unknown-unknown quiere decir OS unknown: ningún socket, ningún thread, ningún sistema de archivos. Computación pura, clasificadores, máquinas de estados, tipos de serde, compila limpio; cualquier cosa que abra una conexión necesita en cambio el fetch de la plataforma a través del crate worker. Esta es la apuesta de pureza de M4 pagando, y la misma costura que m07-l1 enseñó en TS."  # @src=479a0a9d72d7
            options:                 # source order — keep it
              b:
                # | reqwest is too large a dependency, WASM binaries have a size cap that
                # | big crates exceed
                label: "reqwest es una dependencia demasiado grande, los binarios de WASM tienen un tope de tamaño que los crates grandes exceden"  # @src=10c1d0f0c14a
                # | Size limits exist but that's not the failure here: reqwest itself
                # | compiles on wasm32 (it carries a browser backend); the blocking module
                # | the CLI leans on is conditionally compiled away, so the code that
                # | touches it fails with E0433. An I/O boundary, not a size cap.
                feedback: "Los límites de tamaño existen pero no es ahí donde está la falla: reqwest mismo compila en wasm32 (carga un backend de navegador); el módulo blocking en el que se apoya la CLI se compila condicionalmente afuera, así que el código que lo toca falla con E0433. Una frontera de I/O, no un tope de tamaño."  # @src=c4a8ee84dd79
              d:
                # | The core is no_std while reqwest drags std in, and
                # | wasm32-unknown-unknown has no std to link against
                label: "El núcleo es no_std mientras que reqwest arrastra std adentro, y wasm32-unknown-unknown no tiene std contra el cual linkear"  # @src=ddc7e925580a
                # | The engine is std through and through, Strings and Vecs everywhere, and
                # | it still compiles for this target. What the target withholds is threads,
                # | sockets, a filesystem and a clock, not the standard library.
                feedback: "El motor es std de punta a punta, Strings y Vecs por todos lados, y aun así compila para este target. Lo que el target retiene son threads, sockets, un sistema de archivos y un reloj, no la librería estándar."  # @src=88ec8428d18f
              c:
                # | reqwest is async, and WASM has no event loop of its own to drive
                # | futures, so no async Rust code can run in a worker at all
                label: "reqwest es async, y WASM no tiene un event loop propio que maneje futures, así que ningún código async de Rust puede correr en un worker en absoluto"  # @src=0539a1b12bc4
                # | The template's own handler is an async fn, and workerd drives those
                # | futures through the JS event loop it already owns. What is missing is
                # | the OS layer tokio and reqwest's transport need: an I/O boundary, not an
                # | async one.
                feedback: "El handler propio de la plantilla es una función async, y workerd maneja esos futures a través del event loop de JS del que ya es dueño. Lo que falta es la capa de OS que necesitan tokio y el transporte de reqwest: una frontera de I/O, no una async."  # @src=60113263d9a9
              a:
                # | The core is logic with no OS dependencies; wasm32-unknown-unknown has no
                # | sockets or threads, I/O comes from the platform
                label: "El núcleo es lógica sin dependencias del OS; wasm32-unknown-unknown no tiene sockets ni threads, el I/O viene de la plataforma"  # @src=e20b10550dc1
                # | Unknown OS is the specification, not a placeholder. mio says it in its
                # | own compile_error: there is no epoll or kqueue to wrap, so the crate
                # | refuses before a byte ships.
                feedback: "Un OS unknown es la especificación, no un placeholder. mio lo dice en su propio compile_error: no hay epoll ni kqueue que envolver, así que el crate se rehúsa antes de que se entregue un byte."  # @src=3cea2beb70a5
          m07-l2-q2:
            # | Cargo.toml for the worker says `worker = "0.8"` rather than the latest patch
            # | you saw on crates.io. Following m05-l2's pin-reading skill, what is this pin
            # | telling you?
            prompt: "El Cargo.toml del worker dice `worker = \"0.8\"` en vez del último patch que viste en crates.io. Siguiendo la habilidad de leer pins de m05-l2, ¿qué te está diciendo este pin?"  # @src=9454270b0a6d
            # | Under semver, pre-1.0 minors carry breaking-change rights, so `worker =
            # | "0.8"` says 'stay on this line until I choose to migrate.' The same
            # | ecosystem-pin-reading you practiced on agave's Cargo.toml in m05-l2, applied
            # | to your own project: a pin is a decision you can read.
            explanation: "Bajo semver, las minors pre-1.0 cargan derechos de cambio de ruptura, así que `worker = \"0.8\"` dice 'quédate en esta línea hasta que yo elija migrar.' La misma lectura de pins del ecosistema que practicaste en el Cargo.toml de agave en m05-l2, aplicada a tu propio proyecto: un pin es una decisión que puedes leer."  # @src=8f5487ffa894
            options:                 # source order — keep it
              d:
                # | 0.8 is shorthand for ^0.8.0, which cargo happily resolves to 0.9, so the
                # | pin decides nothing at all
                label: "0.8 es la forma corta de ^0.8.0, que cargo resuelve alegremente a 0.9, así que el pin no decide nada en absoluto"  # @src=d08e8169fb0a
                # | Caret ranges narrow below 1.0: ^0.8.0 means at least 0.8.0 and under
                # | 0.9.0, so cargo will not cross that line for you. The digit you wrote is
                # | the decision, which is why it is worth reading.
                feedback: "Los rangos de caret se estrechan por debajo de 1.0: ^0.8.0 quiere decir al menos 0.8.0 y por debajo de 0.9.0, así que cargo no va a cruzar esa línea por ti. El dígito que escribiste es la decisión, y por eso vale la pena leerlo."  # @src=fc344bf0efbd
              c:
                # | 0.8 is the last version supporting wasm32, newer lines dropped the WASM
                # | target
                label: "0.8 es la última versión que soporta wasm32, las líneas más nuevas sacaron el target de WASM"  # @src=dcaa4c3011a4
                # | WASM is the whole point of workers-rs, no line dropped it. The pin is
                # | about pre-1.0 semver semantics, where 0.9 is allowed to break you the
                # | way 2.0 would elsewhere.
                feedback: "WASM es el punto entero de workers-rs, ninguna línea lo sacó. El pin se trata de la semántica de semver pre-1.0, donde 0.9 tiene permitido romperte como lo haría una 2.0 en otro lado."  # @src=9d73d3c16ce4
              a:
                # | The project is stale, a well-maintained project would track the newest
                # | release line
                label: "El proyecto está desactualizado, un proyecto bien mantenido seguiría la línea de release más nueva"  # @src=6bbd8e54a352
                # | That's the abandonment-signal reflex misapplied: a deliberate
                # | conservative pin on a pre-1.0 SDK is maintenance, not neglect. The
                # | signals from m03-l4 (README, last-publish) tell staleness; a pin alone
                # | doesn't.
                feedback: "Ese es el reflejo de la señal de abandono mal aplicado: un pin conservador deliberado sobre un SDK pre-1.0 es mantenimiento, no descuido. Las señales de m03-l4 (README, last-publish) dicen desactualización; un pin solo no."  # @src=7054d7f6280a
              b:
                # | The crate is pre-1.0, where minor versions may break, the pin holds the
                # | 0.8 line on purpose
                label: "El crate es pre-1.0, donde las versiones minor pueden romper, el pin sostiene la línea 0.8 a propósito"  # @src=273f2240ae89
                # | A 0.x minor carries the breaking-change rights a 2.0 carries elsewhere,
                # | so the pin says stay here until I choose to migrate, and 0.9 is a
                # | release-notes decision rather than a free upgrade.
                feedback: "Una minor 0.x carga los derechos de cambio de ruptura que una 2.0 carga en otro lado, así que el pin dice quédate acá hasta que yo elija migrar, y 0.9 es una decisión de notas de release, no un upgrade gratis."  # @src=ebd0a0e9173d
          m07-l2-q3:
            # | You want the workers to store probe-history files. R2 has a real free tier
            # | (10 GB-month, free egress), so why does this course make R2 an optional
            # | extension instead of a core lab?
            prompt: "Quieres que los workers guarden archivos de historial de sondas. R2 tiene un tier gratis de verdad (10 GB-mes, egress gratis), ¿entonces por qué este curso hace de R2 una extensión opcional en vez de un lab central?"  # @src=afe854141836
            # | The course's deploy-sanity rule is free tier, no card in the core path.
            # | Community-thread evidence says enabling R2 requires a payment method even at
            # | $0, so KV carries the core path and R2 becomes a clearly-labeled optional
            # | extension for learners who choose to link a card. Same rule that keeps
            # | Cloudflare Containers ($5/mo Workers Paid) a signpost.
            explanation: "La regla de cordura del curso para el deploy es tier gratis, nada de tarjeta en el camino central. La evidencia de los hilos de la comunidad dice que habilitar R2 requiere un método de pago incluso a $0, así que KV carga el camino central y R2 se vuelve una extensión opcional claramente etiquetada para quienes aprenden y eligen vincular una tarjeta. La misma regla que mantiene a Cloudflare Containers ($5/mo Workers Paid) como un letrero."  # @src=68f191b8d131
            options:                 # source order — keep it
              c:
                # | Enabling R2 requires linking a payment method even for free use, it
                # | fails the course's no-card rule
                label: "Habilitar R2 requiere vincular un método de pago incluso para uso gratis, falla la regla de no-tarjeta del curso"  # @src=4a11d323a2bc
                # | So KV carries the core path and R2 becomes a clearly-labeled optional
                # | extension. Note what the reason is NOT: the allowance is generous and
                # | the product fits; the gate is the card, before a cent is spent.
                feedback: "Así que KV carga el camino central y R2 se vuelve una extensión opcional claramente etiquetada. Fíjate en lo que la razón NO es: la asignación es generosa y el producto encaja; la barrera es la tarjeta, antes de que se gaste un centavo."  # @src=708124aaff7c
              b:
                # | Object storage belongs to a sibling Academy course, and this course
                # | never teaches what a sibling owns
                label: "El almacenamiento de objetos le pertenece a un curso hermano de la Academy, y este curso nunca enseña aquello de lo que un hermano es dueño"  # @src=52d3a64edb9c
                # | No sibling course owns R2, the hand-off map covers Solana depth, Anchor,
                # | wallets, and tokens. R2 is out of the CORE path for a cost-honesty
                # | reason, not a boundary one.
                feedback: "Ningún curso hermano es dueño de R2, el mapa de traspaso cubre profundidad de Solana, Anchor, billeteras, y tokens. R2 está fuera del camino CENTRAL por una razón de honestidad de costos, no por una de frontera."  # @src=0240000ceba9
              a:
                # | R2's free tier is too small for a whole fleet's probe history, so the
                # | lab would hit the cap mid-module
                label: "El tier gratis de R2 es demasiado chico para el historial de sondas de una flota entera, así que el lab chocaría con el tope a mitad del módulo"  # @src=bb4bb840bb01
                # | 10 GB-month dwarfs a probe fleet's JSON output, the allowance is
                # | generous. The blocker isn't quota; it's what enabling the product asks
                # | of you first.
                feedback: "10 GB-mes empequeñece la salida JSON de una flota de sondas, la asignación es generosa. Lo que bloquea no es la cuota; es lo que habilitar el producto te pide primero."  # @src=7074a8ffca25
              d:
                # | R2 sits behind the same $5/mo Workers Paid plan that Containers needs,
                # | so the blocker is a bill and not a card
                label: "R2 está detrás del mismo plan Workers Paid de $5/mo que necesita Containers, así que lo que bloquea es una cuenta y no una tarjeta"  # @src=0112ceb2bbac
                # | Containers is the one behind Workers Paid. R2's storage genuinely costs
                # | nothing at this scale, which is what makes its card requirement the more
                # | interesting exclusion: free, and still gated.
                feedback: "Containers es el que está detrás de Workers Paid. El almacenamiento de R2 genuinamente no cuesta nada a esta escala, y eso es lo que hace de su requisito de tarjeta la exclusión más interesante: gratis, y aun así con barrera."  # @src=f53d4efdea06
          m07-l2-q4:
            # | Both of your workers, TS yesterday, Rust today, went live with the identical
            # | `npx wrangler deploy` command. What is the module's takeaway from that?
            prompt: "Tus dos workers, TS ayer, Rust hoy, salieron en vivo con el idéntico comando `npx wrangler deploy`. ¿Qué lección para llevarte saca el módulo de eso?"  # @src=a4af675c760c
            # | The module's closing law: the edge platform defines a contract
            # | (fetch/scheduled handlers, KV bindings, cron, one deploy command) and
            # | doesn't care what satisfies it. That's why the station could bring both of
            # | its engines to the edge, and it's the same idea you'll reuse whenever a
            # | platform, not a language, defines the seam.
            explanation: "La ley de cierre del módulo: la plataforma del edge define un contrato (handlers de fetch/scheduled, bindings de KV, cron, un comando de deploy) y no le importa qué lo satisfaga. Por eso la estación pudo llevar sus dos motores al edge, y es la misma idea que vas a reusar cada vez que una plataforma, y no un lenguaje, defina la costura."  # @src=b1091dd88532
            options:                 # source order — keep it
              c:
                # | Rust and TypeScript compile to equivalent output, so the choice between
                # | them is only style
                label: "Rust y TypeScript compilan a una salida equivalente, así que la elección entre ellos es solo estilo"  # @src=9accfc8aa3e5
                # | They produce very different artifacts (WASM module vs JS) with different
                # | trade-offs, this very lesson's tradeoff section says the TS worker is
                # | often the pragmatic default. What's shared is the platform's interface,
                # | not the languages' equivalence.
                feedback: "Producen artefactos muy distintos (módulo WASM vs JS) con trade-offs distintos, la sección de trade-offs de esta misma lección dice que el worker de TS es a menudo el default pragmático. Lo que se comparte es la interfaz de la plataforma, no la equivalencia de los lenguajes."  # @src=346e46103108
              d:
                # | wrangler detects the project's language and runs the matching build, so
                # | the deploy contract looks identical
                label: "wrangler detecta el lenguaje del proyecto y corre el build que corresponde, así que el contrato de deploy se ve idéntico"  # @src=0278e12c493b
                # | It detects nothing. wrangler.toml's [build] block names the command, and
                # | yours happens to invoke worker-build; put any command there that emits
                # | an entry file and the same deploy verb ships it.
                feedback: "No detecta nada. El bloque [build] de wrangler.toml nombra el comando, y el tuyo justo invoca worker-build; pon cualquier comando ahí que emita un archivo de entrada y el mismo verbo de deploy lo entrega."  # @src=baafb8e22ea6
              a:
                # | The platform contract, handler shape, bindings, cron, is the artifact;
                # | the language behind it is interchangeable
                label: "El contrato de plataforma, la forma del handler, los bindings, el cron, es el artefacto; el lenguaje detrás de él es intercambiable"  # @src=9fa92dee2414
                # | Ask the discriminating question: what did wrangler need to know about
                # | your language? Nothing. It ran a build command out of a config file and
                # | uploaded the result, which is all it ever did.
                feedback: "Hazte la pregunta discriminante: ¿qué necesitaba saber wrangler sobre tu lenguaje? Nada. Corrió un comando de build desde un archivo de config y subió el resultado, que es todo lo que siempre hizo."  # @src=5b4371624bdd
              b:
                # | wrangler transpiles Rust to JavaScript during the build step, so both
                # | deploys really ship the same kind of code to the edge
                label: "wrangler transpila Rust a JavaScript durante la etapa de build, así que los dos deploys de verdad entregan el mismo tipo de código al edge"  # @src=b6240ec030f3
                # | No transpilation happens, the Rust is compiled to WASM by worker-build
                # | and runs as WASM next to JS glue. The deploys are identical because the
                # | CONTRACT is, not because the code is.
                feedback: "No pasa ninguna transpilación, worker-build compila el Rust a WASM y corre como WASM al lado del pegamento de JS. Los deploys son idénticos porque lo es el CONTRATO, no porque lo sea el código."  # @src=ee827c61a359
  m08-l1:
    # | A chain is a target: the minimal model + first reads
    title: "Una blockchain es un target: el modelo mínimo + las primeras lecturas"  # @src=5c3fbc540e3a
    blocks:
      epoch-clock:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Math.floor, not Math.round, a slot 60% through epoch 3 is still in epoch 3.
          0: "Math.floor, no Math.round, un slot al 60% de recorrido del epoch 3 sigue estando en el epoch 3."  # @src=456f5e4da370
          # | slot % 432000 tells you how far you ARE; the countdown wants how far you have
          # | LEFT.
          1: "slot % 432000 te dice qué tan lejos ESTÁS; la cuenta regresiva quiere qué tan lejos te FALTA."  # @src=5ac6662d3262
          # | slotMs is milliseconds: an hour is 3,600,000 of them.
          2: "slotMs son milisegundos: una hora son 3,600,000 de ellos."  # @src=d0207cebb070
        tests:                      # keyed by test case id
          t1:
            # | an exact epoch boundary at 300ms slots: a full epoch is 36 wall-clock hours
            description: "una frontera exacta de epoch con slots de 300ms: un epoch entero son 36 horas en tiempo de reloj"  # @src=69f57e223a72
          t2:
            # | 1,000 slots into the epoch, the clock ticks down
            description: "1,000 slots dentro del epoch, el reloj cuenta hacia abajo"  # @src=75f200cefcc2
          t3:
            # | halfway through epoch 0 at the old 400ms cadence
            description: "a mitad de camino del epoch 0 con la vieja cadencia de 400ms"  # @src=88e1ae7c0dbb
          t4:
            # | at 400ms slots the same 432,000-slot epoch is 48 hours, not 36
            description: "con slots de 400ms el mismo epoch de 432,000 slots son 48 horas, no 36"  # @src=e8c6e8d5330e
          t5:
            # | one slot past a boundary rounds its hours display to 36.0
            description: "un slot después de una frontera redondea sus horas mostradas a 36.0"  # @src=934bb1f5d845
      chain-model-check:                      # quiz
        questions:
          m08-l1-q1:
            # | Your probe script calls getSlot twice, ten seconds apart, and the number
            # | climbed by about 33. What did you just observe?
            prompt: "Tu script de sonda llama a getSlot dos veces, con diez segundos de diferencia, y el número subió alrededor de 33. ¿Qué acabas de observar?"  # @src=53cdb3c36fb1
            # | A slot is the network's clock tick, the unit in which the chain schedules
            # | block production. At the post-SIMD-0525 300ms target, ten seconds is about
            # | 33 slots. This is the whole point of the gauge: the chain publishes its own
            # | heartbeat, and getSlot is the stethoscope.
            explanation: "Un slot es el tick de reloj de la red, la unidad en la que la blockchain planifica la producción de bloques. Con la meta de 300ms post-SIMD-0525, diez segundos son alrededor de 33 slots. Ese es todo el punto del medidor: la blockchain publica su propio latido, y getSlot es el estetoscopio."  # @src=b98211c70054
            options:                 # source order — keep it
              c:
                # | Your own request latency, since each call takes about 300ms round-trip
                label: "Tu propia latencia de request, ya que cada llamada tarda alrededor de 300ms de ida y vuelta"  # @src=59c5a5594fb6
                # | Round-trip latency affects WHEN you see the number, not the number
                # | itself. Ten seconds at ~300ms per slot is ~33 slots, the arithmetic
                # | matches the network's cadence, not your connection's.
                feedback: "La latencia de ida y vuelta afecta CUÁNDO ves el número, no el número en sí. Diez segundos a ~300ms por slot son ~33 slots, la aritmética coincide con la cadencia de la red, no con la de tu conexión."  # @src=0f5cce0ae511
              d:
                # | The block height rising by 33, since every slot fills with a block
                label: "La altura de bloque subiendo en 33, ya que cada slot se llena con un bloque"  # @src=c430e4d98b95
                # | Slot and block are not synonyms: the slot is the tick of the clock, the
                # | block is what lands in it, and a slot with no block still advances the
                # | counter. getSlot returns ticks, so block height is the number you did
                # | not read.
                feedback: "El slot y el bloque no son sinónimos: el slot es el tick del reloj, el bloque es lo que aterriza en él, y un slot sin bloque igual avanza el contador. getSlot devuelve ticks, así que la altura de bloque es el número que no leíste."  # @src=94ff7f028f1f
              e:
                # | A 33-slot backlog this RPC node might still be working through
                label: "Un backlog de 33 slots que este nodo de RPC podría estar todavía procesando"  # @src=6495c2e9c801
                # | A node still catching up would say so: getHealth answered ok before you
                # | started. And a replaying node would race ahead of wall-clock time, while
                # | 33 ticks in ten seconds is exactly the pace the live network is
                # | producing them at.
                feedback: "Un nodo que todavía se está poniendo al día lo diría: getHealth respondió ok antes de que empezaras. Y un nodo que está reproduciendo correría por delante del tiempo de reloj, mientras que 33 ticks en diez segundos es exactamente el ritmo al que la red en vivo los está produciendo."  # @src=bbf55d576a86
              a:
                # | The RPC node processing 33 of your queued read requests in order
                label: "El nodo de RPC procesando en orden 33 de tus requests de lectura en fila"  # @src=469f064a0ac6
                # | Reads don't queue as chain events, your two getSlot calls were just
                # | questions. The slot counter advanced on its own, whether or not anyone
                # | asked.
                feedback: "Las lecturas no se ponen en fila como eventos de la blockchain, tus dos llamadas a getSlot fueron solo preguntas. El contador de slots avanzó por su cuenta, preguntara alguien o no."  # @src=ac18c9e0fbf3
              b:
                # | The chain's heartbeat, a new slot ticking roughly every 300ms
                label: "El latido de la blockchain, un slot nuevo haciendo tick más o menos cada 300ms"  # @src=1eff08ad6cf9
                # | Ten seconds over 33 ticks lands near 300ms, which is the post-SIMD-0525
                # | target the network has run since epoch 1024. The counter moved because
                # | validators kept producing slots, not because you asked twice.
                feedback: "Diez segundos sobre 33 ticks cae cerca de 300ms, que es la meta post-SIMD-0525 con la que la red viene corriendo desde el epoch 1024. El contador se movió porque los validadores siguieron produciendo slots, no porque preguntaste dos veces."  # @src=8ba11785c8d3
          m08-l1-q2:
            # | After the 400ms-to-300ms upgrade, your gauge shows epochs lasting 36 hours
            # | instead of 48. Nobody announced an epoch change. What happened?
            prompt: "Después del upgrade de 400ms a 300ms, tu medidor muestra epochs durando 36 horas en vez de 48. Nadie anunció un cambio de epoch. ¿Qué pasó?"  # @src=b8ecc0c25d01
            # | The epoch is a slot-count, not a duration: 432,000 slots, always. Wall-clock
            # | epoch length = 432,000 x slot time, so 400ms gives 48h and 300ms gives 36h.
            # | Your epoch-clock challenge computes exactly this, one fixed constant, one
            # | measured variable.
            explanation: "El epoch es un conteo de slots, no una duración: 432,000 slots, siempre. La duración del epoch en tiempo de reloj = 432,000 x tiempo de slot, así que 400ms da 48h y 300ms da 36h. Tu challenge de epoch-clock calcula exactamente esto, una constante fija, una variable medida."  # @src=385f920dae76
            options:                 # source order — keep it
              a:
                # | The upgrade also shortened epochs from 432,000 to 324,000 slots to
                # | compensate
                label: "El upgrade también acortó los epochs de 432,000 a 324,000 slots para compensar"  # @src=89e6789b354e
                # | No, ticks_per_slot and the 432,000-slot epoch both stayed fixed through
                # | SIMD-0525. Check the arithmetic: 432,000 x 300ms is exactly 36 hours
                # | with no epoch resize needed.
                feedback: "No, ticks_per_slot y el epoch de 432,000 slots se mantuvieron fijos los dos a través de SIMD-0525. Revisa la aritmética: 432,000 x 300ms son exactamente 36 horas sin necesidad de redimensionar el epoch."  # @src=a16dbb221d01
              c:
                # | Epochs stay fixed at 432,000 slots, so wall-clock length tracks slot
                # | time
                label: "Los epochs se mantienen fijos en 432,000 slots, así que la duración en tiempo de reloj sigue al tiempo de slot"  # @src=b08fee184d98
                # | 432,000 times 0.3 seconds is 129,600 seconds, exactly 36 hours. Nothing
                # | about the epoch was changed; the multiplier moved, and every schedule
                # | keyed to epoch boundaries moved with it.
                feedback: "432,000 por 0.3 segundos son 129,600 segundos, exactamente 36 horas. Nada del epoch se cambió; el multiplicador se movió, y cada cronograma atado a las fronteras de epoch se movió con él."  # @src=8ab86333c14a
              b:
                # | Your clock is buggy: epoch duration is defined in hours and cannot drift
                label: "Tu reloj tiene bugs: la duración del epoch se define en horas y no puede desviarse"  # @src=d6dfba4b0e90
                # | Backwards, epochs are defined in SLOTS, not hours. The wall-clock
                # | duration is the derived quantity, which is exactly why it moved when
                # | slot time did.
                feedback: "Al revés, los epochs se definen en SLOTS, no en horas. La duración en tiempo de reloj es la cantidad derivada, que es exactamente por qué se movió cuando lo hizo el tiempo de slot."  # @src=c4298dc8f590
              d:
                # | The feature gate activated mid-epoch, so this one epoch alone came up
                # | short
                label: "El feature gate se activó a mitad de epoch, así que solo este epoch se quedó corto"  # @src=a6425f2b899a
                # | Feature gates flip at an epoch boundary, never partway through one: the
                # | stage-2 gate landed in epoch 1023 and the behavior switched at the start
                # | of 1024. And 36 hours is the new steady state, not a one-off transition.
                feedback: "Los feature gates se dan vuelta en una frontera de epoch, nunca a mitad de camino de una: el gate de la etapa 2 aterrizó en el epoch 1023 y el comportamiento cambió al inicio de 1024. Y 36 horas es el nuevo estado estable, no una transición de una sola vez."  # @src=5ed9ff2fff5c
          m08-l1-q3:
            # | Your 20-sample gauge averages 316ms where the network publishes 300ms. A
            # | teammate says your measurement must be wrong. Who's right?
            prompt: "Tu medidor de 20 muestras promedia 316ms donde la red publica 300ms. Un compañero de equipo dice que tu medición tiene que estar mal. ¿Quién tiene razón?"  # @src=2c438b4961a8
            # | Targets versus measurements is the course's oldest lesson wearing chain
            # | clothes: the network aims at 300ms and measured 316 ms at research time (~5%
            # | above). Publish what you measure. Your own station's dashboard should get
            # | the same honesty, a claimed uptime and a measured uptime are different
            # | numbers.
            explanation: "Metas contra mediciones es la lección más vieja del curso vestida de blockchain: la red apunta a 300ms y midió 316 ms al momento de la investigación (~5% por encima). Publica lo que mides. El panel de tu propia estación debería recibir la misma honestidad, un uptime afirmado y un uptime medido son números distintos."  # @src=93cde73cd03e
            options:                 # source order — keep it
              b:
                # | The teammate: your HTTP round-trip time is leaking into the slot-time
                # | numbers
                label: "El compañero de equipo: tu tiempo de ida y vuelta HTTP se está filtrando en los números de tiempo de slot"  # @src=d7eea8cfa91a
                # | getRecentPerformanceSamples reports the node's own recorded slot
                # | timings, your connection latency affects fetching the samples, not the
                # | values inside them. The research sweep measured the same 316 ms.
                feedback: "getRecentPerformanceSamples reporta los propios tiempos de slot registrados por el nodo, la latencia de tu conexión afecta traer las muestras, no los valores que hay adentro. El barrido de investigación midió los mismos 316 ms."  # @src=fdd4ced086ec
              c:
                # | Neither: the 300ms change hasn't activated yet, so both numbers are
                # | stale
                label: "Ninguno de los dos: el cambio a 300ms todavía no se activó, así que los dos números están desactualizados"  # @src=600c7badc6cc
                # | The stage-2 gate is decodable on-chain, activated at epoch 1024,
                # | 2026-08-28. The upgrade is live; the gap between 300 and 316 is the
                # | normal daylight between a target and a running system.
                feedback: "El gate de la etapa 2 se puede decodificar on-chain, activado en el epoch 1024, 2026-08-28. El upgrade está en vivo; el hueco entre 300 y 316 es la distancia normal que hay entre una meta y un sistema en marcha."  # @src=2956e5d34e52
              a:
                # | You: 300ms is a target, and live networks measure somewhat above their
                # | targets
                label: "Tú: 300ms es una meta, y las redes en vivo miden algo por encima de sus metas"  # @src=2f972dbb4a5c
                # | A target is an engineering intention and a measurement is what happened.
                # | Two independent runs, 316ms and 313.6ms on different days, put the gap
                # | around five percent, which is what a live system looks like rather than
                # | a defect.
                feedback: "Una meta es una intención de ingeniería y una medición es lo que pasó. Dos ejecuciones independientes, 316ms y 313.6ms en días distintos, ponen el hueco alrededor de cinco por ciento, que es como se ve un sistema en vivo en vez de un defecto."  # @src=962a1be5b7ee
              d:
                # | The teammate: a live network holds its target, so 316ms signals trouble
                label: "El compañero de equipo: una red en vivo se mantiene en su meta, así que 316ms señala problemas"  # @src=000b05734ee4
                # | No running system holds its target exactly, and this one publishes the
                # | evidence: 316ms on 2026-09-01, 313.6ms the next day, a 20-sample window
                # | spanning 309.3 to 326.1ms with nothing flagged. Five percent above
                # | target is the ordinary state, not an incident.
                feedback: "Ningún sistema en marcha se mantiene exactamente en su meta, y este publica la evidencia: 316ms el 2026-09-01, 313.6ms al día siguiente, una ventana de 20 muestras que va de 309.3 a 326.1ms sin nada marcado. Cinco por ciento por encima de la meta es el estado ordinario, no un incidente."  # @src=1a2c703a28b7
          m08-l1-q4:
            # | Your probe read the slot, the health, and (next lesson) balances, all
            # | without a wallet, a key, or a fee. What makes that possible?
            prompt: "Tu sonda leyó el slot, la salud, y (la próxima lección) los saldos, todo sin una billetera, una clave, ni una comisión. ¿Qué hace posible eso?"  # @src=3dd4211a9715
            # | The minimal model's fourth idea: RPC nodes hold a copy of state and answer
            # | questions about it. Reading is asking; writing is a signed transaction that
            # | mutates. That asymmetry shapes this whole module, three lessons of free
            # | reads from two languages, then one carefully-earned write.
            explanation: "La cuarta idea del modelo mínimo: los nodos de RPC guardan una copia del estado y responden preguntas sobre él. Leer es preguntar; escribir es una transacción firmada que muta. Esa asimetría le da forma a este módulo entero, tres lecciones de lecturas gratis desde dos lenguajes, después una escritura cuidadosamente ganada."  # @src=4768ad4a847f
            options:                 # source order — keep it
              a:
                # | The public RPC covers your read fees out of a shared faucet allowance
                # | everyone draws on
                label: "El RPC público cubre tus comisiones de lectura desde una asignación compartida de faucet de la que todos sacan"  # @src=4365751912b9
                # | There's no fee being covered, reads simply aren't chain events. Fees
                # | exist to pay for state MUTATION, which is what transactions do and
                # | queries don't.
                feedback: "No hay ninguna comisión siendo cubierta, las lecturas simplemente no son eventos de la blockchain. Las comisiones existen para pagar la MUTACIÓN de estado, que es lo que hacen las transacciones y no hacen las consultas."  # @src=67cb1977171d
              d:
                # | Kit opens a fee-free read session, so no key is needed for queries
                label: "Kit abre una sesión de lectura sin comisión, así que no hace falta ninguna clave para las consultas"  # @src=331349a01fa3
                # | The lesson's first read was a raw curl POST with no client library at
                # | all, and it came back just as free. Kit adds types and a nicer call
                # | shape on top of the same JSON-RPC door; it does not negotiate anything
                # | with the node.
                feedback: "La primera lectura de la lección fue un POST de curl crudo sin ninguna librería cliente en absoluto, y volvió igual de gratis. Kit agrega tipos y una forma de llamada más linda encima de la misma puerta de JSON-RPC; no negocia nada con el nodo."  # @src=f0bdcd6225d1
              c:
                # | Read requests are free-tier transactions that validators process without
                # | signatures
                label: "Los requests de lectura son transacciones de tier gratuito que los validadores procesan sin firmas"  # @src=178abda53a41
                # | A read never becomes a transaction at all, it never touches consensus.
                # | Only writes are transactions, which is why m08-l4's single transfer is
                # | the module's big event and reads are three lines.
                feedback: "Una lectura nunca llega siquiera a ser una transacción, nunca toca el consenso. Solo las escrituras son transacciones, que es por qué la única transferencia de m08-l4 es el gran evento del módulo y las lecturas son tres líneas."  # @src=874d0013fee0
              b:
                # | RPC is the read door, a node answering questions about state, no
                # | transaction
                label: "El RPC es la puerta de lectura, un nodo respondiendo preguntas sobre el estado, sin transacción"  # @src=7c0546e497e4
                # | The node holds a copy of state and answers JSON questions about it, the
                # | way any web server answers a GET. Nothing was signed, nothing was paid
                # | for, and no validator recorded that you asked.
                feedback: "El nodo guarda una copia del estado y responde preguntas JSON sobre él, de la forma en que cualquier servidor web responde un GET. Nada se firmó, nada se pagó, y ningún validador registró que preguntaste."  # @src=65b5c11b18cb
  m08-l2:
    # | Reads in production: the Solana panel
    title: "Lecturas en producción: el panel de Solana"  # @src=1ecb0a33371e
    blocks:
      lamports-to-sol:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The remainder's DIGITS aren't the fraction, 2,500,000 lamports is .0025, not
          # | .25: pad to nine places first.
          0: "Los DÍGITOS del resto no son la fracción, 2,500,000 lamports es .0025, no .25: rellena a nueve lugares primero."  # @src=9419fe18223b
          # | padStart(9, '0'), then trim trailing zeros with a replace.
          1: "padStart(9, '0'), después recorta los ceros finales con un replace."  # @src=86086c8c684a
          # | Never convert the bigint to Number, t5's balance is above 2^53 on purpose.
          2: "Nunca conviertas el bigint a Number, el balance de t5 está por encima de 2^53 a propósito."  # @src=f0408b64250a
        tests:                      # keyed by test case id
          t1:
            # | one lamport needs all nine fractional digits
            description: "un lamport necesita los nueve dígitos fraccionarios"  # @src=1a2403fb16ea
          t2:
            # | a whole SOL prints with no decimal point
            description: "un SOL entero se imprime sin punto decimal"  # @src=5b6fe59330f9
          t3:
            # | trailing zeros in the fraction are trimmed
            description: "los ceros finales de la fracción se recortan"  # @src=98a8557c4c3c
          t4:
            # | the padding case: 2,500,000 lamports is 0.0025 SOL, not 0.25
            description: "el caso del relleno: 2,500,000 lamports son 0.0025 SOL, no 0.25"  # @src=8f6e71731a97
          t5:
            # | a balance above 2^53 lamports, Number-based math would corrupt this
            description: "un balance por encima de 2^53 lamports, la matemática basada en Number corrompería esto"  # @src=a4126303f512
          t6:
            # | zero lamports is just 0
            description: "cero lamports es simplemente 0"  # @src=e0321784fe14
      production-reads-check:                      # quiz
        questions:
          m08-l2-q1:
            # | getBalance hands your panel `{ value: lamports }` where lamports is a
            # | bigint. Why does kit refuse to give you a plain number?
            prompt: "getBalance le da a tu panel `{ value: lamports }` donde lamports es un bigint. ¿Por qué kit se niega a darte un número pelado?"  # @src=7102e3b48fba
            # | 2^53 - 1 lamports is about 9 million SOL, real accounts exceed it. Above
            # | that line, JS numbers round without warning; bigint doesn't. That's why the
            # | canonical read is `const { value: lamports } = await
            # | rpc.getBalance(address).send()` with lamports as bigint, and why your
            # | formatter does BigInt division and string padding instead of dividing by
            # | 1e9.
            explanation: "2^53 - 1 lamports son unos 9 millones de SOL, y las cuentas reales lo superan. Por encima de esa línea, los números de JS redondean sin avisar; bigint no. Por eso la lectura canónica es `const { value: lamports } = await rpc.getBalance(address).send()` con lamports como bigint, y por eso tu formateador hace división de BigInt y relleno de cadenas en vez de dividir por 1e9."  # @src=001f4edd46f5
            options:                 # source order — keep it
              d:
                # | The wire sends lamports as a decimal string, and number cannot parse it
                # | at all
                label: "El cable manda los lamports como una cadena decimal, y number no puede parsearla para nada"  # @src=bcd9fc1fb193
                # | The wire sends a JSON number, which parses fine. That is the trap:
                # | JSON.parse on a raw RPC response hands back a number that has already
                # | rounded anything above the cliff, before your code ever sees it. Kit
                # | reads the same bytes into a bigint instead.
                feedback: "El cable manda un número JSON, que parsea bien. Esa es la trampa: JSON.parse sobre una respuesta cruda de RPC te devuelve un número que ya redondeó cualquier cosa por encima del acantilado, antes de que tu código llegue siquiera a verlo. Kit lee esos mismos bytes hacia un bigint en cambio."  # @src=57064cea9978
              c:
                # | Lamport balances can exceed Number.MAX_SAFE_INTEGER, where number math
                # | lies
                label: "Los balances de lamports pueden superar Number.MAX_SAFE_INTEGER, donde la matemática de number miente"  # @src=02f528dea17a
                # | 2^53 - 1 lamports is about 9 million SOL, and exchange wallets and stake
                # | pools sit above it. Past that line float arithmetic rounds without
                # | throwing or warning, so kit keeps every u64 as bigint and moves the
                # | corruption risk to the one place you control: your own Number() call.
                feedback: "2^53 - 1 lamports son unos 9 millones de SOL, y las billeteras de exchange y los stake pools están por encima. Pasada esa línea la aritmética de floats redondea sin lanzar ni avisar, así que kit mantiene cada u64 como bigint y mueve el riesgo de corrupción al único lugar que controlas: tu propia llamada a Number()."  # @src=5b14e6f0dab0
              a:
                # | Numbers can't represent lamports because balances are always
                # | negative-safe integers
                label: "Los números no pueden representar lamports porque los balances son siempre enteros seguros para negativos"  # @src=d5eb27ecf76c
                # | Sign isn't the issue, JS numbers hold negative integers fine. The
                # | problem is magnitude: past 2^53 - 1, number arithmetic silently rounds,
                # | which is fatal for money.
                feedback: "El signo no es la cuestión, los números de JS manejan enteros negativos sin problema. El problema es la magnitud: pasado 2^53 - 1, la aritmética de number redondea en silencio, lo que es fatal para el dinero."  # @src=93056421c7ff
              b:
                # | bigint parses faster than number does in kit's JSON-RPC response
                # | decoding layer
                label: "bigint parsea más rápido que number en la capa de decodificación de respuestas JSON-RPC de kit"  # @src=7528437c903e
                # | It's a correctness choice, not a performance one, bigint parsing is if
                # | anything slower. The point is that no balance can be silently corrupted
                # | on the way in.
                feedback: "Es una elección de corrección, no de performance, el parseo de bigint es si acaso más lento. El punto es que ningún balance puede corromperse en silencio al entrar."  # @src=32dfdde70ed8
          m08-l2-q2:
            # | A teammate pins kit to the exact version a three-month-old tutorial used,
            # | then `npm i @solana-program/system` fails with a peer-dependency error.
            # | What's the taught fix?
            prompt: "Un compañero de equipo fija kit a la versión exacta que usó un tutorial de hace tres meses, y después `npm i @solana-program/system` falla con un error de peer-dependency. ¿Cuál es el arreglo enseñado?"  # @src=0595c05a2481
            # | Kit shipped two majors in just over nine weeks; any digit written into a
            # | tutorial (or this course) pre-rots. The durable rule from m03-l1, now paying
            # | off: read the peerDependencies of the packages you actually depend on, per
            # | workspace, and pin to what they demand. Digits belong only in install lines
            # | verified at the time you run them.
            explanation: "Kit entregó dos majors en poco más de nueve semanas; cualquier dígito escrito en un tutorial (o en este curso) se pudre de antemano. La regla durable de m03-l1, ahora pagando: lee las peerDependencies de los paquetes de los que de verdad dependes, por workspace, y fija a lo que exigen. Los dígitos pertenecen solo a líneas de instalación verificadas en el momento en que las corres."  # @src=fcf8c46014f8
            options:                 # source order — keep it
              a:
                # | Read the peer ranges of your workspace's @solana-program/* packages and
                # | pin to those
                label: "Lee los rangos de peer de los paquetes @solana-program/* de tu workspace y fija a esos"  # @src=bed0063f35b7
                # | npm view @solana-program/system version peerDependencies is the whole
                # | reading, and it took one command: at write time it declared @solana/kit
                # | ^8.0.0. The contract lives in your own tree, so it stays right on the
                # | day you run it rather than the day someone wrote a tutorial.
                feedback: "npm view @solana-program/system version peerDependencies es toda la lectura, y tomó un comando: al momento de escribir declaraba @solana/kit ^8.0.0. El contrato vive en tu propio árbol, así que sigue siendo correcto el día que lo corres y no el día en que alguien escribió un tutorial."  # @src=7f305d216df7
              c:
                # | Install with --legacy-peer-deps, since peer warnings are advisory in
                # | modern npm
                label: "Instala con --legacy-peer-deps, ya que los avisos de peer son solo orientativos en el npm moderno"  # @src=e2f177a796fc
                # | Forcing past a peer error ships a version mismatch that fails at runtime
                # | instead of install time, strictly worse. The error is the package
                # | manager reading the contract for you.
                feedback: "Forzar el paso más allá de un error de peer entrega un desajuste de versión que falla en tiempo de ejecución en vez de en tiempo de instalación, estrictamente peor. El error es el gestor de paquetes leyendo el contrato por ti."  # @src=fae4e8b5c5a4
              d:
                # | Pin @solana-program/system to the same major as kit, since the two ship
                # | in lockstep
                label: "Fija @solana-program/system a la misma major que kit, ya que los dos se entregan al unísono"  # @src=e01a1424cf95
                # | The digits never lined up: at write time the client sat at 0.14.1 while
                # | peering @solana/kit ^8.0.0. Generated clients version on their own
                # | schedule and declare the kit range they were built against, which is the
                # | only place the pairing is written down.
                feedback: "Los dígitos nunca coincidieron: al momento de escribir el cliente estaba en 0.14.1 mientras declaraba peer con @solana/kit ^8.0.0. Los clientes generados se versionan con su propio cronograma y declaran el rango de kit contra el que fueron construidos, que es el único lugar donde el emparejamiento está escrito."  # @src=919b45475fe1
              b:
                # | Always pin the newest kit major, since the client libraries track it
                # | within days
                label: "Fija siempre la major de kit más nueva, ya que las librerías cliente la siguen en cuestión de días"  # @src=e032a1f9b57e
                # | Newest-major is just a different frozen digit, and m03-l1's helius-sdk
                # | artifact showed a live package peering two majors behind latest. The
                # | peer range in YOUR tree is the contract, whichever direction it points.
                feedback: "La major más nueva es solo otro dígito congelado, y el artefacto de helius-sdk de m03-l1 mostró un paquete vivo declarando peer dos majors por detrás de latest. El rango de peer en TU árbol es el contrato, hacia donde sea que apunte."  # @src=f6d4b6776293
          m08-l2-q3:
            # | Why does the worker serve chain data from a KV snapshot refreshed on cron,
            # | instead of calling the RPC inside every incoming request?
            prompt: "¿Por qué el worker sirve datos de la blockchain desde un snapshot de KV refrescado por cron, en vez de llamar al RPC adentro de cada request entrante?"  # @src=fa6548108af5
            # | The public RPC is a shared, capped resource explicitly not meant for
            # | production traffic. Routing every visitor's page view to it converts your
            # | traffic into rate-limit bans. The station's pattern, cron-refreshed KV
            # | snapshot, backoff on refresh, honest timestamp, is the same budget
            # | discipline m02-l3 taught, applied to a chain.
            explanation: "El RPC público es un recurso compartido y con tope, explícitamente no pensado para tráfico de producción. Rutear hacia él la vista de página de cada visitante convierte tu tráfico en bans por rate limit. El patrón de la estación, snapshot de KV refrescado por cron, backoff en el refresh, timestamp honesto, es la misma disciplina de presupuesto que enseñó m02-l3, aplicada a una blockchain."  # @src=cf995a9fd094
            options:                 # source order — keep it
              c:
                # | Chain state only changes at epoch boundaries, so more frequent reads
                # | return identical data
                label: "El estado de la blockchain solo cambia en los límites de epoch, así que lecturas más frecuentes devuelven datos idénticos"  # @src=44468028b1c1
                # | State changes every slot, roughly every 300ms, so fresher reads DO see
                # | new data. The snapshot trades a little freshness for surviving the rate
                # | budget; it doesn't claim the data is static.
                feedback: "El estado cambia en cada slot, alrededor de cada 300ms, así que las lecturas más frescas SÍ ven datos nuevos. El snapshot cambia un poco de frescura por sobrevivir al presupuesto del rate limit; no afirma que los datos sean estáticos."  # @src=108c62bef4df
              d:
                # | Cloudflare bills each outbound fetch, so cron reads cost less than
                # | per-request ones
                label: "Cloudflare cobra cada fetch saliente, así que las lecturas por cron cuestan menos que las por request"  # @src=fb0c796230a5
                # | The bill this design is dodging is not yours. The scarce resource is the
                # | shared public endpoint's 100-per-10-seconds cap, which strangers behind
                # | your IP spend alongside you, and the payoff is a degrade path: a refused
                # | refresh keeps serving the last snapshot instead of forwarding the
                # | refusal.
                feedback: "La cuenta que este diseño esquiva no es la tuya. El recurso escaso es el tope de 100-por-10-segundos del endpoint público compartido, que los desconocidos detrás de tu IP gastan junto a ti, y el pago es un camino de degradación: un refresh rechazado sigue sirviendo el último snapshot en vez de reenviar el rechazo."  # @src=7a19ef5af3e4
              b:
                # | Per-request RPC calls spend the public caps on page views, cache and
                # | refresh on cron
                label: "Las llamadas de RPC por request gastan los topes públicos en vistas de página, cachea y refresca por cron"  # @src=98c788ed424c
                # | The caps are 100 requests per IP per 10 seconds on a resource the docs
                # | call unsuitable for production. Routing page views at it converts
                # | popularity into 429s for everyone behind that IP, while a cron-refreshed
                # | snapshot spends a fixed budget no matter how many people look.
                feedback: "Los topes son 100 requests por IP cada 10 segundos sobre un recurso que los docs llaman no apto para producción. Rutear vistas de página hacia él convierte la popularidad en 429s para todos los que están detrás de esa IP, mientras que un snapshot refrescado por cron gasta un presupuesto fijo sin importar cuánta gente mire."  # @src=cfb7bef08322
              a:
                # | Because kit cannot execute inside workerd, so cached values are the only
                # | option
                label: "Porque kit no puede ejecutarse adentro de workerd, así que los valores cacheados son la única opción"  # @src=b6840ccb2428
                # | kit publishes a workerd export condition and the runtime provides its
                # | crypto, and even if the write-time smoke test forces the plain-fetch
                # | fallback, the caching argument stands on its own: it's about budgets,
                # | not capability.
                feedback: "kit publica una condición de export workerd y el runtime provee su crypto, y aunque la prueba de humo al momento de escribir forzara el fallback de fetch pelado, el argumento del cacheo se sostiene solo: se trata de presupuestos, no de capacidad."  # @src=e66d51c0588e
          m08-l2-q4:
            # | solanakit.com's upgrade guide leads with the new createClient().use(...)
            # | plugin API. Should the panel be rewritten onto it today?
            prompt: "La guía de upgrade de solanakit.com abre con la nueva API de plugins createClient().use(...). ¿Habría que reescribir el panel sobre ella hoy?"  # @src=a4f8bd0fb73d
            # | The 'where kit is heading' box exists precisely for this: name the new API,
            # | date its maturity (the plugin packages version in lockstep with kit, 8.2.0
            # | at write time, so newness is the caution, not a 0.x digit), and keep the
            # | lab on the stable path, the dialect kit's own examples and generated
            # | clients speak today. Re-check when you next touch this code; when that
            # | canon moves to createClient(), the calculus changes.
            explanation: "El cuadro de 'hacia dónde va kit' existe precisamente para esto: nombrar la API nueva, fechar su madurez (los paquetes de plugin versionan al unísono con kit, 8.2.0 al momento de escribir, así que la cautela es la novedad, no un dígito 0.x), y mantener el lab en el camino estable, el dialecto que hablan hoy los ejemplos propios de kit y sus clientes generados. Vuelve a revisar la próxima vez que toques este código; cuando ese canon se mueva a createClient(), el cálculo cambia."  # @src=9e71dd10dd99
            options:                 # source order — keep it
              a:
                # | Yes, the docs lead with it, which means the pipe-style flow is already
                # | deprecated
                label: "Sí, los docs abren con eso, lo que quiere decir que el flujo estilo pipe ya está deprecado"  # @src=455bc7f48b0a
                # | Leading the upgrade guide signals direction, not deprecation, the pipe
                # | flow remains the documented, stable path and the one kit's own examples
                # | use. Docs-page ordering is marketing; what the ecosystem's shipped code
                # | speaks is evidence.
                feedback: "Abrir la guía de upgrade señala dirección, no deprecación, el flujo de pipe sigue siendo el camino documentado y estable y el que usan los ejemplos propios de kit. El orden de la página de docs es marketing; lo que habla el código despachado del ecosistema es evidencia."  # @src=7e186f2e4ba5
              c:
                # | Not yet, the plugin API is kit's newest; the pipe flow stays the taught
                # | canon
                label: "Todavía no, la API de plugins es la más nueva de kit; el flujo de pipe se queda como el canon enseñado"  # @src=fc75af44024c
                # | The plugin packages version in lockstep with kit, they read 8.2.0 at
                # | write time, the same digit as kit itself, so no 1.0 milestone exists to
                # | wait for. What dates the surface is newness: kit shipped two majors in
                # | just over nine weeks, and the plugin API is the youngest thing riding
                # | that pace. The pipe flow is the documented stable path that kit's own
                # | examples and generated clients speak, so what you wired is foundation.
                # | Re-run this calculus when that canon moves to createClient().
                feedback: "Los paquetes de plugin versionan al unísono con kit, marcaban 8.2.0 al momento de escribir, el mismo dígito que kit en sí, así que no existe un hito de 1.0 que esperar. Lo que fecha la superficie es la novedad: kit entregó dos majors en poco más de nueve semanas, y la API de plugins es lo más joven montado en ese ritmo. El flujo de pipe es el camino estable documentado que hablan los ejemplos propios de kit y sus clientes generados, así que lo que cableaste es cimiento. Vuelve a correr este cálculo cuando ese canon se mueva a createClient()."  # @src=05dd3f225418
              d:
                # | Yes, an early rewrite usually costs less than a later forced migration
                # | under deadline
                label: "Sí, una reescritura temprana normalmente cuesta menos que una migración forzada más tarde contra reloj"  # @src=6655f0117d6e
                # | That trade only pays once the target stops moving, and nothing here
                # | forces the move: the pipe flow is not deprecated, it is the dialect
                # | kit's own examples and generated clients still speak. The plugin
                # | surface is the library's newest in an ecosystem that shipped two kit
                # | majors in just over nine weeks, so an early rewrite buys you the
                # | migration several times over instead of once.
                feedback: "Ese trade-off solo paga una vez que el target deja de moverse, y nada acá fuerza el movimiento: el flujo de pipe no está deprecado, es el dialecto que los ejemplos propios de kit y sus clientes generados todavía hablan. La superficie de plugins es la más nueva de la librería en un ecosistema que entregó dos majors de kit en poco más de nueve semanas, así que una reescritura temprana te compra la migración varias veces en vez de una."  # @src=094702435a4d
              b:
                # | No, createClient() is a third-party wrapper, not part of kit itself
                label: "No, createClient() es un wrapper de terceros, no parte de kit en sí"  # @src=308854d4374b
                # | It IS kit's own API, live on solanakit.com, the hesitation isn't
                # | provenance. It's maturity: the plugin packages backing it version in
                # | lockstep with kit itself (8.2.0 at write time), so no 0.x digit will
                # | ever flag them as young. Their age shows elsewhere: they are the
                # | library's newest surface, and the canon kit's examples and generated
                # | clients speak has not moved onto them.
                feedback: "SÍ es la API propia de kit, en vivo en solanakit.com, la duda no es de procedencia. Es de madurez: los paquetes de plugin que la respaldan versionan al unísono con el propio kit (8.2.0 al momento de escribir), así que ningún dígito 0.x los va a señalar jamás como jóvenes. Su edad se ve en otro lado: son la superficie más nueva de la librería, y el canon que hablan los ejemplos de kit y sus clientes generados todavía no se movió a ellos."  # @src=89598ec952f5
  m08-l3:
    # | The Rust path: raw JSON-RPC
    title: "El camino de Rust: JSON-RPC crudo"  # @src=60945f65b2b3
    blocks:
      rust-path-check:                      # quiz
        questions:
          m08-l3-q1:
            # | The TS surfaces use a client library; the Rust daemon POSTs raw JSON-RPC.
            # | Why does the course refuse to reach for the solana-client crate here?
            prompt: "Las superficies de TS usan una librería cliente; el daemon de Rust hace POST de JSON-RPC crudo. ¿Por qué el curso se niega a agarrar el crate solana-client acá?"  # @src=bc5c4993d4c9
            # | The call this lesson makes: for a fundamentals reader, plain JSON-RPC over
            # | reqwest + serde_json reinforces the skills the course already built and
            # | carries zero Solana-crate churn. solana-client exists for full clients that
            # | submit transactions over QUIC to leaders, a different job. When reads
            # | outgrow this pattern, the typed path is solana-rpc-client and the granular
            # | crates in the go-deeper box.
            explanation: "La decisión que toma esta lección: para alguien que lee fundamentos, JSON-RPC simple sobre reqwest + serde_json refuerza las habilidades que el curso ya construyó y carga cero churn de crates de Solana. solana-client existe para clientes completos que envían transacciones por QUIC a los líderes, otro trabajo. Cuando las lecturas le queden grandes a este patrón, el camino tipado es solana-rpc-client y los crates granulares del cuadro de Profundiza."  # @src=79d4b19de336
            options:                 # source order — keep it
              b:
                # | solana-client is effectively unmaintained, so depending on it is a
                # | supply-chain liability
                label: "solana-client está efectivamente sin mantenimiento, así que depender de él es un pasivo de cadena de suministro"  # @src=bc47b02718c9
                # | It's actively maintained inside the mainline Solana Rust ecosystem,
                # | abandonment isn't the argument. The argument is fit: a
                # | transaction-submission transport stack is dead weight under a two-read
                # | poller.
                feedback: "Se mantiene activamente adentro del ecosistema principal de Solana en Rust, el abandono no es el argumento. El argumento es el encaje: un stack de transporte para envío de transacciones es peso muerto debajo de un poller de dos lecturas."  # @src=90a17e758371
              d:
                # | Rust has no canonical client crate of its own, so hand-rolling is the
                # | only path here
                label: "Rust no tiene crate cliente canónico propio, así que hacerlo a mano es el único camino acá"  # @src=a7e5272df2ea
                # | There is a typed Rust path, and the lesson names it rather than hiding
                # | it: solana-rpc-client plus the granular solana-* crates, which is where
                # | reads graduate when they outgrow this pattern. Hand-rolling is a fit
                # | decision for a two-read poller, not a gap in the ecosystem.
                feedback: "Hay un camino tipado en Rust, y la lección lo nombra en vez de esconderlo: solana-rpc-client más los crates solana-* granulares, que es adonde se graduan las lecturas cuando le quedan grandes a este patrón. Hacerlo a mano es una decisión de encaje para un poller de dos lecturas, no un hueco en el ecosistema."  # @src=674851bc393a
              a:
                # | solana-client bundles a QUIC/TPU submission transport a two-read poller
                # | never calls
                label: "solana-client empaqueta un transporte de envío por QUIC/TPU que un poller de dos lecturas nunca llama"  # @src=e611c979bde3
                # | It is the kitchen-sink client: QUIC and UDP clients, the TPU client that
                # | talks straight to block leaders, connection caching, streamer machinery.
                # | That is the equipment of something firing transactions at validators,
                # | and you compile, audit and re-pin all of it to ask two questions on a
                # | timer.
                feedback: "Es el cliente que trae de todo: clientes de QUIC y UDP, el cliente de TPU que habla directo con los líderes de bloque, cacheo de conexiones, maquinaria del streamer. Ese es el equipamiento de algo que dispara transacciones a validadores, y compilas, auditas y vuelves a fijar todo eso para hacer dos preguntas en un temporizador."  # @src=494d4ecf308b
              c:
                # | solana-client cannot perform reads at all, it exists only to submit
                # | transactions
                label: "solana-client no puede hacer lecturas para nada, existe solo para enviar transacciones"  # @src=a8d79ba3db4d
                # | It reads fine, it's the kitchen-sink client precisely because it does
                # | everything. The point is what ELSE it drags in for a program that will
                # | only ever ask two questions.
                feedback: "Lee perfectamente, es el cliente que trae de todo precisamente porque hace todo. El punto es qué MÁS arrastra para un programa que nunca va a hacer más que dos preguntas."  # @src=8a3ca8e1eec5
          m08-l3-q2:
            # | A teammate counters: 'solana-rpc-client has MORE direct dependencies than
            # | solana-client, your slim crate argument is backwards.' What's the honest
            # | reply?
            prompt: "Un compañero contraataca: 'solana-rpc-client tiene MÁS dependencias directas que solana-client, tu argumento del crate flaco está al revés.' ¿Cuál es la respuesta honesta?"  # @src=b04577802470
            # | The corrected research row exists for this exact exchange: solana-rpc-client
            # | has more direct deps by raw count, yet zero of the QUIC/TPU/streamer
            # | transport machinery. The defensible claim is scoped, 'no submission
            # | transport a reader never uses', and the meta-lesson is to argue from the
            # | axis that actually differentiates, because a learner who counts will catch
            # | you.
            explanation: "La fila corregida de la investigación existe para este intercambio exacto: solana-rpc-client tiene más deps directas por conteo crudo, y cero de la maquinaria de transporte de QUIC/TPU/streamer. La afirmación defendible está acotada, 'ningún transporte de envío que un lector nunca usa', y la meta-lección es argumentar desde el eje que de verdad diferencia, porque alguien que aprende y cuenta te va a cazar."  # @src=00d624fa9ded
            options:                 # source order — keep it
              a:
                # | They must be counting dev-dependencies; by normal deps solana-client is
                # | much larger
                label: "Debe estar contando dev-dependencies; por deps normales solana-client es mucho más grande"  # @src=b65ab186b0da
                # | No, by raw direct-dep count solana-rpc-client genuinely comes out ahead
                # | (light type-crates add up). Disputing their count loses; the count is
                # | real and it's the wrong axis.
                feedback: "No, por conteo crudo de deps directas solana-rpc-client de verdad sale adelante (los crates de tipos livianos suman). Discutir su conteo pierde; el conteo es real y es el eje equivocado."  # @src=1f71a598c0fb
              b:
                # | They're right on the count, wrong on the axis, slimness means transport
                # | scope here
                label: "Tiene razón en el conteo, se equivoca en el eje, acá la flacura significa alcance de transporte"  # @src=a29ce047e1d8
                # | Concede the number, keep the conclusion: 29 direct deps against 35 is
                # | real, and neither figure touches what differentiates the two, which is
                # | that one carries QUIC, TPU and streamer machinery a reader never calls.
                # | Argue from the axis that separates them, because a learner who counts
                # | will check.
                feedback: "Concede el número, quédate con la conclusión: 29 deps directas contra 35 es real, y ninguna de las dos cifras toca lo que diferencia a los dos, que es que uno carga maquinaria de QUIC, TPU y streamer que un lector nunca llama. Argumenta desde el eje que los separa, porque alguien que aprende y cuenta va a revisar."  # @src=d18fe64a4e2f
              c:
                # | Dependency counts don't matter at all in Rust, since the compiler strips
                # | unused code
                label: "Los conteos de dependencias no importan para nada en Rust, ya que el compilador saca el código no usado"  # @src=42f5ce1c74af
                # | Dead-code elimination doesn't erase the costs of a big tree, compile
                # | time, audit surface, and churn all scale with what you pull in. Counts
                # | matter; RAW counts just don't rank these two crates correctly.
                feedback: "La eliminación de código muerto no borra los costos de un árbol grande, el tiempo de compilación, la superficie de auditoría y el churn escalan todos con lo que traes. Los conteos importan; los conteos CRUDOS simplemente no ordenan bien estos dos crates."  # @src=35c33a2c3c0a
              d:
                # | Concede the count and adopt solana-client, since its 29 direct deps beat
                # | the other 35
                label: "Concede el conteo y adopta solana-client, ya que sus 29 deps directas le ganan a las otras 35"  # @src=465bb159ff39
                # | Following the count where it leads is how a good number produces a bad
                # | decision. The 29-dep crate is the one carrying the submission transport
                # | stack, so conceding the axis hands you the heavier client for a job that
                # | makes two reads.
                feedback: "Seguir el conteo hasta donde lleva es cómo un buen número produce una mala decisión. El crate de 29 deps es el que carga el stack de transporte de envío, así que conceder el eje te deja el cliente más pesado para un trabajo que hace dos lecturas."  # @src=e8b80ad1597c
          m08-l3-q3:
            # | Your balance probe deserializes cleanly, but a probe against a mistyped
            # | method name returns HTTP 200 and your poller marks the target healthy. What
            # | did you miss?
            prompt: "Tu sonda de saldo deserializa limpio, pero una sonda contra un nombre de método mal tipeado devuelve HTTP 200 y tu poller marca el target como sano. ¿Qué se te pasó?"  # @src=7f2fa89ebe35
            # | The transport layer succeeded, HTTP did its job delivering a well-formed
            # | reply that happens to say 'error' in JSON-RPC's own envelope. That's why the
            # | ProbeRpcError taxonomy gives the in-envelope error its own variant, distinct
            # | from transport and status failures: four different failure planes, four
            # | different remediations, one greppable name each when m09-l2's logging lands.
            explanation: "La capa de transporte tuvo éxito, HTTP hizo su trabajo entregando una respuesta bien formada que resulta que dice 'error' en el sobre propio de JSON-RPC. Por eso la taxonomía de ProbeRpcError le da al error dentro-del-sobre su propia variante, distinta de las fallas de transporte y de estado: cuatro planos de falla distintos, cuatro remediaciones distintas, un nombre grepeable cada uno cuando aterrice el logging de m09-l2."  # @src=a29ea5cedcf0
            options:                 # source order — keep it
              c:
                # | JSON-RPC reports failures inside a 200 response, you must check the
                # | envelope's error member
                label: "JSON-RPC reporta fallas adentro de una respuesta 200, tienes que revisar el miembro error del sobre"  # @src=d6e049bd2d7a
                # | Transport did its job: it delivered a well-formed reply whose body reads
                # | {"error":{"code":-32601,"message":"Method not found"}}. A probe that
                # | reads only response.status() marks that healthy forever, and a monitor
                # | that reports wrong is worse than no monitor, because people believe it.
                feedback: "El transporte hizo su trabajo: entregó una respuesta bien formada cuyo cuerpo dice {\"error\":{\"code\":-32601,\"message\":\"Method not found\"}}. Una sonda que lee solo response.status() marca eso como sano para siempre, y un monitor que reporta mal es peor que ningún monitor, porque la gente le cree."  # @src=8ad658d1ffff
              a:
                # | A reqwest timeout, the request hung and the stale success from the
                # | previous tick leaked through
                label: "Un timeout de reqwest, el request se colgó y el éxito desactualizado del tick anterior se filtró"  # @src=77e32d6ead6c
                # | A hang would surface as a slow or errored tick, not a clean 200. The
                # | response arrived promptly, the problem is what was INSIDE it.
                feedback: "Un cuelgue aparecería como un tick lento o con error, no como un 200 limpio. La respuesta llegó puntual, el problema es lo que venía ADENTRO."  # @src=5c608878d16e
              b:
                # | The retry budget, a single attempt isn't enough to distinguish healthy
                # | from unhealthy
                label: "El presupuesto de retries, un solo intento no alcanza para distinguir sano de no sano"  # @src=f517f8a5fb5c
                # | No retry policy fixes this: every attempt would return the same
                # | misleading 200. The bug is in classification, not persistence.
                feedback: "Ninguna política de retry arregla esto: cada intento devolvería el mismo 200 engañoso. El bug está en la clasificación, no en la persistencia."  # @src=7ac3da681e5c
              d:
                # | The typo itself, a checked method-name constant would have prevented the
                # | call
                label: "El typo en sí, una constante de nombre de método verificada habría evitado la llamada"  # @src=5e3e51f7eb59
                # | That patches one instance and leaves the hole open. An unhealthy node
                # | answers through the same error member with a perfectly spelled method,
                # | so the classification bug outlives every typo you eliminate. The
                # | envelope check is what makes plane three visible at all.
                feedback: "Eso parcha una instancia y deja el hueco abierto. Un nodo no sano responde por el mismo miembro error con un método perfectamente escrito, así que el bug de clasificación sobrevive a cada typo que elimines. La revisión del sobre es lo que hace visible al plano tres, para empezar."  # @src=ec72b4351862
          m08-l3-q4:
            # | You merged the chain-probe module and pushed. What turns that commit into
            # | the re-shipped station, and what did YOU have to do beyond the push?
            prompt: "Mergeaste el módulo de sondeo de la blockchain y empujaste. ¿Qué convierte ese commit en la estación re-entregada, y qué tuviste que hacer TÚ más allá del push?"  # @src=cfb319961542
            # | The re-ship IS the lesson's demonstration: the M6 pipeline, test, build
            # | multi-stage, push to GHCR, consumed the new probe module without a single
            # | ops change. Code that lands in an already-shipping system inherits its ship.
            # | Your only manual steps were the ones proving it worked: pull the fresh
            # | image, run it, curl /status.
            explanation: "La re-entrega ES la demostración de la lección: el pipeline de M6, testear, construir multi-stage, empujar a GHCR, consumió el módulo de sondeo nuevo sin un solo cambio de ops. El código que aterriza en un sistema que ya se entrega hereda su entrega. Tus únicos pasos manuales fueron los que demuestran que funcionó: hacer pull de la imagen fresca, correrla, curlear /status."  # @src=067a7607edb8
            options:                 # source order — keep it
              c:
                # | You cut a GitHub Release so the workflow attaches a new binary, which
                # | GHCR then mirrors
                label: "Cortas un GitHub Release para que el workflow adjunte un binario nuevo, que GHCR después espeja"  # @src=ca435e707799
                # | Releases-with-binaries was m05-l3's ship, a different artifact on a
                # | different path. GHCR images build from the container workflow on push,
                # | no release tag involved, and GHCR mirrors nothing.
                feedback: "Los releases-con-binarios fueron la entrega de m05-l3, otro artefacto por otro camino. Las imágenes de GHCR se construyen desde el workflow de contenedores en el push, sin ningún tag de release involucrado, y GHCR no espeja nada."  # @src=997cc103d982
              b:
                # | You rebuild with cargo --release and docker push from your own machine,
                # | as CI can't reach GHCR
                label: "Reconstruyes con cargo --release y haces docker push desde tu propia máquina, ya que CI no puede alcanzar GHCR"  # @src=1b751fc28395
                # | CI has been pushing to GHCR with GITHUB_TOKEN since m06-l4, that was the
                # | whole point of ship #3. Hand-pushing from a laptop would bypass the
                # | tests-gate and reintroduce works-on-my-machine.
                feedback: "CI viene empujando a GHCR con GITHUB_TOKEN desde m06-l4, ese era todo el punto de ship #3. Empujar a mano desde una laptop esquivaría la barrera de tests y reintroduciría el funciona-en-mi-máquina."  # @src=151c4f7bada9
              a:
                # | CI rebuilds and pushes the GHCR image from the same M6 pipeline, nothing
                # | new; you pull and run it
                label: "CI reconstruye y empuja la imagen de GHCR desde el mismo pipeline de M6, nada nuevo; tú le haces pull y la corres"  # @src=176f986d46c1
                # | The workspace, the Dockerfile and the workflow are all untouched since
                # | m06-l4, so the commit inherits the ship it landed in. Your manual steps
                # | were the ones that prove it from outside: docker pull, docker run, curl
                # | /status, and read a live mainnet slot back.
                feedback: "El workspace, el Dockerfile y el workflow están todos intactos desde m06-l4, así que el commit hereda la entrega en la que aterrizó. Tus pasos manuales fueron los que lo demuestran desde afuera: docker pull, docker run, curl /status, y leer de vuelta un slot de mainnet en vivo."  # @src=98d027d2587b
              d:
                # | The Dockerfile needed the new module in its copy list before CI could
                # | build the image
                label: "El Dockerfile necesitaba el módulo nuevo en su lista de copia antes de que CI pudiera construir la imagen"  # @src=fdb7901b6c88
                # | The cargo-chef multi-stage build copies the workspace, so a new module
                # | inside an existing crate is invisible to it. Check your own diff: the
                # | manifest gained one thiserror line and the ops files gained nothing,
                # | which is exactly the property the re-ship was staged to demonstrate.
                feedback: "El build multi-stage de cargo-chef copia el workspace, así que un módulo nuevo adentro de un crate existente le es invisible. Revisa tu propio diff: el manifest ganó una línea de thiserror y los archivos de ops no ganaron nada, que es exactamente la propiedad que la re-entrega se montó para demostrar."  # @src=9eb03df3987f
  m08-l4:
    # | The write path health check: one transfer
    title: "El chequeo de salud del camino de escritura: una transferencia"  # @src=4c0090eaa029
    blocks:
      write-path-check:                      # quiz
        questions:
          m08-l4-q1:
            # | Monday the airdrop failed with a 429; Tuesday it failed with an internal
            # | error; Wednesday it worked. What does the lesson want you to build from that
            # | experience?
            prompt: "El lunes el airdrop falló con un 429; el martes falló con un error interno; el miércoles funcionó. ¿Qué quiere la lección que construyas a partir de esa experiencia?"  # @src=bf106b85bb41
            # | The airdrop beat is a small production system in miniature: a best-effort
            # | external dependency with heterogeneous failures and a hard budget. The
            # | taught shape is generic failure handling plus backoff plus a fallback you've
            # | rehearsed, which is why the lesson makes everyone run the local validator
            # | once, before they need it in anger.
            explanation: "El beat del airdrop es un sistema de producción chico en miniatura: una dependencia externa best-effort con fallas heterogéneas y un presupuesto duro. La forma que se enseña es manejo genérico de fallas más backoff más un fallback que ya ensayaste, que es por lo que la lección hace que todos corran el validador local una vez, antes de necesitarlo en serio."  # @src=2fc70c39c042
            options:                 # source order — keep it
              c:
                # | A loop that retries immediately until success, since Wednesday proves it
                # | eventually works
                label: "Un loop que reintenta de inmediato hasta tener éxito, ya que el miércoles demuestra que con el tiempo funciona"  # @src=36ecb3ed1feb
                # | The unauthenticated budget is 2 requests per 8 hours, a hot retry loop
                # | burns the whole allowance in seconds and guarantees the dry-faucet state
                # | it was trying to escape.
                feedback: "El presupuesto sin autenticar es de 2 requests por 8 horas, un loop de retry en caliente se quema la asignación entera en segundos y garantiza el estado de faucet seco del que estaba tratando de escapar."  # @src=b86d094ea022
              b:
                # | A general fails-many-ways branch with backoff, plus the rehearsed
                # | local-validator fallback
                label: "Una rama general de falla-de-muchas-formas con backoff, más el fallback ensayado al validador local"  # @src=2f26535ad981
                # | Three spaced attempts, a catch that reads any message rather than one
                # | code, and an error that hands the operator the exact fallback command.
                # | That is a best-effort dependency with a hard budget handled the way
                # | m02-l3 taught, and the fallback works because everyone ran it once
                # | already.
                feedback: "Tres intentos espaciados, un catch que lee cualquier mensaje en vez de un solo código, y un error que le da al operador el comando de fallback exacto. Esa es una dependencia best-effort con un presupuesto duro manejada como enseñó m02-l3, y el fallback funciona porque todos ya lo corrieron una vez."  # @src=2866a4390e6d
              d:
                # | Skip the faucet for the local validator, whose airdrops always land and
                # | never throttle
                label: "Sáltate el faucet por el validador local, cuyos airdrops siempre aterrizan y nunca te frenan"  # @src=099dd6cf8005
                # | That is the fallback, not a replacement. A private chain of one confirms
                # | everything you send, which is what makes it prove your code and nothing
                # | about the network between you and a public cluster. The lab keeps both
                # | targets for that reason: one script, two chains, two different
                # | questions.
                feedback: "Ese es el fallback, no un reemplazo. Una blockchain privada de uno confirma todo lo que mandas, que es lo que hace que demuestre tu código y nada sobre la red entre tú y un cluster público. El lab mantiene los dos targets por esa razón: un script, dos blockchains, dos preguntas distintas."  # @src=0f574d50e4bf
              a:
                # | A handler for the 429 specifically, since rate-limiting is the
                # | documented failure
                label: "Un handler para el 429 específicamente, ya que el rate limiting es la falla documentada"  # @src=ef37196a75ed
                # | Same-day research probes hit BOTH a 429 and an internal error, neither
                # | is 'the' failure. Code that matches one specific error breaks on the
                # | other; the faucet's failure surface is heterogeneous by observation.
                feedback: "Las sondas de investigación del mismo día se toparon con AMBOS, un 429 y un error interno, ninguno es 'la' falla. El código que hace match contra un error específico se rompe con el otro; la superficie de falla del faucet es heterogénea por observación."  # @src=e0f880e73f4d
          m08-l4-q2:
            # | Why does tx-check sign with a throwaway file keypair instead of connecting
            # | the browser wallet you already own?
            prompt: "¿Por qué tx-check firma con un par de claves desechable en un archivo en vez de conectar la billetera de navegador de la que ya eres dueño?"  # @src=702e829a11dd
            # | The boundary is on purpose: this course teaches the write pipe, and
            # | wallet-standard, connection UX, and signing prompts are a client-side
            # | discipline of their own. A gitignored 32-byte throwaway holding worthless
            # | devnet SOL is the minimal signer that lets this lesson teach
            # | message-building, signing, and confirmation; wanting a real wallet is the
            # | signal you have reached that boundary, and the catalog's client-side course
            # | (in production) is where that depth lands.
            explanation: "La frontera es a propósito: este curso enseña el pipe de escritura, y wallet-standard, la UX de conexión, y los prompts de firma son una disciplina propia del lado del cliente. Una desechable gitignoreada de 32 bytes que guarda SOL de devnet sin valor es el signer mínimo que le deja a esta lección enseñar construcción de mensajes, firma y confirmación; querer una billetera de verdad es la señal de que llegaste a esa frontera, y el curso de dominio del lado del cliente del catálogo (en producción) es donde aterriza esa profundidad."  # @src=817c23ab5703
            options:                 # source order — keep it
              c:
                # | Wallet UX is deliberately out of this course's scope; a throwaway key
                # | keeps this about the pipe flow
                label: "La UX de billeteras queda deliberadamente fuera del alcance de este curso; una clave desechable mantiene esto sobre el flujo del pipe"  # @src=8b4f5f2b1289
                # | Wallet-standard, connection UX and signing prompts are a client-side
                # | discipline of their own, and the catalog hands them to the course that
                # | teaches them properly. A file of 32 random bytes is the smallest signer
                # | that still produces the signatures mainnet validators verify.
                feedback: "Wallet-standard, la UX de conexión y los prompts de firma son una disciplina propia del lado del cliente, y el catálogo se los pasa al curso que los enseña como se debe. Un archivo de 32 bytes aleatorios es el signer más chico que todavía produce las firmas que verifican los validadores de mainnet."  # @src=1a8508187ae2
              d:
                # | Devnet SOL is worthless, so a throwaway key puts wallet hygiene out of
                # | scope
                label: "El SOL de devnet no vale nada, así que una clave desechable deja la higiene de billeteras fuera del alcance"  # @src=b2b99735025d
                # | The SOL is worthless and the hygiene still matters: .keys/ went into
                # | .gitignore before the seed existed, because a committed keypair is a
                # | leaked key forever and history does not forget. The habit is the
                # | transferable part, which is why the checkpoint gates on git status.
                feedback: "El SOL no vale nada y la higiene igual importa: .keys/ se fue al .gitignore antes de que la seed existiera, porque un par de claves al que le hiciste commit es una clave filtrada para siempre y la historia no olvida. El hábito es la parte transferible, que es por lo que el Checkpoint pone la barrera sobre git status."  # @src=047c6dd099f6
              a:
                # | Browser wallets refuse devnet transactions, so a file keypair is the
                # | only signer that works
                label: "Las billeteras de navegador rechazan las transacciones de devnet, así que un par de claves en archivo es el único signer que funciona"  # @src=3fc8ab5dcab6
                # | Wallets handle devnet fine, most have a network switch. The exclusion
                # | isn't technical capability; it's a deliberate boundary in what this
                # | course teaches.
                feedback: "Las billeteras manejan devnet bien, la mayoría tiene un switch de red. La exclusión no es capacidad técnica; es una frontera deliberada en lo que enseña este curso."  # @src=32cc6c699bca
              b:
                # | File keypairs produce stronger signatures than wallet-managed keys on
                # | devnet
                label: "Los pares de claves en archivo producen firmas más fuertes que las claves administradas por billetera en devnet"  # @src=5d36e7ceca01
                # | The signature math is identical Ed25519 either way, where the key lives
                # | changes custody and UX, not cryptographic strength.
                feedback: "La matemática de la firma es Ed25519 idéntica en los dos casos, dónde vive la clave cambia custodia y UX, no fuerza criptográfica."  # @src=997a1bad46af
          m08-l4-q3:
            # | Your script builds the transaction message at startup, does other work for
            # | two minutes, then sends, and confirmation fails every time. What did the
            # | pipe flow's lifetime step already tell you?
            prompt: "Tu script construye el mensaje de transacción al arranque, hace dos minutos de otro trabajo, después manda, y la confirmación falla todas las veces. ¿Qué te dijo ya el paso de tiempo de vida del flujo del pipe?"  # @src=53fabc7b1aa8
            # | The lifetime step stamps the message with a recent blockhash, and the
            # | network only accepts it while that blockhash is still recent: 150 blocks,
            # | about 45 seconds at the chain's 300ms slot time. That's a feature: expired
            # | transactions die cleanly instead of landing hours later when you've given
            # | up. The practical rule the footgun states: fetch the blockhash inside the
            # | send path, not at script start.
            explanation: "El paso de tiempo de vida estampa el mensaje con un blockhash reciente, y la red solo lo acepta mientras ese blockhash siga siendo reciente: 150 bloques, como 45 segundos al tiempo de slot de 300ms de la blockchain. Eso es una feature: las transacciones expiradas mueren limpio en vez de aterrizar horas después, cuando ya te rendiste. La regla práctica que enuncia la trampa: trae el blockhash adentro del camino de envío, no al arrancar el script."  # @src=0e353f2f8771
            options:                 # source order — keep it
              a:
                # | The blockhash lifetime is an expiry window, a stale blockhash means dead
                # | on arrival
                label: "El tiempo de vida del blockhash es una ventana de expiración, un blockhash desactualizado quiere decir muerto al llegar"  # @src=f9e8c85b230c
                # | The window is 150 blocks, about 45 seconds at the 300ms slot time you
                # | measured in m08-l1, and it exists so an unlanded transaction dies
                # | cleanly instead of executing hours later. Hence the rule: fetch the
                # | blockhash inside the send path, right before you build the message.
                feedback: "La ventana es de 150 bloques, como 45 segundos al tiempo de slot de 300ms que mediste en m08-l1, y existe para que una transacción sin aterrizar muera limpio en vez de ejecutarse horas después. De ahí la regla: trae el blockhash adentro del camino de envío, justo antes de construir el mensaje."  # @src=e8c09b194b2f
              c:
                # | The fee payer's balance was spent by the airdrop retries during the
                # | two-minute gap
                label: "El balance del fee payer se lo gastaron los retries del airdrop durante el hueco de dos minutos"  # @src=05fa17cb2b1f
                # | Airdrops add funds rather than spend them, and a balance problem would
                # | fail differently (insufficient funds, not silent non-landing). The
                # | reproducible every-time failure after a fixed delay is the lifetime
                # | signature.
                feedback: "Los airdrops suman fondos en vez de gastarlos, y un problema de balance fallaría distinto (fondos insuficientes, no un no-aterrizaje silencioso). La falla reproducible de todas las veces después de una demora fija es la marca del tiempo de vida."  # @src=2d5e3f4bb02d
              d:
                # | Nothing: default-fee transactions just fail to land on a congested
                # | cluster
                label: "Nada: las transacciones con comisión por defecto simplemente no aterrizan en un cluster congestionado"  # @src=3e666c8c4fd7
                # | Congestion is a real way a default-fee transaction dies, and it is the
                # | wrong diagnosis here because congestion is weather: it would fail some
                # | runs and not others. A failure that reproduces after the same two-minute
                # | wait is a clock, and the lifetime step is the only clock in the pipe.
                feedback: "La congestión es una forma real en que muere una transacción con comisión por defecto, y es el diagnóstico equivocado acá porque la congestión es clima: fallaría en algunas corridas y no en otras. Una falla que se reproduce después de la misma espera de dos minutos es un reloj, y el paso de tiempo de vida es el único reloj en el pipe."  # @src=cb2f3f3494c2
              b:
                # | Messages must be signed within one slot of creation, and two minutes is
                # | hundreds of slots
                label: "Los mensajes tienen que firmarse dentro de un slot de su creación, y dos minutos son cientos de slots"  # @src=e71b41a8feb2
                # | There's no sign-within-a-slot rule, signing is local and unhurried. The
                # | clock that matters is the blockhash's validity window at SEND time,
                # | which is what expired here.
                feedback: "No existe ninguna regla de firmar-dentro-de-un-slot, firmar es local y sin apuro. El reloj que importa es la ventana de validez del blockhash en el momento del ENVÍO, que es lo que expiró acá."  # @src=a7cf98955480
      health-check-close:                      # quiz
        questions:
          m08-l4-q4:
            # | The station already had green reads on every surface. What does the
            # | confirmed tx-check signature prove that no read ever could?
            prompt: "La estación ya tenía lecturas verdes en cada superficie. ¿Qué demuestra la firma confirmada de tx-check que ninguna lectura podría demostrar nunca?"  # @src=334dc31b6fb5
            # | The frame this lesson opened with: a transaction is the probe that mutates.
            # | Every layer that reads share, connectivity, RPC health, plus every layer
            # | they don't: key validity, correct message construction, signature
            # | acceptance, network inclusion, confirmation. That's why tx-check is the
            # | station's deepest health check and why m10-l1's demo script calls it.
            explanation: "El marco con el que abrió esta lección: una transacción es la sonda que muta. Cada capa que las lecturas comparten, conectividad, salud del RPC, más cada capa que no: validez de la clave, construcción correcta del mensaje, aceptación de la firma, inclusión en la red, confirmación. Por eso tx-check es el chequeo de salud más profundo de la estación, y por eso el script de demo de m10-l1 lo llama."  # @src=ecfb1a37f004
            options:                 # source order — keep it
              b:
                # | That the full write path works: keys, message building, signing, and
                # | confirmation
                label: "Que el camino de escritura completo funciona: claves, construcción de mensajes, firma, y confirmación"  # @src=aa80138eb537
                # | Reads cover exactly two of the layers a write touches, connectivity and
                # | RPC health. Key validity, message construction, signature acceptance,
                # | inclusion and confirmation are invisible to any question you ask, and
                # | there is one way to see them: sign something real and watch it land.
                feedback: "Las lecturas cubren exactamente dos de las capas que toca una escritura, conectividad y salud del RPC. La validez de la clave, la construcción del mensaje, la aceptación de la firma, la inclusión y la confirmación son invisibles para cualquier pregunta que hagas, y hay una sola forma de verlas: firmar algo real y mirarlo aterrizar."  # @src=a98fe57a0f33
              d:
                # | That devnet's validators would accept the very same message if it were
                # | aimed at mainnet
                label: "Que los validadores de devnet aceptarían el mismísimo mensaje si estuviera apuntado a mainnet"  # @src=d8025e36f798
                # | A confirmation is scoped to the cluster that issued it. Devnet green
                # | proves your code and the network path to devnet; mainnet has its own
                # | congestion and its own fee market, which is where a default-fee
                # | transaction can simply fail to land.
                feedback: "Una confirmación está acotada al cluster que la emitió. El verde de devnet demuestra tu código y el camino de red hasta devnet; mainnet tiene su propia congestión y su propio mercado de comisiones, que es donde una transacción con comisión por defecto simplemente puede no aterrizar."  # @src=387c8b2fb79b
              a:
                # | That the RPC endpoint is reachable and answering requests from your
                # | network
                label: "Que el endpoint del RPC es alcanzable y responde requests desde tu red"  # @src=d11f16b82eb0
                # | Reads have proven reachability three lessons running, that's exactly the
                # | ceiling of what asking questions can show. The signature proves
                # | something happened to STATE.
                feedback: "Las lecturas han demostrado la alcanzabilidad tres lecciones seguidas, ese es exactamente el techo de lo que puede mostrar preguntar. La firma demuestra que algo le pasó al ESTADO."  # @src=9eff08b2cf49
              c:
                # | That your account will stay funded, since confirmation locks the balance
                # | in place
                label: "Que tu cuenta va a seguir con fondos, ya que la confirmación congela el balance en su lugar"  # @src=2fc444ded5b4
                # | Confirmation finalizes one transaction; it guarantees nothing about
                # | future balances or future writes. It's a point-in-time proof of the
                # | pathway, not a standing warranty.
                feedback: "La confirmación finaliza una transacción; no garantiza nada sobre balances futuros ni escrituras futuras. Es una demostración puntual del camino, no una garantía permanente."  # @src=9225ac7fc678
          m08-l4-q5:
            # | The lesson makes EVERY learner run solana-test-validator once, even those
            # | whose devnet airdrop worked first try. Why?
            prompt: "La lección hace que CADA aprendiz corra solana-test-validator una vez, incluso aquellos cuyo airdrop de devnet funcionó al primer intento. ¿Por qué?"  # @src=45af6803e3f4
            # | A fallback you've never exercised is a rumor, not a fallback, the same logic
            # | m09-l2 will apply to alarms. The faucet's 2-per-8h budget makes dry spells a
            # | WHEN, not an if, so the CLI install and one local-validator run are a
            # | numbered lab step for everyone. Side effect: every graduate owns a full
            # | local chain for everything they build next.
            explanation: "Un fallback que nunca ejercitaste es un rumor, no un fallback, la misma lógica que m09-l2 va a aplicar a las alarmas. El presupuesto de 2 por 8h del faucet hace que las sequías sean un CUÁNDO, no un si, así que el install de la CLI y una corrida del validador local son un paso de lab numerado para todos. Efecto secundario: cada graduado es dueño de una blockchain local completa para todo lo que construya después."  # @src=3886a411777f
            options:                 # source order — keep it
              c:
                # | So the fallback is rehearsed before it's needed, a dry faucet can never
                # | hard-block the write path
                label: "Para que el fallback quede ensayado antes de que se necesite, un faucet seco nunca puede bloquear por completo el camino de escritura"  # @src=0539b319d8c2
                # | A fallback nobody has run is a rumor. With a 2-per-8-hours budget the
                # | dry spell is a when, not an if, so the install and one local run are
                # | numbered lab steps for everyone, and the side effect is a full chain on
                # | localhost for every experiment after this one.
                feedback: "Un fallback que nadie corrió es un rumor. Con un presupuesto de 2 por 8 horas la sequía es un cuándo, no un si, así que el install y una corrida local son pasos de lab numerados para todos, y el efecto secundario es una blockchain completa en localhost para cada experimento después de este."  # @src=2df4bf10d98d
              d:
                # | Because a later Academy course might grade against a validator you run
                # | yourself
                label: "Porque un curso posterior de la Academy podría calificar contra un validador que corres tú mismo"  # @src=39a752e17c04
                # | The lesson rules that out by name: none of the Academy's on-chain
                # | courses demand this install, because they grade in hosted and in-process
                # | environments on purpose. The local validator is your own power tool, not
                # | a prerequisite anything downstream assumes.
                feedback: "La lección lo descarta por nombre: ninguno de los cursos on-chain de la Academy exige este install, porque califican en entornos hospedados y en proceso a propósito. El validador local es tu propia herramienta de poder, no un prerrequisito que nada aguas abajo asuma."  # @src=22c01129ce22
              a:
                # | Because devnet is being phased out, so local validation is the
                # | forward-compatible path
                label: "Porque la devnet se está retirando, así que la validación local es el camino compatible a futuro"  # @src=9a7eedbe6c24
                # | Devnet is alive and remains the lesson's primary target, the transfer
                # | that counts as SHIP #5 lands there when the faucet allows. The local
                # | chain is the rehearsed fallback, not the successor.
                feedback: "La devnet está viva y sigue siendo el target primario de la lección, la transferencia que cuenta como SHIP #5 aterriza ahí cuando el faucet lo deja. La blockchain local es el fallback ensayado, no el sucesor."  # @src=b7b7dde62793
              b:
                # | Because local runs are the real test, and mainnet-bound code should
                # | always be validated locally first
                label: "Porque las corridas locales son la prueba de verdad, y el código con destino a mainnet siempre debería validarse primero en local"  # @src=598f05457f16
                # | The lesson says nearly the opposite: local green proves your CODE, while
                # | the devnet run is the one that exercises the actual network path.
                # | Neither replaces the other; they answer different questions.
                feedback: "La lección dice casi lo opuesto: el verde local demuestra tu CÓDIGO, mientras que la corrida de devnet es la que ejercita el camino de red de verdad. Ninguna reemplaza a la otra; responden preguntas distintas."  # @src=28882f52b41c
          m08-l4-q6:
            # | After the transfer confirms, the sender's balance dropped by slightly MORE
            # | than the amount sent. Where did the difference go?
            prompt: "Después de que la transferencia confirma, el balance del emisor bajó un poco MÁS que el monto mandado. ¿A dónde se fue la diferencia?"  # @src=ac0c3b7c8ffc
            # | Reads were free because they mutate nothing; this is the other side of that
            # | asymmetry, the fee payer (your throwaway key) pays for the write. The
            # | unguided challenge makes this exact observation mechanical: read both
            # | balances before and after and assert the delta is amount plus fee. Fee
            # | mechanics, priority fees, and why fees move are transaction-landing depth
            # | beyond this course's scope.
            explanation: "Las lecturas eran gratis porque no mutan nada; este es el otro lado de esa asimetría, el fee payer (tu clave desechable) paga la escritura. El challenge sin guía vuelve mecánica esta observación exacta: lee los dos balances antes y después y afirma que el delta es el monto más la comisión. La mecánica de las comisiones, las comisiones de prioridad, y por qué las comisiones se mueven son profundidad de aterrizaje de transacciones más allá del alcance de este curso."  # @src=fbfc84e95d18
            options:                 # source order — keep it
              a:
                # | It's the transaction fee, writes pay to mutate state, and the fee payer
                # | shows it
                label: "Es la comisión de la transacción, las escrituras pagan por mutar el estado, y el fee payer lo muestra"  # @src=315afed1be01
                # | Reads were free because they mutate nothing, and this is the other side
                # | of that asymmetry: the account you named in step 2 of the pipe pays for
                # | the state change. The challenge makes it mechanical, read both balances
                # | around the send and assert the sender's delta is the amount plus a fee
                # | above zero.
                feedback: "Las lecturas eran gratis porque no mutan nada, y este es el otro lado de esa asimetría: la cuenta que nombraste en el paso 2 del pipe paga el cambio de estado. El challenge lo vuelve mecánico, lee los dos balances alrededor del envío y afirma que el delta del emisor es el monto más una comisión mayor que cero."  # @src=d0b307863f21
              c:
                # | It's rent charged to the sender to cover the recipient account's
                # | on-chain storage
                label: "Es el rent que se le cobra al emisor para cubrir el almacenamiento on-chain de la cuenta del destinatario"  # @src=cced757124dc
                # | Close to a real mechanism, wrong charge: account storage economics exist
                # | on Solana, but the sender's per-transaction cost here is the fee. The
                # | deeper account-model story belongs to btc-to-sol-evolution.
                feedback: "Cerca de un mecanismo real, cargo equivocado: la economía de almacenamiento de cuentas existe en Solana, pero el costo por transacción del emisor acá es la comisión. La historia más profunda del modelo de cuentas le toca a btc-to-sol-evolution."  # @src=7b5e2f69bdd0
              b:
                # | It's a rounding loss from your formatter converting lamports into SOL
                # | for the display
                label: "Es una pérdida de redondeo de tu formateador convirtiendo lamports a SOL para el display"  # @src=a9fd1c076a6a
                # | Your own m08-l2 formatter is exact BigInt math, no display rounding
                # | exists to lose anything. The delta is on-chain and real, visible in raw
                # | lamports before any formatting.
                feedback: "Tu propio formateador de m08-l2 es matemática de BigInt exacta, no existe ningún redondeo de display que pueda perder nada. El delta es on-chain y real, visible en lamports crudos antes de cualquier formateo."  # @src=d149cb09b17a
              d:
                # | A priority fee kit attached automatically so the transfer would land
                # | faster
                label: "Una comisión de prioridad que kit adjuntó automáticamente para que la transferencia aterrizara más rápido"  # @src=dbb63834df9b
                # | Nothing in the pipe bids for position: the six calls are the floor on
                # | purpose, raw signer, default fees, no retry sophistication, and priority
                # | fees are named as landing craft this course hands off. What you measured
                # | is the base fee every write pays.
                feedback: "Nada en el pipe puja por posición: las seis llamadas son el piso a propósito, signer crudo, comisiones por defecto, cero sofisticación de retry, y las comisiones de prioridad quedan nombradas como oficio de aterrizaje que este curso traspasa. Lo que mediste es la comisión base que paga toda escritura."  # @src=d9e18e1af281
  m09-l1:
    # | Supply chain: the 86-minute attack
    title: "Cadena de suministro: el ataque de 86 minutos"  # @src=2d0287ad0a95
    blocks:
      semver-vuln-matcher:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | String comparison walks characters: at '0.3.9' vs '0.3.10' it compares '9'
          # | against '1' and declares 0.3.9 the larger version. That single lie breaks
          # | every double-digit component.
          0: "La comparación de cadenas recorre caracteres: en '0.3.9' vs '0.3.10' compara '9' contra '1' y declara que 0.3.9 es la versión más grande. Esa única mentira rompe todo componente de dos dígitos."  # @src=1d96cd7bcd12
          # | Split each version on '.', map the pieces through Number, then compare major,
          # | minor, patch in order, return -1/0/1 at the first difference.
          1: "Divide cada versión por '.', pasa las piezas por Number, después compara major, minor, patch en orden, devuelve -1/0/1 en la primera diferencia."  # @src=7813e64d498e
          # | Treat a missing component as 0 (compare up to three components with `parts[i]
          # | ?? 0`) so short versions still compare cleanly.
          2: "Trata un componente faltante como 0 (compara hasta tres componentes con `parts[i] ?? 0`) para que las versiones cortas sigan comparando limpiamente."  # @src=b378e47b7589
        tests:                      # keyed by test case id
          t1:
            # | the exercise range borrows the incident's digits: the malicious 0.3.10 sits
            # | inside >=0.3.0 <0.3.11
            description: "el rango del ejercicio toma prestados los dígitos del incidente: la 0.3.10 maliciosa se sienta adentro de >=0.3.0 <0.3.11"  # @src=f8eea135d8ce
          t2:
            # | double-digit patch vs single-digit, where string comparison lies: 0.3.9 is
            # | inside >=0.3.0 <0.3.11
            description: "patch de dos dígitos vs de un dígito, donde la comparación de cadenas miente: 0.3.9 está adentro de >=0.3.0 <0.3.11"  # @src=683b32080101
          t3:
            # | 0.3.11 is OUTSIDE the range (exercise framing; the real incident yanked
            # | 0.3.10 rather than shipping a fix)
            description: "0.3.11 está AFUERA del rango (encuadre del ejercicio; el incidente real le hizo yank a 0.3.10 en vez de entregar un arreglo)"  # @src=ac3c36a8d92f
          t4:
            # | numeric beats lexicographic: 0.3.2 IS below 0.3.10 (string compare says it
            # | isn't)
            description: "lo numérico le gana a lo lexicográfico: 0.3.2 SÍ está por debajo de 0.3.10 (la comparación de cadenas dice que no)"  # @src=e1e7f3163d22
          t5:
            # | double-digit minor component: 1.10.0 satisfies >=1.9.0
