  m04-l2:
    # | Errors are values: Result, ?, and the two-crate canon
    title: "Los errores son valores: Result, ?, y el canon de dos crates"  # @src=4a80731c254e
    blocks:
      check:                      # quiz
        questions:
          m04l2-q1:
            # | Your probe parser now returns Result<LatencyMs, ProbeError>, and the caller
            # | ends the line with `?`. When the parser returns an Err, what does `?`
            # | actually do?
            prompt: "Tu parser de sondas ahora devuelve Result<LatencyMs, ProbeError>, y quien llama termina la línea con `?`. Cuando el parser devuelve un Err, ¿qué hace `?` en realidad?"  # @src=e5c266dfd5a4
            # | ? is early-return with taste: on Ok it unwraps the value in place; on Err it
            # | returns the error from the enclosing function, running it through From so a
            # | foreign error can become YOUR error type. That From hop is why ? chains
            # | compose across library boundaries.
            explanation: "? es retorno temprano con buen gusto: con Ok desenvuelve el valor en el lugar; con Err devuelve el error desde la función que lo encierra, pasándolo por From para que un error ajeno pueda volverse TU tipo de error. Ese salto de From es por qué las cadenas de ? componen cruzando fronteras de librerías."  # @src=9274cc68dbf6
            options:                 # source order — keep it
              a:
                # | It panics with the error's Display message so the failure is visible
                # | immediately at the exact line that produced it
                label: "Da panic con el mensaje Display del error para que la falla sea visible de inmediato en la línea exacta que la produjo"  # @src=bddc3a7da870
                # | That's unwrap's behavior, not ?. The whole point of ? is propagation
                # | without crashing.
                feedback: "Ese es el comportamiento de unwrap, no de ?. Todo el punto de ? es propagar sin crashear."  # @src=14a84b3c2500
              d:
                # | It returns the Err straight up to main, past every caller in between,
                # | the way a thrown exception would
                label: "Devuelve el Err derecho hasta main, pasando de largo a cada uno de los que llaman en el medio, como lo haría una excepción lanzada"  # @src=81683305341a
                # | It returns from the enclosing function and no further. Each frame that
                # | wants to keep passing the error up needs its own ?, which is why the
                # | failure stays visible in every signature it crosses.
                feedback: "Retorna desde la función que lo encierra y nada más. Cada frame que quiera seguir pasando el error hacia arriba necesita su propio ?, que es por qué la falla se queda visible en cada firma que cruza."  # @src=985ee0565077
              b:
                # | It early-returns the Err from the current function, converting it via
                # | From into the caller's error type
                label: "Retorna temprano el Err desde la función actual, convirtiéndolo vía From al tipo de error de quien llama"  # @src=52a0e057e641
                # | Early return on the error lane, happy path left flat. The From hop is
                # | what lets a foreign error like ParseIntError become your ProbeError, and
                # | it is also what the E0277 wall complains about when no conversion
                # | exists.
                feedback: "Retorno temprano en el carril de error, el camino feliz queda plano. El salto de From es lo que deja que un error ajeno como ParseIntError se vuelva tu ProbeError, y es también de lo que se queja el muro de E0277 cuando no existe ninguna conversión."  # @src=20937a3b8026
              c:
                # | It logs the error to stderr and substitutes the value type's Default so
                # | the current function can keep executing
                label: "Loguea el error a stderr y sustituye con el Default del tipo de valor para que la función actual pueda seguir ejecutándose"  # @src=4d3fbf4aac83
                # | ? never fabricates a value or logs anything, execution of the current
                # | function STOPS and the error travels up as the return value.
                feedback: "? nunca fabrica un valor ni loguea nada, la ejecución de la función actual SE DETIENE y el error viaja hacia arriba como el valor de retorno."  # @src=7189dbb5a3af
          m04l2-q2:
            # | pulse-rs is now an engine module used by a main binary. Where do thiserror
            # | and anyhow each belong, per the canon the surveyed Solana repos actually
            # | run?
            prompt: "pulse-rs ahora es un módulo engine usado por un binario main. ¿Dónde va cada uno, thiserror y anyhow, según el canon que los repos de Solana relevados corren de verdad?"  # @src=c52d5f608b05
            # | Libraries owe their callers TYPES (thiserror-derived enums you can match
            # | on); binaries owe their operators MESSAGES (anyhow with context). agave and
            # | yellowstone run thiserror 2.x today while photon and jito-relayer sit on
            # | 1.x, the split itself is a read-your-ecosystem lesson.
            explanation: "Las librerías les deben TIPOS a quienes las llaman (enums derivados con thiserror sobre los que puedes hacer match); los binarios les deben MENSAJES a sus operadores (anyhow con contexto). agave y yellowstone corren thiserror 2.x hoy mientras que photon y jito-relayer se quedan en 1.x, la división misma es una lección de lee-tu-ecosistema."  # @src=062558b4eb53
            options:                 # source order — keep it
              d:
                # | anyhow in both halves, with .context() breadcrumbs everywhere; typed
                # | error variants are for published crates only
                label: "anyhow en las dos mitades, con migas de pan de .context() en todos lados; las variantes de error tipadas son solo para crates publicados"  # @src=0c802231f391
                # | It compiles and feels convenient, which is what makes it the common
                # | mistake: anyhow erases the type information a caller needs to match on,
                # | and your own binary is a caller of your engine today.
                feedback: "Compila y se siente cómodo, que es lo que lo hace el error común: anyhow borra la información de tipos sobre la que quien llama necesita hacer match, y tu propio binario es quien llama a tu motor hoy."  # @src=209242d4b040
              b:
                # | thiserror everywhere: since the 2.x line shipped, anyhow is deprecated
                # | and its context API was absorbed into thiserror's derive
                label: "thiserror en todos lados: desde que se entregó la línea 2.x, anyhow quedó deprecado y su API de contexto fue absorbida por el derive de thiserror"  # @src=88464857c892
                # | Nothing was absorbed or deprecated, anyhow 1.x is alive, universal in
                # | the surveyed repos, and solves a different half of the problem than
                # | thiserror.
                feedback: "Nada fue absorbido ni deprecado, anyhow 1.x está vivo, es universal en los repos relevados, y resuelve una mitad distinta del problema que thiserror."  # @src=4d5517115cbe
              a:
                # | anyhow in the engine so callers get flexible, contextual errors;
                # | thiserror in the binary where exact variants map to exit codes
                label: "anyhow en el motor para que quienes llaman reciban errores flexibles y contextuales; thiserror en el binario donde las variantes exactas mapean a códigos de salida"  # @src=9a0d06b57f4a
                # | This is the canon inverted, anyhow in a library ERASES the variants your
