      supply-chain-check:                      # quiz
        questions:
          m09-l1-q1:
            # | npm audit flags a high-severity advisory that reaches your tree only as a
            # | devDependency of the dashboard build tooling. What is the right first move?
            prompt: "npm audit marca un advisory de severidad alta que llega a tu árbol solo como devDependency del tooling de build del panel. ¿Cuál es la primera jugada correcta?"  # @src=c163177d008d
            # | An audit report is a reading exercise before it is a patching exercise.
            # | Severity describes the bug; the dependency path describes YOUR exposure,
            # | runtime path, build-time path, and dev-only path are three different
            # | decisions. That reading is exactly what the written verdict captures.
            explanation: "Un reporte de auditoría es un ejercicio de lectura antes de ser un ejercicio de parcheo. La severidad describe el bug; el camino de dependencias describe TU exposición, camino de runtime, camino de build-time y camino de dev-only son tres decisiones distintas. Esa lectura es exactamente lo que captura el veredicto escrito."  # @src=73dc9002a862
            options:                 # source order — keep it
              c:
                # | Read the advisory's range, patch, and dependency path first, the path
                # | shows whether the exposure is runtime or build-time
                label: "Lee primero el rango, el parche y el camino de dependencias del advisory, el camino muestra si la exposición es de runtime o de build-time"  # @src=caf243056981
                # | Severity rates the bug as if every user ran it in the worst position;
                # | the path rates you. Id, range, patched version, path, and only then
                # | severity is the reading order, and pnpm why or cargo tree -i answers the
                # | path question in ten seconds.
                feedback: "La severidad califica el bug como si cada usuario lo corriera en la peor posición; el camino te califica a ti. Id, rango, versión parcheada, camino, y solo después la severidad es el orden de lectura, y pnpm why o cargo tree -i responden la pregunta del camino en diez segundos."  # @src=52ae213ebd40
              b:
                # | Run npm audit fix immediately, high severity means a confirmed exploit
                # | against your app, so patching outranks reading
                label: "Corre npm audit fix de inmediato, severidad alta quiere decir un exploit confirmado contra tu app, así que parchear manda sobre leer"  # @src=42ef026b9284
                # | Severity rates the vulnerability in the abstract, not your exposure, and
                # | audit fix can propose semver-major rewrites of your tree. Read the
                # | advisory and the path first; act second.
                feedback: "La severidad califica la vulnerabilidad en abstracto, no tu exposición, y audit fix puede proponer reescribir tu árbol con bumps de major de semver. Lee primero el advisory y el camino; actúa después."  # @src=14037ebcfb5a
              a:
                # | Take the Vercel deployment down, a high-severity advisory anywhere in
                # | the tree means the shipped bundle is compromised
                label: "Baja el deploy de Vercel, un advisory de severidad alta en cualquier parte del árbol quiere decir que el bundle entregado está comprometido"  # @src=b572e9b92899
                # | The dependency path is the exposure map: a build-time dev dependency
                # | does not ship in the production bundle. Build tooling can still matter
                # | (it runs on your machine and in CI), but the response is assessment, not
                # | an outage.
                feedback: "El camino de dependencias es el mapa de exposición: una dependencia de dev de build-time no se entrega en el bundle de producción. El tooling de build igual puede importar (corre en tu máquina y en CI), pero la respuesta es una evaluación, no una caída."  # @src=dac69e65ed85
              d:
                # | Mark it accept-risk without tracing the path, since a build-time
                # | advisory never reaches runtime exposure
                label: "Márcalo accept-risk sin trazar el camino, ya que un advisory de build-time nunca llega a exposición de runtime"  # @src=7242082c5460
                # | Build tooling runs on your laptop and in CI, which is exactly where the
                # | arrayref payload was aimed: a build script that executed at compile time
                # | on every machine that resolved the tree. Dev-only lowers the temperature
                # | and does not end the reading.
                feedback: "El tooling de build corre en tu laptop y en CI, que es exactamente a donde apuntaba el payload de arrayref: un script de build que se ejecutaba en tiempo de compilación en cada máquina que resolviera el árbol. Dev-only baja la temperatura y no termina la lectura."  # @src=aa55768d5b9f
          m09-l1-q2:
            # | cargo audit comes back clean on your workspace, but one crate in your
            # | lockfile has a README that says it is unmaintained and its last publish was
            # | three years ago. What did the clean report actually tell you?
            prompt: "cargo audit vuelve limpio en tu workspace, pero un crate de tu lockfile tiene un README que dice que está sin mantenimiento y su último publish fue hace tres años. ¿Qué te dijo de verdad el reporte limpio?"  # @src=aa2a4a9e68e8
            # | The tool and the checklist cover each other's blind spots: cargo audit
            # | catches what the community has filed, and the abandonment checklist (README
            # | notices, last-publish, cadence, ecosystem pins) catches the crates nobody is
            # | watching anymore. A clean audit plus a dead README is precisely the case
            # | where the written verdict earns its keep.
            explanation: "La herramienta y la checklist se cubren los puntos ciegos mutuamente: cargo audit atrapa lo que la comunidad presentó, y la checklist de abandono (avisos en el README, último publish, cadencia, pins del ecosistema) atrapa los crates que ya nadie está vigilando. Una auditoría limpia más un README muerto es precisamente el caso donde el veredicto escrito se gana su lugar."  # @src=1c561ee1b479
            options:                 # source order — keep it
              d:
                # | That three quiet years are evidence of stability, since a crate with
                # | real problems would have collected an advisory long before now
                label: "Que tres años callados son evidencia de estabilidad, ya que un crate con problemas reales ya habría juntado un advisory hace mucho"  # @src=478f09c85b3f
                # | That inference needs someone to have been looking. Advisories get filed
                # | by people reading the code and running the tools against it, so a crate
                # | with no users and no maintainer produces the same clean report whether
                # | it is solid or quietly broken.
                feedback: "Esa inferencia necesita que alguien haya estado mirando. Los advisories los presenta gente que lee el código y corre las herramientas contra él, así que un crate sin usuarios y sin mantenedor produce el mismo reporte limpio ya sea que esté sólido o roto en silencio."  # @src=cafd4f6a780d
              a:
                # | Only that no KNOWN advisory matches your lockfile, an unwatched crate
                # | can be silently vulnerable, so the checklist still applies
                label: "Solo que ningún advisory CONOCIDO coincide con tu lockfile, un crate sin vigilancia puede ser vulnerable en silencio, así que la checklist sigue aplicando"  # @src=207e7a0dc758
                # | The database holds what someone found, verified and filed, so a crate
                # | nobody is watching accumulates silence rather than safety. That is
                # | precisely the gap the five abandonment reads cover, and why a clean
                # | report plus a dead README is the case where a written verdict earns its
                # | keep.
                feedback: "La base de datos guarda lo que alguien encontró, verificó y presentó, así que un crate que nadie está vigilando acumula silencio en vez de seguridad. Ese es precisamente el hueco que cubren las cinco lecturas de abandono, y por qué un reporte limpio más un README muerto es el caso donde un veredicto escrito se gana su lugar."  # @src=156d6ab61cff
              b:
                # | That the crate is safe, the advisory database is comprehensive, so no
                # | advisory means no vulnerability exists in any locked version
                label: "Que el crate es seguro, la base de datos de advisories es exhaustiva, así que ningún advisory quiere decir que no existe ninguna vulnerabilidad en ninguna versión del lockfile"  # @src=e935726a2f4b
                # | Advisory databases contain what someone found AND filed. An abandoned
                # | crate with no users looking at it accumulates silence, not safety,
                # | absence of an advisory is absence of evidence.
                feedback: "Las bases de datos de advisories contienen lo que alguien encontró Y presentó. Un crate abandonado sin usuarios que lo miren acumula silencio, no seguridad, la ausencia de un advisory es ausencia de evidencia."  # @src=73eec199b65e
              c:
                # | Nothing about that crate, cargo audit typically skips unmaintained
                # | crates because they are dropped from the advisory index
                label: "Nada sobre ese crate, cargo audit suele saltear los crates sin mantenimiento porque se los saca del índice de advisories"  # @src=39cf3f4f716e
                # | cargo audit checks every crate in Cargo.lock against the advisory
                # | database; nothing is skipped for being unmaintained. The gap is in what
                # | the database knows, not in what the tool scans.
                feedback: "cargo audit revisa cada crate de Cargo.lock contra la base de datos de advisories; nada se saltea por estar sin mantenimiento. El hueco está en lo que la base de datos sabe, no en lo que la herramienta escanea."  # @src=68338b43707b
          m09-l1-q3:
            # | An npm-locked service you have inherited (not your pnpm-workspace station)
            # | says "^1.4.0" for a dependency in its package.json, package-lock.json
            # | resolved it to 1.4.2, and a malicious 1.4.3 was published this morning. Its
            # | CI installs with npm ci. Is tonight's build compromised?
            prompt: "Un servicio con lockfile de npm que heredaste (no la estación con workspace de pnpm) dice \"^1.4.0\" para una dependencia en su package.json, package-lock.json lo resolvió a 1.4.2, y una 1.4.3 maliciosa se publicó esta mañana. Su CI instala con npm ci. ¿Está comprometido el build de esta noche?"  # @src=1a7168fac4b2
            # | This is lockfile-as-the-real-pin: the manifest range expresses intent, the
            # | lockfile records a resolution, and `npm ci` (like `cargo build --locked`)
            # | enforces the recorded resolution byte for byte. The dangerous moment is not
            # | the malicious publish, it is the next time someone regenerates the lock
            # | while the malicious version is live.
            explanation: "Esto es el lockfile-como-el-pin-de-verdad: el rango del manifest expresa intención, el lockfile registra una resolución, y `npm ci` (como `cargo build --locked`) hace cumplir la resolución registrada byte por byte. El momento peligroso no es el publish malicioso, es la próxima vez que alguien regenere el lock mientras la versión maliciosa está en vivo."  # @src=25412d03c68a
            options:                 # source order — keep it
              a:
                # | Yes, the caret range means every install resolves forward, so CI pulls
                # | 1.4.3 the moment it exists
                label: "Sí, el rango con caret quiere decir que toda instalación resuelve hacia adelante, así que CI baja 1.4.3 en el momento en que existe"  # @src=2906e2708999
                # | That is how a bare `npm install` with no lockfile behaves. `npm ci`
                # | installs exactly what the lockfile recorded, 1.4.2, regardless of what
                # | the range would now resolve to.
                feedback: "Así se comporta un `npm install` pelado sin lockfile. `npm ci` instala exactamente lo que registró el lockfile, 1.4.2, sin importar a qué resolvería el rango ahora."  # @src=66c51bc680e3
              b:
                # | No, npm ci installs the lockfile's exact 1.4.2; you become exposed only
                # | when the lockfile is regenerated or updated
                label: "No, npm ci instala la 1.4.2 exacta del lockfile; quedas expuesto solo cuando el lockfile se regenera o se actualiza"  # @src=c386092ece5a
                # | The manifest range states intent, the lockfile records a resolution, and
                # | npm ci reproduces the recorded one byte for byte. So the dangerous
                # | moment is not the publish, it is the next refresh-the-deps commit made
                # | while 1.4.3 is still live.
                feedback: "El rango del manifest declara intención, el lockfile registra una resolución, y npm ci reproduce la registrada byte por byte. Así que el momento peligroso no es el publish, es el próximo commit de refrescar-las-deps hecho mientras 1.4.3 sigue en vivo."  # @src=65e4507533d9
              d:
                # | No, the caret in ^1.4.0 pins the patch digit, so 1.4.3 sits outside the
                # | range npm would ever resolve here
                label: "No, el caret en ^1.4.0 fija el dígito de patch, así que 1.4.3 se sienta afuera del rango que npm alguna vez resolvería acá"  # @src=4c202c15c0e0
                # | Right verdict tonight, wrong mechanism, and the mechanism is what you
                # | need tomorrow: a caret accepts every compatible release below the next
                # | major, 1.4.3 included. If it excluded 1.4.3, regenerating the lockfile
                # | would be safe, and the whole point of the worked example is that it is
                # | not.
                feedback: "Veredicto correcto esta noche, mecanismo equivocado, y el mecanismo es lo que necesitas mañana: un caret acepta todo release compatible por debajo de la próxima major, 1.4.3 incluida. Si excluyera 1.4.3, regenerar el lockfile sería seguro, y todo el punto del ejemplo trabajado es que no lo es."  # @src=5da91313e97a
              c:
                # | Yes, unless you first rewrite the manifest to the exact pin "1.4.2",
                # | ranges in package.json override the lockfile during CI installs
                label: "Sí, a menos que primero reescribas el manifest al pin exacto \"1.4.2\", los rangos de package.json pisan el lockfile durante las instalaciones de CI"  # @src=1ce81b5242fe
                # | It is the other way around under npm ci: the lockfile IS the install
                # | plan, and the manifest range only matters when the lock is re-resolved.
                # | The lockfile is the real pin, as long as CI installs from it.
                feedback: "Es al revés bajo npm ci: el lockfile ES el plan de instalación, y el rango del manifest solo importa cuando el lock se vuelve a resolver. El lockfile es el pin de verdad, siempre y cuando CI instale desde él."  # @src=d2943202ca15
          m09-l1-q4:
            # | During the 86 minutes arrayref@0.3.10 was live, which builds could actually
            # | have pulled the malicious version?
            prompt: "Durante los 86 minutos en que arrayref@0.3.10 estuvo en vivo, ¿qué builds podrían de verdad haber bajado la versión maliciosa?"  # @src=d4cad2dc8034
            # | The 86-minute window is the range mechanism working exactly as designed: SPL
            # | Token's `arrayref = "0.3.9"` is a compatible-range requirement, so any
            # | resolution performed while 0.3.10 was live would take it, while every
            # | committed Cargo.lock held the line at its recorded version. Ranges auto-heal
            # | AND auto-ingest; the lockfile decides which one you experience.
            explanation: "La ventana de 86 minutos es el mecanismo de rangos funcionando exactamente como se diseñó: el `arrayref = \"0.3.9\"` de SPL Token es un requerimiento de rango compatible, así que cualquier resolución hecha mientras 0.3.10 estaba en vivo la habría tomado, mientras todo Cargo.lock commiteado mantenía la línea en la versión que tenía registrada. Los rangos se auto-curan Y auto-ingieren; el lockfile decide cuál de las dos te toca."  # @src=9e644eae98e2
            options:                 # source order — keep it
              b:
                # | Only projects whose Cargo.toml explicitly requested "0.3.10", since
                # | everyone else's version requirement excluded the new release
                label: "Solo los proyectos cuyo Cargo.toml pidió explícitamente \"0.3.10\", ya que el requerimiento de versión de todos los demás excluía el nuevo release"  # @src=1c17263c8592
                # | Cargo's bare "0.3.9" is caret semantics: it means ^0.3.9 and happily
                # | accepts 0.3.10. Nobody had to ask for the malicious version by name,
                # | default ranges resolve forward to it.
                feedback: "El \"0.3.9\" pelado de Cargo es semántica de caret: quiere decir ^0.3.9 y acepta 0.3.10 con gusto. Nadie tuvo que pedir la versión maliciosa por nombre, los rangos por defecto resuelven hacia adelante hasta ella."  # @src=451c6c2b5712
              d:
                # | Just the CI jobs, since a developer's local registry cache would have
                # | kept serving the copy of arrayref it already had locally
                label: "Solo los jobs de CI, ya que el cache local del registro de un desarrollador habría seguido sirviendo la copia de arrayref que ya tenía localmente"  # @src=9cf063e48198
                # | The cache answers for versions you already fetched, and a fresh
                # | resolution asks for a version you have not. The lesson lists the exposed
                # | acts on both sides of the wire, a new clone and a cargo update among
                # | them, which is a laptop as often as a runner.
                feedback: "El cache responde por versiones que ya bajaste, y una resolución fresca pide una que no. La lección lista los actos expuestos a los dos lados del cable, un clon nuevo y un cargo update entre ellos, que es una laptop tan seguido como un runner."  # @src=ec9ec02c2db9
              c:
                # | Any fresh resolution during the window whose range accepted 0.3.x,
                # | Cargo's bare "0.3.9" means ^0.3.9, which accepts 0.3.10
                label: "Cualquier resolución fresca durante la ventana cuyo rango aceptara 0.3.x, el \"0.3.9\" pelado de Cargo quiere decir ^0.3.9, que acepta 0.3.10"  # @src=e80099079532
                # | A new clone, a CI job with no committed lockfile, a cargo update: three
                # | ways to ask the registry a fresh question inside those 86 minutes.
                # | Nobody had to name the malicious version, the range said yes on their
                # | behalf, which is the deal semver ranges have always offered.
                feedback: "Un clon nuevo, un job de CI sin lockfile commiteado, un cargo update: tres formas de hacerle al registro una pregunta fresca dentro de esos 86 minutos. Nadie tuvo que nombrar la versión maliciosa, el rango dijo sí en su nombre, que es el trato que los rangos de semver siempre ofrecieron."  # @src=b505207f2d73
              a:
                # | Every project depending on arrayref at any version, a malicious publish
                # | retroactively infects existing lockfiles and cached builds
                label: "Todo proyecto que dependa de arrayref en cualquier versión, un publish malicioso infecta retroactivamente los lockfiles existentes y los builds cacheados"  # @src=3f6389546285
                # | A publish cannot rewrite history: committed lockfiles kept resolving
                # | 0.3.9 and earlier, and existing builds were untouched. The exposure was
                # | in fresh resolutions during the window, not in what was already locked.
                feedback: "Un publish no puede reescribir la historia: los lockfiles commiteados siguieron resolviendo 0.3.9 y anteriores, y los builds existentes quedaron intactos. La exposición estaba en las resoluciones frescas durante la ventana, no en lo que ya estaba en el lockfile."  # @src=43298f1748b4
  m09-l2:
    # | Observe the observer: logs, errors, alarms
    title: "Observa al observador: logs, errores, alarmas"  # @src=8b7b80425470
    blocks:
      logs-that-answer:                      # quiz
        questions:
          m09-l2-q1:
            # | At 3 a.m. you need to answer: 'when did the api target last flip from up to
            # | degraded?' Which logging style answers that with a single grep?
            prompt: "A las 3 a.m. necesitas responder: '¿cuándo fue la última vez que el target api giró de up a degraded?' ¿Qué estilo de logging responde eso con un solo grep?"  # @src=7ba9b8880f0a
            # | Structured logging means the QUESTION shapes the schema: a state change is
            # | an event with a target, a from, a to, and a timestamp, so `grep
            # | '"event":"state_change"'` plus the target name IS the incident query. Printf
            # | noise optimizes for reading; boundary events optimize for asking.
            explanation: "El logging estructurado quiere decir que la PREGUNTA le da forma al schema: un cambio de estado es un evento con un target, un from, un to y un timestamp, así que `grep '\"event\":\"state_change\"'` más el nombre del target ES la consulta de incidente. El ruido de printf optimiza para leer; los eventos de frontera optimizan para preguntar."  # @src=b08d45e57934
            options:                 # source order — keep it
              c:
                # | A line for every loop iteration with full state dumps, so any question
                # | is answerable because nothing was left out
                label: "Una línea por cada iteración del loop con dumps de estado completos, así cualquier pregunta es respondible porque no se dejó nada afuera"  # @src=789972a3fad8
                # | Volume is not answerability, per-iteration dumps bury the one flip you
                # | need under thousands of identical lines, and on the worker side they
                # | torch the daily event budget. Log events, not iterations.
                feedback: "El volumen no es capacidad de responder, los dumps por iteración entierran el único giro que necesitas bajo miles de líneas idénticas, y del lado del worker queman el presupuesto diario de eventos. Loguea eventos, no iteraciones."  # @src=ec4c2ece4bfc
              b:
                # | A human-readable message like 'probe had a problem, retrying soon'
                # | printed wherever an error is caught, so the story reads naturally top to
                # | bottom
                label: "Un mensaje legible por humanos como 'probe had a problem, retrying soon' impreso donde sea que se capture un error, así la historia se lee natural de arriba a abajo"  # @src=e4a23959b358
                # | Readable prose is for humans reading in order; incidents are answered by
                # | machines filtering at 3 a.m. Without named fields there is nothing for
                # | grep to anchor on, 'a problem' matches everything and answers nothing.
                feedback: "La prosa legible es para humanos leyendo en orden; los incidentes los responden máquinas filtrando a las 3 a.m. Sin campos nombrados no hay nada en qué anclar el grep, 'un problema' coincide con todo y no responde nada."  # @src=ad9ba3b4d2f9
              a:
                # | One JSON line per state change with named fields, event, target, from,
                # | to, and a timestamp, emitted at the boundary where the flip happens
                label: "Una línea JSON por cambio de estado con campos nombrados, event, target, from, to y un timestamp, emitida en la frontera donde ocurre el giro"  # @src=3a7f3fbce86e
                # | The question shapes the schema: because from and to are named fields,
                # | grep '"event":"state_change"' piped through the target name IS the
                # | incident query, and the ts on the hit is the answer. No dashboard, no
                # | ssh, thirty seconds.
                feedback: "La pregunta le da forma al schema: como from y to son campos nombrados, grep '\"event\":\"state_change\"' pasado por el nombre del target ES la consulta de incidente, y el ts del hit es la respuesta. Sin panel, sin ssh, treinta segundos."  # @src=205b83a26bda
              d:
                # | One JSON line per /status request listing each target's current state,
                # | so a flip to degraded shows on the next read
                label: "Una línea JSON por cada request a /status listando el estado actual de cada target, así un giro a degraded aparece en la siguiente lectura"  # @src=92eca8d65254
                # | That logs the reader, not the event. Nobody calls /status at 3 a.m., so
                # | the flip that happened at 3:04 is recorded whenever someone next looks,
                # | with the wrong timestamp and no from value. A boundary event fires where
                # | the change happens, unattended.
                feedback: "Eso loguea al lector, no al evento. Nadie llama a /status a las 3 a.m., así que el giro que pasó a las 3:04 queda registrado cuando alguien mire la próxima vez, con el timestamp equivocado y sin valor de from. Un evento de frontera se dispara donde ocurre el cambio, sin que nadie esté mirando."  # @src=32d5ceb048f5
          m09-l2-q2:
            # | Users report the dashboard's functions erroring on Saturday morning. You
            # | open Vercel's runtime logs on Monday. What do you find, and what is the
            # | taught response?
            prompt: "Los usuarios reportan que las funciones del panel fallan el sábado por la mañana. Abres los logs de runtime de Vercel el lunes. ¿Qué encuentras, y cuál es la respuesta que se enseña?"  # @src=0e1962393243
            # | Ephemerality is taught as a constraint: free-tier platform logs are for
            # | tailing an incident as it happens, not for archaeology. Anything the station
            # | must remember, statuses, flips, history, already persists in status.json and
            # | KV by design. Persist the signal, tail the noise.
            explanation: "La efimeridad se enseña como una restricción: los logs de plataforma del tier gratis son para tailear un incidente mientras pasa, no para hacer arqueología. Todo lo que la estación tiene que recordar, estados, giros, historial, ya persiste en status.json y KV por diseño. Persiste la señal, tailea el ruido."  # @src=28260b5ed781
            options:                 # source order — keep it
              a:
                # | The whole weekend of logs, runtime logs are typically kept for the
                # | lifetime of the deployment, so Saturday's errors are all still there
                label: "El fin de semana entero de logs, los logs de runtime normalmente se guardan durante toda la vida del deploy, así que los errores del sábado siguen todos ahí"  # @src=8e3c080b5422
                # | Hobby runtime logs retain roughly an hour, not a deployment lifetime. By
                # | Monday, Saturday's evidence is long gone, which is a design constraint
                # | to build around, not a bug to be surprised by.
                feedback: "Los logs de runtime de Hobby retienen alrededor de una hora, no la vida de un deploy. Para el lunes, la evidencia del sábado hace rato que ya no está, que es una restricción de diseño alrededor de la cual construir, no un bug que te agarre por sorpresa."  # @src=53bfad4ea2a1
              b:
                # | Roughly nothing, Hobby runtime logs retain about an hour; persist the
                # | signal and treat platform logs as live-tail forensics
                label: "Casi nada, los logs de runtime de Hobby retienen alrededor de una hora; persiste la señal y trata los logs de plataforma como análisis forense de tail en vivo"  # @src=253a7d06bf6d
                # | Free-tier platform logs are for tailing an incident while it happens,
                # | not for archaeology two days later. Anything the station must remember
                # | was already persisted on purpose, statuses and flips in status.json and
                # | KV, which is where Monday's questions get answered.
                feedback: "Los logs de plataforma del tier gratis son para tailear un incidente mientras pasa, no para hacer arqueología dos días después. Todo lo que la estación tiene que recordar ya se persistió a propósito, estados y giros en status.json y KV, que es donde se responden las preguntas del lunes."  # @src=38359f59e44f
              c:
                # | Only the failed invocations, error logs are retained indefinitely while
                # | successful request logs rotate out after an hour
                label: "Solo las invocaciones que fallaron, los logs de error se retienen indefinidamente mientras que los logs de requests exitosos rotan y salen después de una hora"  # @src=f71e806d3c02
                # | There is no error-only retention carve-out on the free tier, the roughly
                # | hour-long window applies to runtime logs as a class. If the errors
                # | matter beyond the hour, something must persist them.
                feedback: "No hay ninguna excepción de retención solo-para-errores en el tier gratis, la ventana de alrededor de una hora aplica a los logs de runtime como clase. Si los errores importan más allá de la hora, algo tiene que persistirlos."  # @src=cbf18f8ec3fb
              d:
                # | The build logs, which persist per deployment, so Saturday's function
                # | errors are in there if you scroll far enough
                label: "Los logs de build, que persisten por deploy, así que los errores de función del sábado están ahí adentro si scrolleas lo suficiente"  # @src=214d9d165afe
                # | Build logs and runtime logs are different surfaces holding different
                # | moments. A build log records how the deployment was produced; a function
                # | that threw while serving a user on Saturday wrote to the runtime stream,
                # | which is the one measured in hours.
                feedback: "Los logs de build y los logs de runtime son superficies distintas que guardan momentos distintos. Un log de build registra cómo se produjo el deploy; una función que lanzó un error mientras le servía a un usuario el sábado escribió al stream de runtime, que es el que se mide en horas."  # @src=32f1237c81a2
          m09-l2-q3:
            # | Your edge worker's cron emits a dozen JSON events per run, plus one more
            # | event per target on each inner pass. Traffic is nowhere near the request
            # | cap, yet log events start getting dropped mid-day. What limit did you hit?
            prompt: "El cron de tu edge worker emite una docena de eventos JSON por ejecución, más un evento extra por target en cada pasada interna. El tráfico está lejísimos del techo de requests, y aun así los eventos de log empiezan a descartarse a mitad del día. ¿Con qué límite chocaste?"  # @src=c82c1f27023b
            # | 200,000 events/day sounds enormous until a loop logs per target per pass: a
            # | 5-minute cron over a dozen targets with chatty inner loops crosses it
            # | easily. The budget is the platform enforcing the lesson's own rule, boundary
            # | events (result, flip, error) carry all the forensic value at a fraction of
            # | the volume.
            explanation: "200,000 eventos/día suena enorme hasta que un loop loguea por target por pasada: un cron de 5 minutos sobre una docena de targets con loops internos habladores lo cruza fácil. El presupuesto es la plataforma haciendo cumplir la propia regla de la lección, los eventos de frontera (resultado, giro, error) cargan todo el valor forense a una fracción del volumen."  # @src=4d728756026a
            options:                 # source order — keep it
              a:
                # | None, Workers Logs is part of the paid observability product, so
                # | free-tier workers do not have their logs collected at all
                label: "Ninguno, Workers Logs es parte del producto pago de observabilidad, así que a los workers del tier gratis no les recolectan los logs en absoluto"  # @src=70f8a0fd0d19
                # | Workers Logs exists on the free plan, with a daily event allowance. Your
                # | logs were being collected fine; they were being collected 200,000 times.
                feedback: "Workers Logs existe en el plan gratis, con una asignación diaria de eventos. Tus logs se estaban recolectando bien; se estaban recolectando 200,000 veces."  # @src=df52cb2b153c
              b:
                # | The request cap indirectly, log lines count as requests, so verbose
                # | logging consumes the same 100,000/day allowance
                label: "El techo de requests indirectamente, las líneas de log cuentan como requests, así que el logging verboso consume la misma asignación de 100,000/día"  # @src=d8e912a3f101
                # | Requests and log events are separate meters. The request allowance was
                # | fine, it is the per-day log-event budget that per-loop debug lines
                # | exhaust.
                feedback: "Los requests y los eventos de log son medidores distintos. La asignación de requests estaba bien, es el presupuesto diario de eventos de log el que agotan las líneas de debug por loop."  # @src=eb85fac02d47
              c:
                # | The Workers Logs free allowance of 200,000 events/day, per-loop debug
                # | lines spend the day's budget on noise
                label: "La asignación gratuita de Workers Logs de 200,000 eventos/día, las líneas de debug por loop gastan el presupuesto del día en ruido"  # @src=d3c3c965fc83
                # | Run the loop arithmetic: 288 runs a day at 12 targets and 60 inner
                # | passes is 207,360 lines, over budget on noise alone. Emit at boundaries
                # | instead and the same day costs a few hundred events, which is the
                # | platform enforcing the rule this lesson already argued for.
                feedback: "Haz la matemática de los loops: 288 ejecuciones al día con 12 targets y 60 pasadas internas son 207,360 líneas, pasado de presupuesto solo en ruido. Emite en las fronteras en cambio y el mismo día cuesta unos cientos de eventos, que es la plataforma haciendo cumplir la regla que esta lección ya argumentó."  # @src=4030ffb145c5
              d:
                # | The KV free write limit of 1,000 writes a day, since each logged event
                # | is persisted to KV before it is collected
                label: "El límite gratis de escrituras de KV de 1,000 escrituras al día, ya que cada evento logueado se persiste a KV antes de que lo recolecten"  # @src=27e36350fd2c
                # | Logging and KV are unrelated paths here. Your events go to stdout and
                # | Workers Logs collects them; KV is where the station deliberately
                # | persists what it must remember, which is a much smaller set of writes
                # | than a log stream.
                feedback: "El logging y KV son caminos sin relación acá. Tus eventos van a stdout y Workers Logs los recolecta; KV es donde la estación persiste a propósito lo que tiene que recordar, que es un conjunto de escrituras mucho más chico que un stream de logs."  # @src=eefe396081a8
      alarm-of-last-resort:                      # quiz
        questions:
          m09-l2-q4:
            # | Your station's cron workflow fails at 3 a.m., on a repo where you have
            # | changed no settings at all. What does GitHub do?
            prompt: "El workflow de cron de tu estación falla a las 3 a.m., en un repo donde no cambiaste ninguna configuración en absoluto. ¿Qué hace GitHub?"  # @src=1bd86aae2b30
            # | The lesson's sharpest ops beat: an unconfigured alarm is not an alarm. The
            # | channel lives at Notification settings → System → Actions, with On
            # | GitHub/Email delivery and an 'Only notify for failed workflows' checkbox,
            # | turning it on is a required lab step, and the drill then proves it fires by
            # | breaking a run on purpose.
            explanation: "El momento de ops más filoso de la lección: una alarma sin configurar no es una alarma. El canal vive en Notification settings → System → Actions, con entrega On GitHub/Email y una casilla 'Only notify for failed workflows', prenderlo es un paso requerido del lab, y el ejercicio después prueba que se dispara rompiendo una ejecución a propósito."  # @src=f6183a5f19fa
            options:                 # source order — keep it
              a:
                # | Probably nothing you will see, the Actions notification channel defaults
                # | to 'Don't notify' until you enable it in settings
                label: "Probablemente nada que vayas a ver, el canal de notificaciones de Actions viene por defecto en 'Don't notify' hasta que lo actives en settings"  # @src=fc4033b88709
                # | There is a red X in a tab nobody is looking at, and that is the whole
                # | alert. Notification settings, System, Actions, pick a delivery channel
                # | and check 'Only notify for failed workflows'; an unconfigured alarm is a
                # | decoration with an opinion.
                feedback: "Hay una X roja en una pestaña que nadie está mirando, y esa es toda la alerta. Notification settings, System, Actions, elige un canal de entrega y marca 'Only notify for failed workflows'; una alarma sin configurar es una decoración con opinión."  # @src=224d2aa9aefb
              b:
                # | It emails the repository owner on every failed run, failure email is the
                # | out-of-the-box behavior for any workflow in your own repo
                label: "Le manda un email al dueño del repositorio en cada ejecución fallida, el email de falla es el comportamiento de fábrica para cualquier workflow en tu propio repo"  # @src=d3dc3a91db80
                # | There is a distinct Actions notification channel in your settings, and
                # | its default delivery is 'Don't notify'. Until you turn it on, a red run
                # | is just a red X waiting for you to happen to look.
                feedback: "Hay un canal de notificaciones de Actions aparte en tus settings, y su entrega por defecto es 'Don't notify'. Hasta que lo prendas, una ejecución roja es apenas una X roja esperando a que se te ocurra mirar."  # @src=dd10276cd3ab
              c:
                # | It retries the run automatically and notifies you only after three
                # | consecutive failures, to avoid alerting on transient errors
                label: "Reintenta la ejecución automáticamente y te notifica solo después de tres fallas consecutivas, para evitar alertar por errores transitorios"  # @src=391acb3aaec0
                # | Actions has no automatic retry-then-escalate policy for scheduled runs,
                # | one failure is one failed run, and whether anyone hears about it depends
                # | entirely on the notification channel you configured (or didn't).
                feedback: "Actions no tiene ninguna política automática de reintentar-y-después-escalar para ejecuciones programadas, una falla es una ejecución fallida, y si alguien se entera o no depende enteramente del canal de notificaciones que configuraste (o no)."  # @src=ce773fdd14d7
              d:
                # | It disables the schedule after that failed run, so a broken cron stops
                # | firing until someone re-enables it
                label: "Desactiva el calendario después de esa ejecución fallida, así un cron roto deja de dispararse hasta que alguien lo reactive"  # @src=440b462b5ab2
                # | You are thinking of the 60-day rule, and it keys on repository
                # | inactivity rather than on failures: a workflow that fails every night
                # | keeps being scheduled every night. Nothing about failing turns the cron
                # | off, which is why a broken run can repeat unheard.
                feedback: "Estás pensando en la regla de los 60 días, y esa se apoya en la inactividad del repositorio y no en las fallas: un workflow que falla todas las noches se sigue programando todas las noches. Nada del hecho de fallar apaga el cron, que es por lo que una ejecución rota puede repetirse sin que nadie la escuche."  # @src=600513cbbb29
          m09-l2-q5:
            # | One morning you notice the cron produced no runs overnight, and no failure
            # | notification either. Which explanation is consistent with GitHub's
            # | documented behavior?
            prompt: "Una mañana notas que el cron no produjo ninguna ejecución durante la noche, y tampoco ninguna notificación de falla. ¿Qué explicación es consistente con el comportamiento documentado de GitHub?"  # @src=be38641eca38
            # | This is the alarm of last resort's named hole: failure notifications require
            # | a run that runs and fails. A dropped job and a 60-day auto-disable both
            # | produce pure silence, which is why the station also persists heartbeat
            # | timestamps in status.json, where an ABSENCE is visible to anything that
            # | looks.
            explanation: "Este es el agujero nombrado de la alarma de último recurso: las notificaciones de falla requieren una ejecución que corra y falle. Un job descartado y una auto-desactivación a los 60 días producen los dos puro silencio, que es por lo que la estación también persiste timestamps de latido en status.json, donde una AUSENCIA es visible para cualquier cosa que mire."  # @src=8da924399d87
            options:                 # source order — keep it
              a:
                # | Neither can happen, scheduled runs are guaranteed to execute once queued
                # | even under load, so a missing run means someone deleted or renamed the
                # | workflow file
                label: "Ninguna de las dos puede pasar, las ejecuciones programadas tienen garantizado ejecutarse una vez en fila incluso bajo carga, así que una ejecución faltante quiere decir que alguien borró o renombró el archivo del workflow"  # @src=597b8e434be8
                # | GitHub's own docs say the opposite: scheduled events are best-effort,
                # | can be delayed, and under sufficient load queued jobs may be dropped.
                # | Silence is a documented outcome, not proof of sabotage.
                feedback: "Los propios docs de GitHub dicen lo contrario: los eventos programados son best-effort, pueden retrasarse, y bajo carga suficiente los jobs en fila pueden descartarse. El silencio es un resultado documentado, no una prueba de sabotaje."  # @src=4f8711685ae3
              d:
                # | Your notification filter hid them, since a queued job that gets dropped
                # | under heavy load is recorded in the Actions tab as a skipped run rather
                # | than a failed one
                label: "Tu filtro de notificaciones las escondió, ya que un job en fila que se descarta bajo carga pesada queda registrado en la pestaña Actions como una ejecución saltada y no como una fallida"  # @src=e3073fa7e12c
                # | A dropped job leaves no run at all, so there is no skipped entry for a
                # | filter to hide and nothing in the Actions tab to find in the morning.
                # | The filter you set decides which failures reach you; it cannot decide
                # | anything about a run that never started.
                feedback: "Un job descartado no deja ninguna ejecución en absoluto, así que no hay ninguna entrada saltada para que un filtro la esconda ni nada en la pestaña Actions que encontrar por la mañana. El filtro que pusiste decide qué fallas te llegan; no puede decidir nada sobre una ejecución que nunca arrancó."  # @src=3bf0f8209898
              c:
                # | The runs happened and failed on schedule, but notifications for
                # | scheduled workflows route to the organization's administrators rather
                # | than to the author
                label: "Las ejecuciones pasaron y fallaron según el calendario, pero las notificaciones de workflows programados se rutean a los administradores de la organización y no al autor"  # @src=a65f47f7eb83
                # | Scheduled-workflow notifications go to the workflow's CREATOR, not to
                # | org admins, and this doesn't explain the missing runs. The real gap is
                # | that a run which never happens has no failure to notify about.
                feedback: "Las notificaciones de workflows programados van al CREADOR del workflow, no a los admins de la org, y esto no explica las ejecuciones faltantes. El hueco real es que una ejecución que nunca pasa no tiene ninguna falla sobre la cual notificar."  # @src=007c61b5307b
              b:
                # | Best-effort scheduling can drop queued jobs under load, and 60 days of
                # | repo inactivity auto-disables the schedule, neither produces a failed
                # | run
                label: "El calendario best-effort puede descartar jobs en fila bajo carga, y 60 días de inactividad del repo auto-desactivan el calendario, ninguno de los dos produce una ejecución fallida"  # @src=5f78dfa1122a
                # | GitHub says it in writing: scheduled events can be delayed, and under
                # | sufficient load some queued jobs may be dropped. Both silent deaths
                # | leave the same trace, which is none, and that is why the station also
                # | commits heartbeat timestamps where an absence is visible to anything
                # | that looks.
                feedback: "GitHub lo dice por escrito: los eventos programados pueden retrasarse, y bajo carga suficiente algunos jobs en fila pueden descartarse. Las dos muertes silenciosas dejan el mismo rastro, que es ninguno, y por eso la estación también hace commit de timestamps de latido donde una ausencia es visible para cualquier cosa que mire."  # @src=b97b0646897c
          m09-l2-q6:
            # | The four-platform sweep: where does each credential live so it never lands
            # | in git? Pick the mapping that matches the taught table.
            prompt: "El barrido de cuatro plataformas: ¿dónde vive cada credencial para que nunca aterrice en git? Elige el mapeo que coincide con la tabla enseñada."  # @src=6953ad1b0380
            # | The four-platform table in one breath: every platform separates committed
            # | configuration from injected secrets, repo secrets for Actions, dashboard env
            # | vars (pulled with `vercel env pull`) for Vercel, `wrangler secret put` plus
            # | `.dev.vars` for Cloudflare, and `--env-file`/`env_file` for Docker so images
            # | stay secret-free. The companion rule from the logging beat: never log the
            # | environment, or the sweep's work ends up in a retained log line.
            explanation: "La tabla de cuatro plataformas de un tirón: cada plataforma separa la configuración commiteada de los secretos inyectados, secretos de repo para Actions, env vars del panel (traídas con `vercel env pull`) para Vercel, `wrangler secret put` más `.dev.vars` para Cloudflare, y `--env-file`/`env_file` para Docker así las imágenes se quedan sin secretos. La regla compañera del momento del logging: nunca loguees el entorno, o el trabajo del barrido termina en una línea de log retenida."  # @src=ec8cb448c372
            options:                 # source order — keep it
              c:
                # | Actions repository secrets; Vercel env vars synced via vercel env pull;
                # | Cloudflare wrangler secret put with gitignored .dev.vars; Docker
                # | --env-file, never in images
                label: "Secretos de repositorio de Actions; env vars de Vercel sincronizadas vía vercel env pull; Cloudflare wrangler secret put con .dev.vars en el gitignore; Docker --env-file, nunca en las imágenes"  # @src=be7f7dc540ef
                # | One rule wearing four costumes: committed configuration stays public,
                # | injected values stay out of the repo. Pair it with the logging rule this
                # | lesson opened with, never log the environment, or the sweep's work
                # | reappears inside a retained log line.
                feedback: "Una sola regla con cuatro disfraces: la configuración commiteada se queda pública, los valores inyectados se quedan fuera del repo. Emparéjala con la regla de logging con la que abrió esta lección, nunca loguees el entorno, o el trabajo del barrido reaparece adentro de una línea de log retenida."  # @src=c849726333f3
              d:
                # | Actions repository secrets; Vercel dashboard env vars; Cloudflare
                # | wrangler secret put with .dev.vars; Docker an ENV line, since the image
                # | stays in a private registry
                label: "Secretos de repositorio de Actions; env vars del panel de Vercel; Cloudflare wrangler secret put con .dev.vars; Docker una línea ENV, ya que la imagen se queda en un registro privado"  # @src=0841409e1faf
                # | Three rows right and one that undoes them: docker history prints every
                # | layer of an image, ENV instructions included, so a private registry
                # | protects the value only until someone pulls the image. Pass it at run
                # | time with --env-file or compose env_file instead.
                feedback: "Tres filas bien y una que las deshace: docker history imprime cada capa de una imagen, instrucciones ENV incluidas, así que un registro privado protege el valor solo hasta que alguien le hace pull a la imagen. Pásalo en tiempo de ejecución con --env-file o env_file de compose en cambio."  # @src=653050aa9728
              a:
                # | Actions: an env block committed in the workflow YAML; Vercel: values in
                # | vercel.json; Cloudflare: a vars entry in wrangler.jsonc; Docker: an ENV
                # | line baked into the Dockerfile
                label: "Actions: un bloque env commiteado en el YAML del workflow; Vercel: valores en vercel.json; Cloudflare: una entrada vars en wrangler.jsonc; Docker: una línea ENV horneada en el Dockerfile"  # @src=f6484cf44a0a
                # | Every location in this list is a committed file, that is four different
                # | ways to publish a secret. Each platform provides an out-of-repo store
                # | precisely so config files can stay public.
                feedback: "Cada ubicación de esta lista es un archivo commiteado, o sea cuatro formas distintas de publicar un secreto. Cada plataforma da un almacén fuera del repo precisamente para que los archivos de config puedan quedarse públicos."  # @src=344edc83fe3f
              b:
                # | One encrypted .env committed to the repo and decrypted at deploy time on
                # | every platform with a shared key kept in the team password manager
                label: "Un solo .env encriptado commiteado al repo y desencriptado en tiempo de deploy en cada plataforma con una clave compartida guardada en el gestor de contraseñas del equipo"  # @src=22117a1a4a44
                # | Committed-but-encrypted schemes exist in industry, but they add a
                # | key-distribution problem this course never takes on, and one leaked key
                # | retroactively exposes the whole git history. The taught path is each
                # | platform's own secret store.
                feedback: "Los esquemas de commiteado-pero-encriptado existen en la industria, pero agregan un problema de distribución de claves que este curso nunca toma, y una sola clave filtrada expone retroactivamente todo el historial de git. El camino que se enseña es el almacén de secretos propio de cada plataforma."  # @src=4e188b7ad356
  m10-l1:
    # | Assembly: the station, whole
    title: "Ensamblaje: la estación, entera"  # @src=aa421e1aff0e
    blocks:
      station-check:                      # quiz
        questions:
          m10-l1-q1:
            # | During the opening checkpoint, a learner draws an arrow from the Dockerized
            # | poller to the Vercel dashboard. Against the hub topology you actually built,
            # | what is wrong with that edge?
            prompt: "Durante el checkpoint de apertura, alguien que aprende dibuja una flecha del poller dockerizado al panel de Vercel. Contra la topología de hub que de verdad construiste, ¿qué tiene de malo esa arista?"  # @src=6eaa1e6609e7
            # | The hub has no poller-to-dashboard edge and no public path to the poller at
            # | all. The dashboard's three data sources are the cron-produced status.json,
            # | live kit reads, and the TS worker's public JSON endpoint. Knowing which
            # | edges do NOT exist is as much a part of understanding the system as knowing
            # | which do, that is why the checkpoint is drawn from memory before the docs
            # | come back out.
            explanation: "El hub no tiene arista de poller-a-panel ni ningún camino público al poller. Las tres fuentes de datos del panel son el status.json producido por el cron, las lecturas con kit en vivo, y el endpoint JSON público del worker de TS. Saber cuáles aristas NO existen es tanta parte de entender el sistema como saber cuáles sí, y por eso el checkpoint se dibuja de memoria antes de que los docs vuelvan a salir."  # @src=7d06f3c61bf0
            options:                 # source order — keep it
              b:
                # | The direction is flipped: the dashboard polls the poller's /status
                # | endpoint over the public internet
                label: "La dirección está invertida: el panel consulta el endpoint /status del poller por el internet público"  # @src=21ff28b409c9
                # | The dashboard never reaches the poller in either direction. The poller
                # | runs on your machine with no public surface; exposing it would mean
                # | tunneling or paid hosting, both deliberately out of scope. The
                # | dashboard's sources are status.json, kit reads, and the worker endpoint.
                feedback: "El panel nunca alcanza al poller en ninguna de las dos direcciones. El poller corre en tu máquina sin superficie pública; exponerlo significaría tunneling o hosting pago, los dos deliberadamente fuera de alcance. Las fuentes del panel son status.json, lecturas con kit, y el endpoint del worker."  # @src=461d7c81450e
              a:
                # | It does not exist: the poller is local-only, poked from your machine; no
                # | public surface reaches it
                label: "No existe: el poller es solo local, golpeado desde tu máquina; ninguna superficie pública lo alcanza"  # @src=e79c8dfbd6f9
                # | Three arrows are deliberately absent from the hub, and this is one of
                # | them: nothing reaches into the poller, neither worker consumes anything,
                # | and the poller feeds no public surface. The free tier bought three
                # | public surfaces, and the container is not one of them.
                feedback: "Tres flechas están deliberadamente ausentes del hub, y esta es una de ellas: nada llega hacia adentro del poller, ninguno de los dos workers consume nada, y el poller no alimenta ninguna superficie pública. El tier gratis compró tres superficies públicas, y el contenedor no es una de ellas."  # @src=6c8c55a68e2b
              c:
                # | It is almost right: pushing the image to GHCR is what gives the running
                # | container its public URL
                label: "Está casi bien: hacerle push de la imagen a GHCR es lo que le da al contenedor corriendo su URL pública"  # @src=c03703ab1624
                # | GHCR hosts the IMAGE, not a running container, pulling and running it
                # | happens on your machine, which has no public URL. A registry is storage,
                # | not hosting; that distinction is exactly what m06-l4 taught.
                feedback: "GHCR aloja la IMAGEN, no un contenedor corriendo, hacerle pull y correrlo pasa en tu máquina, que no tiene URL pública. Un registro es almacenamiento, no hosting; esa distinción es exactamente lo que enseñó m06-l4."  # @src=f2d07b6dda22
              d:
                # | The arrow is indirect: the cron commits the poller's data, so the
                # | dashboard reads it from status.json
                label: "La flecha es indirecta: el cron hace commit de los datos del poller, así que el panel los lee desde status.json"  # @src=1a835ebb180f
                # | That is the route an extension would have to build, not an edge the
                # | station has. The cron probes public targets from a runner that has never
                # | heard of your laptop, so nothing of the poller's reaches status.json
                # | today. Carrying poller data through the pipeline is exactly the design
                # | work the challenge's panel option asks for.
                feedback: "Esa es la ruta que una extensión tendría que construir, no una arista que la estación tenga. El cron sondea targets públicos desde un runner que nunca oyó hablar de tu laptop, así que nada del poller llega a status.json hoy. Llevar datos del poller a través del pipeline es exactamente el trabajo de diseño que pide la opción de panel del challenge."  # @src=99ae9f792cca
          m10-l1-q2:
            # | The worker-status panel is the capstone's only NEW wiring, yet the lesson
            # | insists it requires zero new skills. What makes that claim true?
            prompt: "El panel de estado de workers es el único cableado NUEVO del capstone, y aun así la lección insiste en que no requiere ninguna habilidad nueva. ¿Qué hace que esa afirmación sea cierta?"  # @src=0f2a9e38375a
            # | The capstone's one new edge is taught-skill composition, stated out loud:
            # | the dashboard polls a public JSON URL exactly the way it has polled
            # | status.json since m03-l2, and the worker has served its KV snapshot as
            # | public JSON since m07-l1. The capstone's one new edge proves the course's
            # | thesis, by the end, new capability comes from composing what you own, not
            # | from learning another tool.
            explanation: "La única arista nueva del capstone es composición de habilidades enseñadas, dicho en voz alta: el panel consulta una URL JSON pública exactamente de la forma en que lleva consultando status.json desde m03-l2, y el worker lleva sirviendo su snapshot de KV como JSON público desde m07-l1. La única arista nueva del capstone demuestra la tesis del curso, para el final, la capacidad nueva viene de componer lo que ya es tuyo, no de aprender otra herramienta."  # @src=64ce6184b4ac
            options:                 # source order — keep it
              c:
                # | The dashboard already binds to the worker's KV namespace, so the panel
                # | just reads shared state
                label: "El panel ya tiene un binding al namespace de KV del worker, así que el panel solo lee estado compartido"  # @src=59304dfb2e02
                # | KV bindings exist only inside Cloudflare Workers, a Vercel-hosted SPA
                # | cannot bind to a KV namespace. The worker's fetch handler exists
                # | precisely to serve its KV snapshot as public JSON so anything can poll
                # | it over HTTP.
                feedback: "Los bindings de KV existen solo adentro de Cloudflare Workers, una SPA alojada en Vercel no puede tener un binding a un namespace de KV. El handler de fetch del worker existe precisamente para servir su snapshot de KV como JSON público así cualquier cosa puede consultarlo por HTTP."  # @src=4e14a6aefe34
              b:
                # | It composes two taught skills: the m03-l2 polling pattern aimed at the
                # | m07-l1 JSON endpoint
                label: "Compone dos habilidades enseñadas: el patrón de polling de m03-l2 apuntado al endpoint JSON de m07-l1"  # @src=63d851681ca1
                # | A zod schema at the boundary, a discriminated state union, useEffect
                # | with a cleaned-up interval: the dashboard has polled a public JSON URL
                # | that way since module three, and the worker has served its snapshot that
                # | way since module seven. New capability out of owned parts is the whole
                # | thesis.
                feedback: "Un schema de zod en la frontera, una unión discriminada de estado, useEffect con un intervalo limpiado: el panel lleva consultando una URL JSON pública de esa forma desde el módulo tres, y el worker lleva sirviendo su snapshot de esa forma desde el módulo siete. Capacidad nueva a partir de partes que ya son tuyas es toda la tesis."  # @src=ac27cbd3a61d
              a:
                # | Vercel and Cloudflare share an integration that auto-wires deployed
                # | projects to each other
                label: "Vercel y Cloudflare comparten una integración que auto-cablea entre sí los proyectos desplegados"  # @src=256fea6ca78e
                # | No such auto-wiring is used or taught. The panel is plain application
                # | code in the dashboard: a fetch on an interval against a public URL.
                # | Reaching for a platform integration you never learned would break the
                # | capstone's taught-skills-only rule.
                feedback: "No se usa ni se enseña ningún auto-cableado así. El panel es código de aplicación pelado adentro del panel: un fetch en un intervalo contra una URL pública. Agarrar una integración de plataforma que nunca aprendiste rompería la regla de solo-habilidades-enseñadas del capstone."  # @src=168ed13879d4
              d:
                # | Both surfaces are TypeScript, so the panel imports the worker's JSON
                # | types straight from pulse-core
                label: "Las dos superficies son TypeScript, así que el panel importa los tipos JSON del worker directo de pulse-core"  # @src=0278ef85263e
                # | The worker is its own npm project outside the station's pnpm workspace,
                # | which is why m09-l1 counted its lockfile separately. Nothing is
                # | importable across that line, so the panel gets its own schema file for
                # | the payload shape and validates at the boundary like every other feed.
                feedback: "El worker es su propio proyecto de npm afuera del workspace de pnpm de la estación, que es por lo que m09-l1 contó su lockfile por separado. Nada es importable a través de esa línea, así que el panel recibe su propio archivo de schema para la forma del payload y valida en la frontera como cualquier otro feed."  # @src=ab12f495ef85
          m10-l1-q3:
            # | While verifying the pipeline edge you notice the cron's status.json commit
            # | never retriggers the workflow. In the station's design, what is that
            # | behavior?
            prompt: "Mientras verificas la arista del pipeline te das cuenta de que el commit de status.json del cron nunca vuelve a disparar el workflow. En el diseño de la estación, ¿qué es ese comportamiento?"  # @src=1a30998320c6
            # | You met the mechanism in m01-l3, so the capstone asks a different question
            # | about it: not what it does, but what it is load-bearing FOR. Edge 1 is the
            # | only edge in the hub whose correctness depends on a platform behavior nobody
            # | in this course wrote, and the station's whole heartbeat rests on it, so a
            # | reader of your architecture diagram has to know it is a designed guarantee
            # | rather than luck. That is the operator's read: name the platform behaviors
            # | your system leans on, and know which of them you would have had to build
            # | yourself. The escape hatch (a PAT or GitHub App token) is exactly the knob
            # | that would break this station if someone reached for it without asking why
            # | the default was chosen.
            explanation: "Conociste el mecanismo en m01-l3, así que el capstone hace una pregunta distinta sobre él: no qué hace, sino PARA QUÉ es estructural. La arista 1 es la única arista del hub cuya corrección depende de un comportamiento de plataforma que nadie en este curso escribió, y el latido entero de la estación descansa sobre él, así que un lector de tu diagrama de arquitectura tiene que saber que es una garantía diseñada y no suerte. Esa es la lectura del operador: nombra los comportamientos de plataforma sobre los que se apoya tu sistema, y sabe cuáles de ellos habrías tenido que construir tú mismo. La escotilla de escape (un PAT o token de GitHub App) es exactamente la perilla que rompería esta estación si alguien la agarrara sin preguntar por qué se eligió el default."  # @src=3040b34a494c
            options:                 # source order — keep it
              d:
                # | A bot-author filter: push triggers skip commits authored by a bot, so
                # | those events create no new runs
                label: "Un filtro por autor bot: los triggers de push se saltean los commits escritos por un bot, así que esos eventos no crean ejecuciones nuevas"  # @src=802fd401055a
                # | The guard keys on the token that created the event, not on who the
                # | commit says it is from. Swap GITHUB_TOKEN for a PAT and the identical
                # | bot-looking commit starts spawning runs, which is exactly why the escape
                # | hatch works and why the default is the thing holding this edge up.
                feedback: "La guarda se basa en el token que creó el evento, no en de quién dice el commit que viene. Cambia GITHUB_TOKEN por un PAT y el commit idéntico con pinta de bot empieza a generar ejecuciones, que es exactamente por qué funciona la escotilla de escape y por qué el default es lo que sostiene esta arista."  # @src=928fa8f3fc03
              a:
                # | A misconfiguration: the workflow's push trigger needs a path filter
                # | added so that it fires on that commit
                label: "Una mala configuración: al trigger de push del workflow le falta que le agreguen un filtro de path para que se dispare en ese commit"  # @src=1db2d6bd8fcf
                # | Backwards, if that commit DID fire the push workflow, the cron would
                # | trigger itself forever. No path filter is missing; the platform is
                # | refusing the recursion for you, and you want it refused.
                feedback: "Al revés, si ese commit SÍ disparara el workflow de push, el cron se dispararía a sí mismo para siempre. No falta ningún filtro de path; la plataforma está rechazando la recursión por ti, y tú quieres que la rechace."  # @src=43960049eb2e
              c:
                # | The GITHUB_TOKEN recursion guard working as designed: workflow-authored
                # | events don't create new runs
                label: "La guarda de recursión de GITHUB_TOKEN funcionando como se diseñó: los eventos escritos por workflows no crean ejecuciones nuevas"  # @src=caf465904dba
                # | This is the one edge in the hub whose correctness rests on a platform
                # | behavior nobody in this course wrote, so name it in your diagram as a
                # | guarantee rather than luck. The documented escape hatch, a PAT or GitHub
                # | App token, is precisely the knob that would set your station spinning.
                feedback: "Esta es la única arista del hub cuya corrección descansa sobre un comportamiento de plataforma que nadie en este curso escribió, así que nómbrala en tu diagrama como una garantía y no como suerte. La escotilla de escape documentada, un PAT o token de GitHub App, es precisamente la perilla que pondría a tu estación a girar sin parar."  # @src=6a354d350812
              b:
                # | A quirk of cron: scheduled workflows only ever run on the schedule, so
                # | no commit triggers anything in this repo
                label: "Una rareza del cron: los workflows programados solo corren en el calendario, así que ningún commit dispara nada en este repo"  # @src=f6aa7d23289b
                # | Commits still trigger push-based workflows normally in this repo, your
                # | test gate runs on push. The exception is narrower: events created using
                # | GITHUB_TOKEN do not spawn new runs; a human push does.
                feedback: "Los commits siguen disparando normalmente los workflows basados en push en este repo, tu barrera de pruebas corre en push. La excepción es más angosta: los eventos creados usando GITHUB_TOKEN no generan ejecuciones nuevas; un push humano sí."  # @src=d1a34af55d37
          m10-l1-q4:
            # | For the solo extension, a learner shortlists three ideas: a new
            # | expected-status-code probe type wired end to end, a Telegram alert via a bot
            # | SDK, and deploying the poller to a Kubernetes cluster. Which one satisfies
            # | the extension's rules?
            prompt: "Para la extensión en solitario, alguien que aprende preselecciona tres ideas: un tipo nuevo de sonda de código-de-estado-esperado cableado de punta a punta, una alerta de Telegram vía un SDK de bot, y desplegar el poller a un cluster de Kubernetes. ¿Cuál satisface las reglas de la extensión?"  # @src=4d95f34d900b
            # | The extension's one rule is taught skills only, and it is the assignment
            # | itself: prove you can extend a real system without a tutorial. A new
            # | probe-target type is pure composition, a union variant in the fleet, a check
            # | in the worker, a row on the dashboard. The other two each smuggle in an
            # | untaught tool, which is exactly the reflex this course spent ten modules
            # | replacing with selection.
            explanation: "La única regla de la extensión es solo habilidades enseñadas, y es la tarea misma: demuestra que puedes extender un sistema de verdad sin un tutorial. Un tipo nuevo de target de sonda es composición pura, una variante de unión en la flota, un check en el worker, una fila en el panel. Las otras dos cuelan cada una una herramienta no enseñada, que es exactamente el reflejo que este curso gastó diez módulos reemplazando por selección."  # @src=0315996fd1c5
            options:                 # source order — keep it
              a:
                # | The new probe-target type: fleet types, worker check, dashboard row,
                # | composed from taught skills
                label: "El tipo nuevo de target de sonda: tipos de la flota, check en el worker, fila en el panel, compuesto a partir de habilidades enseñadas"  # @src=50fc1a7400e3
                # | Pure composition, end to end: a variant in the fleet's target union, the
                # | check logic in a worker, a row on the dashboard. Nothing new enters the
                # | tree, which is the point of the rule, since ten modules went into
                # | replacing the reflex of reaching for a tool with the skill of selecting
                # | one.
                feedback: "Composición pura, de punta a punta: una variante en la unión de targets de la flota, la lógica del check en un worker, una fila en el panel. Nada nuevo entra al árbol, que es el punto de la regla, ya que diez módulos se fueron en reemplazar el reflejo de agarrar una herramienta por la habilidad de seleccionar una."  # @src=9a10aa79bd92
              b:
                # | The Telegram alert: alerts are one of the three named extension
                # | categories, so any alert qualifies
                label: "La alerta de Telegram: las alertas son una de las tres categorías de extensión nombradas, así que cualquier alerta califica"  # @src=d93550ba3c74
                # | The category is allowed; the implementation is not. A bot SDK is an
                # | untaught dependency, so it breaks the taught-skills-only rule. An
                # | in-bounds alert composes what you own, like a worker-written degraded
                # | flag the Actions run checks and fails loudly on.
                feedback: "La categoría está permitida; la implementación no. Un SDK de bot es una dependencia no enseñada, así que rompe la regla de solo-habilidades-enseñadas. Una alerta dentro de los límites compone lo que ya es tuyo, como una flag de degradado escrita por un worker que la ejecución de Actions revisa y sobre la que falla a gritos."  # @src=3334234b2fd4
              d:
                # | The probe type and the Telegram alert both qualify, since neither one
                # | adds a platform the station lacks
                label: "El tipo de sonda y la alerta de Telegram califican los dos, ya que ninguno de los dos agrega una plataforma que a la estación le falte"  # @src=970cdc417525
                # | Platforms are not the boundary; taught skills are. The Telegram idea
                # | adds no platform and still fails, because the bot SDK is a dependency
                # | nobody taught you to evaluate. Rewrite that same alert as a degraded
                # | flag an Actions step reads and it comes back in bounds.
                feedback: "Las plataformas no son la frontera; las habilidades enseñadas sí. La idea de Telegram no agrega ninguna plataforma y aun así falla, porque el SDK de bot es una dependencia que nadie te enseñó a evaluar. Reescribe esa misma alerta como una flag de degradado que lee un step de Actions y vuelve a estar dentro de los límites."  # @src=161a57b2f293
              c:
                # | The Kubernetes deploy: it extends the ops layer, which is the newest
                # | skill and freshest in memory
                label: "El deploy de Kubernetes: extiende la capa de ops, que es la habilidad más nueva y la más fresca en la memoria"  # @src=c5553639a72c
                # | K8s was explicitly signposted out of scope at the M6 tier-gate and never
                # | taught. The extension proves you can grow the system with the stack you
                # | actually own, orchestration is a different course's problem.
                feedback: "K8s quedó explícitamente señalizado fuera de alcance en la barrera de tiers del M6 y nunca se enseñó. La extensión demuestra que puedes hacer crecer el sistema con la stack que de verdad es tuya, la orquestación es problema de otro curso."  # @src=a90c31867c3c
  m10-l2:
    # | Conclusion: the map you now own
    title: "Conclusión: el mapa que ahora es tuyo"  # @src=0d8438b802f3
    blocks:
      map-check:                      # quiz
        questions:
          m10-l2-q1:
            # | Your goal after graduating is writing on-chain programs, and your Rust feels
            # | solid after M4, M6. What is the honest reading of the road to the Anchor
            # | course?
            prompt: "Tu meta al graduarte es escribir programas on-chain, y tu Rust se siente sólido después de M4, M6. ¿Cuál es la lectura honesta del camino hacia el curso de Anchor?"  # @src=d148ef9ea551
            # | The exit map's integrity moment: the Anchor course's own sign is blunt, it
            # | assumes you already ship Anchor programs and want the V2 delta. This course
            # | supplies the Rust reading level with evidence (you write structs, enums,
            # | traits, Result, and serde daily); the conceptual grasp of accounts, PDAs,
            # | and transactions is the Bitcoin-to-Solana evolution course's job, and the
            # | shipping reps are yours to earn between the two. Rust confidence alone does
            # | not clear a shipping bar.
            explanation: "El momento de integridad del mapa de salida: el propio letrero del curso de Anchor es franco, asume que ya entregas programas de Anchor y quieres el delta de V2. Este curso aporta el nivel de lectura de Rust con evidencia (escribes structs, enums, traits, Result y serde a diario); el entendimiento conceptual de cuentas, PDAs y transacciones es tarea del curso de evolución de Bitcoin a Solana, y las reps de entrega te toca ganártelas entre los dos. La confianza en Rust por sí sola no supera una vara de entrega."  # @src=c1fa247d7a5f
            options:                 # source order — keep it
              b:
                # | Your Rust reading level is met; accounts and transactions come from the
                # | Bitcoin-to-Solana course, then shipped-program reps
                label: "Tu nivel de lectura de Rust está cumplido; cuentas y transacciones vienen del curso de Bitcoin a Solana, y después las reps de programas entregados"  # @src=1277bdb2d30b
                # | Two halves to what you lack, and only one of them is a course: the
                # | concepts live in the Bitcoin-to-Solana sibling, and the reps nobody
                # | hands you. Take the concept course fast, since you over-qualify on its
                # | coding floor, then write and ship programs, then read the V2 delta as
                # | the delta it is.
                feedback: "Lo que te falta tiene dos mitades, y solo una de ellas es un curso: los conceptos viven en el hermano de Bitcoin a Solana, y las reps no te las regala nadie. Toma el curso de conceptos rápido, ya que estás sobrecalificado en su piso de programación, después escribe y entrega programas, y después lee el delta de V2 como el delta que es."  # @src=aca3dd621f41
              a:
                # | You clear its bar now: Rust fluency is what it wants, and your Rust exit
                # | here exceeds reading level
                label: "Ya superas su vara: fluidez en Rust es lo que quiere, y tu salida de Rust acá excede el nivel de lectura"  # @src=bab1340fcc3a
                # | The reading level IS met here, and it matters. But that course's own
                # | sign is a shipping bar: it assumes you already ship Anchor programs and
                # | want the V2 delta. Reading fluency is necessary and nowhere near
                # | sufficient; the concepts and the shipped-program reps still have to come
                # | from somewhere.
                feedback: "El nivel de lectura SÍ está cumplido acá, y eso importa. Pero el propio letrero de ese curso es una vara de entrega: asume que ya entregas programas de Anchor y quieres el delta de V2. La fluidez de lectura es necesaria y ni de cerca suficiente; los conceptos y las reps de programas entregados todavía tienen que venir de algún lado."  # @src=cef7cde219a4
              c:
                # | You should take the client-side mastery course first, since Anchor
                # | programs always need a TS client for anything a user touches
                label: "Deberías tomar primero el curso de dominio del lado del cliente, ya que los programas de Anchor siempre necesitan un cliente de TS para cualquier cosa que un usuario toque"  # @src=32cb886f357d
                # | Programs do get TS clients, but the client-side course is the wallet-UX
                # | and tx-landing route, not an Anchor prerequisite. What you are missing
                # | is conceptual (accounts, PDAs, transactions as ideas, the concept
                # | sibling's job) plus actual shipped-program practice; the client-side
                # | course is neither.
                feedback: "Los programas sí llevan clientes de TS, pero el curso del lado del cliente es la ruta de UX de wallet y aterrizaje de tx, no un prerrequisito de Anchor. Lo que te falta es conceptual (cuentas, PDAs, transacciones como ideas, tarea del hermano de conceptos) más práctica real de programas entregados; el curso del lado del cliente no es ninguna de las dos."  # @src=4e3fbec535d0
              d:
                # | Start with the digital assets course, since token programs are the
                # | gentlest way into on-chain code, and its own labs walk you up to writing
                # | programs of your own
                label: "Empieza con el curso de activos digitales, ya que los programas de tokens son la entrada más suave al código on-chain, y sus propios labs te llevan hasta escribir programas propios"  # @src=866dd7ebea0b
                # | That door has the taller sign, not the gentler one. Its PDA half belongs
                # | to the concepts course anyway, and the token-account background its
                # | first module leans on is something this course consciously did not
                # | supply, so you arrive owing it rather than warmed up.
                feedback: "Esa puerta tiene el letrero más alto, no el más suave. Su mitad de PDAs le pertenece al curso de conceptos de todos modos, y los conocimientos previos sobre token accounts en los que se apoya su primer módulo son algo que este curso conscientemente no dio, así que llegas debiéndolo en vez de calentado."  # @src=4b0fffd2b096
          m10-l2-q2:
            # | Six months from now you scaffold a fresh Solana TS project, copy this
            # | course's install line, and npm fails with a peer-dependency error. What does
            # | the course's re-verify habit say to do?
            prompt: "Dentro de seis meses armas un proyecto nuevo de TS para Solana, copias la línea de instalación de este curso, y npm falla con un error de peer-dependency. ¿Qué dice el hábito de reverificar del curso que hagas?"  # @src=19ad1b515340
            # | The habit is the deliverable: 'pin what your deps peer against, per
            # | workspace' survives every major bump, while any specific digit rots, this
            # | course's own research watched kit ship two majors in just over nine weeks
            # | and its house rules file go stale twice. One npm view of your deps'
            # | peerDependencies tells you today's pin; your pin table makes updating it a
            # | one-line edit.
            explanation: "El hábito es el entregable: 'fija lo que tus deps declaran como peer, por workspace' sobrevive cada salto de major, mientras que cualquier dígito específico se pudre, la propia investigación de este curso vio a kit entregar dos majors en poco más de nueve semanas y a su archivo de reglas de la casa quedar desactualizado dos veces. Un npm view de los peerDependencies de tus deps te dice el pin de hoy; tu tabla de pins hace que actualizarlo sea una edición de una línea."  # @src=45c84750561a
            options:                 # source order — keep it
              b:
                # | Downgrade your other packages until they match the kit major the course
                # | printed in its labs
                label: "Baja de versión tus otros paquetes hasta que coincidan con el major de kit que el curso imprimió en sus labs"  # @src=0af750bf0129
                # | Backwards, that treats the course's digit as the fixed point and your
                # | ecosystem as the error. The rule pins what your dependencies peer
                # | against TODAY, per workspace; the printed major was only ever what deps
                # | peered against then.
                feedback: "Al revés, eso trata al dígito del curso como el punto fijo y a tu ecosistema como el error. La regla fija lo que tus dependencias declaran como peer HOY, por workspace; el major impreso nunca fue más que lo que las deps declaraban como peer entonces."  # @src=57a2b3c39832
              d:
                # | Copy your station's kit pin into the new workspace, since that digit
                # | installed cleanly there
                label: "Copia el pin de kit de tu estación al workspace nuevo, ya que ese dígito instaló limpio ahí"  # @src=f0d2a44a7356
                # | The station's pin is right for the station's dependency set, and a fresh
                # | scaffold has a different one. Per-workspace is the whole shape of the
                # | rule: one repo can legitimately hold two workspaces on different kit
                # | majors, because their own dependencies peer differently.
                feedback: "El pin de la estación es el correcto para el conjunto de dependencias de la estación, y un armado nuevo tiene otro. Por workspace es toda la forma de la regla: un repo puede legítimamente tener dos workspaces en majors distintos de kit, porque sus propias dependencias declaran peers distintos."  # @src=c4f852608d0b
              c:
                # | Re-probe what your deps peer against today and pin that per workspace;
                # | the rule outlives the digit
                label: "Vuelve a sondear qué declaran como peer tus deps hoy y fija eso por workspace; la regla sobrevive al dígito"  # @src=bd9ce2cef24b
                # | One npm view of your deps' peerDependencies answers it in ten seconds,
                # | and the answer is authoritative on the day you ask rather than the day
                # | someone wrote it down. Then stamp the date in your pin table, which is
                # | what turns a list of future lies into a maintenance manual.
                feedback: "Un npm view de los peerDependencies de tus deps lo responde en diez segundos, y la respuesta es autoritativa el día en que preguntas y no el día en que alguien la anotó. Después sella la fecha en tu tabla de pins, que es lo que convierte una lista de mentiras futuras en un manual de mantenimiento."  # @src=8a34d79d1d2c
              a:
                # | Add --legacy-peer-deps and continue: the course's printed install line
                # | is the verified canonical setup
                label: "Agrega --legacy-peer-deps y sigue: la línea de instalación impresa del curso es el setup canónico verificado"  # @src=7caef6807041
                # | That flag silences the signal instead of reading it. The course's digits
                # | were verified at write time and were expected to rot, kit moved two
                # | majors in just over nine weeks during research alone. A frozen install
                # | line is a snapshot, never canon.
                feedback: "Esa flag silencia la señal en vez de leerla. Los dígitos del curso se verificaron al momento de escribirlos y se esperaba que se pudrieran, kit se movió dos majors en poco más de nueve semanas solo durante la investigación. Una línea de instalación congelada es una foto, nunca canon."  # @src=9b5086cf9790
          m10-l2-q3:
            # | Deep in a program-authoring lab a few months from now, the borrow checker
            # | demands a lifetime annotation beyond anything this course covered. Per the
            # | map you now own, what is that moment?
            prompt: "Metido en un lab de escritura de programas dentro de unos meses, el verificador de préstamos exige una anotación de tiempo de vida más allá de todo lo que este curso cubrió. Según el mapa que ahora es tuyo, ¿qué es ese momento?"  # @src=85425c693313
            # | This is the map functioning as designed: the 20% was never missing, you know
            # | exactly where it lives (the canonical Rust deep-dives this course
