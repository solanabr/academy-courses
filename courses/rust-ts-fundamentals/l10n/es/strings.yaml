                feedback: "Los datos están vivos y sanos bajo su nombre nuevo. Lo que terminó es tu nombre viejo, porque dos bindings creyendo que son dueños de una sola asignación es exactamente la ambigüedad que la regla existe para borrar."  # @src=d2a3f354d69c
          m04l1-q2:
            # | A teammate from your TS module asks: 'Why does Rust make this a compile-time
            # | fight instead of just running a garbage collector like Node does?' The
            # | honest answer:
            prompt: "Un compañero de tu módulo de TS pregunta: '¿Por qué Rust hace de esto una pelea en tiempo de compilación en vez de simplemente correr un recolector de basura como hace Node?' La respuesta honesta:"  # @src=9bd4c97e19eb
            # | The trade is explicit: Rust moves the memory-management work from a runtime
            # | collector to compile-time rules. You pay in borrow-checker friction; you get
            # | deterministic frees, no GC pauses, and whole bug classes (use-after-free,
            # | data races) rejected before the program exists.
            explanation: "El trade-off es explícito: Rust mueve el trabajo de gestión de memoria de un recolector en runtime a reglas de tiempo de compilación. Pagas en fricción con el verificador de préstamos; recibes liberaciones deterministas, cero pausas de GC, y clases enteras de bugs (use-after-free, carreras de datos) rechazadas antes de que el programa exista."  # @src=d653081bec97
            options:                 # source order — keep it
              d:
                # | It runs the collector's work at compile time, tracing which values are
                # | still reachable and freeing the rest
                label: "Corre el trabajo del recolector en tiempo de compilación, rastreando cuáles valores siguen siendo alcanzables y liberando el resto"  # @src=fdc483e7b02a
                # | No reachability is traced anywhere. The compiler frees a value where its
                # | owner leaves scope, which is why you can point at the line, and why
                # | ownership is a discipline rather than an early GC.
                feedback: "No se rastrea alcanzabilidad en ninguna parte. El compilador libera un valor donde su dueño sale de scope, que es por qué puedes señalar la línea, y por qué el ownership es una disciplina y no un GC temprano."  # @src=f398f415d77a
              b:
                # | Ownership gives deterministic cleanup and rules out data races and
                # | aliasing bugs at compile time, with no runtime paying for it
                label: "El ownership da limpieza determinista y descarta carreras de datos y bugs de aliasing en tiempo de compilación, sin ningún runtime pagando por ello"  # @src=5062435ac6b5
                # | Cleanup lands at a line you can point to, and the
                # | one-writer-XOR-many-readers rule that saves a reference from a
                # | reallocated buffer is the data-race rule wearing single-threaded
                # | clothes.
                feedback: "La limpieza aterriza en una línea que puedes señalar, y la regla de un-escritor-XOR-muchos-lectores que salva a una referencia de un buffer reasignado es la regla de carreras de datos vestida de un solo hilo de ejecución."  # @src=56d22dee25b6
              c:
                # | Rust programs cannot detect unreachable objects at runtime, so static
                # | ownership rules are the only memory strategy available to it
                label: "Los programas de Rust no pueden detectar objetos inalcanzables en runtime, así que las reglas estáticas de ownership son la única estrategia de memoria disponible para él"  # @src=83ef555d3c34
                # | Runtime GC for Rust is possible in principle (and Rc/Arc exist),
                # | ownership is a design choice for zero-cost, deterministic safety, not a
                # | workaround for a missing capability.
                feedback: "Un GC en runtime para Rust es posible en principio (y Rc/Arc existen), el ownership es una elección de diseño para seguridad determinista y de costo cero, no un workaround por una capacidad que falta."  # @src=6bd3f935824b
              a:
                # | GC pauses are unacceptable on blockchains, so Rust forbids heap
                # | allocation and keeps every value on the stack instead
                label: "Las pausas de GC son inaceptables en blockchains, así que Rust prohíbe la asignación en heap y en cambio mantiene cada valor en el stack"  # @src=5fb6ac8d6ab4
                # | Rust heap-allocates freely (Vec, String, Box). Ownership governs WHO
                # | frees the heap, it does not forbid using it.
                feedback: "Rust asigna en heap libremente (Vec, String, Box). El ownership gobierna QUIÉN libera el heap, no prohíbe usarlo."  # @src=6936de291245
          m04l1-q3:
            # | You hold `let worst = &latencies[0];` and three lines later, while `worst`
            # | is still used, you call `latencies.push(next)`. The compiler refuses. Which
            # | rule fired?
            prompt: "Tienes `let worst = &latencies[0];` y tres líneas más abajo, mientras `worst` todavía se usa, llamas a `latencies.push(next)`. El compilador se niega. ¿Cuál regla se disparó?"  # @src=547f20312cbc
            # | Aliasing XOR mutation: push can reallocate the Vec's buffer, which would
            # | leave `worst` dangling. The checker sees a live reader and a would-be writer
            # | overlapping and rejects the ambiguity, this is the data-race rule in
            # | single-threaded clothing.
            explanation: "Aliasing XOR mutación: push puede reasignar el buffer del Vec, lo que dejaría a `worst` colgando. El verificador ve un lector vivo y un aspirante a escritor superponiéndose y rechaza la ambigüedad, esta es la regla de carreras de datos vestida de un solo hilo de ejecución."  # @src=b68e0956e3f8
            options:                 # source order — keep it
              a:
                # | Only one reference of any kind may exist at a time, so the shared borrow
