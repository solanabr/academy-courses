                feedback: "Solo los paquetes públicos viajan gratis. El almacenamiento privado es un pool medido, y es más chico de lo que habría sido una sola imagen Docker ingenua."  # @src=9fe88f9c2182
              a:
                # | Private image storage draws from a 500 MB pool that your Actions
                # | artifacts also share
                label: "El almacenamiento de imágenes privadas saca de un pool de 500 MB que tus artifacts de Actions también comparten"  # @src=9a79692d7dac
                # | Run it against your own history: m06-l2's naive image would have
