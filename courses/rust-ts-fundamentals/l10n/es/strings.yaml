                feedback: "La división sale de quién lee el error: el código hace match sobre variantes, los humanos leen una cadena de contexto. agave y yellowstone-grpc corren thiserror 2.x, photon y jito-relayer 1.x, con anyhow de acompañante en todos ellos."  # @src=3bc626d78cd0
