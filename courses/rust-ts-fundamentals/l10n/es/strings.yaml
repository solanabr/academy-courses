            # | You wrote `let fleet = targets;` and then called `classify(targets)` two
            # | lines later. The compiler rejects it with E0382: use of moved value. What is
            # | it actually telling you?
            prompt: "Escribiste `let fleet = targets;` y después llamaste a `classify(targets)` dos líneas más abajo. El compilador lo rechaza con E0382: uso de un valor movido. ¿Qué te está diciendo en realidad?"  # @src=5978be0d430d
            # | A move transfers ownership: exactly one binding is responsible for the
            # | value's cleanup and mutation at any time. The compiler ends the old
            # | binding's access so 'who owns this?' always has one answer.
            explanation: "Un move transfiere el ownership: exactamente un binding es responsable de la limpieza y la mutación del valor en todo momento. El compilador termina el acceso del binding viejo para que '¿quién es dueño de esto?' siempre tenga una sola respuesta."  # @src=8c06bbeabc82
            options:                 # source order — keep it
              d:
                # | The binding was not declared mut, so moving it into `fleet` consumed it;
                # | a `let mut targets` would keep both names usable
                label: "El binding no se declaró mut, así que moverlo a `fleet` lo consumió; un `let mut targets` mantendría los dos nombres usables"  # @src=964fe727c440
                # | mut decides whether a binding can be changed, not who owns the value.
                # | Add it and the move happens identically, because both names would still
                # | be claiming one allocation.
                feedback: "mut decide si un binding puede cambiarse, no quién es dueño del valor. Agrégalo y el move pasa idéntico, porque los dos nombres seguirían reclamando una sola asignación."  # @src=95d4b0a319d1
              b:
                # | The Vec's memory was already freed at the move, so using `targets` would
                # | read dangling memory the runtime has not collected yet
                label: "La memoria del Vec ya se liberó en el move, así que usar `targets` leería memoria colgando que el runtime todavía no recolectó"  # @src=279782b2c7f7
                # | Nothing is freed at the move, the data is alive and owned by `fleet`.
                # | The rejection is about ambiguous ownership, not dangling memory.
                feedback: "Nada se libera en el move, los datos están vivos y `fleet` es su dueño. El rechazo es sobre ownership ambiguo, no sobre memoria colgando."  # @src=5688861226a0
              c:
                # | Vec is not a Copy type, so Rust requires you to call .clone() before
                # | every function call that takes one by value
                label: "Vec no es un tipo Copy, así que Rust te exige llamar a .clone() antes de cada llamada de función que tome uno por valor"  # @src=7ffbf6c5b23d
                # | Clone is one escape hatch, not a requirement, borrowing with & is the
