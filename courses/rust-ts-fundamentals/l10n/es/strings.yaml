                feedback: "Córrelo contra tu propia historia: la imagen ingenua de m06-l2 habría desbordado ese pool entero varias veces, sola. Tus imágenes multi-stage entran, que es el trabajo de la lección pasada pagando el alquiler."  # @src=4477c71f68ef
          m06-l4-q4:
