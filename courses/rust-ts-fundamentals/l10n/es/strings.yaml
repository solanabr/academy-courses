locale: es

course:
  # | Rust & TypeScript Fundamentals for Web3
  title: "Fundamentos de Rust y TypeScript para Web3"  # @src=58458db0a1bb
  # | By the end you can read and write the Rust and TypeScript that real web3 codebases are
  # | made of, and ship them: a TypeScript dashboard on Vercel, edge workers in both
  # | languages on Cloudflare, and a containerized Rust service on GHCR, all wired to live
  # | Solana data with one signed devnet transfer. This is a local-toolchain course, so
  # | expect to install as you build: Node in module one, rustup and cargo in module four,
  # | Docker in module six, and the Solana CLI in m08-l4, where a local validator stands by
  # | as the last-resort fallback for a dry devnet faucet.
  description: "Al terminar sabes leer y escribir el Rust y el TypeScript del que están hechos los codebases web3 de verdad, y entregarlos: un panel en TypeScript en Vercel, edge workers en los dos lenguajes en Cloudflare y un servicio de Rust en contenedor en GHCR, todo conectado a datos de Solana en vivo con una transferencia firmada en devnet. Este es un curso de toolchain local, así que cuenta con instalar cosas mientras construyes: Node en el módulo uno, rustup y cargo en el módulo cuatro, Docker en el módulo seis, y la CLI de Solana en m08-l4, donde un validador local queda a la espera como respaldo de último recurso para un faucet de devnet seco."  # @src=601341201b0e
  modules:
    m01-first-heartbeat:
      # | Put a heartbeat on the internet
      title: "Pon un latido en internet"  # @src=1d86089d9dbe
    m02-types-alarm-system:
      # | Types are the alarm system
      title: "Los tipos son el sistema de alarma"  # @src=7439fc9ca9cc
    m03-ship-to-a-url:
      # | Someone else can see it now
      title: "Alguien más puede verlo ahora"  # @src=1e51d45eebad
    m04-stricter-foreman:
      # | Same machine, stricter foreman
      title: "Misma máquina, capataz más estricto"  # @src=9cf7e9375aba
    m05-rust-that-ships:
      # | Rust that ships
      title: "Rust que se entrega"  # @src=a9d3f6ee084b
    m06-runs-anywhere:
      # | It runs anywhere, forever
      title: "Corre en cualquier parte, para siempre"  # @src=c826b988d0df
    m07-edge-probes:
      # | Probes belong at the edge
      title: "Las sondas van en el edge"  # @src=50040db8d005
    m08-solana-target:
      # | Point it at the most interesting target
      title: "Apúntalo al target más interesante"  # @src=da6d2511cc09
    m09-operate-it:
      # | Run it like you mean it
      title: "Córrelo en serio"  # @src=479a6425bf2b
    m10-station-whole:
      # | Pulse Station, whole
      title: "Pulse Station, entera"  # @src=9895a22ce0c4

lessons:
  m01-l1:
    # | The map: what we teach, what we bookmark, and why both languages
    title: "El mapa: qué enseñamos, qué dejamos como bookmark, y por qué los dos lenguajes"  # @src=3bc1656a148e
    blocks:
      map-check:                      # quiz
        questions:
          m01-l1-q1:
            # | Three modules from now, a Rust compiler error mentions lifetimes, a concept
            # | this course lists as signposted, never taught. What does the 80/20 contract
            # | say you do?
            prompt: "Tres módulos más adelante, un error del compilador de Rust menciona los tiempos de vida, un concepto que este curso lista como señalizado, nunca enseñado. ¿Qué dice el contrato 80/20 que hagas?"  # @src=7674154bcaad
            # | The seam is the product: this course teaches the 80% of real-world patterns
            # | and hands you a verified, chapter-level bookmark for the 20% it deliberately
            # | leaves out. Hitting bookmarked territory mid-error is the system working,
            # | the map tells you exactly which chapter answers it.
            explanation: "La costura es el producto: este curso enseña el 80% de los patrones del mundo real y te deja un bookmark verificado a nivel de capítulo para el 20% que deja fuera a propósito. Toparte con territorio con bookmark en medio de un error es el sistema funcionando, el mapa te dice exactamente qué capítulo lo responde."  # @src=e7dc068197f6
            options:                 # source order — keep it
              a:
                # | Open the bookmarked chapter for that concept, read what you need, come
                # | back
                label: "Abre el capítulo con bookmark de ese concepto, lee lo que necesites, vuelve"  # @src=3189535e2f40
                # | A signpost is an address, not a warning. You open the one chapter the
                # | map points at, take what the error needs, and go back to the lab you
                # | were in; one chapter at point of need is the whole deal.
                feedback: "Un letrero es una dirección, no una advertencia. Abres el único capítulo al que apunta el mapa, tomas lo que el error necesita y vuelves al lab en el que estabas; un capítulo en el punto de necesidad es todo el trato."  # @src=4dd7b8a0252a
              c:
                # | Treat it as a gap in the course's coverage and look for a more complete
                # | course
                label: "Trátalo como un hueco en la cobertura del curso y busca un curso más completo"  # @src=1c0b4ff047fe
                # | It's not a gap, it's the design. The lesson that signposted lifetimes
                # | told you exactly where the full treatment lives; a course that taught
                # | everything would be the pile, not the map.
                feedback: "No es un hueco, es el diseño. La lección que señalizó los tiempos de vida te dijo exactamente dónde vive el tratamiento completo; un curso que enseñara todo sería el montón, no el mapa."  # @src=ea95fdf08f46
              b:
                # | Pause the course and work through The Rust Book front to back before
                # | continuing
                label: "Pausa el curso y trabaja The Rust Book de cabo a rabo antes de continuar"  # @src=a9496fbe39f5
                # | That's the thousand-hour trap the map exists to prevent. The bookmarks
                # | are chapter-level and pulled at point of need, nobody shipping read the
                # | whole pile first.
                feedback: "Esa es la trampa de mil horas que el mapa existe para prevenir. Los bookmarks son a nivel de capítulo y se sacan en el punto de necesidad, nadie que entrega leyó todo el montón primero."  # @src=63df00798d73
              d:
                # | Keep editing the code until the error clears, since lifetimes are never
                # | taught here
                label: "Sigue editando el código hasta que el error se despeje, ya que los tiempos de vida nunca se enseñan aquí"  # @src=b6492501fcf3
                # | Making an error go away is not the same as knowing why it went away, and
                # | lifetimes are where that gap bites hardest. Never taught here means the
                # | map hands you the chapter, not that you get to skip the reading.
                feedback: "Hacer que un error desaparezca no es lo mismo que saber por qué desapareció, y los tiempos de vida son donde ese hueco muerde más fuerte. Nunca enseñado aquí quiere decir que el mapa te da el capítulo, no que te toque saltarte la lectura."  # @src=ea2052d16c0a
          m01-l1-q2:
            # | drift-labs/protocol-v2, one flagship Solana repo, splits almost 50/50 by
            # | bytes: TypeScript 5,746,893 vs Rust 5,533,370. What is that number evidence
            # | FOR?
            prompt: "drift-labs/protocol-v2, un repo emblemático de Solana, se divide casi 50/50 por bytes: TypeScript 5,746,893 vs Rust 5,533,370. ¿DE QUÉ es evidencia ese número?"  # @src=d544a3bbc17d
            # | The single best 'why both languages' stat the research found: inside one
            # | production repo, the on-chain Rust and the client-side TypeScript are nearly
            # | equal by weight. That's the shape of the job, and the shape of this course.
            explanation: "El mejor dato de 'por qué los dos lenguajes' que encontró la investigación, de lejos: dentro de un solo repo de producción, el Rust on-chain y el TypeScript del lado del cliente son casi iguales en peso. Esa es la forma del trabajo, y la forma de este curso."  # @src=3e48d20d53d2
            options:                 # source order — keep it
              d:
                # | Most of that TypeScript is tests and scripts, so only the Rust half is
                # | the shipped product
                label: "La mayor parte de ese TypeScript son pruebas y scripts, así que solo la mitad de Rust es el producto entregado"  # @src=0f5ae9e01270
                # | Tests are in there, but so are the SDK and every client an integrator
                # | imports. That surface ships, gets versioned and breaks users when it
                # | regresses, which is why the split sits near half rather than drifting to
                # | the program.
                feedback: "Ahí hay pruebas, pero también están el SDK y cada cliente que un integrador importa. Esa superficie se entrega, se versiona y rompe usuarios cuando hace regresión, que es por lo que la división se queda cerca de la mitad en lugar de irse hacia el programa."  # @src=cdd28c399d3b
              b:
                # | Production Solana products pair a Rust program with a TypeScript client,
                # | one product needs both
                label: "Los productos de Solana en producción emparejan un programa de Rust con un cliente de TypeScript, un producto necesita los dos"  # @src=2b9de6b13190
                # | One product, two languages, nearly fifty-fifty by weight. The Rust is
                # | the on-chain program; the TypeScript is the SDK, the clients and the
                # | tests that every user and integrator actually touches.
                feedback: "Un producto, dos lenguajes, casi cincuenta-cincuenta en peso. Rust es el programa on-chain; TypeScript es el SDK, los clientes y las pruebas que cada usuario e integrador de verdad toca."  # @src=a53cfe884370
              c:
                # | The two languages are interchangeable on this stack, so a developer can
                # | pick whichever they prefer
                label: "Los dos lenguajes son intercambiables en este stack, así que un dev puede elegir el que prefiera"  # @src=14d962d5f69a
                # | They sit at different layers, not the same one: Rust where the program
                # | runs, TS where users and tooling live. Interchangeable would mean
                # | picking one; the byte split shows shipping teams pick both.
                feedback: "Están en capas distintas, no en la misma: Rust donde corre el programa, TS donde viven los usuarios y el tooling. Intercambiables querría decir elegir uno; la división por bytes muestra que los equipos que entregan eligen los dos."  # @src=e099faba58f3
              a:
                # | Solana teams are mid-migration from TypeScript to Rust, so Rust alone is
                # | the safer bet
                label: "Los equipos de Solana están a mitad de migración de TypeScript a Rust, así que Rust solo es la apuesta más segura"  # @src=270b1d19c65a
                # | There's no migration in that number, both halves are load-bearing and
                # | growing. The Rust is the on-chain program; the TS is its SDK, clients,
                # | and tests. Neither replaces the other.
                feedback: "No hay ninguna migración en ese número, las dos mitades son estructurales y están creciendo. Rust es el programa on-chain; TS es su SDK, sus clientes y sus pruebas. Ninguno reemplaza al otro."  # @src=355b8628c45e
          m01-l1-q3:
            # | You open the MDN Core Scripting honesty check and the async unit, promises,
            # | callbacks, is genuinely new to you. What's the honest move?
            prompt: "Abres el chequeo de honestidad de MDN Core Scripting y la unidad de async, promises, callbacks, es genuinamente nueva para ti. ¿Cuál es la jugada honesta?"  # @src=d115697d5166
            # | The prerequisite box is honesty, not gatekeeping: this course maps FROM 'can
            # | program in some language, including JS async basics.' The MDN check,
            # | explicitly including the async unit, is the cheapest possible insurance
            # | against hitting module 2 without the promise model.
            explanation: "La caja de prerrequisitos es honestidad, no un filtro de entrada: este curso mapea DESDE 'puedes programar en algún lenguaje, incluidos los básicos de async de JS'. El chequeo de MDN, que incluye explícitamente la unidad de async, es el seguro más barato posible contra llegar al módulo 2 sin el modelo de promises."  # @src=ad70469cbff1
            options:                 # source order — keep it
              a:
                # | Skip it, the course reteaches async from scratch in the TypeScript
                # | modules anyway
                label: "Sáltalo, el curso vuelve a enseñar async desde cero en los módulos de TypeScript de todas formas"  # @src=0372708029d1
                # | It doesn't: m02-l3 opens with a five-minute promise-model recap and then
                # | builds concurrency discipline ON promise literacy. A recap is not a
                # | first course in async.
                feedback: "No lo hace: m02-l3 abre con un repaso de cinco minutos sobre el modelo de promises y después construye disciplina de concurrencia SOBRE alfabetización en promises. Un repaso no es un primer curso de async."  # @src=339936fc8e28
              b:
                # | Continue, async only becomes relevant once the Rust modules introduce
                # | tokio
                label: "Continúa, async solo se vuelve relevante una vez que los módulos de Rust introducen tokio"  # @src=303116aaa6ca
                # | Async arrives much earlier than tokio: the TypeScript fleet in module 2
                # | is built on promises, await, and cancellation. Arriving without the
                # | model means stalling exactly there.
                feedback: "Async llega mucho antes que tokio: la flota de TypeScript en el módulo 2 está construida sobre promises, await y cancelación. Llegar sin el modelo quiere decir atascarte exactamente ahí."  # @src=897570642eac
              c:
                # | Do MDN's async unit first, it's free, m02-l3 builds on it, and the
                # | course will wait
                label: "Haz primero la unidad de async de MDN, es gratis, m02-l3 construye sobre ella y el curso va a esperar"  # @src=1e2278ffa60a
                # | The cheapest possible insurance. m02-l3 spends five minutes recapping
                # | the promise model and then builds cancellation and concurrency
                # | discipline on top of it, so the unit is what that lesson assumes you
                # | already hold.
                feedback: "El seguro más barato posible. m02-l3 pasa cinco minutos repasando el modelo de promises y después construye cancelación y disciplina de concurrencia encima, así que la unidad es lo que esa lección asume que ya tienes."  # @src=640eae8b7858
              d:
                # | Start now and open the async unit later, the delay usually costs nothing
                label: "Empieza ahora y abre la unidad de async después, la demora normalmente no cuesta nada"  # @src=3be6071fc587
                # | Deferring doesn't remove the cost, it moves it into module 2, where a
                # | five-minute recap assumes the model you skipped. The detour is cheap
                # | before the lab and expensive in the middle of it.
                feedback: "Diferirlo no quita el costo, lo mueve al módulo 2, donde un repaso de cinco minutos asume el modelo que te saltaste. El desvío es barato antes del lab y caro en medio de él."  # @src=cdcf2d763b37
          m01-l1-q4:
            # | The lesson states a hard requirement: your station repo will be PUBLIC. What
            # | actually depends on that?
            prompt: "La lección declara un requisito duro: el repo de tu estación va a ser PÚBLICO. ¿Qué depende en realidad de eso?"  # @src=c1cc1906e27f
            # | Three course-critical paths ride on the public repo: Actions is free and
            # | unmetered for public repos on standard runners, the dashboard will fetch
            # | status.json from the repo's public raw URL, and the Vercel Hobby lab
            # | connects a personal public repo. The cost is stated out loud, your station's
            # | code and history are public, and for a portfolio artifact, that's a feature.
            explanation: "Tres rutas críticas del curso van montadas sobre el repo público: Actions es gratis y sin medición para repos públicos en runners estándar, el panel va a traer status.json desde la URL raw pública del repo y el lab de Vercel Hobby conecta un repo personal público. El costo está dicho en voz alta, el código y el historial de tu estación son públicos, y para un artefacto de portafolio, eso es una feature."  # @src=4f72096db1b2
            options:                 # source order — keep it
              a:
                # | The free-CI math, the dashboard's raw status.json fetch, and the Vercel
                # | repo lab
                label: "La matemática de CI gratis, el fetch raw de status.json del panel y el lab del repo de Vercel"  # @src=f856fbb3da5c
                # | Three paths ride on it: Actions is free and unmetered for public repos
                # | on standard runners, the dashboard reads status.json from the public raw
                # | URL, and the Vercel lab connects a personal public repo on the free
                # | tier.
                feedback: "Tres rutas van montadas sobre eso: Actions es gratis y sin medición para repos públicos en runners estándar, el panel lee status.json desde la URL raw pública y el lab de Vercel conecta un repo personal público en el tier gratuito."  # @src=2e0cd6476b18
              c:
                # | Runner speed, public repositories are scheduled onto faster
                # | GitHub-hosted machines
                label: "La velocidad del runner, los repositorios públicos se programan en máquinas más rápidas, alojadas por GitHub"  # @src=d06e1c0a701d
                # | Standard runners are the same hardware either way. What public buys is
                # | billing (free, unmetered on standard runners) and public raw file
                # | access, not speed.
                feedback: "Los runners estándar son el mismo hardware de cualquier forma. Lo que compra ser público es la facturación (gratis, sin medición en runners estándar) y el acceso público a archivos raw, no la velocidad."  # @src=e8a47e343bc9
              d:
                # | Just the free-CI math; the dashboard's raw status.json fetch works on a
                # | private repo too
                label: "Solo la matemática de CI gratis; el fetch raw de status.json del panel también funciona en un repo privado"  # @src=0002f1ec420a
                # | The CI billing is one of the three, not the whole list. A private repo's
                # | raw URL answers only to a credential your dashboard's browser fetch will
                # | not be carrying, so that path breaks too, weeks later and quietly.
                feedback: "La facturación de CI es una de las tres, no toda la lista. La URL raw de un repo privado solo le responde a una credencial que el fetch del navegador de tu panel no va a estar cargando, así que esa ruta también se rompe, semanas después y calladamente."  # @src=b2be7996ba74
              b:
                # | GitHub policy, Actions workflows are only permitted to run on public
                # | repositories
                label: "Política de GitHub, los workflows de Actions solo tienen permiso de correr en repositorios públicos"  # @src=e4ec2f5fc72f
                # | Actions runs fine on private repos, but metered, against a monthly
                # | minutes quota. The course's unmetered-CI path is a public-repo property,
                # | not an Actions requirement.
                feedback: "Actions corre bien en repos privados, pero con medición, contra una cuota mensual de minutos. La ruta de CI sin medición del curso es una propiedad del repo público, no un requisito de Actions."  # @src=8d88a923f338
  m01-l2:
    # | Node 24, TypeScript 7, and your first probe
    title: "Node 24, TypeScript 7 y tu primera sonda"  # @src=ce8937c0e9ed
    blocks:
      latency-stats:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Sort a COPY of the parsed numbers ascending with a numeric comparator, (a, b)
          # | => a - b, before anything else; min and max fall out of the sorted ends.
          0: "Ordena una COPIA de los números parseados de forma ascendente con un comparador numérico, (a, b) => a - b, antes que nada; el min y el max salen solos de los extremos ordenados."  # @src=96c70ea6480d
          # | Nearest-rank p95 on 20 samples: Math.ceil(0.95 * 20) - 1 = 18, so the answer
          # | is the 19th value, not the max.
          1: "p95 nearest-rank en 20 muestras: Math.ceil(0.95 * 20) - 1 = 18, así que la respuesta es el valor número 19, no el max."  # @src=e131f73012d2
          # | Round only the mean, and only at the end: Math.round(x * 100) / 100.
          2: "Redondea solo la media, y solo al final: Math.round(x * 100) / 100."  # @src=0c66709c4be8
        tests:                      # keyed by test case id
          t1:
            # | a single sample is its own min, max, mean, and p95
            description: "una sola muestra es su propio min, max, media y p95"  # @src=fd9f8d735ac7
          t2:
            # | five unsorted samples: min 95, max 340, mean 189, p95 340
            description: "cinco muestras sin ordenar: min 95, max 340, media 189, p95 340"  # @src=0ef35a156f69
          t3:
            # | twenty samples: nearest-rank p95 is the 19th value, not the max
            description: "veinte muestras: el p95 nearest-rank es el valor número 19, no el max"  # @src=e003f7f2c954
          t4:
            # | mean rounds to 2 decimal places (34/3 -> 11.33)
            description: "la media se redondea a 2 lugares decimales (34/3 -> 11.33)"  # @src=1dfac488e06d
      toolchain-check:                      # quiz
        questions:
          m01-l2-q1:
            # | Your probe reads `const first = samples[0]` and the compiler insists `first`
            # | might be undefined even though you 'know' the array isn't empty. Which flag
            # | is speaking, and what is it saying?
            prompt: "Tu sonda lee `const first = samples[0]` y el compilador insiste en que `first` podría ser undefined aunque tú 'sepas' que el array no está vacío. ¿Cuál flag está hablando, y qué está diciendo?"  # @src=43e02fc6ce63
            # | noUncheckedIndexedAccess makes indexed access tell the truth: samples[0] is
            # | T | undefined because index 0 might not exist. One if-check or a bounds
            # | guard narrows it, and the class of bug where an empty batch crashes the
            # | stats line is deleted from your codebase. This is the exact flag the
            # | lesson's planted bug trips.
            explanation: "noUncheckedIndexedAccess hace que el acceso indexado diga la verdad: samples[0] es T | undefined porque el índice 0 podría no existir. Un solo if de verificación o una guarda de límites lo estrecha, y la clase de bug donde un batch vacío rompe la línea de estadísticas queda borrada de tu codebase. Esta es la flag exacta que hace saltar el bug plantado de la lección."  # @src=3ab471dc6f46
            options:                 # source order — keep it
              a:
                # | strict, it bans indexing arrays until you've declared their exact length
                # | in the type
                label: "strict, prohíbe indexar arrays hasta que hayas declarado su largo exacto en el tipo"  # @src=730f90599847
                # | strict is the umbrella, but nothing in it demands fixed-length types.
                # | The specific voice here is the index-access flag, and its ask is a
                # | check, not a length declaration.
                feedback: "strict es el paraguas, pero nada dentro de él exige tipos de largo fijo. La voz específica acá es la flag de acceso indexado, y lo que pide es una verificación, no una declaración de largo."  # @src=948c8c83203c
              b:
                # | noUncheckedIndexedAccess, indexing can miss, so the element type
                # | includes undefined until you check
                label: "noUncheckedIndexedAccess, la indexación puede fallar, así que el tipo del elemento incluye undefined hasta que verifiques"  # @src=d309b56255c5
                # | This is the flag that makes an indexed read tell the truth: index 0
                # | might not exist, so the element type carries undefined until a guard
                # | removes it. What it asks for is a check, not a cast.
                feedback: "Esta es la flag que hace que una lectura indexada diga la verdad: el índice 0 podría no existir, así que el tipo del elemento carga undefined hasta que una guarda lo quite. Lo que pide es una verificación, no un cast."  # @src=b91816610e66
              c:
                # | exactOptionalPropertyTypes, array elements are optional properties and
                # | need the ?. operator everywhere
                label: "exactOptionalPropertyTypes, los elementos de array son propiedades opcionales y necesitan el operador ?. en todas partes"  # @src=75a40922cab3
                # | That flag governs writing undefined into optional object properties, it
                # | has nothing to say about array indexing. Mixing the two up is common
                # | because both surface 'possibly undefined'.
                feedback: "Esa flag gobierna escribir undefined en propiedades opcionales de objeto, no tiene nada que decir sobre la indexación de arrays. Confundir las dos es común porque las dos hacen aparecer 'possibly undefined'."  # @src=375b2451f484
              d:
                # | noUncheckedSideEffectImports, the unchecked flags cover reads whose
                # | target may be missing
                label: "noUncheckedSideEffectImports, las flags unchecked cubren lecturas cuyo target puede faltar"  # @src=ad3e20945ba7
                # | Same word, different job: that one makes a bare import "./x" point at a
                # | file that exists. It never looks at an array read, and the two get
                # | confused because both start with noUnchecked.
                feedback: "Misma palabra, trabajo distinto: esa hace que un import pelado \"./x\" apunte a un archivo que existe. Nunca mira una lectura de array, y las dos se confunden porque las dos empiezan con noUnchecked."  # @src=a2e584f622d4
          m01-l2-q2:
            # | A teammate's setup script runs `npm i -D typescript@7.0.0` and fails. What's
            # | wrong with it?
            prompt: "El script de setup de un compañero de equipo corre `npm i -D typescript@7.0.0` y falla. ¿Qué tiene de malo?"  # @src=0b13960bb306
            # | A registry quirk worth knowing, and worth confirming yourself with `npm view
            # | typescript versions`: no 7.0.0 was ever published in any form, and 7.0.1
            # | exists only as the pre-release 7.0.1-rc, so TypeScript 7's stable line
            # | begins and ends at 7.0.2 (checked 2026-09-06). Prose can say 'TypeScript
            # | 7.0'; install lines must say 7.0.2. It's also a small preview of a
            # | course-long habit: versions are checked against the registry, never assumed.
            explanation: "Una peculiaridad del registro que vale conocer, y que vale confirmar tú mismo con `npm view typescript versions`: nunca se publicó ningún 7.0.0 en ninguna forma, y 7.0.1 existe solo como el pre-release 7.0.1-rc, así que la línea estable de TypeScript 7 empieza y termina en 7.0.2 (verificado 2026-09-06). La prosa puede decir 'TypeScript 7.0'; las líneas de instalación tienen que decir 7.0.2. También es un pequeño anticipo de un hábito que dura todo el curso: las versiones se verifican contra el registro, nunca se asumen."  # @src=30ca83f115e2
            options:                 # source order — keep it
              a:
                # | Nothing, 7.0.0 is the GA release; the registry was probably just having
                # | a bad day
                label: "Nada, 7.0.0 es el release de GA; el registro probablemente solo estaba teniendo un mal día"  # @src=13e87097c0f4
                # | It will fail every day: no stable 7.0.0 was ever published. GA landed
                # | with patch fixes already in, so the first (and only) stable 7.x on the
                # | registry is 7.0.2.
                feedback: "Va a fallar todos los días: nunca se publicó un 7.0.0 estable. GA llegó con arreglos de parche ya adentro, así que el primer (y único) 7.x estable en el registro es 7.0.2."  # @src=f234ef0b8b4e
              c:
                # | There is no stable 7.0.0 or 7.0.1, stable 7.x on the registry is exactly
                # | 7.0.2
                label: "No hay un 7.0.0 ni un 7.0.1 estable, el 7.x estable en el registro es exactamente 7.0.2"  # @src=b3eb38f3a519
                # | GA landed with patch fixes already rolled in, so the stable 7.x line
                # | begins and ends at 7.0.2. Prose can say TypeScript 7.0; an install line
                # | has to say the version the registry actually holds.
                feedback: "GA llegó con arreglos de parche ya incorporados, así que la línea estable 7.x empieza y termina en 7.0.2. La prosa puede decir TypeScript 7.0; una línea de instalación tiene que decir la versión que el registro de verdad tiene."  # @src=4d5a770ae4a3
              b:
                # | Dev dependencies can't pin exact versions, the line needs a caret range
                # | like ^7
                label: "Las dev dependencies no pueden fijar versiones exactas, la línea necesita un rango con caret como ^7"  # @src=60d34b898463
                # | Exact pins are perfectly legal in devDependencies (and often wise for a
                # | compiler). The install fails because that exact version doesn't exist,
                # | not because it's exact.
                feedback: "Los pins exactos son perfectamente legales en devDependencies (y a menudo sabios para un compilador). La instalación falla porque esa versión exacta no existe, no porque sea exacta."  # @src=2070273639bc
              d:
                # | 7.0.0 lives behind the next dist-tag, so the install line needs
                # | typescript@next
                label: "7.0.0 vive detrás del dist-tag next, así que la línea de instalación necesita typescript@next"  # @src=f458756a4b74
                # | The next tag carries a 7.1.0 dev build, not a 7.0.0. Ask the registry
                # | yourself with npm view typescript dist-tags.latest dist-tags.next and
                # | the two tags answer the question in one line.
                feedback: "El tag next carga un build de desarrollo 7.1.0, no un 7.0.0. Pregúntale al registro tú mismo con npm view typescript dist-tags.latest dist-tags.next y los dos tags responden la pregunta en una línea."  # @src=7857702ec150
          m01-l2-q3:
            # | You try wiring typescript-eslint into the fresh TS 7 project and it refuses
            # | to run. Per the lesson's caveat box, what's the actual cause?
            prompt: "Intentas conectar typescript-eslint al proyecto TS 7 recién hecho y se niega a correr. Según la caja de advertencia de la lección, ¿cuál es la causa real?"  # @src=5c9f6fdb93b4
            # | The GA post says it plainly: 'We expect TypeScript 7.1 to ship with a new
            # | (and different) API.' Until then, tooling that programmatically drives the
            # | compiler, typescript-eslint, framework language plugins, stays on 5.x/6.x,
            # | which is why kit itself builds with typescript ^5.9.3. Fastest compiler ever
            # | shipped, ecosystem still catching up: both true at once.
            explanation: "El post de GA lo dice sin rodeos: 'Esperamos que TypeScript 7.1 se entregue con una API nueva (y distinta)'. Hasta entonces, las herramientas que manejan el compilador de forma programática, typescript-eslint, plugins de lenguaje de frameworks, se quedan en 5.x/6.x, y por eso kit mismo se compila con typescript ^5.9.3. El compilador más rápido jamás entregado, el ecosistema todavía poniéndose al día: las dos cosas ciertas a la vez."  # @src=2a2c66049578
            options:                 # source order — keep it
              b:
                # | TS 7 dropped the type-checker layers that lint rules depend on for their
                # | analysis
                label: "TS 7 sacó las capas del verificador de tipos de las que dependen las reglas de lint para su análisis"  # @src=bf79d0640c6f
                # | The checker is fully there, 7.0 matches 6.0's type-checking behavior.
                # | What's missing is the API surface tools use to CALL it; the checking
                # | itself is faster than ever.
                feedback: "El verificador está completamente ahí, 7.0 coincide con el comportamiento de verificación de tipos de 6.0. Lo que falta es la superficie de API que las herramientas usan para LLAMARLO; la verificación en sí es más rápida que nunca."  # @src=d32a2df87fcf
              d:
                # | It needs a global tsc installed on PATH, and npx-scoped installs hide
                # | the local one
                label: "Necesita un tsc global instalado en el PATH, y las instalaciones acotadas a npx esconden el local"  # @src=9991b00ba89a
                # | npx runs the binary in your own node_modules, which is the point of a
                # | per-project pin; nothing here is hidden. A linter does not shell out to
                # | tsc anyway, it asks the compiler API for types.
                feedback: "npx corre el binario en tu propio node_modules, que es el punto de un pin por proyecto; acá no hay nada escondido. Un linter no llama a tsc por shell de todas formas, le pide tipos a la API del compilador."  # @src=4175bb9150f9
              c:
                # | The Go compiler emits different JavaScript output that ESLint's own
                # | parser can't read
                label: "El compilador de Go emite una salida de JavaScript distinta que el parser propio de ESLint no puede leer"  # @src=920d56844451
                # | Linters read your source, not the compiler's output, and the native port
                # | changes the compiler's implementation language, not what it emits. The
                # | gap is the missing programmatic API.
                feedback: "Los linters leen tu fuente, no la salida del compilador, y el port nativo cambia el lenguaje de implementación del compilador, no lo que emite. El hueco es la API programática que falta."  # @src=98bf3d459fc8
              a:
                # | TS 7 shipped with no programmatic API, tools that drive the compiler
                # | wait for 7.1
                label: "TS 7 se entregó sin API programática, las herramientas que manejan el compilador esperan a 7.1"  # @src=4c5b0da2cfdd
                # | The GA post says 7.1 will ship a new and different API, and until it
                # | does, anything that calls the compiler in-process is stuck. That is why
                # | wild repos, kit included, still pin 5.x for tooling.
                feedback: "El post de GA dice que 7.1 va a entregar una API nueva y distinta, y hasta que lo haga, cualquier cosa que llame al compilador en proceso está atascada. Por eso los repos del mundo real, kit incluido, todavía fijan 5.x por las herramientas."  # @src=c7727be8104d
          m01-l2-q4:
            # | A 2022 blog post warns that your ESM probe can't use a CommonJS-era package
            # | without a bundler workaround. In today's Node 24, is that still true?
            prompt: "Un post de blog de 2022 advierte que tu sonda ESM no puede usar un paquete de la era CommonJS sin un workaround de bundler. En el Node 24 de hoy, ¿eso sigue siendo cierto?"  # @src=c5db36c625e7
            # | The lesson spends exactly one paragraph on ESM because that's what the 2026
            # | reality deserves: require(esm) is stable, tsc --init emits ESM-first
            # | settings (module: nodenext), and the decade of interop folklore is now
            # | archaeology. Write ESM, consume what you need, spend the reclaimed attention
            # | on types.
            explanation: "La lección gasta exactamente un párrafo en ESM porque es lo que merece la realidad de 2026: require(esm) es estable, tsc --init emite ajustes ESM-first (module: nodenext), y la década de folclore de interoperabilidad ahora es arqueología. Escribe ESM, consume lo que necesites, gasta la atención recuperada en tipos."  # @src=33d8504d82a8
            options:                 # source order — keep it
              a:
                # | Yes, ESM and CJS still can't share a process without a bundler
                # | translating between them
                label: "Sí, ESM y CJS todavía no pueden compartir un proceso sin un bundler traduciendo entre los dos"  # @src=2cbde2f0dfa4
                # | That was the 2022 reality. Interop has been the runtime's job for a
                # | while now, and the last missing direction, require() of an ES module, is
                # | stable in Node 24.
                feedback: "Esa era la realidad de 2022. La interoperabilidad ha sido trabajo del runtime desde hace un rato, y la última dirección que faltaba, require() de un módulo ES, es estable en Node 24."  # @src=b4cc451d2e3b
              b:
                # | No, require(esm) is stable in Node 24; the war is over, so author
                # | ESM-first and move on
                label: "No, require(esm) es estable en Node 24; la guerra terminó, así que escribe ESM-first y sigue adelante"  # @src=8e006660ba73
                # | The runtime absorbed the problem: require(esm) is stable in Node 24 and
                # | tsc --init already emits ESM-first settings, so the workaround that post
                # | describes is answering a question from 2022.
                feedback: "El runtime absorbió el problema: require(esm) es estable en Node 24 y tsc --init ya emite ajustes ESM-first, así que el workaround que describe ese post está respondiendo una pregunta de 2022."  # @src=a91905f7bcba
              d:
                # | Yes for packages that ship CommonJS, importing one from ESM still needs
                # | a bundler step
                label: "Sí para los paquetes que vienen en CommonJS, importar uno desde ESM todavía necesita una etapa de bundler"  # @src=f8f82a4638ea
                # | That direction has worked in Node for years, and the other one closed in
                # | 24. Consuming a CommonJS package from an ESM file is an import, not a
                # | build step; the bundler was never part of this.
                feedback: "Esa dirección ha funcionado en Node por años, y la otra se cerró en 24. Consumir un paquete CommonJS desde un archivo ESM es un import, no una etapa de build; el bundler nunca fue parte de esto."  # @src=b0b77b2c48e2
              c:
                # | Only if you launch node with the experimental modules flag that enables
                # | cross-loading
                label: "Solo si lanzas node con la flag experimental de módulos que habilita la carga cruzada"  # @src=c65958dd84ac
                # | No flag needed anymore, the docs' own version history marks require(esm)
                # | 'no longer experimental'. Advice that mentions the flag is dated to the
                # | transition years.
                feedback: "Ya no se necesita ninguna flag, el historial de versiones propio de los docs marca require(esm) como 'no longer experimental'. El consejo que menciona la flag está fechado en los años de transición."  # @src=f156ea40f4e2
  m01-l3:
    # | Green means it ran without you: git, GitHub flow, Actions
    title: "Verde quiere decir que corrió sin ti: git, GitHub flow, Actions"  # @src=9af18ae74785
    blocks:
      first-ship-check:                      # quiz
        questions:
          m01-l3-q1:
            # | Your cron is `*/30 * * * *` but the run timestamps land at :07 and :41, and
            # | one half-hour slot has no run at all. What's happening?
            prompt: "Tu cron es `*/30 * * * *` pero los timestamps de las ejecuciones caen a las :07 y :41, y un slot de media hora no tiene ninguna ejecución. ¿Qué está pasando?"  # @src=3c115a1186fc
            # | GitHub's own docs say scheduled events can be delayed during high-load
            # | periods, the start of every hour is named, and 'if the load is sufficiently
            # | high enough, some queued jobs may be dropped.' No delay bound is documented
            # | anywhere, so the station does what monitors do: diff scheduled time against
            # | actual commit time and know YOUR skew. A 30-minute heartbeat tolerates this
            # | fine; that tolerance is a design decision you just made.
            explanation: "Los propios docs de GitHub dicen que los eventos programados pueden retrasarse durante periodos de alta carga, que el comienzo de cada hora está nombrado, y que 'si la carga es suficientemente alta, algunos jobs en fila pueden descartarse'. No hay ningún límite de retraso documentado en ninguna parte, así que la estación hace lo que hacen los monitores: comparar la hora programada contra la hora real del commit y conocer TU desfase. Un latido de 30 minutos tolera esto sin problema; esa tolerancia es una decisión de diseño que acabas de tomar."  # @src=13cdc66c33a2
            options:                 # source order — keep it
              a:
                # | A workflow syntax error, valid cron YAML always fires within the
                # | scheduled minute
                label: "Un error de sintaxis del workflow, el YAML de cron válido siempre se dispara dentro del minuto programado"  # @src=10db771bfd7e
                # | A syntax error would disable the workflow entirely, not shift it.
                # | Drifting timestamps with occasional gaps is the documented behavior of a
                # | healthy schedule on shared infrastructure.
                feedback: "Un error de sintaxis desactivaría el workflow por completo, no lo desplazaría. Los timestamps que se desvían con huecos ocasionales son el comportamiento documentado de un calendario sano en infraestructura compartida."  # @src=f16d795fb901
              b:
                # | Free-tier runs are queued behind paid plans, upgrading buys exact-time
                # | scheduling
                label: "Las ejecuciones del tier gratis se ponen en fila detrás de los planes pagos, subir de plan compra un calendario de hora exacta"  # @src=04f1112c01ea
                # | No plan buys punctual cron, the best-effort language applies to
                # | scheduled events across the platform, and GitHub documents no exact-time
                # | tier. The fix is designing for drift, not paying.
                feedback: "Ningún plan compra un cron puntual, el lenguaje best-effort se aplica a los eventos programados en toda la plataforma, y GitHub no documenta ningún tier de hora exacta. El arreglo es diseñar para la deriva, no pagar."  # @src=833fdf685f55
              c:
                # | Schedules are best-effort, delayed under load, and queued runs even get
                # | dropped
                label: "Los calendarios son best-effort, se retrasan bajo carga, y las ejecuciones en fila hasta se descartan"  # @src=776ae477e260
                # | Best-effort is the platform's own word for it: scheduled events get
                # | delayed when Actions is busy, and under enough load a queued job is
                # | dropped outright. A 30-minute heartbeat is built to shrug at both.
                feedback: "Best-effort es la palabra que usa la propia plataforma para esto: los eventos programados se retrasan cuando Actions está ocupado, y con suficiente carga un job en fila se descarta de plano. Un latido de 30 minutos está hecho para encogerse de hombros ante las dos cosas."  # @src=8f1a4be0614d
              d:
                # | The cron counts 30 minutes from the end of the previous run, so each
                # | start slides later
                label: "El cron cuenta 30 minutos desde el final de la ejecución anterior, así que cada arranque se corre más tarde"  # @src=713ebeb575ae
                # | Cron fields are wall-clock slots, not a stopwatch: */30 means minute 0
                # | and minute 30 of every hour, and the scheduler aims at those ticks
                # | whatever the previous run did. Sliding starts would never leave a slot
                # | empty either.
                feedback: "Los campos de cron son slots de reloj de pared, no un cronómetro: */30 quiere decir minuto 0 y minuto 30 de cada hora, y el scheduler apunta a esos ticks sin importar qué hizo la ejecución anterior. Los arranques que se corren tampoco dejarían nunca un slot vacío."  # @src=a3a309f50db6
          m01-l3-q2:
            # | Your workflow commits status.json back to the repo on every run, a push, to
            # | a repo with a push-triggered workflow. Why doesn't this loop forever?
            prompt: "Tu workflow hace commit de status.json de vuelta al repo en cada ejecución, un push, a un repo con un workflow disparado por push. ¿Por qué esto no entra en un loop para siempre?"  # @src=612e20addb37
            # | The docs state it directly: events triggered by GITHUB_TOKEN will not create
            # | a new workflow run (workflow_dispatch and repository_dispatch excepted), a
            # | deliberate guard against accidental recursion. For the station it's a
            # | feature, not a limitation: the status commit is data, not a signal. When you
            # | someday WANT a downstream workflow to react, the documented path is a PAT or
            # | GitHub App token, a bridge m09-l2's alarm work walks past again.
            explanation: "Los docs lo dicen directamente: los eventos disparados por GITHUB_TOKEN no van a crear una nueva ejecución de workflow (con workflow_dispatch y repository_dispatch exceptuados), una guarda deliberada contra la recursión accidental. Para la estación es una feature, no una limitación: el commit de status es datos, no una señal. Cuando algún día QUIERAS que un workflow aguas abajo reaccione, el camino documentado es un PAT o un token de GitHub App, un puente por el que el trabajo de alarma de m09-l2 vuelve a pasar."  # @src=ce4d71813f03
            options:                 # source order — keep it
              b:
                # | GitHub detects commit loops by content hashing and cancels the repeating
                # | runs
                label: "GitHub detecta loops de commits por hashing de contenido y cancela las ejecuciones que se repiten"  # @src=5a688d6dfaff
                # | There's no content-based loop detection, the guard is simpler and
                # | earlier: the run never starts, because the triggering event came from
                # | the workflow's own token.
                feedback: "No hay detección de loops basada en contenido, la guarda es más simple y más temprana: la ejecución nunca arranca, porque el evento que dispara vino del propio token del workflow."  # @src=9176f5048562
              d:
                # | The bot's message carries a [skip ci] marker, so the workflow ignores
                # | its own push
                label: "El mensaje del bot lleva un marcador [skip ci], así que el workflow ignora su propio push"  # @src=02b6c57d0f81
                # | Look at the commit step: the message is just 'pulse: scheduled probe',
                # | no marker anywhere, and the run still doesn't repeat. What stops it is
                # | who signed the event, not what the message says.
                feedback: "Mira el step de commit: el mensaje es solo 'pulse: scheduled probe', ningún marcador en ninguna parte, y la ejecución igual no se repite. Lo que la detiene es quién firmó el evento, no lo que dice el mensaje."  # @src=e723342bd124
              c:
                # | Workflows are rate-limited to one run per branch per minute, which
                # | breaks the cycle
                label: "Los workflows tienen un límite de tasa de una ejecución por branch por minuto, lo cual rompe el ciclo"  # @src=6068b328ea62
                # | A per-minute cap would slow a loop, not stop it, you'd still burn a run
                # | every minute forever. The actual mechanism is that token-authored events
                # | don't trigger runs at all.
                feedback: "Un tope por minuto frenaría un loop, no lo detendría, igual quemarías una ejecución cada minuto para siempre. El mecanismo real es que los eventos con autor el token no disparan ninguna ejecución."  # @src=d0065670fd3f
              a:
                # | Events triggered by GITHUB_TOKEN don't create new workflow runs, the
                # | recursion guard
                label: "Los eventos disparados por GITHUB_TOKEN no crean nuevas ejecuciones de workflow, la guarda de recursión"  # @src=e70719e376b6
                # | The platform ships the one guard you would otherwise have had to
                # | engineer: an event authored by GITHUB_TOKEN starts no new run, so the
                # | status commit lands as data rather than as a signal.
                feedback: "La plataforma ya trae la única guarda que de otro modo habrías tenido que construir: un evento con autor GITHUB_TOKEN no arranca ninguna ejecución nueva, así que el commit de status cae como datos y no como una señal."  # @src=fa80dd803247
          m01-l3-q3:
            # | You return from a two-month break: repo untouched, no failure emails, and
            # | status.json's last commit is weeks old. What most likely happened?
            prompt: "Vuelves de un descanso de dos meses: repo intacto, sin emails de falla, y el último commit de status.json es de hace semanas. ¿Qué es lo más probable que pasó?"  # @src=6d574d85fe0b
            # | The documented rule: in a public repository, scheduled workflows are
            # | automatically disabled when no repository activity has occurred in 60 days.
            # | No failure notification fires because nothing failed, the schedule just
            # | stopped, silently. Re-enable it in the Actions tab; the keepalive-commit
            # | countermeasure works in practice, though GitHub never defines which activity
            # | resets the clock, the lesson teaches the hedge along with the fix. This
            # | silent-death mode is exactly why m09-l2 builds an alarm for the monitor
            # | itself.
            explanation: "La regla documentada: en un repositorio público, los workflows programados se desactivan automáticamente cuando no ha habido actividad en el repositorio en 60 días. No se dispara ninguna notificación de falla porque nada falló, el calendario simplemente se detuvo, en silencio. Reactívalo en la pestaña Actions; la contramedida del commit keepalive funciona en la práctica, aunque GitHub nunca define qué actividad reinicia el reloj, la lección enseña la salvedad junto con el arreglo. Este modo de muerte silenciosa es exactamente por qué m09-l2 construye una alarma para el monitor mismo."  # @src=4230ee5d3a67
            options:                 # source order — keep it
              c:
                # | Cron workflows expire after 90 days and must be recreated with a fresh
                # | workflow file
                label: "Los workflows de cron expiran después de 90 días y tienen que recrearse con un archivo de workflow nuevo"  # @src=ea5c721b25f6
                # | Workflows never expire, the file is fine and nothing needs rewriting.
                # | The schedule was switched off by the inactivity rule, and one click (or
                # | one commit) brings the existing workflow back.
                feedback: "Los workflows nunca expiran, el archivo está bien y nada necesita reescribirse. El calendario lo apagó la regla de inactividad, y un clic (o un commit) trae de vuelta el workflow existente."  # @src=8958c6c90821
              d:
                # | The commit step is failing on a 403, so runs go red without ever writing
                # | status.json
                label: "El step de commit está fallando con un 403, así que las ejecuciones se ponen en rojo sin escribir nunca status.json"  # @src=bef9a4e6c48e
                # | A 403 on the push step is loud: the step fails, the run goes red, and a
                # | failed scheduled run is exactly what GitHub does mail you about. An
                # | empty inbox with a clean history points at a schedule that stopped, not
                # | one that broke.
                feedback: "Un 403 en el step de push es ruidoso: el step falla, la ejecución se pone en rojo, y una ejecución programada fallida es exactamente lo que GitHub sí te manda por mail. Una bandeja de entrada vacía con un historial limpio apunta a un calendario que se detuvo, no a uno que se rompió."  # @src=b160ae02bce4
              b:
                # | Public-repo schedules auto-disable after 60 days of inactivity, it needs
                # | re-enabling
                label: "Los calendarios de repo público se autodesactivan después de 60 días de inactividad, hay que reactivarlo"  # @src=001cbd949f22
                # | Sixty idle days switches a public repo's schedule off, and since nothing
                # | failed there is nothing to notify you about. One click on the Actions
                # | tab brings the same workflow file back to life.
                feedback: "Sesenta días inactivos apagan el calendario de un repo público, y como nada falló no hay nada de lo que notificarte. Un clic en la pestaña Actions trae el mismo archivo de workflow de vuelta a la vida."  # @src=6711b57b27f6
              a:
                # | The month's free Actions minutes ran out and the workflow paused until
                # | the next cycle
                label: "Los minutos gratis de Actions del mes se acabaron y el workflow se pausó hasta el próximo ciclo"  # @src=a31aea3dda49
                # | Minutes quotas meter private repos, the station's public repo runs
                # | unmetered on standard runners. Nothing here is counting your minutes.
                feedback: "Las cuotas de minutos miden los repos privados, el repo público de la estación corre sin medición en runners estándar. Acá nada está contando tus minutos."  # @src=3a661b59e224
          m01-l3-q4:
            # | A friend warns you: 'CI gets expensive, my team burns through the free
            # | minutes by mid-month.' Why does the station's pipeline cost nothing, this
            # | month and every month?
            prompt: "Un amigo te advierte: 'CI se vuelve caro, mi equipo se quema los minutos gratis para mitad de mes'. ¿Por qué el pipeline de la estación no cuesta nada, este mes y todos los meses?"  # @src=65261a7bb19b
            # | The vendor's line: Actions usage is free for public repositories using
            # | standard GitHub-hosted runners; included minutes (Free plan: 2,000/month)
            # | are a private-repo concept. Two catches worth keeping: larger runners are
            # | ALWAYS charged, even on public repos, so the station stays on ubuntu-latest,
            # | and this economics is exactly why m01-l1 made 'your repo is public' a stated
            # | prerequisite with its cost said out loud.
            explanation: "La línea del proveedor: el uso de Actions es gratis para repositorios públicos que usan runners estándar alojados por GitHub; los minutos incluidos (plan Free: 2,000/mes) son un concepto de repo privado. Dos peros que vale la pena guardar: los runners más grandes SIEMPRE se cobran, incluso en repos públicos, así que la estación se queda en ubuntu-latest, y esta economía es exactamente por qué m01-l1 convirtió 'tu repo es público' en un prerrequisito declarado, diciendo su costo en voz alta."  # @src=c92419dbea60
            options:                 # source order — keep it
              d:
                # | The repo is public, and public repos run free on runners of any size
                # | that GitHub offers you
                label: "El repo es público, y los repos públicos corren gratis en runners de cualquier tamaño que GitHub te ofrezca"  # @src=9e1e68e2dc71
                # | Runner size is the catch. GitHub's billing docs say larger runners are
                # | always charged for, even when used by public repositories, so the free
                # | claim holds on the standard ones, which is all a three-URL probe needs.
                feedback: "El tamaño del runner es el pero. Los docs de facturación de GitHub dicen que los runners más grandes siempre se cobran, incluso cuando los usan repositorios públicos, así que la afirmación de gratis se sostiene en los estándar, que es todo lo que necesita una sonda de tres URLs."  # @src=0199f452bddb
              c:
                # | Public repos on standard runners are unmetered, minutes quotas only
                # | meter private repos
                label: "Los repos públicos en runners estándar no se miden, las cuotas de minutos solo miden repos privados"  # @src=18075de9486d
                # | There is no quota being generously not-consumed here; the meter that
                # | would count these runs does not exist for a public repo on standard
                # | runners. Your friend's team is real, they are just on a private repo.
                feedback: "Acá no hay ninguna cuota que generosamente no se esté consumiendo; el medidor que contaría estas ejecuciones no existe para un repo público en runners estándar. El equipo de tu amigo es de verdad, solo que están en un repo privado."  # @src=fabd2e4ab420
              b:
                # | The 2,000 free monthly minutes comfortably cover a probe that only runs
                # | every 30 minutes
                label: "Los 2,000 minutos gratis mensuales cubren cómodamente una sonda que solo corre cada 30 minutos"  # @src=ed38920b0e43
                # | The arithmetic might even work, but it's answering the wrong question.
                # | The station never touches that quota, because the quota only exists for
                # | private repos.
                feedback: "La aritmética hasta podría funcionar, pero está contestando la pregunta equivocada. La estación nunca toca esa cuota, porque la cuota solo existe para repos privados."  # @src=16a06f840e08
              a:
                # | Every GitHub account gets unlimited Actions minutes across all of its
                # | repos, public or private
                label: "Cada cuenta de GitHub recibe minutos de Actions ilimitados en todos sus repos, públicos o privados"  # @src=111ef7fc86fb
                # | Private repos are metered, the Free plan includes 2,000 minutes a month
                # | and stops there. Your friend's team is real; they're just on private
                # | repos.
                feedback: "Los repos privados se miden, el plan Free incluye 2,000 minutos al mes y ahí se detiene. El equipo de tu amigo es de verdad; solo que están en repos privados."  # @src=ff97d52ade50
  m02-l1:
    # | Make impossible states unrepresentable
    title: "Haz que los estados imposibles sean irrepresentables"  # @src=e19a3c1565c9
    blocks:
      classify-probe-result:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Declare the union first: { kind: 'ok'; latencyMs } | { kind: 'timeout';
          # | budgetMs } | { kind: 'http-error'; status }, each variant carries exactly its
          # | own data.
          0: "Declara la unión primero: { kind: 'ok'; latencyMs } | { kind: 'timeout'; budgetMs } | { kind: 'http-error'; status }, cada variante lleva exactamente sus propios datos."  # @src=1b6a96eae52b
          # | Write parseProbe(kind, value): ProbeResult | null and handle null as 'invalid'
          # | BEFORE the switch, parse at the boundary, then trust the type.
          1: "Escribe parseProbe(kind, value): ProbeResult | null y maneja null como 'invalid' ANTES del switch, parsea en la frontera, después confía en el tipo."  # @src=1bc3a87cf726
          # | Mind the boundaries: 400 and 1000 are both 'degraded'; only strictly above
          # | 1000 is 'down'. A 429 http-error means the target answered, 'degraded', not
          # | 'down'.
          2: "Ojo con los bordes: 400 y 1000 son los dos 'degraded'; solo estrictamente por encima de 1000 es 'down'. Un http-error 429 quiere decir que el target respondió, 'degraded', no 'down'."  # @src=2714e5403e29
          # | Close the switch with default: return assertNever(result), then delete an arm
          # | and watch tsc name it.
          3: "Cierra el switch con default: return assertNever(result), después borra un brazo y mira a tsc nombrarlo."  # @src=0524a68bd963
        tests:                      # keyed by test case id
          t1:
            # | fast ok probe is up
            description: "una sonda ok rápida es up"  # @src=331560986ea1
          t2:
            # | the 400ms boundary is degraded, not up
            description: "el borde de 400ms es degraded, no up"  # @src=af836e096da9
          t3:
            # | 1000ms is still inside the degraded band
            description: "1000ms sigue estando dentro de la banda degraded"  # @src=b1f5a4bff3cc
          t4:
            # | past the degraded band is down
            description: "más allá de la banda degraded es down"  # @src=5cb9e32b2cb3
          t5:
            # | a timeout is down regardless of the budget that expired
            description: "un timeout es down sin importar el presupuesto que expiró"  # @src=b99fb411a78c
          t6:
            # | rate-limited target answered, degraded, not down
            description: "el target con límite de tasa respondió, degraded, no down"  # @src=3997df4b2eb2
          t7:
            # | a 5xx answer is down
            description: "una respuesta 5xx es down"  # @src=f11e2d6d448d
          t8:
            # | unknown kinds parse to null and classify as invalid
            description: "los kinds desconocidos parsean a null y clasifican como invalid"  # @src=06e2f3318467
      check:                      # quiz
        questions:
          m02l1-q1:
            # | Your switch over result.kind ends with `default: return
            # | assertNever(result)`. You add a 'dns-error' variant and tsc errors at that
            # | line. What is the mechanism?
            prompt: "Tu switch sobre result.kind termina con `default: return assertNever(result)`. Agregas una variante 'dns-error' y tsc da error en esa línea. ¿Cuál es el mecanismo?"  # @src=9cb83c078417
            # | Exhaustiveness is a feature you opt into: handle every variant and the
            # | default arm's value narrows to never, which accepts nothing. Add a variant
            # | and the leftover type is no longer never, the compile fails at exactly the
            # | sites that must learn about the new case. It is a refactor checklist the
            # | compiler writes for you.
            explanation: "La exhaustividad es una feature que eliges activar: maneja cada variante y el valor del brazo default se estrecha a never, que no acepta nada. Agrega una variante y el tipo que queda ya no es never, la compilación falla exactamente en los sitios que tienen que aprender del caso nuevo. Es una checklist de refactor que el compilador escribe por ti."  # @src=b857d9440995
            options:                 # source order — keep it
              d:
                # | The classifier's declared return type stopped covering the new variant,
                # | so the default arm's return is what tsc rejects
                label: "El tipo de retorno declarado del clasificador dejó de cubrir la variante nueva, así que el return del brazo default es lo que tsc rechaza"  # @src=d0c5399b422a
                # | Read the error text: it complains about an ARGUMENT not assignable to
                # | parameter of type 'never'. assertNever returns `never`, which is
                # | assignable to any return type, and Verdict never changed.
                feedback: "Lee el texto del error: se queja de un ARGUMENTO que no es asignable al parámetro de tipo 'never'. assertNever devuelve `never`, que es asignable a cualquier tipo de retorno, y Verdict nunca cambió."  # @src=a149cbe6f82b
              b:
                # | Handling every variant narrows result to `never` in the default arm; the
                # | new variant makes it non-never, so the call stops type-checking
                label: "Manejar cada variante estrecha result a `never` en el brazo default; la variante nueva lo vuelve no-never, así que la llamada deja de pasar la verificación de tipos"  # @src=8030f2f1cc6e
                # | Narrowing does all the work: each handled case peels one variant off,
                # | and when the leftover is `never` the call is legal. Add a variant and
                # | the leftover has a value again, so tsc names it at that line.
                feedback: "El narrowing hace todo el trabajo: cada case manejado pela una variante, y cuando lo que queda es `never` la llamada es legal. Agrega una variante y lo que queda tiene un valor otra vez, así que tsc lo nombra en esa línea."  # @src=c1b8f31d1c82
              a:
                # | A dns-error object reached the default arm while the tests ran, so
                # | assertNever threw at runtime and vitest surfaced the failure
                label: "Un objeto dns-error llegó al brazo default mientras corrían las pruebas, así que assertNever lanzó en tiempo de ejecución y vitest sacó la falla a la superficie"  # @src=336d407ae3ed
                # | No code ran, this is a COMPILE error. The never-check works before the
                # | program exists; that is the whole point of opting into exhaustiveness.
                feedback: "No corrió ningún código, este es un error de COMPILACIÓN. La verificación de never funciona antes de que el programa exista; ese es todo el punto de elegir la exhaustividad."  # @src=3539d31b566c
              c:
                # | assertNever is a compiler intrinsic: tsc treats any function with that
                # | name specially inside switch statements and re-checks the case list
                label: "assertNever es un intrínseco del compilador: tsc trata de forma especial a cualquier función con ese nombre dentro de los switch y vuelve a verificar la lista de cases"  # @src=10bf8ad096d2
                # | assertNever is an ordinary function you wrote, the magic is entirely in
                # | narrowing. Any function taking `never` would behave identically.
                feedback: "assertNever es una función común y corriente que escribiste tú, la magia está enteramente en el narrowing. Cualquier función que tome `never` se comportaría igual."  # @src=636580f657b7
          m02l1-q2:
            # | You retype the fetched config from `any` to `unknown`. Nothing about the
            # | runtime changed. What changed for you, day to day?
            prompt: "Vuelves a declarar la config que trajiste de `any` a `unknown`. Nada del runtime cambió. ¿Qué cambió para ti, en el día a día?"  # @src=984ad690f4ce
            # | any is the compiler resigning; unknown is the compiler demanding proof. Same
            # | runtime, opposite defaults: any permits everything and spreads through your
            # | code; unknown permits nothing until narrowed, which forces the
            # | parse-at-the-boundary discipline the fleet is about to adopt.
            explanation: "any es el compilador rindiéndose; unknown es el compilador exigiendo una demostración. Mismo runtime, defaults opuestos: any permite todo y se esparce por tu código; unknown no permite nada hasta que lo estrechas, lo que obliga a la disciplina de parsear en la frontera que la flota está a punto de adoptar."  # @src=2ded6c88f5db
            options:                 # source order — keep it
              b:
                # | unknown makes JSON.parse reject malformed input at runtime, so bad
                # | config now throws at the boundary instead of propagating inward
                label: "unknown hace que JSON.parse rechace la entrada malformada en tiempo de ejecución, así que la config mala ahora lanza en la frontera en vez de propagarse hacia adentro"  # @src=4dee619748f9
                # | Types are erased, unknown adds zero runtime behavior. Runtime rejection
                # | is a parser's job, which is exactly what zod does next lesson.
                feedback: "Los tipos se borran, unknown agrega cero comportamiento en tiempo de ejecución. El rechazo en tiempo de ejecución es trabajo de un parser, que es exactamente lo que hace zod la próxima lección."  # @src=94c70b6b1d2d
              c:
                # | You cannot touch the value until you narrow it, every use site must
                # | prove a shape first, enforced by the compiler
                label: "No puedes tocar el valor hasta que lo estreches, cada sitio de uso tiene que demostrar una forma primero, y el compilador lo hace cumplir"  # @src=8f5ddc9ee5ad
                # | Same erased runtime, opposite defaults: any permits every operation and
                # | asks nothing, unknown permits none until a typeof or discriminant check
                # | has done the proving. The friction is the feature.
                feedback: "Mismo runtime borrado, defaults opuestos: any permite cada operación y no pide nada, unknown no permite ninguna hasta que una verificación de typeof o de discriminante haya hecho la demostración. La fricción es la feature."  # @src=dc03f17ec404
              d:
                # | The compiler infers the config's real shape from the parsed JSON, so its
                # | own fields start autocompleting right away
                label: "El compilador infiere la forma real de la config a partir del JSON parseado, así que sus propios campos empiezan a autocompletarse enseguida"  # @src=f0f9246d7a6b
                # | JSON.parse hands back bytes nobody has proven anything about; there is
                # | no shape to infer from at compile time. Autocomplete arrives only after
                # | you narrow, or after next lesson's schema parses it for you.
                feedback: "JSON.parse devuelve bytes sobre los que nadie demostró nada; no hay ninguna forma de donde inferir en tiempo de compilación. El autocompletado llega solo después de que estreches, o después de que el schema de la próxima lección lo parsee por ti."  # @src=cbfb656e8575
              a:
                # | Nothing meaningful, unknown is an alias for any that style guides
                # | prefer, and both erase to the same JavaScript when compiled
                label: "Nada significativo, unknown es un alias de any que las guías de estilo prefieren, y los dos se borran al mismo JavaScript cuando se compilan"  # @src=252613fb02f4
                # | They erase the same, but they type-check opposite ways: any lets every
                # | operation through unchecked; unknown lets none through until you narrow.
                feedback: "Se borran igual, pero verifican tipos de formas opuestas: any deja pasar cada operación sin verificar; unknown no deja pasar ninguna hasta que estrechas."  # @src=190f41e79ca1
          m02l1-q3:
            # | The lesson's boiled-down v0 record is `{ status: string; latencyMs?: number
            # | }`, the two fields that decide health. `probe.ts` now models that same
            # | outcome as the ProbeResult union. What class of bug did the union delete
            # | outright?
            prompt: "El registro v0 reducido que da la lección es `{ status: string; latencyMs?: number }`, los dos campos que deciden la salud. `probe.ts` ahora modela ese mismo resultado como la unión ProbeResult. ¿Qué clase de bug borró la unión de plano?"  # @src=0aa00d35b1cb
            # | Make impossible states unrepresentable: each variant carries exactly its own
            # | data, so the incoherent combinations simply have no encoding. Validation you
            # | never have to remember beats validation someone will eventually forget, v0's
            # | polite lie was one forgotten check away, permanently.
            explanation: "Haz que los estados imposibles sean irrepresentables: cada variante lleva exactamente sus propios datos, así que las combinaciones incoherentes simplemente no tienen codificación. La validación que nunca tienes que recordar le gana a la validación que alguien tarde o temprano va a olvidar, la mentira cortés de v0 estaba a una verificación olvidada de distancia, permanentemente."  # @src=5860eadf55d3
            options:                 # source order — keep it
              c:
                # | latencyMs is now always defined on every variant, so consumers can drop
                # | their undefined-checks across the whole codebase
                label: "latencyMs ahora está siempre definido en cada variante, así que los consumidores pueden sacar sus verificaciones de undefined de todo el codebase"  # @src=b27b6e9fd22d
                # | latencyMs exists ONLY on the 'ok' variant, that precision is the point.
                # | Consumers narrow to the arm first, then the field is guaranteed within
                # | it.
                feedback: "latencyMs existe SOLO en la variante 'ok', esa precisión es el punto. Los consumidores estrechan al brazo primero, y ahí el campo está garantizado."  # @src=4c19f15373ed
              b:
                # | Status-string typos now throw a TypeError the moment the object is
                # | created, instead of propagating silently into status.json
                label: "Los typos en la cadena de status ahora lanzan un TypeError en el momento en que se crea el objeto, en vez de propagarse en silencio hacia status.json"  # @src=5c59642f4a4e
                # | Nothing throws, the win is at compile time: the typo'd object has no
                # | valid type, so the code that builds it never compiles in the first
                # | place.
                feedback: "Nada lanza, la ganancia es en tiempo de compilación: el objeto con typo no tiene ningún tipo válido, así que el código que lo construye nunca compila, para empezar."  # @src=f0f24bd87477
              a:
                # | Incoherent combinations, 'ok' with no latency, a typo'd 'okay', a
                # | latency on a timeout, can no longer be constructed
                label: "Las combinaciones incoherentes, un 'ok' sin latencia, un 'okay' con typo, una latencia en un timeout, ya no se pueden construir"  # @src=4a1155767e33
                # | Each variant carries exactly its own evidence, so the lies lose their
                # | spelling. They are not caught at some check; there is no longer a way to
                # | write them down in the first place.
                feedback: "Cada variante lleva exactamente su propia evidencia, así que las mentiras pierden su ortografía. No quedan atrapadas en alguna verificación; ya no hay manera de escribirlas, para empezar."  # @src=e683fb054e59
              d:
                # | Malformed records read back from status.json can no longer enter the
                # | fleet, because they match none of the union's variants
                label: "Los registros malformados que se leen de vuelta de status.json ya no pueden entrar a la flota, porque no coinciden con ninguna de las variantes de la unión"  # @src=cdae05bfc9ab
                # | Types are erased, so the union proves things about values your code
                # | constructs and nothing at all about bytes off the disk. Guarding that
                # | border takes a runtime parse, which is why parseProbe returns null.
                feedback: "Los tipos se borran, así que la unión demuestra cosas sobre los valores que construye tu código y nada en absoluto sobre los bytes del disco. Vigilar esa frontera necesita un parseo en tiempo de ejecución, y por eso parseProbe devuelve null."  # @src=0a0de0cdf6f4
          m02l1-q4:
            # | The guest frame: plenty of web2 shops still ship happily on plain
            # | JavaScript. Why did typed languages win web3 specifically?
            prompt: "El marco del invitado: un montón de empresas de web2 todavía entregan felices sobre JavaScript a secas. ¿Por qué los lenguajes tipados ganaron en web3 específicamente?"  # @src=3a62fd0f2ceb
            # | Web2 ships bugs and patches them; web3 frequently cannot, a drained account
            # | does not un-drain. When the cost of a wrong state is unbounded and
            # | irreversible, proofs the compiler can make for free stop being ceremony and
            # | start being the cheapest insurance available. Money code can't shrug.
            explanation: "Web2 entrega bugs y los parcha; web3 muchas veces no puede, una cuenta drenada no se des-drena. Cuando el costo de un estado equivocado es ilimitado e irreversible, las demostraciones que el compilador puede hacer gratis dejan de ser ceremonia y empiezan a ser el seguro más barato disponible. El código que mueve dinero no puede encogerse de hombros."  # @src=145b66e9179c
            options:                 # source order — keep it
              d:
                # | Security audits typically refuse to sign off on untyped code that moves
                # | money, so the ecosystem standardised on types early
                label: "Las auditorías de seguridad por lo general se niegan a firmar código sin tipos que mueve dinero, así que el ecosistema se estandarizó en tipos temprano"  # @src=e99f18558af7
                # | Audits concentrate on the on-chain program, and no review board made
                # | this call for the ecosystem. The pressure came from the cost of being
                # | wrong once, which is why teams adopted types before anyone required it.
                feedback: "Las auditorías se concentran en el programa on-chain, y ningún comité de revisión tomó esta decisión por el ecosistema. La presión vino del costo de equivocarse una vez, y por eso los equipos adoptaron tipos antes de que alguien lo exigiera."  # @src=8b454d18954a
              b:
                # | A wrong state in money code is an irreversible loss, not a bug ticket,
                # | compile-time proof is cheap insurance against it
                label: "Un estado equivocado en el código que mueve dinero es una pérdida irreversible, no un ticket de bug, la demostración en tiempo de compilación es un seguro barato contra eso"  # @src=6e5443f97291
                # | Web2 pays for a wrong state with an apology and a Tuesday fix. On a
                # | ledger designed so nobody can un-happen a transfer, the same mistake has
                # | no refund path, and that is what makes a free proof worth its ceremony.
                feedback: "Web2 paga un estado equivocado con una disculpa y un arreglo el martes. En un ledger diseñado para que nadie pueda deshacer una transferencia, el mismo error no tiene camino de devolución, y eso es lo que hace que una demostración gratis valga su ceremonia."  # @src=2cbfcb407ee6
              c:
                # | Typed code compiles to faster JavaScript, and on-chain fee markets
                # | punish slow clients, so the ecosystem converged on TS for performance
                label: "El código tipado compila a JavaScript más rápido, y los mercados de comisiones on-chain castigan a los clientes lentos, así que el ecosistema convergió en TS por rendimiento"  # @src=56a70899bacc
                # | TS types are erased at compile time, the emitted JS is the same speed.
                # | The win is correctness under stakes, not throughput.
                feedback: "Los tipos de TS se borran en tiempo de compilación, el JS emitido tiene la misma velocidad. La ganancia es la corrección cuando hay algo en juego, no el throughput."  # @src=521fb543b966
              a:
                # | Blockchain VMs execute compiled bytecode, so dynamically-typed languages
                # | cannot target them and typed toolchains became mandatory
                label: "Las VM de blockchain ejecutan bytecode compilado, así que los lenguajes de tipado dinámico no pueden apuntarles y los toolchains tipados se volvieron obligatorios"  # @src=92b4a2ec2207
                # | Client code, the half you are writing, runs wherever JS runs; no VM
                # | forces types on it. The pressure is economic, not technical.
                feedback: "El código de cliente, la mitad que estás escribiendo tú, corre donde sea que corra JS; ninguna VM le fuerza tipos. La presión es económica, no técnica."  # @src=4624593290bf
  m02-l2:
    # | Parse, don't validate: zod at the boundary
    title: "Parse, don't validate: zod en la frontera"  # @src=177826463f5a
    blocks:
      check:                      # quiz
        questions:
          m02l2-q1:
            # | After this lesson, where does the FleetConfig TypeScript type come from, and
            # | why there?
            prompt: "Después de esta lección, ¿de dónde viene el tipo FleetConfig de TypeScript, y por qué de ahí?"  # @src=a16834126eac
            # | The schema is the type's source: z.infer derives the static type from the
            # | runtime parser, so a field renamed in one place redlines every consumer
            # | immediately. Validation that cannot drift from the type is the whole point
            # | of the pattern.
            explanation: "El schema es la fuente del tipo: z.infer deriva el tipo estático del parser de runtime, así que un campo renombrado en un lugar pone en rojo a cada consumidor de inmediato. Una validación que no puede desajustarse del tipo es el punto entero del patrón."  # @src=8ae9816ec637
            options:                 # source order — keep it
              a:
                # | A hand-written interface kept next to the schema, reviewed together in
                # | PRs so the two definitions cannot quietly diverge
                label: "Una interfaz escrita a mano guardada al lado del schema, revisada en conjunto en los PR para que las dos definiciones no puedan divergir calladamente"  # @src=d79f1cf22eb2
                # | Two sources of truth drift no matter how good the reviews are, the drift
                # | drill in the lab shows exactly how. One source must derive from the
                # | other.
                feedback: "Dos fuentes de verdad se desajustan no importa qué tan buenas sean las revisiones, el ejercicio de desajuste en el lab muestra exactamente cómo. Una fuente tiene que derivar de la otra."  # @src=91fc0b14adff
              c:
                # | z.infer<typeof configSchema>, the schema is the single source and the
                # | type derives from it, so the two cannot drift
                label: "z.infer<typeof configSchema>, el schema es la fuente única y el tipo se deriva de él, así que los dos no pueden desajustarse"  # @src=667365eb6110
                # | One definition, read two ways: the schema checks the bytes at runtime
                # | and z.infer reads the static type out of that same object. Rename a
                # | field and every consumer redlines on the next build.
                feedback: "Una definición, leída de dos maneras: el schema verifica los bytes en tiempo de ejecución y z.infer lee el tipo estático de ese mismo objeto. Renombra un campo y cada consumidor se pone en rojo en el siguiente build."  # @src=cd66dc710a7e
              d:
                # | You declare the FleetConfig interface first and zod derives the schema
                # | from it, so the two can never diverge
                label: "Declaras primero la interfaz FleetConfig y zod deriva el schema de ella, así que las dos nunca pueden divergir"  # @src=532d9b742cd9
                # | That direction does not exist, and cannot: types are erased before
                # | anything runs, so there is nothing left for zod to read. The schema is
                # | the value that survives to runtime, which is why it is the source.
                feedback: "Esa dirección no existe, y no puede: los tipos se borran antes de que corra nada, así que no queda nada para que zod lea. El schema es el valor que sobrevive hasta el runtime, y por eso es la fuente."  # @src=48efabee6473
              b:
                # | tsc generates it from a sample pulse.config.json at build time, so the
                # | type always mirrors a real config file
                label: "tsc lo genera a partir de un pulse.config.json de muestra en tiempo de build, así que el tipo siempre refleja un archivo de config de verdad"  # @src=549176b8b795
                # | tsc generates no types from data, and a sample file encodes one example,
                # | not the rules (ranges, refinements, cross-field constraints).
                feedback: "tsc no genera tipos a partir de datos, y un archivo de muestra codifica un ejemplo, no las reglas (rangos, refinamientos, restricciones entre campos)."  # @src=aeec93aef483
          m02l2-q2:
            # | The typo'd config that sailed through v0 now hits configSchema.safeParse at
            # | startup. What happens, and why is that the win?
            prompt: "La config con typo que pasó de largo por v0 ahora golpea configSchema.safeParse en el arranque. ¿Qué pasa, y por qué eso es la victoria?"  # @src=f22e079bdeda
            # | A parser refuses at the door: safeParse returns a result you must inspect,
            # | the boundary prints a field-level error tree, and the process exits before a
            # | hot-loop bug can exist. Compare the hook, v0 ran green on the same file. The
            # | failure didn't move; it became LOUD and EARLY.
            explanation: "Un parser rechaza en la puerta: safeParse devuelve un resultado que tienes que inspeccionar, la frontera imprime un árbol de errores a nivel de campo, y el proceso sale antes de que pueda existir un bug de loop caliente. Compara con la apertura, v0 corría en verde con el mismo archivo. La falla no se mudó; se volvió RUIDOSA y TEMPRANA."  # @src=698745ca8aea
            options:                 # source order — keep it
              d:
                # | safeParse returns { success: false } and the fleet falls back to
                # | defaultConfig, so the cron stays green
                label: "safeParse devuelve { success: false } y la flota recurre a defaultConfig, así que el cron se queda en verde"  # @src=80bc0d389b0e
                # | A silent fallback is the polite lie wearing a schema: the cron goes
                # | green while probing something nobody asked for. parseOrExit exits 1
                # | precisely so the operator sees red and fixes the file.
                feedback: "Un fallback silencioso es la mentira cortés vestida de schema: el cron se pone en verde mientras sondea algo que nadie pidió. parseOrExit sale con 1 precisamente para que el operador vea rojo y arregle el archivo."  # @src=c13b1e1cdcc7
              a:
                # | safeParse returns { success: false } naming the field; the CLI prints it
                # | and exits nonzero, garbage never enters the fleet
                label: "safeParse devuelve { success: false } nombrando el campo; la CLI lo imprime y sale con código distinto de cero, la basura nunca entra a la flota"  # @src=a4abc5e4df47
                # | The failure stopped existing at runtime and became a startup refusal,
                # | with the broken field named twice: once as the unrecognized key you
                # | wrote and once as the required key you starved.
                feedback: "La falla dejó de existir en tiempo de ejecución y se volvió un rechazo en el arranque, con el campo roto nombrado dos veces: una como la clave no reconocida que escribiste y otra como la clave requerida que dejaste sin alimentar."  # @src=399271b64eb1
              c:
                # | safeParse repairs the config by filling the missing field from the
                # | schema's declared default, then logs a warning and continues probing
                label: "safeParse repara la config llenando el campo que falta con el default declarado del schema, después loguea una advertencia y sigue sondeando"  # @src=e3adbf0e7400
                # | Defaults only apply where the schema explicitly declares them, an
                # | unrecognized or missing required field is a refusal, not a silent
                # | repair.
                feedback: "Los defaults solo aplican donde el schema los declara explícitamente, un campo requerido no reconocido o faltante es un rechazo, no una reparación silenciosa."  # @src=cf950b63d61d
              b:
                # | safeParse throws a ZodError from deep inside the probe loop the first
                # | time the missing field is actually read by running code
                label: "safeParse lanza un ZodError desde lo profundo del loop de sondeo la primera vez que el campo que falta es realmente leído por código en ejecución"  # @src=9251e7ae069a
                # | Two misses: safeParse never throws (that is parse), and the check runs
                # | at the BOUNDARY at startup, nothing waits for the probe loop.
                feedback: "Dos fallas: safeParse nunca lanza (eso es parse), y la verificación corre en la FRONTERA al arranque, nada espera al loop de sondeo."  # @src=7972e0254eb6
          m02l2-q3:
            # | You type the default config literal with `satisfies FleetConfig` instead of
            # | the annotation `: FleetConfig`. What did you keep that the annotation would
            # | have cost you?
            prompt: "Escribes el literal de config por defecto con `satisfies FleetConfig` en vez de la anotación `: FleetConfig`. ¿Qué conservaste que la anotación te habría costado?"  # @src=a89524894b87
            # | satisfies is check-without-widening: the compiler verifies the literal
            # | conforms to FleetConfig, but the value keeps its precise inferred types.
            # | With the annotation, every field widens to the declared type and the
            # | compiler forgets what you wrote, the worst of both when you wanted precision
            # | AND the check.
            explanation: "satisfies es verificación sin ensanchamiento: el compilador verifica que el literal se ajuste a FleetConfig, pero el valor conserva sus tipos inferidos precisos. Con la anotación, cada campo se ensancha al tipo declarado y el compilador olvida lo que escribiste, lo peor de los dos cuando querías precisión Y la verificación."  # @src=fa432e342171
            options:                 # source order — keep it
              c:
                # | Nothing, satisfies and the annotation compile identically; satisfies is
                # | newer syntax for the same widening behavior
                label: "Nada, satisfies y la anotación compilan idénticamente; satisfies es sintaxis más nueva para el mismo comportamiento de ensanchamiento"  # @src=0b9ea194e52e
                # | They differ exactly on widening: the annotation makes the literal BE the
                # | broad type; satisfies checks against it while preserving what you
                # | actually wrote.
                feedback: "Difieren exactamente en el ensanchamiento: la anotación hace que el literal SEA el tipo amplio; satisfies verifica contra él mientras conserva lo que realmente escribiste."  # @src=83acbcd711ef
              d:
                # | Freedom to leave fields out, satisfies checks the literal you wrote
                # | while the annotation demands every field
                label: "Libertad de dejar campos afuera, satisfies verifica el literal que escribiste mientras la anotación exige cada campo"  # @src=8ea79e507d4d
                # | Shape checking is identical under both: a missing or typo'd key fails
                # | either way. The only thing satisfies declines to do is overwrite your
                # | literal's own inferred type with the broader one.
                feedback: "La verificación de forma es idéntica en las dos: una clave faltante o con typo falla de cualquier manera. Lo único que satisfies se niega a hacer es sobrescribir el tipo inferido propio de tu literal con el más amplio."  # @src=bb0b08c9158a
              b:
                # | Each field's narrow literal type, the object is still shape-checked, but
                # | what you wrote doesn't widen to string
                label: "El tipo literal estrecho de cada campo, el objeto sigue con la forma verificada, pero lo que escribiste no se ensancha a string"  # @src=b159e2c1a02a
                # | Check without widening: the literal is verified against FleetConfig
                # | exactly as the annotation would, and fleetName stays "pulse-dev" instead
                # | of collapsing to string, so downstream code can branch on the value.
                feedback: "Verificación sin ensanchamiento: el literal se verifica contra FleetConfig exactamente como lo haría la anotación, y fleetName se queda en \"pulse-dev\" en vez de colapsar a string, así que el código aguas abajo puede ramificar en el valor."  # @src=61583126e952
              a:
                # | Runtime validation of the literal, satisfies runs the schema's
                # | refinements against the object when the module first loads
                label: "Validación en tiempo de ejecución del literal, satisfies corre los refinamientos del schema contra el objeto cuando el módulo carga por primera vez"  # @src=ded13aad474e
                # | satisfies is purely compile-time; it never runs anything. Runtime
                # | checking is the schema's job at the boundary.
                feedback: "satisfies es puramente en tiempo de compilación; nunca corre nada. La verificación en tiempo de ejecución es tarea del schema en la frontera."  # @src=3b300480943f
          m02l2-q4:
            # | Your getBalance schema surfaces the lamports value as bigint rather than
            # | number. A teammate calls it overkill for a balance check. What is the honest
            # | justification?
            prompt: "Tu schema de getBalance expone el valor de lamports como bigint en vez de number. Un compañero de equipo lo llama exagerado para una verificación de balance. ¿Cuál es la justificación honesta?"  # @src=31a58564eea2
            # | u64 goes far past 2^53, and doubles round silently beyond it, a balance that
            # | is wrong by a few lamports with no error anywhere is the politest lie in
            # | this course so far. Surface bigint at the schema and keep it bigint through
            # | the code. What a lamport IS, and everything else about accounts, is the
            # | Bitcoin-to-Solana evolution course's territory.
            explanation: "u64 va mucho más allá de 2^53, y los doubles redondean en silencio más allá de eso, un balance equivocado por unos pocos lamports sin error en ninguna parte es la mentira más cortés de este curso hasta ahora. Expón bigint en el schema y mantenlo bigint por todo el código. Qué ES un lamport, y todo lo demás sobre cuentas, es territorio del curso de evolución de Bitcoin a Solana."  # @src=fe8998185193
            options:                 # source order — keep it
              b:
                # | The RPC returns the balance as a quoted string, and comparing strings
                # | numerically fails, so bigint conversion is required for the math to work
                # | at all
                label: "El RPC devuelve el balance como una cadena entre comillas, y comparar cadenas numéricamente falla, así que la conversión a bigint es requerida para que la matemática funcione siquiera"  # @src=7227c418b0d5
                # | getBalance returns a JSON number, not a string, the code would 'work' as
                # | a number, which is what makes the precision loss so quiet.
                feedback: "getBalance devuelve un número JSON, no una cadena, el código 'funcionaría' como número, que es lo que hace la pérdida de precisión tan callada."  # @src=35055d20be89
              a:
                # | JSON.parse already produces bigint for large integers, so the schema is
                # | just preserving what the parser gives it anyway
                label: "JSON.parse ya produce bigint para enteros grandes, así que el schema solo está conservando lo que el parser le da de todas formas"  # @src=b8850a493f2a
                # | JSON.parse produces doubles for every number, that is precisely the
                # | problem. Large u64 values arrive already at risk; the schema routes
                # | around it.
                feedback: "JSON.parse produce doubles para cada número, ese es precisamente el problema. Los valores u64 grandes llegan ya en riesgo; el schema lo rodea."  # @src=fa123c2369ce
              d:
                # | z.bigint() converts the parsed number into a bigint for you, so the
                # | balance value comes out exact as soon as the schema has run
                label: "z.bigint() convierte el número parseado en un bigint por ti, así que el valor del balance sale exacto en cuanto el schema ha corrido"  # @src=0f3b5a8042e7
                # | By the time a schema sees the value the damage is done: JSON.parse
                # | already turned the digits into a double. That is why the reviver
                # | rebuilds the number from ctx.source, and z.bigint() only proves it
                # | happened.
                feedback: "Para cuando un schema ve el valor el daño ya está hecho: JSON.parse ya convirtió los dígitos en un double. Por eso el reviver reconstruye el número a partir de ctx.source, y z.bigint() solo demuestra que pasó."  # @src=7b81e55bc497
              c:
                # | Lamport balances are u64 and can exceed Number.MAX_SAFE_INTEGER, a JS
                # | number rounds silently up there, while bigint keeps every lamport exact
                label: "Los balances de lamports son u64 y pueden exceder Number.MAX_SAFE_INTEGER, un número de JS redondea en silencio allá arriba, mientras bigint mantiene cada lamport exacto"  # @src=d34229820b51
                # | u64 tops out at 18446744073709551615 and a double is exact only to
                # | 9007199254740991. Past that the rounding happens with no error and no
                # | warning, which is the politest lie in the lesson.
                feedback: "u64 topa en 18446744073709551615 y un double es exacto solo hasta 9007199254740991. Más allá de eso el redondeo pasa sin error y sin advertencia, que es la mentira más cortés de la lección."  # @src=3d2dea4f952a
  m02-l3:
    # | Async that survives contact: limits, backoff, cancellation
    title: "Async que sobrevive al contacto: límites, backoff, cancelación"  # @src=c60217a88321
    blocks:
      backoff-schedule:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Attempt 0 must wait exactly baseMs, the exponent is the attempt number itself,
          # | not attempt + 1.
          0: "El intento 0 tiene que esperar exactamente baseMs, el exponente es el número del intento mismo, no attempt + 1."  # @src=b72cf00ae4b5
          # | Apply the cap per delay: Math.min(capMs, baseMs * 2 ** attempt).
          1: "Aplica el techo por delay: Math.min(capMs, baseMs * 2 ** attempt)."  # @src=e56596db3f9d
          # | Edge cases the tests check: retries = 0 returns the empty string, and a cap
          # | BELOW base clamps every delay to the cap.
          2: "Casos borde que revisan las pruebas: retries = 0 devuelve la cadena vacía, y un techo POR DEBAJO de la base aplasta cada delay contra el techo."  # @src=a5cb000818e1
        tests:                      # keyed by test case id
          t1:
            # | doubles from base, fifth attempt hits the cap
            description: "duplica desde la base, el quinto intento choca con el techo"  # @src=eac6caa50a50
          t2:
            # | attempt 0 waits exactly baseMs
            description: "el intento 0 espera exactamente baseMs"  # @src=cbc4e355a2f9
          t3:
            # | cap holds every attempt after it is reached
            description: "el techo mantiene cada intento después de que se alcanza"  # @src=5fe7e6109c3c
          t4:
            # | zero retries means an empty schedule
            description: "cero retries quiere decir un cronograma vacío"  # @src=7477bec0ac63
          t5:
            # | pure powers of two under a matching cap
            description: "potencias puras de dos bajo un techo que coincide"  # @src=a2653c7bfe5c
          t6:
            # | a cap below base clamps every delay
            description: "un techo por debajo de la base aplasta cada delay"  # @src=9679ecf82eb5
      check:                      # quiz
        questions:
          m02l3-q1:
            # | The hook's naive `Promise.all(targets.map(probe))` produced a wall of 429s
            # | from the rate-limited endpoint. What caused the wall?
            prompt: "El `Promise.all(targets.map(probe))` ingenuo del gancho produjo un muro de 429s desde el endpoint rate-limited. ¿Qué causó el muro?"  # @src=cb81b63d1316
            # | Promise.all is a join, not a scheduler: by the time you call it, every
            # | promise you mapped has already started. Fifty probes in one tick is a burst
            # | the target experiences as an attack. Concurrency is a budget you spend, the
            # | pool is how you meter it out.
            explanation: "Promise.all es un join, no un scheduler: para cuando lo llamas, cada promise que mapeaste ya arrancó. Cincuenta sondas en un tick es una ráfaga que el target vive como un ataque. La concurrencia es un presupuesto que gastas, el pool es cómo lo dosificas."  # @src=fc26f871eecf
            options:                 # source order — keep it
              b:
                # | Promise.all runs the probes strictly one after another, so the total run
                # | took longer than the endpoint's request window allowed
                label: "Promise.all corre las sondas estrictamente una después de otra, así que la ejecución total tardó más de lo que daba la ventana de requests del endpoint"  # @src=fa38441b55b3
                # | Backwards, Promise.all is concurrent, not sequential. The probes did not
                # | queue; they stampeded, which is precisely the problem.
                feedback: "Al revés, Promise.all es concurrente, no secuencial. Las sondas no hicieron fila; salieron en estampida, que es precisamente el problema."  # @src=680dfc796ff4
              c:
                # | Node's fetch reuses one connection per host, and the endpoint counts
                # | each request on a shared connection against a stricter per-socket cap
                label: "El fetch de Node reusa una conexión por host, y el endpoint cuenta cada request sobre una conexión compartida contra un tope por socket más estricto"  # @src=56e9d6ccb744
                # | Connection reuse is not the mechanism, the limit was requests per window
                # | per IP, and fifty requests in one instant exhausts it regardless of
                # | sockets.
                feedback: "El reuso de conexión no es el mecanismo, el límite era requests por ventana por IP, y cincuenta requests en un instante lo agotan sin importar los sockets."  # @src=5fc871ccacbf
              a:
                # | Every fetch started in the same instant, all fifty requests hit the
                # | target as one burst, spending the whole rate budget at once
                label: "Cada fetch arrancó en el mismo instante, los cincuenta requests golpearon el target como una sola ráfaga, gastando todo el presupuesto de tasa de una vez"  # @src=dab40dc917e3
                # | The stampede happened at .map: fifty fetches were already in flight
                # | before Promise.all ever saw the array. The join only waited. Concurrency
                # | is a budget you spend, and that spent all of it in one tick.
                feedback: "La estampida pasó en .map: cincuenta fetches ya estaban en vuelo antes de que Promise.all siquiera viera el array. El join solo esperó. La concurrencia es un presupuesto que gastas, y eso gastó todo en un solo tick."  # @src=a73ed26b059c
              d:
                # | Fifty targets simply exceed a cap of 25 requests per second, so a fleet
                # | of that size collects 429s at whatever pace you set it to
                label: "Cincuenta targets simplemente exceden un tope de 25 requests por segundo, así que una flota de ese tamaño junta 429s al ritmo que le pongas"  # @src=832c3b29e16f
                # | The pooled run disproves it: same fifty targets, same server, same cap,
                # | zero 429s once five workers bound the in-flight count. Fleet size never
                # | touched the wall; the burst shape did.
                feedback: "La ejecución con pool lo desmiente: los mismos cincuenta targets, el mismo servidor, el mismo tope, cero 429s una vez que cinco workers acotaron el conteo en vuelo. El tamaño de la flota nunca tocó el muro; la forma de la ráfaga sí."  # @src=8eae1d85da14
          m02l3-q2:
            # | You replace the burst with a hand-rolled pool of 5 workers over a shared
            # | queue. What changed, precisely?
            prompt: "Reemplazas la ráfaga con un pool hecho a mano de 5 workers sobre una fila compartida. ¿Qué cambió, exactamente?"  # @src=d914900ff0bd
            # | A pool is a meter, not an engine: N workers pull from one queue, so
            # | in-flight work never exceeds N. Same fifty probes, same event loop, but the
            # | target now sees a steady trickle it can serve instead of a spike it must
            # | reject. N is tuned against the TARGET'S budget, not your machine.
            explanation: "Un pool es un medidor, no un motor: N workers sacan de una sola fila, así que el trabajo en vuelo nunca excede N. Las mismas cincuenta sondas, el mismo loop de eventos, pero el target ahora ve un goteo estable que puede servir en vez de un pico que tiene que rechazar. N se ajusta contra el presupuesto del TARGET, no contra tu máquina."  # @src=c7cbc336fef1
            options:                 # source order — keep it
              c:
                # | The probes now run in true parallel on five separate threads, so the
                # | fleet finishes faster while sending the same requests
                label: "Las sondas ahora corren en paralelo de verdad sobre cinco threads separados, así que la flota termina más rápido mientras manda los mismos requests"  # @src=9e5fcfce6e18
                # | No threads involved, it is still one event loop with concurrent I/O. The
                # | pool bounds in-flight count; it neither parallelizes CPU nor speeds
                # | anything up.
                feedback: "No hay threads involucrados, sigue siendo un solo loop de eventos con I/O concurrente. El pool acota el conteo en vuelo; no paraleliza la CPU ni acelera nada."  # @src=207c282279af
              d:
                # | Each of the five workers owns a fixed tenth of the queue up front, so
                # | one slow target stalls that whole share
                label: "Cada uno de los cinco workers es dueño por adelantado de un décimo fijo de la fila, así que un target lento traba esa porción entera"  # @src=6bc7627893c2
                # | Nothing is sliced up front. There is one shared index and each worker
                # | grabs whatever is next, so a slow target costs one worker one turn while
                # | the other four keep draining the same queue.
                feedback: "Nada se reparte por adelantado. Hay un solo índice compartido y cada worker agarra lo que sea que venga después, así que un target lento le cuesta a un worker un turno mientras los otros cuatro siguen vaciando la misma fila."  # @src=7138654063c4
              a:
                # | Failed probes are now retried automatically by the pool, since each
                # | worker re-queues its target whenever a request errors
                label: "Las sondas fallidas ahora las reintenta automáticamente el pool, porque cada worker vuelve a poner en la fila su target cada vez que un request da error"  # @src=69daa49ee7f2
                # | Retry is a separate discipline (backoff, next section), the pool only
                # | bounds how many probes run at once; it has no opinion on failures.
                feedback: "El retry es una disciplina aparte (backoff, próxima sección), el pool solo acota cuántas sondas corren a la vez; no tiene opinión sobre las fallas."  # @src=5c4b9c8c1362
              b:
                # | At most five probes are in flight at once; the rest wait in the queue,
                # | same total work, but the burst rate is bounded
                label: "Como mucho cinco sondas están en vuelo a la vez; el resto espera en la fila, mismo trabajo total, pero la tasa de ráfaga está acotada"  # @src=e99220a8b9e2
                # | The pool is a meter, not an engine. Nothing got faster and nothing got
                # | skipped; the only change is that the number of simultaneous requests is
                # | now one you chose against the target's published budget.
                feedback: "El pool es un medidor, no un motor. Nada se volvió más rápido y nada se saltó; el único cambio es que el número de requests simultáneos ahora es uno que elegiste contra el presupuesto publicado del target."  # @src=31bfe4d7df4f
          m02l3-q3:
            # | Your backoff doubles the delay per attempt and caps it, and then you add
            # | random jitter on top. What failure mode does the jitter specifically
            # | prevent?
            prompt: "Tu backoff duplica el delay por intento y le pone techo, y después le agregas jitter aleatorio encima. ¿Qué modo de falla previene el jitter específicamente?"  # @src=ce1226c72ab3
            # | The limit hit all fifty probes in the same window, so pure exponential
            # | backoff has them ALL return at the same future instant, a stampede that
            # | re-triggers the limit, forever. Jitter smears the retries across the window
            # | so the herd thins out. It is a coordination fix, not a speed fix.
            explanation: "El límite golpeó a las cincuenta sondas en la misma ventana, así que el backoff exponencial puro hace que TODAS vuelvan en el mismo instante futuro, una estampida que vuelve a disparar el límite, para siempre. El jitter esparce los retries a lo largo de la ventana para que la manada se adelgace. Es un arreglo de coordinación, no un arreglo de velocidad."  # @src=dbb7bb6a0f3f
            options:                 # source order — keep it
              b:
                # | Rate-limited endpoints reject retries that arrive at predictable
                # | intervals, so randomized delays are required for the requests to be
                # | accepted
                label: "Los endpoints rate-limited rechazan los retries que llegan a intervalos predecibles, así que los delays aleatorizados son necesarios para que los requests sean aceptados"  # @src=21e8eb753885
                # | Servers don't inspect your schedule's predictability, they count
                # | requests per window. The problem jitter solves is on YOUR side:
                # | synchronized clients.
                feedback: "Los servidores no inspeccionan la predictibilidad de tu cronograma, cuentan requests por ventana. El problema que resuelve el jitter está de TU lado: clientes sincronizados."  # @src=f0f744b188cc
              d:
                # | Workers waking together would push more than five probes in flight at
                # | once, and the jitter is what holds the pool to its size
                label: "Los workers despertando juntos empujarían más de cinco sondas en vuelo a la vez, y el jitter es lo que mantiene al pool en su tamaño"  # @src=422ae1933f42
                # | The pool holds itself: a worker cannot start a second probe until its
                # | own returns, whatever time it wakes. Jitter changes when retries land,
                # | never how many run at once.
                feedback: "El pool se sostiene solo: un worker no puede arrancar una segunda sonda hasta que vuelva la suya, sea la hora que sea que despierte. El jitter cambia cuándo aterrizan los retries, nunca cuántos corren a la vez."  # @src=9f84f070bb11
              c:
                # | Probes that got 429'd together retry together, each wave re-triggers the
                # | same limit, and the stampede never drains without jitter
                label: "Las sondas que recibieron 429 juntas reintentan juntas, cada ola vuelve a disparar el mismo límite, y la estampida nunca se vacía sin jitter"  # @src=07ee0043546e
                # | Synchronized failures retry synchronized: the same cap refuses five
                # | probes at once, all five compute the same delay, all five wake in the
                # | same instant, and the herd re-triggers the limit that made it.
                feedback: "Las fallas sincronizadas reintentan sincronizadas: el mismo tope rechaza cinco sondas de una, las cinco calculan el mismo delay, las cinco despiertan en el mismo instante, y la manada vuelve a disparar el límite que la hizo."  # @src=59c5946aa1d1
              a:
                # | Jitter lowers the average wait across attempts, recovering most of the
                # | latency that the exponential doubling schedule costs you
                label: "El jitter baja la espera promedio a través de los intentos, recuperando la mayor parte de la latencia que te cuesta el cronograma de duplicación exponencial"  # @src=edd158596455
                # | Jitter does not exist to make retries faster, spread around the base
                # | delay, the average wait is roughly unchanged. Its job is
                # | desynchronization.
                feedback: "El jitter no existe para hacer los retries más rápidos, esparcido alrededor del delay base, la espera promedio queda más o menos sin cambios. Su trabajo es la desincronización."  # @src=cce5cd6725ed
          m02l3-q4:
            # | A probe's AbortController fires at the 3-second timeout. What does the abort
            # | actually accomplish?
            prompt: "El AbortController de una sonda se dispara en el timeout de 3 segundos. ¿Qué logra el abort en realidad?"  # @src=3bb10edaf9aa
            # | AbortController is how a timeout becomes a first-class outcome: the signal
            # | rejects the fetch, the pool slot frees for the next target, and the failure
            # | lands in the same typed union every other result uses, aggregated, not
            # | thrown. The remote side may finish anyway; what you bought is bounded
            # | waiting and a clean report.
            explanation: "AbortController es cómo un timeout se vuelve un desenlace de primera clase: el signal rechaza el fetch, el slot del pool se libera para el próximo target, y la falla aterriza en la misma unión tipada que usa cada otro resultado, agregada, no lanzada. El lado remoto puede terminar igual; lo que compraste es espera acotada y un reporte limpio."  # @src=0b3200b15c1d
            options:                 # source order — keep it
              d:
                # | The fetch resolves with a status 0 response at the timeout, which the
                # | probe checks for instead of catching a rejection
                label: "El fetch se resuelve con una respuesta de status 0 en el timeout, que la sonda revisa en vez de capturar un rechazo"  # @src=1a476263a709
                # | An abort rejects the promise, it does not hand back a response to
                # | inspect. That is why probeOnce wraps the await in try/catch and asks
                # | controller.signal.aborted which kind of failure it just caught.
                feedback: "Un abort rechaza la promise, no te devuelve una respuesta para inspeccionar. Por eso probeOnce envuelve el await en try/catch y le pregunta a controller.signal.aborted qué tipo de falla acaba de capturar."  # @src=5afc10cd4c00
              c:
                # | It marks the target as permanently down in the fleet's state, so future
                # | rounds skip probing it until the config is edited
                label: "Marca el target como permanentemente caído en el estado de la flota, así que las rondas futuras se saltan sondearlo hasta que se edite la config"  # @src=ce0029299206
                # | One timeout is one data point, not a verdict, the probe returns a
                # | timeout variant and the target stays in rotation. Trend decisions belong
                # | to the classifier.
                feedback: "Un timeout es un dato, no un veredicto, la sonda devuelve una variante timeout y el target se queda en rotación. Las decisiones de tendencia le pertenecen al clasificador."  # @src=c02b1bdd0eca
              a:
                # | It rejects the in-flight fetch on your side, freeing the pool slot, the
                # | outcome lands as a typed timeout variant
                label: "Rechaza el fetch en vuelo de tu lado, liberando el slot del pool, el desenlace aterriza como una variante timeout tipada"  # @src=d839872538b7
                # | The catch sees signal.aborted, returns the timeout variant carrying the
                # | budget it blew, and the worker takes the next target. Reclaiming the
                # | slot, and getting a row you can report, is the whole win.
                feedback: "El catch ve signal.aborted, devuelve la variante timeout llevando el presupuesto que reventó, y el worker toma el próximo target. Recuperar el slot, y quedarte con una fila que puedes reportar, es todo el triunfo."  # @src=dde93768670b
              b:
                # | It instructs the remote server to stop processing the request, so no
                # | further work happens on either side of the connection
                label: "Le indica al servidor remoto que deje de procesar el request, así que no pasa más trabajo en ninguno de los dos lados de la conexión"  # @src=6795b7dce1d9
                # | Cancellation is local and cooperative, the request you already sent may
                # | still complete server-side. What you reclaim is your own slot and your
                # | own certainty.
                feedback: "La cancelación es local y cooperativa, el request que ya mandaste igual puede completarse del lado del servidor. Lo que recuperas es tu propio slot y tu propia certeza."  # @src=2714329e6300
  m02-l4:
    # | Tests are probes for your code: vitest
    title: "Las pruebas son sondas para tu código: vitest"  # @src=dd7e6e4b04c6
    blocks:
      check:                      # quiz
        questions:
          m02l4-q1:
            # | You wired `vitest run` as a job the cron's probe step `needs:`. Why must the
            # | TESTS gate the CRON, specifically, rather than just running on pushes?
            prompt: "Cableaste `vitest run` como un job que el step de probe del cron declara en su `needs:`. ¿Por qué tienen que ponerle barrera al CRON las PRUEBAS, específicamente, en vez de solo correr en los pushes?"  # @src=538459a31f87
            # | Scheduled workflows run the latest commit on the default branch, so a bad
            # | merge doesn't fail once, it publishes a lie on schedule, indefinitely, while
            # | looking green. The needs: edge makes the pipeline refuse: no green suite, no
            # | probe, no status.json. That is gate #2 on the one pipeline this course grows
            # | to the capstone.
            explanation: "Los workflows programados corren el último commit del branch por defecto, así que un merge malo no falla una vez, publica una mentira según el calendario, indefinidamente, mientras se ve verde. La arista de needs: hace que el pipeline rechace: sin suite verde, sin sonda, sin status.json. Esa es la barrera #2 en el único pipeline que este curso hace crecer hasta el capstone."  # @src=35eb23defb02
            options:                 # source order — keep it
              c:
                # | Running the tests first warms the runner's dependency cache, so the
                # | probe step starts faster and stays inside the job's time budget
                label: "Correr las pruebas primero calienta el cache de dependencias del runner, así que el step de probe arranca más rápido y se queda dentro del presupuesto de tiempo del job"  # @src=7871badb0583
                # | Cache warmth is incidental, the gate is about correctness of what gets
                # | PUBLISHED, not about speed of the publisher.
                feedback: "El calor del cache es incidental, la barrera es sobre la corrección de lo que se PUBLICA, no sobre la velocidad del publicador."  # @src=9d83266cf29b
              d:
                # | The push-triggered suite already proves what lands on main, so a
                # | scheduled run usually inherits that proof and the edge is ceremony
                label: "La suite disparada por push ya demuestra qué aterriza en main, así que una ejecución programada normalmente hereda esa demostración y la arista es ceremonia"  # @src=4258f6e0a66c
                # | A suite that goes red on a push stops nothing by itself. Without the
                # | needs edge the test job runs beside the probe, so the same run can
                # | commit a fresh status.json while the tests fail next to it.
                feedback: "Una suite que se pone en rojo en un push no detiene nada por sí sola. Sin la arista de needs el job test corre al lado de probe, así que la misma ejecución puede hacer commit de un status.json fresco mientras las pruebas fallan al lado."  # @src=63cf1d39c4e9
              b:
                # | The cron publishes from the default branch on a schedule, ungated, a
                # | broken classifier ships a wrong status.json every thirty minutes
                label: "El cron publica desde el branch por defecto según el calendario, sin barrera, un clasificador roto entrega un status.json equivocado cada treinta minutos"  # @src=4d4a94ece151
                # | A scheduled run takes the latest commit on the default branch and
                # | publishes whatever it produces, with nobody watching. Stalled beats
                # | lying, and the needs edge is what buys the stall.
                feedback: "Una ejecución programada toma el último commit del branch por defecto y publica lo que sea que produzca, sin nadie mirando. Estancado le gana a mentir, y la arista de needs es lo que compra el estancamiento."  # @src=6742f0722eeb
              a:
                # | Scheduled workflows refuse to start when any other workflow in the repo
                # | is failing, so a red test job would block the cron automatically anyway
                label: "Los workflows programados se niegan a arrancar cuando cualquier otro workflow del repo está fallando, así que un job test en rojo bloquearía el cron automáticamente de todas formas"  # @src=3f656a249a60
                # | No such coupling exists, an independent red workflow blocks nothing. The
                # | gate only exists because YOU wrote the needs: edge into the cron's own
                # | workflow.
                feedback: "No existe tal acoplamiento, un workflow rojo independiente no bloquea nada. La barrera existe solo porque TÚ escribiste la arista de needs: dentro del workflow propio del cron."  # @src=ef759cb5697b
          m02l4-q2:
            # | Testing the 5-attempt backoff schedule with real timers takes about fifteen
            # | seconds of wall clock. With vi.useFakeTimers, what changes?
            prompt: "Probar el cronograma de backoff de 5 intentos con timers reales toma alrededor de quince segundos de reloj de pared. Con vi.useFakeTimers, ¿qué cambia?"  # @src=233cbf329bef
            # | Fake timers replace waiting with control: the test advances the clock to
            # | each scheduled instant and asserts what fired. The schedule's exact values
            # | stay pinned, which is the point, because the m02-l3 formula IS a contract,
            # | and the suite runs in milliseconds, which keeps it in the cron's gate
            # | without stretching the pipeline.
            explanation: "Los fake timers reemplazan la espera con control: la prueba adelanta el reloj a cada instante programado y afirma qué se disparó. Los valores exactos del cronograma quedan fijados, que es el punto, porque la fórmula de m02-l3 SÍ ES un contrato, y la suite corre en milisegundos, lo que la mantiene en la barrera del cron sin estirar el pipeline."  # @src=874a2466ab49
            options:                 # source order — keep it
              d:
                # | The suite trades precision for speed, so you assert that roughly five
                # | waits happened instead of pinning each delay's exact value
                label: "La suite cambia precisión por velocidad, así que afirmas que pasaron como cinco esperas en vez de fijar el valor exacto de cada delay"  # @src=f583b2e57fa0
                # | Precision is what the fake clock buys, not what it costs. Landing on 499
                # | and then 500 is the whole exercise, and a roughly-five-waits assertion
                # | is what you would settle for against a real clock.
                feedback: "La precisión es lo que compra el reloj falso, no lo que cuesta. Aterrizar en 499 y después en 500 es todo el ejercicio, y una aserción de como-cinco-esperas es con lo que te conformarías contra un reloj real."  # @src=c2f3c5edc752
              a:
                # | The fake clock shrinks every delay to one millisecond, so the schedule
                # | runs the same code path just fast enough to assert on
                label: "El reloj falso encoge cada delay a un milisegundo, así que el cronograma corre el mismo camino de código lo bastante rápido para poder afirmar sobre él"  # @src=11954756a0da
                # | Delays aren't shrunk, they're not WAITED. The scheduled times keep their
                # | exact values; you jump the clock to them, which is why the assertions
                # | stay exact.
                feedback: "Los delays no se encogen, no se ESPERAN. Los tiempos programados mantienen sus valores exactos; saltas el reloj hasta ellos, que es por qué las aserciones se quedan exactas."  # @src=0ede49335141
              b:
                # | Fake timers only intercept setInterval, so the backoff's promise-based
                # | delays still wait in real time and the suite stays slow
                label: "Los fake timers solo interceptan setInterval, así que los delays basados en promises del backoff todavía esperan en tiempo real y la suite se queda lenta"  # @src=4b4bdf3130b8
                # | vi.useFakeTimers intercepts the timer functions your delays sit on,
                # | advance the clock and the pending timers fire; the pattern is exactly
                # | built for this test.
                feedback: "vi.useFakeTimers intercepta las funciones de timer sobre las que se apoyan tus delays, adelanta el reloj y los timers pendientes se disparan; el patrón está construido exactamente para esta prueba."  # @src=3a522bfbd577
              c:
                # | You advance the clock synchronously past each delay, the exact
                # | 500/1000/2000ms schedule asserts in milliseconds of real time
                label: "Adelantas el reloj sincrónicamente más allá de cada delay, el cronograma exacto de 500/1000/2000ms afirma en milisegundos de tiempo real"  # @src=a0f28ee6b45c
                # | The delays are not shortened, they are simply not waited on. Each
                # | scheduled instant keeps its exact value and you jump the clock onto it,
                # | which is what lets the test pin 500 and 1000 by name.
                feedback: "Los delays no se acortan, simplemente no se esperan. Cada instante programado mantiene su valor exacto y saltas el reloj encima de él, que es lo que deja que la prueba fije 500 y 1000 por nombre."  # @src=12ddf080041a
          m02l4-q3:
            # | Coverage reports 100% on the classifier, and a teammate declares it fully
            # | tested. The lesson's 'signal, not idol' framing says what?
            prompt: "La cobertura reporta 100% sobre el clasificador, y un compañero de equipo lo declara completamente probado. ¿Qué dice el encuadre de 'señal, no ídolo' de la lección?"  # @src=2d9222e7ab4e
            # | Coverage answers 'what never ran?', a genuinely useful signal, because an
            # | untested branch is a probe target nobody is watching. It cannot answer
            # | 'would a bug be caught?', because it counts execution, not assertion
            # | quality. Read the uncovered branches, fix the ones that matter, and never
            # | turn the number into the goal.
            explanation: "La cobertura responde '¿qué nunca corrió?', una señal genuinamente útil, porque una rama sin probar es un target de sonda que nadie está mirando. No puede responder '¿se atraparía un bug?', porque cuenta ejecución, no calidad de las aserciones. Lee las ramas sin cubrir, arregla las que importan, y nunca conviertas el número en la meta."  # @src=6b33d3eac3ba
            options:                 # source order — keep it
              d:
                # | Coverage is noise either way, the honest read is to stop reporting it
                # | and judge the suite in review instead
                label: "La cobertura es ruido de cualquier manera, la lectura honesta es dejar de reportarla y juzgar la suite en el review en cambio"  # @src=150d275666a0
                # | Half the framing gets lost that way. An uncovered branch is a target
                # | with no probe pointed at it, which is worth reading every time; what the
                # | warning rejects is treating the percentage as the goal.
                feedback: "La mitad del encuadre se pierde así. Una rama sin cubrir es un target sin ninguna sonda apuntada, lo cual vale leer cada vez; lo que la advertencia rechaza es tratar el porcentaje como la meta."  # @src=cbecf6d45dec
              b:
                # | 100% line coverage is unreachable in code using assertNever, so the
                # | report itself indicates the tooling was configured wrong
                label: "100% de cobertura de líneas es inalcanzable en código que usa assertNever, así que el reporte mismo indica que las herramientas se configuraron mal"  # @src=2569ab2839b2
                # | Unreachable arms usually show up as the LAST uncovered branches, not as
                # | proof of misconfiguration, and the point stands regardless of the exact
                # | number.
                feedback: "Los brazos inalcanzables normalmente aparecen como las ÚLTIMAS ramas sin cubrir, no como demostración de una mala configuración, y el punto se sostiene sin importar el número exacto."  # @src=c2a0722c2230
              c:
                # | Coverage measures assertion strength per branch, so 100% genuinely does
                # | mean each behavior is checked, the framing warns only against gaming the
                # | metric
                label: "La cobertura mide la fuerza de las aserciones por rama, así que 100% sí quiere decir genuinamente que cada comportamiento está verificado, el encuadre advierte solo contra manipular la métrica"  # @src=7d9bf13f86e2
                # | Coverage counts execution, not verification, a suite of tests with no
                # | meaningful assertions can still score 100%. That gap is the whole
                # | warning.
                feedback: "La cobertura cuenta ejecución, no verificación, una suite de pruebas sin aserciones significativas todavía puede sacar 100%. Ese hueco es toda la advertencia."  # @src=74ee32891dac
              a:
                # | 100% proves every line RAN under some test, it proves nothing about
                # | whether the assertions on those lines would catch a wrong answer
                label: "100% demuestra que cada línea CORRIÓ bajo alguna prueba, no demuestra nada sobre si las aserciones de esas líneas atraparían una respuesta equivocada"  # @src=0999eaa5cf60
                # | Coverage counts execution, not verification. A suite that calls every
                # | function and asserts nothing scores perfectly, so the number says where
                # | nobody is looking and nothing about the quality of the looking.
                feedback: "La cobertura cuenta ejecución, no verificación. Una suite que llama a cada función y no afirma nada saca puntaje perfecto, así que el número dice dónde nadie está mirando y nada sobre la calidad de la mirada."  # @src=bd0bd6192866
          m02l4-q4:
            # | You rewrote the classifier's five boundary checks as one test.each table.
            # | Beyond less typing, what did the table buy?
            prompt: "Reescribiste las cinco verificaciones de frontera del clasificador como una sola tabla test.each. Más allá de escribir menos, ¿qué compró la tabla?"  # @src=7ad9e6eb616f
            # | A table test turns the classifier's contract into data: (input, expected)
            # | rows that read like the spec they enforce. When m02-l1's challenge added the
            # | 429-is-degraded rule, that was one row; when a boundary bug is found in
            # | production, the regression pin is one row. The cheapest tests to extend are
            # | the ones most likely to be extended.
            explanation: "Una prueba de tabla convierte el contrato del clasificador en datos: filas (entrada, esperado) que se leen como la spec que hacen cumplir. Cuando el challenge de m02-l1 agregó la regla de que 429 es degraded, eso fue una fila; cuando se encuentra un bug de frontera en producción, el pin de regresión es una fila. Las pruebas más baratas de extender son las más propensas a extenderse."  # @src=a2a8208e4481
            options:                 # source order — keep it
              a:
                # | test.each fans the rows out across worker threads, so the boundary suite
                # | finishes faster as the table grows over time
                label: "test.each despliega las filas a través de worker threads, así que la suite de fronteras termina más rápido a medida que la tabla crece con el tiempo"  # @src=e26ed1e93fcb
                # | Parallelism happens at the file level regardless, the table's value is
                # | in the shape of the spec, not the scheduling.
                feedback: "El paralelismo pasa a nivel de archivo de todas formas, el valor de la tabla está en la forma de la spec, no en la planificación."  # @src=8108ab3f0d8d
              d:
                # | Exhaustiveness, every variant missing a row fails the suite the way a
                # | missing switch arm fails the compiler
                label: "La exhaustividad, cada variante que le falte una fila hace fallar la suite igual que un brazo de switch que falta hace fallar al compilador"  # @src=ffe254391ff5
                # | Nothing audits the table for completeness: a row you forget simply does
                # | not exist and the suite stays green. Exhaustiveness comes from the
                # | switch and assertNever, which is why both live in the source.
                feedback: "Nada audita la tabla por completitud: una fila que olvidas simplemente no existe y la suite se queda verde. La exhaustividad viene del switch y de assertNever, que es por qué los dos viven en la fuente."  # @src=b78858530547
              c:
                # | Table syntax is jest-only in spirit, in vitest it desugars to a
                # | for-loop, so the real win is portability when reading anza's jest repos
                label: "La sintaxis de tabla es solo-de-jest en espíritu, en vitest se desazucara a un for-loop, así que la victoria de verdad es la portabilidad al leer los repos de jest de anza"  # @src=406f3923d14d
                # | test.each is first-class in vitest, no desugaring caveat, and its value
                # | here is spec-shape, not cross-framework reading practice.
                feedback: "test.each es de primera clase en vitest, sin salvedad de desazucarado, y su valor acá es la forma de la spec, no práctica de lectura entre frameworks."  # @src=21eb185f4d72
              b:
                # | The table IS the spec, rendered executable, every boundary pair sits in
                # | one readable grid, and a new edge case is a one-line row
                label: "La tabla SÍ ES la spec, vuelta ejecutable, cada par de fronteras se sienta en una sola cuadrícula legible, y un caso borde nuevo es una fila de una línea"  # @src=02676dea7e1d
                # | Read the rows out loud and you are reading the contract: 399 up, 400
                # | degraded, 1000 degraded, 1001 down. The next rule learned the hard way
                # | costs exactly one line to pin forever.
                feedback: "Lee las filas en voz alta y estás leyendo el contrato: 399 up, 400 degraded, 1000 degraded, 1001 down. La siguiente regla aprendida a la mala cuesta exactamente una línea para fijarla para siempre."  # @src=9e23afdbc3c0
  m03-l1:
    # | package.json is a contract: workspaces, engines, peers
    title: "package.json es un contrato: workspaces, engines, peers"  # @src=a091b00102a8
    blocks:
      semver-range-check:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the two-character operator first: range.startsWith('>=') must be tested
          # | before the single-character forms.
          0: "Verifica primero el operador de dos caracteres: range.startsWith('>=') tiene que probarse antes que las formas de un solo carácter."  # @src=00589785e610
          # | Every operator case is 'slice off the operator, parseSemver the rest, then
          # | compare', the helpers are already written below the graded function.
          1: "Cada caso de operador es 'corta el operador, parseSemver al resto, después compara', los helpers ya están escritos debajo de la función calificada."  # @src=c603a04bb1c0
          # | For the caret: if compare(v, base) < 0 it fails immediately; then same major
          # | when base major > 0, same major AND minor when base major is 0.
          2: "Para el caret: si compare(v, base) < 0 falla de inmediato; después misma major cuando la major de la base > 0, misma major Y misma minor cuando la major de la base es 0."  # @src=30b84cb394bc
          # | The tilde is the caret-zero rule applied at every major: at or above the base,
          # | same major and same minor.
          3: "El tilde es la regla del caret cero aplicada en cada major: en o por encima de la base, misma major y misma minor."  # @src=a58e9ee3b9f0
        tests:                      # keyed by test case id
          t1:
            # | caret admits minor and patch walks inside the major: 7.1.2 satisfies ^7.0.0
            description: "el caret admite caminatas de minor y patch adentro de la major: 7.1.2 satisface ^7.0.0"  # @src=02bd4758a017
          t2:
            # | a new major breaks the caret: 8.2.0 does NOT satisfy ^7.0.0
            description: "una major nueva rompe el caret: 8.2.0 NO satisface ^7.0.0"  # @src=e1bad6bc6ae2
          t3:
            # | tilde admits patch walks: 1.2.9 satisfies ~1.2.3
            description: "el tilde admite caminatas de patch: 1.2.9 satisface ~1.2.3"  # @src=131bcfcde1c9
          t4:
            # | tilde stops at the minor: 1.3.0 does NOT satisfy ~1.2.3
            description: "el tilde para en la minor: 1.3.0 NO satisface ~1.2.3"  # @src=8e7c224c3e37
          t5:
            # | caret-zero rule, patch side: 0.3.10 satisfies ^0.3.9
            description: "regla del caret cero, lado del patch: 0.3.10 satisface ^0.3.9"  # @src=5fa37ff39829
          t6:
            # | caret-zero rule, breaking side: 0.4.0 does NOT satisfy ^0.3.9, under major 0
            # | the minor is the breaking slot
            description: "regla del caret cero, lado de la ruptura: 0.4.0 NO satisface ^0.3.9, bajo major 0 la minor es el slot de ruptura"  # @src=0e31fe8b6dbd
          t7:
            # | >= floors at the base: 6.9.0 satisfies >=6.4.0
            description: ">= pone el piso en la base: 6.9.0 satisface >=6.4.0"  # @src=98c37ecaa1a7
          t8:
            # | >= rejects below the base: 6.3.9 does NOT satisfy >=6.4.0
            description: ">= rechaza por debajo de la base: 6.3.9 NO satisface >=6.4.0"  # @src=1aea032822d3
          t9:
            # | a bare version is an exact pin: 24.20.0 satisfies 24.20.0
            description: "una versión pelada es un pin exacto: 24.20.0 satisface 24.20.0"  # @src=c3c9f35da38e
          t10:
            # | the peer-conflict case from the lab: 7.0.2 does NOT satisfy a ^6.9.0 peer
            # | range
            description: "el caso del conflicto de peers del lab: 7.0.2 NO satisface un rango de peer ^6.9.0"  # @src=11ad39276250
          t11:
            # | caret still floors at its base: 6.8.0 does NOT satisfy ^6.9.0
            description: "el caret igual pone el piso en su base: 6.8.0 NO satisface ^6.9.0"  # @src=4f50fda93c20
      check:                      # quiz
        questions:
          m03l1-q1:
            # | You install helius-sdk (which peers @solana/kit ^6.9.0) and then run `npm i
            # | @solana/kit@latest`, which is two majors ahead. npm refuses with a
            # | peer-conflict error. What is the resolver actually protecting?
            prompt: "Instalas helius-sdk (que declara peer con @solana/kit ^6.9.0) y después corres `npm i @solana/kit@latest`, que está dos majors adelante. npm se niega con un error de conflicto de peers. ¿Qué está protegiendo de verdad el resolvedor?"  # @src=924469a665fe
            # | A peer range is the library saying 'I run alongside a kit YOU provide, in
            # | this range.' Satisfy it and everything links; ignore it and you're running
            # | the library against an API surface it never saw. The durable rule, pin what
            # | your deps peer against, per workspace, matters precisely because the digits
            # | rot: kit shipped two majors in just over nine weeks.
            explanation: "Un rango de peer es la librería diciendo 'corro al lado de un kit que provees TÚ, en este rango.' Satisfácelo y todo enlaza; ignóralo y estás corriendo la librería contra una superficie de API que nunca vio. La regla durable, fija lo que tus deps declaran peer, por workspace, importa precisamente porque los dígitos se pudren: kit entregó dos majors en poco más de nueve semanas."  # @src=424a25cf8aaf
            options:                 # source order — keep it
              d:
                # | You from a stale dependency: the error is npm flagging that helius-sdk
                # | has fallen behind kit's current release line
                label: "A ti de una dependencia desactualizada: el error es npm marcando que helius-sdk se quedó atrás de la línea de releases actual de kit"  # @src=1292c5788ba2
                # | npm has no opinion about staleness; it read the declared ranges and
                # | found no version satisfying all of them. Note the transitive lines in
                # | the error too: @solana-program/* carry their own kit ranges.
                feedback: "npm no tiene opinión sobre la desactualización; leyó los rangos declarados y no encontró ninguna versión que los satisfaga a todos. Fíjate también en las líneas transitivas del error: @solana-program/* cargan sus propios rangos de kit."  # @src=e5f47dc5ff7a
              c:
                # | The declared compatibility contract: helius-sdk was built against kit
                # | 6.x, pin kit to what your deps peer against
                label: "El contrato de compatibilidad declarado: helius-sdk se construyó contra kit 6.x, fija kit a lo que tus deps declaran peer"  # @src=975393300bd4
                # | A peer range records which instances the library has actually been
                # | tested sharing. Forcing kit 8 beside it just moves the failure from
                # | install time, where it is loud, to runtime, where it is quiet.
                feedback: "Un rango de peer registra qué instancias se probó de verdad compartiendo la librería. Forzar kit 8 al lado solo mueve la falla del tiempo de instalación, donde es ruidosa, al tiempo de ejecución, donde es silenciosa."  # @src=a009a2af5b33
              a:
                # | Nothing real, peerDependencies are informational metadata, and the error
                # | is a legacy strictness default you can safely force past
                label: "Nada real, peerDependencies son metadatos informativos, y el error es un default de estrictez heredado por encima del que puedes pasar sin riesgo"  # @src=20512a5f0f53
                # | Modern npm enforces peers because the conflict is real: helius-sdk's
                # | code calls kit APIs from the 6.x line it was built and tested against.
                feedback: "El npm moderno impone los peers porque el conflicto es real: el código de helius-sdk llama a APIs de kit desde la línea 6.x contra la que se construyó y se probó."  # @src=43b5af40af27
              b:
                # | Disk layout, two kit majors cannot be deduped into one node_modules
                # | tree, so the resolver blocks the install to avoid duplication
                label: "El layout de disco, dos majors de kit no pueden deduplicarse en un solo árbol de node_modules, así que el resolvedor bloquea la instalación para evitar la duplicación"  # @src=ff8b161d189a
                # | npm can physically nest conflicting versions; the refusal is about the
                # | declared compatibility contract, not about where files sit on disk.
                feedback: "npm puede anidar físicamente versiones en conflicto; la negativa es sobre el contrato de compatibilidad declarado, no sobre dónde se sientan los archivos en el disco."  # @src=e4c47974cee7
          m03l1-q2:
            # | pulse-core's package.json says `"some-dep": "^6.9.0"`. A teammate asks
            # | exactly which versions a fresh install may resolve to. The correct reading:
            prompt: "El package.json de pulse-core dice `\"some-dep\": \"^6.9.0\"`. Un compañero de equipo pregunta exactamente a qué versiones puede resolver una instalación fresca. La lectura correcta:"  # @src=bdad3aa7a811
            # | ^X.Y.Z admits >=X.Y.Z <(X+1).0.0, everything semver promises is
            # | non-breaking. The one exception is major 0, where the minor becomes the
            # | breaking slot (^0.3.9 admits 0.3.10, never 0.4.0), which is why the
            # | caret-zero rule gets its own tests in this lesson's challenge.
            explanation: "^X.Y.Z admite >=X.Y.Z <(X+1).0.0, todo lo que semver promete que no rompe. La única excepción es major 0, donde la minor se vuelve el slot de ruptura (^0.3.9 admite 0.3.10, nunca 0.4.0), que es por qué la regla del caret cero recibe sus propias pruebas en el challenge de esta lección."  # @src=e0cb4439eeb0
            options:                 # source order — keep it
              d:
                # | Any 6.x release at all, 6.0.0 included, since the caret pins only the
                # | major and ignores the base version
                label: "Cualquier release 6.x, 6.0.0 incluida, ya que el caret solo fija la major e ignora la versión base"  # @src=eeb1c95780d0
                # | The base is a floor, not decoration: 6.0.0 does not satisfy ^6.9.0. You
                # | are asking for the fixes that shipped up to 6.9.0, plus whatever lands
                # | after them without leaving major 6.
                feedback: "La base es un piso, no decoración: 6.0.0 no satisface ^6.9.0. Estás pidiendo los arreglos que se entregaron hasta 6.9.0, más lo que sea que aterrice después de ellos sin salir de major 6."  # @src=d1699104ba6f
              c:
                # | Any version at or above 6.9.0, including future majors, as long as the
                # | publisher followed semver when versioning them
                label: "Cualquier versión en o por encima de 6.9.0, incluyendo majors futuras, mientras quien publica haya seguido semver al versionarlas"  # @src=98270659b884
                # | The caret hard-stops before the next major, that boundary is exactly
                # | where semver says breaking changes live, so no range crosses it on
                # | trust.
                feedback: "El caret para en seco antes de la próxima major, esa frontera es exactamente donde semver dice que viven los cambios de ruptura, así que ningún rango la cruza por confianza."  # @src=8964ceb1d01a
              a:
                # | Anything at or above 6.9.0 but below 7.0.0, minor and patch walks inside
                # | major 6, never a new major
                label: "Cualquier cosa en o por encima de 6.9.0 pero por debajo de 7.0.0, caminatas de minor y patch adentro de major 6, nunca una major nueva"  # @src=c0e705e17a9c
                # | The caret trusts semver's core promise, that breaking changes only ride
                # | a major bump, so it walks minors and patches freely and stops exactly
                # | where breakage is allowed to live.
                feedback: "El caret confía en la promesa central de semver, que los cambios de ruptura solo viajan en un bump de major, así que camina minors y patches libremente y para exactamente donde la ruptura tiene permitido vivir."  # @src=722907f77eb5
              b:
                # | Only versions matching 6.9.x, the caret admits patch releases but treats
                # | a minor bump as a breaking change
                label: "Solo versiones que coincidan con 6.9.x, el caret admite releases de patch pero trata un bump de minor como un cambio de ruptura"  # @src=bbea91dfd7f4
                # | That's the tilde's behavior (~6.9.0). The caret trusts the whole major
                # | line: 6.10, 6.11, anything under 7.
                feedback: "Ese es el comportamiento del tilde (~6.9.0). El caret confía en toda la línea de la major: 6.10, 6.11, cualquier cosa debajo de 7."  # @src=34d987ad2c01
          m03l1-q3:
            # | Why extract pulse-core into a workspace package NOW instead of letting the
            # | dashboard copy the classifier file next lesson?
            prompt: "¿Por qué extraer pulse-core a un paquete de workspace AHORA en vez de dejar que el panel copie el archivo del clasificador la lección que viene?"  # @src=636a24e23314
            # | The honest extraction rule: extract when the second consumer is real, not
            # | speculative. Ours is, m03-l2's dashboard imports the classifier, M7's edge
            # | worker imports the pure core. Copies drift; a workspace package keeps every
            # | consumer on the same code and forces you to design the public surface once.
            explanation: "La regla honesta de extracción: extrae cuando el segundo consumidor sea real, no especulativo. El nuestro lo es, el panel de m03-l2 importa el clasificador, el edge worker de M7 importa el core puro. Las copias se desvían; un paquete de workspace mantiene a cada consumidor sobre el mismo código y te obliga a diseñar la superficie pública una sola vez."  # @src=b9ceccb0f23a
            options:                 # source order — keep it
              b:
                # | A second real consumer is arriving, with the workspace link, fleet and
                # | dashboard import the SAME classifier from one source of truth
                label: "Está llegando un segundo consumidor real, con el link del workspace, la flota y el panel importan el MISMO clasificador desde una sola fuente de verdad"  # @src=fd0dcc8f5be8
                # | Copies drift the week one of them takes a boundary fix, and both stay
                # | green in their own tests while the two dashboards disagree about
                # | production. The link is what makes disagreement impossible.
                feedback: "Las copias se desvían la semana en que una de ellas recibe un arreglo de frontera, y las dos se quedan en verde en sus propias pruebas mientras los dos paneles discrepan sobre producción. El link es lo que vuelve imposible la discrepancia."  # @src=d35b46b354d1
              c:
                # | Vite cannot bundle files that sit outside its project root, so the
                # | dashboard physically cannot reach the fleet's source without a package
                label: "Vite no puede empaquetar archivos que se sientan fuera de la raíz de su proyecto, así que el panel físicamente no puede alcanzar la fuente de la flota sin un paquete"  # @src=54ede0f0dc89
                # | Bundlers can be configured around file locations, the reason is drift:
                # | two copies of the classifier stop agreeing the week one gets a bug fix.
                feedback: "Los bundlers se pueden configurar para rodear la ubicación de los archivos, la razón es la deriva: dos copias del clasificador dejan de coincidir la semana en que una recibe un arreglo de bug."  # @src=527a1dccc13b
              a:
                # | npm requires code to live in its own package before any of it can be
                # | published, so the extraction is publishing paperwork done early
                label: "npm exige que el código viva en su propio paquete antes de que se pueda publicar nada de él, así que la extracción es papeleo de publicación hecho temprano"  # @src=b2ee27f2aa84
                # | You could restructure right before publishing, the extraction's value is
                # | upstream of npm: one source of truth for multiple consumers.
                feedback: "Podrías reestructurar justo antes de publicar, el valor de la extracción está aguas arriba de npm: una sola fuente de verdad para múltiples consumidores."  # @src=29883a64600c
              d:
                # | The classifier has stopped changing, so a package boundary can freeze
                # | that shape in place before the dashboard ever imports a copy of it
                label: "El clasificador dejó de cambiar, así que una frontera de paquete puede congelar esa forma en su lugar antes de que el panel importe siquiera una copia de él"  # @src=d8c3208335ab
                # | Stability is not the trigger; a second consumer is. Code nobody edits is
                # | the safest thing to copy. It is code that takes a fix in one copy and
                # | not the other that makes the boundary worth its ceremony.
                feedback: "La estabilidad no es el disparador; un segundo consumidor sí. El código que nadie edita es la cosa más segura de copiar. Es el código que recibe un arreglo en una copia y no en la otra el que hace que la frontera valga su ceremonia."  # @src=c2c619b417a4
          m03l1-q4:
            # | You're writing the Dockerfile beat later in the course and need pnpm inside
            # | a fresh Node container. The lesson's durable install path is:
            prompt: "Estás escribiendo el beat del Dockerfile más adelante en el curso y necesitas pnpm adentro de un contenedor de Node fresco. El camino de instalación durable de la lección es:"  # @src=1ed0a015c696
            # | The TSC voted corepack out of Node distributions from v25.0.0; it remains in
            # | Node 24 LTS, but a habit that dies on the next LTS is a bad habit. npm i -g
            # | pnpm pinned to a version works everywhere Node does, and it's exactly the
            # | line m06-l3's node image will use.
            explanation: "El TSC votó a corepack afuera de las distribuciones de Node desde v25.0.0; queda en Node 24 LTS, pero un hábito que muere en el próximo LTS es un mal hábito. npm i -g pnpm fijado a una versión funciona en todos lados donde funciona Node, y es exactamente la línea que va a usar la imagen de node de m06-l3."  # @src=d419b5f882a1
            options:                 # source order — keep it
              d:
                # | The official Node base images already carry pnpm alongside npm, so the
                # | Dockerfile can simply call it and move on
                label: "Las imágenes base oficiales de Node ya cargan pnpm al lado de npm, así que el Dockerfile simplemente puede llamarlo y seguir"  # @src=ba764cbae6a7
                # | Those images ship Node and npm and nothing else. The thing that used to
                # | make pnpm appear was corepack, which Node's TSC voted out in 2025, which
                # | is the whole reason the install line is explicit.
                feedback: "Esas imágenes vienen con Node y npm y nada más. La cosa que antes hacía aparecer a pnpm era corepack, que el TSC de Node votó afuera en 2025, que es toda la razón por la que la línea de instalación es explícita."  # @src=d66471659b90
              c:
                # | npm i -g pnpm at a pinned version, npm is always present, and the
                # | explicit pin survives Node's corepack removal
                label: "npm i -g pnpm en una versión fijada, npm siempre está presente, y el pin explícito sobrevive a la eliminación de corepack de Node"  # @src=db0e5e43ad2a
                # | Boring and durable: npm exists on every Node there is, and the digit
                # | sits where a human can read it, matching the packageManager field, the
                # | CI job and M6's Dockerfile.
                feedback: "Aburrido y durable: npm existe en cada Node que hay, y el dígito se sienta donde un humano puede leerlo, coincidiendo con el campo packageManager, el job de CI y el Dockerfile de M6."  # @src=1f53d8352b12
              b:
                # | Nothing to install, the packageManager field makes npm itself delegate
                # | to pnpm automatically on any modern Node
                label: "Nada que instalar, el campo packageManager hace que npm mismo delegue a pnpm automáticamente en cualquier Node moderno"  # @src=741fe6bba362
                # | packageManager is a pin that tools MAY honor; npm does not transform
                # | into pnpm because a field asks it to.
                feedback: "packageManager es un pin que las herramientas PUEDEN honrar; npm no se transforma en pnpm porque un campo se lo pida."  # @src=faf816fb45d9
              a:
                # | corepack enable, corepack ships with every Node release and reads the
                # | packageManager field to activate the pinned pnpm
                label: "corepack enable, corepack viene con cada release de Node y lee el campo packageManager para activar el pnpm fijado"  # @src=974ae8e7174a
                # | That works on Node 24 LTS but not durably: corepack is no longer
                # | distributed with Node 25+, so the habit breaks on the next base image.
                feedback: "Eso funciona en Node 24 LTS pero no de forma durable: corepack ya no se distribuye con Node 25+, así que el hábito se rompe en la próxima imagen base."  # @src=d6a356a27767
  m03-l2:
    # | React as a consumer: the dashboard
    title: "React como consumidor: el panel"  # @src=2ffef5a458e2
    blocks:
      check:                      # quiz
        questions:
          m03l2-q1:
            # | The cron ran 8 minutes ago and committed fresh data, but your board still
            # | shows the old numbers. The network tab shows a 200 on the raw status.json
            # | fetch. Most likely cause?
            prompt: "El cron corrió hace 8 minutos y commiteó datos frescos, pero tu panel todavía muestra los números viejos. La pestaña de red muestra un 200 en el fetch del status.json crudo. ¿Causa más probable?"  # @src=b53f3c18246c
            # | Two delays stack between a probe and a pixel: the cron's own schedule, then
            # | the CDN's cache-control: max-age=300 (probed live, Fastly, strong etag,
            # | MISS→HIT observed). Read it in devtools, then decide: cache-bust with a
            # | query string, or render the staleness honestly with a last-updated
            # | indicator. This lesson does both.
            explanation: "Dos demoras se apilan entre una sonda y un pixel: el propio cronograma del cron, y después el cache-control: max-age=300 del CDN (sondeado en vivo, Fastly, etag fuerte, MISS→HIT observado). Léelo en devtools, y después decide: romper el cache con un query string, o renderizar la desactualización con honestidad con un indicador de última actualización. Esta lección hace las dos."  # @src=514133448445
            options:                 # source order — keep it
              b:
                # | React batched the state update and won't re-render until the next user
                # | interaction forces the component tree to reconcile
                label: "React agrupó la actualización de estado y no va a volver a renderizar hasta que la próxima interacción del usuario fuerce al árbol de componentes a reconciliarse"  # @src=8f14b138fb02
                # | setState from your polling effect re-renders promptly, React isn't
                # | holding data hostage. The stale bytes arrived stale: check the response
                # | headers, not the component.
                feedback: "setState desde tu efecto de polling vuelve a renderizar puntualmente, React no tiene los datos de rehén. Los bytes desactualizados llegaron desactualizados: revisa los headers de respuesta, no el componente."  # @src=e4b49a03feb1
              d:
                # | The effect's empty dependency array means it fetched once on mount and
                # | has not asked for the file again since
                label: "El array de dependencias vacío del efecto significa que hizo fetch una vez al montar y no volvió a pedir el archivo desde entonces"  # @src=ec5881004c1a
                # | The empty array governs how often the EFFECT runs, not how often it
                # | fetches: it starts a setInterval that keeps polling. A board that had
                # | stopped asking would show no request in the network tab at all.
                feedback: "El array vacío gobierna cada cuánto corre el EFECTO, no cada cuánto hace fetch: arranca un setInterval que sigue sondeando. Un panel que hubiera dejado de pedir no mostraría ningún request en la pestaña de red."  # @src=8d23354f0267
              a:
                # | The raw endpoint caches for 5 minutes behind a CDN, your 200 was a cache
                # | HIT; cache-bust or render the staleness
                label: "El endpoint crudo cachea por 5 minutos detrás de un CDN, tu 200 fue un HIT de cache; rompe el cache o renderiza la desactualización"  # @src=4f99750233d7
                # | The stale bytes arrived stale, so no component change helps. max-age=300
                # | with a strong etag through Fastly means your board can trail reality by
                # | the cron interval plus the cache window.
                feedback: "Los bytes desactualizados llegaron desactualizados, así que ningún cambio en el componente ayuda. max-age=300 con un etag fuerte pasando por Fastly significa que tu panel puede ir detrás de la realidad por el intervalo del cron más la ventana de cache."  # @src=86421af22a2f
              c:
                # | GitHub rate-limits raw fetches to one fresh read per 10 minutes per IP
                # | and serves a stale copy for requests in between
                label: "GitHub limita la tasa de los fetch crudos a una lectura fresca cada 10 minutos por IP y sirve una copia desactualizada para los requests del medio"  # @src=e41b6cae4330
                # | No such limit is documented anywhere, the sweep specifically recorded
                # | the ABSENCE of raw.* rate limits. The observable, probed mechanism is
                # | the 5-minute CDN cache.
                feedback: "Ese límite no está documentado en ninguna parte, el barrido registró específicamente la AUSENCIA de rate limits en raw.*. El mecanismo observable y sondeado es el cache de CDN de 5 minutos."  # @src=f17f5e787f86
          m03l2-q2:
            # | raw.githubusercontent serves your status.json with content-type: text/plain,
            # | yet `await res.json()` parses it without complaint. Why?
            prompt: "raw.githubusercontent sirve tu status.json con content-type: text/plain, y sin embargo `await res.json()` lo parsea sin quejarse. ¿Por qué?"  # @src=5f2a19da691b
            # | The WHATWG fetch spec parses the body you asked it to parse, MIME be damned.
            # | That's convenient and slightly dishonest, which is why the lesson shows the
            # | header in devtools: the day you swap in an HTTP library that sniffs
            # | content-type, this exact response becomes a bug report.
            explanation: "La especificación de fetch de WHATWG parsea el cuerpo que le pediste parsear, al diablo con el MIME. Eso es conveniente y un poco deshonesto, que es por qué la lección muestra el header en devtools: el día en que cambies a una librería HTTP que olfatea el content-type, esta respuesta exacta se vuelve un reporte de bug."  # @src=35b198eba56b
            options:                 # source order — keep it
              c:
                # | GitHub's CDN negotiates the type per client: browsers that send an
                # | Accept: application/json header get the correct MIME on the wire
                label: "El CDN de GitHub negocia el tipo por cliente: los navegadores que mandan un header Accept: application/json reciben el MIME correcto en el cable"  # @src=473cf7dc8e77
                # | The probe checked this shape of variance, the headers came back
                # | identical regardless of request headers. No negotiation; it's text/plain
                # | for everyone.
                feedback: "La sonda revisó esta forma de variación, los headers volvieron idénticos sin importar los headers del request. No hay negociación; es text/plain para todos."  # @src=89b4f5432173
              a:
                # | The browser rewrites the content-type to application/json when the URL
                # | ends in .json, so by the time fetch sees it the header is corrected
                label: "El navegador reescribe el content-type a application/json cuando la URL termina en .json, así que para cuando fetch lo ve el header está corregido"  # @src=29776507c00a
                # | Browsers don't rewrite response headers from file extensions, the header
                # | arrives as text/plain and stays that way; the parsing behavior lives in
                # | fetch's spec, not in a rewrite.
                feedback: "Los navegadores no reescriben headers de respuesta a partir de extensiones de archivo, el header llega como text/plain y se queda así; el comportamiento de parseo vive en la especificación de fetch, no en un rewrite."  # @src=746cca23f2b4
              d:
                # | text/plain sits on the fetch spec's own allowlist of JSON-compatible
                # | content types, so this parse is permitted through
                label: "text/plain está en la propia allowlist de la especificación de fetch de content types compatibles con JSON, así que este parseo pasa permitido"  # @src=c405519096c5
                # | No list gets consulted, which is the part worth keeping. json() reads
                # | the body and never asks what the header claimed, so nothing about
                # | text/plain was ever approved for this.
                feedback: "No se consulta ninguna lista, que es la parte que vale guardar. json() lee el cuerpo y nunca pregunta qué afirmaba el header, así que nada sobre text/plain fue aprobado nunca para esto."  # @src=d81087a87341
              b:
                # | Response.json() parses the body as JSON regardless of MIME, though tools
                # | that sniff content-type can still reject it
                label: "Response.json() parsea el cuerpo como JSON sin importar el MIME, aunque las herramientas que olfatean el content-type todavía pueden rechazarlo"  # @src=af3a977c85d5
                # | The fetch spec parses the body you asked it to parse and leaves the
                # | header unread. Convenient, and slightly dishonest: swap in a client that
                # | sniffs the type and this same response becomes a bug report.
                feedback: "La especificación de fetch parsea el cuerpo que le pediste parsear y deja el header sin leer. Conveniente, y un poco deshonesto: cambia a un cliente que olfatee el tipo y esta misma respuesta se vuelve un reporte de bug."  # @src=c9423604f695
          m03l2-q3:
            # | In consumer-level terms: where does the fetched status data LIVE in your
            # | dashboard, and what makes the table repaint when new data arrives?
            prompt: "En términos de nivel consumidor: ¿dónde VIVEN los datos de estado traídos en tu panel, y qué hace que la tabla se repinte cuando llegan datos nuevos?"  # @src=6ff16e7be65c
            # | The whole consumer-level model in one sentence: state is the input, the
            # | component is a pure function of it, the DOM is the output, and setState is
            # | the only doorbell. Everything deeper, context, reducers, server components,
            # | is the client-side mastery course's territory, and the lesson says so by
            # | name.
            explanation: "Todo el modelo de nivel consumidor en una oración: el estado es el input, el componente es una función pura de él, el DOM es la salida, y setState es el único timbre. Todo lo más profundo, context, reducers, server components, es territorio del curso de dominio del lado del cliente, y la lección lo dice con nombre."  # @src=f75e079f501a
            options:                 # source order — keep it
              b:
                # | In a module-level variable next to the component, reassigning it
                # | triggers React's file watcher, which hot-reloads the changed component
                label: "En una variable a nivel de módulo al lado del componente, reasignarla dispara el file watcher de React, que hace hot reload del componente cambiado"  # @src=c672a55ac5a3
                # | Module variables are invisible to React's render cycle (and hot-reload
                # | is a dev-server feature, not a data path). Only state setters schedule
                # | re-renders.
                feedback: "Las variables de módulo son invisibles para el ciclo de render de React (y el hot reload es una feature del servidor de dev, no un camino de datos). Solo los setters de estado agendan re-renders."  # @src=94e65f41fefe
              d:
                # | In the polling effect's closure, where each tick re-runs the effect and
                # | the parsed JSON reaches the table with no setter
                label: "En la closure del efecto de polling, donde cada tick vuelve a correr el efecto y el JSON parseado llega a la tabla sin ningún setter"  # @src=2d94c3ff13e0
                # | Effects run after a render; they do not cause one, and the interval
                # | fires the callback rather than re-running the effect. A value that never
                # | leaves the closure never reaches the JSX the component returned.
                feedback: "Los efectos corren después de un render; no causan uno, y el interval dispara el callback en vez de volver a correr el efecto. Un valor que nunca sale de la closure nunca llega al JSX que devolvió el componente."  # @src=a0a49ad42067
              c:
                # | In a useState hook, the polling effect calls its setter with the parsed
                # | JSON, and that state change is what schedules the re-render
                label: "En un hook useState, el efecto de polling llama a su setter con el JSON parseado, y ese cambio de estado es lo que agenda el re-render"  # @src=9c72af0b32a1
                # | One direction only: state in, render out, pixels last. The setter is the
                # | single doorbell React answers, so anything that has to appear on screen
                # | has to live in state.
                feedback: "Un solo sentido: estado adentro, render afuera, pixeles último. El setter es el único timbre que React atiende, así que cualquier cosa que tenga que aparecer en pantalla tiene que vivir en el estado."  # @src=8eea2d84df7b
              a:
                # | In the DOM itself, React reads the current table contents back on each
                # | poll and patches only the cells whose text changed
                label: "En el DOM mismo, React vuelve a leer el contenido actual de la tabla en cada poll y parcha solo las celdas cuyo texto cambió"  # @src=d857fa1e91d5
                # | React never reads state back out of the DOM, the DOM is output. Data
                # | flows one way: state to render to pixels.
                feedback: "React nunca vuelve a leer el estado desde el DOM, el DOM es salida. Los datos fluyen en un sentido: estado a render a pixeles."  # @src=127c40cf55aa
          m03l2-q4:
            # | The board imports pulse-core's classifier for its status colors instead of
            # | reimplementing the three-line function locally. What does that import
            # | actually prove?
            prompt: "El panel importa el clasificador de pulse-core para sus colores de estado en vez de reimplementar la función de tres líneas localmente. ¿Qué demuestra de verdad ese import?"  # @src=7acfd396b9c4
            # | This is the extraction demonstrated, not asserted: last lesson promised a
            # | second real consumer, and here it is, the exact classifier that gates the
            # | cron now colors the pixels. When m08-l2 adds chain-status rows, the same
            # | import means the fleet, the board, and eventually the edge worker all agree
            # | on what the colors mean.
            explanation: "Esta es la extracción demostrada, no afirmada: la lección pasada prometió un segundo consumidor real, y acá está, el clasificador exacto que le pone barrera al cron ahora colorea los pixeles. Cuando m08-l2 agregue filas de estado de la blockchain, el mismo import significa que la flota, el panel y, con el tiempo, el edge worker están todos de acuerdo en qué significan los colores."  # @src=ad199a7b231b
            options:                 # source order — keep it
              b:
                # | Bundle efficiency: importing from a workspace package lets Vite
                # | tree-shake the classifier to fewer bytes than a local copy would compile
                # | to
                label: "Eficiencia de bundle: importar de un paquete del workspace le permite a Vite hacer tree-shaking del clasificador hasta menos bytes de los que compilaría una copia local"  # @src=fa75ea0e26bb
                # | A three-line local copy would bundle just as small, the win isn't bytes,
                # | it's that two consumers can never drift apart on what 'degraded' means.
                feedback: "Una copia local de tres líneas empaquetaría igual de chica, la victoria no son los bytes, es que dos consumidores nunca pueden desviarse entre sí sobre qué significa 'degraded'."  # @src=45fd09c977a5
              d:
                # | That duplication is worth removing, the same three-line function written
                # | twice is code nobody should repeat
                label: "Esa duplicación vale quitarla, la misma función de tres líneas escrita dos veces es código que nadie debería repetir"  # @src=a057bdecb7fe
                # | Repetition alone is cheap here; three lines twice costs nothing to type.
                # | What the import buys is that the copy which quietly disagrees after
                # | someone retunes the latency band cannot exist.
                feedback: "La repetición por sí sola es barata acá; tres líneas dos veces no cuesta nada tipear. Lo que compra el import es que la copia que discrepa calladita después de que alguien reajusta la banda de latencia no puede existir."  # @src=73b69088edb6
              c:
                # | Type safety: cross-package imports are the only place Vite runs the
                # | TypeScript checker, so the boundary is where type errors get caught
                label: "Seguridad de tipos: los imports entre paquetes son el único lugar donde Vite corre el verificador de TypeScript, así que la frontera es donde se atrapan los errores de tipo"  # @src=56d5ed0a2596
                # | Type-checking covers the whole project regardless of package boundaries,
                # | the import's value is one source of truth, not a special checking mode.
                feedback: "La verificación de tipos cubre todo el proyecto sin importar las fronteras de paquetes, el valor del import es una sola fuente de verdad, no un modo especial de verificación."  # @src=db2fcfd569cf
              a:
                # | The m03-l1 boundary is real: fleet and dashboard demonstrably run the
                # | SAME classification code, one fix reaching both
                label: "La frontera de m03-l1 es real: la flota y el panel demostrablemente corren el MISMO código de clasificación, con un arreglo llegando a los dos"  # @src=4866a3c5f776
                # | Last lesson the extraction was an argument; this line makes it a pixel.
                # | A green row on the board and a green verdict in the cron cannot
                # | disagree, because they are one function with two callers.
                feedback: "La lección pasada la extracción era un argumento; esta línea la vuelve un pixel. Una fila verde en el panel y un veredicto verde en el cron no pueden discrepar, porque son una sola función con dos llamadores."  # @src=849d45e7c4b9
  m03-l3:
    # | Vercel: the URL
    title: "Vercel: la URL"  # @src=23baf6f1bad1
    blocks:
      check-ship:                      # quiz
        questions:
          m03l3-q1:
            # | Your deployed board works from the home page, but sharing the direct link to
            # | /history returns a 404, while the same path works fine under npm run dev.
            # | What fixes production?
            prompt: "Tu panel desplegado funciona desde la página de inicio, pero compartir el link directo a /history devuelve un 404, mientras el mismo path funciona perfecto bajo npm run dev. ¿Qué arregla producción?"  # @src=69eb24ce4f27
            # | The dev server silently rewrites unknown paths to index.html; a production
            # | static host doesn't, until you tell it to. The vercel.json block, source
            # | /(.*), destination /index.html, is the whole fix. Dev-prod asymmetries like
            # | this are why the lesson pokes the PRODUCTION URL, not localhost.
            explanation: "El servidor de dev reescribe en silencio los paths desconocidos a index.html; un host estático de producción no, hasta que le digas. El bloque de vercel.json, source /(.*), destination /index.html, es todo el arreglo. Las asimetrías dev-prod como esta son por qué la lección tantea la URL de PRODUCCIÓN, no localhost."  # @src=41f099c78e35
            options:                 # source order — keep it
              d:
                # | Enable Vite's history fallback in vite.config.ts, the same setting the
                # | dev server uses, so the built site answers unknown paths too
                label: "Activa el history fallback de Vite en vite.config.ts, la misma configuración que usa el servidor de dev, así el sitio construido también responde paths desconocidos"  # @src=d8b60f5cca9d
                # | Dev-server options stop at the dev server; nothing in vite.config.ts
                # | travels onto the CDN. The build emits a directory of real files, and the
                # | host needs its own instruction about paths that are not files.
                feedback: "Las opciones del servidor de dev se detienen en el servidor de dev; nada de vite.config.ts viaja al CDN. El build emite un directorio de archivos reales, y el host necesita su propia instrucción sobre los paths que no son archivos."  # @src=d03c337f1793
              b:
                # | Add the one-block vercel.json rewrite sending every path to /index.html,
                # | the SPA routes client-side, and the host must hand it every request
                label: "Agrega el rewrite de un bloque en vercel.json que manda todo path a /index.html, la SPA rutea del lado del cliente, y el host tiene que pasarle cada request"  # @src=332e41941154
                # | The dev server rewrites unknown paths to index.html as a favor; a
                # | production static host does no favors. The rewrite is you asking the CDN
                # | for that same favor, in writing and in the repo.
                feedback: "El servidor de dev reescribe los paths desconocidos a index.html como favor; un host estático de producción no hace favores. El rewrite eres tú pidiéndole al CDN ese mismo favor, por escrito y en el repo."  # @src=96fb76699e34
              a:
                # | Switch the board to hash-based routing, static hosts can only serve real
                # | files, so path-style routes can never work on a CDN deployment
                label: "Cambia el panel a ruteo basado en hash, los hosts estáticos solo pueden servir archivos reales, así que las rutas estilo path nunca pueden funcionar en un deployment de CDN"  # @src=4bd56b7761c2
                # | Hash routing would dodge the problem, but path-style routes work fine on
                # | static hosts, that's exactly what the rewrite exists for.
                feedback: "El ruteo por hash esquivaría el problema, pero las rutas estilo path funcionan perfecto en hosts estáticos, para eso existe exactamente el rewrite."  # @src=66c973560e1d
              c:
                # | Rebuild with the route pre-rendered, Vite must emit a physical
                # | history/index.html for each route the app defines before a static host
                # | can serve it
                label: "Reconstruye con la ruta pre-renderizada, Vite tiene que emitir un history/index.html físico para cada ruta que la app defina antes de que un host estático pueda servirla"  # @src=9bffa766e2af
                # | Pre-rendering is a real technique but not the requirement here, one
                # | rewrite line makes the CDN serve index.html for any path, and the client
                # | router takes it from there.
                feedback: "El pre-renderizado es una técnica real pero no el requisito acá, una línea de rewrite hace que el CDN sirva index.html para cualquier path, y el router del cliente sigue desde ahí."  # @src=39e23542d57e
          m03l3-q2:
            # | You set STATION_REPO in the Vercel dashboard, redeployed, and
            # | import.meta.env.STATION_REPO is still undefined in the browser. Why?
            prompt: "Seteaste STATION_REPO en el panel de Vercel, redespleagaste, y import.meta.env.STATION_REPO sigue siendo undefined en el navegador. ¿Por qué?"  # @src=1280a7823915
            # | Vite's prefix rule is a safety design: everything in client JS is
            # | world-readable, so exposure must be opt-in, and the ugly prefix IS the
            # | consent form. The same rule read backwards is the security lesson, anything
            # | secret must never wear VITE_, a thread the m09-l2 four-platform secrets
            # | sweep pulls tight.
            explanation: "La regla del prefijo de Vite es un diseño de seguridad: todo lo que está en el JS del cliente es legible por todo el mundo, así que la exposición tiene que ser opt-in, y el prefijo feo ES el formulario de consentimiento. La misma regla leída al revés es la lección de seguridad, cualquier cosa secreta nunca debe usar VITE_, un hilo que el barrido de secretos de cuatro plataformas de m09-l2 tensa."  # @src=b46ce7a39686
            options:                 # source order — keep it
              b:
                # | Env vars are read at runtime, so a static deployment can never see them,
                # | the board would need a serverless function to forward the value
                label: "Las variables de entorno se leen en runtime, así que un deployment estático nunca puede verlas, el panel necesitaría una función serverless que reenvíe el valor"  # @src=092579046922
                # | Vite inlines env values at BUILD time, which works fine for static
                # | output, no function needed. The gate is the prefix rule, not the
                # | architecture.
                feedback: "Vite incrusta los valores de entorno en tiempo de BUILD, lo que funciona perfecto para salida estática, sin necesidad de ninguna función. La barrera es la regla del prefijo, no la arquitectura."  # @src=ccfa5b0dddf3
              c:
                # | Only VITE_-prefixed variables reach client code, rename it
                # | VITE_STATION_REPO; the prefix is the 'this will be public' marker
                label: "Solo las variables con prefijo VITE_ llegan al código del cliente, renómbrala VITE_STATION_REPO; el prefijo es la marca de 'esto va a ser público'"  # @src=9ae6833e2a2f
                # | The prefix is a consent form. Everything in client JavaScript is
                # | world-readable forever, so exposure is opt-in, and reading the rule
                # | backwards gives you the security lesson: nothing secret may wear it.
                feedback: "El prefijo es un formulario de consentimiento. Todo lo que está en el JavaScript del cliente es legible por todo el mundo para siempre, así que la exposición es opt-in, y leer la regla al revés te da la lección de seguridad: nada secreto puede usarlo."  # @src=7f9348a81a63
              d:
                # | Custom values arrive on process.env in the bundle; import.meta.env
                # | carries only Vite's own built-in variables
                label: "Los valores propios llegan en process.env dentro del bundle; import.meta.env solo carga las variables incorporadas de Vite"  # @src=266c161d4c85
                # | There is no process object in a browser bundle, which is why Vite
                # | exposes import.meta.env at all. It carries your own variables happily;
                # | what gates them is the prefix, not the namespace.
                feedback: "No hay ningún objeto process en un bundle de navegador, que es por qué Vite expone import.meta.env en primer lugar. Carga tus propias variables sin problema; lo que les pone barrera es el prefijo, no el namespace."  # @src=36baa027fa67
              a:
                # | Dashboard-set vars only reach preview deployments, production builds
                # | require the values to be committed in a .env.production file in the repo
                label: "Las variables seteadas en el panel solo llegan a los deployments de preview, los builds de producción exigen que los valores estén commiteados en un archivo .env.production en el repo"  # @src=5fd3a7bf91ea
                # | Dashboard vars target any environment you assign them to, and committing
                # | env files to a public repo is the anti-pattern, the issue is the missing
                # | prefix, not the source.
                feedback: "Las variables del panel apuntan a cualquier entorno al que las asignes, y commitear archivos de entorno a un repo público es el antipatrón, el problema es el prefijo que falta, no la fuente."  # @src=24a70551bd11
          m03l3-q3:
            # | You typed vercel in a repo with no config file and got a working deployment.
            # | What did 'zero-config' actually consist of?
            prompt: "Tipeaste vercel en un repo sin ningún archivo de config y obtuviste un deployment que funciona. ¿En qué consistió de verdad el 'zero-config'?"  # @src=96b44ab976ee
            # | The mechanism, described without quoting anyone's marketing: your repo
            # | already declares its framework, build command, and output dir; the platform
            # | reads those declarations and provisions accordingly. Deployment became a
            # | build artifact, which also means the repo is now the single source of truth
            # | for what production looks like.
            explanation: "El mecanismo, descrito sin citar el marketing de nadie: tu repo ya declara su framework, su comando de build y su directorio de salida; la plataforma lee esas declaraciones y provisiona en consecuencia. El deployment se volvió un artefacto de build, lo que también significa que el repo ahora es la única fuente de verdad de cómo se ve producción."  # @src=cbc4bc8b5c35
            options:                 # source order — keep it
              b:
                # | The CLI found your local dist/ folder from the last npm run build and
                # | uploaded those files directly, skipping any remote build step
                label: "El CLI encontró tu carpeta dist/ local del último npm run build y subió esos archivos directo, salteándose cualquier paso de build remoto"  # @src=be2b04e40222
                # | The build runs on Vercel's machines from your source, that's why a
                # | failing build surfaces in THEIR logs, and why git pushes can redeploy
                # | without your laptop.
                feedback: "El build corre en las máquinas de Vercel desde tu código fuente, por eso un build que falla aparece en SUS logs, y por eso los git push pueden redesplegar sin tu laptop."  # @src=a3007594e2d2
              a:
                # | Vercel detected Vite, ran your build on its machines, and put the
                # | emitted dist/ on its CDN, configuration inferred from the repo
                label: "Vercel detectó Vite, corrió tu build en sus máquinas, y puso el dist/ emitido en su CDN, con la configuración inferida del repo"  # @src=8c338d8bab5e
                # | You configured plenty, just in package.json and vite.config.ts, and the
                # | platform read those files as the config. Deployment became a build
                # | artifact of the repo.
                feedback: "Configuraste bastante, solo que en package.json y en vite.config.ts, y la plataforma leyó esos archivos como la config. El deployment se volvió un artefacto de build del repo."  # @src=5336224cdcd2
              d:
                # | Vercel cloned your repo on its side and built the default branch, so the
                # | deployment reflects main rather than your working copy
                label: "Vercel clonó tu repo de su lado y construyó la branch por defecto, así que el deployment refleja main y no tu copia de trabajo"  # @src=4a3db768dd5f
                # | Not on this first run: the CLI bundled your local source and sent it up,
                # | so an uncommitted edit would have shipped. Builds that start from a git
                # | clone begin once you connect the repo in the dashboard.
                feedback: "No en esta primera corrida: el CLI empaquetó tu código fuente local y lo mandó para arriba, así que una edición sin commitear se habría entregado. Los builds que arrancan de un git clone empiezan una vez que conectas el repo en el panel."  # @src=34f5d623226e
              c:
                # | Vercel wrapped the app in a Node serverless function that renders each
                # | page on request, since a CDN alone cannot execute a Vite project
                label: "Vercel envolvió la app en una función serverless de Node que renderiza cada página por request, ya que un CDN solo no puede ejecutar un proyecto de Vite"  # @src=34ccc5c5aa25
                # | A built Vite SPA is static files, no server runs per request. Functions
                # | exist on the platform, but this deployment used none.
                feedback: "Una SPA de Vite construida son archivos estáticos, ningún servidor corre por request. Las Functions existen en la plataforma, pero este deployment no usó ninguna."  # @src=83efc4470a37
      check-hobby:                      # quiz
        questions:
          m03l3-q4:
            # | Your station gets popular and blows past Hobby's 100 GB Fast Data Transfer
            # | mid-month. Per the published overage model, what happens?
            prompt: "Tu estación se vuelve popular y pasa volando los 100 GB de Fast Data Transfer de Hobby a mitad de mes. Según el modelo de excedente publicado, ¿qué pasa?"  # @src=965050419037
            # | Pauses-not-bills is the property that makes Hobby a teaching platform: the
            # | worst case of success is downtime, never debt. Read against the station's
            # | actual traffic (a JSON file and a small bundle), 100 GB is enormous
            # | headroom, but knowing the failure mode BEFORE it fires is the operating
            # | habit this course keeps drilling.
            explanation: "Pausa-y-no-factura es la propiedad que vuelve a Hobby una plataforma para enseñar: el peor caso del éxito es downtime, nunca deuda. Leído contra el tráfico real de la estación (un archivo JSON y un bundle chico), 100 GB es un margen enorme, pero conocer el modo de falla ANTES de que se dispare es el hábito operativo que este curso sigue ejercitando."  # @src=db1b128ff06b
            options:                 # source order — keep it
              c:
                # | The account gets a 7-day grace period and is then suspended, with
                # | existing deployments taken offline until you upgrade to a paid plan
                label: "La cuenta recibe un período de gracia de 7 días y después se suspende, con los deployments existentes dados de baja hasta que subas a un plan pago"  # @src=205ee240fe08
                # | No suspension ladder, the documented behavior is a pause of the exceeded
                # | feature for the window, then normal service resumes.
                feedback: "No hay escalera de suspensión, el comportamiento documentado es una pausa de la feature excedida por la ventana, y después el servicio normal se reanuda."  # @src=182651e4a2c5
              b:
                # | The feature pauses until the 30-day window passes (in most cases), Hobby
                # | has no billing cycle, so no surprise invoice can exist
                label: "La feature se pausa hasta que pase la ventana de 30 días (en la mayoría de los casos), Hobby no tiene ciclo de facturación, así que no puede existir ninguna factura sorpresa"  # @src=6d16079da6d6
                # | With no billing cycle there is nothing for an invoice to arrive on, so
                # | the worst case of going viral here is downtime rather than debt. Web
                # | Analytics is the documented exception, resuming after 7 days.
                feedback: "Sin ciclo de facturación no hay nada sobre lo que llegue una factura, así que el peor caso de volverse viral acá es downtime y no deuda. Web Analytics es la excepción documentada, y se reanuda después de 7 días."  # @src=028182c34694
              d:
                # | Requests past the cap typically start returning an error page until the
                # | counter resets on the first of the month
                label: "Los requests pasados el tope típicamente empiezan a devolver una página de error hasta que el contador se reinicia el primero del mes"  # @src=b0ba36078db5
                # | Two details off. The window is a rolling 30 days, not the calendar
                # | month, and what stops is the exceeded feature itself, which pauses;
                # | nothing turns your traffic into a wall of error pages.
                feedback: "Dos detalles mal. La ventana son 30 días rodantes, no el mes calendario, y lo que se detiene es la feature excedida en sí, que se pausa; nada convierte tu tráfico en un muro de páginas de error."  # @src=aa1619969038
              a:
                # | Overage bills automatically at Pro's per-GB rates, the free tier's
                # | numbers are a threshold where metered billing starts, not a ceiling
                label: "El excedente se factura automáticamente a las tarifas por GB de Pro, los números del tier gratis son un umbral donde arranca la facturación medida, no un techo"  # @src=1399304a2c3d
                # | Hobby has no billing cycle at all, there's nothing to meter against.
                # | That's exactly what makes it safe to teach on.
                feedback: "Hobby no tiene ningún ciclo de facturación, no hay nada contra lo que medir. Eso es exactamente lo que lo vuelve seguro para enseñar sobre él."  # @src=a9619ac9eae5
          m03l3-q5:
            # | Back in M1 the course insisted the station repo live on your PERSONAL GitHub
            # | account. This lesson is where that decision pays off. Why was it required?
            prompt: "Allá en M1 el curso insistió en que el repo de la estación viviera en tu cuenta PERSONAL de GitHub. Esta lección es donde esa decisión rinde. ¿Por qué era obligatoria?"  # @src=44b72e60ec1e
            # | Three documented Hobby constraints compose here: no org-owned repos, no team
            # | collaboration (the compare table's dash), and non-commercial personal use.
            # | The course designed the station's shape around them in M1 so lesson ten's
            # | ship needs zero workarounds, that's what a free-tier-honest core path means.
            explanation: "Tres restricciones documentadas de Hobby se combinan acá: sin repos propiedad de organizaciones, sin colaboración en equipo (el guion de la tabla de comparación), y uso personal no comercial. El curso diseñó la forma de la estación alrededor de ellas en M1 para que la entrega de la lección diez no necesite ningún workaround, eso es lo que significa un camino central honesto con el tier gratis."  # @src=5b5f7e69eab1
            options:                 # source order — keep it
              d:
                # | The Vercel app needs org-owner approval to connect an org repo, and a
                # | solo Hobby account cannot request that approval
                label: "La app de Vercel necesita la aprobación del dueño de la organización para conectar un repo de organización, y una cuenta Hobby en solitario no puede pedir esa aprobación"  # @src=11e0645cd190
                # | Approval is not the mechanism, the plan is: Hobby teams cannot connect
                # | org-owned repositories at all, so no amount of goodwill from an org
                # | admin opens that door.
                feedback: "La aprobación no es el mecanismo, el plan lo es: los equipos de Hobby no pueden conectar repositorios propiedad de organizaciones para nada, así que ninguna cantidad de buena voluntad de un admin de organización abre esa puerta."  # @src=ed25be958782
              b:
                # | Org repos default to private visibility, which would break the raw
                # | status.json fetch, personal accounts are the only place public repos
                # | exist
                label: "Los repos de organización van a visibilidad privada por defecto, lo que rompería el fetch crudo de status.json, las cuentas personales son el único lugar donde existen repos públicos"  # @src=82f45e29ba36
                # | Orgs host public repos happily, the public-repo requirement and the
                # | personal-repo requirement are two separate constraints that happen to
                # | compose.
                feedback: "Las organizaciones alojan repos públicos sin problema, el requisito de repo público y el requisito de repo personal son dos restricciones separadas que resulta que se combinan."  # @src=b406a09f1fd4
              a:
                # | Vercel's build machines can only clone repos that share an owner name
                # | with the Vercel account, so personal-to-personal is the only link that
                # | authenticates
                label: "Las máquinas de build de Vercel solo pueden clonar repos que comparten el nombre de dueño con la cuenta de Vercel, así que personal-a-personal es el único enlace que autentica"  # @src=841f77410837
                # | The Git integration handles auth across owners fine on paid plans, the
                # | constraint is a Hobby plan rule, not an authentication mechanic.
                feedback: "La integración con Git maneja la autenticación entre dueños sin problema en los planes pagos, la restricción es una regla del plan Hobby, no una mecánica de autenticación."  # @src=06c27504b4d4
              c:
                # | Hobby teams cannot connect org-owned repositories, and Hobby is solo and
                # | non-commercial; the personal repo is the free path's shape
                label: "Los equipos de Hobby no pueden conectar repositorios propiedad de organizaciones, y Hobby es en solitario y no comercial; el repo personal es la forma del camino gratis"  # @src=08d9346d0e4f
                # | Three documented constraints compose: non-commercial, solo, no org-owned
                # | repositories. M1 insisting on a personal public repo was this lesson
                # | reaching backwards so today's ship needs zero workarounds.
                feedback: "Tres restricciones documentadas se combinan: no comercial, en solitario, sin repositorios propiedad de organizaciones. Que M1 insistiera en un repo público personal era esta lección estirándose hacia atrás para que la entrega de hoy no necesite ningún workaround."  # @src=d8ed43adb331
          m03l3-q6:
            # | The board is one of three sibling projects in the station repo, alongside
            # | the fleet and the shared engine. How does Vercel deploy just the dashboard?
            prompt: "El panel es uno de tres proyectos hermanos en el repo de la estación, junto con la flota y el motor compartido. ¿Cómo hace Vercel para desplegar solo el panel?"  # @src=f315f7110db1
            # | One project per deployable directory, selected via Root Directory at import
            # | and editable later in settings. The supporting requirements, a real
            # | workspace definition, unique package names, declared inter-package deps, are
            # | exactly the package.json hygiene m03-l1 taught, which is why the import Just
            # | Works.
            explanation: "Un proyecto por directorio desplegable, elegido vía Root Directory al importar y editable después en la configuración. Los requisitos que lo sostienen, una definición de workspace real, nombres de paquete únicos, deps entre paquetes declaradas, son exactamente la higiene de package.json que enseñó m03-l1, que es por qué la importación Simplemente Funciona."  # @src=dfd999e5d92e
            options:                 # source order — keep it
              b:
                # | Move the dashboard to its own standalone repository first, monorepos
                # | aren't supported on the Git integration, only single-package repos
                # | deploy cleanly
                label: "Mueve el panel a su propio repositorio independiente primero, los monorepos no están soportados en la integración con Git, solo los repos de un solo paquete despliegan limpio"  # @src=8c073c3dea12
                # | This was the course's contingency plan until the docs probe resolved it,
                # | Root Directory is the supported, documented monorepo path, and the
                # | fallback was never needed.
                feedback: "Este era el plan de contingencia del curso hasta que la sonda de docs lo resolvió, Root Directory es el camino de monorepo soportado y documentado, y el respaldo nunca fue necesario."  # @src=87719fe679b8
              c:
                # | Add a vercel.json at the repo root enumerating every workspace package,
                # | so the platform builds all three and serves whichever emits an
                # | index.html
                label: "Agrega un vercel.json en la raíz del repo enumerando cada paquete del workspace, así la plataforma construye los tres y sirve al que emita un index.html"  # @src=783a2e55345f
                # | No root manifest enumerates packages, the model is one project pointed
                # | at one directory via a dashboard setting, not a build-everything sweep.
                feedback: "Ningún manifest de raíz enumera paquetes, el modelo es un proyecto apuntado a un directorio vía una configuración del panel, no un barrido de construir-todo."  # @src=5060630d8baf
              d:
                # | Vercel reads pnpm-workspace.yaml and picks the package that can deploy,
                # | the board being the sole one with an index.html
                label: "Vercel lee pnpm-workspace.yaml y elige el paquete que puede desplegar, siendo el panel el único con un index.html"  # @src=c1df41bbc9ad
                # | Nothing introspects that file to choose a target; a human aims the
                # | project at one directory when importing it. What the workspace
                # | declarations buy is the build skip for untouched siblings.
                feedback: "Nada inspecciona ese archivo para elegir un target; un humano apunta el proyecto a un directorio cuando lo importa. Lo que compran las declaraciones del workspace es el salteo de build para los hermanos que no se tocaron."  # @src=7260b96705bb
              a:
                # | Set Root Directory to packages/pulse-board at import, one Vercel project
                # | per deployable directory; unaffected siblings get skipped
                label: "Setea Root Directory a packages/pulse-board al importar, un proyecto de Vercel por directorio desplegable; los hermanos no afectados se saltean"  # @src=194c11fb6a92
                # | One project per deployable directory is the whole model. The workspace
                # | hygiene from m03-l1, real package names and declared inter-package deps,
                # | is what additionally earns the skipped builds.
                feedback: "Un proyecto por directorio desplegable es todo el modelo. La higiene de workspace de m03-l1, nombres de paquete reales y deps entre paquetes declaradas, es lo que adicionalmente se gana los builds salteados."  # @src=b003ae9ddef0
  m03-l4:
    # | Publish something real: tsdown and the signs of a dying dep
    title: "Publica algo real: tsdown y las señales de una dep que se muere"  # @src=a3187c9dd37b
    blocks:
      check:                      # quiz
        questions:
          m03l4-q1:
            # | Your npm pack --dry-run listing shows src/, tests/, and .env.example riding
            # | along with dist/. What's the verdict before publishing?
            prompt: "Tu listado de npm pack --dry-run muestra src/, tests/ y .env.example viajando junto con dist/. ¿Cuál es el veredicto antes de publicar?"  # @src=8fd215865be5
            # | The tarball IS the product: whatever npm pack lists is what every install
            # | delivers, forever (unpublishing is heavily restricted). The files field is
            # | the allowlist; the dry-run is the pre-flight read. Twenty seconds of reading
            # | the listing is the cheapest security-and-professionalism habit in this
            # | course.
            explanation: "El tarball ES el producto: lo que sea que liste npm pack es lo que entrega cada instalación, para siempre (despublicar está fuertemente restringido). El campo files es la allowlist; la corrida en seco es la lectura de prevuelo. Veinte segundos leyendo el listado es el hábito de seguridad-y-profesionalismo más barato de este curso."  # @src=f726cd7991a2
            options:                 # source order — keep it
              c:
                # | Keep src/ in deliberately, consumers need the original sources alongside
                # | dist/ for source maps and editor go-to-definition to resolve
                label: "Deja src/ adentro deliberadamente, los consumidores necesitan las fuentes originales junto con dist/ para que los source maps y el ir-a-definición del editor resuelvan"  # @src=4c57c3462232
                # | Shipping sources is a legitimate optional choice some packages make, but
                # | it's opt-in curation via the files field, not a requirement, and it
                # | never justifies test files or env samples in the tarball.
                feedback: "Entregar las fuentes es una elección opcional legítima que hacen algunos paquetes, pero es curaduría opt-in vía el campo files, no un requisito, y nunca justifica archivos de test ni muestras de entorno en el tarball."  # @src=516398a2ed3b
              d:
                # | The exports map already hides everything but dist, so those unreachable
                # | files in the tarball are just dead weight and nothing worse than that
                label: "El mapa de exports ya esconde todo menos dist, así que esos archivos inalcanzables del tarball son solo peso muerto y nada peor que eso"  # @src=2d7d01f598f3
                # | Two allowlists, two jobs: exports governs what a consumer can import,
                # | files governs what gets uploaded. An unimportable .env.example still
                # | lands on every machine that installs you, readable by anyone.
                feedback: "Dos allowlists, dos trabajos: exports gobierna lo que un consumidor puede importar, files gobierna lo que se sube. Un .env.example que no se puede importar igual aterriza en cada máquina que te instala, legible por cualquiera."  # @src=575f2afc0cee
              b:
                # | Fix the files field first, the contract is dist plus types plus
                # | package.json, and anything env-shaped near a tarball is a leak risk
                label: "Arregla el campo files primero, el contrato es dist más los tipos más package.json, y cualquier cosa con forma de entorno cerca de un tarball es un riesgo de fuga"  # @src=392c802b6e2b
                # | The tarball is the deliverable, and npm's unpublish policy makes it
                # | effectively permanent. Twenty seconds reading the dry-run listing is the
                # | cheapest professionalism habit in the course.
                feedback: "El tarball es el entregable, y la política de unpublish de npm lo vuelve efectivamente permanente. Veinte segundos leyendo el listado de la corrida en seco es el hábito de profesionalismo más barato del curso."  # @src=e03b68497767
              a:
                # | Ship it, npm strips non-runtime files at install time, so the extra
                # | entries cost tarball bytes but never reach a consumer's node_modules
                label: "Entrégalo, npm quita los archivos que no son de runtime al instalar, así que las entradas extra cuestan bytes de tarball pero nunca llegan al node_modules de un consumidor"  # @src=9477c8135c7a
                # | npm strips nothing, the tarball is exactly what lands in every
                # | consumer's node_modules, droppings included.
                feedback: "npm no quita nada, el tarball es exactamente lo que aterriza en el node_modules de cada consumidor, con los desechos incluidos."  # @src=8b889eac6b8c
          m03l4-q2:
            # | A build tool you're evaluating has 8M weekly downloads, but its README opens
            # | with 'this project is not actively maintained anymore' and points at a
            # | successor. How do you weigh the signals?
            prompt: "Una herramienta de build que estás evaluando tiene 8M de descargas semanales, pero su README abre con 'este proyecto ya no se mantiene activamente' y apunta a una sucesora. ¿Cómo pesas las señales?"  # @src=78fe74da2419
            # | The checklist's ranking: maintainer signals first (README notices, publish
            # | cadence), revealed ecosystem preferences second, raw popularity last. tsup
            # | is the worked case, huge downloads, honest abdication, active successor, and
            # | the correct read is 'migrate on your schedule, don't adopt fresh.' m09-l1
            # | turns this same read into a written audit verdict.
            explanation: "El ranking de la checklist: primero las señales de quien mantiene (avisos del README, cadencia de publicación), segundo las preferencias reveladas del ecosistema, último la popularidad cruda. tsup es el caso trabajado, descargas enormes, abdicación honesta, sucesora activa, y la lectura correcta es 'migra en tu propio cronograma, no la adoptes de nuevas'. m09-l1 convierte esta misma lectura en un veredicto de auditoría escrito."  # @src=ba0656c90f78
            options:                 # source order — keep it
              c:
                # | The README notice outranks the metrics, it's the maintainer's own words;
                # | verify with last-publish date and the successor's health, then plan
                # | around it
                label: "El aviso del README le gana a las métricas, son las propias palabras de quien mantiene; verifica con la fecha del último publish y la salud de la sucesora, y después planifica alrededor de eso"  # @src=6babf5feaa3a
                # | Downloads are a lagging indicator with years of inertia: tsup still
                # | out-downloads the successor it points at, ten months after its last
                # | release. The README is today's information.
                feedback: "Las descargas son un indicador rezagado con años de inercia: tsup todavía le gana en descargas a la sucesora a la que apunta, diez meses después de su último release. El README es la información de hoy."  # @src=3d5c81047322
              d:
                # | Wait for the successor to out-download the original, since a migration
                # | is usually only safe once the two counts have crossed
                label: "Espera a que la sucesora le gane en descargas a la original, ya que una migración normalmente solo es segura una vez que los dos conteos se cruzaron"  # @src=326ef826bf5b
                # | Those counts cross years late, because every old lockfile and template
                # | keeps pulling the incumbent. Waiting for the graph means adopting a tool
                # | the day its replacement stops being new.
                feedback: "Esos conteos se cruzan años tarde, porque cada lockfile y plantilla viejos siguen trayendo a la titular. Esperar al gráfico significa adoptar una herramienta el día en que su reemplazo deja de ser nuevo."  # @src=7c5563dfa49a
              a:
                # | Downloads win, 8M weekly users means the ecosystem has effectively
                # | voted, and a README sentence is one maintainer's opinion against the
                # | market's
                label: "Ganan las descargas, 8M de usuarios semanales significa que el ecosistema efectivamente votó, y una oración de README es la opinión de una sola persona que mantiene contra la del mercado"  # @src=db0c1d578a1d
                # | Download counts are a lagging indicator with years of inertia, tsup
                # | still out-downloads tsdown while telling you to leave. The market voted
                # | years ago; the README is today's information.
                feedback: "Los conteos de descargas son un indicador rezagado con años de inercia, tsup todavía le gana en descargas a tsdown mientras te dice que te vayas. El mercado votó hace años; el README es la información de hoy."  # @src=43f2b5e2e5d7
              b:
                # | Wait for npm to apply the official deprecated flag, until the registry
                # | marks it, maintenance status is speculation and the package counts as
                # | supported
                label: "Espera a que npm aplique la flag oficial de deprecado, hasta que el registro lo marque, el estado de mantenimiento es especulación y el paquete cuenta como soportado"  # @src=f1592a41582f
                # | Many abandoned packages are never formally deprecated, the registry flag
                # | is one signal among several, and the maintainer's own note is a
                # | stronger, earlier one.
                feedback: "Muchos paquetes abandonados nunca se deprecan formalmente, la flag del registro es una señal entre varias, y la propia nota de quien mantiene es una más fuerte y más temprana."  # @src=8eb1b7576810
          m03l4-q3:
            # | A consumer of your published package reports: the JS imports and runs, but
            # | TypeScript says 'Cannot find module @you/pulse-core'. What shipped wrong?
            prompt: "Un consumidor de tu paquete publicado reporta: el JS se importa y corre, pero TypeScript dice 'Cannot find module @you/pulse-core'. ¿Qué se entregó mal?"  # @src=84db478918d6
            # | The dual concern from m03-l1's boundary lesson, now with real stakes: under
            # | nodenext-style resolution, TypeScript walks the exports map, top-level types
            # | alone isn't enough. tsdown emits both artifacts; your exports map decides
            # | whether they travel together. The scratch-project install proof exists to
            # | catch exactly this before a stranger does.
            explanation: "La preocupación dual de la lección de fronteras de m03-l1, ahora con algo real en juego: bajo la resolución estilo nodenext, TypeScript recorre el mapa de exports, el campo types de nivel superior por sí solo no alcanza. tsdown emite los dos artefactos; tu mapa de exports decide si viajan juntos. La demostración de instalación en el proyecto borrador existe para atrapar exactamente esto antes de que lo haga un desconocido."  # @src=4c71bd2de7d7
            options:                 # source order — keep it
              b:
                # | The consumer needs typescript declared as a peerDependency of your
                # | package so their compiler version is pinned to one that can read your
                # | declarations
                label: "El consumidor necesita typescript declarado como peerDependency de tu paquete para que su versión de compilador quede fijada a una que pueda leer tus declaraciones"  # @src=3afd28d9539c
                # | No package needs TS as a peer just to ship types, declaration files are
                # | inert data any TS version reads; the failure is resolution, not
                # | versioning.
                feedback: "Ningún paquete necesita TS como peer solo para entregar tipos, los archivos de declaración son datos inertes que cualquier versión de TS lee; la falla es de resolución, no de versionado."  # @src=68623dded40d
              c:
                # | Scoped packages need a matching @types/pulse-core package published to
                # | DefinitelyTyped before editors will pick their declarations up
                label: "Los paquetes con scope necesitan un paquete @types/pulse-core correspondiente publicado en DefinitelyTyped antes de que los editores levanten sus declaraciones"  # @src=b4c0ae4756aa
                # | DefinitelyTyped exists for packages that DON'T ship their own types, a
                # | package bundling its d.ts needs only correct wiring, no external types
                # | package.
                feedback: "DefinitelyTyped existe para los paquetes que NO entregan sus propios tipos, un paquete que empaqueta su d.ts solo necesita el cableado correcto, ningún paquete externo de tipos."  # @src=cf325a388836
              d:
                # | The top-level types field is missing, and that entry is where TypeScript
                # | resolves declarations from before it ever reads an exports map
                label: "Falta el campo types de nivel superior, y esa entrada es desde donde TypeScript resuelve las declaraciones antes de leer siquiera un mapa de exports"  # @src=885dbc2f3fab
                # | That field is the pre-exports spelling, and it is what a consumer on an
                # | older resolution mode would read. Once an exports map exists, it
                # | governs, and the types condition inside it is the entry that counts.
                feedback: "Ese campo es la ortografía pre-exports, y es lo que leería un consumidor en un modo de resolución más viejo. Una vez que existe un mapa de exports, este gobierna, y la condición types adentro de él es la entrada que cuenta."  # @src=e8f60b337978
              a:
                # | The exports map is missing its types condition, modern TS resolves
                # | through exports, so the .d.ts entry must sit beside the JS entry it
                # | describes
                label: "Al mapa de exports le falta su condición types, el TS moderno resuelve por exports, así que la entrada .d.ts tiene que estar al lado de la entrada de JS que describe"  # @src=2fb640cd35a7
                # | Two resolvers, one map: Node walks exports for the JavaScript and
                # | TypeScript walks the same map for the types. A declaration file the map
                # | does not expose might as well not be in the tarball.
                feedback: "Dos resolvedores, un mapa: Node recorre exports para el JavaScript y TypeScript recorre el mismo mapa para los tipos. Un archivo de declaración que el mapa no expone bien podría no estar en el tarball."  # @src=9abdde4d1248
          m03l4-q4:
            # | Tier-gate check: after M3 you want to get seriously good at type-level
            # | programming, conditional types, mapped types, the wizardry. Per the course's
            # | map, what's the honest route?
            prompt: "Revisión de la barrera del tier: después de M3 quieres volverte seriamente bueno en programación a nivel de tipos, tipos condicionales, tipos mapeados, la brujería. Según el mapa del curso, ¿cuál es la ruta honesta?"  # @src=1d078787d182
            # | The tier-gate is the 80/20 contract kept honestly: unions, narrowing, zod,
            # | async discipline, packages, taught. Type-level programming, full tsconfig
            # | breadth, Bun/Deno, deep React, bookmarked, each with a named home. The map
            # | you got in m01-l1 just gained its first 'you are here' pin: TS-strong, with
            # | the 20% locations memorized.
            explanation: "La barrera del tier es el contrato 80/20 cumplido con honestidad: uniones, narrowing, zod, disciplina de async, paquetes, enseñados. Programación a nivel de tipos, la amplitud completa de tsconfig, Bun/Deno, React profundo, dejados como bookmark, cada uno con un hogar nombrado. El mapa que recibiste en m01-l1 acaba de ganar su primer pin de 'estás acá': fuerte en TS, con las ubicaciones del 20% memorizadas."  # @src=e0d3bdbbff95
            options:                 # source order — keep it
              d:
                # | M7's edge lesson returns to TypeScript depth, so the conditional and
                # | mapped type material lands there once the workers need it
                label: "La lección de edge de M7 vuelve a la profundidad de TypeScript, así que el material de tipos condicionales y mapeados aterriza ahí una vez que los workers lo necesiten"  # @src=1e74c4b9fcdc
                # | The TypeScript tier ends here; M7 spends its TypeScript on an edge
                # | runtime, not on the type system. Nothing later in the course reopens
                # | type-level authoring, which is why the gate hands you the drill yard
                # | instead.
                feedback: "El tier de TypeScript termina acá; M7 gasta su TypeScript en un runtime de edge, no en el sistema de tipos. Nada más adelante en el curso vuelve a abrir la escritura a nivel de tipos, que es por qué la barrera te pasa el patio de ejercicios en cambio."  # @src=1a1a4fb2ed0b
              c:
                # | Hold off until you've finished the client-side mastery course, serious
                # | client work demands type-level fluency, so that layer has to be taught
                # | there first
                label: "Espera hasta que hayas terminado el curso de dominio del lado del cliente, el trabajo serio de cliente exige fluidez a nivel de tipos, así que esa capa tiene que enseñarse ahí primero"  # @src=acd6dfa9d89c
                # | Nothing in the map routes type-level programming through the client-side
                # | course; its territory is wallet UX and transaction landing, and the
                # | wizardry is bookmarked self-serve: type-challenges plus the Handbook's
                # | generics material.
                feedback: "Nada en el mapa rutea la programación a nivel de tipos por el curso del lado del cliente; su territorio es la UX de wallet y el aterrizaje de transacciones, y la brujería queda como bookmark autoservicio: type-challenges más el material de genéricos del Handbook."  # @src=d753b5160c0e
              b:
                # | That's the bookmarked 20%, type-challenges plus the Handbook's generics
                # | material; this course taught the daily layer and where the rest lives
                label: "Ese es el 20% que quedó como bookmark, type-challenges más el material de genéricos del Handbook; este curso enseñó la capa del día a día y dónde vive el resto"  # @src=42030e6fb7d4
                # | The 20% was never missing, it was filed. The tier gate names an address
                # | and a trigger for each piece, and this one's trigger is a library
                # | signature making you curious rather than tired.
                feedback: "El 20% nunca faltó, estaba archivado. La barrera del tier nombra una dirección y un disparador para cada pieza, y el disparador de esta es que la firma de una librería te dé curiosidad en vez de cansancio."  # @src=812fd326080d
              a:
                # | Re-do m02-l2, the generics beat there covers the type-level toolkit, and
                # | the advanced patterns fall out of z.infer once it clicks
                label: "Rehaz m02-l2, el pasaje de genéricos de ahí cubre el toolkit a nivel de tipos, y los patrones avanzados salen de z.infer una vez que hace clic"  # @src=ae06391f8f5d
                # | m02-l2 deliberately taught generics-you-CONSUME (schemas, z.infer,
                # | satisfies), authoring type-level machinery was explicitly left out of
                # | the 80%.
                feedback: "m02-l2 enseñó deliberadamente los genéricos-que-CONSUMES (schemas, z.infer, satisfies), escribir maquinaria a nivel de tipos se dejó explícitamente fuera del 80%."  # @src=5eeca2513343
  m04-l1:
    # | Ownership is the point
    title: "El ownership es el punto"  # @src=f15ad82aef00
    blocks:
      fix-the-borrow:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The error is E0382: use of moved value. The FIRST call consumed the Vec.
          0: "El error es E0382: uso de un valor movido. La PRIMERA llamada consumió el Vec."  # @src=5058f95ef5b5
          # | Change both helper signatures from Vec<u64> to &[u64]; a &Vec<u64> coerces to
          # | &[u64] automatically.
          1: "Cambia las dos firmas de los helpers de Vec<u64> a &[u64]; un &Vec<u64> se convierte a &[u64] automáticamente."  # @src=1ebeda4d6d5b
          # | At the call sites, pass &latencies. Iterating a slice gives you &u64,
          # | destructure with `for &l in`.
          2: "En los sitios de llamada, pasa &latencies. Iterar un slice te da &u64, destructura con `for &l in`."  # @src=51946b8cc302
        tests:                      # keyed by test case id
          t1:
            # | one slow target: max is 930ms and only it crosses the 500ms threshold
            description: "un target lento: el max es 930ms y solo él cruza el umbral de 500ms"  # @src=b93768bcb7fc
          t2:
            # | a healthy fleet with one probe over the line
            description: "una flota sana con una sonda pasada de la línea"  # @src=aca5630a1122
          t3:
            # | everything is slow: all three latencies exceed the threshold
            description: "todo está lento: las tres latencias exceden el umbral"  # @src=fab10057dc4b
          t4:
            # | an empty fixture list reports max=0 and zero over
            description: "una lista de fixture vacía reporta max=0 y cero over"  # @src=6d6673a03c75
          t5:
