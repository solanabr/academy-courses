                # | No macro is involved, |e| is closure syntax, an ordinary runtime value
                # | passed to map_err like any argument.
                feedback: "No hay ninguna macro involucrada, |e| es sintaxis de closure, un valor ordinario en tiempo de ejecución que se le pasa a map_err como cualquier argumento."  # @src=ab169867e6b3
              d:
                # | A match pattern, where the pipes let one arm accept either of the error
                # | types parse_latency returns
                label: "Un patrón de match, donde las barras verticales dejan que un brazo acepte cualquiera de los tipos de error que devuelve parse_latency"  # @src=a7b87ef2e589
                # | Match arms do use a pipe for or-patterns, which is why the syntax looks
                # | familiar, but there is no match here and parse_latency has exactly one
                # | error type. Between the pipes is a parameter list.
                feedback: "Los brazos de match sí usan una barra vertical para los or-patterns, que es por qué la sintaxis se ve familiar, pero acá no hay ningún match y parse_latency tiene exactamente un tipo de error. Entre las barras verticales hay una lista de parámetros."  # @src=8218b9a3146a
              a:
                # | A closure, an anonymous function, able to capture from its scope, handed
                # | to map_err to transform the error lane
                label: "Un closure, una función anónima, capaz de capturar de su scope, pasado a map_err para transformar el carril de error"  # @src=314bc0ed6b9b
                # | An ordinary value: parameter list between the pipes, body after it,
                # | passed to map_err like any argument and run only on the Err lane. This
                # | one captures nothing yet; the capturing kind arrives with iterators next
                # | module.
                feedback: "Un valor ordinario: lista de parámetros entre las barras verticales, el cuerpo después, pasado a map_err como cualquier argumento y corrido solo en el carril Err. Este todavía no captura nada; el tipo que captura llega con los iteradores el módulo que viene."  # @src=19da9d41cd46
          m04l2-q4:
            # | Your lamports-summing path panicked with 'attempt to add with overflow' in a
            # | debug build. A teammate says: ship the release build, it doesn't panic
            # | there. What's the truth?
            prompt: "Tu camino de suma de lamports dio panic con 'attempt to add with overflow' en un build de debug. Un compañero de equipo dice: entrega el build de release, ahí no da panic. ¿Cuál es la verdad?"  # @src=4c625fad5252
            # | Debug builds panic on overflow; release builds wrap silently. With lamports
            # | (the lab's worked line adds a 2,000,000-lamport deposit near the top of the
            # | range) a wrapped u64 is a wrong balance nobody notices. checked_add returns
            # | Option, and Option feeds the same ? pipeline you just built, overflow
            # | becomes an error value like everything else.
            explanation: "Los builds de debug dan panic con el overflow; los builds de release dan wrap en silencio. Con lamports (la línea trabajada del lab suma un depósito de 2,000,000 lamports cerca del tope del rango) un u64 que dio wrap es un balance equivocado que nadie nota. checked_add devuelve Option, y Option alimenta el mismo pipeline de ? que acabas de construir, el overflow se vuelve un valor de error como todo lo demás."  # @src=a7e513e3e6c1
            options:                 # source order — keep it
              a:
                # | The teammate is right, release builds wrap on overflow by design, and
                # | wrapping is the defined, acceptable behavior for u64 totals
                label: "El compañero de equipo tiene razón, los builds de release dan wrap con el overflow por diseño, y dar wrap es el comportamiento definido y aceptable para los totales de u64"  # @src=370c52966b8d
                # | Wrapping IS what release does, but for money math a silently wrapped
                # | balance is corruption, not correctness, 'defined' does not mean 'right'.
                feedback: "Dar wrap ES lo que hace release, pero para la matemática de dinero un balance que dio wrap en silencio es corrupción, no corrección, 'definido' no quiere decir 'correcto'."  # @src=a877e50b41ae
              d:
                # | Half right, the wrap is real but a u128 total sidesteps it, so widen the
                # | type rather than check every add
                label: "Medio bien, el wrap es real pero un total u128 lo esquiva, así que ensancha el tipo en vez de verificar cada suma"  # @src=7dbe990080c5
                # | A wider type moves the ceiling, it does not add a check, and the values
                # | you are summing stay u64 on the wire. The point is not more headroom, it
                # | is that the overflow case becomes a value you handle.
                feedback: "Un tipo más ancho mueve el techo, no agrega ninguna verificación, y los valores que estás sumando siguen siendo u64 en el cable. El punto no es más margen, es que el caso de overflow se vuelve un valor que manejas."  # @src=1c4113c70efd
              b:
                # | Wrong, release builds wrap SILENTLY, corrupting the total; use
                # | checked_add and turn None into a ProbeError instead
                label: "Mal, los builds de release dan wrap EN SILENCIO, corrompiendo el total; usa checked_add y convierte None en un ProbeError en cambio"  # @src=3e096fa0cf74
                # | The teammate is right that the panic stops, which is the worst possible
                # | way to be right: a wrapped u64 is a wrong number wearing a straight
                # | face, and checked_add turns that into an Option the ? pipeline already
                # | handles.
                feedback: "El compañero de equipo tiene razón en que el panic se detiene, que es la peor manera posible de tener razón: un u64 que dio wrap es un número equivocado con cara de póker, y checked_add convierte eso en un Option que el pipeline de ? ya maneja."  # @src=b429c80816eb
              c:
                # | Wrong, release builds panic on overflow exactly like debug builds do;
                # | the optimization flag only shortens the panic message
                label: "Mal, los builds de release dan panic con el overflow exactamente como lo hacen los builds de debug; la flag de optimización solo acorta el mensaje de panic"  # @src=9fb005d6527a
                # | The builds genuinely differ: debug panics, release wraps. That asymmetry
                # | is exactly why the bug hides until production.
                feedback: "Los builds genuinamente difieren: debug da panic, release da wrap. Esa asimetría es exactamente por qué el bug se esconde hasta producción."  # @src=1699edef38c3
  m04-l3:
    # | Enums are state machines
    title: "Los enums son máquinas de estados"  # @src=eec53772ae92
    blocks:
      probe-state-machine:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Define enum ProbeState { Pending, Up, Degraded, Down } and a parse_state(&str)
          # | -> Option<ProbeState>; return "Invalid" when parsing fails.
          0: "Define enum ProbeState { Pending, Up, Degraded, Down } y un parse_state(&str) -> Option<ProbeState>; devuelve \"Invalid\" cuando el parseo falle."  # @src=6cea80d418bf
          # | Match on the tuple (state, probe_ok), the compiler will list every arm you
          # | haven't written yet.
          1: "Haz match sobre la tupla (state, probe_ok), el compilador va a listar cada brazo que todavía no escribiste."  # @src=83c10723d99e
          # | The Degraded ladder needs a match guard: (Degraded, false) if
          # | consecutive_failures >= 3 goes Down, otherwise it stays Degraded.
          2: "La escalera de Degraded necesita una guarda de match: (Degraded, false) if consecutive_failures >= 3 se va a Down, si no se queda en Degraded."  # @src=7dde9cd87a62
          # | derive Debug on the enum and return format!("{:?}", next) to get the exact
          # | state names the tests expect.
          3: "Haz derive de Debug sobre el enum y devuelve format!(\"{:?}\", next) para conseguir los nombres de estado exactos que esperan las pruebas."  # @src=31355095671b
        tests:                      # keyed by test case id
          t1:
            # | a Pending target's first successful probe brings it Up
            description: "la primera sonda exitosa de un target Pending lo lleva a Up"  # @src=51f17e3b9aa5
          t2:
            # | one failure degrades an Up target, it does not kill it
            description: "una falla degrada un target Up, no lo mata"  # @src=2e6a19c1ebd0
          t3:
            # | a Degraded target under 3 consecutive failures stays Degraded
            description: "un target Degraded por debajo de 3 fallas consecutivas se queda en Degraded"  # @src=b9fcb57698af
          t4:
            # | the third consecutive failure takes a Degraded target Down
            description: "la tercera falla consecutiva lleva a Down un target Degraded"  # @src=01b93c0803bc
          t5:
            # | a successful probe recovers a Down target straight to Up
            description: "una sonda exitosa recupera un target Down directo a Up"  # @src=82dc8b0ad087
          t6:
            # | an unknown state string is rejected as Invalid, never guessed
            description: "una cadena de estado desconocida se rechaza como Invalid, nunca se adivina"  # @src=22250b8ee40f
      check-states:                      # quiz
        questions:
          m04l3-q1:
            # | You add a Maintenance variant to ProbeState and the build breaks in three
            # | files. Your TS instincts say you broke the project. Why is this the feature?
            prompt: "Agregas una variante Maintenance a ProbeState y el build se rompe en tres archivos. Tus instintos de TS dicen que rompiste el proyecto. ¿Por qué esto es la feature?"  # @src=a2e24d56357d
            # | This is 'how do you change code you're afraid of?' answered: the
            # | exhaustiveness check turns a risky refactor into a checklist the compiler
            # | writes for you. It is the TS exhaustive switch with the compiler holding the
            # | pen, and no never-hack needed to opt in.
            explanation: "Esto es '¿cómo cambias código al que le tienes miedo?' respondido: el chequeo de exhaustividad convierte un refactor riesgoso en una checklist que el compilador escribe por ti. Es el switch exhaustivo de TS con el compilador sosteniendo la pluma, y sin ningún never-hack para optar por entrar."  # @src=272a9cd3ea90
            options:                 # source order — keep it
              a:
                # | Enums are ABI-breaking, so any new variant forces dependent code to
                # | rebuild, the errors are Rust's cache invalidation working as designed
                label: "Los enums rompen la ABI, así que cualquier variante nueva obliga al código dependiente a reconstruirse, los errores son la invalidación de cache de Rust funcionando según el diseño"  # @src=edf285ba57a6
                # | This isn't about rebuilding or ABI, the errors are semantic: specific
                # | match expressions no longer cover every case and must decide what
                # | Maintenance means.
                feedback: "Esto no se trata de reconstruir ni de la ABI, los errores son semánticos: expresiones match específicas ya no cubren cada caso y tienen que decidir qué significa Maintenance."  # @src=a5784d25c803
              c:
                # | Every non-exhaustive match is now a compile error naming exactly where
                # | transition logic must learn about Maintenance, a guided refactor
                label: "Cada match no exhaustivo ahora es un error de compilación que nombra exactamente dónde la lógica de transición tiene que aprender sobre Maintenance, un refactor guiado"  # @src=32282974c3e3
                # | You asked the project a question and got every relevant site back by
                # | name, with line numbers. That inventory is the concrete answer to how
                # | you change code you are afraid of.
                feedback: "Le hiciste una pregunta al proyecto y te devolvió cada sitio relevante por su nombre, con números de línea. Ese inventario es la respuesta concreta a cómo cambias código al que le tienes miedo."  # @src=5725e2db1e58
              b:
                # | The compiler marks each site so you can drop in a `_ => {}` catch-all
                # | arm per file and get back to green quickly
                label: "El compilador marca cada sitio para que puedas meter un brazo catch-all `_ => {}` por archivo y volver rápido al verde"  # @src=75211bd84710
                # | A catch-all silences the compiler by selling the guarantee: future
                # | variants would sail through unhandled. It's the anti-pattern, not the
                # | fix.
                feedback: "Un catch-all silencia al compilador vendiendo la garantía: las variantes futuras pasarían de largo sin manejar. Es el anti-patrón, no el arreglo."  # @src=24990eb69c53
              d:
                # | It is not the feature, it is the cost of enums: a struct of boolean
                # | flags would absorb a new state without disturbing any transition code
                label: "No es la feature, es el costo de los enums: un struct de flags booleanas absorbería un estado nuevo sin molestar ningún código de transición"  # @src=a797efaf35d3
                # | Absorbing it silently is the failure mode, not the fix: flags let a new
                # | state flow through logic that never decided what it means. The noise is
                # | the contract, and it is the same trade a catch-all arm sells away.
                feedback: "Absorberlo en silencio es el modo de falla, no el arreglo: las flags dejan que un estado nuevo fluya por lógica que nunca decidió qué significa. El ruido es el contrato, y es el mismo trade-off que vende un brazo catch-all."  # @src=58155507675d
          m04l3-q2:
            # | The machine must never go Pending → Degraded. Where does that rule live so
            # | the illegal transition is IMPOSSIBLE, not just caught?
            prompt: "La máquina nunca debe ir de Pending → Degraded. ¿Dónde vive esa regla para que la transición ilegal sea IMPOSIBLE, no solo algo que se atrapa?"  # @src=85cd3cdc2254
            # | Make illegal states (and transitions) unrepresentable: the enum defines the
            # | states, the match defines the legal moves, and anything absent from the
            # | match simply cannot happen. Validation you don't have to remember beats
            # | validation you might forget.
            explanation: "Haz irrepresentables los estados (y las transiciones) ilegales: el enum define los estados, el match define las jugadas legales, y cualquier cosa ausente del match simplemente no puede pasar. Validación que no tienes que recordar le gana a validación que podrías olvidar."  # @src=9e7c9a7b3880
            options:                 # source order — keep it
              b:
                # | In a debug_assert! at every call site that checks the state pair before
                # | any assignment is allowed to happen
                label: "En un debug_assert! en cada sitio de llamada que verifica el par de estados antes de que cualquier asignación pueda pasar"  # @src=05944adeb07f
                # | Asserts are runtime checks that vanish in release builds and rely on
                # | every caller remembering, the lesson's whole point is moving the rule
                # | into the structure.
                feedback: "Los asserts son verificaciones en tiempo de ejecución que desaparecen en los builds de release y dependen de que cada quien que llama se acuerde, el punto entero de la lección es mover la regla adentro de la estructura."  # @src=943ce78a4251
              d:
                # | In a test asserting that Pending never yields Degraded, so CI catches
                # | the illegal transition
                label: "En una prueba que afirma que Pending nunca produce Degraded, así CI atrapa la transición ilegal"  # @src=ecc51cbf57db
                # | A test catches, which is the word the question is contrasting with. It
                # | samples the inputs you thought of and reports afterwards; the match
                # | makes the transition something no input can produce.
                feedback: "Una prueba atrapa, que es la palabra con la que la pregunta está contrastando. Muestrea las entradas en las que pensaste y reporta después; el match hace de la transición algo que ninguna entrada puede producir."  # @src=2d963aed0048
              a:
                # | In next_state's match over (state, outcome): no arm produces Degraded
                # | from Pending, so no code path exists
                label: "En el match de next_state sobre (state, outcome): ningún brazo produce Degraded desde Pending, así que no existe ningún camino de código"  # @src=59b77351c65a
                # | The rule lives nowhere because it does not need to: with no arm
                # | producing it, there is no path that performs it. Unrepresentable beats
                # | validated, exactly as the m02-l1 union beat a runtime check.
                feedback: "La regla no vive en ninguna parte porque no lo necesita: sin ningún brazo que la produzca, no hay camino que la ejecute. Irrepresentable le gana a validado, exactamente como la unión de m02-l1 le ganó a una verificación en tiempo de ejecución."  # @src=d053dcaf6b8b
              c:
                # | In a #[non_exhaustive] attribute on the Degraded variant, preventing
                # | outside modules from ever constructing it directly
                label: "En un atributo #[non_exhaustive] sobre la variante Degraded, impidiendo que los módulos de afuera la construyan directamente alguna vez"  # @src=73c59ed9a6f6
                # | #[non_exhaustive] changes how OTHER crates match and construct the type,
                # | it does not express transition rules between variants.
                feedback: "#[non_exhaustive] cambia cómo OTROS crates hacen match y construyen el tipo, no expresa reglas de transición entre variantes."  # @src=211bb7b805b7
          m04l3-q3:
            # | For the flavored beat you modeled Transfer/Delegate/Close instruction data
            # | as one Rust enum instead of three structs plus a `kind` string. What makes
            # | the enum the right shape for an instruction set?
            prompt: "Para el beat con sabor modelaste los datos de instrucción Transfer/Delegate/Close como un solo enum de Rust en vez de tres structs más un string `kind`. ¿Qué hace del enum la forma correcta para un conjunto de instrucciones?"  # @src=13c7fa6ef0ee
            # | A closed set of operations, each carrying different data, dispatched
            # | exhaustively: that is a sum type's home game. What programs then DO with
            # | instructions is the Anchor course's territory; the underlying
            # | account-and-transaction concepts live in the Bitcoin-to-Solana evolution
            # | course.
            explanation: "Un conjunto cerrado de operaciones, cada una cargando datos distintos, despachadas exhaustivamente: ese es el partido de local de un tipo suma. Lo que los programas HACEN después con las instrucciones es territorio del curso de Anchor; los conceptos subyacentes de cuentas-y-transacciones viven en el curso de evolución de Bitcoin a Solana."  # @src=24231f014c87
            options:                 # source order — keep it
              c:
                # | Solana's runtime requires enum-shaped interfaces from Rust programs, so
                # | a struct-per-instruction design would fail to compile on-chain
                label: "El runtime de Solana exige interfaces con forma de enum a los programas de Rust, así que un diseño de un struct por instrucción no compilaría on-chain"  # @src=cf5cd9762cb2
                # | The runtime mandates no Rust shapes at all, programs receive raw bytes.
                # | The enum is a modeling choice that pays off in the type system.
                feedback: "El runtime no manda ninguna forma de Rust en absoluto, los programas reciben bytes crudos. El enum es una decisión de modelado que paga en el sistema de tipos."  # @src=3ba48f9bf77f
              d:
                # | A fourth operation slots in later without touching the code that already
                # | dispatches, unlike a struct per instruction
                label: "Una cuarta operación entra después sin tocar el código que ya despacha, a diferencia de un struct por instrucción"  # @src=7f83118f91e1
                # | Backwards, and the Maintenance drill showed why: a new variant breaks
                # | every match until each one decides what it means. That churn is the
                # | guarantee you are buying, not a cost the enum spares you.
                feedback: "Al revés, y el ejercicio de Maintenance mostró por qué: una variante nueva rompe cada match hasta que cada uno decide qué significa. Ese trajín es la garantía que estás comprando, no un costo que el enum te ahorra."  # @src=a4cc2ec07934
              b:
                # | An instruction is one of a closed set, each with its own payload, the
                # | enum plus exhaustive match forces every variant to be handled
                label: "Una instrucción es una de un conjunto cerrado, cada una con su propio payload, el enum más el match exhaustivo obliga a que cada variante se maneje"  # @src=117fb9a34e03
                # | Closed set, per-variant payload, exhaustive dispatch. That is why a real
                # | program's instruction enum reads as home once you have modeled one, and
                # | why a kind string plus three structs is stringly-typed hoping.
                feedback: "Conjunto cerrado, payload por variante, dispatch exhaustivo. Por eso el enum de instrucciones de un programa de verdad se lee como jugar de local una vez que modelaste uno, y por eso un string kind más tres structs es esperanza tipada con cadenas."  # @src=b7025c56b1ee
              a:
                # | Enums serialize to a more compact byte layout than separate structs,
                # | which keeps transactions under the size limit and fees lower
                label: "Los enums serializan a una disposición de bytes más compacta que structs separados, lo que mantiene las transacciones debajo del límite de tamaño y las comisiones más bajas"  # @src=5ef48c45fe2d
                # | Wire size depends on the serialization scheme, not the Rust-side shape,
                # | the enum's win is in the type system, not the bytes.
                feedback: "El tamaño en el cable depende del esquema de serialización, no de la forma del lado de Rust, la ganancia del enum está en el sistema de tipos, no en los bytes."  # @src=3924dab2f2c9
      check-pairing:                      # quiz
        questions:
          m04l3-q4:
            # | Gate #3 now runs cargo test, clippy, and fmt in CI. A teammate objects: 'the
            # | compiler already type-checks, why pay for a lint step too?' What does clippy
            # | add?
            prompt: "La barrera #3 ahora corre cargo test, clippy y fmt en CI. Alguien del equipo objeta: 'el compilador ya verifica los tipos, ¿por qué pagar también por un step de lint?' ¿Qué agrega clippy?"  # @src=d6b9e4ba857e
            # | Type-checking proves the code is well-formed; clippy argues about whether
            # | it's WISE. In the pairing table it's the eslint seat: same job, different
            # | flag, and with -D warnings it goes from advice to gate.
            explanation: "La verificación de tipos demuestra que el código está bien formado; clippy discute sobre si es SABIO. En la tabla de emparejamiento es el asiento de eslint: mismo trabajo, bandera distinta, y con -D warnings pasa de consejo a barrera."  # @src=ec1d36a477bf
            options:                 # source order — keep it
              c:
                # | clippy flags correct-but-suspect code, lossy casts, ignored Results,
                # | needless clones, findings the type checker never gates on
                label: "clippy marca código correcto-pero-sospechoso, casts con pérdida, Results ignorados, clones innecesarios, hallazgos sobre los que el verificador de tipos nunca pone barrera"  # @src=9c05a3a9f3d8
                # | The type checker proves the code is well formed; clippy argues about
                # | whether it is wise. The planted needless clone is the proof: cargo test
                # | passed it happily because it was correct, just unwise.
                feedback: "El verificador de tipos demuestra que el código está bien formado; clippy discute sobre si es sabio. El clone innecesario plantado es la demostración: cargo test lo pasó feliz porque era correcto, solo que imprudente."  # @src=ba4a329e1be3
              b:
                # | Honestly not much, clippy is a formatting tool like rustfmt, and teams
                # | keep it in CI mostly to guarantee consistent diffs
                label: "Honestamente no mucho, clippy es una herramienta de formateo como rustfmt, y los equipos lo mantienen en CI sobre todo para garantizar diffs consistentes"  # @src=d3a4f4e3159f
                # | Formatting is rustfmt's job. clippy's lints are semantic: lossy casts,
                # | ignored Results, needless clones, review findings, not style.
                feedback: "El formateo es el trabajo de rustfmt. Los lints de clippy son semánticos: casts con pérdida, Results ignorados, clones innecesarios, hallazgos de review, no estilo."  # @src=2d044a148661
              a:
                # | clippy re-runs the borrow checker with stricter settings, catching the
                # | ownership and aliasing bugs that plain rustc silently misses
                label: "clippy vuelve a correr el verificador de préstamos con ajustes más estrictos, atrapando los bugs de ownership y aliasing que el rustc pelado deja pasar en silencio"  # @src=c8faa8eadf8e
                # | The borrow checker runs identically in both, clippy sits ABOVE
                # | type-correctness, flagging code that compiles fine but smells wrong.
                feedback: "El verificador de préstamos corre idéntico en los dos, clippy se sienta POR ENCIMA de la corrección de tipos, marcando código que compila bien pero huele mal."  # @src=c607abd2b33a
              d:
                # | It audits the dependency tree for advisories, the step that catches a
                # | compromised crate before it ever reaches a build
                label: "Audita el árbol de dependencias buscando advisories, el step que atrapa un crate comprometido antes de que llegue siquiera a un build"  # @src=8db38ff929b1
                # | That is a different tool and a later lesson: clippy reads your own
                # | source and never looks at what your dependencies are up to. Supply-chain
                # | auditing is its own gate, with its own crate.
                feedback: "Esa es otra herramienta y una lección posterior: clippy lee tu propio código fuente y nunca mira qué están tramando tus dependencias. La auditoría de cadena de suministro es su propia barrera, con su propio crate."  # @src=1233d265fc5b
          m04l3-q5:
            # | CI fails on cargo fmt --check, but the code compiles and every test passes
            # | locally. What is this gate for, and what's the right move?
            prompt: "CI falla en cargo fmt --check, pero el código compila y cada prueba pasa localmente. ¿Para qué es esta barrera, y cuál es la jugada correcta?"  # @src=11682ab51447
            # | fmt --check is the cheapest gate on the pipeline and buys the most social
            # | peace: diffs show logic changes only. One command fixes any failure. In the
            # | pairing: prettier for the TS fleet, rustfmt for the engine, same idea,
            # | different flag.
            explanation: "fmt --check es la barrera más barata del pipeline y compra la mayor paz social: los diffs muestran solo cambios de lógica. Un comando arregla cualquier falla. En el emparejamiento: prettier para la flota de TS, rustfmt para el motor, misma idea, bandera distinta."  # @src=681e3eac8e38
            options:                 # source order — keep it
              a:
                # | Run cargo fmt and commit, the gate exists so diffs show logic, not style
                # | noise; it's the prettier seat from your TS pipeline
                label: "Corre cargo fmt y commitea, la barrera existe para que los diffs muestren lógica, no ruido de estilo; es el asiento de prettier de tu pipeline de TS"  # @src=8e277e3b0eb7
                # | Cheapest step on the pipeline, most social peace per second: nobody
                # | spends a review comment on brace placement again, and when it goes red
                # | the fix is one command with no judgment calls in it.
                feedback: "El step más barato del pipeline, la mayor paz social por segundo: nadie vuelve a gastar un comentario de review en dónde va una llave, y cuando se pone en rojo el arreglo es un comando sin ninguna decisión de criterio adentro."  # @src=f5dc7adc9851
              b:
                # | Loosen the CI step so formatting differences warn instead of block,
                # | style should never stand between a green suite and a merge
                label: "Afloja el step de CI para que las diferencias de formato avisen en vez de bloquear, el estilo nunca debería interponerse entre una suite verde y un merge"  # @src=674ff55aef98
                # | A warn-only style gate decays into no gate; the value is that NOBODY
                # | debates style in review because the machine settled it.
                feedback: "Una barrera de estilo de solo-warning se pudre hasta no ser barrera; el valor es que NADIE debate estilo en el review porque la máquina lo resolvió."  # @src=5353e48f96b7
              d:
                # | Add a cargo fmt step ahead of the check so that CI formats the whole
                # | tree itself and the gate always passes
                label: "Agrega un step de cargo fmt delante del check para que CI formatee el árbol entero por sí mismo y la barrera pase siempre"  # @src=136112d9507f
                # | A gate's job is to refuse, not to fix. CI reformatting the tree either
                # | throws the change away at the end of the job or commits on your behalf,
                # | and either way the local habit never forms.
                feedback: "El trabajo de una barrera es rechazar, no arreglar. Que CI reformatee el árbol o tira el cambio a la basura al final del job o commitea en tu nombre, y de cualquiera de las dos formas el hábito local nunca se forma."  # @src=215c18bd1559
              c:
                # | Drop the job as redundant, rustfmt is advisory, and the compiler
                # | normalizes formatting anyway when it parses the source
                label: "Saca el job por redundante, rustfmt es orientativo, y el compilador normaliza el formato igual cuando parsea el código fuente"  # @src=59b7c4c2afb3
                # | The compiler never rewrites your source; unformatted code merges fine
                # | without the gate and pollutes every future diff.
                feedback: "El compilador nunca reescribe tu código fuente; el código sin formatear mergea bien sin la barrera y contamina cada diff futuro."  # @src=263352fb0293
          m04l3-q6:
            # | The driving question was 'how do you change code you're afraid of?' After
            # | this lesson, what concretely changed about refactoring the Rust engine?
            prompt: "La pregunta que guía era '¿cómo cambias código al que le tienes miedo?' Después de esta lección, ¿qué cambió concretamente sobre refactorizar el motor de Rust?"  # @src=01bb2b7dae91
            # | The answer to the driving question is a system, not courage: exhaustive
            # | matches turn refactors into compiler-guided checklists, and the
            # | test/lint/fmt gate catches what slips. It's the same safety the TS fleet has
            # | had since m02-l4, one pipeline, two languages, three gates.
            explanation: "La respuesta a la pregunta que guía es un sistema, no coraje: los matches exhaustivos convierten los refactors en checklists guiadas por el compilador, y la barrera de test/lint/fmt atrapa lo que se escapa. Es la misma seguridad que la flota de TS tiene desde m02-l4, un pipeline, dos lenguajes, tres barreras."  # @src=0fe3615c60f3
            options:                 # source order — keep it
              b:
                # | A red gate catches a missing arm, broken test, or suspect cast BEFORE
                # | the cron ships a bad engine, the contract vitest enforces on the fleet
                label: "Una barrera en rojo atrapa un brazo faltante, una prueba rota o un cast sospechoso ANTES de que el cron entregue un motor malo, el contrato que vitest hace cumplir sobre la flota"  # @src=bf506c5041b8
                # | Both halves of the station are now gated on one workflow, so it works on
                # | my machine and it will pass CI became the same sentence. That identity
                # | is worth more than any single test in the suite.
                feedback: "Las dos mitades de la estación ahora tienen barrera sobre un solo workflow, así que funciona en mi máquina y va a pasar CI se volvieron la misma oración. Esa identidad vale más que cualquier prueba individual de la suite."  # @src=8ea10408f886
              a:
                # | Nothing operational yet, the gates document intent, but they only start
                # | protecting the engine once M5 attaches the release build to the same
                # | workflow
                label: "Nada operativo todavía, las barreras documentan la intención, pero solo empiezan a proteger el motor una vez que M5 conecte el build de release al mismo workflow"  # @src=6ceb12d4700c
                # | The protection is live NOW: the workflow runs on every push, and you
                # | watched it go red on a planted lint before the fix.
                feedback: "La protección está en vivo AHORA: el workflow corre en cada push, y lo viste ponerse en rojo con un lint plantado antes del arreglo."  # @src=774826d80337
              d:
                # | The transition tests became redundant, since an exhaustive match already
                # | proves every state pair is handled correctly
                label: "Las pruebas de transición se volvieron redundantes, ya que un match exhaustivo ya demuestra que cada par de estados se maneja correctamente"  # @src=061a624d9028
                # | Exhaustiveness proves every pair is handled, never that it is handled
                # | RIGHT. Fill an arm with the wrong target state and the compiler stays
                # | quiet; the five transition tests are what notice.
                feedback: "La exhaustividad demuestra que cada par se maneja, nunca que se maneja BIEN. Llena un brazo con el estado target equivocado y el compilador se queda callado; las cinco pruebas de transición son las que se dan cuenta."  # @src=ee3e3a95891b
              c:
                # | Refactors can now merge without human review, since a green pipeline is
                # | proof the change is behaviorally correct end to end
                label: "Los refactors ahora pueden mergear sin review humano, ya que un pipeline verde es demostración de que el cambio es correcto en su comportamiento de punta a punta"  # @src=f44d27c89367
                # | Green means the gates you wrote all pass, it bounds the damage a change
                # | can do, it doesn't prove the change is right. Review still thinks; gates
                # | just never forget.
                feedback: "Verde quiere decir que las barreras que escribiste pasan todas, acota el daño que un cambio puede hacer, no demuestra que el cambio esté bien. El review todavía piensa; las barreras simplemente nunca olvidan."  # @src=04d63e510448
  m05-l1:
    # | serde: the boundary parser
    title: "serde: el parser de la frontera"  # @src=2d9628c89cae
    blocks:
      kv-config-parser:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | pair.split_once('=') splits on the FIRST '=' only and returns Option<(&str,
          # | &str)>, None is your "bad pair" case.
          0: "pair.split_once('=') parte solo en el PRIMER '=' y devuelve Option<(&str, &str)>, None es tu caso de \"bad pair\"."  # @src=b5de6b60c13f
          # | Track each field as an Option; after the loop, ok_or_else turns a None into
          # | the right "missing key: <k>" Err, check name, url, timeout_ms in that fixed
          # | order.
          1: "Rastrea cada campo como un Option; después del loop, ok_or_else convierte un None en el Err \"missing key: <k>\" correcto, verifica name, url, timeout_ms en ese orden fijo."  # @src=3224cc32bd5c
          # | value.parse::<u64>().map_err(|_| format!("invalid timeout_ms: {value}"))?, the
          # | m04-l2 error-mapping closure, doing exactly its job.
          2: "value.parse::<u64>().map_err(|_| format!(\"invalid timeout_ms: {value}\"))?, el closure de mapeo de errores de m04-l2, haciendo exactamente su trabajo."  # @src=cc85a45a278d
          # | Skip empty segments (a trailing ';' makes one) with a continue before
          # | splitting.
          3: "Sáltate los segmentos vacíos (un ';' final crea uno) con un continue antes de partir."  # @src=37eb286bb9f0
        tests:                      # keyed by test case id
          t1:
            # | a well-formed target line parses into all three fields
            description: "una línea de target bien formada parsea a los tres campos"  # @src=01047a7070ab
          t2:
            # | split on the FIRST '=' only, query-string '='s belong to the URL
            description: "partir solo en el PRIMER '=', los '=' del query string le pertenecen a la URL"  # @src=66389795f3ea
          t3:
            # | an unknown key is an error value, never silently ignored
            description: "una clave desconocida es un valor de error, nunca ignorada en silencio"  # @src=ea456d133ed5
          t4:
            # | a segment with no '=' is a bad pair
            description: "un segmento sin '=' es un par malo"  # @src=6ffd74a09323
          t5:
            # | only http:// and https:// schemes are legal probe targets
            description: "solo los schemes http:// y https:// son targets de sondeo legales"  # @src=c725a445ebe1
          t6:
            # | a non-numeric timeout is an error, not a default
