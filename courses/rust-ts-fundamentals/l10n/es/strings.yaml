                label: "Solo puede existir una referencia de cualquier tipo a la vez, así que el borrow compartido tiene que liberarse antes de que algo más toque el Vec"  # @src=7d5e75b1a4d6
                # | Many SHARED borrows may coexist happily, the rule only forbids mixing
                # | readers with a writer, not having several readers.
                feedback: "Muchos borrows COMPARTIDOS pueden coexistir felizmente, la regla solo prohíbe mezclar lectores con un escritor, no tener varios lectores."  # @src=3b240ab55f6f
              c:
                # | Many shared readers OR one exclusive writer, never both: push needs &mut
                # | self while your shared & is still live
                label: "Muchos lectores compartidos O un escritor exclusivo, nunca los dos: push necesita &mut self mientras tu & compartido todavía está vivo"  # @src=3ce87b7edd43
                # | push takes &mut self and your shared borrow is still live, so reader and
                # | writer overlap. A push can reallocate the buffer, which would leave
                # | `worst` pointing at memory nobody owns.
                feedback: "push toma &mut self y tu borrow compartido todavía está vivo, así que lector y escritor se superponen. Un push puede reasignar el buffer, lo que dejaría a `worst` apuntando a memoria de la que nadie es dueño."  # @src=741148bf109d
              b:
                # | A Vec becomes read-only forever once any reference to its contents has
                # | been taken anywhere in the program
                label: "Un Vec se vuelve de solo lectura para siempre una vez que se tomó cualquier referencia a su contenido en cualquier parte del programa"  # @src=1b8cc89a4b0b
                # | Borrows have scopes, once the last use of `worst` passes, the Vec is
                # | fully mutable again. Nothing is permanent.
                feedback: "Los borrows tienen scopes, una vez que pasa el último uso de `worst`, el Vec vuelve a ser completamente mutable. Nada es permanente."  # @src=8cbe69fdc14a
              d:
                # | The shared borrow is too weak, `worst` has to be a &mut so it and the
                # | push share one exclusive handle
                label: "El borrow compartido es demasiado débil, `worst` tiene que ser un &mut para que él y el push compartan un solo handle exclusivo"  # @src=ae64aa23a842
                # | Two exclusive borrows of one Vec is the stricter error, not the fix.
                # | Borrows have scopes: let the read finish before the write begins and
                # | this compiles with the shared borrow exactly as written.
                feedback: "Dos borrows exclusivos de un mismo Vec es el error más estricto, no el arreglo. Los borrows tienen scopes: deja que la lectura termine antes de que empiece la escritura y esto compila con el borrow compartido exactamente como está escrito."  # @src=c4989974564d
          m04l1-q4:
