            description: "un ';' final produce un segmento vacío, que se ignora"  # @src=907d168b424b
      check:                      # quiz
        questions:
          m05l1-q1:
            # | Your config's probe entries carry a "kind" field ("http" or "tcp") with
            # | different fields per kind. You model it as a Rust enum with #[serde(tag =
            # | "kind")]. What does that attribute buy you over leaving the enum untagged?
            prompt: "Las entradas de sonda de tu config llevan un campo \"kind\" (\"http\" o \"tcp\") con campos distintos por kind. Lo modelas como un enum de Rust con #[serde(tag = \"kind\")]. ¿Qué te compra ese atributo frente a dejar el enum untagged?"  # @src=1ba4bc88ceab
            # | Internally tagged representation reads the discriminant field first and
            # | dispatches to exactly one variant, the same job your TS discriminated
            # | union's "kind" field does for zod. Untagged means serde tries variants in
            # | order and takes the first that fits, which silently mis-parses ambiguous
            # | data and produces vague errors when nothing fits.
            explanation: "La representación etiquetada internamente lee primero el campo discriminante y despacha a exactamente una variante, el mismo trabajo que hace para zod el campo \"kind\" de tu unión discriminada de TS. Untagged quiere decir que serde prueba las variantes en orden y toma la primera que encaja, lo que parsea mal en silencio los datos ambiguos y produce errores vagos cuando no encaja nada."  # @src=b0f2adc970e9
            options:                 # source order — keep it
              c:
                # | Tagging switches serde over to compile-time input checking, so a config
                # | with a bad kind gets rejected when you build the crate instead of at
                # | runtime
                label: "Etiquetar cambia serde a verificación de entrada en tiempo de compilación, así que una config con un kind malo queda rechazada cuando construyes el crate en vez de en runtime"  # @src=53e4fce49f0a
                # | No derive can check runtime INPUT at compile time, the config file
                # | arrives long after the build. Tagging improves the runtime error, it
                # | can't move it.
                feedback: "Ningún derive puede verificar la ENTRADA de runtime en tiempo de compilación, el archivo de config llega mucho después del build. Etiquetar mejora el error de runtime, no lo puede mover."  # @src=db1dc21777ae
              a:
                # | Untagged enums can't hold variants with different fields at all, so the
                # | attribute is what lets Http and Tcp coexist in one enum
                label: "Los enums untagged no pueden sostener variantes con campos distintos de ninguna manera, así que el atributo es lo que deja a Http y Tcp coexistir en un solo enum"  # @src=95747dc17fc4
                # | Untagged enums compile fine with differing variants, the problem is how
                # | they MATCH input (first fit wins), not whether they compile.
                feedback: "Los enums untagged compilan bien con variantes que difieren, el problema es cómo COINCIDEN con la entrada (gana el primero que encaja), no si compilan."  # @src=d1cbf79a38df
              b:
                # | The "kind" field selects the variant explicitly, so a wrong kind fails
                # | with a named error instead of first-match-wins guessing
                label: "El campo \"kind\" selecciona la variante explícitamente, así que un kind equivocado falla con un error nombrado en vez de adivinar por gana-la-primera-coincidencia"  # @src=d967226533b7
                # | serde reads the discriminant first and dispatches to exactly one
                # | variant, which is why a bad kind comes back as `unknown variant grpc,
                # | expected http or tcp` with a line and column attached.
                feedback: "serde lee primero el discriminante y despacha a exactamente una variante, que es por lo que un kind malo vuelve como `unknown variant grpc, expected http or tcp` con línea y columna adjuntas."  # @src=ed30cd718d06
              d:
                # | Tagging also closes the entry to unknown fields, so a typo like
                # | "timout_ms" beside "kind" becomes a named error instead of ignored data
                label: "Etiquetar además cierra la entrada a los campos desconocidos, así que un typo como \"timout_ms\" al lado de \"kind\" se vuelve un error nombrado en vez de datos ignorados"  # @src=1ff03b77384d
                # | Different attribute, and one you cannot pair with this struct anyway:
                # | serde ignores unknown JSON fields by default, and deny_unknown_fields is
                # | documented as not combining with the flatten Target uses.
                feedback: "Otro atributo, y uno que de todos modos no puedes emparejar con este struct: serde ignora los campos JSON desconocidos por defecto, y deny_unknown_fields está documentado como que no se combina con el flatten que usa Target."  # @src=a0f3f496daa9
          m05l1-q2:
            # | In m02-l2 you wrote a zod schema and derived the TypeScript type from it
            # | with z.infer. Today you wrote a Rust struct and derived the parser from it.
            # | What is the shared discipline underneath both?
            prompt: "En m02-l2 escribiste un schema de zod y derivaste de él el tipo de TypeScript con z.infer. Hoy escribiste un struct de Rust y derivaste de él el parser. ¿Cuál es la disciplina compartida debajo de los dos?"  # @src=182f3190d318
            # | Both tools turn untrusted bytes into a trusted type at the edge, after that,
            # | no function needs to re-check. The direction differs (zod infers the type
            # | from the schema; serde derives the parser from the type) but the discipline
            # | is identical, and Rust adds compile-time enforcement: there is no untyped
            # | escape hatch to smuggle unparsed data past the boundary.
            explanation: "Las dos herramientas convierten bytes no confiables en un tipo confiable en el borde, y después de eso ninguna función necesita volver a verificar. La dirección difiere (zod infiere el tipo desde el schema; serde deriva el parser desde el tipo) pero la disciplina es idéntica, y Rust agrega que se haga cumplir en tiempo de compilación: no hay ninguna escotilla de escape sin tipar para pasar de contrabando datos sin parsear más allá de la frontera."  # @src=dcadba96d59d
            options:                 # source order — keep it
              d:
                # | Code generation: each tool emits the parser from one declaration, so the
                # | type and the validator can never drift apart
                label: "Generación de código: cada herramienta emite el parser desde una sola declaración, así el tipo y el validador nunca pueden desajustarse"  # @src=4be41b4d7194
                # | Only serde emits anything. zod's schema is a runtime value that walks
                # | your data, and z.infer reads a type off it; nothing is generated, which
                # | is why the two directions are opposite.
                feedback: "Solo serde emite algo. El schema de zod es un valor en runtime que recorre tus datos, y z.infer le lee un tipo encima; no se genera nada, que es por lo que las dos direcciones son opuestas."  # @src=3887a2e9159a
              a:
                # | Runtime schema objects: both libraries build a validator value that
                # | walks the raw input and returns either cleaned data or a structured list
                # | of issues
                label: "Objetos schema en runtime: las dos librerías construyen un valor validador que recorre la entrada cruda y devuelve o bien datos limpios o bien una lista estructurada de problemas"  # @src=73beed13d6e2
                # | That describes zod's mechanism, not the shared idea, serde generates
                # | parsing CODE at compile time; there is no runtime schema object walking
                # | your input.
                feedback: "Eso describe el mecanismo de zod, no la idea compartida, serde genera CÓDIGO de parseo en tiempo de compilación; no hay ningún objeto schema en runtime recorriendo tu entrada."  # @src=ca0bd648df6a
              b:
                # | Defensive validation: both let you re-check the parsed values anywhere
                # | in the program, so every function can guard its own inputs
                label: "Validación defensiva: las dos te dejan volver a verificar los valores parseados en cualquier parte del programa, así cada función puede proteger sus propias entradas"  # @src=9fe17da7813f
                # | Re-checking everywhere is the anti-pattern this discipline replaces, the
                # | whole point is to establish trust ONCE, at the boundary.
                feedback: "Volver a verificar en todos lados es el antipatrón que esta disciplina reemplaza, el punto entero es establecer confianza UNA VEZ, en la frontera."  # @src=28211ead1353
              c:
                # | Parse, don't validate: cross the boundary once, into a type that cannot
                # | represent the bad states, and the rest of the program trusts it
                label: "Parse, don't validate: cruza la frontera una vez, hacia un tipo que no puede representar los estados malos, y el resto del programa confía en él"  # @src=846c184ae202
                # | Same refusal at the door in both languages, and Rust enforces it harder
                # | because there is no any-shaped hatch to smuggle unparsed data past the
                # | parser.
                feedback: "El mismo rechazo en la puerta en los dos lenguajes, y Rust lo hace cumplir más fuerte porque no hay ninguna escotilla con forma de any para pasar de contrabando datos sin parsear más allá del parser."  # @src=304854c0e4fa
          m05l1-q3:
            # | Your first pipeline is targets.iter().filter(|t|
            # | t.enabled).map(to_probe_target), and nothing has run yet. What makes it
            # | execute?
            prompt: "Tu primer pipeline es targets.iter().filter(|t| t.enabled).map(to_probe_target), y todavía no corrió nada. ¿Qué lo hace ejecutarse?"  # @src=366c5d3cd75f
            # | Adapters (filter, map) are lazy: they wrap the iterator and describe a
            # | transformation. A consumer, collect, sum, a for loop, pulls elements through
            # | the whole chain one at a time. That's also why Rust chains don't allocate an
            # | intermediate collection per step the way chained JS array methods do. Full
            # | treatment: TRPL ch13, this lesson's go-deeper box.
            explanation: "Los adaptadores (filter, map) son perezosos: envuelven el iterador y describen una transformación. Un consumidor, collect, sum, un for loop, jala los elementos a través de la cadena entera de a uno por vez. Por eso también las cadenas de Rust no asignan una colección intermedia por paso como sí lo hacen los métodos de array encadenados de JS. Tratamiento completo: TRPL ch13, el cuadro de Profundiza de esta lección."  # @src=305bedc9fd31
            options:                 # source order — keep it
              b:
                # | Nothing extra, each adapter runs eagerly as it is chained, and the
                # | values are already transformed into a new collection by the time map
                # | returns
                label: "Nada extra, cada adaptador corre con avidez a medida que se encadena, y los valores ya están transformados en una colección nueva para cuando map devuelve"  # @src=9d5ddfaa0395
                # | That is how JS array chains behave (each .map allocates a new array
                # | immediately), Rust adapters build a description and do no work until
                # | consumed.
                feedback: "Así se comportan las cadenas de array de JS (cada .map asigna un array nuevo de inmediato), los adaptadores de Rust construyen una descripción y no hacen trabajo hasta que se los consume."  # @src=841994a81d3f
              c:
                # | Awaiting it, filter and map return futures, so the chain needs an async
                # | runtime spun up around it before any element is produced
                label: "Esperarla con await, filter y map devuelven futures, así que la cadena necesita un runtime async levantado a su alrededor antes de que se produzca ningún elemento"  # @src=b47248308113
                # | No futures here, iterators are synchronous and lazy. Async arrives next
                # | module for I/O; laziness is a separate idea.
                feedback: "Acá no hay futures, los iteradores son síncronos y perezosos. Async llega el próximo módulo para I/O; la pereza es una idea aparte."  # @src=800d346d23a3
              d:
                # | Naming the collection type on the binding, an inert chain starts pulling
                # | as soon as the compiler knows what container to build
                label: "Nombrar el tipo de la colección en el binding, una cadena inerte empieza a jalar en cuanto el compilador sabe qué contenedor construir"  # @src=49be44206fa4
                # | The annotation answers E0282, which asks collect WHAT to build, not
                # | WHETHER to run. A for loop needs no annotation and still drives the
                # | chain.
                feedback: "La anotación responde a E0282, que le pregunta a collect QUÉ construir, no SI correr. Un for loop no necesita anotación y aun así maneja la cadena."  # @src=48617cf46005
              a:
                # | A consumer like collect() or a for loop, iterator adapters are lazy and
                # | only describe the work until something drains them
                label: "Un consumidor como collect() o un for loop, los adaptadores de iterador son perezosos y solo describen el trabajo hasta que algo los drena"  # @src=2fb4e3520fca
                # | The consumer pulls each element through the whole chain in one pass,
                # | which is also why no intermediate collection gets allocated per step.
                feedback: "El consumidor jala cada elemento a través de la cadena entera en una sola pasada, que es también por lo que no se asigna ninguna colección intermedia por paso."  # @src=658b9ed02589
          m05l1-q4:
            # | serde_json::from_str::<Config>(&raw) hits a config where timeout_ms is the
            # | string "fast". What lands in your program?
            prompt: "serde_json::from_str::<Config>(&raw) se encuentra con una config donde timeout_ms es la cadena \"fast\". ¿Qué aterriza en tu programa?"  # @src=d6e3b060a615
            # | from_str returns Result<Config, serde_json::Error>, and the error knows its
            # | line and column, a parse failure is a value that flows through the same
            # | map_err/? plumbing as everything else in the engine. This is why the
            # | hand-rolled parser you wrote in the challenge and the derived one are
            # | drop-in equals at the type level; serde just writes better errors than you
            # | were going to.
            explanation: "from_str devuelve Result<Config, serde_json::Error>, y el error conoce su línea y su columna, una falla de parseo es un valor que fluye por la misma plomería de map_err/? que todo lo demás en el motor. Por eso el parser hecho a mano que escribiste en el challenge y el derivado son equivalentes drop-in a nivel de tipos; serde simplemente escribe mejores errores que los que ibas a escribir tú."  # @src=49abfc7e944c
            options:                 # source order — keep it
              a:
                # | A panic at the parse site, type mismatches inside derived parsers are
                # | unrecoverable and abort before your code resumes
                label: "Un panic en el sitio del parseo, los desajustes de tipo adentro de los parsers derivados son irrecuperables y abortan antes de que tu código retome"  # @src=76dfc29a3ab2
                # | Nothing panics unless YOU unwrap it, the derived parser returns the
                # | failure as a value, exactly like every parser you wrote in m04-l2.
                feedback: "Nada da panic a menos que TÚ le hagas unwrap, el parser derivado devuelve la falla como un valor, exactamente igual que cada parser que escribiste en m04-l2."  # @src=cb47e26c7c5d
              b:
                # | An Err value carrying what went wrong and where (line and column), which
                # | your ? chain propagates like any other boundary failure
                label: "Un valor Err que lleva qué salió mal y dónde (línea y columna), que tu cadena de ? propaga como cualquier otra falla de frontera"  # @src=1f2834465d09
                # | The drill prints it verbatim: `invalid type: string "fast", expected u64
                # | at line 16 column 25`, routed by the same map_err plumbing as every
                # | other failure in the engine.
                feedback: "El ejercicio lo imprime textualmente: `invalid type: string \"fast\", expected u64 at line 16 column 25`, ruteado por la misma plomería de map_err que cualquier otra falla en el motor."  # @src=8460d4beb5f0
              d:
                # | An Err naming the offending field but not its position, since line and
                # | column need a pass through serde_json::Value
                label: "Un Err que nombra el campo ofensor pero no su posición, porque la línea y la columna necesitan una pasada por serde_json::Value"  # @src=999d5c36d3f2
                # | Position comes free. serde_json tracks line and column as it reads, so
                # | the one-step from_str error already prints `at line 16 column 25` with
                # | no Value detour.
                feedback: "La posición viene gratis. serde_json rastrea la línea y la columna a medida que lee, así que el error de un solo paso de from_str ya imprime `at line 16 column 25` sin ningún desvío por Value."  # @src=fe2bcdec0508
              c:
                # | An Ok(Config) with timeout_ms set to its type default, plus a warning,
                # | serde recovers leniently unless you opt into strict mode
                label: "Un Ok(Config) con timeout_ms puesto en el default de su tipo, más un warning, serde se recupera con lenidad a menos que optes por el modo estricto"  # @src=dcb8b56799a1
                # | serde is strict by default, no silent defaults, no warnings. (Opt-in
                # | lenience exists per-field via #[serde(default)], which is the opposite
                # | arrangement.)
                feedback: "serde es estricto por defecto, sin defaults silenciosos, sin warnings. (La lenidad opcional existe por campo vía #[serde(default)], que es la disposición opuesta.)"  # @src=3aa6f2af47dc
  m05-l2:
    # | cargo mastery: editions, workspaces, features, MSRV
    title: "dominio de cargo: editions, workspaces, features, MSRV"  # @src=1e816c33af65
    blocks:
      check:                      # quiz
        questions:
          m05l2-q1:
            # | You declare rust-version = "1.82" on pulse-engine and your workspace uses
            # | resolver v3. What did you actually change about dependency resolution?
            prompt: "Declaras rust-version = \"1.82\" en pulse-engine y tu workspace usa el resolver v3. ¿Qué cambiaste en realidad sobre la resolución de dependencias?"  # @src=43009e34d6b1
            # | Resolver v3 (the edition-2024 default, needs Rust 1.84+) flips the
            # | resolver.incompatible-rust-versions key, plural, the edition guide prints a
            # | typo, from allow to fallback: version selection respects your declared MSRV.
            # | rust-version stops being documentation and becomes an input to the resolver.
            explanation: "El resolver v3 (el default de la edition 2024, necesita Rust 1.84+) cambia la clave resolver.incompatible-rust-versions, plural, la guía de editions imprime un typo, de allow a fallback: la selección de versiones respeta tu MSRV declarado. rust-version deja de ser documentación y se vuelve una entrada del resolver."  # @src=c2dc541f41e2
            options:                 # source order — keep it
              a:
                # | Nothing about resolution, rust-version only prints a warning banner when
                # | an older toolchain runs cargo build on your crate
                label: "Nada sobre la resolución, rust-version solo imprime un banner de advertencia cuando un toolchain más viejo corre cargo build en tu crate"  # @src=066fc939d8e8
                # | It's stronger than a warning (cargo errors on unsupported toolchains),
                # | and under resolver v3 it actively shapes which dependency versions get
                # | picked.
                feedback: "Es más fuerte que una advertencia (cargo da error con toolchains no soportados), y bajo el resolver v3 le da forma activamente a qué versiones de dependencia se eligen."  # @src=376257d7be71
              b:
                # | Dependencies are now vendored at their 1.82-era versions in the
                # | lockfile, and cargo update refuses to move any of them past that era
                label: "Las dependencias ahora quedan vendoreadas en sus versiones de la era 1.82 en el lockfile, y cargo update se niega a mover ninguna de ellas más allá de esa era"  # @src=c5ad7ffcbd65
                # | No vendoring or freezing happens, resolution still prefers new versions;
                # | it just falls back past releases whose own MSRV exceeds yours.
                feedback: "No pasa ningún vendoreo ni congelamiento, la resolución sigue prefiriendo versiones nuevas; simplemente retrocede más allá de los releases cuyo propio MSRV supera el tuyo."  # @src=3c28eaee224e
              d:
                # | Your own builds now run under 1.82, cargo selects the declared toolchain
                # | so a newer rustc on the box cannot leak in
                label: "Tus propios builds ahora corren bajo 1.82, cargo selecciona el toolchain declarado así un rustc más nuevo de la máquina no se puede filtrar"  # @src=7ac6cb1da7b5
                # | rust-version is a floor, not a toolchain selector. It stops an older
                # | rustc from building you; it never stops YOU on a newer one from writing
                # | an idiom 1.82 cannot parse, which is why serious libraries add an MSRV
                # | CI job.
                feedback: "rust-version es un piso, no un selector de toolchain. Detiene a un rustc más viejo de construirte; nunca te detiene a TI, en uno más nuevo, de escribir un idiom que 1.82 no puede parsear, que es por qué las librerías serias agregan un job de CI de MSRV."  # @src=6a596121842e
              c:
                # | Resolution became MSRV-aware: cargo prefers dependency versions whose
                # | own rust-version fits 1.82 instead of grabbing the newest compatible
                label: "La resolución se volvió consciente del MSRV: cargo prefiere versiones de dependencia cuyo propio rust-version encaja con 1.82 en vez de agarrar la más nueva compatible"  # @src=244a1b3069de
                # | v3 flips resolver.incompatible-rust-versions from allow to fallback, so
                # | a candidate release that demands a newer compiler than 1.82 gets skipped
                # | for one that fits.
                feedback: "v3 cambia resolver.incompatible-rust-versions de allow a fallback, así que un release candidato que exige un compilador más nuevo que 1.82 se saltea por uno que encaja."  # @src=b17ea85d5cd6
          m05l2-q2:
            # | Following agave's shape, you hoist serde into [workspace.dependencies] at
            # | the root. What must each member crate now do to use it?
            prompt: "Siguiendo la forma de agave, elevas serde a [workspace.dependencies] en la raíz. ¿Qué tiene que hacer ahora cada crate member para usarlo?"  # @src=e51169a96723
            # | One declaration at the root (version + features + default-features), then
            # | serde = { workspace = true } per consuming member. Version bumps become a
            # | one-line diff, and no two crates in the workspace can silently drift onto
            # | different serde lines, agave runs its entire dependency surface this way.
            explanation: "Una declaración en la raíz (version + features + default-features), después serde = { workspace = true } por cada member que la consuma. Los bumps de versión se vuelven un diff de una línea, y ningún par de crates del workspace puede desviarse en silencio hacia líneas distintas de serde, agave corre su superficie de dependencias entera de esta manera."  # @src=094e2d5808a7
            options:                 # source order — keep it
              d:
                # | Subscribe with workspace = true and restate features = ["derive"], since
                # | inheritance carries the version string but not the feature list
                label: "Suscribirse con workspace = true y volver a declarar features = [\"derive\"], ya que la herencia lleva la cadena de versión pero no la lista de features"  # @src=9b09c231c2d1
                # | The root entry declares version AND features together, and the
                # | subscription inherits both, which is why the engine's block is three
                # | bare workspace = true lines.
                feedback: "La entrada de la raíz declara version Y features juntas, y la suscripción hereda las dos, que es por qué el bloque del motor son tres líneas peladas de workspace = true."  # @src=b68ca7c3f704
              b:
                # | Nothing, root-declared workspace dependencies are injected into every
                # | member's build automatically, which is the whole point of centralizing
                label: "Nada, las dependencias de workspace declaradas en la raíz se inyectan automáticamente en el build de cada member, que es el punto entero de centralizar"  # @src=132fda69f982
                # | Members that never mention serde don't get it, automatic injection would
                # | bloat every crate with every dep. The root declares; each member still
                # | opts in.
                feedback: "Los members que nunca mencionan serde no lo reciben, la inyección automática inflaría cada crate con cada dep. La raíz declara; cada member igual tiene que optar."  # @src=f6c758941295
              c:
                # | Re-declare it with an identical version string, which cargo then
                # | verifies against the root and rejects the build on any version mismatch
                # | between them
                label: "Volver a declararla con una cadena de versión idéntica, que cargo después verifica contra la raíz y rechaza el build ante cualquier desajuste de versión entre las dos"  # @src=312d34b726ef
                # | Re-declaring versions per member is exactly the duplication the pattern
                # | deletes, members write workspace = true and carry no version digits at
                # | all.
                feedback: "Volver a declarar versiones por member es exactamente la duplicación que el patrón borra, los members escriben workspace = true y no cargan ningún dígito de versión."  # @src=b40a3c187e6a
              a:
                # | Opt in explicitly with serde = { workspace = true } in its own
                # | [dependencies], the root declares the version once, members subscribe
                label: "Optar explícitamente con serde = { workspace = true } en su propio [dependencies], la raíz declara la versión una vez, los members se suscriben"  # @src=5e7cbcd542dc
                # | That subscription is the whole member-side diff: no digits, no feature
                # | list. A version bump is then one line at the root and no two crates can
                # | drift onto different serde lines.
                feedback: "Esa suscripción es el diff entero del lado del member: sin dígitos, sin lista de features. Un bump de versión es entonces una línea en la raíz y ningún par de crates puede desviarse hacia líneas distintas de serde."  # @src=6b0d71d72d03
          m05l2-q3:
            # | agave declares its shared deps with default-features = false. What is that
            # | hygiene actually buying, given the deps still compile fine without it?
            prompt: "agave declara sus deps compartidas con default-features = false. ¿Qué está comprando esa higiene en realidad, dado que las deps igual compilan bien sin ella?"  # @src=c165e0b3c0f2
            # | Defaults serve the average consumer; a workspace is not average.
            # | defaults-off + named features means every capability in the build was chosen
            # | on purpose, smaller binaries, faster builds, and a manifest that documents
            # | what each dep is actually FOR. The cost is the footgun you met in the lab: a
            # | missing feature surfaces as a confusing missing-item error inside the dep,
            # | and cargo tree -e features is how you find it.
            explanation: "Los defaults sirven al consumidor promedio; un workspace no es promedio. defaults apagados + features nombradas quiere decir que cada capacidad del build fue elegida a propósito, binarios más chicos, builds más rápidos, y un manifest que documenta PARA QUÉ sirve en realidad cada dep. El costo es la trampa que conociste en el lab: una feature que falta sale a la superficie como un error confuso de ítem faltante adentro de la dep, y cargo tree -e features es cómo la encuentras."  # @src=9e618177c770
            options:                 # source order — keep it
              c:
                # | Semver safety, default feature sets may change in minor releases, so
                # | pinning features off is the only way to keep minor upgrades from
                # | breaking your build
                label: "Seguridad de semver, los conjuntos de features por defecto pueden cambiar en releases minor, así que fijar las features apagadas es la única manera de evitar que los upgrades minor rompan tu build"  # @src=dc596af872ee
                # | Removing a default feature is treated as a breaking change in ecosystem
                # | convention anyway, the hygiene is about compile surface and intent, not
                # | semver protection.
                feedback: "Sacar una feature por defecto se trata igual como un cambio de ruptura por convención del ecosistema, la higiene es sobre superficie de compilación e intención, no sobre protección de semver."  # @src=824c652c7414
              d:
                # | Graph-wide reach: one defaults-off line at the root turns those defaults
                # | off for each crate that pulls the same dep in
                label: "Alcance en todo el grafo: una línea de defaults apagados en la raíz apaga esos defaults para cada crate que jala la misma dep"  # @src=640eea98f608
                # | Features are additive and cargo unifies them, so one other consumer
                # | asking for default turns default back on for the shared build.
                # | Defaults-off constrains what YOU request, not what the graph resolves
                # | to.
                feedback: "Las features son aditivas y cargo las unifica, así que un solo consumidor más pidiendo default vuelve a prender default para el build compartido. Defaults apagados restringe lo que pides TÚ, no aquello a lo que resuelve el grafo."  # @src=a55f72a3c97c
              a:
                # | Faster resolution, with defaults off, cargo skips feature unification
                # | across the graph and resolves each crate independently
                label: "Resolución más rápida, con los defaults apagados, cargo se saltea la unificación de features por todo el grafo y resuelve cada crate de forma independiente"  # @src=aa3fd1a167a7
                # | Feature unification still runs regardless, defaults-off changes WHAT
                # | gets unified in (less), not whether unification happens.
                feedback: "La unificación de features corre igual de todas formas, defaults apagados cambia QUÉ se unifica adentro (menos), no si la unificación pasa."  # @src=e5dc227c4ce4
              b:
                # | Deliberate surface area: each crate compiles only the capabilities it
                # | names, instead of every default the dep author chose for the general
                # | case
                label: "Superficie deliberada: cada crate compila solo las capacidades que nombra, en vez de cada default que el autor de la dep eligió para el caso general"  # @src=57ad7e95c1e9
                # | Smaller binaries and faster builds fall out of it, but the durable
                # | payoff is a manifest that documents what each dependency is FOR, which
                # | is why agave runs reqwest and clap defaults-off while leaving serde's
                # | defaults on.
                feedback: "Los binarios más chicos y los builds más rápidos salen solos de eso, pero el pago durable es un manifest que documenta PARA QUÉ sirve cada dependencia, que es por qué agave corre reqwest y clap con defaults apagados mientras deja prendidos los defaults de serde."  # @src=8b21dce3e427
          m05l2-q4:
            # | The pin-reading drill: agave pins reqwest at 0.12.28 while crates.io latest
            # | is 0.13.4, and pins clap at 2.33.1, a decade-old major. You're about to open
            # | a PR against agave. What's the professional read?
            prompt: "El ejercicio de leer pins: agave fija reqwest en 0.12.28 mientras el latest de crates.io es 0.13.4, y fija clap en 2.33.1, una major de hace una década. Estás por abrir un PR contra agave. ¿Cuál es la lectura profesional?"  # @src=b2be76343f02
            # | A pin in a living repo is information: someone chose it, and something
            # | (migration cost, behavior differences, MSRV, sheer risk surface) is holding
            # | it. Photon's sqlx 0.6 pin is the gold standard, the comment links the
            # | upstream issue that blocks the upgrade. Match the ecosystem you're
            # | contributing to; propose upgrades as upgrades. That reading skill is exactly
            # | what m09-l1's audit lab will grade on your own tree.
            explanation: "Un pin en un repo vivo es información: alguien lo eligió, y algo (costo de migración, diferencias de comportamiento, MSRV, pura superficie de riesgo) lo está sosteniendo. El pin de sqlx 0.6 de Photon es el estándar de oro, el comentario enlaza el issue upstream que bloquea el upgrade. Iguala el ecosistema al que estás contribuyendo; propón los upgrades como upgrades. Esa habilidad de lectura es exactamente lo que el lab de auditoría de m09-l1 va a calificar sobre tu propio árbol."  # @src=60ebc20c2746
            options:                 # source order — keep it
              a:
                # | The repo is under-maintained on dependencies, a good first PR is the
                # | reqwest 0.13 and clap 4 upgrades before touching anything else
                label: "El repo está mal mantenido en dependencias, un buen primer PR son los upgrades a reqwest 0.13 y clap 4 antes de tocar cualquier otra cosa"  # @src=65980a565711
                # | A pinned major in a repo this actively maintained is a decision, not
                # | neglect, drive-by major upgrades of core deps are the classic rejected
                # | first PR.
                feedback: "Una major fijada en un repo así de activamente mantenido es una decisión, no descuido, los upgrades drive-by de majors de deps centrales son el clásico primer PR rechazado."  # @src=20f5cc59ff31
              d:
                # | Scope the new versions to your own member crate, so your patch uses 0.13
                # | and clap 4 idioms without moving the shared pins
                label: "Acota las versiones nuevas a tu propio crate member, así tu patch usa los idioms de 0.13 y clap 4 sin mover los pins compartidos"  # @src=1c61a656d19c
                # | There is no per-member escape in this layout. agave centralizes versions
                # | in [workspace.dependencies], so one crate's clap is every crate's clap,
                # | and that coupling is exactly why the old pin holds.
                feedback: "No hay escape por member en este layout. agave centraliza las versiones en [workspace.dependencies], así que el clap de un crate es el clap de todos los crates, y ese acoplamiento es exactamente por qué el pin viejo se sostiene."  # @src=5ae2cd365ecc
              b:
                # | Old pins mean old code: read the pinned MAJORS' docs for anything you
                # | touch, since 0.13-era or clap-4 idioms won't exist anywhere in this
                # | codebase yet
                label: "Los pins viejos quieren decir código viejo: lee los docs de las MAJORS fijadas para todo lo que toques, ya que los idioms de la era 0.13 o de clap 4 todavía no van a existir en ninguna parte de este codebase"  # @src=f3b9b0a650af
                # | Half right, you should code against the pinned versions, but the missing
                # | (and larger) read is that the pins are deliberate choices you don't
                # | relitigate inside an unrelated PR.
                feedback: "A medias, deberías programar contra las versiones fijadas, pero la lectura que falta (y la más grande) es que los pins son elecciones deliberadas que no relitigas adentro de un PR no relacionado."  # @src=90c933fdf6a3
              c:
                # | Deliberate pins are contracts: write your patch against 0.12 and clap 2
                # | idioms, and treat upgrading either as its own proposal, not a rider
                label: "Los pins deliberados son contratos: escribe tu patch contra los idioms de 0.12 y clap 2, y trata actualizar cualquiera de los dos como su propia propuesta, no como un colado"  # @src=96efcb2a56a5
                # | A pin in a living repo is information: something is holding it,
                # | migration cost or behaviour risk or sheer review surface. Photon's sqlx
                # | comment linking the upstream issue is the shape to copy when you pin.
                feedback: "Un pin en un repo vivo es información: algo lo está sosteniendo, costo de migración o riesgo de comportamiento o pura superficie de review. El comentario de sqlx de Photon que enlaza el issue upstream es la forma a copiar cuando fijas."  # @src=4a84fc371f66
  m05-l3:
    # | clap, a real probe arm, and a binary anyone can download
    title: "clap, un brazo de sonda de verdad, y un binario que cualquiera puede descargar"  # @src=fb3d27afc4c1
    blocks:
      check:                      # quiz
        questions:
          m05l3-q1:
            # | You put #[derive(Parser)] on an Args struct with two subcommands and ran
            # | `cargo run -- --help`. Where did the formatted help screen, usage lines, and
            # | version string come from?
            prompt: "Le pusiste #[derive(Parser)] a un struct Args con dos subcomandos y corriste `cargo run -- --help`. ¿De dónde salieron la pantalla de ayuda formateada, las líneas de uso y la cadena de versión?"  # @src=74b2587007d3
            # | clap's derive is the same trick serde pulled last lesson: the type is the
            # | spec, and the macro generates the code, parser, validation, --help,
            # | --version, error messages. Your TS CLI's hand-rolled argument handling in M1
            # | is the 'before' picture; a doc comment on a field becoming its help line is
            # | the 'after'.
            explanation: "El derive de clap es el mismo truco que sacó serde la lección pasada: el tipo es el spec, y el macro genera el código, el parser, la validación, --help, --version, los mensajes de error. El manejo de argumentos hecho a mano en tu CLI de TS en M1 es la foto del 'antes'; un doc comment en un campo volviéndose su línea de ayuda es el 'después'."  # @src=e2ae2650654b
            options:                 # source order — keep it
              a:
                # | Generated at compile time from your struct: field names, types, and doc
                # | comments become flags, value parsers, and help text
                label: "Generados en tiempo de compilación desde tu struct: los nombres de campo, los tipos y los doc comments se vuelven flags, parsers de valores y texto de ayuda"  # @src=45c7ce095260
                # | Same trick serde pulled on your config: the type is the spec and the
                # | macro writes the machinery. That is why a doc comment on a variant turns
                # | into its line in the command list.
                feedback: "El mismo truco que sacó serde con tu config: el tipo es el spec y el macro escribe la maquinaria. Por eso un doc comment en una variante se convierte en su línea de la lista de comandos."  # @src=a217c1bb7e9d
              c:
                # | From a clap.toml manifest the derive scaffolds next to Cargo.toml on
                # | first build, which you edit to customize the help output
                label: "De un manifest clap.toml que el derive genera al lado de Cargo.toml en el primer build, que editas para personalizar la salida de ayuda"  # @src=bd4d3e559a83
                # | No side file exists, the struct IS the interface definition;
                # | customization happens through attributes and doc comments on the struct
                # | itself.
                feedback: "No existe ningún archivo aparte, el struct ES la definición de la interfaz; la personalización pasa por atributos y doc comments en el struct mismo."  # @src=3f07ab43d1b7
              d:
                # | Half derived, half runtime: the flags come from the struct, but version
                # | and about are read out of Cargo.toml on startup
                label: "Mitad derivado, mitad runtime: las flags vienen del struct, pero version y about se leen de Cargo.toml al arrancar"  # @src=261e0e4a63df
                # | Nothing is read at startup. #[command(version, about)] bakes those
                # | strings in at compile time, which is why the Release asset a stranger
                # | downloads still prints -V with no Cargo.toml anywhere near it.
                feedback: "Nada se lee al arrancar. #[command(version, about)] hornea esas cadenas en tiempo de compilación, por eso el Release asset que descarga un desconocido sigue imprimiendo -V sin ningún Cargo.toml cerca."  # @src=7192412551cd
              b:
                # | From a help template clap ships and fills at runtime by reflecting over
                # | the binary's symbol table to discover argument names
                label: "De una plantilla de ayuda que clap ya trae y llena en runtime, reflejando sobre la tabla de símbolos del binario para descubrir los nombres de los argumentos"  # @src=93fe4efc4fd4
                # | Rust has no runtime reflection to lean on, the derive macro reads your
                # | struct at COMPILE time and generates the parsing and help code right
                # | there.
                feedback: "Rust no tiene reflexión en runtime en la que apoyarse, el macro derive lee tu struct en tiempo de COMPILACIÓN y genera el código de parseo y de ayuda ahí mismo."  # @src=e21fece3b37d
          m05l3-q2:
            # | You chose BLOCKING reqwest for the CLI's probe arm, knowing the poller next
            # | module will go async. Why is blocking the right engineering call here, not a
            # | shortcut?
            prompt: "Elegiste reqwest BLOCKING para el brazo de sonda de la CLI, sabiendo que el poller del módulo que viene va a pasar a async. ¿Por qué blocking es la decisión de ingeniería correcta acá, y no un atajo?"  # @src=eb32b6a6bfe4
            # | Concurrency is the thing async buys, and a sequential, short-lived CLI has
            # | none to exploit, a runtime would be pure overhead and a new concept spent on
            # | no benefit. The moment the poller wants fifty probes in flight on a schedule
            # | (next module's opening problem), the same crate grows the async delta.
            # | Choosing the simple tool ON PURPOSE, with the upgrade path named, is the
            # | lesson.
            explanation: "La concurrencia es lo que compra async, y una CLI secuencial y de vida corta no tiene ninguna que explotar, un runtime sería puro overhead y un concepto nuevo gastado sin beneficio. En el momento en que el poller quiera cincuenta sondas en vuelo en un calendario (el problema con el que abre el módulo que viene), el mismo crate le crece el delta async. Elegir la herramienta simple A PROPÓSITO, con el camino de upgrade nombrado, es la lección."  # @src=2f2869ee4c7e
            options:                 # source order — keep it
              c:
                # | Async reqwest can't run in a binary crate without a web framework
                # | attached, so a standalone CLI has to use the blocking client
                label: "El reqwest async no puede correr en un crate binario sin un framework web pegado, así que una CLI suelta tiene que usar el cliente blocking"  # @src=e16f673f6d74
                # | Async runs fine in any binary with a runtime attached (tokio's main
                # | macro is one line), no framework needed. The reason is fit, not
                # | possibility.
                feedback: "El async corre bien en cualquier binario con un runtime pegado (el macro main de tokio es una línea), sin framework necesario. La razón es el encaje, no la posibilidad."  # @src=b8ff99c6c6f2
              b:
                # | A CLI probing targets one at a time, then exiting, gains nothing from a
                # | runtime, async earns its cost when many probes are in flight at once
                label: "Una CLI que sondea targets uno por uno y después sale no gana nada de un runtime, async se gana su costo cuando hay muchas sondas en vuelo a la vez"  # @src=d1f5ccaaa417
                # | Concurrency is what async buys, and a sequential short-lived program has
                # | none to exploit. Naming the upgrade path (fifty probes on a schedule,
                # | next module) is what makes it a choice rather than a dodge.
                feedback: "La concurrencia es lo que compra async, y un programa secuencial de vida corta no tiene ninguna que explotar. Nombrar el camino de upgrade (cincuenta sondas en un calendario, el módulo que viene) es lo que la vuelve una elección en vez de una esquiva."  # @src=873a6d1cf670
              a:
                # | Blocking is reqwest's mature default surface, the async API is the
                # | newer, still-stabilizing half of the crate and riskier to teach in a
                # | fundamentals course
                label: "Blocking es la superficie madura por defecto de reqwest, la API async es la mitad más nueva del crate, todavía estabilizándose, y más riesgosa de enseñar en un curso de fundamentos"  # @src=67b721f3c322
                # | It's the reverse, async IS reqwest's default surface, and blocking is
                # | the feature-gated add-on. The choice is about the program's shape, not
                # | API maturity.
                feedback: "Es al revés, async ES la superficie por defecto de reqwest, y blocking es el add-on que vive detrás de una feature. La elección es sobre la forma del programa, no sobre la madurez de la API."  # @src=e2bf4a261836
              d:
                # | An async client would pull a tokio runtime into pulse-engine itself, and
                # | the pure core generally has to stay runtime-free for the WASM target
                # | m07-l2 wants
                label: "Un cliente async jalaría un runtime de tokio hacia pulse-engine mismo, y el núcleo puro en general tiene que quedarse sin runtime para el target WASM que quiere m07-l2"  # @src=c1b04f9c9092
                # | The HTTP arm lives in pulse-cli either way, so the engine's purity is
                # | bought by crate placement, not by which client you pick. An async fetch
                # | would put tokio in the CLI and leave the engine untouched.
                feedback: "El brazo de HTTP vive en pulse-cli de cualquier forma, así que la pureza del motor se compra con la ubicación del crate, no con qué cliente eliges. Un fetch async pondría tokio en la CLI y dejaría el motor intacto."  # @src=742d65259b98
          m05l3-q3:
            # | Your latency-stats pass ran visibly faster after cargo build --release, and
            # | a u64 overflow that panicked in the debug build now wraps silently. What
            # | changed between the profiles?
            prompt: "Tu pasada de latency-stats corrió visiblemente más rápido después de cargo build --release, y un overflow de u64 que daba panic en el build debug ahora da wrap en silencio. ¿Qué cambió entre los perfiles?"  # @src=c0264bb208c3
            # | Profiles are named bundles of compiler settings: dev prioritizes compile
            # | speed and loud failures (overflow panics), release prioritizes runtime speed
            # | (opt-level 3, overflow wraps). That personality change is exactly why m04-l2
            # | taught checked_add, YOUR arithmetic tells the truth in both profiles, and
            # | why every performance number in this course is measured on --release.
            explanation: "Los perfiles son paquetes con nombre de configuraciones del compilador: dev prioriza la velocidad de compilación y las fallas ruidosas (el overflow da panic), release prioriza la velocidad en runtime (opt-level 3, el overflow da wrap). Ese cambio de personalidad es exactamente por lo que m04-l2 enseñó checked_add, TU aritmética dice la verdad en los dos perfiles, y por lo que cada número de rendimiento de este curso se mide en --release."  # @src=971fb9a122c9
            options:                 # source order — keep it
              c:
                # | The profile flipped: optimizations on, debug assertions and overflow
                # | checks off, a different binary with a different personality
                label: "El perfil volteó: optimizaciones prendidas, aserciones de debug y checks de overflow apagados, un binario distinto con una personalidad distinta"  # @src=dc156e453021
                # | opt-level, debug-assertions and overflow-checks are the three knobs
                # | behind the two personalities, which is why any performance claim made
                # | off a dev binary is off by an order of magnitude.
                feedback: "opt-level, debug-assertions y overflow-checks son las tres perillas detrás de las dos personalidades, por lo que cualquier afirmación de rendimiento hecha sobre un binario dev está errada por un orden de magnitud."  # @src=a3d79069fe52
              b:
                # | Release runs the same machine code with runtime assertions disabled by
                # | an environment flag, which is why the speedup varies per machine
                label: "Release corre el mismo código de máquina con las aserciones de runtime desactivadas por una flag de entorno, por lo que la aceleración varía según la máquina"  # @src=732bad05a17e
                # | The machine code itself is different, the optimizer recompiles
                # | everything at opt-level 3; no environment flag is involved.
                feedback: "El código de máquina mismo es distinto, el optimizador recompila todo en opt-level 3; no hay ninguna flag de entorno involucrada."  # @src=ef5087fe7fb8
              d:
                # | Debug symbols: the dev binary carries them, so it runs slower and traps
                # | overflow, and release strips them for speed
                label: "Los símbolos de debug: el binario dev los lleva, así que corre más lento y atrapa el overflow, y release se los quita por velocidad"  # @src=9378d625ecc8
                # | Symbols explain the size gap, not the speed gap and not the arithmetic.
                # | Overflow behaviour is the overflow-checks knob; you can keep full debug
                # | info in a release profile and it still wraps.
                feedback: "Los símbolos explican el hueco de tamaño, no el hueco de velocidad y no la aritmética. El comportamiento del overflow es la perilla overflow-checks; puedes quedarte con todo el debug info en un perfil release y todavía da wrap."  # @src=75bfdc1aec32
              a:
                # | Release strips the standard library's safety checks from your binary,
                # | trading bounds checking and overflow detection for raw speed
                label: "Release le quita a tu binario las verificaciones de seguridad de la librería estándar, cambiando la verificación de límites y la detección de overflow por velocidad cruda"  # @src=26c469d3f496
                # | Bounds checks survive in release, indexing out of range still panics.
                # | Only specific debug-profile defaults (like overflow-checks) flip; std
                # | stays safe.
                feedback: "Las verificaciones de límites sobreviven en release, indexar fuera de rango sigue dando panic. Solo voltean defaults específicos del perfil debug (como overflow-checks); std sigue siendo seguro."  # @src=a70a30b9a7b9
          m05l3-q4:
            # | The tier-gate quotes the Rustonomicon telling you to 'turn back now.' You
            # | genuinely want to write Solana programs in Rust next. Per the gate's map,
            # | what's the honest route?
            prompt: "La barrera del tier cita al Rustonomicon diciéndote que 'des la vuelta ahora'. De verdad quieres escribir programas de Solana en Rust como próximo paso. Según el mapa de la barrera, ¿cuál es la ruta honesta?"  # @src=6bc59ee85381
            # | The gate's map: what this tier taught IS the Rust that real program
            # | authoring builds on; lifetimes-beyond-reading and unsafe stay bookmarked
            # | behind the Rustonomicon, macro authoring behind TRPL's macros chapter and
            # | The Little Book of Rust Macros, with Rustlings and Comprehensive Rust as
            # | drills. The on-chain route runs through the Bitcoin-to-Solana evolution
            # | course's account-and-transaction concepts, with the Mastering Anchor course
            # | as the deep end once you ship. Turn back now, it is not necessary.
            explanation: "El mapa de la barrera: lo que enseñó este tier ES el Rust sobre el que se construye escribir programas de verdad; los tiempos de vida más allá de leerlos y unsafe quedan como bookmarks detrás del Rustonomicon, escribir macros detrás del capítulo de macros de TRPL y The Little Book of Rust Macros, con Rustlings y Comprehensive Rust como ejercicios. La ruta on-chain pasa por los conceptos de cuenta y transacción del curso de evolución de Bitcoin a Solana, con el curso Mastering Anchor como la parte honda una vez que entregues. Da la vuelta ahora, no es necesario."  # @src=fb8e5efd68f0
            options:                 # source order — keep it
              b:
                # | Work through the Rustonomicon first despite its warning, on-chain
                # | programs are systems code, and unsafe fluency is the real prerequisite
                label: "Trabaja primero todo el Rustonomicon a pesar de su advertencia, los programas on-chain son código de sistemas, y la fluidez en unsafe es el prerrequisito de verdad"  # @src=dc4f0c2aad7f
                # | The disclaimer means what it says: writing programs (on-chain included)
                # | does not require the dark arts, frameworks like Anchor exist precisely
                # | so program authors write safe Rust.
                feedback: "La advertencia quiere decir lo que dice: escribir programas (on-chain incluido) no requiere las artes oscuras, los frameworks como Anchor existen precisamente para que quienes escriben programas escriban Rust seguro."  # @src=2125950941df
              d:
                # | Enroll straight into the Mastering Anchor course, its V2 material is the
                # | on-ramp this tier hands you and the account model arrives with it
                label: "Inscríbete directo en el curso Mastering Anchor, su material de V2 es la rampa de entrada que te da este tier y el modelo de cuentas llega con él"  # @src=ab4c7dc84fd7
                # | That course states its own bar: you already ship Anchor programs and
                # | want the V2 delta. It is the deep end. The account and transaction
                # | concepts live in the Bitcoin-to-Solana evolution course instead.
                feedback: "Ese curso declara su propia vara: ya entregas programas de Anchor y quieres el delta de V2. Es la parte honda. Los conceptos de cuenta y transacción viven en el curso de evolución de Bitcoin a Solana, en cambio."  # @src=10a919d70365
              c:
                # | Finish TRPL cover to cover, then Comprehensive Rust in full, program
                # | authoring needs the language's whole surface before any of the chain
                # | makes sense
                label: "Termina TRPL de tapa a tapa, después Comprehensive Rust completo, escribir programas necesita toda la superficie del lenguaje antes de que nada de la blockchain tenga sentido"  # @src=60f78bf0843c
                # | Breadth-first completionism is what the 80/20 seam exists to prevent,
                # | the gate's resources are drills and references to pull from as needed,
                # | not prerequisites to exhaust.
                feedback: "El completismo a lo ancho primero es lo que la costura 80/20 existe para prevenir, los recursos de la barrera son ejercicios y referencias de las que jalar según haga falta, no prerrequisitos que agotar."  # @src=1425dc046a3a
              a:
                # | Your exit level here, structs, enums, traits, Result, serde, plus the
                # | concept course's account model, then Anchor practice; unsafe and deep
                # | lifetimes are not on that path
                label: "Tu nivel de salida acá, structs, enums, traits, Result, serde, más el modelo de cuentas del curso de conceptos, después práctica de Anchor; unsafe y los tiempos de vida profundos no están en ese camino"  # @src=d14e00904aa2
                # | Reading level from here, account and transaction concepts from the
                # | Bitcoin-to-Solana course, reps on your own. What remains after this tier
                # | is shipping experience, not vocabulary.
                feedback: "Nivel de lectura de acá, conceptos de cuenta y transacción del curso de Bitcoin a Solana, reps por tu cuenta. Lo que queda después de este tier es experiencia de entrega, no vocabulario."  # @src=10bc49b3a1fd
  m06-l1:
    # | A daemon, not a script: tokio + a /status endpoint
    title: "Un daemon, no un script: tokio + un endpoint /status"  # @src=895ea53ce045
    blocks:
      check:                      # quiz
        questions:
          m06-l1-q1:
            # | Your poller probes 40 targets every 30 seconds, and each probe spends almost
            # | all its time waiting on the network. What does tokio's async model actually
            # | buy you here?
            prompt: "Tu poller sondea 40 targets cada 30 segundos, y cada sonda pasa casi todo su tiempo esperando en la red. ¿Qué te compra en realidad el modelo async de tokio acá?"  # @src=51b9f38af265
            # | Async is a concurrency model for waiting. Your probes are I/O-bound: the
            # | runtime parks each task at its .await and resumes it when the socket has
            # | news, so 40 concurrent probes cost roughly one thread instead of 40. This is
            # | the same suspension model you used in m02-l3's TS fleet, tokio just makes
            # | the runtime an explicit dependency instead of an ambient event loop.
            explanation: "Async es un modelo de concurrencia para esperar. Tus sondas están ligadas a I/O: el runtime estaciona cada tarea en su .await y la reanuda cuando el socket tiene noticias, así que 40 sondas concurrentes cuestan alrededor de un thread en vez de 40. Este es el mismo modelo de suspensión que usaste en la flota de TS de m02-l3, tokio solo hace del runtime una dependencia explícita en vez de un event loop ambiente."  # @src=41fcd74b0259
            options:                 # source order — keep it
              c:
                # | One thread can park all 40 in-flight requests and resume each task when
                # | its I/O completes
                label: "Un solo thread puede estacionar los 40 requests en vuelo y reanudar cada tarea cuando su I/O se completa"  # @src=f14e1e75635f
                # | A parked task is a few hundred bytes of state, so 40 in flight cost
                # | roughly one thread. Same suspension model as m02-l3's TS fleet, with the
                # | scheduler now a crate in your lockfile.
                feedback: "Una tarea estacionada son unos cientos de bytes de estado, así que 40 en vuelo cuestan alrededor de un thread. El mismo modelo de suspensión que la flota de TS de m02-l3, con el scheduler ahora un crate en tu lockfile."  # @src=52d6f5987199
              a:
                # | Each individual HTTP request completes faster, because async I/O has
                # | lower latency than blocking I/O
                label: "Cada request HTTP individual se completa más rápido, porque el I/O async tiene menos latencia que el I/O blocking"  # @src=cec15ab0e69f
                # | Async does not speed up a single request, the network takes what the
                # | network takes. It changes how many WAITS one thread can hold at once,
                # | not how long each wait lasts.
                feedback: "Async no hace más rápido un request solo, la red tarda lo que la red tarda. Cambia cuántas ESPERAS puede sostener un thread a la vez, no cuánto dura cada espera."  # @src=f42174d0237b
              b:
                # | The runtime spawns one OS thread per target, so the kernel schedules all
                # | 40 probes at once
                label: "El runtime spawnea un thread del SO por target, así que el kernel planifica las 40 sondas a la vez"  # @src=babd868ea901
                # | That describes plain threads, not async. Tokio's point is the opposite:
                # | many tasks multiplexed onto few threads, parked while they wait.
                feedback: "Eso describe threads pelados, no async. El punto de tokio es el opuesto: muchas tareas multiplexadas sobre pocos threads, estacionadas mientras esperan."  # @src=dedb397237df
              d:
                # | The runtime spreads probe work across all your cores, so one sweep
                # | finally uses the whole CPU
                label: "El runtime reparte el trabajo de sonda por todos tus núcleos, así que un barrido al fin usa la CPU entera"  # @src=6a60d839b5e4
                # | That is parallelism, and these probes have almost no CPU work to spread.
                # | The thread is parked in a syscall waiting for bytes; more cores buy
                # | nothing when nobody is computing.
                feedback: "Eso es paralelismo, y estas sondas casi no tienen trabajo de CPU para repartir. El thread está estacionado en un syscall esperando bytes; más núcleos no compran nada cuando nadie está computando."  # @src=bfd3e7055ac0
          m06-l1-q2:
            # | Your M5 CLI does one blocking fetch, prints the latency, and exits. A
            # | teammate suggests migrating it to tokio 'for performance'. What does that
            # | migration actually buy?
            prompt: "Tu CLI de M5 hace un solo fetch blocking, imprime la latencia y sale. Un colega propone migrarla a tokio 'por performance'. ¿Qué compra en realidad esa migración?"  # @src=dbdda6e47a33
            # | Async pays at fan-out. One blocking call in a short-lived CLI is the honest
            # | right-size, which is why m05-l3 taught blocking reqwest first and why this
            # | lesson only reaches for tokio once the poller needs many concurrent probes
            # | on a schedule.
            explanation: "Async paga en el fan-out. Una sola llamada blocking en una CLI de vida corta es el tamaño honesto, y por eso m05-l3 enseñó reqwest blocking primero y por eso esta lección solo agarra tokio una vez que el poller necesita muchas sondas concurrentes en un cronograma."  # @src=73506628b1f8
            options:                 # source order — keep it
              a:
                # | Nothing much, a single request that blocks once and exits has no fan-out
                # | for a runtime to exploit
                label: "Poca cosa, un request solo que bloquea una vez y sale no tiene fan-out para que un runtime lo explote"  # @src=f2fa5353b6f8
                # | The migration buys a dependency and an annotation. Async pays at
                # | fan-out, which is exactly why the poller in this lesson earns tokio and
                # | the CLI still does not.
                feedback: "La migración compra una dependencia y una anotación. Async paga en el fan-out, y es exactamente por eso que el poller de esta lección se gana tokio y la CLI sigue sin ganárselo."  # @src=35a9da5cb777
              c:
                # | It is required anyway, reqwest cannot make any request without a tokio
                # | runtime present to drive it
                label: "Es obligatorio igual, reqwest no puede hacer ningún request sin un runtime de tokio presente que lo maneje"  # @src=a0203a2c0ad8
                # | You disproved this yourself in m05-l3: reqwest's `blocking` feature is
                # | exactly the sanctioned no-runtime path for simple tools.
                feedback: "Lo refutaste tú mismo en m05-l3: la feature `blocking` de reqwest es exactamente el camino avalado sin runtime para herramientas simples."  # @src=0acd9ecc6dcb
              d:
                # | Overlap inside the one request: DNS, the TCP handshake and TLS run
                # | concurrently instead of in sequence
                label: "Superposición adentro del único request: DNS, el handshake de TCP y TLS corren concurrentemente en vez de en secuencia"  # @src=3e8eddb2b11f
                # | Those phases are sequential by protocol: you cannot handshake with an
                # | address you have not resolved. Async overlaps separate requests, never
                # | the stages inside one.
                feedback: "Esas fases son secuenciales por protocolo: no puedes hacer handshake con una dirección que no resolviste. Async superpone requests separados, nunca las etapas adentro de uno."  # @src=7512d40de8c7
              b:
                # | Lower latency on that one request, since async I/O bypasses the blocking
                # | syscall path in the kernel
                label: "Menos latencia en ese request solo, porque el I/O async se saltea el camino del syscall blocking en el kernel"  # @src=4287c7b10b69
                # | The request itself is not faster, async changes scheduling of many
                # | waits, not the duration of one. For a single fetch the runtime is pure
                # | overhead.
                feedback: "El request en sí no es más rápido, async cambia la planificación de muchas esperas, no la duración de una. Para un solo fetch el runtime es puro overhead."  # @src=9f5f24fd45b9
          m06-l1-q3:
            # | You migrate the probe from m05-l3's blocking fetch to the async form for the
            # | poll loop. What is the actual delta in your code and Cargo.toml?
            prompt: "Migras la sonda del fetch blocking de m05-l3 a la forma async para el loop de poll. ¿Cuál es el delta real en tu código y en Cargo.toml?"  # @src=ab3681d15579
            # | This is why the course sequenced reqwest this way: you met reqwest in
            # | blocking form when one fetch was all you needed, so the async migration is a
            # | visible, small delta, feature flag out.await in, runtime around it, instead
            # | of a first contact tangled up with tokio.
            explanation: "Por esto el curso secuenció reqwest así: conociste reqwest en forma blocking cuando un solo fetch era todo lo que necesitabas, así que la migración async es un delta chico y visible, flag de feature afuera.await adentro, runtime alrededor, en vez de un primer contacto enredado con tokio."  # @src=ef9fc26bff62
            options:                 # source order — keep it
              c:
                # | The request switches protocols, async reqwest negotiates HTTP/2 while
                # | blocking stays HTTP/1.1
                label: "El request cambia de protocolo, el reqwest async negocia HTTP/2 mientras que el blocking se queda en HTTP/1.1"  # @src=2e0e9a01f977
                # | Protocol negotiation is independent of the blocking/async split. The
                # | delta is the execution model, not the wire format.
                feedback: "La negociación de protocolo es independiente de la división blocking/async. El delta es el modelo de ejecución, no el formato de cable."  # @src=945ed21e7fec
              b:
                # | Same crate: drop the `blocking` feature, and the call sites gain .await
                # | inside the runtime
                label: "El mismo crate: quita la feature `blocking`, y los sitios de llamada ganan .await adentro del runtime"  # @src=57f6f9cffd7f
                # | Three edits, one manifest line and two source lines. That small diff is
                # | why m05-l3 met reqwest in blocking form first instead of meeting it
                # | tangled up with a runtime.
                feedback: "Tres ediciones, una línea de manifest y dos líneas de fuente. Ese diff chico es la razón por la que m05-l3 conoció reqwest en forma blocking primero en vez de conocerlo enredado con un runtime."  # @src=9e1c4f99fd7e
              a:
                # | Swap to a different crate, the async client ships as a separate package
                # | from blocking reqwest
                label: "Cambia a un crate distinto, el cliente async viene como un paquete separado del reqwest blocking"  # @src=19f17e022c4d
                # | Same crate. The blocking client is a feature-gated wrapper inside
                # | reqwest itself; async is the crate's default face.
                feedback: "El mismo crate. El cliente blocking es un wrapper detrás de una feature adentro de reqwest mismo; async es la cara por defecto del crate."  # @src=f8a3ae0da935
              d:
                # | Only the call sites: add .await, and Rust's built-in executor drives the
                # | futures for you
                label: "Solo los sitios de llamada: agrega .await, y el executor incorporado de Rust maneja los futures por ti"  # @src=b1ab49ff74e6
                # | There is no built-in executor. An async fn call builds a value
                # | describing the work and something has to drive it, which is why
                # | #[tokio::main] is the third edit and the only genuinely new one.
                feedback: "No hay ningún executor incorporado. Llamar a una async fn construye un valor que describe el trabajo y algo tiene que manejarlo, y por eso #[tokio::main] es la tercera edición y la única genuinamente nueva."  # @src=7fd089b7b0b4
          m06-l1-q4:
            # | The /status handler must read the same probe-state the poll loop writes. How
            # | does the worked axum drop-in share that state?
            prompt: "El handler de /status tiene que leer el mismo estado de sonda que escribe el loop de poll. ¿Cómo comparte ese estado el drop-in trabajado de axum?"  # @src=2bae2ba34e48
            # | The drop-in's one real idea: shared ownership (Arc) plus synchronized
            # | interior access, with the handler holding a cheap clone of the pointer. The
            # | lesson's footgun list is the corollary, never hold the lock across an
            # | .await. You edit this seam; you do not have to invent it.
            explanation: "La única idea de verdad del drop-in: ownership compartido (Arc) más acceso interior sincronizado, con el handler sosteniendo un clon barato del puntero. La lista de trampas de la lección es el corolario, nunca sostengas el lock cruzando un .await. Editas esta costura; no tienes que inventarla."  # @src=cd5a984f906a
            options:                 # source order — keep it
              b:
                # | Both sides write through a global `static mut` that the loop and handler
                # | share directly
                label: "Los dos lados escriben a través de un `static mut` global que el loop y el handler comparten directamente"  # @src=d83d195df614
                # | Rust denies unsynchronized `static mut` references (deny-by-default in
                # | edition 2024) precisely because this is a data race. The compiler is
                # | vetoing this design for you.
                feedback: "Rust prohíbe las referencias a `static mut` sin sincronizar (deny por defecto en la edition 2024) precisamente porque esto es una carrera de datos. El compilador está vetando este diseño por ti."  # @src=90c0415eae28
              a:
                # | The handler re-runs every probe on demand, so each /status request
                # | produces fresh results
                label: "El handler vuelve a correr cada sonda a demanda, así que cada request a /status produce resultados frescos"  # @src=3ad68dde4ebc
                # | That would make /status as slow as a full sweep and hammer your targets
                # | on every curl. The endpoint reports state; the loop owns producing it.
                feedback: "Eso haría /status tan lento como un barrido completo y martillaría tus targets cada vez que alguien hace curl. El endpoint reporta el estado; el loop es dueño de producirlo."  # @src=51b3d4aca805
              c:
                # | The state lives behind an Arc with interior synchronization, cloned into
                # | the handler at router build time
                label: "El estado vive detrás de un Arc con sincronización interior, clonado hacia el handler cuando se construye el router"  # @src=4c242f9aed1b
                # | Cloning an Arc copies a pointer and bumps a counter, so the loop and the
                # | router hold two handles on one map. The corollary is the lock rule:
                # | snapshot under the guard, serialize after it drops.
                feedback: "Clonar un Arc copia un puntero e incrementa un contador, así que el loop y el router sostienen dos handles sobre un solo mapa. El corolario es la regla del lock: snapshot bajo la guarda, serializa cuando se libera."  # @src=62e74cfe8f48
              d:
                # | with_state clones the HashMap into the router, so the handler reads its
                # | own copy and never blocks the loop
                label: "with_state clona el HashMap hacia el router, así que el handler lee su propia copia y nunca bloquea el loop"  # @src=6918779631cd
                # | Then /status would answer with whatever the map held at boot, which is
                # | empty. It is the Arc that gets cloned, not the map, and the Mutex
                # | underneath is what arbitrates the two handles.
                feedback: "Entonces /status contestaría con lo que sea que el mapa tuviera al arrancar, que está vacío. Es el Arc lo que se clona, no el mapa, y el Mutex de abajo es el que arbitra los dos handles."  # @src=8542ff02fc16
  m06-l2:
    # | Containers 101: put the poller in a box
    title: "Contenedores 101: mete el poller en una caja"  # @src=65e59399319a
    blocks:
      check:                      # quiz
        questions:
          m06-l2-q1:
            # | You run `docker run hello-world` twice in a row. The first run prints pull
            # | progress; the second starts instantly. Why?
            prompt: "Corres `docker run hello-world` dos veces seguidas. La primera corrida imprime progreso del pull; la segunda arranca al instante. ¿Por qué?"  # @src=079888610301
            # | Images are pulled once and cached locally by layer; containers are cheap,
            # | disposable processes created from them. The pull-progress-then-instant
            # | pattern is the image/container split showing itself on your first command.
            explanation: "A las imágenes se les hace pull una vez y se cachean localmente por capa; los contenedores son procesos baratos y descartables creados a partir de ellas. El patrón de progreso-del-pull-y-después-instantáneo es la división imagen/contenedor mostrándose en tu primer comando."  # @src=313942949a0f
            options:                 # source order — keep it
              d:
                # | The image cached and so did its writable layer, so run two resumed the
                # | first container's filesystem
                label: "La imagen se cacheó y su capa escribible también, así que la corrida dos retomó el sistema de archivos del primer contenedor"  # @src=ec9940994052
                # | Right about the image, wrong about the layer. The writable layer belongs
                # | to the container, not the image, and `docker ps -a` proves it by listing
                # | two separate exited containers.
                feedback: "Bien con la imagen, mal con la capa. La capa escribible le pertenece al contenedor, no a la imagen, y `docker ps -a` lo demuestra listando dos contenedores distintos que salieron."  # @src=3afcc6d8268f
              c:
                # | The registry's CDN warmed up after your first request, so the second
                # | pull came down faster
                label: "El CDN del registro se calentó después de tu primer request, así que el segundo pull bajó más rápido"  # @src=b05ffc0f6ad7
                # | No second pull happened at all, the layers were already on disk.
                # | Registries serve machines that do not yet have the image; your machine
                # | now does.
                feedback: "No hubo ningún segundo pull, las capas ya estaban en disco. Los registros sirven a máquinas que todavía no tienen la imagen; la tuya ahora sí."  # @src=ea84035e390f
              a:
                # | The image is now in your local cache, so the second run skips the
                # | registry pull entirely
                label: "La imagen ahora está en tu cache local, así que la segunda corrida se saltea el pull del registro por completo"  # @src=6b46c4adca43
                # | Images are pulled once and cached by layer; containers are stamped out
                # | fresh every time. That split is the whole architecture showing itself on
                # | your first command.
                feedback: "A las imágenes se les hace pull una vez y se cachean por capa; los contenedores se estampan frescos cada vez. Esa división es la arquitectura entera mostrándose en tu primer comando."  # @src=e86f11633317
              b:
                # | Docker kept the first container alive in the background and reattached
                # | you to it on run two
                label: "Docker mantuvo vivo el primer contenedor en segundo plano y te reenganchó a él en la corrida dos"  # @src=dd37b67a8588
                # | Each `docker run` creates a NEW container from the image. The first
                # | container exited when its process did, nothing was reused except the
                # | image.
                feedback: "Cada `docker run` crea un contenedor NUEVO a partir de la imagen. El primer contenedor salió cuando salió su proceso, nada se reusó salvo la imagen."  # @src=bd7b997c2a17
          m06-l2-q2:
            # | You built one pulse-pollerd image and ran `docker run` on it three times
            # | (stopping each). What exists on your machine now?
            prompt: "Construiste una imagen de pulse-pollerd y corriste `docker run` sobre ella tres veces (deteniendo cada una). ¿Qué existe en tu máquina ahora?"  # @src=639219b43e0f
            # | The image is the immutable template; every `docker run` stamps out a fresh
            # | container (process + thin writable layer) from it. This is why the
            # | mental-model diagram matters before multi-stage builds: everything later
            # | manipulates the template, never the running copies.
            explanation: "La imagen es la plantilla inmutable; cada `docker run` estampa a partir de ella un contenedor fresco (proceso + capa escribible delgada). Por eso importa el diagrama del modelo mental antes de los builds multi-stage: todo lo que viene después manipula la plantilla, nunca las copias que corren."  # @src=ee6e860870d2
            options:                 # source order — keep it
              b:
                # | One image and three (stopped) containers created from it
                label: "Una imagen y tres contenedores (detenidos) creados a partir de ella"  # @src=5b902ad70a7d
                # | `docker ps -a` is the receipt: three exited entries with auto-generated
                # | names, one image underneath. Builds make images, runs make containers,
                # | and nothing crosses that line.
                feedback: "`docker ps -a` es el recibo: tres entradas ya salidas con nombres autogenerados, una imagen debajo. Los builds hacen imágenes, las corridas hacen contenedores, y nada cruza esa línea."  # @src=215cda882518
              e:
                # | One image three layers taller, each run committing its writes back
                label: "Una imagen tres capas más alta, con cada corrida commiteando sus escrituras de vuelta"  # @src=ad8854c600b4
                # | Only a build adds layers. A run's writes land in that container's own
                # | writable layer and die with it; the template underneath is never
                # | touched, which is what lets three containers share one image.
                feedback: "Solo un build agrega capas. Las escrituras de una corrida aterrizan en la capa escribible propia de ese contenedor y mueren con él; la plantilla de abajo nunca se toca, que es lo que deja que tres contenedores compartan una imagen."  # @src=48cfafb6011c
              a:
                # | Three images and one container, each run snapshots the image again
                label: "Tres imágenes y un contenedor, cada corrida le saca un snapshot a la imagen otra vez"  # @src=ba36614edf3f
                # | Backwards: runs never create images. Building creates images; running
                # | creates containers.
                feedback: "Al revés: las corridas nunca crean imágenes. Construir crea imágenes; correr crea contenedores."  # @src=3056fdc0b908
              d:
                # | One image and nothing else, stopped containers vanish
                label: "Una imagen y nada más, los contenedores detenidos desaparecen"  # @src=aeced530dd4d
                # | Plain `docker ps` hides them, which is where this belief comes from, but
                # | `docker ps -a` lists all three corpses. Deleting on exit is what the
                # | `--rm` flag opts into.
                feedback: "El `docker ps` pelado los esconde, que es de donde viene esta creencia, pero `docker ps -a` lista los tres cadáveres. Borrar al salir es a lo que se apunta con la flag `--rm`."  # @src=a13bcb2d1ca5
              c:
                # | One container whose filesystem merged the three runs' changes
                label: "Un contenedor cuyo sistema de archivos fusionó los cambios de las tres corridas"  # @src=36922f14e4e5
                # | Containers do not merge. Each run got its own writable layer on top of
                # | the same immutable image, and each exited independently.
                feedback: "Los contenedores no se fusionan. Cada corrida recibió su propia capa escribible encima de la misma imagen inmutable, y cada una salió de forma independiente."  # @src=b213302cdd74
          m06-l2-q3:
            # | At a coworking space your build fails pulling the rust base image with a 429
            # | error. At home the same build works. What is going on?
            prompt: "En un coworking tu build falla haciendo pull de la imagen base de rust con un error 429. En tu casa el mismo build funciona. ¿Qué está pasando?"  # @src=bc936ef3b8b9
            # | Unauthenticated Docker Hub pulls are capped at 100 per 6 hours per IPv4
            # | address (or IPv6 /64), and behind coworking/campus/CI NAT, everyone shares
            # | that pool. A free account and `docker login` gives you your own 200 per 6
            # | hours; only the paid Pro, Team, and Business plans get an unlimited pull
            # | rate (docs.docker.com/docker-hub/usage/, read 2026-09-06). That is why this
            # | lesson teaches the login before your first real pull, with GHCR waiting in
            # | m06-l4 as the escape hatch.
            explanation: "Los pulls no autenticados de Docker Hub están topeados en 100 cada 6 horas por dirección IPv4 (o IPv6 /64), y detrás del NAT de un coworking, un campus o CI, todos comparten ese pool. Una cuenta gratis y `docker login` te dan tus propios 200 cada 6 horas; solo los planes pagos Pro, Team y Business tienen una tasa de pulls ilimitada (docs.docker.com/docker-hub/usage/, leído el 2026-09-06). Por eso esta lección enseña el login antes de tu primer pull de verdad, con GHCR esperando en m06-l4 como escotilla de escape."  # @src=86be860c96e9
            options:                 # source order — keep it
              d:
                # | Shared-IP pulls are capped, and a free account typically clears it,
                # | since logging in gives you unlimited pulls
                label: "Los pulls desde IP compartida están topeados, y una cuenta gratis normalmente lo resuelve, porque hacer login te da pulls ilimitados"  # @src=888e3d4765a3
                # | Right diagnosis, wrong ceiling. A free Personal account raises you to
                # | your own 200 pulls per 6 hours; only the paid Pro, Team and Business
                # | plans get an unlimited pull rate. Read the usage table before you quote
                # | a number.
                feedback: "Diagnóstico correcto, techo equivocado. Una cuenta Personal gratis te sube a tus propios 200 pulls cada 6 horas; solo los planes pagos Pro, Team y Business tienen una tasa de pulls ilimitada. Lee la tabla de uso antes de citar un número."  # @src=09f2d2813872
              c:
                # | Unauthenticated pulls are capped per shared IPv4 address, `docker login`
                # | moves you to your own allowance
                label: "Los pulls no autenticados están topeados por dirección IPv4 compartida, `docker login` te pasa a tu propio cupo"  # @src=6b9247d9c5eb
                # | The symptom pattern is the diagnosis: location-dependent, reproducible,
                # | and 429 rather than not-found. Behind coworking NAT you are spending the
                # | building's 100 per 6 hours, not your own.
                feedback: "El patrón de síntomas es el diagnóstico: depende de la ubicación, es reproducible, y es 429 en vez de not-found. Detrás del NAT de un coworking estás gastando los 100 cada 6 horas del edificio, no los tuyos."  # @src=b0d36c43c557
              a:
                # | The Dockerfile is wrong, a bad base-image tag returns 429 until you
                # | correct it
                label: "El Dockerfile está mal, un tag de imagen base equivocado devuelve 429 hasta que lo corrijas"  # @src=2b1c12801920
                # | A bad tag returns not-found, not 429. Rate limits are about who is
                # | asking and how often, not what is asked for.
                feedback: "Un tag equivocado devuelve not-found, no 429. Los rate limits son sobre quién pregunta y con qué frecuencia, no sobre qué se pide."  # @src=becc096ae545
              b:
                # | Docker Hub is having an outage that happens to coincide with your
                # | coworking sessions
                label: "Docker Hub está teniendo una caída que casualmente coincide con tus sesiones de coworking"  # @src=da36a7d3c64f
                # | The tell is that it is location-dependent and reproducible. Outages do
                # | not follow your commute; shared-IP rate limits do.
                feedback: "La pista es que depende de la ubicación y es reproducible. Las caídas no siguen tu viaje al trabajo; los rate limits de IP compartida sí."  # @src=96015502a9bd
          m06-l2-q4:
            # | Your poller binary is a few megabytes, but `docker images` shows the naive
            # | image at multiple gigabytes. Where did the weight come from?
            prompt: "Tu binario del poller son unos pocos megabytes, pero `docker images` muestra la imagen ingenua en varios gigabytes. ¿De dónde vino el peso?"  # @src=2e442ff66670
            # | A single-stage build's final image IS its build environment: rust base image
            # | plus dependencies plus your entire target/ directory. Nothing in it is
            # | needed to RUN the binary, which is precisely next lesson's opening problem
            # | and the whole argument for multi-stage builds.
            explanation: "La imagen final de un build de una sola etapa ES su entorno de build: imagen base de rust más dependencias más tu directorio target/ entero. Nada de eso hace falta para CORRER el binario, que es precisamente el problema con el que abre la lección que viene y el argumento entero a favor de los builds multi-stage."  # @src=c7cc70b19011
            options:                 # source order — keep it
              a:
                # | The single stage ships everything the build needed, the Rust toolchain,
                # | sources, and the target/ cache, in the final layers
                label: "La única etapa entrega todo lo que el build necesitó, el toolchain de Rust, las fuentes y la cache de target/, en las capas finales"  # @src=1f455066cf2d
                # | `docker history` prices it row by row: the toolchain layers are the true
                # | giants, the RUN cargo build row is the heaviest one you caused, and none
                # | of it is needed to RUN the binary.
                feedback: "`docker history` le pone precio fila por fila: las capas del toolchain son las verdaderas gigantes, la fila de RUN cargo build es la más pesada que causaste, y nada de eso hace falta para CORRER el binario."  # @src=23da49362b8c
              d:
                # | The build context dragged your host target/ directory in, so the image
                # | ships a cache it did not need
                label: "El contexto de build arrastró adentro tu directorio target/ del host, así que la imagen entrega una cache que no necesitaba"  # @src=0be499906ec2
                # | That is what .dockerignore fenced off in step 1, and the
                # | transferring-context line proves it stayed out. The target/ inside the
                # | image was produced by the RUN cargo build layer, not carried in from
                # | your laptop.
                feedback: "Eso es lo que .dockerignore cercó en el paso 1, y la línea de transferring-context demuestra que se quedó afuera. El target/ de adentro de la imagen lo produjo la capa de RUN cargo build, no vino cargado desde tu laptop."  # @src=6c2ee9824afd
              c:
                # | Docker adds a fixed multi-gigabyte runtime layer to every image so
                # | containers can execute
                label: "Docker le agrega a cada imagen una capa de runtime fija de varios gigabytes para que los contenedores puedan ejecutarse"  # @src=f9c232c9e0b0
                # | Docker adds nothing to your image; images can be a few megabytes. The
                # | runtime lives on the host, the weight here is entirely what your
                # | Dockerfile chose to keep.
                feedback: "Docker no le agrega nada a tu imagen; las imágenes pueden ser de unos pocos megabytes. El runtime vive en el host, el peso de acá es enteramente lo que tu Dockerfile eligió quedarse."  # @src=244af60cd814
              b:
                # | Static linking bloated the binary itself to container scale during the
                # | release build
                label: "El enlazado estático infló el binario mismo a escala de contenedor durante el build de release"  # @src=1a08315f5264
                # | The binary is still megabytes, check it inside the container. The
                # | gigabytes are around it: compiler, registry cache, intermediate
                # | artifacts, all frozen into shipped layers.
                feedback: "El binario sigue siendo megabytes, verifícalo adentro del contenedor. Los gigabytes están alrededor: compilador, cache del registro, artefactos intermedios, todo congelado en capas entregadas."  # @src=3df63bdaade2
  m06-l3:
    # | Two Dockerfiles, one idea: multi-stage honesty
    title: "Dos Dockerfiles, una idea: honestidad multi-stage"  # @src=a7a9e2253327
    blocks:
      check-stages:                      # quiz
        questions:
          m06-l3-q1:
            # | Your multi-stage build still produces a huge image. Reading the Dockerfile,
            # | which property actually determines what ships in the final image?
            prompt: "Tu build multi-stage todavía produce una imagen enorme. Leyendo el Dockerfile, ¿qué propiedad determina en realidad lo que se entrega en la imagen final?"  # @src=1c18bdbd9d77
            # | The whole multi-stage idea in one rule: the final image = final base +
            # | explicit COPYs. If it still weighs too much, either your runtime base is fat
            # | or you copied build artifacts forward, read the COPY lines, not the
            # | compressor.
            explanation: "La idea entera de multi-stage en una regla: la imagen final = base final + COPYs explícitos. Si todavía pesa demasiado, o tu base de runtime es gorda o copiaste artefactos de build hacia adelante, lee las líneas COPY, no el compresor."  # @src=39ac4533ec1c
            options:                 # source order — keep it
              b:
                # | Only what the final stage's base contains plus what you COPY --from into
                # | it, earlier stages are left behind entirely
                label: "Solo lo que contiene la base de la etapa final más lo que le hagas COPY --from adentro, las etapas anteriores se quedan atrás por completo"  # @src=90e713b26f00
                # | Read the COPY lines, not the compressor. If the image is still heavy,
                # | either the runtime base is fat or you copied build artifacts forward.
                feedback: "Lee las líneas COPY, no el compresor. Si la imagen sigue pesada, o la base de runtime es gorda o copiaste artefactos de build hacia adelante."  # @src=f4a97e2c3b94
              c:
                # | Whether the release build stripped debug symbols before the image was
                # | assembled
                label: "Si el build de release quitó los símbolos de debug antes de que la imagen se ensamblara"  # @src=36ff6b46feec
                # | Stripping shaves megabytes off the binary; the gigabytes are the build
                # | environment. Symbol stripping cannot rescue a Dockerfile that copies the
                # | wrong things forward.
                feedback: "Quitar símbolos le saca megabytes al binario; los gigabytes son el entorno de build. Quitar símbolos no puede rescatar un Dockerfile que copia las cosas equivocadas hacia adelante."  # @src=c7e3e1c57352
              a:
                # | The compression Docker applies when it exports the final image's layers
                label: "La compresión que Docker aplica cuando exporta las capas de la imagen final"  # @src=7f8114b8b9f3
                # | Layer compression is marginal and automatic. If the toolchain is in your
                # | final stage, compression will dutifully ship a compressed toolchain.
                feedback: "La compresión de capas es marginal y automática. Si el toolchain está en tu etapa final, la compresión va a entregar obedientemente un toolchain comprimido."  # @src=87b08a338b6e
              d:
                # | Only the final stage's base image, since COPY --from links artifacts in
                # | rather than adding layers
                label: "Solo la imagen base de la etapa final, ya que COPY --from enlaza los artefactos en vez de agregar capas"  # @src=0d091a488d54
                # | COPY --from writes real bytes into a real layer; there is no linking
                # | across stages. The slim poller image is its Debian base PLUS the binary
                # | and the config, which is why it lands near 121 MB rather than at the
                # | base's size.
                feedback: "COPY --from escribe bytes reales en una capa real; no hay enlazado entre etapas. La imagen slim del poller es su base de Debian MÁS el binario y la config, que es por qué aterriza cerca de 121 MB en vez de en el tamaño de la base."  # @src=1582f9f7fce5
          m06-l3-q2:
            # | cargo-chef adds prepare and cook stages to your Dockerfile. What problem is
            # | that machinery actually solving?
            prompt: "cargo-chef agrega etapas prepare y cook a tu Dockerfile. ¿Qué problema está resolviendo en realidad esa maquinaria?"  # @src=c0c794f9bc82
            # | The prepare step extracts a recipe (your dependency graph); cook builds just
            # | the dependencies into a cacheable layer. Edit your source and only your
            # | crate recompiles, the README claims up to 5x faster builds, and this lesson
            # | attributes that claim rather than asserting it.
            explanation: "El paso prepare extrae un recipe (tu grafo de dependencias); cook construye solo las dependencias hacia una capa cacheable. Edita tu fuente y solo tu crate recompila, el README afirma builds hasta 5x más rápidos, y esta lección atribuye esa afirmación en vez de asegurarla."  # @src=b4b633b92bdc
            options:                 # source order — keep it
              d:
                # | It records the dependency graph in a recipe file, so two builds of the
                # | same commit always resolve identical crate versions
                label: "Registra el grafo de dependencias en un archivo de recipe, así dos builds del mismo commit siempre resuelven versiones idénticas de crates"  # @src=6e87164ff74f
                # | Cargo.lock already does that, and it did before chef existed. The recipe
                # | is a cache key, not a lockfile: its job is to stay byte-identical across
                # | code edits so the cook layer survives them.
                feedback: "Cargo.lock ya hace eso, y lo hacía antes de que chef existiera. El recipe es una clave de cache, no un lockfile: su trabajo es quedarse byte-idéntico a través de las ediciones de código para que la capa de cook las sobreviva."  # @src=aab83f96aad0
              a:
                # | It cross-compiles the poller for musl so the runtime stage can use a
                # | smaller base
                label: "Cross-compila el poller para musl así la etapa de runtime puede usar una base más chica"  # @src=1389ef3455c7
                # | cargo-chef is target-agnostic and its own README canon runs on
                # | debian-slim, not musl. It is about build caching, not cross-compilation.
                feedback: "cargo-chef es agnóstico al target y su propio canon del README corre en debian-slim, no en musl. Se trata de cacheo de build, no de cross-compilación."  # @src=318c82d85073
              c:
                # | It caches dependency compilation as its own layer, so code-only changes
                # | stop recompiling every crate on every build
                label: "Cachea la compilación de dependencias como su propia capa, así los cambios solo de código dejan de recompilar cada crate en cada build"  # @src=71dcfdb0f628
                # | prepare emits the recipe, cook builds the dependencies from it, and
                # | because the recipe is byte-identical across code edits, Docker skips the
                # | cook layer and only your crates recompile.
                feedback: "prepare emite el recipe, cook construye las dependencias a partir de él, y porque el recipe es byte-idéntico a través de las ediciones de código, Docker se saltea la capa de cook y solo tus crates recompilan."  # @src=6ebe6122be33
              b:
                # | It shrinks the final image further than a plain two-stage build could
                label: "Encoge la imagen final más de lo que podría un build de dos etapas pelado"  # @src=e68ea7304164
                # | Final image size is identical, the runtime stage copies the same one
                # | binary either way. cargo-chef changes how long REBUILDS take, not what
                # | ships.
                feedback: "El tamaño de la imagen final es idéntico, la etapa de runtime copia el mismo único binario de cualquier forma. cargo-chef cambia cuánto tardan las RECONSTRUCCIONES, no lo que se entrega."  # @src=c0c387268118
          m06-l3-q3:
            # | You switch the poller's runtime base to alpine for the size win, and probe
            # | throughput collapses once the poll loop fans out. What is the likeliest
            # | cause?
            prompt: "Cambias la base de runtime del poller a alpine por la ganancia de tamaño, y el throughput de sondas se desploma en cuanto el loop de poll se abre en abanico. ¿Cuál es la causa más probable?"  # @src=b0e1d147e854
            # | Grove measured ~30x on his workload (later measurements span 2x to 20x);
            # | ripgrep's fix is shipping jemalloc on musl, and Grove's own fix was moving
            # | to debian-slim, this course's default base. Smallest image is not fastest
            # | binary: base images are a measured trade-off.
            explanation: "Grove midió ~30x en su carga de trabajo (mediciones posteriores abarcan de 2x a 20x); el arreglo de ripgrep es entregar jemalloc en musl, y el arreglo propio de Grove fue pasar a debian-slim, la base por defecto de este curso. La imagen más chica no es el binario más rápido: las imágenes base son un trade-off medido."  # @src=2131058babe5
            options:                 # source order — keep it
              d:
                # | alpine ships a leaner network stack, so each probe pays more for socket
                # | setup
                label: "alpine entrega una stack de red más liviana, así que cada sonda paga más por el armado del socket"  # @src=ba69ebb982ec
                # | A base image ships no network stack at all. Containers are processes on
                # | the HOST kernel, so alpine and debian slim make identical syscalls; what
                # | differs is the libc linked into your binary.
                feedback: "Una imagen base no entrega ninguna stack de red. Los contenedores son procesos en el kernel del HOST, así que alpine y debian slim hacen syscalls idénticas; lo que difiere es la libc enlazada en tu binario."  # @src=0cfa099f0149
              a:
                # | musl's default allocator degrades multi-threaded Rust, an order of
                # | magnitude in Grove's 2020 benchmark
                label: "El allocator por defecto de musl degrada Rust multi-thread, un orden de magnitud en el benchmark de Grove de 2020"  # @src=8938db00bc83
                # | Grove measured about 30x on his workload; later benchmarks land between
                # | 2x and 20x. ripgrep's answer was shipping jemalloc on musl, Grove's own
                # | was moving to debian slim, which is the base this course teaches.
                feedback: "Grove midió alrededor de 30x en su carga de trabajo; benchmarks posteriores aterrizan entre 2x y 20x. La respuesta de ripgrep fue entregar jemalloc en musl, la propia de Grove fue pasar a debian slim, que es la base que enseña este curso."  # @src=fbd445ced7c7
              c:
                # | The glibc-built binary is running under a compatibility emulation layer
                # | on musl
                label: "El binario construido con glibc está corriendo bajo una capa de emulación de compatibilidad en musl"  # @src=7e2c2fb2e3cb
                # | There is no emulation layer, a glibc-linked binary on alpine simply
                # | fails to run. If it runs at all it was built for musl, and musl's
                # | allocator is the measured culprit.
                feedback: "No hay capa de emulación, un binario enlazado con glibc en alpine simplemente no corre. Si corre siquiera, fue construido para musl, y el allocator de musl es el culpable medido."  # @src=f7d806691a21
              b:
                # | alpine containers are CPU-throttled by default until you raise their
                # | cgroup limits
                label: "Los contenedores de alpine están limitados de CPU por defecto hasta que subas sus límites de cgroup"  # @src=f1d42453480a
                # | No runtime throttles alpine specifically, cgroup limits are yours to set
                # | and identical across bases. The regression is inside the process: its
                # | allocator.
                feedback: "Ningún runtime limita a alpine en particular, los límites de cgroup son tuyos para poner y son idénticos entre bases. La regresión está adentro del proceso: su allocator."  # @src=049a969e9c6a
      check-node-side:                      # quiz
        questions:
          m06-l3-q4:
            # | In the node image you install pnpm with `npm i -g pnpm@<pinned>` instead of
            # | `corepack enable`. Why?
            prompt: "En la imagen de node instalas pnpm con `npm i -g pnpm@<pinned>` en vez de `corepack enable`. ¿Por qué?"  # @src=f0e09ff03021
            # | m03-l1 called this one in advance, so the delta is what the container adds.
            # | The reason is unchanged: Node's TSC voted corepack out, and it is gone from
            # | Node 25+ distributions while surviving in Node 24 LTS. What is new here is
            # | which digit you pin to and why. On a laptop the pin is a preference; in an
            # | image it is an agreement, because the container's pnpm has to match the
            # | workspace's `packageManager` field or `--frozen-lockfile` will argue with
            # | you, and an image that installed whatever `latest` served on build day would
            # | silently change pnpm majors between two builds of the same commit. pnpm's
            # | `latest` did exactly that mid-course, moving to the 12 line. Pin to the
            # | workspace, not to the tag.
            explanation: "m03-l1 ya anticipó esta, así que el delta es lo que agrega el contenedor. La razón no cambió: el TSC de Node votó a corepack afuera, y ya no está en las distribuciones de Node 25+ mientras sobrevive en Node 24 LTS. Lo nuevo acá es a qué dígito fijas y por qué. En una laptop el pin es una preferencia; en una imagen es un acuerdo, porque el pnpm del contenedor tiene que coincidir con el campo `packageManager` del workspace o `--frozen-lockfile` va a discutir contigo, y una imagen que instalara lo que `latest` sirviera el día del build cambiaría en silencio de major de pnpm entre dos builds del mismo commit. El `latest` de pnpm hizo exactamente eso a mitad de curso, moviéndose a la línea 12. Fija al workspace, no al tag."  # @src=a7912af0d03a
            options:                 # source order — keep it
              a:
                # | corepack resolves package managers over the network on first use, which
                # | is too slow for image builds
                label: "corepack resuelve los gestores de paquetes por la red en el primer uso, que es demasiado lento para builds de imagen"  # @src=09dced95fc50
                # | Speed is not the issue, and a cached corepack fetch is fast. The problem
                # | is existence: you cannot enable a tool your base image no longer ships.
                feedback: "La velocidad no es el problema, y un fetch de corepack cacheado es rápido. El problema es la existencia: no puedes habilitar una herramienta que tu imagen base ya no entrega."  # @src=811a51547ca9
              b:
                # | corepack is no longer distributed with Node 25+, so images built on
                # | current bases cannot rely on it being there
                label: "corepack ya no se distribuye con Node 25+, así que las imágenes construidas sobre bases actuales no pueden contar con que esté ahí"  # @src=0eb94dd35b71
                # | Node's TSC voted it out on 2025-03-19. Node 24 still carries it, which
                # | is the trap: the corepack line works on today's base and breaks on the
                # | next bump, the worst kind of works.
                feedback: "El TSC de Node lo votó afuera el 2025-03-19. Node 24 todavía lo trae, que es la trampa: la línea de corepack funciona en la base de hoy y se rompe en el próximo bump, la peor clase de funciona."  # @src=a52bcfdef3e7
              c:
                # | pnpm refuses to run when activated through corepack, so direct
                # | installation is mandatory
                label: "pnpm se niega a correr cuando se lo activa a través de corepack, así que la instalación directa es obligatoria"  # @src=d7f8c4071590
                # | pnpm ran fine under corepack for years, that was corepack's main job.
                # | The change is on Node's side: the runtime stopped bundling it.
                feedback: "pnpm corrió bien bajo corepack por años, ese era el trabajo principal de corepack. El cambio está del lado de Node: el runtime dejó de incluirlo."  # @src=69c1069ed8ea
              d:
                # | corepack pulls whatever version is latest at build time, so two node
                # | images built from one commit differ
                label: "corepack baja la versión que sea la última a la hora del build, así que dos imágenes de node construidas desde un commit difieren"  # @src=ccb9eea65190
                # | That drift is what an unpinned `npm i -g pnpm` would do. corepack
                # | activates the exact version the workspace's packageManager field names,
                # | so pinning is the one thing it does reliably.
                feedback: "Esa deriva es lo que haría un `npm i -g pnpm` sin fijar. corepack activa la versión exacta que nombra el campo packageManager del workspace, así que fijar es la única cosa que hace de forma confiable."  # @src=7ad4981c8ea8
          m06-l3-q5:
            # | The containerized fleet-runner does one probe sweep and exits, and compose
            # | keeps restarting it forever. What is the honest fix?
            prompt: "El fleet-runner en contenedor hace un barrido de sondas y sale, y compose lo sigue reiniciando para siempre. ¿Cuál es el arreglo honesto?"  # @src=aeccd60df6d7
            # | This beat is built, not assumed: the TS fleet was written as a run-once
            # | script, so this lesson adds an --interval flag that turns it into a service.
            # | The mode change belongs in the program, not in restart policies or an
            # | in-container cron.
            explanation: "Este momento está construido, no asumido: la flota de TS se escribió como un script de una sola corrida, así que esta lección agrega una flag --interval que lo convierte en un servicio. El cambio de modo va en el programa, no en políticas de restart ni en un cron adentro del contenedor."  # @src=36553e7e220c
            options:                 # source order — keep it
              c:
                # | Give the runner a real interval-loop service mode, a container wants one
                # | long-lived foreground process
                label: "Dale al runner un modo de servicio de verdad con loop de intervalo, un contenedor quiere un solo proceso de primer plano y de larga vida"  # @src=7575d0f399df
                # | The mode change belongs in the program, which is why this lesson builds
                # | the --interval flag rather than assuming it, and why the loop's sleep is
                # | abortable: PID 1 has to answer SIGTERM.
                feedback: "El cambio de modo va en el programa, que es por qué esta lección construye la flag --interval en vez de asumirla, y por qué el sleep del loop es abortable: PID 1 tiene que responder a SIGTERM."  # @src=597414196882
              d:
                # | Wrap the runner in a shell while-loop in CMD so the box always has one
                # | live process
                label: "Envuelve el runner en un while-loop de shell en CMD así la caja siempre tiene un proceso vivo"  # @src=7f0430a14bb3
                # | That satisfies the letter of one-foreground-process and breaks the
                # | spirit: the shell becomes PID 1 and swallows SIGTERM, so `docker stop`
                # | waits ten seconds and then SIGKILLs your sweep mid-write.
                feedback: "Eso satisface la letra de un-solo-proceso-de-primer-plano y rompe el espíritu: el shell se vuelve PID 1 y se traga SIGTERM, así que `docker stop` espera diez segundos y después le hace SIGKILL a tu barrido a mitad de escritura."  # @src=682e70f4c5a3
              b:
                # | Run cron inside the container to re-invoke the script on a schedule
                label: "Corre cron adentro del contenedor para volver a invocar el script según un calendario"  # @src=eeef41c04c29
                # | A second supervisor inside the box fights the container model, one
                # | container, one foreground process. Now you debug cron AND your app, in a
                # | slim image that likely lacks cron anyway.
                feedback: "Un segundo supervisor adentro de la caja pelea contra el modelo de contenedores, un contenedor, un proceso de primer plano. Ahora haces debug de cron Y de tu app, en una imagen slim que de todos modos probablemente no tiene cron."  # @src=d3689d7d642b
              a:
                # | Set restart: always and let the restart policy provide the loop, that is
                # | what policies are for
                label: "Pon restart: always y deja que la política de restart provea el loop, para eso están las políticas"  # @src=fbf2da1b0aad
                # | Restart policies are for recovering from FAILURE, not for scheduling. A
                # | restart-driven loop pays process startup on every sweep and turns your
                # | logs into a crash chronicle.
                feedback: "Las políticas de restart son para recuperarse de una FALLA, no para planificar. Un loop manejado por restarts paga el arranque del proceso en cada barrido y convierte tus logs en una crónica de crashes."  # @src=5bb7af0d3a69
          m06-l3-q6:
            # | Your OpenSSL-linked build segfaults on alpine at TLS handshake time but runs
            # | fine on debian-slim. What is the course-canon fix?
            prompt: "Tu build enlazado con OpenSSL da segfault en alpine a la hora del handshake de TLS pero corre bien en debian-slim. ¿Cuál es el arreglo del canon del curso?"  # @src=698b70fc5600
            # | The documented footgun: a statically-built musl binary meeting alpine's
            # | dynamically-linked OpenSSL segfaults. Documented fixes include the openssl
            # | crate's vendored feature, but the house canon, consistent with every Rust
            # | rules file in this repo, is rustls: pure Rust, no C dependency, no clash to
            # | have.
            explanation: "La trampa documentada: un binario de musl construido estáticamente que se encuentra con la OpenSSL enlazada dinámicamente de alpine da segfault. Los arreglos documentados incluyen la feature vendored del crate openssl, pero el canon de la casa, consistente con cada archivo de reglas de Rust en este repo, es rustls: Rust puro, sin dependencia de C, sin choque que tener."  # @src=5d75f6c87be2
            options:                 # source order — keep it
              b:
                # | Install glibc into the alpine image so the OpenSSL linkage resolves
                label: "Instala glibc en la imagen de alpine así el enlazado de OpenSSL se resuelve"  # @src=ed9f4702d98e
                # | Bolting glibc onto alpine abandons the base's whole premise and creates
                # | a franken-image. The clash here is two musls (your static one vs
                # | alpine's dynamic one), not a missing glibc.
                feedback: "Atornillarle glibc a alpine abandona la premisa entera de la base y crea una franken-imagen. El choque acá es dos musls (el tuyo estático contra el dinámico de alpine), no una glibc que falta."  # @src=5dd0ff5b731c
              e:
                # | Install ca-certificates so the TLS handshake completes
                label: "Instala ca-certificates así el handshake de TLS se completa"  # @src=8745b315776c
                # | The runtime stage does install ca-certificates, and it must, but that is
                # | about VERIFYING the servers you probe. A missing CA store gives you a
                # | verification error, never a segfault.
                feedback: "La etapa de runtime sí instala ca-certificates, y debe, pero eso es sobre VERIFICAR los servidores que sondeas. Un almacén de CA que falta te da un error de verificación, nunca un segfault."  # @src=16de776caaaf
              a:
                # | Build with rustls and skip the C TLS dependency entirely
                label: "Construye con rustls y saltea la dependencia de TLS en C por completo"  # @src=eb7501f09665
                # | Pure Rust TLS, no C library, no linkage clash to have. You already live
                # | by it: reqwest 0.13 defaults to rustls, so the m06-l1 poller never had
                # | an OpenSSL to fight.
                feedback: "TLS de Rust puro, sin librería de C, sin choque de enlazado que tener. Ya vives según eso: reqwest 0.13 usa rustls por defecto, así que el poller de m06-l1 nunca tuvo una OpenSSL con la que pelear."  # @src=8bcafb04346f
              d:
                # | Build with OPENSSL_DIR pointed at alpine's copy
                label: "Construye con OPENSSL_DIR apuntado a la copia de alpine"  # @src=8ea5840c8632
                # | The linker already found it; that is the problem. Your binary carries
                # | musl statically and alpine's OpenSSL links musl dynamically, so pointing
                # | at the same library harder changes nothing.
                feedback: "El linker ya la encontró; ese es el problema. Tu binario lleva musl estáticamente y la OpenSSL de alpine enlaza musl dinámicamente, así que apuntar más fuerte a la misma librería no cambia nada."  # @src=a0be8daa5fa9
              c:
                # | Downgrade the openssl crate until the segfault version-mismatch
                # | disappears
                label: "Baja de versión el crate openssl hasta que el desajuste de versiones del segfault desaparezca"  # @src=591304bcb846
                # | No openssl crate version fixes a static-vs-dynamic musl linkage clash.
                # | The documented crate-side alternative is the vendored feature, building
                # | OpenSSL in, not a downgrade.
                feedback: "Ninguna versión del crate openssl arregla un choque de enlazado de musl estático contra dinámico. La alternativa documentada del lado del crate es la feature vendored, construir OpenSSL adentro, no bajar de versión."  # @src=73cf6489a6d0
  m06-l4:
    # | compose for local, GHCR from CI
    title: "compose para local, GHCR desde CI"  # @src=df4add59f55a
    blocks:
      check:                      # quiz
        questions:
          m06-l4-q1:
            # | A teammate asks whether your new compose.yaml is 'how the station deploys to
            # | production'. What is the honest answer?
            prompt: "Un compañero pregunta si tu nuevo compose.yaml es 'cómo se despliega la estación a producción'. ¿Cuál es la respuesta honesta?"  # @src=8bf8af7bc79f
            # | The module's division of labor: Dockerfiles define images, compose
            # | orchestrates them on YOUR machine for development, and the registry is where
            # | 'runs anywhere' actually begins. This course teaches compose as local-dev
            # | tooling on purpose, orchestration across machines is the tier-gate's
            # | signposted out-of-scope.
            explanation: "La división del trabajo del módulo: los Dockerfiles definen imágenes, compose las orquesta en TU máquina para desarrollo, y el registro es donde 'corre en cualquier parte' de verdad empieza. Este curso enseña compose como herramienta de dev local a propósito, la orquestación entre máquinas es el fuera-de-alcance señalizado de la barrera del tier."  # @src=448c593460a7
            options:                 # source order — keep it
              c:
                # | No, compose replaced the Dockerfiles, so production now builds directly
                # | from compose.yaml
                label: "No, compose reemplazó los Dockerfiles, así que producción ahora construye directamente desde compose.yaml"  # @src=49be526a525e
                # | Compose consumes images that Dockerfiles (or registries) provide, it
                # | replaces your hand-typed docker run flags, never the build definitions.
                feedback: "Compose consume imágenes que proveen los Dockerfiles (o los registros), reemplaza tus flags de docker run tipeadas a mano, nunca las definiciones de build."  # @src=24544fd5408c
              a:
                # | Yes, compose is the production layer; you point it at a server and the
                # | station is deployed
                label: "Sí, compose es la capa de producción; lo apuntas a un servidor y la estación queda desplegada"  # @src=c1ea1f1a32c4
                # | Compose schedules nothing beyond one machine and heals nothing across
                # | hosts. Calling it production is the cosplay this lesson explicitly
                # | refuses.
                feedback: "Compose no agenda nada más allá de una máquina y no sana nada entre hosts. Llamarlo producción es el cosplay que esta lección rechaza explícitamente."  # @src=61d4778becbc
              d:
                # | Not yet, but in practice the same compose file plus a restart policy on
                # | one server is the deployment story
                label: "Todavía no, pero en la práctica el mismo archivo compose más una política de reinicio en un servidor es la historia de deployment"  # @src=578fe51bcdcb
                # | That is the production cosplay the lesson names. A restart policy
                # | revives a container; it notices nothing when the MACHINE dies, and it
                # | balances, replicates and rolls out nothing.
                feedback: "Ese es el cosplay de producción que la lección nombra. Una política de reinicio revive un contenedor; no se da cuenta de nada cuando muere la MÁQUINA, y no balancea, no replica y no despliega nada."  # @src=2fdf1c73de19
              b:
                # | No, compose wires the LOCAL dev stack: one file, both services, one
                # | command up and down; deployment is the registry's job
                label: "No, compose cablea el stack de dev LOCAL: un archivo, los dos servicios, un comando para levantar y bajar; el deployment es tarea del registro"  # @src=25c27c30e20a
                # | Its real payoff is that `git clone` plus `docker compose up` becomes the
                # | whole onboarding document, which is a development win, not a deployment
                # | one.
                feedback: "Su pago real es que `git clone` más `docker compose up` se vuelve todo el documento de onboarding, que es una victoria de desarrollo, no de deployment."  # @src=072df461d7a2
          m06-l4-q2:
            # | Your Actions job pushed pulse-pollerd to GHCR with a green run, but an
            # | anonymous `docker pull` of it comes back denied. What happened?
            prompt: "Tu job de Actions empujó pulse-pollerd a GHCR con una corrida en verde, pero un `docker pull` anónimo de ella vuelve denegado. ¿Qué pasó?"  # @src=185e8d71ca99
            # | The lab gotcha, reproduced in step 5: GHCR packages are born private. An
            # | anonymous pull comes back denied, refused without confirming the package
            # | even exists, so the symptom looks like a bad tag rather than a permission
            # | problem, and that is the whole trap. Flip visibility in the package settings
            # | and the same command succeeds. Public container images are free
            # | ('currently', per GitHub's own wording); private ones bill against the
            # | shared 500 MB pool.
            explanation: "El gotcha del lab, reproducido en el paso 5: los paquetes de GHCR nacen privados. Un pull anónimo vuelve denegado, rechazado sin confirmar que el paquete siquiera exista, así que el síntoma parece un tag equivocado en vez de un problema de permisos, y esa es toda la trampa. Cambia la visibilidad en los settings del paquete y el mismo comando funciona. Las imágenes de contenedor públicas son gratis ('currently', según las propias palabras de GitHub); las privadas facturan contra el pool compartido de 500 MB."  # @src=195b49b90f61
            options:                 # source order — keep it
              d:
                # | The lowercasing step folded your owner name, so the reference you pulled
                # | points at a package that does not exist
                label: "El paso de pasar a minúsculas dobló el nombre de tu owner, así que la referencia que pediste apunta a un paquete que no existe"  # @src=d3b2618e7ec7
                # | That is the trap this symptom sets: a denied pull refuses to confirm
                # | whether the package exists, so it reads like a bad tag. The lowercasing
                # | is what makes the reference LEGAL, and both the push and your pull used
                # | the same folded name.
                feedback: "Esa es la trampa que tiende este síntoma: un pull denegado se niega a confirmar si el paquete existe, así que se lee como un tag equivocado. Pasar a minúsculas es lo que hace LEGAL a la referencia, y tanto el push como tu pull usaron el mismo nombre doblado."  # @src=45c087f75b11
              b:
                # | GHCR requires a classic PAT for public hosting, and GITHUB_TOKEN pushes
                # | are private forever
                label: "GHCR requiere un PAT clásico para hosting público, y los pushes con GITHUB_TOKEN son privados para siempre"  # @src=0ec7710394c9
                # | GITHUB_TOKEN with packages write is a fully supported push path, and
                # | visibility is a package setting, not a token property.
                feedback: "GITHUB_TOKEN con packages write es una ruta de push totalmente soportada, y la visibilidad es un setting del paquete, no una propiedad del token."  # @src=704118c22fe5
              a:
                # | The push silently failed, and a green Actions run does not verify that
                # | the registry write actually landed
                label: "El push falló en silencio, y una corrida verde de Actions no verifica que la escritura al registro de verdad haya aterrizado"  # @src=91d33cf10121
                # | A failed push fails the step and the run. The image is there; the
                # | question is who is allowed to see it.
                feedback: "Un push fallido hace fallar el step y la corrida. La imagen está ahí; la pregunta es quién tiene permiso de verla."  # @src=dba6d8ffd1eb
              c:
                # | First publish defaults to PRIVATE, flip the package's visibility setting
                # | and the anonymous pull works
                label: "La primera publicación va a PRIVADO por default, cambia el setting de visibilidad del paquete y el pull anónimo funciona"  # @src=78af0b7c2cff
                # | A one-time flip per package, in the package settings rather than in
                # | code. Later pushes to the same package keep whatever visibility you set.
                feedback: "Un flip de una sola vez por paquete, en los settings del paquete y no en código. Los pushes posteriores al mismo paquete mantienen la visibilidad que hayas puesto."  # @src=752bfbdaf329
          m06-l4-q3:
            # | You keep the station images private 'to be safe'. What does that choice
            # | actually spend on the GitHub Free plan?
            prompt: "Mantienes las imágenes de la estación privadas 'por seguridad'. ¿Qué gasta de verdad esa elección en el plan Free de GitHub?"  # @src=d876e78ecbb0
            # | The free-tier reality paragraph in one number: 500 MB of private storage,
            # | shared between GHCR layers and Actions artifacts, your CI's own uploads
            # | compete with your images. For this course's public-repo station, public
            # | images are the honest (and free) default.
            explanation: "El párrafo de realidad del tier gratis en un solo número: 500 MB de almacenamiento privado, compartido entre capas de GHCR y artifacts de Actions, los propios uploads de tu CI compiten con tus imágenes. Para la estación de repo público de este curso, las imágenes públicas son el default honesto (y gratis)."  # @src=db6c8e1dc71a
            options:                 # source order — keep it
              c:
                # | Each private pull deducts from the storage quota until the monthly reset
                label: "Cada pull privado descuenta de la cuota de almacenamiento hasta el reinicio mensual"  # @src=ef00025de202
                # | Pulls consume transfer, not storage. The storage pool is about the bytes
                # | your image layers occupy at rest.
                feedback: "Los pulls consumen transferencia, no almacenamiento. El pool de almacenamiento es sobre los bytes que las capas de tu imagen ocupan en reposo."  # @src=bcc7dab4b68b
              d:
                # | Nothing, private image storage in a public repo is free whatever its
