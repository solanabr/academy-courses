                label: "El ownership del Vec se movió a `fleet`; dos dueños vivos volverían ambigua la limpieza, así que el acceso del binding viejo terminó"  # @src=7615d05eacfc
                # | The data is alive and well under its new name. What ended is your old
                # | one, because two bindings believing they own one allocation is exactly
