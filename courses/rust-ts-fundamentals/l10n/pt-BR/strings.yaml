locale: pt-BR

course:
  # | Rust & TypeScript Fundamentals for Web3
  title: "Fundamentos de Rust & TypeScript para Web3"  # @src=58458db0a1bb
  # | By the end you can read and write the Rust and TypeScript that real web3 codebases are
  # | made of, and ship them: a TypeScript dashboard on Vercel, edge workers in both
  # | languages on Cloudflare, and a containerized Rust service on GHCR, all wired to live
  # | Solana data with one signed devnet transfer. This is a local-toolchain course, so
  # | expect to install as you build: Node in module one, rustup and cargo in module four,
  # | Docker in module six, and the Solana CLI in m08-l4, where a local validator stands by
  # | as the last-resort fallback for a dry devnet faucet.
  description: "No fim, você consegue ler e escrever o Rust e o TypeScript que compõem as bases de código web3 de verdade, e entregá-los: um painel em TypeScript no Vercel, edge workers nas duas linguagens no Cloudflare, e um serviço Rust conteinerizado no GHCR, tudo ligado a dados ao vivo da Solana com uma transferência assinada na devnet. Este é um curso de toolchain local, então espere instalar conforme você constrói: Node no módulo um, rustup e cargo no módulo quatro, Docker no módulo seis, e a Solana CLI em m08-l4, onde um validador local fica de prontidão como fallback de último recurso para um faucet seco da devnet."  # @src=601341201b0e
  modules:
    m01-first-heartbeat:
      # | Put a heartbeat on the internet
      title: "Coloque um batimento na internet"  # @src=1d86089d9dbe
    m02-types-alarm-system:
      # | Types are the alarm system
      title: "Tipos são o sistema de alarme"  # @src=7439fc9ca9cc
    m03-ship-to-a-url:
      # | Someone else can see it now
      title: "Agora outra pessoa pode ver"  # @src=1e51d45eebad
    m04-stricter-foreman:
      # | Same machine, stricter foreman
      title: "Mesma máquina, encarregado mais rígido"  # @src=9cf7e9375aba
    m05-rust-that-ships:
      # | Rust that ships
      title: "Rust que entrega"  # @src=a9d3f6ee084b
    m06-runs-anywhere:
      # | It runs anywhere, forever
      title: "Roda em qualquer lugar, para sempre"  # @src=c826b988d0df
    m07-edge-probes:
      # | Probes belong at the edge
      title: "Sondas pertencem ao edge"  # @src=50040db8d005
    m08-solana-target:
      # | Point it at the most interesting target
      title: "Aponte para o alvo mais interessante"  # @src=da6d2511cc09
    m09-operate-it:
      # | Run it like you mean it
      title: "Rode pra valer"  # @src=479a6425bf2b
    m10-station-whole:
      # | Pulse Station, whole
      title: "Pulse Station, inteira"  # @src=9895a22ce0c4

lessons:
  m01-l1:
    # | The map: what we teach, what we bookmark, and why both languages
    title: "O mapa: o que ensinamos, o que deixamos como bookmark, e por que as duas linguagens"  # @src=3bc1656a148e
    blocks:
      map-check:                      # quiz
        questions:
          m01-l1-q1:
            # | Three modules from now, a Rust compiler error mentions lifetimes, a concept
            # | this course lists as signposted, never taught. What does the 80/20 contract
            # | say you do?
            prompt: "Três módulos adiante, um erro do compilador Rust menciona lifetimes, um conceito que este curso lista como sinalizado, nunca ensinado. O que o contrato 80/20 diz para você fazer?"  # @src=7674154bcaad
            # | The seam is the product: this course teaches the 80% of real-world patterns
            # | and hands you a verified, chapter-level bookmark for the 20% it deliberately
            # | leaves out. Hitting bookmarked territory mid-error is the system working,
            # | the map tells you exactly which chapter answers it.
            explanation: "A costura é o produto: este curso ensina os 80% de padrões do mundo real e te entrega um bookmark verificado, em nível de capítulo, para os 20% que ele deixa de fora de propósito. Bater em território de bookmark no meio de um erro é o sistema funcionando, o mapa te diz exatamente qual capítulo responde isso."  # @src=e7dc068197f6
            options:                 # source order — keep it
              a:
                # | Open the bookmarked chapter for that concept, read what you need, come
                # | back
                label: "Abra o capítulo do bookmark daquele conceito, leia o que você precisa, volte"  # @src=3189535e2f40
                # | A signpost is an address, not a warning. You open the one chapter the
                # | map points at, take what the error needs, and go back to the lab you
                # | were in; one chapter at point of need is the whole deal.
                feedback: "Uma placa é um endereço, não um aviso. Você abre o único capítulo para o qual o mapa aponta, pega o que o erro precisa, e volta para o lab em que você estava; um capítulo no ponto da necessidade é o acordo inteiro."  # @src=4dd7b8a0252a
              c:
                # | Treat it as a gap in the course's coverage and look for a more complete
                # | course
                label: "Trate isso como uma lacuna na cobertura do curso e procure um curso mais completo"  # @src=1c0b4ff047fe
                # | It's not a gap, it's the design. The lesson that signposted lifetimes
                # | told you exactly where the full treatment lives; a course that taught
                # | everything would be the pile, not the map.
                feedback: "Não é uma lacuna, é o design. A lição que sinalizou os lifetimes te disse exatamente onde mora o tratamento completo; um curso que ensinasse tudo seria a pilha, não o mapa."  # @src=ea95fdf08f46
              b:
                # | Pause the course and work through The Rust Book front to back before
                # | continuing
                label: "Pause o curso e percorra The Rust Book de capa a capa antes de continuar"  # @src=a9496fbe39f5
                # | That's the thousand-hour trap the map exists to prevent. The bookmarks
                # | are chapter-level and pulled at point of need, nobody shipping read the
                # | whole pile first.
                feedback: "Essa é a cilada de mil horas que o mapa existe para evitar. Os bookmarks são em nível de capítulo e são puxados no ponto da necessidade, ninguém que entrega leu a pilha inteira primeiro."  # @src=63df00798d73
              d:
                # | Keep editing the code until the error clears, since lifetimes are never
                # | taught here
                label: "Continue editando o código até o erro sumir, já que lifetimes nunca são ensinados aqui"  # @src=b6492501fcf3
                # | Making an error go away is not the same as knowing why it went away, and
                # | lifetimes are where that gap bites hardest. Never taught here means the
                # | map hands you the chapter, not that you get to skip the reading.
                feedback: "Fazer um erro ir embora não é a mesma coisa que saber por que ele foi embora, e lifetimes são onde essa lacuna morde mais forte. Nunca ensinado aqui quer dizer que o mapa te entrega o capítulo, não que você pode pular a leitura."  # @src=ea2052d16c0a
          m01-l1-q2:
            # | drift-labs/protocol-v2, one flagship Solana repo, splits almost 50/50 by
            # | bytes: TypeScript 5,746,893 vs Rust 5,533,370. What is that number evidence
            # | FOR?
            prompt: "drift-labs/protocol-v2, um repo Solana emblemático, se divide quase 50/50 por bytes: TypeScript 5,746,893 vs Rust 5,533,370. Aquele número é evidência DE QUÊ?"  # @src=d544a3bbc17d
            # | The single best 'why both languages' stat the research found: inside one
            # | production repo, the on-chain Rust and the client-side TypeScript are nearly
            # | equal by weight. That's the shape of the job, and the shape of this course.
            explanation: "A melhor estatística de 'por que as duas linguagens' que a pesquisa encontrou: dentro de um repo de produção, o Rust on-chain e o TypeScript do lado do cliente são quase iguais em peso. Essa é a forma do trabalho, e a forma deste curso."  # @src=3e48d20d53d2
            options:                 # source order — keep it
              d:
                # | Most of that TypeScript is tests and scripts, so only the Rust half is
                # | the shipped product
                label: "A maior parte daquele TypeScript é testes e scripts, então só a metade de Rust é o produto entregue"  # @src=0f5ae9e01270
                # | Tests are in there, but so are the SDK and every client an integrator
                # | imports. That surface ships, gets versioned and breaks users when it
                # | regresses, which is why the split sits near half rather than drifting to
                # | the program.
                feedback: "Os testes estão lá, mas também estão o SDK e todo cliente que um integrador importa. Essa superfície é entregue, é versionada e quebra usuários quando regride, e é por isso que a divisão fica perto da metade em vez de escorregar para o programa."  # @src=cdd28c399d3b
              b:
                # | Production Solana products pair a Rust program with a TypeScript client,
                # | one product needs both
                label: "Produtos Solana de produção pareiam um programa em Rust com um cliente em TypeScript, um produto precisa dos dois"  # @src=2b9de6b13190
                # | One product, two languages, nearly fifty-fifty by weight. The Rust is
                # | the on-chain program; the TypeScript is the SDK, the clients and the
                # | tests that every user and integrator actually touches.
                feedback: "Um produto, duas linguagens, quase cinquenta-cinquenta em peso. O Rust é o programa on-chain; o TypeScript é o SDK, os clientes e os testes que todo usuário e integrador de fato toca."  # @src=a53cfe884370
              c:
                # | The two languages are interchangeable on this stack, so a developer can
                # | pick whichever they prefer
                label: "As duas linguagens são intercambiáveis nesta stack, então um dev pode escolher a que preferir"  # @src=14d962d5f69a
                # | They sit at different layers, not the same one: Rust where the program
                # | runs, TS where users and tooling live. Interchangeable would mean
                # | picking one; the byte split shows shipping teams pick both.
                feedback: "Elas ficam em camadas diferentes, não na mesma: Rust onde o programa roda, TS onde usuários e ferramental moram. Intercambiáveis significaria escolher uma; a divisão de bytes mostra que os times que entregam escolhem as duas."  # @src=e099faba58f3
              a:
                # | Solana teams are mid-migration from TypeScript to Rust, so Rust alone is
                # | the safer bet
                label: "Times de Solana estão no meio de uma migração de TypeScript para Rust, então Rust sozinho é a aposta mais segura"  # @src=270b1d19c65a
                # | There's no migration in that number, both halves are load-bearing and
                # | growing. The Rust is the on-chain program; the TS is its SDK, clients,
                # | and tests. Neither replaces the other.
                feedback: "Não existe migração naquele número, as duas metades são estruturais e estão crescendo. O Rust é o programa on-chain; o TS é o SDK, os clientes e os testes dele. Nenhum substitui o outro."  # @src=355b8628c45e
          m01-l1-q3:
            # | You open the MDN Core Scripting honesty check and the async unit, promises,
            # | callbacks, is genuinely new to you. What's the honest move?
            prompt: "Você abre a checagem de honestidade do MDN Core Scripting e a unidade de async, promises, callbacks, é genuinamente nova para você. Qual é a atitude honesta?"  # @src=d115697d5166
            # | The prerequisite box is honesty, not gatekeeping: this course maps FROM 'can
            # | program in some language, including JS async basics.' The MDN check,
            # | explicitly including the async unit, is the cheapest possible insurance
            # | against hitting module 2 without the promise model.
            explanation: "A caixa de pré-requisito é honestidade, não barreira de entrada: este curso mapeia A PARTIR DE 'consegue programar em alguma linguagem, incluindo o básico de async em JS.' A checagem do MDN, incluindo explicitamente a unidade de async, é o seguro mais barato possível contra chegar no módulo 2 sem o modelo de promises."  # @src=ad70469cbff1
            options:                 # source order — keep it
              a:
                # | Skip it, the course reteaches async from scratch in the TypeScript
                # | modules anyway
                label: "Pule, o curso reensina async do zero nos módulos de TypeScript de qualquer forma"  # @src=0372708029d1
                # | It doesn't: m02-l3 opens with a five-minute promise-model recap and then
                # | builds concurrency discipline ON promise literacy. A recap is not a
                # | first course in async.
                feedback: "Não reensina: m02-l3 abre com uma recapitulação de cinco minutos do modelo de promises e depois constrói disciplina de concorrência SOBRE fluência em promises. Uma recapitulação não é um primeiro curso de async."  # @src=339936fc8e28
              b:
                # | Continue, async only becomes relevant once the Rust modules introduce
                # | tokio
                label: "Continue, async só fica relevante quando os módulos de Rust introduzem tokio"  # @src=303116aaa6ca
                # | Async arrives much earlier than tokio: the TypeScript fleet in module 2
                # | is built on promises, await, and cancellation. Arriving without the
                # | model means stalling exactly there.
                feedback: "Async chega muito antes do tokio: a frota TypeScript no módulo 2 é construída sobre promises, await e cancelamento. Chegar sem o modelo significa empacar exatamente ali."  # @src=897570642eac
              c:
                # | Do MDN's async unit first, it's free, m02-l3 builds on it, and the
                # | course will wait
                label: "Faça a unidade de async do MDN primeiro, é gratuita, m02-l3 constrói sobre ela, e o curso vai esperar"  # @src=1e2278ffa60a
                # | The cheapest possible insurance. m02-l3 spends five minutes recapping
                # | the promise model and then builds cancellation and concurrency
                # | discipline on top of it, so the unit is what that lesson assumes you
                # | already hold.
                feedback: "O seguro mais barato possível. m02-l3 gasta cinco minutos recapitulando o modelo de promises e depois constrói disciplina de cancelamento e concorrência em cima dele, então a unidade é o que aquela lição assume que você já tem."  # @src=640eae8b7858
              d:
                # | Start now and open the async unit later, the delay usually costs nothing
                label: "Comece agora e abra a unidade de async depois, o atraso em geral não custa nada"  # @src=3be6071fc587
                # | Deferring doesn't remove the cost, it moves it into module 2, where a
                # | five-minute recap assumes the model you skipped. The detour is cheap
                # | before the lab and expensive in the middle of it.
                feedback: "Adiar não remove o custo, move ele para o módulo 2, onde uma recapitulação de cinco minutos assume o modelo que você pulou. O desvio é barato antes do lab e caro no meio dele."  # @src=cdcf2d763b37
          m01-l1-q4:
            # | The lesson states a hard requirement: your station repo will be PUBLIC. What
            # | actually depends on that?
            prompt: "A lição enuncia um requisito duro: o seu repo de estação vai ser PÚBLICO. O que de fato depende disso?"  # @src=c1cc1906e27f
            # | Three course-critical paths ride on the public repo: Actions is free and
            # | unmetered for public repos on standard runners, the dashboard will fetch
            # | status.json from the repo's public raw URL, and the Vercel Hobby lab
            # | connects a personal public repo. The cost is stated out loud, your station's
            # | code and history are public, and for a portfolio artifact, that's a feature.
            explanation: "Três caminhos críticos do curso andam sobre o repo público: o Actions é gratuito e sem medição para repos públicos em runners padrão, o painel vai buscar o status.json da URL raw pública do repo, e o lab Hobby do Vercel conecta um repo público pessoal. O custo é dito em voz alta, o código e o histórico da sua estação são públicos, e para um artefato de portfólio, isso é uma feature."  # @src=4f72096db1b2
            options:                 # source order — keep it
              a:
                # | The free-CI math, the dashboard's raw status.json fetch, and the Vercel
                # | repo lab
                label: "A matemática de CI gratuito, o fetch raw do status.json do painel, e o lab de repo do Vercel"  # @src=f856fbb3da5c
                # | Three paths ride on it: Actions is free and unmetered for public repos
                # | on standard runners, the dashboard reads status.json from the public raw
                # | URL, and the Vercel lab connects a personal public repo on the free
                # | tier.
                feedback: "Três caminhos andam sobre isso: o Actions é gratuito e sem medição para repos públicos em runners padrão, o painel lê o status.json da URL raw pública, e o lab do Vercel conecta um repo público pessoal no plano gratuito."  # @src=2e0cd6476b18
              c:
                # | Runner speed, public repositories are scheduled onto faster
                # | GitHub-hosted machines
                label: "Velocidade de runner, repositórios públicos são agendados em máquinas hospedadas pelo GitHub mais rápidas"  # @src=d06e1c0a701d
                # | Standard runners are the same hardware either way. What public buys is
                # | billing (free, unmetered on standard runners) and public raw file
                # | access, not speed.
                feedback: "Runners padrão são o mesmo hardware de qualquer forma. O que público compra é cobrança (gratuito, sem medição em runners padrão) e acesso público a arquivo raw, não velocidade."  # @src=e8a47e343bc9
              d:
                # | Just the free-CI math; the dashboard's raw status.json fetch works on a
                # | private repo too
                label: "Só a matemática de CI gratuito; o fetch raw do status.json do painel funciona num repo privado também"  # @src=0002f1ec420a
                # | The CI billing is one of the three, not the whole list. A private repo's
                # | raw URL answers only to a credential your dashboard's browser fetch will
                # | not be carrying, so that path breaks too, weeks later and quietly.
                feedback: "A cobrança de CI é um dos três, não a lista inteira. A URL raw de um repo privado responde só a uma credencial que o fetch de navegador do seu painel não vai estar carregando, então esse caminho também quebra, semanas depois e sem barulho."  # @src=b2be7996ba74
              b:
                # | GitHub policy, Actions workflows are only permitted to run on public
                # | repositories
                label: "Política do GitHub, workflows do Actions só têm permissão de rodar em repositórios públicos"  # @src=e4ec2f5fc72f
                # | Actions runs fine on private repos, but metered, against a monthly
                # | minutes quota. The course's unmetered-CI path is a public-repo property,
                # | not an Actions requirement.
                feedback: "O Actions roda bem em repos privados, mas com medição, contra uma cota mensal de minutos. O caminho de CI sem medição do curso é uma propriedade de repo público, não um requisito do Actions."  # @src=8d88a923f338
  m01-l2:
    # | Node 24, TypeScript 7, and your first probe
    title: "Node 24, TypeScript 7, e sua primeira sonda"  # @src=ce8937c0e9ed
    blocks:
      latency-stats:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Sort a COPY of the parsed numbers ascending with a numeric comparator, (a, b)
          # | => a - b, before anything else; min and max fall out of the sorted ends.
          0: "Ordene uma CÓPIA dos números parseados em ordem crescente com um comparador numérico, (a, b) => a - b, antes de qualquer outra coisa; min e max caem das pontas ordenadas."  # @src=96c70ea6480d
          # | Nearest-rank p95 on 20 samples: Math.ceil(0.95 * 20) - 1 = 18, so the answer
          # | is the 19th value, not the max.
          1: "O p95 por nearest-rank em 20 amostras: Math.ceil(0.95 * 20) - 1 = 18, então a resposta é o 19º valor, não o max."  # @src=e131f73012d2
          # | Round only the mean, and only at the end: Math.round(x * 100) / 100.
          2: "Arredonde só o mean, e só no final: Math.round(x * 100) / 100."  # @src=0c66709c4be8
        tests:                      # keyed by test case id
          t1:
            # | a single sample is its own min, max, mean, and p95
            description: "uma única amostra é o próprio min, max, mean e p95 dela"  # @src=fd9f8d735ac7
          t2:
            # | five unsorted samples: min 95, max 340, mean 189, p95 340
            description: "cinco amostras fora de ordem: min 95, max 340, mean 189, p95 340"  # @src=0ef35a156f69
          t3:
            # | twenty samples: nearest-rank p95 is the 19th value, not the max
            description: "vinte amostras: o p95 por nearest-rank é o 19º valor, não o max"  # @src=e003f7f2c954
          t4:
            # | mean rounds to 2 decimal places (34/3 -> 11.33)
            description: "o mean arredonda para 2 casas decimais (34/3 -> 11.33)"  # @src=1dfac488e06d
      toolchain-check:                      # quiz
        questions:
          m01-l2-q1:
            # | Your probe reads `const first = samples[0]` and the compiler insists `first`
            # | might be undefined even though you 'know' the array isn't empty. Which flag
            # | is speaking, and what is it saying?
            prompt: "Sua sonda lê `const first = samples[0]` e o compilador insiste que `first` pode ser undefined mesmo você 'sabendo' que o array não está vazio. Qual flag está falando, e o que ela está dizendo?"  # @src=43e02fc6ce63
            # | noUncheckedIndexedAccess makes indexed access tell the truth: samples[0] is
            # | T | undefined because index 0 might not exist. One if-check or a bounds
            # | guard narrows it, and the class of bug where an empty batch crashes the
            # | stats line is deleted from your codebase. This is the exact flag the
            # | lesson's planted bug trips.
            explanation: "noUncheckedIndexedAccess faz o acesso indexado dizer a verdade: samples[0] é T | undefined porque o índice 0 pode não existir. Um if de checagem ou uma trava de limites estreita isso, e a classe de bug em que um batch vazio quebra a linha de estatísticas é deletada da sua base de código. Esta é exatamente a flag que o bug plantado da lição dispara."  # @src=3ab471dc6f46
            options:                 # source order — keep it
              a:
                # | strict, it bans indexing arrays until you've declared their exact length
                # | in the type
                label: "strict, ela proíbe indexar arrays até você ter declarado o tamanho exato deles no tipo"  # @src=730f90599847
                # | strict is the umbrella, but nothing in it demands fixed-length types.
                # | The specific voice here is the index-access flag, and its ask is a
                # | check, not a length declaration.
                feedback: "strict é o guarda-chuva, mas nada dentro dela exige tipos de tamanho fixo. A voz específica aqui é a flag de acesso indexado, e o que ela pede é uma checagem, não uma declaração de tamanho."  # @src=948c8c83203c
              b:
                # | noUncheckedIndexedAccess, indexing can miss, so the element type
                # | includes undefined until you check
                label: "noUncheckedIndexedAccess, a indexação pode não achar nada, então o tipo do elemento inclui undefined até você checar"  # @src=d309b56255c5
                # | This is the flag that makes an indexed read tell the truth: index 0
                # | might not exist, so the element type carries undefined until a guard
                # | removes it. What it asks for is a check, not a cast.
                feedback: "Esta é a flag que faz uma leitura indexada dizer a verdade: o índice 0 pode não existir, então o tipo do elemento carrega undefined até uma trava remover ele. O que ela pede é uma checagem, não um cast."  # @src=b91816610e66
              c:
                # | exactOptionalPropertyTypes, array elements are optional properties and
                # | need the ?. operator everywhere
                label: "exactOptionalPropertyTypes, elementos de array são propriedades opcionais e precisam do operador ?. em todo lugar"  # @src=75a40922cab3
                # | That flag governs writing undefined into optional object properties, it
                # | has nothing to say about array indexing. Mixing the two up is common
                # | because both surface 'possibly undefined'.
                feedback: "Essa flag governa escrever undefined em propriedades opcionais de objeto, ela não tem nada a dizer sobre indexação de array. Confundir as duas é comum porque as duas fazem aparecer 'possivelmente undefined'."  # @src=375b2451f484
              d:
                # | noUncheckedSideEffectImports, the unchecked flags cover reads whose
                # | target may be missing
                label: "noUncheckedSideEffectImports, as flags unchecked cobrem leituras cujo alvo pode estar faltando"  # @src=ad3e20945ba7
                # | Same word, different job: that one makes a bare import "./x" point at a
                # | file that exists. It never looks at an array read, and the two get
                # | confused because both start with noUnchecked.
                feedback: "Mesma palavra, trabalho diferente: essa faz um import \"./x\" pelado apontar para um arquivo que existe. Ela nunca olha uma leitura de array, e as duas se confundem porque as duas começam com noUnchecked."  # @src=a2e584f622d4
          m01-l2-q2:
            # | A teammate's setup script runs `npm i -D typescript@7.0.0` and fails. What's
            # | wrong with it?
            prompt: "O script de setup de um colega de time roda `npm i -D typescript@7.0.0` e falha. O que tem de errado nele?"  # @src=0b13960bb306
            # | A registry quirk worth knowing, and worth confirming yourself with `npm view
            # | typescript versions`: no 7.0.0 was ever published in any form, and 7.0.1
            # | exists only as the pre-release 7.0.1-rc, so TypeScript 7's stable line
            # | begins and ends at 7.0.2 (checked 2026-09-06). Prose can say 'TypeScript
            # | 7.0'; install lines must say 7.0.2. It's also a small preview of a
            # | course-long habit: versions are checked against the registry, never assumed.
            explanation: "Uma esquisitice do registro que vale saber, e vale confirmar você mesmo com `npm view typescript versions`: nenhum 7.0.0 foi publicado em forma nenhuma, e o 7.0.1 existe só como o pre-release 7.0.1-rc, então a linha estável do TypeScript 7 começa e termina em 7.0.2 (conferido em 2026-09-06). A prosa pode dizer 'TypeScript 7.0'; linhas de install têm que dizer 7.0.2. É também uma pequena prévia de um hábito que dura o curso inteiro: versões são conferidas contra o registro, nunca assumidas."  # @src=30ca83f115e2
            options:                 # source order — keep it
              a:
                # | Nothing, 7.0.0 is the GA release; the registry was probably just having
                # | a bad day
                label: "Nada, 7.0.0 é o release de GA; o registro provavelmente só estava tendo um dia ruim"  # @src=13e87097c0f4
                # | It will fail every day: no stable 7.0.0 was ever published. GA landed
                # | with patch fixes already in, so the first (and only) stable 7.x on the
                # | registry is 7.0.2.
                feedback: "Vai falhar todo dia: nenhum 7.0.0 estável foi publicado. A GA chegou com correções de patch já dentro, então o primeiro (e único) 7.x estável no registro é o 7.0.2."  # @src=f234ef0b8b4e
              c:
                # | There is no stable 7.0.0 or 7.0.1, stable 7.x on the registry is exactly
                # | 7.0.2
                label: "Não existe 7.0.0 estável nem 7.0.1, o 7.x estável no registro é exatamente 7.0.2"  # @src=b3eb38f3a519
                # | GA landed with patch fixes already rolled in, so the stable 7.x line
                # | begins and ends at 7.0.2. Prose can say TypeScript 7.0; an install line
                # | has to say the version the registry actually holds.
                feedback: "A GA chegou com correções de patch já incorporadas, então a linha estável do 7.x começa e termina em 7.0.2. A prosa pode dizer TypeScript 7.0; uma linha de install tem que dizer a versão que o registro realmente guarda."  # @src=4d5a770ae4a3
              b:
                # | Dev dependencies can't pin exact versions, the line needs a caret range
                # | like ^7
                label: "Dependências de dev não conseguem fixar versões exatas, a linha precisa de um range de caret como ^7"  # @src=60d34b898463
                # | Exact pins are perfectly legal in devDependencies (and often wise for a
                # | compiler). The install fails because that exact version doesn't exist,
                # | not because it's exact.
                feedback: "Pins exatos são perfeitamente legais em devDependencies (e muitas vezes sábios para um compilador). O install falha porque essa versão exata não existe, não porque ela é exata."  # @src=2070273639bc
              d:
                # | 7.0.0 lives behind the next dist-tag, so the install line needs
                # | typescript@next
                label: "O 7.0.0 mora atrás do dist-tag next, então a linha de install precisa de typescript@next"  # @src=f458756a4b74
                # | The next tag carries a 7.1.0 dev build, not a 7.0.0. Ask the registry
                # | yourself with npm view typescript dist-tags.latest dist-tags.next and
                # | the two tags answer the question in one line.
                feedback: "A tag next carrega um 7.1.0 dev build, não um 7.0.0. Pergunte ao registro você mesmo com npm view typescript dist-tags.latest dist-tags.next e as duas tags respondem a pergunta numa linha."  # @src=7857702ec150
          m01-l2-q3:
            # | You try wiring typescript-eslint into the fresh TS 7 project and it refuses
            # | to run. Per the lesson's caveat box, what's the actual cause?
            prompt: "Você tenta ligar o typescript-eslint no projeto TS 7 novo e ele se recusa a rodar. Conforme a caixa de ressalva da lição, qual é a causa real?"  # @src=5c9f6fdb93b4
            # | The GA post says it plainly: 'We expect TypeScript 7.1 to ship with a new
            # | (and different) API.' Until then, tooling that programmatically drives the
            # | compiler, typescript-eslint, framework language plugins, stays on 5.x/6.x,
            # | which is why kit itself builds with typescript ^5.9.3. Fastest compiler ever
            # | shipped, ecosystem still catching up: both true at once.
            explanation: "O post de GA diz na lata: 'Esperamos que o TypeScript 7.1 seja entregue com uma API nova (e diferente).' Até lá, ferramentaria que dirige o compilador programaticamente, typescript-eslint, plugins de linguagem de framework, fica no 5.x/6.x, que é por que o próprio kit faz o build com typescript ^5.9.3. O compilador mais rápido já entregue, ecossistema ainda correndo atrás: as duas coisas verdadeiras ao mesmo tempo."  # @src=2a2c66049578
            options:                 # source order — keep it
              b:
                # | TS 7 dropped the type-checker layers that lint rules depend on for their
                # | analysis
                label: "O TS 7 removeu as camadas de type-checker de que as regras de lint dependem para a análise delas"  # @src=bf79d0640c6f
                # | The checker is fully there, 7.0 matches 6.0's type-checking behavior.
                # | What's missing is the API surface tools use to CALL it; the checking
                # | itself is faster than ever.
                feedback: "O verificador está inteiro ali, o 7.0 bate com o comportamento de checagem de tipos do 6.0 ponto a ponto. O que falta é a superfície de API que as ferramentas usam para CHAMAR ele; a checagem em si está mais rápida que nunca."  # @src=d32a2df87fcf
              d:
                # | It needs a global tsc installed on PATH, and npx-scoped installs hide
                # | the local one
                label: "Ele precisa de um tsc global instalado no PATH, e installs com escopo de npx escondem o local"  # @src=9991b00ba89a
                # | npx runs the binary in your own node_modules, which is the point of a
                # | per-project pin; nothing here is hidden. A linter does not shell out to
                # | tsc anyway, it asks the compiler API for types.
                feedback: "O npx roda o binário no seu próprio node_modules, que é o ponto de um pin por projeto; nada aqui está escondido. Um linter não chama o tsc por shell de qualquer jeito, ele pede tipos para a API do compilador."  # @src=4175bb9150f9
              c:
                # | The Go compiler emits different JavaScript output that ESLint's own
                # | parser can't read
                label: "O compilador em Go emite uma saída JavaScript diferente que o parser do próprio ESLint não consegue ler"  # @src=920d56844451
                # | Linters read your source, not the compiler's output, and the native port
                # | changes the compiler's implementation language, not what it emits. The
                # | gap is the missing programmatic API.
                feedback: "Linters leem seu código-fonte, não a saída do compilador, e o port nativo muda a linguagem de implementação do compilador, não o que ele emite. A lacuna é a API programática que está faltando."  # @src=98bf3d459fc8
              a:
                # | TS 7 shipped with no programmatic API, tools that drive the compiler
                # | wait for 7.1
                label: "O TS 7 foi entregue sem API programática, ferramentas que dirigem o compilador esperam o 7.1"  # @src=4c5b0da2cfdd
                # | The GA post says 7.1 will ship a new and different API, and until it
                # | does, anything that calls the compiler in-process is stuck. That is why
                # | wild repos, kit included, still pin 5.x for tooling.
                feedback: "O post de GA diz que o 7.1 vai entregar uma API nova e diferente, e até isso acontecer, qualquer coisa que chama o compilador no mesmo processo fica travada. É por isso que repos no mundo real, o kit incluído, ainda fixam 5.x para ferramentaria."  # @src=c7727be8104d
          m01-l2-q4:
            # | A 2022 blog post warns that your ESM probe can't use a CommonJS-era package
            # | without a bundler workaround. In today's Node 24, is that still true?
            prompt: "Um post de blog de 2022 avisa que sua sonda ESM não consegue usar um pacote da era CommonJS sem uma gambiarra de bundler. No Node 24, hoje, isso ainda é verdade?"  # @src=c5db36c625e7
            # | The lesson spends exactly one paragraph on ESM because that's what the 2026
            # | reality deserves: require(esm) is stable, tsc --init emits ESM-first
            # | settings (module: nodenext), and the decade of interop folklore is now
            # | archaeology. Write ESM, consume what you need, spend the reclaimed attention
            # | on types.
            explanation: "A lição gasta exatamente um parágrafo com ESM porque é isso que a realidade de 2026 merece: require(esm) é estável, tsc --init emite configurações ESM-first (module: nodenext), e a década de folclore de interop agora é arqueologia. Escreva ESM, consuma o que você precisar, gaste a atenção recuperada em tipos."  # @src=33d8504d82a8
            options:                 # source order — keep it
              a:
                # | Yes, ESM and CJS still can't share a process without a bundler
                # | translating between them
                label: "Sim, ESM e CJS ainda não conseguem dividir um processo sem um bundler traduzindo entre os dois"  # @src=2cbde2f0dfa4
                # | That was the 2022 reality. Interop has been the runtime's job for a
                # | while now, and the last missing direction, require() of an ES module, is
                # | stable in Node 24.
                feedback: "Essa era a realidade de 2022 mesmo. Interop já é trabalho do runtime há um tempo, e a última direção que faltava, require() de um ES module, é estável no Node 24."  # @src=b4cc451d2e3b
              b:
                # | No, require(esm) is stable in Node 24; the war is over, so author
                # | ESM-first and move on
                label: "Não, require(esm) é estável no Node 24; a guerra terminou, então escreva ESM-first e siga a vida"  # @src=8e006660ba73
                # | The runtime absorbed the problem: require(esm) is stable in Node 24 and
                # | tsc --init already emits ESM-first settings, so the workaround that post
                # | describes is answering a question from 2022.
                feedback: "O runtime absorveu o problema: require(esm) é estável no Node 24 e o tsc --init já emite configurações ESM-first, então a gambiarra que aquele post descreve está respondendo uma pergunta de 2022."  # @src=a91905f7bcba
              d:
                # | Yes for packages that ship CommonJS, importing one from ESM still needs
                # | a bundler step
                label: "Sim para pacotes que entregam CommonJS, importar um deles de ESM ainda precisa de uma etapa de bundler"  # @src=f8f82a4638ea
                # | That direction has worked in Node for years, and the other one closed in
                # | 24. Consuming a CommonJS package from an ESM file is an import, not a
                # | build step; the bundler was never part of this.
                feedback: "Essa direção funciona no Node há anos, e a outra fechou no 24. Consumir um pacote CommonJS de um arquivo ESM é um import, não uma etapa de build; o bundler nunca fez parte disso."  # @src=b0b77b2c48e2
              c:
                # | Only if you launch node with the experimental modules flag that enables
                # | cross-loading
                label: "Só se você iniciar o node com a flag experimental de modules que habilita o cross-loading"  # @src=c65958dd84ac
                # | No flag needed anymore, the docs' own version history marks require(esm)
                # | 'no longer experimental'. Advice that mentions the flag is dated to the
                # | transition years.
                feedback: "Nenhuma flag é necessária mais, o próprio histórico de versões dos docs marca require(esm) como 'no longer experimental'. Conselho que menciona a flag é datado dos anos de transição."  # @src=f156ea40f4e2
  m01-l3:
    # | Green means it ran without you: git, GitHub flow, Actions
    title: "Verde significa que rodou sem você: git, GitHub flow, Actions"  # @src=9af18ae74785
    blocks:
      first-ship-check:                      # quiz
        questions:
          m01-l3-q1:
            # | Your cron is `*/30 * * * *` but the run timestamps land at :07 and :41, and
            # | one half-hour slot has no run at all. What's happening?
            prompt: "Seu cron é `*/30 * * * *` mas os timestamps das execuções caem às :07 e :41, e um slot de meia hora não tem execução nenhuma. O que está acontecendo?"  # @src=3c115a1186fc
            # | GitHub's own docs say scheduled events can be delayed during high-load
            # | periods, the start of every hour is named, and 'if the load is sufficiently
            # | high enough, some queued jobs may be dropped.' No delay bound is documented
            # | anywhere, so the station does what monitors do: diff scheduled time against
            # | actual commit time and know YOUR skew. A 30-minute heartbeat tolerates this
            # | fine; that tolerance is a design decision you just made.
            explanation: "A própria documentação do GitHub diz que eventos agendados podem ser atrasados em períodos de alta carga, o começo de cada hora é nomeado, e 'se a carga for suficientemente alta, alguns jobs na fila podem ser descartados.' Nenhum limite de atraso está documentado em lugar algum, então a estação faz o que monitores fazem: fazer o diff do horário agendado contra o horário real do commit e saber o SEU desvio. Um batimento de 30 minutos tolera isso tranquilamente; essa tolerância é uma decisão de projeto que você acabou de tomar."  # @src=13cdc66c33a2
            options:                 # source order — keep it
              a:
                # | A workflow syntax error, valid cron YAML always fires within the
                # | scheduled minute
                label: "Um erro de sintaxe no workflow, YAML de cron válido sempre dispara dentro do minuto agendado"  # @src=10db771bfd7e
                # | A syntax error would disable the workflow entirely, not shift it.
                # | Drifting timestamps with occasional gaps is the documented behavior of a
                # | healthy schedule on shared infrastructure.
                feedback: "Um erro de sintaxe desativaria o workflow inteiramente, não o deslocaria. Timestamps derivando com lacunas ocasionais é o comportamento documentado de um agendamento saudável em infraestrutura compartilhada."  # @src=f16d795fb901
              b:
                # | Free-tier runs are queued behind paid plans, upgrading buys exact-time
                # | scheduling
                label: "Execuções do tier gratuito ficam na fila atrás de planos pagos, fazer upgrade compra agendamento em horário exato"  # @src=04f1112c01ea
                # | No plan buys punctual cron, the best-effort language applies to
                # | scheduled events across the platform, and GitHub documents no exact-time
                # | tier. The fix is designing for drift, not paying.
                feedback: "Nenhum plano compra cron pontual, a linguagem de best-effort se aplica a eventos agendados em toda a plataforma, e o GitHub não documenta nenhum tier de horário exato. A correção é projetar para a deriva, não pagar."  # @src=833fdf685f55
              c:
                # | Schedules are best-effort, delayed under load, and queued runs even get
                # | dropped
                label: "Agendamentos são best-effort, atrasados sob carga, e execuções na fila chegam a ser descartadas"  # @src=776ae477e260
                # | Best-effort is the platform's own word for it: scheduled events get
                # | delayed when Actions is busy, and under enough load a queued job is
                # | dropped outright. A 30-minute heartbeat is built to shrug at both.
                feedback: "Best-effort é a palavra da própria plataforma para isso: eventos agendados são atrasados quando o Actions está ocupado e, sob carga suficiente, um job na fila é descartado de vez. Um batimento de 30 minutos é construído para dar de ombros para os dois."  # @src=8f1a4be0614d
              d:
                # | The cron counts 30 minutes from the end of the previous run, so each
                # | start slides later
                label: "O cron conta 30 minutos a partir do fim da execução anterior, então cada início desliza para mais tarde"  # @src=713ebeb575ae
                # | Cron fields are wall-clock slots, not a stopwatch: */30 means minute 0
                # | and minute 30 of every hour, and the scheduler aims at those ticks
                # | whatever the previous run did. Sliding starts would never leave a slot
                # | empty either.
                feedback: "Campos de cron são slots de relógio de parede, não um cronômetro: */30 significa minuto 0 e minuto 30 de cada hora, e o agendador mira nesses ticks independentemente do que a execução anterior fez. Inícios deslizantes também nunca deixariam um slot vazio."  # @src=a3a309f50db6
          m01-l3-q2:
            # | Your workflow commits status.json back to the repo on every run, a push, to
            # | a repo with a push-triggered workflow. Why doesn't this loop forever?
            prompt: "Seu workflow faz commit de status.json de volta no repo em toda execução, um push, para um repo com um workflow disparado por push. Por que isso não entra em loop para sempre?"  # @src=612e20addb37
            # | The docs state it directly: events triggered by GITHUB_TOKEN will not create
            # | a new workflow run (workflow_dispatch and repository_dispatch excepted), a
            # | deliberate guard against accidental recursion. For the station it's a
            # | feature, not a limitation: the status commit is data, not a signal. When you
            # | someday WANT a downstream workflow to react, the documented path is a PAT or
            # | GitHub App token, a bridge m09-l2's alarm work walks past again.
            explanation: "A documentação afirma direto: eventos disparados pelo GITHUB_TOKEN não vão criar uma nova execução de workflow (com exceção de workflow_dispatch e repository_dispatch), uma trava deliberada contra recursão acidental. Para a estação é uma feature, não uma limitação: o commit de status é dado, não sinal. Quando algum dia você QUISER que um workflow downstream reaja, o caminho documentado é um PAT ou token de GitHub App, uma ponte pela qual o trabalho de alarme de m09-l2 passa de novo."  # @src=ce4d71813f03
            options:                 # source order — keep it
              b:
                # | GitHub detects commit loops by content hashing and cancels the repeating
                # | runs
                label: "O GitHub detecta loops de commit por hashing de conteúdo e cancela as execuções repetidas"  # @src=5a688d6dfaff
                # | There's no content-based loop detection, the guard is simpler and
                # | earlier: the run never starts, because the triggering event came from
                # | the workflow's own token.
                feedback: "Não existe detecção de loop baseada em conteúdo, a trava é mais simples e mais cedo: a execução nunca começa, porque o evento que disparou veio do próprio token do workflow."  # @src=9176f5048562
              d:
                # | The bot's message carries a [skip ci] marker, so the workflow ignores
                # | its own push
                label: "A mensagem do bot carrega um marcador [skip ci], então o workflow ignora seu próprio push"  # @src=02b6c57d0f81
                # | Look at the commit step: the message is just 'pulse: scheduled probe',
                # | no marker anywhere, and the run still doesn't repeat. What stops it is
                # | who signed the event, not what the message says.
                feedback: "Olhe o step de commit: a mensagem é só 'pulse: scheduled probe', nenhum marcador em lugar algum, e a execução ainda assim não se repete. O que a impede é quem assinou o evento, não o que a mensagem diz."  # @src=e723342bd124
              c:
                # | Workflows are rate-limited to one run per branch per minute, which
                # | breaks the cycle
                label: "Workflows têm rate limit de uma execução por branch por minuto, o que quebra o ciclo"  # @src=6068b328ea62
                # | A per-minute cap would slow a loop, not stop it, you'd still burn a run
                # | every minute forever. The actual mechanism is that token-authored events
                # | don't trigger runs at all.
                feedback: "Um teto por minuto desaceleraria um loop, não o pararia, você ainda queimaria uma execução por minuto para sempre. O mecanismo real é que eventos de autoria do token simplesmente não disparam execuções."  # @src=d0065670fd3f
              a:
                # | Events triggered by GITHUB_TOKEN don't create new workflow runs, the
                # | recursion guard
                label: "Eventos disparados pelo GITHUB_TOKEN não criam novas execuções de workflow, a trava de recursão"  # @src=e70719e376b6
                # | The platform ships the one guard you would otherwise have had to
                # | engineer: an event authored by GITHUB_TOKEN starts no new run, so the
                # | status commit lands as data rather than as a signal.
                feedback: "A plataforma já entrega a única trava que você teria tido que construir: um evento de autoria do GITHUB_TOKEN não inicia nenhuma execução nova, então o commit de status cai como dado e não como sinal."  # @src=fa80dd803247
          m01-l3-q3:
            # | You return from a two-month break: repo untouched, no failure emails, and
            # | status.json's last commit is weeks old. What most likely happened?
            prompt: "Você volta de uma pausa de dois meses: repo intocado, nenhum e-mail de falha, e o último commit de status.json é de semanas atrás. O que mais provavelmente aconteceu?"  # @src=6d574d85fe0b
            # | The documented rule: in a public repository, scheduled workflows are
            # | automatically disabled when no repository activity has occurred in 60 days.
            # | No failure notification fires because nothing failed, the schedule just
            # | stopped, silently. Re-enable it in the Actions tab; the keepalive-commit
            # | countermeasure works in practice, though GitHub never defines which activity
            # | resets the clock, the lesson teaches the hedge along with the fix. This
            # | silent-death mode is exactly why m09-l2 builds an alarm for the monitor
            # | itself.
            explanation: "A regra documentada: em um repositório público, workflows agendados são automaticamente desativados quando nenhuma atividade no repositório ocorreu em 60 dias. Nenhuma notificação de falha dispara porque nada falhou, o agendamento simplesmente parou, em silêncio. Reative na aba Actions; a contramedida do commit de keepalive funciona na prática, embora o GitHub nunca defina qual atividade reseta o relógio, a lição ensina a ressalva junto com a correção. Esse modo de morte silenciosa é exatamente por que m09-l2 constrói um alarme para o próprio monitor."  # @src=4230ee5d3a67
            options:                 # source order — keep it
              c:
                # | Cron workflows expire after 90 days and must be recreated with a fresh
                # | workflow file
                label: "Workflows de cron expiram depois de 90 dias e precisam ser recriados com um arquivo de workflow novo"  # @src=ea5c721b25f6
                # | Workflows never expire, the file is fine and nothing needs rewriting.
                # | The schedule was switched off by the inactivity rule, and one click (or
                # | one commit) brings the existing workflow back.
                feedback: "Workflows nunca expiram, o arquivo está bem e nada precisa ser reescrito. O agendamento foi desligado pela regra de inatividade, e um clique (ou um commit) traz o workflow existente de volta."  # @src=8958c6c90821
              d:
                # | The commit step is failing on a 403, so runs go red without ever writing
                # | status.json
                label: "O step de commit está falhando com um 403, então as execuções ficam vermelhas sem nunca escrever status.json"  # @src=bef9a4e6c48e
                # | A 403 on the push step is loud: the step fails, the run goes red, and a
                # | failed scheduled run is exactly what GitHub does mail you about. An
                # | empty inbox with a clean history points at a schedule that stopped, not
                # | one that broke.
                feedback: "Um 403 no step do push é alto: o step falha, a execução fica vermelha, e uma execução agendada que falhou é exatamente o que o GitHub te manda e-mail sobre. Uma caixa de entrada vazia com um histórico limpo aponta para um agendamento que parou, não para um que quebrou."  # @src=b160ae02bce4
              b:
                # | Public-repo schedules auto-disable after 60 days of inactivity, it needs
                # | re-enabling
                label: "Agendamentos de repo público se autodesativam depois de 60 dias de inatividade, precisa ser reativado"  # @src=001cbd949f22
                # | Sixty idle days switches a public repo's schedule off, and since nothing
                # | failed there is nothing to notify you about. One click on the Actions
                # | tab brings the same workflow file back to life.
                feedback: "Sessenta dias ociosos desligam o agendamento de um repo público e, como nada falhou, não há nada sobre o que te notificar. Um clique na aba Actions traz o mesmo arquivo de workflow de volta à vida."  # @src=6711b57b27f6
              a:
                # | The month's free Actions minutes ran out and the workflow paused until
                # | the next cycle
                label: "Os minutos gratuitos de Actions do mês acabaram e o workflow pausou até o próximo ciclo"  # @src=a31aea3dda49
                # | Minutes quotas meter private repos, the station's public repo runs
                # | unmetered on standard runners. Nothing here is counting your minutes.
                feedback: "Cotas de minutos medem repos privados, o repo público da estação roda sem medição em runners padrão. Nada aqui está contando seus minutos."  # @src=3a661b59e224
          m01-l3-q4:
            # | A friend warns you: 'CI gets expensive, my team burns through the free
            # | minutes by mid-month.' Why does the station's pipeline cost nothing, this
            # | month and every month?
            prompt: "Um amigo te avisa: 'CI fica caro, meu time queima os minutos gratuitos até o meio do mês.' Por que o pipeline da estação não custa nada, neste mês e em todo mês?"  # @src=65261a7bb19b
            # | The vendor's line: Actions usage is free for public repositories using
            # | standard GitHub-hosted runners; included minutes (Free plan: 2,000/month)
            # | are a private-repo concept. Two catches worth keeping: larger runners are
            # | ALWAYS charged, even on public repos, so the station stays on ubuntu-latest,
            # | and this economics is exactly why m01-l1 made 'your repo is public' a stated
            # | prerequisite with its cost said out loud.
            explanation: "A fala do fornecedor: o uso do Actions é gratuito para repositórios públicos que usam runners padrão hospedados pelo GitHub; minutos incluídos (plano Free: 2,000/mês) são um conceito de repo privado. Duas pegadinhas que vale guardar: runners maiores são SEMPRE cobrados, mesmo em repos públicos, então a estação fica no ubuntu-latest, e essa economia é exatamente por que m01-l1 fez de 'seu repo é público' um pré-requisito declarado com seu custo dito em voz alta."  # @src=c92419dbea60
            options:                 # source order — keep it
              d:
                # | The repo is public, and public repos run free on runners of any size
                # | that GitHub offers you
                label: "O repo é público, e repos públicos rodam de graça em runners de qualquer tamanho que o GitHub te oferece"  # @src=9e1e68e2dc71
                # | Runner size is the catch. GitHub's billing docs say larger runners are
                # | always charged for, even when used by public repositories, so the free
                # | claim holds on the standard ones, which is all a three-URL probe needs.
                feedback: "O tamanho do runner é a pegadinha. A documentação de cobrança do GitHub diz que runners maiores são sempre cobrados, mesmo quando usados por repositórios públicos, então a alegação de gratuidade vale nos padrão, que é tudo que uma sonda de três URLs precisa."  # @src=0199f452bddb
              c:
                # | Public repos on standard runners are unmetered, minutes quotas only
                # | meter private repos
                label: "Repos públicos em runners padrão não são medidos, cotas de minutos só medem repos privados"  # @src=18075de9486d
                # | There is no quota being generously not-consumed here; the meter that
                # | would count these runs does not exist for a public repo on standard
                # | runners. Your friend's team is real, they are just on a private repo.
                feedback: "Não existe uma cota sendo generosamente não consumida aqui; o medidor que contaria essas execuções não existe para um repo público em runners padrão. O time do seu amigo é real, eles só estão em um repo privado."  # @src=fabd2e4ab420
              b:
                # | The 2,000 free monthly minutes comfortably cover a probe that only runs
                # | every 30 minutes
                label: "Os 2,000 minutos mensais gratuitos cobrem confortavelmente uma sonda que só roda a cada 30 minutos"  # @src=ed38920b0e43
                # | The arithmetic might even work, but it's answering the wrong question.
                # | The station never touches that quota, because the quota only exists for
                # | private repos.
                feedback: "A conta pode até fechar, mas está respondendo à pergunta errada. A estação nunca toca essa cota, porque a cota só existe para repos privados."  # @src=16a06f840e08
              a:
                # | Every GitHub account gets unlimited Actions minutes across all of its
                # | repos, public or private
                label: "Toda conta do GitHub recebe minutos ilimitados de Actions em todos os seus repos, públicos ou privados"  # @src=111ef7fc86fb
                # | Private repos are metered, the Free plan includes 2,000 minutes a month
                # | and stops there. Your friend's team is real; they're just on private
                # | repos.
                feedback: "Repos privados são medidos, o plano Free inclui 2,000 minutos por mês e para aí. O time do seu amigo é real; eles só estão em repos privados."  # @src=ff97d52ade50
  m02-l1:
    # | Make impossible states unrepresentable
    title: "Torne estados impossíveis irrepresentáveis"  # @src=e19a3c1565c9
    blocks:
      classify-probe-result:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Declare the union first: { kind: 'ok'; latencyMs } | { kind: 'timeout';
          # | budgetMs } | { kind: 'http-error'; status }, each variant carries exactly its
          # | own data.
          0: "Declare a união primeiro: { kind: 'ok'; latencyMs } | { kind: 'timeout'; budgetMs } | { kind: 'http-error'; status }, cada variante carrega exatamente os dados dela."  # @src=1b6a96eae52b
          # | Write parseProbe(kind, value): ProbeResult | null and handle null as 'invalid'
          # | BEFORE the switch, parse at the boundary, then trust the type.
          1: "Escreva parseProbe(kind, value): ProbeResult | null e trate null como 'invalid' ANTES do switch, faça o parse na fronteira, depois confie no tipo."  # @src=1bc3a87cf726
          # | Mind the boundaries: 400 and 1000 are both 'degraded'; only strictly above
          # | 1000 is 'down'. A 429 http-error means the target answered, 'degraded', not
          # | 'down'.
          2: "Preste atenção nas fronteiras: 400 e 1000 são os dois 'degraded'; só estritamente acima de 1000 é 'down'. Um http-error 429 significa que o alvo respondeu, 'degraded', não 'down'."  # @src=2714e5403e29
          # | Close the switch with default: return assertNever(result), then delete an arm
          # | and watch tsc name it.
          3: "Feche o switch com default: return assertNever(result), depois delete um braço e veja o tsc nomear ele."  # @src=0524a68bd963
        tests:                      # keyed by test case id
          t1:
            # | fast ok probe is up
            description: "sonda ok rápida é up"  # @src=331560986ea1
          t2:
            # | the 400ms boundary is degraded, not up
            description: "a fronteira de 400ms é degraded, não up"  # @src=af836e096da9
          t3:
            # | 1000ms is still inside the degraded band
            description: "1000ms ainda está dentro da faixa degraded"  # @src=b1f5a4bff3cc
          t4:
            # | past the degraded band is down
            description: "passando da faixa degraded é down"  # @src=5cb9e32b2cb3
          t5:
            # | a timeout is down regardless of the budget that expired
            description: "um timeout é down independente do budget que expirou"  # @src=b99fb411a78c
          t6:
            # | rate-limited target answered, degraded, not down
            description: "alvo com rate-limit respondeu, degraded, não down"  # @src=3997df4b2eb2
          t7:
            # | a 5xx answer is down
            description: "uma resposta 5xx é down"  # @src=f11e2d6d448d
          t8:
            # | unknown kinds parse to null and classify as invalid
            description: "kinds desconhecidos dão parse para null e classificam como invalid"  # @src=06e2f3318467
      check:                      # quiz
        questions:
          m02l1-q1:
            # | Your switch over result.kind ends with `default: return
            # | assertNever(result)`. You add a 'dns-error' variant and tsc errors at that
            # | line. What is the mechanism?
            prompt: "O seu switch sobre result.kind termina com `default: return assertNever(result)`. Você adiciona uma variante 'dns-error' e o tsc dá erro naquela linha. Qual é o mecanismo?"  # @src=9cb83c078417
            # | Exhaustiveness is a feature you opt into: handle every variant and the
            # | default arm's value narrows to never, which accepts nothing. Add a variant
            # | and the leftover type is no longer never, the compile fails at exactly the
            # | sites that must learn about the new case. It is a refactor checklist the
            # | compiler writes for you.
            explanation: "Exaustividade é uma feature que você escolhe ativar: trate toda variante e o valor do braço default estreita para never, que não aceita nada. Adicione uma variante e o tipo que sobra não é mais never, a compilação falha exatamente nos pontos que precisam aprender sobre o caso novo. É uma checklist de refatoração que o compilador escreve para você."  # @src=b857d9440995
            options:                 # source order — keep it
              d:
                # | The classifier's declared return type stopped covering the new variant,
                # | so the default arm's return is what tsc rejects
                label: "O tipo de retorno declarado do classificador parou de cobrir a variante nova, então o return do braço default é o que o tsc rejeita"  # @src=d0c5399b422a
                # | Read the error text: it complains about an ARGUMENT not assignable to
                # | parameter of type 'never'. assertNever returns `never`, which is
                # | assignable to any return type, and Verdict never changed.
                feedback: "Leia o texto do erro: ele reclama de um ARGUMENTO não atribuível a um parâmetro do tipo 'never'. assertNever retorna `never`, que é atribuível a qualquer tipo de retorno, e Verdict nunca mudou."  # @src=a149cbe6f82b
              b:
                # | Handling every variant narrows result to `never` in the default arm; the
                # | new variant makes it non-never, so the call stops type-checking
                label: "Tratar toda variante estreita result para `never` no braço default; a variante nova torna ele não-never, então a chamada para de passar na checagem de tipos"  # @src=8030f2f1cc6e
                # | Narrowing does all the work: each handled case peels one variant off,
                # | and when the leftover is `never` the call is legal. Add a variant and
                # | the leftover has a value again, so tsc names it at that line.
                feedback: "O narrowing faz todo o trabalho: cada case tratado descasca uma variante, e quando o que sobra é `never` a chamada é legal. Adicione uma variante e o que sobra tem um valor de novo, então o tsc nomeia ele naquela linha."  # @src=c1b8f31d1c82
              a:
                # | A dns-error object reached the default arm while the tests ran, so
                # | assertNever threw at runtime and vitest surfaced the failure
                label: "Um objeto dns-error chegou no braço default enquanto os testes rodavam, então assertNever lançou em tempo de execução e o vitest trouxe a falha à tona"  # @src=336d407ae3ed
                # | No code ran, this is a COMPILE error. The never-check works before the
                # | program exists; that is the whole point of opting into exhaustiveness.
                feedback: "Nenhum código rodou, isto é um erro de COMPILAÇÃO. A checagem de never funciona antes de o programa existir; esse é o ponto inteiro de escolher ativar a exaustividade."  # @src=3539d31b566c
              c:
                # | assertNever is a compiler intrinsic: tsc treats any function with that
                # | name specially inside switch statements and re-checks the case list
                label: "assertNever é um intrínseco do compilador: o tsc trata qualquer função com esse nome de forma especial dentro de instruções switch e re-checa a lista de cases"  # @src=10bf8ad096d2
                # | assertNever is an ordinary function you wrote, the magic is entirely in
                # | narrowing. Any function taking `never` would behave identically.
                feedback: "assertNever é uma função comum que você escreveu, a mágica está inteiramente no narrowing. Qualquer função que recebe `never` se comportaria de forma idêntica."  # @src=636580f657b7
          m02l1-q2:
            # | You retype the fetched config from `any` to `unknown`. Nothing about the
            # | runtime changed. What changed for you, day to day?
            prompt: "Você retipa a config buscada de `any` para `unknown`. Nada no runtime mudou. O que mudou para você, no dia a dia?"  # @src=984ad690f4ce
            # | any is the compiler resigning; unknown is the compiler demanding proof. Same
            # | runtime, opposite defaults: any permits everything and spreads through your
            # | code; unknown permits nothing until narrowed, which forces the
            # | parse-at-the-boundary discipline the fleet is about to adopt.
            explanation: "any é o compilador se demitindo; unknown é o compilador exigindo prova. Mesmo runtime, defaults opostos: any permite tudo e se espalha pelo seu código; unknown não permite nada até ser estreitado, o que força a disciplina de parse na fronteira que a frota está prestes a adotar."  # @src=2ded6c88f5db
            options:                 # source order — keep it
              b:
                # | unknown makes JSON.parse reject malformed input at runtime, so bad
                # | config now throws at the boundary instead of propagating inward
                label: "unknown faz JSON.parse rejeitar entrada malformada em tempo de execução, então config ruim agora lança na fronteira em vez de propagar para dentro"  # @src=4dee619748f9
                # | Types are erased, unknown adds zero runtime behavior. Runtime rejection
                # | is a parser's job, which is exactly what zod does next lesson.
                feedback: "Tipos são apagados, unknown adiciona zero comportamento em tempo de execução. Rejeição em tempo de execução é trabalho de um parser, que é exatamente o que o zod faz na próxima lição."  # @src=94c70b6b1d2d
              c:
                # | You cannot touch the value until you narrow it, every use site must
                # | prove a shape first, enforced by the compiler
                label: "Você não pode tocar no valor até estreitar ele, todo ponto de uso tem que provar um formato primeiro, imposto pelo compilador"  # @src=8f5ddc9ee5ad
                # | Same erased runtime, opposite defaults: any permits every operation and
                # | asks nothing, unknown permits none until a typeof or discriminant check
                # | has done the proving. The friction is the feature.
                feedback: "Mesmo runtime apagado, defaults opostos: any permite toda operação e não pede nada, unknown não permite nenhuma até uma checagem de typeof ou de discriminante ter feito a prova. A fricção é a feature."  # @src=dc03f17ec404
              d:
                # | The compiler infers the config's real shape from the parsed JSON, so its
                # | own fields start autocompleting right away
                label: "O compilador infere o formato real da config a partir do JSON depois do parse, então os campos dela começam a autocompletar na hora"  # @src=f0f9246d7a6b
                # | JSON.parse hands back bytes nobody has proven anything about; there is
                # | no shape to infer from at compile time. Autocomplete arrives only after
                # | you narrow, or after next lesson's schema parses it for you.
                feedback: "JSON.parse devolve bytes sobre os quais ninguém provou nada; não existe formato de onde inferir em tempo de compilação. Autocomplete chega só depois que você estreita, ou depois que o schema da próxima lição faz o parse para você."  # @src=cbfb656e8575
              a:
                # | Nothing meaningful, unknown is an alias for any that style guides
                # | prefer, and both erase to the same JavaScript when compiled
                label: "Nada relevante, unknown é um alias para any que guias de estilo preferem, e os dois apagam para o mesmo JavaScript quando compilados"  # @src=252613fb02f4
                # | They erase the same, but they type-check opposite ways: any lets every
                # | operation through unchecked; unknown lets none through until you narrow.
                feedback: "Os dois apagam igual, mas eles fazem a checagem de tipos de formas opostas: any deixa toda operação passar sem checagem; unknown não deixa nenhuma passar até você estreitar."  # @src=190f41e79ca1
          m02l1-q3:
            # | The lesson's boiled-down v0 record is `{ status: string; latencyMs?: number
            # | }`, the two fields that decide health. `probe.ts` now models that same
            # | outcome as the ProbeResult union. What class of bug did the union delete
            # | outright?
            prompt: "O registro v0 reduzido da lição é `{ status: string; latencyMs?: number }`, os dois campos que decidem a saúde. `probe.ts` agora modela esse mesmo resultado como a união ProbeResult. Que classe de bug a união deletou de vez?"  # @src=0aa00d35b1cb
            # | Make impossible states unrepresentable: each variant carries exactly its own
            # | data, so the incoherent combinations simply have no encoding. Validation you
            # | never have to remember beats validation someone will eventually forget, v0's
            # | polite lie was one forgotten check away, permanently.
            explanation: "Torne estados impossíveis irrepresentáveis: cada variante carrega exatamente os dados dela, então as combinações incoerentes simplesmente não têm codificação. Validação que você nunca precisa lembrar bate validação que alguém vai acabar esquecendo, a mentira educada do v0 estava a uma checagem esquecida de distância, permanentemente."  # @src=5860eadf55d3
            options:                 # source order — keep it
              c:
                # | latencyMs is now always defined on every variant, so consumers can drop
                # | their undefined-checks across the whole codebase
                label: "latencyMs agora está sempre definido em toda variante, então consumidores podem largar as checagens de undefined deles na base de código inteira"  # @src=b27b6e9fd22d
                # | latencyMs exists ONLY on the 'ok' variant, that precision is the point.
                # | Consumers narrow to the arm first, then the field is guaranteed within
                # | it.
                feedback: "latencyMs existe SÓ na variante 'ok', essa precisão é o ponto. Consumidores estreitam para o braço primeiro, e daí o campo é garantido dentro dele."  # @src=4c19f15373ed
              b:
                # | Status-string typos now throw a TypeError the moment the object is
                # | created, instead of propagating silently into status.json
                label: "Typos na string de status agora lançam um TypeError no momento em que o objeto é criado, em vez de propagar silenciosamente para status.json"  # @src=5c59642f4a4e
                # | Nothing throws, the win is at compile time: the typo'd object has no
                # | valid type, so the code that builds it never compiles in the first
                # | place.
                feedback: "Nada lança, a vitória é em tempo de compilação: o objeto com typo não tem tipo válido, então o código que constrói ele nunca compila, para começo de conversa."  # @src=f0f24bd87477
              a:
                # | Incoherent combinations, 'ok' with no latency, a typo'd 'okay', a
                # | latency on a timeout, can no longer be constructed
                label: "Combinações incoerentes, 'ok' sem latência, um 'okay' com typo, uma latência num timeout, não podem mais ser construídas"  # @src=4a1155767e33
                # | Each variant carries exactly its own evidence, so the lies lose their
                # | spelling. They are not caught at some check; there is no longer a way to
                # | write them down in the first place.
                feedback: "Cada variante carrega exatamente a evidência dela, então as mentiras perdem a grafia. Elas não são pegas em alguma checagem; não existe mais um jeito de escrever elas, para começo de conversa."  # @src=e683fb054e59
              d:
                # | Malformed records read back from status.json can no longer enter the
                # | fleet, because they match none of the union's variants
                label: "Registros malformados lidos de volta de status.json não podem mais entrar na frota, porque eles não combinam com nenhuma das variantes da união"  # @src=cdae05bfc9ab
                # | Types are erased, so the union proves things about values your code
                # | constructs and nothing at all about bytes off the disk. Guarding that
                # | border takes a runtime parse, which is why parseProbe returns null.
                feedback: "Tipos são apagados, então a união prova coisas sobre valores que o seu código constrói e nada mesmo sobre bytes vindos do disco. Travar essa fronteira exige um parse em tempo de execução, que é por isso que parseProbe retorna null."  # @src=0a0de0cdf6f4
          m02l1-q4:
            # | The guest frame: plenty of web2 shops still ship happily on plain
            # | JavaScript. Why did typed languages win web3 specifically?
            prompt: "O enquadramento do convidado: um monte de empresa de web2 ainda entrega feliz em JavaScript puro. Por que linguagens tipadas venceram na web3 especificamente?"  # @src=3a62fd0f2ceb
            # | Web2 ships bugs and patches them; web3 frequently cannot, a drained account
            # | does not un-drain. When the cost of a wrong state is unbounded and
            # | irreversible, proofs the compiler can make for free stop being ceremony and
            # | start being the cheapest insurance available. Money code can't shrug.
            explanation: "A web2 entrega bugs e remenda eles; a web3 frequentemente não consegue, uma conta drenada não se desdrena. Quando o custo de um estado errado é ilimitado e irreversível, provas que o compilador consegue fazer de graça deixam de ser cerimônia e viram o seguro mais barato disponível. Código que mexe com dinheiro não pode dar de ombros."  # @src=145b66e9179c
            options:                 # source order — keep it
              d:
                # | Security audits typically refuse to sign off on untyped code that moves
                # | money, so the ecosystem standardised on types early
                label: "Auditorias de segurança tipicamente se recusam a aprovar código sem tipos que move dinheiro, então o ecossistema padronizou tipos cedo"  # @src=e99f18558af7
                # | Audits concentrate on the on-chain program, and no review board made
                # | this call for the ecosystem. The pressure came from the cost of being
                # | wrong once, which is why teams adopted types before anyone required it.
                feedback: "Auditorias se concentram no programa on-chain, e nenhuma banca de revisão tomou essa decisão pelo ecossistema. A pressão veio do custo de errar uma vez, que é por isso que times adotaram tipos antes de alguém exigir."  # @src=8b454d18954a
              b:
                # | A wrong state in money code is an irreversible loss, not a bug ticket,
                # | compile-time proof is cheap insurance against it
                label: "Um estado errado em código que mexe com dinheiro é uma perda irreversível, não um ticket de bug, prova em tempo de compilação é seguro barato contra isso"  # @src=6e5443f97291
                # | Web2 pays for a wrong state with an apology and a Tuesday fix. On a
                # | ledger designed so nobody can un-happen a transfer, the same mistake has
                # | no refund path, and that is what makes a free proof worth its ceremony.
                feedback: "A web2 paga por um estado errado com um pedido de desculpas e uma correção na terça. Num ledger desenhado para que ninguém consiga desacontecer uma transferência, o mesmo erro não tem caminho de reembolso, e é isso que faz uma prova de graça valer a cerimônia dela."  # @src=2cbfcb407ee6
              c:
                # | Typed code compiles to faster JavaScript, and on-chain fee markets
                # | punish slow clients, so the ecosystem converged on TS for performance
                label: "Código tipado compila para um JavaScript mais rápido, e mercados de taxa on-chain punem clientes lentos, então o ecossistema convergiu para TS por performance"  # @src=56a70899bacc
                # | TS types are erased at compile time, the emitted JS is the same speed.
                # | The win is correctness under stakes, not throughput.
                feedback: "Tipos de TS são apagados em tempo de compilação, o JS emitido tem a mesma velocidade. A vitória é corretude sob risco, não vazão."  # @src=521fb543b966
              a:
                # | Blockchain VMs execute compiled bytecode, so dynamically-typed languages
                # | cannot target them and typed toolchains became mandatory
                label: "VMs de blockchain executam bytecode compilado, então linguagens de tipagem dinâmica não conseguem ter elas como alvo e toolchains tipados viraram obrigatórios"  # @src=92b4a2ec2207
                # | Client code, the half you are writing, runs wherever JS runs; no VM
                # | forces types on it. The pressure is economic, not technical.
                feedback: "Código de cliente, a metade que você está escrevendo, roda onde quer que JS rode; nenhuma VM força tipos nele. A pressão é econômica, não técnica."  # @src=4624593290bf
  m02-l2:
    # | Parse, don't validate: zod at the boundary
    title: "Parse, don't validate: zod na fronteira"  # @src=177826463f5a
    blocks:
      check:                      # quiz
        questions:
          m02l2-q1:
            # | After this lesson, where does the FleetConfig TypeScript type come from, and
            # | why there?
            prompt: "Depois desta lição, de onde vem o tipo TypeScript FleetConfig, e por que de lá?"  # @src=a16834126eac
            # | The schema is the type's source: z.infer derives the static type from the
            # | runtime parser, so a field renamed in one place redlines every consumer
            # | immediately. Validation that cannot drift from the type is the whole point
            # | of the pattern.
            explanation: "O schema é a fonte do tipo: z.infer deriva o tipo estático do parser de runtime, então um campo renomeado em um lugar deixa todo consumidor vermelho na hora. Validação que não pode entrar em descompasso com o tipo é o ponto inteiro do padrão."  # @src=8ae9816ec637
            options:                 # source order — keep it
              a:
                # | A hand-written interface kept next to the schema, reviewed together in
                # | PRs so the two definitions cannot quietly diverge
                label: "Uma interface escrita à mão mantida do lado do schema, revisada junto nos PRs para que as duas definições não possam divergir em silêncio"  # @src=d79f1cf22eb2
                # | Two sources of truth drift no matter how good the reviews are, the drift
                # | drill in the lab shows exactly how. One source must derive from the
                # | other.
                feedback: "Duas fontes de verdade entram em descompasso não importa quão boas sejam as revisões, o treino do descompasso no lab mostra exatamente como. Uma fonte tem que derivar da outra."  # @src=91fc0b14adff
              c:
                # | z.infer<typeof configSchema>, the schema is the single source and the
                # | type derives from it, so the two cannot drift
                label: "z.infer<typeof configSchema>, o schema é a fonte única e o tipo deriva dele, então os dois não podem entrar em descompasso"  # @src=667365eb6110
                # | One definition, read two ways: the schema checks the bytes at runtime
                # | and z.infer reads the static type out of that same object. Rename a
                # | field and every consumer redlines on the next build.
                feedback: "Uma definição, lida de dois jeitos: o schema checa os bytes em tempo de execução e z.infer lê o tipo estático de dentro desse mesmo objeto. Renomeie um campo e todo consumidor fica vermelho no próximo build."  # @src=cd66dc710a7e
              d:
                # | You declare the FleetConfig interface first and zod derives the schema
                # | from it, so the two can never diverge
                label: "Você declara a interface FleetConfig primeiro e o zod deriva o schema dela, então os dois nunca podem divergir"  # @src=532d9b742cd9
                # | That direction does not exist, and cannot: types are erased before
                # | anything runs, so there is nothing left for zod to read. The schema is
                # | the value that survives to runtime, which is why it is the source.
                feedback: "Essa direção não existe, e não pode existir: tipos são apagados antes de qualquer coisa rodar, então não sobra nada para o zod ler. O schema é o valor que sobrevive até o runtime, que é por isso que ele é a fonte."  # @src=48efabee6473
              b:
                # | tsc generates it from a sample pulse.config.json at build time, so the
                # | type always mirrors a real config file
                label: "tsc gera ele a partir de um pulse.config.json de exemplo em tempo de build, então o tipo sempre espelha um arquivo de config de verdade"  # @src=549176b8b795
                # | tsc generates no types from data, and a sample file encodes one example,
                # | not the rules (ranges, refinements, cross-field constraints).
                feedback: "tsc não gera tipo nenhum a partir de dados, e um arquivo de exemplo codifica um exemplo, não as regras (faixas, refinamentos, restrições entre campos)."  # @src=aeec93aef483
          m02l2-q2:
            # | The typo'd config that sailed through v0 now hits configSchema.safeParse at
            # | startup. What happens, and why is that the win?
            prompt: "A config com typo que passou batido pelo v0 agora bate em configSchema.safeParse na inicialização. O que acontece, e por que essa é a vitória?"  # @src=f22e079bdeda
            # | A parser refuses at the door: safeParse returns a result you must inspect,
            # | the boundary prints a field-level error tree, and the process exits before a
            # | hot-loop bug can exist. Compare the hook, v0 ran green on the same file. The
            # | failure didn't move; it became LOUD and EARLY.
            explanation: "Um parser recusa na porta: safeParse retorna um resultado que você tem que inspecionar, a fronteira imprime uma árvore de erros no nível do campo, e o processo sai antes que um bug de loop quente possa existir. Compare com a abertura, o v0 rodou verde no mesmo arquivo. A falha não se moveu; ela ficou BARULHENTA e PRECOCE."  # @src=698745ca8aea
            options:                 # source order — keep it
              d:
                # | safeParse returns { success: false } and the fleet falls back to
                # | defaultConfig, so the cron stays green
                label: "safeParse retorna { success: false } e a frota cai de volta para defaultConfig, então o cron continua verde"  # @src=80bc0d389b0e
                # | A silent fallback is the polite lie wearing a schema: the cron goes
                # | green while probing something nobody asked for. parseOrExit exits 1
                # | precisely so the operator sees red and fixes the file.
                feedback: "Um fallback silencioso é a mentira educada vestindo um schema: o cron fica verde enquanto sonda algo que ninguém pediu. parseOrExit sai com 1 precisamente para que o operador veja vermelho e conserte o arquivo."  # @src=c13b1e1cdcc7
              a:
                # | safeParse returns { success: false } naming the field; the CLI prints it
                # | and exits nonzero, garbage never enters the fleet
                label: "safeParse retorna { success: false } nomeando o campo; a CLI imprime isso e sai com código diferente de zero, lixo nunca entra na frota"  # @src=a4abc5e4df47
                # | The failure stopped existing at runtime and became a startup refusal,
                # | with the broken field named twice: once as the unrecognized key you
                # | wrote and once as the required key you starved.
                feedback: "A falha deixou de existir em tempo de execução e virou uma recusa na inicialização, com o campo quebrado nomeado duas vezes: uma como a chave não reconhecida que você escreveu e uma como a chave obrigatória que você deixou faminta."  # @src=399271b64eb1
              c:
                # | safeParse repairs the config by filling the missing field from the
                # | schema's declared default, then logs a warning and continues probing
                label: "safeParse conserta a config preenchendo o campo ausente a partir do default declarado do schema, depois loga um aviso e continua sondando"  # @src=e3adbf0e7400
                # | Defaults only apply where the schema explicitly declares them, an
                # | unrecognized or missing required field is a refusal, not a silent
                # | repair.
                feedback: "Defaults só se aplicam onde o schema os declara explicitamente, um campo obrigatório não reconhecido ou ausente é uma recusa, não um conserto silencioso."  # @src=cf950b63d61d
              b:
                # | safeParse throws a ZodError from deep inside the probe loop the first
                # | time the missing field is actually read by running code
                label: "safeParse lança um ZodError lá de dentro do loop de sondagem na primeira vez que o campo ausente é de fato lido por código rodando"  # @src=9251e7ae069a
                # | Two misses: safeParse never throws (that is parse), and the check runs
                # | at the BOUNDARY at startup, nothing waits for the probe loop.
                feedback: "Dois erros: safeParse nunca lança (isso é o parse), e a checagem roda na FRONTEIRA na inicialização, nada espera pelo loop de sondagem."  # @src=7972e0254eb6
          m02l2-q3:
            # | You type the default config literal with `satisfies FleetConfig` instead of
            # | the annotation `: FleetConfig`. What did you keep that the annotation would
            # | have cost you?
            prompt: "Você tipa o literal de config default com `satisfies FleetConfig` em vez da anotação `: FleetConfig`. O que você manteve que a anotação teria te custado?"  # @src=a89524894b87
            # | satisfies is check-without-widening: the compiler verifies the literal
            # | conforms to FleetConfig, but the value keeps its precise inferred types.
            # | With the annotation, every field widens to the declared type and the
            # | compiler forgets what you wrote, the worst of both when you wanted precision
            # | AND the check.
            explanation: "satisfies é checagem sem alargamento: o compilador verifica que o literal está de acordo com FleetConfig, mas o valor mantém os tipos inferidos precisos dele. Com a anotação, todo campo alarga para o tipo declarado e o compilador esquece o que você escreveu, o pior dos dois quando você queria precisão E a checagem."  # @src=fa432e342171
            options:                 # source order — keep it
              c:
                # | Nothing, satisfies and the annotation compile identically; satisfies is
                # | newer syntax for the same widening behavior
                label: "Nada, satisfies e a anotação compilam de forma idêntica; satisfies é sintaxe mais nova para o mesmo comportamento de alargamento"  # @src=0b9ea194e52e
                # | They differ exactly on widening: the annotation makes the literal BE the
                # | broad type; satisfies checks against it while preserving what you
                # | actually wrote.
                feedback: "Eles diferem exatamente no alargamento: a anotação faz o literal SER o tipo largo; satisfies checa contra ele preservando o que você de fato escreveu."  # @src=83acbcd711ef
              d:
                # | Freedom to leave fields out, satisfies checks the literal you wrote
                # | while the annotation demands every field
                label: "Liberdade de deixar campos de fora, satisfies checa o literal que você escreveu enquanto a anotação exige todo campo"  # @src=8ea79e507d4d
                # | Shape checking is identical under both: a missing or typo'd key fails
                # | either way. The only thing satisfies declines to do is overwrite your
                # | literal's own inferred type with the broader one.
                feedback: "A checagem de formato é idêntica nos dois: uma chave ausente ou com typo falha de qualquer jeito. A única coisa que satisfies se recusa a fazer é sobrescrever o tipo inferido do próprio literal pelo mais largo."  # @src=bb0b08c9158a
              b:
                # | Each field's narrow literal type, the object is still shape-checked, but
                # | what you wrote doesn't widen to string
                label: "O tipo literal estreito de cada campo, o objeto continua checado no formato, mas o que você escreveu não alarga para string"  # @src=b159e2c1a02a
                # | Check without widening: the literal is verified against FleetConfig
                # | exactly as the annotation would, and fleetName stays "pulse-dev" instead
                # | of collapsing to string, so downstream code can branch on the value.
                feedback: "Checagem sem alargamento: o literal é verificado contra FleetConfig exatamente como a anotação faria, e fleetName continua \"pulse-dev\" em vez de desabar para string, então código a jusante pode ramificar no valor."  # @src=61583126e952
              a:
                # | Runtime validation of the literal, satisfies runs the schema's
                # | refinements against the object when the module first loads
                label: "Validação em tempo de execução do literal, satisfies roda os refinamentos do schema contra o objeto quando o módulo carrega pela primeira vez"  # @src=ded13aad474e
                # | satisfies is purely compile-time; it never runs anything. Runtime
                # | checking is the schema's job at the boundary.
                feedback: "satisfies é puramente em tempo de compilação; ele nunca roda nada. Checagem em tempo de execução é trabalho do schema na fronteira."  # @src=3b300480943f
          m02l2-q4:
            # | Your getBalance schema surfaces the lamports value as bigint rather than
            # | number. A teammate calls it overkill for a balance check. What is the honest
            # | justification?
            prompt: "O seu schema de getBalance traz o valor em lamports à tona como bigint em vez de number. Um colega de time chama isso de exagero para uma checagem de saldo. Qual é a justificativa honesta?"  # @src=31a58564eea2
            # | u64 goes far past 2^53, and doubles round silently beyond it, a balance that
            # | is wrong by a few lamports with no error anywhere is the politest lie in
            # | this course so far. Surface bigint at the schema and keep it bigint through
            # | the code. What a lamport IS, and everything else about accounts, is the
            # | Bitcoin-to-Solana evolution course's territory.
            explanation: "u64 vai muito além de 2^53, e doubles arredondam em silêncio depois disso, um saldo errado por alguns lamports sem erro nenhum em lugar nenhum é a mentira mais educada deste curso até aqui. Traga bigint à tona no schema e mantenha bigint pelo código inteiro. O que um lamport É, e todo o resto sobre contas, é território do curso de evolução do Bitcoin à Solana."  # @src=fe8998185193
            options:                 # source order — keep it
              b:
                # | The RPC returns the balance as a quoted string, and comparing strings
                # | numerically fails, so bigint conversion is required for the math to work
                # | at all
                label: "O RPC retorna o saldo como uma string entre aspas, e comparar strings numericamente falha, então a conversão para bigint é obrigatória para a conta funcionar minimamente"  # @src=7227c418b0d5
                # | getBalance returns a JSON number, not a string, the code would 'work' as
                # | a number, which is what makes the precision loss so quiet.
                feedback: "getBalance retorna um número JSON, não uma string, o código 'funcionaria' como number, que é o que torna a perda de precisão tão silenciosa."  # @src=35055d20be89
              a:
                # | JSON.parse already produces bigint for large integers, so the schema is
                # | just preserving what the parser gives it anyway
                label: "JSON.parse já produz bigint para inteiros grandes, então o schema só está preservando o que o parser entrega a ele de qualquer forma"  # @src=b8850a493f2a
                # | JSON.parse produces doubles for every number, that is precisely the
                # | problem. Large u64 values arrive already at risk; the schema routes
                # | around it.
                feedback: "JSON.parse produz doubles para todo número, esse é precisamente o problema. Valores u64 grandes já chegam em risco; o schema contorna isso."  # @src=fa123c2369ce
              d:
                # | z.bigint() converts the parsed number into a bigint for you, so the
                # | balance value comes out exact as soon as the schema has run
                label: "z.bigint() converte o número parseado em um bigint para você, então o valor do saldo sai exato assim que o schema tiver rodado"  # @src=0f3b5a8042e7
                # | By the time a schema sees the value the damage is done: JSON.parse
                # | already turned the digits into a double. That is why the reviver
                # | rebuilds the number from ctx.source, and z.bigint() only proves it
                # | happened.
                feedback: "Quando um schema vê o valor o dano já está feito: JSON.parse já transformou os dígitos em um double. É por isso que o reviver reconstrói o número a partir de ctx.source, e z.bigint() só prova que isso aconteceu."  # @src=7b81e55bc497
              c:
                # | Lamport balances are u64 and can exceed Number.MAX_SAFE_INTEGER, a JS
                # | number rounds silently up there, while bigint keeps every lamport exact
                label: "Saldos de lamport são u64 e podem exceder Number.MAX_SAFE_INTEGER, um number de JS arredonda em silêncio lá em cima, enquanto bigint mantém cada lamport exato"  # @src=d34229820b51
                # | u64 tops out at 18446744073709551615 and a double is exact only to
                # | 9007199254740991. Past that the rounding happens with no error and no
                # | warning, which is the politest lie in the lesson.
                feedback: "u64 chega ao teto em 18446744073709551615 e um double é exato só até 9007199254740991. Depois disso o arredondamento acontece sem erro e sem aviso, que é a mentira mais educada da lição."  # @src=3d2dea4f952a
  m02-l3:
    # | Async that survives contact: limits, backoff, cancellation
    title: "Async que sobrevive ao contato: limites, backoff, cancelamento"  # @src=c60217a88321
    blocks:
      backoff-schedule:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Attempt 0 must wait exactly baseMs, the exponent is the attempt number itself,
          # | not attempt + 1.
          0: "A tentativa 0 tem que esperar exatamente baseMs, o expoente é o próprio número da tentativa, não attempt + 1."  # @src=b72cf00ae4b5
          # | Apply the cap per delay: Math.min(capMs, baseMs * 2 ** attempt).
          1: "Aplique o teto por delay: Math.min(capMs, baseMs * 2 ** attempt)."  # @src=e56596db3f9d
          # | Edge cases the tests check: retries = 0 returns the empty string, and a cap
          # | BELOW base clamps every delay to the cap.
          2: "Casos de borda que os testes checam: retries = 0 retorna a string vazia, e um teto ABAIXO da base prende todo delay no teto."  # @src=a5cb000818e1
        tests:                      # keyed by test case id
          t1:
            # | doubles from base, fifth attempt hits the cap
            description: "dobra a partir da base, a quinta tentativa bate no teto"  # @src=eac6caa50a50
          t2:
            # | attempt 0 waits exactly baseMs
            description: "a tentativa 0 espera exatamente baseMs"  # @src=cbc4e355a2f9
          t3:
            # | cap holds every attempt after it is reached
            description: "o teto segura toda tentativa depois de ser alcançado"  # @src=5fe7e6109c3c
          t4:
            # | zero retries means an empty schedule
            description: "zero retries significa um cronograma vazio"  # @src=7477bec0ac63
          t5:
            # | pure powers of two under a matching cap
            description: "potências puras de dois sob um teto compatível"  # @src=a2653c7bfe5c
          t6:
            # | a cap below base clamps every delay
            description: "um teto abaixo da base prende todo delay"  # @src=9679ecf82eb5
      check:                      # quiz
        questions:
          m02l3-q1:
            # | The hook's naive `Promise.all(targets.map(probe))` produced a wall of 429s
            # | from the rate-limited endpoint. What caused the wall?
            prompt: "O `Promise.all(targets.map(probe))` ingênuo do gancho produziu uma parede de 429s vindos do endpoint com limite de taxa. O que causou a parede?"  # @src=cb81b63d1316
            # | Promise.all is a join, not a scheduler: by the time you call it, every
            # | promise you mapped has already started. Fifty probes in one tick is a burst
            # | the target experiences as an attack. Concurrency is a budget you spend, the
            # | pool is how you meter it out.
            explanation: "Promise.all é um join, não um escalonador: quando você chama ele, toda promise que você mapeou já começou. Cinquenta sondas em um tick é uma rajada que o alvo vive como um ataque. Concorrência é um orçamento que você gasta, o pool é como você distribui ele aos poucos."  # @src=fc26f871eecf
            options:                 # source order — keep it
              b:
                # | Promise.all runs the probes strictly one after another, so the total run
                # | took longer than the endpoint's request window allowed
                label: "Promise.all roda as sondas estritamente uma depois da outra, então a execução total demorou mais do que a janela de requisições do endpoint permitia"  # @src=fa38441b55b3
                # | Backwards, Promise.all is concurrent, not sequential. The probes did not
                # | queue; they stampeded, which is precisely the problem.
                feedback: "Ao contrário, Promise.all é concorrente, não sequencial. As sondas não entraram em fila; elas debandaram, que é precisamente o problema."  # @src=680dfc796ff4
              c:
                # | Node's fetch reuses one connection per host, and the endpoint counts
                # | each request on a shared connection against a stricter per-socket cap
                label: "O fetch do Node reusa uma conexão por host, e o endpoint conta cada requisição numa conexão compartilhada contra um teto por socket mais rígido"  # @src=56e9d6ccb744
                # | Connection reuse is not the mechanism, the limit was requests per window
                # | per IP, and fifty requests in one instant exhausts it regardless of
                # | sockets.
                feedback: "Reúso de conexão não é o mecanismo, o limite era requisições por janela por IP, e cinquenta requisições num instante esgotam ele independentemente de sockets."  # @src=5fc871ccacbf
              a:
                # | Every fetch started in the same instant, all fifty requests hit the
                # | target as one burst, spending the whole rate budget at once
                label: "Todo fetch começou no mesmo instante, as cinquenta requisições bateram no alvo como uma rajada só, gastando o orçamento de taxa inteiro de uma vez"  # @src=dab40dc917e3
                # | The stampede happened at .map: fifty fetches were already in flight
                # | before Promise.all ever saw the array. The join only waited. Concurrency
                # | is a budget you spend, and that spent all of it in one tick.
                feedback: "A debandada aconteceu no .map: cinquenta fetches já estavam em voo antes de Promise.all sequer ver o array. O join só esperou. Concorrência é um orçamento que você gasta, e aquilo gastou tudo num tick só."  # @src=a73ed26b059c
              d:
                # | Fifty targets simply exceed a cap of 25 requests per second, so a fleet
                # | of that size collects 429s at whatever pace you set it to
                label: "Cinquenta alvos simplesmente excedem um teto de 25 requisições por segundo, então uma frota desse tamanho coleta 429s em qualquer ritmo que você configurar"  # @src=832c3b29e16f
                # | The pooled run disproves it: same fifty targets, same server, same cap,
                # | zero 429s once five workers bound the in-flight count. Fleet size never
                # | touched the wall; the burst shape did.
                feedback: "A execução com pool desmente isso: os mesmos cinquenta alvos, o mesmo servidor, o mesmo teto, zero 429s assim que cinco workers limitaram a contagem em voo. O tamanho da frota nunca encostou na parede; a forma da rajada encostou."  # @src=8eae1d85da14
          m02l3-q2:
            # | You replace the burst with a hand-rolled pool of 5 workers over a shared
            # | queue. What changed, precisely?
            prompt: "Você troca a rajada por um pool feito na mão com 5 workers sobre uma fila compartilhada. O que mudou, precisamente?"  # @src=d914900ff0bd
            # | A pool is a meter, not an engine: N workers pull from one queue, so
            # | in-flight work never exceeds N. Same fifty probes, same event loop, but the
            # | target now sees a steady trickle it can serve instead of a spike it must
            # | reject. N is tuned against the TARGET'S budget, not your machine.
            explanation: "Um pool é um medidor, não um motor: N workers puxam de uma fila, então o trabalho em voo nunca passa de N. As mesmas cinquenta sondas, o mesmo event loop, mas o alvo agora vê um fio d'água constante que ele consegue servir em vez de um pico que ele tem que rejeitar. N é ajustado contra o orçamento do ALVO, não contra a sua máquina."  # @src=c7cbc336fef1
            options:                 # source order — keep it
              c:
                # | The probes now run in true parallel on five separate threads, so the
                # | fleet finishes faster while sending the same requests
                label: "As sondas agora rodam em paralelismo de verdade em cinco threads separadas, então a frota termina mais rápido enviando as mesmas requisições"  # @src=9e5fcfce6e18
                # | No threads involved, it is still one event loop with concurrent I/O. The
                # | pool bounds in-flight count; it neither parallelizes CPU nor speeds
                # | anything up.
                feedback: "Nenhuma thread envolvida, continua sendo um event loop só com I/O concorrente. O pool limita a contagem em voo; ele não paraleliza CPU nem acelera coisa nenhuma."  # @src=207c282279af
              d:
                # | Each of the five workers owns a fixed tenth of the queue up front, so
                # | one slow target stalls that whole share
                label: "Cada um dos cinco workers é dono de um décimo fixo da fila de antemão, então um alvo lento empaca aquela parte inteira"  # @src=6bc7627893c2
                # | Nothing is sliced up front. There is one shared index and each worker
                # | grabs whatever is next, so a slow target costs one worker one turn while
                # | the other four keep draining the same queue.
                feedback: "Nada é fatiado de antemão. Existe um índice compartilhado e cada worker pega o que vier a seguir, então um alvo lento custa um turno de um worker enquanto os outros quatro seguem escoando a mesma fila."  # @src=7138654063c4
              a:
                # | Failed probes are now retried automatically by the pool, since each
                # | worker re-queues its target whenever a request errors
                label: "Sondas que falharam agora são tentadas de novo automaticamente pelo pool, já que cada worker recoloca seu alvo na fila sempre que uma requisição dá erro"  # @src=69daa49ee7f2
                # | Retry is a separate discipline (backoff, next section), the pool only
                # | bounds how many probes run at once; it has no opinion on failures.
                feedback: "Retry é uma disciplina separada (backoff, próxima seção), o pool só limita quantas sondas rodam ao mesmo tempo; ele não tem opinião sobre falhas."  # @src=5c4b9c8c1362
              b:
                # | At most five probes are in flight at once; the rest wait in the queue,
                # | same total work, but the burst rate is bounded
                label: "No máximo cinco sondas ficam em voo ao mesmo tempo; o resto espera na fila, o mesmo trabalho total, mas a taxa de rajada fica limitada"  # @src=e99220a8b9e2
                # | The pool is a meter, not an engine. Nothing got faster and nothing got
                # | skipped; the only change is that the number of simultaneous requests is
                # | now one you chose against the target's published budget.
                feedback: "O pool é um medidor, não um motor. Nada ficou mais rápido e nada foi pulado; a única mudança é que o número de requisições simultâneas agora é um que você escolheu contra o orçamento publicado do alvo."  # @src=31bfe4d7df4f
          m02l3-q3:
            # | Your backoff doubles the delay per attempt and caps it, and then you add
            # | random jitter on top. What failure mode does the jitter specifically
            # | prevent?
            prompt: "Seu backoff dobra o delay por tentativa e aplica um teto, e aí você adiciona jitter aleatório por cima. Qual modo de falha o jitter previne especificamente?"  # @src=ce1226c72ab3
            # | The limit hit all fifty probes in the same window, so pure exponential
            # | backoff has them ALL return at the same future instant, a stampede that
            # | re-triggers the limit, forever. Jitter smears the retries across the window
            # | so the herd thins out. It is a coordination fix, not a speed fix.
            explanation: "O limite atingiu todas as cinquenta sondas na mesma janela, então o backoff exponencial puro faz TODAS elas voltarem no mesmo instante futuro, uma debandada que re-dispara o limite, para sempre. O jitter borra os retries pela janela para a manada rarear. É uma correção de coordenação, não de velocidade."  # @src=dbb7bb6a0f3f
            options:                 # source order — keep it
              b:
                # | Rate-limited endpoints reject retries that arrive at predictable
                # | intervals, so randomized delays are required for the requests to be
                # | accepted
                label: "Endpoints com limite de taxa rejeitam retries que chegam em intervalos previsíveis, então delays aleatorizados são obrigatórios para as requisições serem aceitas"  # @src=21e8eb753885
                # | Servers don't inspect your schedule's predictability, they count
                # | requests per window. The problem jitter solves is on YOUR side:
                # | synchronized clients.
                feedback: "Servidores não inspecionam a previsibilidade do seu cronograma, eles contam requisições por janela. O problema que o jitter resolve é do SEU lado: clientes sincronizados."  # @src=f0f744b188cc
              d:
                # | Workers waking together would push more than five probes in flight at
                # | once, and the jitter is what holds the pool to its size
                label: "Workers acordando juntos empurrariam mais de cinco sondas em voo ao mesmo tempo, e o jitter é o que segura o pool no tamanho dele"  # @src=422ae1933f42
                # | The pool holds itself: a worker cannot start a second probe until its
                # | own returns, whatever time it wakes. Jitter changes when retries land,
                # | never how many run at once.
                feedback: "O pool se segura sozinho: um worker não consegue começar uma segunda sonda enquanto a dele não voltar, não importa a hora em que ele acorde. O jitter muda quando os retries caem, nunca quantos rodam ao mesmo tempo."  # @src=9f84f070bb11
              c:
                # | Probes that got 429'd together retry together, each wave re-triggers the
                # | same limit, and the stampede never drains without jitter
                label: "Sondas que tomaram 429 juntas tentam de novo juntas, cada onda re-dispara o mesmo limite, e a debandada nunca escoa sem jitter"  # @src=07ee0043546e
                # | Synchronized failures retry synchronized: the same cap refuses five
                # | probes at once, all five compute the same delay, all five wake in the
                # | same instant, and the herd re-triggers the limit that made it.
                feedback: "Falhas sincronizadas tentam de novo sincronizadas: o mesmo teto recusa cinco sondas de uma vez, as cinco calculam o mesmo delay, as cinco acordam no mesmo instante, e a manada re-dispara o limite que a criou."  # @src=59c5946aa1d1
              a:
                # | Jitter lowers the average wait across attempts, recovering most of the
                # | latency that the exponential doubling schedule costs you
                label: "O jitter abaixa a espera média ao longo das tentativas, recuperando a maior parte da latência que o cronograma de duplicação exponencial te custa"  # @src=edd158596455
                # | Jitter does not exist to make retries faster, spread around the base
                # | delay, the average wait is roughly unchanged. Its job is
                # | desynchronization.
                feedback: "O jitter não existe para deixar os retries mais rápidos, espalhada em volta do delay base, a espera média fica praticamente igual. O trabalho dele é dessincronização."  # @src=cce5cd6725ed
          m02l3-q4:
            # | A probe's AbortController fires at the 3-second timeout. What does the abort
            # | actually accomplish?
            prompt: "O AbortController de uma sonda dispara no timeout de 3 segundos. O que o abort de fato realiza?"  # @src=3bb10edaf9aa
            # | AbortController is how a timeout becomes a first-class outcome: the signal
            # | rejects the fetch, the pool slot frees for the next target, and the failure
            # | lands in the same typed union every other result uses, aggregated, not
            # | thrown. The remote side may finish anyway; what you bought is bounded
            # | waiting and a clean report.
            explanation: "AbortController é como um timeout vira um desfecho de primeira classe: o signal rejeita o fetch, o slot do pool libera para o próximo alvo, e a falha cai na mesma união tipada que todo outro resultado usa, agregada, não lançada. O lado remoto pode terminar mesmo assim; o que você comprou foi espera limitada e um relatório limpo."  # @src=0b3200b15c1d
            options:                 # source order — keep it
              d:
                # | The fetch resolves with a status 0 response at the timeout, which the
                # | probe checks for instead of catching a rejection
                label: "O fetch resolve com uma resposta de status 0 no timeout, que a sonda checa em vez de capturar uma rejeição"  # @src=1a476263a709
                # | An abort rejects the promise, it does not hand back a response to
                # | inspect. That is why probeOnce wraps the await in try/catch and asks
                # | controller.signal.aborted which kind of failure it just caught.
                feedback: "Um abort rejeita a promise, ele não devolve uma resposta para inspecionar. É por isso que probeOnce embrulha o await num try/catch e pergunta a controller.signal.aborted que tipo de falha ele acabou de capturar."  # @src=5afc10cd4c00
              c:
                # | It marks the target as permanently down in the fleet's state, so future
                # | rounds skip probing it until the config is edited
                label: "Ele marca o alvo como permanentemente fora do ar no estado da frota, então rodadas futuras deixam de sondar ele até a config ser editada"  # @src=ce0029299206
                # | One timeout is one data point, not a verdict, the probe returns a
                # | timeout variant and the target stays in rotation. Trend decisions belong
                # | to the classifier.
                feedback: "Um timeout é um ponto de dado, não um veredito, a sonda retorna uma variante timeout e o alvo continua na rotação. Decisões de tendência pertencem ao classificador."  # @src=c02b1bdd0eca
              a:
                # | It rejects the in-flight fetch on your side, freeing the pool slot, the
                # | outcome lands as a typed timeout variant
                label: "Ele rejeita o fetch em voo do seu lado, liberando o slot do pool, e o desfecho cai como uma variante timeout tipada"  # @src=d839872538b7
                # | The catch sees signal.aborted, returns the timeout variant carrying the
                # | budget it blew, and the worker takes the next target. Reclaiming the
                # | slot, and getting a row you can report, is the whole win.
                feedback: "O catch vê signal.aborted, retorna a variante timeout carregando o orçamento que ela estourou, e o worker pega o próximo alvo. Recuperar o slot, e ganhar uma linha que você consegue reportar, é a vitória inteira."  # @src=dde93768670b
              b:
                # | It instructs the remote server to stop processing the request, so no
                # | further work happens on either side of the connection
                label: "Ele instrui o servidor remoto a parar de processar a requisição, então nenhum trabalho a mais acontece de nenhum dos lados da conexão"  # @src=6795b7dce1d9
                # | Cancellation is local and cooperative, the request you already sent may
                # | still complete server-side. What you reclaim is your own slot and your
                # | own certainty.
                feedback: "Cancelamento é local e cooperativo, a requisição que você já mandou pode terminar do lado do servidor mesmo assim. O que você recupera é o seu próprio slot e a sua própria certeza."  # @src=2714329e6300
  m02-l4:
    # | Tests are probes for your code: vitest
    title: "Testes são sondas para o seu código: vitest"  # @src=dd7e6e4b04c6
    blocks:
      check:                      # quiz
        questions:
          m02l4-q1:
            # | You wired `vitest run` as a job the cron's probe step `needs:`. Why must the
            # | TESTS gate the CRON, specifically, rather than just running on pushes?
            prompt: "Você ligou o `vitest run` como um job que o step do probe do cron `needs:`. Por que os TESTES têm que travar o CRON, especificamente, em vez de só rodar em pushes?"  # @src=538459a31f87
            # | Scheduled workflows run the latest commit on the default branch, so a bad
            # | merge doesn't fail once, it publishes a lie on schedule, indefinitely, while
            # | looking green. The needs: edge makes the pipeline refuse: no green suite, no
            # | probe, no status.json. That is gate #2 on the one pipeline this course grows
            # | to the capstone.
            explanation: "Workflows agendados rodam no último commit da branch padrão, então um merge ruim não falha uma vez, ele publica uma mentira no agendamento, indefinidamente, e parecendo verde. A aresta do needs: faz o pipeline recusar: sem suíte verde, sem probe, sem status.json. Esse é o gate #2 no único pipeline que este curso faz crescer até o capstone."  # @src=35eb23defb02
            options:                 # source order — keep it
              c:
                # | Running the tests first warms the runner's dependency cache, so the
                # | probe step starts faster and stays inside the job's time budget
                label: "Rodar os testes primeiro aquece o cache de dependências do runner, então o step do probe começa mais rápido e fica dentro do orçamento de tempo do job"  # @src=7871badb0583
                # | Cache warmth is incidental, the gate is about correctness of what gets
                # | PUBLISHED, not about speed of the publisher.
                feedback: "O aquecimento do cache é incidental, a trava é sobre a correção do que é PUBLICADO, não sobre a velocidade de quem publica."  # @src=9d83266cf29b
              d:
                # | The push-triggered suite already proves what lands on main, so a
                # | scheduled run usually inherits that proof and the edge is ceremony
                label: "A suíte disparada por push já prova o que cai na main, então uma execução agendada normalmente herda essa prova e a aresta é cerimônia"  # @src=4258f6e0a66c
                # | A suite that goes red on a push stops nothing by itself. Without the
                # | needs edge the test job runs beside the probe, so the same run can
                # | commit a fresh status.json while the tests fail next to it.
                feedback: "Uma suíte que fica vermelha em um push não para nada sozinha. Sem a aresta do needs, o job de test roda ao lado do probe, então a mesma execução pode fazer commit de um status.json novo enquanto os testes falham do lado."  # @src=63cf1d39c4e9
              b:
                # | The cron publishes from the default branch on a schedule, ungated, a
                # | broken classifier ships a wrong status.json every thirty minutes
                label: "O cron publica a partir da branch padrão em um agendamento, sem trava, um classificador quebrado entrega um status.json errado a cada trinta minutos"  # @src=4d4a94ece151
                # | A scheduled run takes the latest commit on the default branch and
                # | publishes whatever it produces, with nobody watching. Stalled beats
                # | lying, and the needs edge is what buys the stall.
                feedback: "Uma execução agendada pega o último commit da branch padrão e publica o que quer que ela produza, sem ninguém olhando. Parado é melhor que mentiroso, e a aresta do needs é o que compra a parada."  # @src=6742f0722eeb
              a:
                # | Scheduled workflows refuse to start when any other workflow in the repo
                # | is failing, so a red test job would block the cron automatically anyway
                label: "Workflows agendados se recusam a iniciar quando qualquer outro workflow do repo está falhando, então um job de test vermelho bloquearia o cron automaticamente de qualquer jeito"  # @src=3f656a249a60
                # | No such coupling exists, an independent red workflow blocks nothing. The
                # | gate only exists because YOU wrote the needs: edge into the cron's own
                # | workflow.
                feedback: "Esse acoplamento não existe, um workflow vermelho independente não bloqueia nada. A trava só existe porque VOCÊ escreveu a aresta do needs: dentro do próprio workflow do cron."  # @src=ef759cb5697b
          m02l4-q2:
            # | Testing the 5-attempt backoff schedule with real timers takes about fifteen
            # | seconds of wall clock. With vi.useFakeTimers, what changes?
            prompt: "Testar o cronograma de backoff de 5 tentativas com timers reais leva uns quinze segundos de relógio de parede. Com vi.useFakeTimers, o que muda?"  # @src=233cbf329bef
            # | Fake timers replace waiting with control: the test advances the clock to
            # | each scheduled instant and asserts what fired. The schedule's exact values
            # | stay pinned, which is the point, because the m02-l3 formula IS a contract,
            # | and the suite runs in milliseconds, which keeps it in the cron's gate
            # | without stretching the pipeline.
            explanation: "Fake timers trocam espera por controle: o teste avança o relógio até cada instante agendado e afirma o que disparou. Os valores exatos do cronograma continuam fixados, que é o ponto, porque a fórmula de m02-l3 É um contrato, e a suíte roda em milissegundos, o que a mantém dentro da trava do cron sem esticar o pipeline."  # @src=874a2466ab49
            options:                 # source order — keep it
              d:
                # | The suite trades precision for speed, so you assert that roughly five
                # | waits happened instead of pinning each delay's exact value
                label: "A suíte troca precisão por velocidade, então você afirma que mais ou menos cinco esperas aconteceram em vez de fixar o valor exato de cada delay"  # @src=f583b2e57fa0
                # | Precision is what the fake clock buys, not what it costs. Landing on 499
                # | and then 500 is the whole exercise, and a roughly-five-waits assertion
                # | is what you would settle for against a real clock.
                feedback: "Precisão é o que o relógio falso compra, não o que ele custa. Cair em 499 e depois em 500 é o exercício inteiro, e uma asserção de mais-ou-menos-cinco-esperas é com o que você se contentaria contra um relógio real."  # @src=c2f3c5edc752
              a:
                # | The fake clock shrinks every delay to one millisecond, so the schedule
                # | runs the same code path just fast enough to assert on
                label: "O relógio falso encolhe todo delay para um milissegundo, então o cronograma roda o mesmo caminho de código, só que rápido o bastante para você afirmar em cima dele"  # @src=11954756a0da
                # | Delays aren't shrunk, they're not WAITED. The scheduled times keep their
                # | exact values; you jump the clock to them, which is why the assertions
                # | stay exact.
                feedback: "Os delays não são encolhidos, eles não são ESPERADOS. Os horários agendados mantêm seus valores exatos; você pula o relógio até eles, que é por isso que as asserções continuam exatas."  # @src=0ede49335141
              b:
                # | Fake timers only intercept setInterval, so the backoff's promise-based
                # | delays still wait in real time and the suite stays slow
                label: "Fake timers só interceptam setInterval, então os delays baseados em promise do backoff ainda esperam em tempo real e a suíte continua lenta"  # @src=4b4bdf3130b8
                # | vi.useFakeTimers intercepts the timer functions your delays sit on,
                # | advance the clock and the pending timers fire; the pattern is exactly
                # | built for this test.
                feedback: "vi.useFakeTimers intercepta as funções de timer sobre as quais os seus delays se apoiam, avance o relógio e os timers pendentes disparam; o padrão foi feito exatamente para este teste."  # @src=3a522bfbd577
              c:
                # | You advance the clock synchronously past each delay, the exact
                # | 500/1000/2000ms schedule asserts in milliseconds of real time
                label: "Você avança o relógio sincronamente para além de cada delay, o cronograma exato de 500/1000/2000ms é afirmado em milissegundos de tempo real"  # @src=a0f28ee6b45c
                # | The delays are not shortened, they are simply not waited on. Each
                # | scheduled instant keeps its exact value and you jump the clock onto it,
                # | which is what lets the test pin 500 and 1000 by name.
                feedback: "Os delays não são encurtados, eles simplesmente não são esperados. Cada instante agendado mantém seu valor exato e você pula o relógio em cima dele, que é o que deixa o teste fixar 500 e 1000 pelo nome."  # @src=12ddf080041a
          m02l4-q3:
            # | Coverage reports 100% on the classifier, and a teammate declares it fully
            # | tested. The lesson's 'signal, not idol' framing says what?
            prompt: "A cobertura reporta 100% no classificador, e um colega de time declara que ele está totalmente testado. O enquadramento 'sinal, não ídolo' da lição diz o quê?"  # @src=2d9222e7ab4e
            # | Coverage answers 'what never ran?', a genuinely useful signal, because an
            # | untested branch is a probe target nobody is watching. It cannot answer
            # | 'would a bug be caught?', because it counts execution, not assertion
            # | quality. Read the uncovered branches, fix the ones that matter, and never
            # | turn the number into the goal.
            explanation: "A cobertura responde 'o que nunca rodou?', um sinal genuinamente útil, porque uma branch não testada é um alvo de sonda que ninguém está observando. Ela não consegue responder 'um bug seria pego?', porque ela conta execução, não qualidade de asserção. Leia as branches não cobertas, corrija as que importam, e nunca transforme o número na meta."  # @src=6b33d3eac3ba
            options:                 # source order — keep it
              d:
                # | Coverage is noise either way, the honest read is to stop reporting it
                # | and judge the suite in review instead
                label: "Cobertura é ruído de todo jeito, a leitura honesta é parar de reportá-la e julgar a suíte no review"  # @src=150d275666a0
                # | Half the framing gets lost that way. An uncovered branch is a target
                # | with no probe pointed at it, which is worth reading every time; what the
                # | warning rejects is treating the percentage as the goal.
                feedback: "Metade do enquadramento se perde assim. Uma branch não coberta é um alvo sem nenhuma sonda apontada para ele, o que vale ler toda vez; o que o aviso rejeita é tratar a porcentagem como a meta."  # @src=cbecf6d45dec
              b:
                # | 100% line coverage is unreachable in code using assertNever, so the
                # | report itself indicates the tooling was configured wrong
                label: "100% de cobertura de linhas é inalcançável em código que usa assertNever, então o próprio relatório indica que o ferramental foi configurado errado"  # @src=2569ab2839b2
                # | Unreachable arms usually show up as the LAST uncovered branches, not as
                # | proof of misconfiguration, and the point stands regardless of the exact
                # | number.
                feedback: "Braços inalcançáveis normalmente aparecem como as ÚLTIMAS branches não cobertas, não como prova de má configuração, e o ponto se sustenta independentemente do número exato."  # @src=c2a0722c2230
              c:
                # | Coverage measures assertion strength per branch, so 100% genuinely does
                # | mean each behavior is checked, the framing warns only against gaming the
                # | metric
                label: "A cobertura mede a força das asserções por branch, então 100% genuinamente significa que cada comportamento é checado, o enquadramento só avisa contra burlar a métrica"  # @src=7d9bf13f86e2
                # | Coverage counts execution, not verification, a suite of tests with no
                # | meaningful assertions can still score 100%. That gap is the whole
                # | warning.
                feedback: "A cobertura conta execução, não verificação, uma suíte de testes sem asserções significativas ainda pode tirar 100%. Essa lacuna é o aviso inteiro."  # @src=74ee32891dac
              a:
                # | 100% proves every line RAN under some test, it proves nothing about
                # | whether the assertions on those lines would catch a wrong answer
                label: "100% prova que toda linha RODOU sob algum teste, não prova nada sobre se as asserções nessas linhas pegariam uma resposta errada"  # @src=0999eaa5cf60
                # | Coverage counts execution, not verification. A suite that calls every
                # | function and asserts nothing scores perfectly, so the number says where
                # | nobody is looking and nothing about the quality of the looking.
                feedback: "A cobertura conta execução, não verificação. Uma suíte que chama toda função e não afirma nada tira nota máxima, então o número diz onde ninguém está olhando e nada sobre a qualidade do olhar."  # @src=bd0bd6192866
          m02l4-q4:
            # | You rewrote the classifier's five boundary checks as one test.each table.
            # | Beyond less typing, what did the table buy?
            prompt: "Você reescreveu as cinco checagens de fronteira do classificador como uma tabela test.each. Além de menos digitação, o que a tabela comprou?"  # @src=7ad9e6eb616f
            # | A table test turns the classifier's contract into data: (input, expected)
            # | rows that read like the spec they enforce. When m02-l1's challenge added the
            # | 429-is-degraded rule, that was one row; when a boundary bug is found in
            # | production, the regression pin is one row. The cheapest tests to extend are
            # | the ones most likely to be extended.
            explanation: "Um teste de tabela transforma o contrato do classificador em dados: linhas (entrada, esperado) que se leem como a spec que elas impõem. Quando o challenge de m02-l1 acrescentou a regra de que 429 é degraded, isso foi uma linha; quando um bug de fronteira é encontrado em produção, o pin de regressão é uma linha. Os testes mais baratos de estender são os que têm mais chance de serem estendidos."  # @src=a2a8208e4481
            options:                 # source order — keep it
              a:
                # | test.each fans the rows out across worker threads, so the boundary suite
                # | finishes faster as the table grows over time
                label: "test.each espalha as linhas por worker threads, então a suíte de fronteira termina mais rápido conforme a tabela cresce com o tempo"  # @src=e26ed1e93fcb
                # | Parallelism happens at the file level regardless, the table's value is
                # | in the shape of the spec, not the scheduling.
                feedback: "O paralelismo acontece em nível de arquivo de qualquer jeito, o valor da tabela está na forma da spec, não no escalonamento."  # @src=8108ab3f0d8d
              d:
                # | Exhaustiveness, every variant missing a row fails the suite the way a
                # | missing switch arm fails the compiler
                label: "Exaustividade, toda variante sem uma linha faz a suíte falhar do jeito que um braço de switch faltando falha no compilador"  # @src=ffe254391ff5
                # | Nothing audits the table for completeness: a row you forget simply does
                # | not exist and the suite stays green. Exhaustiveness comes from the
                # | switch and assertNever, which is why both live in the source.
                feedback: "Nada audita a tabela em busca de completude: uma linha que você esquece simplesmente não existe e a suíte continua verde. A exaustividade vem do switch e do assertNever, que é por isso que os dois moram no fonte."  # @src=b78858530547
              c:
                # | Table syntax is jest-only in spirit, in vitest it desugars to a
                # | for-loop, so the real win is portability when reading anza's jest repos
                label: "A sintaxe de tabela é jest-only em espírito, no vitest ela vira um for-loop por baixo dos panos, então a vitória real é portabilidade ao ler os repos jest da anza"  # @src=406f3923d14d
                # | test.each is first-class in vitest, no desugaring caveat, and its value
                # | here is spec-shape, not cross-framework reading practice.
                feedback: "test.each é de primeira classe no vitest, sem ressalva de açúcar sintático, e o valor dele aqui é a forma de spec, não prática de leitura entre frameworks."  # @src=21eb185f4d72
              b:
                # | The table IS the spec, rendered executable, every boundary pair sits in
                # | one readable grid, and a new edge case is a one-line row
                label: "A tabela É a spec, tornada executável, cada par de fronteira fica em uma grade legível, e um novo caso de borda é uma linha só"  # @src=02676dea7e1d
                # | Read the rows out loud and you are reading the contract: 399 up, 400
                # | degraded, 1000 degraded, 1001 down. The next rule learned the hard way
                # | costs exactly one line to pin forever.
                feedback: "Leia as linhas em voz alta e você está lendo o contrato: 399 up, 400 degraded, 1000 degraded, 1001 down. A próxima regra aprendida na marra custa exatamente uma linha para ser fixada para sempre."  # @src=9e23afdbc3c0
  m03-l1:
    # | package.json is a contract: workspaces, engines, peers
    title: "package.json é um contrato: workspaces, engines, peers"  # @src=a091b00102a8
    blocks:
      semver-range-check:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the two-character operator first: range.startsWith('>=') must be tested
          # | before the single-character forms.
          0: "Cheque primeiro o operador de dois caracteres: range.startsWith('>=') tem que ser testado antes das formas de um caractere só."  # @src=00589785e610
          # | Every operator case is 'slice off the operator, parseSemver the rest, then
          # | compare', the helpers are already written below the graded function.
          1: "Todo caso de operador é 'corte o operador fora, passe o resto pelo parseSemver, depois compare', os helpers já estão escritos abaixo da função avaliada."  # @src=c603a04bb1c0
          # | For the caret: if compare(v, base) < 0 it fails immediately; then same major
          # | when base major > 0, same major AND minor when base major is 0.
          2: "Para o caret: se compare(v, base) < 0 ele falha na hora; depois mesmo major quando o major da base > 0, mesmo major E minor quando o major da base é 0."  # @src=30b84cb394bc
          # | The tilde is the caret-zero rule applied at every major: at or above the base,
          # | same major and same minor.
          3: "O tilde é a regra do caret-zero aplicada em todo major: na base ou acima, mesmo major e mesmo minor."  # @src=a58e9ee3b9f0
        tests:                      # keyed by test case id
          t1:
            # | caret admits minor and patch walks inside the major: 7.1.2 satisfies ^7.0.0
            description: "o caret admite caminhadas de minor e patch dentro do major: 7.1.2 satisfaz ^7.0.0"  # @src=02bd4758a017
          t2:
            # | a new major breaks the caret: 8.2.0 does NOT satisfy ^7.0.0
            description: "um major novo quebra o caret: 8.2.0 NÃO satisfaz ^7.0.0"  # @src=e1bad6bc6ae2
          t3:
            # | tilde admits patch walks: 1.2.9 satisfies ~1.2.3
            description: "o tilde admite caminhadas de patch: 1.2.9 satisfaz ~1.2.3"  # @src=131bcfcde1c9
          t4:
            # | tilde stops at the minor: 1.3.0 does NOT satisfy ~1.2.3
            description: "o tilde para no minor: 1.3.0 NÃO satisfaz ~1.2.3"  # @src=8e7c224c3e37
          t5:
            # | caret-zero rule, patch side: 0.3.10 satisfies ^0.3.9
            description: "regra do caret-zero, lado do patch: 0.3.10 satisfaz ^0.3.9"  # @src=5fa37ff39829
          t6:
            # | caret-zero rule, breaking side: 0.4.0 does NOT satisfy ^0.3.9, under major 0
            # | the minor is the breaking slot
            description: "regra do caret-zero, lado da quebra: 0.4.0 NÃO satisfaz ^0.3.9, sob major 0 o minor é o slot de quebra"  # @src=0e31fe8b6dbd
          t7:
            # | >= floors at the base: 6.9.0 satisfies >=6.4.0
            description: ">= põe o piso na base: 6.9.0 satisfaz >=6.4.0"  # @src=98c37ecaa1a7
          t8:
            # | >= rejects below the base: 6.3.9 does NOT satisfy >=6.4.0
            description: ">= rejeita abaixo da base: 6.3.9 NÃO satisfaz >=6.4.0"  # @src=1aea032822d3
          t9:
            # | a bare version is an exact pin: 24.20.0 satisfies 24.20.0
            description: "uma versão pelada é um pin exato: 24.20.0 satisfaz 24.20.0"  # @src=c3c9f35da38e
          t10:
            # | the peer-conflict case from the lab: 7.0.2 does NOT satisfy a ^6.9.0 peer
            # | range
            description: "o caso de conflito de peer do lab: 7.0.2 NÃO satisfaz uma faixa de peer ^6.9.0"  # @src=11ad39276250
          t11:
            # | caret still floors at its base: 6.8.0 does NOT satisfy ^6.9.0
            description: "o caret ainda põe o piso na base dele: 6.8.0 NÃO satisfaz ^6.9.0"  # @src=4f50fda93c20
      check:                      # quiz
        questions:
          m03l1-q1:
            # | You install helius-sdk (which peers @solana/kit ^6.9.0) and then run `npm i
            # | @solana/kit@latest`, which is two majors ahead. npm refuses with a
            # | peer-conflict error. What is the resolver actually protecting?
            prompt: "Você instala o helius-sdk (que dá peer em @solana/kit ^6.9.0) e depois roda `npm i @solana/kit@latest`, que está dois majors à frente. O npm recusa com um erro de conflito de peer. O que o resolvedor está de fato protegendo?"  # @src=924469a665fe
            # | A peer range is the library saying 'I run alongside a kit YOU provide, in
            # | this range.' Satisfy it and everything links; ignore it and you're running
            # | the library against an API surface it never saw. The durable rule, pin what
            # | your deps peer against, per workspace, matters precisely because the digits
            # | rot: kit shipped two majors in just over nine weeks.
            explanation: "Uma faixa de peer é a biblioteca dizendo 'eu rodo ao lado de um kit que VOCÊ fornece, nesta faixa.' Satisfaça ela e tudo liga; ignore ela e você está rodando a biblioteca contra uma superfície de API que ela nunca viu. A regra durável, fixe aquilo contra o que as suas deps dão peer, por workspace, importa exatamente porque os dígitos apodrecem: o kit entregou dois majors em pouco mais de nove semanas."  # @src=424a25cf8aaf
            options:                 # source order — keep it
              d:
                # | You from a stale dependency: the error is npm flagging that helius-sdk
                # | has fallen behind kit's current release line
                label: "Você, de uma dependência velha: o erro é o npm apontando que o helius-sdk ficou para trás da linha de release atual do kit"  # @src=1292c5788ba2
                # | npm has no opinion about staleness; it read the declared ranges and
                # | found no version satisfying all of them. Note the transitive lines in
                # | the error too: @solana-program/* carry their own kit ranges.
                feedback: "O npm não tem opinião sobre estar velho; ele leu as faixas declaradas e não achou versão nenhuma que satisfizesse todas. Note também as linhas transitivas no erro: @solana-program/* carregam as próprias faixas de kit."  # @src=e5f47dc5ff7a
              c:
                # | The declared compatibility contract: helius-sdk was built against kit
                # | 6.x, pin kit to what your deps peer against
                label: "O contrato de compatibilidade declarado: o helius-sdk foi construído contra o kit 6.x, fixe o kit naquilo contra o que as suas deps dão peer"  # @src=975393300bd4
                # | A peer range records which instances the library has actually been
                # | tested sharing. Forcing kit 8 beside it just moves the failure from
                # | install time, where it is loud, to runtime, where it is quiet.
                feedback: "Uma faixa de peer registra quais instâncias a biblioteca de fato foi testada compartilhando. Forçar o kit 8 ao lado dela só move a falha do tempo de install, onde ela é barulhenta, para o runtime, onde ela é silenciosa."  # @src=a009a2af5b33
              a:
                # | Nothing real, peerDependencies are informational metadata, and the error
                # | is a legacy strictness default you can safely force past
                label: "Nada de verdade, peerDependencies são metadados informativos, e o erro é um default de rigor legado que você pode forçar e passar sem risco"  # @src=20512a5f0f53
                # | Modern npm enforces peers because the conflict is real: helius-sdk's
                # | code calls kit APIs from the 6.x line it was built and tested against.
                feedback: "O npm moderno cobra os peers porque o conflito é de verdade: o código do helius-sdk chama APIs do kit da linha 6.x contra a qual ele foi construído e testado."  # @src=43b5af40af27
              b:
                # | Disk layout, two kit majors cannot be deduped into one node_modules
                # | tree, so the resolver blocks the install to avoid duplication
                label: "Layout de disco, dois majors de kit não podem ser deduplicados numa árvore node_modules só, então o resolvedor bloqueia o install para evitar duplicação"  # @src=ff8b161d189a
                # | npm can physically nest conflicting versions; the refusal is about the
                # | declared compatibility contract, not about where files sit on disk.
                feedback: "O npm consegue aninhar fisicamente versões conflitantes; a recusa é sobre o contrato de compatibilidade declarado, não sobre onde os arquivos ficam no disco."  # @src=e4c47974cee7
          m03l1-q2:
            # | pulse-core's package.json says `"some-dep": "^6.9.0"`. A teammate asks
            # | exactly which versions a fresh install may resolve to. The correct reading:
            prompt: "O package.json do pulse-core diz `\"some-dep\": \"^6.9.0\"`. Um colega de time pergunta exatamente para quais versões um install novo pode resolver. A leitura correta:"  # @src=bdad3aa7a811
            # | ^X.Y.Z admits >=X.Y.Z <(X+1).0.0, everything semver promises is
            # | non-breaking. The one exception is major 0, where the minor becomes the
            # | breaking slot (^0.3.9 admits 0.3.10, never 0.4.0), which is why the
            # | caret-zero rule gets its own tests in this lesson's challenge.
            explanation: "^X.Y.Z admite >=X.Y.Z <(X+1).0.0, tudo que o semver promete que não quebra. A única exceção é o major 0, onde o minor vira o slot de quebra (^0.3.9 admite 0.3.10, nunca 0.4.0), que é por isso que a regra do caret-zero ganha testes próprios no challenge desta lição."  # @src=e0cb4439eeb0
            options:                 # source order — keep it
              d:
                # | Any 6.x release at all, 6.0.0 included, since the caret pins only the
                # | major and ignores the base version
                label: "Qualquer release 6.x que seja, 6.0.0 incluída, já que o caret fixa só o major e ignora a versão base"  # @src=eeb1c95780d0
                # | The base is a floor, not decoration: 6.0.0 does not satisfy ^6.9.0. You
                # | are asking for the fixes that shipped up to 6.9.0, plus whatever lands
                # | after them without leaving major 6.
                feedback: "A base é um piso, não decoração: 6.0.0 não satisfaz ^6.9.0. Você está pedindo as correções que foram entregues até a 6.9.0, mais o que quer que chegue depois delas sem sair do major 6."  # @src=d1699104ba6f
              c:
                # | Any version at or above 6.9.0, including future majors, as long as the
                # | publisher followed semver when versioning them
                label: "Qualquer versão na 6.9.0 ou acima, majors futuros inclusive, desde que o publicador tenha seguido o semver ao versioná-los"  # @src=98270659b884
                # | The caret hard-stops before the next major, that boundary is exactly
                # | where semver says breaking changes live, so no range crosses it on
                # | trust.
                feedback: "O caret para seco antes do próximo major, essa fronteira é exatamente onde o semver diz que as mudanças que quebram moram, então faixa nenhuma atravessa ela na base da confiança."  # @src=8964ceb1d01a
              a:
                # | Anything at or above 6.9.0 but below 7.0.0, minor and patch walks inside
                # | major 6, never a new major
                label: "Qualquer coisa na 6.9.0 ou acima mas abaixo de 7.0.0, caminhadas de minor e patch dentro do major 6, nunca um major novo"  # @src=c0e705e17a9c
                # | The caret trusts semver's core promise, that breaking changes only ride
                # | a major bump, so it walks minors and patches freely and stops exactly
                # | where breakage is allowed to live.
                feedback: "O caret confia na promessa central do semver, a de que mudanças que quebram só pegam carona num bump de major, então ele caminha por minors e patches livremente e para exatamente onde a quebra tem permissão de morar."  # @src=722907f77eb5
              b:
                # | Only versions matching 6.9.x, the caret admits patch releases but treats
                # | a minor bump as a breaking change
                label: "Só versões que correspondem a 6.9.x, o caret admite releases de patch mas trata um bump de minor como mudança que quebra"  # @src=bbea91dfd7f4
                # | That's the tilde's behavior (~6.9.0). The caret trusts the whole major
                # | line: 6.10, 6.11, anything under 7.
                feedback: "Esse é o comportamento do tilde (~6.9.0). O caret confia na linha de major inteira: 6.10, 6.11, qualquer coisa abaixo de 7."  # @src=34d987ad2c01
          m03l1-q3:
            # | Why extract pulse-core into a workspace package NOW instead of letting the
            # | dashboard copy the classifier file next lesson?
            prompt: "Por que extrair o pulse-core para um pacote de workspace AGORA em vez de deixar o painel copiar o arquivo do classificador na próxima lição?"  # @src=636a24e23314
            # | The honest extraction rule: extract when the second consumer is real, not
            # | speculative. Ours is, m03-l2's dashboard imports the classifier, M7's edge
            # | worker imports the pure core. Copies drift; a workspace package keeps every
            # | consumer on the same code and forces you to design the public surface once.
            explanation: "A regra honesta de extração: extraia quando o segundo consumidor for real, não especulativo. O nosso é, o painel de m03-l2 importa o classificador, o worker de edge do M7 importa o core puro. Cópias divergem; um pacote de workspace mantém todo consumidor no mesmo código e te força a projetar a superfície pública uma vez."  # @src=b9ceccb0f23a
            options:                 # source order — keep it
              b:
                # | A second real consumer is arriving, with the workspace link, fleet and
                # | dashboard import the SAME classifier from one source of truth
                label: "Um segundo consumidor real está chegando, com o link de workspace, frota e painel importam o MESMO classificador de uma única fonte de verdade"  # @src=fd0dcc8f5be8
                # | Copies drift the week one of them takes a boundary fix, and both stay
                # | green in their own tests while the two dashboards disagree about
                # | production. The link is what makes disagreement impossible.
                feedback: "Cópias divergem na semana em que uma delas leva uma correção de fronteira, e as duas continuam verdes nos testes delas enquanto os dois painéis discordam sobre a produção. O link é o que torna a discordância impossível."  # @src=d35b46b354d1
              c:
                # | Vite cannot bundle files that sit outside its project root, so the
                # | dashboard physically cannot reach the fleet's source without a package
                label: "O Vite não consegue empacotar arquivos que ficam fora da raiz do projeto dele, então o painel fisicamente não consegue alcançar o código-fonte da frota sem um pacote"  # @src=54ede0f0dc89
                # | Bundlers can be configured around file locations, the reason is drift:
                # | two copies of the classifier stop agreeing the week one gets a bug fix.
                feedback: "Bundlers podem ser configurados em volta de localizações de arquivo, a razão é a divergência: duas cópias do classificador param de concordar na semana em que uma leva uma correção de bug."  # @src=527a1dccc13b
              a:
                # | npm requires code to live in its own package before any of it can be
                # | published, so the extraction is publishing paperwork done early
                label: "O npm exige que o código more no próprio pacote antes que qualquer parte dele possa ser publicada, então a extração é papelada de publicação feita cedo"  # @src=b2ee27f2aa84
                # | You could restructure right before publishing, the extraction's value is
                # | upstream of npm: one source of truth for multiple consumers.
                feedback: "Você poderia reestruturar bem na hora de publicar, o valor da extração está a montante do npm: uma fonte única de verdade para múltiplos consumidores."  # @src=29883a64600c
              d:
                # | The classifier has stopped changing, so a package boundary can freeze
                # | that shape in place before the dashboard ever imports a copy of it
                label: "O classificador parou de mudar, então uma fronteira de pacote pode congelar essa forma no lugar antes de o painel importar uma cópia dele"  # @src=d8c3208335ab
                # | Stability is not the trigger; a second consumer is. Code nobody edits is
                # | the safest thing to copy. It is code that takes a fix in one copy and
                # | not the other that makes the boundary worth its ceremony.
                feedback: "Estabilidade não é o gatilho; um segundo consumidor é. Código que ninguém edita é a coisa mais segura de copiar. É código que leva uma correção numa cópia e não na outra que faz a fronteira valer a cerimônia dela."  # @src=c2c619b417a4
          m03l1-q4:
            # | You're writing the Dockerfile beat later in the course and need pnpm inside
            # | a fresh Node container. The lesson's durable install path is:
            prompt: "Você está escrevendo a batida do Dockerfile mais adiante no curso e precisa de pnpm dentro de um contêiner Node novo. O caminho de install durável da lição é:"  # @src=1ed0a015c696
            # | The TSC voted corepack out of Node distributions from v25.0.0; it remains in
            # | Node 24 LTS, but a habit that dies on the next LTS is a bad habit. npm i -g
            # | pnpm pinned to a version works everywhere Node does, and it's exactly the
            # | line m06-l3's node image will use.
            explanation: "O TSC votou pela saída do corepack das distribuições do Node a partir da v25.0.0; ele continua no Node 24 LTS, mas um hábito que morre no próximo LTS é um hábito ruim. npm i -g pnpm fixado numa versão funciona em todo lugar em que o Node funciona, e é exatamente a linha que a imagem node de m06-l3 vai usar."  # @src=d419b5f882a1
            options:                 # source order — keep it
              d:
                # | The official Node base images already carry pnpm alongside npm, so the
                # | Dockerfile can simply call it and move on
                label: "As imagens base oficiais do Node já carregam o pnpm ao lado do npm, então o Dockerfile pode simplesmente chamar ele e seguir em frente"  # @src=ba764cbae6a7
                # | Those images ship Node and npm and nothing else. The thing that used to
                # | make pnpm appear was corepack, which Node's TSC voted out in 2025, which
                # | is the whole reason the install line is explicit.
                feedback: "Essas imagens já vêm com o Node e o npm e nada mais. A coisa que fazia o pnpm aparecer era o corepack, que o TSC do Node votou para fora em 2025, que é a razão inteira de a linha de install ser explícita."  # @src=d66471659b90
              c:
                # | npm i -g pnpm at a pinned version, npm is always present, and the
                # | explicit pin survives Node's corepack removal
                label: "npm i -g pnpm numa versão fixada, o npm está sempre presente, e o pin explícito sobrevive à remoção do corepack pelo Node"  # @src=db0e5e43ad2a
                # | Boring and durable: npm exists on every Node there is, and the digit
                # | sits where a human can read it, matching the packageManager field, the
                # | CI job and M6's Dockerfile.
                feedback: "Sem graça e durável: o npm existe em todo Node que há, e o dígito fica onde um humano consegue ler, batendo com o campo packageManager, com o job de CI e com o Dockerfile do M6."  # @src=1f53d8352b12
              b:
                # | Nothing to install, the packageManager field makes npm itself delegate
                # | to pnpm automatically on any modern Node
                label: "Nada a instalar, o campo packageManager faz o próprio npm delegar para o pnpm automaticamente em qualquer Node moderno"  # @src=741fe6bba362
                # | packageManager is a pin that tools MAY honor; npm does not transform
                # | into pnpm because a field asks it to.
                feedback: "packageManager é um pin que ferramentas PODEM honrar; o npm não se transforma em pnpm porque um campo pede."  # @src=faf816fb45d9
              a:
                # | corepack enable, corepack ships with every Node release and reads the
                # | packageManager field to activate the pinned pnpm
                label: "corepack enable, o corepack já vem com toda release do Node e lê o campo packageManager para ativar o pnpm fixado"  # @src=974ae8e7174a
                # | That works on Node 24 LTS but not durably: corepack is no longer
                # | distributed with Node 25+, so the habit breaks on the next base image.
                feedback: "Isso funciona no Node 24 LTS mas não de forma durável: o corepack não é mais distribuído com o Node 25+, então o hábito quebra na próxima imagem base."  # @src=d6a356a27767
  m03-l2:
    # | React as a consumer: the dashboard
    title: "React como consumidor: o painel"  # @src=2ffef5a458e2
    blocks:
      check:                      # quiz
        questions:
          m03l2-q1:
            # | The cron ran 8 minutes ago and committed fresh data, but your board still
            # | shows the old numbers. The network tab shows a 200 on the raw status.json
            # | fetch. Most likely cause?
            prompt: "O cron rodou 8 minutos atrás e commitou dados frescos, mas o seu painel ainda mostra os números velhos. A aba network mostra um 200 no fetch do status.json raw. Causa mais provável?"  # @src=b53f3c18246c
            # | Two delays stack between a probe and a pixel: the cron's own schedule, then
            # | the CDN's cache-control: max-age=300 (probed live, Fastly, strong etag,
            # | MISS→HIT observed). Read it in devtools, then decide: cache-bust with a
            # | query string, or render the staleness honestly with a last-updated
            # | indicator. This lesson does both.
            explanation: "Dois atrasos se empilham entre uma sonda e um pixel: o agendamento do próprio cron, depois o cache-control: max-age=300 do CDN (sondado ao vivo, Fastly, etag forte, MISS→HIT observado). Leia isso no devtools, depois decida: faça cache-bust com uma query string, ou renderize a desatualização com honestidade com um indicador de última atualização. Esta lição faz as duas coisas."  # @src=514133448445
            options:                 # source order — keep it
              b:
                # | React batched the state update and won't re-render until the next user
                # | interaction forces the component tree to reconcile
                label: "O React agrupou a atualização de estado e não vai re-renderizar até a próxima interação do usuário forçar a árvore de componentes a reconciliar"  # @src=8f14b138fb02
                # | setState from your polling effect re-renders promptly, React isn't
                # | holding data hostage. The stale bytes arrived stale: check the response
                # | headers, not the component.
                feedback: "setState do seu efeito de polling re-renderiza na hora, o React não está segurando dados como reféns. Os bytes desatualizados chegaram desatualizados: cheque os headers de resposta, não o componente."  # @src=e4b49a03feb1
              d:
                # | The effect's empty dependency array means it fetched once on mount and
                # | has not asked for the file again since
                label: "O array de dependências vazio do efeito quer dizer que ele buscou uma vez no mount e não pediu o arquivo de novo desde então"  # @src=ec5881004c1a
                # | The empty array governs how often the EFFECT runs, not how often it
                # | fetches: it starts a setInterval that keeps polling. A board that had
                # | stopped asking would show no request in the network tab at all.
                feedback: "O array vazio governa com que frequência o EFEITO roda, não com que frequência ele busca: ele inicia um setInterval que continua fazendo polling. Um painel que tivesse parado de pedir não mostraria requisição nenhuma na aba network."  # @src=8d23354f0267
              a:
                # | The raw endpoint caches for 5 minutes behind a CDN, your 200 was a cache
                # | HIT; cache-bust or render the staleness
                label: "O endpoint raw faz cache por 5 minutos atrás de um CDN, o seu 200 foi um HIT de cache; faça cache-bust ou renderize a desatualização"  # @src=4f99750233d7
                # | The stale bytes arrived stale, so no component change helps. max-age=300
                # | with a strong etag through Fastly means your board can trail reality by
                # | the cron interval plus the cache window.
                feedback: "Os bytes desatualizados chegaram desatualizados, então mudança nenhuma no componente ajuda. max-age=300 com um etag forte através da Fastly quer dizer que o seu painel pode ficar atrás da realidade pelo intervalo do cron mais a janela de cache."  # @src=86421af22a2f
              c:
                # | GitHub rate-limits raw fetches to one fresh read per 10 minutes per IP
                # | and serves a stale copy for requests in between
                label: "O GitHub limita a taxa de fetches raw a uma leitura fresca a cada 10 minutos por IP e serve uma cópia desatualizada para as requisições no meio"  # @src=e41b6cae4330
                # | No such limit is documented anywhere, the sweep specifically recorded
                # | the ABSENCE of raw.* rate limits. The observable, probed mechanism is
                # | the 5-minute CDN cache.
                feedback: "Nenhum limite desses está documentado em lugar nenhum, a varredura registrou especificamente a AUSÊNCIA de rate limits em raw.*. O mecanismo observável e sondado é o cache de CDN de 5 minutos."  # @src=f17f5e787f86
          m03l2-q2:
            # | raw.githubusercontent serves your status.json with content-type: text/plain,
            # | yet `await res.json()` parses it without complaint. Why?
            prompt: "O raw.githubusercontent serve o seu status.json com content-type: text/plain, e mesmo assim `await res.json()` faz o parse dele sem reclamar. Por quê?"  # @src=5f2a19da691b
            # | The WHATWG fetch spec parses the body you asked it to parse, MIME be damned.
            # | That's convenient and slightly dishonest, which is why the lesson shows the
            # | header in devtools: the day you swap in an HTTP library that sniffs
            # | content-type, this exact response becomes a bug report.
            explanation: "A spec de fetch da WHATWG faz o parse do corpo que você pediu para ela parsear, dane-se o MIME. Isso é conveniente e ligeiramente desonesto, que é por isso que a lição mostra o header no devtools: no dia em que você trocar por uma biblioteca HTTP que fareja o content-type, esta resposta exata vira um bug report."  # @src=35b198eba56b
            options:                 # source order — keep it
              c:
                # | GitHub's CDN negotiates the type per client: browsers that send an
                # | Accept: application/json header get the correct MIME on the wire
                label: "O CDN do GitHub negocia o tipo por cliente: navegadores que mandam um header Accept: application/json recebem o MIME correto no fio"  # @src=473cf7dc8e77
                # | The probe checked this shape of variance, the headers came back
                # | identical regardless of request headers. No negotiation; it's text/plain
                # | for everyone.
                feedback: "A sonda checou esse formato de variação, os headers voltaram idênticos independentemente dos headers de requisição. Sem negociação; é text/plain para todo mundo."  # @src=89b4f5432173
              a:
                # | The browser rewrites the content-type to application/json when the URL
                # | ends in .json, so by the time fetch sees it the header is corrected
                label: "O navegador reescreve o content-type para application/json quando a URL termina em .json, então quando o fetch vê ele o header já está corrigido"  # @src=29776507c00a
                # | Browsers don't rewrite response headers from file extensions, the header
                # | arrives as text/plain and stays that way; the parsing behavior lives in
                # | fetch's spec, not in a rewrite.
                feedback: "Navegadores não reescrevem headers de resposta a partir de extensões de arquivo, o header chega como text/plain e fica assim; o comportamento de parse mora na spec do fetch, não numa reescrita."  # @src=746cca23f2b4
              d:
                # | text/plain sits on the fetch spec's own allowlist of JSON-compatible
                # | content types, so this parse is permitted through
                label: "text/plain está na própria allowlist de content types compatíveis com JSON da spec de fetch, então este parse passa permitido"  # @src=c405519096c5
                # | No list gets consulted, which is the part worth keeping. json() reads
                # | the body and never asks what the header claimed, so nothing about
                # | text/plain was ever approved for this.
                feedback: "Lista nenhuma é consultada, que é a parte que vale guardar. json() lê o corpo e nunca pergunta o que o header alegou, então nada sobre text/plain jamais foi aprovado para isso."  # @src=d81087a87341
              b:
                # | Response.json() parses the body as JSON regardless of MIME, though tools
                # | that sniff content-type can still reject it
                label: "Response.json() faz o parse do corpo como JSON independentemente do MIME, embora ferramentas que farejam content-type ainda possam recusar ele"  # @src=af3a977c85d5
                # | The fetch spec parses the body you asked it to parse and leaves the
                # | header unread. Convenient, and slightly dishonest: swap in a client that
                # | sniffs the type and this same response becomes a bug report.
                feedback: "A spec de fetch faz o parse do corpo que você pediu para ela parsear e deixa o header sem ler. Conveniente, e ligeiramente desonesto: troque por um cliente que fareja o tipo e esta mesma resposta vira um bug report."  # @src=c9423604f695
          m03l2-q3:
            # | In consumer-level terms: where does the fetched status data LIVE in your
            # | dashboard, and what makes the table repaint when new data arrives?
            prompt: "Em termos de nível de consumidor: onde os dados de status buscados MORAM no seu painel, e o que faz a tabela repintar quando dados novos chegam?"  # @src=6ff16e7be65c
            # | The whole consumer-level model in one sentence: state is the input, the
            # | component is a pure function of it, the DOM is the output, and setState is
            # | the only doorbell. Everything deeper, context, reducers, server components,
            # | is the client-side mastery course's territory, and the lesson says so by
            # | name.
            explanation: "O modelo de nível de consumidor inteiro em uma frase: o estado é a entrada, o componente é uma função pura dele, o DOM é a saída, e setState é a única campainha. Tudo mais fundo, context, reducers, server components, é território do curso de domínio do lado do cliente, e a lição diz isso pelo nome."  # @src=f75e079f501a
            options:                 # source order — keep it
              b:
                # | In a module-level variable next to the component, reassigning it
                # | triggers React's file watcher, which hot-reloads the changed component
                label: "Numa variável de nível de módulo ao lado do componente, reatribuir ela dispara o file watcher do React, que faz hot-reload do componente alterado"  # @src=c672a55ac5a3
                # | Module variables are invisible to React's render cycle (and hot-reload
                # | is a dev-server feature, not a data path). Only state setters schedule
                # | re-renders.
                feedback: "Variáveis de módulo são invisíveis para o ciclo de renderização do React (e hot-reload é uma feature do dev server, não um caminho de dados). Só setters de estado agendam re-renderizações."  # @src=94e65f41fefe
              d:
                # | In the polling effect's closure, where each tick re-runs the effect and
                # | the parsed JSON reaches the table with no setter
                label: "Na closure do efeito de polling, onde cada tick re-roda o efeito e o JSON parseado chega na tabela sem setter nenhum"  # @src=2d94c3ff13e0
                # | Effects run after a render; they do not cause one, and the interval
                # | fires the callback rather than re-running the effect. A value that never
                # | leaves the closure never reaches the JSX the component returned.
                feedback: "Efeitos rodam depois de uma renderização; eles não causam uma, e o interval dispara o callback em vez de re-rodar o efeito. Um valor que nunca sai da closure nunca chega no JSX que o componente retornou."  # @src=a0a49ad42067
              c:
                # | In a useState hook, the polling effect calls its setter with the parsed
                # | JSON, and that state change is what schedules the re-render
                label: "Num hook useState, o efeito de polling chama o setter dele com o JSON parseado, e essa mudança de estado é o que agenda a re-renderização"  # @src=9c72af0b32a1
                # | One direction only: state in, render out, pixels last. The setter is the
                # | single doorbell React answers, so anything that has to appear on screen
                # | has to live in state.
                feedback: "Uma direção só: estado entra, renderização sai, pixels por último. O setter é a única campainha que o React atende, então qualquer coisa que tem que aparecer na tela tem que morar no estado."  # @src=8eea2d84df7b
              a:
                # | In the DOM itself, React reads the current table contents back on each
                # | poll and patches only the cells whose text changed
                label: "No próprio DOM, o React lê o conteúdo atual da tabela de volta a cada poll e aplica patch só nas células cujo texto mudou"  # @src=d857fa1e91d5
                # | React never reads state back out of the DOM, the DOM is output. Data
                # | flows one way: state to render to pixels.
                feedback: "O React nunca lê o estado de volta do DOM, o DOM é saída. Os dados fluem numa direção só: do estado para a renderização para os pixels."  # @src=127c40cf55aa
          m03l2-q4:
            # | The board imports pulse-core's classifier for its status colors instead of
            # | reimplementing the three-line function locally. What does that import
            # | actually prove?
            prompt: "O painel importa o classificador do pulse-core para as cores de status dele em vez de reimplementar a função de três linhas localmente. O que esse import prova de verdade?"  # @src=7acfd396b9c4
            # | This is the extraction demonstrated, not asserted: last lesson promised a
            # | second real consumer, and here it is, the exact classifier that gates the
            # | cron now colors the pixels. When m08-l2 adds chain-status rows, the same
            # | import means the fleet, the board, and eventually the edge worker all agree
            # | on what the colors mean.
            explanation: "Esta é a extração demonstrada, não afirmada: a lição passada prometeu um segundo consumidor de verdade, e aqui está ele, o classificador exato que trava o cron agora colore os pixels. Quando m08-l2 adicionar linhas de status da chain, o mesmo import quer dizer que a frota, o painel e, com o tempo, o edge worker todos concordam sobre o que as cores querem dizer."  # @src=ad199a7b231b
            options:                 # source order — keep it
              b:
                # | Bundle efficiency: importing from a workspace package lets Vite
                # | tree-shake the classifier to fewer bytes than a local copy would compile
                # | to
                label: "Eficiência de bundle: importar de um pacote do workspace deixa o Vite fazer tree-shake do classificador para menos bytes do que uma cópia local compilaria"  # @src=fa75ea0e26bb
                # | A three-line local copy would bundle just as small, the win isn't bytes,
                # | it's that two consumers can never drift apart on what 'degraded' means.
                feedback: "Uma cópia local de três linhas ficaria igualmente pequena no bundle, o ganho não são bytes, é que dois consumidores nunca podem descolar no que 'degraded' quer dizer."  # @src=45fd09c977a5
              d:
                # | That duplication is worth removing, the same three-line function written
                # | twice is code nobody should repeat
                label: "Que vale remover a duplicação, a mesma função de três linhas escrita duas vezes é código que ninguém deveria repetir"  # @src=a057bdecb7fe
                # | Repetition alone is cheap here; three lines twice costs nothing to type.
                # | What the import buys is that the copy which quietly disagrees after
                # | someone retunes the latency band cannot exist.
                feedback: "Repetição sozinha é barata aqui; três linhas duas vezes não custa nada para digitar. O que o import compra é que a cópia que discorda em silêncio depois que alguém reajusta a faixa de latência não pode existir."  # @src=73b69088edb6
              c:
                # | Type safety: cross-package imports are the only place Vite runs the
                # | TypeScript checker, so the boundary is where type errors get caught
                label: "Segurança de tipos: imports entre pacotes são o único lugar onde o Vite roda o verificador de TypeScript, então a fronteira é onde erros de tipo são pegos"  # @src=56d5ed0a2596
                # | Type-checking covers the whole project regardless of package boundaries,
                # | the import's value is one source of truth, not a special checking mode.
                feedback: "A checagem de tipos cobre o projeto inteiro independentemente de fronteiras de pacote, o valor do import é uma fonte única de verdade, não um modo de checagem especial."  # @src=db2fcfd569cf
              a:
                # | The m03-l1 boundary is real: fleet and dashboard demonstrably run the
                # | SAME classification code, one fix reaching both
                label: "A fronteira de m03-l1 é real: a frota e o painel comprovadamente rodam o MESMO código de classificação, uma correção alcançando os dois"  # @src=4866a3c5f776
                # | Last lesson the extraction was an argument; this line makes it a pixel.
                # | A green row on the board and a green verdict in the cron cannot
                # | disagree, because they are one function with two callers.
                feedback: "Na lição passada a extração era um argumento; esta linha faz dela um pixel. Uma linha verde no painel e um veredito verde no cron não podem discordar, porque eles são uma função só com dois chamadores."  # @src=849d45e7c4b9
  m03-l3:
    # | Vercel: the URL
    title: "Vercel: a URL"  # @src=23baf6f1bad1
    blocks:
      check-ship:                      # quiz
        questions:
          m03l3-q1:
            # | Your deployed board works from the home page, but sharing the direct link to
            # | /history returns a 404, while the same path works fine under npm run dev.
            # | What fixes production?
            prompt: "O seu painel em produção funciona a partir da página inicial, mas compartilhar o link direto para /history devolve um 404, enquanto o mesmo caminho funciona numa boa sob npm run dev. O que conserta a produção?"  # @src=69eb24ce4f27
            # | The dev server silently rewrites unknown paths to index.html; a production
            # | static host doesn't, until you tell it to. The vercel.json block, source
            # | /(.*), destination /index.html, is the whole fix. Dev-prod asymmetries like
            # | this are why the lesson pokes the PRODUCTION URL, not localhost.
            explanation: "O servidor de dev silenciosamente reescreve caminhos desconhecidos para index.html; um host estático de produção não, até você mandar. O bloco do vercel.json, source /(.*), destination /index.html, é a correção inteira. Assimetrias dev-prod como essa são por que a lição cutuca a URL de PRODUÇÃO, não o localhost."  # @src=41f099c78e35
            options:                 # source order — keep it
              d:
                # | Enable Vite's history fallback in vite.config.ts, the same setting the
                # | dev server uses, so the built site answers unknown paths too
                label: "Ative o history fallback do Vite em vite.config.ts, a mesma configuração que o servidor de dev usa, para que o site compilado responda caminhos desconhecidos também"  # @src=d8b60f5cca9d
                # | Dev-server options stop at the dev server; nothing in vite.config.ts
                # | travels onto the CDN. The build emits a directory of real files, and the
                # | host needs its own instruction about paths that are not files.
                feedback: "Opções de servidor de dev param no servidor de dev; nada em vite.config.ts viaja para o CDN. O build emite um diretório de arquivos de verdade, e o host precisa da instrução própria dele sobre caminhos que não são arquivos."  # @src=d03c337f1793
              b:
                # | Add the one-block vercel.json rewrite sending every path to /index.html,
                # | the SPA routes client-side, and the host must hand it every request
                label: "Acrescente o rewrite de um bloco só no vercel.json mandando todo caminho para /index.html, a SPA roteia do lado do cliente, e o host tem que passar toda requisição para ela"  # @src=332e41941154
                # | The dev server rewrites unknown paths to index.html as a favor; a
                # | production static host does no favors. The rewrite is you asking the CDN
                # | for that same favor, in writing and in the repo.
                feedback: "O servidor de dev reescreve caminhos desconhecidos para index.html como um favor; um host estático de produção não faz favor nenhum. O rewrite é você pedindo esse mesmo favor ao CDN, por escrito e dentro do repo."  # @src=96fb76699e34
              a:
                # | Switch the board to hash-based routing, static hosts can only serve real
                # | files, so path-style routes can never work on a CDN deployment
                label: "Troque o painel para roteamento baseado em hash, hosts estáticos só conseguem servir arquivos de verdade, então rotas no estilo de caminho nunca podem funcionar num deploy em CDN"  # @src=4bd56b7761c2
                # | Hash routing would dodge the problem, but path-style routes work fine on
                # | static hosts, that's exactly what the rewrite exists for.
                feedback: "Roteamento por hash desviaria do problema, mas rotas no estilo de caminho funcionam numa boa em hosts estáticos, é exatamente para isso que o rewrite existe."  # @src=66c973560e1d
              c:
                # | Rebuild with the route pre-rendered, Vite must emit a physical
                # | history/index.html for each route the app defines before a static host
                # | can serve it
                label: "Refaça o build com a rota pré-renderizada, o Vite tem que emitir um history/index.html físico para cada rota que o app define antes de um host estático conseguir servir ela"  # @src=9bffa766e2af
                # | Pre-rendering is a real technique but not the requirement here, one
                # | rewrite line makes the CDN serve index.html for any path, and the client
                # | router takes it from there.
                feedback: "Pré-renderização é uma técnica de verdade mas não é o requisito aqui, uma linha de rewrite faz o CDN servir index.html para qualquer caminho, e o roteador do cliente segue dali."  # @src=39e23542d57e
          m03l3-q2:
            # | You set STATION_REPO in the Vercel dashboard, redeployed, and
            # | import.meta.env.STATION_REPO is still undefined in the browser. Why?
            prompt: "Você definiu STATION_REPO no painel do Vercel, fez o deploy de novo, e import.meta.env.STATION_REPO continua undefined no navegador. Por quê?"  # @src=1280a7823915
            # | Vite's prefix rule is a safety design: everything in client JS is
            # | world-readable, so exposure must be opt-in, and the ugly prefix IS the
            # | consent form. The same rule read backwards is the security lesson, anything
            # | secret must never wear VITE_, a thread the m09-l2 four-platform secrets
            # | sweep pulls tight.
            explanation: "A regra de prefixo do Vite é um design de segurança: tudo em JS de cliente é legível pelo mundo inteiro, então a exposição tem que ser opt-in, e o prefixo feio É o termo de consentimento. A mesma regra lida de trás para frente é a lição de segurança, nada secreto pode nunca vestir VITE_, um fio que a varredura de segredos de quatro plataformas de m09-l2 puxa apertado."  # @src=b46ce7a39686
            options:                 # source order — keep it
              b:
                # | Env vars are read at runtime, so a static deployment can never see them,
                # | the board would need a serverless function to forward the value
                label: "Env vars são lidas em tempo de execução, então um deploy estático nunca consegue ver elas, o painel precisaria de uma função serverless para encaminhar o valor"  # @src=092579046922
                # | Vite inlines env values at BUILD time, which works fine for static
                # | output, no function needed. The gate is the prefix rule, not the
                # | architecture.
                feedback: "O Vite faz inline dos valores de env em tempo de BUILD, o que funciona numa boa para saída estática, sem função nenhuma. A trava é a regra do prefixo, não a arquitetura."  # @src=ccfa5b0dddf3
              c:
                # | Only VITE_-prefixed variables reach client code, rename it
                # | VITE_STATION_REPO; the prefix is the 'this will be public' marker
                label: "Só variáveis prefixadas com VITE_ chegam ao código do cliente, renomeie para VITE_STATION_REPO; o prefixo é o marcador de 'isto vai ser público'"  # @src=9ae6833e2a2f
                # | The prefix is a consent form. Everything in client JavaScript is
                # | world-readable forever, so exposure is opt-in, and reading the rule
                # | backwards gives you the security lesson: nothing secret may wear it.
                feedback: "O prefixo é um termo de consentimento. Tudo em JavaScript de cliente é legível pelo mundo inteiro para sempre, então a exposição é opt-in, e ler a regra de trás para frente te dá a lição de segurança: nada secreto pode vestir ele."  # @src=7f9348a81a63
              d:
                # | Custom values arrive on process.env in the bundle; import.meta.env
                # | carries only Vite's own built-in variables
                label: "Valores customizados chegam em process.env dentro do bundle; import.meta.env carrega só as variáveis embutidas do próprio Vite"  # @src=266c161d4c85
                # | There is no process object in a browser bundle, which is why Vite
                # | exposes import.meta.env at all. It carries your own variables happily;
                # | what gates them is the prefix, not the namespace.
                feedback: "Não existe objeto process num bundle de navegador, que é por que o Vite expõe import.meta.env. Ele carrega as suas próprias variáveis numa boa; o que trava elas é o prefixo, não o namespace."  # @src=36baa027fa67
              a:
                # | Dashboard-set vars only reach preview deployments, production builds
                # | require the values to be committed in a .env.production file in the repo
                label: "Vars definidas no painel só chegam a deploys de preview, builds de produção exigem que os valores estejam commitados num arquivo .env.production no repo"  # @src=5fd3a7bf91ea
                # | Dashboard vars target any environment you assign them to, and committing
                # | env files to a public repo is the anti-pattern, the issue is the missing
                # | prefix, not the source.
                feedback: "Vars do painel miram qualquer ambiente que você atribuir a elas, e commitar arquivos de env num repo público é o antipadrão, o problema é o prefixo faltando, não a origem."  # @src=24a70551bd11
          m03l3-q3:
            # | You typed vercel in a repo with no config file and got a working deployment.
            # | What did 'zero-config' actually consist of?
            prompt: "Você digitou vercel num repo sem arquivo de config e ganhou um deploy funcionando. Em que o 'zero-config' de fato consistiu?"  # @src=96b44ab976ee
            # | The mechanism, described without quoting anyone's marketing: your repo
            # | already declares its framework, build command, and output dir; the platform
            # | reads those declarations and provisions accordingly. Deployment became a
            # | build artifact, which also means the repo is now the single source of truth
            # | for what production looks like.
            explanation: "O mecanismo, descrito sem citar o marketing de ninguém: o seu repo já declara o framework dele, o comando de build e o diretório de saída; a plataforma lê essas declarações e provisiona de acordo. O deploy virou um artefato de build, o que também significa que o repo agora é a única fonte de verdade para como a produção é."  # @src=cbc4bc8b5c35
            options:                 # source order — keep it
              b:
                # | The CLI found your local dist/ folder from the last npm run build and
                # | uploaded those files directly, skipping any remote build step
                label: "A CLI achou a sua pasta dist/ local do último npm run build e subiu esses arquivos direto, pulando qualquer etapa de build remota"  # @src=be2b04e40222
                # | The build runs on Vercel's machines from your source, that's why a
                # | failing build surfaces in THEIR logs, and why git pushes can redeploy
                # | without your laptop.
                feedback: "O build roda nas máquinas do Vercel a partir do seu código-fonte, é por isso que um build que falha aparece nos logs DELES, e por que pushes de git conseguem fazer deploy de novo sem o seu laptop."  # @src=a3007594e2d2
              a:
                # | Vercel detected Vite, ran your build on its machines, and put the
                # | emitted dist/ on its CDN, configuration inferred from the repo
                label: "O Vercel detectou o Vite, rodou o seu build nas máquinas dele, e colocou o dist/ emitido no CDN dele, configuração inferida do repo"  # @src=8c338d8bab5e
                # | You configured plenty, just in package.json and vite.config.ts, and the
                # | platform read those files as the config. Deployment became a build
                # | artifact of the repo.
                feedback: "Você configurou bastante, só que em package.json e vite.config.ts, e a plataforma leu esses arquivos como a config. O deploy virou um artefato de build do repo."  # @src=5336224cdcd2
              d:
                # | Vercel cloned your repo on its side and built the default branch, so the
                # | deployment reflects main rather than your working copy
                label: "O Vercel clonou o seu repo do lado dele e fez o build do branch padrão, então o deploy reflete a main em vez da sua cópia de trabalho"  # @src=4a3db768dd5f
                # | Not on this first run: the CLI bundled your local source and sent it up,
                # | so an uncommitted edit would have shipped. Builds that start from a git
                # | clone begin once you connect the repo in the dashboard.
                feedback: "Não nesta primeira execução: a CLI empacotou o seu código-fonte local e mandou para cima, então uma edição não commitada teria sido entregue. Builds que começam de um clone de git só começam depois que você conecta o repo no painel."  # @src=34f5d623226e
              c:
                # | Vercel wrapped the app in a Node serverless function that renders each
                # | page on request, since a CDN alone cannot execute a Vite project
                label: "O Vercel embrulhou o app numa função serverless Node que renderiza cada página sob requisição, já que um CDN sozinho não consegue executar um projeto Vite"  # @src=34ccc5c5aa25
                # | A built Vite SPA is static files, no server runs per request. Functions
                # | exist on the platform, but this deployment used none.
                feedback: "Uma SPA Vite compilada é arquivos estáticos, nenhum servidor roda por requisição. Functions existem na plataforma, mas este deploy não usou nenhuma."  # @src=83efc4470a37
      check-hobby:                      # quiz
        questions:
          m03l3-q4:
            # | Your station gets popular and blows past Hobby's 100 GB Fast Data Transfer
            # | mid-month. Per the published overage model, what happens?
            prompt: "A sua estação fica popular e estoura os 100 GB de Fast Data Transfer do Hobby no meio do mês. Pelo modelo de excedente publicado, o que acontece?"  # @src=965050419037
            # | Pauses-not-bills is the property that makes Hobby a teaching platform: the
            # | worst case of success is downtime, never debt. Read against the station's
            # | actual traffic (a JSON file and a small bundle), 100 GB is enormous
            # | headroom, but knowing the failure mode BEFORE it fires is the operating
            # | habit this course keeps drilling.
            explanation: "Pausa-em-vez-de-cobrar é a propriedade que faz do Hobby uma plataforma de ensino: o pior caso do sucesso é downtime, nunca dívida. Lido contra o tráfego real da estação (um arquivo JSON e um bundle pequeno), 100 GB é uma margem enorme, mas conhecer o modo de falha ANTES de ele disparar é o hábito operacional que este curso não para de treinar."  # @src=db1b128ff06b
            options:                 # source order — keep it
              c:
                # | The account gets a 7-day grace period and is then suspended, with
                # | existing deployments taken offline until you upgrade to a paid plan
                label: "A conta ganha um período de carência de 7 dias e depois é suspensa, com os deploys existentes tirados do ar até você fazer upgrade para um plano pago"  # @src=205ee240fe08
                # | No suspension ladder, the documented behavior is a pause of the exceeded
                # | feature for the window, then normal service resumes.
                feedback: "Não existe escada de suspensão, o comportamento documentado é uma pausa da feature estourada durante a janela, e depois o serviço normal volta."  # @src=182651e4a2c5
              b:
                # | The feature pauses until the 30-day window passes (in most cases), Hobby
                # | has no billing cycle, so no surprise invoice can exist
                label: "A feature pausa até a janela de 30 dias passar (na maioria dos casos), o Hobby não tem ciclo de cobrança, então nenhuma fatura surpresa pode existir"  # @src=6d16079da6d6
                # | With no billing cycle there is nothing for an invoice to arrive on, so
                # | the worst case of going viral here is downtime rather than debt. Web
                # | Analytics is the documented exception, resuming after 7 days.
                feedback: "Sem ciclo de cobrança não existe em cima do que uma fatura chegar, então o pior caso de viralizar aqui é downtime em vez de dívida. Web Analytics é a exceção documentada, voltando depois de 7 dias."  # @src=028182c34694
              d:
                # | Requests past the cap typically start returning an error page until the
                # | counter resets on the first of the month
                label: "Requisições acima do teto tipicamente começam a devolver uma página de erro até o contador zerar no primeiro dia do mês"  # @src=b0ba36078db5
                # | Two details off. The window is a rolling 30 days, not the calendar
                # | month, and what stops is the exceeded feature itself, which pauses;
                # | nothing turns your traffic into a wall of error pages.
                feedback: "Dois detalhes errados. A janela é de 30 dias corridos, não o mês do calendário, e o que para é a própria feature estourada, que pausa; nada transforma o seu tráfego numa parede de páginas de erro."  # @src=aa1619969038
              a:
                # | Overage bills automatically at Pro's per-GB rates, the free tier's
                # | numbers are a threshold where metered billing starts, not a ceiling
                label: "O excedente é cobrado automaticamente nas taxas por GB do Pro, os números do tier gratuito são um limiar onde a cobrança medida começa, não um teto"  # @src=1399304a2c3d
                # | Hobby has no billing cycle at all, there's nothing to meter against.
                # | That's exactly what makes it safe to teach on.
                feedback: "O Hobby não tem ciclo de cobrança nenhum, não há nada contra o que medir. É exatamente isso que o torna seguro para ensinar em cima."  # @src=a9619ac9eae5
          m03l3-q5:
            # | Back in M1 the course insisted the station repo live on your PERSONAL GitHub
            # | account. This lesson is where that decision pays off. Why was it required?
            prompt: "Lá no M1 o curso insistiu que o repo da estação vivesse na sua conta PESSOAL do GitHub. Esta lição é onde aquela decisão se paga. Por que ela era obrigatória?"  # @src=44b72e60ec1e
            # | Three documented Hobby constraints compose here: no org-owned repos, no team
            # | collaboration (the compare table's dash), and non-commercial personal use.
            # | The course designed the station's shape around them in M1 so lesson ten's
            # | ship needs zero workarounds, that's what a free-tier-honest core path means.
            explanation: "Três restrições documentadas do Hobby se compõem aqui: nada de repos pertencentes a orgs, nada de colaboração em equipe (o traço na tabela de comparação), e uso pessoal não comercial. O curso desenhou o formato da estação em volta delas no M1 para que a entrega da lição dez precise de zero gambiarra, é isso que um caminho principal honesto com o tier gratuito significa."  # @src=5b5f7e69eab1
            options:                 # source order — keep it
              d:
                # | The Vercel app needs org-owner approval to connect an org repo, and a
                # | solo Hobby account cannot request that approval
                label: "O app do Vercel precisa da aprovação do dono da org para conectar um repo de org, e uma conta Hobby solo não consegue pedir essa aprovação"  # @src=11e0645cd190
                # | Approval is not the mechanism, the plan is: Hobby teams cannot connect
                # | org-owned repositories at all, so no amount of goodwill from an org
                # | admin opens that door.
                feedback: "A aprovação não é o mecanismo, o plano é: times Hobby não podem conectar repositórios pertencentes a orgs de jeito nenhum, então nenhuma quantidade de boa vontade de um admin de org abre essa porta."  # @src=ed25be958782
              b:
                # | Org repos default to private visibility, which would break the raw
                # | status.json fetch, personal accounts are the only place public repos
                # | exist
                label: "Repos de org têm visibilidade privada por padrão, o que quebraria o fetch raw do status.json, contas pessoais são o único lugar onde repos públicos existem"  # @src=82f45e29ba36
                # | Orgs host public repos happily, the public-repo requirement and the
                # | personal-repo requirement are two separate constraints that happen to
                # | compose.
                feedback: "Orgs hospedam repos públicos numa boa, o requisito de repo público e o requisito de repo pessoal são duas restrições separadas que por acaso se compõem."  # @src=b406a09f1fd4
              a:
                # | Vercel's build machines can only clone repos that share an owner name
                # | with the Vercel account, so personal-to-personal is the only link that
                # | authenticates
                label: "As máquinas de build do Vercel só conseguem clonar repos que compartilham o nome de dono com a conta Vercel, então pessoal-para-pessoal é a única ligação que autentica"  # @src=841f77410837
                # | The Git integration handles auth across owners fine on paid plans, the
                # | constraint is a Hobby plan rule, not an authentication mechanic.
                feedback: "A integração com Git lida com auth entre donos diferentes numa boa nos planos pagos, a restrição é uma regra do plano Hobby, não uma mecânica de autenticação."  # @src=06c27504b4d4
              c:
                # | Hobby teams cannot connect org-owned repositories, and Hobby is solo and
                # | non-commercial; the personal repo is the free path's shape
                label: "Times Hobby não podem conectar repositórios pertencentes a orgs, e o Hobby é solo e não comercial; o repo pessoal é o formato do caminho gratuito"  # @src=08d9346d0e4f
                # | Three documented constraints compose: non-commercial, solo, no org-owned
                # | repositories. M1 insisting on a personal public repo was this lesson
                # | reaching backwards so today's ship needs zero workarounds.
                feedback: "Três restrições documentadas se compõem: não comercial, solo, nada de repositórios pertencentes a orgs. O M1 insistindo num repo público pessoal foi esta lição alcançando para trás para que a entrega de hoje precise de zero gambiarra."  # @src=d8ed43adb331
          m03l3-q6:
            # | The board is one of three sibling projects in the station repo, alongside
            # | the fleet and the shared engine. How does Vercel deploy just the dashboard?
            prompt: "O painel é um de três projetos irmãos no repo da estação, ao lado da frota e do motor compartilhado. Como o Vercel faz deploy só do painel?"  # @src=f315f7110db1
            # | One project per deployable directory, selected via Root Directory at import
            # | and editable later in settings. The supporting requirements, a real
            # | workspace definition, unique package names, declared inter-package deps, are
            # | exactly the package.json hygiene m03-l1 taught, which is why the import Just
            # | Works.
            explanation: "Um projeto por diretório deployável, selecionado via Root Directory no import e editável depois nas configurações. Os requisitos de apoio, uma definição de workspace de verdade, nomes de pacote únicos, deps entre pacotes declaradas, são exatamente a higiene de package.json que m03-l1 ensinou, que é por que o import Simplesmente Funciona."  # @src=dfd999e5d92e
            options:                 # source order — keep it
              b:
                # | Move the dashboard to its own standalone repository first, monorepos
                # | aren't supported on the Git integration, only single-package repos
                # | deploy cleanly
                label: "Mova o painel para um repositório standalone próprio primeiro, monorepos não são suportados na integração com Git, só repos de pacote único fazem deploy limpo"  # @src=8c073c3dea12
                # | This was the course's contingency plan until the docs probe resolved it,
                # | Root Directory is the supported, documented monorepo path, and the
                # | fallback was never needed.
                feedback: "Este era o plano de contingência do curso até a sonda de docs resolver isso, Root Directory é o caminho de monorepo suportado e documentado, e o fallback nunca foi preciso."  # @src=87719fe679b8
              c:
                # | Add a vercel.json at the repo root enumerating every workspace package,
                # | so the platform builds all three and serves whichever emits an
                # | index.html
                label: "Acrescente um vercel.json na raiz do repo enumerando todo pacote do workspace, para que a plataforma faça o build dos três e sirva aquele que emitir um index.html"  # @src=783a2e55345f
                # | No root manifest enumerates packages, the model is one project pointed
                # | at one directory via a dashboard setting, not a build-everything sweep.
                feedback: "Nenhum manifest raiz enumera pacotes, o modelo é um projeto apontado para um diretório via uma configuração do painel, não uma varredura que constrói tudo."  # @src=5060630d8baf
              d:
                # | Vercel reads pnpm-workspace.yaml and picks the package that can deploy,
                # | the board being the sole one with an index.html
                label: "O Vercel lê o pnpm-workspace.yaml e escolhe o pacote que consegue fazer deploy, sendo o painel o único com um index.html"  # @src=c1df41bbc9ad
                # | Nothing introspects that file to choose a target; a human aims the
                # | project at one directory when importing it. What the workspace
                # | declarations buy is the build skip for untouched siblings.
                feedback: "Nada faz introspecção desse arquivo para escolher um alvo; um humano mira o projeto em um diretório na hora de importar. O que as declarações de workspace compram é o skip de build para irmãos não tocados."  # @src=7260b96705bb
              a:
                # | Set Root Directory to packages/pulse-board at import, one Vercel project
                # | per deployable directory; unaffected siblings get skipped
                label: "Defina Root Directory como packages/pulse-board no import, um projeto Vercel por diretório deployável; irmãos não afetados são pulados"  # @src=194c11fb6a92
                # | One project per deployable directory is the whole model. The workspace
                # | hygiene from m03-l1, real package names and declared inter-package deps,
                # | is what additionally earns the skipped builds.
                feedback: "Um projeto por diretório deployável é o modelo inteiro. A higiene de workspace de m03-l1, nomes de pacote de verdade e deps entre pacotes declaradas, é o que ainda garante os builds pulados."  # @src=b003ae9ddef0
  m03-l4:
    # | Publish something real: tsdown and the signs of a dying dep
    title: "Publique algo de verdade: tsdown e os sinais de uma dep morrendo"  # @src=a3187c9dd37b
    blocks:
      check:                      # quiz
        questions:
          m03l4-q1:
            # | Your npm pack --dry-run listing shows src/, tests/, and .env.example riding
            # | along with dist/. What's the verdict before publishing?
            prompt: "A sua listagem do npm pack --dry-run mostra src/, tests/ e .env.example pegando carona junto com dist/. Qual é o veredito antes de publicar?"  # @src=8fd215865be5
            # | The tarball IS the product: whatever npm pack lists is what every install
            # | delivers, forever (unpublishing is heavily restricted). The files field is
            # | the allowlist; the dry-run is the pre-flight read. Twenty seconds of reading
            # | the listing is the cheapest security-and-professionalism habit in this
            # | course.
            explanation: "O tarball É o produto: o que o npm pack listar é o que todo install entrega, para sempre (dar unpublish é fortemente restrito). O campo files é a allowlist; o dry-run é a leitura de pré-voo. Vinte segundos lendo a listagem é o hábito mais barato de segurança-e-profissionalismo deste curso."  # @src=f726cd7991a2
            options:                 # source order — keep it
              c:
                # | Keep src/ in deliberately, consumers need the original sources alongside
                # | dist/ for source maps and editor go-to-definition to resolve
                label: "Mantenha src/ de propósito, consumidores precisam dos fontes originais ao lado de dist/ para source maps e go-to-definition do editor resolverem"  # @src=4c57c3462232
                # | Shipping sources is a legitimate optional choice some packages make, but
                # | it's opt-in curation via the files field, not a requirement, and it
                # | never justifies test files or env samples in the tarball.
                feedback: "Entregar fontes é uma escolha opcional legítima que alguns pacotes fazem, mas é curadoria opt-in pelo campo files, não um requisito, e nunca justifica arquivos de teste ou amostras de env no tarball."  # @src=516398a2ed3b
              d:
                # | The exports map already hides everything but dist, so those unreachable
                # | files in the tarball are just dead weight and nothing worse than that
                label: "O mapa de exports já esconde tudo menos dist, então aqueles arquivos inalcançáveis no tarball são só peso morto e nada pior que isso"  # @src=2d7d01f598f3
                # | Two allowlists, two jobs: exports governs what a consumer can import,
                # | files governs what gets uploaded. An unimportable .env.example still
                # | lands on every machine that installs you, readable by anyone.
                feedback: "Duas allowlists, dois trabalhos: exports governa o que um consumidor pode importar, files governa o que é subido. Um .env.example não-importável ainda aterrissa em toda máquina que te instala, legível por qualquer um."  # @src=575f2afc0cee
              b:
                # | Fix the files field first, the contract is dist plus types plus
                # | package.json, and anything env-shaped near a tarball is a leak risk
                label: "Conserte o campo files primeiro, o contrato é dist mais types mais package.json, e qualquer coisa com cara de env perto de um tarball é risco de vazamento"  # @src=392c802b6e2b
                # | The tarball is the deliverable, and npm's unpublish policy makes it
                # | effectively permanent. Twenty seconds reading the dry-run listing is the
                # | cheapest professionalism habit in the course.
                feedback: "O tarball é o entregável, e a política de unpublish do npm o torna efetivamente permanente. Vinte segundos lendo a listagem do dry-run é o hábito mais barato de profissionalismo do curso."  # @src=e03b68497767
              a:
                # | Ship it, npm strips non-runtime files at install time, so the extra
                # | entries cost tarball bytes but never reach a consumer's node_modules
                label: "Entregue assim mesmo, o npm remove arquivos que não são de runtime na hora do install, então as entradas extras custam bytes de tarball mas nunca chegam ao node_modules de um consumidor"  # @src=9477c8135c7a
                # | npm strips nothing, the tarball is exactly what lands in every
                # | consumer's node_modules, droppings included.
                feedback: "O npm não remove nada, o tarball é exatamente o que aterrissa no node_modules de todo consumidor, sujeira incluída."  # @src=8b889eac6b8c
          m03l4-q2:
            # | A build tool you're evaluating has 8M weekly downloads, but its README opens
            # | with 'this project is not actively maintained anymore' and points at a
            # | successor. How do you weigh the signals?
            prompt: "Uma ferramenta de build que você está avaliando tem 8M de downloads semanais, mas o README dela abre com 'este projeto não é mais mantido ativamente' e aponta para um sucessor. Como você pesa os sinais?"  # @src=78fe74da2419
            # | The checklist's ranking: maintainer signals first (README notices, publish
            # | cadence), revealed ecosystem preferences second, raw popularity last. tsup
            # | is the worked case, huge downloads, honest abdication, active successor, and
            # | the correct read is 'migrate on your schedule, don't adopt fresh.' m09-l1
            # | turns this same read into a written audit verdict.
            explanation: "O ranking do checklist: sinais do mantenedor primeiro (avisos de README, cadência de publish), preferências reveladas do ecossistema em segundo, popularidade crua por último. O tsup é o caso trabalhado, downloads enormes, abdicação honesta, sucessor ativo, e a leitura correta é 'migre no seu cronograma, não adote do zero.' m09-l1 transforma essa mesma leitura num veredito de auditoria escrito."  # @src=ba0656c90f78
            options:                 # source order — keep it
              c:
                # | The README notice outranks the metrics, it's the maintainer's own words;
                # | verify with last-publish date and the successor's health, then plan
                # | around it
                label: "O aviso do README supera as métricas, são as palavras do próprio mantenedor; verifique com a data do último publish e a saúde do sucessor, depois planeje em volta disso"  # @src=6babf5feaa3a
                # | Downloads are a lagging indicator with years of inertia: tsup still
                # | out-downloads the successor it points at, ten months after its last
                # | release. The README is today's information.
                feedback: "Downloads são um indicador atrasado com anos de inércia: o tsup ainda tem mais downloads que o sucessor para o qual ele aponta, dez meses depois do último release dele. O README é a informação de hoje."  # @src=3d5c81047322
              d:
                # | Wait for the successor to out-download the original, since a migration
                # | is usually only safe once the two counts have crossed
                label: "Espere o sucessor passar o original em downloads, já que uma migração normalmente só é segura depois que as duas contagens se cruzaram"  # @src=326ef826bf5b
                # | Those counts cross years late, because every old lockfile and template
                # | keeps pulling the incumbent. Waiting for the graph means adopting a tool
                # | the day its replacement stops being new.
                feedback: "Essas contagens se cruzam anos atrasadas, porque todo lockfile e template antigo continua puxando o incumbente. Esperar o gráfico significa adotar uma ferramenta no dia em que a substituta dela para de ser nova."  # @src=7c5563dfa49a
              a:
                # | Downloads win, 8M weekly users means the ecosystem has effectively
                # | voted, and a README sentence is one maintainer's opinion against the
                # | market's
                label: "Downloads ganham, 8M de usuários semanais quer dizer que o ecossistema efetivamente votou, e uma frase de README é a opinião de um mantenedor contra a do mercado"  # @src=db0c1d578a1d
                # | Download counts are a lagging indicator with years of inertia, tsup
                # | still out-downloads tsdown while telling you to leave. The market voted
                # | years ago; the README is today's information.
                feedback: "Contagens de download são um indicador atrasado com anos de inércia, o tsup ainda tem mais downloads que o tsdown enquanto te diz para ir embora. O mercado votou anos atrás; o README é a informação de hoje."  # @src=43f2b5e2e5d7
              b:
                # | Wait for npm to apply the official deprecated flag, until the registry
                # | marks it, maintenance status is speculation and the package counts as
                # | supported
                label: "Espere o npm aplicar a flag oficial de deprecated, até o registro marcar isso, status de manutenção é especulação e o pacote conta como suportado"  # @src=f1592a41582f
                # | Many abandoned packages are never formally deprecated, the registry flag
                # | is one signal among several, and the maintainer's own note is a
                # | stronger, earlier one.
                feedback: "Muitos pacotes abandonados nunca são formalmente deprecados, a flag do registro é um sinal entre vários, e a nota do próprio mantenedor é um mais forte e mais cedo."  # @src=8eb1b7576810
          m03l4-q3:
            # | A consumer of your published package reports: the JS imports and runs, but
            # | TypeScript says 'Cannot find module @you/pulse-core'. What shipped wrong?
            prompt: "Um consumidor do seu pacote publicado reporta: o JS importa e roda, mas o TypeScript diz 'Cannot find module @you/pulse-core'. O que foi entregue errado?"  # @src=84db478918d6
            # | The dual concern from m03-l1's boundary lesson, now with real stakes: under
            # | nodenext-style resolution, TypeScript walks the exports map, top-level types
            # | alone isn't enough. tsdown emits both artifacts; your exports map decides
            # | whether they travel together. The scratch-project install proof exists to
            # | catch exactly this before a stranger does.
            explanation: "A dupla preocupação que m03-l1 trouxe na lição de fronteira, agora com apostas de verdade: sob resolução no estilo nodenext, o TypeScript percorre o mapa de exports, o types de topo sozinho não basta. O tsdown emite os dois artefatos; o seu mapa de exports decide se eles viajam juntos. A prova de install do projeto de rascunho existe para pegar exatamente isso antes que um estranho pegue."  # @src=4c71bd2de7d7
            options:                 # source order — keep it
              b:
                # | The consumer needs typescript declared as a peerDependency of your
                # | package so their compiler version is pinned to one that can read your
                # | declarations
                label: "O consumidor precisa de typescript declarado como peerDependency do seu pacote para a versão de compilador dele ficar fixada numa que consiga ler as suas declarações"  # @src=3afd28d9539c
                # | No package needs TS as a peer just to ship types, declaration files are
                # | inert data any TS version reads; the failure is resolution, not
                # | versioning.
                feedback: "Nenhum pacote precisa de TS como peer só para entregar tipos, arquivos de declaração são dados inertes que qualquer versão de TS lê; a falha é de resolução, não de versionamento."  # @src=68623dded40d
              c:
                # | Scoped packages need a matching @types/pulse-core package published to
                # | DefinitelyTyped before editors will pick their declarations up
                label: "Pacotes com escopo precisam de um pacote @types/pulse-core correspondente publicado no DefinitelyTyped antes de os editores pegarem as declarações deles"  # @src=b4c0ae4756aa
                # | DefinitelyTyped exists for packages that DON'T ship their own types, a
                # | package bundling its d.ts needs only correct wiring, no external types
                # | package.
                feedback: "O DefinitelyTyped existe para pacotes que NÃO entregam os próprios tipos, um pacote que empacota o d.ts dele precisa só de fiação correta, nenhum pacote externo de types."  # @src=cf325a388836
              d:
                # | The top-level types field is missing, and that entry is where TypeScript
                # | resolves declarations from before it ever reads an exports map
                label: "O campo types de topo está faltando, e é dessa entrada que o TypeScript resolve declarações antes de sequer ler um mapa de exports"  # @src=885dbc2f3fab
                # | That field is the pre-exports spelling, and it is what a consumer on an
                # | older resolution mode would read. Once an exports map exists, it
                # | governs, and the types condition inside it is the entry that counts.
                feedback: "Esse campo é a grafia pré-exports, e é o que um consumidor num modo de resolução mais antigo leria. Uma vez que um mapa de exports existe, ele governa, e a condição types dentro dele é a entrada que conta."  # @src=e8f60b337978
              a:
                # | The exports map is missing its types condition, modern TS resolves
                # | through exports, so the .d.ts entry must sit beside the JS entry it
                # | describes
                label: "O mapa de exports está sem a condição types dele, o TS moderno resolve através de exports, então a entrada .d.ts tem que ficar ao lado da entrada JS que ela descreve"  # @src=2fb640cd35a7
                # | Two resolvers, one map: Node walks exports for the JavaScript and
                # | TypeScript walks the same map for the types. A declaration file the map
                # | does not expose might as well not be in the tarball.
                feedback: "Dois resolvedores, um mapa: o Node percorre exports para o JavaScript e o TypeScript percorre o mesmo mapa para os tipos. Um arquivo de declaração que o mapa não expõe poderia muito bem não estar no tarball."  # @src=9abdde4d1248
          m03l4-q4:
            # | Tier-gate check: after M3 you want to get seriously good at type-level
            # | programming, conditional types, mapped types, the wizardry. Per the course's
            # | map, what's the honest route?
            prompt: "Checagem da trava do tier: depois do M3 você quer ficar seriamente bom em programação em nível de tipos, tipos condicionais, tipos mapeados, a bruxaria. Pelo mapa do curso, qual é a rota honesta?"  # @src=1d078787d182
            # | The tier-gate is the 80/20 contract kept honestly: unions, narrowing, zod,
            # | async discipline, packages, taught. Type-level programming, full tsconfig
            # | breadth, Bun/Deno, deep React, bookmarked, each with a named home. The map
            # | you got in m01-l1 just gained its first 'you are here' pin: TS-strong, with
            # | the 20% locations memorized.
            explanation: "A trava do tier é o contrato 80/20 cumprido com honestidade: uniões, narrowing, zod, disciplina de async, pacotes, ensinados. Programação em nível de tipos, a largura completa do tsconfig, Bun/Deno, React profundo, deixados como bookmark, cada um com uma casa nomeada. O mapa que você ganhou em m01-l1 acabou de ganhar o primeiro pin de 'você está aqui': forte em TS, com as localizações dos 20% decoradas."  # @src=e0d3bdbbff95
            options:                 # source order — keep it
              d:
                # | M7's edge lesson returns to TypeScript depth, so the conditional and
                # | mapped type material lands there once the workers need it
                label: "A lição de edge do M7 volta à profundidade de TypeScript, então o material de tipos condicionais e mapeados aterrissa lá quando os workers precisarem"  # @src=1e74c4b9fcdc
                # | The TypeScript tier ends here; M7 spends its TypeScript on an edge
                # | runtime, not on the type system. Nothing later in the course reopens
                # | type-level authoring, which is why the gate hands you the drill yard
                # | instead.
                feedback: "O tier de TypeScript acaba aqui; o M7 gasta o TypeScript dele num runtime de edge, não no sistema de tipos. Nada depois no curso reabre a autoria em nível de tipos, que é por que a trava te entrega o pátio de treino no lugar."  # @src=1a1a4fb2ed0b
              c:
                # | Hold off until you've finished the client-side mastery course, serious
                # | client work demands type-level fluency, so that layer has to be taught
                # | there first
                label: "Segure até você terminar o curso de maestria do lado cliente, trabalho sério de cliente exige fluência em nível de tipos, então essa camada tem que ser ensinada lá primeiro"  # @src=acd6dfa9d89c
                # | Nothing in the map routes type-level programming through the client-side
                # | course; its territory is wallet UX and transaction landing, and the
                # | wizardry is bookmarked self-serve: type-challenges plus the Handbook's
                # | generics material.
                feedback: "Nada no mapa roteia programação em nível de tipos pelo curso de lado cliente; o território dele é UX de carteira e aterrissagem de transação, e a bruxaria fica como bookmark self-serve: type-challenges mais o material de generics do Handbook."  # @src=d753b5160c0e
              b:
                # | That's the bookmarked 20%, type-challenges plus the Handbook's generics
                # | material; this course taught the daily layer and where the rest lives
                label: "Esses são os 20% deixados como bookmark, type-challenges mais o material de generics do Handbook; este curso ensinou a camada do dia a dia e onde o resto mora"  # @src=42030e6fb7d4
                # | The 20% was never missing, it was filed. The tier gate names an address
                # | and a trigger for each piece, and this one's trigger is a library
                # | signature making you curious rather than tired.
                feedback: "Os 20% nunca estiveram faltando, eles estavam arquivados. A trava do tier nomeia um endereço e um trigger para cada peça, e o trigger desta é uma assinatura de biblioteca te deixando curioso em vez de cansado."  # @src=812fd326080d
              a:
                # | Re-do m02-l2, the generics beat there covers the type-level toolkit, and
                # | the advanced patterns fall out of z.infer once it clicks
                label: "Refaça m02-l2, a batida de genéricos de lá cobre o kit de nível de tipos, e os padrões avançados caem do z.infer quando ele fizer sentido"  # @src=ae06391f8f5d
                # | m02-l2 deliberately taught generics-you-CONSUME (schemas, z.infer,
                # | satisfies), authoring type-level machinery was explicitly left out of
                # | the 80%.
                feedback: "m02-l2 ensinou deliberadamente genéricos-que-você-CONSOME (schemas, z.infer, satisfies), autorar maquinaria de nível de tipos foi explicitamente deixado de fora dos 80%."  # @src=5eeca2513343
  m04-l1:
    # | Ownership is the point
    title: "Ownership é o ponto"  # @src=f15ad82aef00
    blocks:
      fix-the-borrow:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The error is E0382: use of moved value. The FIRST call consumed the Vec.
          0: "O erro é E0382: use of moved value. A PRIMEIRA chamada consumiu o Vec."  # @src=5058f95ef5b5
          # | Change both helper signatures from Vec<u64> to &[u64]; a &Vec<u64> coerces to
          # | &[u64] automatically.
          1: "Mude as duas assinaturas dos helpers de Vec<u64> para &[u64]; um &Vec<u64> é coagido para &[u64] automaticamente."  # @src=1ebeda4d6d5b
          # | At the call sites, pass &latencies. Iterating a slice gives you &u64,
          # | destructure with `for &l in`.
          2: "Nos pontos de chamada, passe &latencies. Iterar um slice te dá &u64, desestruture com `for &l in`."  # @src=51946b8cc302
        tests:                      # keyed by test case id
          t1:
            # | one slow target: max is 930ms and only it crosses the 500ms threshold
            description: "um alvo lento: o max é 930ms e só ele cruza o limiar de 500ms"  # @src=b93768bcb7fc
          t2:
            # | a healthy fleet with one probe over the line
            description: "uma frota saudável com uma sonda acima da linha"  # @src=aca5630a1122
          t3:
            # | everything is slow: all three latencies exceed the threshold
            description: "tudo está lento: as três latências excedem o limiar"  # @src=fab10057dc4b
          t4:
            # | an empty fixture list reports max=0 and zero over
            description: "uma lista de fixture vazia reporta max=0 e over zero"  # @src=6d6673a03c75
          t5:
            # | over counts STRICTLY greater, exactly-at-threshold does not count
            description: "over conta ESTRITAMENTE maior, exatamente-no-limiar não conta"  # @src=8b93bcca7633
      check:                      # quiz
        questions:
          m04l1-q1:
            # | You wrote `let fleet = targets;` and then called `classify(targets)` two
            # | lines later. The compiler rejects it with E0382: use of moved value. What is
            # | it actually telling you?
            prompt: "Você escreveu `let fleet = targets;` e aí chamou `classify(targets)` duas linhas depois. O compilador rejeita isso com E0382: use of moved value. O que ele está de fato te dizendo?"  # @src=5978be0d430d
            # | A move transfers ownership: exactly one binding is responsible for the
            # | value's cleanup and mutation at any time. The compiler ends the old
            # | binding's access so 'who owns this?' always has one answer.
            explanation: "Um move transfere o ownership: exatamente um binding é responsável pela limpeza e pela mutação do valor a qualquer momento. O compilador encerra o acesso do binding antigo para que 'quem é o dono disso?' sempre tenha uma resposta só."  # @src=8c06bbeabc82
            options:                 # source order — keep it
              d:
                # | The binding was not declared mut, so moving it into `fleet` consumed it;
                # | a `let mut targets` would keep both names usable
                label: "O binding não foi declarado mut, então mover ele para dentro de `fleet` consumiu ele; um `let mut targets` manteria os dois nomes utilizáveis"  # @src=964fe727c440
                # | mut decides whether a binding can be changed, not who owns the value.
                # | Add it and the move happens identically, because both names would still
                # | be claiming one allocation.
                feedback: "mut decide se um binding pode ser mudado, não quem é o dono do valor. Adicione ele e o move acontece de forma idêntica, porque os dois nomes ainda estariam reivindicando uma alocação só."  # @src=95d4b0a319d1
              b:
                # | The Vec's memory was already freed at the move, so using `targets` would
                # | read dangling memory the runtime has not collected yet
                label: "A memória do Vec já tinha sido liberada no move, então usar `targets` leria memória solta que o runtime ainda não coletou"  # @src=279782b2c7f7
                # | Nothing is freed at the move, the data is alive and owned by `fleet`.
                # | The rejection is about ambiguous ownership, not dangling memory.
                feedback: "Nada é liberado no move, os dados estão vivos e `fleet` é o dono deles. A rejeição é sobre ownership ambíguo, não sobre memória solta."  # @src=5688861226a0
              c:
                # | Vec is not a Copy type, so Rust requires you to call .clone() before
                # | every function call that takes one by value
                label: "Vec não é um tipo Copy, então o Rust exige que você chame .clone() antes de toda chamada de função que recebe um por valor"  # @src=7ffbf6c5b23d
                # | Clone is one escape hatch, not a requirement, borrowing with & is the
                # | idiomatic fix, and this lesson's challenge forbids the clone dodge.
                feedback: "Clone é uma saída de emergência, não uma exigência, pegar emprestado com & é o conserto idiomático, e o challenge desta lição proíbe o desvio pelo clone."  # @src=edc9b07e9fcf
              a:
                # | Ownership of the Vec moved to `fleet`; two live owners would make
                # | cleanup ambiguous, so the old binding's access ended
                label: "O ownership do Vec se moveu para `fleet`; dois donos vivos deixariam a limpeza ambígua, então o acesso do binding antigo acabou"  # @src=7615d05eacfc
                # | The data is alive and well under its new name. What ended is your old
                # | one, because two bindings believing they own one allocation is exactly
                # | the ambiguity the rule exists to delete.
                feedback: "Os dados estão vivos e bem sob o nome novo deles. O que acabou foi o seu antigo, porque dois bindings acreditando que são donos de uma alocação só é exatamente a ambiguidade que a regra existe para apagar."  # @src=d2a3f354d69c
          m04l1-q2:
            # | A teammate from your TS module asks: 'Why does Rust make this a compile-time
            # | fight instead of just running a garbage collector like Node does?' The
            # | honest answer:
            prompt: "Um colega de time do seu módulo de TS pergunta: 'Por que o Rust faz disso uma briga em tempo de compilação em vez de só rodar um garbage collector como o Node faz?' A resposta honesta:"  # @src=9bd4c97e19eb
            # | The trade is explicit: Rust moves the memory-management work from a runtime
            # | collector to compile-time rules. You pay in borrow-checker friction; you get
            # | deterministic frees, no GC pauses, and whole bug classes (use-after-free,
            # | data races) rejected before the program exists.
            explanation: "O trade-off é explícito: o Rust move o trabalho de gerenciamento de memória de um coletor em tempo de execução para regras em tempo de compilação. Você paga em atrito com o borrow checker; você ganha liberações determinísticas, zero pausas de GC, e classes inteiras de bug (use-after-free, data races) rejeitadas antes de o programa existir."  # @src=d653081bec97
            options:                 # source order — keep it
              d:
                # | It runs the collector's work at compile time, tracing which values are
                # | still reachable and freeing the rest
                label: "Ele roda o trabalho do coletor em tempo de compilação, rastreando quais valores ainda são alcançáveis e liberando o resto"  # @src=fdc483e7b02a
                # | No reachability is traced anywhere. The compiler frees a value where its
                # | owner leaves scope, which is why you can point at the line, and why
                # | ownership is a discipline rather than an early GC.
                feedback: "Nenhuma alcançabilidade é rastreada em lugar nenhum. O compilador libera um valor onde o dono dele deixa o escopo, que é por que você consegue apontar para a linha, e por que ownership é uma disciplina e não um GC adiantado."  # @src=f398f415d77a
              b:
                # | Ownership gives deterministic cleanup and rules out data races and
                # | aliasing bugs at compile time, with no runtime paying for it
                label: "Ownership dá limpeza determinística e descarta data races e bugs de aliasing em tempo de compilação, sem nenhum runtime pagando por isso"  # @src=5062435ac6b5
                # | Cleanup lands at a line you can point to, and the
                # | one-writer-XOR-many-readers rule that saves a reference from a
                # | reallocated buffer is the data-race rule wearing single-threaded
                # | clothes.
                feedback: "A limpeza cai numa linha para a qual você consegue apontar, e a regra um-escritor-XOR-muitos-leitores que salva uma referência de um buffer realocado é a regra de data race vestida de single-thread."  # @src=56d22dee25b6
              c:
                # | Rust programs cannot detect unreachable objects at runtime, so static
                # | ownership rules are the only memory strategy available to it
                label: "Programas Rust não conseguem detectar objetos inalcançáveis em tempo de execução, então regras estáticas de ownership são a única estratégia de memória disponível para ele"  # @src=83ef555d3c34
                # | Runtime GC for Rust is possible in principle (and Rc/Arc exist),
                # | ownership is a design choice for zero-cost, deterministic safety, not a
                # | workaround for a missing capability.
                feedback: "GC em tempo de execução para Rust é possível em princípio (e Rc/Arc existem), ownership é uma escolha de design por segurança determinística e de custo zero, não um contorno para uma capacidade que falta."  # @src=6bd3f935824b
              a:
                # | GC pauses are unacceptable on blockchains, so Rust forbids heap
                # | allocation and keeps every value on the stack instead
                label: "Pausas de GC são inaceitáveis em blockchains, então o Rust proíbe alocação na heap e mantém todo valor na stack em vez disso"  # @src=5fb6ac8d6ab4
                # | Rust heap-allocates freely (Vec, String, Box). Ownership governs WHO
                # | frees the heap, it does not forbid using it.
                feedback: "O Rust aloca na heap livremente (Vec, String, Box). Ownership governa QUEM libera a heap, não proíbe usar ela."  # @src=6936de291245
          m04l1-q3:
            # | You hold `let worst = &latencies[0];` and three lines later, while `worst`
            # | is still used, you call `latencies.push(next)`. The compiler refuses. Which
            # | rule fired?
            prompt: "Você segura `let worst = &latencies[0];` e três linhas depois, enquanto `worst` ainda é usado, você chama `latencies.push(next)`. O compilador recusa. Qual regra disparou?"  # @src=547f20312cbc
            # | Aliasing XOR mutation: push can reallocate the Vec's buffer, which would
            # | leave `worst` dangling. The checker sees a live reader and a would-be writer
            # | overlapping and rejects the ambiguity, this is the data-race rule in
            # | single-threaded clothing.
            explanation: "Aliasing XOR mutação: push pode realocar o buffer do Vec, o que deixaria `worst` solto. O verificador vê um leitor vivo e um pretendente a escritor se sobrepondo e rejeita a ambiguidade, esta é a regra de data race com roupa de single-thread."  # @src=b68e0956e3f8
            options:                 # source order — keep it
              a:
                # | Only one reference of any kind may exist at a time, so the shared borrow
                # | must be dropped before anything else touches the Vec
                label: "Só uma referência de qualquer tipo pode existir por vez, então o borrow compartilhado tem que ser descartado antes de qualquer outra coisa tocar o Vec"  # @src=7d5e75b1a4d6
                # | Many SHARED borrows may coexist happily, the rule only forbids mixing
                # | readers with a writer, not having several readers.
                feedback: "Muitos borrows COMPARTILHADOS podem coexistir felizes, a regra só proíbe misturar leitores com um escritor, não ter vários leitores."  # @src=3b240ab55f6f
              c:
                # | Many shared readers OR one exclusive writer, never both: push needs &mut
                # | self while your shared & is still live
                label: "Muitos leitores compartilhados OU um escritor exclusivo, nunca os dois: push precisa de &mut self enquanto o seu & compartilhado ainda está vivo"  # @src=3ce87b7edd43
                # | push takes &mut self and your shared borrow is still live, so reader and
                # | writer overlap. A push can reallocate the buffer, which would leave
                # | `worst` pointing at memory nobody owns.
                feedback: "push recebe &mut self e o seu borrow compartilhado ainda está vivo, então leitor e escritor se sobrepõem. Um push pode realocar o buffer, o que deixaria `worst` apontando para memória de que ninguém é dono."  # @src=741148bf109d
              b:
                # | A Vec becomes read-only forever once any reference to its contents has
                # | been taken anywhere in the program
                label: "Um Vec vira somente leitura para sempre assim que qualquer referência ao conteúdo dele for tomada em qualquer lugar do programa"  # @src=1b8cc89a4b0b
                # | Borrows have scopes, once the last use of `worst` passes, the Vec is
                # | fully mutable again. Nothing is permanent.
                feedback: "Borrows têm escopos, assim que o último uso de `worst` passa, o Vec volta a ser totalmente mutável. Nada é permanente."  # @src=8cbe69fdc14a
              d:
                # | The shared borrow is too weak, `worst` has to be a &mut so it and the
                # | push share one exclusive handle
                label: "O borrow compartilhado é fraco demais, `worst` tem que ser um &mut para que ele e o push compartilhem um handle exclusivo"  # @src=ae64aa23a842
                # | Two exclusive borrows of one Vec is the stricter error, not the fix.
                # | Borrows have scopes: let the read finish before the write begins and
                # | this compiles with the shared borrow exactly as written.
                feedback: "Dois borrows exclusivos de um Vec é o erro mais rígido, não o conserto. Borrows têm escopos: deixe a leitura terminar antes de a escrita começar e isso compila com o borrow compartilhado exatamente como está escrito."  # @src=c4989974564d
          m04l1-q4:
            # | Fresh install day: rustup is in, `cargo new pulse-rs` worked. Which tool
            # | from the lesson's toolchain tour is NOT available on your stable toolchain?
            prompt: "Dia de instalação nova: o rustup está aí, `cargo new pulse-rs` funcionou. Qual ferramenta do passeio pelo toolchain da lição NÃO está disponível no seu toolchain stable?"  # @src=2c6013586fa7
            # | The stable box holds clippy, rustfmt, and rust-analyzer; miri is the one
            # | honesty-note exception (nightly-only). Knowing what is in the box stops you
            # | from installing third-party substitutes for tools you already have.
            explanation: "A caixa stable guarda clippy, rustfmt e rust-analyzer; o miri é a única exceção da nota de honestidade (só nightly). Saber o que está na caixa te impede de instalar substitutos de terceiros para ferramentas que você já tem."  # @src=d883fac90cb3
            options:                 # source order — keep it
              a:
                # | miri, it is nightly-only; clippy, rustfmt, and rust-analyzer all ship as
                # | components of the stable channel
                label: "miri, ele é só nightly; clippy, rustfmt e rust-analyzer todos vêm como componentes do canal stable"  # @src=59b88563bcb2
                # | The stable box is fuller than the myths suggest: clippy and rustfmt
                # | arrive with the default profile, rust-analyzer is one rustup component
                # | add away. miri is the one that genuinely needs nightly.
                feedback: "A caixa stable é mais cheia do que os mitos sugerem: clippy e rustfmt chegam com o perfil default, rust-analyzer está a um rustup component add de distância. miri é o que genuinamente precisa do nightly."  # @src=2963042928ec
              d:
                # | rustfmt, formatting comes from a separate cargo install, because rustup
                # | itself ships only rustc and cargo binaries
                label: "rustfmt, a formatação vem de um cargo install separado, porque o próprio rustup só traz os binários rustc e cargo"  # @src=81ddb6fcea45
                # | rustfmt lands with the default rustup profile, so cargo fmt works on day
                # | one. Reaching for cargo install here is how people end up with a
                # | third-party substitute for a first-party tool they own.
                feedback: "rustfmt cai com o perfil default do rustup, então cargo fmt funciona no dia um. Apelar para cargo install aqui é como as pessoas acabam com um substituto de terceiros para uma ferramenta de primeira mão que elas já têm."  # @src=0f7e2a3ad83f
              b:
                # | rust-analyzer, the IDE engine is a separate editor-marketplace product
                # | and is not distributed as a rustup component at all
                label: "rust-analyzer, o motor de IDE é um produto separado de marketplace de editor e não é distribuído como componente rustup de jeito nenhum"  # @src=40307d461e74
                # | rust-analyzer IS a rustup component of the stable channel (your editor
                # | may bundle its own copy, but stable ships it).
                feedback: "rust-analyzer É um componente rustup do canal stable (o seu editor pode empacotar a própria cópia, mas o stable vem com ele)."  # @src=09937a31bb03
              c:
                # | clippy, lints land on nightly first and each lint only reaches the
                # | stable channel one full release train later
                label: "clippy, lints caem no nightly primeiro e cada lint só chega ao canal stable um trem de release inteiro depois"  # @src=e301d0cf773a
                # | clippy ships in the stable box, current and ready, `cargo clippy` works
                # | on day one of a stable install.
                feedback: "clippy vem na caixa stable, atual e pronto, `cargo clippy` funciona no dia um de uma instalação stable."  # @src=e54b601b9765
  m04-l2:
    # | Errors are values: Result, ?, and the two-crate canon
    title: "Erros são valores: Result, ? e o cânone de dois crates"  # @src=4a80731c254e
    blocks:
      check:                      # quiz
        questions:
          m04l2-q1:
            # | Your probe parser now returns Result<LatencyMs, ProbeError>, and the caller
            # | ends the line with `?`. When the parser returns an Err, what does `?`
            # | actually do?
            prompt: "O seu parser de sonda agora retorna Result<LatencyMs, ProbeError>, e o chamador termina a linha com `?`. Quando o parser retorna um Err, o que o `?` faz de verdade?"  # @src=e5c266dfd5a4
            # | ? is early-return with taste: on Ok it unwraps the value in place; on Err it
            # | returns the error from the enclosing function, running it through From so a
            # | foreign error can become YOUR error type. That From hop is why ? chains
            # | compose across library boundaries.
            explanation: "? é retorno antecipado com bom gosto: no Ok ele faz unwrap do valor ali mesmo; no Err ele retorna o erro da função envolvente, passando ele pelo From para que um erro estrangeiro possa virar o SEU tipo de erro. Esse pulo do From é por que cadeias de ? compõem entre fronteiras de biblioteca."  # @src=9274cc68dbf6
            options:                 # source order — keep it
              a:
                # | It panics with the error's Display message so the failure is visible
                # | immediately at the exact line that produced it
                label: "Ele dá panic com a mensagem Display do erro para que a falha fique visível imediatamente na linha exata que a produziu"  # @src=bddc3a7da870
                # | That's unwrap's behavior, not ?. The whole point of ? is propagation
                # | without crashing.
                feedback: "Esse é o comportamento do unwrap, não do ?. O ponto inteiro do ? é propagação sem dar crash."  # @src=14a84b3c2500
              d:
                # | It returns the Err straight up to main, past every caller in between,
                # | the way a thrown exception would
                label: "Ele retorna o Err direto para o main, passando por cima de todo chamador no meio do caminho, do jeito que uma exceção lançada faria"  # @src=81683305341a
                # | It returns from the enclosing function and no further. Each frame that
                # | wants to keep passing the error up needs its own ?, which is why the
                # | failure stays visible in every signature it crosses.
                feedback: "Ele retorna da função envolvente e não vai além. Cada frame que quiser continuar passando o erro para cima precisa do próprio ?, que é por isso que a falha continua visível em toda assinatura que ela atravessa."  # @src=985ee0565077
              b:
                # | It early-returns the Err from the current function, converting it via
                # | From into the caller's error type
                label: "Ele retorna antecipadamente o Err da função atual, convertendo ele via From para o tipo de erro do chamador"  # @src=52a0e057e641
                # | Early return on the error lane, happy path left flat. The From hop is
                # | what lets a foreign error like ParseIntError become your ProbeError, and
                # | it is also what the E0277 wall complains about when no conversion
                # | exists.
                feedback: "Retorno antecipado na pista de erro, caminho feliz deixado plano. O pulo do From é o que deixa um erro estrangeiro como ParseIntError virar o seu ProbeError, e é também sobre isso que o muro E0277 reclama quando não existe conversão."  # @src=20937a3b8026
              c:
                # | It logs the error to stderr and substitutes the value type's Default so
                # | the current function can keep executing
                label: "Ele loga o erro no stderr e substitui pelo Default do tipo do valor para que a função atual possa continuar executando"  # @src=4d3fbf4aac83
                # | ? never fabricates a value or logs anything, execution of the current
                # | function STOPS and the error travels up as the return value.
                feedback: "? nunca fabrica um valor nem loga nada, a execução da função atual PARA e o erro viaja para cima como o valor de retorno."  # @src=7189dbb5a3af
          m04l2-q2:
            # | pulse-rs is now an engine module used by a main binary. Where do thiserror
            # | and anyhow each belong, per the canon the surveyed Solana repos actually
            # | run?
            prompt: "O pulse-rs agora é um módulo de motor usado por um binário main. Onde pertence cada um, thiserror e anyhow, segundo o cânone que os repos de Solana pesquisados realmente rodam?"  # @src=c52d5f608b05
            # | Libraries owe their callers TYPES (thiserror-derived enums you can match
            # | on); binaries owe their operators MESSAGES (anyhow with context). agave and
            # | yellowstone run thiserror 2.x today while photon and jito-relayer sit on
            # | 1.x, the split itself is a read-your-ecosystem lesson.
            explanation: "Bibliotecas devem TIPOS aos chamadores delas (enums derivados por thiserror nos quais você consegue dar match); binários devem MENSAGENS aos operadores deles (anyhow com context). agave e yellowstone rodam thiserror 2.x hoje enquanto photon e jito-relayer ficam no 1.x, a divisão em si é uma lição de leia-o-seu-ecossistema."  # @src=062558b4eb53
            options:                 # source order — keep it
              d:
                # | anyhow in both halves, with .context() breadcrumbs everywhere; typed
                # | error variants are for published crates only
                label: "anyhow nas duas metades, com migalhas de .context() em todo lugar; variantes de erro tipadas são só para crates publicados"  # @src=0c802231f391
                # | It compiles and feels convenient, which is what makes it the common
                # | mistake: anyhow erases the type information a caller needs to match on,
                # | and your own binary is a caller of your engine today.
                feedback: "Compila e parece conveniente, que é o que faz disso o erro comum: anyhow apaga a informação de tipo em que um chamador precisa dar match, e o seu próprio binário é um chamador do seu motor hoje."  # @src=209242d4b040
              b:
                # | thiserror everywhere: since the 2.x line shipped, anyhow is deprecated
                # | and its context API was absorbed into thiserror's derive
                label: "thiserror em todo lugar: desde que a linha 2.x foi entregue, anyhow está descontinuado e a API de context dele foi absorvida pelo derive do thiserror"  # @src=88464857c892
                # | Nothing was absorbed or deprecated, anyhow 1.x is alive, universal in
                # | the surveyed repos, and solves a different half of the problem than
                # | thiserror.
                feedback: "Nada foi absorvido nem descontinuado, anyhow 1.x está vivo, universal nos repos pesquisados, e resolve uma metade diferente do problema que o thiserror."  # @src=4d5517115cbe
              a:
                # | anyhow in the engine so callers get flexible, contextual errors;
                # | thiserror in the binary where exact variants map to exit codes
                label: "anyhow no motor para que os chamadores recebam erros flexíveis e contextuais; thiserror no binário onde variantes exatas mapeiam para códigos de saída"  # @src=9a0d06b57f4a
                # | This is the canon inverted, anyhow in a library ERASES the variants your
                # | callers need to match on; the binary is where matching stops mattering.
                feedback: "Este é o cânone invertido, anyhow numa biblioteca APAGA as variantes em que os seus chamadores precisam dar match; o binário é onde dar match deixa de importar."  # @src=e7f5a5d4f9be
              c:
                # | thiserror derives the engine's typed error enum for callers to match;
                # | anyhow::Result in the reporting binary
                label: "thiserror deriva o enum de erro tipado do motor para os chamadores darem match; anyhow::Result no binário que reporta"  # @src=a3d63e06717f
                # | The split follows from who reads the error: code matches on variants,
                # | humans read a context chain. agave and yellowstone-grpc run thiserror
                # | 2.x, photon and jito-relayer 1.x, with anyhow riding along across all of
                # | them.
                feedback: "A divisão decorre de quem lê o erro: código dá match em variantes, humanos leem uma cadeia de contexto. agave e yellowstone-grpc rodam thiserror 2.x, photon e jito-relayer 1.x, com anyhow pegando carona em todos eles."  # @src=3bc626d78cd0
          m04l2-q3:
            # | parse_latency returns Result<u64, ParseIntError> but your function returns
            # | Result<u64, ProbeError>, so you write `.map_err(|e|
            # | ProbeError::BadFixture(e))`. What IS the `|e| ...` you just wrote?
            prompt: "parse_latency retorna Result<u64, ParseIntError> mas a sua função retorna Result<u64, ProbeError>, então você escreve `.map_err(|e| ProbeError::BadFixture(e))`. O que É o `|e| ...` que você acabou de escrever?"  # @src=9af17165a19f
            # | This is your first closure, and it's the most common first closure in real
            # | Rust: a tiny anonymous function that converts one error type into another so
            # | ? can keep flowing. Iterator chains, closures' other home, arrive in m05-l1;
            # | the full treatment is TRPL ch13.
            explanation: "Esta é a sua primeira closure, e é a primeira closure mais comum em Rust de verdade: uma função anônima minúscula que converte um tipo de erro em outro para que o ? possa continuar fluindo. Cadeias de iteradores, a outra casa das closures, chegam em m05-l1; o tratamento completo é o TRPL ch13."  # @src=8b26b10a03c8
            options:                 # source order — keep it
              c:
                # | A lifetime annotation, the |e| binding ties the returned error to the
                # | fixture buffer it was originally parsed from
                label: "Uma anotação de lifetime, o binding |e| amarra o erro retornado ao buffer de fixture de onde ele foi parseado originalmente"  # @src=4d1b9833e506
                # | Lifetime syntax uses <'a> in signatures; |e| declares a closure
                # | parameter. Nothing here borrows from the fixture buffer.
                feedback: "Sintaxe de lifetime usa <'a> em assinaturas; |e| declara um parâmetro de closure. Nada aqui pega emprestado do buffer de fixture."  # @src=1fcc556e8515
              b:
                # | A macro invocation, the |..| syntax expands at compile time to rewrite
                # | the Err variant's type in the function signature
                label: "Uma invocação de macro, a sintaxe |..| expande em tempo de compilação para reescrever o tipo da variante Err na assinatura da função"  # @src=96518f6c715a
                # | No macro is involved, |e| is closure syntax, an ordinary runtime value
                # | passed to map_err like any argument.
                feedback: "Nenhuma macro está envolvida, |e| é sintaxe de closure, um valor comum em tempo de execução passado para map_err como qualquer argumento."  # @src=ab169867e6b3
              d:
                # | A match pattern, where the pipes let one arm accept either of the error
                # | types parse_latency returns
                label: "Um padrão de match, onde os pipes deixam um braço aceitar qualquer um dos tipos de erro que parse_latency retorna"  # @src=a7b87ef2e589
                # | Match arms do use a pipe for or-patterns, which is why the syntax looks
                # | familiar, but there is no match here and parse_latency has exactly one
                # | error type. Between the pipes is a parameter list.
                feedback: "Braços de match de fato usam um pipe para or-patterns, que é por isso que a sintaxe parece familiar, mas não existe match aqui e parse_latency tem exatamente um tipo de erro. Entre os pipes está uma lista de parâmetros."  # @src=8218b9a3146a
              a:
                # | A closure, an anonymous function, able to capture from its scope, handed
                # | to map_err to transform the error lane
                label: "Uma closure, uma função anônima, capaz de capturar do escopo dela, entregue ao map_err para transformar a pista de erro"  # @src=314bc0ed6b9b
                # | An ordinary value: parameter list between the pipes, body after it,
                # | passed to map_err like any argument and run only on the Err lane. This
                # | one captures nothing yet; the capturing kind arrives with iterators next
                # | module.
                feedback: "Um valor comum: lista de parâmetros entre os pipes, corpo depois dela, passado para map_err como qualquer argumento e rodado só na pista do Err. Esta aqui ainda não captura nada; o tipo que captura chega com iteradores no próximo módulo."  # @src=19da9d41cd46
          m04l2-q4:
            # | Your lamports-summing path panicked with 'attempt to add with overflow' in a
            # | debug build. A teammate says: ship the release build, it doesn't panic
            # | there. What's the truth?
            prompt: "O seu caminho de soma de lamports deu panic com 'attempt to add with overflow' num build de debug. Um colega de equipe diz: entregue o build de release, lá ele não dá panic. Qual é a verdade?"  # @src=4c625fad5252
            # | Debug builds panic on overflow; release builds wrap silently. With lamports
            # | (the lab's worked line adds a 2,000,000-lamport deposit near the top of the
            # | range) a wrapped u64 is a wrong balance nobody notices. checked_add returns
            # | Option, and Option feeds the same ? pipeline you just built, overflow
            # | becomes an error value like everything else.
            explanation: "Builds de debug dão panic no overflow; builds de release dão wrap em silêncio. Com lamports (a linha trabalhada do lab soma um depósito de 2,000,000 lamports perto do topo da faixa) um u64 que deu wrap é um saldo errado que ninguém percebe. checked_add retorna Option, e Option alimenta o mesmo pipeline de ? que você acabou de construir, overflow vira um valor de erro como todo o resto."  # @src=a7e513e3e6c1
            options:                 # source order — keep it
              a:
                # | The teammate is right, release builds wrap on overflow by design, and
                # | wrapping is the defined, acceptable behavior for u64 totals
                label: "O colega está certo, builds de release dão wrap no overflow por design, e dar wrap é o comportamento definido e aceitável para totais u64"  # @src=370c52966b8d
                # | Wrapping IS what release does, but for money math a silently wrapped
                # | balance is corruption, not correctness, 'defined' does not mean 'right'.
                feedback: "Dar wrap É o que o release faz, mas para matemática de dinheiro um saldo que deu wrap em silêncio é corrupção, não corretude, 'definido' não quer dizer 'certo'."  # @src=a877e50b41ae
              d:
                # | Half right, the wrap is real but a u128 total sidesteps it, so widen the
                # | type rather than check every add
                label: "Meio certo, o wrap é real mas um total u128 contorna ele, então alargue o tipo em vez de checar toda soma"  # @src=7dbe990080c5
                # | A wider type moves the ceiling, it does not add a check, and the values
                # | you are summing stay u64 on the wire. The point is not more headroom, it
                # | is that the overflow case becomes a value you handle.
                feedback: "Um tipo mais largo move o teto, ele não adiciona uma checagem, e os valores que você está somando continuam u64 no fio. O ponto não é mais espaço no teto, é que o caso de overflow vira um valor que você trata."  # @src=1c4113c70efd
              b:
                # | Wrong, release builds wrap SILENTLY, corrupting the total; use
                # | checked_add and turn None into a ProbeError instead
                label: "Errado, builds de release dão wrap SILENCIOSAMENTE, corrompendo o total; use checked_add e transforme None num ProbeError em vez disso"  # @src=3e096fa0cf74
                # | The teammate is right that the panic stops, which is the worst possible
                # | way to be right: a wrapped u64 is a wrong number wearing a straight
                # | face, and checked_add turns that into an Option the ? pipeline already
                # | handles.
                feedback: "O colega está certo de que o panic para, que é o pior jeito possível de estar certo: um u64 que deu wrap é um número errado de cara séria, e checked_add transforma isso num Option que o pipeline de ? já trata."  # @src=b429c80816eb
              c:
                # | Wrong, release builds panic on overflow exactly like debug builds do;
                # | the optimization flag only shortens the panic message
                label: "Errado, builds de release dão panic no overflow exatamente como builds de debug dão; a flag de otimização só encurta a mensagem de panic"  # @src=9fb005d6527a
                # | The builds genuinely differ: debug panics, release wraps. That asymmetry
                # | is exactly why the bug hides until production.
                feedback: "Os builds genuinamente diferem: debug dá panic, release dá wrap. Essa assimetria é exatamente por que o bug se esconde até a produção."  # @src=1699edef38c3
  m04-l3:
    # | Enums are state machines
    title: "Enums são máquinas de estados"  # @src=eec53772ae92
    blocks:
      probe-state-machine:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Define enum ProbeState { Pending, Up, Degraded, Down } and a parse_state(&str)
          # | -> Option<ProbeState>; return "Invalid" when parsing fails.
          0: "Defina enum ProbeState { Pending, Up, Degraded, Down } e um parse_state(&str) -> Option<ProbeState>; devolva \"Invalid\" quando o parse falhar."  # @src=6cea80d418bf
          # | Match on the tuple (state, probe_ok), the compiler will list every arm you
          # | haven't written yet.
          1: "Dê match na tupla (state, probe_ok), o compilador vai listar todo braço que você ainda não escreveu."  # @src=83c10723d99e
          # | The Degraded ladder needs a match guard: (Degraded, false) if
          # | consecutive_failures >= 3 goes Down, otherwise it stays Degraded.
          2: "A escada do Degraded precisa de uma trava de match: (Degraded, false) if consecutive_failures >= 3 vai para Down, senão ele fica em Degraded."  # @src=7dde9cd87a62
          # | derive Debug on the enum and return format!("{:?}", next) to get the exact
          # | state names the tests expect.
          3: "derive Debug no enum e retorne format!(\"{:?}\", next) para obter os nomes de estado exatos que os testes esperam."  # @src=31355095671b
        tests:                      # keyed by test case id
          t1:
            # | a Pending target's first successful probe brings it Up
            description: "a primeira sonda bem-sucedida de um alvo Pending leva ele para Up"  # @src=51f17e3b9aa5
          t2:
            # | one failure degrades an Up target, it does not kill it
            description: "uma falha degrada um alvo Up, ela não mata ele"  # @src=2e6a19c1ebd0
          t3:
            # | a Degraded target under 3 consecutive failures stays Degraded
            description: "um alvo Degraded abaixo de 3 falhas consecutivas continua Degraded"  # @src=b9fcb57698af
          t4:
            # | the third consecutive failure takes a Degraded target Down
            description: "a terceira falha consecutiva leva um alvo Degraded para Down"  # @src=01b93c0803bc
          t5:
            # | a successful probe recovers a Down target straight to Up
            description: "uma sonda bem-sucedida recupera um alvo Down direto para Up"  # @src=82dc8b0ad087
          t6:
            # | an unknown state string is rejected as Invalid, never guessed
            description: "uma string de estado desconhecida é rejeitada como Invalid, nunca chutada"  # @src=22250b8ee40f
      check-states:                      # quiz
        questions:
          m04l3-q1:
            # | You add a Maintenance variant to ProbeState and the build breaks in three
            # | files. Your TS instincts say you broke the project. Why is this the feature?
            prompt: "Você adiciona uma variante Maintenance ao ProbeState e o build quebra em três arquivos. Os seus instintos de TS dizem que você quebrou o projeto. Por que isto é a feature?"  # @src=a2e24d56357d
            # | This is 'how do you change code you're afraid of?' answered: the
            # | exhaustiveness check turns a risky refactor into a checklist the compiler
            # | writes for you. It is the TS exhaustive switch with the compiler holding the
            # | pen, and no never-hack needed to opt in.
            explanation: "Isto é 'como você muda um código do qual você tem medo?' respondido: a checagem de exaustividade transforma uma refatoração arriscada numa checklist que o compilador escreve para você. É o switch exaustivo do TS com a caneta na mão do compilador, e sem nenhum never-hack para optar por ela."  # @src=272a9cd3ea90
            options:                 # source order — keep it
              a:
                # | Enums are ABI-breaking, so any new variant forces dependent code to
                # | rebuild, the errors are Rust's cache invalidation working as designed
                label: "Enums quebram ABI, então qualquer variante nova força o código dependente a fazer rebuild, os erros são a invalidação de cache do Rust funcionando como projetado"  # @src=edf285ba57a6
                # | This isn't about rebuilding or ABI, the errors are semantic: specific
                # | match expressions no longer cover every case and must decide what
                # | Maintenance means.
                feedback: "Isto não é sobre fazer rebuild nem sobre ABI, os erros são semânticos: expressões match específicas não cobrem mais todo caso e precisam decidir o que Maintenance significa."  # @src=a5784d25c803
              c:
                # | Every non-exhaustive match is now a compile error naming exactly where
                # | transition logic must learn about Maintenance, a guided refactor
                label: "Todo match não exaustivo agora é um erro de compilação nomeando exatamente onde a lógica de transição precisa aprender sobre Maintenance, uma refatoração guiada"  # @src=32282974c3e3
                # | You asked the project a question and got every relevant site back by
                # | name, with line numbers. That inventory is the concrete answer to how
                # | you change code you are afraid of.
                feedback: "Você fez uma pergunta ao projeto e recebeu de volta todo ponto relevante, por nome, com números de linha. Esse inventário é a resposta concreta para como você muda um código do qual você tem medo."  # @src=5725e2db1e58
              b:
                # | The compiler marks each site so you can drop in a `_ => {}` catch-all
                # | arm per file and get back to green quickly
                label: "O compilador marca cada ponto para você poder jogar um braço catch-all `_ => {}` por arquivo e voltar para o verde rápido"  # @src=75211bd84710
                # | A catch-all silences the compiler by selling the guarantee: future
                # | variants would sail through unhandled. It's the anti-pattern, not the
                # | fix.
                feedback: "Um catch-all silencia o compilador vendendo a garantia: variantes futuras passariam batido, sem tratamento. É o anti-padrão, não o conserto."  # @src=24990eb69c53
              d:
                # | It is not the feature, it is the cost of enums: a struct of boolean
                # | flags would absorb a new state without disturbing any transition code
                label: "Não é a feature, é o custo dos enums: uma struct de flags booleanas absorveria um estado novo sem perturbar nenhum código de transição"  # @src=a797efaf35d3
                # | Absorbing it silently is the failure mode, not the fix: flags let a new
                # | state flow through logic that never decided what it means. The noise is
                # | the contract, and it is the same trade a catch-all arm sells away.
                feedback: "Absorver ele em silêncio é o modo de falha, não o conserto: flags deixam um estado novo fluir por uma lógica que nunca decidiu o que ele significa. O barulho é o contrato, e é o mesmo trade-off que um braço catch-all vende."  # @src=58155507675d
          m04l3-q2:
            # | The machine must never go Pending → Degraded. Where does that rule live so
            # | the illegal transition is IMPOSSIBLE, not just caught?
            prompt: "A máquina nunca pode ir de Pending → Degraded. Onde essa regra mora para que a transição ilegal seja IMPOSSÍVEL, não só pega?"  # @src=85cd3cdc2254
            # | Make illegal states (and transitions) unrepresentable: the enum defines the
            # | states, the match defines the legal moves, and anything absent from the
            # | match simply cannot happen. Validation you don't have to remember beats
            # | validation you might forget.
            explanation: "Torne estados (e transições) ilegais irrepresentáveis: o enum define os estados, o match define as jogadas legais, e qualquer coisa ausente do match simplesmente não pode acontecer. Validação que você não precisa lembrar ganha de validação que você pode esquecer."  # @src=9e7c9a7b3880
            options:                 # source order — keep it
              b:
                # | In a debug_assert! at every call site that checks the state pair before
                # | any assignment is allowed to happen
                label: "Num debug_assert! em todo ponto de chamada que checa o par de estados antes de qualquer atribuição ter permissão de acontecer"  # @src=05944adeb07f
                # | Asserts are runtime checks that vanish in release builds and rely on
                # | every caller remembering, the lesson's whole point is moving the rule
                # | into the structure.
                feedback: "Asserts são checagens em tempo de execução que somem em builds de release e dependem de todo chamador lembrar, o ponto inteiro da lição é mover a regra para dentro da estrutura."  # @src=943ce78a4251
              d:
                # | In a test asserting that Pending never yields Degraded, so CI catches
                # | the illegal transition
                label: "Num teste afirmando que Pending nunca produz Degraded, para que o CI pegue a transição ilegal"  # @src=ecc51cbf57db
                # | A test catches, which is the word the question is contrasting with. It
                # | samples the inputs you thought of and reports afterwards; the match
                # | makes the transition something no input can produce.
                feedback: "Um teste pega, que é a palavra com a qual a pergunta está contrastando. Ele amostra as entradas em que você pensou e reporta depois; o match faz da transição algo que nenhuma entrada consegue produzir."  # @src=2d963aed0048
              a:
                # | In next_state's match over (state, outcome): no arm produces Degraded
                # | from Pending, so no code path exists
                label: "No match de next_state sobre (state, outcome): nenhum braço produz Degraded a partir de Pending, então não existe caminho de código"  # @src=59b77351c65a
                # | The rule lives nowhere because it does not need to: with no arm
                # | producing it, there is no path that performs it. Unrepresentable beats
                # | validated, exactly as the m02-l1 union beat a runtime check.
                feedback: "A regra não mora em lugar nenhum porque não precisa morar: sem nenhum braço que produza ela, não existe caminho que execute ela. Irrepresentável ganha de validado, exatamente como a união de m02-l1 ganhou de uma checagem em tempo de execução."  # @src=d053dcaf6b8b
              c:
                # | In a #[non_exhaustive] attribute on the Degraded variant, preventing
                # | outside modules from ever constructing it directly
                label: "Num atributo #[non_exhaustive] na variante Degraded, impedindo que módulos de fora algum dia construam ela diretamente"  # @src=73c59ed9a6f6
                # | #[non_exhaustive] changes how OTHER crates match and construct the type,
                # | it does not express transition rules between variants.
                feedback: "#[non_exhaustive] muda como OUTROS crates dão match e constroem o tipo, ele não expressa regras de transição entre variantes."  # @src=211bb7b805b7
          m04l3-q3:
            # | For the flavored beat you modeled Transfer/Delegate/Close instruction data
            # | as one Rust enum instead of three structs plus a `kind` string. What makes
            # | the enum the right shape for an instruction set?
            prompt: "Na batida temperada você modelou os dados de instrução de Transfer/Delegate/Close como um enum de Rust só em vez de três structs mais uma string `kind`. O que faz do enum a forma certa para um conjunto de instruções?"  # @src=13c7fa6ef0ee
            # | A closed set of operations, each carrying different data, dispatched
            # | exhaustively: that is a sum type's home game. What programs then DO with
            # | instructions is the Anchor course's territory; the underlying
            # | account-and-transaction concepts live in the Bitcoin-to-Solana evolution
            # | course.
            explanation: "Um conjunto fechado de operações, cada uma carregando dados diferentes, despachadas exaustivamente: isso é jogo em casa para um tipo soma. O que os programas então FAZEM com instruções é território do curso de Anchor; os conceitos subjacentes de conta e transação moram no curso da evolução do Bitcoin à Solana."  # @src=24231f014c87
            options:                 # source order — keep it
              c:
                # | Solana's runtime requires enum-shaped interfaces from Rust programs, so
                # | a struct-per-instruction design would fail to compile on-chain
                label: "O runtime da Solana exige interfaces em formato de enum dos programas Rust, então um projeto de uma struct por instrução falharia em compilar on-chain"  # @src=cf5cd9762cb2
                # | The runtime mandates no Rust shapes at all, programs receive raw bytes.
                # | The enum is a modeling choice that pays off in the type system.
                feedback: "O runtime não exige formato nenhum de Rust, programas recebem bytes crus. O enum é uma escolha de modelagem que se paga no sistema de tipos."  # @src=3ba48f9bf77f
              d:
                # | A fourth operation slots in later without touching the code that already
                # | dispatches, unlike a struct per instruction
                label: "Uma quarta operação se encaixa depois sem tocar no código que já faz o dispatch, diferente de uma struct por instrução"  # @src=7f83118f91e1
                # | Backwards, and the Maintenance drill showed why: a new variant breaks
                # | every match until each one decides what it means. That churn is the
                # | guarantee you are buying, not a cost the enum spares you.
                feedback: "Ao contrário, e o treino do Maintenance mostrou por quê: uma variante nova quebra todo match até cada um decidir o que ela significa. Esse retrabalho é a garantia que você está comprando, não um custo que o enum te poupa."  # @src=a4cc2ec07934
              b:
                # | An instruction is one of a closed set, each with its own payload, the
                # | enum plus exhaustive match forces every variant to be handled
                label: "Uma instrução é uma de um conjunto fechado, cada uma com o payload dela, o enum mais o match exaustivo força toda variante a ser tratada"  # @src=117fb9a34e03
                # | Closed set, per-variant payload, exhaustive dispatch. That is why a real
                # | program's instruction enum reads as home once you have modeled one, and
                # | why a kind string plus three structs is stringly-typed hoping.
                feedback: "Conjunto fechado, payload por variante, dispatch exaustivo. É por isso que o enum de instruções de um programa de verdade se lê como casa depois que você modelou um, e por isso que uma string kind mais três structs é esperança stringly-typed."  # @src=b7025c56b1ee
              a:
                # | Enums serialize to a more compact byte layout than separate structs,
                # | which keeps transactions under the size limit and fees lower
                label: "Enums serializam para um layout de bytes mais compacto do que structs separadas, o que mantém as transações abaixo do limite de tamanho e as taxas mais baixas"  # @src=5ef48c45fe2d
                # | Wire size depends on the serialization scheme, not the Rust-side shape,
                # | the enum's win is in the type system, not the bytes.
                feedback: "O tamanho no fio depende do esquema de serialização, não do formato do lado do Rust, a vitória do enum está no sistema de tipos, não nos bytes."  # @src=3924dab2f2c9
      check-pairing:                      # quiz
        questions:
          m04l3-q4:
            # | Gate #3 now runs cargo test, clippy, and fmt in CI. A teammate objects: 'the
            # | compiler already type-checks, why pay for a lint step too?' What does clippy
            # | add?
            prompt: "O Gate #3 agora roda cargo test, clippy e fmt no CI. Um colega de equipe objeta: 'o compilador já checa tipos, por que pagar por um step de lint também?' O que o clippy adiciona?"  # @src=d6b9e4ba857e
            # | Type-checking proves the code is well-formed; clippy argues about whether
            # | it's WISE. In the pairing table it's the eslint seat: same job, different
            # | flag, and with -D warnings it goes from advice to gate.
            explanation: "Checar tipos prova que o código está bem formado; o clippy discute se ele é SÁBIO. Na tabela do pareamento é a cadeira do eslint: mesmo trabalho, flag diferente, e com -D warnings ele deixa de ser conselho e vira uma trava."  # @src=ec1d36a477bf
            options:                 # source order — keep it
              c:
                # | clippy flags correct-but-suspect code, lossy casts, ignored Results,
                # | needless clones, findings the type checker never gates on
                label: "o clippy sinaliza código correto-mas-suspeito, casts que perdem informação, Results ignorados, clones desnecessários, achados em que o verificador de tipos nunca trava"  # @src=9c05a3a9f3d8
                # | The type checker proves the code is well formed; clippy argues about
                # | whether it is wise. The planted needless clone is the proof: cargo test
                # | passed it happily because it was correct, just unwise.
                feedback: "O verificador de tipos prova que o código está bem formado; o clippy discute se ele é sábio. O clone desnecessário plantado é a prova: o cargo test passou ele feliz da vida porque ele estava correto, só que não era sábio."  # @src=ba4a329e1be3
              b:
                # | Honestly not much, clippy is a formatting tool like rustfmt, and teams
                # | keep it in CI mostly to guarantee consistent diffs
                label: "Honestamente não muita coisa, o clippy é uma ferramenta de formatação como o rustfmt, e os times mantêm ele no CI mais para garantir diffs consistentes"  # @src=d3a4f4e3159f
                # | Formatting is rustfmt's job. clippy's lints are semantic: lossy casts,
                # | ignored Results, needless clones, review findings, not style.
                feedback: "Formatação é trabalho do rustfmt. Os lints do clippy são semânticos: casts que perdem informação, Results ignorados, clones desnecessários, achados de review, não estilo."  # @src=2d044a148661
              a:
                # | clippy re-runs the borrow checker with stricter settings, catching the
                # | ownership and aliasing bugs that plain rustc silently misses
                label: "o clippy roda o borrow checker de novo com configurações mais rígidas, pegando os bugs de ownership e de aliasing que o rustc puro deixa passar em silêncio"  # @src=c8faa8eadf8e
                # | The borrow checker runs identically in both, clippy sits ABOVE
                # | type-correctness, flagging code that compiles fine but smells wrong.
                feedback: "O borrow checker roda identicamente nos dois, o clippy fica ACIMA da corretude de tipos, sinalizando código que compila numa boa mas cheira errado."  # @src=c607abd2b33a
              d:
                # | It audits the dependency tree for advisories, the step that catches a
                # | compromised crate before it ever reaches a build
                label: "Ele audita a árvore de dependências em busca de advisories, o step que pega um crate comprometido antes de ele chegar num build"  # @src=8db38ff929b1
                # | That is a different tool and a later lesson: clippy reads your own
                # | source and never looks at what your dependencies are up to. Supply-chain
                # | auditing is its own gate, with its own crate.
                feedback: "Essa é uma ferramenta diferente e uma lição mais adiante: o clippy lê o seu próprio código-fonte e nunca olha o que as suas dependências estão aprontando. Auditoria de cadeia de suprimentos é uma trava própria, com um crate próprio."  # @src=1233d265fc5b
          m04l3-q5:
            # | CI fails on cargo fmt --check, but the code compiles and every test passes
            # | locally. What is this gate for, and what's the right move?
            prompt: "O CI falha no cargo fmt --check, mas o código compila e todo teste passa localmente. Para que serve essa trava, e qual é a jogada certa?"  # @src=11682ab51447
            # | fmt --check is the cheapest gate on the pipeline and buys the most social
            # | peace: diffs show logic changes only. One command fixes any failure. In the
            # | pairing: prettier for the TS fleet, rustfmt for the engine, same idea,
            # | different flag.
            explanation: "fmt --check é a trava mais barata do pipeline e compra mais paz social: diffs mostram só mudanças de lógica. Um comando conserta qualquer falha. No pareamento: prettier para a frota TS, rustfmt para o motor, mesma ideia, flag diferente."  # @src=681e3eac8e38
            options:                 # source order — keep it
              a:
                # | Run cargo fmt and commit, the gate exists so diffs show logic, not style
                # | noise; it's the prettier seat from your TS pipeline
                label: "Rode cargo fmt e commite, a trava existe para que diffs mostrem lógica, não barulho de estilo; é a cadeira do prettier do seu pipeline TS"  # @src=8e277e3b0eb7
                # | Cheapest step on the pipeline, most social peace per second: nobody
                # | spends a review comment on brace placement again, and when it goes red
                # | the fix is one command with no judgment calls in it.
                feedback: "O step mais barato do pipeline, mais paz social por segundo: ninguém gasta um comentário de review em posicionamento de chave nunca mais, e quando ele fica vermelho o conserto é um comando, sem nenhum juízo de valor dentro dele."  # @src=f5dc7adc9851
              b:
                # | Loosen the CI step so formatting differences warn instead of block,
                # | style should never stand between a green suite and a merge
                label: "Afrouxe o step de CI para que diferenças de formatação avisem em vez de bloquear, estilo nunca deveria ficar entre uma suíte verde e um merge"  # @src=674ff55aef98
                # | A warn-only style gate decays into no gate; the value is that NOBODY
                # | debates style in review because the machine settled it.
                feedback: "Uma trava de estilo que só avisa apodrece até virar nenhuma trava; o valor é que NINGUÉM debate estilo no review porque a máquina resolveu isso."  # @src=5353e48f96b7
              d:
                # | Add a cargo fmt step ahead of the check so that CI formats the whole
                # | tree itself and the gate always passes
                label: "Adicione um step de cargo fmt antes do check para que o CI formate a árvore inteira sozinho e a trava sempre passe"  # @src=136112d9507f
                # | A gate's job is to refuse, not to fix. CI reformatting the tree either
                # | throws the change away at the end of the job or commits on your behalf,
                # | and either way the local habit never forms.
                feedback: "O trabalho de uma trava é recusar, não consertar. O CI reformatando a árvore ou joga a mudança fora no fim do job ou commita em seu nome, e de qualquer jeito o hábito local nunca se forma."  # @src=215c18bd1559
              c:
                # | Drop the job as redundant, rustfmt is advisory, and the compiler
                # | normalizes formatting anyway when it parses the source
                label: "Largue o job como redundante, o rustfmt é só conselho, e o compilador normaliza a formatação de qualquer jeito quando faz o parse do código-fonte"  # @src=59b7c4c2afb3
                # | The compiler never rewrites your source; unformatted code merges fine
                # | without the gate and pollutes every future diff.
                feedback: "O compilador nunca reescreve o seu código-fonte; sem a trava, código não formatado dá merge sem problema e polui todo diff futuro."  # @src=263352fb0293
          m04l3-q6:
            # | The driving question was 'how do you change code you're afraid of?' After
            # | this lesson, what concretely changed about refactoring the Rust engine?
            prompt: "A pergunta condutora era 'como você muda um código do qual você tem medo?' Depois desta lição, o que mudou concretamente em relação a refatorar o motor Rust?"  # @src=01bb2b7dae91
            # | The answer to the driving question is a system, not courage: exhaustive
            # | matches turn refactors into compiler-guided checklists, and the
            # | test/lint/fmt gate catches what slips. It's the same safety the TS fleet has
            # | had since m02-l4, one pipeline, two languages, three gates.
            explanation: "A resposta para a pergunta condutora é um sistema, não coragem: matches exaustivos transformam refatorações em checklists guiadas pelo compilador, e a trava de test/lint/fmt pega o que escapa. É a mesma segurança que a frota TS tem desde m02-l4, um pipeline, duas linguagens, três travas."  # @src=0fe3615c60f3
            options:                 # source order — keep it
              b:
                # | A red gate catches a missing arm, broken test, or suspect cast BEFORE
                # | the cron ships a bad engine, the contract vitest enforces on the fleet
                label: "Uma trava vermelha pega um braço faltando, um teste quebrado ou um cast suspeito ANTES de o cron fazer o ship de um motor ruim, o contrato que o vitest impõe na frota"  # @src=bf506c5041b8
                # | Both halves of the station are now gated on one workflow, so it works on
                # | my machine and it will pass CI became the same sentence. That identity
                # | is worth more than any single test in the suite.
                feedback: "As duas metades da estação agora estão travadas num workflow só, então \"funciona na minha máquina\" e \"vai passar no CI\" viraram a mesma frase. Essa identidade vale mais do que qualquer teste individual da suíte."  # @src=8ea10408f886
              a:
                # | Nothing operational yet, the gates document intent, but they only start
                # | protecting the engine once M5 attaches the release build to the same
                # | workflow
                label: "Nada operacional ainda, as travas documentam intenção, mas elas só começam a proteger o motor quando o M5 anexar o build de release ao mesmo workflow"  # @src=6ceb12d4700c
                # | The protection is live NOW: the workflow runs on every push, and you
                # | watched it go red on a planted lint before the fix.
                feedback: "A proteção está no ar AGORA: o workflow roda em todo push, e você viu ele ficar vermelho num lint plantado antes do conserto."  # @src=774826d80337
              d:
                # | The transition tests became redundant, since an exhaustive match already
                # | proves every state pair is handled correctly
                label: "Os testes de transição viraram redundantes, já que um match exaustivo já prova que todo par de estados é tratado corretamente"  # @src=061a624d9028
                # | Exhaustiveness proves every pair is handled, never that it is handled
                # | RIGHT. Fill an arm with the wrong target state and the compiler stays
                # | quiet; the five transition tests are what notice.
                feedback: "Exaustividade prova que todo par é tratado, nunca que ele é tratado CERTO. Preencha um braço com o estado alvo errado e o compilador fica quieto; os cinco testes de transição são os que percebem."  # @src=ee3e3a95891b
              c:
                # | Refactors can now merge without human review, since a green pipeline is
                # | proof the change is behaviorally correct end to end
                label: "Refatorações agora podem dar merge sem review humano, já que um pipeline verde é prova de que a mudança está comportamentalmente correta de ponta a ponta"  # @src=f44d27c89367
                # | Green means the gates you wrote all pass, it bounds the damage a change
                # | can do, it doesn't prove the change is right. Review still thinks; gates
                # | just never forget.
                feedback: "Verde quer dizer que as travas que você escreveu passam todas, isso limita o estrago que uma mudança pode fazer, não prova que a mudança está certa. O review continua pensando; as travas apenas nunca esquecem."  # @src=04d63e510448
  m05-l1:
    # | serde: the boundary parser
    title: "serde: o parser de fronteira"  # @src=2d9628c89cae
    blocks:
      kv-config-parser:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | pair.split_once('=') splits on the FIRST '=' only and returns Option<(&str,
          # | &str)>, None is your "bad pair" case.
          0: "pair.split_once('=') separa no PRIMEIRO '=' só e retorna Option<(&str, &str)>, None é o seu caso de \"bad pair\"."  # @src=b5de6b60c13f
          # | Track each field as an Option; after the loop, ok_or_else turns a None into
          # | the right "missing key: <k>" Err, check name, url, timeout_ms in that fixed
          # | order.
          1: "Rastreie cada campo como um Option; depois do loop, ok_or_else transforma um None no Err \"missing key: <k>\" certo, cheque name, url, timeout_ms nessa ordem fixa."  # @src=3224cc32bd5c
          # | value.parse::<u64>().map_err(|_| format!("invalid timeout_ms: {value}"))?, the
          # | m04-l2 error-mapping closure, doing exactly its job.
          2: "value.parse::<u64>().map_err(|_| format!(\"invalid timeout_ms: {value}\"))?, a closure de mapeamento de erro de m04-l2, fazendo exatamente o trabalho dela."  # @src=cc85a45a278d
          # | Skip empty segments (a trailing ';' makes one) with a continue before
          # | splitting.
          3: "Pule segmentos vazios (um ';' no fim cria um) com um continue antes de separar."  # @src=37eb286bb9f0
        tests:                      # keyed by test case id
          t1:
            # | a well-formed target line parses into all three fields
            description: "uma linha de alvo bem formada faz parse para os três campos"  # @src=01047a7070ab
          t2:
            # | split on the FIRST '=' only, query-string '='s belong to the URL
            description: "separar no PRIMEIRO '=' só, os '=' de query string pertencem à URL"  # @src=66389795f3ea
          t3:
            # | an unknown key is an error value, never silently ignored
            description: "uma chave desconhecida é um valor de erro, nunca ignorada em silêncio"  # @src=ea456d133ed5
          t4:
            # | a segment with no '=' is a bad pair
            description: "um segmento sem '=' é um par ruim"  # @src=6ffd74a09323
          t5:
            # | only http:// and https:// schemes are legal probe targets
            description: "só os schemes http:// e https:// são alvos de sonda legais"  # @src=c725a445ebe1
          t6:
            # | a non-numeric timeout is an error, not a default
            description: "um timeout não numérico é um erro, não um default"  # @src=1a4f13b2eecf
          t7:
            # | all three keys are required; missing keys are reported in fixed order
            description: "as três chaves são obrigatórias; chaves faltando são reportadas em ordem fixa"  # @src=178f65414da1
          t8:
            # | a trailing ';' produces an empty segment, which is ignored
            description: "um ';' no fim produz um segmento vazio, que é ignorado"  # @src=907d168b424b
      check:                      # quiz
        questions:
          m05l1-q1:
            # | Your config's probe entries carry a "kind" field ("http" or "tcp") with
            # | different fields per kind. You model it as a Rust enum with #[serde(tag =
            # | "kind")]. What does that attribute buy you over leaving the enum untagged?
            prompt: "As entradas de sonda da sua config carregam um campo \"kind\" (\"http\" ou \"tcp\") com campos diferentes por kind. Você modela isso como um enum de Rust com #[serde(tag = \"kind\")]. O que esse atributo te compra em relação a deixar o enum untagged?"  # @src=1ba4bc88ceab
            # | Internally tagged representation reads the discriminant field first and
            # | dispatches to exactly one variant, the same job your TS discriminated
            # | union's "kind" field does for zod. Untagged means serde tries variants in
            # | order and takes the first that fits, which silently mis-parses ambiguous
            # | data and produces vague errors when nothing fits.
            explanation: "A representação com tag interna lê o campo discriminante primeiro e despacha para exatamente uma variante, o mesmo trabalho que o campo \"kind\" da sua união discriminada de TS faz para o zod. Untagged quer dizer que o serde tenta as variantes em ordem e fica com a primeira que serve, o que faz o parse errado de dados ambíguos em silêncio e produz erros vagos quando nada serve."  # @src=b0f2adc970e9
            options:                 # source order — keep it
              c:
                # | Tagging switches serde over to compile-time input checking, so a config
                # | with a bad kind gets rejected when you build the crate instead of at
                # | runtime
                label: "Pôr a tag muda o serde para checagem de entrada em tempo de compilação, então uma config com um kind ruim é recusada quando você builda o crate em vez de em tempo de execução"  # @src=53e4fce49f0a
                # | No derive can check runtime INPUT at compile time, the config file
                # | arrives long after the build. Tagging improves the runtime error, it
                # | can't move it.
                feedback: "Nenhum derive consegue checar ENTRADA de tempo de execução em tempo de compilação, o arquivo de config chega muito depois do build. Pôr a tag melhora o erro em tempo de execução, não consegue mover ele."  # @src=db1dc21777ae
              a:
                # | Untagged enums can't hold variants with different fields at all, so the
                # | attribute is what lets Http and Tcp coexist in one enum
                label: "Enums untagged não conseguem segurar variantes com campos diferentes de jeito nenhum, então o atributo é o que deixa Http e Tcp coexistirem num enum só"  # @src=95747dc17fc4
                # | Untagged enums compile fine with differing variants, the problem is how
                # | they MATCH input (first fit wins), not whether they compile.
                feedback: "Enums untagged compilam numa boa com variantes diferentes, o problema é como eles CORRESPONDEM à entrada (a primeira que serve vence), não se eles compilam."  # @src=d1cbf79a38df
              b:
                # | The "kind" field selects the variant explicitly, so a wrong kind fails
                # | with a named error instead of first-match-wins guessing
                label: "O campo \"kind\" seleciona a variante explicitamente, então um kind errado falha com um erro nomeado em vez do chute de primeira-correspondência-vence"  # @src=d967226533b7
                # | serde reads the discriminant first and dispatches to exactly one
                # | variant, which is why a bad kind comes back as `unknown variant grpc,
                # | expected http or tcp` with a line and column attached.
                feedback: "o serde lê o discriminante primeiro e despacha para exatamente uma variante, que é por que um kind ruim volta como `unknown variant grpc, expected http or tcp` com linha e coluna anexadas."  # @src=ed30cd718d06
              d:
                # | Tagging also closes the entry to unknown fields, so a typo like
                # | "timout_ms" beside "kind" becomes a named error instead of ignored data
                label: "Pôr a tag também fecha a entrada para campos desconhecidos, então um typo como \"timout_ms\" ao lado de \"kind\" vira um erro nomeado em vez de dado ignorado"  # @src=1ff03b77384d
                # | Different attribute, and one you cannot pair with this struct anyway:
                # | serde ignores unknown JSON fields by default, and deny_unknown_fields is
                # | documented as not combining with the flatten Target uses.
                feedback: "Atributo diferente, e um que você não consegue parear com esta struct de qualquer jeito: o serde ignora campos JSON desconhecidos por padrão, e deny_unknown_fields é documentado como não combinando com o flatten que o Target usa."  # @src=a0f3f496daa9
          m05l1-q2:
            # | In m02-l2 you wrote a zod schema and derived the TypeScript type from it
            # | with z.infer. Today you wrote a Rust struct and derived the parser from it.
            # | What is the shared discipline underneath both?
            prompt: "Em m02-l2 você escreveu um schema zod e derivou o tipo de TypeScript a partir dele com z.infer. Hoje você escreveu uma struct de Rust e derivou o parser a partir dela. Qual é a disciplina compartilhada por baixo dos dois?"  # @src=182f3190d318
            # | Both tools turn untrusted bytes into a trusted type at the edge, after that,
            # | no function needs to re-check. The direction differs (zod infers the type
            # | from the schema; serde derives the parser from the type) but the discipline
            # | is identical, and Rust adds compile-time enforcement: there is no untyped
            # | escape hatch to smuggle unparsed data past the boundary.
            explanation: "As duas ferramentas transformam bytes não confiáveis num tipo confiável na borda, depois disso, nenhuma função precisa rechecar. A direção difere (o zod infere o tipo a partir do schema; o serde deriva o parser a partir do tipo) mas a disciplina é idêntica, e o Rust adiciona imposição em tempo de compilação: não existe saída de emergência sem tipo para contrabandear dados sem parse por cima da fronteira."  # @src=dcadba96d59d
            options:                 # source order — keep it
              d:
                # | Code generation: each tool emits the parser from one declaration, so the
                # | type and the validator can never drift apart
                label: "Geração de código: cada ferramenta emite o parser a partir de uma declaração, então o tipo e o validador nunca conseguem se descolar um do outro"  # @src=4be41b4d7194
                # | Only serde emits anything. zod's schema is a runtime value that walks
                # | your data, and z.infer reads a type off it; nothing is generated, which
                # | is why the two directions are opposite.
                feedback: "Só o serde emite alguma coisa. O schema do zod é um valor em tempo de execução que caminha pelos seus dados, e o z.infer lê um tipo a partir dele; nada é gerado, que é por que as duas direções são opostas."  # @src=3887a2e9159a
              a:
                # | Runtime schema objects: both libraries build a validator value that
                # | walks the raw input and returns either cleaned data or a structured list
                # | of issues
                label: "Objetos de schema em tempo de execução: as duas bibliotecas constroem um valor validador que caminha pela entrada crua e retorna ou dados limpos ou uma lista estruturada de problemas"  # @src=73beed13d6e2
                # | That describes zod's mechanism, not the shared idea, serde generates
                # | parsing CODE at compile time; there is no runtime schema object walking
                # | your input.
                feedback: "Isso descreve o mecanismo do zod, não a ideia compartilhada, o serde gera CÓDIGO de parsing em tempo de compilação; não existe objeto de schema em tempo de execução caminhando pela sua entrada."  # @src=ca0bd648df6a
              b:
                # | Defensive validation: both let you re-check the parsed values anywhere
                # | in the program, so every function can guard its own inputs
                label: "Validação defensiva: os dois te deixam rechecar os valores parseados em qualquer lugar do programa, então toda função consegue travar as próprias entradas"  # @src=9fe17da7813f
                # | Re-checking everywhere is the anti-pattern this discipline replaces, the
                # | whole point is to establish trust ONCE, at the boundary.
                feedback: "Rechecar em todo lugar é o antipadrão que esta disciplina substitui, o ponto inteiro é estabelecer confiança UMA VEZ, na fronteira."  # @src=28211ead1353
              c:
                # | Parse, don't validate: cross the boundary once, into a type that cannot
                # | represent the bad states, and the rest of the program trusts it
                label: "Parse, don't validate: cruze a fronteira uma vez, para dentro de um tipo que não consegue representar os estados ruins, e o resto do programa confia nele"  # @src=846c184ae202
                # | Same refusal at the door in both languages, and Rust enforces it harder
                # | because there is no any-shaped hatch to smuggle unparsed data past the
                # | parser.
                feedback: "Mesma recusa na porta nas duas linguagens, e o Rust impõe ela com mais força porque não existe escotilha em formato de any para contrabandear dados sem parse por cima do parser."  # @src=304854c0e4fa
          m05l1-q3:
            # | Your first pipeline is targets.iter().filter(|t|
            # | t.enabled).map(to_probe_target), and nothing has run yet. What makes it
            # | execute?
            prompt: "O seu primeiro pipeline é targets.iter().filter(|t| t.enabled).map(to_probe_target), e nada rodou ainda. O que faz ele executar?"  # @src=366c5d3cd75f
            # | Adapters (filter, map) are lazy: they wrap the iterator and describe a
            # | transformation. A consumer, collect, sum, a for loop, pulls elements through
            # | the whole chain one at a time. That's also why Rust chains don't allocate an
            # | intermediate collection per step the way chained JS array methods do. Full
            # | treatment: TRPL ch13, this lesson's go-deeper box.
            explanation: "Adaptadores (filter, map) são lazy: eles embrulham o iterador e descrevem uma transformação. Um consumidor, collect, sum, um loop for, puxa os elementos pela cadeia inteira um de cada vez. É também por isso que cadeias de Rust não alocam uma coleção intermediária por passo do jeito que métodos de array encadeados do JS fazem. Tratamento completo: TRPL ch13, a caixa de vá-mais-fundo desta lição."  # @src=305bedc9fd31
            options:                 # source order — keep it
              b:
                # | Nothing extra, each adapter runs eagerly as it is chained, and the
                # | values are already transformed into a new collection by the time map
                # | returns
                label: "Nada a mais, cada adaptador roda avidamente conforme é encadeado, e os valores já estão transformados numa coleção nova quando o map retorna"  # @src=9d5ddfaa0395
                # | That is how JS array chains behave (each .map allocates a new array
                # | immediately), Rust adapters build a description and do no work until
                # | consumed.
                feedback: "É assim que cadeias de array do JS se comportam (cada .map aloca um array novo na hora), adaptadores de Rust constroem uma descrição e não fazem trabalho nenhum até serem consumidos."  # @src=841994a81d3f
              c:
                # | Awaiting it, filter and map return futures, so the chain needs an async
                # | runtime spun up around it before any element is produced
                label: "Dar await nele, filter e map retornam futures, então a cadeia precisa de um runtime async subido em volta dela antes de qualquer elemento ser produzido"  # @src=b47248308113
                # | No futures here, iterators are synchronous and lazy. Async arrives next
                # | module for I/O; laziness is a separate idea.
                feedback: "Sem futures aqui, iteradores são síncronos e lazy. Async chega no próximo módulo para I/O; laziness é uma ideia separada."  # @src=800d346d23a3
              d:
                # | Naming the collection type on the binding, an inert chain starts pulling
                # | as soon as the compiler knows what container to build
                label: "Nomear o tipo da coleção no binding, uma cadeia inerte começa a puxar assim que o compilador sabe que contêiner construir"  # @src=49be44206fa4
                # | The annotation answers E0282, which asks collect WHAT to build, not
                # | WHETHER to run. A for loop needs no annotation and still drives the
                # | chain.
                feedback: "A anotação responde ao E0282, que pergunta ao collect O QUÊ construir, não SE deve rodar. Um loop for não precisa de anotação e mesmo assim dirige a cadeia."  # @src=48617cf46005
              a:
                # | A consumer like collect() or a for loop, iterator adapters are lazy and
                # | only describe the work until something drains them
                label: "Um consumidor como collect() ou um loop for, adaptadores de iterador são lazy e só descrevem o trabalho até alguma coisa drenar eles"  # @src=2fb4e3520fca
                # | The consumer pulls each element through the whole chain in one pass,
                # | which is also why no intermediate collection gets allocated per step.
                feedback: "O consumidor puxa cada elemento pela cadeia inteira numa passagem só, que é também por que nenhuma coleção intermediária é alocada por passo."  # @src=658b9ed02589
          m05l1-q4:
            # | serde_json::from_str::<Config>(&raw) hits a config where timeout_ms is the
            # | string "fast". What lands in your program?
            prompt: "serde_json::from_str::<Config>(&raw) esbarra numa config onde timeout_ms é a string \"fast\". O que aterrissa no seu programa?"  # @src=d6e3b060a615
            # | from_str returns Result<Config, serde_json::Error>, and the error knows its
            # | line and column, a parse failure is a value that flows through the same
            # | map_err/? plumbing as everything else in the engine. This is why the
            # | hand-rolled parser you wrote in the challenge and the derived one are
            # | drop-in equals at the type level; serde just writes better errors than you
            # | were going to.
            explanation: "from_str retorna Result<Config, serde_json::Error>, e o erro sabe a linha e a coluna dele, uma falha de parse é um valor que flui pelo mesmo encanamento de map_err/? que todo o resto no motor. É por isso que o parser feito à mão que você escreveu no challenge e o derivado são iguais drop-in no nível do tipo; o serde só escreve erros melhores do que você ia escrever."  # @src=49abfc7e944c
            options:                 # source order — keep it
              a:
                # | A panic at the parse site, type mismatches inside derived parsers are
                # | unrecoverable and abort before your code resumes
                label: "Um panic no ponto do parse, desencontros de tipo dentro de parsers derivados são irrecuperáveis e abortam antes de o seu código retomar"  # @src=76dfc29a3ab2
                # | Nothing panics unless YOU unwrap it, the derived parser returns the
                # | failure as a value, exactly like every parser you wrote in m04-l2.
                feedback: "Nada dá panic a não ser que VOCÊ dê unwrap nele, o parser derivado retorna a falha como um valor, exatamente como todo parser que você escreveu em m04-l2."  # @src=cb47e26c7c5d
              b:
                # | An Err value carrying what went wrong and where (line and column), which
                # | your ? chain propagates like any other boundary failure
                label: "Um valor Err carregando o que deu errado e onde (linha e coluna), que a sua cadeia de ? propaga como qualquer outra falha de fronteira"  # @src=1f2834465d09
                # | The drill prints it verbatim: `invalid type: string "fast", expected u64
                # | at line 16 column 25`, routed by the same map_err plumbing as every
                # | other failure in the engine.
                feedback: "O treino imprime ele textualmente: `invalid type: string \"fast\", expected u64 at line 16 column 25`, roteado pelo mesmo encanamento de map_err que toda outra falha no motor."  # @src=8460d4beb5f0
              d:
                # | An Err naming the offending field but not its position, since line and
                # | column need a pass through serde_json::Value
                label: "Um Err nomeando o campo problemático mas não a posição dele, já que linha e coluna precisam de uma passagem por serde_json::Value"  # @src=999d5c36d3f2
                # | Position comes free. serde_json tracks line and column as it reads, so
                # | the one-step from_str error already prints `at line 16 column 25` with
                # | no Value detour.
                feedback: "A posição vem de graça. O serde_json rastreia linha e coluna enquanto lê, então o erro de from_str de um passo só já imprime `at line 16 column 25` sem nenhuma volta pelo Value."  # @src=fe2bcdec0508
              c:
                # | An Ok(Config) with timeout_ms set to its type default, plus a warning,
                # | serde recovers leniently unless you opt into strict mode
                label: "Um Ok(Config) com timeout_ms setado no default do tipo dele, mais um aviso, o serde se recupera com leniência a não ser que você opte pelo modo estrito"  # @src=dcb8b56799a1
                # | serde is strict by default, no silent defaults, no warnings. (Opt-in
                # | lenience exists per-field via #[serde(default)], which is the opposite
                # | arrangement.)
                feedback: "o serde é estrito por padrão, sem defaults silenciosos, sem avisos. (Leniência opt-in existe por campo via #[serde(default)], que é o arranjo oposto.)"  # @src=3aa6f2af47dc
  m05-l2:
    # | cargo mastery: editions, workspaces, features, MSRV
    title: "domínio do cargo: editions, workspaces, features, MSRV"  # @src=1e816c33af65
    blocks:
      check:                      # quiz
        questions:
          m05l2-q1:
            # | You declare rust-version = "1.82" on pulse-engine and your workspace uses
            # | resolver v3. What did you actually change about dependency resolution?
            prompt: "Você declara rust-version = \"1.82\" no pulse-engine e o seu workspace usa resolver v3. O que você de fato mudou na resolução de dependências?"  # @src=43009e34d6b1
            # | Resolver v3 (the edition-2024 default, needs Rust 1.84+) flips the
            # | resolver.incompatible-rust-versions key, plural, the edition guide prints a
            # | typo, from allow to fallback: version selection respects your declared MSRV.
            # | rust-version stops being documentation and becomes an input to the resolver.
            explanation: "O resolvedor v3 (o default da edition 2024, precisa de Rust 1.84+) vira a chave resolver.incompatible-rust-versions, plural, o guia de editions imprime um typo, de allow para fallback: a seleção de versões respeita o MSRV que você declarou. rust-version deixa de ser documentação e vira uma entrada do resolvedor."  # @src=c2dc541f41e2
            options:                 # source order — keep it
              a:
                # | Nothing about resolution, rust-version only prints a warning banner when
                # | an older toolchain runs cargo build on your crate
                label: "Nada sobre resolução, rust-version só imprime um banner de aviso quando um toolchain mais velho roda cargo build no seu crate"  # @src=066fc939d8e8
                # | It's stronger than a warning (cargo errors on unsupported toolchains),
                # | and under resolver v3 it actively shapes which dependency versions get
                # | picked.
                feedback: "É mais forte que um aviso (o cargo dá erro em toolchains não suportados), e sob o resolvedor v3 ele molda ativamente quais versões de dependência são escolhidas."  # @src=376257d7be71
              b:
                # | Dependencies are now vendored at their 1.82-era versions in the
                # | lockfile, and cargo update refuses to move any of them past that era
                label: "As dependências agora ficam vendorizadas nas versões da era 1.82 no lockfile, e cargo update se recusa a mover qualquer uma delas para além dessa era"  # @src=c5ad7ffcbd65
                # | No vendoring or freezing happens, resolution still prefers new versions;
                # | it just falls back past releases whose own MSRV exceeds yours.
                feedback: "Não acontece vendoring nem congelamento, a resolução continua preferindo versões novas; ela só dá fallback por cima de releases cujo MSRV próprio excede o seu."  # @src=3c28eaee224e
              d:
                # | Your own builds now run under 1.82, cargo selects the declared toolchain
                # | so a newer rustc on the box cannot leak in
                label: "Os seus próprios builds agora rodam sob 1.82, o cargo seleciona o toolchain declarado para um rustc mais novo na máquina não conseguir vazar para dentro"  # @src=7ac6cb1da7b5
                # | rust-version is a floor, not a toolchain selector. It stops an older
                # | rustc from building you; it never stops YOU on a newer one from writing
                # | an idiom 1.82 cannot parse, which is why serious libraries add an MSRV
                # | CI job.
                feedback: "rust-version é um piso, não um seletor de toolchain. Ele impede um rustc mais velho de construir você; ele nunca impede VOCÊ num mais novo de escrever um idioma que o 1.82 não consegue parsear, que é por que bibliotecas sérias adicionam um job de CI de MSRV."  # @src=6a596121842e
              c:
                # | Resolution became MSRV-aware: cargo prefers dependency versions whose
                # | own rust-version fits 1.82 instead of grabbing the newest compatible
                label: "A resolução ficou ciente do MSRV: o cargo prefere versões de dependência cujo rust-version próprio cabe em 1.82 em vez de pegar a mais nova compatível"  # @src=244a1b3069de
                # | v3 flips resolver.incompatible-rust-versions from allow to fallback, so
                # | a candidate release that demands a newer compiler than 1.82 gets skipped
                # | for one that fits.
                feedback: "O v3 vira resolver.incompatible-rust-versions de allow para fallback, então um release candidato que exige um compilador mais novo que 1.82 é pulado por um que cabe."  # @src=b17ea85d5cd6
          m05l2-q2:
            # | Following agave's shape, you hoist serde into [workspace.dependencies] at
            # | the root. What must each member crate now do to use it?
            prompt: "Seguindo o formato do agave, você faz o hoist do serde para dentro de [workspace.dependencies] na raiz. O que cada crate membro precisa fazer agora para usar ele?"  # @src=e51169a96723
            # | One declaration at the root (version + features + default-features), then
            # | serde = { workspace = true } per consuming member. Version bumps become a
            # | one-line diff, and no two crates in the workspace can silently drift onto
            # | different serde lines, agave runs its entire dependency surface this way.
            explanation: "Uma declaração na raiz (version + features + default-features), depois serde = { workspace = true } por membro consumidor. Bumps de versão viram um diff de uma linha, e dois crates do workspace não podem descolar em silêncio para linhas de serde diferentes, o agave roda a superfície de dependências inteira dele assim."  # @src=094e2d5808a7
            options:                 # source order — keep it
              d:
                # | Subscribe with workspace = true and restate features = ["derive"], since
                # | inheritance carries the version string but not the feature list
                label: "Assinar com workspace = true e redeclarar features = [\"derive\"], já que a herança carrega a string de versão mas não a lista de features"  # @src=9b09c231c2d1
                # | The root entry declares version AND features together, and the
                # | subscription inherits both, which is why the engine's block is three
                # | bare workspace = true lines.
                feedback: "A entrada da raiz declara version E features juntos, e a assinatura herda os dois, que é por que o bloco do motor são três linhas peladas de workspace = true."  # @src=b68ca7c3f704
              b:
                # | Nothing, root-declared workspace dependencies are injected into every
                # | member's build automatically, which is the whole point of centralizing
                label: "Nada, dependências de workspace declaradas na raiz são injetadas no build de todo membro automaticamente, que é o ponto inteiro de centralizar"  # @src=132fda69f982
                # | Members that never mention serde don't get it, automatic injection would
                # | bloat every crate with every dep. The root declares; each member still
                # | opts in.
                feedback: "Membros que nunca mencionam serde não ganham ele, injeção automática incharia todo crate com toda dep. A raiz declara; cada membro ainda opta por entrar."  # @src=f6c758941295
              c:
                # | Re-declare it with an identical version string, which cargo then
                # | verifies against the root and rejects the build on any version mismatch
                # | between them
                label: "Redeclarar ele com uma string de versão idêntica, que o cargo então verifica contra a raiz e rejeita o build em qualquer desencontro de versão entre os dois"  # @src=312d34b726ef
                # | Re-declaring versions per member is exactly the duplication the pattern
                # | deletes, members write workspace = true and carry no version digits at
                # | all.
                feedback: "Redeclarar versões por membro é exatamente a duplicação que o padrão apaga, membros escrevem workspace = true e não carregam dígito de versão nenhum."  # @src=b40a3c187e6a
              a:
                # | Opt in explicitly with serde = { workspace = true } in its own
                # | [dependencies], the root declares the version once, members subscribe
                label: "Optar por entrar explicitamente com serde = { workspace = true } no próprio [dependencies] dele, a raiz declara a versão uma vez, os membros assinam"  # @src=5e7cbcd542dc
                # | That subscription is the whole member-side diff: no digits, no feature
                # | list. A version bump is then one line at the root and no two crates can
                # | drift onto different serde lines.
                feedback: "Essa assinatura é o diff inteiro do lado do membro: sem dígitos, sem lista de features. Um bump de versão é então uma linha na raiz e dois crates não podem descolar para linhas de serde diferentes."  # @src=6b0d71d72d03
          m05l2-q3:
            # | agave declares its shared deps with default-features = false. What is that
            # | hygiene actually buying, given the deps still compile fine without it?
            prompt: "O agave declara as deps compartilhadas dele com default-features = false. O que essa higiene está de fato comprando, já que as deps compilam bem sem isso?"  # @src=c165e0b3c0f2
            # | Defaults serve the average consumer; a workspace is not average.
            # | defaults-off + named features means every capability in the build was chosen
            # | on purpose, smaller binaries, faster builds, and a manifest that documents
            # | what each dep is actually FOR. The cost is the footgun you met in the lab: a
            # | missing feature surfaces as a confusing missing-item error inside the dep,
            # | and cargo tree -e features is how you find it.
            explanation: "Defaults servem o consumidor médio; um workspace não é médio. defaults-off + features nomeadas quer dizer que toda capacidade do build foi escolhida de propósito, binários menores, builds mais rápidos e um manifest que documenta PARA O QUE cada dep de fato serve. O custo é o footgun que você conheceu no lab: uma feature faltando aparece como um erro confuso de item faltando dentro da dep, e cargo tree -e features é como você acha ela."  # @src=9e618177c770
            options:                 # source order — keep it
              c:
                # | Semver safety, default feature sets may change in minor releases, so
                # | pinning features off is the only way to keep minor upgrades from
                # | breaking your build
                label: "Segurança de semver, conjuntos de features default podem mudar em releases minor, então fixar as features desligadas é o único jeito de impedir upgrades minor de quebrar o seu build"  # @src=dc596af872ee
                # | Removing a default feature is treated as a breaking change in ecosystem
                # | convention anyway, the hygiene is about compile surface and intent, not
                # | semver protection.
                feedback: "Remover uma feature default é tratado como breaking change na convenção do ecossistema de qualquer forma, a higiene é sobre superfície de compilação e intenção, não proteção de semver."  # @src=824c652c7414
              d:
                # | Graph-wide reach: one defaults-off line at the root turns those defaults
                # | off for each crate that pulls the same dep in
                label: "Alcance por todo o grafo: uma linha de defaults-off na raiz desliga esses defaults para cada crate que puxa a mesma dep para dentro"  # @src=640eea98f608
                # | Features are additive and cargo unifies them, so one other consumer
                # | asking for default turns default back on for the shared build.
                # | Defaults-off constrains what YOU request, not what the graph resolves
                # | to.
                feedback: "Features são aditivas e o cargo unifica elas, então um outro consumidor pedindo default liga default de volta para o build compartilhado. Defaults-off restringe o que VOCÊ pede, não aquilo para o que o grafo resolve."  # @src=a55f72a3c97c
              a:
                # | Faster resolution, with defaults off, cargo skips feature unification
                # | across the graph and resolves each crate independently
                label: "Resolução mais rápida, com os defaults desligados, o cargo pula a unificação de features pelo grafo e resolve cada crate de forma independente"  # @src=aa3fd1a167a7
                # | Feature unification still runs regardless, defaults-off changes WHAT
                # | gets unified in (less), not whether unification happens.
                feedback: "A unificação de features roda do mesmo jeito, defaults-off muda O QUE entra na unificação (menos), não se a unificação acontece."  # @src=e5dc227c4ce4
              b:
                # | Deliberate surface area: each crate compiles only the capabilities it
                # | names, instead of every default the dep author chose for the general
                # | case
                label: "Área de superfície deliberada: cada crate compila só as capacidades que ele nomeia, em vez de todo default que o autor da dep escolheu para o caso geral"  # @src=57ad7e95c1e9
                # | Smaller binaries and faster builds fall out of it, but the durable
                # | payoff is a manifest that documents what each dependency is FOR, which
                # | is why agave runs reqwest and clap defaults-off while leaving serde's
                # | defaults on.
                feedback: "Binários menores e builds mais rápidos caem disso, mas o ganho durável é um manifest que documenta PARA O QUE cada dependência serve, que é por que o agave roda reqwest e clap com defaults-off enquanto deixa os defaults do serde ligados."  # @src=8b21dce3e427
          m05l2-q4:
            # | The pin-reading drill: agave pins reqwest at 0.12.28 while crates.io latest
            # | is 0.13.4, and pins clap at 2.33.1, a decade-old major. You're about to open
            # | a PR against agave. What's the professional read?
            prompt: "O treino de leitura de pin: o agave fixa reqwest em 0.12.28 enquanto o latest do crates.io é 0.13.4, e fixa clap em 2.33.1, um major de uma década de idade. Você está prestes a abrir um PR contra o agave. Qual é a leitura profissional?"  # @src=b2be76343f02
            # | A pin in a living repo is information: someone chose it, and something
            # | (migration cost, behavior differences, MSRV, sheer risk surface) is holding
            # | it. Photon's sqlx 0.6 pin is the gold standard, the comment links the
            # | upstream issue that blocks the upgrade. Match the ecosystem you're
            # | contributing to; propose upgrades as upgrades. That reading skill is exactly
            # | what m09-l1's audit lab will grade on your own tree.
            explanation: "Um pin num repo vivo é informação: alguém escolheu ele, e alguma coisa (custo de migração, diferenças de comportamento, MSRV, pura superfície de risco) está segurando ele. O pin de sqlx 0.6 do photon é o padrão-ouro, o comentário linka a issue upstream que bloqueia o upgrade. Acompanhe o ecossistema para o qual você está contribuindo; proponha upgrades como upgrades. Essa habilidade de leitura é exatamente o que o lab de auditoria do m09-l1 vai avaliar na sua própria árvore."  # @src=60ebc20c2746
            options:                 # source order — keep it
              a:
                # | The repo is under-maintained on dependencies, a good first PR is the
                # | reqwest 0.13 and clap 4 upgrades before touching anything else
                label: "O repo é mal mantido em dependências, um bom primeiro PR são os upgrades de reqwest 0.13 e clap 4 antes de tocar em qualquer outra coisa"  # @src=65980a565711
                # | A pinned major in a repo this actively maintained is a decision, not
                # | neglect, drive-by major upgrades of core deps are the classic rejected
                # | first PR.
                feedback: "Um major fixado num repo tão ativamente mantido é uma decisão, não negligência, upgrades de major de passagem em deps centrais são o clássico primeiro PR rejeitado."  # @src=20f5cc59ff31
              d:
                # | Scope the new versions to your own member crate, so your patch uses 0.13
                # | and clap 4 idioms without moving the shared pins
                label: "Escopar as versões novas ao seu próprio crate membro, para o seu patch usar idiomas de 0.13 e clap 4 sem mover os pins compartilhados"  # @src=1c61a656d19c
                # | There is no per-member escape in this layout. agave centralizes versions
                # | in [workspace.dependencies], so one crate's clap is every crate's clap,
                # | and that coupling is exactly why the old pin holds.
                feedback: "Não existe escapatória por membro neste layout. O agave centraliza versões em [workspace.dependencies], então o clap de um crate é o clap de todo crate, e esse acoplamento é exatamente por que o pin antigo se sustenta."  # @src=5ae2cd365ecc
              b:
                # | Old pins mean old code: read the pinned MAJORS' docs for anything you
                # | touch, since 0.13-era or clap-4 idioms won't exist anywhere in this
                # | codebase yet
                label: "Pins antigos querem dizer código antigo: leia a documentação dos MAJORS fixados para qualquer coisa que você tocar, já que idiomas da era 0.13 ou do clap 4 ainda não vão existir em lugar nenhum desta base de código"  # @src=f3b9b0a650af
                # | Half right, you should code against the pinned versions, but the missing
                # | (and larger) read is that the pins are deliberate choices you don't
                # | relitigate inside an unrelated PR.
                feedback: "Meio certo, você deve codar contra as versões fixadas, mas a leitura que falta (e maior) é que os pins são escolhas deliberadas que você não relitiga dentro de um PR não relacionado."  # @src=90c933fdf6a3
              c:
                # | Deliberate pins are contracts: write your patch against 0.12 and clap 2
                # | idioms, and treat upgrading either as its own proposal, not a rider
                label: "Pins deliberados são contratos: escreva o seu patch contra idiomas de 0.12 e clap 2, e trate dar upgrade em qualquer um dos dois como uma proposta própria, não uma carona"  # @src=96efcb2a56a5
                # | A pin in a living repo is information: something is holding it,
                # | migration cost or behaviour risk or sheer review surface. Photon's sqlx
                # | comment linking the upstream issue is the shape to copy when you pin.
                feedback: "Um pin num repo vivo é informação: alguma coisa está segurando ele, custo de migração ou risco de comportamento ou pura superfície de review. O comentário de sqlx do photon linkando a issue upstream é o formato a copiar quando você fixar algo."  # @src=4a84fc371f66
  m05-l3:
    # | clap, a real probe arm, and a binary anyone can download
    title: "clap, um braço de sonda de verdade, e um binário que qualquer um pode baixar"  # @src=fb3d27afc4c1
    blocks:
      check:                      # quiz
        questions:
          m05l3-q1:
            # | You put #[derive(Parser)] on an Args struct with two subcommands and ran
            # | `cargo run -- --help`. Where did the formatted help screen, usage lines, and
            # | version string come from?
            prompt: "Você colocou #[derive(Parser)] numa struct Args com dois subcomandos e rodou `cargo run -- --help`. De onde vieram a tela de help formatada, as linhas de uso e a string de versão?"  # @src=74b2587007d3
            # | clap's derive is the same trick serde pulled last lesson: the type is the
            # | spec, and the macro generates the code, parser, validation, --help,
            # | --version, error messages. Your TS CLI's hand-rolled argument handling in M1
            # | is the 'before' picture; a doc comment on a field becoming its help line is
            # | the 'after'.
            explanation: "O derive do clap é o mesmo truque que o serde puxou na lição passada: o tipo é a spec, e a macro gera o código, parser, validação, --help, --version, mensagens de erro. O tratamento de argumentos feito à mão da sua CLI em TS no M1 é a figura do 'antes'; um doc comment num campo virando a linha de help dele é o 'depois'."  # @src=e2ae2650654b
            options:                 # source order — keep it
              a:
                # | Generated at compile time from your struct: field names, types, and doc
                # | comments become flags, value parsers, and help text
                label: "Gerado em tempo de compilação a partir da sua struct: nomes de campo, tipos e doc comments viram flags, parsers de valor e texto de help"  # @src=45c7ce095260
                # | Same trick serde pulled on your config: the type is the spec and the
                # | macro writes the machinery. That is why a doc comment on a variant turns
                # | into its line in the command list.
                feedback: "Mesmo truque que o serde puxou na sua config: o tipo é a spec e a macro escreve a maquinaria. É por isso que um doc comment numa variante vira a linha dela na lista de comandos."  # @src=a217c1bb7e9d
              c:
                # | From a clap.toml manifest the derive scaffolds next to Cargo.toml on
                # | first build, which you edit to customize the help output
                label: "De um manifest clap.toml que o derive gera por scaffold ao lado do Cargo.toml no primeiro build, e que você edita para customizar a saída de help"  # @src=bd4d3e559a83
                # | No side file exists, the struct IS the interface definition;
                # | customization happens through attributes and doc comments on the struct
                # | itself.
                feedback: "Não existe arquivo paralelo nenhum, a struct É a definição da interface; a customização acontece através de atributos e doc comments na própria struct."  # @src=3f07ab43d1b7
              d:
                # | Half derived, half runtime: the flags come from the struct, but version
                # | and about are read out of Cargo.toml on startup
                label: "Metade derivado, metade em tempo de execução: as flags vêm da struct, mas version e about são lidos do Cargo.toml na inicialização"  # @src=261e0e4a63df
                # | Nothing is read at startup. #[command(version, about)] bakes those
                # | strings in at compile time, which is why the Release asset a stranger
                # | downloads still prints -V with no Cargo.toml anywhere near it.
                feedback: "Nada é lido na inicialização. #[command(version, about)] assa essas strings em tempo de compilação, que é por que o Release asset que um estranho baixa ainda imprime -V sem nenhum Cargo.toml por perto."  # @src=7192412551cd
              b:
                # | From a help template clap ships and fills at runtime by reflecting over
                # | the binary's symbol table to discover argument names
                label: "De um template de help que o clap já traz e preenche em tempo de execução refletindo sobre a tabela de símbolos do binário para descobrir os nomes dos argumentos"  # @src=93fe4efc4fd4
                # | Rust has no runtime reflection to lean on, the derive macro reads your
                # | struct at COMPILE time and generates the parsing and help code right
                # | there.
                feedback: "Rust não tem reflexão em tempo de execução para se apoiar, a macro de derive lê a sua struct em tempo de COMPILAÇÃO e gera o código de parsing e de help ali mesmo."  # @src=e21fece3b37d
          m05l3-q2:
            # | You chose BLOCKING reqwest for the CLI's probe arm, knowing the poller next
            # | module will go async. Why is blocking the right engineering call here, not a
            # | shortcut?
            prompt: "Você escolheu o reqwest BLOCKING para o braço de sonda da CLI, sabendo que o poller do próximo módulo vai ser async. Por que blocking é a decisão certa de engenharia aqui, e não um atalho?"  # @src=eb32b6a6bfe4
            # | Concurrency is the thing async buys, and a sequential, short-lived CLI has
            # | none to exploit, a runtime would be pure overhead and a new concept spent on
            # | no benefit. The moment the poller wants fifty probes in flight on a schedule
            # | (next module's opening problem), the same crate grows the async delta.
            # | Choosing the simple tool ON PURPOSE, with the upgrade path named, is the
            # | lesson.
            explanation: "Concorrência é a coisa que async compra, e uma CLI sequencial e de vida curta não tem nenhuma para explorar, um runtime seria puro overhead e um conceito novo gasto sem nenhum benefício. No momento em que o poller quiser cinquenta sondas em voo num agendamento (o problema de abertura do próximo módulo), o mesmo crate cresce o delta de async. Escolher a ferramenta simples DE PROPÓSITO, com o caminho de upgrade nomeado, é a lição."  # @src=2f2869ee4c7e
            options:                 # source order — keep it
              c:
                # | Async reqwest can't run in a binary crate without a web framework
                # | attached, so a standalone CLI has to use the blocking client
                label: "O reqwest async não consegue rodar num crate binário sem um framework web acoplado, então uma CLI isolada tem que usar o cliente blocking"  # @src=e16f673f6d74
                # | Async runs fine in any binary with a runtime attached (tokio's main
                # | macro is one line), no framework needed. The reason is fit, not
                # | possibility.
                feedback: "Async roda bem em qualquer binário com um runtime acoplado (a macro main do tokio é uma linha), sem framework nenhum necessário. A razão é encaixe, não possibilidade."  # @src=b8ff99c6c6f2
              b:
                # | A CLI probing targets one at a time, then exiting, gains nothing from a
                # | runtime, async earns its cost when many probes are in flight at once
                label: "Uma CLI que sonda alvos um de cada vez, e depois sai, não ganha nada com um runtime, async paga o custo dele quando muitas sondas estão em voo ao mesmo tempo"  # @src=d1f5ccaaa417
                # | Concurrency is what async buys, and a sequential short-lived program has
                # | none to exploit. Naming the upgrade path (fifty probes on a schedule,
                # | next module) is what makes it a choice rather than a dodge.
                feedback: "Concorrência é o que async compra, e um programa sequencial e de vida curta não tem nenhuma para explorar. Nomear o caminho de upgrade (cinquenta sondas num agendamento, próximo módulo) é o que faz disso uma escolha em vez de uma esquiva."  # @src=873a6d1cf670
              a:
                # | Blocking is reqwest's mature default surface, the async API is the
                # | newer, still-stabilizing half of the crate and riskier to teach in a
                # | fundamentals course
                label: "Blocking é a superfície padrão madura do reqwest, a API async é a metade mais nova e ainda em estabilização do crate e mais arriscada de ensinar num curso de fundamentos"  # @src=67b721f3c322
                # | It's the reverse, async IS reqwest's default surface, and blocking is
                # | the feature-gated add-on. The choice is about the program's shape, not
                # | API maturity.
                feedback: "É o contrário, async É a superfície padrão do reqwest, e blocking é o add-on atrás de uma feature. A escolha é sobre o formato do programa, não sobre maturidade de API."  # @src=e2bf4a261836
              d:
                # | An async client would pull a tokio runtime into pulse-engine itself, and
                # | the pure core generally has to stay runtime-free for the WASM target
                # | m07-l2 wants
                label: "Um cliente async puxaria um runtime do tokio para dentro do próprio pulse-engine, e o núcleo puro em geral tem que continuar livre de runtime para o alvo WASM que o m07-l2 quer"  # @src=c1b04f9c9092
                # | The HTTP arm lives in pulse-cli either way, so the engine's purity is
                # | bought by crate placement, not by which client you pick. An async fetch
                # | would put tokio in the CLI and leave the engine untouched.
                feedback: "O braço de HTTP mora no pulse-cli de qualquer jeito, então a pureza do motor é comprada pela colocação de crate, não por qual cliente você escolhe. Um fetch async colocaria o tokio na CLI e deixaria o motor intocado."  # @src=742d65259b98
          m05l3-q3:
            # | Your latency-stats pass ran visibly faster after cargo build --release, and
            # | a u64 overflow that panicked in the debug build now wraps silently. What
            # | changed between the profiles?
            prompt: "A sua passagem de latency-stats rodou visivelmente mais rápido depois de cargo build --release, e um overflow de u64 que dava panic no build de debug agora dá wrap em silêncio. O que mudou entre os perfis?"  # @src=c0264bb208c3
            # | Profiles are named bundles of compiler settings: dev prioritizes compile
            # | speed and loud failures (overflow panics), release prioritizes runtime speed
            # | (opt-level 3, overflow wraps). That personality change is exactly why m04-l2
            # | taught checked_add, YOUR arithmetic tells the truth in both profiles, and
            # | why every performance number in this course is measured on --release.
            explanation: "Perfis são pacotes nomeados de configurações do compilador: dev prioriza velocidade de compilação e falhas barulhentas (overflow dá panic), release prioriza velocidade em tempo de execução (opt-level 3, overflow dá wrap). Essa mudança de personalidade é exatamente por que o m04-l2 ensinou checked_add, a SUA aritmética diz a verdade nos dois perfis, e por que todo número de performance neste curso é medido em --release."  # @src=971fb9a122c9
            options:                 # source order — keep it
              c:
                # | The profile flipped: optimizations on, debug assertions and overflow
                # | checks off, a different binary with a different personality
                label: "O perfil virou: otimizações ligadas, asserções de debug e checagens de overflow desligadas, um binário diferente com uma personalidade diferente"  # @src=dc156e453021
                # | opt-level, debug-assertions and overflow-checks are the three knobs
                # | behind the two personalities, which is why any performance claim made
                # | off a dev binary is off by an order of magnitude.
                feedback: "opt-level, debug-assertions e overflow-checks são os três botões por trás das duas personalidades, que é por que qualquer afirmação de performance feita a partir de um binário de dev está errada por uma ordem de grandeza."  # @src=a3d79069fe52
              b:
                # | Release runs the same machine code with runtime assertions disabled by
                # | an environment flag, which is why the speedup varies per machine
                label: "Release roda o mesmo código de máquina com asserções em tempo de execução desabilitadas por uma flag de ambiente, que é por que o ganho de velocidade varia por máquina"  # @src=732bad05a17e
                # | The machine code itself is different, the optimizer recompiles
                # | everything at opt-level 3; no environment flag is involved.
                feedback: "O código de máquina em si é diferente, o otimizador recompila tudo em opt-level 3; nenhuma flag de ambiente está envolvida."  # @src=ef5087fe7fb8
              d:
                # | Debug symbols: the dev binary carries them, so it runs slower and traps
                # | overflow, and release strips them for speed
                label: "Símbolos de debug: o binário de dev carrega eles, então ele roda mais devagar e captura overflow, e o release tira eles em nome da velocidade"  # @src=9378d625ecc8
                # | Symbols explain the size gap, not the speed gap and not the arithmetic.
                # | Overflow behaviour is the overflow-checks knob; you can keep full debug
                # | info in a release profile and it still wraps.
                feedback: "Símbolos explicam a diferença de tamanho, não a diferença de velocidade nem a aritmética. Comportamento de overflow é o botão overflow-checks; você pode manter informação de debug completa num perfil de release e ele ainda dá wrap."  # @src=75bfdc1aec32
              a:
                # | Release strips the standard library's safety checks from your binary,
                # | trading bounds checking and overflow detection for raw speed
                label: "Release tira as checagens de segurança da biblioteca padrão do seu binário, trocando checagem de limites e detecção de overflow por velocidade bruta"  # @src=26c469d3f496
                # | Bounds checks survive in release, indexing out of range still panics.
                # | Only specific debug-profile defaults (like overflow-checks) flip; std
                # | stays safe.
                feedback: "Checagens de limites sobrevivem no release, indexar fora do intervalo ainda dá panic. Só defaults específicos do perfil de debug (como overflow-checks) viram; o std continua seguro."  # @src=a70a30b9a7b9
          m05l3-q4:
            # | The tier-gate quotes the Rustonomicon telling you to 'turn back now.' You
            # | genuinely want to write Solana programs in Rust next. Per the gate's map,
            # | what's the honest route?
            prompt: "A trava do tier cita o Rustonomicon mandando você 'voltar agora.' Você genuinamente quer escrever programas Solana em Rust em seguida. Segundo o mapa da trava, qual é a rota honesta?"  # @src=6bc59ee85381
            # | The gate's map: what this tier taught IS the Rust that real program
            # | authoring builds on; lifetimes-beyond-reading and unsafe stay bookmarked
            # | behind the Rustonomicon, macro authoring behind TRPL's macros chapter and
            # | The Little Book of Rust Macros, with Rustlings and Comprehensive Rust as
            # | drills. The on-chain route runs through the Bitcoin-to-Solana evolution
            # | course's account-and-transaction concepts, with the Mastering Anchor course
            # | as the deep end once you ship. Turn back now, it is not necessary.
            explanation: "O mapa da trava: o que este tier ensinou É o Rust em que a autoria de programas de verdade se apoia; lifetimes-além-da-leitura e unsafe ficam como bookmark atrás do Rustonomicon, autoria de macros atrás do capítulo de macros do TRPL e do The Little Book of Rust Macros, com Rustlings e Comprehensive Rust como treinos. A rota on-chain passa pelos conceitos de conta e de transação do curso de evolução do Bitcoin à Solana, com o curso Mastering Anchor como a parte funda depois que você entregar. Volte agora, ele não é necessário."  # @src=fb8e5efd68f0
            options:                 # source order — keep it
              b:
                # | Work through the Rustonomicon first despite its warning, on-chain
                # | programs are systems code, and unsafe fluency is the real prerequisite
                label: "Percorra o Rustonomicon primeiro apesar do aviso dele, programas on-chain são código de sistemas, e fluência em unsafe é o pré-requisito de verdade"  # @src=dc4f0c2aad7f
                # | The disclaimer means what it says: writing programs (on-chain included)
                # | does not require the dark arts, frameworks like Anchor exist precisely
                # | so program authors write safe Rust.
                feedback: "O aviso quer dizer o que ele diz: escrever programas (on-chain incluídos) não exige as artes das trevas, frameworks como o Anchor existem precisamente para que autores de programas escrevam Rust seguro."  # @src=2125950941df
              d:
                # | Enroll straight into the Mastering Anchor course, its V2 material is the
                # | on-ramp this tier hands you and the account model arrives with it
                label: "Matricule-se direto no curso Mastering Anchor, o material V2 dele é a rampa de entrada que este tier te passa e o modelo de conta chega junto"  # @src=ab4c7dc84fd7
                # | That course states its own bar: you already ship Anchor programs and
                # | want the V2 delta. It is the deep end. The account and transaction
                # | concepts live in the Bitcoin-to-Solana evolution course instead.
                feedback: "Esse curso declara a própria barra dele: você já entrega programas Anchor e quer o delta do V2. Ele é a parte funda. Os conceitos de conta e de transação moram no curso de evolução do Bitcoin à Solana, em vez disso."  # @src=10a919d70365
              c:
                # | Finish TRPL cover to cover, then Comprehensive Rust in full, program
                # | authoring needs the language's whole surface before any of the chain
                # | makes sense
                label: "Termine o TRPL de capa a capa, depois o Comprehensive Rust inteiro, autoria de programas precisa da superfície inteira da linguagem antes que qualquer parte da blockchain faça sentido"  # @src=60f78bf0843c
                # | Breadth-first completionism is what the 80/20 seam exists to prevent,
                # | the gate's resources are drills and references to pull from as needed,
                # | not prerequisites to exhaust.
                feedback: "Completismo em largura primeiro é o que a costura 80/20 existe para prevenir, os recursos da trava são treinos e referências de onde puxar conforme a necessidade, não pré-requisitos a esgotar."  # @src=1425dc046a3a
              a:
                # | Your exit level here, structs, enums, traits, Result, serde, plus the
                # | concept course's account model, then Anchor practice; unsafe and deep
                # | lifetimes are not on that path
                label: "O seu nível de saída aqui, structs, enums, traits, Result, serde, mais o modelo de conta do curso de conceitos, depois prática de Anchor; unsafe e lifetimes profundos não estão nesse caminho"  # @src=d14e00904aa2
                # | Reading level from here, account and transaction concepts from the
                # | Bitcoin-to-Solana course, reps on your own. What remains after this tier
                # | is shipping experience, not vocabulary.
                feedback: "Nível de leitura daqui, conceitos de conta e de transação do curso do Bitcoin à Solana, reps por sua conta. O que resta depois deste tier é experiência de entrega, não vocabulário."  # @src=10bc49b3a1fd
  m06-l1:
    # | A daemon, not a script: tokio + a /status endpoint
    title: "Um daemon, não um script: tokio + um endpoint /status"  # @src=895ea53ce045
    blocks:
      check:                      # quiz
        questions:
          m06-l1-q1:
            # | Your poller probes 40 targets every 30 seconds, and each probe spends almost
            # | all its time waiting on the network. What does tokio's async model actually
            # | buy you here?
            prompt: "O seu poller sonda 40 alvos a cada 30 segundos, e cada sonda passa quase todo o tempo dela esperando na rede. O que o modelo async do tokio de fato te compra aqui?"  # @src=51b9f38af265
            # | Async is a concurrency model for waiting. Your probes are I/O-bound: the
            # | runtime parks each task at its .await and resumes it when the socket has
            # | news, so 40 concurrent probes cost roughly one thread instead of 40. This is
            # | the same suspension model you used in m02-l3's TS fleet, tokio just makes
            # | the runtime an explicit dependency instead of an ambient event loop.
            explanation: "Async é um modelo de concorrência para esperar. As suas sondas são I/O-bound: o runtime estaciona cada task no .await dela e retoma ela quando o socket tem novidade, então 40 sondas concorrentes custam aproximadamente uma thread em vez de 40. Este é o mesmo modelo de suspensão que você usou na frota TS do m02-l3, o tokio só torna o runtime uma dependência explícita em vez de um event loop ambiente."  # @src=41fcd74b0259
            options:                 # source order — keep it
              c:
                # | One thread can park all 40 in-flight requests and resume each task when
                # | its I/O completes
                label: "Uma thread só consegue estacionar todas as 40 requisições em voo e retomar cada task quando o I/O dela completa"  # @src=f14e1e75635f
                # | A parked task is a few hundred bytes of state, so 40 in flight cost
                # | roughly one thread. Same suspension model as m02-l3's TS fleet, with the
                # | scheduler now a crate in your lockfile.
                feedback: "Uma task estacionada é algumas centenas de bytes de estado, então 40 em voo custam aproximadamente uma thread. Mesmo modelo de suspensão da frota TS do m02-l3, com o escalonador agora sendo um crate no seu lockfile."  # @src=52d6f5987199
              a:
                # | Each individual HTTP request completes faster, because async I/O has
                # | lower latency than blocking I/O
                label: "Cada requisição HTTP individual completa mais rápido, porque I/O async tem latência menor do que I/O blocking"  # @src=cec15ab0e69f
                # | Async does not speed up a single request, the network takes what the
                # | network takes. It changes how many WAITS one thread can hold at once,
                # | not how long each wait lasts.
                feedback: "Async não acelera uma requisição única, a rede leva o que a rede leva. Ele muda quantas ESPERAS uma thread consegue segurar ao mesmo tempo, não quanto tempo cada espera dura."  # @src=f42174d0237b
              b:
                # | The runtime spawns one OS thread per target, so the kernel schedules all
                # | 40 probes at once
                label: "O runtime dá spawn em uma thread de sistema operacional por alvo, então o kernel escalona todas as 40 sondas ao mesmo tempo"  # @src=babd868ea901
                # | That describes plain threads, not async. Tokio's point is the opposite:
                # | many tasks multiplexed onto few threads, parked while they wait.
                feedback: "Isso descreve threads simples, não async. O ponto do tokio é o oposto: muitas tasks multiplexadas em poucas threads, estacionadas enquanto esperam."  # @src=dedb397237df
              d:
                # | The runtime spreads probe work across all your cores, so one sweep
                # | finally uses the whole CPU
                label: "O runtime espalha o trabalho de sonda por todos os seus cores, então uma varredura finalmente usa a CPU inteira"  # @src=6a60d839b5e4
                # | That is parallelism, and these probes have almost no CPU work to spread.
                # | The thread is parked in a syscall waiting for bytes; more cores buy
                # | nothing when nobody is computing.
                feedback: "Isso é paralelismo, e estas sondas quase não têm trabalho de CPU para espalhar. A thread está estacionada numa syscall esperando bytes; mais cores não compram nada quando ninguém está computando."  # @src=bfd3e7055ac0
          m06-l1-q2:
            # | Your M5 CLI does one blocking fetch, prints the latency, and exits. A
            # | teammate suggests migrating it to tokio 'for performance'. What does that
            # | migration actually buy?
            prompt: "A sua CLI do M5 faz um fetch blocking, imprime a latência, e sai. Um colega de time sugere migrar ela para o tokio 'por performance'. O que aquela migração de fato compra?"  # @src=dbdda6e47a33
            # | Async pays at fan-out. One blocking call in a short-lived CLI is the honest
            # | right-size, which is why m05-l3 taught blocking reqwest first and why this
            # | lesson only reaches for tokio once the poller needs many concurrent probes
            # | on a schedule.
            explanation: "Async se paga no fan-out. Uma chamada blocking numa CLI de vida curta é o tamanho certo honesto, que é por que o m05-l3 ensinou reqwest blocking primeiro e por que esta lição só corre atrás do tokio quando o poller precisa de muitas sondas concorrentes num agendamento."  # @src=73506628b1f8
            options:                 # source order — keep it
              a:
                # | Nothing much, a single request that blocks once and exits has no fan-out
                # | for a runtime to exploit
                label: "Não muita coisa, uma requisição única que bloqueia uma vez e sai não tem fan-out nenhum para um runtime explorar"  # @src=f2fa5353b6f8
                # | The migration buys a dependency and an annotation. Async pays at
                # | fan-out, which is exactly why the poller in this lesson earns tokio and
                # | the CLI still does not.
                feedback: "A migração compra uma dependência e uma anotação. Async se paga no fan-out, que é exatamente por que o poller desta lição ganha o tokio e a CLI ainda não."  # @src=35a9da5cb777
              c:
                # | It is required anyway, reqwest cannot make any request without a tokio
                # | runtime present to drive it
                label: "É obrigatório de qualquer jeito, o reqwest não consegue fazer requisição nenhuma sem um runtime tokio presente para dirigir ela"  # @src=a0203a2c0ad8
                # | You disproved this yourself in m05-l3: reqwest's `blocking` feature is
                # | exactly the sanctioned no-runtime path for simple tools.
                feedback: "Você mesmo desmentiu isso em m05-l3: a feature `blocking` do reqwest é exatamente o caminho sem-runtime sancionado para ferramentas simples."  # @src=0acd9ecc6dcb
              d:
                # | Overlap inside the one request: DNS, the TCP handshake and TLS run
                # | concurrently instead of in sequence
                label: "Sobreposição dentro da requisição única: DNS, o handshake TCP e TLS rodam concorrentemente em vez de em sequência"  # @src=3e8eddb2b11f
                # | Those phases are sequential by protocol: you cannot handshake with an
                # | address you have not resolved. Async overlaps separate requests, never
                # | the stages inside one.
                feedback: "Essas fases são sequenciais por protocolo: você não consegue dar handshake com um endereço que você não resolveu. Async sobrepõe requisições separadas, nunca os estágios dentro de uma."  # @src=7512d40de8c7
              b:
                # | Lower latency on that one request, since async I/O bypasses the blocking
                # | syscall path in the kernel
                label: "Latência menor naquela requisição única, já que I/O async passa por cima do caminho de syscall blocking no kernel"  # @src=4287c7b10b69
                # | The request itself is not faster, async changes scheduling of many
                # | waits, not the duration of one. For a single fetch the runtime is pure
                # | overhead.
                feedback: "A requisição em si não é mais rápida, async muda o escalonamento de muitas esperas, não a duração de uma. Para um fetch único o runtime é puro overhead."  # @src=9f5f24fd45b9
          m06-l1-q3:
            # | You migrate the probe from m05-l3's blocking fetch to the async form for the
            # | poll loop. What is the actual delta in your code and Cargo.toml?
            prompt: "Você migra a sonda do fetch blocking do m05-l3 para a forma async do poll loop. Qual é o delta de verdade no seu código e no Cargo.toml?"  # @src=ab3681d15579
            # | This is why the course sequenced reqwest this way: you met reqwest in
            # | blocking form when one fetch was all you needed, so the async migration is a
            # | visible, small delta, feature flag out.await in, runtime around it, instead
            # | of a first contact tangled up with tokio.
            explanation: "É por isso que o curso sequenciou o reqwest deste jeito: você conheceu o reqwest na forma blocking quando um fetch era tudo de que você precisava, então a migração para async é um delta pequeno e visível, feature flag fora, .await dentro, runtime em volta, em vez de um primeiro contato embolado com o tokio."  # @src=ef9fc26bff62
            options:                 # source order — keep it
              c:
                # | The request switches protocols, async reqwest negotiates HTTP/2 while
                # | blocking stays HTTP/1.1
                label: "A requisição troca de protocolo, o reqwest async negocia HTTP/2 enquanto blocking fica em HTTP/1.1"  # @src=2e0e9a01f977
                # | Protocol negotiation is independent of the blocking/async split. The
                # | delta is the execution model, not the wire format.
                feedback: "Negociação de protocolo é independente da divisão blocking/async. O delta é o modelo de execução, não o formato dos bytes no fio."  # @src=945ed21e7fec
              b:
                # | Same crate: drop the `blocking` feature, and the call sites gain .await
                # | inside the runtime
                label: "Mesmo crate: largue a feature `blocking`, e os pontos de chamada ganham .await dentro do runtime"  # @src=57f6f9cffd7f
                # | Three edits, one manifest line and two source lines. That small diff is
                # | why m05-l3 met reqwest in blocking form first instead of meeting it
                # | tangled up with a runtime.
                feedback: "Três edições, uma linha de manifest e duas linhas de fonte. Esse diff pequeno é por que o m05-l3 conheceu o reqwest na forma blocking primeiro em vez de conhecer ele embolado com um runtime."  # @src=9e1c4f99fd7e
              a:
                # | Swap to a different crate, the async client ships as a separate package
                # | from blocking reqwest
                label: "Troque para um crate diferente, o cliente async vem como um pacote separado do reqwest blocking"  # @src=19f17e022c4d
                # | Same crate. The blocking client is a feature-gated wrapper inside
                # | reqwest itself; async is the crate's default face.
                feedback: "Mesmo crate. O cliente blocking é um wrapper protegido por uma feature dentro do próprio reqwest; async é a cara default do crate."  # @src=f8a3ae0da935
              d:
                # | Only the call sites: add .await, and Rust's built-in executor drives the
                # | futures for you
                label: "Só os pontos de chamada: adicione .await, e o executor embutido do Rust dirige os futures para você"  # @src=b1ab49ff74e6
                # | There is no built-in executor. An async fn call builds a value
                # | describing the work and something has to drive it, which is why
                # | #[tokio::main] is the third edit and the only genuinely new one.
                feedback: "Não existe executor embutido. Uma chamada de async fn constrói um valor descrevendo o trabalho e alguma coisa tem que dirigir ele, que é por que #[tokio::main] é a terceira edição e a única genuinamente nova."  # @src=7fd089b7b0b4
          m06-l1-q4:
            # | The /status handler must read the same probe-state the poll loop writes. How
            # | does the worked axum drop-in share that state?
            prompt: "O handler de /status tem que ler o mesmo estado-de-sonda que o poll loop escreve. Como o drop-in de axum resolvido compartilha aquele estado?"  # @src=2bae2ba34e48
            # | The drop-in's one real idea: shared ownership (Arc) plus synchronized
            # | interior access, with the handler holding a cheap clone of the pointer. The
            # | lesson's footgun list is the corollary, never hold the lock across an
            # | .await. You edit this seam; you do not have to invent it.
            explanation: "A única ideia de verdade do drop-in: ownership compartilhado (Arc) mais acesso interior sincronizado, com o handler segurando um clone barato do ponteiro. A lista de footguns da lição é o corolário, nunca segure o lock através de um .await. Você edita esta costura; você não tem que inventar ela."  # @src=cd5a984f906a
            options:                 # source order — keep it
              b:
                # | Both sides write through a global `static mut` that the loop and handler
                # | share directly
                label: "Os dois lados escrevem através de um `static mut` global que o loop e o handler compartilham diretamente"  # @src=d83d195df614
                # | Rust denies unsynchronized `static mut` references (deny-by-default in
                # | edition 2024) precisely because this is a data race. The compiler is
                # | vetoing this design for you.
                feedback: "O Rust nega referências não sincronizadas a `static mut` (deny-by-default na edition 2024) precisamente porque isso é uma data race. O compilador está vetando este design para você."  # @src=90c0415eae28
              a:
                # | The handler re-runs every probe on demand, so each /status request
                # | produces fresh results
                label: "O handler re-roda toda sonda sob demanda, então cada requisição de /status produz resultados frescos"  # @src=3ad68dde4ebc
                # | That would make /status as slow as a full sweep and hammer your targets
                # | on every curl. The endpoint reports state; the loop owns producing it.
                feedback: "Isso deixaria /status tão lento quanto uma varredura inteira e martelaria os seus alvos a cada curl. O endpoint reporta estado; o loop é dono de produzir ele."  # @src=51b3d4aca805
              c:
                # | The state lives behind an Arc with interior synchronization, cloned into
                # | the handler at router build time
                label: "O estado mora atrás de um Arc com sincronização interior, clonado para dentro do handler na hora de construir o router"  # @src=4c242f9aed1b
                # | Cloning an Arc copies a pointer and bumps a counter, so the loop and the
                # | router hold two handles on one map. The corollary is the lock rule:
                # | snapshot under the guard, serialize after it drops.
                feedback: "Clonar um Arc copia um ponteiro e incrementa um contador, então o loop e o router seguram dois handles sobre um mapa só. O corolário é a regra do lock: snapshot sob a trava, serialize depois que ela é solta."  # @src=62e74cfe8f48
              d:
                # | with_state clones the HashMap into the router, so the handler reads its
                # | own copy and never blocks the loop
                label: "with_state clona o HashMap para dentro do router, então o handler lê a própria cópia dele e nunca bloqueia o loop"  # @src=6918779631cd
                # | Then /status would answer with whatever the map held at boot, which is
                # | empty. It is the Arc that gets cloned, not the map, and the Mutex
                # | underneath is what arbitrates the two handles.
                feedback: "Aí /status responderia com o que quer que o mapa segurasse no boot, que é vazio. É o Arc que é clonado, não o mapa, e o Mutex embaixo é o que arbitra os dois handles."  # @src=8542ff02fc16
  m06-l2:
    # | Containers 101: put the poller in a box
    title: "Contêineres 101: ponha o poller numa caixa"  # @src=65e59399319a
    blocks:
      check:                      # quiz
        questions:
          m06-l2-q1:
            # | You run `docker run hello-world` twice in a row. The first run prints pull
            # | progress; the second starts instantly. Why?
            prompt: "Você roda `docker run hello-world` duas vezes seguidas. A primeira execução imprime progresso de pull; a segunda inicia instantaneamente. Por quê?"  # @src=079888610301
            # | Images are pulled once and cached locally by layer; containers are cheap,
            # | disposable processes created from them. The pull-progress-then-instant
            # | pattern is the image/container split showing itself on your first command.
            explanation: "Imagens recebem pull uma vez e ficam em cache local por camada; contêineres são processos baratos e descartáveis criados a partir delas. O padrão progresso-de-pull-depois-instantâneo é a divisão imagem/contêiner se mostrando no seu primeiro comando."  # @src=313942949a0f
            options:                 # source order — keep it
              d:
                # | The image cached and so did its writable layer, so run two resumed the
                # | first container's filesystem
                label: "A imagem foi para o cache e a camada gravável dela também, então a execução dois retomou o sistema de arquivos do primeiro contêiner"  # @src=ec9940994052
                # | Right about the image, wrong about the layer. The writable layer belongs
                # | to the container, not the image, and `docker ps -a` proves it by listing
                # | two separate exited containers.
                feedback: "Certo sobre a imagem, errado sobre a camada. A camada gravável pertence ao contêiner, não à imagem, e o `docker ps -a` prova isso listando dois contêineres separados que saíram."  # @src=3afcc6d8268f
              c:
                # | The registry's CDN warmed up after your first request, so the second
                # | pull came down faster
                label: "O CDN do registro aqueceu depois da sua primeira requisição, então o segundo pull desceu mais rápido"  # @src=b05ffc0f6ad7
                # | No second pull happened at all, the layers were already on disk.
                # | Registries serve machines that do not yet have the image; your machine
                # | now does.
                feedback: "Não houve segundo pull nenhum, as camadas já estavam em disco. Registros servem máquinas que ainda não têm a imagem; a sua máquina agora tem."  # @src=ea84035e390f
              a:
                # | The image is now in your local cache, so the second run skips the
                # | registry pull entirely
                label: "A imagem agora está no seu cache local, então a segunda execução pula o pull do registro por completo"  # @src=6b46c4adca43
                # | Images are pulled once and cached by layer; containers are stamped out
                # | fresh every time. That split is the whole architecture showing itself on
                # | your first command.
                feedback: "Imagens recebem pull uma vez e ficam em cache por camada; contêineres são estampados novos toda vez. Essa divisão é a arquitetura inteira se mostrando no seu primeiro comando."  # @src=e86f11633317
              b:
                # | Docker kept the first container alive in the background and reattached
                # | you to it on run two
                label: "O Docker manteve o primeiro contêiner vivo em segundo plano e te reconectou a ele na execução dois"  # @src=dd37b67a8588
                # | Each `docker run` creates a NEW container from the image. The first
                # | container exited when its process did, nothing was reused except the
                # | image.
                feedback: "Cada `docker run` cria um contêiner NOVO a partir da imagem. O primeiro contêiner saiu quando o processo dele saiu, nada foi reusado a não ser a imagem."  # @src=bd7b997c2a17
          m06-l2-q2:
            # | You built one pulse-pollerd image and ran `docker run` on it three times
            # | (stopping each). What exists on your machine now?
            prompt: "Você construiu uma imagem pulse-pollerd e rodou `docker run` nela três vezes (parando cada uma). O que existe na sua máquina agora?"  # @src=639219b43e0f
            # | The image is the immutable template; every `docker run` stamps out a fresh
            # | container (process + thin writable layer) from it. This is why the
            # | mental-model diagram matters before multi-stage builds: everything later
            # | manipulates the template, never the running copies.
            explanation: "A imagem é o template imutável; todo `docker run` estampa um contêiner novo (processo + camada gravável fina) a partir dela. É por isso que o diagrama de modelo mental importa antes dos builds multi-stage: tudo depois manipula o template, nunca as cópias rodando."  # @src=ee6e860870d2
            options:                 # source order — keep it
              b:
                # | One image and three (stopped) containers created from it
                label: "Uma imagem e três contêineres (parados) criados a partir dela"  # @src=5b902ad70a7d
                # | `docker ps -a` is the receipt: three exited entries with auto-generated
                # | names, one image underneath. Builds make images, runs make containers,
                # | and nothing crosses that line.
                feedback: "O `docker ps -a` é o comprovante: três entradas que saíram com nomes gerados automaticamente, uma imagem embaixo. Builds fazem imagens, execuções fazem contêineres, e nada cruza essa linha."  # @src=215cda882518
              e:
                # | One image three layers taller, each run committing its writes back
                label: "Uma imagem três camadas mais alta, cada execução commitando as escritas dela de volta"  # @src=ad8854c600b4
                # | Only a build adds layers. A run's writes land in that container's own
                # | writable layer and die with it; the template underneath is never
                # | touched, which is what lets three containers share one image.
                feedback: "Só um build adiciona camadas. As escritas de uma execução caem na camada gravável do próprio contêiner e morrem com ele; o template debaixo nunca é tocado, que é o que deixa três contêineres compartilharem uma imagem."  # @src=48cfafb6011c
              a:
                # | Three images and one container, each run snapshots the image again
                label: "Três imagens e um contêiner, cada execução tira um snapshot da imagem de novo"  # @src=ba36614edf3f
                # | Backwards: runs never create images. Building creates images; running
                # | creates containers.
                feedback: "Ao contrário: execuções nunca criam imagens. Construir cria imagens; rodar cria contêineres."  # @src=3056fdc0b908
              d:
                # | One image and nothing else, stopped containers vanish
                label: "Uma imagem e nada mais, contêineres parados desaparecem"  # @src=aeced530dd4d
                # | Plain `docker ps` hides them, which is where this belief comes from, but
                # | `docker ps -a` lists all three corpses. Deleting on exit is what the
                # | `--rm` flag opts into.
                feedback: "O `docker ps` pelado esconde eles, que é de onde vem essa crença, mas o `docker ps -a` lista os três cadáveres. Deletar na saída é no que a flag `--rm` opta."  # @src=a13bcb2d1ca5
              c:
                # | One container whose filesystem merged the three runs' changes
                label: "Um contêiner cujo sistema de arquivos juntou as mudanças das três execuções"  # @src=36922f14e4e5
                # | Containers do not merge. Each run got its own writable layer on top of
                # | the same immutable image, and each exited independently.
                feedback: "Contêineres não se juntam. Cada execução ganhou a própria camada gravável em cima da mesma imagem imutável, e cada uma saiu independentemente."  # @src=b213302cdd74
          m06-l2-q3:
            # | At a coworking space your build fails pulling the rust base image with a 429
            # | error. At home the same build works. What is going on?
            prompt: "Num coworking o seu build falha dando pull na imagem base rust com um erro 429. Em casa o mesmo build funciona. O que está acontecendo?"  # @src=bc936ef3b8b9
            # | Unauthenticated Docker Hub pulls are capped at 100 per 6 hours per IPv4
            # | address (or IPv6 /64), and behind coworking/campus/CI NAT, everyone shares
            # | that pool. A free account and `docker login` gives you your own 200 per 6
            # | hours; only the paid Pro, Team, and Business plans get an unlimited pull
            # | rate (docs.docker.com/docker-hub/usage/, read 2026-09-06). That is why this
            # | lesson teaches the login before your first real pull, with GHCR waiting in
            # | m06-l4 as the escape hatch.
            explanation: "Pulls não autenticados no Docker Hub são limitados a 100 por 6 horas por endereço IPv4 (ou IPv6 /64) e, atrás de um NAT de coworking/campus/CI, todo mundo compartilha aquele pool. Uma conta gratuita e o `docker login` te dão os seus próprios 200 por 6 horas; só os planos pagos Pro, Team e Business ganham uma taxa de pull ilimitada (docs.docker.com/docker-hub/usage/, lido em 2026-09-06). É por isso que esta lição ensina o login antes do seu primeiro pull de verdade, com o GHCR esperando no m06-l4 como a saída de emergência."  # @src=86be860c96e9
            options:                 # source order — keep it
              d:
                # | Shared-IP pulls are capped, and a free account typically clears it,
                # | since logging in gives you unlimited pulls
                label: "Pulls de IP compartilhado são limitados, e uma conta gratuita tipicamente resolve isso, já que fazer login te dá pulls ilimitados"  # @src=888e3d4765a3
                # | Right diagnosis, wrong ceiling. A free Personal account raises you to
                # | your own 200 pulls per 6 hours; only the paid Pro, Team and Business
                # | plans get an unlimited pull rate. Read the usage table before you quote
                # | a number.
                feedback: "Diagnóstico certo, teto errado. Uma conta Personal gratuita te eleva aos seus próprios 200 pulls por 6 horas; só os planos pagos Pro, Team e Business ganham uma taxa de pull ilimitada. Leia a tabela de uso antes de citar um número."  # @src=09f2d2813872
              c:
                # | Unauthenticated pulls are capped per shared IPv4 address, `docker login`
                # | moves you to your own allowance
                label: "Pulls não autenticados são limitados por endereço IPv4 compartilhado, o `docker login` te move para a sua própria cota"  # @src=6b9247d9c5eb
                # | The symptom pattern is the diagnosis: location-dependent, reproducible,
                # | and 429 rather than not-found. Behind coworking NAT you are spending the
                # | building's 100 per 6 hours, not your own.
                feedback: "O padrão de sintoma é o diagnóstico: dependente de localização, reproduzível, e 429 em vez de not-found. Atrás do NAT de um coworking você está gastando os 100 por 6 horas do prédio, não os seus."  # @src=b0d36c43c557
              a:
                # | The Dockerfile is wrong, a bad base-image tag returns 429 until you
                # | correct it
                label: "O Dockerfile está errado, uma tag de imagem base ruim retorna 429 até você corrigir"  # @src=2b1c12801920
                # | A bad tag returns not-found, not 429. Rate limits are about who is
                # | asking and how often, not what is asked for.
                feedback: "Uma tag ruim retorna not-found, não 429. Rate limits são sobre quem está pedindo e com que frequência, não sobre o que é pedido."  # @src=becc096ae545
              b:
                # | Docker Hub is having an outage that happens to coincide with your
                # | coworking sessions
                label: "O Docker Hub está com uma queda que por acaso coincide com as suas sessões de coworking"  # @src=da36a7d3c64f
                # | The tell is that it is location-dependent and reproducible. Outages do
                # | not follow your commute; shared-IP rate limits do.
                feedback: "O sinal é que isso é dependente de localização e reproduzível. Quedas não seguem o seu trajeto para o trabalho; rate limits de IP compartilhado seguem."  # @src=96015502a9bd
          m06-l2-q4:
            # | Your poller binary is a few megabytes, but `docker images` shows the naive
            # | image at multiple gigabytes. Where did the weight come from?
            prompt: "O binário do seu poller tem poucos megabytes, mas o `docker images` mostra a imagem ingênua em vários gigabytes. De onde veio o peso?"  # @src=2e442ff66670
            # | A single-stage build's final image IS its build environment: rust base image
            # | plus dependencies plus your entire target/ directory. Nothing in it is
            # | needed to RUN the binary, which is precisely next lesson's opening problem
            # | and the whole argument for multi-stage builds.
            explanation: "A imagem final de um build single-stage É o ambiente de build dele: imagem base rust mais dependências mais o seu diretório target/ inteiro. Nada nela é necessário para RODAR o binário, que é precisamente o problema de abertura da próxima lição e o argumento inteiro para builds multi-stage."  # @src=c7cc70b19011
            options:                 # source order — keep it
              a:
                # | The single stage ships everything the build needed, the Rust toolchain,
                # | sources, and the target/ cache, in the final layers
                label: "O estágio único entrega tudo que o build precisou, o toolchain Rust, as fontes e o cache do target/, nas camadas finais"  # @src=1f455066cf2d
                # | `docker history` prices it row by row: the toolchain layers are the true
                # | giants, the RUN cargo build row is the heaviest one you caused, and none
                # | of it is needed to RUN the binary.
                feedback: "O `docker history` precifica isso linha por linha: as camadas do toolchain são os gigantes de verdade, a linha do RUN cargo build é a mais pesada que você causou, e nada disso é necessário para RODAR o binário."  # @src=23da49362b8c
              d:
                # | The build context dragged your host target/ directory in, so the image
                # | ships a cache it did not need
                label: "O contexto de build arrastou o diretório target/ do seu host para dentro, então a imagem entrega um cache de que ela não precisava"  # @src=0be499906ec2
                # | That is what .dockerignore fenced off in step 1, and the
                # | transferring-context line proves it stayed out. The target/ inside the
                # | image was produced by the RUN cargo build layer, not carried in from
                # | your laptop.
                feedback: "É isso que o .dockerignore cercou no passo 1, e a linha de transferring-context prova que ele ficou de fora. O target/ dentro da imagem foi produzido pela camada do RUN cargo build, não carregado do seu laptop."  # @src=6c2ee9824afd
              c:
                # | Docker adds a fixed multi-gigabyte runtime layer to every image so
                # | containers can execute
                label: "O Docker adiciona uma camada de runtime fixa de vários gigabytes a toda imagem para que contêineres possam executar"  # @src=f9c232c9e0b0
                # | Docker adds nothing to your image; images can be a few megabytes. The
                # | runtime lives on the host, the weight here is entirely what your
                # | Dockerfile chose to keep.
                feedback: "O Docker não adiciona nada à sua imagem; imagens podem ter poucos megabytes. O runtime mora no host, o peso aqui é inteiramente o que o seu Dockerfile escolheu guardar."  # @src=244af60cd814
              b:
                # | Static linking bloated the binary itself to container scale during the
                # | release build
                label: "A linkagem estática inflou o próprio binário até a escala de contêiner durante o build de release"  # @src=1a08315f5264
                # | The binary is still megabytes, check it inside the container. The
                # | gigabytes are around it: compiler, registry cache, intermediate
                # | artifacts, all frozen into shipped layers.
                feedback: "O binário continua em megabytes, confira ele dentro do contêiner. Os gigabytes estão em volta dele: compilador, cache de registro, artefatos intermediários, tudo congelado em camadas entregues."  # @src=3df63bdaade2
  m06-l3:
    # | Two Dockerfiles, one idea: multi-stage honesty
    title: "Dois Dockerfiles, uma ideia: a honestidade do multi-stage"  # @src=a7a9e2253327
    blocks:
      check-stages:                      # quiz
        questions:
          m06-l3-q1:
            # | Your multi-stage build still produces a huge image. Reading the Dockerfile,
            # | which property actually determines what ships in the final image?
            prompt: "O seu build multi-stage ainda produz uma imagem enorme. Lendo o Dockerfile, qual propriedade de fato determina o que é entregue na imagem final?"  # @src=1c18bdbd9d77
            # | The whole multi-stage idea in one rule: the final image = final base +
            # | explicit COPYs. If it still weighs too much, either your runtime base is fat
            # | or you copied build artifacts forward, read the COPY lines, not the
            # | compressor.
            explanation: "A ideia inteira do multi-stage em uma regra: a imagem final = base final + COPYs explícitos. Se ela ainda pesa demais, ou a sua base de runtime é gorda ou você copiou artefatos de build para a frente, leia as linhas COPY, não o compressor."  # @src=39ac4533ec1c
            options:                 # source order — keep it
              b:
                # | Only what the final stage's base contains plus what you COPY --from into
                # | it, earlier stages are left behind entirely
                label: "Só o que a base do estágio final contém mais o que você traz com COPY --from para dentro dela, os estágios anteriores ficam para trás por inteiro"  # @src=90e713b26f00
                # | Read the COPY lines, not the compressor. If the image is still heavy,
                # | either the runtime base is fat or you copied build artifacts forward.
                feedback: "Leia as linhas COPY, não o compressor. Se a imagem ainda está pesada, ou a base de runtime é gorda ou você copiou artefatos de build para a frente."  # @src=f4a97e2c3b94
              c:
                # | Whether the release build stripped debug symbols before the image was
                # | assembled
                label: "Se o build de release removeu os símbolos de debug antes de a imagem ser montada"  # @src=36ff6b46feec
                # | Stripping shaves megabytes off the binary; the gigabytes are the build
                # | environment. Symbol stripping cannot rescue a Dockerfile that copies the
                # | wrong things forward.
                feedback: "Remover símbolos tira megabytes do binário; os gigabytes são o ambiente de build. Remoção de símbolos não salva um Dockerfile que copia as coisas erradas para a frente."  # @src=c7e3e1c57352
              a:
                # | The compression Docker applies when it exports the final image's layers
                label: "A compressão que o Docker aplica quando exporta as camadas da imagem final"  # @src=7f8114b8b9f3
                # | Layer compression is marginal and automatic. If the toolchain is in your
                # | final stage, compression will dutifully ship a compressed toolchain.
                feedback: "A compressão de camadas é marginal e automática. Se o toolchain está no seu estágio final, a compressão vai entregar com todo o zelo um toolchain comprimido."  # @src=87b08a338b6e
              d:
                # | Only the final stage's base image, since COPY --from links artifacts in
                # | rather than adding layers
                label: "Só a imagem base do estágio final, já que o COPY --from liga os artefatos em vez de adicionar camadas"  # @src=0d091a488d54
                # | COPY --from writes real bytes into a real layer; there is no linking
                # | across stages. The slim poller image is its Debian base PLUS the binary
                # | and the config, which is why it lands near 121 MB rather than at the
                # | base's size.
                feedback: "O COPY --from escreve bytes de verdade em uma camada de verdade; não existe linkagem entre estágios. A imagem slim do poller é a base Debian dela MAIS o binário e a config, que é o motivo de ela aterrissar perto de 121 MB em vez de no tamanho da base."  # @src=1582f9f7fce5
          m06-l3-q2:
            # | cargo-chef adds prepare and cook stages to your Dockerfile. What problem is
            # | that machinery actually solving?
            prompt: "O cargo-chef adiciona estágios prepare e cook ao seu Dockerfile. Que problema esse maquinário está de fato resolvendo?"  # @src=c0c794f9bc82
            # | The prepare step extracts a recipe (your dependency graph); cook builds just
            # | the dependencies into a cacheable layer. Edit your source and only your
            # | crate recompiles, the README claims up to 5x faster builds, and this lesson
            # | attributes that claim rather than asserting it.
            explanation: "A etapa prepare extrai uma receita (o seu grafo de dependências); o cook constrói só as dependências dentro de uma camada cacheável. Edite a sua fonte e só o seu crate recompila, o README afirma builds até 5x mais rápidos, e esta lição atribui essa afirmação em vez de asseverar ela."  # @src=b4b633b92bdc
            options:                 # source order — keep it
              d:
                # | It records the dependency graph in a recipe file, so two builds of the
                # | same commit always resolve identical crate versions
                label: "Ele registra o grafo de dependências em um arquivo de receita, para que dois builds do mesmo commit sempre resolvam versões idênticas de crates"  # @src=6e87164ff74f
                # | Cargo.lock already does that, and it did before chef existed. The recipe
                # | is a cache key, not a lockfile: its job is to stay byte-identical across
                # | code edits so the cook layer survives them.
                feedback: "O Cargo.lock já faz isso, e fazia antes de o chef existir. A receita é uma chave de cache, não um lockfile: o trabalho dela é ficar byte-idêntica ao longo das edições de código para que a camada do cook sobreviva a elas."  # @src=aab83f96aad0
              a:
                # | It cross-compiles the poller for musl so the runtime stage can use a
                # | smaller base
                label: "Ele faz cross-compile do poller para musl para que o estágio de runtime possa usar uma base menor"  # @src=1389ef3455c7
                # | cargo-chef is target-agnostic and its own README canon runs on
                # | debian-slim, not musl. It is about build caching, not cross-compilation.
                feedback: "O cargo-chef é agnóstico de target e o canon do próprio README dele roda em debian-slim, não em musl. Ele é sobre cache de build, não sobre cross-compilation."  # @src=318c82d85073
              c:
                # | It caches dependency compilation as its own layer, so code-only changes
                # | stop recompiling every crate on every build
                label: "Ele coloca a compilação de dependências em cache como camada própria, para que mudanças só de código parem de recompilar todo crate a cada build"  # @src=71dcfdb0f628
                # | prepare emits the recipe, cook builds the dependencies from it, and
                # | because the recipe is byte-identical across code edits, Docker skips the
                # | cook layer and only your crates recompile.
                feedback: "O prepare emite a receita, o cook constrói as dependências a partir dela, e porque a receita fica byte-idêntica ao longo das edições de código, o Docker pula a camada do cook e só os seus crates recompilam."  # @src=6ebe6122be33
              b:
                # | It shrinks the final image further than a plain two-stage build could
                label: "Ele encolhe a imagem final mais do que um build de dois estágios simples conseguiria"  # @src=e68ea7304164
                # | Final image size is identical, the runtime stage copies the same one
                # | binary either way. cargo-chef changes how long REBUILDS take, not what
                # | ships.
                feedback: "O tamanho da imagem final é idêntico, o estágio de runtime copia o mesmo binário único de qualquer jeito. O cargo-chef muda quanto tempo os REBUILDS levam, não o que é entregue."  # @src=c0c387268118
          m06-l3-q3:
            # | You switch the poller's runtime base to alpine for the size win, and probe
            # | throughput collapses once the poll loop fans out. What is the likeliest
            # | cause?
            prompt: "Você troca a base de runtime do poller para alpine pela vitória de tamanho, e a vazão das sondas despenca assim que o poll loop se abre em leque. Qual é a causa mais provável?"  # @src=b0e1d147e854
            # | Grove measured ~30x on his workload (later measurements span 2x to 20x);
            # | ripgrep's fix is shipping jemalloc on musl, and Grove's own fix was moving
            # | to debian-slim, this course's default base. Smallest image is not fastest
            # | binary: base images are a measured trade-off.
            explanation: "Grove mediu ~30x na carga de trabalho dele (medições posteriores vão de 2x a 20x); o conserto do ripgrep é entregar jemalloc no musl, e o conserto do próprio Grove foi mudar para debian-slim, a base default deste curso. Imagem menor não é binário mais rápido: imagens base são um trade-off medido."  # @src=2131058babe5
            options:                 # source order — keep it
              d:
                # | alpine ships a leaner network stack, so each probe pays more for socket
                # | setup
                label: "o alpine entrega uma stack de rede mais enxuta, então cada sonda paga mais pelo setup de socket"  # @src=ba69ebb982ec
                # | A base image ships no network stack at all. Containers are processes on
                # | the HOST kernel, so alpine and debian slim make identical syscalls; what
                # | differs is the libc linked into your binary.
                feedback: "Uma imagem base não entrega stack de rede nenhuma. Contêineres são processos no kernel do HOST, então alpine e debian slim fazem syscalls idênticas; o que difere é a libc linkada dentro do seu binário."  # @src=0cfa099f0149
              a:
                # | musl's default allocator degrades multi-threaded Rust, an order of
                # | magnitude in Grove's 2020 benchmark
                label: "o alocador default do musl degrada Rust multi-thread, uma ordem de magnitude no benchmark de 2020 do Grove"  # @src=8938db00bc83
                # | Grove measured about 30x on his workload; later benchmarks land between
                # | 2x and 20x. ripgrep's answer was shipping jemalloc on musl, Grove's own
                # | was moving to debian slim, which is the base this course teaches.
                feedback: "Grove mediu uns 30x na carga de trabalho dele; benchmarks posteriores aterrissam entre 2x e 20x. A resposta do ripgrep foi entregar jemalloc no musl, a do próprio Grove foi mudar para debian slim, que é a base que este curso ensina."  # @src=fbd445ced7c7
              c:
                # | The glibc-built binary is running under a compatibility emulation layer
                # | on musl
                label: "O binário construído com glibc está rodando sob uma camada de emulação de compatibilidade no musl"  # @src=7e2c2fb2e3cb
                # | There is no emulation layer, a glibc-linked binary on alpine simply
                # | fails to run. If it runs at all it was built for musl, and musl's
                # | allocator is the measured culprit.
                feedback: "Não existe camada de emulação, um binário linkado com glibc no alpine simplesmente não roda. Se ele roda, é porque foi construído para musl, e o alocador do musl é o culpado medido."  # @src=f7d806691a21
              b:
                # | alpine containers are CPU-throttled by default until you raise their
                # | cgroup limits
                label: "contêineres alpine são limitados de CPU por default até você subir os limites de cgroup deles"  # @src=f1d42453480a
                # | No runtime throttles alpine specifically, cgroup limits are yours to set
                # | and identical across bases. The regression is inside the process: its
                # | allocator.
                feedback: "Nenhum runtime limita o alpine especificamente, limites de cgroup são seus para definir e idênticos entre bases. A regressão está dentro do processo: o alocador dele."  # @src=049a969e9c6a
      check-node-side:                      # quiz
        questions:
          m06-l3-q4:
            # | In the node image you install pnpm with `npm i -g pnpm@<pinned>` instead of
            # | `corepack enable`. Why?
            prompt: "Na imagem node você instala o pnpm com `npm i -g pnpm@<pinned>` em vez de `corepack enable`. Por quê?"  # @src=f0e09ff03021
            # | m03-l1 called this one in advance, so the delta is what the container adds.
            # | The reason is unchanged: Node's TSC voted corepack out, and it is gone from
            # | Node 25+ distributions while surviving in Node 24 LTS. What is new here is
            # | which digit you pin to and why. On a laptop the pin is a preference; in an
            # | image it is an agreement, because the container's pnpm has to match the
            # | workspace's `packageManager` field or `--frozen-lockfile` will argue with
            # | you, and an image that installed whatever `latest` served on build day would
            # | silently change pnpm majors between two builds of the same commit. pnpm's
            # | `latest` did exactly that mid-course, moving to the 12 line. Pin to the
            # | workspace, not to the tag.
            explanation: "O m03-l1 antecipou esta aqui, então o delta é o que o contêiner acrescenta. A razão não mudou: o TSC do Node votou pela saída do corepack, e ele sumiu das distribuições do Node 25+ enquanto sobrevive no Node 24 LTS. O que é novo aqui é em qual dígito você fixa e por quê. Num laptop o pin é uma preferência; em uma imagem ele é um acordo, porque o pnpm do contêiner tem que bater com o campo `packageManager` do workspace ou o `--frozen-lockfile` vai brigar com você, e uma imagem que instalasse o que quer que o `latest` servisse no dia do build mudaria de major do pnpm em silêncio entre dois builds do mesmo commit. O `latest` do pnpm fez exatamente isso no meio do curso, indo para a linha 12. Fixe no workspace, não na tag."  # @src=a7912af0d03a
            options:                 # source order — keep it
              a:
                # | corepack resolves package managers over the network on first use, which
                # | is too slow for image builds
                label: "o corepack resolve gerenciadores de pacote pela rede no primeiro uso, o que é lento demais para builds de imagem"  # @src=09dced95fc50
                # | Speed is not the issue, and a cached corepack fetch is fast. The problem
                # | is existence: you cannot enable a tool your base image no longer ships.
                feedback: "Velocidade não é o problema, e um fetch do corepack em cache é rápido. O problema é existência: você não consegue habilitar uma ferramenta que a sua imagem base não entrega mais."  # @src=811a51547ca9
              b:
                # | corepack is no longer distributed with Node 25+, so images built on
                # | current bases cannot rely on it being there
                label: "o corepack não é mais distribuído com o Node 25+, então imagens construídas sobre bases atuais não podem contar com ele estar lá"  # @src=0eb94dd35b71
                # | Node's TSC voted it out on 2025-03-19. Node 24 still carries it, which
                # | is the trap: the corepack line works on today's base and breaks on the
                # | next bump, the worst kind of works.
                feedback: "O TSC do Node votou pela saída dele em 2025-03-19. O Node 24 ainda carrega ele, que é a cilada: a linha do corepack funciona na base de hoje e quebra no próximo bump, o pior tipo de funcionar."  # @src=a52bcfdef3e7
              c:
                # | pnpm refuses to run when activated through corepack, so direct
                # | installation is mandatory
                label: "o pnpm se recusa a rodar quando ativado pelo corepack, então a instalação direta é obrigatória"  # @src=d7f8c4071590
                # | pnpm ran fine under corepack for years, that was corepack's main job.
                # | The change is on Node's side: the runtime stopped bundling it.
                feedback: "O pnpm rodou bem sob o corepack por anos, esse era o trabalho principal do corepack. A mudança é do lado do Node: o runtime parou de empacotar ele."  # @src=69c1069ed8ea
              d:
                # | corepack pulls whatever version is latest at build time, so two node
                # | images built from one commit differ
                label: "o corepack puxa qualquer versão que for a mais recente na hora do build, então duas imagens node construídas a partir de um commit diferem"  # @src=ccb9eea65190
                # | That drift is what an unpinned `npm i -g pnpm` would do. corepack
                # | activates the exact version the workspace's packageManager field names,
                # | so pinning is the one thing it does reliably.
                feedback: "Essa deriva é o que um `npm i -g pnpm` sem pin faria. O corepack ativa a versão exata que o campo packageManager do workspace nomeia, então fixar é a única coisa que ele faz com confiabilidade."  # @src=7ad4981c8ea8
          m06-l3-q5:
            # | The containerized fleet-runner does one probe sweep and exits, and compose
            # | keeps restarting it forever. What is the honest fix?
            prompt: "O fleet-runner conteinerizado faz uma varredura de sondagem e sai, e o compose fica reiniciando ele para sempre. Qual é o conserto honesto?"  # @src=aeccd60df6d7
            # | This beat is built, not assumed: the TS fleet was written as a run-once
            # | script, so this lesson adds an --interval flag that turns it into a service.
            # | The mode change belongs in the program, not in restart policies or an
            # | in-container cron.
            explanation: "Esta batida é construída, não suposta: a frota TS foi escrita como um script rodar-uma-vez, então esta lição adiciona uma flag --interval que transforma ela em um serviço. A mudança de modo pertence ao programa, não a políticas de restart nem a uma cron dentro do contêiner."  # @src=36553e7e220c
            options:                 # source order — keep it
              c:
                # | Give the runner a real interval-loop service mode, a container wants one
                # | long-lived foreground process
                label: "Dar ao runner um modo de serviço de loop de intervalo de verdade, um contêiner quer um processo em primeiro plano de vida longa"  # @src=7575d0f399df
                # | The mode change belongs in the program, which is why this lesson builds
                # | the --interval flag rather than assuming it, and why the loop's sleep is
                # | abortable: PID 1 has to answer SIGTERM.
                feedback: "A mudança de modo pertence ao programa, que é o motivo de esta lição construir a flag --interval em vez de supor ela, e o motivo de o sleep do loop ser abortável: o PID 1 tem que responder ao SIGTERM."  # @src=597414196882
              d:
                # | Wrap the runner in a shell while-loop in CMD so the box always has one
                # | live process
                label: "Embrulhar o runner em um while-loop de shell no CMD para que a caixa sempre tenha um processo vivo"  # @src=7f0430a14bb3
                # | That satisfies the letter of one-foreground-process and breaks the
                # | spirit: the shell becomes PID 1 and swallows SIGTERM, so `docker stop`
                # | waits ten seconds and then SIGKILLs your sweep mid-write.
                feedback: "Isso satisfaz a letra do um-processo-em-primeiro-plano e quebra o espírito: o shell vira o PID 1 e engole o SIGTERM, então o `docker stop` espera dez segundos e depois dá SIGKILL na sua varredura no meio de uma escrita."  # @src=682e70f4c5a3
              b:
                # | Run cron inside the container to re-invoke the script on a schedule
                label: "Rodar cron dentro do contêiner para reinvocar o script num agendamento"  # @src=eeef41c04c29
                # | A second supervisor inside the box fights the container model, one
                # | container, one foreground process. Now you debug cron AND your app, in a
                # | slim image that likely lacks cron anyway.
                feedback: "Um segundo supervisor dentro da caixa briga com o modelo de contêiner, um contêiner, um processo em primeiro plano. Agora você debuga a cron E o seu app, em uma imagem slim que provavelmente nem tem cron."  # @src=d3689d7d642b
              a:
                # | Set restart: always and let the restart policy provide the loop, that is
                # | what policies are for
                label: "Definir restart: always e deixar a política de restart fornecer o loop, é para isso que políticas servem"  # @src=fbf2da1b0aad
                # | Restart policies are for recovering from FAILURE, not for scheduling. A
                # | restart-driven loop pays process startup on every sweep and turns your
                # | logs into a crash chronicle.
                feedback: "Políticas de restart são para se recuperar de FALHA, não para agendamento. Um loop movido a restart paga startup de processo a cada varredura e transforma os seus logs em uma crônica de crashes."  # @src=5bb7af0d3a69
          m06-l3-q6:
            # | Your OpenSSL-linked build segfaults on alpine at TLS handshake time but runs
            # | fine on debian-slim. What is the course-canon fix?
            prompt: "O seu build linkado com OpenSSL dá segfault no alpine na hora do handshake TLS mas roda bem no debian-slim. Qual é o conserto do canon do curso?"  # @src=698b70fc5600
            # | The documented footgun: a statically-built musl binary meeting alpine's
            # | dynamically-linked OpenSSL segfaults. Documented fixes include the openssl
            # | crate's vendored feature, but the house canon, consistent with every Rust
            # | rules file in this repo, is rustls: pure Rust, no C dependency, no clash to
            # | have.
            explanation: "O footgun documentado: um binário musl construído estaticamente encontrando o OpenSSL linkado dinamicamente do alpine dá segfault. Consertos documentados incluem a feature vendored do crate openssl, mas o canon da casa, consistente com todo arquivo de regras de Rust neste repo, é rustls: Rust puro, nenhuma dependência de C, nenhum conflito para ter."  # @src=5d75f6c87be2
            options:                 # source order — keep it
              b:
                # | Install glibc into the alpine image so the OpenSSL linkage resolves
                label: "Instalar glibc na imagem alpine para que a linkagem do OpenSSL resolva"  # @src=ed9f4702d98e
                # | Bolting glibc onto alpine abandons the base's whole premise and creates
                # | a franken-image. The clash here is two musls (your static one vs
                # | alpine's dynamic one), not a missing glibc.
                feedback: "Parafusar glibc no alpine abandona a premissa inteira da base e cria uma franken-imagem. O conflito aqui é de dois musls (o seu estático contra o dinâmico do alpine), não uma glibc faltando."  # @src=5dd0ff5b731c
              e:
                # | Install ca-certificates so the TLS handshake completes
                label: "Instalar ca-certificates para que o handshake TLS complete"  # @src=8745b315776c
                # | The runtime stage does install ca-certificates, and it must, but that is
                # | about VERIFYING the servers you probe. A missing CA store gives you a
                # | verification error, never a segfault.
                feedback: "O estágio de runtime instala ca-certificates sim, e tem que instalar, mas isso é sobre VERIFICAR os servidores que você sonda. Um store de CA faltando te dá um erro de verificação, nunca um segfault."  # @src=16de776caaaf
              a:
                # | Build with rustls and skip the C TLS dependency entirely
                label: "Construir com rustls e pular a dependência de TLS em C inteiramente"  # @src=eb7501f09665
                # | Pure Rust TLS, no C library, no linkage clash to have. You already live
                # | by it: reqwest 0.13 defaults to rustls, so the m06-l1 poller never had
                # | an OpenSSL to fight.
                feedback: "TLS em Rust puro, nenhuma biblioteca C, nenhum conflito de linkagem para ter. Você já vive assim: o reqwest 0.13 usa rustls por default, então o poller do m06-l1 nunca teve um OpenSSL para brigar."  # @src=8bcafb04346f
              d:
                # | Build with OPENSSL_DIR pointed at alpine's copy
                label: "Construir com OPENSSL_DIR apontado para a cópia do alpine"  # @src=8ea5840c8632
                # | The linker already found it; that is the problem. Your binary carries
                # | musl statically and alpine's OpenSSL links musl dynamically, so pointing
                # | at the same library harder changes nothing.
                feedback: "O linker já achou ela; esse é o problema. O seu binário carrega musl estaticamente e o OpenSSL do alpine linka musl dinamicamente, então apontar com mais força para a mesma biblioteca não muda nada."  # @src=a0be8daa5fa9
              c:
                # | Downgrade the openssl crate until the segfault version-mismatch
                # | disappears
                label: "Fazer downgrade do crate openssl até o desencontro de versões do segfault sumir"  # @src=591304bcb846
                # | No openssl crate version fixes a static-vs-dynamic musl linkage clash.
                # | The documented crate-side alternative is the vendored feature, building
                # | OpenSSL in, not a downgrade.
                feedback: "Nenhuma versão do crate openssl conserta um conflito de linkagem musl estático-contra-dinâmico. A alternativa documentada do lado do crate é a feature vendored, construindo o OpenSSL para dentro, não um downgrade."  # @src=73cf6489a6d0
  m06-l4:
    # | compose for local, GHCR from CI
    title: "compose para local, GHCR a partir do CI"  # @src=df4add59f55a
    blocks:
      check:                      # quiz
        questions:
          m06-l4-q1:
            # | A teammate asks whether your new compose.yaml is 'how the station deploys to
            # | production'. What is the honest answer?
            prompt: "Um colega de time pergunta se o seu novo compose.yaml é 'como a estação faz deploy para produção'. Qual é a resposta honesta?"  # @src=8bf8af7bc79f
            # | The module's division of labor: Dockerfiles define images, compose
            # | orchestrates them on YOUR machine for development, and the registry is where
            # | 'runs anywhere' actually begins. This course teaches compose as local-dev
            # | tooling on purpose, orchestration across machines is the tier-gate's
            # | signposted out-of-scope.
            explanation: "A divisão de trabalho do módulo: Dockerfiles definem imagens, o compose as orquestra na SUA máquina para desenvolvimento, e o registro é onde o 'roda em qualquer lugar' de fato começa. Este curso ensina compose como ferramenta de dev local de propósito, orquestração entre máquinas é o fora-de-escopo sinalizado da trava do tier."  # @src=448c593460a7
            options:                 # source order — keep it
              c:
                # | No, compose replaced the Dockerfiles, so production now builds directly
                # | from compose.yaml
                label: "Não, o compose substituiu os Dockerfiles, então produção agora constrói direto do compose.yaml"  # @src=49be526a525e
                # | Compose consumes images that Dockerfiles (or registries) provide, it
                # | replaces your hand-typed docker run flags, never the build definitions.
                feedback: "O compose consome imagens que Dockerfiles (ou registros) fornecem, ele substitui as suas flags de docker run digitadas à mão, nunca as definições de build."  # @src=24544fd5408c
              a:
                # | Yes, compose is the production layer; you point it at a server and the
                # | station is deployed
                label: "Sim, o compose é a camada de produção; você aponta ele para um servidor e a estação está com o deploy feito"  # @src=c1ea1f1a32c4
                # | Compose schedules nothing beyond one machine and heals nothing across
                # | hosts. Calling it production is the cosplay this lesson explicitly
                # | refuses.
                feedback: "O compose não escalona nada além de uma máquina e não cura nada entre hosts. Chamar isso de produção é o cosplay que esta lição recusa explicitamente."  # @src=61d4778becbc
              d:
                # | Not yet, but in practice the same compose file plus a restart policy on
                # | one server is the deployment story
                label: "Ainda não, mas na prática o mesmo arquivo compose mais uma política de restart em um servidor é a história de deploy"  # @src=578fe51bcdcb
                # | That is the production cosplay the lesson names. A restart policy
                # | revives a container; it notices nothing when the MACHINE dies, and it
                # | balances, replicates and rolls out nothing.
                feedback: "Esse é o cosplay de produção que a lição nomeia. Uma política de restart revive um contêiner; ela não percebe nada quando a MÁQUINA morre, e ela não balanceia, não replica e não faz rollout de nada."  # @src=2fdf1c73de19
              b:
                # | No, compose wires the LOCAL dev stack: one file, both services, one
                # | command up and down; deployment is the registry's job
                label: "Não, o compose liga a stack de dev LOCAL: um arquivo, os dois serviços, um comando para subir e descer; deploy é o trabalho do registro"  # @src=25c27c30e20a
                # | Its real payoff is that `git clone` plus `docker compose up` becomes the
                # | whole onboarding document, which is a development win, not a deployment
                # | one.
                feedback: "A recompensa real dele é que `git clone` mais `docker compose up` se torna o documento de onboarding inteiro, que é uma vitória de desenvolvimento, não de deploy."  # @src=072df461d7a2
          m06-l4-q2:
            # | Your Actions job pushed pulse-pollerd to GHCR with a green run, but an
            # | anonymous `docker pull` of it comes back denied. What happened?
            prompt: "Seu job do Actions deu push do pulse-pollerd para o GHCR com uma execução verde, mas um `docker pull` anônimo dele volta denied. O que aconteceu?"  # @src=185e8d71ca99
            # | The lab gotcha, reproduced in step 5: GHCR packages are born private. An
            # | anonymous pull comes back denied, refused without confirming the package
            # | even exists, so the symptom looks like a bad tag rather than a permission
            # | problem, and that is the whole trap. Flip visibility in the package settings
            # | and the same command succeeds. Public container images are free
            # | ('currently', per GitHub's own wording); private ones bill against the
            # | shared 500 MB pool.
            explanation: "A pegadinha do lab, reproduzida no passo 5: pacotes do GHCR nascem privados. Um pull anônimo volta denied, recusado sem nem confirmar que o pacote existe, então o sintoma parece uma tag errada em vez de um problema de permissão, e essa é a cilada inteira. Vire a visibilidade nas configurações do pacote e o mesmo comando dá certo. Imagens de contêiner públicas são gratuitas ('currently', nas palavras do próprio GitHub); as privadas são cobradas contra o pool compartilhado de 500 MB."  # @src=195b49b90f61
            options:                 # source order — keep it
              d:
                # | The lowercasing step folded your owner name, so the reference you pulled
                # | points at a package that does not exist
                label: "O step de minúsculas dobrou o nome do seu owner, então a referência da qual você deu pull aponta para um pacote que não existe"  # @src=d3b2618e7ec7
                # | That is the trap this symptom sets: a denied pull refuses to confirm
                # | whether the package exists, so it reads like a bad tag. The lowercasing
                # | is what makes the reference LEGAL, and both the push and your pull used
                # | the same folded name.
                feedback: "Essa é a cilada que este sintoma armou: um pull denied se recusa a confirmar se o pacote existe, então ele se lê como uma tag errada. Deixar em minúsculas é o que torna a referência LEGAL, e tanto o push quanto o seu pull usaram o mesmo nome dobrado."  # @src=45c087f75b11
              b:
                # | GHCR requires a classic PAT for public hosting, and GITHUB_TOKEN pushes
                # | are private forever
                label: "O GHCR exige um PAT clássico para hospedagem pública, e pushes com GITHUB_TOKEN são privados para sempre"  # @src=0ec7710394c9
                # | GITHUB_TOKEN with packages write is a fully supported push path, and
                # | visibility is a package setting, not a token property.
                feedback: "GITHUB_TOKEN com escrita de packages é um caminho de push totalmente suportado, e visibilidade é uma configuração do pacote, não uma propriedade do token."  # @src=704118c22fe5
              a:
                # | The push silently failed, and a green Actions run does not verify that
                # | the registry write actually landed
                label: "O push falhou em silêncio, e uma execução verde do Actions não verifica que a escrita no registro de fato aterrou"  # @src=91d33cf10121
                # | A failed push fails the step and the run. The image is there; the
                # | question is who is allowed to see it.
                feedback: "Um push que falha faz o step e a execução falharem. A imagem está lá; a questão é quem tem permissão para vê-la."  # @src=dba6d8ffd1eb
              c:
                # | First publish defaults to PRIVATE, flip the package's visibility setting
                # | and the anonymous pull works
                label: "A primeira publicação tem PRIVADO como default, vire a configuração de visibilidade do pacote e o pull anônimo funciona"  # @src=78af0b7c2cff
                # | A one-time flip per package, in the package settings rather than in
                # | code. Later pushes to the same package keep whatever visibility you set.
                feedback: "Uma virada única por pacote, nas configurações do pacote e não no código. Pushes posteriores para o mesmo pacote mantêm a visibilidade que você definiu."  # @src=752bfbdaf329
          m06-l4-q3:
            # | You keep the station images private 'to be safe'. What does that choice
            # | actually spend on the GitHub Free plan?
            prompt: "Você mantém as imagens da estação privadas 'por segurança'. O que essa escolha de fato gasta no plano Free do GitHub?"  # @src=d876e78ecbb0
            # | The free-tier reality paragraph in one number: 500 MB of private storage,
            # | shared between GHCR layers and Actions artifacts, your CI's own uploads
            # | compete with your images. For this course's public-repo station, public
            # | images are the honest (and free) default.
            explanation: "O parágrafo de realidade do tier gratuito em um número só: 500 MB de armazenamento privado, compartilhado entre camadas do GHCR e artefatos do Actions, os uploads do seu próprio CI competem com as suas imagens. Para a estação de repo público deste curso, imagens públicas são o default honesto (e gratuito)."  # @src=db6c8e1dc71a
            options:                 # source order — keep it
              c:
                # | Each private pull deducts from the storage quota until the monthly reset
                label: "Cada pull privado desconta da cota de armazenamento até o reset mensal"  # @src=ef00025de202
                # | Pulls consume transfer, not storage. The storage pool is about the bytes
                # | your image layers occupy at rest.
                feedback: "Pulls consomem transferência, não armazenamento. O pool de armazenamento é sobre os bytes que as camadas da sua imagem ocupam em repouso."  # @src=bcc7dab4b68b
              d:
                # | Nothing, private image storage in a public repo is free whatever its
                # | visibility
                label: "Nada, armazenamento de imagem privada em um repo público é gratuito qualquer que seja a visibilidade dela"  # @src=6ccab3fff7d2
                # | Repo visibility and package visibility are separate settings, which is
                # | exactly why your packages were born private out of a public repo. Free
                # | storage follows the PACKAGE being public.
                feedback: "Visibilidade de repo e visibilidade de pacote são configurações separadas, que é exatamente por que os seus pacotes nasceram privados a partir de um repo público. Armazenamento gratuito acompanha o PACOTE ser público."  # @src=aaee5418d90a
              b:
                # | Nothing, private and public packages are both unmetered on the Free plan
                label: "Nada, pacotes privados e públicos são os dois sem medição no plano Free"  # @src=df2f3ee5c773
                # | Only public packages ride free. Private storage is a metered pool, and
                # | it is smaller than one naive Docker image would have been.
                feedback: "Só pacotes públicos pegam carona de graça. Armazenamento privado é um pool medido, e ele é menor do que uma imagem Docker ingênua teria sido."  # @src=9fe88f9c2182
              a:
                # | Private image storage draws from a 500 MB pool that your Actions
                # | artifacts also share
                label: "Armazenamento de imagem privada puxa de um pool de 500 MB que os seus artefatos do Actions também compartilham"  # @src=9a79692d7dac
                # | Run it against your own history: m06-l2's naive image would have
                # | overflowed that whole pool several times over by itself. Your
                # | multi-stage images fit, which is last lesson's work paying rent.
                feedback: "Rode contra o seu próprio histórico: a imagem ingênua do m06-l2 teria transbordado aquele pool inteiro várias vezes, sozinha. Suas imagens multi-stage cabem, que é o trabalho da lição passada pagando aluguel."  # @src=4477c71f68ef
          m06-l4-q4:
            # | The container tier-gate closes this module. Which statement matches what the
            # | course actually skipped and where it lives?
            prompt: "A trava do tier de contêineres fecha este módulo. Qual afirmação corresponde ao que o curso de fato pulou e onde isso mora?"  # @src=da01dbf49851
            # | The tier-gate contract that closes this module: at every ship boundary the
            # | course says out loud what it skipped and where it lives. Here that is
            # | orchestration, cloud platforms, and scanning depth, all of it outside this
            # | course's scope, with no sibling course to hand you to, so honest signposts
            # | are what you get. The registry is the deploy; everything after docker push
            # | is somebody's scheduler.
            explanation: "O contrato da trava do tier que fecha este módulo: em toda fronteira de entrega o curso diz em voz alta o que pulou e onde isso mora. Aqui isso é orquestração, plataformas de nuvem e profundidade de escaneamento, tudo fora do escopo deste curso, sem nenhum curso irmão a quem te passar, então o que você recebe são placas honestas. O registro é o deploy; tudo depois do docker push é o escalonador de alguém."  # @src=873814747cbd
            options:                 # source order — keep it
              a:
                # | Nothing was skipped, with compose and GHCR you have seen the container
                # | ecosystem end to end
                label: "Nada foi pulado, com compose e GHCR você viu o ecossistema de contêineres de ponta a ponta"  # @src=6d766ec5d1bd
                # | The gate exists precisely because that is false: everything after docker
                # | push, scheduling, healing, scaling across machines, was deliberately
                # | left out.
                feedback: "A trava existe exatamente porque isso é falso: tudo depois do docker push, escalonamento, cura, escala entre máquinas, foi deliberadamente deixado de fora."  # @src=124e06ec431a
              b:
                # | Orchestration (K8s), cloud runtimes (AWS/GCP), and deep image scanning,
                # | named, signposted (Scout gets a one-liner), and out of scope on purpose
                label: "Orquestração (K8s), runtimes de nuvem (AWS/GCP) e escaneamento profundo de imagem, nomeados, sinalizados (o Scout ganha uma linha), e fora de escopo de propósito"  # @src=179d0d475082
                # | A map, not an apology. All three are pull-side consumers of the seam you
                # | just built, which is why the concept you now hold, images on a registry,
                # | is the one every orchestrator eats.
                feedback: "Um mapa, não uma desculpa. Todos os três são consumidores do lado do pull da costura que você acabou de construir, que é por que o conceito que você agora tem, imagens em um registro, é o que todo orquestrador come."  # @src=cfcc8fe59f71
              c:
                # | Multi-stage builds and registries, deferred to a later module of this
                # | same course
                label: "Builds multi-stage e registros, adiados para um módulo posterior deste mesmo curso"  # @src=5e1df493517e
                # | Those were THIS module: m06-l3 built the multi-stage images and this
                # | lesson pushed them. The gate names what comes after the push, not what
                # | came before.
                feedback: "Esses foram ESTE módulo: o m06-l3 construiu as imagens multi-stage e esta lição deu push nelas. A trava nomeia o que vem depois do push, não o que veio antes."  # @src=f2a9d2249729
              d:
                # | Orchestration and cloud runtimes, deferred to the sibling course this
                # | catalog hands container work off to
                label: "Orquestração e runtimes de nuvem, adiados para o curso irmão a quem este catálogo passa o trabalho de contêiner"  # @src=d9b0435efc3c
                # | There is no such sibling. The gate says so plainly: Kubernetes is out of
                # | scope with nothing to hand you to, which is why honest signposts are
                # | what this boundary offers instead of a next enrolment.
                feedback: "Não existe esse irmão. A trava diz isso com clareza: Kubernetes está fora de escopo sem nada a quem te passar, que é por que placas honestas são o que esta fronteira oferece em vez de uma próxima matrícula."  # @src=bdd5cdef6921
  m07-l1:
    # | A worker in every city: TS at the edge + KV
    title: "Um worker em cada cidade: TS no edge + KV"  # @src=5464c348159b
    blocks:
      edge-platform-check:                      # quiz
        questions:
          m07-l1-q1:
            # | You import pulse-core into the fresh worker project; the build succeeds, but
            # | `wrangler dev` refuses to start on the module that reads the config file
            # | from disk. Which parts of pulse-core port to workerd unchanged?
            prompt: "Você importa o pulse-core no projeto novo do worker; o build dá certo, mas o `wrangler dev` se recusa a iniciar no módulo que lê o arquivo de config do disco. Quais partes do pulse-core portam para o workerd sem mudança?"  # @src=dbd88500f6d9
            # | This is the pure-core/IO-shell seam paying off: because m03-l1 extracted
            # | pulse-core with its logic separated from its node I/O, the classifiers and
            # | types port to the edge unchanged, while file reads and env access get
            # | replaced by platform fetch, bindings, and KV. The purity was never ceremony,
            # | it is portability.
            explanation: "Esta é a costura núcleo-puro/casca-de-IO se pagando: porque a m03-l1 extraiu o pulse-core com a lógica dele separada do I/O de node dele, os classificadores e os tipos portam para o edge sem mudança, enquanto leituras de arquivo e acesso a env são substituídos por fetch de plataforma, bindings e KV. A pureza nunca foi cerimônia, é portabilidade."  # @src=6e213860e5c7
            options:                 # source order — keep it
              e:
                # | The logic and backoff helpers, once you re-export them through a
                # | worker-safe entry
                label: "A lógica e os helpers de backoff, uma vez que você reexporte eles através de uma entrada segura para worker"  # @src=e7abd2c80b93
                # | No second entry point is needed. The published package installs into the
                # | worker exactly as it installed into the dashboard, which is the third
                # | consumer proving the extraction.
                feedback: "Nenhum segundo ponto de entrada é necessário. O pacote publicado instala no worker exatamente como instalou no painel, que é o terceiro consumidor provando a extração."  # @src=09f50318160a
              a:
                # | The pure logic, classifiers and result types with no node imports
                label: "A lógica pura, os classificadores e os tipos de resultado sem imports de node"  # @src=de6c4e93ac68
                # | m03-l1's extraction paying for itself: the classifiers, the types and
                # | backoffDelay are pure functions over plain data with no opinion about
                # | where they run. The port is import the core, rewrite the shell.
                feedback: "A extração da m03-l1 se pagando: os classificadores, os tipos e o backoffDelay são funções puras sobre dados simples sem opinião nenhuma sobre onde rodam. O port é importar o núcleo, reescrever a casca."  # @src=8d7f6ec7f8ae
              b:
                # | Everything, workerd runs JavaScript, so any JS module loads fine
                label: "Tudo, o workerd roda JavaScript, então qualquer módulo JS carrega numa boa"  # @src=9fbd65627aad
                # | workerd runs JS but is not node: the node builtins are only shims with
                # | no OS behind them, and the read-only /bundle mount is the only
                # | filesystem, so the config read dies at startup. The refusal you just hit
                # | is exactly that seam.
                feedback: "O workerd roda JS mas não é node: os builtins do node são só shims sem OS por trás deles, e o mount /bundle somente leitura é o único sistema de arquivos, então a leitura da config morre na inicialização. A recusa que você acabou de bater é exatamente aquela costura."  # @src=218b2905f8ab
              d:
                # | The logic plus the config loader, since node builtins resolve under the
                # | compat shim
                label: "A lógica mais o carregador de config, já que builtins do node resolvem sob o shim de compat"  # @src=09e74566ec64
                # | The resolve is the trap. readFileSync is a real function under the
                # | compat shim and there is still no disk behind it, which is why the
                # | runtime dies naming /bundle/pulse.config.json. The module ported; the
                # | machine did not.
                feedback: "O resolve é a cilada. O readFileSync é uma função de verdade sob o shim de compat e continua não tendo disco por trás dele, que é por que o runtime morre nomeando /bundle/pulse.config.json. O módulo portou; a máquina não."  # @src=59f7ffd498c5
              c:
                # | Only code already bundled for browsers, since workers are browser
                # | runtimes
                label: "Só código já empacotado para navegadores, já que workers são runtimes de navegador"  # @src=5fe5183715ec
                # | workerd is its own runtime, not a browser, no DOM, but also more than a
                # | browser (KV, cron, bindings). The dividing line is node-specific I/O,
                # | not browser bundling.
                feedback: "O workerd é um runtime próprio, não um navegador, sem DOM, mas também mais que um navegador (KV, cron, bindings). A linha divisória é I/O específico de node, não empacotamento para navegador."  # @src=b099fe34cb81
          m07-l1-q2:
            # | Your deployed worker needs an auth token for one protected probe target.
            # | Where does the token go so it works in prod without ever landing in git?
            prompt: "O seu worker com deploy precisa de um token de auth para um alvo de sonda protegido. Para onde vai o token para que ele funcione em prod sem nunca aterrissar no git?"  # @src=d3db4c1045f3
            # | The taught split: .dev.vars (dotenv syntax, gitignored) supplies local dev;
            # | `wrangler secret put` stores the prod value, which is not visible after set.
            # | wrangler.jsonc vars are for public config. This is the same secrets-hygiene
            # | glue beat the m09-l2 four-platform sweep will revisit.
            explanation: "A divisão ensinada: o .dev.vars (sintaxe dotenv, gitignorado) supre o dev local; o `wrangler secret put` guarda o valor de prod, que não fica visível depois de definido. As vars do wrangler.jsonc são para config pública. Esta é a mesma batida de cola de higiene de segredos que a varredura de quatro plataformas da m09-l2 vai revisitar."  # @src=d83549a00451
            options:                 # source order — keep it
              d:
                # | In a .env file the handler reads through process.env, the way the fleet
                # | loaded its token
                label: "Num arquivo .env que o handler lê através do process.env, do jeito que a frota carregava o token dela"  # @src=8fa830a629de
                # | Nothing is ambient in a worker. Capabilities arrive as one typed env
                # | parameter declared in the config, which is the platform enforcing the
                # | injection your fleet only had by discipline.
                feedback: "Nada é ambiente num worker. Capacidades chegam como um único parâmetro env tipado declarado na config, que é a plataforma impondo a injeção que a sua frota só tinha por disciplina."  # @src=f317b0f0e800
              a:
                # | In wrangler.jsonc under "vars", since that file is what configures the
                # | deployed worker
                label: "No wrangler.jsonc sob \"vars\", já que aquele arquivo é o que configura o worker com deploy"  # @src=efbbe151eced
                # | "vars" is committed plaintext configuration, anyone with repo access
                # | reads your token. Vars are for non-secret config only.
                feedback: "\"vars\" é configuração em texto puro commitada, qualquer um com acesso ao repo lê o seu token. Vars são só para config não secreta."  # @src=b0b5618d2dc1
              b:
                # | Set with `wrangler secret put`, with a gitignored .dev.vars copy for
                # | local dev
                label: "Definido com `wrangler secret put`, com uma cópia gitignorada em .dev.vars para o dev local"  # @src=83ea9ce6145f
                # | The prod value is stored encrypted and is never shown again, not in the
                # | dashboard and not by wrangler; only its name is visible. The .dev.vars
                # | half is what keeps `wrangler dev` working without it.
                feedback: "O valor de prod é guardado encriptado e nunca é mostrado de novo, nem no painel nem pelo wrangler; só o nome dele fica visível. A metade .dev.vars é o que mantém o `wrangler dev` funcionando sem ele."  # @src=469b88b869f5
              c:
                # | In a KV entry the worker reads at startup, since only the bound worker
                # | can read that namespace
                label: "Numa entrada de KV que o worker lê na inicialização, já que só o worker com o binding consegue ler aquele namespace"  # @src=147cc298b40b
                # | KV is data storage, not a secret store, values are readable via the API
                # | and your own public endpoint code could leak them. Secrets go through
                # | the secrets binding.
                feedback: "O KV é armazenamento de dados, não um armazenamento de segredos, valores são legíveis via API e o código do seu próprio endpoint público poderia vazar eles. Segredos passam pelo binding de segredos."  # @src=3bf32b105789
          m07-l1-q3:
            # | You add a retry loop that busy-spins computing statistics over probe
            # | history, and invocations start erroring on the free tier, but your request
            # | count is nowhere near the daily cap. What limit did you hit?
            prompt: "Você adiciona um loop de retry que fica girando ocupado calculando estatísticas sobre histórico de sondas, e invocações começam a dar erro no tier gratuito, mas a sua contagem de requisições fica longe do teto diário. Qual limite você bateu?"  # @src=703080db01e5
            # | Workers Free gives 100,000 requests/day and 10 ms of CPU per invocation.
            # | Time spent awaiting fetch is not CPU time, which is why a probe worker fits
            # | the free tier beautifully and a number-crunching worker does not. Heavy
            # | computation belongs in the Docker poller; the edge is for probes.
            explanation: "O Workers Free dá 100,000 requisições/dia e 10 ms de CPU por invocação. Tempo gasto esperando fetch não é tempo de CPU, que é por que um worker de sonda cabe lindamente no tier gratuito e um worker que tritura números não cabe. Computação pesada pertence ao poller Docker; o edge é para sondas."  # @src=214f532a02da
            options:                 # source order — keep it
              b:
                # | The KV write limit, each retry writes status and free KV allows 1,000
                # | writes/day
                label: "O limite de escrita do KV, cada retry escreve status e o KV gratuito permite 1,000 escritas/dia"  # @src=c8397ebea846
                # | KV write exhaustion would fail the KV puts, not kill the invocation
                # | mid-computation. The busy-spin is CPU, and CPU is what the free tier
                # | meters per invocation.
                feedback: "Esgotar as escritas do KV faria os puts do KV falharem, não mataria a invocação no meio da computação. O giro ocupado é CPU, e CPU é o que o tier gratuito mede por invocação."  # @src=c77f70bab5ff
              a:
                # | The 100,000 requests/day allowance, since scheduled cron invocations
                # | count against it too
                label: "A cota de 100,000 requisições/dia, já que invocações agendadas de cron contam contra ela também"  # @src=22e1f04a1a48
                # | Cron invocations do count as requests, but you just observed the count
                # | is far under the daily cap. The symptom (per-invocation error under
                # | load) points at a per-invocation limit.
                feedback: "Invocações de cron contam como requisições sim, mas você acabou de observar que a contagem está bem abaixo do teto diário. O sintoma (erro por invocação sob carga) aponta para um limite por invocação."  # @src=9aac6375c34f
              c:
                # | The 10 ms CPU budget per invocation, compute is metered, waiting on I/O
                # | is not
                label: "O orçamento de 10 ms de CPU por invocação, computação é medida, esperar em I/O não é"  # @src=0ec8a2c0a3d2
                # | That asymmetry is the free tier's whole personality: a probe worker
                # | whose life is 99% waiting fits it beautifully, and number crunching
                # | belongs back in the Docker poller where CPU is yours by the hour.
                feedback: "Essa assimetria é a personalidade inteira do tier gratuito: um worker de sonda cuja vida é 99% espera cabe nele lindamente, e triturar números pertence de volta ao poller Docker onde a CPU é sua por hora."  # @src=2ba13a2f1ef8
              d:
                # | The 10 ms budget, typically spent by awaiting fetches not by your loop
                label: "O orçamento de 10 ms, tipicamente gasto esperando fetches e não pelo seu loop"  # @src=035d77db2480
                # | Right limit, wrong spender. Awaiting a fetch costs no CPU at all, which
                # | is why three sequential probes in the cron handler are free and one
                # | tight synchronous loop is not.
                feedback: "Limite certo, gastador errado. Esperar um fetch não custa CPU nenhuma, que é por que três sondas sequenciais no handler de cron são de graça e um único loop síncrono apertado não é."  # @src=2c4c0b0b7f59
      edge-ramp-check:                      # quiz
        questions:
          m07-l1-q4:
            # | You cache last-known-status in a top-level variable in the worker and it
            # | keeps 'resetting'. Why does the lesson store it in KV instead?
            prompt: "Você guarda em cache o último status conhecido numa variável de topo no worker e ele fica 'resetando'. Por que a lição guarda ele no KV no lugar?"  # @src=23ea51bb86d8
            # | Statelessness is the platform's core deal: your code runs as short-lived
            # | isolates in many cities, so shared state needs a shared store. KV is the
            # | taught answer for last-known-status, eventually consistent, globally
            # | readable, and generous enough on the free tier for a probe fleet's write
            # | rate.
            explanation: "A ausência de estado é o acordo central da plataforma: o seu código roda como isolates de vida curta em muitas cidades, então estado compartilhado precisa de um armazenamento compartilhado. O KV é a resposta ensinada para o último status conhecido, eventualmente consistente, legível globalmente, e generoso o bastante no tier gratuito para a taxa de escrita de uma frota de sondas."  # @src=d275952eb83f
            options:                 # source order — keep it
              b:
                # | Worker memory is capped so small that a status object won't reliably fit
                # | in it
                label: "A memória do worker tem um teto tão pequeno que um objeto de status não cabe nela de forma confiável"  # @src=3f15d06fd949
                # | A JSON snapshot fits in memory fine, size is not the issue. The issue is
                # | lifetime and locality: the isolate you wrote to may not be the one that
                # | serves the next request.
                feedback: "Um snapshot JSON cabe na memória numa boa, tamanho não é o problema. O problema é tempo de vida e localidade: o isolate em que você escreveu pode não ser o que serve o próximo request."  # @src=cf6b07a33da8
              d:
                # | A wrangler dev artifact: dev reloads the module each request, a deployed
                # | isolate keeps it
                label: "Um artefato do wrangler dev: o dev recarrega o módulo a cada request, um isolate com deploy mantém ele"  # @src=690316958838
                # | Backwards. Dev is the friendlier case, one machine and one isolate,
                # | which is why it worked in dev is the classic bug here. Production
                # | spreads you across cities that never shared the variable.
                feedback: "Ao contrário. O dev é o caso mais amigável, uma máquina e um isolate, que é por que funcionou no dev é o bug clássico aqui. A produção te espalha por cidades que nunca compartilharam a variável."  # @src=3075f7f3e604
              c:
                # | Top-level variables are read-only in workerd, so writes to them are
                # | silently dropped
                label: "Variáveis de topo são somente leitura no workerd, então escritas nelas são descartadas em silêncio"  # @src=a15dacd090de
                # | Globals are writable within an isolate's lifetime, that's why it works
                # | for a few requests before 'resetting'. Nothing is dropped; the isolate
                # | simply died or the request landed elsewhere.
                feedback: "Globais são escrevíveis dentro do tempo de vida de um isolate, é por isso que funciona por alguns requests antes de 'resetar'. Nada é descartado; o isolate simplesmente morreu ou o request aterrissou em outro lugar."  # @src=a953e98b0de2
              a:
                # | Isolates are ephemeral and per-location, memory doesn't survive
                # | invocations or span cities
                label: "Isolates são efêmeros e por localização, memória não sobrevive a invocações nem atravessa cidades"  # @src=4dea89b238e8
                # | Statelessness is the platform's core deal, so shared state needs a
                # | shared store. KV's eventual consistency is fine here precisely because
                # | each entry carries its own checkedAt.
                feedback: "A ausência de estado é o acordo central da plataforma, então estado compartilhado precisa de um armazenamento compartilhado. A consistência eventual do KV é aceitável aqui precisamente porque cada entrada carrega o próprio checkedAt dela."  # @src=6c56f18a4232
          m07-l1-q5:
            # | A teammate sends you a 2023 tutorial: 'deploy your status page with
            # | Cloudflare Pages.' Per the vendor's current docs, what's the right call for
            # | a NEW project?
            prompt: "Um colega de time te manda um tutorial de 2023: 'faça o deploy da sua página de status com o Cloudflare Pages.' Segundo a documentação atual do fornecedor, qual é a decisão certa para um projeto NOVO?"  # @src=1ce415562df5
            # | Probed live 2026-09-01, the Pages docs banner reads: 'Workers supports most
            # | Pages use cases and offers a broader feature set... Start new projects with
            # | Workers.' The meta-lesson outranks the platform trivia: read the vendor's
            # | current docs, not blog posts from the year a tutorial was written.
            explanation: "Sondado ao vivo em 2026-09-01, o banner da documentação do Pages diz: 'O Workers suporta a maioria dos casos de uso do Pages e oferece um conjunto de recursos mais amplo... Comece projetos novos com o Workers.' A meta-lição supera a trivia de plataforma: leia a documentação atual do fornecedor, não posts de blog do ano em que um tutorial foi escrito."  # @src=a85cc84ece33
            options:                 # source order — keep it
              c:
                # | Use both, Pages for the static assets and a Worker for anything dynamic
                # | behind it
                label: "Use os dois, o Pages para os assets estáticos e um Worker para qualquer coisa dinâmica atrás dele"  # @src=29b8f5b2b570
                # | You don't need the split anymore: Workers serves static assets directly,
                # | which is exactly why the vendor recommends it for new projects. Two
                # | platforms where one suffices is drift waiting to happen.
                feedback: "Você não precisa mais da divisão: o Workers serve assets estáticos direto, que é exatamente por que o fornecedor recomenda ele para projetos novos. Duas plataformas onde uma basta é deriva esperando para acontecer."  # @src=2e7dd987570d
              b:
                # | Build on Workers, Cloudflare's Pages docs themselves say to start new
                # | projects with Workers
                label: "Construa no Workers, a própria documentação do Pages da Cloudflare diz para começar projetos novos com o Workers"  # @src=a8539145eafa
                # | The durable habit outranks the platform trivia: the banner that settles
                # | this is on the vendor's own current docs, and a 2023 tutorial cannot
                # | know what 2026 recommends.
                feedback: "O hábito durável supera a trivia de plataforma: o banner que resolve isso está na documentação atual do próprio fornecedor, e um tutorial de 2023 não tem como saber o que 2026 recomenda."  # @src=2507ad9bc5bc
              a:
                # | Use Pages, it's the static-site product, and a status page is a static
                # | site
                label: "Use o Pages, é o produto de site estático, e uma página de status é um site estático"  # @src=353806dc6dff
                # | That was the 2023 framing. Cloudflare's own Pages docs now steer new
                # | projects away, Workers serves static assets and offers the broader
                # | feature set (cron, KV, gradual deploys).
                feedback: "Esse era o enquadramento de 2023. A própria documentação do Pages da Cloudflare agora desvia projetos novos de lá, o Workers serve assets estáticos e oferece o conjunto de recursos mais amplo (cron, KV, deploys graduais)."  # @src=28b367ea4c4b
              d:
                # | Pages is being deprecated, so start on Workers and migrate anything
                # | still on Pages too
                label: "O Pages está sendo descontinuado, então comece no Workers e migre também qualquer coisa que ainda esteja no Pages"  # @src=a54a37a01e00
                # | The banner steers NEW projects; it announces no end-of-life and asks
                # | nobody to migrate. Reading a recommendation as a deadline is its own way
                # | of not reading the current docs.
                feedback: "O banner direciona projetos NOVOS; ele não anuncia fim de vida nenhum e não pede para ninguém migrar. Ler uma recomendação como um prazo é um jeito próprio de não ler a documentação atual."  # @src=f8192cd09c5f
          m07-l1-q6:
            # | Your worker's cron probes the Solana public RPC getHealth endpoint and
            # | occasionally gets a 429. What does the station's own discipline say to do?
            prompt: "O cron do seu worker sonda o endpoint getHealth do RPC público da Solana e de vez em quando recebe um 429. O que a disciplina da própria estação manda fazer?"  # @src=9cfb4de8b3d1
            # | The structural Solana ramp: the chain joins the target list as just another
            # | endpoint with real limits, 100 requests per 10 seconds per IP on the public
            # | RPC. The backoff-and-budget discipline you built for flaky HTTP in M2 is
            # | exactly what chain probing needs, which is the whole argument of M8 in
            # | miniature.
            explanation: "A rampa Solana estrutural: a blockchain entra na lista de alvos como só mais um endpoint com limites de verdade, 100 requisições por 10 segundos por IP no RPC público. A disciplina de backoff e orçamento que você construiu para HTTP instável no M2 é exatamente o que sondar a blockchain precisa, que é o argumento inteiro do M8 em miniatura."  # @src=eb5c14befbbb
            options:                 # source order — keep it
              a:
                # | Retry immediately in a loop until it answers, getHealth is a cheap call
                label: "Fazer retry na hora num loop até ele responder, o getHealth é uma chamada barata"  # @src=e8e035ad4bec
                # | Immediate retries are exactly what the cap punishes: the public RPC
                # | allows 100 requests per 10 seconds per IP, and hammering it digs the
                # | hole deeper. This is the naive Promise.all mistake from m02-l3 in new
                # | clothes.
                feedback: "Retries imediatos são exatamente o que o teto pune: o RPC público permite 100 requisições por 10 segundos por IP, e martelar nele cava o buraco mais fundo. Este é o erro ingênuo do Promise.all da m02-l3 com roupa nova."  # @src=60fb045969e3
              d:
                # | Cache each getHealth response for ten seconds so repeated cron probes
                # | stop reaching the cap
                label: "Guardar em cache cada resposta de getHealth por dez segundos para que sondas repetidas do cron parem de alcançar o teto"  # @src=1170a83aa3fe
                # | A cached liveness answer is a monitor lying on purpose. The probe's
                # | entire product is whether the RPC answered YOU, just now, and how fast;
                # | serve a ten-second-old ok and the status page reports a node it never
                # | spoke to.
                feedback: "Uma resposta de vivacidade em cache é um monitor mentindo de propósito. O produto inteiro da sonda é se o RPC respondeu VOCÊ, agora mesmo, e quão rápido; sirva um ok de dez segundos atrás e a página de status reporta um nó com quem ela nunca falou."  # @src=f68b440ff410
              c:
                # | Switch the worker over to @solana/kit, whose client handles the public
                # | RPC's rate limits for you
                label: "Migrar o worker para o @solana/kit, cujo cliente lida com os rate limits do RPC público para você"  # @src=b98d6bbc651c
                # | kit is a client library, not a rate-limit exemption, the per-IP cap
                # | applies regardless of what constructs the request. kit reads arrive in
                # | M8 for other reasons; this lesson's ramp is deliberately a plain fetch.
                feedback: "O kit é uma biblioteca cliente, não uma isenção de rate limit, o teto por IP se aplica independentemente do que constrói o request. Leituras com kit chegam no M8 por outros motivos; a rampa desta lição é deliberadamente um fetch simples."  # @src=d8a5a9c3f7b3
              b:
                # | Apply the m02-l3 backoff and treat the cap (100 req/10s/IP) as a budget
                # | the probe respects
                label: "Aplicar o backoff da m02-l3 e tratar o teto (100 req/10s/IP) como um orçamento que a sonda respeita"  # @src=3cc831602f70
                # | The chain arrives as one more endpoint with real limits, and
                # | backoffDelay plus equal jitter comes through the pulse-core import
                # | already written. That is M8's whole argument in one paragraph.
                feedback: "A blockchain chega como mais um endpoint com limites de verdade, e o backoffDelay mais jitter igual vem através do import do pulse-core já escrito. Esse é o argumento inteiro do M8 em um parágrafo."  # @src=ea4b93772654
  m07-l2:
    # | The payoff: Rust on the same edge
    title: "A recompensa: Rust no mesmo edge"  # @src=591455eed576
    blocks:
      edge-tier-gate-check:                      # quiz
        questions:
          m07-l2-q1:
            # | Your engine crate compiled to wasm32 first try, but a teammate's 'quick fix'
            # | adding reqwest to it breaks the build. Why does one of them cross the seam
            # | and the other refuse?
            prompt: "O seu crate do motor compilou para wasm32 de primeira, mas o 'conserto rápido' de um colega de time adicionando reqwest a ele quebra o build. Por que um deles atravessa a costura e o outro recusa?"  # @src=b0351ca12235
            # | wasm32-unknown-unknown means unknown OS: no sockets, no threads, no
            # | filesystem. Pure computation, classifiers, state machines, serde types,
            # | compiles clean; anything that opens a connection needs the platform's fetch
            # | via the worker crate instead. This is the M4 purity bet paying out, and the
            # | same seam m07-l1 taught in TS.
            explanation: "wasm32-unknown-unknown quer dizer OS unknown: nenhum socket, nenhuma thread, nenhum sistema de arquivos. Computação pura, classificadores, máquinas de estados, tipos serde, compila limpo; qualquer coisa que abre uma conexão precisa do fetch da plataforma através do crate worker no lugar. Esta é a aposta de pureza do M4 pagando, e a mesma costura que a m07-l1 ensinou em TS."  # @src=479a0a9d72d7
            options:                 # source order — keep it
              b:
                # | reqwest is too large a dependency, WASM binaries have a size cap that
                # | big crates exceed
                label: "O reqwest é uma dependência grande demais, binários WASM têm um teto de tamanho que crates grandes ultrapassam"  # @src=10c1d0f0c14a
                # | Size limits exist but that's not the failure here: reqwest itself
                # | compiles on wasm32 (it carries a browser backend); the blocking module
                # | the CLI leans on is conditionally compiled away, so the code that
                # | touches it fails with E0433. An I/O boundary, not a size cap.
                feedback: "Limites de tamanho existem, mas não é essa a falha aqui: o reqwest em si compila no wasm32 (ele carrega um backend de navegador); o módulo blocking em que a CLI se apoia é compilado para fora condicionalmente, então o código que toca nele falha com E0433. Uma fronteira de I/O, não um teto de tamanho."  # @src=c4a8ee84dd79
              d:
                # | The core is no_std while reqwest drags std in, and
                # | wasm32-unknown-unknown has no std to link against
                label: "O núcleo é no_std enquanto o reqwest arrasta o std para dentro, e o wasm32-unknown-unknown não tem std nenhum para linkar"  # @src=ddc7e925580a
                # | The engine is std through and through, Strings and Vecs everywhere, and
                # | it still compiles for this target. What the target withholds is threads,
                # | sockets, a filesystem and a clock, not the standard library.
                feedback: "O motor é std de ponta a ponta, Strings e Vecs por todo lado, e ele ainda assim compila para este target. O que o target retém são threads, sockets, um sistema de arquivos e um relógio, não a biblioteca padrão."  # @src=88ec8428d18f
              c:
                # | reqwest is async, and WASM has no event loop of its own to drive
                # | futures, so no async Rust code can run in a worker at all
                label: "O reqwest é async, e o WASM não tem event loop próprio para dirigir futures, então nenhum código Rust async consegue rodar num worker de jeito nenhum"  # @src=0539a1b12bc4
                # | The template's own handler is an async fn, and workerd drives those
                # | futures through the JS event loop it already owns. What is missing is
                # | the OS layer tokio and reqwest's transport need: an I/O boundary, not an
                # | async one.
                feedback: "O handler do próprio template é uma async fn, e o workerd dirige esses futures através do event loop JS de que ele já é dono. O que falta é a camada de OS de que o tokio e o transporte do reqwest precisam: uma fronteira de I/O, não uma async."  # @src=60113263d9a9
              a:
                # | The core is logic with no OS dependencies; wasm32-unknown-unknown has no
                # | sockets or threads, I/O comes from the platform
                label: "O núcleo é lógica sem dependências de OS; o wasm32-unknown-unknown não tem sockets nem threads, o I/O vem da plataforma"  # @src=e20b10550dc1
                # | Unknown OS is the specification, not a placeholder. mio says it in its
                # | own compile_error: there is no epoll or kqueue to wrap, so the crate
                # | refuses before a byte ships.
                feedback: "OS unknown é a especificação, não um placeholder. O mio diz isso no próprio compile_error dele: não existe epoll nem kqueue para embrulhar, então o crate recusa antes de um byte ser entregue."  # @src=3cea2beb70a5
          m07-l2-q2:
            # | Cargo.toml for the worker says `worker = "0.8"` rather than the latest patch
            # | you saw on crates.io. Following m05-l2's pin-reading skill, what is this pin
            # | telling you?
            prompt: "O Cargo.toml do worker diz `worker = \"0.8\"` em vez do patch mais recente que você viu no crates.io. Seguindo a habilidade de ler pins da m05-l2, o que este pin está te dizendo?"  # @src=9454270b0a6d
            # | Under semver, pre-1.0 minors carry breaking-change rights, so `worker =
            # | "0.8"` says 'stay on this line until I choose to migrate.' The same
            # | ecosystem-pin-reading you practiced on agave's Cargo.toml in m05-l2, applied
            # | to your own project: a pin is a decision you can read.
            explanation: "Sob semver, minors pré-1.0 carregam direitos de breaking change, então `worker = \"0.8\"` diz 'fique nesta linha até eu escolher migrar.' A mesma leitura de pin de ecossistema que você praticou no Cargo.toml do agave na m05-l2, aplicada ao seu próprio projeto: um pin é uma decisão que você consegue ler."  # @src=8f5487ffa894
            options:                 # source order — keep it
              d:
                # | 0.8 is shorthand for ^0.8.0, which cargo happily resolves to 0.9, so the
                # | pin decides nothing at all
                label: "0.8 é abreviação de ^0.8.0, que o cargo resolve alegremente para 0.9, então o pin não decide coisa nenhuma"  # @src=d08e8169fb0a
                # | Caret ranges narrow below 1.0: ^0.8.0 means at least 0.8.0 and under
                # | 0.9.0, so cargo will not cross that line for you. The digit you wrote is
                # | the decision, which is why it is worth reading.
                feedback: "Faixas caret estreitam abaixo de 1.0: ^0.8.0 quer dizer no mínimo 0.8.0 e abaixo de 0.9.0, então o cargo não vai atravessar essa linha por você. O dígito que você escreveu é a decisão, e é por isso que ele vale a leitura."  # @src=fc344bf0efbd
              c:
                # | 0.8 is the last version supporting wasm32, newer lines dropped the WASM
                # | target
                label: "0.8 é a última versão que suporta wasm32, as linhas mais novas largaram o target WASM"  # @src=dcaa4c3011a4
                # | WASM is the whole point of workers-rs, no line dropped it. The pin is
                # | about pre-1.0 semver semantics, where 0.9 is allowed to break you the
                # | way 2.0 would elsewhere.
                feedback: "WASM é o propósito inteiro do workers-rs, nenhuma linha largou ele. O pin é sobre a semântica de semver pré-1.0, em que a 0.9 tem permissão de te quebrar do jeito que um 2.0 quebraria em outro lugar."  # @src=9d73d3c16ce4
              a:
                # | The project is stale, a well-maintained project would track the newest
                # | release line
                label: "O projeto está desatualizado, um projeto bem mantido acompanharia a linha de release mais nova"  # @src=6bbd8e54a352
                # | That's the abandonment-signal reflex misapplied: a deliberate
                # | conservative pin on a pre-1.0 SDK is maintenance, not neglect. The
                # | signals from m03-l4 (README, last-publish) tell staleness; a pin alone
                # | doesn't.
                feedback: "Esse é o reflexo de sinal de abandono mal aplicado: um pin conservador deliberado num SDK pré-1.0 é manutenção, não negligência. Os sinais da m03-l4 (README, última publicação) dizem desatualização; um pin sozinho não diz."  # @src=7054d7f6280a
              b:
                # | The crate is pre-1.0, where minor versions may break, the pin holds the
                # | 0.8 line on purpose
                label: "O crate é pré-1.0, em que versões minor podem quebrar, o pin segura a linha 0.8 de propósito"  # @src=273f2240ae89
                # | A 0.x minor carries the breaking-change rights a 2.0 carries elsewhere,
                # | so the pin says stay here until I choose to migrate, and 0.9 is a
                # | release-notes decision rather than a free upgrade.
                feedback: "Um minor 0.x carrega os direitos de breaking change que um 2.0 carrega em outro lugar, então o pin diz fique aqui até eu escolher migrar, e a 0.9 é uma decisão de release notes em vez de um upgrade de graça."  # @src=ebd0a0e9173d
          m07-l2-q3:
            # | You want the workers to store probe-history files. R2 has a real free tier
            # | (10 GB-month, free egress), so why does this course make R2 an optional
            # | extension instead of a core lab?
            prompt: "Você quer que os workers guardem arquivos de histórico de sondas. O R2 tem um tier gratuito de verdade (10 GB-mês, egress de graça), então por que este curso faz do R2 uma extensão opcional em vez de um lab do caminho principal?"  # @src=afe854141836
            # | The course's deploy-sanity rule is free tier, no card in the core path.
            # | Community-thread evidence says enabling R2 requires a payment method even at
            # | $0, so KV carries the core path and R2 becomes a clearly-labeled optional
            # | extension for learners who choose to link a card. Same rule that keeps
            # | Cloudflare Containers ($5/mo Workers Paid) a signpost.
            explanation: "A regra de sanidade de deploy do curso é tier gratuito, sem cartão no caminho principal. A evidência das threads da comunidade diz que habilitar o R2 exige um método de pagamento mesmo a $0, então o KV carrega o caminho principal e o R2 vira uma extensão opcional claramente rotulada para quem escolhe vincular um cartão. Mesma regra que mantém o Cloudflare Containers ($5/mo Workers Paid) como uma placa."  # @src=68f191b8d131
            options:                 # source order — keep it
              c:
                # | Enabling R2 requires linking a payment method even for free use, it
                # | fails the course's no-card rule
                label: "Habilitar o R2 exige vincular um método de pagamento mesmo para uso gratuito, isso falha a regra de sem-cartão do curso"  # @src=4a11d323a2bc
                # | So KV carries the core path and R2 becomes a clearly-labeled optional
                # | extension. Note what the reason is NOT: the allowance is generous and
                # | the product fits; the gate is the card, before a cent is spent.
                feedback: "Então o KV carrega o caminho principal e o R2 vira uma extensão opcional claramente rotulada. Repare no que o motivo NÃO é: a cota é generosa e o produto serve; a trava é o cartão, antes de um centavo ser gasto."  # @src=708124aaff7c
              b:
                # | Object storage belongs to a sibling Academy course, and this course
                # | never teaches what a sibling owns
                label: "Armazenamento de objetos pertence a um curso irmão da Academy, e este curso nunca ensina aquilo de que um irmão é dono"  # @src=52d3a64edb9c
                # | No sibling course owns R2, the hand-off map covers Solana depth, Anchor,
                # | wallets, and tokens. R2 is out of the CORE path for a cost-honesty
                # | reason, not a boundary one.
                feedback: "Nenhum curso irmão é dono do R2, o mapa de repasse cobre profundidade em Solana, Anchor, carteiras e tokens. O R2 está fora do caminho PRINCIPAL por um motivo de honestidade de custo, não por um de fronteira."  # @src=0240000ceba9
              a:
                # | R2's free tier is too small for a whole fleet's probe history, so the
                # | lab would hit the cap mid-module
                label: "O tier gratuito do R2 é pequeno demais para o histórico de sondas de uma frota inteira, então o lab bateria no teto no meio do módulo"  # @src=bb4bb840bb01
                # | 10 GB-month dwarfs a probe fleet's JSON output, the allowance is
                # | generous. The blocker isn't quota; it's what enabling the product asks
                # | of you first.
                feedback: "10 GB-mês faz a saída JSON de uma frota de sondas parecer minúscula, a cota é generosa. O impedimento não é cota; é o que habilitar o produto pede de você primeiro."  # @src=7074a8ffca25
              d:
                # | R2 sits behind the same $5/mo Workers Paid plan that Containers needs,
                # | so the blocker is a bill and not a card
                label: "O R2 fica atrás do mesmo plano Workers Paid de $5/mo que o Containers precisa, então o impedimento é uma conta e não um cartão"  # @src=0112ceb2bbac
                # | Containers is the one behind Workers Paid. R2's storage genuinely costs
                # | nothing at this scale, which is what makes its card requirement the more
                # | interesting exclusion: free, and still gated.
                feedback: "O Containers é que fica atrás do Workers Paid. O armazenamento do R2 genuinamente não custa nada nesta escala, que é o que faz da exigência de cartão dele a exclusão mais interessante: de graça, e ainda assim travado."  # @src=f53d4efdea06
          m07-l2-q4:
            # | Both of your workers, TS yesterday, Rust today, went live with the identical
            # | `npx wrangler deploy` command. What is the module's takeaway from that?
            prompt: "Os seus dois workers, TS ontem, Rust hoje, entraram no ar com o comando `npx wrangler deploy` idêntico. Qual é a lição que o módulo deixa a partir disso?"  # @src=a4af675c760c
            # | The module's closing law: the edge platform defines a contract
            # | (fetch/scheduled handlers, KV bindings, cron, one deploy command) and
            # | doesn't care what satisfies it. That's why the station could bring both of
            # | its engines to the edge, and it's the same idea you'll reuse whenever a
            # | platform, not a language, defines the seam.
            explanation: "A lei de fechamento do módulo: a plataforma de edge define um contrato (handlers de fetch/scheduled, bindings de KV, cron, um comando de deploy) e não se importa com o que o satisfaz. É por isso que a estação conseguiu levar os dois motores dela para o edge, e é a mesma ideia que você vai reusar sempre que uma plataforma, não uma linguagem, definir a costura."  # @src=b1091dd88532
            options:                 # source order — keep it
              c:
                # | Rust and TypeScript compile to equivalent output, so the choice between
                # | them is only style
                label: "Rust e TypeScript compilam para uma saída equivalente, então a escolha entre os dois é só estilo"  # @src=9accfc8aa3e5
                # | They produce very different artifacts (WASM module vs JS) with different
                # | trade-offs, this very lesson's tradeoff section says the TS worker is
                # | often the pragmatic default. What's shared is the platform's interface,
                # | not the languages' equivalence.
                feedback: "Eles produzem artefatos muito diferentes (módulo WASM vs JS) com trade-offs diferentes, a seção de trade-off desta mesma lição diz que o worker TS é muitas vezes o padrão pragmático. O que é compartilhado é a interface da plataforma, não a equivalência das linguagens."  # @src=346e46103108
              d:
                # | wrangler detects the project's language and runs the matching build, so
                # | the deploy contract looks identical
                label: "O wrangler detecta a linguagem do projeto e roda o build correspondente, então o contrato de deploy parece idêntico"  # @src=0278e12c493b
                # | It detects nothing. wrangler.toml's [build] block names the command, and
                # | yours happens to invoke worker-build; put any command there that emits
                # | an entry file and the same deploy verb ships it.
                feedback: "Ele não detecta nada. O bloco [build] do wrangler.toml nomeia o comando, e o seu por acaso invoca o worker-build; ponha qualquer comando ali que emita um arquivo de entrada e o mesmo verbo de deploy entrega ele."  # @src=baafb8e22ea6
              a:
                # | The platform contract, handler shape, bindings, cron, is the artifact;
                # | the language behind it is interchangeable
                label: "O contrato de plataforma, formato de handler, bindings, cron, é o artefato; a linguagem por trás dele é intercambiável"  # @src=9fa92dee2414
                # | Ask the discriminating question: what did wrangler need to know about
                # | your language? Nothing. It ran a build command out of a config file and
                # | uploaded the result, which is all it ever did.
                feedback: "Faça a pergunta discriminante: o que o wrangler precisou saber sobre a sua linguagem? Nada. Ele rodou um comando de build a partir de um arquivo de config e subiu o resultado, que é tudo que ele sempre fez."  # @src=5b4371624bdd
              b:
                # | wrangler transpiles Rust to JavaScript during the build step, so both
                # | deploys really ship the same kind of code to the edge
                label: "O wrangler transpila Rust para JavaScript durante a etapa de build, então os dois deploys na verdade entregam o mesmo tipo de código para o edge"  # @src=b6240ec030f3
                # | No transpilation happens, the Rust is compiled to WASM by worker-build
                # | and runs as WASM next to JS glue. The deploys are identical because the
                # | CONTRACT is, not because the code is.
                feedback: "Não acontece transpilação nenhuma, o Rust é compilado para WASM pelo worker-build e roda como WASM ao lado de cola JS. Os deploys são idênticos porque o CONTRATO é, não porque o código é."  # @src=ee827c61a359
  m08-l1:
    # | A chain is a target: the minimal model + first reads
    title: "Uma blockchain é um alvo: o modelo mínimo + as primeiras leituras"  # @src=5c3fbc540e3a
    blocks:
      epoch-clock:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Math.floor, not Math.round, a slot 60% through epoch 3 is still in epoch 3.
          0: "Math.floor, não Math.round, um slot 60% dentro da epoch 3 ainda está na epoch 3."  # @src=456f5e4da370
          # | slot % 432000 tells you how far you ARE; the countdown wants how far you have
          # | LEFT.
          1: "slot % 432000 te diz o quanto você já ANDOU; a contagem regressiva quer o quanto RESTA."  # @src=5ac6662d3262
          # | slotMs is milliseconds: an hour is 3,600,000 of them.
          2: "slotMs é em milissegundos: uma hora tem 3,600,000 deles."  # @src=d0207cebb070
        tests:                      # keyed by test case id
          t1:
            # | an exact epoch boundary at 300ms slots: a full epoch is 36 wall-clock hours
            description: "uma fronteira de epoch exata com slots de 300ms: uma epoch inteira são 36 horas em tempo de relógio"  # @src=69f57e223a72
          t2:
            # | 1,000 slots into the epoch, the clock ticks down
            description: "1,000 slots dentro da epoch, o relógio conta para baixo"  # @src=75f200cefcc2
          t3:
            # | halfway through epoch 0 at the old 400ms cadence
            description: "na metade da epoch 0 na antiga cadência de 400ms"  # @src=88e1ae7c0dbb
          t4:
            # | at 400ms slots the same 432,000-slot epoch is 48 hours, not 36
            description: "com slots de 400ms a mesma epoch de 432,000 slots são 48 horas, não 36"  # @src=e8c6e8d5330e
          t5:
            # | one slot past a boundary rounds its hours display to 36.0
            description: "um slot depois de uma fronteira arredonda a exibição de horas dela para 36.0"  # @src=934bb1f5d845
      chain-model-check:                      # quiz
        questions:
          m08-l1-q1:
            # | Your probe script calls getSlot twice, ten seconds apart, and the number
            # | climbed by about 33. What did you just observe?
            prompt: "O seu script de sonda chama getSlot duas vezes, com dez segundos de intervalo, e o número subiu uns 33. O que você acabou de observar?"  # @src=53cdb3c36fb1
            # | A slot is the network's clock tick, the unit in which the chain schedules
            # | block production. At the post-SIMD-0525 300ms target, ten seconds is about
            # | 33 slots. This is the whole point of the gauge: the chain publishes its own
            # | heartbeat, and getSlot is the stethoscope.
            explanation: "Um slot é o tique de relógio da rede, a unidade em que a blockchain agenda a produção de blocos. Na meta de 300ms pós-SIMD-0525, dez segundos são uns 33 slots. Esse é o ponto inteiro do medidor: a blockchain publica o próprio batimento dela, e o getSlot é o estetoscópio."  # @src=b98211c70054
            options:                 # source order — keep it
              c:
                # | Your own request latency, since each call takes about 300ms round-trip
                label: "A latência das suas próprias requisições, já que cada chamada leva uns 300ms de ida e volta"  # @src=59c5a5594fb6
                # | Round-trip latency affects WHEN you see the number, not the number
                # | itself. Ten seconds at ~300ms per slot is ~33 slots, the arithmetic
                # | matches the network's cadence, not your connection's.
                feedback: "A latência de ida e volta afeta QUANDO você vê o número, não o número em si. Dez segundos a ~300ms por slot são ~33 slots, a aritmética bate com a cadência da rede, não com a da sua conexão."  # @src=0f5cce0ae511
              d:
                # | The block height rising by 33, since every slot fills with a block
                label: "A altura de bloco subindo 33, já que todo slot se enche com um bloco"  # @src=c430e4d98b95
                # | Slot and block are not synonyms: the slot is the tick of the clock, the
                # | block is what lands in it, and a slot with no block still advances the
                # | counter. getSlot returns ticks, so block height is the number you did
                # | not read.
                feedback: "Slot e bloco não são sinônimos: o slot é o tique do relógio, o bloco é o que aterrissa nele, e um slot sem bloco ainda assim avança o contador. O getSlot devolve tiques, então a altura de bloco é o número que você não leu."  # @src=94ff7f028f1f
              e:
                # | A 33-slot backlog this RPC node might still be working through
                label: "Um backlog de 33 slots pelo qual este nó de RPC talvez ainda esteja passando"  # @src=6495c2e9c801
                # | A node still catching up would say so: getHealth answered ok before you
                # | started. And a replaying node would race ahead of wall-clock time, while
                # | 33 ticks in ten seconds is exactly the pace the live network is
                # | producing them at.
                feedback: "Um nó ainda se atualizando diria isso: o getHealth respondeu ok antes de você começar. E um nó em replay dispararia à frente do tempo de relógio, enquanto 33 tiques em dez segundos são exatamente o ritmo em que a rede ao vivo está produzindo eles."  # @src=bbf55d576a86
              a:
                # | The RPC node processing 33 of your queued read requests in order
                label: "O nó de RPC processando 33 das suas requisições de leitura enfileiradas em ordem"  # @src=469f064a0ac6
                # | Reads don't queue as chain events, your two getSlot calls were just
                # | questions. The slot counter advanced on its own, whether or not anyone
                # | asked.
                feedback: "Leituras não entram em fila como eventos da blockchain, as suas duas chamadas de getSlot foram só perguntas. O contador de slot avançou sozinho, com ou sem alguém perguntando."  # @src=ac18c9e0fbf3
              b:
                # | The chain's heartbeat, a new slot ticking roughly every 300ms
                label: "O batimento da blockchain, um slot novo tiquetando mais ou menos a cada 300ms"  # @src=1eff08ad6cf9
                # | Ten seconds over 33 ticks lands near 300ms, which is the post-SIMD-0525
                # | target the network has run since epoch 1024. The counter moved because
                # | validators kept producing slots, not because you asked twice.
                feedback: "Dez segundos sobre 33 tiques cai perto de 300ms, que é a meta pós-SIMD-0525 na qual a rede vem rodando desde a epoch 1024. O contador se moveu porque os validadores continuaram produzindo slots, não porque você perguntou duas vezes."  # @src=8ba11785c8d3
          m08-l1-q2:
            # | After the 400ms-to-300ms upgrade, your gauge shows epochs lasting 36 hours
            # | instead of 48. Nobody announced an epoch change. What happened?
            prompt: "Depois do upgrade de 400ms para 300ms, o seu medidor mostra epochs durando 36 horas em vez de 48. Ninguém anunciou uma mudança de epoch. O que aconteceu?"  # @src=b8ecc0c25d01
            # | The epoch is a slot-count, not a duration: 432,000 slots, always. Wall-clock
            # | epoch length = 432,000 x slot time, so 400ms gives 48h and 300ms gives 36h.
            # | Your epoch-clock challenge computes exactly this, one fixed constant, one
            # | measured variable.
            explanation: "A epoch é uma contagem de slots, não uma duração: 432,000 slots, sempre. Comprimento da epoch em tempo de relógio = 432,000 x tempo de slot, então 400ms dá 48h e 300ms dá 36h. O seu challenge epoch-clock calcula exatamente isso, uma constante fixa, uma variável medida."  # @src=385f920dae76
            options:                 # source order — keep it
              a:
                # | The upgrade also shortened epochs from 432,000 to 324,000 slots to
                # | compensate
                label: "O upgrade também encurtou as epochs de 432,000 para 324,000 slots para compensar"  # @src=89e6789b354e
                # | No, ticks_per_slot and the 432,000-slot epoch both stayed fixed through
                # | SIMD-0525. Check the arithmetic: 432,000 x 300ms is exactly 36 hours
                # | with no epoch resize needed.
                feedback: "Não, o ticks_per_slot e a epoch de 432,000 slots ficaram os dois fixos ao longo do SIMD-0525. Confira a aritmética: 432,000 x 300ms são exatamente 36 horas sem nenhum redimensionamento de epoch necessário."  # @src=a16dbb221d01
              c:
                # | Epochs stay fixed at 432,000 slots, so wall-clock length tracks slot
                # | time
                label: "As epochs ficam fixas em 432,000 slots, então o comprimento em tempo de relógio acompanha o tempo de slot"  # @src=b08fee184d98
                # | 432,000 times 0.3 seconds is 129,600 seconds, exactly 36 hours. Nothing
                # | about the epoch was changed; the multiplier moved, and every schedule
                # | keyed to epoch boundaries moved with it.
                feedback: "432,000 vezes 0.3 segundos são 129,600 segundos, exatamente 36 horas. Nada na epoch foi mudado; o multiplicador se moveu, e todo cronograma chaveado por fronteiras de epoch se moveu com ele."  # @src=8ab86333c14a
              b:
                # | Your clock is buggy: epoch duration is defined in hours and cannot drift
                label: "O seu relógio está bugado: a duração da epoch é definida em horas e não pode descolar"  # @src=d6dfba4b0e90
                # | Backwards, epochs are defined in SLOTS, not hours. The wall-clock
                # | duration is the derived quantity, which is exactly why it moved when
                # | slot time did.
                feedback: "Ao contrário, as epochs são definidas em SLOTS, não em horas. A duração em tempo de relógio é a quantidade derivada, que é exatamente por que ela se moveu quando o tempo de slot se moveu."  # @src=c4298dc8f590
              d:
                # | The feature gate activated mid-epoch, so this one epoch alone came up
                # | short
                label: "O feature gate ativou no meio da epoch, então só esta epoch ficou curta"  # @src=a6425f2b899a
                # | Feature gates flip at an epoch boundary, never partway through one: the
                # | stage-2 gate landed in epoch 1023 and the behavior switched at the start
                # | of 1024. And 36 hours is the new steady state, not a one-off transition.
                feedback: "Feature gates viram numa fronteira de epoch, nunca no meio de uma: o gate da stage 2 aterrissou na epoch 1023 e o comportamento virou no começo da 1024. E 36 horas é o novo estado estável, não uma transição pontual."  # @src=5ed9ff2fff5c
          m08-l1-q3:
            # | Your 20-sample gauge averages 316ms where the network publishes 300ms. A
            # | teammate says your measurement must be wrong. Who's right?
            prompt: "O seu medidor de 20 amostras dá média de 316ms onde a rede publica 300ms. Um colega de time diz que a sua medição deve estar errada. Quem está certo?"  # @src=2c438b4961a8
            # | Targets versus measurements is the course's oldest lesson wearing chain
            # | clothes: the network aims at 300ms and measured 316 ms at research time (~5%
            # | above). Publish what you measure. Your own station's dashboard should get
            # | the same honesty, a claimed uptime and a measured uptime are different
            # | numbers.
            explanation: "Metas versus medições é a lição mais velha do curso vestida de blockchain: a rede mira em 300ms e mediu 316 ms na data da pesquisa (~5% acima). Publique o que você mede. O painel da sua própria estação merece a mesma honestidade, um uptime declarado e um uptime medido são números diferentes."  # @src=93cde73cd03e
            options:                 # source order — keep it
              b:
                # | The teammate: your HTTP round-trip time is leaking into the slot-time
                # | numbers
                label: "O colega de time: o seu tempo de ida e volta de HTTP está vazando para dentro dos números de tempo de slot"  # @src=d7eea8cfa91a
                # | getRecentPerformanceSamples reports the node's own recorded slot
                # | timings, your connection latency affects fetching the samples, not the
                # | values inside them. The research sweep measured the same 316 ms.
                feedback: "O getRecentPerformanceSamples reporta os tempos de slot registrados pelo próprio nó, a latência da sua conexão afeta a busca das amostras, não os valores dentro delas. A varredura de pesquisa mediu os mesmos 316 ms."  # @src=fdd4ced086ec
              c:
                # | Neither: the 300ms change hasn't activated yet, so both numbers are
                # | stale
                label: "Nenhum dos dois: a mudança de 300ms ainda não ativou, então os dois números estão desatualizados"  # @src=600c7badc6cc
                # | The stage-2 gate is decodable on-chain, activated at epoch 1024,
                # | 2026-08-28. The upgrade is live; the gap between 300 and 316 is the
                # | normal daylight between a target and a running system.
                feedback: "O gate da stage 2 é decodificável on-chain, ativado na epoch 1024, 2026-08-28. O upgrade está ao vivo; a diferença entre 300 e 316 é a distância normal entre uma meta e um sistema rodando."  # @src=2956e5d34e52
              a:
                # | You: 300ms is a target, and live networks measure somewhat above their
                # | targets
                label: "Você: 300ms é uma meta, e redes ao vivo medem um pouco acima das metas delas"  # @src=2f972dbb4a5c
                # | A target is an engineering intention and a measurement is what happened.
                # | Two independent runs, 316ms and 313.6ms on different days, put the gap
                # | around five percent, which is what a live system looks like rather than
                # | a defect.
                feedback: "Uma meta é uma intenção de engenharia e uma medição é o que aconteceu. Duas execuções independentes, 316ms e 313.6ms em dias diferentes, colocam a diferença perto de cinco por cento, que é a cara de um sistema ao vivo em vez de um defeito."  # @src=962a1be5b7ee
              d:
                # | The teammate: a live network holds its target, so 316ms signals trouble
                label: "O colega de time: uma rede ao vivo segura a meta dela, então 316ms sinaliza problema"  # @src=000b05734ee4
                # | No running system holds its target exactly, and this one publishes the
                # | evidence: 316ms on 2026-09-01, 313.6ms the next day, a 20-sample window
                # | spanning 309.3 to 326.1ms with nothing flagged. Five percent above
                # | target is the ordinary state, not an incident.
                feedback: "Nenhum sistema rodando segura a meta dele exatamente, e este publica a evidência: 316ms em 2026-09-01, 313.6ms no dia seguinte, uma janela de 20 amostras indo de 309.3 a 326.1ms sem nada sinalizado. Cinco por cento acima da meta é o estado ordinário, não um incidente."  # @src=1a2c703a28b7
          m08-l1-q4:
            # | Your probe read the slot, the health, and (next lesson) balances, all
            # | without a wallet, a key, or a fee. What makes that possible?
            prompt: "A sua sonda leu o slot, a saúde e (na próxima lição) saldos, tudo sem uma carteira, uma chave ou uma taxa. O que torna isso possível?"  # @src=3dd4211a9715
            # | The minimal model's fourth idea: RPC nodes hold a copy of state and answer
            # | questions about it. Reading is asking; writing is a signed transaction that
            # | mutates. That asymmetry shapes this whole module, three lessons of free
            # | reads from two languages, then one carefully-earned write.
            explanation: "A quarta ideia do modelo mínimo: nós de RPC guardam uma cópia do estado e respondem perguntas sobre ele. Ler é perguntar; escrever é uma transação assinada que muta. Essa assimetria dá forma a este módulo inteiro, três lições de leituras grátis a partir de duas linguagens, depois uma escrita cuidadosamente conquistada."  # @src=4768ad4a847f
            options:                 # source order — keep it
              a:
                # | The public RPC covers your read fees out of a shared faucet allowance
                # | everyone draws on
                label: "O RPC público cobre as suas taxas de leitura a partir de uma cota compartilhada de faucet da qual todo mundo saca"  # @src=4365751912b9
                # | There's no fee being covered, reads simply aren't chain events. Fees
                # | exist to pay for state MUTATION, which is what transactions do and
                # | queries don't.
                feedback: "Não tem taxa nenhuma sendo coberta, leituras simplesmente não são eventos da blockchain. As taxas existem para pagar por MUTAÇÃO de estado, que é o que transações fazem e consultas não."  # @src=67cb1977171d
              d:
                # | Kit opens a fee-free read session, so no key is needed for queries
                label: "O kit abre uma sessão de leitura sem taxa, então nenhuma chave é necessária para consultas"  # @src=331349a01fa3
                # | The lesson's first read was a raw curl POST with no client library at
                # | all, and it came back just as free. Kit adds types and a nicer call
                # | shape on top of the same JSON-RPC door; it does not negotiate anything
                # | with the node.
                feedback: "A primeira leitura da lição foi um POST cru de curl sem biblioteca de cliente nenhuma, e ela voltou igualmente grátis. O kit acrescenta tipos e uma forma de chamada mais agradável em cima da mesma porta JSON-RPC; ele não negocia nada com o nó."  # @src=f0bdcd6225d1
              c:
                # | Read requests are free-tier transactions that validators process without
                # | signatures
                label: "Requisições de leitura são transações de tier grátis que os validadores processam sem assinaturas"  # @src=178abda53a41
                # | A read never becomes a transaction at all, it never touches consensus.
                # | Only writes are transactions, which is why m08-l4's single transfer is
                # | the module's big event and reads are three lines.
                feedback: "Uma leitura nunca vira uma transação, ponto, ela nunca toca o consenso. Só escritas são transações, que é por que a transferência única do m08-l4 é o grande evento do módulo e leituras são três linhas."  # @src=874d0013fee0
              b:
                # | RPC is the read door, a node answering questions about state, no
                # | transaction
                label: "RPC é a porta de leitura, um nó respondendo perguntas sobre estado, sem transação"  # @src=7c0546e497e4
                # | The node holds a copy of state and answers JSON questions about it, the
                # | way any web server answers a GET. Nothing was signed, nothing was paid
                # | for, and no validator recorded that you asked.
                feedback: "O nó guarda uma cópia do estado e responde perguntas JSON sobre ele, do jeito que qualquer servidor web responde a um GET. Nada foi assinado, nada foi pago, e nenhum validador registrou que você perguntou."  # @src=65b5c11b18cb
  m08-l2:
    # | Reads in production: the Solana panel
    title: "Leituras em produção: o painel da Solana"  # @src=1ecb0a33371e
    blocks:
      lamports-to-sol:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The remainder's DIGITS aren't the fraction, 2,500,000 lamports is .0025, not
          # | .25: pad to nine places first.
          0: "Os DÍGITOS do resto não são a fração, 2,500,000 lamports é .0025, não .25: preencha até nove casas primeiro."  # @src=9419fe18223b
          # | padStart(9, '0'), then trim trailing zeros with a replace.
          1: "padStart(9, '0'), depois apare os zeros à direita com um replace."  # @src=86086c8c684a
          # | Never convert the bigint to Number, t5's balance is above 2^53 on purpose.
          2: "Nunca converta o bigint para Number, o saldo do t5 está acima de 2^53 de propósito."  # @src=f0408b64250a
        tests:                      # keyed by test case id
          t1:
            # | one lamport needs all nine fractional digits
            description: "um lamport precisa de todos os nove dígitos fracionários"  # @src=1a2403fb16ea
          t2:
            # | a whole SOL prints with no decimal point
            description: "um SOL inteiro imprime sem ponto decimal"  # @src=5b6fe59330f9
          t3:
            # | trailing zeros in the fraction are trimmed
            description: "zeros à direita na fração são aparados"  # @src=98a8557c4c3c
          t4:
            # | the padding case: 2,500,000 lamports is 0.0025 SOL, not 0.25
            description: "o caso do padding: 2,500,000 lamports é 0.0025 SOL, não 0.25"  # @src=8f6e71731a97
          t5:
            # | a balance above 2^53 lamports, Number-based math would corrupt this
            description: "um saldo acima de 2^53 lamports, matemática baseada em Number corromperia isso"  # @src=a4126303f512
          t6:
            # | zero lamports is just 0
            description: "zero lamports é só 0"  # @src=e0321784fe14
      production-reads-check:                      # quiz
        questions:
          m08-l2-q1:
            # | getBalance hands your panel `{ value: lamports }` where lamports is a
            # | bigint. Why does kit refuse to give you a plain number?
            prompt: "getBalance passa para o seu painel `{ value: lamports }` onde lamports é um bigint. Por que o kit se recusa a te dar um number puro e simples?"  # @src=7102e3b48fba
            # | 2^53 - 1 lamports is about 9 million SOL, real accounts exceed it. Above
            # | that line, JS numbers round without warning; bigint doesn't. That's why the
            # | canonical read is `const { value: lamports } = await
            # | rpc.getBalance(address).send()` with lamports as bigint, and why your
            # | formatter does BigInt division and string padding instead of dividing by
            # | 1e9.
            explanation: "2^53 - 1 lamports é mais ou menos 9 milhões de SOL, contas de verdade passam disso. Acima dessa linha, numbers de JS arredondam sem avisar; bigint não. É por isso que a leitura canônica é `const { value: lamports } = await rpc.getBalance(address).send()` com lamports como bigint, e por isso que o seu formatador faz divisão de BigInt e padding de string em vez de dividir por 1e9."  # @src=001f4edd46f5
            options:                 # source order — keep it
              d:
                # | The wire sends lamports as a decimal string, and number cannot parse it
                # | at all
                label: "O fio manda lamports como uma string decimal, e number não consegue parsear isso de jeito nenhum"  # @src=bcd9fc1fb193
                # | The wire sends a JSON number, which parses fine. That is the trap:
                # | JSON.parse on a raw RPC response hands back a number that has already
                # | rounded anything above the cliff, before your code ever sees it. Kit
                # | reads the same bytes into a bigint instead.
                feedback: "O fio manda um number de JSON, que parseia tranquilo. Essa é a cilada: JSON.parse numa resposta de RPC crua devolve um number que já arredondou qualquer coisa acima do penhasco, antes de o seu código chegar a ver. O kit lê os mesmos bytes para dentro de um bigint em vez disso."  # @src=57064cea9978
              c:
                # | Lamport balances can exceed Number.MAX_SAFE_INTEGER, where number math
                # | lies
                label: "Saldos em lamports podem passar de Number.MAX_SAFE_INTEGER, onde a matemática de number mente"  # @src=02f528dea17a
                # | 2^53 - 1 lamports is about 9 million SOL, and exchange wallets and stake
                # | pools sit above it. Past that line float arithmetic rounds without
                # | throwing or warning, so kit keeps every u64 as bigint and moves the
                # | corruption risk to the one place you control: your own Number() call.
                feedback: "2^53 - 1 lamports é mais ou menos 9 milhões de SOL, e carteiras de exchange e stake pools ficam acima disso. Passando dessa linha a aritmética de float arredonda sem lançar nem avisar, então o kit mantém todo u64 como bigint e move o risco de corrupção para o único lugar que você controla: a sua própria chamada de Number()."  # @src=5b14e6f0dab0
              a:
                # | Numbers can't represent lamports because balances are always
                # | negative-safe integers
                label: "Numbers não conseguem representar lamports porque saldos são sempre inteiros seguros para negativos"  # @src=d5eb27ecf76c
                # | Sign isn't the issue, JS numbers hold negative integers fine. The
                # | problem is magnitude: past 2^53 - 1, number arithmetic silently rounds,
                # | which is fatal for money.
                feedback: "O sinal não é a questão, numbers de JS seguram inteiros negativos tranquilamente. O problema é a magnitude: passando de 2^53 - 1, a aritmética de number arredonda em silêncio, o que é fatal para dinheiro."  # @src=93056421c7ff
              b:
                # | bigint parses faster than number does in kit's JSON-RPC response
                # | decoding layer
                label: "bigint parseia mais rápido que number na camada de decodificação de resposta JSON-RPC do kit"  # @src=7528437c903e
                # | It's a correctness choice, not a performance one, bigint parsing is if
                # | anything slower. The point is that no balance can be silently corrupted
                # | on the way in.
                feedback: "É uma escolha de corretude, não de performance, o parse de bigint é, se for alguma coisa, mais lento. O ponto é que nenhum saldo pode ser corrompido em silêncio no caminho para dentro."  # @src=32dfdde70ed8
          m08-l2-q2:
            # | A teammate pins kit to the exact version a three-month-old tutorial used,
            # | then `npm i @solana-program/system` fails with a peer-dependency error.
            # | What's the taught fix?
            prompt: "Um colega de time fixa o kit na versão exata que um tutorial de três meses atrás usou, e aí `npm i @solana-program/system` falha com um erro de peer-dependency. Qual é o conserto ensinado?"  # @src=0595c05a2481
            # | Kit shipped two majors in just over nine weeks; any digit written into a
            # | tutorial (or this course) pre-rots. The durable rule from m03-l1, now paying
            # | off: read the peerDependencies of the packages you actually depend on, per
            # | workspace, and pin to what they demand. Digits belong only in install lines
            # | verified at the time you run them.
            explanation: "O kit entregou dois majors em pouco mais de nove semanas; qualquer dígito escrito num tutorial (ou neste curso) já apodrece de antemão. A regra durável do m03-l1, agora dando retorno: leia as peerDependencies dos pacotes de que você de fato depende, por workspace, e fixe no que eles exigem. Dígitos pertencem só a linhas de install verificadas na hora em que você roda elas."  # @src=fcf8c46014f8
            options:                 # source order — keep it
              a:
                # | Read the peer ranges of your workspace's @solana-program/* packages and
                # | pin to those
                label: "Leia as faixas de peer dos pacotes @solana-program/* do seu workspace e fixe nelas"  # @src=bed0063f35b7
                # | npm view @solana-program/system version peerDependencies is the whole
                # | reading, and it took one command: at write time it declared @solana/kit
                # | ^8.0.0. The contract lives in your own tree, so it stays right on the
                # | day you run it rather than the day someone wrote a tutorial.
                feedback: "npm view @solana-program/system version peerDependencies é a leitura inteira, e levou um comando: na hora de escrita ele declarou @solana/kit ^8.0.0. O contrato mora na sua própria árvore, então ele continua certo no dia em que você roda, e não no dia em que alguém escreveu um tutorial."  # @src=7f305d216df7
              c:
                # | Install with --legacy-peer-deps, since peer warnings are advisory in
                # | modern npm
                label: "Instale com --legacy-peer-deps, já que avisos de peer são apenas informativos no npm moderno"  # @src=e2f177a796fc
                # | Forcing past a peer error ships a version mismatch that fails at runtime
                # | instead of install time, strictly worse. The error is the package
                # | manager reading the contract for you.
                feedback: "Forçar para além de um erro de peer entrega um descompasso de versão que falha em tempo de execução em vez de na hora do install, estritamente pior. O erro é o gerenciador de pacotes lendo o contrato por você."  # @src=fae4e8b5c5a4
              d:
                # | Pin @solana-program/system to the same major as kit, since the two ship
                # | in lockstep
                label: "Fixe @solana-program/system no mesmo major do kit, já que os dois são entregues em lockstep"  # @src=e01a1424cf95
                # | The digits never lined up: at write time the client sat at 0.14.1 while
                # | peering @solana/kit ^8.0.0. Generated clients version on their own
                # | schedule and declare the kit range they were built against, which is the
                # | only place the pairing is written down.
                feedback: "Os dígitos nunca bateram: na hora de escrita o cliente estava em 0.14.1 enquanto dava peer em @solana/kit ^8.0.0. Clientes gerados versionam no cronograma próprio deles e declaram a faixa de kit contra a qual foram construídos, que é o único lugar em que o pareamento está escrito."  # @src=919b45475fe1
              b:
                # | Always pin the newest kit major, since the client libraries track it
                # | within days
                label: "Fixe sempre no major mais novo do kit, já que as bibliotecas de cliente acompanham ele em dias"  # @src=e032a1f9b57e
                # | Newest-major is just a different frozen digit, and m03-l1's helius-sdk
                # | artifact showed a live package peering two majors behind latest. The
                # | peer range in YOUR tree is the contract, whichever direction it points.
                feedback: "Major-mais-novo é só um dígito congelado diferente, e o artefato helius-sdk do m03-l1 mostrou um pacote ao vivo dando peer dois majors atrás do latest. A faixa de peer na SUA árvore é o contrato, para qualquer direção que ela aponte."  # @src=f6d4b6776293
          m08-l2-q3:
            # | Why does the worker serve chain data from a KV snapshot refreshed on cron,
            # | instead of calling the RPC inside every incoming request?
            prompt: "Por que o worker serve dados da blockchain a partir de um snapshot no KV com refresh no cron, em vez de chamar o RPC dentro de toda requisição que chega?"  # @src=fa6548108af5
            # | The public RPC is a shared, capped resource explicitly not meant for
            # | production traffic. Routing every visitor's page view to it converts your
            # | traffic into rate-limit bans. The station's pattern, cron-refreshed KV
            # | snapshot, backoff on refresh, honest timestamp, is the same budget
            # | discipline m02-l3 taught, applied to a chain.
            explanation: "O RPC público é um recurso compartilhado e com teto, explicitamente não pensado para tráfego de produção. Rotear a visualização de página de todo visitante para ele converte o seu tráfego em bans de rate limit. O padrão da estação, snapshot no KV com refresh por cron, backoff no refresh, timestamp honesto, é a mesma disciplina de orçamento que o m02-l3 ensinou, aplicada a uma blockchain."  # @src=cf995a9fd094
            options:                 # source order — keep it
              c:
                # | Chain state only changes at epoch boundaries, so more frequent reads
                # | return identical data
                label: "Estado da blockchain só muda nos limites de epoch, então leituras mais frequentes retornam dados idênticos"  # @src=44468028b1c1
                # | State changes every slot, roughly every 300ms, so fresher reads DO see
                # | new data. The snapshot trades a little freshness for surviving the rate
                # | budget; it doesn't claim the data is static.
                feedback: "O estado muda a cada slot, mais ou menos a cada 300ms, então leituras mais frescas VEEM dados novos sim. O snapshot troca um pouco de frescor por sobreviver ao orçamento de taxa; ele não afirma que os dados são estáticos."  # @src=108c62bef4df
              d:
                # | Cloudflare bills each outbound fetch, so cron reads cost less than
                # | per-request ones
                label: "A Cloudflare cobra cada fetch de saída, então leituras por cron custam menos que as por requisição"  # @src=fb0c796230a5
                # | The bill this design is dodging is not yours. The scarce resource is the
                # | shared public endpoint's 100-per-10-seconds cap, which strangers behind
                # | your IP spend alongside you, and the payoff is a degrade path: a refused
                # | refresh keeps serving the last snapshot instead of forwarding the
                # | refusal.
                feedback: "A conta que este design está desviando não é a sua. O recurso escasso é o teto de 100-por-10-segundos do endpoint público compartilhado, que estranhos atrás do seu IP gastam junto com você, e a recompensa é um caminho de degradação: um refresh recusado continua servindo o último snapshot em vez de encaminhar a recusa."  # @src=7a19ef5af3e4
              b:
                # | Per-request RPC calls spend the public caps on page views, cache and
                # | refresh on cron
                label: "Chamadas de RPC por requisição gastam os tetos públicos em visualizações de página, faça cache e refresh no cron"  # @src=98c788ed424c
                # | The caps are 100 requests per IP per 10 seconds on a resource the docs
                # | call unsuitable for production. Routing page views at it converts
                # | popularity into 429s for everyone behind that IP, while a cron-refreshed
                # | snapshot spends a fixed budget no matter how many people look.
                feedback: "Os tetos são 100 requisições por IP por 10 segundos num recurso que a documentação chama de inadequado para produção. Rotear visualizações de página para ele converte popularidade em 429s para todo mundo atrás daquele IP, enquanto um snapshot com refresh por cron gasta um orçamento fixo não importa quantas pessoas olhem."  # @src=cfb7bef08322
              a:
                # | Because kit cannot execute inside workerd, so cached values are the only
                # | option
                label: "Porque o kit não consegue executar dentro do workerd, então valores em cache são a única opção"  # @src=b6840ccb2428
                # | kit publishes a workerd export condition and the runtime provides its
                # | crypto, and even if the write-time smoke test forces the plain-fetch
                # | fallback, the caching argument stands on its own: it's about budgets,
                # | not capability.
                feedback: "o kit publica uma export condition workerd e o runtime fornece o crypto dele, e mesmo que o teste de fumaça de hora de escrita force o fallback de fetch pelado, o argumento do cache se sustenta sozinho: é sobre orçamentos, não sobre capacidade."  # @src=e66d51c0588e
          m08-l2-q4:
            # | solanakit.com's upgrade guide leads with the new createClient().use(...)
            # | plugin API. Should the panel be rewritten onto it today?
            prompt: "O guia de upgrade do solanakit.com lidera com a nova API de plugin createClient().use(...). O painel deveria ser reescrito em cima dela hoje?"  # @src=a4f8bd0fb73d
            # | The 'where kit is heading' box exists precisely for this: name the new API,
            # | date its maturity (the plugin packages version in lockstep with kit, 8.2.0
            # | at write time, so newness is the caution, not a 0.x digit), and keep the
            # | lab on the stable path, the dialect kit's own examples and generated
            # | clients speak today. Re-check when you next touch this code; when that
            # | canon moves to createClient(), the calculus changes.
            explanation: "A caixa 'para onde o kit está indo' existe precisamente para isto: nomear a API nova, datar a maturidade dela (os pacotes de plugin versionam em lockstep com o kit, 8.2.0 na hora de escrita, então o cuidado é a novidade, não um dígito 0.x), e manter o lab no caminho estável, o dialeto que os exemplos e os clientes gerados do próprio kit falam hoje. Reconfira da próxima vez que você tocar neste código; quando esse cânone se mover para createClient(), a matemática muda."  # @src=9e71dd10dd99
            options:                 # source order — keep it
              a:
                # | Yes, the docs lead with it, which means the pipe-style flow is already
                # | deprecated
                label: "Sim, a documentação lidera com ela, o que quer dizer que o fluxo em estilo pipe já está deprecado"  # @src=455bc7f48b0a
                # | Leading the upgrade guide signals direction, not deprecation, the pipe
                # | flow remains the documented, stable path and the one kit's own examples
                # | use. Docs-page ordering is marketing; what the ecosystem's shipped code
                # | speaks is evidence.
                feedback: "Liderar o guia de upgrade sinaliza direção, não depreciação, o fluxo pipe continua sendo o caminho documentado e estável e o que os exemplos do próprio kit usam. A ordenação da página de documentação é marketing; o que o código despachado do ecossistema fala é evidência."  # @src=7e186f2e4ba5
              c:
                # | Not yet, the plugin API is kit's newest; the pipe flow stays the taught
                # | canon
                label: "Ainda não, a API de plugin é a mais nova do kit; o fluxo pipe continua sendo o cânone ensinado"  # @src=fc75af44024c
                # | The plugin packages version in lockstep with kit, they read 8.2.0 at
                # | write time, the same digit as kit itself, so no 1.0 milestone exists to
                # | wait for. What dates the surface is newness: kit shipped two majors in
                # | just over nine weeks, and the plugin API is the youngest thing riding
                # | that pace. The pipe flow is the documented stable path that kit's own
                # | examples and generated clients speak, so what you wired is foundation.
                # | Re-run this calculus when that canon moves to createClient().
                feedback: "Os pacotes de plugin versionam em lockstep com o kit, eles liam 8.2.0 na hora de escrita, o mesmo dígito do próprio kit, então não existe marco de 1.0 para esperar. O que data a superfície é a novidade: o kit entregou dois majors em pouco mais de nove semanas, e a API de plugin é a coisa mais jovem montada nesse ritmo. O fluxo pipe é o caminho estável documentado que os exemplos e os clientes gerados do próprio kit falam, então o que você fiou é fundação. Rode esta matemática de novo quando esse cânone se mover para createClient()."  # @src=05dd3f225418
              d:
                # | Yes, an early rewrite usually costs less than a later forced migration
                # | under deadline
                label: "Sim, uma reescrita cedo em geral custa menos que uma migração forçada mais tarde sob prazo"  # @src=6655f0117d6e
                # | That trade only pays once the target stops moving, and nothing here
                # | forces the move: the pipe flow is not deprecated, it is the dialect
                # | kit's own examples and generated clients still speak. The plugin
                # | surface is the library's newest in an ecosystem that shipped two kit
                # | majors in just over nine weeks, so an early rewrite buys you the
                # | migration several times over instead of once.
                feedback: "Esse trade-off só paga depois que o alvo para de se mover, e nada aqui força o movimento: o fluxo pipe não está deprecado, ele é o dialeto que os exemplos e os clientes gerados do próprio kit ainda falam. A superfície de plugin é a mais nova da biblioteca num ecossistema que entregou dois majors do kit em pouco mais de nove semanas, então uma reescrita cedo te compra a migração várias vezes em vez de uma."  # @src=094702435a4d
              b:
                # | No, createClient() is a third-party wrapper, not part of kit itself
                label: "Não, createClient() é um wrapper de terceiros, não parte do kit em si"  # @src=308854d4374b
                # | It IS kit's own API, live on solanakit.com, the hesitation isn't
                # | provenance. It's maturity: the plugin packages backing it version in
                # | lockstep with kit itself (8.2.0 at write time), so no 0.x digit will
                # | ever flag them as young. Their age shows elsewhere: they are the
                # | library's newest surface, and the canon kit's examples and generated
                # | clients speak has not moved onto them.
                feedback: "Ela É a API do próprio kit, no ar em solanakit.com, a hesitação não é procedência. É maturidade: os pacotes de plugin que dão suporte a ela versionam em lockstep com o próprio kit (8.2.0 na hora de escrita), então nenhum dígito 0.x vai jamais sinalizar que eles são jovens. A idade deles aparece em outro lugar: eles são a superfície mais nova da biblioteca, e o cânone que os exemplos e os clientes gerados do kit falam ainda não se moveu para eles."  # @src=89598ec952f5
  m08-l3:
    # | The Rust path: raw JSON-RPC
    title: "O caminho do Rust: JSON-RPC cru"  # @src=60945f65b2b3
    blocks:
      rust-path-check:                      # quiz
        questions:
          m08-l3-q1:
            # | The TS surfaces use a client library; the Rust daemon POSTs raw JSON-RPC.
            # | Why does the course refuse to reach for the solana-client crate here?
            prompt: "As superfícies em TS usam uma biblioteca de cliente; o daemon em Rust faz POST de JSON-RPC cru. Por que o curso se recusa a pegar o crate solana-client aqui?"  # @src=bc5c4993d4c9
            # | The call this lesson makes: for a fundamentals reader, plain JSON-RPC over
            # | reqwest + serde_json reinforces the skills the course already built and
            # | carries zero Solana-crate churn. solana-client exists for full clients that
            # | submit transactions over QUIC to leaders, a different job. When reads
            # | outgrow this pattern, the typed path is solana-rpc-client and the granular
            # | crates in the go-deeper box.
            explanation: "A decisão que esta lição toma: para um leitor de fundamentos, JSON-RPC puro sobre reqwest + serde_json reforça as habilidades que o curso já construiu e carrega zero retrabalho de crate da Solana. O solana-client existe para clientes completos que submetem transações por QUIC aos líderes, um trabalho diferente. Quando as leituras crescem além deste padrão, o caminho tipado é o solana-rpc-client e os crates granulares na caixa de vá-mais-fundo."  # @src=79d4b19de336
            options:                 # source order — keep it
              b:
                # | solana-client is effectively unmaintained, so depending on it is a
                # | supply-chain liability
                label: "o solana-client está efetivamente sem manutenção, então depender dele é um passivo de cadeia de suprimentos"  # @src=bc47b02718c9
                # | It's actively maintained inside the mainline Solana Rust ecosystem,
                # | abandonment isn't the argument. The argument is fit: a
                # | transaction-submission transport stack is dead weight under a two-read
                # | poller.
                feedback: "Ele é mantido ativamente dentro do ecossistema Rust principal da Solana, abandono não é o argumento. O argumento é adequação: uma stack de transporte de submissão de transações é peso morto embaixo de um poller de duas leituras."  # @src=90a17e758371
              d:
                # | Rust has no canonical client crate of its own, so hand-rolling is the
                # | only path here
                label: "o Rust não tem crate de cliente canônico próprio, então escrever na mão é o único caminho aqui"  # @src=a7e5272df2ea
                # | There is a typed Rust path, and the lesson names it rather than hiding
                # | it: solana-rpc-client plus the granular solana-* crates, which is where
                # | reads graduate when they outgrow this pattern. Hand-rolling is a fit
                # | decision for a two-read poller, not a gap in the ecosystem.
                feedback: "Existe um caminho tipado em Rust, e a lição nomeia ele em vez de esconder: solana-rpc-client mais os crates solana-* granulares, que é para onde as leituras se formam quando crescem além deste padrão. Escrever na mão é uma decisão de adequação para um poller de duas leituras, não uma lacuna no ecossistema."  # @src=674851bc393a
              a:
                # | solana-client bundles a QUIC/TPU submission transport a two-read poller
                # | never calls
                label: "o solana-client empacota um transporte de submissão QUIC/TPU que um poller de duas leituras nunca chama"  # @src=e611c979bde3
                # | It is the kitchen-sink client: QUIC and UDP clients, the TPU client that
                # | talks straight to block leaders, connection caching, streamer machinery.
                # | That is the equipment of something firing transactions at validators,
                # | and you compile, audit and re-pin all of it to ask two questions on a
                # | timer.
                feedback: "Ele é o cliente pau-para-toda-obra: clientes QUIC e UDP, o cliente TPU que fala direto com os líderes de bloco, cache de conexão, maquinaria do streamer. Esse é o equipamento de algo que atira transações em validadores, e você compila, audita e refixa tudo isso para fazer duas perguntas num timer."  # @src=494d4ecf308b
              c:
                # | solana-client cannot perform reads at all, it exists only to submit
                # | transactions
                label: "o solana-client não consegue fazer leituras de jeito nenhum, ele existe só para submeter transações"  # @src=a8d79ba3db4d
                # | It reads fine, it's the kitchen-sink client precisely because it does
                # | everything. The point is what ELSE it drags in for a program that will
                # | only ever ask two questions.
                feedback: "Ele lê numa boa, ele é o cliente pau-para-toda-obra precisamente porque faz tudo. O ponto é o que MAIS ele arrasta para dentro para um programa que só vai fazer duas perguntas."  # @src=8a3ca8e1eec5
          m08-l3-q2:
            # | A teammate counters: 'solana-rpc-client has MORE direct dependencies than
            # | solana-client, your slim crate argument is backwards.' What's the honest
            # | reply?
            prompt: "Um colega de equipe contesta: 'o solana-rpc-client tem MAIS dependências diretas que o solana-client, o seu argumento de crate enxuto está invertido.' Qual é a resposta honesta?"  # @src=b04577802470
            # | The corrected research row exists for this exact exchange: solana-rpc-client
            # | has more direct deps by raw count, yet zero of the QUIC/TPU/streamer
            # | transport machinery. The defensible claim is scoped, 'no submission
            # | transport a reader never uses', and the meta-lesson is to argue from the
            # | axis that actually differentiates, because a learner who counts will catch
            # | you.
            explanation: "A linha de pesquisa corrigida existe para exatamente esta troca: o solana-rpc-client tem mais deps diretas na contagem crua, mas zero da maquinaria de transporte de QUIC/TPU/streamer. A afirmação defensável é escopada, 'nenhum transporte de submissão que um leitor nunca usa', e a meta-lição é argumentar a partir do eixo que de fato diferencia, porque um aprendiz que conta vai te pegar."  # @src=00d624fa9ded
            options:                 # source order — keep it
              a:
                # | They must be counting dev-dependencies; by normal deps solana-client is
                # | much larger
                label: "Ele deve estar contando dev-dependencies; nas deps normais o solana-client é muito maior"  # @src=b65ab186b0da
                # | No, by raw direct-dep count solana-rpc-client genuinely comes out ahead
                # | (light type-crates add up). Disputing their count loses; the count is
                # | real and it's the wrong axis.
                feedback: "Não, na contagem crua de deps diretas o solana-rpc-client realmente sai na frente (type-crates leves se somam). Disputar a contagem dele é perder; a contagem é real e é o eixo errado."  # @src=1f71a598c0fb
              b:
                # | They're right on the count, wrong on the axis, slimness means transport
                # | scope here
                label: "Ele está certo na contagem, errado no eixo, ser enxuto aqui quer dizer escopo de transporte"  # @src=a29ce047e1d8
                # | Concede the number, keep the conclusion: 29 direct deps against 35 is
                # | real, and neither figure touches what differentiates the two, which is
                # | that one carries QUIC, TPU and streamer machinery a reader never calls.
                # | Argue from the axis that separates them, because a learner who counts
                # | will check.
                feedback: "Conceda o número, mantenha a conclusão: 29 deps diretas contra 35 é real, e nenhuma das duas cifras toca no que diferencia os dois, que é que um carrega maquinaria de QUIC, TPU e streamer que um leitor nunca chama. Argumente a partir do eixo que separa eles, porque um aprendiz que conta vai conferir."  # @src=d18fe64a4e2f
              c:
                # | Dependency counts don't matter at all in Rust, since the compiler strips
                # | unused code
                label: "Contagens de dependência não importam nada em Rust, já que o compilador remove código não usado"  # @src=42f5ce1c74af
                # | Dead-code elimination doesn't erase the costs of a big tree, compile
                # | time, audit surface, and churn all scale with what you pull in. Counts
                # | matter; RAW counts just don't rank these two crates correctly.
                feedback: "Eliminação de código morto não apaga os custos de uma árvore grande, tempo de compilação, superfície de auditoria e retrabalho todos escalam com o que você puxa para dentro. Contagens importam; contagens CRUAS só não ordenam estes dois crates corretamente."  # @src=35c33a2c3c0a
              d:
                # | Concede the count and adopt solana-client, since its 29 direct deps beat
                # | the other 35
                label: "Conceda a contagem e adote o solana-client, já que as 29 deps diretas dele ganham das outras 35"  # @src=465bb159ff39
                # | Following the count where it leads is how a good number produces a bad
                # | decision. The 29-dep crate is the one carrying the submission transport
                # | stack, so conceding the axis hands you the heavier client for a job that
                # | makes two reads.
                feedback: "Seguir a contagem para onde ela leva é como um número bom produz uma decisão ruim. O crate de 29 deps é o que carrega a stack de transporte de submissão, então conceder o eixo te passa o cliente mais pesado para um trabalho que faz duas leituras."  # @src=e8b80ad1597c
          m08-l3-q3:
            # | Your balance probe deserializes cleanly, but a probe against a mistyped
            # | method name returns HTTP 200 and your poller marks the target healthy. What
            # | did you miss?
            prompt: "A sua sonda de balance desserializa limpo, mas uma sonda contra um nome de método digitado errado retorna HTTP 200 e o seu poller marca o alvo como saudável. O que você deixou passar?"  # @src=7f2fa89ebe35
            # | The transport layer succeeded, HTTP did its job delivering a well-formed
            # | reply that happens to say 'error' in JSON-RPC's own envelope. That's why the
            # | ProbeRpcError taxonomy gives the in-envelope error its own variant, distinct
            # | from transport and status failures: four different failure planes, four
            # | different remediations, one greppable name each when m09-l2's logging lands.
            explanation: "A camada de transporte teve sucesso, o HTTP fez o trabalho dele entregando uma resposta bem formada que por acaso diz 'error' no próprio envelope do JSON-RPC. É por isso que a taxonomia de ProbeRpcError dá ao erro dentro do envelope a própria variante dele, distinta das falhas de transport e de status: quatro planos de falha diferentes, quatro remediações diferentes, um nome grepável para cada um quando o logging do m09-l2 aterrissar."  # @src=a29ea5cedcf0
            options:                 # source order — keep it
              c:
                # | JSON-RPC reports failures inside a 200 response, you must check the
                # | envelope's error member
                label: "o JSON-RPC reporta falhas dentro de uma resposta 200, você precisa verificar o membro error do envelope"  # @src=d6e049bd2d7a
                # | Transport did its job: it delivered a well-formed reply whose body reads
                # | {"error":{"code":-32601,"message":"Method not found"}}. A probe that
                # | reads only response.status() marks that healthy forever, and a monitor
                # | that reports wrong is worse than no monitor, because people believe it.
                feedback: "O transporte fez o trabalho dele: entregou uma resposta bem formada cujo corpo diz {\"error\":{\"code\":-32601,\"message\":\"Method not found\"}}. Uma sonda que lê só response.status() marca isso como saudável para sempre, e um monitor que reporta errado é pior que nenhum monitor, porque as pessoas acreditam nele."  # @src=8ad658d1ffff
              a:
                # | A reqwest timeout, the request hung and the stale success from the
                # | previous tick leaked through
                label: "Um timeout do reqwest, o request ficou preso e o sucesso desatualizado do tique anterior vazou"  # @src=77e32d6ead6c
                # | A hang would surface as a slow or errored tick, not a clean 200. The
                # | response arrived promptly, the problem is what was INSIDE it.
                feedback: "Ficar preso apareceria como um tique lento ou com erro, não um 200 limpo. A resposta chegou na hora, o problema é o que estava DENTRO dela."  # @src=5c608878d16e
              b:
                # | The retry budget, a single attempt isn't enough to distinguish healthy
                # | from unhealthy
                label: "O orçamento de retry, uma tentativa só não é suficiente para distinguir saudável de não saudável"  # @src=f517f8a5fb5c
                # | No retry policy fixes this: every attempt would return the same
                # | misleading 200. The bug is in classification, not persistence.
                feedback: "Nenhuma política de retry conserta isso: toda tentativa retornaria o mesmo 200 enganoso. O bug está na classificação, não na persistência."  # @src=7ac3da681e5c
              d:
                # | The typo itself, a checked method-name constant would have prevented the
                # | call
                label: "O typo em si, uma constante de nome de método verificada teria evitado a chamada"  # @src=5e3e51f7eb59
                # | That patches one instance and leaves the hole open. An unhealthy node
                # | answers through the same error member with a perfectly spelled method,
                # | so the classification bug outlives every typo you eliminate. The
                # | envelope check is what makes plane three visible at all.
                feedback: "Isso remenda uma instância e deixa o buraco aberto. Um nó não saudável responde pelo mesmo membro error com um método escrito perfeitamente, então o bug de classificação sobrevive a todo typo que você eliminar. A verificação do envelope é o que torna o plano três visível."  # @src=ec72b4351862
          m08-l3-q4:
            # | You merged the chain-probe module and pushed. What turns that commit into
            # | the re-shipped station, and what did YOU have to do beyond the push?
            prompt: "Você fez merge do módulo de sonda da blockchain e deu push. O que transforma esse commit na estação depois do re-ship, e o que VOCÊ teve que fazer além do push?"  # @src=cfb319961542
            # | The re-ship IS the lesson's demonstration: the M6 pipeline, test, build
            # | multi-stage, push to GHCR, consumed the new probe module without a single
            # | ops change. Code that lands in an already-shipping system inherits its ship.
            # | Your only manual steps were the ones proving it worked: pull the fresh
            # | image, run it, curl /status.
            explanation: "O re-ship É a demonstração da lição: o pipeline do M6, testar, fazer build multi-stage, dar push para o GHCR, consumiu o módulo de sonda novo sem uma única mudança de ops. Código que aterrissa num sistema que já faz ship herda o ship dele. Os seus únicos passos manuais foram os que provaram que funcionou: dar pull na imagem nova, rodar ela, dar curl no /status."  # @src=067a7607edb8
            options:                 # source order — keep it
              c:
                # | You cut a GitHub Release so the workflow attaches a new binary, which
                # | GHCR then mirrors
                label: "Você cortou um GitHub Release para o workflow anexar um binário novo, que o GHCR depois espelha"  # @src=ca435e707799
                # | Releases-with-binaries was m05-l3's ship, a different artifact on a
                # | different path. GHCR images build from the container workflow on push,
                # | no release tag involved, and GHCR mirrors nothing.
                feedback: "Releases-com-binários foi o ship do m05-l3, um artefato diferente num caminho diferente. Imagens do GHCR fazem build a partir do workflow de contêiner no push, nenhuma tag de release envolvida, e o GHCR não espelha nada."  # @src=997cc103d982
              b:
                # | You rebuild with cargo --release and docker push from your own machine,
                # | as CI can't reach GHCR
                label: "Você faz o rebuild com cargo --release e docker push da sua própria máquina, já que o CI não alcança o GHCR"  # @src=1b751fc28395
                # | CI has been pushing to GHCR with GITHUB_TOKEN since m06-l4, that was the
                # | whole point of ship #3. Hand-pushing from a laptop would bypass the
                # | tests-gate and reintroduce works-on-my-machine.
                feedback: "O CI vem dando push para o GHCR com GITHUB_TOKEN desde m06-l4, esse era o ponto todo do ship #3. Dar push na mão de um laptop contornaria a trava de testes e reintroduziria o funciona-na-minha-máquina."  # @src=151c4f7bada9
              a:
                # | CI rebuilds and pushes the GHCR image from the same M6 pipeline, nothing
                # | new; you pull and run it
                label: "O CI faz o rebuild e dá push na imagem do GHCR pelo mesmo pipeline do M6, nada novo; você dá pull e roda ela"  # @src=176f986d46c1
                # | The workspace, the Dockerfile and the workflow are all untouched since
                # | m06-l4, so the commit inherits the ship it landed in. Your manual steps
                # | were the ones that prove it from outside: docker pull, docker run, curl
                # | /status, and read a live mainnet slot back.
                feedback: "O workspace, o Dockerfile e o workflow estão todos intocados desde m06-l4, então o commit herda o ship em que ele aterrissou. Os seus passos manuais foram os que provam isso de fora: docker pull, docker run, curl /status, e ler de volta um slot ao vivo da mainnet."  # @src=98d027d2587b
              d:
                # | The Dockerfile needed the new module in its copy list before CI could
                # | build the image
                label: "O Dockerfile precisava do módulo novo na lista de copy dele antes de o CI conseguir fazer o build da imagem"  # @src=fdb7901b6c88
                # | The cargo-chef multi-stage build copies the workspace, so a new module
                # | inside an existing crate is invisible to it. Check your own diff: the
                # | manifest gained one thiserror line and the ops files gained nothing,
                # | which is exactly the property the re-ship was staged to demonstrate.
                feedback: "O build multi-stage com cargo-chef copia o workspace, então um módulo novo dentro de um crate existente é invisível para ele. Confira o seu próprio diff: o manifest ganhou uma linha de thiserror e os arquivos de ops não ganharam nada, que é exatamente a propriedade que o re-ship foi montado para demonstrar."  # @src=9eb03df3987f
  m08-l4:
    # | The write path health check: one transfer
    title: "A checagem de saúde do caminho de escrita: uma transferência"  # @src=4c0090eaa029
    blocks:
      write-path-check:                      # quiz
        questions:
          m08-l4-q1:
            # | Monday the airdrop failed with a 429; Tuesday it failed with an internal
            # | error; Wednesday it worked. What does the lesson want you to build from that
            # | experience?
            prompt: "Segunda-feira o airdrop falhou com um 429; terça-feira ele falhou com um erro interno; quarta-feira funcionou. O que a lição quer que você construa a partir dessa experiência?"  # @src=bf106b85bb41
            # | The airdrop beat is a small production system in miniature: a best-effort
            # | external dependency with heterogeneous failures and a hard budget. The
            # | taught shape is generic failure handling plus backoff plus a fallback you've
            # | rehearsed, which is why the lesson makes everyone run the local validator
            # | once, before they need it in anger.
            explanation: "A batida do airdrop é um pequeno sistema de produção em miniatura: uma dependência externa best-effort com falhas heterogêneas e um orçamento rígido. A forma ensinada é tratamento de falhas genérico mais backoff mais um fallback que você ensaiou, que é por que a lição faz todo mundo rodar o validador local uma vez, antes de precisarem dele pra valer."  # @src=2fc70c39c042
            options:                 # source order — keep it
              c:
                # | A loop that retries immediately until success, since Wednesday proves it
                # | eventually works
                label: "Um loop que faz retry na hora até dar certo, já que quarta-feira prova que ele acaba funcionando"  # @src=36ecb3ed1feb
                # | The unauthenticated budget is 2 requests per 8 hours, a hot retry loop
                # | burns the whole allowance in seconds and guarantees the dry-faucet state
                # | it was trying to escape.
                feedback: "O orçamento sem autenticação é de 2 requisições por 8 horas, um loop de retry quente queima a cota inteira em segundos e garante o estado de faucet seco de que ele estava tentando escapar."  # @src=b86d094ea022
              b:
                # | A general fails-many-ways branch with backoff, plus the rehearsed
                # | local-validator fallback
                label: "Um ramo geral de falha-de-várias-formas com backoff, mais o fallback ensaiado do validador local"  # @src=2f26535ad981
                # | Three spaced attempts, a catch that reads any message rather than one
                # | code, and an error that hands the operator the exact fallback command.
                # | That is a best-effort dependency with a hard budget handled the way
                # | m02-l3 taught, and the fallback works because everyone ran it once
                # | already.
                feedback: "Três tentativas espaçadas, um catch que lê qualquer mensagem em vez de um código, e um erro que passa ao operador o comando de fallback exato. Isso é uma dependência best-effort com um orçamento rígido tratada do jeito que o m02-l3 ensinou, e o fallback funciona porque todo mundo já rodou ele uma vez."  # @src=2866a4390e6d
              d:
                # | Skip the faucet for the local validator, whose airdrops always land and
                # | never throttle
                label: "Pule o faucet e vá para o validador local, cujos airdrops sempre aterrissam e nunca fazem throttle"  # @src=099dd6cf8005
                # | That is the fallback, not a replacement. A private chain of one confirms
                # | everything you send, which is what makes it prove your code and nothing
                # | about the network between you and a public cluster. The lab keeps both
                # | targets for that reason: one script, two chains, two different
                # | questions.
                feedback: "Esse é o fallback, não uma substituição. Uma blockchain privada de um confirma tudo que você manda, que é o que faz ela provar o seu código e nada sobre a rede entre você e um cluster público. O lab mantém os dois alvos por essa razão: um script, duas blockchains, duas perguntas diferentes."  # @src=0f574d50e4bf
              a:
                # | A handler for the 429 specifically, since rate-limiting is the
                # | documented failure
                label: "Um handler para o 429 especificamente, já que o rate limiting é a falha documentada"  # @src=ef37196a75ed
                # | Same-day research probes hit BOTH a 429 and an internal error, neither
                # | is 'the' failure. Code that matches one specific error breaks on the
                # | other; the faucet's failure surface is heterogeneous by observation.
                feedback: "Sondas de pesquisa do mesmo dia bateram nos DOIS, um 429 e um erro interno, nenhum é 'a' falha. Código que casa com um erro específico quebra no outro; a superfície de falha do faucet é heterogênea por observação."  # @src=e0f880e73f4d
          m08-l4-q2:
            # | Why does tx-check sign with a throwaway file keypair instead of connecting
            # | the browser wallet you already own?
            prompt: "Por que o tx-check assina com um keypair descartável em arquivo em vez de conectar a carteira de navegador que você já tem?"  # @src=702e829a11dd
            # | The boundary is on purpose: this course teaches the write pipe, and
            # | wallet-standard, connection UX, and signing prompts are a client-side
            # | discipline of their own. A gitignored 32-byte throwaway holding worthless
            # | devnet SOL is the minimal signer that lets this lesson teach
            # | message-building, signing, and confirmation; wanting a real wallet is the
            # | signal you have reached that boundary, and the catalog's client-side course
            # | (in production) is where that depth lands.
            explanation: "A fronteira é de propósito: este curso ensina o pipe de escrita, e wallet-standard, UX de conexão, e prompts de assinatura são uma disciplina do lado do cliente por si só. Uma descartável de 32 bytes no gitignore segurando SOL de devnet sem valor é o signer mínimo que deixa esta lição ensinar construção de mensagem, assinatura e confirmação; querer uma carteira de verdade é o sinal de que você chegou naquela fronteira, e o curso do lado do cliente do catálogo (em produção) é onde essa profundidade aterrissa."  # @src=817c23ab5703
            options:                 # source order — keep it
              c:
                # | Wallet UX is deliberately out of this course's scope; a throwaway key
                # | keeps this about the pipe flow
                label: "UX de carteira está deliberadamente fora do escopo deste curso; uma chave descartável mantém isto sobre o fluxo do pipe"  # @src=8b4f5f2b1289
                # | Wallet-standard, connection UX and signing prompts are a client-side
                # | discipline of their own, and the catalog hands them to the course that
                # | teaches them properly. A file of 32 random bytes is the smallest signer
                # | that still produces the signatures mainnet validators verify.
                feedback: "Wallet-standard, UX de conexão e prompts de assinatura são uma disciplina do lado do cliente por si só, e o catálogo passa eles para o curso que ensina eles direito. Um arquivo de 32 bytes aleatórios é o menor signer que ainda produz as assinaturas que os validadores da mainnet verificam."  # @src=1a8508187ae2
              d:
                # | Devnet SOL is worthless, so a throwaway key puts wallet hygiene out of
                # | scope
                label: "O SOL de devnet não vale nada, então uma chave descartável põe higiene de carteira fora de escopo"  # @src=b2b99735025d
                # | The SOL is worthless and the hygiene still matters: .keys/ went into
                # | .gitignore before the seed existed, because a committed keypair is a
                # | leaked key forever and history does not forget. The habit is the
                # | transferable part, which is why the checkpoint gates on git status.
                feedback: "O SOL não vale nada e a higiene importa do mesmo jeito: .keys/ entrou no .gitignore antes de a seed existir, porque um keypair commitado é uma chave vazada para sempre e o histórico não esquece. O hábito é a parte transferível, que é por que o checkpoint trava no git status."  # @src=047c6dd099f6
              a:
                # | Browser wallets refuse devnet transactions, so a file keypair is the
                # | only signer that works
                label: "Carteiras de navegador recusam transações de devnet, então um keypair em arquivo é o único signer que funciona"  # @src=3fc8ab5dcab6
                # | Wallets handle devnet fine, most have a network switch. The exclusion
                # | isn't technical capability; it's a deliberate boundary in what this
                # | course teaches.
                feedback: "Carteiras lidam com a devnet numa boa, a maioria tem uma troca de rede. A exclusão não é capacidade técnica; é uma fronteira deliberada no que este curso ensina."  # @src=32cc6c699bca
              b:
                # | File keypairs produce stronger signatures than wallet-managed keys on
                # | devnet
                label: "Keypairs em arquivo produzem assinaturas mais fortes do que chaves geridas por carteira na devnet"  # @src=5d36e7ceca01
                # | The signature math is identical Ed25519 either way, where the key lives
                # | changes custody and UX, not cryptographic strength.
                feedback: "A matemática da assinatura é Ed25519 idêntica dos dois jeitos, onde a chave mora muda custódia e UX, não força criptográfica."  # @src=997a1bad46af
          m08-l4-q3:
            # | Your script builds the transaction message at startup, does other work for
            # | two minutes, then sends, and confirmation fails every time. What did the
            # | pipe flow's lifetime step already tell you?
            prompt: "O seu script constrói a mensagem de transação na subida, faz outro trabalho por dois minutos, depois manda, e a confirmação falha todas as vezes. O que o passo de lifetime do fluxo do pipe já tinha te dito?"  # @src=53fabc7b1aa8
            # | The lifetime step stamps the message with a recent blockhash, and the
            # | network only accepts it while that blockhash is still recent: 150 blocks,
            # | about 45 seconds at the chain's 300ms slot time. That's a feature: expired
            # | transactions die cleanly instead of landing hours later when you've given
            # | up. The practical rule the footgun states: fetch the blockhash inside the
            # | send path, not at script start.
            explanation: "O passo de lifetime carimba a mensagem com um blockhash recente, e a rede só aceita ela enquanto aquele blockhash ainda for recente: 150 blocos, cerca de 45 segundos no tempo de slot de 300ms da blockchain. Isso é uma feature: transações expiradas morrem de forma limpa em vez de aterrissar horas depois quando você já desistiu. A regra prática que o footgun declara: busque o blockhash dentro do caminho de envio, não no início do script."  # @src=0e353f2f8771
            options:                 # source order — keep it
              a:
                # | The blockhash lifetime is an expiry window, a stale blockhash means dead
                # | on arrival
                label: "O lifetime do blockhash é uma janela de expiração, um blockhash desatualizado quer dizer morto na chegada"  # @src=f9e8c85b230c
                # | The window is 150 blocks, about 45 seconds at the 300ms slot time you
                # | measured in m08-l1, and it exists so an unlanded transaction dies
                # | cleanly instead of executing hours later. Hence the rule: fetch the
                # | blockhash inside the send path, right before you build the message.
                feedback: "A janela é de 150 blocos, cerca de 45 segundos no tempo de slot de 300ms que você mediu no m08-l1, e ela existe para que uma transação que não aterrissou morra de forma limpa em vez de executar horas depois. Daí a regra: busque o blockhash dentro do caminho de envio, logo antes de você construir a mensagem."  # @src=e8c09b194b2f
              c:
                # | The fee payer's balance was spent by the airdrop retries during the
                # | two-minute gap
                label: "O saldo do fee payer foi gasto pelos retries de airdrop durante o intervalo de dois minutos"  # @src=05fa17cb2b1f
                # | Airdrops add funds rather than spend them, and a balance problem would
                # | fail differently (insufficient funds, not silent non-landing). The
                # | reproducible every-time failure after a fixed delay is the lifetime
                # | signature.
                feedback: "Airdrops adicionam fundos em vez de gastar eles, e um problema de saldo falharia de outro jeito (fundos insuficientes, não um não-aterrissar silencioso). A falha reproduzível de todas as vezes depois de um delay fixo é a assinatura do lifetime."  # @src=2d5e3f4bb02d
              d:
                # | Nothing: default-fee transactions just fail to land on a congested
                # | cluster
                label: "Nada: transações de taxa padrão simplesmente não conseguem aterrissar num cluster congestionado"  # @src=3e666c8c4fd7
                # | Congestion is a real way a default-fee transaction dies, and it is the
                # | wrong diagnosis here because congestion is weather: it would fail some
                # | runs and not others. A failure that reproduces after the same two-minute
                # | wait is a clock, and the lifetime step is the only clock in the pipe.
                feedback: "Congestionamento é um jeito real de uma transação de taxa padrão morrer, e é o diagnóstico errado aqui porque congestionamento é clima: ele faria algumas execuções falharem e outras não. Uma falha que se reproduz depois da mesma espera de dois minutos é um relógio, e o passo de lifetime é o único relógio no pipe."  # @src=cb2f3f3494c2
              b:
                # | Messages must be signed within one slot of creation, and two minutes is
                # | hundreds of slots
                label: "Mensagens têm que ser assinadas dentro de um slot da criação, e dois minutos são centenas de slots"  # @src=e71b41a8feb2
                # | There's no sign-within-a-slot rule, signing is local and unhurried. The
                # | clock that matters is the blockhash's validity window at SEND time,
                # | which is what expired here.
                feedback: "Não existe regra de assinar-dentro-de-um-slot, assinar é local e sem pressa. O relógio que importa é a janela de validade do blockhash na hora do ENVIO, que é o que expirou aqui."  # @src=a7cf98955480
      health-check-close:                      # quiz
        questions:
          m08-l4-q4:
            # | The station already had green reads on every surface. What does the
            # | confirmed tx-check signature prove that no read ever could?
            prompt: "A estação já tinha leituras verdes em toda superfície. O que a assinatura confirmada do tx-check prova que nenhuma leitura jamais conseguiria?"  # @src=334dc31b6fb5
            # | The frame this lesson opened with: a transaction is the probe that mutates.
            # | Every layer that reads share, connectivity, RPC health, plus every layer
            # | they don't: key validity, correct message construction, signature
            # | acceptance, network inclusion, confirmation. That's why tx-check is the
            # | station's deepest health check and why m10-l1's demo script calls it.
            explanation: "O enquadramento com que esta lição abriu: uma transação é a sonda que muta. Toda camada que as leituras dividem, conectividade, saúde do RPC, mais toda camada que elas não dividem: validade da chave, construção correta da mensagem, aceitação da assinatura, inclusão na rede, confirmação. É por isso que o tx-check é a checagem de saúde mais profunda da estação e por que o script de demo do m10-l1 chama ele."  # @src=ecfb1a37f004
            options:                 # source order — keep it
              b:
                # | That the full write path works: keys, message building, signing, and
                # | confirmation
                label: "Que o caminho de escrita completo funciona: chaves, construção de mensagem, assinatura e confirmação"  # @src=aa80138eb537
                # | Reads cover exactly two of the layers a write touches, connectivity and
                # | RPC health. Key validity, message construction, signature acceptance,
                # | inclusion and confirmation are invisible to any question you ask, and
                # | there is one way to see them: sign something real and watch it land.
                feedback: "Leituras cobrem exatamente duas das camadas que uma escrita toca, conectividade e saúde do RPC. Validade da chave, construção da mensagem, aceitação da assinatura, inclusão e confirmação são invisíveis para qualquer pergunta que você faça, e existe um jeito de ver elas: assine alguma coisa de verdade e veja ela aterrissar."  # @src=a98fe57a0f33
              d:
                # | That devnet's validators would accept the very same message if it were
                # | aimed at mainnet
                label: "Que os validadores da devnet aceitariam exatamente a mesma mensagem se ela mirasse a mainnet"  # @src=d8025e36f798
                # | A confirmation is scoped to the cluster that issued it. Devnet green
                # | proves your code and the network path to devnet; mainnet has its own
                # | congestion and its own fee market, which is where a default-fee
                # | transaction can simply fail to land.
                feedback: "Uma confirmação tem escopo do cluster que a emitiu. Verde na devnet prova o seu código e o caminho de rede até a devnet; a mainnet tem o congestionamento dela e o mercado de taxas dela, que é onde uma transação de taxa padrão pode simplesmente não conseguir aterrissar."  # @src=387c8b2fb79b
              a:
                # | That the RPC endpoint is reachable and answering requests from your
                # | network
                label: "Que o endpoint de RPC está alcançável e respondendo requisições da sua rede"  # @src=d11f16b82eb0
                # | Reads have proven reachability three lessons running, that's exactly the
                # | ceiling of what asking questions can show. The signature proves
                # | something happened to STATE.
                feedback: "Leituras provaram alcançabilidade por três lições seguidas, esse é exatamente o teto do que fazer perguntas consegue mostrar. A assinatura prova que alguma coisa aconteceu com o ESTADO."  # @src=9eff08b2cf49
              c:
                # | That your account will stay funded, since confirmation locks the balance
                # | in place
                label: "Que a sua conta vai continuar com fundos, já que a confirmação prende o saldo no lugar"  # @src=2fc444ded5b4
                # | Confirmation finalizes one transaction; it guarantees nothing about
                # | future balances or future writes. It's a point-in-time proof of the
                # | pathway, not a standing warranty.
                feedback: "A confirmação finaliza uma transação; ela não garante nada sobre saldos futuros ou escritas futuras. É uma prova pontual do caminho, não uma garantia permanente."  # @src=9225ac7fc678
          m08-l4-q5:
            # | The lesson makes EVERY learner run solana-test-validator once, even those
            # | whose devnet airdrop worked first try. Why?
            prompt: "A lição faz TODO aprendiz rodar o solana-test-validator uma vez, até os que tiveram o airdrop de devnet funcionando de primeira. Por quê?"  # @src=45af6803e3f4
            # | A fallback you've never exercised is a rumor, not a fallback, the same logic
            # | m09-l2 will apply to alarms. The faucet's 2-per-8h budget makes dry spells a
            # | WHEN, not an if, so the CLI install and one local-validator run are a
            # | numbered lab step for everyone. Side effect: every graduate owns a full
            # | local chain for everything they build next.
            explanation: "Um fallback que você nunca exercitou é um boato, não um fallback, a mesma lógica que o m09-l2 vai aplicar a alarmes. O orçamento de 2-por-8h do faucet faz de períodos secos um QUANDO, não um se, então o install da CLI e uma execução do validador local são um passo numerado de lab para todo mundo. Efeito colateral: todo formado é dono de uma blockchain local completa para tudo que ele construir em seguida."  # @src=3886a411777f
            options:                 # source order — keep it
              c:
                # | So the fallback is rehearsed before it's needed, a dry faucet can never
                # | hard-block the write path
                label: "Para que o fallback seja ensaiado antes de ser necessário, um faucet seco nunca consegue bloquear de vez o caminho de escrita"  # @src=0539b319d8c2
                # | A fallback nobody has run is a rumor. With a 2-per-8-hours budget the
                # | dry spell is a when, not an if, so the install and one local run are
                # | numbered lab steps for everyone, and the side effect is a full chain on
                # | localhost for every experiment after this one.
                feedback: "Um fallback que ninguém rodou é um boato. Com um orçamento de 2-por-8-horas o período seco é um quando, não um se, então o install e uma execução local são passos numerados de lab para todo mundo, e o efeito colateral é uma blockchain completa no localhost para todo experimento depois deste."  # @src=2df4bf10d98d
              d:
                # | Because a later Academy course might grade against a validator you run
                # | yourself
                label: "Porque um curso posterior da Academy pode avaliar contra um validador que você mesmo roda"  # @src=39a752e17c04
                # | The lesson rules that out by name: none of the Academy's on-chain
                # | courses demand this install, because they grade in hosted and in-process
                # | environments on purpose. The local validator is your own power tool, not
                # | a prerequisite anything downstream assumes.
                feedback: "A lição descarta isso pelo nome: nenhum dos cursos on-chain da Academy exige este install, porque eles avaliam em ambientes hospedados e in-process de propósito. O validador local é a sua própria ferramenta de força, não um pré-requisito que alguma coisa rio abaixo pressupõe."  # @src=22c01129ce22
              a:
                # | Because devnet is being phased out, so local validation is the
                # | forward-compatible path
                label: "Porque a devnet está sendo descontinuada, então a validação local é o caminho compatível com o futuro"  # @src=9a7eedbe6c24
                # | Devnet is alive and remains the lesson's primary target, the transfer
                # | that counts as SHIP #5 lands there when the faucet allows. The local
                # | chain is the rehearsed fallback, not the successor.
                feedback: "A devnet está viva e continua sendo o alvo primário da lição, a transferência que conta como SHIP #5 aterrissa lá quando o faucet permite. A blockchain local é o fallback ensaiado, não a sucessora."  # @src=b7b7dde62793
              b:
                # | Because local runs are the real test, and mainnet-bound code should
                # | always be validated locally first
                label: "Porque execuções locais são o teste de verdade, e código destinado à mainnet deve sempre ser validado localmente primeiro"  # @src=598f05457f16
                # | The lesson says nearly the opposite: local green proves your CODE, while
                # | the devnet run is the one that exercises the actual network path.
                # | Neither replaces the other; they answer different questions.
                feedback: "A lição diz quase o oposto: verde local prova o seu CÓDIGO, enquanto a execução de devnet é a que exercita o caminho de rede real. Nenhuma substitui a outra; elas respondem perguntas diferentes."  # @src=28882f52b41c
          m08-l4-q6:
            # | After the transfer confirms, the sender's balance dropped by slightly MORE
            # | than the amount sent. Where did the difference go?
            prompt: "Depois de a transferência confirmar, o saldo do remetente caiu um pouco MAIS do que o valor mandado. Para onde foi a diferença?"  # @src=ac0c3b7c8ffc
            # | Reads were free because they mutate nothing; this is the other side of that
            # | asymmetry, the fee payer (your throwaway key) pays for the write. The
            # | unguided challenge makes this exact observation mechanical: read both
            # | balances before and after and assert the delta is amount plus fee. Fee
            # | mechanics, priority fees, and why fees move are transaction-landing depth
            # | beyond this course's scope.
            explanation: "Leituras eram grátis porque não mutam nada; este é o outro lado dessa assimetria, o fee payer (a sua chave descartável) paga pela escrita. O challenge sem guia torna esta observação exata mecânica: leia os dois saldos antes e depois e afirme que o delta é valor mais taxa. Mecânica de taxas, priority fees, e por que as taxas se movem são profundidade de aterrissagem de transação além do escopo deste curso."  # @src=fbfc84e95d18
            options:                 # source order — keep it
              a:
                # | It's the transaction fee, writes pay to mutate state, and the fee payer
                # | shows it
                label: "É a taxa da transação, escritas pagam para mutar estado, e o fee payer mostra isso"  # @src=315afed1be01
                # | Reads were free because they mutate nothing, and this is the other side
                # | of that asymmetry: the account you named in step 2 of the pipe pays for
                # | the state change. The challenge makes it mechanical, read both balances
                # | around the send and assert the sender's delta is the amount plus a fee
                # | above zero.
                feedback: "Leituras eram grátis porque não mutam nada, e este é o outro lado dessa assimetria: a conta que você nomeou no passo 2 do pipe paga pela mudança de estado. O challenge torna isso mecânico, leia os dois saldos em volta do envio e afirme que o delta do remetente é o valor mais uma taxa acima de zero."  # @src=d0b307863f21
              c:
                # | It's rent charged to the sender to cover the recipient account's
                # | on-chain storage
                label: "É rent cobrado do remetente para cobrir o armazenamento on-chain da conta do destinatário"  # @src=cced757124dc
                # | Close to a real mechanism, wrong charge: account storage economics exist
                # | on Solana, but the sender's per-transaction cost here is the fee. The
                # | deeper account-model story belongs to btc-to-sol-evolution.
                feedback: "Perto de um mecanismo real, cobrança errada: a economia de armazenamento de contas existe na Solana, mas o custo por transação do remetente aqui é a taxa. A história mais profunda do modelo de contas pertence ao btc-to-sol-evolution."  # @src=7b5e2f69bdd0
              b:
                # | It's a rounding loss from your formatter converting lamports into SOL
                # | for the display
                label: "É uma perda de arredondamento do seu formatador convertendo lamports em SOL para a exibição"  # @src=a9fd1c076a6a
                # | Your own m08-l2 formatter is exact BigInt math, no display rounding
                # | exists to lose anything. The delta is on-chain and real, visible in raw
                # | lamports before any formatting.
                feedback: "O seu próprio formatador do m08-l2 é matemática BigInt exata, não existe arredondamento de exibição para perder nada. O delta é on-chain e real, visível em lamports crus antes de qualquer formatação."  # @src=d149cb09b17a
              d:
                # | A priority fee kit attached automatically so the transfer would land
                # | faster
                label: "Uma priority fee que o kit anexou automaticamente para que a transferência aterrissasse mais rápido"  # @src=dbb63834df9b
                # | Nothing in the pipe bids for position: the six calls are the floor on
                # | purpose, raw signer, default fees, no retry sophistication, and priority
                # | fees are named as landing craft this course hands off. What you measured
                # | is the base fee every write pays.
                feedback: "Nada no pipe dá lance por posição: as seis chamadas são o piso de propósito, signer cru, taxas padrão, nenhuma sofisticação de retry, e priority fees são nomeadas como ofício de aterrissagem que este curso repassa. O que você mediu é a taxa base que toda escrita paga."  # @src=d9e18e1af281
  m09-l1:
    # | Supply chain: the 86-minute attack
    title: "Cadeia de suprimentos: o ataque de 86 minutos"  # @src=2d0287ad0a95
    blocks:
      semver-vuln-matcher:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | String comparison walks characters: at '0.3.9' vs '0.3.10' it compares '9'
          # | against '1' and declares 0.3.9 the larger version. That single lie breaks
          # | every double-digit component.
          0: "Comparação de strings caminha por caracteres: em '0.3.9' vs '0.3.10' ela compara '9' contra '1' e declara 0.3.9 a versão maior. Essa única mentira quebra todo componente de dois dígitos."  # @src=1d96cd7bcd12
          # | Split each version on '.', map the pieces through Number, then compare major,
          # | minor, patch in order, return -1/0/1 at the first difference.
          1: "Faça split de cada versão em '.', mapeie as peças por Number, depois compare major, minor, patch em ordem, e retorne -1/0/1 na primeira diferença."  # @src=7813e64d498e
          # | Treat a missing component as 0 (compare up to three components with `parts[i]
          # | ?? 0`) so short versions still compare cleanly.
          2: "Trate um componente faltante como 0 (compare até três componentes com `parts[i] ?? 0`) para que versões curtas ainda comparem de forma limpa."  # @src=b378e47b7589
        tests:                      # keyed by test case id
          t1:
            # | the exercise range borrows the incident's digits: the malicious 0.3.10 sits
            # | inside >=0.3.0 <0.3.11
            description: "a faixa de exercício pega emprestado os dígitos do incidente: a 0.3.10 maliciosa fica dentro de >=0.3.0 <0.3.11"  # @src=f8eea135d8ce
          t2:
            # | double-digit patch vs single-digit, where string comparison lies: 0.3.9 is
            # | inside >=0.3.0 <0.3.11
            description: "patch de dois dígitos vs de um dígito, onde a comparação de strings mente: 0.3.9 está dentro de >=0.3.0 <0.3.11"  # @src=683b32080101
          t3:
            # | 0.3.11 is OUTSIDE the range (exercise framing; the real incident yanked
            # | 0.3.10 rather than shipping a fix)
            description: "0.3.11 está FORA da faixa (enquadramento de exercício; o incidente de verdade deu yank em 0.3.10 em vez de entregar um conserto)"  # @src=ac3c36a8d92f
          t4:
            # | numeric beats lexicographic: 0.3.2 IS below 0.3.10 (string compare says it
            # | isn't)
            description: "numérico ganha de lexicográfico: 0.3.2 ESTÁ abaixo de 0.3.10 (a comparação de strings diz que não)"  # @src=e1e7f3163d22
          t5:
            # | double-digit minor component: 1.10.0 satisfies >=1.9.0
            description: "componente minor de dois dígitos: 1.10.0 satisfaz >=1.9.0"  # @src=53d77284486a
          t6:
            # | exact-match comparator: =2.0.20 matches 2.0.20
            description: "comparador de correspondência exata: =2.0.20 casa com 2.0.20"  # @src=904567fe296b
          t7:
            # | exact-match comparator rejects a near miss
            description: "comparador de correspondência exata rejeita um quase-acerto"  # @src=4573406fb945
      supply-chain-check:                      # quiz
        questions:
          m09-l1-q1:
            # | npm audit flags a high-severity advisory that reaches your tree only as a
            # | devDependency of the dashboard build tooling. What is the right first move?
            prompt: "O npm audit sinaliza um advisory de severidade alta que chega à sua árvore só como devDependency do tooling de build do painel. Qual é a primeira jogada certa?"  # @src=c163177d008d
            # | An audit report is a reading exercise before it is a patching exercise.
            # | Severity describes the bug; the dependency path describes YOUR exposure,
            # | runtime path, build-time path, and dev-only path are three different
            # | decisions. That reading is exactly what the written verdict captures.
            explanation: "Um relatório de auditoria é um exercício de leitura antes de ser um exercício de aplicar patch. A severidade descreve o bug; o caminho de dependência descreve a SUA exposição, e caminho de runtime, caminho de build-time e caminho dev-only são três decisões diferentes. Essa leitura é exatamente o que o veredito escrito captura."  # @src=73dc9002a862
            options:                 # source order — keep it
              c:
                # | Read the advisory's range, patch, and dependency path first, the path
                # | shows whether the exposure is runtime or build-time
                label: "Leia primeiro a faixa, o patch e o caminho de dependência do advisory, o caminho mostra se a exposição é de runtime ou de build-time"  # @src=caf243056981
                # | Severity rates the bug as if every user ran it in the worst position;
                # | the path rates you. Id, range, patched version, path, and only then
                # | severity is the reading order, and pnpm why or cargo tree -i answers the
                # | path question in ten seconds.
                feedback: "A severidade avalia o bug como se todo usuário rodasse ele na pior posição; o caminho avalia você. Id, faixa, versão corrigida, caminho, e só então severidade é a ordem de leitura, e pnpm why ou cargo tree -i responde a pergunta do caminho em dez segundos."  # @src=52ae213ebd40
              b:
                # | Run npm audit fix immediately, high severity means a confirmed exploit
                # | against your app, so patching outranks reading
                label: "Rode npm audit fix imediatamente, severidade alta quer dizer um exploit confirmado contra o seu app, então aplicar patch supera ler"  # @src=42ef026b9284
                # | Severity rates the vulnerability in the abstract, not your exposure, and
                # | audit fix can propose semver-major rewrites of your tree. Read the
                # | advisory and the path first; act second.
                feedback: "A severidade avalia a vulnerabilidade no abstrato, não a sua exposição, e o audit fix pode propor reescritas de major de semver na sua árvore. Leia o advisory e o caminho primeiro; aja depois."  # @src=14037ebcfb5a
              a:
                # | Take the Vercel deployment down, a high-severity advisory anywhere in
                # | the tree means the shipped bundle is compromised
                label: "Derrube o deploy no Vercel, um advisory de severidade alta em qualquer lugar da árvore quer dizer que o bundle entregue está comprometido"  # @src=b572e9b92899
                # | The dependency path is the exposure map: a build-time dev dependency
                # | does not ship in the production bundle. Build tooling can still matter
                # | (it runs on your machine and in CI), but the response is assessment, not
                # | an outage.
                feedback: "O caminho de dependência é o mapa de exposição: uma dependência de dev de build-time não é entregue no bundle de produção. Tooling de build ainda pode importar (ele roda na sua máquina e na CI), mas a resposta é avaliação, não uma queda."  # @src=dac69e65ed85
              d:
                # | Mark it accept-risk without tracing the path, since a build-time
                # | advisory never reaches runtime exposure
                label: "Marque como accept-risk sem rastrear o caminho, já que um advisory de build-time nunca alcança exposição de runtime"  # @src=7242082c5460
                # | Build tooling runs on your laptop and in CI, which is exactly where the
                # | arrayref payload was aimed: a build script that executed at compile time
                # | on every machine that resolved the tree. Dev-only lowers the temperature
                # | and does not end the reading.
                feedback: "Tooling de build roda no seu laptop e na CI, que é exatamente para onde o payload do arrayref foi mirado: um build script que executava em tempo de compilação em toda máquina que resolvesse a árvore. Dev-only baixa a temperatura e não encerra a leitura."  # @src=aa55768d5b9f
          m09-l1-q2:
            # | cargo audit comes back clean on your workspace, but one crate in your
            # | lockfile has a README that says it is unmaintained and its last publish was
            # | three years ago. What did the clean report actually tell you?
            prompt: "O cargo audit volta limpo no seu workspace, mas um crate no seu lockfile tem um README que diz que ele está sem manutenção e a última publicação dele foi há três anos. O que o relatório limpo de fato te disse?"  # @src=aa2a4a9e68e8
            # | The tool and the checklist cover each other's blind spots: cargo audit
            # | catches what the community has filed, and the abandonment checklist (README
            # | notices, last-publish, cadence, ecosystem pins) catches the crates nobody is
            # | watching anymore. A clean audit plus a dead README is precisely the case
            # | where the written verdict earns its keep.
            explanation: "A ferramenta e a checklist cobrem os pontos cegos uma da outra: o cargo audit pega o que a comunidade reportou, e a checklist de abandono (avisos no README, última publicação, cadência, pins do ecossistema) pega os crates que ninguém está mais vigiando. Uma auditoria limpa mais um README morto é precisamente o caso em que o veredito escrito se paga."  # @src=1c561ee1b479
            options:                 # source order — keep it
              d:
                # | That three quiet years are evidence of stability, since a crate with
                # | real problems would have collected an advisory long before now
                label: "Que três anos quietos são evidência de estabilidade, já que um crate com problemas de verdade teria colecionado um advisory muito antes disso"  # @src=478f09c85b3f
                # | That inference needs someone to have been looking. Advisories get filed
                # | by people reading the code and running the tools against it, so a crate
                # | with no users and no maintainer produces the same clean report whether
                # | it is solid or quietly broken.
                feedback: "Essa inferência precisa de alguém tendo olhado. Advisories são reportados por gente lendo o código e rodando as ferramentas contra ele, então um crate sem usuários e sem mantenedor produz o mesmo relatório limpo seja ele sólido ou quebrado em silêncio."  # @src=cafd4f6a780d
              a:
                # | Only that no KNOWN advisory matches your lockfile, an unwatched crate
                # | can be silently vulnerable, so the checklist still applies
                label: "Só que nenhum advisory CONHECIDO casa com o seu lockfile, um crate sem ninguém vigiando pode estar vulnerável em silêncio, então a checklist continua valendo"  # @src=207e7a0dc758
                # | The database holds what someone found, verified and filed, so a crate
                # | nobody is watching accumulates silence rather than safety. That is
                # | precisely the gap the five abandonment reads cover, and why a clean
                # | report plus a dead README is the case where a written verdict earns its
                # | keep.
                feedback: "O banco guarda o que alguém achou, verificou e reportou, então um crate que ninguém está vigiando acumula silêncio em vez de segurança. Essa é precisamente a lacuna que as cinco leituras de abandono cobrem, e por que um relatório limpo mais um README morto é o caso em que um veredito escrito se paga."  # @src=156d6ab61cff
              b:
                # | That the crate is safe, the advisory database is comprehensive, so no
                # | advisory means no vulnerability exists in any locked version
                label: "Que o crate está seguro, o banco de advisories é abrangente, então nenhum advisory quer dizer que nenhuma vulnerabilidade existe em nenhuma versão fixada no lock"  # @src=e935726a2f4b
                # | Advisory databases contain what someone found AND filed. An abandoned
                # | crate with no users looking at it accumulates silence, not safety,
                # | absence of an advisory is absence of evidence.
                feedback: "Bancos de advisories contêm o que alguém achou E reportou. Um crate abandonado sem usuários olhando para ele acumula silêncio, não segurança, ausência de um advisory é ausência de evidência."  # @src=73eec199b65e
              c:
                # | Nothing about that crate, cargo audit typically skips unmaintained
                # | crates because they are dropped from the advisory index
                label: "Nada sobre aquele crate, o cargo audit tipicamente pula crates sem manutenção porque eles são tirados do índice de advisories"  # @src=39cf3f4f716e
                # | cargo audit checks every crate in Cargo.lock against the advisory
                # | database; nothing is skipped for being unmaintained. The gap is in what
                # | the database knows, not in what the tool scans.
                feedback: "O cargo audit checa todo crate no Cargo.lock contra o banco de advisories; nada é pulado por estar sem manutenção. A lacuna está no que o banco sabe, não no que a ferramenta escaneia."  # @src=68338b43707b
          m09-l1-q3:
            # | An npm-locked service you have inherited (not your pnpm-workspace station)
            # | says "^1.4.0" for a dependency in its package.json, package-lock.json
            # | resolved it to 1.4.2, and a malicious 1.4.3 was published this morning. Its
            # | CI installs with npm ci. Is tonight's build compromised?
            prompt: "Um serviço com lock de npm que você herdou (não a sua estação de workspace pnpm) diz \"^1.4.0\" para uma dependência no package.json dele, o package-lock.json resolveu para 1.4.2, e um 1.4.3 malicioso foi publicado hoje de manhã. A CI dele instala com npm ci. O build de hoje à noite está comprometido?"  # @src=1a7168fac4b2
            # | This is lockfile-as-the-real-pin: the manifest range expresses intent, the
            # | lockfile records a resolution, and `npm ci` (like `cargo build --locked`)
            # | enforces the recorded resolution byte for byte. The dangerous moment is not
            # | the malicious publish, it is the next time someone regenerates the lock
            # | while the malicious version is live.
            explanation: "Isto é o lockfile-como-o-pin-de-verdade: a faixa do manifest expressa intenção, o lockfile registra uma resolução, e `npm ci` (como `cargo build --locked`) impõe a resolução registrada byte a byte. O momento perigoso não é a publicação maliciosa, é a próxima vez que alguém regenera o lock enquanto a versão maliciosa está no ar."  # @src=25412d03c68a
            options:                 # source order — keep it
              a:
                # | Yes, the caret range means every install resolves forward, so CI pulls
                # | 1.4.3 the moment it exists
                label: "Sim, a faixa de caret quer dizer que todo install resolve para a frente, então a CI puxa 1.4.3 no momento em que ele existir"  # @src=2906e2708999
                # | That is how a bare `npm install` with no lockfile behaves. `npm ci`
                # | installs exactly what the lockfile recorded, 1.4.2, regardless of what
                # | the range would now resolve to.
                feedback: "É assim que um `npm install` pelado sem lockfile se comporta. `npm ci` instala exatamente o que o lockfile registrou, 1.4.2, independente do que a faixa resolveria agora."  # @src=66c51bc680e3
              b:
                # | No, npm ci installs the lockfile's exact 1.4.2; you become exposed only
                # | when the lockfile is regenerated or updated
                label: "Não, npm ci instala o 1.4.2 exato do lockfile; você só fica exposto quando o lockfile é regenerado ou atualizado"  # @src=c386092ece5a
                # | The manifest range states intent, the lockfile records a resolution, and
                # | npm ci reproduces the recorded one byte for byte. So the dangerous
                # | moment is not the publish, it is the next refresh-the-deps commit made
                # | while 1.4.3 is still live.
                feedback: "A faixa do manifest declara intenção, o lockfile registra uma resolução, e npm ci reproduz a registrada byte a byte. Então o momento perigoso não é a publicação, é o próximo commit de atualizar-as-deps feito enquanto 1.4.3 ainda está no ar."  # @src=65e4507533d9
              d:
                # | No, the caret in ^1.4.0 pins the patch digit, so 1.4.3 sits outside the
                # | range npm would ever resolve here
                label: "Não, o caret em ^1.4.0 fixa o dígito de patch, então 1.4.3 fica fora da faixa que o npm algum dia resolveria aqui"  # @src=4c202c15c0e0
                # | Right verdict tonight, wrong mechanism, and the mechanism is what you
                # | need tomorrow: a caret accepts every compatible release below the next
                # | major, 1.4.3 included. If it excluded 1.4.3, regenerating the lockfile
                # | would be safe, and the whole point of the worked example is that it is
                # | not.
                feedback: "Veredito certo hoje à noite, mecanismo errado, e o mecanismo é do que você precisa amanhã: um caret aceita todo release compatível abaixo do próximo major, 1.4.3 incluído. Se ele excluísse 1.4.3, regenerar o lockfile seria seguro, e o ponto inteiro do exemplo trabalhado é que não é."  # @src=5da91313e97a
              c:
                # | Yes, unless you first rewrite the manifest to the exact pin "1.4.2",
                # | ranges in package.json override the lockfile during CI installs
                label: "Sim, a não ser que você primeiro reescreva o manifest para o pin exato \"1.4.2\", faixas no package.json sobrepõem o lockfile durante installs de CI"  # @src=1ce81b5242fe
                # | It is the other way around under npm ci: the lockfile IS the install
                # | plan, and the manifest range only matters when the lock is re-resolved.
                # | The lockfile is the real pin, as long as CI installs from it.
                feedback: "É o contrário sob npm ci: o lockfile É o plano de install, e a faixa do manifest só importa quando o lock é re-resolvido. O lockfile é o pin de verdade, contanto que a CI instale a partir dele."  # @src=d2943202ca15
          m09-l1-q4:
            # | During the 86 minutes arrayref@0.3.10 was live, which builds could actually
            # | have pulled the malicious version?
            prompt: "Durante os 86 minutos em que arrayref@0.3.10 esteve no ar, quais builds poderiam de fato ter puxado a versão maliciosa?"  # @src=d4cad2dc8034
            # | The 86-minute window is the range mechanism working exactly as designed: SPL
            # | Token's `arrayref = "0.3.9"` is a compatible-range requirement, so any
            # | resolution performed while 0.3.10 was live would take it, while every
            # | committed Cargo.lock held the line at its recorded version. Ranges auto-heal
            # | AND auto-ingest; the lockfile decides which one you experience.
            explanation: "A janela de 86 minutos é o mecanismo de faixas funcionando exatamente como foi projetado: o `arrayref = \"0.3.9\"` do SPL Token é um requisito de faixa compatível, então qualquer resolução feita enquanto 0.3.10 estava no ar pegaria ele, enquanto todo Cargo.lock commitado segurou a linha na versão registrada nele. Faixas se autocuram E autoingerem; o lockfile decide qual das duas você vive."  # @src=9e644eae98e2
            options:                 # source order — keep it
              b:
                # | Only projects whose Cargo.toml explicitly requested "0.3.10", since
                # | everyone else's version requirement excluded the new release
                label: "Só projetos cujo Cargo.toml pediu \"0.3.10\" explicitamente, já que o requisito de versão de todo mundo mais excluía o release novo"  # @src=1c17263c8592
                # | Cargo's bare "0.3.9" is caret semantics: it means ^0.3.9 and happily
                # | accepts 0.3.10. Nobody had to ask for the malicious version by name,
                # | default ranges resolve forward to it.
                feedback: "O \"0.3.9\" pelado do Cargo é semântica de caret: quer dizer ^0.3.9 e aceita 0.3.10 com todo prazer. Ninguém precisou pedir a versão maliciosa pelo nome, faixas padrão resolvem para a frente até ela."  # @src=451c6c2b5712
              d:
                # | Just the CI jobs, since a developer's local registry cache would have
                # | kept serving the copy of arrayref it already had locally
                label: "Só os jobs de CI, já que o cache local de registro de um desenvolvedor teria continuado servindo a cópia de arrayref que ele já tinha localmente"  # @src=9cf063e48198
                # | The cache answers for versions you already fetched, and a fresh
                # | resolution asks for a version you have not. The lesson lists the exposed
                # | acts on both sides of the wire, a new clone and a cargo update among
                # | them, which is a laptop as often as a runner.
                feedback: "O cache responde por versões que você já buscou, e uma resolução fresca pede uma versão que você não buscou. A lição lista os atos expostos dos dois lados do fio, um clone novo e um cargo update entre eles, o que é um laptop com a mesma frequência que um runner."  # @src=ec9ec02c2db9
              c:
                # | Any fresh resolution during the window whose range accepted 0.3.x,
                # | Cargo's bare "0.3.9" means ^0.3.9, which accepts 0.3.10
                label: "Qualquer resolução fresca durante a janela cuja faixa aceitasse 0.3.x, o \"0.3.9\" pelado do Cargo quer dizer ^0.3.9, que aceita 0.3.10"  # @src=e80099079532
                # | A new clone, a CI job with no committed lockfile, a cargo update: three
                # | ways to ask the registry a fresh question inside those 86 minutes.
                # | Nobody had to name the malicious version, the range said yes on their
                # | behalf, which is the deal semver ranges have always offered.
                feedback: "Um clone novo, um job de CI sem lockfile commitado, um cargo update: três jeitos de fazer ao registro uma pergunta fresca dentro daqueles 86 minutos. Ninguém precisou nomear a versão maliciosa, a faixa disse sim em nome deles, que é o acordo que faixas de semver sempre ofereceram."  # @src=b505207f2d73
              a:
                # | Every project depending on arrayref at any version, a malicious publish
                # | retroactively infects existing lockfiles and cached builds
                label: "Todo projeto que dependia de arrayref em qualquer versão, uma publicação maliciosa infecta retroativamente lockfiles existentes e builds em cache"  # @src=3f6389546285
                # | A publish cannot rewrite history: committed lockfiles kept resolving
                # | 0.3.9 and earlier, and existing builds were untouched. The exposure was
                # | in fresh resolutions during the window, not in what was already locked.
                feedback: "Uma publicação não consegue reescrever a história: lockfiles commitados continuaram resolvendo 0.3.9 e anteriores, e builds existentes ficaram intocados. A exposição estava em resoluções frescas durante a janela, não no que já estava fixado no lock."  # @src=43298f1748b4
  m09-l2:
    # | Observe the observer: logs, errors, alarms
    title: "Observe o observador: logs, erros, alarmes"  # @src=8b7b80425470
    blocks:
      logs-that-answer:                      # quiz
        questions:
          m09-l2-q1:
            # | At 3 a.m. you need to answer: 'when did the api target last flip from up to
            # | degraded?' Which logging style answers that with a single grep?
            prompt: "Às 3 da manhã você precisa responder: 'quando foi a última vez que o alvo api virou de up para degraded?' Qual estilo de logging responde isso com um único grep?"  # @src=7ba9b8880f0a
            # | Structured logging means the QUESTION shapes the schema: a state change is
            # | an event with a target, a from, a to, and a timestamp, so `grep
            # | '"event":"state_change"'` plus the target name IS the incident query. Printf
            # | noise optimizes for reading; boundary events optimize for asking.
            explanation: "Logging estruturado quer dizer que a PERGUNTA molda o schema: uma mudança de estado é um evento com um target, um from, um to e um timestamp, então `grep '\"event\":\"state_change\"'` mais o nome do alvo É a consulta de incidente. Ruído de printf otimiza para leitura; eventos de fronteira otimizam para perguntar."  # @src=b08d45e57934
            options:                 # source order — keep it
              c:
                # | A line for every loop iteration with full state dumps, so any question
                # | is answerable because nothing was left out
                label: "Uma linha para toda iteração de loop com dumps completos de estado, então qualquer pergunta é respondível porque nada ficou de fora"  # @src=789972a3fad8
                # | Volume is not answerability, per-iteration dumps bury the one flip you
                # | need under thousands of identical lines, and on the worker side they
                # | torch the daily event budget. Log events, not iterations.
                feedback: "Volume não é capacidade de responder, dumps por iteração enterram a única virada de que você precisa embaixo de milhares de linhas idênticas, e do lado do worker eles torram o orçamento diário de eventos. Logue eventos, não iterações."  # @src=ec4c2ece4bfc
              b:
                # | A human-readable message like 'probe had a problem, retrying soon'
                # | printed wherever an error is caught, so the story reads naturally top to
                # | bottom
                label: "Uma mensagem legível por humanos como 'probe had a problem, retrying soon' impressa onde quer que um erro seja capturado, então a história lê naturalmente de cima a baixo"  # @src=e4a23959b358
                # | Readable prose is for humans reading in order; incidents are answered by
                # | machines filtering at 3 a.m. Without named fields there is nothing for
                # | grep to anchor on, 'a problem' matches everything and answers nothing.
                feedback: "Prosa legível é para humanos lendo em ordem; incidentes são respondidos por máquinas filtrando às 3 da manhã. Sem campos nomeados não existe nada para o grep ancorar, 'um problema' casa com tudo e não responde nada."  # @src=ad9ba3b4d2f9
              a:
                # | One JSON line per state change with named fields, event, target, from,
                # | to, and a timestamp, emitted at the boundary where the flip happens
                label: "Uma linha JSON por mudança de estado com campos nomeados, event, target, from, to e um timestamp, emitida na fronteira onde a virada acontece"  # @src=3a7f3fbce86e
                # | The question shapes the schema: because from and to are named fields,
                # | grep '"event":"state_change"' piped through the target name IS the
                # | incident query, and the ts on the hit is the answer. No dashboard, no
                # | ssh, thirty seconds.
                feedback: "A pergunta molda o schema: porque from e to são campos nomeados, grep '\"event\":\"state_change\"' passado pelo nome do alvo É a consulta de incidente, e o ts no hit é a resposta. Sem painel, sem ssh, trinta segundos."  # @src=205b83a26bda
              d:
                # | One JSON line per /status request listing each target's current state,
                # | so a flip to degraded shows on the next read
                label: "Uma linha JSON por request de /status listando o estado atual de cada alvo, então uma virada para degraded aparece na próxima leitura"  # @src=92eca8d65254
                # | That logs the reader, not the event. Nobody calls /status at 3 a.m., so
                # | the flip that happened at 3:04 is recorded whenever someone next looks,
                # | with the wrong timestamp and no from value. A boundary event fires where
                # | the change happens, unattended.
                feedback: "Isso loga o leitor, não o evento. Ninguém chama /status às 3 da manhã, então a virada que aconteceu às 3:04 é registrada quando alguém olhar da próxima vez, com o timestamp errado e sem valor de from. Um evento de fronteira dispara onde a mudança acontece, sem ninguém por perto."  # @src=32d5ceb048f5
          m09-l2-q2:
            # | Users report the dashboard's functions erroring on Saturday morning. You
            # | open Vercel's runtime logs on Monday. What do you find, and what is the
            # | taught response?
            prompt: "Usuários reportam que as funções do painel estão dando erro na manhã de sábado. Você abre os logs de runtime do Vercel na segunda. O que você encontra, e qual é a resposta ensinada?"  # @src=0e1962393243
            # | Ephemerality is taught as a constraint: free-tier platform logs are for
            # | tailing an incident as it happens, not for archaeology. Anything the station
            # | must remember, statuses, flips, history, already persists in status.json and
            # | KV by design. Persist the signal, tail the noise.
            explanation: "Efemeridade é ensinada como uma restrição: logs de plataforma de tier gratuito são para dar tail num incidente enquanto ele acontece, não para arqueologia. Tudo o que a estação precisa lembrar, status, viradas, histórico, já persiste em status.json e no KV por design. Persista o sinal, dê tail no ruído."  # @src=28260b5ed781
            options:                 # source order — keep it
              a:
                # | The whole weekend of logs, runtime logs are typically kept for the
                # | lifetime of the deployment, so Saturday's errors are all still there
                label: "O fim de semana inteiro de logs, logs de runtime são tipicamente guardados pelo tempo de vida do deploy, então os erros de sábado continuam todos lá"  # @src=8e3c080b5422
                # | Hobby runtime logs retain roughly an hour, not a deployment lifetime. By
                # | Monday, Saturday's evidence is long gone, which is a design constraint
                # | to build around, not a bug to be surprised by.
                feedback: "Logs de runtime no Hobby retêm mais ou menos uma hora, não um tempo de vida de deploy. Na segunda, a evidência de sábado sumiu faz tempo, o que é uma restrição de design para construir em torno dela, não um bug para te surpreender."  # @src=53bfad4ea2a1
              b:
                # | Roughly nothing, Hobby runtime logs retain about an hour; persist the
                # | signal and treat platform logs as live-tail forensics
                label: "Mais ou menos nada, logs de runtime no Hobby retêm cerca de uma hora; persista o sinal e trate logs de plataforma como análise forense de tail ao vivo"  # @src=253a7d06bf6d
                # | Free-tier platform logs are for tailing an incident while it happens,
                # | not for archaeology two days later. Anything the station must remember
                # | was already persisted on purpose, statuses and flips in status.json and
                # | KV, which is where Monday's questions get answered.
                feedback: "Logs de plataforma de tier gratuito são para dar tail num incidente enquanto ele acontece, não para arqueologia dois dias depois. Tudo o que a estação precisa lembrar já foi persistido de propósito, status e viradas em status.json e no KV, que é onde as perguntas de segunda são respondidas."  # @src=38359f59e44f
              c:
                # | Only the failed invocations, error logs are retained indefinitely while
                # | successful request logs rotate out after an hour
                label: "Só as invocações que falharam, logs de erro são retidos indefinidamente enquanto logs de request bem-sucedidos rotacionam para fora depois de uma hora"  # @src=f71e806d3c02
                # | There is no error-only retention carve-out on the free tier, the roughly
                # | hour-long window applies to runtime logs as a class. If the errors
                # | matter beyond the hour, something must persist them.
                feedback: "Não existe uma exceção de retenção só para erros no tier gratuito, a janela de mais ou menos uma hora vale para logs de runtime como classe. Se os erros importam para além da hora, alguma coisa precisa persistir eles."  # @src=cbf18f8ec3fb
              d:
                # | The build logs, which persist per deployment, so Saturday's function
                # | errors are in there if you scroll far enough
                label: "Os logs de build, que persistem por deploy, então os erros de função de sábado estão lá dentro se você rolar o bastante"  # @src=214d9d165afe
                # | Build logs and runtime logs are different surfaces holding different
                # | moments. A build log records how the deployment was produced; a function
                # | that threw while serving a user on Saturday wrote to the runtime stream,
                # | which is the one measured in hours.
                feedback: "Logs de build e logs de runtime são superfícies diferentes segurando momentos diferentes. Um log de build registra como o deploy foi produzido; uma função que lançou enquanto servia um usuário no sábado escreveu no stream de runtime, que é o que é medido em horas."  # @src=32f1237c81a2
          m09-l2-q3:
            # | Your edge worker's cron emits a dozen JSON events per run, plus one more
            # | event per target on each inner pass. Traffic is nowhere near the request
            # | cap, yet log events start getting dropped mid-day. What limit did you hit?
            prompt: "O cron do seu edge worker emite uma dúzia de eventos JSON por execução, mais um evento por alvo em cada passada interna. O tráfego está longe do teto de requests, e mesmo assim eventos de log começam a ser descartados no meio do dia. Em que limite você bateu?"  # @src=c82c1f27023b
            # | 200,000 events/day sounds enormous until a loop logs per target per pass: a
            # | 5-minute cron over a dozen targets with chatty inner loops crosses it
            # | easily. The budget is the platform enforcing the lesson's own rule, boundary
            # | events (result, flip, error) carry all the forensic value at a fraction of
            # | the volume.
            explanation: "200,000 eventos/dia parece enorme até um loop logar por alvo por passada: um cron de 5 minutos sobre uma dúzia de alvos com loops internos tagarelas cruza isso fácil. O orçamento é a plataforma impondo a regra da própria lição, eventos de fronteira (resultado, virada, erro) carregam todo o valor forense por uma fração do volume."  # @src=4d728756026a
            options:                 # source order — keep it
              a:
                # | None, Workers Logs is part of the paid observability product, so
                # | free-tier workers do not have their logs collected at all
                label: "Nenhum, o Workers Logs faz parte do produto pago de observabilidade, então workers de tier gratuito não têm os logs deles coletados de jeito nenhum"  # @src=70f8a0fd0d19
                # | Workers Logs exists on the free plan, with a daily event allowance. Your
                # | logs were being collected fine; they were being collected 200,000 times.
                feedback: "O Workers Logs existe no plano gratuito, com uma cota diária de eventos. Os seus logs estavam sendo coletados direitinho; eles estavam sendo coletados 200,000 vezes."  # @src=df52cb2b153c
              b:
                # | The request cap indirectly, log lines count as requests, so verbose
                # | logging consumes the same 100,000/day allowance
                label: "O teto de requests indiretamente, linhas de log contam como requests, então logging verboso consome a mesma cota de 100,000/dia"  # @src=d8e912a3f101
                # | Requests and log events are separate meters. The request allowance was
                # | fine, it is the per-day log-event budget that per-loop debug lines
                # | exhaust.
                feedback: "Requests e eventos de log são medidores separados. A cota de requests estava de boa, é o orçamento de eventos de log por dia que as linhas de debug por loop esgotam."  # @src=eb85fac02d47
              c:
                # | The Workers Logs free allowance of 200,000 events/day, per-loop debug
                # | lines spend the day's budget on noise
                label: "A cota gratuita do Workers Logs de 200,000 eventos/dia, linhas de debug por loop gastam o orçamento do dia com ruído"  # @src=d3c3c965fc83
                # | Run the loop arithmetic: 288 runs a day at 12 targets and 60 inner
                # | passes is 207,360 lines, over budget on noise alone. Emit at boundaries
                # | instead and the same day costs a few hundred events, which is the
                # | platform enforcing the rule this lesson already argued for.
                feedback: "Faça a aritmética de loop: 288 execuções por dia a 12 alvos e 60 passadas internas dá 207,360 linhas, estourando o orçamento só com ruído. Emita nas fronteiras em vez disso e o mesmo dia custa umas poucas centenas de eventos, que é a plataforma impondo a regra que esta lição já defendeu."  # @src=4030ffb145c5
              d:
                # | The KV free write limit of 1,000 writes a day, since each logged event
                # | is persisted to KV before it is collected
                label: "O limite gratuito de escrita do KV de 1,000 escritas por dia, já que cada evento logado é persistido no KV antes de ser coletado"  # @src=27e36350fd2c
                # | Logging and KV are unrelated paths here. Your events go to stdout and
                # | Workers Logs collects them; KV is where the station deliberately
                # | persists what it must remember, which is a much smaller set of writes
                # | than a log stream.
                feedback: "Logging e KV são caminhos sem relação aqui. Os seus eventos vão para o stdout e o Workers Logs coleta eles; o KV é onde a estação persiste deliberadamente o que ela precisa lembrar, que é um conjunto de escritas muito menor que um stream de log."  # @src=eefe396081a8
      alarm-of-last-resort:                      # quiz
        questions:
          m09-l2-q4:
            # | Your station's cron workflow fails at 3 a.m., on a repo where you have
            # | changed no settings at all. What does GitHub do?
            prompt: "O workflow de cron da sua estação falha às 3 da manhã, num repo onde você não mudou nenhuma configuração. O que o GitHub faz?"  # @src=1bd86aae2b30
            # | The lesson's sharpest ops beat: an unconfigured alarm is not an alarm. The
            # | channel lives at Notification settings → System → Actions, with On
            # | GitHub/Email delivery and an 'Only notify for failed workflows' checkbox,
            # | turning it on is a required lab step, and the drill then proves it fires by
            # | breaking a run on purpose.
            explanation: "A batida de ops mais afiada da lição: um alarme não configurado não é um alarme. O canal mora em Notification settings → System → Actions, com entrega On GitHub/Email e um checkbox 'Only notify for failed workflows', ligar ele é um passo obrigatório do lab, e o exercício depois prova que ele dispara quebrando uma execução de propósito."  # @src=f6183a5f19fa
            options:                 # source order — keep it
              a:
                # | Probably nothing you will see, the Actions notification channel defaults
                # | to 'Don't notify' until you enable it in settings
                label: "Provavelmente nada que você vá ver, o canal de notificação do Actions vem por padrão em 'Don't notify' até você habilitar ele nas settings"  # @src=fc4033b88709
                # | There is a red X in a tab nobody is looking at, and that is the whole
                # | alert. Notification settings, System, Actions, pick a delivery channel
                # | and check 'Only notify for failed workflows'; an unconfigured alarm is a
                # | decoration with an opinion.
                feedback: "Existe um X vermelho numa aba que ninguém está olhando, e esse é o alerta inteiro. Notification settings, System, Actions, escolha um canal de entrega e marque 'Only notify for failed workflows'; um alarme não configurado é uma decoração com opinião."  # @src=224d2aa9aefb
              b:
                # | It emails the repository owner on every failed run, failure email is the
                # | out-of-the-box behavior for any workflow in your own repo
                label: "Ele manda e-mail para o dono do repositório em toda execução que falha, e-mail de falha é o comportamento de fábrica para qualquer workflow no seu próprio repo"  # @src=d3dc3a91db80
                # | There is a distinct Actions notification channel in your settings, and
                # | its default delivery is 'Don't notify'. Until you turn it on, a red run
                # | is just a red X waiting for you to happen to look.
                feedback: "Existe um canal de notificação do Actions distinto nas suas settings, e a entrega default dele é 'Don't notify'. Até você ligar ele, uma execução vermelha é só um X vermelho esperando você por acaso olhar."  # @src=dd10276cd3ab
              c:
                # | It retries the run automatically and notifies you only after three
                # | consecutive failures, to avoid alerting on transient errors
                label: "Ele tenta a execução de novo automaticamente e te notifica só depois de três falhas consecutivas, para evitar alertar em erros transitórios"  # @src=391acb3aaec0
                # | Actions has no automatic retry-then-escalate policy for scheduled runs,
                # | one failure is one failed run, and whether anyone hears about it depends
                # | entirely on the notification channel you configured (or didn't).
                feedback: "O Actions não tem nenhuma política automática de tentar-de-novo-e-escalar para execuções agendadas, uma falha é uma execução que falhou, e se alguém fica sabendo disso depende inteiramente do canal de notificação que você configurou (ou não)."  # @src=ce773fdd14d7
              d:
                # | It disables the schedule after that failed run, so a broken cron stops
                # | firing until someone re-enables it
                label: "Ele desabilita o agendamento depois daquela execução que falhou, então um cron quebrado para de disparar até alguém reabilitar ele"  # @src=440b462b5ab2
                # | You are thinking of the 60-day rule, and it keys on repository
                # | inactivity rather than on failures: a workflow that fails every night
                # | keeps being scheduled every night. Nothing about failing turns the cron
                # | off, which is why a broken run can repeat unheard.
                feedback: "Você está pensando na regra de 60 dias, e ela se apoia em inatividade do repositório em vez de em falhas: um workflow que falha toda noite continua sendo agendado toda noite. Nada no falhar desliga o cron, que é por isso que uma execução quebrada pode se repetir sem ninguém ouvir."  # @src=600513cbbb29
          m09-l2-q5:
            # | One morning you notice the cron produced no runs overnight, and no failure
            # | notification either. Which explanation is consistent with GitHub's
            # | documented behavior?
            prompt: "Uma manhã você nota que o cron não produziu nenhuma execução durante a noite, e nenhuma notificação de falha também. Qual explicação é consistente com o comportamento documentado do GitHub?"  # @src=be38641eca38
            # | This is the alarm of last resort's named hole: failure notifications require
            # | a run that runs and fails. A dropped job and a 60-day auto-disable both
            # | produce pure silence, which is why the station also persists heartbeat
            # | timestamps in status.json, where an ABSENCE is visible to anything that
            # | looks.
            explanation: "Este é o buraco nomeado do alarme de último recurso: notificações de falha exigem uma execução que roda e falha. Um job descartado e um auto-desabilitar de 60 dias produzem os dois puro silêncio, que é por isso que a estação também persiste timestamps de batimento em status.json, onde uma AUSÊNCIA é visível para qualquer coisa que olhe."  # @src=8da924399d87
            options:                 # source order — keep it
              a:
                # | Neither can happen, scheduled runs are guaranteed to execute once queued
                # | even under load, so a missing run means someone deleted or renamed the
                # | workflow file
                label: "Nenhum dos dois pode acontecer, execuções agendadas têm garantia de executar depois de entrar na fila mesmo sob carga, então uma execução faltando quer dizer que alguém deletou ou renomeou o arquivo do workflow"  # @src=597b8e434be8
                # | GitHub's own docs say the opposite: scheduled events are best-effort,
                # | can be delayed, and under sufficient load queued jobs may be dropped.
                # | Silence is a documented outcome, not proof of sabotage.
                feedback: "A documentação do próprio GitHub diz o contrário: eventos agendados são best-effort, podem ser atrasados, e sob carga suficiente jobs na fila podem ser descartados. Silêncio é um resultado documentado, não prova de sabotagem."  # @src=4f8711685ae3
              d:
                # | Your notification filter hid them, since a queued job that gets dropped
                # | under heavy load is recorded in the Actions tab as a skipped run rather
                # | than a failed one
                label: "O seu filtro de notificação escondeu elas, já que um job na fila que é descartado sob carga pesada fica registrado na aba Actions como uma execução pulada em vez de uma que falhou"  # @src=e3073fa7e12c
                # | A dropped job leaves no run at all, so there is no skipped entry for a
                # | filter to hide and nothing in the Actions tab to find in the morning.
                # | The filter you set decides which failures reach you; it cannot decide
                # | anything about a run that never started.
                feedback: "Um job descartado não deixa execução nenhuma, então não existe entrada pulada para um filtro esconder e nada na aba Actions para achar de manhã. O filtro que você definiu decide quais falhas chegam até você; ele não consegue decidir nada sobre uma execução que nunca começou."  # @src=3bf0f8209898
              c:
                # | The runs happened and failed on schedule, but notifications for
                # | scheduled workflows route to the organization's administrators rather
                # | than to the author
                label: "As execuções aconteceram e falharam no horário agendado, mas notificações de workflows agendados são roteadas para os administradores da organização em vez de para o autor"  # @src=a65f47f7eb83
                # | Scheduled-workflow notifications go to the workflow's CREATOR, not to
                # | org admins, and this doesn't explain the missing runs. The real gap is
                # | that a run which never happens has no failure to notify about.
                feedback: "Notificações de workflow agendado vão para o CRIADOR do workflow, não para admins da org, e isso não explica as execuções faltando. A lacuna de verdade é que uma execução que nunca acontece não tem falha nenhuma sobre a qual notificar."  # @src=007c61b5307b
              b:
                # | Best-effort scheduling can drop queued jobs under load, and 60 days of
                # | repo inactivity auto-disables the schedule, neither produces a failed
                # | run
                label: "Agendamento best-effort pode descartar jobs na fila sob carga, e 60 dias de inatividade do repo auto-desabilitam o agendamento, nenhum dos dois produz uma execução que falha"  # @src=5f78dfa1122a
                # | GitHub says it in writing: scheduled events can be delayed, and under
                # | sufficient load some queued jobs may be dropped. Both silent deaths
                # | leave the same trace, which is none, and that is why the station also
                # | commits heartbeat timestamps where an absence is visible to anything
                # | that looks.
                feedback: "O GitHub diz por escrito: eventos agendados podem ser atrasados, e sob carga suficiente alguns jobs na fila podem ser descartados. As duas mortes silenciosas deixam o mesmo rastro, que é nenhum, e é por isso que a estação também commita timestamps de batimento onde uma ausência é visível para qualquer coisa que olhe."  # @src=b97b0646897c
          m09-l2-q6:
            # | The four-platform sweep: where does each credential live so it never lands
            # | in git? Pick the mapping that matches the taught table.
            prompt: "A varredura de quatro plataformas: onde cada credencial mora para que ela nunca aterrisse no git? Escolha o mapeamento que casa com a tabela ensinada."  # @src=6953ad1b0380
            # | The four-platform table in one breath: every platform separates committed
            # | configuration from injected secrets, repo secrets for Actions, dashboard env
            # | vars (pulled with `vercel env pull`) for Vercel, `wrangler secret put` plus
            # | `.dev.vars` for Cloudflare, and `--env-file`/`env_file` for Docker so images
            # | stay secret-free. The companion rule from the logging beat: never log the
            # | environment, or the sweep's work ends up in a retained log line.
            explanation: "A tabela de quatro plataformas num fôlego só: toda plataforma separa configuração commitada de segredos injetados, repo secrets para o Actions, env vars do painel (puxadas com `vercel env pull`) para o Vercel, `wrangler secret put` mais `.dev.vars` para a Cloudflare, e `--env-file`/`env_file` para o Docker para que as imagens fiquem livres de segredos. A regra companheira da batida de logging: nunca logue o ambiente, ou o trabalho da varredura acaba numa linha de log retida."  # @src=ec8cb448c372
            options:                 # source order — keep it
              c:
                # | Actions repository secrets; Vercel env vars synced via vercel env pull;
                # | Cloudflare wrangler secret put with gitignored .dev.vars; Docker
                # | --env-file, never in images
                label: "Repository secrets do Actions; env vars do Vercel sincronizadas via vercel env pull; wrangler secret put da Cloudflare com .dev.vars gitignorado; --env-file do Docker, nunca dentro de imagens"  # @src=be7f7dc540ef
                # | One rule wearing four costumes: committed configuration stays public,
                # | injected values stay out of the repo. Pair it with the logging rule this
                # | lesson opened with, never log the environment, or the sweep's work
                # | reappears inside a retained log line.
                feedback: "Uma regra vestindo quatro fantasias: configuração commitada continua pública, valores injetados ficam fora do repo. Junte ela com a regra de logging com que esta lição abriu, nunca logue o ambiente, ou o trabalho da varredura reaparece dentro de uma linha de log retida."  # @src=c849726333f3
              d:
                # | Actions repository secrets; Vercel dashboard env vars; Cloudflare
                # | wrangler secret put with .dev.vars; Docker an ENV line, since the image
                # | stays in a private registry
                label: "Repository secrets do Actions; env vars do painel do Vercel; wrangler secret put da Cloudflare com .dev.vars; no Docker uma linha ENV, já que a imagem fica num registro privado"  # @src=0841409e1faf
                # | Three rows right and one that undoes them: docker history prints every
                # | layer of an image, ENV instructions included, so a private registry
                # | protects the value only until someone pulls the image. Pass it at run
                # | time with --env-file or compose env_file instead.
                feedback: "Três linhas certas e uma que desfaz elas: docker history imprime toda camada de uma imagem, instruções ENV incluídas, então um registro privado protege o valor só até alguém dar pull na imagem. Passe ele em tempo de execução com --env-file ou o env_file do compose em vez disso."  # @src=653050aa9728
              a:
                # | Actions: an env block committed in the workflow YAML; Vercel: values in
                # | vercel.json; Cloudflare: a vars entry in wrangler.jsonc; Docker: an ENV
                # | line baked into the Dockerfile
                label: "Actions: um bloco env commitado no YAML do workflow; Vercel: valores em vercel.json; Cloudflare: uma entrada vars em wrangler.jsonc; Docker: uma linha ENV assada no Dockerfile"  # @src=f6484cf44a0a
                # | Every location in this list is a committed file, that is four different
                # | ways to publish a secret. Each platform provides an out-of-repo store
                # | precisely so config files can stay public.
                feedback: "Todo lugar nesta lista é um arquivo commitado, isso são quatro jeitos diferentes de publicar um segredo. Cada plataforma fornece um armazenamento fora do repo exatamente para que arquivos de config possam continuar públicos."  # @src=344edc83fe3f
              b:
                # | One encrypted .env committed to the repo and decrypted at deploy time on
                # | every platform with a shared key kept in the team password manager
                label: "Um .env criptografado commitado no repo e descriptografado no momento do deploy em toda plataforma com uma chave compartilhada guardada no gerenciador de senhas do time"  # @src=22117a1a4a44
                # | Committed-but-encrypted schemes exist in industry, but they add a
                # | key-distribution problem this course never takes on, and one leaked key
                # | retroactively exposes the whole git history. The taught path is each
                # | platform's own secret store.
                feedback: "Esquemas de commitado-mas-criptografado existem na indústria, mas eles adicionam um problema de distribuição de chaves que este curso nunca encara, e uma chave vazada expõe retroativamente o histórico inteiro do git. O caminho ensinado é o armazenamento de segredos da própria plataforma."  # @src=4e188b7ad356
  m10-l1:
    # | Assembly: the station, whole
    title: "Montagem: a estação, inteira"  # @src=aa421e1aff0e
    blocks:
      station-check:                      # quiz
        questions:
          m10-l1-q1:
            # | During the opening checkpoint, a learner draws an arrow from the Dockerized
            # | poller to the Vercel dashboard. Against the hub topology you actually built,
            # | what is wrong with that edge?
            prompt: "Durante o checkpoint de abertura, um aluno desenha uma seta do poller em Docker para o painel do Vercel. Contra a topologia de hub que você de fato construiu, o que está errado com essa aresta?"  # @src=6eaa1e6609e7
            # | The hub has no poller-to-dashboard edge and no public path to the poller at
            # | all. The dashboard's three data sources are the cron-produced status.json,
            # | live kit reads, and the TS worker's public JSON endpoint. Knowing which
            # | edges do NOT exist is as much a part of understanding the system as knowing
            # | which do, that is why the checkpoint is drawn from memory before the docs
            # | come back out.
            explanation: "O hub não tem aresta de poller para painel e não tem caminho público nenhum até o poller. As três fontes de dados do painel são o status.json produzido pelo cron, leituras do kit ao vivo, e o endpoint JSON público do worker TS. Saber quais arestas NÃO existem é tanto parte de entender o sistema quanto saber quais existem, é por isso que o checkpoint é desenhado de memória antes de os docs voltarem para fora."  # @src=7d06f3c61bf0
            options:                 # source order — keep it
              b:
                # | The direction is flipped: the dashboard polls the poller's /status
                # | endpoint over the public internet
                label: "A direção está invertida: o painel faz polling no endpoint /status do poller pela internet pública"  # @src=21ff28b409c9
                # | The dashboard never reaches the poller in either direction. The poller
                # | runs on your machine with no public surface; exposing it would mean
                # | tunneling or paid hosting, both deliberately out of scope. The
                # | dashboard's sources are status.json, kit reads, and the worker endpoint.
                feedback: "O painel nunca alcança o poller em nenhuma das duas direções. O poller roda na sua máquina sem superfície pública; expor ele significaria tunneling ou hosting pago, os dois deliberadamente fora de escopo. As fontes do painel são status.json, leituras do kit, e o endpoint do worker."  # @src=461d7c81450e
              a:
                # | It does not exist: the poller is local-only, poked from your machine; no
                # | public surface reaches it
                label: "Ela não existe: o poller é só local, cutucado da sua máquina; nenhuma superfície pública alcança ele"  # @src=e79c8dfbd6f9
                # | Three arrows are deliberately absent from the hub, and this is one of
                # | them: nothing reaches into the poller, neither worker consumes anything,
                # | and the poller feeds no public surface. The free tier bought three
                # | public surfaces, and the container is not one of them.
                feedback: "Três setas estão deliberadamente ausentes do hub, e esta é uma delas: nada entra no poller, nenhum dos dois workers consome nada, e o poller não alimenta nenhuma superfície pública. O tier gratuito comprou três superfícies públicas, e o contêiner não é uma delas."  # @src=6c8c55a68e2b
              c:
                # | It is almost right: pushing the image to GHCR is what gives the running
                # | container its public URL
                label: "Ela está quase certa: dar push da imagem para o GHCR é o que dá ao contêiner rodando a URL pública dele"  # @src=c03703ab1624
                # | GHCR hosts the IMAGE, not a running container, pulling and running it
                # | happens on your machine, which has no public URL. A registry is storage,
                # | not hosting; that distinction is exactly what m06-l4 taught.
                feedback: "O GHCR hospeda a IMAGEM, não um contêiner rodando, dar pull nela e rodar ela acontece na sua máquina, que não tem URL pública. Um registro é armazenamento, não hosting; essa distinção é exatamente o que m06-l4 ensinou."  # @src=f2d07b6dda22
              d:
                # | The arrow is indirect: the cron commits the poller's data, so the
                # | dashboard reads it from status.json
                label: "A seta é indireta: o cron commita os dados do poller, então o painel lê eles do status.json"  # @src=1a835ebb180f
                # | That is the route an extension would have to build, not an edge the
                # | station has. The cron probes public targets from a runner that has never
                # | heard of your laptop, so nothing of the poller's reaches status.json
                # | today. Carrying poller data through the pipeline is exactly the design
                # | work the challenge's panel option asks for.
                feedback: "Essa é a rota que uma extensão teria que construir, não uma aresta que a estação tem. O cron sonda alvos públicos a partir de um runner que nunca ouviu falar do seu laptop, então nada do poller chega ao status.json hoje. Carregar dados do poller através do pipeline é exatamente o trabalho de design que a opção de painel do challenge pede."  # @src=99ae9f792cca
          m10-l1-q2:
            # | The worker-status panel is the capstone's only NEW wiring, yet the lesson
            # | insists it requires zero new skills. What makes that claim true?
            prompt: "O painel de status de workers é a única fiação NOVA do capstone, e mesmo assim a lição insiste que ele não exige nenhuma habilidade nova. O que torna essa afirmação verdadeira?"  # @src=0f2a9e38375a
            # | The capstone's one new edge is taught-skill composition, stated out loud:
            # | the dashboard polls a public JSON URL exactly the way it has polled
            # | status.json since m03-l2, and the worker has served its KV snapshot as
            # | public JSON since m07-l1. The capstone's one new edge proves the course's
            # | thesis, by the end, new capability comes from composing what you own, not
            # | from learning another tool.
            explanation: "A única aresta nova do capstone é composição de habilidades ensinadas, dita em voz alta: o painel faz polling numa URL JSON pública exatamente do jeito que ele faz polling no status.json desde m03-l2, e o worker serve o snapshot de KV dele como JSON público desde m07-l1. A única aresta nova do capstone prova a tese do curso, no fim, capacidade nova vem de compor o que já é seu, não de aprender mais uma ferramenta."  # @src=64ce6184b4ac
            options:                 # source order — keep it
              c:
                # | The dashboard already binds to the worker's KV namespace, so the panel
                # | just reads shared state
                label: "O painel já faz binding no namespace de KV do worker, então o painel só lê estado compartilhado"  # @src=59304dfb2e02
                # | KV bindings exist only inside Cloudflare Workers, a Vercel-hosted SPA
                # | cannot bind to a KV namespace. The worker's fetch handler exists
                # | precisely to serve its KV snapshot as public JSON so anything can poll
                # | it over HTTP.
                feedback: "Bindings de KV existem só dentro dos Cloudflare Workers, uma SPA hospedada no Vercel não consegue fazer binding num namespace de KV. O handler de fetch do worker existe precisamente para servir o snapshot de KV dele como JSON público para que qualquer coisa consiga fazer polling nele por HTTP."  # @src=4e14a6aefe34
              b:
                # | It composes two taught skills: the m03-l2 polling pattern aimed at the
                # | m07-l1 JSON endpoint
                label: "Ele compõe duas habilidades ensinadas: o padrão de polling de m03-l2 apontado para o endpoint JSON de m07-l1"  # @src=63d851681ca1
                # | A zod schema at the boundary, a discriminated state union, useEffect
                # | with a cleaned-up interval: the dashboard has polled a public JSON URL
                # | that way since module three, and the worker has served its snapshot that
                # | way since module seven. New capability out of owned parts is the whole
                # | thesis.
                feedback: "Um schema zod na fronteira, uma união discriminada de estado, useEffect com um interval devidamente limpo: o painel faz polling numa URL JSON pública desse jeito desde o módulo três, e o worker serve o snapshot dele desse jeito desde o módulo sete. Capacidade nova a partir de peças que já são suas é a tese inteira."  # @src=ac27cbd3a61d
              a:
                # | Vercel and Cloudflare share an integration that auto-wires deployed
                # | projects to each other
                label: "Vercel e Cloudflare compartilham uma integração que fia automaticamente projetos com deploy um ao outro"  # @src=256fea6ca78e
                # | No such auto-wiring is used or taught. The panel is plain application
                # | code in the dashboard: a fetch on an interval against a public URL.
                # | Reaching for a platform integration you never learned would break the
                # | capstone's taught-skills-only rule.
                feedback: "Nenhuma fiação automática dessas é usada nem ensinada. O painel é código de aplicação puro dentro do painel: um fetch num intervalo contra uma URL pública. Agarrar uma integração de plataforma que você nunca aprendeu quebraria a regra de só-habilidades-ensinadas do capstone."  # @src=168ed13879d4
              d:
                # | Both surfaces are TypeScript, so the panel imports the worker's JSON
                # | types straight from pulse-core
                label: "As duas superfícies são TypeScript, então o painel importa os tipos JSON do worker direto do pulse-core"  # @src=0278ef85263e
                # | The worker is its own npm project outside the station's pnpm workspace,
                # | which is why m09-l1 counted its lockfile separately. Nothing is
                # | importable across that line, so the panel gets its own schema file for
                # | the payload shape and validates at the boundary like every other feed.
                feedback: "O worker é um projeto npm próprio fora do workspace pnpm da estação, que é por que m09-l1 contou o lockfile dele separado. Nada é importável através dessa linha, então o painel ganha um arquivo de schema próprio para a forma do payload e valida na fronteira como todo outro feed."  # @src=ab12f495ef85
          m10-l1-q3:
            # | While verifying the pipeline edge you notice the cron's status.json commit
            # | never retriggers the workflow. In the station's design, what is that
            # | behavior?
            prompt: "Enquanto verifica a aresta do pipeline você nota que o commit de status.json do cron nunca redispara o workflow. No design da estação, o que é esse comportamento?"  # @src=1a30998320c6
            # | You met the mechanism in m01-l3, so the capstone asks a different question
            # | about it: not what it does, but what it is load-bearing FOR. Edge 1 is the
            # | only edge in the hub whose correctness depends on a platform behavior nobody
            # | in this course wrote, and the station's whole heartbeat rests on it, so a
            # | reader of your architecture diagram has to know it is a designed guarantee
            # | rather than luck. That is the operator's read: name the platform behaviors
            # | your system leans on, and know which of them you would have had to build
            # | yourself. The escape hatch (a PAT or GitHub App token) is exactly the knob
            # | that would break this station if someone reached for it without asking why
            # | the default was chosen.
            explanation: "Você conheceu o mecanismo em m01-l3, então o capstone faz uma pergunta diferente sobre ele: não o que ele faz, mas PARA O QUÊ ele é estrutural. A aresta 1 é a única aresta do hub cuja corretude depende de um comportamento de plataforma que ninguém neste curso escreveu, e o batimento inteiro da estação se apoia nele, então quem ler o seu diagrama de arquitetura tem que saber que é uma garantia projetada e não sorte. Essa é a leitura de operador: nomeie os comportamentos de plataforma em que o seu sistema se apoia, e saiba quais deles você teria tido que construir você mesmo. A saída de emergência (um PAT ou token de GitHub App) é exatamente o botão que quebraria esta estação se alguém agarrasse ele sem perguntar por que o default foi escolhido."  # @src=3040b34a494c
            options:                 # source order — keep it
              d:
                # | A bot-author filter: push triggers skip commits authored by a bot, so
                # | those events create no new runs
                label: "Um filtro de autor bot: triggers de push pulam commits escritos por um bot, então esses eventos não criam execuções novas"  # @src=802fd401055a
                # | The guard keys on the token that created the event, not on who the
                # | commit says it is from. Swap GITHUB_TOKEN for a PAT and the identical
                # | bot-looking commit starts spawning runs, which is exactly why the escape
                # | hatch works and why the default is the thing holding this edge up.
                feedback: "A trava se baseia no token que criou o evento, não em quem o commit diz que é o autor. Troque GITHUB_TOKEN por um PAT e o commit idêntico com cara de bot passa a gerar execuções, que é exatamente por que a saída de emergência funciona e por que o default é a coisa que segura esta aresta em pé."  # @src=928fa8f3fc03
              a:
                # | A misconfiguration: the workflow's push trigger needs a path filter
                # | added so that it fires on that commit
                label: "Uma configuração errada: o trigger de push do workflow precisa de um filtro de path adicionado para que ele dispare nesse commit"  # @src=1db2d6bd8fcf
                # | Backwards, if that commit DID fire the push workflow, the cron would
                # | trigger itself forever. No path filter is missing; the platform is
                # | refusing the recursion for you, and you want it refused.
                feedback: "De trás para frente, se aquele commit DISPARASSE o workflow de push, o cron se dispararia para sempre. Nenhum filtro de path está faltando; a plataforma está recusando a recursão por você, e você quer ela recusada."  # @src=43960049eb2e
              c:
                # | The GITHUB_TOKEN recursion guard working as designed: workflow-authored
                # | events don't create new runs
                label: "A trava de recursão do GITHUB_TOKEN funcionando como projetado: eventos escritos por workflow não criam execuções novas"  # @src=caf465904dba
                # | This is the one edge in the hub whose correctness rests on a platform
                # | behavior nobody in this course wrote, so name it in your diagram as a
                # | guarantee rather than luck. The documented escape hatch, a PAT or GitHub
                # | App token, is precisely the knob that would set your station spinning.
                feedback: "Esta é a única aresta do hub cuja corretude se apoia num comportamento de plataforma que ninguém neste curso escreveu, então nomeie ela no seu diagrama como uma garantia e não como sorte. A saída de emergência documentada, um PAT ou token de GitHub App, é precisamente o botão que colocaria a sua estação girando."  # @src=6a354d350812
              b:
                # | A quirk of cron: scheduled workflows only ever run on the schedule, so
                # | no commit triggers anything in this repo
                label: "Uma esquisitice do cron: workflows agendados só rodam no agendamento, então nenhum commit dispara nada neste repo"  # @src=f6aa7d23289b
                # | Commits still trigger push-based workflows normally in this repo, your
                # | test gate runs on push. The exception is narrower: events created using
                # | GITHUB_TOKEN do not spawn new runs; a human push does.
                feedback: "Commits ainda disparam workflows baseados em push normalmente neste repo, a sua trava de teste roda no push. A exceção é mais estreita: eventos criados usando GITHUB_TOKEN não geram execuções novas; um push humano gera."  # @src=d1a34af55d37
          m10-l1-q4:
            # | For the solo extension, a learner shortlists three ideas: a new
            # | expected-status-code probe type wired end to end, a Telegram alert via a bot
            # | SDK, and deploying the poller to a Kubernetes cluster. Which one satisfies
            # | the extension's rules?
            prompt: "Para a extensão solo, um aluno seleciona três ideias: um tipo novo de sonda de código-de-status-esperado fiado de ponta a ponta, um alerta no Telegram via um SDK de bot, e fazer deploy do poller num cluster Kubernetes. Qual delas satisfaz as regras da extensão?"  # @src=4d95f34d900b
            # | The extension's one rule is taught skills only, and it is the assignment
            # | itself: prove you can extend a real system without a tutorial. A new
            # | probe-target type is pure composition, a union variant in the fleet, a check
            # | in the worker, a row on the dashboard. The other two each smuggle in an
            # | untaught tool, which is exactly the reflex this course spent ten modules
            # | replacing with selection.
            explanation: "A única regra da extensão é só habilidades ensinadas, e ela é a própria tarefa: prove que você consegue estender um sistema de verdade sem um tutorial. Um tipo novo de alvo de sonda é composição pura, uma variante de união na frota, um check no worker, uma linha no painel. As outras duas contrabandeiam cada uma uma ferramenta não ensinada, que é exatamente o reflexo que este curso gastou dez módulos substituindo por seleção."  # @src=0315996fd1c5
            options:                 # source order — keep it
              a:
                # | The new probe-target type: fleet types, worker check, dashboard row,
                # | composed from taught skills
                label: "O tipo novo de alvo de sonda: tipos da frota, check no worker, linha no painel, composto a partir de habilidades ensinadas"  # @src=50fc1a7400e3
                # | Pure composition, end to end: a variant in the fleet's target union, the
                # | check logic in a worker, a row on the dashboard. Nothing new enters the
                # | tree, which is the point of the rule, since ten modules went into
                # | replacing the reflex of reaching for a tool with the skill of selecting
                # | one.
                feedback: "Composição pura, de ponta a ponta: uma variante na união de alvos da frota, a lógica do check num worker, uma linha no painel. Nada de novo entra na árvore, que é o ponto da regra, já que dez módulos foram gastos substituindo o reflexo de agarrar uma ferramenta pela habilidade de selecionar uma."  # @src=9a10aa79bd92
              b:
                # | The Telegram alert: alerts are one of the three named extension
                # | categories, so any alert qualifies
                label: "O alerta no Telegram: alertas são uma das três categorias de extensão nomeadas, então qualquer alerta se qualifica"  # @src=d93550ba3c74
                # | The category is allowed; the implementation is not. A bot SDK is an
                # | untaught dependency, so it breaks the taught-skills-only rule. An
                # | in-bounds alert composes what you own, like a worker-written degraded
                # | flag the Actions run checks and fails loudly on.
                feedback: "A categoria é permitida; a implementação não é. Um SDK de bot é uma dependência não ensinada, então ele quebra a regra de só-habilidades-ensinadas. Um alerta dentro dos limites compõe o que já é seu, como uma flag de degradado escrita por um worker que a execução do Actions checa e na qual ela falha alto."  # @src=3334234b2fd4
              d:
                # | The probe type and the Telegram alert both qualify, since neither one
                # | adds a platform the station lacks
                label: "O tipo de sonda e o alerta no Telegram se qualificam os dois, já que nenhum dos dois adiciona uma plataforma que falte à estação"  # @src=970cdc417525
                # | Platforms are not the boundary; taught skills are. The Telegram idea
                # | adds no platform and still fails, because the bot SDK is a dependency
                # | nobody taught you to evaluate. Rewrite that same alert as a degraded
                # | flag an Actions step reads and it comes back in bounds.
                feedback: "Plataformas não são a fronteira; habilidades ensinadas são. A ideia do Telegram não adiciona plataforma nenhuma e ainda assim falha, porque o SDK de bot é uma dependência que ninguém te ensinou a avaliar. Reescreva esse mesmo alerta como uma flag de degradado que um step do Actions lê e ele volta para dentro dos limites."  # @src=161a57b2f293
              c:
                # | The Kubernetes deploy: it extends the ops layer, which is the newest
                # | skill and freshest in memory
                label: "O deploy no Kubernetes: ele estende a camada de ops, que é a habilidade mais nova e mais fresca na memória"  # @src=c5553639a72c
                # | K8s was explicitly signposted out of scope at the M6 tier-gate and never
                # | taught. The extension proves you can grow the system with the stack you
                # | actually own, orchestration is a different course's problem.
                feedback: "K8s foi explicitamente sinalizado como fora de escopo na trava de tier do M6 e nunca ensinado. A extensão prova que você consegue crescer o sistema com a stack que você de fato tem, orquestração é problema de outro curso."  # @src=a90c31867c3c
  m10-l2:
    # | Conclusion: the map you now own
    title: "Conclusão: o mapa que agora é seu"  # @src=0d8438b802f3
    blocks:
      map-check:                      # quiz
        questions:
          m10-l2-q1:
            # | Your goal after graduating is writing on-chain programs, and your Rust feels
            # | solid after M4, M6. What is the honest reading of the road to the Anchor
            # | course?
            prompt: "Seu objetivo depois de se formar é escrever programas on-chain, e o seu Rust parece sólido depois de M4, M6. Qual é a leitura franca da estrada até o curso Anchor?"  # @src=d148ef9ea551
            # | The exit map's integrity moment: the Anchor course's own sign is blunt, it
            # | assumes you already ship Anchor programs and want the V2 delta. This course
            # | supplies the Rust reading level with evidence (you write structs, enums,
            # | traits, Result, and serde daily); the conceptual grasp of accounts, PDAs,
            # | and transactions is the Bitcoin-to-Solana evolution course's job, and the
            # | shipping reps are yours to earn between the two. Rust confidence alone does
            # | not clear a shipping bar.
            explanation: "O momento de integridade do mapa de saída: a própria placa do curso Anchor é direta, ela pressupõe que você já entrega programas Anchor e quer o delta do V2. Este curso fornece o nível de leitura de Rust com evidências (você escreve structs, enums, traits, Result e serde todo dia); a compreensão conceitual de contas, PDAs e transações é trabalho do curso da evolução do Bitcoin à Solana, e as reps de entrega são suas para conquistar entre os dois. Só confiança em Rust não vence uma barra de entrega."  # @src=c1fa247d7a5f
            options:                 # source order — keep it
              b:
                # | Your Rust reading level is met; accounts and transactions come from the
                # | Bitcoin-to-Solana course, then shipped-program reps
                label: "O seu nível de leitura de Rust está atendido; contas e transações vêm do curso do Bitcoin à Solana, depois reps de programa entregue"  # @src=1277bdb2d30b
                # | Two halves to what you lack, and only one of them is a course: the
                # | concepts live in the Bitcoin-to-Solana sibling, and the reps nobody
                # | hands you. Take the concept course fast, since you over-qualify on its
                # | coding floor, then write and ship programs, then read the V2 delta as
                # | the delta it is.
                feedback: "Duas metades no que você não tem, e só uma delas é um curso: os conceitos moram no irmão do Bitcoin à Solana, e as reps ninguém te dá. Faça o curso de conceitos rápido, já que você se sobrequalifica no piso de código dele, depois escreva e entregue programas, depois leia o delta do V2 como o delta que ele é."  # @src=aca3dd621f41
              a:
                # | You clear its bar now: Rust fluency is what it wants, and your Rust exit
                # | here exceeds reading level
                label: "Você vence a barra dele agora: fluência em Rust é o que ele quer, e a sua saída de Rust aqui passa do nível de leitura"  # @src=bab1340fcc3a
                # | The reading level IS met here, and it matters. But that course's own
                # | sign is a shipping bar: it assumes you already ship Anchor programs and
                # | want the V2 delta. Reading fluency is necessary and nowhere near
                # | sufficient; the concepts and the shipped-program reps still have to come
                # | from somewhere.
                feedback: "O nível de leitura ESTÁ atendido aqui, e isso importa. Mas a própria placa daquele curso é uma barra de entrega: ela pressupõe que você já entrega programas Anchor e quer o delta do V2. Fluência de leitura é necessária e nem de longe suficiente; os conceitos e as reps de programa entregue ainda têm que vir de algum lugar."  # @src=cef7cde219a4
              c:
                # | You should take the client-side mastery course first, since Anchor
                # | programs always need a TS client for anything a user touches
                label: "Você deveria fazer o curso de domínio do lado do cliente primeiro, já que programas Anchor sempre precisam de um cliente TS para qualquer coisa em que um usuário toque"  # @src=32cb886f357d
                # | Programs do get TS clients, but the client-side course is the wallet-UX
                # | and tx-landing route, not an Anchor prerequisite. What you are missing
                # | is conceptual (accounts, PDAs, transactions as ideas, the concept
                # | sibling's job) plus actual shipped-program practice; the client-side
                # | course is neither.
                feedback: "Programas de fato ganham clientes TS, mas o curso do lado do cliente é a rota de UX de carteira e de aterrissagem de tx, não um pré-requisito de Anchor. O que está faltando para você é conceitual (contas, PDAs, transações como ideias, o trabalho do irmão de conceitos) mais prática de verdade de programa entregue; o curso do lado do cliente não é nem um nem outro."  # @src=4e3fbec535d0
              d:
                # | Start with the digital assets course, since token programs are the
                # | gentlest way into on-chain code, and its own labs walk you up to writing
                # | programs of your own
                label: "Comece pelo curso Digital Assets, já que programas de token são o jeito mais suave de entrar em código on-chain, e os labs dele te levam até escrever programas seus"  # @src=866dd7ebea0b
                # | That door has the taller sign, not the gentler one. Its PDA half belongs
                # | to the concepts course anyway, and the token-account background its
                # | first module leans on is something this course consciously did not
                # | supply, so you arrive owing it rather than warmed up.
                feedback: "Aquela porta tem a placa mais alta, não a mais suave. A metade de PDA dela pertence ao curso de conceitos de qualquer forma, e o pano de fundo de token account em que o primeiro módulo dela se apoia é algo que este curso conscientemente não forneceu, então você chega devendo isso em vez de aquecido."  # @src=4b0fffd2b096
          m10-l2-q2:
            # | Six months from now you scaffold a fresh Solana TS project, copy this
            # | course's install line, and npm fails with a peer-dependency error. What does
            # | the course's re-verify habit say to do?
            prompt: "Daqui a seis meses você faz o scaffold de um projeto Solana TS novo, copia a linha de install deste curso, e o npm falha com um erro de peer dependency. O que o hábito de reverificar do curso manda fazer?"  # @src=19ad1b515340
            # | The habit is the deliverable: 'pin what your deps peer against, per
            # | workspace' survives every major bump, while any specific digit rots, this
            # | course's own research watched kit ship two majors in just over nine weeks
            # | and its house rules file go stale twice. One npm view of your deps'
            # | peerDependencies tells you today's pin; your pin table makes updating it a
            # | one-line edit.
            explanation: "O hábito é o entregável: 'fixe aquilo contra o que as suas deps dão peer, por workspace' sobrevive a todo bump de major, enquanto qualquer dígito específico apodrece, a própria pesquisa deste curso viu o kit entregar dois majors em pouco mais de nove semanas e o arquivo de regras da casa ficar desatualizado duas vezes. Um npm view do peerDependencies das suas deps te diz o pin de hoje; a sua tabela de pins faz atualizar ele ser uma edição de uma linha."  # @src=45c84750561a
            options:                 # source order — keep it
              b:
