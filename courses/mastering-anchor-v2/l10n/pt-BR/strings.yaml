                feedback: "O runtime re-roda o create_program_address sobre cada seed que você apresenta, então o prefixo literal `b\"vault\"` e o byte de bump não são opcionais; a chave de authority sozinha deriva um endereço diferente e você recebe InvalidSeeds."  # @src=61269d205ad6
              d:
                # | Just the stored canonical bump as a single seed, since invoke_signed
                # | re-derives the others from the PDA.
                label: "Só o bump canônico guardado como uma seed única, já que o invoke_signed re-deriva as outras a partir do PDA."  # @src=9214e355f963
