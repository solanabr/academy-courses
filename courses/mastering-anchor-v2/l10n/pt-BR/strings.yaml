                # | something that is not your vault. The bump is the last element of the
                # | set, not a replacement for it.
                feedback: "Não tem nada de que re-derivar: o runtime recebe uma lista de seeds e reconstrói um endereço a partir dela, então um byte de bump sozinho hasheia para uma coisa que não é o seu vault. O bump é o último elemento do conjunto, não um substituto para ele."  # @src=50deaba713be
          m09-l1-q3:
            # | Stripped of the framework, your native vault compiles with no_std and
            # | depends on pinocchio-system 0.4 instead of anchor-lang. What does that
            # | reveal about Anchor V2 specifically?
            prompt: "Desmontado do framework, o seu vault nativo compila com no_std e depende do pinocchio-system 0.4 em vez do anchor-lang. O que isso revela sobre o Anchor V2 especificamente?"  # @src=9a370d777dfb
            # | V2 is a no_std rewrite on pinocchio. Rebuilding the vault natively is not an
            # | unrelated exercise — it is hand-writing the exact foundation the framework
            # | sits on, which is why the resonance is the point of the module. V2's
            # | `lang-v2` crate depends on `pinocchio` and `pinocchio-system 0.6` directly;
            # | the crates you added by hand are that same foundation two minor lines back,
            # | on the 0.9 pins that still predate the 0.11 rename of `AccountInfo` to
            # | `AccountView` and `Pubkey` to `Address`.
            explanation: "O V2 é uma reescrita no_std em cima do pinocchio. Reconstruir o vault nativamente não é um exercício sem relação — é escrever na mão exatamente a fundação em cima da qual o framework fica, que é por que a ressonância é o ponto do módulo. O crate `lang-v2` do V2 depende do `pinocchio` e do `pinocchio-system 0.6` diretamente; os crates que você adicionou na mão são essa mesma fundação duas linhas de minor atrás, nos pins 0.9 que ainda antecedem o rename do 0.11 de `AccountInfo` para `AccountView` e de `Pubkey` para `Address`."  # @src=b93e9d025850
            options:                 # source order — keep it
              c:
                # | That native pinocchio programs need a real validator and cannot clear
                # | the same LiteSVM gate the framework vault cleared.
                label: "Que programas pinocchio nativos precisam de um validador de verdade e não conseguem passar na mesma trava de LiteSVM que o vault de framework passou."  # @src=7b6b258d0096
                # | They can, and yours did — the same in-process LiteSVM harness loads your
                # | `.so`, asserts the 500_000_000 lamport delta, and rejects the
                # | over-withdraw.
                feedback: "Eles conseguem, e o seu passou — a mesma bancada de LiteSVM in-process carrega o seu `.so`, assere o delta de 500_000_000 lamports, e rejeita o over-withdraw."  # @src=ff03a1b9e0c3
              b:
                # | That Anchor V2 is itself a no_std rewrite built on pinocchio — you
                # | hand-wrote the layer V2 now generates.
                label: "Que o Anchor V2 é ele mesmo uma reescrita no_std construída em cima do pinocchio — você escreveu na mão a camada que o V2 agora gera."  # @src=38c45010d413
                # | What you assembled by hand is the same foundation the framework's own
                # | crate depends on — a couple of minor versions back, before the account
                # | and address types were renamed.
                feedback: "O que você montou na mão é a mesma fundação da qual o crate próprio do framework depende — algumas versões de minor atrás, antes de os tipos de conta e de endereço serem renomeados."  # @src=e81744d9dcdc
              a:
                # | That Anchor V2 keeps V1's std-linked runtime and changes only surface
                # | ergonomics like `.key()` becoming `.address()`.
                label: "Que o Anchor V2 mantém o runtime linkado com std do V1 e muda só ergonomia de superfície como o `.key()` virando `.address()`."  # @src=2833400e870d
                # | The `.address()` rename is real, but it is a symptom, not the change. V2
                # | is a ground-up `no_std` rewrite: its `lang-v2` crate depends on
                # | `pinocchio` and `pinocchio-system 0.6` directly.
                feedback: "O rename do `.address()` é real, mas ele é um sintoma, não a mudança. O V2 é uma reescrita `no_std` do zero: o crate `lang-v2` dele depende do `pinocchio` e do `pinocchio-system 0.6` diretamente."  # @src=76bee3956319
              d:
                # | That Solana programs are no_std underneath either way, and the framework
                # | was hiding that ceremony.
                label: "Que programas Solana são no_std embaixo de qualquer jeito, e o framework estava escondendo essa cerimônia."  # @src=e1af5b332fb2
                # | That is the folklore version, and it overreaches. The SBF toolchain
                # | ships a trimmed but working std, the stock entrypoint installs a bump
                # | allocator, and Anchor 1.x programs link against all of it. no_std is
                # | what V2 and pinocchio chose, not the mode the runtime imposes.
                feedback: "Essa é a versão do folclore, e ela exagera. O toolchain SBF entrega um std aparado mas funcional, o entrypoint de fábrica instala um alocador bump, e programas Anchor 1.x linkam contra tudo isso. O no_std é o que o V2 e o pinocchio escolheram, não o modo que o runtime impõe."  # @src=f31fb26fa38f
  m09-l2:
    # | Strip the framework II: the diff, and what Anchor generates
    title: "Desmonte o framework II: o diff, e o que o Anchor gera"  # @src=f480fcb9302b
    blocks:
      check:                      # quiz
        questions:
          m09-l2-q1:
            # | Diffing your native vault against the V2 expansion, you find the derive
            # | generated a MUT_MASK associated const plus a runtime duplicate-account walk.
            # | You wrote no such check natively. What class of bug does that generated code
            # | close?
            prompt: "Diffando o seu vault nativo contra a expansão do V2, você acha que o derive gerou um const associado MUT_MASK mais uma varredura de contas duplicadas em runtime. Você não escreveu checagem nenhuma dessas nativamente. Qual classe de bug aquele código gerado fecha?"  # @src=9c71d2ed2f36
            # | MUT_MASK plus the runtime duplicate-account walk is Anchor's
            # | duplicate-mutable defense: it rejects the same writable account appearing
            # | twice in one instruction. Native, nothing stops it — which is exactly the
            # | kind of guard the framework makes impossible to forget. Note the difference
            # | in scope: your native gate 6 compared the one pair you happened to think of,
            # | while the derive's walk is exhaustive over every mutable pair the struct
            # | implies and merged across nested structs, so it grows when you add a field
            # | and your hand-written comparison does not.
            explanation: "O MUT_MASK mais a varredura de contas duplicadas em runtime é a defesa de duplicate-mutable do Anchor: ela rejeita a mesma conta gravável aparecendo duas vezes numa instrução só. Nativo, nada impede isso — que é exatamente o tipo de trava que o framework deixa impossível de esquecer. Note a diferença em escopo: a sua trava 6 nativa comparava o único par que você por acaso pensou, enquanto a varredura do derive é exaustiva sobre cada par mutável que a struct implica e mesclada através de structs aninhadas, então ela cresce quando você adiciona um campo e a sua comparação escrita na mão não."  # @src=966baaad6166
            options:                 # source order — keep it
              b:
                # | Reading a stale typed field after a CPI mutated the account underneath
                # | it.
                label: "Ler um campo tipado obsoleto depois de uma CPI ter mutado a conta embaixo dele."  # @src=40096ebcc0c0
                # | Real class, wrong guard: the stale post-CPI read is closed by the
                # | CpiHandle borrow model, a separate piece of the same expansion.
                feedback: "Classe de verdade, trava errada: a leitura obsoleta pós-CPI é fechada pelo modelo de borrow do CpiHandle, uma peça separada da mesma expansão."  # @src=0a82ef216935
              a:
                # | Unchecked arithmetic overflowing the u64 balance field when a deposit is
                # | added.
                label: "Aritmética não checada estourando o campo de saldo u64 quando um depósito é somado."  # @src=e24229b7eaa1
                # | Overflow is closed by checked_add in the handler body, not by MUT_MASK
                # | or the duplicate-account walk.
                feedback: "Overflow é fechado pelo checked_add no corpo do handler, não pelo MUT_MASK nem pela varredura de contas duplicadas."  # @src=9c11e806a1fb
              c:
                # | Passing the same mutable account twice in one instruction
                # | (duplicate-mutable).
                label: "Passar a mesma conta mutável duas vezes numa instrução só (duplicate-mutable)."  # @src=8b00d8728875
                # | Scope is the real difference: your hand-written gate covered whichever
                # | single pair occurred to you, while generated code enumerates every
                # | writable pair the struct implies and keeps doing so as fields are added.
                feedback: "Escopo é a diferença de verdade: a sua trava escrita na mão cobria qualquer par único que te ocorresse, enquanto código gerado enumera cada par gravável que a struct implica e continua fazendo isso conforme campos são adicionados."  # @src=9488e2688614
              d:
                # | A duplicate address in the account list, whether or not a field is
                # | writable.
                label: "Um endereço duplicado na lista de contas, tanto faz se um campo é gravável."  # @src=bf187bce93b1
                # | The mask marks writable fields, so an address arriving twice through two
                # | read-only slots is a legal call and nothing rejects it. What trips the
                # | walk is an alias landing where at least one of its slots is mutable.
                feedback: "A máscara marca campos graváveis, então um endereço chegando duas vezes através de dois slots somente-leitura é uma chamada legal e nada rejeita ela. O que faz a varredura tropeçar é um alias aterrissando onde pelo menos um dos slots dele é mutável."  # @src=b1ed0e98c21c
          m09-l2-q2:
            # | The expansion shows typed account access is blocked while a CpiHandle is
            # | live — your native code has no such guard. Which v1-era footgun did that
            # | borrow model replace?
            prompt: "A expansão mostra que acesso tipado a conta é bloqueado enquanto um CpiHandle está vivo — o seu código nativo não tem trava nenhuma dessas. Qual cilada da era v1 aquele modelo de borrow substituiu?"  # @src=2e2ff4aadb58
            # | In v1 you could hold typed data across a CPI and read a stale copy unless
            # | you called .reload(). V2's CpiHandle holds Rust borrows so typed access
            # | during a live handle is a compile error — the footgun becomes
            # | unrepresentable.
            explanation: "No v1 você conseguia segurar dados tipados através de uma CPI e ler uma cópia obsoleta a não ser que você chamasse o .reload(). O CpiHandle do V2 segura borrows do Rust então acesso tipado durante um handle vivo é um erro de compilação — a cilada vira não-representável."  # @src=671edbd4c1bc
            options:                 # source order — keep it
              b:
                # | Signing a CPI with a re-derived bump instead of the stored canonical
                # | one.
                label: "Assinar uma CPI com um bump re-derivado em vez do canônico guardado."  # @src=e4f2a3542863
                # | A real footgun, but a different guard: bump = state.bump re-derives
                # | against the stored canonical byte as a constraint hook, well before any
                # | CpiHandle exists.
                feedback: "Uma cilada de verdade, mas uma trava diferente: o bump = state.bump re-deriva contra o byte canônico guardado como um hook de constraint, muito antes de qualquer CpiHandle existir."  # @src=d61a6971c772
              c:
                # | Hashing the wrong preimage namespace into an instruction discriminator.
                label: "Hashear o namespace de preimage errado dentro de um discriminator de instrução."  # @src=ba3bbd689952
                # | That trap lives in the dispatcher — a tag built from the wrong namespace
                # | routes to nothing. The borrow model is about typed reads while a CPI is
                # | in flight.
                feedback: "Essa armadilha mora no dispatcher — uma tag montada a partir do namespace errado roteia para nada. O modelo de borrow é sobre leituras tipadas enquanto uma CPI está em voo."  # @src=09bd0d96f2f4
              d:
                # | Passing the same writable account twice, a check v1 left to you.
                label: "Passar a mesma conta gravável duas vezes, uma checagem que o v1 deixava para você."  # @src=f80d910c928b
                # | Also a v1-era gap, and also closed in this expansion, but by the other
                # | guard: MUT_MASK plus the duplicate walk. The borrow model is about what
                # | you may read while a CPI is still in flight, not about which addresses
                # | arrived.
                feedback: "Também uma lacuna da era v1, e também fechada nesta expansão, mas pela outra trava: o MUT_MASK mais a varredura de duplicatas. O modelo de borrow é sobre o que você tem permissão de ler enquanto uma CPI ainda está em voo, não sobre quais endereços chegaram."  # @src=b234f2b5bf5b
              a:
                # | Reading stale account data after a CPI because you forgot to call
                # | .reload().
                label: "Ler dados de conta obsoletos depois de uma CPI porque você esqueceu de chamar o .reload()."  # @src=60b5dc0aadb3
                # | Forgetting it raised nothing — no error, no warning, no panic — which is
                # | why it shipped as often as it did. A build failure does not restate the
                # | discipline; it retires the need for any.
                feedback: "Esquecer dele não levantava nada — sem erro, sem aviso, sem panic — que é por que isso era entregue tantas vezes quanto era. Uma falha de build não reafirma a disciplina; ela aposenta a necessidade de qualquer uma."  # @src=9d9be427cbf0
          m09-l2-q3:
            # | You take the one-beat asm-v2 peek at hand-written sBPF, then stop. Per this
            # | course's scope, where does the 'why the VM runs it that way' depth live?
            prompt: "Você dá a olhada de um compasso no asm-v2 com sBPF escrito na mão, e depois para. Pelo escopo deste curso, onde mora a profundidade do 'por que a VM roda daquele jeito'?"  # @src=e22f9314401b
            # | This course stays framework-level: what the macro expands to. The sBPF peek
            # | is a single beat; the Low-Level Solana course owns loaders, sBPF, and
            # | syscalls, and it runs the same strip-the-framework mirror in the other
            # | direction on a counter — rebuilding it with no framework at all.
            explanation: "Este curso fica no nível do framework: no que a macro expande. A olhada no sBPF é um compasso único; o curso de Low-Level Solana é dono de loaders, sBPF e syscalls, e ele roda o mesmo espelho de desmonte-o-framework na outra direção num counter — reconstruindo ele sem framework nenhum."  # @src=cb0b4d13f6a7
            options:                 # source order — keep it
              d:
                # | In the Client-Side Mastery course, which owns the sBPF and wire depth
                # | under a send.
                label: "No curso de Client-Side Mastery, que é dono da profundidade de sBPF e de wire embaixo de um send."  # @src=dac468c0bbde
                # | That course picks up where a well-formed transaction ends: priority
                # | fees, retries, getting a send to land. What the VM does with the bytes
                # | once they arrive is the loader-and-syscall territory the boundary map
                # | routes elsewhere.
                feedback: "Aquele curso pega onde uma transação bem-formada termina: taxas de prioridade, retentativas, fazer um send aterrissar. O que a VM faz com os bytes depois de eles chegarem é o território de loader-e-syscall que o mapa de fronteira roteia para outro lugar."  # @src=3d16dfc87023
              b:
                # | In the Low-Level Solana course, which owns runtime, loader, and sBPF
                # | depth.
                label: "No curso de Low-Level Solana, que é dono da profundidade de runtime, de loader e de sBPF."  # @src=51d89fc58916
                # | That course runs this same mirror in the opposite direction, rebuilding
                # | a counter with nothing underneath it. The peek here only establishes
                # | that a hand-written hot path can be linked in at all.
                feedback: "Aquele curso roda este mesmo espelho na direção oposta, reconstruindo um counter sem nada embaixo dele. A olhada aqui só estabelece que um caminho quente escrito na mão consegue ser linkado."  # @src=9f8b9c079615
              a:
                # | Here in the next module, since Anchor V2's asm-v2 hot path puts sBPF in
                # | scope.
                label: "Aqui no próximo módulo, já que o caminho quente asm-v2 do Anchor V2 coloca sBPF em escopo."  # @src=04320487d502
                # | asm-v2 only proves the escape hatch exists — you can link a hand-written
                # | hot path. Why the VM executes it that way is handed off by the boundary
                # | map, not taught here.
                feedback: "O asm-v2 só comprova que a saída de emergência existe — você consegue linkar um caminho quente escrito na mão. Por que a VM executa ele daquele jeito é repassado pelo mapa de fronteira, não ensinado aqui."  # @src=43708f94585e
              c:
                # | In the Digital Assets course, next to token standards and the
                # | transfer-hook interface.
                label: "No curso de Digital Assets, ao lado de padrões de token e da interface de transfer hook."  # @src=adc7c7bf2940
                # | Digital Assets owns token standards and the transfer-hook interface,
                # | which are program-level concerns, not VM or loader internals.
                feedback: "O Digital Assets é dono de padrões de token e da interface de transfer hook, que são preocupações de nível de programa, não internas de VM ou de loader."  # @src=95b37e74b8e6
  m09-l3:
    # | Capstone: run the whole arcade floor
    title: "Capstone: rode o salão de fliperama inteiro"  # @src=1cab25aaef9b
    blocks:
      check:                      # quiz
        questions:
          m09-l3-q1:
            # | Your floor-registry increments each cabinet's play counter by CPI-ing into
            # | the counter program from module 2. Why does the course insist this wiring be
            # | written as worked CPI steps rather than handed to you pre-built?
            prompt: "O seu floor-registry incrementa o counter de partidas de cada fliperama fazendo CPI no programa counter do módulo 2. Por que o curso insiste que essa fiação seja escrita como passos de CPI trabalhados em vez de entregue pronta para você?"  # @src=11407f1ca574
            # | The no-undemonstrated-accretion rule: the capstone gates on your producing
            # | the composition, so the CPI edges (including the counter increment) are
            # | worked steps you write, not a finished registry you receive. A pre-built
            # | wiring would prove nothing about your ability to compose the rungs — the
            # | wiring itself is the artifact under test, which is why R1 is worked in full
            # | as a template and R2, R3, and R4 are yours.
            explanation: "A regra de nenhuma acreção não demonstrada: o capstone trava em você produzir a composição, então as bordas de CPI (incluindo o incremento do counter) são passos trabalhados que você escreve, não um registry pronto que você recebe. Uma fiação pré-construída não comprovaria nada sobre a sua capacidade de compor os degraus — a própria fiação é o artefato sob teste, que é por que o R1 é trabalhado por inteiro como template e o R2, o R3 e o R4 são seus."  # @src=5fca7960eb9a
            options:                 # source order — keep it
              c:
                # | Because the capstone gates on you producing the composition yourself —
                # | accretion is demonstrated, never handed over finished.
                label: "Porque o capstone trava em você produzir a composição você mesmo — acreção é demonstrada, nunca entregue pronta."  # @src=d4687cf6a3e3
                # | The wiring is the artifact. Hand it over finished and there is nothing
                # | left to assess; one rung gets worked end to end as a template, and the
                # | other three are yours.
                feedback: "A fiação é o artefato. Entregue ela pronta e não sobra nada para avaliar; um degrau é trabalhado de ponta a ponta como template, e os outros três são seus."  # @src=5847e1466dab
              d:
                # | Because a pre-built registry would hardcode the callee program ids, and
                # | each learner's rungs land at their own addresses.
                label: "Porque um registry pré-construído deixaria os program ids dos programas chamados hardcoded, e os degraus de cada aprendiz aterrissam nos endereços próprios deles."  # @src=1e95133b5d59
                # | Nothing has to be hardcoded: `declare_program!` reads each rung's
                # | harvested JSON at expansion time, so the generated `Program<T>` marker
                # | carries that rung's own IDL_ADDRESS. Shipped source would compile
                # | against your ids perfectly well, which is why the reason is pedagogical
                # | rather than technical.
                feedback: "Nada precisa ficar hardcoded: o `declare_program!` lê o JSON extraído de cada degrau em tempo de expansão, então o marcador `Program<T>` gerado carrega o IDL_ADDRESS do próprio degrau. Código-fonte entregue compilaria contra os seus ids perfeitamente bem, que é por que a razão é pedagógica e não técnica."  # @src=beae7981fa39
              a:
                # | Because exercising a CPI needs both programs actually deployed, so the
                # | wiring can only be checked once you are on devnet.
                label: "Porque exercitar uma CPI precisa dos dois programas de fato com deploy feito, então a fiação só pode ser checada quando você estiver na devnet."  # @src=1ab078cac162
                # | Tempting if you assume cross-program calls need a real validator, but
                # | they do not: LiteSVM runs the compiled programs in process, and the
                # | Surfpool localnet run in Step 8 stands the whole five-program floor up
                # | on your machine before devnet.
                feedback: "Tentador se você supõe que chamadas entre programas precisam de um validador de verdade, mas não precisam: o LiteSVM roda os programas compilados em processo, e a rodada em localnet no Surfpool do passo 8 levanta o salão de cinco programas inteiro na sua máquina antes da devnet."  # @src=ef584a923f6d
              b:
                # | Because turning on a rung's `cpi` feature changes its bytecode, so the
                # | counter must be redeployed to a fresh program id first.
                label: "Porque ligar a feature `cpi` de um degrau muda o bytecode dele, então o counter precisa receber um novo deploy num program id novo primeiro."  # @src=65acf59cba9d
                # | The registry never flips any feature on a rung at all — it consumes the
                # | counter through its IDL via `declare_program!` — and nothing a caller
                # | does can alter bytecode already deployed at an address. The counter
                # | keeps the program id from its own `declare_id!`, and the registry CPIs
                # | that already-deployed address.
                feedback: "O registry nunca liga feature nenhuma num degrau — ele consome o counter pela IDL dele via `declare_program!` — e nada que um chamador faça consegue alterar bytecode que já recebeu deploy num endereço. O counter mantém o program id do `declare_id!` dele, e o registry faz CPI nesse endereço que já recebeu deploy."  # @src=de1cb6ca7862
          m09-l3-q2:
            # | Before the devnet deploy, the capstone runs the five-program floor together
            # | on a Surfpool localnet via anchor test. What does that step catch that
            # | per-program unit tests do not?
            prompt: "Antes do deploy na devnet, o capstone roda o salão de cinco programas junto num localnet do Surfpool via anchor test. O que esse passo pega que os testes de unidade por programa não pegam?"  # @src=4c2f9608b08a
            # | Unit tests prove each rung in isolation; the Surfpool localnet run stands up
            # | the whole floor so the registry's CPIs into every rung run together — the
            # | integration failures that only appear when programs compose are caught
            # | locally, before devnet. Concretely: the registry's CPIs into the counter,
            # | vault, escrow, and swap are never exercised together by isolated unit tests,
            # | so a seam bug like the registry deriving the escrow's vault from `[b"vault",
            # | escrow.key()]` while the test helper created it from `[b"vault",
            # | operator.key()]` passes every single-program suite and fails only when both
            # | programs sit on the same accounts.
            explanation: "Testes de unidade comprovam cada degrau isolado; a rodada em localnet no Surfpool levanta o salão inteiro para que as CPIs do registry em cada degrau rodem juntas — as falhas de integração que só aparecem quando programas compõem são pegas localmente, antes da devnet. Concretamente: as CPIs do registry no counter, no vault, no escrow e no swap nunca são exercitadas juntas por testes de unidade isolados, então um bug de emenda como o registry derivando o vault do escrow de `[b\"vault\", escrow.key()]` enquanto o helper de teste criou ele de `[b\"vault\", operator.key()]` passa em toda suíte de um programa só e falha só quando os dois programas sentam nas mesmas contas."  # @src=4e2d879b1592
            options:                 # source order — keep it
              d:
                # | That the five-program floor still deploys together, since anchor test
                # | pushes the whole workspace up to devnet first.
                label: "Que o salão de cinco programas ainda recebe deploy junto, já que o anchor test empurra o workspace inteiro para a devnet primeiro."  # @src=adf3e327e84e
                # | It does deploy the whole workspace, but onto a Surfpool localnet on your
                # | machine, which is the point: the seam runs before a byte reaches the
                # | cluster. The devnet deploy is a later step you drive yourself.
                feedback: "Ele faz deploy do workspace inteiro mesmo, mas num localnet do Surfpool na sua máquina, que é o ponto: a emenda roda antes de um byte chegar ao cluster. O deploy na devnet é um passo posterior que você mesmo dirige."  # @src=42f6b4f33735
              c:
                # | Whether each rung's IDL was written to its on-chain metadata account,
                # | which clients need to decode the registry's accounts.
                label: "Se a IDL de cada degrau foi escrita na conta de metadados on-chain dele, de que os clientes precisam para decodificar as contas do registry."  # @src=cfb0b43370df
                # | IDL upload is a ship-module metadata step (Program Metadata), and a
                # | missing IDL breaks clients, not the programs. The localnet run exercises
                # | on-chain composition, which does not read the IDL at all.
