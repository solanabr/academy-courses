            prompt: "O seu withdraw nativo move lamports para fora do PDA de vault. O Anchor guardava aquele bump canônico para você e lia ele de volta através do `bump = vault.bump`; no pinocchio você passa as seeds para o invoke_signed você mesmo. Qual conjunto de seeds assina corretamente?"  # @src=092028d56e93
            # | A PDA signs by presenting the exact seeds it was derived from plus its
            # | canonical bump. Anchor gets that byte from the stored `vault.bump` for a
            # | seed scheme like this one — the macro-time const applies only when every
