                # | missing element, either way you get a different address and a refusal.
                feedback: "O que você apresenta é o que é reconstruído num endereço: o prefixo literal e o byte de bump no fim carregam peso igual. Ordem errada, elemento faltando, de qualquer jeito você recebe um endereço diferente e uma recusa."  # @src=87b838879750
              c:
                # | The authority's pubkey alone, since the runtime already knows which
                # | program is invoking the CPI.
                label: "A pubkey da authority sozinha, já que o runtime já sabe qual programa está invocando a CPI."  # @src=f18319384cfe
                # | The runtime re-runs create_program_address over every seed you present,
