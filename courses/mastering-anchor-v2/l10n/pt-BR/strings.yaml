          t1:
            # | a normal withdraw returns the remaining balance
            description: "um withdraw normal retorna o saldo restante"  # @src=02575cf18214
          t2:
            # | an over-withdraw is rejected with -1 via checked_sub
            description: "um over-withdraw é rejeitado com -1 via checked_sub"  # @src=8a07e2a8be65
          t3:
            # | a zero-amount withdraw is rejected with -2
            description: "um withdraw de quantia zero é rejeitado com -2"  # @src=f9bf5d90688c
          t4:
            # | a zero-amount withdraw from an empty vault is still the -2 rejection, not a
            # | 0 remainder
            description: "um withdraw de quantia zero de um vault vazio continua sendo a rejeição -2, não um resto 0"  # @src=f669d47947e1
          t5:
            # | draining the vault to exactly zero is allowed
            description: "drenar o vault até exatamente zero é permitido"  # @src=87f0f18b6e89
          t6:
            # | an over-withdraw by exactly 2 must be the -1 sentinel. A naive (balance as
            # | i128) - (amount as i128) yields -2 here, which is the ZERO-AMOUNT code: the
            # | sentinels are not arithmetic, they are decisions
            description: "um over-withdraw por exatamente 2 tem que ser a sentinela -1. Um (balance as i128) - (amount as i128) ingênuo dá -2 aqui, que é o código de QUANTIA ZERO: as sentinelas não são aritmética, elas são decisões"  # @src=99066e04536c
          t7:
            # | withdrawing from an empty vault is an over-withdraw (-1), not a zero-amount
            # | rejection (-2): the guard is on the amount, never on the balance
            description: "retirar de um vault vazio é um over-withdraw (-1), não uma rejeição de quantia zero (-2): a trava é na quantia, nunca no saldo"  # @src=97fc29c326f2
          t8:
