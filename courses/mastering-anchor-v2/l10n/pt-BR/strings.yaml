                label: "É desnecessário porque acesso tipado enquanto um `CpiHandle` está vivo é um erro de compilação, então a janela de dado obsoleto que o `.reload()` remendava não pode ser escrita."  # @src=cc9a755ebec4
                # | The borrow sits on the typed wrapper itself, so a live invocation and an
                # | out-of-date copy cannot overlap in time — and a method with nothing left
                # | to refresh is a method you delete.
                feedback: "O borrow fica no próprio wrapper tipado, então uma invocação viva e uma cópia desatualizada não podem se sobrepor no tempo — e um método que não tem mais nada para atualizar é um método que você deleta."  # @src=eb0a15c3ec37
              b:
                # | It is impossible because `.reload()` was renamed to `.refresh()` on the
