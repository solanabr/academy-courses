            description: "um saldo u64::MAX: o retorno i128 existe para a faixa inteira de u64 sobreviver ao cast. Fazer a subtração em i64 dá wrap no u64::MAX para -1 e retorna -2"  # @src=54a3983a9f70
      check:                      # quiz
        questions:
          m09-l1-q1:
            # | In your native rebuild you added `if data[0] != VAULT_DISCRIMINATOR { return
            # | Err(...) }` inside TryFrom. Anchor V2 wrote that check for you. What did
            # | that one line replace, and why can't you drop it?
            prompt: "Na sua reconstrução nativa você adicionou `if data[0] != VAULT_DISCRIMINATOR { return Err(...) }` dentro do TryFrom. O Anchor V2 escrevia aquela checagem para você. O que aquela linha única substituiu, e por que você não consegue largar ela?"  # @src=303ef9265544
            # | The discriminator is the account's type tag. Anchor generates the check that
            # | the tag matches the expected type before it hands you typed data; strip the
            # | framework and you must write that check yourself, or you have re-opened the
            # | type-cosplay class of bug. Concretely: if some other instruction in your
            # | program creates a 34-byte program-owned account for an unrelated purpose — a
            # | scoreboard row, say — the owner check (gate 2) passes because your program
            # | genuinely owns it, and the length check (gate 3) passes because it is 34
            # | bytes. Only `cfg[0] != VAULT_DISCRIMINATOR` stops those bytes from being
            # | read as an authority and a stored bump. (In this program the later
            # | signer-match gate happens to contain the damage — a usable row must name the
            # | signer, whose own vault she could already drain — but that containment is a
            # | coincidence of this seed scheme; the discriminator is what keeps it from
            # | being load-bearing.)
            explanation: "O discriminator é a tag de tipo da conta. O Anchor gera a checagem de que a tag casa com o tipo esperado antes de te entregar dado tipado; desmonte o framework e você tem que escrever aquela checagem você mesmo, ou você reabriu a classe de bug de type cosplay. Concretamente: se alguma outra instrução no seu programa cria uma conta de propriedade do programa de 34 bytes para um propósito sem relação — uma linha de placar, digamos — a checagem de owner (trava 2) passa porque o seu programa genuinamente é dono dela, e a checagem de tamanho (trava 3) passa porque ela tem 34 bytes. Só o `cfg[0] != VAULT_DISCRIMINATOR` impede aqueles bytes de serem lidos como uma authority e um bump guardado. (Neste programa a trava posterior de casamento de signer por acaso contém o dano — uma linha usável tem que nomear quem assina, cujo próprio vault ela já conseguia drenar — mas essa contenção é uma coincidência deste esquema de seeds; o discriminator é o que impede ela de ser estrutural.)"  # @src=75f8e5ebc08b
            options:                 # source order — keep it
              a:
                # | It replaced the PDA re-derivation that `bump = vault.bump` performed;
                # | without it invoke_signed signs with an uncanonical bump.
                label: "Ela substituiu a re-derivação de PDA que o `bump = vault.bump` fazia; sem ela o invoke_signed assina com um bump não canônico."  # @src=34e5d3302168
                # | The PDA address is confirmed by the seed set you hand to invoke_signed,
                # | not by byte 0 of the config. The discriminator tags the account's type,
                # | not its derivation.
                feedback: "O endereço do PDA é confirmado pelo conjunto de seeds que você entrega para o invoke_signed, não pelo byte 0 do config. O discriminator marca o tipo da conta, não a derivação dela."  # @src=2fea18571759
              c:
                # | It replaced the framework's account-type check; without it another
                # | program-owned account of the same length can be read as a vault config.
                label: "Ela substituiu a checagem de tipo de conta do framework; sem ela outra conta de propriedade do programa do mesmo tamanho consegue ser lida como um config de vault."  # @src=4548d19e9938
                # | The ownership check passes — your program really did create that other
                # | account — and length passes by coincidence. One byte of type tag is all
                # | that stands between those bytes and a bad read.
                feedback: "A checagem de propriedade passa — o seu programa de fato criou aquela outra conta — e o tamanho passa por coincidência. Um byte de tag de tipo é tudo o que fica entre aqueles bytes e uma leitura ruim."  # @src=0f0ce9b2e7c5
              b:
                # | It replaced the data-length check; without it a short config account
                # | causes an out-of-bounds read on the `cfg[1..33]` authority slice.
                label: "Ela substituiu a checagem de tamanho de dado; sem ela uma conta de config curta causa uma leitura fora dos limites no slice de authority `cfg[1..33]`."  # @src=f33fa29a8915
                # | Length and type are separate gates: gate 3 is `cfg.len() != CONFIG_LEN`,
                # | gate 4 is `cfg[0] != VAULT_DISCRIMINATOR`. A full-length account of the
                # | wrong type clears the length gate and is stopped only by the
                # | discriminator.
                feedback: "Tamanho e tipo são travas separadas: a trava 3 é `cfg.len() != CONFIG_LEN`, a trava 4 é `cfg[0] != VAULT_DISCRIMINATOR`. Uma conta de tamanho completo do tipo errado passa na trava de tamanho e é parada só pelo discriminator."  # @src=d7e5eeba0a92
              d:
                # | It replaced the owner check; without it an account another program owns
                # | may be passed into the config slot and read as a vault.
                label: "Ela substituiu a checagem de owner; sem ela uma conta da qual outro programa é dono pode ser passada para dentro do slot de config e lida como um vault."  # @src=e04d4a1c0102
                # | Ownership is gate 2, `config.is_owned_by(&crate::ID)`, and it is still
                # | in your TryFrom above this line. The account the discriminator stops is
