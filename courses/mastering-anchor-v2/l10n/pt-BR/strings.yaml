                feedback: "Não existe `.refresh()`, nem no `CpiHandle` nem em nenhum outro lugar. O `.reload()` foi removido porque o modelo de borrow elimina o bug pelo qual ele existia, não renomeado."  # @src=10d2e90aa4e8
              c:
                # | It is unnecessary because V2 re-deserializes every account touched by a
                # | CPI as soon as the invocation returns, so a typed copy is never stale.
                label: "É desnecessário porque o V2 re-desserializa toda conta tocada por uma CPI assim que a invocação retorna, então uma cópia tipada nunca fica obsoleta."  # @src=d72e9941364a
                # | V2 does not silently re-deserialize anything after a CPI; that would
                # | cost compute on every call. The safety is static: borrow-tracked
                # | `CpiHandle`s make stale typed access a compile error.
                feedback: "O V2 não re-desserializa nada em silêncio depois de uma CPI; isso custaria compute em toda chamada. A segurança é estática: `CpiHandle`s rastreados por borrow fazem do acesso tipado obsoleto um erro de compilação."  # @src=e331e46838a3
              d:
