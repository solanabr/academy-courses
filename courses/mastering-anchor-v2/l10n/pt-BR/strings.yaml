                feedback: "A atomicidade cobre a chamada que dá erro, não a chamada que tem sucesso contra uma premissa que o seu handler leu antes da transferência. Esse segundo caso é a razão inteira de o `.reload()` ter sido escrito, e ele é fechado pelo borrow, não pela reversão."  # @src=e80d024d22d0
          m10-l2-q4:
            # | Grepping a v1 codebase for migration, you find `AccountLoader<'info, T>`. A
            # | colleague says 'AccountLoader is gone in V2, delete it.' Why is that wrong?
            prompt: "Grepando uma base de código v1 para migração, você encontra `AccountLoader<'info, T>`. Um colega diz 'o AccountLoader sumiu no V2, delete ele.' Por que isso está errado?"  # @src=1aa72331d65a
            # | V2 keeps the name `AccountLoader` but repurposes it as a sequential account
            # | cursor, not the v1 zero-copy wrapper -- the docs warn it 'means something
            # | else' in V2. Teaching it as 'gone' is the trap: the v1 zero-copy role moves
            # | to `Account<T>` (default zero-copy), while the surviving `AccountLoader`
            # | name now does something unrelated and will compile-and-misbehave if you
            # | assume the old meaning. Contrast that with `LazyAccount`, which is v1-only
            # | and has no V2 equivalent at all: carrying it across fails to resolve loudly
            # | rather than misbehaving quietly.
            explanation: "O V2 mantém o nome `AccountLoader` mas ele vem repropositado como um cursor sequencial de contas, não o wrapper zero-copy do v1 -- a documentação avisa que ele 'quer dizer outra coisa' no V2. Ensinar isso como 'sumiu' é a armadilha: o papel zero-copy do v1 se move para `Account<T>` (zero-copy default), enquanto o nome `AccountLoader` que sobreviveu agora faz uma coisa não relacionada e vai compilar-e-se-comportar-mal se você assumir o significado velho. Contraste isso com o `LazyAccount`, que é só do v1 e não tem equivalente nenhum no V2: carregar ele para o outro lado falha em resolver alto em vez de se comportar mal em silêncio."  # @src=2769e72fbd2d
            options:                 # source order — keep it
              c:
                # | Because `AccountLoader` survives in V2 but is repurposed as a sequential
                # | account cursor, so deleting it or reusing it unchanged misbehaves
                # | silently.
                label: "Porque o `AccountLoader` sobrevive no V2 mas é repropositado como um cursor sequencial de contas, então deletar ele ou reusar ele inalterado se comporta mal em silêncio."  # @src=63a21512a82e
                # | The type that genuinely vanished fails loudly the moment you carry it
                # | across. A name that survives with a new meaning compiles, runs, and then
                # | behaves like something you did not ask for — much the worse of the two.
                feedback: "O tipo que sumiu de verdade falha alto no momento em que você carrega ele para o outro lado. Um nome que sobrevive com um significado novo compila, roda, e depois se comporta como uma coisa que você não pediu — muito o pior dos dois."  # @src=045a5158eed0
              b:
                # | Because the v1 `AccountLoader` maps one-to-one onto V2's `LazyAccount`,
                # | so the port is a find-and-replace of the name plus its `load_mut()`
                # | calls.
                label: "Porque o `AccountLoader` do v1 mapeia um-para-um no `LazyAccount` do V2, então o port é um find-and-replace do nome mais as chamadas de `load_mut()` dele."  # @src=d032a2a04cb7
                # | `LazyAccount` is v1-only and has no V2 spelling at all, so it cannot be
                # | a migration target. The v1 zero-copy role moves to `Account<T>`, while
                # | the `AccountLoader` name is repurposed.
                feedback: "`LazyAccount` é só do v1 e não tem grafia nenhuma no V2, então ele não pode ser um alvo de migração. O papel zero-copy do v1 se move para `Account<T>`, enquanto o nome `AccountLoader` é repropositado."  # @src=323e938cc9ab
              a:
                # | Because `AccountLoader` became the default V2 wrapper once zero-copy
                # | became the default model; rewrite every `Account<T>` in the port as
                # | `AccountLoader<T>`.
                label: "Porque o `AccountLoader` virou o wrapper V2 default quando o zero-copy virou o modelo default; reescreva todo `Account<T>` no port como `AccountLoader<T>`."  # @src=e4fbf1804a83
                # | Zero-copy did become the default, but the default wrapper is
                # | `Account<T>` -- that is what carries the `T: Pod` view now.
                # | `AccountLoader` is a different, repurposed type in V2.
                feedback: "O zero-copy virou o default, sim, mas o wrapper default é `Account<T>` -- é isso que carrega a view `T: Pod` agora. O `AccountLoader` é um tipo diferente e repropositado no V2."  # @src=3cbe9b33c26e
              d:
                # | Because `AccountLoader` is deprecated rather than removed in V2, so it
                # | still loads zero-copy accounts until a later RC drops it.
                label: "Porque o `AccountLoader` está depreciado em vez de removido no V2, então ele ainda carrega contas zero-copy até um RC posterior tirar ele."  # @src=d2647352618f
                # | That reading is the dangerous half of the false friend: same name, same
                # | assumed job, no warning. The zero-copy load moved to `Account<T>`, and
                # | what still answers to `AccountLoader` walks accounts in sequence
                # | instead.
                feedback: "Essa leitura é a metade perigosa do falso amigo: mesmo nome, mesmo trabalho presumido, nenhum aviso. O carregamento zero-copy se moveu para `Account<T>`, e o que ainda atende por `AccountLoader` percorre contas em sequência no lugar."  # @src=157e247e4353
  m10-l3:
    # | Migration capstone: port a 0.31/1.0 program to V2
    title: "Capstone de migração: porte um programa 0.31/1.0 para o V2"  # @src=9a3f51e52473
    blocks:
      check:                      # quiz
        questions:
          m10-l3-q1:
            # | Your port compiles locally with `anchor build` and you assume it is
            # | V2-ready. Then it emits none of the V2 deprecations and behaves nothing like
            # | V2. What actually went wrong?
            prompt: "O seu port compila localmente com o `anchor build` e você assume que ele está pronto para o V2. Depois ele não emite nenhuma das depreciações do V2 e não se comporta em nada como o V2. O que de fato deu errado?"  # @src=265f2ee24408
            # | The framework major is selected by the `anchor-lang` dependency in
            # | Cargo.toml, and cargo resolves it identically under either CLI wrapper. The
            # | handed vault compiles on 1.x because it pins 1.x; leave that row alone and
            # | every build is a v1 build, whichever anchor-cli is on PATH — and once the
            # | row reads 2.0.0-rc.1, the deprecation warnings and the missing-method error
            # | appear under the old CLI too, because they come from the macros in the
            # | dependency graph. That is why step 1 of the port is a manifest edit before
            # | it is an install. The isolated, pinned RC CLI still matters — scaffolds, the
            # | test harness, and IDL handling ride the CLI line — but it is not what your
            # | compiled program behaves like. Two things that control nothing here:
            # | `CARGO_PROFILE_RELEASE_LTO=off` (a macOS build workaround) and any type name
            # | in your handlers. The switch that does control it sits in your source tree
            # | as a version row, which is exactly what m10-l1's recon (`rg
            # | "anchor_version|anchor-lang"`) taught you to read first.
            explanation: "O major do framework é selecionado pela dependência `anchor-lang` no Cargo.toml, e o cargo resolve ele identicamente sob qualquer um dos wrappers de CLI. O vault entregue compila no 1.x porque ele fixa o 1.x; deixe aquela linha em paz e cada build é um build de v1, não importa qual anchor-cli está no PATH — e uma vez que a linha lê 2.0.0-rc.1, os avisos de depreciação e o erro de método faltando aparecem sob o CLI antigo também, porque eles vêm das macros no grafo de dependências. É por isso que o passo 1 do port é uma edição de manifesto antes de ser uma instalação. O CLI do RC isolado e fixado ainda importa — scaffolds, a bancada de teste e o tratamento de IDL pegam carona na linha do CLI — mas ele não é o que o seu programa compilado se comporta como. Duas coisas que não controlam nada aqui: o `CARGO_PROFILE_RELEASE_LTO=off` (um contorno de build do macOS) e qualquer nome de tipo nos seus handlers. A chave que de fato controla isso fica na sua árvore de código como uma linha de versão, que é exatamente o que o reconhecimento do m10-l1 (`rg \"anchor_version|anchor-lang\"`) te ensinou a ler primeiro."  # @src=16a73f23c909
            options:                 # source order — keep it
              c:
                # | The `anchor-lang` pin in the program's `Cargo.toml` is still on the 1.x
                # | line — the dependency graph, not the CLI on your PATH, selects the
                # | framework major.
                label: "O pin de `anchor-lang` no `Cargo.toml` do programa continua na linha 1.x — o grafo de dependências, não o CLI no seu PATH, seleciona o major do framework."  # @src=cbf154aac8b7
                # | Cargo resolves the crate graph identically under either CLI wrapper, so
                # | a 1.x pin builds a v1 artifact no matter which anchor-cli ran — and once
                # | the row reads 2.0.0-rc.1, even the old CLI surfaces the V2 deprecations
                # | and the missing-method error, because they come from the macros in the
                # | graph. m10-l1's recon grepped for exactly this row.
                feedback: "O cargo resolve o grafo de crates identicamente sob qualquer um dos wrappers de CLI, então um pin de 1.x constrói um artefato de v1 não importa qual anchor-cli rodou — e uma vez que a linha lê 2.0.0-rc.1, até o CLI antigo traz à superfície as depreciações do V2 e o erro de método faltando, porque eles vêm das macros no grafo. O reconhecimento do m10-l1 grepou exatamente por esta linha."  # @src=855d5cde8a8d
              a:
                # | You omitted `CARGO_PROFILE_RELEASE_LTO=off` from the cargo install, so
                # | the CLI fell back to building the program with v1 codegen semantics.
                label: "Você omitiu o `CARGO_PROFILE_RELEASE_LTO=off` do cargo install, então o CLI caiu de volta para construir o programa com semântica de geração de código de v1."  # @src=fdefb1c1b6fe
                # | `CARGO_PROFILE_RELEASE_LTO=off` is only a macOS workaround for the
                # | release build blowing up; it is not a version switch of any kind. What
                # | selects the framework line is the `anchor-lang` row in Cargo.toml.
                feedback: "O `CARGO_PROFILE_RELEASE_LTO=off` é só um contorno de macOS para o build de release explodir; ele não é uma chave de versão de tipo nenhum. O que seleciona a linha do framework é a linha de `anchor-lang` no Cargo.toml."  # @src=ad560f110b17
              d:
                # | The `[toolchain]` block in `Anchor.toml` still names an `anchor_version`
                # | on the 1.x line, and it is that row, not the manifest, that the build
                # | resolves against.
                label: "O bloco `[toolchain]` no `Anchor.toml` continua nomeando um `anchor_version` na linha 1.x, e é essa linha, não o manifesto, contra a qual o build resolve."  # @src=5fc3686cdf92
                # | That block steers the wrapper, the same job the CLI does: which binary
                # | runs, which harness scaffolds. Cargo never reads it when resolving your
                # | crate graph, so the framework you compile against is still whatever the
                # | `anchor-lang` row in Cargo.toml says.
                feedback: "Aquele bloco guia o wrapper, o mesmo trabalho que o CLI faz: qual binário roda, qual bancada faz scaffold. O cargo nunca lê ele ao resolver o seu grafo de crates, então o framework contra o qual você compila continua sendo o que a linha de `anchor-lang` no Cargo.toml disser."  # @src=c49ec2e07941
              b:
                # | You compiled with the machine's ambient `anchor-cli 1.1.2` instead of
                # | the pinned V2 RC CLI, and the old binary silently built the old
                # | framework.
                label: "Você compilou com o `anchor-cli 1.1.2` do ambiente da máquina em vez do CLI do RC V2 fixado, e o binário antigo caladamente construiu o framework antigo."  # @src=f70fa89a95e1
                # | The tempting answer — but `anchor build` is a wrapper, and which binary
                # | shelled out to cargo does not change which `anchor-lang` the graph
                # | resolves. An unflipped pin misbehaves identically under both CLIs, and a
                # | flipped pin surfaces the V2 diagnostics under both. The isolated CLI
                # | earns its keep on scaffold, test-harness, and IDL behavior — not as the
                # | major-version switch.
                feedback: "A resposta tentadora — mas o `anchor build` é um wrapper, e qual binário chamou o cargo não muda qual `anchor-lang` o grafo resolve. Um pin não virado se comporta mal identicamente sob os dois CLIs, e um pin virado traz à superfície os diagnósticos do V2 sob os dois. O CLI isolado ganha o lugar dele em comportamento de scaffold, de bancada de teste e de IDL — não como a chave de versão major."  # @src=6dfc5ba0a7ce
          m10-l3-q2:
            # | Mid-port, `cargo build` succeeds but prints a deprecation warning
            # | underlining `has_one` in a constraint you copied over. The test would still
            # | pass. Why resolve it anyway?
            prompt: "No meio do port, o `cargo build` tem sucesso mas imprime um aviso de depreciação sublinhando o `has_one` num constraint que você copiou. O teste ainda passaria. Por que resolver mesmo assim?"  # @src=7090b62399c1
            # | The has_one deprecation warning is the framework driving the migration: V2
            # | wants `address = parent.field`, and the parser stores the has_one span
            # | precisely so codegen can underline it. On an RC that is still changing,
            # | resolving deprecations to zero is how you keep the port building against the
            # | next version -- the warning is a checklist item, not noise. Concretely, the
            # | warning names its own replacement: move the check onto the sibling account
            # | as `#[account(address = state.authority)]`, then rebuild until the
            # | deprecation count is zero. Note also what the warning does not do — it never
            # | fails the build or the LiteSVM suite, and `has_one` keeps performing its
            # | equality check today, so the only thing pushing you to edit is the migration
            # | checklist itself.
            explanation: "O aviso de depreciação do has_one é o framework dirigindo a migração: o V2 quer `address = parent.field`, e o parser guarda o span do has_one precisamente para a geração de código conseguir sublinhar ele. Num RC que continua mudando, resolver depreciações até zero é como você mantém o port compilando contra a próxima versão -- o aviso é um item de checklist, não ruído. Concretamente, o aviso nomeia a substituição própria dele: mova a checagem para a conta irmã como `#[account(address = state.authority)]`, e depois recompile até a contagem de depreciações ser zero. Note também o que o aviso não faz — ele nunca falha o build nem a suíte de LiteSVM, e o `has_one` continua fazendo a checagem de igualdade dele hoje, então a única coisa te empurrando a editar é o próprio checklist de migração."  # @src=4f7513fa65d6
            options:                 # source order — keep it
              d:
                # | Because `address = state.authority` adds a signer check that `has_one`
                # | skipped, so the rename closes a hole rather than restating one.
                label: "Porque o `address = state.authority` adiciona uma checagem de signer que o `has_one` pulava, então o rename fecha um buraco em vez de reafirmar um."  # @src=46d48dfefc40
                # | `address` swaps the equality test and nothing else. The signer
                # | requirement was always declared separately, by the field's own `Signer`
                # | type, and it stays exactly where it was on both spellings.
                feedback: "O `address` troca o teste de igualdade e nada mais. A exigência de signer sempre foi declarada separadamente, pelo tipo `Signer` do próprio campo, e ela fica exatamente onde estava nas duas grafias."  # @src=c885eae3eebb
              a:
                # | Because `has_one` is deprecated in favor of `address = parent.field`,
                # | and on a moving RC deprecated syntax is what a later tag is most likely
                # | to remove.
                label: "Porque o `has_one` está depreciado em favor do `address = parent.field`, e num RC em movimento sintaxe depreciada é o que uma tag posterior tem mais chance de remover."  # @src=955de89079e3
                # | Mechanical, because the compiler spells out the replacement for you:
                # | shift the check onto the sibling and rebuild until nothing is
                # | underlined. Nothing fails today; the pressure is entirely about how long
                # | the port keeps building.
                feedback: "Mecânico, porque o compilador escreve a substituição por extenso para você: mude a checagem para a irmã e recompile até nada estar sublinhado. Nada falha hoje; a pressão é inteiramente sobre por quanto tempo o port continua compilando."  # @src=48dd821a1952
              c:
                # | Because in V2 `has_one` still parses but no longer emits the equality
                # | check, so the authority comparison is silently skipped at runtime.
                label: "Porque no V2 o `has_one` ainda parseia mas não emite mais a checagem de igualdade, então a comparação de authority é caladamente pulada em runtime."  # @src=b45f87343e98
                # | `has_one` still parses AND still performs the equality check in V2 — it
                # | is deprecated, not broken, which is exactly why the test passes. The
                # | reason to replace it is that a moving RC is likely to delete deprecated
                # | syntax.
                feedback: "O `has_one` ainda parseia E ainda faz a checagem de igualdade no V2 — ele está depreciado, não quebrado, que é exatamente por que o teste passa. A razão para substituir ele é que um RC em movimento provavelmente vai deletar sintaxe depreciada."  # @src=6bdd1e906a83
              b:
                # | Because `anchor test` promotes deprecation warnings to hard errors under
                # | V2's default profile, so the LiteSVM suite cannot go green until the
                # | warning is gone.
                label: "Porque o `anchor test` promove avisos de depreciação a erros duros sob o profile default do V2, então a suíte de LiteSVM não consegue ficar verde até o aviso desaparecer."  # @src=90f113ba6997
                # | `anchor test` does not promote deprecation warnings to errors — the
                # | prompt itself says the test still passes. You resolve it for migration
                # | durability, not because it blocks the gate.
                feedback: "O `anchor test` não promove avisos de depreciação a erros — o próprio enunciado diz que o teste ainda passa. Você resolve por durabilidade de migração, não porque isso trava a trava."  # @src=8925f3a896d5
          m10-l3-q3:
            # | You copy a v1 pattern that reads `vault.amount` right after a CPI that moved
            # | lamports, then calls `vault.reload()`. The V2 build fails. What does letting
            # | the compiler drive tell you to do?
            prompt: "Você copia um padrão de v1 que lê o `vault.amount` logo depois de uma CPI que moveu lamports, e depois chama o `vault.reload()`. O build do V2 falha. O que deixar o compilador dirigir te diz para fazer?"  # @src=a1ddd6e9d2d4
            # | V2 has no `.reload()`, and two things put it out of a job. Nothing changes
            # | underneath a loaded typed account without your say-so, so there is nothing
            # | for a re-deserialize call to re-read. And while a `CpiContext` is alive, the
            # | compiler holds one borrow per account handed to that CPI — so typed access
            # | to *those* accounts, the vault included here, will not compile. That is why
            # | (c) is the durable habit: delete the reload, keep the vault's typed data out
            # | of the CPI's span, and take a fresh borrow after the call. Be precise about
            # | what the build actually prints, though. On the copied v1 tail it is exactly
            # | one error, E0599 (no method named `reload`), which says delete that line.
            # | The lock falls on precisely the accounts the CPI can change and nothing
            # | wider, so a read of a disjoint account — this lab's `state` — compiles right
            # | beside it. You do still lift the scalars you need, the state address and the
            # | vault bump, into locals before you build the `CpiContext`, but for a plainer
            # | reason than a borrow error: `seeds` borrows `state_key`, so that local has
            # | to outlive the call that uses the signer.
            explanation: "O V2 não tem `.reload()`, e duas coisas deixam ele sem trabalho. Nada muda embaixo de uma conta tipada carregada sem a sua palavra, então não tem nada para uma chamada de re-desserializar re-ler. E enquanto um `CpiContext` está vivo, o compilador segura um borrow por conta entregue para aquela CPI — então acesso tipado a *aquelas* contas, o vault incluído aqui, não vai compilar. É por isso que a (c) é o hábito durável: delete o reload, mantenha o dado tipado do vault fora do span da CPI, e pegue um borrow novo depois da chamada. Seja preciso sobre o que o build de fato imprime, porém. Na cauda de v1 copiada é exatamente um erro, o E0599 (nenhum método chamado `reload`), que diz para deletar aquela linha. A trava cai precisamente nas contas que a CPI consegue mudar e nada mais largo, então uma leitura de uma conta disjunta — o `state` deste lab — compila logo ao lado dela. Você ainda levanta os escalares de que precisa, o endereço de state e o bump do vault, para dentro de locais antes de montar o `CpiContext`, mas por uma razão mais simples que um erro de borrow: o `seeds` faz borrow do `state_key`, então aquele local tem que sobreviver à chamada que usa o signer."  # @src=683336202519
            options:                 # source order — keep it
              d:
                # | Keep the read and hand-roll the refresh, re-decoding the vault from its
                # | AccountInfo where `.reload()` used to sit.
                label: "Mantenha a leitura e faça o refresh na mão, re-decodificando o vault a partir do AccountInfo dele onde o `.reload()` ficava."  # @src=9f0fb15eef75
                # | There is nothing to refresh into. Once the call returns and its handles
                # | drop, the typed view is reading current bytes already, so a hand-rolled
                # | re-decode is the same work the removed method was doing pointlessly.
                feedback: "Não tem nada para dentro do que dar refresh. Depois de a chamada retornar e os handles dela caírem, a view tipada já está lendo bytes atuais, então um re-decode feito na mão é o mesmo trabalho que o método removido estava fazendo sem sentido."  # @src=7bf58b345af6
              a:
                # | Add `unsafe(dup)` to the vault's `#[account(...)]` constraint, since
                # | that opt-out relaxes V2's account borrow checking for reads taken around
                # | a CPI.
                label: "Adicione o `unsafe(dup)` no constraint `#[account(...)]` do vault, já que aquele opt-out relaxa a checagem de borrow de conta do V2 para leituras tiradas em volta de uma CPI."  # @src=71141b021aac
                # | `unsafe(dup)` is the opt-out for duplicate mutable accounts, and it is
                # | enforced at validation before your handler ever runs. It has nothing to
                # | do with a borrow held across a live `CpiContext` and will not clear this
                # | error.
                feedback: "O `unsafe(dup)` é o opt-out para contas mutáveis duplicadas, e ele é imposto na validação antes de o seu handler sequer rodar. Ele não tem nada a ver com um borrow segurado através de um `CpiContext` vivo e não vai limpar este erro."  # @src=37ec9feb90c2
              c:
                # | Remove the `.reload()` call and restructure so no typed access to the
                # | vault is held while the `CpiContext` holds its borrow.
                label: "Remova a chamada de `.reload()` e reestruture para nenhum acesso tipado ao vault ser segurado enquanto o `CpiContext` segura o borrow dele."  # @src=57eca4f47720
                # | One diagnostic comes back — E0599, a method that no longer exists — and
                # | that is the whole instruction for what to delete. The borrow only covers
                # | accounts you handed the call, so a disjoint read still builds.
                feedback: "Um diagnóstico volta — o E0599, um método que não existe mais — e essa é a instrução inteira sobre o que deletar. O borrow cobre só contas que você entregou para a chamada, então uma leitura disjunta ainda compila."  # @src=96e08263c240
              b:
                # | Re-enable `.reload()` through the `anchor-lang` compat feature and call
                # | it after `system_program::transfer` exactly as the v1 code did.
                label: "Re-habilite o `.reload()` através da feature de compat do `anchor-lang` e chame ele depois do `system_program::transfer` exatamente como o código de v1 fazia."  # @src=452577a9ceb5
                # | There is no compat feature that restores `.reload()` — V2 removed the
                # | method outright. A loaded typed account cannot go out of date behind
                # | your back, and while a CPI holds a handle to one, typed access to it
                # | will not compile, so the stale read `.reload()` patched cannot be
                # | written in the first place.
                feedback: "Não existe feature de compat que restaure o `.reload()` — o V2 removeu o método de cara. Uma conta tipada carregada não consegue ficar fora de data atrás das suas costas, e enquanto uma CPI segura um handle para uma, acesso tipado a ela não vai compilar, então a leitura obsoleta que o `.reload()` remendava não consegue ser escrita para começo de conversa."  # @src=f1a5dc62be7b
  m10-l4:
    # | Conclusion: what you built, and should you move to V2 today?
    title: "Conclusão: o que você construiu, e você deveria migrar para o V2 hoje?"  # @src=e43ef7b7c545
    blocks:
      check:                      # quiz
        questions:
          m10-l4-q1:
            # | A team runs a live lending protocol holding user funds on a 1.1.2 Anchor
            # | build and asks whether to migrate to V2 now for the CU savings. Using the
            # | decision tree, what is the honest routing?
            prompt: "Um time roda um protocolo de lending vivo segurando fundos de usuário num build 1.1.2 do Anchor e pergunta se deve migrar para o V2 agora pela economia de CU. Usando a árvore de decisão, qual é o roteamento honesto?"  # @src=52d5e819d65b
            # | The decision tree routes a live, value-at-risk protocol away from same-day
            # | V2 adoption: V2 labels itself both 'rc' and 'alpha,' the docs say it is not
            # | audited, and no RC->stable date is committed, while the v1 line (1.1.2) is
            # | still maintained. The CU win is real but does not outweigh putting user
            # | funds on unaudited alpha; the honest move is to wait for stability and an
            # | audit. Note that the correct option is a routing, not an argument: the
            # | reasoning behind it is that value-at-risk should not move onto code labeled
            # | both rc and alpha, and the two signals worth watching are precisely a
            # | committed stable date and a published audit -- neither the CU number nor a
            # | deploy trick substitutes for them. Waiting here is not stagnating, because
            # | the 1.1.2 line keeps shipping fixes and tracking the runtime underneath you.
            explanation: "A árvore de decisão roteia um protocolo vivo com valor em risco para longe da adoção do V2 no mesmo dia: o V2 rotula a si mesmo tanto de 'rc' quanto de 'alpha', a documentação diz que ele não é auditado, e nenhuma data de RC->estável está comprometida, enquanto a linha v1 (1.1.2) continua mantida. O ganho de CU é real mas não supera colocar fundos de usuário em cima de alpha não auditado; a jogada honesta é esperar por estabilidade e por uma auditoria. Note que a opção correta é um roteamento, não um argumento: o raciocínio atrás dela é que valor em risco não deveria migrar para código rotulado tanto de rc quanto de alpha, e os dois sinais que valem acompanhar são exatamente uma data estável comprometida e uma auditoria publicada -- nem o número de CU nem um truque de deploy substituem eles. Esperar aqui não é estagnar, porque a linha 1.1.2 continua entregando correções e acompanhando o runtime embaixo de você."  # @src=85d2c9f6bfa6
            options:                 # source order — keep it
              c:
                # | Stay on the maintained 1.1.2 line and watch for a committed stable date
                # | and a published audit before moving value onto V2.
                label: "Fique na linha 1.1.2 mantida e fique de olho em uma data estável comprometida e em uma auditoria publicada antes de mover valor para o V2."  # @src=16c8eb6f925c
                # | Waiting isn't stagnating — the maintained line goes on absorbing fixes
                # | and runtime churn on your behalf, so the wait costs you close to
                # | nothing. What you are watching for is two specific signals, not a vibe.
                feedback: "Esperar não é estagnar — a linha mantida continua absorvendo correções e a rotatividade do runtime em seu nome, então a espera te custa perto de nada. O que você está esperando são dois sinais específicos, não um clima."  # @src=49f01656f749
              b:
                # | Rewrite on V2 in a branch and ship it to mainnet behind a feature flag,
                # | so the 1.1.2 path stays live and V2 traffic can be rolled back
                # | instantly.
                label: "Reescreva no V2 num branch e entregue para a mainnet atrás de um feature flag, para o caminho 1.1.2 continuar vivo e o tráfego do V2 poder ser revertido na hora."  # @src=cfecab37f37e
                # | A feature flag buys you a rollback switch, not an audit. Every
                # | transaction the flag routes to V2 still executes unaudited alpha code
                # | against real user funds, and a rollback only helps after the loss is
                # | visible. The flag hides the audit/stable-date risk rather than resolving
                # | it.
                feedback: "Um feature flag te compra um interruptor de rollback, não uma auditoria. Cada transação que o flag roteia para o V2 continua executando código alpha não auditado contra fundos reais de usuário, e um rollback só ajuda depois de a perda estar visível. O flag esconde o risco de auditoria e de data estável em vez de resolver ele."  # @src=862d103ced8c
              a:
                # | Migrate immediately -- the ~94% bytecode drop and ~8.8x CU win, plus
                # | compile-time removal of the stale-after-CPI class, outweigh process
                # | concerns.
                label: "Migre imediatamente -- a queda de ~94% em bytecode e o ganho de ~8.8x em CU, mais a remoção em tempo de compilação da classe de obsoleto-depois-de-CPI, superam preocupações de processo."  # @src=abc2ba2c1299
                # | Those wins are real, but they sit on a different axis from readiness:
                # | the benchmarks are alpha-caveated and self-revised-down, and the code is
                # | an unaudited RC with no committed stable date. Speed argues for your
                # | next greenfield build, not for moving user funds this quarter.
                feedback: "Esses ganhos são reais, mas ficam num eixo diferente da prontidão: os benchmarks têm ressalva de alpha e foram auto-revisados para baixo, e o código é um RC não auditado sem data estável comprometida. Velocidade argumenta pelo seu próximo build greenfield, não por mover fundos de usuário neste trimestre."  # @src=b7c1d9dae7c7
              d:
                # | Start the port now on the assumption the stable tag is close, since an
                # | unannounced date usually means weeks.
                label: "Comece o port agora na suposição de que a tag estável está perto, já que uma data não anunciada em geral quer dizer semanas."  # @src=26057add0e1e
                # | An absent date is not a short one. Nothing has been committed anywhere,
                # | so a schedule built on 'close' is built on your own hope; the plan
                # | changes when a real published date arrives, not before.
                feedback: "Uma data ausente não é uma data curta. Nada foi comprometido em lugar nenhum, então um cronograma construído em cima de 'perto' é construído em cima da sua própria esperança; o plano muda quando uma data publicada de verdade chega, não antes."  # @src=c2d4d678d85f
          m10-l4-q2:
            # | The project's own benchmarks page says 'this version is alpha and exact
            # | values can move,' and a PR once revised the headline numbers DOWN from
            # | 95%/9.9x to 94%/8.8x. What is the right way to carry those figures into a
            # | decision?
            prompt: "A própria página de benchmarks do projeto diz 'this version is alpha and exact values can move', e um PR uma vez revisou os números da manchete PARA BAIXO de 95%/9.9x para 94%/8.8x. Qual é o jeito certo de carregar essas cifras para dentro de uma decisão?"  # @src=4c94fe9936ee
            # | PR #4914 revised the headline claims down from 95%/9.9x to 94%/8.8x, and the
            # | page itself warns the values can move as codegen and pinocchio change. That
            # | self-correction is a credibility signal, not a weakness -- so the figures
            # | belong in a decision as caveated, re-verifiable directional evidence, never
            # | as a frozen boast. Unpacking the correct option: 'directional' means the
            # | defensible claim is 'V2 is dramatically leaner,' not any fixed multiplier;
            # | 'alpha-caveated' means you state that the values can still move; and
            # | 're-verify at decision time' means you go read the current benchmark page
            # | when the call is actually being made rather than quoting a number you
            # | memorized months earlier.
            explanation: "O PR #4914 revisou as afirmações da manchete para baixo de 95%/9.9x para 94%/8.8x, e a própria página avisa que os valores podem se mover conforme a geração de código e o pinocchio mudam. Essa auto-correção é um sinal de credibilidade, não uma fraqueza -- então as cifras pertencem a uma decisão como evidência direcional com ressalvas e re-verificável, nunca como uma vanglória congelada. Desempacotando a opção correta: 'direcional' quer dizer que a afirmação defensável é 'o V2 é dramaticamente mais magro', não um multiplicador fixo; 'com ressalva de alpha' quer dizer que você declara que os valores ainda podem se mover; e 're-verificar na hora da decisão' quer dizer que você vai ler a página de benchmark atual quando a chamada estiver de fato sendo feita em vez de citar um número que você memorizou meses antes."  # @src=127d9551cdff
            options:                 # source order — keep it
              d:
                # | Treat 94% and 8.8x as a conservative floor, since a project that revises
                # | its own numbers down usually leaves margin.
                label: "Trate 94% e 8.8x como um piso conservador, já que um projeto que revisa os próprios números para baixo em geral deixa margem."  # @src=8915f2d9d2b8
                # | One correction downward says the measurement got more careful, not that
                # | the true figures sit above it. The page's own warning cuts both ways as
                # | codegen and the pinocchio runtime move, which is why the honest carry is
                # | directional plus a re-read at decision time.
                feedback: "Uma correção para baixo diz que a medição ficou mais cuidadosa, não que as cifras verdadeiras ficam acima dela. O próprio aviso da página corta para os dois lados conforme a geração de código e o runtime pinocchio se movem, que é por isso que a carga honesta é direcional mais uma re-leitura na hora da decisão."  # @src=7cda42f8e3e3
              c:
                # | Drop the numbers from the decision entirely; benchmarks taken on alpha
                # | codegen over a moving pinocchio runtime cannot support any claim.
                label: "Largue os números da decisão por completo; benchmarks tirados em cima de geração de código alpha sobre um runtime pinocchio em movimento não conseguem sustentar afirmação nenhuma."  # @src=e9178fb87d80
                # | A moving benchmark is still evidence of direction, and the maintainers
                # | revising their own boast downward makes it more trustworthy, not
                # | worthless. The right move is to carry the figures WITH the caveat, not
                # | to discard the strongest measured argument V2 has.
                feedback: "Um benchmark em movimento ainda é evidência de direção, e os mantenedores revisando a própria vanglória deles para baixo deixa ele mais confiável, não sem valor. A jogada certa é carregar as cifras COM a ressalva, não descartar o argumento medido mais forte que o V2 tem."  # @src=8deede47094b
              b:
                # | Quote the pre-revision 95%/9.9x figures -- PR #4914 trimmed them by
                # | about a point, so the bigger numbers still argue the case fairly.
                label: "Cite as cifras pré-revisão de 95%/9.9x -- o PR #4914 aparou elas em cerca de um ponto, então os números maiores ainda argumentam o caso de forma justa."  # @src=af1e7d7bdaeb
                # | PR #4914 superseded those numbers; reaching back for them because they
                # | read better is exactly the dishonesty the maintainers' own
                # | self-correction guards against. Cite the current 94%/8.8x figures and
                # | carry the caveat that they can move as codegen and pinocchio change.
                feedback: "O PR #4914 substituiu aqueles números; voltar atrás para pegar eles porque eles leem melhor é exatamente a desonestidade contra a qual a auto-correção dos próprios mantenedores protege. Cite as cifras atuais de 94%/8.8x e carregue a ressalva de que elas podem se mover conforme a geração de código e o pinocchio mudam."  # @src=dcdc4f546060
              a:
                # | Cite them as directional, alpha-caveated evidence that V2 is leaner, and
                # | re-verify the current figures at decision time.
                label: "Cite elas como evidência direcional, com ressalva de alpha, de que o V2 é mais magro, e re-verifique as cifras atuais na hora da decisão."  # @src=300cbd7b7053
                # | The awkward part is doing this in a document: a slide with 8.8x on it
                # | outlives the decision it was written for, so the caveat has to travel in
                # | the same sentence as the number, every time.
                feedback: "A parte incômoda é fazer isso num documento: um slide com 8.8x nele sobrevive à decisão para a qual ele foi escrito, então a ressalva tem que viajar na mesma frase que o número, todas as vezes."  # @src=2b5c46fb24f9
          m10-l4-q3:
            # | A reader finishing this course wants to add a Token-2022 transfer hook and,
            # | separately, tune priority fees so their transactions land. Where does this
            # | course send them, and why?
            prompt: "Um leitor terminando este curso quer adicionar um transfer hook de Token-2022 e, separadamente, ajustar taxas de prioridade para as transações dele aterrissarem. Para onde este curso manda ele, e por quê?"  # @src=1409ddd5cc65
            # | This course owns the framework layer and refuses two things by design:
            # | token/NFT standards depth (the transfer-hook interface belongs to the
            # | Digital Assets course, which walks it end to end) and client tx-landing /
            # | priority-fee science (the Client-Side Mastery course). The conclusion routes
            # | readers to the sibling that owns each -- the boundary map is a set of
            # | handoffs, not gaps. Behind the crisp routing sits the fourth misreading from
            # | this lesson: a topic this course skipped is not a topic that does not
            # | matter. Digital Assets walks the whole Token-2022 standard, and Client-Side
            # | Mastery teaches priority fees, Jito bundles, DEX aggregation, and DAS
            # | indexing -- each better than a bolted-on chapter here ever could.
            explanation: "Este curso é dono da camada de framework e recusa duas coisas por design: profundidade de padrões de token/NFT (a interface de transfer hook pertence ao curso de Digital Assets, que percorre ela de ponta a ponta) e pouso de tx no cliente / ciência de taxas de prioridade (o curso de Client-Side Mastery). A conclusão roteia leitores para o irmão que é dono de cada uma -- o mapa de fronteira é um conjunto de repasses, não de lacunas. Atrás do roteamento seco está a quarta leitura errada desta lição: um tópico que este curso pulou não é um tópico que não importa. O Digital Assets percorre o padrão Token-2022 inteiro, e o Client-Side Mastery ensina taxas de prioridade, bundles da Jito, agregação de DEX e indexação DAS -- cada um melhor do que um capítulo aparafusado aqui conseguiria."  # @src=c995d60264c3
            options:                 # source order — keep it
              c:
                # | Transfer hooks to the Digital Assets course; priority fees and
                # | tx-landing to the Client-Side course. This course owns the framework
                # | layer.
                label: "Transfer hooks para o curso de Digital Assets; taxas de prioridade e pouso de tx para o curso de Client-Side. Este curso é dono da camada de framework."  # @src=3e231d2dcbd2
                # | A handoff names the sibling that owns the topic end to end, which is not
                # | at all the same as the topic not mattering. One walks the token standard
                # | in full; the other gets transactions landed.
                feedback: "Um repasse nomeia o irmão que é dono do tópico de ponta a ponta, que não é de jeito nenhum a mesma coisa que o tópico não importar. Um percorre o padrão de token por inteiro; o outro faz as transações aterrissarem."  # @src=674ba3471a39
              a:
                # | Both are covered here -- m05 walks the Token-2022 transfer-hook
                # | interface end to end, and m06 covers priority fees and transaction
                # | landing.
                label: "Os dois são cobertos aqui -- o m05 percorre a interface de transfer hook de Token-2022 de ponta a ponta, e o m06 cobre taxas de prioridade e pouso de transação."  # @src=8e72202cb29e
                # | m05 touches Token-2022 only from the program's seat and explicitly hands
                # | the transfer-hook interface to the Digital Assets course; there is no
                # | priority-fee module at all, because this course refuses client-side
                # | tx-landing entirely. Neither topic is owned here.
                feedback: "O m05 toca o Token-2022 só da cadeira do programa e explicitamente repassa a interface de transfer hook para o curso de Digital Assets; não existe módulo de taxa de prioridade nenhum, porque este curso recusa por completo o pouso de tx no lado do cliente. Nenhum dos dois tópicos é de propriedade daqui."  # @src=552149f6b275
              d:
                # | Transfer hooks to the Digital Assets course; priority fees and
                # | tx-landing to DeFi and RWA Engineering, which owns the real venue
                # | mechanics.
                label: "Transfer hooks para o curso de Digital Assets; taxas de prioridade e pouso de tx para o DeFi e RWA Engineering, que é dono da mecânica de venue de verdade."  # @src=14936cde8384
                # | Half right, and the half that is wrong costs you the reading list. DeFi
                # | and RWA owns protocol and venue design past the toy swap; what gets a
                # | transaction confirmed under load (fees, retries, bundles) is the
                # | Client-Side course's whole subject.
                feedback: "Meio certo, e a metade que está errada te custa a lista de leitura. O DeFi e RWA é dono de design de protocolo e de venue para além do swap de brinquedo; o que faz uma transação ser confirmada sob carga (taxas, retentativas, bundles) é o assunto inteiro do curso de Client-Side."  # @src=1d3c9894d1cf
              b:
                # | Nowhere in the catalog -- transfer hooks and priority-fee science fall
                # | outside the whole curriculum, so both of them send you to external docs.
                label: "Em lugar nenhum do catálogo -- transfer hooks e ciência de taxas de prioridade caem fora do currículo inteiro, então os dois te mandam para documentação externa."  # @src=abd8826a5422
                # | They are firmly in the catalog, just not in THIS course: Digital Assets
                # | owns the transfer-hook interface and Client-Side Mastery owns
                # | tx-landing. The boundary is a handoff to a named sibling, not an
                # | omission from the curriculum.
                feedback: "Eles estão firmemente no catálogo, só não NESTE curso: o Digital Assets é dono da interface de transfer hook e o Client-Side Mastery é dono do pouso de tx. A fronteira é um repasse para um irmão nomeado, não uma omissão do currículo."  # @src=470f2d141c67
