                feedback: "Propriedade é a trava 2, o `config.is_owned_by(&crate::ID)`, e ela continua no seu TryFrom acima desta linha. A conta que o discriminator para é uma da qual o seu próprio programa é dono, que é por que a checagem de owner deixa ela passar."  # @src=acebdc4cae9f
          m09-l1-q2:
            # | Your native withdraw moves lamports out of the vault PDA. Anchor stored that
            # | canonical bump for you and read it back through `bump = vault.bump`; in
            # | pinocchio you pass seeds to invoke_signed yourself. Which seed set signs
