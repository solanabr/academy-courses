locale: pt-BR

course:
  # | Master Anchor V2
  title: "Domine o Anchor V2"  # @src=d66a12880c70
  # | Design, build, test, secure, and ship an Anchor V2 program to devnet against the
  # | 2.0.0-rc.1 release candidate, then migrate a 0.31/1.0 codebase to V2 with a map of
  # | what changed and why. This is a machine-on-your-desk course: you install and drive the
  # | V2 RC toolchain locally — anchor-cli via cargo and avm, rustup's Rust alongside it,
  # | and Docker for the solana-verify build — and you deploy to devnet. V2 is an unaudited
  # | RC, so the course ends by teaching you to decide honestly when it is the right call
  # | and when the maintained 1.x line still is. It does not teach Rust and it does not
  # | teach Anchor: it assumes you already ship Anchor programs and want the V2 delta.
  description: "Projete, construa, teste, proteja e entregue um programa Anchor V2 na devnet contra o release candidate 2.0.0-rc.1, e depois migre uma base de código 0.31/1.0 para o V2 com um mapa do que mudou e por quê. Este é um curso de máquina na sua mesa: você instala e opera o toolchain do V2 RC localmente — anchor-cli via cargo e avm, o Rust do rustup ao lado dele, e Docker para o build do solana-verify — e você faz deploy na devnet. O V2 é um RC não auditado, então o curso termina ensinando você a decidir com honestidade quando ele é a escolha certa e quando ainda é a linha 1.x mantida. Ele não ensina Rust e não ensina Anchor: assume que você já entrega programas Anchor e quer o delta do V2."  # @src=f0ddce3105eb
  modules:
    orientation-anatomy-macros:
      # | Orientation, anatomy & the macro expansion
      title: "Orientação, anatomia e a expansão de macro"  # @src=b78d879b2a38
    accounts-pod-data:
      # | Accounts & data modeling under Pod (the V2 thesis, applied)
      title: "Contas e modelagem de dados sob Pod (a tese do V2, aplicada)"  # @src=47dbe83a9444
    pdas-constraints:
      # | PDAs, constraints & the extensible constraint system
      title: "PDAs, constraints e o sistema extensível de constraints"  # @src=75c1f0310e25
    cpi-composition:
      # | CPIs & composition: the CpiHandle borrow model
      title: "CPIs e composição: o modelo de borrow do CpiHandle"  # @src=cdc5bf1f7a9e
    tokens-framework-seat:
      # | Tokens from the framework's seat (mechanics only)
      title: "Tokens da cadeira do framework (só a mecânica)"  # @src=ddbdc7d79353
    observe-profile-debug:
      # | Observe your program: profile, debug, cover, optimize
      title: "Observe seu programa: perfilar, depurar, cobrir, otimizar"  # @src=30087d53189c
    security-v2-defaults:
      # | Security under V2 defaults (the re-derivation)
      title: "Segurança sob os defaults do V2 (a re-derivação)"  # @src=c70a0fc46199
    ship-idl-verify:
      # | Ship it: IDL, clients, and a verifiable build
      title: "Entregue: IDL, clientes e um build verificável"  # @src=3ee991ed9abb
    peel-and-prove:
      # | Peel & prove
      title: "Desmonte e comprove"  # @src=b6680f2e50ba
    migrate-and-conclude:
      # | Migrate & conclude
      title: "Migre e conclua"  # @src=a9fe978e4ff0

lessons:
  m01-l1:
    # | Your Account<T> is the slow path
    title: "Seu Account<T> é o caminho lento"  # @src=3a40c0fd3943
    blocks:
      check:                      # quiz
        questions:
          m01-l1-q1:
            # | You invoked the v1 and v2 twins and watched v2 spend far fewer CUs on the
            # | same call. What root cause is V2's design actually targeting?
            prompt: "Você invocou os gêmeos v1 e v2 e viu o v2 gastar bem menos CUs na mesma chamada. Qual causa raiz o design do V2 está de fato mirando?"  # @src=7564b9118f90
            # | Issue #4390 names Account<T> the slow path: v1 copies bytes into a struct,
            # | V2 makes zero-copy Pod the default. Same safety checks, far fewer copies.
            # | Zero-copy means literally zero copies of the account buffer: V2 hands you a
            # | typed &Counter view laid over the account's own bytes, so reading a field is
            # | a pointer offset rather than a decode. The price is that account types must
            # | be Pod — flat, alignment-clean bytes with no Vec or String hiding a heap
            # | pointer inside.
            explanation: "A issue #4390 chama o Account<T> de caminho lento: o v1 copia bytes para um struct, o V2 faz do Pod zero-copy o default. Mesmas checagens de segurança, muito menos cópias. Zero-copy quer dizer literalmente zero cópias do buffer da conta: o V2 te entrega uma view tipada &Counter deitada sobre os próprios bytes da conta, então ler um campo é um deslocamento de ponteiro em vez de uma decodificação. O preço é que os tipos de conta precisam ser Pod — bytes planos, com alinhamento limpo, sem nenhum Vec ou String escondendo um ponteiro para o heap dentro."  # @src=3078b02750a2
            options:                 # source order — keep it
              b:
                # | V2 shrinks the 8-byte sha256 discriminator to a single-byte tag, so each
                # | account load compares fewer bytes
                label: "O V2 encolhe o discriminator sha256 de 8 bytes para uma tag de um único byte, então cada load de conta compara menos bytes"  # @src=31dd641fdb49
                # | Tempting because pinocchio-style programs really do use one-byte tags,
                # | and V2 is built on pinocchio. But V2's discriminator is unchanged —
                # | still the 8-byte sha256 of "account:<Name>" — and a discriminator
                # | compare was never the expensive part. The copy was.
                feedback: "Tentador porque programas no estilo pinocchio de fato usam tags de um byte, e o V2 é construído sobre o pinocchio. Mas o discriminator do V2 está inalterado — ainda o sha256 de 8 bytes de \"account:<Name>\" — e uma comparação de discriminator nunca foi a parte cara. A cópia era."  # @src=5d5971bb7ab8
              a:
                # | v1's Account<T> deserializes the account bytes into an owned struct on
                # | every access; V2 casts them in place
                label: "o Account<T> do v1 desserializa os bytes da conta para um struct próprio em cada acesso; o V2 faz cast deles no lugar"  # @src=1ad59ef08e26
                # | Fewer copies, identical checks — and because the saving tracks copy
                # | volume, two twins this small leave almost nothing on the table for you
                # | to measure.
                feedback: "Menos cópias, checagens idênticas — e porque a economia acompanha o volume de cópia, dois gêmeos tão pequenos assim deixam quase nada na mesa para você medir."  # @src=e39da1c5b69c
              d:
                # | V2 memoizes each account's deserialized struct after the first read, so
                # | later field accesses in the instruction are free
                label: "O V2 memoiza o struct desserializado de cada conta depois da primeira leitura, então acessos a campo posteriores na instrução são de graça"  # @src=dd407e23fab2
                # | The instinct is right that a copy paid once beats a copy paid many
                # | times, which is why caching is the first thing anyone reaches for. V2
                # | does not pay it at all: the wrapper is a typed view laid over the
                # | account's own bytes, so a field read is a pointer offset and there is no
                # | decoded struct anywhere to memoize.
                feedback: "O instinto está certo de que uma cópia paga uma vez ganha de uma cópia paga muitas vezes, que é por isso que cache é a primeira coisa que qualquer um pega. O V2 não paga ela de jeito nenhum: o wrapper é uma view tipada deitada sobre os próprios bytes da conta, então uma leitura de campo é um deslocamento de ponteiro e não existe struct decodificado em lugar nenhum para memoizar."  # @src=0e3a3542dafd
              c:
                # | V2 drops the owner and signer checks that v1 runs on every account,
                # | spending its compute on the read instead
                label: "O V2 abre mão das checagens de owner e signer que o v1 roda em cada conta, gastando a computação dele na leitura em vez disso"  # @src=12a4f4c80b4c
                # | The exact misread the design was careful not to invite. Both twins run
                # | identical signer, owner, and discriminator validation; dropping any of
                # | it would be a security regression, not an optimization. The savings are
                # | copies that no longer happen.
                feedback: "Exatamente a leitura errada que o design tomou cuidado para não convidar. Os dois gêmeos rodam validação idêntica de signer, owner e discriminator; abrir mão de qualquer parte disso seria uma regressão de segurança, não uma otimização. A economia são cópias que não acontecem mais."  # @src=bc06a676c8a3
          m01-l1-q2:
            # | A teammate cites the docs' '9.9x average CU improvement.' What is the
            # | accurate current figure, and what does the gap teach?
            prompt: "Um colega de time cita a 'melhora média de CU de 9.9x' da documentação. Qual é o número atual correto, e o que a diferença ensina?"  # @src=6170426ed58d
            # | The headline dropped 9.9x to 8.8x (and 95% to 94% bytecode) in one honest
            # | self-correction; the alpha caveat says values can still move. That is the
            # | lesson behind the number: a benchmark multiplier is a snapshot with a date
            # | on it, never a promise, and the win scales with how much copying a given
            # | program was doing — which is why the Lab has you measure the twins yourself
            # | instead of memorizing a figure.
            explanation: "A manchete caiu de 9.9x para 8.8x (e de 95% para 94% de bytecode) numa única autocorreção honesta; a ressalva de alpha diz que os valores ainda podem se mexer. Essa é a lição atrás do número: um multiplicador de benchmark é um retrato com uma data em cima, nunca uma promessa, e a vitória escala com quanta cópia um dado programa estava fazendo — que é por que o Lab faz você medir os gêmeos você mesmo em vez de decorar um número."  # @src=178ba30861e5
            options:                 # source order — keep it
              d:
                # | 9.9x is the CU figure and 8.8x the bytecode one, so quote whichever
                # | metric your claim needs
                label: "9.9x é o número de CU e 8.8x o de bytecode, então cite a métrica que a sua afirmação precisar"  # @src=c05a883b195f
                # | Two numbers moved in the same commit on 2026-08-13, and filing one under
                # | each metric is a tidy way to remember them wrongly. Both are
                # | before-and-after pairs: bytecode went 95% to 94%, and average CU went
                # | 9.9x to 8.8x. Neither figure belongs to the other metric.
                feedback: "Dois números se mexeram no mesmo commit em 2026-08-13, e arquivar um sob cada métrica é um jeito arrumado de lembrar deles errado. Os dois são pares de antes e depois: o bytecode foi de 95% para 94%, e a CU média foi de 9.9x para 8.8x. Nenhum dos dois números pertence à outra métrica."  # @src=4caece3b4b85
              c:
                # | 50.4x — that is the average CU reduction across every program in the
                # | benchmark suite
                label: "50.4x — essa é a redução média de CU em todos os programas da suíte de benchmark"  # @src=d7c867e02592
                # | 50.4x is real but it is the single LARGEST reduction in the set, not the
                # | average — quoting the best case as the typical case is precisely what PR
                # | #4914 was fixing. The current average is 8.8x.
                feedback: "50.4x é real, mas é a MAIOR redução isolada do conjunto, não a média — citar o melhor caso como o caso típico é precisamente o que o PR #4914 estava corrigindo. A média atual é 8.8x."  # @src=ba03ef1835f3
              a:
                # | 9.9x — the published docs are canonical, so quoting their headline
                # | figure is always safe
                label: "9.9x — a documentação publicada é canônica, então citar o número de manchete dela é sempre seguro"  # @src=98dcc81f97c7
                # | Reasonable-sounding, and wrong in the direction that bites: docs lag the
                # | benchmark source. Benchmark PR #4914 (2026-08-13) revised the headline
                # | DOWN to 8.8x, so 9.9x is a stale number still sitting in prose.
                feedback: "Soa razoável, e é errado na direção que morde: a documentação atrasa em relação à fonte do benchmark. O PR de benchmark #4914 (2026-08-13) revisou a manchete PARA BAIXO até 8.8x, então 9.9x é um número desatualizado ainda parado na prosa."  # @src=afc06cda2155
              b:
                # | 8.8x average — revised down from 9.9x in benchmark PR #4914; never
                # | freeze a multiplier
                label: "8.8x de média — revisado para baixo de 9.9x no PR de benchmark #4914; nunca congele um multiplicador"  # @src=c1ace9834326
                # | Nobody trims a marketing number downward by accident — that is the tell
                # | it was measured rather than chosen. Where it bites is your own prose six
                # | months on, still quoting the figure you wrote down today.
                feedback: "Ninguém apara um número de marketing para baixo por acidente — esse é o sinal de que ele foi medido em vez de escolhido. Onde isso morde é na sua própria prosa seis meses depois, ainda citando o número que você anotou hoje."  # @src=25059d2c2257
          m01-l1-q3:
            # | A colleague asks you where to learn V2 properly. What can you actually tell
            # | them?
            prompt: "Um colega te pergunta onde aprender V2 direito. O que você pode de fato dizer para ele?"  # @src=e736ad79a5f7
            # | The survey found none (search-budget-bounded, phrased as a finding not an
            # | absolute); the corpus's universal version rot is exactly the moat. That gap
            # | is why this course exists: it is not competing with the official on-ramp, it
            # | is replacing one that stopped breathing.
            explanation: "O levantamento não achou nenhum (limitado pelo orçamento de busca, formulado como achado e não como absoluto); o apodrecimento universal de versão no corpus é exatamente o fosso. Essa lacuna é o motivo de este curso existir: ele não está competindo com a rampa de entrada oficial, está substituindo uma que parou de respirar."  # @src=3e48e61c31fc
            options:                 # source order — keep it
              b:
                # | Helius's flagship Anchor intro now installs the 2.0.0-rc.1 toolchain and
                # | teaches V2
                label: "A introdução principal de Anchor da Helius agora instala o toolchain 2.0.0-rc.1 e ensina V2"  # @src=11ddaeba2314
                # | Helius writes genuinely good Anchor material, so the guess is fair — but
                # | that intro's install block still pins 0.29.0 in 2026 and never touches
                # | 2.0.0-rc.1. Version rot, not V2 coverage.
                feedback: "A Helius escreve material de Anchor genuinamente bom, então o palpite é justo — mas o bloco de instalação daquela introdução ainda fixa 0.29.0 em 2026 e nunca toca em 2.0.0-rc.1. Apodrecimento de versão, não cobertura de V2."  # @src=9bb8c77473a4
              c:
                # | As of 2026-08, a search turned up no dedicated V2 course or long-form
                # | guide
                label: "Em 2026-08, uma busca não trouxe nenhum curso dedicado de V2 nem guia longo"  # @src=1353f3cf4e75
                # | A negative like this can't be proven, only bounded. The defensible
                # | sentence is 'a real search found nothing,' never 'none exists.'
                feedback: "Uma negativa como esta não pode ser comprovada, só limitada. A frase defensável é 'uma busca de verdade não achou nada,' nunca 'não existe nenhum.'"  # @src=e480f3492f0e
              a:
                # | The official solana.com/developers/courses path already covers V2 end to
                # | end
                label: "O caminho oficial solana.com/developers/courses já cobre V2 de ponta a ponta"  # @src=6c0d08955e6b
                # | It is the first place anyone looks, which is what makes it dangerous:
                # | the URL 308-redirects into an archived content repo frozen on
                # | 2025-01-24, roughly 0.30-era Anchor. A tombstone with a nice headstone,
                # | not V2 coverage.
                feedback: "É o primeiro lugar em que qualquer um olha, que é o que o torna perigoso: a URL faz um redirect 308 para um repo de conteúdo arquivado, congelado em 2025-01-24, Anchor mais ou menos da era 0.30. Um túmulo com uma lápide bonita, não cobertura de V2."  # @src=eafb58bfee91
              d:
                # | anchor-lang.com typically tracks the RC, so the V2 guide it ships is
                # | current
                label: "o anchor-lang.com normalmente acompanha o RC, então o guia de V2 que ele entrega está atual"  # @src=8e7bee490398
                # | The project's own site is the reasonable next stop after the Foundation
                # | path, and it is the same site whose CPI page still shows the pre-1.0
                # | AccountInfo form. The survey turned up no long-form V2 guide there or
                # | anywhere else.
                feedback: "O site do próprio projeto é a próxima parada razoável depois do caminho da Foundation, e é o mesmo site cuja página de CPI ainda mostra a forma AccountInfo pré-1.0. O levantamento não trouxe nenhum guia longo de V2 lá nem em lugar nenhum."  # @src=5c531edd6bb1
  m01-l2:
    # | Two parallel lines, and the install that fights you
    title: "Duas linhas paralelas, e a instalação que briga com você"  # @src=eebf4eb225a2
    blocks:
      check:                      # quiz
        questions:
          m01-l2-q1:
            # | You try to install the V2 RC with avm and it fails. Why does avm choke, and
            # | what is the documented path?
            prompt: "Você tenta instalar o RC do V2 com o avm e falha. Por que o avm engasga, e qual é o caminho documentado?"  # @src=2dcf6fef7616
            # | For any version at or above 0.31, avm install fetches a prebuilt binary from
            # | the tag's GitHub Release assets rather than building anything. No Release
            # | was ever cut for the v2 tag (/releases/tags/v2.0.0-rc.1 404s, and so does
            # | the asset URL under it), so the fetch fails with 'Failed to download the
            # | binary for version 2.0.0-rc.1 (status code: 404 Not Found)'. Nothing
            # | cryptographic is involved — avm does no attestation verification at all —
            # | and the documented channel is the anchor-next git install. Concretely: cargo
            # | install --git https://github.com/otter-sec/anchor.git --branch anchor-next
            # | anchor-cli --locked --force, where --branch pins the frontier source,
            # | --locked honors the committed Cargo.lock (reproducibility that matters on an
            # | RC), and --force overwrites any anchor-cli already in ~/.cargo/bin.
            explanation: "Para qualquer versão em 0.31 ou acima, o avm install baixa um binário pré-compilado dos assets da Release daquela tag no GitHub em vez de fazer build de qualquer coisa. Nenhuma Release foi cortada para a tag v2 (/releases/tags/v2.0.0-rc.1 dá 404, e a URL do asset embaixo dela também), então o download falha com 'Failed to download the binary for version 2.0.0-rc.1 (status code: 404 Not Found)'. Nada de criptográfico está envolvido — o avm não faz verificação de atestação nenhuma — e o canal documentado é o install via git do anchor-next. Concretamente: cargo install --git https://github.com/otter-sec/anchor.git --branch anchor-next anchor-cli --locked --force, onde --branch fixa a fonte da fronteira, --locked honra o Cargo.lock commitado (reprodutibilidade que importa num RC), e --force sobrescreve qualquer anchor-cli que já esteja em ~/.cargo/bin."  # @src=ee8e138871e3
            options:                 # source order — keep it
              b:
                # | avm refuses prerelease version strings by policy; pass --force to avm
                # | install so it accepts the 2.0.0-rc.1 tag anyway
                label: "o avm recusa strings de versão de prerelease por política; passe --force para o avm install para ele aceitar a tag 2.0.0-rc.1 de qualquer jeito"  # @src=155cda7e4a60
                # | Both halves are wrong. avm parses prerelease strings fine — it even has
                # | an explicit latest-pre-release channel — and --force does exist; it just
                # | skips the already-installed check, which does not conjure a file nobody
                # | published. Nobody ever cut a Release object here, so the asset URL
                # | points at nothing and the download 404s.
                feedback: "As duas metades estão erradas. O avm faz o parse de strings de prerelease de boa — ele até tem um canal latest-pre-release explícito — e o --force existe sim; ele só pula a checagem de já-instalado, o que não conjura um arquivo que ninguém publicou. Ninguém nunca cortou um objeto Release aqui, então a URL do asset aponta para nada e o download dá 404."  # @src=adba464b7bd1
              c:
                # | the CLI is published on npm as @anchor-lang/core@2, so you npm install
                # | that package before avm can resolve the version
                label: "a CLI é publicada no npm como @anchor-lang/core@2, então você dá npm install nesse pacote antes de o avm conseguir resolver a versão"  # @src=52e2a266c766
                # | Tempting because Anchor 1.0 really did rename the TS client to
                # | @anchor-lang/core — but that package is the JavaScript client, there is
                # | no v2 of it, and the CLI is a Rust binary cargo builds from the
                # | anchor-next branch.
                feedback: "Tentador porque o Anchor 1.0 de fato renomeou o cliente TS para @anchor-lang/core — mas esse pacote é o cliente JavaScript, não existe v2 dele, e a CLI é um binário Rust que o cargo constrói a partir do branch anchor-next."  # @src=7287fcf3c620
              d:
                # | avm's prerelease channel is the fix: avm install latest-pre-release
                # | usually resolves the 2.0.0-rc.1 tag and builds it from source for you
                label: "o canal de prerelease do avm é a solução: o avm install latest-pre-release normalmente resolve a tag 2.0.0-rc.1 e faz o build dela a partir do código para você"  # @src=38a45458da55
                # | That channel is real, and reaching for it is the right instinct once you
                # | know the version string parses fine. It resolves to whatever prerelease
                # | has a Release object behind it, and it still downloads rather than
                # | builds, so it cannot conjure an asset nobody uploaded. The flag that
                # | does build is --from-source.
                feedback: "Esse canal é real, e pegar ele é o instinto certo depois que você sabe que a string de versão faz parse de boa. Ele resolve para qualquer prerelease que tenha um objeto Release atrás, e ainda baixa em vez de fazer build, então não consegue conjurar um asset que ninguém subiu. A flag que faz build é a --from-source."  # @src=d2d871f289e0
              a:
                # | avm install fetches a prebuilt binary from the tag's GitHub Release;
                # | none was cut for v2, so it 404s and you build from anchor-next
                label: "o avm install baixa um binário pré-compilado da Release da tag no GitHub; nenhuma foi cortada para o v2, então dá 404 e você faz build a partir do anchor-next"  # @src=59346f22b817
                # | Worth being able to tell apart: a missing file and a refused signature
                # | look much the same in a terminal, and they call for completely different
                # | responses.
                feedback: "Vale conseguir distinguir: um arquivo que falta e uma assinatura recusada se parecem muito num terminal, e pedem respostas completamente diferentes."  # @src=ce3daf1fb384
          m01-l2-q2:
            # | On macOS the RC build dies during LTO. Which line belongs in your pins/setup
            # | notes as the fix?
            prompt: "No macOS o build do RC morre durante o LTO. Qual linha pertence às suas notas de pins/setup como a correção?"  # @src=037ab7516d41
            # | The documented macOS workaround disables release LTO via the cargo profile
            # | env var; record it with a freshness note in the central pins file. LTO is
            # | cargo's final cross-crate optimization pass, so the override is a standard
            # | CARGO_PROFILE_RELEASE_* variable — on Linux the same prefix is harmless,
            # | which lets one install command work everywhere.
            explanation: "A solução de contorno documentada do macOS desliga o LTO de release pela variável de ambiente de profile do cargo; registre ela com uma freshness note no arquivo central de pins. O LTO é o passe final de otimização entre crates do cargo, então o override é uma variável CARGO_PROFILE_RELEASE_* padrão — no Linux o mesmo prefixo é inofensivo, o que deixa um único comando de instalação funcionar em todo lugar."  # @src=64446f7f34c6
            options:                 # source order — keep it
              a:
                # | rustup toolchain install nightly
                label: "rustup toolchain install nightly"  # @src=6010db8f80b8
                # | Tempting if you read an RC as needing nightly, but the RC pins a stable
                # | MSRV of 1.89.0 (the scaffold writes rust-toolchain.toml), and installing
                # | nightly does not disable the link-time optimization pass that is
                # | crashing.
                feedback: "Tentador se você lê um RC como algo que precisa de nightly, mas o RC fixa um MSRV estável de 1.89.0 (o scaffold escreve o rust-toolchain.toml), e instalar nightly não desliga o passe de link-time optimization que está quebrando."  # @src=d979e3987257
              d:
                # | cargo clean && anchor build
                label: "cargo clean && anchor build"  # @src=7af9bf9de29e
                # | A stale-artifact hypothesis is the cheapest thing to try and costs
                # | nothing but a rebuild. The RC dies inside link-time optimization every
                # | run, on a clean tree too, so the pass has to be switched off rather than
                # | retried.
                feedback: "A hipótese de artefato velho é a coisa mais barata de tentar e não custa nada além de um rebuild. O RC morre dentro do link-time optimization em toda rodada, em árvore limpa também, então o passe tem de ser desligado em vez de retentado."  # @src=8a3b6cc07941
              b:
                # | CARGO_PROFILE_RELEASE_LTO=off
                label: "CARGO_PROFILE_RELEASE_LTO=off"  # @src=61b23fd930a2
                # | Cargo owns that knob, not Anchor. Harmless on Linux, so one install line
                # | covers both platforms.
                feedback: "Esse botão é do cargo, não do Anchor. Inofensivo no Linux, então uma linha de instalação cobre as duas plataformas."  # @src=3264c333cdd7
              c:
                # | export ANCHOR_BUILD_LTO=false
                label: "export ANCHOR_BUILD_LTO=false"  # @src=4b726f812ee0
                # | Anchor exposes no LTO switch of its own; LTO is a cargo release-profile
                # | setting, so the knob is the CARGO_PROFILE_RELEASE_* env var cargo
                # | already reads.
                feedback: "O Anchor não expõe nenhuma chave de LTO própria; o LTO é uma configuração do profile de release do cargo, então o botão é a variável de ambiente CARGO_PROFILE_RELEASE_* que o cargo já lê."  # @src=7d3a03baa3c0
              e:
                # | export CARGO_PROFILE_DEV_LTO=off
                label: "export CARGO_PROFILE_DEV_LTO=off"  # @src=7b85321b70d3
                # | The right variable family, the wrong profile. anchor build compiles the
                # | program under the release profile, so the knob that reaches it is
                # | CARGO_PROFILE_RELEASE_LTO; the dev-profile twin is read for debug builds
                # | and leaves the failing pass switched on.
                feedback: "A família de variável certa, o profile errado. O anchor build compila o programa sob o profile de release, então o botão que chega nele é o CARGO_PROFILE_RELEASE_LTO; o gêmeo do profile dev é lido para builds de debug e deixa o passe que falha ligado."  # @src=27537fd83963
          m01-l2-q3:
            # | crates.io tags the release 'rc' while the project's own benchmarks page
            # | calls it 'alpha.' How should the course handle the mismatch?
            prompt: "O crates.io marca o release como 'rc' enquanto a própria página de benchmarks do projeto chama ele de 'alpha.' Como o curso deve lidar com o descasamento?"  # @src=f60c86666cfc
            # | The project labels it both 'rc' and 'alpha'; the course surfaces the
            # | conflict and pins-and-reverifies rather than laundering it. An 'rc' claims
            # | near-shippable and an 'alpha' claims expect-breakage, so when one build
            # | carries both words the honest read is 'somewhere in between' — which is why
            # | PINS.md carries a verified date column and why issue #4937 (anchor-lang
            # | pinning wincode 0.5 while solana-address had moved to wincode 0.6, breaking
            # | #[account(borsh)]) was caught by --locked plus a human re-check rather than
            # | by a label.
            explanation: "O projeto rotula o mesmo build como 'rc' e como 'alpha'; o curso traz o conflito à superfície e fixa-e-re-verifica em vez de lavar isso. Um 'rc' afirma quase-entregável e um 'alpha' afirma espere-quebra, então quando um build carrega as duas palavras a leitura honesta é 'em algum lugar no meio' — que é por que o PINS.md carrega uma coluna de data verified e por que a issue #4937 (o anchor-lang fixando o wincode 0.5 enquanto o solana-address já tinha ido para o wincode 0.6, quebrando o #[account(borsh)]) foi pega pelo --locked mais uma re-conferência humana, não por um rótulo."  # @src=b99a9927c0c4
            options:                 # source order — keep it
              c:
                # | Teach the conflict verbatim, and pin the exact installed version with a
                # | re-verify date
                label: "Ensine o conflito literalmente, e fixe a versão exata instalada com uma data de re-verificação"  # @src=a2e32a1deb97
                # | Two maintainer-written labels disagreeing is itself the maturity
                # | reading: pick one for the reader and you have deleted the signal. What
                # | goes in its place is a dated pin you re-check.
                feedback: "Dois rótulos escritos pelos mantenedores discordando já é a leitura de maturidade: escolha um pelo leitor e você apagou o sinal. O que entra no lugar dele é um pin datado que você re-confere."  # @src=da4dea7ca902
              d:
                # | Call it beta in your own notes, since the two labels typically bracket
                # | that
                label: "Chame de beta nas suas próprias notas, já que os dois rótulos normalmente cercam isso"  # @src=f9b39b05c5d9
                # | Splitting the difference feels fairer than taking a side, and it is the
                # | same move wearing a friendlier hat. A third label nobody published still
                # | resolves a tension the project left open, and the reader loses the one
                # | fact that mattered: two maintainer-written labels disagree about this
                # | build.
                feedback: "Rachar a diferença parece mais justo que tomar um lado, e é o mesmo movimento com um chapéu mais simpático. Um terceiro rótulo que ninguém publicou ainda resolve uma tensão que o projeto deixou aberta, e o leitor perde o único fato que importava: dois rótulos escritos pelos mantenedores discordam sobre este build."  # @src=b223b442015f
              a:
                # | Pick 'rc' — crates.io is the canonical registry, so its label overrides
                # | the project's own docs
                label: "Escolha 'rc' — o crates.io é o registro canônico, então o rótulo dele sobrescreve os próprios docs do projeto"  # @src=8b3b1efce69c
                # | The registry is not an authority on maturity — the 2026-08-12 crates.io
                # | publish is itself undocumented and untested for CLI installs. Taking its
                # | word silently deletes the signal the reader needs.
                feedback: "O registro não é uma autoridade em maturidade — a publicação no crates.io de 2026-08-12 é ela mesma não documentada e não testada para instalações de CLI. Aceitar a palavra dele apaga em silêncio o sinal de que o leitor precisa."  # @src=0d54357f3adc
              b:
                # | Pick 'alpha' — the benchmarks page is maintainer-written, so it is the
                # | more accurate signal
                label: "Escolha 'alpha' — a página de benchmarks é escrita pelos mantenedores, então é o sinal mais preciso"  # @src=5cbaf4bfaef7
                # | Both labels are maintainer-written, which is exactly the problem.
                # | Picking the conservative one still resolves a tension the project never
                # | resolved, and the unresolved tension is the maturity signal.
                feedback: "Os dois rótulos são escritos pelos mantenedores, que é exatamente o problema. Escolher o conservador ainda resolve uma tensão que o projeto nunca resolveu, e a tensão não resolvida é o sinal de maturidade."  # @src=fd64786887d5
  m01-l3:
    # | Program anatomy: what declare_id! and #[program] expand to
    title: "Anatomia do programa: em que declare_id! e #[program] se expandem"  # @src=1a4d2ff85c32
    blocks:
      check:                      # quiz
        questions:
          m01-l3-q1:
            # | Reading a V2 handler you see pub fn greet(ctx: &mut Context<Greet>). In v1
            # | this was Context<Greet> by value with <'info> everywhere. What did V2
            # | change?
            prompt: "Lendo um handler V2 você vê pub fn greet(ctx: &mut Context<Greet>). No v1 isso era Context<Greet> por valor com <'info> em tudo. O que o V2 mudou?"  # @src=1a3b24a8ca40
            # | V2's expansion takes &mut Context<T> and drops <'info> from the wrappers — a
            # | visibly cleaner surface than v1's by-value, lifetime-heavy shape. The
            # | reference also removes a move on every instruction: one borrowed context
            # | carries through validation, your handler, and the exit routine that persists
            # | account changes.
            explanation: "A expansão do V2 recebe &mut Context<T> e tira <'info> dos wrappers — uma superfície visivelmente mais limpa que a forma do v1, por valor e carregada de lifetimes. A referência também remove um move em toda instrução: um único context em borrow atravessa a validação, o seu handler e a rotina de saída que persiste as mudanças nas contas."  # @src=a2973a8dc398
            options:                 # source order — keep it
              c:
                # | The <'info> lifetime moved from the wrappers onto the #[program] module
                # | itself
                label: "O lifetime <'info> passou dos wrappers para o próprio módulo #[program]"  # @src=97a061b5480d
                # | The lifetime was removed from the surface you write, not relocated. The
                # | framework still tracks the underlying account data's lifetimes
                # | internally, but nothing on #[program] spells it out.
                feedback: "O lifetime foi removido da superfície que você escreve, não relocado. O framework ainda rastreia por dentro os lifetimes dos dados da conta subjacente, mas nada no #[program] escreve isso por extenso."  # @src=7571327fb0a0
              a:
                # | V2 handlers take &mut Context<T> and the account wrappers carry no
                # | <'info> lifetime
                label: "Handlers V2 recebem &mut Context<T> e os wrappers de account não carregam lifetime <'info>"  # @src=9e7c25e7b0af
                # | One borrowed context now threads validation, your handler and the
                # | write-back at the end. The per-instruction move is simply gone.
                feedback: "Um único context em borrow agora costura a validação, o seu handler e a escrita de volta no final. O move por instrução simplesmente deixou de existir."  # @src=f54d04277a1b
              b:
                # | V2 kept Context<T> by value and only dropped <'info> from Signer and
                # | Account<T>
                label: "O V2 manteve Context<T> por valor e só tirou <'info> de Signer e Account<T>"  # @src=5270f1245d62
                # | Half right, and that half is the trap: the wrappers did lose <'info>,
                # | but the signature changed too. A handler written Context<T> by value
                # | will not compile against the RC.
                feedback: "Metade certo, e é essa metade que é a armadilha: os wrappers perderam <'info> mesmo, mas a assinatura mudou também. Um handler escrito Context<T> por valor não vai compilar contra o RC."  # @src=c18591dc36cc
              d:
                # | V2 dropped Context<T> altogether; handlers now take &mut Greet, the
                # | accounts struct itself
                label: "O V2 tirou Context<T> por completo; handlers agora recebem &mut Greet, a própria struct de accounts"  # @src=be68e15c41fa
                # | Plausible if you read the missing lifetimes as the whole wrapper going
                # | away, and the direction is right that V2 deleted surface here. Context
                # | survives: the signature is &mut Context<Greet>, and the context is what
                # | carries validation, your body, and the exit routine as one borrowed
                # | thing.
                feedback: "Plausível se você ler os lifetimes que faltam como o wrapper inteiro indo embora, e a direção está certa, o V2 apagou superfície aqui. O Context sobrevive: a assinatura é &mut Context<Greet>, e é o context que carrega a validação, o seu corpo e a rotina de saída como uma coisa só, em borrow."  # @src=3ccb3b3590b1
          m01-l3-q2:
            # | Your v1 muscle memory writes ctx.accounts.vault.key() and the V2 compiler
            # | rejects it. The fix?
            prompt: "A sua memória muscular de v1 escreve ctx.accounts.vault.key() e o compilador do V2 rejeita. A correção?"  # @src=0fc25c2fa507
            # | V2 replaces Pubkey with Address (via the solana-address crate pinocchio
            # | pulls in) and .key() with .address(); the twin renames trip every migrator
            # | once. The accessor hands back a reference, so storing an owned copy needs a
            # | leading star, as in *ctx.accounts.payer.address(). There is no .pubkey() and
            # | no .to_address() on the V2 wrapper surface at all.
            explanation: "O V2 troca Pubkey por Address (pelo crate solana-address que o pinocchio traz) e .key() por .address(); as renomeações gêmeas fazem todo migrador tropeçar uma vez. O acessor devolve uma referência, então guardar uma cópia própria precisa de uma estrela na frente, como em *ctx.accounts.payer.address(). Não existe .pubkey() nem .to_address() na superfície de wrapper do V2, de jeito nenhum."  # @src=16c74cd68638
            options:                 # source order — keep it
              e:
                # | ctx.accounts.vault.to_account_info().key
                label: "ctx.accounts.vault.to_account_info().key"  # @src=7acc58b2d67e
                # | Straight v1 muscle memory, and the shape it targets is real off-chain,
                # | where a Keypair still hands you a Pubkey. Inside a V2 program the
                # | wrapper's accessor is .address(), and that seam between the on-chain
                # | Address surface and the off-chain Pubkey one holds for the whole course.
                feedback: "Memória muscular de v1 pura, e a forma que ela mira existe de verdade off-chain, onde um Keypair ainda te entrega um Pubkey. Dentro de um programa V2 o acessor do wrapper é .address(), e essa costura entre a superfície Address on-chain e a Pubkey off-chain vale para o curso inteiro."  # @src=8d2d4311a961
              a:
                # | ctx.accounts.vault.pubkey()
                label: "ctx.accounts.vault.pubkey()"  # @src=14796b44ce6e
                # | .pubkey() is the off-chain accessor — a Keypair in your LiteSVM test
                # | still hands you a Pubkey that way. On the V2 wrapper surface the type is
                # | Address and the accessor is .address().
                feedback: ".pubkey() é o acessor off-chain — um Keypair no seu teste LiteSVM ainda te entrega um Pubkey assim. Na superfície de wrapper do V2 o tipo é Address e o acessor é .address()."  # @src=4b065fe552aa
              b:
                # | ctx.accounts.vault.address()
                label: "ctx.accounts.vault.address()"  # @src=c7cea914f1e4
                # | It is not only a rename — Pubkey became Address, out of a crate the
                # | runtime layer already pulled in, so the type on the left of your let
                # | changes too.
                feedback: "Não é só uma renomeação — Pubkey virou Address, saído de um crate que a camada de runtime já trazia, então o tipo do lado esquerdo do seu let muda também."  # @src=ee0e15089f61
              c:
                # | ctx.accounts.vault.to_address()
                label: "ctx.accounts.vault.to_address()"  # @src=3ea80754966b
                # | There is no to_ conversion here — nothing is being converted. The rename
                # | is a straight .key() to .address(), and it reads the address the wrapper
                # | already holds.
                feedback: "Não existe conversão to_ aqui — nada está sendo convertido. A renomeação é um .key() direto para .address(), e ela lê o endereço que o wrapper já guarda."  # @src=a31dfcde84d5
              d:
                # | ctx.accounts.vault.key().into()
                label: "ctx.accounts.vault.key().into()"  # @src=c3c7f03ad29c
                # | .key() is the name your fingers reach for and the one the compiler
                # | rejects first, so converting its result looks like the small fix. There
                # | is nothing to convert from: the V2 wrapper surface exposes .address()
                # | and no .key() at all.
                feedback: ".key() é o nome que os seus dedos buscam e o primeiro que o compilador rejeita, então converter o resultado dele parece a correção pequena. Não há de onde converter: a superfície de wrapper do V2 expõe .address() e nenhum .key()."  # @src=a19e916a8eab
          m01-l3-q3:
            # | You just ran the scaffolded test to invoke the greeter. Which invoke vehicle
            # | did anchor init generate by default in V2?
            prompt: "Você acabou de rodar o teste do scaffold para invocar o greeter. Qual veículo de invocação o anchor init gerou por padrão no V2?"  # @src=ce4df5dae7f8
            # | anchor init offers Mocha, Jest, Rust, Mollusk, and Litesvm; Litesvm is the
            # | #[default], which closes the deploy-and-invoke loop in Rust without writing
            # | any TypeScript. The scaffolded test loads target/deploy/greeter.so with
            # | svm.add_program and sends a transaction in-process, so anchor test never
            # | starts a validator.
            explanation: "O anchor init oferece Mocha, Jest, Rust, Mollusk e Litesvm; Litesvm é o #[default], que fecha o loop de deploy e invocação em Rust sem escrever nenhum TypeScript. O teste do scaffold carrega target/deploy/greeter.so com svm.add_program e envia uma transação in-process, então o anchor test nunca inicia um validador."  # @src=696bcf973213
            options:                 # source order — keep it
              c:
                # | A LiteSVM Rust test running in an in-process VM
                label: "Um teste Rust LiteSVM rodando em uma VM in-process"  # @src=6c84a80df9b4
                # | Whichever template carries #[default] is the file you get, and no
                # | validator starts for any of them. The built .so goes straight into an
                # | in-process VM.
                feedback: "Qualquer template que carregue #[default] é o arquivo que você recebe, e nenhum validador inicia para nenhum deles. O .so construído vai direto para uma VM in-process."  # @src=501a92e83feb
              b:
                # | A Mollusk Rust test running in an in-process VM
                label: "Um teste Rust Mollusk rodando em uma VM in-process"  # @src=52fd9b278a1b
                # | Also in-process, also validator-free — but only one of the five carries
                # | #[default], and it is not this one.
                feedback: "Também in-process, também livre de validador — mas só um dos cinco carrega #[default], e não é este."  # @src=5125a89d714a
              a:
                # | A Mocha TypeScript test wired to @coral-xyz/anchor
                label: "Um teste TypeScript Mocha ligado ao @coral-xyz/anchor"  # @src=4a15cf88f562
                # | Mocha is one of the five templates but not the default, and
                # | @coral-xyz/anchor is the v1 package name — there is no official V2
                # | TypeScript package to import yet.
                feedback: "Mocha é um dos cinco templates, mas não é o default, e @coral-xyz/anchor é o nome do pacote do v1 — ainda não existe pacote TypeScript oficial do V2 para importar."  # @src=832ad63a6dcd
              d:
                # | A Jest TypeScript test run against Surfpool
                label: "Um teste TypeScript Jest rodado contra o Surfpool"  # @src=6434b56a33ee
                # | Jest is genuinely one of the five templates, and Surfpool is genuinely
                # | the validator behind anchor test, so both halves exist. Neither is what
                # | #[default] marks, and the template that carries it needs no validator at
                # | all.
                feedback: "Jest é genuinamente um dos cinco templates, e Surfpool é genuinamente o validador por trás do anchor test, então as duas metades existem. Nenhum dos dois é o que o #[default] marca, e o template que o carrega não precisa de validador nenhum."  # @src=0d58daff187a
              e:
                # | A bare Rust test driving a local validator
                label: "Um teste Rust puro conduzindo um validador local"  # @src=41cc39026051
                # | Rust is one of the five templates and this describes it accurately. The
                # | one carrying #[default] is Litesvm, which loads the built .so into an
                # | in-process VM rather than talking to a validator.
                feedback: "Rust é um dos cinco templates e isto descreve ele com precisão. O que carrega #[default] é o Litesvm, que carrega o .so construído para uma VM in-process em vez de conversar com um validador."  # @src=07b18e965ffb
  m01-l4:
    # | #[derive(Accounts)], dispatch, discriminators & errors
    title: "#[derive(Accounts)], despacho, discriminators e erros"  # @src=1ac4977d7f5b
    blocks:
      discriminator-preimage:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | An instruction handler is NOT hashed from "instruction:" — Anchor uses the
          # | "global:" namespace.
          0: "Um handler de instrução NÃO tem hash a partir de \"instruction:\" — o Anchor usa o namespace \"global:\"."  # @src=c0364acc64b4
          # | Fill in `namespace`: it is a `const fn`, and `match` cannot compare `&str`
          # | there (string equality is a trait call), so match on `item_kind.as_bytes()`
          # | with byte-string patterns like `b"instruction"`. `discriminator_preimage`
          # | already does the concatenation.
          1: "Preencha `namespace`: ele é um `const fn`, e `match` não consegue comparar `&str` ali (igualdade de string é uma chamada de trait), então faça match em `item_kind.as_bytes()` com padrões de byte-string como `b\"instruction\"`. `discriminator_preimage` já faz a concatenação."  # @src=9cfd1ae450dc
        tests:                      # keyed by test case id
          t1:
            # | an account struct hashes from the account: namespace
            description: "uma struct de conta faz hash a partir do namespace account:"  # @src=372314ad2abd
          t2:
            # | an instruction handler hashes from global:, not instruction:
            description: "um handler de instrução faz hash a partir de global:, não de instruction:"  # @src=6e69969985bc
          t3:
            # | an event struct hashes from the event: namespace
            description: "uma struct de evento faz hash a partir do namespace event:"  # @src=43c422808566
          t4:
            # | the SAME name under a different item kind takes a different namespace: the
            # | prefix comes from item_kind, never from the name
            description: "o MESMO nome sob um tipo de item diferente recebe um namespace diferente: o prefixo vem de item_kind, nunca do nome"  # @src=bb67499c1de5
          t5:
            # | a second instruction handler is also global:, so the mapping is on the kind
            # | rather than on one special-cased name
            description: "um segundo handler de instrução também é global:, então o mapeamento é no tipo e não em um nome tratado como caso especial"  # @src=70fecdf59d7f
      check:                      # quiz
        questions:
          m01-l4-q1:
            # | You pass the same account twice into one instruction, both marked mut,
            # | without unsafe(dup). What happens in V2, and where?
            prompt: "Você passa a mesma conta duas vezes para uma instrução, as duas marcadas com mut, sem unsafe(dup). O que acontece no V2, e onde?"  # @src=2d39d3d0d03d
            # | MUT_MASK is a compile-time associated const, but the duplicate collision is
            # | walked and rejected at runtime in the dispatcher; the compile error is
            # | specifically about writing dup instead of unsafe(dup). Mechanically: the
            # | dispatcher walks the incoming account views, sets a bit for every slot whose
            # | address it has already seen, and ANDs that bitvec against the struct's
            # | 256-bit MUT_MASK in one four-word test. Any surviving bit returns
            # | ConstraintDuplicateMutableAccount from the dispatcher — before try_accounts
            # | loads a single field and long before your handler body runs.
            explanation: "MUT_MASK é uma const associada de tempo de compilação, mas a colisão de duplicatas é percorrida e rejeitada em tempo de execução no dispatcher; o erro de compilação é especificamente sobre escrever dup em vez de unsafe(dup). Mecanicamente: o dispatcher percorre as views de conta que chegam, liga um bit para cada slot cujo endereço ele já viu, e faz o AND desse bitvec contra a MUT_MASK de 256 bits da struct em um único teste de quatro palavras. Qualquer bit sobrevivente retorna ConstraintDuplicateMutableAccount a partir do dispatcher — antes de try_accounts carregar um único campo e muito antes de o corpo do seu handler rodar."  # @src=3557d2d0efcf
            options:                 # source order — keep it
              d:
                # | Rejected inside try_accounts, at the point the second field's load finds
                # | its address already seen
                label: "Rejeitado dentro de try_accounts, no ponto em que o carregamento do segundo campo acha o endereço dele já visto"  # @src=edd8e8a9a16b
                # | Right that it is a runtime rejection and right that it lands before your
                # | handler, wrong about which floor it happens on. try_accounts loads and
                # | constrains fields one at a time and never sees the whole account list;
                # | the duplicate walk runs ahead of it in the dispatcher, so no field has
                # | loaded when the rejection fires.
                feedback: "Certo que é uma rejeição em tempo de execução e certo que ela aterrissa antes do seu handler, errado sobre em que andar isso acontece. try_accounts carrega e aplica constraints nos campos um por vez e nunca vê a lista de contas inteira; a varredura de duplicatas roda adiante dele, no dispatcher, então nenhum campo carregou quando a rejeição dispara."  # @src=c5a282b851f9
              a:
                # | Rejected at runtime by the dispatcher's duplicate walk, before
                # | try_accounts loads any field
                label: "Rejeitado em tempo de execução pela varredura de duplicatas do dispatcher, antes de try_accounts carregar qualquer campo"  # @src=b1b9ea1c09ff
                # | The two halves run on different clocks: writability is fixed when the
                # | struct compiles, addresses only become comparable when a call arrives.
                # | Nothing is deserialized before the walk says no.
                feedback: "As duas metades rodam em relógios diferentes: a permissão de escrita é fixada quando a struct compila, endereços só ficam comparáveis quando uma chamada chega. Nada é desserializado antes de a varredura dizer não."  # @src=67072137ea46
              b:
                # | It compiles and runs, and the second serialize-on-exit silently clobbers
                # | the first write
                label: "Compila e roda, e a segunda serialização-na-saída atropela silenciosamente a primeira escrita"  # @src=d9b15736cf9b
                # | That silent clobber is exactly the aliasing bug V2 closes: duplicate
                # | mutables are disallowed by default, so the call is rejected rather than
                # | letting the second write win.
                feedback: "Esse atropelo silencioso é exatamente o bug de aliasing que o V2 fecha: mutáveis duplicados são proibidos por padrão, então a chamada é rejeitada em vez de deixar a segunda escrita ganhar."  # @src=f1f35d348942
              c:
                # | It is a compile error: MUT_MASK detects that two fields of the same type
                # | are both marked mut
                label: "É um erro de compilação: MUT_MASK detecta que dois campos do mesmo tipo estão os dois marcados com mut"  # @src=b61e13bfdf67
                # | MUT_MASK only encodes shape — which slots are mut — and two mut fields
                # | of the same type are perfectly legal to declare. The compile error in V2
                # | is about writing plain dup instead of unsafe(dup), not about a
                # | collision.
                feedback: "MUT_MASK só codifica formato — quais slots são mut — e dois campos mut do mesmo tipo são perfeitamente legais de declarar. O erro de compilação no V2 é sobre escrever dup puro em vez de unsafe(dup), não sobre uma colisão."  # @src=41f968a74b91
          m01-l4-q2:
            # | Your program's custom #[error_code] enum's third variant fires (no offset
            # | override). What on-wire code do clients see?
            prompt: "A terceira variante do enum #[error_code] customizado do seu programa dispara (sem override de offset). Que código no wire os clientes veem?"  # @src=c2e6839b3dec
            # | Framework constraint errors sit in the 2000s; custom #[error_code] starts at
            # | 6000, so the third variant (zero-based index 2) is 6002 unless offset is
            # | overridden.
            explanation: "Erros de constraint do framework ficam nos 2000s; #[error_code] customizado começa em 6000, então a terceira variante (índice base zero 2) é 6002 a menos que offset seja sobrescrito."  # @src=e5c017e6a2c8
            options:                 # source order — keep it
              c:
                # | 6003 — the custom band starts at 6000 and numbers variants from 1
                label: "6003 — a banda customizada começa em 6000 e numera as variantes a partir de 1"  # @src=a45fb24929c7
                # | The base itself is the first variant: index 0 is 6000, so the third
                # | variant is 6002. Nothing counts from 1 unless you shift the base with
                # | #[error_code(offset = N)].
                feedback: "A própria base é a primeira variante: o índice 0 é 6000, então a terceira variante é 6002. Nada conta a partir de 1 a menos que você desloque a base com #[error_code(offset = N)]."  # @src=633e603722a3
              b:
                # | 6002 — the custom band starts at 6000 and is zero-indexed by variant
                label: "6002 — a banda customizada começa em 6000 e é indexada a partir de zero por variante"  # @src=0ceb6574664a
                # | Counting starts at the base: variant one is 6000 flat, and nothing
                # | shifts unless you set an explicit offset. Four thousand below sits the
                # | framework's own constraint band.
                feedback: "A contagem começa na base: a variante um é 6000 na lata, e nada desloca a menos que você defina um offset explícito. Quatro mil abaixo fica a banda de constraint do próprio framework."  # @src=630fe1cd00a3
              e:
                # | 3 - the on-wire code is the variant index; 6000 is a display offset
                label: "3 - o código no wire é o índice da variante; 6000 é um offset de exibição"  # @src=ae539911ccfc
                # | It would be tidy if the base were only a rendering detail, and decoded
                # | errors really do get pretty-printed by clients. The base is part of the
                # | number that crosses the wire, which is precisely what keeps your codes
                # | from colliding with the framework's.
                feedback: "Seria organizado se a base fosse só um detalhe de renderização, e erros decodificados de fato são impressos de forma amigável pelos clientes. A base é parte do número que cruza o wire, que é precisamente o que impede os seus códigos de colidir com os do framework."  # @src=af43d667a53e
              d:
                # | 6100 - the custom band starts at 6000 and steps by 100 per variant
                label: "6100 - a banda customizada começa em 6000 e dá passos de 100 por variante"  # @src=60225fdeef99
                # | Error classes do step in round numbers, which is where this comes from:
                # | 100 for instruction errors, 2000 for constraints, 6000 for yours. Inside
                # | the custom band the step is one, so variant zero is 6000, variant one
                # | 6001, variant two 6002.
                feedback: "Classes de erro de fato sobem em números redondos, que é de onde isso vem: 100 para erros de instrução, 2000 para constraints, 6000 para os seus. Dentro da banda customizada o passo é um, então a variante zero é 6000, a variante um 6001, a variante dois 6002."  # @src=76a7eedfeb42
              a:
                # | 2003 — custom #[error_code] variants land in the 2000s constraint band
                label: "2003 — variantes de #[error_code] customizado aterrissam na banda de constraint dos 2000s"  # @src=78ce1ab5bec5
                # | The 2000s are the framework's own constraint band (ConstraintHasOne =
                # | 2001, ConstraintDuplicateMutableAccount lives there too). Your declared
                # | errors never land there; they start at 6000.
                feedback: "Os 2000s são a banda de constraint do próprio framework (ConstraintHasOne = 2001, ConstraintDuplicateMutableAccount mora lá também). Os erros que você declara nunca aterrissam ali; eles começam em 6000."  # @src=36dfd048db58
          m01-l4-q3:
            # | You just completed the discriminator-preimage challenge. Anchor hashes an
            # | INSTRUCTION handler's discriminator from which preimage namespace?
            prompt: "Você acabou de completar o challenge discriminator-preimage. O Anchor faz hash do discriminator de um handler de INSTRUÇÃO a partir de qual namespace de preimage?"  # @src=e789b2eaf643
            # | Accounts hash from account:, events from event:, and instruction handlers
            # | from global: — the global namespace is the one that surprises people.
            explanation: "Contas fazem hash a partir de account:, eventos a partir de event:, e handlers de instrução a partir de global: — o namespace global é o que surpreende as pessoas."  # @src=49c949b17429
            options:                 # source order — keep it
              e:
                # | "program:" - e.g. sha256("program:increment")
                label: "\"program:\" - por exemplo sha256(\"program:increment\")"  # @src=9e386d103125
                # | The handler does live inside the #[program] module, so naming its
                # | namespace after that module is a fair inference. The three are account:,
                # | event: and global:, and the handler one is global: for a historical
                # | reason rather than a structural one.
                feedback: "O handler de fato mora dentro do módulo #[program], então nomear o namespace dele a partir desse módulo é uma inferência justa. Os três são account:, event: e global:, e o do handler é global: por uma razão histórica em vez de uma estrutural."  # @src=7463d36f85d8
              a:
                # | "instruction:" — e.g. sha256("instruction:increment")
                label: "\"instruction:\" — por exemplo sha256(\"instruction:increment\")"  # @src=6a538ea555b3
                # | This is the trap the challenge targets — Anchor uses the "global:"
                # | namespace for instruction handlers, not "instruction:".
                feedback: "É essa a armadilha que o challenge tem como alvo — o Anchor usa o namespace \"global:\" para handlers de instrução, não \"instruction:\"."  # @src=90fd205ec54d
              c:
                # | "global:" — e.g. sha256("global:increment")[..8]
                label: "\"global:\" — por exemplo sha256(\"global:increment\")[..8]"  # @src=52cef50d5b90
                # | Three preimage namespaces exist and each is keyed to a different kind of
                # | declaration. The handler one surprises people because that word never
                # | appears anywhere in the source you actually wrote.
                feedback: "Existem três namespaces de preimage e cada um está atrelado a um tipo diferente de declaração. O do handler surpreende as pessoas porque essa palavra nunca aparece em lugar nenhum do código que você de fato escreveu."  # @src=af5677368951
              d:
                # | "ix:" - e.g. sha256("ix:increment")[..8]
                label: "\"ix:\" - por exemplo sha256(\"ix:increment\")[..8]"  # @src=771af3f2ba15
                # | ix is the ecosystem's own shorthand for an instruction, so it reads like
                # | the obvious namespace to pick. Three namespaces exist and this is not
                # | among them; a handler hashes from global:.
                feedback: "ix é a abreviação do próprio ecossistema para uma instrução, então soa como o namespace óbvio de escolher. Existem três namespaces e este não está entre eles; um handler faz hash a partir de global:."  # @src=688d89cb1f36
              b:
                # | "handler:" — e.g. sha256("handler:increment")
                label: "\"handler:\" — por exemplo sha256(\"handler:increment\")"  # @src=7c63ba4e7e7c
                # | There is no "handler:" namespace; instruction handlers hash from
                # | "global:".
                feedback: "Não existe namespace \"handler:\"; handlers de instrução fazem hash a partir de \"global:\"."  # @src=af1e09a97238
          m01-l4-q4:
            # | You consider enabling #[discrim = N] compact discriminators to shrink your
            # | instruction tags. What is the honest trade-off?
            prompt: "Você considera habilitar discriminators compactos #[discrim = N] para encolher as suas tags de instrução. Qual é o trade-off honesto?"  # @src=028d8f947ac6
            # | Discriminators are v1-compatible by default; #[discrim = N] is an
            # | all-or-nothing-per-program compaction with prefix-ambiguity validation,
            # | trading v1 wire-compat for smaller instruction tags. That extra validation
            # | exists because variable-width integer tags could otherwise alias each other
            # | by prefix, which fixed 8-byte sha256 tags never can.
            explanation: "Discriminators são compatíveis com v1 por padrão; #[discrim = N] é uma compactação tudo-ou-nada-por-programa com validação de ambiguidade de prefixo, trocando a compat de wire v1 por tags de instrução menores. Essa validação extra existe porque tags de inteiro de largura variável poderiam de outro jeito dar alias uma na outra por prefixo, coisa que tags sha256 de 8 bytes fixos nunca podem."  # @src=46e1556ea850
            options:                 # source order — keep it
              a:
                # | It is per-instruction opt-in, so you can freely mix compact and default
                # | 8-byte discriminators in one program
                label: "É opt-in por instrução, então você pode misturar livremente discriminators compactos e os de 8 bytes default em um programa"  # @src=84b34898ff03
                # | Compaction is a program-wide switch: every handler's tag is compacted
                # | and prefix-ambiguity-validated together, so there is no per-instruction
                # | mix of compact and 8-byte sha256 tags.
                feedback: "A compactação é uma chave que vale para o programa inteiro: a tag de todo handler é compactada e validada contra ambiguidade de prefixo em conjunto, então não existe mistura por instrução de tags compactas e de tags sha256 de 8 bytes."  # @src=136b59e4a95f
              d:
                # | Compaction is on by default in V2, and #[discrim = N] is usually how you
                # | opt back into 8-byte tags
                label: "A compactação vem ligada por padrão no V2, e #[discrim = N] é em geral como você faz opt-in de volta para tags de 8 bytes"  # @src=de0e99d24b27
                # | V2 flipped enough defaults that assuming it flipped this one too is a
                # | reasonable bet. It did not: the 8-byte sha256 tag stays the default
                # | precisely because it keeps v1 wire-compatibility for free, and #[discrim
                # | = N] is the opt-in that trades that away.
                feedback: "O V2 virou defaults suficientes para que presumir que ele virou este também seja uma aposta razoável. Não virou: a tag sha256 de 8 bytes continua o default precisamente porque ela mantém a compatibilidade de wire v1 de graça, e #[discrim = N] é o opt-in que troca isso fora."  # @src=f4abbae52b1d
              c:
                # | It keeps the 8-byte width but swaps sha256 for a cheaper hash, so
                # | client-built tags stop matching
                label: "Mantém a largura de 8 bytes mas troca sha256 por um hash mais barato, então tags montadas pelo cliente param de bater"  # @src=db5fda8e4582
                # | The compaction is not about the hash function: #[discrim = N] replaces
                # | the 8-byte sha256 prefix with a small literal integer tag — no hashing
                # | at all — so it is the width that changes, not the algorithm.
                feedback: "A compactação não é sobre a função de hash: #[discrim = N] substitui o prefixo sha256 de 8 bytes por uma tag de inteiro literal pequena — nenhum hash — então é a largura que muda, não o algoritmo."  # @src=90b1685b22a6
              b:
                # | It is all-or-nothing per program: you save instruction bytes and CU, but
                # | drop default v1 wire-compatibility
                label: "É tudo-ou-nada por programa: você economiza bytes de instrução e CU, mas abre mão da compatibilidade de wire v1 default"  # @src=52c659fecc14
                # | Small integer tags can alias by prefix, so the whole program's tag set
                # | has to be validated at once — a hazard fixed-width hashes never had,
                # | which is why nothing checks for it until you opt in.
                feedback: "Tags de inteiro pequenas podem dar alias por prefixo, então o conjunto de tags do programa inteiro tem que ser validado de uma vez — um risco que hashes de largura fixa nunca tiveram, que é por que nada checa isso até você fazer opt-in."  # @src=8f9a0bc56bf0
  m02-l1:
    # | Account<T> is zero-copy by default
    title: "Account<T> é zero-copy por padrão"  # @src=8eaaaf66147a
    blocks:
      check:                      # quiz
        questions:
          m02-l1-q1:
            # | You add a plain bool field to your Pod cabinet struct and the program
            # | suddenly won't compile. What's the real reason, and the fix?
            prompt: "Você adiciona um campo bool puro à sua struct Pod cabinet e o programa de repente não compila. Qual é o motivo de verdade, e a correção?"  # @src=748f36f68ada
            # | Pod requires every possible bit pattern to be a valid value. bool has only
            # | two valid bytes (0 and 1), so bytemuck refuses to treat arbitrary bytes as a
            # | bool. PodBool wraps a u8 whose every pattern is defined, keeping the direct
            # | byte cast sound — the alignment/no-padding discipline in miniature.
            explanation: "Pod exige que todo padrão de bits possível seja um valor válido. bool tem só dois bytes válidos (0 e 1), então bytemuck se recusa a tratar bytes arbitrários como um bool. PodBool embrulha um u8 cujos padrões são todos definidos, mantendo o cast direto de bytes sólido — a disciplina de alinhamento/sem-preenchimento em miniatura."  # @src=2f72711ab2d4
            options:                 # source order — keep it
              c:
                # | The 8-byte sha256 discriminator has to be re-derived by hand whenever a
                # | struct's field layout changes.
                label: "O discriminator sha256 de 8 bytes tem que ser re-derivado à mão sempre que o layout de campos de uma struct muda."  # @src=1d9acdf9d694
                # | The discriminator is derived from the type name, not from its fields,
                # | and it is a runtime tag on the first 8 bytes — it could never surface as
                # | a compile error about a field's type.
                feedback: "O discriminator é derivado do nome do tipo, não dos campos dele, e é uma tag de runtime nos primeiros 8 bytes — ele nunca poderia aparecer como um erro de compilação sobre o tipo de um campo."  # @src=f9672d7b6ca8
              a:
                # | Account<T> = Slab<T, HeaderOnly> admits only fixed-width numeric fields,
                # | so a bool is banned outright.
                label: "Account<T> = Slab<T, HeaderOnly> admite só campos numéricos de largura fixa, então um bool é banido de saída."  # @src=d8066ee6c4c7
                # | The bound is Pod-ness, not numeric-ness. Slab happily holds any Pod
                # | field, including the one-byte PodBool wrapper, so booleans are not
                # | banned — bare bool just isn't castable.
                feedback: "O bound é ser Pod, não ser numérico. Slab guarda sem problema qualquer campo Pod, incluindo o wrapper PodBool de um byte, então booleanos não são banidos — o bool puro é que não aceita cast."  # @src=62b0724a1d19
              d:
                # | A 1-byte bool after a PodU64 usually opens 7 bytes of padding, and Pod
                # | forbids padding; reorder the fields
                label: "Um bool de 1 byte depois de um PodU64 normalmente abre 7 bytes de preenchimento, e Pod proíbe preenchimento; reordene os campos"  # @src=d4f03ba09d76
                # | Padding is a real Pod failure and field order is a real fix for it,
                # | which is exactly why this reads correctly. It is the wrong failure here:
                # | a bare bool is rejected because 254 of its 256 byte patterns are
                # | undefined, so no ordering makes it castable. PodBool does.
                feedback: "Preenchimento é uma falha de Pod real e ordem de campos é uma correção real para ela, que é exatamente por que isto se lê como correto. É a falha errada aqui: um bool puro é rejeitado porque 254 dos seus 256 padrões de bytes são indefinidos, então nenhuma ordenação faz ele aceitar cast. PodBool faz."  # @src=75e90090d485
              b:
                # | bool isn't Pod because not every bit pattern is a valid bool, so
                # | bytemuck rejects it — use PodBool.
                label: "bool não é Pod porque não é todo padrão de bits que é um bool válido, então bytemuck rejeita ele — use PodBool."  # @src=074dd2143d42
                # | Two of 256 byte values are a legal bool, and Pod wants all 256 to mean
                # | something. Wrap it in a byte whose whole range is defined and the
                # | contract holds again. Booleans were never the problem.
                feedback: "Dois de 256 valores de byte são um bool legal, e Pod quer que todos os 256 signifiquem algo. Embrulhe ele num byte cuja faixa inteira é definida e o contrato volta a valer. Booleanos nunca foram o problema."  # @src=b2ebc964bf9b
          m02-l1-q2:
            # | Your LiteSVM test reads account.data and the fields look shifted by 8 bytes
            # | from what you wrote. What happened?
            prompt: "O seu teste LiteSVM lê account.data e os campos parecem deslocados em 8 bytes do que você escreveu. O que aconteceu?"  # @src=dadd8315a636
            # | V2 keeps the sha256 discriminator unchanged and Account<T> = Slab<T,
            # | HeaderOnly> lays the Pod body immediately after that 8-byte header. Cast
            # | from data[8..] with bytemuck::from_bytes and the fields line up.
            explanation: "O V2 mantém o discriminator sha256 inalterado e Account<T> = Slab<T, HeaderOnly> deita o corpo Pod logo depois desse header de 8 bytes. Faça cast a partir de data[8..] com bytemuck::from_bytes e os campos se alinham."  # @src=b761b01c9289
            options:                 # source order — keep it
              a:
                # | bytemuck::from_bytes dropped the struct's first PodU64 field.
                label: "bytemuck::from_bytes descartou o primeiro campo PodU64 da struct."  # @src=b8d45171a99d
                # | from_bytes reinterprets a byte range in place; it never drops or
                # | reorders fields. Nothing was lost — you're just reading from the wrong
                # | offset.
                feedback: "from_bytes reinterpreta uma faixa de bytes no lugar; ele nunca descarta nem reordena campos. Nada foi perdido — você só está lendo do offset errado."  # @src=8670ac9eff96
              b:
                # | LiteSVM writes PodU64 fields big-endian; the runtime writes them
                # | little-endian.
                label: "O LiteSVM escreve campos PodU64 em big-endian; o runtime escreve eles em little-endian."  # @src=c2d216c50286
                # | LiteSVM is the same SVM, byte for byte, and PodU64 stores little-endian
                # | in both. An endianness flip would scramble each value, not slide every
                # | field down by eight bytes.
                feedback: "O LiteSVM é a mesma SVM, byte por byte, e PodU64 guarda little-endian nos dois. Uma inversão de endianness embaralharia cada valor, não empurraria todo campo oito bytes para baixo."  # @src=7a7ac32c035d
              c:
                # | The 8-byte discriminator still precedes the Pod body — you must cast
                # | from data[8..].
                label: "O discriminator de 8 bytes ainda vem antes do corpo Pod — você tem que fazer cast a partir de data[8..]."  # @src=89707d831fd4
                # | The header survived the rewrite untouched, and the flat body begins
                # | immediately behind it. Skip those eight bytes on the test side and every
                # | offset realigns; nothing was dropped or reordered.
                feedback: "O header sobreviveu à reescrita intocado, e o corpo plano começa logo atrás dele. Pule esses oito bytes do lado do teste e todo offset se realinha; nada foi descartado nem reordenado."  # @src=207946087733
              d:
                # | get_account hands back the runtime's own account header ahead of your
                # | data
                label: "get_account devolve o próprio header de conta do runtime na frente dos seus dados"  # @src=d753e8a7d53f
                # | Account metadata and account data are easy to blur, and a fixed-size
                # | preamble is the right shape for the symptom you are seeing. The
                # | lamports, owner and executable flag ride outside .data; the eight bytes
                # | in front of your fields are the discriminator your own program wrote.
                feedback: "Metadados de conta e dados de conta são fáceis de confundir, e um preâmbulo de tamanho fixo é a forma certa para o sintoma que você está vendo. Os lamports, o owner e a flag executable ficam fora do .data; os oito bytes na frente dos seus campos são o discriminator que o seu próprio programa escreveu."  # @src=e0ff5bf41805
          m02-l1-q3:
            # | A teammate says V2 made their two-field counter 8.8x cheaper. How should
            # | your own docs report that figure?
            prompt: "Um colega de equipe diz que o V2 deixou o contador de dois campos dele 8.8x mais barato. Como a sua própria documentação deve relatar essa figura?"  # @src=931c6a1f8350
            # | PR #4914 revised the headline down to 8.8x average CU and 94% bytecode, and
            # | the benchmark page warns the alpha values can move. Small programs see
            # | little benefit. Report it as an approximate, moving average — the same
            # | reason the course centralizes and freshness-notes every number. Concretely,
            # | in your own docs: cite it as an average across a benchmark family rather
            # | than a per-instruction promise, note that it was revised down from 9.9x, and
            # | never attach it to a specific program — least of all a two-field counter,
            # | which is the worst case for the gain.
            explanation: "O PR #4914 revisou a manchete para baixo, para 8.8x de CU média e 94% de bytecode, e a página do benchmark avisa que os valores da alpha podem mudar. Programas pequenos veem pouco benefício. Relate como uma média aproximada e em movimento — a mesma razão por que o curso centraliza e põe uma freshness note em cada número. Concretamente, na sua própria documentação: cite como uma média sobre uma família de benchmarks em vez de uma promessa por instrução, registre que foi revisada para baixo de 9.9x, e nunca grude em um programa específico — menos ainda num contador de dois campos, que é o pior caso para o ganho."  # @src=2361bbab72d0
            options:                 # source order — keep it
              c:
                # | As a figure that kicks in once the account exceeds the 10,240-byte
                # | zero-copy init limit.
                label: "Como uma figura que entra em ação quando a conta passa do limite de init zero-copy de 10,240 bytes."  # @src=5b82286bc29a
                # | That 10,240-byte limit governs how large an account init can create, not
                # | where CU savings appear. There is no size gate on the benchmark — tiny
                # | programs simply have the least deserialize cost to erase.
                feedback: "Esse limite de 10,240 bytes governa o tamanho da conta que um init consegue criar, não onde a economia de CU aparece. Não existe trava de tamanho no benchmark — programas minúsculos simplesmente têm o menor custo de desserialização para apagar."  # @src=85ff62128ed1
              d:
                # | As the 94% smaller-bytecode figure instead, since a size number does not
                # | drift the way a CU average does
                label: "Como a figura de 94% menos bytecode em vez dela, já que um número de tamanho não deriva do jeito que uma média de CU deriva"  # @src=dce55578861b
                # | Reaching for the sturdier-looking metric is a sound instinct when a
                # | number keeps moving. Both numbers moved in the same commit, 95% to 94%
                # | alongside 9.9x to 8.8x, so the size figure needs the same date stamp and
                # | the same hedge the CU one does.
                feedback: "Buscar a métrica de aparência mais firme é um instinto saudável quando um número não para de se mexer. Os dois números mudaram no mesmo commit, 95% para 94% junto com 9.9x para 8.8x, então a figura de tamanho precisa do mesmo selo de data e da mesma ressalva que a de CU precisa."  # @src=35b5b9ee2deb
              b:
                # | As a guaranteed per-instruction speedup a V2 program inherits just by
                # | compiling on the RC.
                label: "Como um ganho de velocidade por instrução garantido que um programa V2 herda só por compilar no RC."  # @src=f2ef56ce016e
                # | It's an average across a benchmark family, not a per-program guarantee;
                # | the benchmark page itself warns the alpha values move as codegen
                # | changes, and a two-field counter is its worst case.
                feedback: "É uma média sobre uma família de benchmarks, não uma garantia por programa; a própria página do benchmark avisa que os valores da alpha se movem conforme o codegen muda, e um contador de dois campos é o pior caso dela."  # @src=2134c75e02df
              a:
                # | As an approximate benchmark-family average, already revised down once
                # | and expected to keep moving.
                label: "Como uma média aproximada de família de benchmarks, já revisada para baixo uma vez e com expectativa de continuar se mexendo."  # @src=d1f01ece83bf
                # | A number whose own authors have already trimmed it once should travel
                # | with that history attached. Pin it to one program and you will be wrong
                # | in the least forgiving direction: the leanest handlers gain least.
                feedback: "Um número que os próprios autores já cortaram uma vez deve viajar com essa história grudada. Fixe ele em um programa só e você vai errar na direção menos perdoável: os handlers mais enxutos ganham menos."  # @src=58fbfa1406dc
  m02-l2:
    # | Pod data types, lists in an account, and zero-copy events
    title: "Tipos de dados Pod, listas numa conta e eventos zero-copy"  # @src=800d0e2fa5e3
    blocks:
      high-score-cutoff:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | While board.len() < cap, every score is admitted — no comparison needed.
          0: "Enquanto board.len() < cap, todo score é admitido — nenhuma comparação necessária."  # @src=99e8018d3372
          # | When the board is full, the decision is `beats_cutoff` — implement it
          # | (strictly greater gets in, ties do not) and route the full-board branch of
          # | `admit` through it.
          1: "Quando o board está cheio, a decisão é `beats_cutoff` — implemente ele (estritamente maior entra, empate não) e roteie por ele o ramo de board cheio do `admit`."  # @src=7040a0497042
          # | Sort highest-first, truncate to cap, and return the last (smallest) retained
          # | score — the truncate matters even for a board that arrives over capacity.
          2: "Ordene do maior para o menor, trunque em cap, e devolva o último (menor) score retido — o truncate importa até para um board que chega acima da capacidade."  # @src=3af55e17f97a
        tests:                      # keyed by test case id
          t1:
            # | a new high score evicts the lowest and becomes the new cutoff
            description: "um novo recorde despeja o menor e vira o novo cutoff"  # @src=3988dce343b5
          t2:
            # | a score below the cutoff is rejected on a full board
            description: "um score abaixo do cutoff é rejeitado num board cheio"  # @src=9a31c167660b
          t3:
            # | a score is admitted freely while the board is under capacity
            description: "um score é admitido livremente enquanto o board está abaixo da capacidade"  # @src=29d4fdc7243f
          t4:
            # | the first score on an empty board is the cutoff
            description: "o primeiro score num board vazio é o cutoff"  # @src=34662de83279
          t5:
            # | a score that only ties the cutoff leaves the cutoff exactly where it was
            description: "um score que só empata com o cutoff deixa o cutoff exatamente onde ele estava"  # @src=6476fe4e4ef4
          t6:
            # | an over-capacity board must be trimmed to cap: with 95 admitted the retained
            # | top 3 are 100/95/90, so the cutoff is 90 and not the 70 an untrimmed board
            # | would report
            description: "um board acima da capacidade tem que ser aparado em cap: com 95 admitido, o top 3 retido é 100/95/90, então o cutoff é 90 e não o 70 que um board não aparado reportaria"  # @src=10d3100279da
          t7:
            # | the trim happens even when the new score is rejected: the retained top 3 are
            # | 100/90/80
            description: "o aparo acontece mesmo quando o novo score é rejeitado: o top 3 retido é 100/90/80"  # @src=6d1465349f60
      check:                      # quiz
        questions:
          m02-l2-q1:
            # | Your high-score Slab has MAX = 10 and is full when a player posts an 11th,
            # | higher score. What does the Slab do on its own?
            prompt: "O seu Slab de recordes tem MAX = 10 e está cheio quando um jogador posta um 11º score, mais alto. O que o Slab faz sozinho?"  # @src=a2239d87d471
            # | A Pod list has a compile-time capacity. You size for the worst case and
            # | manage insertion and eviction yourself; a write past MAX is a hard error.
            # | That fixed cap is exactly the price of a serialization-free list — the point
            # | of the high-score-cutoff challenge. The Slab does have one escape valve,
            # | resize_to_capacity(n), which reallocs the account and settles the rent
            # | difference — but it is an instruction you deliberately run, never a side
            # | effect of try_push, and nothing grows behind your back.
            explanation: "Uma lista Pod tem capacidade de tempo de compilação. Você dimensiona para o pior caso e cuida da inserção e do despejo você mesmo; uma escrita além de MAX é um erro duro. Esse limite fixo é exatamente o preço de uma lista sem serialização — o ponto do challenge high-score-cutoff. O Slab tem sim uma válvula de escape, resize_to_capacity(n), que realoca a conta e acerta a diferença de rent — mas é uma instrução que você roda de propósito, nunca um efeito colateral do try_push, e nada cresce nas suas costas."  # @src=9cc6bbf61ae9
            options:                 # source order — keep it
              d:
                # | It wraps to slot 0 like a ring buffer, so the eleventh post overwrites
                # | the oldest one
                label: "Ele dá a volta para o slot 0 feito um ring buffer, então o décimo primeiro post sobrescreve o mais antigo"  # @src=5a2a592529fa
                # | A fixed-capacity buffer that wraps is a familiar shape, and it would
                # | make try_push infallible, which is the tell that this is not it.
                # | try_push past capacity returns an Err, and which entry to drop is a
                # | policy the Slab has no opinion about.
                feedback: "Um buffer de capacidade fixa que dá a volta é uma forma familiar, e ela deixaria try_push infalível, que é a pista de que não é isso. try_push além da capacidade devolve um Err, e qual entrada descartar é uma política sobre a qual o Slab não tem opinião nenhuma."  # @src=7470c3c5342f
              a:
                # | It calls resize_to_capacity(11) for you, so try_push still succeeds on a
                # | full board.
                label: "Ele chama resize_to_capacity(11) para você, então try_push ainda funciona num board cheio."  # @src=77e8e7580a26
                # | resize_to_capacity(n) is a real Slab method, but it is an explicit call
                # | that reallocs the account and settles rent. try_push past capacity
                # | returns an Err; it never reallocs behind your back.
                feedback: "resize_to_capacity(n) é um método real do Slab, mas é uma chamada explícita que realoca a conta e acerta o rent. try_push além da capacidade devolve um Err; ele nunca realoca nas suas costas."  # @src=9c11acc6a2a0
              b:
                # | Nothing automatic — you evict yourself; a write past MAX is an error,
                # | not a resize.
                label: "Nada automático — o despejo é você que faz; uma escrita além de MAX é um erro, não um resize."  # @src=09fc8c79a5ed
                # | Capacity is fixed when the type compiles, and the admission policy is
                # | yours. One method does grow the account, but it reallocs and settles
                # | rent, and you call it on purpose.
                feedback: "A capacidade é fixa quando o tipo compila, e a política de admissão é sua. Um método cresce a conta, sim, mas ele realoca e acerta o rent, e você chama ele de propósito."  # @src=75d4b15e1fa9
              c:
                # | It drops the oldest entry for you, using the Slab's live-length field to
                # | find the stalest slot.
                label: "Ele descarta a entrada mais antiga para você, usando o campo de comprimento vivo do Slab para achar o slot mais velho."  # @src=4a14ee855d8d
                # | There is no built-in eviction policy of any kind. The 4-byte length
                # | field tracks how many items are live, not how old they are — admitting
                # | and evicting is logic you write.
                feedback: "Não existe política de despejo embutida de tipo nenhum. O campo de comprimento de 4 bytes rastreia quantos itens estão vivos, não quão velhos eles são — admitir e despejar é lógica que você escreve."  # @src=af85d60fe98b
          m02-l2-q2:
            # | You emit a #[event(bytemuck)] high-score event, but a downstream indexer
            # | built for #[event] can't parse it. Why?
            prompt: "Você emite um evento de recorde #[event(bytemuck)], mas um indexador lá na frente construído para #[event] não consegue fazer o parse dele. Por quê?"  # @src=7d3209a51178
            # | #[event] is wincode/borsh-wire; #[event(bytemuck)] is a zero-copy memcpy —
            # | cheaper by mechanism, though the project publishes no number for that gap
            # | (its 3-10x CU figure compares the plain #[event] against v1's borsh events,
            # | not bytemuck against plain). Both go out via sol_log_data, but the bytes
            # | differ — every consumer must decode with the same variant the program emits.
            # | Both also prefix the payload with the same 8-byte event discriminator, so
            # | the tag match still succeeds and only the decode fails, which is why the
            # | symptom is garbage fields rather than a missing event.
            explanation: "#[event] é wincode/borsh no wire; #[event(bytemuck)] é um memcpy zero-copy — mais barato por mecanismo, embora o projeto não publique número nenhum para essa lacuna (a cifra de 3-10x de CU dele compara o #[event] simples contra os eventos borsh do v1, não bytemuck contra o simples). Os dois saem por sol_log_data, mas os bytes diferem — todo consumidor tem que decodificar com a mesma variante que o programa emite. Os dois também prefixam o payload com o mesmo discriminator de evento de 8 bytes, então o casamento de tag ainda funciona e só o decode falha, que é por que o sintoma é campo lixo em vez de evento faltando."  # @src=1fe1007d918b
            options:                 # source order — keep it
              a:
                # | bytemuck events bypass sol_log_data and write to account data instead,
                # | so nothing lands in the logs.
                label: "Eventos bytemuck contornam sol_log_data e escrevem nos dados da conta, então nada aterrissa nos logs."  # @src=d812a9111855
                # | Both variants lower to sol_log_data and show up as a `Program data:`
                # | line on the confirmed transaction. The event is genuinely in the logs —
                # | the reader just can't decode it.
                feedback: "As duas variantes descem para sol_log_data e aparecem como uma linha `Program data:` na transação confirmada. O evento está genuinamente nos logs — o leitor é que não consegue decodificar ele."  # @src=703b51ff5f77
              d:
                # | Both variants write identical bytes; the reader fails because it decodes
                # | the payload before matching the tag
                label: "As duas variantes escrevem bytes idênticos; o leitor falha porque decodifica o payload antes de casar a tag"  # @src=bd78b6baff2b
                # | Blaming the reader's order of operations is a fair first theory when the
                # | tag matches and the fields come out wrong. The tag matches because both
                # | variants prefix the same 8 bytes; what differs is the payload behind it,
                # | wincode-serialized in one variant and a raw memcpy in the other.
                feedback: "Culpar a ordem das operações do leitor é uma primeira teoria justa quando a tag casa e os campos saem errados. A tag casa porque as duas variantes prefixam os mesmos 8 bytes; o que difere é o payload atrás dela, serializado com wincode numa variante e um memcpy cru na outra."  # @src=2fb80f339f23
              c:
                # | The two variants put different bytes on the wire: a raw memcpy versus
                # | wincode/borsh serialization.
                label: "As duas variantes põem bytes diferentes no wire: um memcpy cru contra serialização wincode/borsh."  # @src=c3be5033c91d
                # | Same syscall, same 8-byte tag: the reader matches the event and then
                # | mis-decodes it, which is why you get nonsense fields instead of silence.
                feedback: "Mesma syscall, mesma tag de 8 bytes: o leitor casa o evento e depois decodifica ele errado, que é por que você recebe campos sem sentido em vez de silêncio."  # @src=79b946a1e1ab
              b:
                # | #[event(bytemuck)] derives a different 8-byte discriminator, so the
                # | reader's tag match never fires.
                label: "#[event(bytemuck)] deriva um discriminator de 8 bytes diferente, então o casamento de tag do leitor nunca dispara."  # @src=5e48db1efc67
                # | The discriminator is derived from the event type the same way in both
                # | variants, so the tag match succeeds. The mismatch is in the payload
                # | bytes that follow those 8 bytes.
                feedback: "O discriminator é derivado do tipo do evento do mesmo jeito nas duas variantes, então o casamento de tag funciona. O descasamento está nos bytes de payload que vêm depois desses 8 bytes."  # @src=e71423780f49
          m02-l2-q3:
            # | You store the board as a bare [Score; 10] and start getting
            # | misaligned-reference warnings when reading a field. What's the right fix?
            prompt: "Você guarda o board como um [Score; 10] puro e começa a receber avisos de referência desalinhada ao ler um campo. Qual é a correção certa?"  # @src=3cb3392046b9
            # | Alignment discipline is the Pod tax. PodU64, #[derive(bytemuck::Pod)], and
            # | Nested<T> keep every field aligned so the direct byte cast is valid — PodU64
            # | stores the value as a [u8; 8] with alignment 1, so it reads correctly from
            # | any offset in the tail. repr(packed) creates the exact misaligned-reference
            # | hazard you're seeing, and dropping to BorshAccount<T> forfeits the whole
            # | reason you're using Pod: you'd be paying a whole-list serialize on every
            # | touch to solve a field-layout problem.
            explanation: "Disciplina de alinhamento é o imposto do Pod. PodU64, #[derive(bytemuck::Pod)] e Nested<T> mantêm todo campo alinhado para que o cast direto de bytes seja válido — PodU64 guarda o valor como um [u8; 8] com alinhamento 1, então ele lê corretamente de qualquer offset na cauda. repr(packed) cria exatamente o risco de referência desalinhada que você está vendo, e cair para BorshAccount<T> abre mão do motivo inteiro de você estar usando Pod: você estaria pagando um serialize da lista inteira a cada toque para resolver um problema de layout de campo."  # @src=f24e026269fc
            options:                 # source order — keep it
              c:
                # | Move the account to BorshAccount<Cabinet> with a Vec<Score>, since borsh
                # | reads at any offset.
                label: "Mova a conta para BorshAccount<Cabinet> com um Vec<Score>, já que o borsh lê em qualquer offset."  # @src=37eeb0fba528
                # | BorshAccount<T> is a real V2 escape hatch for genuinely variable-length
                # | data, but reaching for it here forfeits the byte cast to dodge an
                # | alignment issue the Pod wrappers solve directly.
                feedback: "BorshAccount<T> é uma saída de emergência real do V2 para dados genuinamente de comprimento variável, mas recorrer a ela aqui abre mão do cast de bytes para desviar de um problema de alinhamento que os wrappers Pod resolvem direto."  # @src=d8358dc4f53b
              a:
                # | Use PodU64 and Nested<T> so every field's alignment is defined and the
                # | byte cast stays sound.
                label: "Use PodU64 e Nested<T> para que o alinhamento de todo campo seja definido e o cast de bytes siga sólido."  # @src=7ed702bbb4bd
                # | The condition the cast needs is a defined alignment on every field.
                # | Packing removes it and manufactures the exact reference the warning is
                # | pointing at.
                feedback: "A condição de que o cast precisa é um alinhamento definido em todo campo. Empacotar tira ela e fabrica exatamente a referência para a qual o aviso está apontando."  # @src=f11ef1f9a264
              b:
                # | Add #[repr(packed)] to the Score struct so the padding the cast is
                # | complaining about is removed.
                label: "Adicione #[repr(packed)] à struct Score para remover o preenchimento de que o cast está reclamando."  # @src=f75163d1d1f1
                # | repr(packed) is what CREATES misaligned references — taking a reference
                # | to a packed field is the footgun, not the fix. It guarantees the exact
                # | hazard the warning is pointing at.
                feedback: "repr(packed) é o que CRIA referências desalinhadas — tomar uma referência a um campo empacotado é a cilada, não a correção. Ele garante exatamente o risco para o qual o aviso está apontando."  # @src=79e106c52e54
              d:
                # | Add #[repr(align(8))] to Score so that each tail slot starts on an
                # | 8-byte boundary
                label: "Adicione #[repr(align(8))] ao Score para que cada slot da cauda comece numa fronteira de 8 bytes"  # @src=795264a1c086
                # | Naming the alignment you want is a reasonable move, and it does change
                # | what the type demands. It does not change where the tail lands: an item
                # | sits at whatever offset the header and the 4-byte length field push it
                # | to, so raising the requirement makes more of those offsets illegal
                # | rather than fewer. Alignment-1 wrappers read correctly from any of them.
                feedback: "Nomear o alinhamento que você quer é uma jogada razoável, e muda mesmo o que o tipo exige. O que não muda é onde a cauda cai: um item fica no offset para o qual o header e o campo de comprimento de 4 bytes empurram ele, então subir a exigência torna mais desses offsets ilegais em vez de menos. Wrappers de alinhamento 1 leem corretamente de qualquer um deles."  # @src=19f98cdf0e85
  m02-l3:
    # | The borsh escape hatch: when Pod isn't enough
    title: "A válvula de escape do borsh: quando o Pod não basta"  # @src=188adf262d9a
    blocks:
      check:                      # quiz
        questions:
          m02-l3-q1:
            # | A cabinet field must hold an arbitrary-length player-supplied username. How
            # | do you model it?
            prompt: "Um campo da máquina precisa guardar um nome de usuário de tamanho arbitrário fornecido pelo jogador. Como você o modela?"  # @src=11d015c308da
            # | Pod means a fixed compile-time layout. Genuinely unbounded data needs
            # | BorshAccount<T>, which deserializes on read — you pay the cost V2 avoids by
            # | default, in exchange for variable length. A PodVec is only right if a fixed
            # | maximum is acceptable. The #[account(borsh)] attribute is what opts the type
            # | out of the T: Pod requirement and into that deserialize-on-read model;
            # | BorshAccount<T> is the wrapper you write in the accounts context where
            # | Account<T> would otherwise go.
            explanation: "Pod significa um layout fixo de tempo de compilação. Dados genuinamente ilimitados precisam de BorshAccount<T>, que desserializa na leitura — você paga o custo que o V2 evita por padrão, em troca de tamanho variável. Um PodVec só está certo se um máximo fixo for aceitável. O atributo #[account(borsh)] é o que tira o tipo da exigência T: Pod e o coloca naquele modelo de desserialização na leitura; BorshAccount<T> é o wrapper que você escreve no contexto de accounts onde Account<T> iria em outro caso."  # @src=9c1e6c6d8fe1
            options:                 # source order — keep it
              d:
                # | Hash the name off-chain and keep just its 32-byte digest in the Pod
                # | header instead
                label: "Faça hash do nome off-chain e mantenha só o digest de 32 bytes dele no header Pod em vez disso"  # @src=0d26ec6e7fc8
                # | For a field you compare but never display this is a genuinely good
                # | design, and [u8; 32] really is Pod. The spec here says the account holds
                # | the name, and a digest does not hold it: you have solved a neighbouring
                # | problem and added an off-chain lookup to render anything.
                feedback: "Para um campo que você compara mas nunca exibe este é um design genuinamente bom, e [u8; 32] realmente é Pod. A spec aqui diz que a conta guarda o nome, e um digest não o guarda: você resolveu um problema vizinho e acrescentou uma consulta off-chain para renderizar qualquer coisa."  # @src=a2457fc1375c
              b:
                # | #[account(borsh)] + BorshAccount<T> — the escape hatch for unbounded
                # | data.
                label: "#[account(borsh)] + BorshAccount<T> — a válvula de escape para dados ilimitados."  # @src=63a8fa813830
                # | That attribute is what releases a type from the flat-layout bound:
                # | variable length, paid for on every read. A capped vector wins only where
                # | a fixed maximum genuinely satisfies the spec.
                feedback: "Aquele atributo é o que libera um tipo do bound de layout plano: tamanho variável, pago em cada leitura. Um vetor limitado ganha só onde um máximo fixo genuinamente satisfaz a spec."  # @src=e4ecdb6aa27a
              a:
                # | Pod with a PodVec<u8, 64> — cap the name at 64 bytes and stay on the
                # | direct cast.
                label: "Pod com um PodVec<u8, 64> — limite o nome a 64 bytes e continue no cast direto."  # @src=9394725f655d
                # | That caps the name at 64 bytes. Fine IF you accept a fixed maximum, but
                # | the field is specified as arbitrary-length, which a PodVec cannot be.
                feedback: "Isso limita o nome a 64 bytes. Tudo bem SE você aceita um máximo fixo, mas o campo está especificado como de tamanho arbitrário, o que um PodVec não pode ser."  # @src=2aedb2b7c8a5
              c:
                # | Pod with a raw String field — Account<T> serializes the String behind
                # | the cast.
                label: "Pod com um campo String cru — Account<T> serializa a String por trás do cast."  # @src=473e76c3f134
                # | Account<T> never serializes anything; it casts, which is exactly why it
                # | requires T: Pod. String is a heap pointer plus a length, not a run of
                # | bytes, so this fails with the trait-bound error that opened the lesson.
                feedback: "Account<T> nunca serializa nada; ele faz cast, que é exatamente o motivo pelo qual ele exige T: Pod. String é um ponteiro para o heap mais um comprimento, não uma sequência de bytes, então isso falha com o erro de trait bound que abriu a lição."  # @src=c2a77f918c3a
          m02-l3-q2:
            # | You move a struct with a HashMap field from borsh to V2's wincode and the
            # | on-chain bytes now differ run to run. Why?
            prompt: "Você move uma struct com um campo HashMap do borsh para o wincode do V2 e os bytes on-chain agora diferem de execução para execução. Por quê?"  # @src=d575f7524acf
            # | wincode's BORSH_CONFIG is byte-identical to borsh EXCEPT for exactly two
            # | things: HashMap/HashSet ordering and f32/f64 NaN acceptance. Depend on map
            # | iteration order and you get non-deterministic wire — one of the two holes to
            # | know before you rely on borsh compatibility. The root cause is that a Rust
            # | HashMap has no defined iteration order at all: std deliberately randomizes
            # | it to defend against hash-flooding, so each encoder has to resolve that
            # | non-determinism itself, and the two resolved it differently.
            explanation: "O BORSH_CONFIG do wincode é idêntico byte a byte ao borsh EXCETO por exatamente duas coisas: ordenação de HashMap/HashSet e aceitação de NaN em f32/f64. Dependa da ordem de iteração do map e você tem wire não determinístico — um dos dois buracos para conhecer antes de confiar na compatibilidade com borsh. A causa raiz é que um HashMap de Rust não tem ordem de iteração definida de forma alguma: o std deliberadamente a randomiza para se defender de hash-flooding, então cada codificador tem de resolver essa indeterminação por conta própria, e os dois resolveram de formas diferentes."  # @src=ce93254391f6
            options:                 # source order — keep it
              d:
                # | wincode writes a HashMap's length prefix as u64 where borsh uses u32
                label: "o wincode escreve o prefixo de comprimento de um HashMap como u64 onde o borsh usa u32"  # @src=c18a71bd09be
                # | Encoders really do disagree about prefix widths, so this is the right
                # | family of bug to suspect. wincode's BORSH_CONFIG is byte-identical to
                # | borsh on length prefixes and entry encoding; the two documented
                # | exceptions are map ordering and NaN.
                feedback: "Codificadores realmente discordam sobre larguras de prefixo, então esta é a família certa de bug para suspeitar. O BORSH_CONFIG do wincode é idêntico byte a byte ao borsh em prefixos de comprimento e codificação de entradas; as duas exceções documentadas são ordenação de map e NaN."  # @src=20072f67cdf4
              e:
                # | NaN acceptance differs between the two encoders, not map ordering
                label: "A aceitação de NaN difere entre os dois codificadores, não a ordenação de map"  # @src=2a5ba337bcbd
                # | Half an answer: there are exactly two holes and this is the other one.
                # | NaN bites a struct carrying a float, and it would not produce different
                # | bytes run to run for the same logical state, which is the symptom in
                # | front of you.
                feedback: "Meia resposta: existem exatamente dois buracos e este é o outro. NaN morde uma struct que carrega um float, e não produziria bytes diferentes de execução para execução para o mesmo estado lógico, que é o sintoma na sua frente."  # @src=651b871cfec2
              c:
                # | wincode and borsh resolve HashMap/HashSet iteration order differently.
                label: "o wincode e o borsh resolvem a ordem de iteração de HashMap/HashSet de formas diferentes."  # @src=2e14a9c0be63
                # | Nothing is unsupported and nothing is compressed — two encoders just
                # | answered a question the language leaves open. You'll only notice on a
                # | second run, which is what makes it a nasty one to catch.
                feedback: "Nada deixou de ter suporte e nada é comprimido — dois codificadores só responderam uma pergunta que a linguagem deixa aberta. Você só vai notar numa segunda execução, que é o que faz dele um caso desagradável de pegar."  # @src=5b707eb2c742
              b:
                # | HashMap isn't serializable under wincode's BORSH_CONFIG at all.
                label: "HashMap não é serializável sob o BORSH_CONFIG do wincode de forma alguma."  # @src=1ac6d56fb1d7
                # | It serializes fine under BORSH_CONFIG — the type is fully supported. The
                # | hole is that std randomizes HashMap iteration order per run, so the
                # | order isn't pinned.
                feedback: "Ele serializa sem problema sob o BORSH_CONFIG — o tipo tem suporte completo. O buraco é que o std randomiza a ordem de iteração de HashMap a cada execução, então a ordem não está fixada."  # @src=96bf5b6acf01
              a:
                # | wincode compresses map entries, so the encoded length varies per write.
                label: "o wincode comprime entradas de map, então o comprimento codificado varia por escrita."  # @src=516dfdbf9a3e
                # | wincode compresses nothing — BORSH_CONFIG is byte-identical to borsh on
                # | length prefixes and entry encoding. What varies is the ORDER the entries
                # | land in, not their size.
                feedback: "O wincode não comprime nada — o BORSH_CONFIG é idêntico byte a byte ao borsh em prefixos de comprimento e codificação de entradas. O que varia é a ORDEM em que as entradas caem, não o tamanho delas."  # @src=9d10f30601bc
          m02-l3-q3:
            # | After bumping a dependency, your #[account(borsh)] code stops compiling with
            # | a trait-bound error. Which real RC-era incident does this echo?
            prompt: "Depois de subir uma dependência, o seu código #[account(borsh)] para de compilar com um erro de trait bound. Qual incidente real da era RC isso ecoa?"  # @src=1c93a42b160a
            # | Issue #4937 (filed 2026-08-16, closed 2026-08-20) is the RC's first war
            # | story: a mismatch between anchor-lang's wincode 0.5 pin and the wincode 0.6
            # | that solana-address 2.7.0 requires produced a trait-bound error that broke
            # | #[account(borsh)] until the pins were reconciled. It's exactly why the
            # | course centralizes pins with freshness notes. Note the failure mode — not a
            # | runtime bug and not a subtle wire mismatch, but a green build on Monday and
            # | a compile error on Tuesday in a feature you never touched, which is what
            # | floating a single crate looks like.
            explanation: "A issue #4937 (aberta em 2026-08-16, fechada em 2026-08-20) é a primeira história de guerra do RC: uma incompatibilidade entre o pin wincode 0.5 do anchor-lang e o wincode 0.6 que o solana-address 2.7.0 exige produziu um erro de trait bound que quebrou #[account(borsh)] até os pins serem reconciliados. É exatamente por isso que o curso centraliza pins com freshness notes. Note o modo de falha — não um bug de runtime e não uma incompatibilidade sutil de wire, mas um build verde na segunda e um erro de compilação na terça numa feature que você nunca tocou, que é a cara de deixar um único crate flutuar."  # @src=105218665f6b
            options:                 # source order — keep it
              b:
                # | The @coral-xyz/anchor → @anchor-lang/core rename.
                label: "A renomeação @coral-xyz/anchor → @anchor-lang/core."  # @src=bfecd85b6d61
                # | That rename is an npm client-package story about download counts and
                # | import paths. It cannot produce a Rust trait-bound error, because the TS
                # | client isn't in the crate graph that compiles #[account(borsh)].
                feedback: "Aquela renomeação é uma história de pacote cliente npm sobre contagens de download e caminhos de import. Ela não pode produzir um erro de trait bound de Rust, porque o cliente TS não está no grafo de crates que compila #[account(borsh)]."  # @src=8c6df3fe1666
              a:
                # | Issue #4937 — anchor's wincode 0.5 pin versus the wincode 0.6 that
                # | solana-address 2.7.0 requires.
                label: "A issue #4937 — o pin wincode 0.5 do anchor versus o wincode 0.6 que o solana-address 2.7.0 exige."  # @src=a8510027a33f
                # | Two majors of one crate in a single graph, and the trait bound stops
                # | resolving. Pins reconciled, issue closed, four days end to end. What you
                # | remember is the shape: green on Monday, broken on Tuesday, nothing of
                # | yours changed.
                feedback: "Dois majors de um crate num único grafo, e o trait bound para de resolver. Pins reconciliados, issue fechada, quatro dias de ponta a ponta. O que você lembra é o formato: verde na segunda, quebrado na terça, nada do que é seu mudou."  # @src=dffa1c20425a
              e:
                # | The 2026-08-12 crates.io publish of 2.0.0-rc.1, which shipped
                # | undocumented and untested for installs
                label: "A publicação de 2026-08-12 do 2.0.0-rc.1 no crates.io, que foi entregue sem documentação e sem testes para instalações"  # @src=095c09e24691
                # | That publish is real and it is flagged as a red herring, so filing it
                # | under trouble is fair. Its risk is an install path nobody tests, not a
                # | type error: the compile break came from two wincode majors meeting in
                # | one dependency graph.
                feedback: "Aquela publicação é real e está marcada como uma pista falsa, então arquivá-la sob problemas é justo. O risco dela é um caminho de instalação que ninguém testa, não um erro de tipo: a quebra de compilação veio de dois majors de wincode se encontrando num único grafo de dependências."  # @src=64c89c5bfbca
              c:
                # | The Cashio exploit — an unvalidated collateral account.
                label: "O exploit do Cashio — uma conta de colateral não validada."  # @src=1208a85afc12
                # | Cashio is a runtime security incident about a missing account check —
                # | territory for the DeFi & RWA Engineering course. A missing constraint
                # | fails on-chain at execution; it never breaks a build.
                feedback: "O Cashio é um incidente de segurança de runtime sobre uma checagem de conta faltando — território do curso DeFi & RWA Engineering. Um constraint faltando falha on-chain na execução; nunca quebra um build."  # @src=bad494597f6e
              d:
                # | The litesvm 0.11-to-0.15 jump, where the harness's SVM major moves under
                # | a test suite that was green
                label: "O salto de litesvm 0.11 para 0.15, onde o major de SVM da bancada de teste se move sob uma suíte de testes que estava verde"  # @src=a30e67160390
                # | The course warns about exactly that pin, so this is the right instinct
                # | pointed one layer off. A dev-dependency governs how your tests run and
                # | cannot break a trait bound inside the program crate; #4937 is a mismatch
                # | between two crates the program itself compiles against.
                feedback: "O curso avisa sobre exatamente aquele pin, então este é o instinto certo apontado uma camada de distância. Uma dev-dependency governa como os seus testes rodam e não pode quebrar um trait bound dentro do crate do programa; a #4937 é uma incompatibilidade entre dois crates contra os quais o próprio programa compila."  # @src=b9625af1f878
          m02-l3-q4:
            # | An account needs a fixed [u8; 32] key, a leaderboard of at most 10 scores,
            # | and a free-form description. What's the best modeling?
            prompt: "Uma conta precisa de uma chave [u8; 32] fixa, um leaderboard de no máximo 10 scores, e uma descrição livre. Qual é a melhor modelagem?"  # @src=6c6df4a0fc16
            # | Model fixed and bounded state as Pod for the CU win and isolate the
            # | genuinely unbounded part behind the borsh escape hatch. That mixed-tier
            # | design is the whole point: borsh where Pod can't reach, Pod everywhere else.
            # | The payoff is scoped cost — a handler that only bumps the leaderboard
            # | touches the Pod core and never deserializes anything — plus scoped rent,
            # | since a borsh account must be sized for the largest string you will ever
            # | store and splitting keeps that worst case off the hot account.
            explanation: "Modele estado fixo e limitado como Pod pelo ganho de CU e isole a parte genuinamente ilimitada atrás da válvula de escape do borsh. Aquele design de níveis mistos é o ponto inteiro: borsh onde Pod não alcança, Pod em todo o resto. O retorno é custo com escopo — um handler que só atualiza o leaderboard toca o core Pod e nunca desserializa nada — mais rent com escopo, já que uma conta borsh tem de ser dimensionada para a maior string que você vai armazenar algum dia e dividir mantém esse pior caso fora da conta quente."  # @src=43e2ffadb543
            options:                 # source order — keep it
              c:
                # | Make all three Pod, with the description as a raw String in the same
                # | struct.
                label: "Faça todos os três Pod, com a descrição como uma String crua na mesma struct."  # @src=b082defd4b85
                # | String isn't Pod, so the struct won't compile at all — and merging the
                # | unbounded field into the core struct is precisely the move that forces
                # | the split in the first place.
                feedback: "String não é Pod, então a struct não vai compilar de forma alguma — e fundir o campo ilimitado na struct central é precisamente a jogada que força a divisão em primeiro lugar."  # @src=90cecfdfca14
              a:
                # | Put all three in one BorshAccount<T> so the whole record deserializes at
                # | once.
                label: "Ponha todos os três em um BorshAccount<T> para que o registro inteiro desserialize de uma vez."  # @src=9f5cb0bca260
                # | Deserializing the whole record drops zero-copy on the fixed key and the
                # | bounded board for no reason, and the cost is proportional to the
                # | account's full size on EVERY touch — so the hot leaderboard path pays a
                # | tax two-thirds of the account never needed.
                feedback: "Desserializar o registro inteiro abre mão do zero-copy na chave fixa e no board limitado sem motivo, e o custo é proporcional ao tamanho completo da conta em CADA toque — então o caminho quente do leaderboard paga um imposto que dois terços da conta nunca precisaram."  # @src=3decf93cea52
              d:
                # | Split it in two and make both halves borsh, which generally reads
                # | simpler
                label: "Divida em duas e faça as duas metades borsh, o que geralmente fica mais simples de ler"  # @src=b365d0c81a65
                # | The split is the right half of the answer, and the reason for it is what
                # | the other half hangs on: you split so the hot fixed state keeps its byte
                # | cast. Make both halves borsh and a handler that only bumps the
                # | leaderboard pays a deserialize it never needed, which is the cost the
                # | split existed to avoid.
                feedback: "A divisão é a metade certa da resposta, e o motivo dela é do que a outra metade depende: você divide para que o estado fixo quente mantenha o seu cast de bytes. Faça as duas metades borsh e um handler que só atualiza o leaderboard paga uma desserialização de que nunca precisou, que é o custo que a divisão existia para evitar."  # @src=d7522c4f095a
              b:
                # | Pod core for the key and bounded board; borsh only for the description.
                label: "Core Pod para a chave e o board limitado; borsh só para a descrição."  # @src=1ddb60fbd71a
                # | Splitting keeps the hot path off the deserializer: bump the board and
                # | you touch only the cast-in-place core. Rent falls out of it too, because
                # | the worst-case sizing now applies to one field instead of the whole
                # | record.
                feedback: "Dividir mantém o caminho quente fora do desserializador: atualize o board e você toca só o core, lido com cast no próprio lugar. O rent também decorre disso, porque o dimensionamento de pior caso agora se aplica a um campo em vez do registro inteiro."  # @src=e2ecf0c6e0ef
  m03-l1:
    # | PDAs & canonical bumps in V2
    title: "PDAs e bumps canônicos no V2"  # @src=672e7e297166
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Your `init_vault` handler needs to sign a withdrawal CPI later as the vault
            # | PDA. To keep that cheap and correct, what do you do with the bump the macro
            # | hands you during validation?
            prompt: "Seu handler `init_vault` precisa assinar uma CPI de withdrawal mais tarde como o PDA do vault. Para manter isso barato e correto, o que você faz com o bump que a macro te entrega durante a validação?"  # @src=2ccc034993e5
            # | The canonical bump is stable for a given seed set, so you read it once at
            # | init from the typed `ctx.bumps.vault` field, persist it in the account, and
            # | reuse it as `bump = vault.bump`. That is both the CU-cheap path and the safe
            # | one — no runtime search, no trusting client input. Be precise about what
            # | `ctx.bumps.vault` is: a generated struct field on every Anchor line since
            # | 0.29, not a V2 invention, and V2's macro-time const applies only to an
            # | all-literal seed scheme — not to this vault, whose seeds include the player
            # | key and therefore still derive during validation.
            explanation: "O bump canônico é estável para um dado conjunto de seeds, então você lê ele uma vez no init a partir do campo tipado `ctx.bumps.vault`, persiste ele na conta, e reusa ele como `bump = vault.bump`. Esse é ao mesmo tempo o caminho barato em CU e o seguro — sem busca em tempo de execução, sem confiar em entrada do cliente. Seja preciso sobre o que `ctx.bumps.vault` é: um campo de struct gerado em toda linha do Anchor desde a 0.29, não uma invenção do V2, e o const em tempo de macro do V2 se aplica só a um esquema de seeds todo literal — não a este vault, cujas seeds incluem a chave do jogador e portanto ainda derivam durante a validação."  # @src=401e64b6d61a
            options:                 # source order — keep it
              a:
                # | Call find_program_address again inside the withdraw handler so the bump
                # | is re-derived each call
                label: "Chame find_program_address de novo dentro do handler de withdraw para que o bump seja re-derivado a cada chamada"  # @src=8cf861908a99
                # | That reintroduces the full runtime search on every call, and costs CU
                # | every time. Note which mechanism saves you here: V2's macro-time const
                # | only removes the search when every seed is a byte literal, and this
                # | vault's seeds carry the player key, so the stored bump — not the const —
                # | is what makes the withdraw cheap.
                feedback: "Isso reintroduz a busca completa em tempo de execução em cada chamada, e custa CU toda vez. Repare em qual mecanismo te salva aqui: o const em tempo de macro do V2 só remove a busca quando toda seed é um literal de byte, e as seeds deste vault carregam a chave do jogador, então o bump armazenado — não o const — é o que torna o withdraw barato."  # @src=268737488c22
              d:
                # | Write a bare bump on withdraw; the macro typically finds it in one try
                label: "Escreva um bump pelado no withdraw; a macro normalmente acha ele numa tentativa só"  # @src=7d00622df71b
                # | Correct and idiomatic on the create path, which is what makes it look
                # | safe everywhere else. A bare bump asks the macro to search, and the
                # | search is priced per candidate it tries; bump = vault.bump validates
                # | against a byte you already stored and skips the walk.
                feedback: "Correto e idiomático no caminho de criação, que é o que faz ele parecer seguro em todo o resto. Um bump pelado pede para a macro buscar, e a busca é precificada por candidato que ela tenta; bump = vault.bump valida contra um byte que você já armazenou e pula a caminhada."  # @src=009b6a80d825
              b:
                # | Recompute the bump from the seeds on the client and pass it in each
                # | instruction
                label: "Recompute o bump a partir das seeds no cliente e passe ele em cada instrução"  # @src=fde1c7c1f1c3
                # | A client-supplied bump is untrusted input; the program must
                # | derive/verify canonically, not trust a passed value.
                feedback: "Um bump fornecido pelo cliente é entrada não confiável; o programa tem que derivar/verificar canonicamente, não confiar num valor passado."  # @src=80e5c89860e4
              c:
                # | Store the canonical bump in the vault's Pod state at init and reuse the
                # | stored value
                label: "Armazene o bump canônico no estado Pod do vault no init e reuse o valor armazenado"  # @src=faf04f1958e5
                # | Derivation is deterministic for a fixed seed set, so one computation
                # | stored is every future computation skipped — and a byte you persisted
                # | yourself is a byte the caller can't influence.
                feedback: "A derivação é determinística para um conjunto fixo de seeds, então uma computação armazenada é toda computação futura pulada — e um byte que você mesmo persistiu é um byte que o chamador não consegue influenciar."  # @src=32db4b02dd8b
          q2:
            # | You seed the vault with [b"vault", player.address()] and it works. A
            # | teammate proposes dropping the second seed to 'keep it simple'. What breaks?
            prompt: "Você semeia o vault com [b\"vault\", player.address()] e funciona. Um colega de time propõe tirar a segunda seed para 'manter as coisas simples'. O que quebra?"  # @src=fe52f128e1f8
            # | The seed scheme IS the namespace. Dropping the player key makes the
            # | derivation identity-independent, so all players resolve to a single PDA.
            # | Per-entity data needs a per-entity seed — the seed design is a security
            # | boundary, not a formality.
            explanation: "O esquema de seeds É o namespace. Tirar a chave do jogador deixa a derivação independente de identidade, então todos os jogadores resolvem para um único PDA. Dados por entidade precisam de uma seed por entidade — o design de seeds é uma fronteira de segurança, não uma formalidade."  # @src=5940b01f62f9
            options:                 # source order — keep it
              b:
                # | A bare `bump` cannot resolve a canonical value when no seed varies per
                # | caller
                label: "Um `bump` pelado não consegue resolver um valor canônico quando nenhuma seed varia por chamador"  # @src=86366cfb9bab
                # | Tempting because the bump feels tied to the player key, but a
                # | constant-only seed array derives a canonical bump fine — a global config
                # | PDA seeded with just [b"config"] does exactly that. The account derives;
                # | it is simply the same one for everybody.
                feedback: "Tentador porque o bump parece amarrado à chave do jogador, mas um array de seeds só com constantes deriva um bump canônico numa boa — um PDA de config global semeado só com [b\"config\"] faz exatamente isso. A conta deriva; ela é simplesmente a mesma para todo mundo."  # @src=b8a6f3af988b
              a:
                # | Every player collides on ONE shared vault address, so there is no
                # | per-player custody
                label: "Todo jogador colide num ÚNICO endereço de vault compartilhado, então não existe custódia por jogador"  # @src=6b369f0d986a
                # | Drop identity out of the seeds and the address stops depending on
                # | identity — that is the whole bug, and nothing anywhere raises so much as
                # | a warning about it.
                feedback: "Tire identidade das seeds e o endereço para de depender de identidade — é esse o bug inteiro, e nada em lugar nenhum levanta sequer um aviso sobre isso."  # @src=057ca4934534
              d:
                # | Nothing: each player's canonical bump differs, so the vault address
                # | stays distinct
                label: "Nada: o bump canônico de cada jogador difere, então o endereço do vault continua distinto"  # @src=6216e22250a2
                # | The bump does vary from one seed set to the next, which is what makes
                # | this feel like enough separation. Derivation is a pure function of the
                # | seeds and the program id, so with the player key gone the inputs are
                # | identical for everyone and the same bump and the same 32 bytes come back
                # | out.
                feedback: "O bump de fato varia de um conjunto de seeds para o seguinte, que é o que faz isso parecer separação suficiente. A derivação é uma função pura das seeds e do program id, então com a chave do jogador fora, as entradas são idênticas para todo mundo e o mesmo bump e os mesmos 32 bytes voltam."  # @src=1959c5b07163
              c:
                # | Derivation aborts because find_program_address needs two seeds plus the
                # | program ID
                label: "A derivação aborta porque find_program_address precisa de duas seeds mais o program ID"  # @src=4b4ff1e3a8c5
                # | There is no two-seed minimum — up to 16 seeds of at most 32 bytes each
                # | are allowed, and zero or one is legal. The derivation succeeds; the
                # | failure is semantic, not a limit.
                feedback: "Não existe mínimo de duas seeds — são permitidas até 16 seeds de no máximo 32 bytes cada, e zero ou uma é válida. A derivação tem sucesso; a falha é semântica, não um limite."  # @src=2c6680ce006d
          q3:
            # | Porting an ancient 0.28-era snippet from an old tutorial, you see `let bump
            # | = ctx.bumps.get("vault").unwrap();`. What is the rewrite that builds on
            # | today's lines, and when did the change actually land?
            prompt: "Portando um trecho antiquíssimo da era 0.28 de um tutorial velho, você vê `let bump = ctx.bumps.get(\"vault\").unwrap();`. Qual é a reescrita que faz build nas linhas de hoje, e quando a mudança de fato aterrissou?"  # @src=b59231d65d40
            # | Anchor 0.29 — two majors before V2 — replaced the string-keyed bumps map
            # | with a generated typed struct, so on any modern line you read
            # | ctx.bumps.vault as a field: no string, no fallible unwrap, and a typo fails
            # | to compile. V2 keeps that idiom unchanged, so seeing .get("vault") dates a
            # | snippet to 0.28 or earlier; it is not "the v1 way." Be precise about what
            # | runs when: with a caller-keyed seed, the derivation itself still happens at
            # | runtime during account validation on every line. V2's only bump-time news is
            # | that an all-literal seed scheme gets its canonical bump precomputed as a
            # | macro-time const. The CU story lives elsewhere — bare `bump` runs the
            # | search, `bump = vault.bump` validates against a value you already stored.
            explanation: "O Anchor 0.29 — dois majors antes do V2 — substituiu o mapa de bumps com chave de string por uma struct tipada gerada, então em qualquer linha moderna você lê ctx.bumps.vault como um campo: sem string, sem unwrap falível, e um typo não compila. O V2 mantém essa forma idiomática inalterada, então ver .get(\"vault\") data um trecho como 0.28 ou anterior; não é \"o jeito do v1.\" Seja preciso sobre o que roda quando: com uma seed que depende do chamador, a derivação em si ainda acontece em tempo de execução durante a validação de contas em toda linha. A única novidade do V2 em tempo de bump é que um esquema de seeds todo literal tem o bump canônico pré-computado como um const em tempo de macro. A história de CU mora em outro lugar — o `bump` pelado roda a busca, o `bump = vault.bump` valida contra um valor que você já armazenou."  # @src=32be9e91e1ef
            options:                 # source order — keep it
              a:
                # | Keep ctx.bumps.get("vault").unwrap(); modern Anchor keeps the string map
                # | behind a shim
                label: "Mantenha ctx.bumps.get(\"vault\").unwrap(); o Anchor moderno mantém o mapa de string atrás de um shim"  # @src=4a70d5f11acc
                # | There is no compat shim: Anchor 0.29 removed the string-keyed map
                # | outright, and ctx.bumps has been a generated struct with one field per
                # | PDA account ever since — on the 1.x line and on V2 alike, .get() does
                # | not compile.
                feedback: "Não existe shim de compatibilidade: o Anchor 0.29 removeu o mapa com chave de string de saída, e o ctx.bumps é uma struct gerada com um campo por conta PDA desde então — tanto na linha 1.x quanto no V2, .get() não compila."  # @src=c1cfbf3ddc57
              c:
                # | `find_program_address(seeds, id).1` recomputed inside the handler
                label: "`find_program_address(seeds, id).1` recomputado dentro do handler"  # @src=d0553c34eb5c
                # | That is a runtime search — the exact cost a stored bump exists to
                # | delete; it is neither idiomatic nor cheap on any Anchor line.
                feedback: "Isso é uma busca em tempo de execução — exatamente o custo que um bump armazenado existe para deletar; não é nem idiomático nem barato em nenhuma linha do Anchor."  # @src=43a3b23e7b68
              d:
                # | ctx.bumps.vault - but it is a V2 addition, so keep .get("vault") on the
                # | 1.x line and switch when the program moves to the RC
                label: "ctx.bumps.vault - mas é uma adição do V2, então mantenha .get(\"vault\") na linha 1.x e troque quando o programa mudar para o RC"  # @src=ff42b7b74324
                # | Right rewrite, wrong credit, and this is the exact half-truth the
                # | ecosystem's migration posts keep repeating. The typed bumps struct
                # | landed in Anchor 0.29, two majors before V2 existed, so .get("vault")
                # | does not build on the 1.x line either.
                feedback: "Reescrita certa, crédito errado, e esta é exatamente a meia-verdade que os posts de migração do ecossistema ficam repetindo. A struct bumps tipada aterrissou no Anchor 0.29, dois majors antes de o V2 existir, então .get(\"vault\") também não faz build na linha 1.x."  # @src=106cb8793653
              b:
                # | `ctx.bumps.vault` — a field on the typed bumps struct the derive macro
                # | generates, the idiom since Anchor 0.29 and unchanged in V2
                label: "`ctx.bumps.vault` — um campo na struct bumps tipada que a macro de derive gera, a forma idiomática desde o Anchor 0.29 e inalterada no V2"  # @src=517cce113757
                # | A field lookup that cannot miss replaces a string lookup that could: the
                # | compiler guarantees the name exists. The change is a 0.29 migration you
                # | are back-paying, not a V2 delta — and the derivation for runtime-keyed
                # | seeds still runs per call on every line.
                feedback: "Uma busca de campo que não pode errar substitui uma busca de string que podia: o compilador garante que o nome existe. A mudança é uma migração de 0.29 que você está pagando atrasado, não um delta do V2 — e a derivação para seeds com valor de runtime ainda roda a cada chamada em toda linha."  # @src=a95edfc2ce51
  m03-l2:
    # | The constraint catalog (and init_if_needed, in situ)
    title: "O catálogo de constraints (e init_if_needed, in situ)"  # @src=0c4472a6a328
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | You wrote `#[account(owner = spl_token::ID @ VaultError::WrongOwner)]` on an
            # | `Account<T>` vault and expected WrongOwner on a bad account. The test
            # | instead sees a generic IllegalOwner. Why?
            prompt: "Você escreveu `#[account(owner = spl_token::ID @ VaultError::WrongOwner)]` num vault `Account<T>` e esperava WrongOwner numa conta ruim. O teste em vez disso vê um IllegalOwner genérico. Por quê?"  # @src=f73afa51fd7c
            # | On Account<T>, owner/discriminator validation happens during load — earlier
            # | than the constraint-hook phase where your @ error would be raised. To
            # | surface a custom owner error, drop to UncheckedAccount and assert ownership
            # | with an explicit constraint that runs in the hook phase. Read it one step
            # | further: on Account<T> the typed wrapper has already pinned the owner to
            # | your own program, so `owner = <some other program>` there is not merely
            # | error-shadowed, it is unreachable — an account owned by anyone else can
            # | never load as that type in the first place.
            explanation: "Em Account<T>, a validação de owner/discriminator acontece durante o load — antes da fase de hooks de constraint, onde o seu erro @ seria levantado. Para fazer aparecer um erro de owner customizado, desça para UncheckedAccount e afirme a propriedade com um constraint explícito que roda na fase de hooks. Leia isso um passo além: em Account<T> o wrapper tipado já fixou o owner no seu próprio programa, então `owner = <some other program>` ali não está meramente com o erro sombreado, ele é inalcançável — uma conta de que qualquer outro seja dono nunca consegue carregar como aquele tipo, para começo de conversa."  # @src=84992dd1530f
            options:                 # source order — keep it
              c:
                # | `load` checks owner and discriminator before any constraint hook runs,
                # | so the built-in IllegalOwner fires first
                label: "`load` checa owner e discriminator antes de qualquer hook de constraint rodar, então o IllegalOwner embutido dispara primeiro"  # @src=c408525e1238
                # | Take the account untyped and assert ownership in the hook phase, because
                # | that is where your error can still fire. On a typed wrapper the owner is
                # | already pinned to your own program, so naming a different one was never
                # | reachable.
                feedback: "Pegue a conta sem tipo e afirme a propriedade na fase de hooks, porque é ali que o seu erro ainda consegue disparar. Num wrapper tipado o owner já está fixado no seu próprio programa, então nomear um diferente nunca foi alcançável."  # @src=b58a011dd9b4
              b:
                # | `owner` needs a literal `Address` constant, and `spl_token::ID` is a
                # | path the derive macro fails to resolve
                label: "`owner` precisa de uma constante `Address` literal, e `spl_token::ID` é um caminho que a macro de derive não consegue resolver"  # @src=f778d63e2635
                # | `owner` accepts any expression that evaluates to an address,
                # | `spl_token::ID` included. The problem is phase ordering, not resolution.
                feedback: "`owner` aceita qualquer expressão que avalie para um endereço, `spl_token::ID` incluído. O problema é a ordenação de fases, não a resolução."  # @src=8a2e88529a35
              a:
                # | The `@` error binding is parsed on `constraint =` alone; on `address`
                # | and `owner` the macro silently drops it
                label: "A amarração de erro `@` é parseada só em `constraint =`; em `address` e `owner` a macro descarta ela em silêncio"  # @src=4b3c12a59706
                # | `@` binds a custom error on `address` and `owner` too — the macro parses
                # | it fine here. The error never fires because `load` rejected the account
                # | before the hook that would raise it.
                feedback: "`@` amarra um erro customizado em `address` e `owner` também — a macro parseia ele numa boa aqui. O erro nunca dispara porque o `load` rejeitou a conta antes do hook que levantaria ele."  # @src=62b6a48e1e87
              d:
                # | Constraint order inside #[account(...)] decides the phase, so listing
                # | owner above seeds makes it run during load
                label: "A ordem dos constraints dentro de #[account(...)] decide a fase, então listar owner acima de seeds faz ele rodar durante o load"  # @src=72955d1191f4
                # | Field order really is load order, so carrying that instinct down into
                # | one field's attribute list is a fair inference. Every hook on a single
                # | field runs in the constraint phase whatever order you write them in;
                # | what runs first is the typed load, and no attribute can join it.
                feedback: "A ordem dos campos é mesmo a ordem de carregamento, então levar esse instinto para dentro da lista de atributos de um campo é uma inferência justa. Todo hook num único campo roda na fase de constraints, seja qual for a ordem em que você escreve eles; o que roda primeiro é o load tipado, e nenhum atributo consegue entrar nele."  # @src=3c07b1bf3a98
          q2:
            # | You add `init_if_needed` so a player can 'top up or create' a vault in one
            # | instruction. What is the specific danger you must now guard, and what does
            # | V2's reuse-validation actually cover?
            prompt: "Você acrescenta `init_if_needed` para que um jogador consiga 'recarregar ou criar' um vault em uma instrução. Qual é o perigo específico que você agora tem de travar, e o que a validação de reuso do V2 de fato cobre?"  # @src=a3e0cd4126ed
            # | V2's reuse-validation re-checks structural properties (space, owner,
            # | discriminator) when the account already exists, but it does not know your
            # | invariants. The reinitialization attack — forcing the create-or-reuse branch
            # | to reset live state — survives, so you must guard the overwrite path
            # | yourself. Concretely: reuse-validation has no idea that `credit` is a
            # | balance a player funded, so branch on whether the account is fresh
            # | (`vault.owner == Address::default()`) before initializing any field, and
            # | only ever ADD to `credit` — never `vault.credit = amount`, which is the
            # | clobber.
            explanation: "A validação de reuso do V2 recheca propriedades estruturais (space, owner, discriminator) quando a conta já existe, mas ela não conhece os seus invariantes. O ataque de reinicialização — forçar o branch de criar-ou-reusar a resetar estado vivo — sobrevive, então você mesmo tem de travar o caminho de sobrescrita. Concretamente: a validação de reuso não faz ideia de que `credit` é um saldo que um jogador bancou, então ramifique conforme a conta seja nova (`vault.owner == Address::default()`) antes de inicializar qualquer campo, e só ADICIONE a `credit` — nunca `vault.credit = amount`, que é o atropelo."  # @src=2e86d8395854
            options:                 # source order — keep it
              b:
                # | Nothing — V2's reuse-validation re-checks the existing account on the
                # | reuse branch, so init_if_needed is safe on its own
                label: "Nada — a validação de reuso do V2 recheca a conta existente no branch de reuso, então init_if_needed é seguro sozinho"  # @src=929b7f87e468
                # | Reuse-validation is real, but it only re-checks space, owner and
                # | discriminator. It has no notion of `credit` being a funded balance, so
                # | the overwrite risk is still yours to guard.
                feedback: "A validação de reuso é real, mas ela só recheca space, owner e discriminator. Ela não tem noção de `credit` ser um saldo com fundos, então o risco de sobrescrita continua sendo seu para travar."  # @src=c8c1c0873e42
              c:
                # | That `init_if_needed` sits behind a Cargo feature in V2, so the derive
                # | struct will not compile until you enable it
                label: "Que `init_if_needed` fica atrás de uma feature do Cargo no V2, então a struct do derive não vai compilar até você habilitar ela"  # @src=275dc418a5e1
                # | That was the v1 stance. In V2 the keyword ships with NO feature gate and
                # | compiles freely — which is exactly why the guard discipline matters
                # | more, not less.
                feedback: "Essa era a postura do v1. No V2 a keyword chega SEM feature gate nenhum e compila livremente — que é exatamente por que a disciplina de trava importa mais, não menos."  # @src=47bbc89b0843
              d:
                # | A different program creating the account first; reuse-validation covers
                # | the stored state, so your own credit field is safe
                label: "Um programa diferente criando a conta primeiro; a validação de reuso cobre o estado armazenado, então o seu próprio campo credit está seguro"  # @src=c234bea20011
                # | Exactly inverted, and the inversion is worth naming out loud: ownership
                # | is the part reuse-validation does do for you, alongside space and
                # | discriminator. What it has no view of is which field holds a player's
                # | balance, so the state is the half left to your guard.
                feedback: "Exatamente invertido, e vale nomear a inversão em voz alta: a propriedade é a parte que a validação de reuso de fato faz por você, ao lado de space e discriminator. O que ela não enxerga é qual campo segura o saldo de um jogador, então o estado é a metade que sobra para a sua trava."  # @src=a645d0fdb679
              a:
                # | A reinitialization path that clobbers an existing vault's live `credit`;
                # | reuse-validation covers shape, not state
                label: "Um caminho de reinicialização que atropela o `credit` vivo de um vault existente; a validação de reuso cobre forma, não estado"  # @src=8c365a241bf4
                # | Structural re-checks have no idea which field holds a player's money, so
                # | a funded balance and a fresh one look identical to them, which is why
                # | the create branch needs a freshness test of your own, and a += where you
                # | were about to write =.
                feedback: "Rechecagens estruturais não fazem ideia de qual campo segura o dinheiro de um jogador, então um saldo com fundos e um novo parecem idênticos para elas, que é por que o branch de criação precisa de um teste seu para saber se a conta é nova, e de um += onde você ia escrever =."  # @src=201051ad4126
          q3:
            # | Porting a v1 vault, the compiler rejects `realloc::payer = payer` and warns
            # | on `has_one = authority`. What are the correct V2 forms?
            prompt: "Portando um vault v1, o compilador rejeita `realloc::payer = payer` e avisa em `has_one = authority`. Quais são as formas corretas do V2?"  # @src=62b6e72b38eb
            # | V2 flattened the realloc sub-keywords to underscore forms (realloc_payer,
            # | realloc_zero) and deprecated has_one in favor of address = parent.field,
            # | which accepts any expression. has_one still compiles with a warning so
            # | migrations aren't blocked, but new code uses address=.
            explanation: "O V2 achatou as sub-keywords de realloc para formas com underscore (realloc_payer, realloc_zero) e depreciou has_one em favor de address = parent.field, que aceita qualquer expressão. has_one ainda compila com um aviso para que as migrações não fiquem bloqueadas, mas código novo usa address=."  # @src=1324801140a0
            options:                 # source order — keep it
              e:
                # | `realloc_zero = payer` and `address = <the authority expression>`
                label: "`realloc_zero = payer` e `address = <the authority expression>`"  # @src=5811eed34d92
                # | Both V2 spellings, wrong pairing, and the two flat names are easy to
                # | swap. realloc_zero takes a bool and decides whether the resized buffer
                # | is wiped; who funds the extra rent is realloc_payer.
                feedback: "As duas grafias são do V2, o pareamento está errado, e os dois nomes planos são fáceis de trocar. realloc_zero recebe um bool e decide se o buffer redimensionado é apagado; quem banca o rent extra é realloc_payer."  # @src=20960d013b62
              d:
                # | `realloc::payer = payer` and `address = <authority expression>`
                label: "`realloc::payer = payer` e `address = <authority expression>`"  # @src=03568da4cb93
                # | The has_one half is right, which is also the half the compiler nags you
                # | about, so it is the one people fix first. The colon-nested realloc
                # | sub-keywords do not survive the port: V2 spells them flat, and the old
                # | form fails to compile rather than warning.
                feedback: "A metade do has_one está certa, que é também a metade sobre a qual o compilador te cutuca, então é a que as pessoas corrigem primeiro. As sub-keywords de realloc aninhadas por dois-pontos não sobrevivem à migração: o V2 grafa elas planas, e a forma antiga falha ao compilar em vez de avisar."  # @src=3610799dff8a
              c:
                # | `realloc_payer = payer` and keep `has_one = authority`
                label: "`realloc_payer = payer` e manter `has_one = authority`"  # @src=a29302aa2734
                # | has_one still parses but is deprecated and warns; new V2 code should use
                # | address = parent.field.
                feedback: "has_one ainda parseia mas está depreciado e avisa; código V2 novo deveria usar address = parent.field."  # @src=3e7cfb224116
              a:
                # | `realloc::payer` stays; has_one becomes `owner = authority`
                label: "`realloc::payer` fica; has_one vira `owner = authority`"  # @src=061d142a4c6f
                # | realloc::payer is not the V2 spelling, and has_one's replacement is
                # | address=, not owner.
                feedback: "realloc::payer não é a grafia do V2, e o substituto de has_one é address=, não owner."  # @src=b1d735e46681
              b:
                # | `realloc_payer = payer` and `address = <the authority expression>`
                label: "`realloc_payer = payer` e `address = <the authority expression>`"  # @src=d7c391223134
                # | Colons out, underscores in, and field equality moved onto a keyword that
                # | takes any expression at all. The two old spellings exit differently:
                # | `realloc::payer` is a hard reject — the colon form does not compile in
                # | V2, which is exactly what the error you hit says — while `has_one` still
                # | builds and just arrives underlined. Either way the port is mechanical.
                feedback: "Dois-pontos fora, underscores dentro, e a igualdade de campo mudou para uma keyword que aceita qualquer expressão. As duas grafias antigas saem de jeitos diferentes: `realloc::payer` é uma rejeição dura — a forma com dois-pontos não compila no V2, que é exatamente o que diz o erro em que você esbarrou — enquanto `has_one` ainda faz build e só chega sublinhado. De todo jeito a migração é mecânica."  # @src=28a020c64690
          q4:
            # | Your `close = player` handler runs with an empty body. What does the
            # | constraint itself accomplish, and why write it that way rather than by hand?
            prompt: "O seu handler `close = player` roda com um corpo vazio. O que o constraint em si realiza, e por que escrever assim em vez de na mão?"  # @src=6daeba3465f5
            # | close = destination returns the account's rent-exempt reserve to the named
            # | destination and invalidates the account so it can't be silently revived, all
            # | inside the derive macro. Using the constraint (rather than hand-rolling the
            # | lamport move) keeps the close atomic and visible in the IDL. Three things
            # | happen together on success: the full lamport balance moves to the
            # | destination, the data is zeroed, and the discriminator is wiped — so there
            # | is no window in which a half-closed account could be mistaken for a live
            # | vault. The handler body can be empty, because the constraint carries the
            # | whole operation.
            explanation: "close = destination devolve a reserva isenta de aluguel da conta ao destino nomeado e invalida a conta para que ela não possa ser silenciosamente revivida, tudo dentro da macro de derive. Usar o constraint (em vez de fazer o movimento de lamports na mão) mantém o close atômico e visível na IDL. Três coisas acontecem juntas no sucesso: o saldo inteiro de lamports se move para o destino, os dados são zerados, e o discriminator é apagado — então não existe janela em que uma conta meio fechada possa ser confundida com um vault vivo. O corpo do handler pode ser vazio, porque o constraint carrega a operação inteira."  # @src=36f1a1dbd95f
            options:                 # source order — keep it
              c:
                # | The rent-exempt lamports return to the player and the account is
                # | invalidated in one atomic step
                label: "Os lamports isentos de aluguel voltam para o jogador e a conta é invalidada em um único passo atômico"  # @src=6e972539652b
                # | Sweep, zero, invalidate: one step, with no half-closed state for anyone
                # | to mistake for a live account. Doing it through the constraint also puts
                # | it in the IDL, where a reader will actually find it.
                feedback: "Varre, zera, invalida: um passo só, sem nenhum estado meio fechado para alguém confundir com uma conta viva. Fazer isso pelo constraint também põe isso na IDL, onde um leitor de fato vai encontrar."  # @src=845c06d978db
              a:
                # | The account's data is copied into the destination account before
                # | deletion, so no vault state is lost
                label: "Os dados da conta são copiados para a conta de destino antes da deleção, então nenhum estado do vault se perde"  # @src=87e0eeed2b15
                # | `close` archives nothing — it zeroes the data and wipes the
                # | discriminator. If you need the state, read it in the handler before the
                # | close takes effect.
                feedback: "`close` não arquiva nada — ele zera os dados e apaga o discriminator. Se você precisa do estado, leia ele no handler antes de o close fazer efeito."  # @src=6f4cb894b789
              b:
                # | Nothing moves; `close` only wipes the discriminator, and the rent-exempt
                # | reserve stays stranded in the PDA
                label: "Nada se move; `close` só apaga o discriminator, e a reserva isenta de aluguel fica presa no PDA"  # @src=dd3f88f8a8f9
                # | The discriminator wipe is real, but it is only one of three steps.
                # | `close` also sweeps every lamport to the destination — stranding the
                # | reserve is the exact failure it exists to prevent.
                feedback: "O apagamento do discriminator é real, mas é só um de três passos. `close` também varre todo lamport para o destino — deixar a reserva presa é exatamente a falha que ele existe para prevenir."  # @src=af05de3846f1
              d:
                # | The reserve returns to whoever funded the rent at init, whatever address
                # | close = names, and the data is zeroed
                label: "A reserva volta para quem bancou o rent no init, seja qual for o endereço que close = nomeia, e os dados são zerados"  # @src=2302682d055f
                # | Runtimes that remember a rent payer do exist, and it would be a sensible
                # | protection to inherit. Solana records no payer on the account: close
                # | sweeps the whole lamport balance to the destination you name, which is
                # | what makes naming the wrong one a real mistake rather than a no-op.
                feedback: "Runtimes que lembram quem pagou o rent existem, e seria uma proteção sensata de herdar. A Solana não registra pagador nenhum na conta: close varre o saldo inteiro de lamports para o destino que você nomeia, que é o que torna nomear o errado um erro de verdade em vez de um no-op."  # @src=dab6682beb2e
  m03-l3:
    # | Write your own constraint: the AccountConstraint trait
    title: "Escreva o seu próprio constraint: o trait AccountConstraint"  # @src=ce043620e3c1
    blocks:
      custom-min-balance-constraint:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The floor is inclusive: a balance equal to min passes.
          0: "O piso é inclusivo: um saldo igual a min passa."  # @src=e3f8b25d307b
          # | The rule is one comparison in MinBalanceRule::meets_floor; check and
          # | run_constraint are already wired for you.
          1: "A regra é uma comparação só em MinBalanceRule::meets_floor; check e run_constraint já estão ligados para você."  # @src=b9800129b175
          # | The verification harness is compile-time. If the build fails, read the
          # | assertion message: it names the case your comparison got wrong.
          2: "A bancada de verificação é de tempo de compilação. Se o build falha, leia a mensagem da asserção: ela nomeia o caso que a sua comparação errou."  # @src=6c8eb4146f89
        tests:                      # keyed by test case id
          t1:
            # | balance above the floor passes
            description: "saldo acima do piso passa"  # @src=9c0be5ef0fc1
          t2:
            # | balance exactly at the floor passes
            description: "saldo exatamente no piso passa"  # @src=f0e215cc9c95
          t3:
            # | balance below the floor is rejected
            description: "saldo abaixo do piso é rejeitado"  # @src=48f5cefba540
          t4:
            # | an empty account is rejected by a 1-lamport floor
            description: "uma conta vazia é rejeitada por um piso de 1 lamport"  # @src=edc1fb1f3cb7
          t5:
            # | a zero floor admits an empty account — a hook comparing against any positive
            # | constant instead of self.min fails here
            description: "um piso zero admite uma conta vazia — um hook comparando contra qualquer constante positiva em vez de self.min falha aqui"  # @src=882b6b673772
          t6:
            # | the same balance that passed a 100 floor is rejected by a 200 floor: the
            # | threshold has to come from self.min
            description: "o mesmo saldo que passou num piso de 100 é rejeitado por um piso de 200: o limiar tem que vir de self.min"  # @src=23206d42c63e
      check:                      # quiz
        questions:
          q1:
            # | You want `#[account(quarters::min_balance = 100)]` to reject an underfunded
            # | vault. Which AccountConstraint hook does the rule belong in, and why?
            prompt: "Você quer que `#[account(quarters::min_balance = 100)]` rejeite um vault subfinanciado. Em qual hook do AccountConstraint a regra pertence, e por quê?"  # @src=d94fec2e5814
            # | check is the validation hook: it runs after load and before the handler, on
            # | every matching instruction, which is precisely where an invariant like a
            # | balance floor belongs. init is create-only and exit is post-handler, so
            # | neither gives you the up-front, every-call gate a min_balance constraint
            # | needs. Said the way the lesson argues it: the vault must ALREADY satisfy the
            # | invariant for the instruction to proceed, and that is re-verified each call,
            # | never cached and never one-time — which is the definition of a read-time
            # | gate. `update` is out too: it only fires inside an explicit `update(...)`
            # | clause, and a floor validates rather than mutates.
            explanation: "check é o hook de validação: ele roda depois do load e antes do handler, em toda instrução que casa, que é precisamente onde um invariante como um piso de saldo pertence. init é só de criação e exit é pós-handler, então nenhum dos dois te dá a trava adiantada, de toda chamada, de que um constraint min_balance precisa. Dito do jeito que a lição argumenta: o vault tem que JÁ satisfazer o invariante para a instrução prosseguir, e isso é re-verificado a cada chamada, nunca em cache e nunca uma vez só — que é a definição de uma trava de tempo de leitura. `update` está fora também: ele só dispara dentro de uma cláusula `update(...)` explícita, e um piso valida em vez de mutar."  # @src=f55cad00af53
            options:                 # source order — keep it
              a:
                # | check — a read-time gate on the loaded account, re-verified before every
                # | matching handler runs
                label: "check — uma trava de tempo de leitura na conta carregada, re-verificada antes de todo handler que casa rodar"  # @src=177982671980
                # | Of the other three, one fires once at creation, one only for accounts
                # | that get written back out, and the last mutates instead of judging. A
                # | floor has to hold on every call — that rules out all three.
                feedback: "Dos outros três, um dispara uma vez na criação, um só para contas que são escritas de volta, e o último muta em vez de julgar. Um piso tem que valer em toda chamada — isso descarta os três."  # @src=2344fbbd729d
              c:
                # | exit — the hook fires during account serialization, so it validates the
                # | final state written back out
                label: "exit — o hook dispara durante a serialização da conta, então ele valida o estado final escrito de volta"  # @src=aecdad278719
                # | exit runs after the handler, and only for accounts that were mutated and
                # | serialize back out. The read-only vault in RequireFunded is not even
                # | `mut`, so exit never fires for it — and a post-hoc assertion is not the
                # | up-front gate a floor needs.
                feedback: "exit roda depois do handler, e só para contas que foram mutadas e serializam de volta. O vault somente-leitura em RequireFunded nem é `mut`, então exit nunca dispara para ele — e uma asserção post-hoc não é a trava adiantada de que um piso precisa."  # @src=4f40ef9de490
              d:
                # | update - the hook fires whenever a constrained value is written, so the
                # | floor tracks changes
                label: "update - o hook dispara sempre que um valor com constraint é escrito, então o piso acompanha as mudanças"  # @src=8a94a749e1b0
                # | The fourth hook, and the one whose name most suggests a live invariant
                # | that follows the account around. update fires only inside an explicit
                # | update(...) clause, and it exists for a constraint that mutates the
                # | account; a floor judges rather than writes.
                feedback: "O quarto hook, e aquele cujo nome mais sugere um invariante vivo que segue a conta por aí. update só dispara dentro de uma cláusula update(...) explícita, e ele existe para um constraint que muta a conta; um piso julga em vez de escrever."  # @src=a7e61f51165b
              b:
                # | init — the floor is a creation-time invariant, so it is enforced once
                # | after the account is allocated
                label: "init — o piso é um invariante de tempo de criação, então ele é imposto uma vez depois que a conta é alocada"  # @src=d2da037ba970
                # | init fires only on the create path, and a balance floor has to hold on
                # | every instruction that loads the vault. Enforce it at birth alone and
                # | the very next set_credit can drop credit under the floor with nothing to
                # | catch it.
                feedback: "init dispara só no caminho de criação, e um piso de saldo tem que valer em toda instrução que carrega o vault. Imponha ele só no nascimento e o set_credit seguinte consegue derrubar credit abaixo do piso sem nada para pegar isso."  # @src=6075320d04a2
          q2:
            # | Why does V2 dispatch namespaced constraints through an open
            # | AccountConstraint trait instead of just adding more built-in keywords?
            prompt: "Por que o V2 despacha constraints com namespace por um trait AccountConstraint aberto em vez de só acrescentar mais keywords embutidas?"  # @src=cde948f06e94
            # | No framework author can enumerate every program's invariants ahead of time.
            # | By routing ns::key = val through a trait you implement for a marker type, V2
            # | lets you (and any downstream crate) ship new, IDL-visible constraints
            # | without forking the framework — the same open-at-the-seams philosophy behind
            # | the public AnchorAccount/Id/Discriminator traits. The alternatives all fail
            # | on a specific axis: a handler `if` is invisible in the IDL and not inherited
            # | by the next call site, a fork is yours to re-merge every release, and an
            # | inline `constraint = <expr>` is an anonymous boolean you cannot name, reuse,
            # | or read off an interface.
            explanation: "Nenhum autor de framework consegue enumerar de antemão os invariantes de todo programa. Roteando ns::key = val por um trait que você implementa para um tipo marcador, o V2 deixa você (e qualquer crate downstream) entregar constraints novos e visíveis na IDL sem fazer um fork do framework — a mesma filosofia de aberto-nas-costuras atrás dos traits públicos AnchorAccount/Id/Discriminator. As alternativas falham todas num eixo específico: um `if` de handler é invisível na IDL e não é herdado pelo call site seguinte, um fork é seu para refazer o merge a cada release, e um `constraint = <expr>` inline é um booleano anônimo que você não consegue nomear, reusar, nem ler de uma interface."  # @src=c90c9a1a7a87
            options:                 # source order — keep it
              a:
                # | Trait dispatch monomorphizes at compile time, so the emitted check costs
                # | fewer compute units than a built-in keyword
                label: "O despacho por trait monomorfiza em tempo de compilação, então a checagem emitida custa menos compute units do que uma keyword embutida"  # @src=97d3619ee260
                # | Both forms are resolved by the proc macro and expand to inline code in
                # | the same instruction, so there is no CU gap between a built-in keyword
                # | and a trait-dispatched one. The motivation is extensibility, not
                # | performance — and the lesson is explicit that the cost of a cheap check
                # | is a wash.
                feedback: "As duas formas são resolvidas pela proc macro e expandem para código inline na mesma instrução, então não existe diferença de CU entre uma keyword embutida e uma despachada por trait. A motivação é extensibilidade, não performance — e a lição é explícita de que o custo de uma checagem barata dá na mesma."  # @src=e11a7b9515d9
              b:
                # | No framework author can enumerate every program's invariants, so the
                # | surface is left open to downstream crates
                label: "Nenhum autor de framework consegue enumerar os invariantes de todo programa, então a superfície fica aberta para crates downstream"  # @src=c2f3a4c03a9b
                # | A handler branch never reaches the IDL, a fork is something you re-merge
                # | forever, and an inline boolean cannot be named or reused. Three
                # | different ways to lose, which is roughly the argument.
                feedback: "Um branch de handler nunca chega na IDL, um fork é uma coisa cujo merge você refaz para sempre, e um booleano inline não consegue ser nomeado nem reusado. Três jeitos diferentes de perder, que é mais ou menos o argumento."  # @src=e61563bed448
              c:
                # | The token::* namespace requires it, and every other namespace only
                # | reaches the trait as an accidental side effect
                label: "O namespace token::* exige isso, e todo outro namespace só alcança o trait como um efeito colateral acidental"  # @src=15736dc69c81
                # | This has the exception backwards. token::* is the ONE namespace the core
                # | derive still handles itself, for anchor-spl's sake; every other
                # | namespace routes through AccountConstraint deliberately, not
                # | incidentally.
                feedback: "Isto tem a exceção ao contrário. token::* é O ÚNICO namespace que o derive central ainda trata sozinho, para o bem do anchor-spl; todo outro namespace roteia por AccountConstraint de propósito, não por acaso."  # @src=9c3c8dfc0f4d
              d:
                # | Because a trait impl gets evaluated at compile time, while a built-in
                # | keyword has to fire at runtime
                label: "Porque um impl de trait é avaliado em tempo de compilação, enquanto uma keyword embutida tem que disparar em tempo de execução"  # @src=ec5c4a70dbeb
                # | Traits do get resolved by the compiler, so the reasoning is not idle.
                # | Both forms are expanded by the proc macro into inline code in the same
                # | instruction, so a check hook runs at runtime and draws on the same
                # | compute budget your handler does. The motivation is extensibility, not
                # | speed.
                feedback: "Traits são sim resolvidos pelo compilador, então o raciocínio não é à toa. As duas formas são expandidas pela proc macro em código inline na mesma instrução, então um hook check roda em tempo de execução e puxa do mesmo orçamento de compute que o seu handler. A motivação é extensibilidade, não velocidade."  # @src=75f0d830805e
          q3:
            # | Your min_balance check hook does a modest comparison, but a teammate
            # | proposes a version that re-reads and re-hashes a large slab on every call.
            # | What's the cost you just signed up for?
            prompt: "O seu hook check de min_balance faz uma comparação modesta, mas um colega propõe uma versão que relê e refaz o hash de um slab grande a cada chamada. Qual é o custo com o qual você acabou de se comprometer?"  # @src=f17fe7366beb
            # | A check hook executes each time the constraint matches, inside the
            # | instruction's compute budget. An expensive hook is CU you pay on every call
            # | to a hot path — and because the account then reads as 'valid', a heavy or
            # | wrong check can also hide logic bugs behind a passing constraint. Keep hooks
            # | cheap and correct. Note the asymmetry the lesson draws: against a handler
            # | `if` you wrote once, a cheap comparison in a hook is a wash, and the reuse
            # | plus IDL visibility are pure gain. It is the expensive hook and the subtly
            # | wrong hook that compound, because both now ride along on every instruction
            # | that declares the constraint.
            explanation: "Um hook check executa toda vez que o constraint casa, dentro do orçamento de compute da instrução. Um hook caro é CU que você paga em toda chamada a um caminho quente — e porque a conta então lê como 'válida', uma checagem pesada ou errada também consegue esconder bugs de lógica atrás de um constraint que passa. Mantenha os hooks baratos e corretos. Repare na assimetria que a lição desenha: contra um `if` de handler que você escreveu uma vez, uma comparação barata num hook dá na mesma, e o reuso mais a visibilidade na IDL são ganho puro. É o hook caro e o hook sutilmente errado que se acumulam, porque os dois agora pegam carona em toda instrução que declara o constraint."  # @src=3a3e11e2705f
            options:                 # source order — keep it
              c:
                # | The expensive check runs on every matching instruction, so you pay that
                # | CU on a hot path forever
                label: "A checagem cara roda em toda instrução que casa, então você paga aquela CU num caminho quente para sempre"  # @src=e77974c190d4
                # | Same budget as the handler, every call, forever. A cheap comparison is a
                # | wash; an expensive one is a tax you keep paying, and a wrong one reads
                # | as a passing constraint.
                feedback: "Mesmo orçamento que o handler, toda chamada, para sempre. Uma comparação barata dá na mesma; uma cara é um imposto que você segue pagando, e uma errada lê como um constraint que passa."  # @src=d8f9a380d743
              a:
                # | Nothing — constraint hooks are metered separately, outside the
                # | instruction's own compute budget
                label: "Nada — hooks de constraint são medidos separadamente, fora do orçamento de compute da própria instrução"  # @src=9cf9751cc8e4
                # | There is no separate meter. A check hook executes inside the same
                # | instruction as the handler and draws on the same compute budget, so
                # | every CU it burns is a CU the handler no longer has.
                feedback: "Não existe medidor separado. Um hook check executa dentro da mesma instrução que o handler e puxa do mesmo orçamento de compute, então toda CU que ele queima é uma CU que o handler não tem mais."  # @src=0fc46d9f77b0
              b:
                # | One time at init — codegen caches the check result on the account so
                # | later instructions skip the hook
                label: "Uma vez no init — o codegen faz cache do resultado da checagem na conta para que instruções posteriores pulem o hook"  # @src=aa33fac00347
                # | Codegen caches nothing. `ns::key = value` routes to check, and check
                # | re-runs on every instruction that declares the constraint, so the cost
                # | recurs on each call rather than amortizing at creation.
                feedback: "O codegen não faz cache de nada. `ns::key = value` roteia para check, e check roda de novo em toda instrução que declara o constraint, então o custo se repete a cada chamada em vez de amortizar na criação."  # @src=e4a611a043c9
              d:
                # | Just the calls that take the vault as mut, since a load without mut
                # | usually skips hooks
                label: "Só as chamadas que recebem o vault como mut, já que um load sem mut costuma pular hooks"  # @src=e5681276e34c
                # | A cost that scales with writes would be a comfortable rule, and exit
                # | really does behave that way. check does not: the vault on RequireFunded
                # | is not even mut, and the hook still runs on every instruction that
                # | declares the constraint.
                feedback: "Um custo que escala com escritas seria uma regra confortável, e o exit realmente se comporta desse jeito. O check não: o vault em RequireFunded nem é mut, e o hook ainda roda em toda instrução que declara o constraint."  # @src=fc58dd33770e
  m04-l1:
    # | CPI basics and signing as a PDA
    title: "O básico de CPI e assinar como um PDA"  # @src=7824fe37f055
    blocks:
      resolve-withdrawal:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the three failure cases first, then compute the safe remainder.
          0: "Cheque os três casos de falha primeiro, depois calcule o restante seguro."  # @src=2bb71ee850b6
          # | The rent-exempt floor is what keeps the PDA alive; letting the balance fall
          # | below it can close the account.
          1: "O piso isento de aluguel é o que mantém o PDA vivo; deixar o saldo cair abaixo dele pode fechar a conta."  # @src=d64f9c4c1205
        tests:                      # keyed by test case id
          t1:
            # | A withdrawal that leaves the vault rent-exempt returns the requested amount.
            description: "Um withdrawal que deixa o vault isento de aluguel devolve o valor pedido."  # @src=6f153915b12e
          t2:
            # | A zero request is refused with -1.
            description: "Um pedido zerado é recusado com -1."  # @src=c9a891d4f577
          t3:
            # | An over-withdraw (requested > balance) is refused with -2 instead of
            # | underflowing.
            description: "Um over-withdraw (requested > balance) é recusado com -2 em vez de dar underflow."  # @src=e3cb179796c7
          t4:
            # | A withdrawal that would drop the remainder below the rent-exempt minimum is
            # | refused with -3.
            description: "Um withdrawal que derrubaria o restante abaixo do mínimo isento de aluguel é recusado com -3."  # @src=86885b7d477f
          t5:
            # | The boundary is inclusive: a withdrawal leaving EXACTLY the rent-exempt
            # | minimum is allowed. A guard written `remaining <= rent_exempt_min` refuses
            # | this and passes every other case.
            description: "O limite é inclusivo: um withdrawal que deixa EXATAMENTE o mínimo isento de aluguel é permitido. Uma trava escrita como `remaining <= rent_exempt_min` recusa este e passa em todos os outros casos."  # @src=7f9c99c49b29
          t6:
            # | One lamport past the boundary: leaving rent_exempt_min - 1 is refused with
            # | -3.
            description: "Um lamport além do limite: deixar rent_exempt_min - 1 é recusado com -3."  # @src=76f7b50a4efe
          t7:
            # | An over-withdraw that would ALSO breach the rent floor is still -2: the
            # | balance check is reached first.
            description: "Um over-withdraw que TAMBÉM romperia o piso de aluguel continua sendo -2: a checagem de saldo é alcançada primeiro."  # @src=93eaa2515df5
      check:                      # quiz
        questions:
          m04-l1-q1:
            # | You wired the vault's withdraw to sign as a PDA. What do you pass to
            # | invoke_signed as the signer seeds?
            prompt: "Você ligou o withdraw do vault para assinar como um PDA. O que você passa para o invoke_signed como as signer seeds?"  # @src=81e011a64271
            # | A PDA is off the ed25519 curve and has no private key, so the runtime lets
            # | the owning program sign for it by presenting the exact seeds plus the
            # | canonical bump. You stored that bump at initialization precisely so withdraw
            # | can rebuild the signer seeds cheaply and deterministically. Note whose seeds
            # | they are: withdraw moves lamports out of the zero-data SOL PDA, so the seeds
            # | are [b"sol", owner] with state.sol_bump, not the state PDA's own [b"vault",
            # | owner]. Re-derivation is bound to the calling program's ID, which is why no
            # | other program can present those seeds and sign for your vault.
            explanation: "Um PDA está fora da curva ed25519 e não tem chave privada, então o runtime deixa o programa dono assinar por ele apresentando as seeds exatas mais o bump canônico. Você armazenou esse bump na inicialização precisamente para o withdraw conseguir remontar as signer seeds de forma barata e determinística. Repare de quem são essas seeds: o withdraw move lamports para fora do PDA de SOL sem dados, então as seeds são [b\"sol\", owner] com state.sol_bump, não as [b\"vault\", owner] do próprio PDA de state. A re-derivação é presa ao ID do programa chamador, que é a razão de nenhum outro programa conseguir apresentar essas seeds e assinar pelo seu vault."  # @src=6342a9a13c15
            options:                 # source order — keep it
              c:
                # | A bump recomputed by calling find_program_address for [b"sol", owner]
                # | inside the withdraw handler.
                label: "Um bump recalculado chamando find_program_address para [b\"sol\", owner] dentro do handler withdraw."  # @src=5c00745fa674
                # | That compiles and usually works, which is what makes it tempting. But
                # | find_program_address walks bumps downward from 255 with a syscall per
                # | attempt, so you pay for the search on every withdraw, and a hand-rolled
                # | derivation can land on a non-canonical address. Store the bump at init
                # | and reuse it.
                feedback: "Isso compila e normalmente funciona, que é o que torna a opção tentadora. Mas o find_program_address caminha bumps para baixo a partir de 255 com um syscall por tentativa, então você paga pela busca em todo withdraw, e uma derivação feita na mão pode aterrissar num endereço não canônico. Armazene o bump no init e reuse ele."  # @src=d51b3289a8af
              a:
                # | The SOL vault's own seeds plus its stored canonical bump: [b"sol",
                # | owner.as_ref(), &[state.sol_bump]].
                label: "As seeds do próprio SOL vault mais o bump canônico armazenado dele: [b\"sol\", owner.as_ref(), &[state.sol_bump]]."  # @src=b90e7b475be6
                # | Lamports leave the zero-data PDA, so it is that account's seed set you
                # | present, not the state account's. That is the easy slip here. Derivation
                # | is scoped to the invoking program id, so nobody else can present them.
                feedback: "Os lamports saem do PDA sem dados, então é o conjunto de seeds daquela conta que você apresenta, não o da conta de state. É esse o escorregão fácil aqui. A derivação tem escopo no id do programa que invoca, então mais ninguém consegue apresentar elas."  # @src=9911c712948f
              d:
                # | The state PDA's seeds plus its stored bump: [b"vault", owner.as_ref(),
                # | &[state.bump]].
                label: "As seeds do PDA de state mais o bump armazenado dele: [b\"vault\", owner.as_ref(), &[state.bump]]."  # @src=5d14817cee8d
                # | The commonest slip on this handler, because the state account is the one
                # | that feels like the vault. The lamports leave the zero-data SOL PDA, so
                # | the seeds you present are that account's, [b"sol", owner] with
                # | state.sol_bump; the state account is only the ledger and signs nothing.
                feedback: "O escorregão mais comum neste handler, porque a conta de state é a que parece ser o vault. Os lamports saem do PDA de SOL sem dados, então as seeds que você apresenta são as daquela conta, [b\"sol\", owner] com state.sol_bump; a conta de state é só o livro-razão e não assina nada."  # @src=9f00d7c97f97
              b:
                # | The authority's secret key bytes, read off the Signer account, since the
                # | authority owns the vault.
                label: "Os bytes de chave secreta da authority, lidos da conta Signer, já que a authority é dona do vault."  # @src=a67e819deca3
                # | A Signer exposes no secret key to the program, and a PDA has no private
                # | key at all. PDA signing is a runtime permission granted from seeds plus
                # | the bump, never a keypair.
                feedback: "Um Signer não expõe chave secreta nenhuma para o programa, e um PDA não tem chave privada nenhuma. A assinatura de PDA é uma permissão do runtime concedida a partir das seeds mais o bump, nunca um keypair."  # @src=8854c1b2370d
          m04-l1-q2:
            # | In Anchor V2, what does CpiContext::new take as its program argument, and
            # | how are the accounts passed?
            prompt: "No Anchor V2, o que o CpiContext::new recebe como argumento de programa, e como as contas são passadas?"  # @src=8322a4ae55af
            # | V2's CpiContext::new(program: &Address, accounts) is the shape you will type
            # | all lesson. The accounts arrive as CpiHandle borrow-tracked handles,
            # | obtained with .cpi_handle() for a read and .cpi_handle_mut() for a write,
            # | which is the detail that makes the next lesson's compile-time safety
            # | possible. The PDA signer rides along separately through
            # | .with_signer(signer_seeds), the ergonomic wrapper over the raw invoke_signed
            # | syscall.
            explanation: "O CpiContext::new(program: &Address, accounts) do V2 é a forma que você vai digitar a lição inteira. As contas chegam como handles CpiHandle com borrow rastreado, obtidos com .cpi_handle() para uma leitura e .cpi_handle_mut() para uma escrita, que é o detalhe que torna possível a segurança em tempo de compilação da próxima lição. O signatário PDA vai junto separadamente através do .with_signer(signer_seeds), o wrapper ergonômico em cima do syscall invoke_signed cru."  # @src=cb2a3cae78a0
            options:                 # source order — keep it
              d:
                # | An &Address for the program, with accounts as an AccountInfo slice you
                # | assemble by hand
                label: "Um &Address para o programa, com as contas como um slice de AccountInfo que você monta na mão"  # @src=51dda89617da
                # | Right about the program argument, which is the half most migrations
                # | reach first. The accounts do not arrive as raw AccountInfos: each is a
                # | CpiHandle from .cpi_handle() or .cpi_handle_mut(), and that borrow is
                # | what the next lesson's compile-time safety rests on.
                feedback: "Certo sobre o argumento de programa, que é a metade que a maioria das migrações alcança primeiro. As contas não chegam como AccountInfos crus: cada uma é um CpiHandle vindo de .cpi_handle() ou .cpi_handle_mut(), e é nesse borrow que a segurança em tempo de compilação da próxima lição se apoia."  # @src=48794c73daab
              c:
                # | A Pubkey by value for the program, with accounts as plain &mut
                # | references.
                label: "Um Pubkey por valor para o programa, com as contas como referências &mut simples."  # @src=1c64c0f92f66
                # | The Anchor 1.0 line did take the program as a Pubkey, so this is the
                # | natural half-migration guess. V2 takes a &Address and wraps each account
                # | in a CpiHandle instead of a bare mutable reference.
                feedback: "A linha 1.0 do Anchor de fato recebia o programa como um Pubkey, então este é o palpite natural de meia migração. O V2 recebe um &Address e embrulha cada conta num CpiHandle em vez de uma referência mutável pelada."  # @src=b6826697626e
              b:
                # | A &Address for the program, with accounts as CpiHandle borrow-tracked
                # | handles.
                label: "Um &Address para o programa, com as contas como handles CpiHandle com borrow rastreado."  # @src=92004846cc1b
                # | Read accessor or mutable one: that single distinction is the hinge
                # | everything in the next lesson turns on. Signer seeds do not ride in the
                # | constructor at all. They arrive through a separate wrapper.
                feedback: "Acessor de leitura ou mutável: essa distinção sozinha é a dobradiça em que tudo da próxima lição gira. As signer seeds não vão no construtor de jeito nenhum. Elas chegam através de um wrapper separado."  # @src=0ff4be96d0fe
              a:
                # | An AccountInfo for the target program, with accounts as plain typed
                # | structs.
                label: "Um AccountInfo para o programa alvo, com as contas como structs tipadas simples."  # @src=5bc9607fcd36
                # | That is the pre-1.0 shape, and it is still what a lot of tutorials show.
                # | V2 changed both halves: the program argument type and the way accounts
                # | are handed over.
                feedback: "Essa é a forma pré-1.0, e ainda é o que muito tutorial mostra. O V2 mudou as duas metades: o tipo do argumento de programa e o jeito como as contas são entregues."  # @src=50dbcbbd6df1
          m04-l1-q3:
            # | Your withdraw debits state.credit after the transfer. Which line is safe
            # | under the house rules?
            prompt: "O seu withdraw debita state.credit depois da transferência. Qual linha é segura sob as regras da casa?"  # @src=a4872ae391f3
            # | checked_sub returns None on underflow instead of panicking, and the ? turns
            # | that into a clean program error the caller can handle. On a custody path
            # | this is the difference between a rejected transaction and an aborted
            # | instruction with a confusing panic log. It also matters because atomicity
            # | only rewinds errors, not silent bugs: if the debit raises, the whole
            # | instruction aborts and the transfer that already ran unwinds with it, but a
            # | wrap never raises, so nothing rolls back and the vault is left believing it
            # | holds eighteen quintillion lamports. Make the bug an error.
            explanation: "O checked_sub devolve None no underflow em vez de dar panic, e o ? transforma isso num erro de programa limpo com o qual o chamador consegue lidar. Num caminho de custódia essa é a diferença entre uma transação rejeitada e uma instrução abortada com um log de panic confuso. Também importa porque a atomicidade só rebobina erros, não bugs silenciosos: se o débito levanta, a instrução inteira aborta e a transferência que já rodou é desenrolada junto, mas um wrap nunca levanta, então nada é desfeito e o vault fica acreditando que segura dezoito quintilhões de lamports. Faça do bug um erro."  # @src=a043499db231
            options:                 # source order — keep it
              a:
                # | state.credit = state.credit - amount; // safe: rustc panics on underflow
                label: "state.credit = state.credit - amount; // seguro: o rustc dá panic no underflow"  # @src=b9e5b6447c29
                # | A default debug build does panic, which is where that belief comes from.
                # | But whether an optimized build panics or wraps is a manifest setting,
                # | not a rustc constant: with overflow-checks off, the subtraction wraps
                # | silently to a value near u64::MAX. A flag someone can flip is no guard,
                # | and neither a panic nor a wrap is acceptable on a custody path.
                feedback: "Um build de debug default de fato dá panic, que é de onde vem essa crença. Mas se um build otimizado dá panic ou dá wrap é uma configuração do manifesto, não uma constante do rustc: com overflow-checks desligado, a subtração dá wrap em silêncio para um valor perto de u64::MAX. Uma flag que alguém pode virar não é trava nenhuma, e nem um panic nem um wrap é aceitável num caminho de custódia."  # @src=468a4990370d
              b:
                # | state.credit -= amount; // safe: the require! above proved amount <=
                # | vault lamports
                label: "state.credit -= amount; // seguro: o require! acima provou amount <= lamports do vault"  # @src=373add586b5c
                # | The guard proves the request fits the SOL vault's lamport balance.
                # | state.credit is the separate ledger figure, and the two can drift apart,
                # | so the debit can still underflow. Use checked_sub.
                feedback: "A trava prova que o pedido cabe no saldo de lamports do SOL vault. state.credit é o número separado do livro-razão, e os dois podem se descolar, então o débito ainda pode dar underflow. Use checked_sub."  # @src=21b734856ac3
              c:
                # | state.credit =
                # | state.credit.checked_sub(amount).ok_or(VaultError::Underflow)?;
                label: "state.credit = state.credit.checked_sub(amount).ok_or(VaultError::Underflow)?;"  # @src=36e3c5ed9158
                # | Atomicity only rewinds what raises, and a wrap raises nothing: the
                # | transfer commits and the ledger quietly disagrees with it. Turning the
                # | None into an error is what gives atomicity something to catch.
                feedback: "A atomicidade só rebobina o que levanta, e um wrap não levanta nada: a transferência commita e o livro-razão discorda dela em silêncio. Transformar o None num erro é o que dá à atomicidade alguma coisa para pegar."  # @src=e6d23d475131
              d:
                # | state.credit = state.credit.saturating_sub(amount); // safe: floors at
                # | zero, no wrap
                label: "state.credit = state.credit.saturating_sub(amount); // seguro: para no zero, sem wrap"  # @src=ff264429e4aa
                # | It does remove the wrap, which is the failure this lesson opened on, so
                # | it reads like the safe pick. Flooring at zero is still a silent answer:
                # | an over-withdraw leaves the ledger reading zero and raises nothing, so
                # | nothing rolls back the transfer that already ran.
                feedback: "Ele de fato remove o wrap, que é a falha com que esta lição abriu, então parece a escolha segura. Parar no zero continua sendo uma resposta silenciosa: um over-withdraw deixa o livro-razão marcando zero e não levanta nada, então nada desfaz a transferência que já rodou."  # @src=ba4bd5277628
  m04-l2:
    # | The reload footgun is gone
    title: "A cilada do reload acabou"  # @src=318a41565a40
    blocks:
      settlement-receipt:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The handles do not die when the TransferChecked literal closes, and not when
          # | the let cpi statement ends. They die when transfer_checked takes the
          # | CpiContext by value, and that call is the boundary every read has to fall on
          # | one side of.
          0: "Os handles não morrem quando o literal TransferChecked fecha, e nem quando o statement let cpi acaba. Eles morrem quando transfer_checked toma o CpiContext por valor, e essa chamada é a fronteira da qual toda leitura tem que cair de um lado."  # @src=beb66ae5bba8
          # | Only the accounts the CPI was handed are locked, and only as hard as their
          # | handle: mint went in through a shared cpi_handle(), which is why reading
          # | mint.decimals() inside that same span is not the error and moving it will not
          # | help.
          1: "Só as contas que foram entregues à CPI ficam travadas, e só tão forte quanto o handle delas: mint entrou por um cpi_handle() compartilhado, que é por que ler mint.decimals() dentro desse mesmo span não é o erro e mover isso não vai ajudar."  # @src=61e3b1b2f4dc
          # | Compiling is half the bar. Whenever amount is non-zero the two numbers in the
          # | receipt have to differ, so a fix that only silences E0502 can still report the
          # | same balance twice and be graded wrong.
          2: "Compilar é metade da barra. Sempre que amount for diferente de zero os dois números do recibo têm que diferir, então uma correção que só silencia o E0502 ainda pode reportar o mesmo saldo duas vezes e ser avaliada como errada."  # @src=b6669be16bbd
        tests:                      # keyed by test case id
          t1:
            # | A plain settlement: the receipt opens at 100 and closes at 60, so the two
            # | numbers must be read on opposite sides of the transfer.
            description: "Um acerto simples: o recibo abre em 100 e fecha em 60, então os dois números têm que ser lidos em lados opostos da transferência."  # @src=ce20046d127f
          t2:
            # | A full drain: closing is 0. Any implementation that reports the same balance
            # | twice fails here.
            description: "Uma drenagem total: o fechamento é 0. Qualquer implementação que reporta o mesmo saldo duas vezes falha aqui."  # @src=205a2a75820e
          t3:
            # | A zero-amount settlement, where a stale read happens to be right: opening
            # | and closing coincide, so this is the one case a misplaced read still passes.
            # | That is the v1 footgun's whole disguise.
            description: "Um acerto de valor zero, em que uma leitura obsoleta por acaso está certa: abertura e fechamento coincidem, então este é o único caso em que uma leitura fora de lugar ainda passa. É esse o disfarce inteiro da cilada do v1."  # @src=b31856440757
          t4:
            # | One token unit off a million: the two reads differ by the smallest possible
            # | margin, so a receipt that reports one number twice is still wrong here.
            description: "Uma unidade de token a menos num milhão: as duas leituras diferem pela menor margem possível, então um recibo que reporta um número duas vezes continua errado aqui."  # @src=763d09614b5b
          t5:
            # | The vault empties into an already-large recipient: closing is read from the
            # | vault, never from the recipient.
            description: "O vault se esvazia dentro de um recipient que já é grande: o fechamento é lido do vault, nunca do recipient."  # @src=980b37047644
      check:                      # quiz
        questions:
          m04-l2-q1:
            # | You try to read ctx.accounts.vault's typed balance while a cpi_handle_mut
            # | taken from that same vault account is still in scope. What happens in V2?
            prompt: "Você tenta ler o saldo tipado de ctx.accounts.vault enquanto um cpi_handle_mut tomado daquela mesma conta vault ainda está em escopo. O que acontece no V2?"  # @src=c2c836090456
            # | The CpiHandle is a Rust borrow of that one account. While it is alive the
            # | borrow checker will not let you also borrow the same account's typed data,
            # | so the classic read-during-a-live-CPI line cannot be written — and the lock
            # | is exact: accounts you did not hand the CPI stay readable the whole time.
            # | Safety here is a property of the type system, not a runtime check you might
            # | forget. Once the handle drops the read is legal and already fresh, because
            # | V2's Account<T> is a zero-copy view over the account's live buffer rather
            # | than a deserialized copy sitting on your stack.
            explanation: "O CpiHandle é um borrow do Rust daquela única conta. Enquanto ele está vivo o borrow checker não deixa você também fazer borrow dos dados tipados da mesma conta, então a clássica linha de leitura-durante-uma-CPI-viva não pode ser escrita — e a trava é exata: contas que você não entregou à CPI continuam legíveis o tempo todo. Segurança aqui é uma propriedade do sistema de tipos, não uma checagem em tempo de execução que você pode esquecer. Assim que o handle é solto a leitura é legal e já vem fresca, porque o Account<T> do V2 é uma view zero-copy sobre o buffer vivo da conta e não uma cópia desserializada parada na sua stack."  # @src=147395ef5157
            options:                 # source order — keep it
              d:
                # | It compiles: a CpiHandle borrows the raw AccountInfo, and typed field
                # | reads take a separate path the borrow checker misses
                label: "Compila: um CpiHandle faz borrow do AccountInfo cru, e leituras de campo tipadas tomam um caminho separado que o borrow checker não vê"  # @src=5e823bb0c37a
                # | It would be a real hole if the handle and the typed read went through
                # | different borrows, and that is worth checking rather than assuming. They
                # | do not: a CpiHandle is an ordinary Rust borrow of that account field, so
                # | a typed read of the same field is the second conflicting borrow and the
                # | build stops.
                feedback: "Seria um buraco de verdade se o handle e a leitura tipada passassem por borrows diferentes, e isso vale checar em vez de presumir. Eles não passam: um CpiHandle é um borrow comum do Rust daquele campo de conta, então uma leitura tipada do mesmo campo é o segundo borrow conflitante e o build para."  # @src=c0e0563a7e09
              a:
                # | It is a compile error: the live CpiHandle holds a mutable borrow of that
                # | account, which excludes typed reads of it.
                label: "É um erro de compilação: o CpiHandle vivo segura um borrow mutável daquela conta, o que exclui leituras tipadas dela."  # @src=4385fdcf9fce
                # | One account wide, no wider — hand the CPI a vault and the config beside
                # | it stays readable the whole time. When the handle goes, the read is
                # | legal again and already current, because there was never a copy to
                # | refresh.
                feedback: "Uma conta de largura, nada mais — entregue um vault à CPI e o config ao lado dele continua legível o tempo todo. Quando o handle vai embora, a leitura é legal de novo e já está atual, porque nunca existiu uma cópia para atualizar."  # @src=47ff70961b29
              b:
                # | It compiles and returns the pre-CPI value until you call
                # | ctx.accounts.vault.reload() to refresh the copy.
                label: "Compila e retorna o valor pré-CPI até você chamar ctx.accounts.vault.reload() para atualizar a cópia."  # @src=fa26e41e6263
                # | That is the v1 behavior, and .reload() is a v1 API. V2 removes it and
                # | makes the stale read impossible to write in the first place.
                feedback: "Esse é o comportamento do v1, e .reload() é uma API do v1. O V2 remove ele e torna a leitura obsoleta impossível de escrever já de saída."  # @src=d6d89f94d61d
              c:
                # | It compiles and returns the post-CPI value, because V2's Account<T> is a
                # | zero-copy view over live bytes.
                label: "Compila e retorna o valor pós-CPI, porque o Account<T> do V2 é uma view zero-copy sobre bytes vivos."  # @src=f1359daabcbb
                # | Account<T> being a zero-copy view is why a read is fresh once the handle
                # | drops, but it does not make the read legal while the handle is live: the
                # | borrow checker rejects it, so the line never compiles.
                feedback: "O Account<T> ser uma view zero-copy é por que uma leitura vem fresca assim que o handle é solto, mas isso não torna a leitura legal enquanto o handle está vivo: o borrow checker rejeita ela, então a linha nunca compila."  # @src=25b15083e6ab
          m04-l2-q2:
            # | How is this different from the v1 footgun it replaces?
            prompt: "Como isso é diferente da cilada do v1 que ele substitui?"  # @src=f9fb6ac1b1cd
            # | The v1 hazard was invisible: your program compiled, ran, and acted on data
            # | from before the CPI, and only a careful test or an incident revealed it. V2
            # | moves the failure from runtime-and-silent to compile-time-and-loud, which is
            # | the entire point of the borrow model. v1's only defence was remembering to
            # | call .reload() after every mutating CPI — one cheap line whose omission
            # | produced no error, no warning, and no panic.
            explanation: "O perigo do v1 era invisível: o seu programa compilava, rodava, e agia sobre dados de antes da CPI, e só um teste cuidadoso ou um incidente revelava isso. O V2 move a falha de tempo-de-execução-e-silenciosa para tempo-de-compilação-e-barulhenta, que é o ponto inteiro do modelo de borrow. A única defesa do v1 era lembrar de chamar .reload() depois de toda CPI que muta — uma linha barata cuja omissão não produzia erro nenhum, aviso nenhum, e panic nenhum."  # @src=5b7ace36e01c
            options:                 # source order — keep it
              c:
                # | v1 panicked at runtime whenever a post-CPI read hit an invalidated copy.
                label: "O v1 dava panic em tempo de execução sempre que uma leitura pós-CPI batia numa cópia invalidada."  # @src=496b68035faf
                # | It did not panic. The deserialized copy was a perfectly valid struct
                # | holding an out-of-date number, so v1 quietly handed you old data —
                # | silent-and-wrong, which is worse than a panic because nothing points at
                # | it.
                feedback: "Ele não dava panic. A cópia desserializada era uma struct perfeitamente válida segurando um número desatualizado, então o v1 te entregava dados velhos em silêncio — silencioso-e-errado, que é pior que um panic porque nada aponta para isso."  # @src=1447d7450f9f
              b:
                # | In v1 the stale read compiled and returned the pre-CPI copy; V2 makes it
                # | a compile error.
                label: "No v1 a leitura obsoleta compilava e retornava a cópia pré-CPI; o V2 transforma isso em erro de compilação."  # @src=c80dd1bb6d0c
                # | The v1 remedy was one line you had to remember, and forgetting it
                # | produced no diagnostic whatsoever — not an error, not a warning,
                # | nothing. Trading a silent wrong answer for a loud build failure is the
                # | whole of the deal.
                feedback: "O remédio do v1 era uma linha que você tinha que lembrar, e esquecer dela não produzia diagnóstico nenhum — nem erro, nem aviso, nada. Trocar uma resposta errada silenciosa por uma falha de build barulhenta é o acordo inteiro."  # @src=d6c8924d7c87
              a:
                # | v1 also rejected the read at compile time; V2 merely renamed .reload()
                # | into an idiom.
                label: "O v1 também rejeitava a leitura em tempo de compilação; o V2 só rebatizou o .reload() como uma forma idiomática."  # @src=b1d676524fa8
                # | v1 compiled the stale read just fine, which is why it shipped as a bug
                # | so often. And .reload() was a real runtime re-read of the account bytes,
                # | not an idiom V2 renamed — V2 deletes it because there is no copy left to
                # | refresh.
                feedback: "O v1 compilava a leitura obsoleta numa boa, que é por que ela era entregue como bug tantas vezes. E .reload() era uma releitura de verdade dos bytes da conta em tempo de execução, não uma forma idiomática que o V2 rebatizou — o V2 apaga ele porque não sobrou cópia para atualizar."  # @src=3f56c6692d95
              d:
                # | v1 auto-reloaded each account after a CPI, and V2 dropped that to save
                # | the deserialize cost
                label: "O v1 recarregava cada conta automaticamente depois de uma CPI, e o V2 largou isso para economizar o custo de desserialização"  # @src=1d2bc215aa96
                # | Auto-refresh was genuinely weighed for V2 and dropped on exactly that
                # | cost, so half of this is a real design note filed under the wrong
                # | version. v1 refreshed nothing on its own: .reload() was a call you had
                # | to remember, and forgetting it produced no diagnostic at all.
                feedback: "O auto-refresh foi genuinamente pesado para o V2 e largado exatamente por esse custo, então metade disso é uma nota de design real arquivada sob a versão errada. O v1 não atualizava nada sozinho: .reload() era uma chamada que você tinha que lembrar, e esquecer dela não produzia diagnóstico nenhum."  # @src=5dc515711814
          m04-l2-q3:
            # | A teammate says the borrow model means you never have to think about account
            # | freshness again. Are they right?
            prompt: "Um colega diz que o modelo de borrow quer dizer que você nunca mais precisa pensar na freshness das contas. Ele está certo?"  # @src=bd95bc7fcde9
            # | The guarantee is precise and worth stating precisely. The compiler stops you
            # | from reading typed account data while a handle is live, which kills the
            # | common footgun, but it does not refresh values and it does not cover raw
            # | lamport or byte-level reads. Knowing the edge of a safety guarantee is part
            # | of using it well. Silently re-deserializing every held account after every
            # | CPI was ruled out deliberately: eager Account<T> deserialization was the
            # | number-one performance complaint that motivated V2, so doing it more often
            # | would have reinstated the exact tax the redesign set out to abolish — and it
            # | would still miss raw byte reads.
            explanation: "A garantia é precisa e vale enunciar com precisão. O compilador te impede de ler dados tipados de conta enquanto um handle está vivo, o que mata a cilada comum, mas ele não atualiza valores e não cobre leituras cruas de lamports nem no nível dos bytes. Conhecer a borda de uma garantia de segurança faz parte de usar ela bem. Re-desserializar em silêncio toda conta segurada depois de toda CPI foi descartado de propósito: a desserialização adiantada de Account<T> era a reclamação de performance número um que motivou o V2, então fazer isso com mais frequência teria reinstalado exatamente o imposto que o redesign se propôs a abolir — e ainda assim perderia as leituras de bytes crus."  # @src=70968212f009
            options:                 # source order — keep it
              a:
                # | Yes: dropping the CpiHandle re-deserializes the account, so every
                # | post-CPI read is refreshed.
                label: "Sim: soltar o CpiHandle re-desserializa a conta, então toda leitura pós-CPI é atualizada."  # @src=fb09fae42028
                # | Nothing is re-deserialized. Auto-refreshing accounts after every CPI was
                # | one of the designs V2 considered and rejected on cost; the handle only
                # | excludes typed access while it is live.
                feedback: "Nada é re-desserializado. Atualizar contas automaticamente depois de toda CPI foi um dos designs que o V2 considerou e rejeitou por custo; o handle só exclui acesso tipado enquanto está vivo."  # @src=57c90ff94818
              c:
                # | No: it guards typed account access only, not raw AccountInfo lamports or
                # | manual byte reads.
                label: "Não: ele protege só o acesso tipado a conta, não lamports crus de AccountInfo nem leituras manuais de bytes."  # @src=6890ea6815bf
                # | Auto-refreshing every held account was weighed and dropped: that
                # | deserialize cost is the exact thing the rewrite exists to remove. So
                # | lamport arithmetic and hand-rolled byte reads stay yours.
                feedback: "Atualizar automaticamente toda conta segurada foi pesado e largado: esse custo de desserialização é exatamente a coisa que a reescrita existe para remover. Então aritmética de lamports e leituras de bytes feitas à mão continuam suas."  # @src=502b30d25e19
              b:
                # | Yes: the borrow held by a live CpiHandle covers raw AccountInfo lamports
                # | and hand-rolled byte reads too.
                label: "Sim: o borrow segurado por um CpiHandle vivo cobre também lamports crus de AccountInfo e leituras de bytes feitas à mão."  # @src=ef032fa3e8b6
                # | The borrow model guards typed account access only. Raw AccountInfo
                # | lamports and manual reads out of the data buffer stay your
                # | responsibility, exactly as they were in v1.
                feedback: "O modelo de borrow protege só o acesso tipado a conta. Lamports crus de AccountInfo e leituras manuais do buffer de dados continuam responsabilidade sua, exatamente como eram no v1."  # @src=20d47205a86f
              d:
                # | Yes, provided each account the instruction takes goes into the
                # | CpiContext, which the derive typically checks for you
                label: "Sim, desde que cada conta que a instrução toma entre no CpiContext, o que a derive normalmente checa para você"  # @src=2b3f6e91b339
                # | Handing everything to the CPI would widen the lock, which is at least
                # | the right shape for a guarantee. Nothing checks that you did, and a CPI
                # | can touch none of the accounts it was not given, so the lock stays on
                # | the handles you actually built and raw lamport reads sit outside it
                # | either way.
                feedback: "Entregar tudo para a CPI alargaria a trava, o que pelo menos é a forma certa de uma garantia. Nada checa que você fez isso, e uma CPI não consegue tocar nenhuma das contas que não recebeu, então a trava fica nos handles que você de fato construiu e leituras cruas de lamports ficam fora dela de qualquer jeito."  # @src=46eb28354737
          m04-l2-q4:
            # | The receipt needs the vault's typed balance once the transfer has landed.
            # | What is the V2 idiom?
            prompt: "O recibo precisa do saldo tipado do vault assim que a transferência aterrissar. Qual é a forma idiomática do V2?"  # @src=d0b94309018c
            # | The V2 idiom is scope discipline: the handle exists only for the CPI, and
            # | once it drops the borrow is released and the live typed data is readable
            # | again. Where v1 asked you to remember .reload(), V2 asks you to structure
            # | the borrow, and the compiler checks you did. Capturing a value into a local
            # | before any handle exists is the complementary idiom for the other direction
            # | — it gives you the pre-CPI value — so a post-CPI read must sit below the
            # | line that consumes the CpiContext.
            explanation: "A forma idiomática do V2 é disciplina de escopo: o handle existe só para a CPI, e assim que ele é solto o borrow é liberado e os dados tipados vivos ficam legíveis de novo. Onde o v1 te pedia para lembrar do .reload(), o V2 te pede para estruturar o borrow, e o compilador checa que você fez. Capturar um valor numa variável local antes de qualquer handle existir é a forma idiomática complementar para a outra direção — ela te dá o valor pré-CPI — então uma leitura pós-CPI tem que ficar abaixo da linha que consome o CpiContext."  # @src=7d6217a89ae1
            options:                 # source order — keep it
              b:
                # | Call ctx.accounts.vault.reload() after the CPI to refresh the
                # | deserialized copy.
                label: "Chame ctx.accounts.vault.reload() depois da CPI para atualizar a cópia desserializada."  # @src=3645050e0a2b
                # | .reload() is a v1 API that V2 removes, and there is no deserialized copy
                # | to refresh: Account<T> is a zero-copy view over the account's live
                # | bytes.
                feedback: ".reload() é uma API do v1 que o V2 remove, e não existe cópia desserializada para atualizar: Account<T> é uma view zero-copy sobre os bytes vivos da conta."  # @src=026266cb7186
              a:
                # | Let the cpi_handle_mut drop by ending its scope, then read the typed
                # | account.
                label: "Deixe o cpi_handle_mut ser solto encerrando o escopo dele, e depois leia a conta tipada."  # @src=7f0d9aa85051
                # | Remembering a call became shaping a scope, and the compiler checks the
                # | shape. Snapshotting into a local is the opposite tool: it freezes the
                # | old value, so it can never show you the new one.
                feedback: "Lembrar de uma chamada virou modelar um escopo, e o compilador checa a forma. Tirar um snapshot para uma variável local é a ferramenta oposta: ela congela o valor antigo, então nunca consegue te mostrar o novo."  # @src=84ba3cb4157d
              c:
                # | Copy the field into a local before building the handle, then read that
                # | local after the CPI.
                label: "Copie o campo para uma variável local antes de construir o handle, e depois leia essa variável local depois da CPI."  # @src=6988c463f40b
                # | Capturing into a local up top is the right idiom when you need the
                # | pre-CPI value, and it is how the handler grabs sol_bump. But the local
                # | is frozen at the instant you copied it, so it can never show the
                # | post-CPI balance.
                feedback: "Capturar numa variável local lá no topo é a forma idiomática certa quando você precisa do valor pré-CPI, e é assim que o handler pega sol_bump. Mas a variável local fica congelada no instante em que você copiou, então ela nunca consegue mostrar o saldo pós-CPI."  # @src=4073b3d99200
              d:
                # | Take a fresh cpi_handle() on the vault after the CPI and read through
                # | that one
                label: "Pegue um cpi_handle() novo no vault depois da CPI e leia através dele"  # @src=e1b13f04a597
                # | A handle is how you hand an account to a CPI, not how you read one, and
                # | taking a second one is the move that keeps a borrow alive rather than
                # | ending it. The read you want is a plain typed field access below the
                # | line that consumes the CpiContext.
                feedback: "Um handle é como você entrega uma conta a uma CPI, não como você lê uma, e pegar um segundo é a jogada que mantém um borrow vivo em vez de encerrar ele. A leitura que você quer é um acesso simples a campo tipado abaixo da linha que consome o CpiContext."  # @src=ceafbfbb9686
  m04-l3:
    # | Composition: build the prize-escrow
    title: "Composição: construa o prize-escrow"  # @src=bca39d5aa21e
    blocks:
      check:                      # quiz
        questions:
          m04-l3-q1:
            # | Your escrow's redeem instruction takes the escrow record and its vault
            # | account, and marks them both mut. Does V2 accept this?
            prompt: "A instrução redeem do seu escrow recebe o registro do escrow e a conta de vault dele, e marca as duas como mut. O V2 aceita isso?"  # @src=c41a8ad459ea
            # | The default that V2 enforces is against duplicate mutable accounts, the
            # | aliasing hazard where one account is passed under two names and one write
            # | silently clobbers the other. Two different accounts, even both mutable, are
            # | exactly what composition needs and are allowed with no ceremony. The check
            # | is split across two moments: the derive macro bakes a compile-time 256-bit
            # | MUT_MASK of which fields are mut, and the dispatcher then walks that mask
            # | against a runtime bitvec of addresses seen so far, raising
            # | ConstraintDuplicateMutableAccount when an address collision touches the
            # | writable set — at least one of the colliding slots marked mut is enough, and
            # | only all-read-only aliases pass. The sanctioned escape for a genuine alias
            # | stays unsafe(dup) on the mut slot.
            explanation: "O default que o V2 impõe é contra contas mutáveis duplicadas, o risco de aliasing em que uma conta é passada sob dois nomes e uma escrita atropela a outra em silêncio. Duas contas diferentes, mesmo as duas mutáveis, são exatamente o que a composição precisa e são permitidas sem cerimônia. A checagem é dividida em dois momentos: a macro de derive fixa uma MUT_MASK de 256 bits de tempo de compilação de quais campos são mut, e o dispatcher então percorre essa máscara contra um bitvec de tempo de execução de endereços vistos até ali, levantando ConstraintDuplicateMutableAccount quando uma colisão de endereço toca o conjunto gravável — pelo menos um dos slots em colisão marcado como mut já basta, e só aliases todos somente leitura passam. A saída sancionada para um alias genuíno continua unsafe(dup) no slot mut."  # @src=6272670302c9
            options:                 # source order — keep it
              c:
                # | Yes, but only if both carry unsafe(dup), since the check counts mut
                # | fields, not addresses.
                label: "Sim, mas só se as duas carregarem unsafe(dup), já que a checagem conta campos mut, não endereços."  # @src=f2188fd39705
                # | Backwards: the check counts addresses, not fields. unsafe(dup) is the
                # | per-field opt-out for a genuine alias, and two distinct accounts never
                # | collide, so they need no opt-out.
                feedback: "Ao contrário: a checagem conta endereços, não campos. O unsafe(dup) é o opt-out por campo para um alias genuíno, e duas contas distintas nunca colidem, então elas não precisam de opt-out."  # @src=d00a286ef824
              d:
                # | No: both are PDAs derived by the same program, so the duplicate walk
                # | treats them as one slot
                label: "Não: as duas são PDAs derivados pelo mesmo programa, então a varredura de duplicatas trata elas como um slot só"  # @src=bb72ff911eaf
                # | Sharing a deriving program makes two accounts feel related, and the seed
                # | scheme does put them in one namespace. The walk compares the addresses
                # | that actually arrived, not how they were derived, so two different
                # | addresses do not collide however alike their seeds look.
                feedback: "Compartilhar um programa derivador faz duas contas parecerem relacionadas, e o esquema de seeds de fato coloca elas em um namespace só. A varredura compara os endereços que de fato chegaram, não como eles foram derivados, então dois endereços diferentes não colidem por mais parecidas que as seeds deles pareçam."  # @src=5750030705c4
              b:
                # | Yes: distinct mutable accounts are fine; only the SAME account passed
                # | twice needs unsafe(dup).
                label: "Sim: contas mutáveis distintas estão tranquilas; só a MESMA conta passada duas vezes precisa de unsafe(dup)."  # @src=92b68056c0eb
                # | A compile-time mask records which fields are writable; a runtime walk
                # | compares the addresses that actually arrived. Neither alone raises
                # | anything — only an address collision touching the writable set does, and
                # | one colliding slot marked mut is already enough. The escape for a
                # | genuine alias is unsafe(dup) on the mut slot.
                feedback: "Uma máscara de tempo de compilação registra quais campos são graváveis; uma varredura em tempo de execução compara os endereços que de fato chegaram. Nenhuma das duas sozinha levanta nada — só uma colisão de endereço tocando o conjunto gravável levanta, e um slot em colisão marcado como mut já basta. A saída para um alias genuíno é unsafe(dup) no slot mut."  # @src=5b71e064fa71
              a:
                # | No: V2's MUT_MASK check rejects any instruction carrying more than one
                # | mut account.
                label: "Não: a checagem MUT_MASK do V2 rejeita qualquer instrução que carregue mais de uma conta mut."  # @src=6847dfe6ca92
                # | MUT_MASK records which fields are mut, but the dispatcher only fails on
                # | an address collision that touches the writable set — the same address
                # | arriving in two slots with at least one of them marked mut. A cap on the
                # | number of mutable accounts does not exist.
                feedback: "A MUT_MASK registra quais campos são mut, mas o dispatcher só falha numa colisão de endereço que toca o conjunto gravável — o mesmo endereço chegando em dois slots com pelo menos um deles marcado como mut. Um teto para o número de contas mutáveis não existe."  # @src=a9d41fec41ea
          m04-l3-q2:
            # | You are migrating the escrow's authority check from has_one = maker. What is
            # | the V2 form?
            prompt: "Você está migrando a checagem de autoridade do escrow de has_one = maker. Qual é a forma do V2?"  # @src=e28ca340d90e
            # | In V2 has_one is deprecated in favor of address = parent.field, which
            # | accepts any expression and reads as what it does: this account's key must
            # | equal that stored field. The compiler underlines the has_one deprecation for
            # | you, which makes this a mechanical, guided migration.
            explanation: "No V2 o has_one está depreciado em favor de address = parent.field, que aceita qualquer expressão e lê como o que ele faz: a chave desta conta tem que ser igual àquele campo armazenado. O compilador sublinha a depreciação do has_one para você, o que faz disso uma migração mecânica e guiada."  # @src=038d9486027d
            options:                 # source order — keep it
              d:
                # | owner = escrow.maker, the constraint that replaced has_one
                label: "owner = escrow.maker, o constraint que substituiu o has_one"  # @src=373c6fcc7a81
                # | The two keywords sit next to each other in the catalog and one of them
                # | did take over from has_one. owner asks which program owns the account,
                # | and on a typed wrapper that question is already settled during load; the
                # | key-equality check is address =.
                feedback: "As duas keywords ficam uma do lado da outra no catálogo e uma delas de fato assumiu o lugar do has_one. O owner pergunta qual programa é dono da conta, e num wrapper tipado essa pergunta já está resolvida durante o carregamento; a checagem de igualdade de chave é o address =."  # @src=bd604734569d
              b:
                # | constraint = escrow.maker == maker.key(), the only remaining form.
                label: "constraint = escrow.maker == maker.key(), a única forma que sobrou."  # @src=5a298c23a180
                # | A raw constraint does enforce the same equality, but it is not the only
                # | form left: address = escrow.maker is the idiomatic replacement, and V2
                # | structs spell the accessor .address() rather than V1's .key().
                feedback: "Um constraint cru de fato impõe a mesma igualdade, mas não é a única forma que sobrou: address = escrow.maker é o substituto idiomático, e as structs do V2 escrevem o acessor .address() em vez do .key() do V1."  # @src=630f3cf58969
              c:
                # | address = escrow.maker, the direct replacement for has_one.
                label: "address = escrow.maker, o substituto direto do has_one."  # @src=8a104c4e1d6c
                # | It takes an arbitrary expression and can therefore say plainly what it
                # | does. The compiler underlines every site.
                feedback: "Ele aceita uma expressão arbitrária e por isso consegue dizer sem rodeios o que faz. O compilador sublinha todas as ocorrências."  # @src=ae5a2714d1b0
              a:
                # | Keep has_one = maker; V2 left that constraint unchanged.
                label: "Mantenha has_one = maker; o V2 deixou esse constraint inalterado."  # @src=06df43cc758b
                # | has_one still parses in V2, which is what makes this tempting, but the
                # | compiler underlines it as deprecated and points you at address =
                # | escrow.maker.
                feedback: "O has_one ainda faz parse no V2, que é o que faz isso ser tentador, mas o compilador sublinha ele como depreciado e te aponta para address = escrow.maker."  # @src=973773f551aa
              e:
                # | maker: Signer alone - a signature proves the maker's identity
                label: "maker: Signer sozinho - uma assinatura comprova a identidade do maker"  # @src=414cc2e16add
                # | A signature does prove some key signed, which is why this feels like
                # | enough on a two-party instruction. It says nothing about whether that
                # | key is the one this escrow recorded, and closing that gap is the whole
                # | job address = escrow.maker does.
                feedback: "Uma assinatura de fato comprova que alguma chave assinou, que é por isso que isso parece suficiente numa instrução de duas partes. Ela não diz nada sobre se aquela chave é a que este escrow registrou, e fechar essa lacuna é o trabalho inteiro que o address = escrow.maker faz."  # @src=a652324346b5
          m04-l3-q3:
            # | Where does the escrow check the win condition relative to the payout CPI?
            prompt: "Onde o escrow checa a condição de vitória em relação à CPI de pagamento?"  # @src=7f0746385d6e
            # | A conditional release is only as safe as its ordering: the guard has to run
            # | and pass before a single lamport moves. Checking after the payout, or
            # | trusting that atomicity alone protects you, invites exactly the class of
            # | exploit escrows exist to prevent. Concretely, never pay first and check
            # | after: in redeem the require! lines come first and the
            # | quarter_vault::cpi::withdraw call comes last, so nothing moves until the
            # | caller constraint and the score check have both passed.
            explanation: "Uma liberação condicional é só tão segura quanto a ordenação dela: a trava tem que rodar e passar antes de um único lamport se mover. Checar depois do pagamento, ou confiar que a atomicidade sozinha te protege, convida exatamente a classe de exploit que os escrows existem para prevenir. Concretamente, nunca pague primeiro e cheque depois: no redeem as linhas de require! vêm primeiro e a chamada quarter_vault::cpi::withdraw vem por último, então nada se move até o constraint de chamador e a checagem de score os dois terem passado."  # @src=adc375fecf38
            options:                 # source order — keep it
              a:
                # | Before the CPI: the require! gate must pass before the withdraw runs.
                label: "Antes da CPI: a trava do require! tem que passar antes de o withdraw rodar."  # @src=aef45cc433a3
                # | Position is part of the audit trail: a reader should see the condition
                # | standing in front of the payout, not have to reason backwards about what
                # | a later revert would undo.
                feedback: "Posição faz parte da trilha de auditoria: um leitor deveria ver a condição parada na frente do pagamento, não ter que raciocinar de trás para frente sobre o que uma reversão mais adiante desfaria."  # @src=2e2998282946
              c:
                # | It does not matter: the transaction is atomic, so a failed check reverts
                # | the CPI.
                label: "Não importa: a transação é atômica, então uma checagem que falha reverte a CPI."  # @src=45f9a49e09ee
                # | Atomicity is real but it is not the guarantee you want to lean on. Order
                # | is also documentation: an auditor reading redeem should see the
                # | condition gate the payout by position, not have to prove some later
                # | revert saves you.
                feedback: "A atomicidade é real, mas não é a garantia em que você quer se apoiar. Ordem também é documentação: um auditor lendo redeem deveria ver a condição travar o pagamento por posição, não ter que comprovar que alguma reversão mais adiante te salva."  # @src=77de5558f774
              d:
                # | Inside the vault's withdraw handler, since that is where lamports move
                label: "Dentro do handler de withdraw do vault, já que é lá que os lamports se movem"  # @src=2a9815c1814d
                # | Putting the guard next to the movement is a tidy instinct, and the vault
                # | does guard what it can see. A win condition is the escrow's own business
                # | rule and is invisible to the vault, which validates its seeds and its
                # | balances; the caller keeps the one check only it can make.
                feedback: "Pôr a trava do lado da movimentação é um instinto arrumado, e o vault de fato trava o que ele consegue ver. Uma condição de vitória é a regra de negócio do próprio escrow e é invisível para o vault, que valida as seeds e os saldos dele; o chamador mantém a única checagem que só ele consegue fazer."  # @src=56e88525e6db
              b:
                # | After the CPI: withdraw first, then refund if the score fell short.
                label: "Depois da CPI: withdraw primeiro, e depois reembolse se o score ficou abaixo."  # @src=bb5da0a4b5ca
                # | Atomicity does revert the transfer when a later require! fails — nothing
                # | can partially commit inside a failed Solana transaction. What makes this
                # | wrong is fragility, not leakage: pay-then-check is only safe while the
                # | check stays fatal and stays in this instruction, and one refactor that
                # | softens the require! pays out on a false condition. Guard-first has
                # | nothing to maintain.
                feedback: "A atomicidade de fato reverte a transferência quando um require! mais adiante falha — nada consegue se efetivar parcialmente dentro de uma transação Solana que falhou. O que faz isso estar errado é fragilidade, não vazamento: pagar-depois-checar só é seguro enquanto a checagem continua fatal e continua nesta instrução, e uma refatoração que afrouxa o require! paga sob uma condição falsa. Trava-primeiro não tem nada para manter."  # @src=7bbafb166790
  m05-l1:
    # | token_interface & transfer_checked: upgrade the vault and escrow to SPL
    title: "token_interface e transfer_checked: dê upgrade no vault e no escrow para SPL"  # @src=051ec60c01b5
    blocks:
      check:                      # quiz
        questions:
          m05-l1-q1:
            # | You upgraded the quarter-vault from lamport custody to SPL and the withdraw
            # | test now fails to compile, pointing at your transfer CPI. What is the most
            # | likely cause in Anchor V2?
            prompt: "Você deu upgrade no quarter-vault de custódia lamport para SPL e o teste de withdraw agora falha ao compilar, apontando para a sua CPI de transferência. Qual é a causa mais provável no Anchor V2?"  # @src=7cab0faa400b
            # | The whole point of the upgrade lab is that the PDA/CPI skeleton is
            # | untouched: seeds, bump, and address auth stay. What changes is the custody
            # | layer: the system-program lamport transfer becomes a PDA-signed
            # | transfer_checked, which in V2 carries the mint account and decimals.
            # | Forgetting those is the classic first compile error.
            explanation: "O ponto inteiro do lab de upgrade é que o esqueleto de PDA/CPI fica intocado: seeds, bump e a auth de address ficam. O que muda é a camada de custódia: a transferência de lamports do system-program vira um transfer_checked assinado por PDA, que no V2 carrega a conta de mint e os decimais. Esquecer esses dois é o clássico primeiro erro de compilação."  # @src=1d5b802f3b20
            options:                 # source order — keep it
              d:
                # | Your mint is an InterfaceAccount<Mint> where the CPI wants a plain
                # | Account<Mint> for its decimals.
                label: "O seu mint é um InterfaceAccount<Mint> onde a CPI quer um Account<Mint> simples para os decimais dele."  # @src=ba7a87a933e9
                # | In V2 those two are the same type: InterfaceAccount<T> is literally an
                # | alias of Account<T>, so no wrapper swap could ever be the type error you
                # | are staring at. What decides program compatibility is the module T was
                # | imported from, and neither wrapper changes the arity of the call.
                feedback: "No V2 esses dois são o mesmo tipo: InterfaceAccount<T> é literalmente um alias de Account<T>, então nenhuma troca de wrapper poderia ser o erro de tipo que você está encarando. O que decide a compatibilidade de programa é o módulo de onde o T foi importado, e nenhum dos dois wrappers muda a aridade da chamada."  # @src=57a6a6f996b8
              b:
                # | You called a bare transfer; V2's token seat expects transfer_checked,
                # | which needs the mint and its decimals.
                label: "Você chamou um transfer simples; a cadeira de tokens do V2 espera transfer_checked, que precisa do mint e dos decimais dele."  # @src=8878c8e85e57
                # | Identity survives the upgrade intact: seeds, stored bump, authority
                # | constraint, all of it. Only the vehicle changes, and the checked variant
                # | wants two arguments the bare one never did.
                feedback: "A identidade sobrevive ao upgrade intacta: seeds, bump armazenado, constraint de authority, tudo. Só o veículo muda, e a variante checada quer dois argumentos que a simples nunca quis."  # @src=8beeb88622ae
              c:
                # | You kept the [b"vault", authority] seeds, and a token account's
                # | authority PDA now derives under the token program's id.
                label: "Você manteve as seeds [b\"vault\", authority], e o PDA de authority de uma conta de token agora deriva sob o id do token program."  # @src=392cf20cb9e2
                # | Tempting because seeds::program does exist for PDAs another program
                # | owns, but the vault's authority PDA still belongs to your program, so it
                # | derives under your id with the same seeds and stored bump. Custody
                # | changes; identity doesn't.
                feedback: "Tentador porque seeds::program de fato existe para PDAs de que outro programa é dono, mas o PDA de authority do vault continua pertencendo ao seu programa, então ele deriva sob o seu id com as mesmas seeds e o mesmo bump armazenado. A custódia muda; a identidade não."  # @src=8fa0fb335bde
              a:
                # | You signed with the vault PDA's seeds, and a token program honors
                # | keypair signatures, so custody needs an approve-and-delegate step.
                label: "Você assinou com as seeds do PDA do vault, e um token program honra assinaturas de keypair, então a custódia precisa de um passo de approve-e-delegate."  # @src=bc5664824c21
                # | PDA-signed token transfers are exactly how program-owned vaults move
                # | funds. .with_signer over the stored bump grants the PDA signer privilege
                # | for a token CPI the same way it did for the System Program transfer, and
                # | no approve/delegate step is involved.
                feedback: "Transferências de token assinadas por PDA são exatamente como vaults de propriedade do programa movem fundos. O .with_signer sobre o bump armazenado concede o privilégio de signer do PDA para uma CPI de token do mesmo jeito que concedia para a transferência do System Program, e nenhum passo de approve/delegate está envolvido."  # @src=4deb75d21b8e
          m05-l1-q2:
            # | Why does the upgrade use InterfaceAccount<T> for the vault's token account
            # | instead of Account<TokenAccount>?
            prompt: "Por que o upgrade usa InterfaceAccount<T> para a conta de token do vault em vez de Account<TokenAccount>?"  # @src=ea835eaa25d1
            # | token_interface exists so a single program works against both the SPL Token
            # | program and the Token-2022 program. InterfaceAccount<T>, an alias of
            # | Account<T>, is what lets the same account type validate either. Hardcoding
            # | Account<TokenAccount> to one program is the trap m05-l3 teaches you to
            # | diagnose from a live Token-2022 mint, the read that shows where a hardwired
            # | wrapper would refuse it. The payoff of the one code path is that your
            # | program is never hardcoded to a single token program: the same instruction
            # | takes a classic mint today and a Token-2022 mint tomorrow. And you pay
            # | nothing for the capability, because Account<T> is already the zero-copy fast
            # | path in V2, so the compatible path and the fast path are now the same path.
            # | Note the real mechanism is which module T came from, not the wrapper: the
            # | token_interface types accept either program, the plain token types pin the
            # | classic one.
            explanation: "O token_interface existe para que um único programa funcione contra o SPL Token program e contra o Token-2022 program. O InterfaceAccount<T>, um alias de Account<T>, é o que deixa o mesmo tipo de conta validar qualquer um dos dois. Deixar Account<TokenAccount> hardcoded para um programa só é a armadilha que a m05-l3 te ensina a diagnosticar a partir de um mint Token-2022 ao vivo, a leitura que mostra onde um wrapper cravado no código recusaria ele. O retorno do caminho de código único é que o seu programa nunca fica hardcoded para um token program só: a mesma instrução recebe um mint clássico hoje e um mint Token-2022 amanhã. E você não paga nada pela capacidade, porque o Account<T> já é o caminho rápido zero-copy no V2, então o caminho compatível e o caminho rápido agora são o mesmo caminho. Note que o mecanismo de verdade é de qual módulo o T veio, não o wrapper: os tipos de token_interface aceitam qualquer um dos dois programas, os tipos token simples fixam o clássico."  # @src=dc6cfbfdf6e0
            options:                 # source order — keep it
              b:
                # | Account<TokenAccount> was removed in V2; InterfaceAccount<T> replaced
                # | it.
                label: "O Account<TokenAccount> foi removido no V2; o InterfaceAccount<T> substituiu ele."  # @src=d67c7b3f57c0
                # | InterfaceAccount<T> is an alias of Account<T>, not a replacement for it;
                # | Account<T> is very much alive, and Account<TokenAccount> with a
                # | token_interface import behaves identically. The reason is program
                # | compatibility, not removal.
                feedback: "O InterfaceAccount<T> é um alias de Account<T>, não uma substituição dele; o Account<T> está bem vivo, e Account<TokenAccount> com um import de token_interface se comporta de forma idêntica. O motivo é compatibilidade de programa, não remoção."  # @src=5d84058a4823
              d:
                # | The wrapper is what makes ATA derivation program-aware, so a Token-2022
                # | ATA resolves correctly.
                label: "O wrapper é o que torna a derivação de ATA ciente do programa, então uma ATA Token-2022 resolve certo."  # @src=a5f358985858
                # | The account wrapper has no say in where an ATA sits. What makes that
                # | derivation program-aware is the associated_token::token_program =
                # | token_program line reading an Interface-typed program account, so the
                # | address is computed against whichever token program actually owns the
                # | mint. Hardcode the classic program there and the derivation goes wrong
                # | no matter which wrapper the token account carries.
                feedback: "O wrapper de conta não tem voz nenhuma sobre onde uma ATA fica. O que torna essa derivação ciente do programa é a linha associated_token::token_program = token_program lendo uma conta de programa tipada como Interface, então o endereço é computado contra o token program que de fato é dono do mint. Deixe o programa clássico hardcoded ali e a derivação sai errada, não importa qual wrapper a conta de token carrega."  # @src=775c4e07e4e2
              a:
                # | InterfaceAccount<T> skips the owner check on load, so it costs fewer
                # | CUs.
                label: "O InterfaceAccount<T> pula a checagem de owner no carregamento, então ele custa menos CUs."  # @src=4fd83d5ff391
                # | Owner and discriminator checks still run inside load either way. The V2
                # | speedup came from making Account<T> itself zero-copy, and
                # | InterfaceAccount<T> is an alias of it, so there is no CU difference to
                # | buy.
                feedback: "As checagens de owner e de discriminator continuam rodando dentro do carregamento de qualquer forma. O ganho de velocidade do V2 veio de fazer o próprio Account<T> zero-copy, e o InterfaceAccount<T> é um alias dele, então não existe diferença de CU para comprar."  # @src=0c0e320a829c
              c:
                # | InterfaceAccount<T> serves classic SPL Token and Token-2022 from one
                # | code path.
                label: "O InterfaceAccount<T> serve o SPL Token clássico e o Token-2022 a partir de um caminho de código só."  # @src=2a7767adebc7
                # | What admits both programs is the module the type was imported from, not
                # | the wrapper's name: the non-interface types stay hardwired to the
                # | classic program. The capability is free, since that wrapper is already
                # | the fast path.
                feedback: "O que admite os dois programas é o módulo de onde o tipo foi importado, não o nome do wrapper: os tipos que não são de interface ficam cravados no programa clássico. A capacidade é de graça, já que aquele wrapper já é o caminho rápido."  # @src=e1d11b5d8ab0
          m05-l1-q3:
            # | You want a custom error when the escrow's authority account has the wrong
            # | owner, so you write address = maker @ EscrowErr::BadAuthority on an
            # | Account<T>. It returns a generic IllegalOwner instead of your error. Why?
            prompt: "Você quer um erro customizado quando a conta de authority do escrow tem o owner errado, então você escreve address = maker @ EscrowErr::BadAuthority num Account<T>. Ele devolve um IllegalOwner genérico em vez do seu erro. Por quê?"  # @src=d49a15e86fe7
            # | Because those checks sit inside load, the generic owner error fires first
            # | and your custom message never gets a chance to surface. On Account<T>, load
            # | runs the owner and discriminator checks before any constraint hook, so an
            # | owner mismatch surfaces as ProgramError::IllegalOwner and your custom
            # | message never appears. When you need a custom owner error, drop to
            # | UncheckedAccount and assert owner explicitly, a footgun worth flagging
            # | inline while wiring escrow auth.
            explanation: "Porque essas checagens ficam dentro do carregamento, o erro genérico de owner dispara primeiro e a sua mensagem customizada nunca ganha a chance de aparecer. Num Account<T>, o carregamento roda as checagens de owner e de discriminator antes de qualquer hook de constraint, então um descasamento de owner aparece como ProgramError::IllegalOwner e a sua mensagem customizada nunca aparece. Quando você precisa de um erro de owner customizado, desça para UncheckedAccount e afirme o owner explicitamente, uma cilada que vale sinalizar inline enquanto você liga a auth do escrow."  # @src=6d62dc89cdd6
            options:                 # source order — keep it
              c:
                # | has_one replaced address in V2, so the constraint never compiled into
                # | the accounts struct.
                label: "O has_one substituiu o address no V2, então o constraint nunca compilou para dentro da struct de accounts."  # @src=d4570a099890
                # | It's the reverse: has_one is the deprecated spelling and address =
                # | parent.field is its V2 replacement. The constraint compiled and executed
                # | fine; a load-time owner check simply preceded it.
                feedback: "É o contrário: has_one é a grafia depreciada e address = parent.field é a substituição dele no V2. O constraint compilou e executou direitinho; uma checagem de owner em tempo de carregamento simplesmente veio antes dele."  # @src=e92932c39b88
              b:
                # | address = compares keys and has no @ error slot, so V2 substitutes its
                # | own built-in error.
                label: "O address = compara chaves e não tem um slot de erro @, então o V2 substitui pelo erro embutido dele."  # @src=27c1eda36ea5
                # | address = maker @ EscrowErr::BadAuthority compiles and does raise your
                # | error on a key mismatch, so the @ slot is real. The issue is ordering:
                # | the load-time owner check fires before the address comparison ever runs.
                feedback: "address = maker @ EscrowErr::BadAuthority compila e de fato levanta o seu erro num descasamento de chave, então o slot @ é real. O problema é a ordem: a checagem de owner em tempo de carregamento dispara antes de a comparação de address rodar."  # @src=06a5831a8f45
              a:
                # | Owner and discriminator checks run inside load, ahead of any constraint
                # | hook.
                label: "As checagens de owner e de discriminator rodam dentro do carregamento, na frente de qualquer hook de constraint."  # @src=4914656f7134
                # | Loading is not a hook; it happens first, and the account is refused
                # | before your annotation gets a look in. The way out is an untyped account
                # | and an ownership assertion you write.
                feedback: "O carregamento não é um hook; ele acontece primeiro, e a conta é recusada antes de a sua anotação ter vez. A saída é uma conta sem tipo e uma afirmação de ownership que você escreve."  # @src=e87033526c57
              d:
                # | Your address constraint ran ahead of load, so the generic owner error
                # | came from a later step.
                label: "O seu constraint de address rodou na frente do carregamento, então o erro genérico de owner veio de um passo posterior."  # @src=61d002b5dd9e
                # | That is the ordering inverted. Load is not a hook and it does not queue
                # | behind one: reading the bytes, checking the owner, and checking the
                # | discriminator all happen first, and the account is refused there.
                # | Nothing you attach to the field runs until load has handed the typed
                # | account over.
                feedback: "Essa é a ordem invertida. O carregamento não é um hook e não entra na fila atrás de um: ler os bytes, checar o owner e checar o discriminator acontecem todos primeiro, e a conta é recusada ali. Nada que você anexa ao campo roda até o carregamento ter entregado a conta tipada."  # @src=cf076c05fc1e
  m05-l2:
    # | Build the token-ticket swap
    title: "Construa o swap de token-para-ticket"  # @src=03bea5a0290e
    blocks:
      cp-swap-out:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | amount_in_with_fee = amount_in * 997
          0: "amount_in_with_fee = amount_in * 997"  # @src=3ae74d2b7ef6
          # | out = (amount_in_with_fee * reserve_out) / (reserve_in * 1000 +
          # | amount_in_with_fee)
          1: "out = (amount_in_with_fee * reserve_out) / (reserve_in * 1000 + amount_in_with_fee)"  # @src=d51bf5de6b73
          # | promote to u128 before multiplying so u64 reserves can't overflow
          2: "promova para u128 antes de multiplicar para reservas u64 não conseguirem dar overflow"  # @src=f18d813804de
          # | u128 is headroom, not immunity: (u64::MAX)^2 fits u128 with under a bit to
          # | spare, and the x997 fee multiplier spends it — so keep the multiplies checked
          # | and degrade to 0
          3: "u128 é folga, não imunidade: (u64::MAX)^2 cabe em u128 com menos de um bit de sobra, e o multiplicador de taxa x997 gasta ela — então mantenha as multiplicações checked e degrade para 0"  # @src=d70e07c8ef33
        tests:                      # keyed by test case id
          t1:
            # | 0.3% fee plus the reserve shift on a shallow pool (naive ratio would say
            # | 100)
            description: "taxa de 0.3% mais o deslocamento de reserva num pool raso (a razão ingênua diria 100)"  # @src=e16d6c295f6c
          t2:
            # | deep pool, low slippage
            description: "pool profundo, slippage baixo"  # @src=2d07ede0eb41
          t3:
            # | asymmetric reserves
            description: "reservas assimétricas"  # @src=5a5fa8cdf56c
          t4:
            # | zero input yields zero output
            description: "entrada zero rende saída zero"  # @src=0fda446db8b3
          t5:
            # | the lesson's worked example: 10k into a balanced 1M/1M pool at 0.3%
            description: "o exemplo trabalhado da lição: 10k dentro de um pool balanceado de 1M/1M a 0.3%"  # @src=6cf85d6cd1bc
          t6:
            # | empty reserve_in: without the guard the denominator collapses to
            # | amount_in_with_fee and the quote hands back the whole of reserve_out
            description: "reserve_in vazio: sem a trava o denominador colapsa para amount_in_with_fee e a cotação devolve o reserve_out inteiro"  # @src=13b5bc3dae05
          t7:
            # | u64::MAX everywhere: the numerator runs past u128, so the CHECKED multiply
            # | must degrade to 0 — a bare u128 `*` panics here
            description: "u64::MAX em todo lugar: o numerador passa do u128, então a multiplicação CHECKED tem que degradar para 0 — um `*` simples em u128 dá panic aqui"  # @src=0ffb3615fb65
          t8:
            # | 1e18 reserves, 1e12 in: comfortably inside u128 but far past a u64 multiply,
            # | so this is the case that forces the promotion
            description: "reservas de 1e18, 1e12 de entrada: confortavelmente dentro do u128 mas bem além de uma multiplicação u64, então este é o caso que força a promoção"  # @src=546b2b3b15ad
      check:                      # quiz
        questions:
          m05-l2-q1:
            # | Your swap quote multiplies amount_in_with_fee * reserve_out on its way to a
            # | fill, and it panics on a large trade against a deep pool. Every operand is
            # | u64. What's the fix?
            prompt: "A sua cotação de swap multiplica amount_in_with_fee * reserve_out no caminho para um fill, e ela dá panic numa troca grande contra um pool profundo. Todo operando é u64. Qual é a correção?"  # @src=caa6640e3ff7
            # | Two u64 amounts multiplied can exceed u64. The house pattern (and rust.md)
            # | is a u128 intermediate plus checked_mul: promote, multiply, divide back down
            # | to u64. That's exactly what the swap_out coding challenge exercises. The
            # | final cast back to u64 is safe because the output can never exceed
            # | reserve_out, which is already a u64.
            explanation: "Dois valores u64 multiplicados conseguem exceder o u64. O padrão da casa (e o rust.md) é um intermediário u128 mais checked_mul: promova, multiplique, divida de volta para baixo até u64. É exatamente isso que o challenge de código swap_out exercita. O cast final de volta para u64 é seguro porque a saída nunca consegue exceder o reserve_out, que já é um u64."  # @src=04a89d89357e
            options:                 # source order — keep it
              d:
                # | Promote both operands to u128 and multiply there, where the product has
                # | room and needs no check.
                label: "Promova os dois operandos para u128 e multiplique lá, onde o produto tem espaço e não precisa de checagem."  # @src=734162481424
                # | Promoting is necessary and it is still not sufficient. Two u64 factors
                # | fit u128 with under a bit to spare, and the x997 fee multiplier is a
                # | third factor that spends that sliver: a bare u128 multiply passes every
                # | reference row and dies on the u64::MAX one. Keep the multiply checked
                # | and degrade to a 0 quote.
                feedback: "Promover é necessário e ainda não é suficiente. Dois fatores u64 cabem em u128 com menos de um bit de sobra, e o multiplicador de taxa x997 é um terceiro fator que gasta essa lasca: uma multiplicação u128 simples passa em cada linha de referência e morre na de u64::MAX. Mantenha a multiplicação checked e degrade para uma cotação 0."  # @src=1c619e0c953c
              b:
                # | Cast to u128 before multiplying, use checked_mul, then divide back down.
                label: "Faça cast para u128 antes de multiplicar, use checked_mul, depois divida de volta para baixo."  # @src=293c1ff450d4
                # | Widen the intermediate, not the stored fields, and keep it checked,
                # | because three factors is one more than u128 can absorb. Narrowing back
                # | down is safe: the output cannot exceed a value that already fit.
                feedback: "Alargue o intermediário, não os campos guardados, e mantenha ele checked, porque três fatores é um a mais do que o u128 consegue absorver. Estreitar de volta para baixo é seguro: a saída não consegue exceder um valor que já coube."  # @src=81da2ac45852
              c:
                # | Switch reserve_in and reserve_out to i64 so an overflow wraps to a
                # | negative value you can test for.
                label: "Mude reserve_in e reserve_out para i64 para um overflow dar wrap para um valor negativo que você consegue testar."  # @src=7a58a393df7b
                # | Rust panics on overflow in debug and wraps in release, so there is no
                # | reliable negative to test for, and SPL token amounts are unsigned u64
                # | anyway. A u128 intermediate with checked_mul is the pattern the lesson
                # | freezes into swap_out.
                feedback: "O Rust dá panic no overflow em debug e dá wrap em release, então não tem negativo confiável para testar, e valores de token SPL são u64 sem sinal de todo jeito. Um intermediário u128 com checked_mul é o padrão que a lição congela dentro do swap_out."  # @src=df899c9a5f4f
              a:
                # | Cap each reserve at u32::MAX at init so the product of two reserves fits
                # | inside a u64.
                label: "Limite cada reserva em u32::MAX no init para o produto de duas reservas caber dentro de um u64."  # @src=8a8d2326a23a
                # | It guards the wrong product. Two reserves capped at u32::MAX multiply to
                # | 18,446,744,065,119,617,025, which does fit in a u64, so reserve_in *
                # | reserve_out was never the exposure. The multiply that panicked is
                # | amount_in_with_fee * reserve_out, and amount_in is the caller's and
                # | uncapped, so capping the reserves does nothing for it while buying you a
                # | pool-depth ceiling of about 4.3 billion base units. The defect is the
                # | width of the multiply, not the size of the reserves.
                feedback: "Isso trava o produto errado. Duas reservas limitadas em u32::MAX multiplicam para 18,446,744,065,119,617,025, que cabe sim num u64, então reserve_in * reserve_out nunca foi a exposição. A multiplicação que deu panic é amount_in_with_fee * reserve_out, e o amount_in é de quem chama e não tem limite, então limitar as reservas não faz nada por ela enquanto te compra um teto de profundidade de pool de cerca de 4.3 bilhões de unidades base. O defeito é a largura da multiplicação, não o tamanho das reservas."  # @src=1a98ef2684c1
          m05-l2-q2:
            # | A trader sees a quote of 906 tickets, but between quote and execution the
            # | reserves shift and they'd only get 880. Your program still fills the trade.
            # | What did you forget?
            prompt: "Um trader vê uma cotação de 906 tickets, mas entre a cotação e a execução as reservas se deslocam e ele só receberia 880. O seu programa preenche a troca mesmo assim. O que você esqueceu?"  # @src=4caebf28a58a
            # | Without a min_out the trader accepts any fill, including one degraded by
            # | ordering (a sandwich). The slippage guard reverts when computed output <
            # | min_out; its shape reuses the escrow's conditional-release logic. It's the
            # | one piece of trader protection this teaching swap offers. Run it after the
            # | quote and before either CPI, not because a late check would let a bad fill
            # | stand (a failed require! reverts the transfers; atomicity holds), but
            # | because early is cheaper and reads as the protection it is.
            explanation: "Sem um min_out o trader aceita qualquer fill, incluindo um degradado por ordenação (um sanduíche). A trava de slippage reverte quando a saída computada < min_out; a forma dela reusa a lógica de release condicional do escrow. Ela é a única peça de proteção de trader que este swap didático oferece. Rode ela depois da cotação e antes de qualquer das duas CPIs, não porque uma checagem tardia deixaria um fill ruim ficar de pé (um require! que falha reverte as transferências; a atomicidade se sustenta), mas porque cedo é mais barato e lê como a proteção que ela é."  # @src=e0d07b6bff71
            options:                 # source order — keep it
              e:
                # | You read the reserves after the pull CPI, so the output came from stale
                # | balances.
                label: "Você leu as reservas depois da CPI de puxar, então a saída veio de saldos obsoletos."  # @src=af550419f5cf
                # | The handler already reads both reserves up front, and it has to: a typed
                # | read while a cpi_handle_mut() is live does not compile. Read them after
                # | the transfer instead and the quote would be fresher, not staler. The
                # | reserves in this scenario moved before the transaction landed at all, so
                # | no read ordering inside the handler could have seen it coming.
                feedback: "O handler já lê as duas reservas de cara, e ele tem que ler: uma leitura tipada enquanto um cpi_handle_mut() está vivo não compila. Leia elas depois da transferência em vez disso e a cotação ficaria mais fresca, não mais obsoleta. As reservas neste cenário se moveram antes mesmo de a transação aterrissar, então nenhuma ordem de leitura dentro do handler poderia ter previsto isso."  # @src=288dfc4ed756
              a:
                # | A .reload() on both reserves after the input transfer.
                label: "Um .reload() nas duas reservas depois da transferência de entrada."  # @src=a4b0a1595dd7
                # | This is 0.x muscle memory, and it fixes nothing here: the reserves moved
                # | before the transaction landed, so a fresh read still returns the
                # | degraded 880. V2 also holds a borrow through the live CpiHandle, so that
                # | typed read would not compile mid-CPI.
                feedback: "Isso é memória muscular de 0.x, e não corrige nada aqui: as reservas se moveram antes de a transação aterrissar, então uma leitura fresca ainda retorna os 880 degradados. O V2 também segura um borrow através do CpiHandle vivo, então aquela leitura tipada não compilaria no meio da CPI."  # @src=327677fc51c6
              b:
                # | Marking both reserve accounts unsafe(dup) so the fill is not rejected.
                label: "Marcar as duas contas de reserva como unsafe(dup) para o fill não ser rejeitado."  # @src=dde1addec167
                # | unsafe(dup) is the escape hatch for genuinely duplicated mutable
                # | accounts. reserve_arcade and reserve_ticket are distinct accounts
                # | holding different mints, so the default is already satisfied, and
                # | account aliasing has nothing to do with the price a trader receives.
                feedback: "O unsafe(dup) é a saída de emergência para contas mutáveis genuinamente duplicadas. O reserve_arcade e o reserve_ticket são contas distintas segurando mints diferentes, então o default já está satisfeito, e aliasing de conta não tem nada a ver com o preço que um trader recebe."  # @src=14458e92fa36
              c:
                # | The slippage guard: revert when output comes in below the trader's
                # | min_out.
                label: "A trava de slippage: reverter quando a saída vier abaixo do min_out do trader."  # @src=11c9f8927f84
                # | The guard belongs between the quote and the first transfer, though be
                # | precise about why: a failed require! after the CPIs still reverts both
                # | transfers, so a bad fill never settles regardless of position. Checking
                # | early spends zero CPI compute on a doomed fill and keeps the trader's
                # | one protection standing legibly in front of the money. It is also the
                # | only trader protection this swap offers.
                feedback: "A trava pertence entre a cotação e a primeira transferência, mas seja preciso sobre o porquê: um require! que falha depois das CPIs ainda reverte as duas transferências, então um fill ruim nunca chega a assentar, independente da posição. Checar cedo gasta zero de compute de CPI num fill condenado e mantém a única proteção do trader de pé e legível na frente do dinheiro. Ela é também a única proteção de trader que este swap oferece."  # @src=ee3148ebc289
              d:
                # | Integer division rounds the output the trader's way, so the fill came up
                # | short.
                label: "Divisão de inteiros arredonda a saída para o lado do trader, então o fill ficou curto."  # @src=d0da419db205
                # | Rounding runs the other direction and at the wrong scale. Truncation
                # | drops the remainder in the pool's favor, never the trader's, and what it
                # | costs is dust rather than the 26 tickets in the scenario. That gap
                # | opened between the quote and the landing, which is a timing problem no
                # | rounding rule touches.
                feedback: "O arredondamento corre na outra direção e na escala errada. O truncamento joga o resto fora a favor do pool, nunca do trader, e o que ele custa é poeira em vez dos 26 tickets do cenário. Aquela lacuna se abriu entre a cotação e a aterrissagem, que é um problema de tempo que nenhuma regra de arredondamento toca."  # @src=34b4f7382899
          m05-l2-q3:
            # | You route both swap directions through the same InterfaceAccount and the
            # | program rejects the instruction as a duplicate mutable account. What's the
            # | clean fix?
            prompt: "Você roteia as duas direções do swap através do mesmo InterfaceAccount e o programa rejeita a instrução como uma conta mutável duplicada. Qual é a correção limpa?"  # @src=93299b182015
            # | A constant-product pool needs two separate reserves, so each side is its own
            # | token account, reserve_arcade and reserve_ticket, holding different mints,
            # | both with token::authority = pool, and the duplicate-mutable default is
            # | satisfied naturally. unsafe(dup) is only for deliberately duplicated
            # | accounts; reaching for it here would paper over a design error. Note the
            # | reserves are not R2 vault instances: a vault's ATA is owned by the vault
            # | PDA, while a reserve's authority must be the pool PDA.
            explanation: "Um pool de produto constante precisa de duas reservas separadas, então cada lado é a conta de token própria dele, reserve_arcade e reserve_ticket, segurando mints diferentes, os dois com token::authority = pool, e o default de duplicate-mutable é satisfeito naturalmente. O unsafe(dup) é só para contas deliberadamente duplicadas; recorrer a ele aqui seria remendar um erro de design. Note que as reservas não são instâncias do vault do R2: a ATA de um vault é de propriedade do PDA do vault, enquanto a authority de uma reserva tem que ser o PDA do pool."  # @src=5d4700064ed6
            options:                 # source order — keep it
              c:
                # | Turn off the duplicate-mutable default with an anchor-lang Cargo
                # | feature, keeping one shared reserve.
                label: "Desligue o default de duplicate-mutable com uma feature de Cargo do anchor-lang, mantendo uma reserva compartilhada."  # @src=9320fe4f89eb
                # | There is no anchor-lang feature that disables the duplicate-mutable
                # | default; V2 made it the default precisely to catch this class of
                # | aliasing bug at validation time, before your handler ever runs. Fix the
                # | account layout instead.
                feedback: "Não existe feature do anchor-lang que desabilite o default de duplicate-mutable; o V2 fez dele o default precisamente para pegar essa classe de bug de aliasing em tempo de validação, antes de o seu handler sequer rodar. Corrija o layout de contas em vez disso."  # @src=77d5f80c4bc7
              d:
                # | Make one of the pool's two slots immutable so one reserve token account
                # | satisfies it.
                label: "Torne um dos dois slots do pool imutável para uma conta de token de reserva satisfazer ele."  # @src=e5b772d2b11d
                # | That silences the checker rather than fixing the layout, and it breaks
                # | the trade: a constant-product swap debits one side and credits the
                # | other, so both reserves have to be writable. The check is not
                # | complaining that two slots are mut, it is complaining that one account
                # | arrived in both.
                feedback: "Isso silencia o verificador em vez de corrigir o layout, e quebra a troca: um swap de produto constante debita um lado e credita o outro, então as duas reservas têm que ser graváveis. A checagem não está reclamando que dois slots são mut, ela está reclamando que uma conta chegou nos dois."  # @src=ec2ca8a2a895
              b:
                # | Add unsafe(dup) to the shared reserve field so V2 accepts one account
                # | serving both directions.
                label: "Adicione unsafe(dup) ao campo de reserva compartilhado para o V2 aceitar uma conta servindo as duas direções."  # @src=911d2754e827
                # | unsafe(dup) is an escape hatch for when duplication is genuinely
                # | intended. Collapsing both reserves into one account aliases the two
                # | sides of the curve and corrupts the k accounting: that's a design bug,
                # | not a case for opting out of the check.
                feedback: "O unsafe(dup) é uma saída de emergência para quando a duplicação é genuinamente intencional. Colapsar as duas reservas numa conta dá alias nos dois lados da curva e corrompe a contabilidade do k: isso é um bug de design, não um caso para fazer opt-out da checagem."  # @src=72b954a78403
              a:
                # | Give each side of the pool its own distinct reserve token account so no
                # | real duplication exists.
                label: "Dê a cada lado do pool a conta de token de reserva distinta própria dele para não existir duplicação de verdade."  # @src=d51cbbd3c894
                # | One account per side, different mints, both under the pool's authority:
                # | the default is satisfied by the layout itself, with no opt-out anywhere.
                # | Not vault instances, though, because the authority differs.
                feedback: "Uma conta por lado, mints diferentes, as duas sob a authority do pool: o default é satisfeito pelo layout em si, sem opt-out em lugar nenhum. Não instâncias do vault, no entanto, porque a authority difere."  # @src=3dd9e98512cb
          m05-l2-q4:
            # | Between the input transfer_checked CPI and reading the pool's new balance,
            # | you try to keep a typed reference to the vault account. V2 refuses to
            # | compile. Why is that a feature?
            prompt: "Entre a CPI de transfer_checked de entrada e a leitura do novo saldo do pool, você tenta manter uma referência tipada à conta do vault. O V2 se recusa a compilar. Por que isso é uma feature?"  # @src=c856514d252f
            # | In v1, forgetting .reload() after a CPI meant acting on stale deserialized
            # | data. V2's CpiHandle holds a borrow, so the compiler rejects typed access
            # | during a live handle; the footgun becomes a compile error rather than a
            # | silent runtime bug that ships. You read reserves before you open the handle
            # | or after it closes, never during. That is why step 1 of the swap handler
            # | reads reserve_arcade.amount() and reserve_ticket.amount() into locals before
            # | any TransferChecked struct is built: the whole stale-read class is removed
            # | by the language, not by a call you must remember.
            explanation: "No v1, esquecer o .reload() depois de uma CPI queria dizer agir em cima de dado desserializado obsoleto. O CpiHandle do V2 segura um borrow, então o compilador rejeita acesso tipado durante um handle vivo; a cilada vira um erro de compilação em vez de um bug silencioso de runtime que é entregue. Você lê reservas antes de abrir o handle ou depois de ele fechar, nunca durante. É por isso que o passo 1 do handler de swap lê reserve_arcade.amount() e reserve_ticket.amount() para dentro de locais antes de qualquer struct TransferChecked ser montada: a classe inteira de leitura obsoleta é removida pela linguagem, não por uma chamada que você tem que lembrar."  # @src=9e50960f504f
            options:                 # source order — keep it
              b:
                # | transfer_checked consumes the InterfaceAccount wrapper, so the typed
                # | account is gone once the CPI returns.
                label: "O transfer_checked consome o wrapper InterfaceAccount, então a conta tipada some assim que a CPI retorna."  # @src=7acfc202b878
                # | Nothing is consumed or destroyed. The handle borrows the wrapper for the
                # | length of the call and then gives it back; that same
                # | reserve_ticket.amount() compiles unchanged on the far side of
                # | transfer_checked.
                feedback: "Nada é consumido nem destruído. O handle segura um borrow do wrapper pela duração da chamada e depois devolve ele; aquele mesmo reserve_ticket.amount() compila inalterado do outro lado do transfer_checked."  # @src=a2ffefe92b39
              c:
                # | V2 requires a .reload() call before any typed .amount read, and the
                # | compiler enforces that call ordering.
                label: "O V2 exige uma chamada de .reload() antes de qualquer leitura tipada de .amount, e o compilador impõe essa ordem de chamada."  # @src=76f1f77684d3
                # | This inverts the change. .reload() was the 0.x remedy for stale
                # | deserialized data; V2 has no reload requirement and the compiler is
                # | enforcing a borrow, not a call ordering. The structural fix is to read
                # | both reserves up front, before any cpi_handle_mut() exists.
                feedback: "Isso inverte a mudança. O .reload() era o remédio de 0.x para dado desserializado obsoleto; o V2 não tem exigência de reload e o compilador está impondo um borrow, não uma ordem de chamada. A correção estrutural é ler as duas reservas de cara, antes de qualquer cpi_handle_mut() existir."  # @src=1b56022c5245
              a:
                # | A live CpiHandle borrows the typed account, so a typed read during it
                # | cannot compile.
                label: "Um CpiHandle vivo segura um borrow da conta tipada, então uma leitura tipada durante ele não consegue compilar."  # @src=ad37d23dc5cd
                # | Snapshot both balances into locals before any mutable handle exists, and
                # | the whole class stops being expressible: no remembered call, no
                # | discipline to keep.
                feedback: "Tire um snapshot dos dois saldos para dentro de locais antes de qualquer handle mutável existir, e a classe inteira para de ser expressável: nenhuma chamada lembrada, nenhuma disciplina para manter."  # @src=6248ef44101e
              d:
                # | It is the duplicate-mutable default firing, because the two live CPI
                # | handles alias the same reserve account.
                label: "É o default de duplicate-mutable disparando, porque os dois handles de CPI vivos dão alias na mesma conta de reserva."  # @src=84a78d1b5402
                # | Two of V2's new defaults are being run together here. Duplicate-mutable
                # | is an account-validation rule about one account arriving in two writable
                # | slots, and it fires at runtime before the handler starts. What stopped
                # | this build is the borrow checker holding a typed read against a live
                # | handle, and the two handles in a swap point at different reserves
                # | anyway.
                feedback: "Dois dos novos defaults do V2 estão sendo misturados aqui. Duplicate-mutable é uma regra de validação de conta sobre uma conta chegando em dois slots graváveis, e ela dispara em runtime antes de o handler começar. O que parou este build foi o borrow checker segurando uma leitura tipada contra um handle vivo, e os dois handles num swap apontam para reservas diferentes de todo jeito."  # @src=7105f6b2434d
  m05-l3:
    # | Token-2022 from the framework's seat
    title: "Token-2022 da cadeira do framework"  # @src=a90b1e585687
    blocks:
      check:                      # quiz
        questions:
          m05-l3-q1:
            # | You read a Token-2022 token account and hardcoded its length to the classic
            # | SPL TokenAccount size. The read returns garbage for some accounts. Why?
            prompt: "Você leu uma conta de token Token-2022 e deixou o tamanho dela hardcoded no tamanho clássico do TokenAccount do SPL. A leitura retorna lixo para algumas contas. Por quê?"  # @src=87a34ff12e1d
            # | A Token-2022 mint or token account carries optional TLV extensions after the
            # | base layout, so its length is not the classic constant. From the program's
            # | seat the fix is simple: read the actual account length rather than assuming
            # | a fixed size. That variable sizing is one of the two things this lesson
            # | makes you account for. Concretely, a Token-2022 mint keeps the classic
            # | 82-byte base, pads out to 165 bytes, carries a one-byte account-type tag at
            # | byte 165, and only then runs the TLV tail, which is why the live PYUSD mint
            # | reads 866 bytes. Nothing in the base is encrypted or re-ordered; it decodes
            # | with the same little-endian fields a classic mint uses.
            explanation: "Um mint ou uma conta de token Token-2022 carrega extensões TLV opcionais depois do layout base, então o tamanho dele não é a constante clássica. Da cadeira do programa a correção é simples: leia o tamanho real da conta em vez de assumir um tamanho fixo. Esse dimensionamento variável é uma das duas coisas que esta lição faz você levar em conta. Concretamente, um mint Token-2022 mantém a base clássica de 82 bytes, preenche até 165 bytes, carrega uma tag de tipo de conta de um byte no byte 165, e só então roda a cauda TLV, que é por que o mint PYUSD vivo lê 866 bytes. Nada na base é criptografado ou reordenado; ele decodifica com os mesmos campos little-endian que um mint clássico usa."  # @src=f65b66c807dd
            options:                 # source order — keep it
              c:
                # | Extensions append a TLV tail after the base layout, so the real length
                # | is data you must read, not a constant.
                label: "Extensões acrescentam uma cauda TLV depois do layout base, então o tamanho real é um dado que você tem que ler, não uma constante."  # @src=b3389a1346aa
                # | The classic base is preserved and padded, then a type tag and whatever
                # | entries the issuer added, which is why a real mainnet mint measures far
                # | longer than the constant your parser is holding.
                feedback: "A base clássica é preservada e preenchida, depois uma tag de tipo e as entradas que quem emitiu adicionou, que é por que um mint de mainnet de verdade mede muito mais que a constante que o seu parser está segurando."  # @src=6016cf87c429
              b:
                # | Token-2022 stores its base fields in big-endian order, so a
                # | little-endian deserializer misreads supply and decimals.
                label: "O Token-2022 guarda os campos base dele em ordem big-endian, então um desserializador little-endian lê supply e decimais errado."  # @src=44b54dce4737
                # | Byte order is unchanged: Token-2022 kept the classic base layout
                # | precisely so existing parsers would not break. What breaks a
                # | fixed-length assumption is the TLV tail appended after that base.
                feedback: "A ordem dos bytes está inalterada: o Token-2022 manteve o layout base clássico precisamente para os parsers existentes não quebrarem. O que quebra uma suposição de tamanho fixo é a cauda TLV acrescentada depois daquela base."  # @src=95ecbc3b9e80
              a:
                # | Token-2022 encrypts account data by default, so the base fields cannot
                # | be read without confidential-transfer keys.
                label: "O Token-2022 criptografa dados de conta por padrão, então os campos base não conseguem ser lidos sem as chaves de transferência confidencial."  # @src=9200ed9d7a43
                # | Confidential transfer is one opt-in extension, not blanket encryption;
                # | the base fields of a Token-2022 account decode in the clear exactly like
                # | a classic one. The bug is the hardcoded length, not encryption.
                feedback: "Transferência confidencial é uma extensão opcional, não criptografia geral; os campos base de uma conta Token-2022 decodificam abertos exatamente como os de uma clássica. O bug é o tamanho hardcoded, não criptografia."  # @src=2ea86fce4ffa
              d:
                # | The extensions can sit ahead of the base layout, so a fixed offset lands
                # | on the wrong bytes.
                label: "As extensões podem ficar na frente do layout base, então um offset fixo aterrissa nos bytes errados."  # @src=a306e373e543
                # | The standard could not renumber a format the whole ecosystem was already
                # | parsing, so the base fields stayed exactly where they were and
                # | everything new was appended behind them. Extension data never moves in
                # | front of the base; what it does is make the total length something you
                # | read instead of something you assume.
                feedback: "O padrão não conseguia renumerar um formato que o ecossistema inteiro já estava parseando, então os campos base ficaram exatamente onde estavam e tudo o que era novo foi acrescentado atrás deles. Dado de extensão nunca se move para a frente da base; o que ele faz é deixar o tamanho total uma coisa que você lê em vez de uma coisa que você assume."  # @src=d015c19838f2
          m05-l3-q2:
            # | Your transfer_checked worked on a plain SPL mint but fails on a specific
            # | Token-2022 mint. What is the most likely program-seat cause?
            prompt: "O seu transfer_checked funcionou num mint simples do SPL mas falha num mint Token-2022 específico. Qual é a causa mais provável da cadeira do programa?"  # @src=53af22da3af2
            # | A mint with a TransferHook extension runs a hook program on every transfer,
            # | and that program needs its extra accounts forwarded in the instruction.
            # | transfer_checked itself is fine; a transfer against a hooked mint just won't
            # | complete unless you resolve and pass those accounts. Designing the hook is
            # | the Digital Assets course's job; noticing you must forward its accounts is
            # | yours. Note that the extension being present is not the trigger: the hook's
            # | programId is. An all-zero programId means the hook is declared but dormant,
            # | and the usual four accounts still suffice.
            explanation: "Um mint com uma extensão TransferHook roda um programa de hook em cada transferência, e aquele programa precisa das contas extra dele encaminhadas na instrução. O transfer_checked em si está bem; uma transferência contra um mint com hook só não vai completar a não ser que você resolva e passe aquelas contas. Projetar o hook é trabalho do curso de Digital Assets; notar que você tem que encaminhar as contas dele é o seu. Note que a extensão estar presente não é o gatilho: o programId do hook é. Um programId todo-zero quer dizer que o hook está declarado mas dormente, e as quatro contas de sempre ainda bastam."  # @src=ef4bdf205954
            options:                 # source order — keep it
              b:
                # | Token-2022 needs its own transfer instruction, because transfer_checked
                # | exists only on the classic Token program.
                label: "O Token-2022 precisa da instrução de transferência própria dele, porque o transfer_checked existe só no programa Token clássico."  # @src=b360d42556e4
                # | transfer_checked is the one primitive that spans both programs, which is
                # | why the swap lesson built on it and why no branch was needed. The
                # | instruction name is right; the account list is short.
                feedback: "O transfer_checked é a única primitiva que atravessa os dois programas, que é por que a lição do swap construiu em cima dele e por que nenhum branch foi necessário. O nome da instrução está certo; a lista de contas está curta."  # @src=d8420e918574
              d:
                # | The mint declares a TransferFeeConfig extension, so the token program
                # | typically rejects a transfer it would shrink.
                label: "O mint declara uma extensão TransferFeeConfig, então o programa de token tipicamente rejeita uma transferência que ele encolheria."  # @src=421cab2a82a0
                # | A fee mint fails the other way, and that is the whole reason the two are
                # | worth separating. The transfer succeeds and less arrives than you sent,
                # | so nothing announces itself: your invariant is what eventually notices.
                # | A hook with a real programId is the one that stops the transfer
                # | outright.
                feedback: "Um mint com taxa falha do outro jeito, e essa é a razão inteira de os dois valerem ser separados. A transferência tem sucesso e chega menos do que você mandou, então nada se anuncia: o seu invariante é o que acaba notando. Um hook com um programId de verdade é o que para a transferência de cara."  # @src=00609d93726d
              c:
                # | InterfaceAccount<Mint> refuses Token-2022 mints, so you must hardcode
                # | the Token-2022 program id in the accounts struct.
                label: "O InterfaceAccount<Mint> recusa mints Token-2022, então você tem que deixar o id do programa Token-2022 hardcoded na struct de accounts."  # @src=feb82b2e2f9c
                # | That is Account<TokenAccount>, which pins the owner to the classic Token
                # | program. InterfaceAccount<T> accepts accounts owned by either program,
                # | which is exactly why hardcoding a program id is the footgun
                # | token_interface removes.
                feedback: "Esse é o Account<TokenAccount>, que prende o owner ao programa Token clássico. O InterfaceAccount<T> aceita contas de propriedade de qualquer um dos dois programas, que é exatamente por que deixar um id de programa hardcoded é a cilada que o token_interface remove."  # @src=bac424baac43
              a:
                # | The mint declares a TransferHook extension and you did not forward the
                # | hook program's extra accounts.
                label: "O mint declara uma extensão TransferHook e você não encaminhou as contas extra do programa de hook."  # @src=a6bf20a236a2
                # | Presence of the extension is not the question; the program id recorded
                # | inside it is. All zeroes and the hook is inert, so that mint transfers
                # | fine on the ordinary account list.
                feedback: "A presença da extensão não é a pergunta; o id de programa registrado dentro dela é. Todo zeros e o hook está inerte, então aquele mint transfere bem na lista de contas comum."  # @src=76b5bf830b1e
          m05-l3-q3:
            # | A teammate asks you to add full transfer-hook design, writing the hook
            # | program and its account-resolution interface, into this lesson's swap.
            # | What's the right call?
            prompt: "Um colega te pede para adicionar design completo de transfer hook, escrevendo o programa de hook e a interface de resolução de contas dele, dentro do swap desta lição. Qual é a chamada certa?"  # @src=980a6f3dde59
            # | The boundary is explicit: this course teaches Token-2022 from the program's
            # | seat (account sizing, forwarding hook accounts), and the Digital Assets
            # | course owns extension-standards depth and walks the transfer-hook interface
            # | end to end. Keeping the line sharp is the lesson's job: mechanics here,
            # | standards there. Concretely, reading the extension-aware account length,
            # | detecting a TransferHook extension and reading its programId, and reasoning
            # | about whether a transfer must forward extra accounts belong here; designing
            # | extensions, writing a hook program, and wiring its account-resolution
            # | interface belong there.
            explanation: "A fronteira é explícita: este curso ensina Token-2022 da cadeira do programa (dimensionamento de conta, encaminhar contas de hook), e o curso de Digital Assets é dono da profundidade de padrões de extensão e percorre a interface de transfer hook de ponta a ponta. Manter a linha nítida é o trabalho da lição: mecânica aqui, padrões lá. Concretamente, ler o tamanho de conta ciente de extensões, detectar uma extensão TransferHook e ler o programId dela, e raciocinar sobre se uma transferência tem que encaminhar contas extra pertencem aqui; projetar extensões, escrever um programa de hook e ligar a interface de resolução de contas dele pertencem lá."  # @src=e567e36016f4
            options:                 # source order — keep it
              c:
                # | Split the difference: write a minimal hook program here and defer only
                # | the account-resolution interface to Digital Assets.
                label: "Divida a diferença: escreva um programa de hook mínimo aqui e postergue só a interface de resolução de contas para o Digital Assets."  # @src=e49c2288c8ec
                # | A partial re-teach is exactly the boundary creep the design forbids. It
                # | duplicates owned material and leaves learners unsure which course
                # | actually teaches the interface end to end.
                feedback: "Um re-ensino parcial é exatamente a invasão de fronteira que o design proíbe. Ele duplica material de que outro é dono e deixa os aprendizes sem saber qual curso de fato ensina a interface de ponta a ponta."  # @src=7ebfd051f38f
              b:
                # | Decline: hook authoring is standards depth the Digital Assets course
                # | owns; this lesson stays at program-seat mechanics.
                label: "Recuse: autorar hook é profundidade de padrões da qual o curso de Digital Assets é dono; esta lição fica na mecânica da cadeira do programa."  # @src=5e3f5ea98865
                # | Sizing the account, spotting the extension, shipping the extra accounts
                # | along with the call: that's the program seat's work. Authoring the hook
                # | and its resolution interface is standards work, and it lives in one
                # | place.
                feedback: "Dimensionar a conta, achar a extensão, entregar as contas extra junto com a chamada: é esse o trabalho da cadeira do programa. Autorar o hook e a interface de resolução dele é trabalho de padrões, e isso mora num lugar só."  # @src=51198b927c5b
              a:
                # | Add it here: the lesson already reads the TransferHook extension, so
                # | authoring the hook program is the natural next step.
                label: "Adicione aqui: a lição já lê a extensão TransferHook, então autorar o programa de hook é o próximo passo natural."  # @src=8387f9a754bd
                # | Reading the extension's programId is a program-seat mechanic; authoring
                # | the hook and its account-resolution interface is standards depth that
                # | lives in one place by design. Detecting is not designing.
                feedback: "Ler o programId da extensão é uma mecânica da cadeira do programa; autorar o hook e a interface de resolução de contas dele é profundidade de padrões que mora num lugar só por design. Detectar não é projetar."  # @src=8d0e23b95cf2
              d:
                # | Tell them it is covered already: detecting the hook and authoring it are
                # | one skill from the program's seat.
                label: "Diga para ele que já está coberto: detectar o hook e autorar ele são uma habilidade só da cadeira do programa."  # @src=bb5452f10b83
                # | Reading a stored programId off a mint and writing the program that field
                # | points at are not the same job, and the lesson draws that line in as
                # | many words: noticing is mechanics, authoring is the standard. Collapsing
                # | them is how a course quietly grows a second syllabus it never planned to
                # | maintain.
                feedback: "Ler um programId guardado de um mint e escrever o programa para o qual aquele campo aponta não são o mesmo trabalho, e a lição desenha essa linha com todas as palavras: notar é mecânica, autoria é o padrão. Colapsar os dois é como um curso caladamente cria um segundo currículo que ele nunca planejou manter."  # @src=3cd96f920f67
          m05-l3-q4:
            # | Budgeting space for a Token-2022 mint, you reach for the account length a
            # | docs example printed for a similar mint and cite it as fixed. What does the
            # | lesson teach you to do instead?
            prompt: "Orçando espaço para um mint Token-2022, você recorre ao tamanho de conta que um exemplo da documentação imprimiu para um mint parecido e cita ele como fixo. O que a lição te ensina a fazer em vez disso?"  # @src=bb1f07ff340f
            # | PR #4914 revised Anchor's own headline benchmarks down (95% to 94%, 9.9x to
            # | 8.8x) with an explicit 'exact values can move' caveat. Extension-aware
            # | sizing is exactly that kind of moving cost, so the discipline is to read the
            # | live Token-2022 mint and reason from the observation rather than freeze a
            # | remembered number. The cost also moves per-mint, not just per-release: a
            # | different Token-2022 mint carries a different extension set and lands at a
            # | different length, and an authority can add an extension after issuance, so
            # | even one mint's number is not stable over time.
            explanation: "O PR #4914 revisou os benchmarks da própria manchete do Anchor para baixo (95% para 94%, 9.9x para 8.8x) com uma ressalva explícita de 'exact values can move'. Dimensionamento ciente de extensões é exatamente esse tipo de custo em movimento, então a disciplina é ler o mint Token-2022 vivo e raciocinar a partir da observação em vez de congelar um número lembrado. O custo também se move por mint, não só por release: um mint Token-2022 diferente carrega um conjunto de extensões diferente e aterrissa num tamanho diferente, e uma autoridade pode adicionar uma extensão depois da emissão, então nem o número de um mint só é estável ao longo do tempo."  # @src=500dd00da3ee
            options:                 # source order — keep it
              c:
                # | Read the live mint and reason from what you observe, because a
                # | remembered figure can already be stale.
                label: "Leia o mint vivo e raciocine a partir do que você observa, porque uma cifra lembrada pode já estar obsoleta."  # @src=d547850ef98a
                # | Per mint as much as per release, since each carries its own extension
                # | set. An authority can bolt one on after issuance too; even a single
                # | mint's measurement has a shelf life.
                feedback: "Por mint tanto quanto por release, já que cada um carrega o conjunto de extensões próprio dele. Uma autoridade também consegue aparafusar uma depois da emissão; até a medição de um mint só tem prazo de validade."  # @src=3b3bd16ff2fe
              a:
                # | Cite the docs figure; a measurement published in official docs is a
                # | versioned guarantee.
                label: "Cite a cifra da documentação; uma medição publicada em documentação oficial é uma garantia versionada."  # @src=93711d2444f2
                # | Anchor's own team revised its headline numbers down in PR #4914 and
                # | attached an explicit 'exact values can move' caveat, and a published
                # | benchmark is a snapshot, not a versioned guarantee.
                feedback: "O próprio time do Anchor revisou os números da manchete dele para baixo no PR #4914 e anexou uma ressalva explícita de 'exact values can move', e um benchmark publicado é um instantâneo, não uma garantia versionada."  # @src=9b6e8230de04
              b:
                # | Average the figures quoted across several posts to smooth out
                # | per-release variation.
                label: "Tire a média das cifras citadas em vários posts para suavizar a variação por release."  # @src=2aad7bad16f2
                # | Averaging stale figures does not make any of them current, and it hides
                # | which release each came from. The lesson's move is to read the live
                # | account and reason from the observation.
                feedback: "Tirar a média de cifras obsoletas não deixa nenhuma delas atual, e isso esconde de qual release cada uma veio. A jogada da lição é ler a conta viva e raciocinar a partir da observação."  # @src=3b9721cd9308
              d:
                # | Use the 866 bytes the lab measured on PYUSD, since a live mainnet
                # | reading beats a published figure.
                label: "Use os 866 bytes que o lab mediu no PYUSD, já que uma leitura viva de mainnet ganha de uma cifra publicada."  # @src=4be7b8d13acb
                # | A live reading does beat a docs figure, and 866 is still the wrong thing
                # | to carry forward: it is one mint's extension set on one day. Another
                # | Token-2022 mint carries different extensions and lands at a different
                # | length, and an authority can add one after issuance, so the number you
                # | want is the one you read from the mint in front of you.
                feedback: "Uma leitura viva ganha de uma cifra de documentação, e 866 ainda é a coisa errada de carregar para frente: é o conjunto de extensões de um mint só num dia só. Outro mint Token-2022 carrega extensões diferentes e aterrissa num tamanho diferente, e uma autoridade consegue adicionar uma depois da emissão, então o número que você quer é o que você lê do mint na sua frente."  # @src=7f23519b7927
  m06-l1:
    # | Turn the instruments on: profile, debug, and cover the swap
    title: "Ligue os instrumentos: perfilar, depurar e cobrir o swap"  # @src=bd57362c0acc
    blocks:
      check:                      # quiz
        questions:
          profile-output:
            # | You ran `anchor test --profile` on the swap and the run finished green.
            # | Where do the per-test flamegraphs land, and what kind of build produced
            # | them?
            prompt: "Você rodou `anchor test --profile` no swap e a rodada terminou verde. Onde os flamegraphs por teste caem, e que tipo de build produziu eles?"  # @src=9d1ddad26c06
            # | `anchor test --profile` compiles a debug build (for DWARF symbols) and emits
            # | one flamegraph SVG per test under target/anchor-v2-profile/. Because it is a
            # | debug build, treat the CU it shows as relative shape, not your release cost.
            # | DWARF is the debug-info format that maps compiled instructions back to your
            # | function names; without it the profiler would label every frame with a raw
            # | hex address instead of `swap_out`.
            explanation: "O `anchor test --profile` compila um build de debug (para os símbolos DWARF) e emite um SVG de flamegraph por teste dentro de target/anchor-v2-profile/. Como é um build de debug, trate a CU que ele mostra como forma relativa, não como o seu custo de release. DWARF é o formato de debug-info que mapeia instruções compiladas de volta para os nomes das suas funções; sem ele o profiler rotularia cada frame com um endereço hex cru em vez de `swap_out`."  # @src=5b597149bdc8
            options:                 # source order — keep it
              e:
                # | Under target/anchor-v2-profile/, one SVG for the run, debug build.
                label: "Dentro de target/anchor-v2-profile/, um SVG para a rodada, build de debug."  # @src=f3d142d4ae7b
                # | One SVG for the whole run would fold every test's transactions into a
                # | single chart, which is exactly the confusion the per-test split avoids:
                # | your fixture's mint-and-fund transactions get their own roots, often
                # | fatter than the trade. The profiler writes one file per test so the
                # | roots you are ignoring are at least in someone else's file.
                feedback: "Um SVG para a rodada inteira dobraria as transações de todos os testes num gráfico só, que é exatamente a confusão que a divisão por teste evita: as transações de cunhar-e-financiar da sua fixture ganham as raízes delas, muitas vezes mais gordas que a troca. O profiler escreve um arquivo por teste para que as raízes que você está ignorando estejam pelo menos no arquivo de outro."  # @src=0f1a8eb13baf
              d:
                # | Under target/anchor-v2-profile/, one SVG per test, a release build.
                label: "Dentro de target/anchor-v2-profile/, um SVG por teste, um build de release."  # @src=a98072089ee3
                # | Right path, right granularity, wrong build. A release build strips the
                # | DWARF symbols the profiler needs to name a frame, so `--profile`
                # | compiles in debug on purpose and you pay for it in inflated CU figures
                # | that are only good for comparing frames against each other.
                feedback: "Caminho certo, granularidade certa, build errado. Um build de release remove os símbolos DWARF de que o profiler precisa para nomear um frame, então o `--profile` compila em debug de propósito e você paga por isso em números de CU inflados que só servem para comparar frames entre si."  # @src=cd8efb8e9f7a
              b:
                # | Under target/deploy/, one SVG per program, from a release build.
                label: "Dentro de target/deploy/, um SVG por programa, de um build de release."  # @src=ebe837a34811
                # | target/deploy/ holds the compiled .so only. The profiler writes to its
                # | own directory, emits one SVG per test rather than per program, and
                # | builds in debug so DWARF survives.
                feedback: "O target/deploy/ contém só o .so compilado. O profiler escreve no diretório próprio dele, emite um SVG por teste e não por programa, e faz o build em debug para o DWARF sobreviver."  # @src=59ec12b62758
              a:
                # | Only as text tables in stdout, since V2 dropped the v1-era flamegraph
                # | SVGs.
                label: "Só como tabelas de texto no stdout, já que o V2 largou os SVGs de flamegraph da era v1."  # @src=5f4c76ff54b1
                # | Backwards: the flamegraph SVG is V2's addition, and `--profile` is the
                # | flag that writes it. There is no v1 SVG being retired here.
                feedback: "Ao contrário: o SVG de flamegraph é a adição do V2, e o `--profile` é a flag que escreve ele. Não tem nenhum SVG de v1 sendo aposentado aqui."  # @src=3024f9e64efe
              c:
                # | Under target/anchor-v2-profile/, one SVG per test, a debug build.
                label: "Dentro de target/anchor-v2-profile/, um SVG por teste, um build de debug."  # @src=4dc307964596
                # | Debug is chosen so symbols survive. Strip them and every frame reads as
                # | a hex address. The cost is that the CU numbers on it are relative shape,
                # | never the release figure you would ship.
                feedback: "Debug é escolhido para os símbolos sobreviverem. Remova eles e cada frame lê como um endereço hex. O custo é que os números de CU nele são forma relativa, nunca o número de release que você entregaria."  # @src=0b8adb6b604e
          step-instruction:
            # | One swap instruction fails and you want to walk it sBPF instruction by
            # | instruction, inspecting registers as you go. Which tool does that?
            prompt: "Uma instrução de swap falha e você quer caminhar por ela instrução sBPF por instrução sBPF, inspecionando registradores conforme você avança. Qual ferramenta faz isso?"  # @src=f86103b724d7
            # | anchor debugger is the instruction-level ratatui TUI; it is the only one of
            # | the four that lets you step and inspect, while the others produce reports
            # | after the fact. It does not run your suite; it builds the named test,
            # | replays its transaction, and halts at your program's first instruction.
            # | Passing `--gdb` additionally exposes the solana-sbpf gdb stub on
            # | 127.0.0.1:9001, so you can attach real gdb and set breakpoints by symbol
            # | name.
            explanation: "O anchor debugger é a TUI em ratatui no nível da instrução; ele é o único dos quatro que deixa você dar step e inspecionar, enquanto os outros produzem relatórios depois do fato. Ele não roda a sua suíte; ele faz o build do teste nomeado, repete a transação dele, e para na primeira instrução do seu programa. Passar `--gdb` além disso expõe o gdb stub do solana-sbpf em 127.0.0.1:9001, então você pode anexar o gdb de verdade e colocar breakpoints por nome de símbolo."  # @src=dbf4a3e18038
            options:                 # source order — keep it
              d:
                # | gdb attached by hand to the built .so, since no Anchor subcommand shows
                # | sBPF registers.
                label: "gdb anexado na mão ao .so compilado, já que nenhum subcomando do Anchor mostra registradores sBPF."  # @src=bd182cc929ac
                # | Anchor does not leave you to wire this yourself. The debugger's TUI
                # | shows the registers changing as you step, and if you want gdb proper,
                # | `anchor debugger --gdb` exposes the solana-sbpf stub on 127.0.0.1:9001
                # | for you to attach to. Reaching for bare gdb means doing by hand what a
                # | subcommand already hosts.
                feedback: "O Anchor não te deixa fazer essa fiação sozinho. A TUI do debugger mostra os registradores mudando conforme você dá step, e se você quer o gdb propriamente dito, o `anchor debugger --gdb` expõe o stub do solana-sbpf em 127.0.0.1:9001 para você anexar. Recorrer ao gdb simples quer dizer fazer na mão o que um subcomando já hospeda."  # @src=7a2a4ed366a5
              a:
                # | anchor debugger, a ratatui TUI that steps sBPF instructions and shows
                # | registers.
                label: "anchor debugger, uma TUI em ratatui que dá step em instruções sBPF e mostra registradores."  # @src=d4f5b30a7a7c
                # | It doesn't run a suite: one named test is rebuilt, its transaction
                # | replayed, and you land on your program's first instruction. There is a
                # | gdb stub behind a flag too, if you would rather break on symbol names.
                feedback: "Ele não roda uma suíte: um teste nomeado é reconstruído, a transação dele é repetida, e você aterrissa na primeira instrução do seu programa. Tem um gdb stub atrás de uma flag também, se você preferir parar em nomes de símbolo."  # @src=393561444d5e
              c:
                # | anchor test --profile: the flamegraph pauses at the failing frame so you
                # | can read registers.
                label: "anchor test --profile: o flamegraph pausa no frame que falha para você ler os registradores."  # @src=c4842d57bf84
                # | The flamegraph is a static SVG written after the whole run finishes.
                # | Frame width tells you where cost accumulated; there is no live frame to
                # | pause on and no register state captured in the file.
                feedback: "O flamegraph é um SVG estático escrito depois de a rodada inteira terminar. A largura do frame te diz onde o custo acumulou; não tem frame vivo para pausar e nenhum estado de registrador é capturado no arquivo."  # @src=254d2187bc04
              b:
                # | anchor coverage: it replays the failing test and halts on the uncovered
                # | line for inspection.
                label: "anchor coverage: ele repete o teste que falha e para na linha não coberta para inspeção."  # @src=6bd865dce063
                # | Tempting because coverage does point at code your tests never reached,
                # | but it never runs interactively: it reconstructs line and branch hits
                # | from SBF register traces and drops an LCOV file. Nothing halts, and
                # | there is no register view.
                feedback: "Tentador porque a cobertura de fato aponta para código que os seus testes nunca alcançaram, mas ela nunca roda de forma interativa: ela reconstrói acertos de linha e de branch a partir de traces de registradores SBF e larga um arquivo LCOV. Nada para, e não tem view de registradores."  # @src=41375d7a7d0e
          cu-precise-unit:
            # | You want CU-precise assertions on the trade instruction without standing up
            # | a validator, and you want to know how the testing thread escalates from
            # | here.
            prompt: "Você quer asserções precisas em CU na instrução de troca sem levantar um validador, e você quer saber como o fio de testes escala daqui."  # @src=bdb4a9108f90
            # | Mollusk gives CU-precise, in-process unit assertions on a single
            # | instruction. The module's testing thread escalates from the LiteSVM harness
            # | (m02) up to Mollusk here; Surfpool comes later for full-floor integration.
            # | Mollusk is a third-party crate with no Anchor affiliation, pinned at 0.15.1
            # | in this lab, and it runs one instruction with no validator, no localnet, and
            # | no async: you build the instruction, hand it accounts, and assert
            # | `Check::success()` plus `Check::compute_units(N)`.
            explanation: "O Mollusk dá asserções de unidade precisas em CU e in-process sobre uma instrução só. O fio de testes do módulo escala da bancada de teste em LiteSVM (m02) até o Mollusk aqui; o Surfpool vem depois para integração de salão inteiro. O Mollusk é um crate de terceiros sem nenhuma afiliação com o Anchor, fixado em 0.15.1 neste lab, e ele roda uma instrução sem validador, sem localnet e sem async: você monta a instrução, entrega contas para ela, e faz assert de `Check::success()` mais `Check::compute_units(N)`."  # @src=dfa79b629ceb
            options:                 # source order — keep it
              a:
                # | Surfpool localnet: the CU-precise unit harness, no validator needed.
                label: "Surfpool localnet: a bancada de unidade precisa em CU, sem precisar de validador."  # @src=1162eaafc9da
                # | Surfpool is itself a localnet validator, forking real cluster state,
                # | which is exactly the stand-up this question rules out. It arrives later,
                # | at the capstone, for full-floor integration rather than per-instruction
                # | CU.
                feedback: "O Surfpool é ele mesmo um validador de localnet, forkando estado real de cluster, que é exatamente a montagem que esta pergunta descarta. Ele chega depois, no capstone, para integração de salão inteiro em vez de CU por instrução."  # @src=70f1c8502492
              b:
                # | Mollusk (anza-xyz/mollusk): an in-process minified SVM with CU-precise
                # | checks.
                label: "Mollusk (anza-xyz/mollusk): uma SVM minificada in-process com checagens precisas em CU."  # @src=98e5ca6ff54c
                # | Unaffiliated, third-party, pinned in this lab: one instruction, no
                # | validator, no async anywhere in it. The testing thread climbs here from
                # | the earlier harness, and localnet comes later.
                feedback: "Sem afiliação, de terceiros, fixado neste lab: uma instrução, sem validador, sem async em lugar nenhum dele. O fio de testes sobe até aqui a partir da bancada anterior, e a localnet vem depois."  # @src=ce589e91981f
              c:
                # | anchor coverage: its LCOV report carries CU per line to assert on.
                label: "anchor coverage: o relatório LCOV dele carrega CU por linha para você fazer assert."  # @src=56b4a4957499
                # | LCOV records `DA:` line hits and `BRDA:` branch hits, counts of how
                # | often code ran rather than what it cost. Coverage also reports rather
                # | than gates, so there is nothing there to assert against.
                feedback: "O LCOV registra acertos de linha `DA:` e acertos de branch `BRDA:`, contagens de quantas vezes o código rodou em vez de quanto ele custou. A cobertura também reporta em vez de travar, então não tem nada ali contra o que fazer assert."  # @src=088e915b9443
              d:
                # | The LiteSVM harness from module 2, since it already reports compute
                # | units.
                label: "A bancada em LiteSVM do módulo 2, já que ela já reporta unidades de compute."  # @src=233370e11567
                # | LiteSVM is the right shape and the wrong rung. It answers whether the
                # | instruction did the right thing, in process and fast, and this module
                # | escalates past it precisely because the next question is how many
                # | compute units the right thing took. That assertion is the one Mollusk
                # | adds.
                feedback: "O LiteSVM é a forma certa e o degrau errado. Ele responde se a instrução fez a coisa certa, in-process e rápido, e este módulo escala para além dele exatamente porque a próxima pergunta é quantas unidades de compute a coisa certa levou. Essa asserção é a que o Mollusk adiciona."  # @src=24ab14b24703
          coverage-output:
            # | You ran `anchor coverage` on the swap to find untested branches. What does
            # | it produce, and from what?
            prompt: "Você rodou `anchor coverage` no swap para achar branches sem teste. O que ele produz, e a partir de quê?"  # @src=59d0a98dd6ab
            # | anchor coverage reconstructs line/branch coverage as LCOV from SBF register
            # | traces, so you can see which swap branches your tests never exercised. It
            # | reports; it does not decide or gate. The raw file at
            # | target/anchor-v2-coverage/lcov.info is a machine format of `DA:` and `BRDA:`
            # | records with no source in it, so render it with `genhtml` (or point an
            # | editor extension at it) to read the red branches against your own lib.rs.
            explanation: "O anchor coverage reconstrói cobertura de linha/branch como LCOV a partir de traces de registradores SBF, então você consegue ver quais branches do swap os seus testes nunca exercitaram. Ele reporta; ele não decide nem trava. O arquivo cru em target/anchor-v2-coverage/lcov.info é um formato de máquina de registros `DA:` e `BRDA:` sem nenhum código dentro, então renderize ele com `genhtml` (ou aponte uma extensão de editor para ele) para ler os branches vermelhos contra o seu próprio lib.rs."  # @src=840bcbfd04a1
            options:                 # source order — keep it
              d:
                # | An HTML site of line coverage, rendered from the swap's test run.
                label: "Um site HTML de cobertura de linha, renderizado a partir da rodada de testes do swap."  # @src=0787610a2a76
                # | You can get that page, but not from this command. `anchor coverage`
                # | writes raw LCOV, a machine format of `DA:` and `BRDA:` records with no
                # | source in it, and turning that into something browsable is a second step
                # | you run yourself with genhtml or an editor extension.
                feedback: "Você consegue essa página, mas não desse comando. O `anchor coverage` escreve LCOV cru, um formato de máquina de registros `DA:` e `BRDA:` sem nenhum código dentro, e transformar isso em algo navegável é um segundo passo que você roda você mesmo com o genhtml ou uma extensão de editor."  # @src=42d42a6ebb21
              a:
                # | A flamegraph SVG of CU cost per function, one per test, under
                # | target/deploy/.
                label: "Um SVG de flamegraph de custo em CU por função, um por teste, dentro de target/deploy/."  # @src=07af6b0b199a
                # | That describes `anchor test --profile`, and even then the SVGs land
                # | under target/anchor-v2-profile/, not target/deploy/. Coverage is about
                # | which code ran, not how expensive it was.
                feedback: "Isso descreve o `anchor test --profile`, e mesmo assim os SVGs caem dentro de target/anchor-v2-profile/, não de target/deploy/. Cobertura é sobre qual código rodou, não sobre quão caro ele foi."  # @src=0cb4727f8452
              c:
                # | An LCOV report of line and branch coverage, from SBF register traces.
                label: "Um relatório LCOV de cobertura de linha e de branch, a partir de traces de registradores SBF."  # @src=1c3218c71fb7
                # | The artifact is a hit-count file with no source in it; something has to
                # | render it before you can read anything. Which lines ran, never what they
                # | cost.
                feedback: "O artefato é um arquivo de contagem de acertos sem nenhum código dentro; alguma coisa tem que renderizar ele antes de você conseguir ler qualquer coisa. Quais linhas rodaram, nunca quanto elas custaram."  # @src=5a9b905e975f
              b:
                # | A hard gate that fails the build when coverage drops below a threshold.
                label: "Uma trava dura que falha o build quando a cobertura cai abaixo de um limite."  # @src=a55bfe2278f5
                # | Coverage hands you a report and walks away; it never fails a build. A
                # | coverage floor is CI policy you write on top of the LCOV file yourself.
                feedback: "A cobertura te entrega um relatório e vai embora; ela nunca falha um build. Um piso de cobertura é política de CI que você mesmo escreve em cima do arquivo LCOV."  # @src=7b2ac77bfdd9
  m06-l2:
    # | The measured loop: buy back CU one change at a time
    title: "O loop medido: recompre CU uma mudança por vez"  # @src=e91f150e883a
    blocks:
      optimize-swap-quote:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | amount_in_with_fee = amount_in * (10_000 - fee_bps)
          0: "amount_in_with_fee = amount_in * (10_000 - fee_bps)"  # @src=5bd35cd45d51
          # | out = (reserve_out * amount_in_with_fee) / (reserve_in * 10_000 +
          # | amount_in_with_fee)
          1: "out = (reserve_out * amount_in_with_fee) / (reserve_in * 10_000 + amount_in_with_fee)"  # @src=fd0024b321b0
          # | cast to u128 before the multiplies, cast back to u64 after the single division
          2: "faça cast para u128 antes das multiplicações, faça cast de volta para u64 depois da divisão única"  # @src=cc94b74c5781
          # | guard before you compute: an empty reserve, or a fee_bps above 10_000, has no
          # | valid quote — return 0 rather than dividing by zero or underflowing the fee
          3: "trave antes de computar: uma reserva vazia, ou um fee_bps acima de 10_000, não tem cotação válida — retorne 0 em vez de dividir por zero ou dar underflow na taxa"  # @src=ba7fa9604198
        tests:                      # keyed by test case id
          t1:
            # | 0.3% fee (30 bps), equal 1M reserves, 10k in — fee-adjusted constant product
            description: "taxa de 0.3% (30 bps), reservas iguais de 1M, 10k de entrada — produto constante ajustado pela taxa"  # @src=5509e89fb367
          t2:
            # | 0.3% fee, uneven reserves (5M in / 2M out), 100k in
            description: "taxa de 0.3%, reservas desiguais (5M dentro / 2M fora), 100k de entrada"  # @src=3aaffd812601
          t3:
            # | zero fee behaves like the plain constant product (starter and solution agree
            # | here)
            description: "taxa zero se comporta como o produto constante simples (starter e solução concordam aqui)"  # @src=f8b45b4fdc79
          t4:
            # | 0.3% fee, large trade (500k into 1M/1M) where the missing fee is obvious
            description: "taxa de 0.3%, troca grande (500k dentro de 1M/1M) onde a taxa faltando é óbvia"  # @src=e1204f385366
          t5:
            # | empty reserve_in: the denominator collapses to amount_in_with_fee, so an
            # | unguarded quote hands back the entire reserve_out
            description: "reserve_in vazio: o denominador colapsa para amount_in_with_fee, então uma cotação sem trava devolve o reserve_out inteiro"  # @src=93e2c5dad404
          t6:
            # | fully drained pool (both reserves empty) asked for a zero-size quote — an
            # | unguarded quote divides 0 by 0
            description: "pool completamente drenado (as duas reservas vazias) com um pedido de cotação de tamanho zero — uma cotação sem trava divide 0 por 0"  # @src=ad13da64c3bd
          t7:
            # | fee above the 10_000 bps scale: 10_000 - fee_bps underflows unless it is
            # | guarded
            description: "taxa acima da escala de 10_000 bps: 10_000 - fee_bps dá underflow a menos que esteja travado"  # @src=b54f3e4247f5
          t8:
            # | fee_bps == 10_000 is the boundary, not an error: a 100% fee eats the whole
            # | input and 0 out is the arithmetic answer
            description: "fee_bps == 10_000 é a fronteira, não um erro: uma taxa de 100% come a entrada inteira e 0 de saída é a resposta aritmética"  # @src=ca1ffbff80c8
          t9:
            # | u64::MAX reserves and input: the numerator exceeds u128, so the checked
            # | product must degrade to 0 instead of overflowing
            description: "reservas e entrada u64::MAX: o numerador excede o u128, então o produto checado tem que degradar para 0 em vez de dar overflow"  # @src=dc7311f145d6
          t10:
            # | 1e18 reserves, 1e12 in: fits u128 comfortably but overflows a u64 multiply,
            # | so this is the case that forces the promotion
            description: "reservas de 1e18, 1e12 de entrada: cabe confortavelmente no u128 mas dá overflow numa multiplicação u64, então este é o caso que força a promoção"  # @src=b093ed0695c6
      check:                      # quiz
        questions:
          guardrails-off:
            # | A crate whose graph holds just `anchor-lang`, with no `anchor-spl` edge
            # | re-adding the defaults, compiles with `guardrails` OFF and re-measures lower
            # | CU plus a smaller binary. Select the two statements that hold for that
            # | build.
            prompt: "Um crate cujo grafo tem só o `anchor-lang`, sem nenhuma aresta de `anchor-spl` re-adicionando os defaults, compila com o `guardrails` DESLIGADO e re-mede CU menor mais um binário menor. Selecione as duas afirmações que valem para aquele build."  # @src=19a94cab3cdc
            # | Two statements hold and three do not, and the pair that holds is
            # | deliberately one fact plus one obligation: the checks really did leave the
            # | binary, and the argument they were making is now yours to write. guardrails
            # | is a default-on set of runtime safety nets. Where the flip lands, compiling
            # | it off buys back CU and ~300 bytes, but you have removed real checks, so it
            # | is only honest to ship once you can defend the invariants without them. Name
            # | the nets before you argue past them: that an account is owned by the program
            # | you think owns it, that a discriminator matches the type you deserialized
            # | as, that a wrapping arithmetic path is caught rather than silently
            # | truncating. Turning the feature off does not make a malformed call
            # | impossible; it makes the framework stop checking for one. And note the
            # | question's precondition, because on R4 itself the lab measured a zero:
            # | anchor-spl declares anchor-lang with its defaults on, and cargo's feature
            # | unification holds guardrails on for the whole graph no matter what your own
            # | row says, so the flip only lands on a crate whose graph does not re-add it.
            # | When it lands, this trade is what you signed, and if you cannot write the
            # | invariant paragraph for your own handler, revert.
            explanation: "Duas afirmações valem e três não, e o par que vale é deliberadamente um fato mais uma obrigação: as checagens de fato saíram do binário, e o argumento que elas estavam fazendo agora é seu para escrever. guardrails é um conjunto default-on de redes de proteção em runtime. Onde a virada aterrissa, compilar ele desligado recompra CU e ~300 bytes, mas você removeu checagens de verdade, então só é honesto entregar quando você consegue defender os invariantes sem elas. Nomeie as redes antes de argumentar além delas: que uma conta é de propriedade do programa que você pensa que é dono dela, que um discriminator casa com o tipo com o qual você desserializou, que um caminho aritmético que dá wrap é pego em vez de truncar em silêncio. Desligar a feature não torna uma chamada malformada impossível; faz o framework parar de checar por uma. E note a precondição da pergunta, porque no próprio R4 o lab mediu um zero: o anchor-spl declara o anchor-lang com os defaults dele ligados, e a unificação de features do cargo mantém o guardrails ligado para o grafo inteiro não importa o que a sua própria linha diga, então a virada só aterrissa num crate cujo grafo não re-adiciona ele. Quando ela aterrissa, esta troca é o que você assinou, e se você não consegue escrever o parágrafo de invariante para o seu próprio handler, reverta."  # @src=4a8b09d1446c
            options:                 # source order — keep it
              d:
                # | The malformed call did not become impossible; the framework stopped
                # | checking for it, so the invariant argument is now yours to write.
                label: "A chamada malformada não se tornou impossível; o framework parou de checar por ela, então o argumento de invariante agora é seu para escrever."  # @src=9a1dc1eab91e
                # | This is the half people skip, and it is the half that decides whether
                # | the trade was defensible. Nothing about the caller changed. If you can
                # | say out loud that the reserves are distinct accounts, the fee scale is
                # | fixed, the output is bounded by reserve_out, and the quote returns 0 on
                # | an empty pool, you have made the argument the framework was making. If
                # | you cannot, revert.
                feedback: "Esta é a metade que as pessoas pulam, e é a metade que decide se a troca era defensável. Nada sobre quem chama mudou. Se você consegue dizer em voz alta que as reservas são contas distintas, que a escala de taxa é fixa, que a saída é limitada por reserve_out, e que a cotação retorna 0 num pool vazio, você fez o argumento que o framework estava fazendo. Se você não consegue, reverta."  # @src=928ebd44c615
              e:
                # | The framework still catches a malformed call and just reports it later,
                # | so in practice you traded error quality rather than a check.
                label: "O framework ainda pega uma chamada malformada e só reporta ela depois, então na prática você trocou qualidade de erro em vez de uma checagem."  # @src=9f348c60ed62
                # | There is no later. A check that was compiled out does not run at all, so
                # | nothing downgrades a clean rejection into a messy one: the call proceeds
                # | on bytes nobody verified. That is the whole reason the CU came back, and
                # | the whole reason the trade needs an argument behind it.
                feedback: "Não existe depois. Uma checagem que foi compilada fora não roda de jeito nenhum, então nada rebaixa uma rejeição limpa para uma bagunçada: a chamada prossegue em cima de bytes que ninguém verificou. É essa a razão inteira de a CU ter voltado, e a razão inteira de a troca precisar de um argumento por trás dela."  # @src=b853ad4c2cc4
              a:
                # | Real default-on runtime safety nets came out of the binary; the CU and
                # | roughly 300 bytes are what those checks cost to run.
                label: "Redes de proteção de runtime default-on de verdade saíram do binário; a CU e aproximadamente 300 bytes são o que aquelas checagens custam para rodar."  # @src=99654c8b41c4
                # | Ownership matching, tag matching, arithmetic that raises instead of
                # | truncating: that is the list, and it is worth saying out loud before you
                # | argue past it. Anchor's own 300-byte figure is measured on its benchmark
                # | program, so treat it as an order of magnitude rather than your number.
                feedback: "Casamento de propriedade, casamento de tag, aritmética que levanta erro em vez de truncar: essa é a lista, e vale dizer em voz alta antes de você argumentar além dela. A figura de 300 bytes do próprio Anchor é medida no programa de benchmark dele, então trate ela como uma ordem de magnitude e não como o seu número."  # @src=89aeb94c1fd8
              c:
                # | The Mollusk harness is what changed: `guardrails` gates test-time
                # | account checks, so the deployed program still runs them at full cost.
                label: "A bancada de teste do Mollusk é o que mudou: o `guardrails` trava checagens de conta em tempo de teste, então o programa deployado ainda roda elas a custo cheio."  # @src=1175b78e9273
                # | Mollusk has no `guardrails` knob; the feature belongs to `anchor-lang`
                # | and is forwarded through your program crate's `Cargo.toml`. It changes
                # | the compiled `.so` you deploy, not the harness that measures it, which
                # | is why the byte size on disk is part of the reading.
                feedback: "O Mollusk não tem botão de `guardrails`; a feature pertence ao `anchor-lang` e é encaminhada através do `Cargo.toml` do seu crate de programa. Ela muda o `.so` compilado do qual você faz deploy, não a bancada de teste que mede ele, que é por que o tamanho em bytes no disco é parte da leitura."  # @src=1a596c9e83b8
              b:
                # | Debug assertions are what got stripped: `guardrails` gates a debug-build
                # | lint, so the release build was already running without those checks.
                label: "Asserções de debug são o que foi tirado: o `guardrails` trava um lint de build de debug, então o build de release já estava rodando sem aquelas checagens."  # @src=7ab4c4d62fee
                # | Tempting because rustc's overflow checks do default to debug builds,
                # | though that is a per-profile manifest setting and this course's
                # | workspace pins them on for release too. `guardrails` is a different
                # | thing again: an Anchor V2 crate feature compiled into every profile. Had
                # | the release build already been skipping those checks, nothing could have
                # | shrunk when you turned the feature off.
                feedback: "Tentador porque as checagens de overflow do rustc de fato vêm por padrão em builds de debug, embora isso seja uma configuração de manifesto por profile e o workspace deste curso fixe elas ligadas para release também. O `guardrails` é uma coisa diferente de novo: uma feature de crate do Anchor V2 compilada em cada profile. Se o build de release já estivesse pulando aquelas checagens, nada poderia ter encolhido quando você desligou a feature."  # @src=024cc04363fd
          const-rent:
            # | You enabled `const-rent` and account-creation got cheaper. What did it save,
            # | and what is the fine print you must carry?
            prompt: "Você habilitou o `const-rent` e a criação de conta ficou mais barata. O que ele economizou, e quais são as letras miúdas que você tem que carregar?"  # @src=00dbe7b21d6f
            # | const-rent folds the rent constant at compile time, saving ~85-90 CU per
            # | account-creation CPI. The catch, stated in Anchor's own Cargo.toml comment:
            # | the folded constant drifts if the rent formula changes, which is why it
            # | cites SIMD-0194 and why you carry a re-verify note. Note also which
            # | instruction the lever touches, account-creation CPIs like `init`, not the
            # | trade handler, so measuring the swap after flipping it shows a delta of zero
            # | and teaches you the wrong thing.
            explanation: "const-rent dobra a constante de rent em tempo de compilação, economizando ~85-90 CU por CPI de criação de conta. A pegadinha, declarada no comentário do próprio Cargo.toml do Anchor: a constante dobrada diverge se a fórmula de rent mudar, que é por que ele cita a SIMD-0194 e por que você carrega uma nota de re-verificação. Note também qual instrução a alavanca toca, CPIs de criação de conta como o `init`, não o handler da troca, então medir o swap depois de virar ele mostra um delta de zero e te ensina a coisa errada."  # @src=8d73fc5046ac
            options:                 # source order — keep it
              c:
                # | It marks created accounts rent-exempt without funding them, so the payer
                # | keeps the lamports that would have gone into the deposit.
                label: "Ele marca as contas criadas como isentas de aluguel sem financiar elas, então o payer fica com os lamports que teriam ido para o depósito."  # @src=172fee3e4187
                # | `const-rent` changes neither what rent is owed nor who funds it: the new
                # | account still needs its full rent-exempt deposit or it cannot survive.
                # | All it removes is the runtime work of deriving that minimum from the
                # | account's byte size.
                feedback: "O `const-rent` não muda nem quanto rent é devido nem quem financia: a conta nova ainda precisa do depósito completo de isenção de aluguel dela ou ela não consegue sobreviver. Tudo o que ele remove é o trabalho de runtime de derivar aquele mínimo a partir do tamanho em bytes da conta."  # @src=f59d29ba9fac
              d:
                # | It folds the rent-exempt minimum at compile time, and in practice it
                # | lands once your whole graph opts into it.
                label: "Ele dobra o mínimo isento de aluguel em tempo de compilação, e na prática ele aterrissa quando o seu grafo inteiro faz opt-in nele."  # @src=84e3b6f68ea1
                # | The fold is right and the precondition is the guardrails lesson read
                # | backwards. Cargo features are additive, so turning one ON needs only
                # | your own edge to ask for it; unification is what vetoed the guardrails
                # | removal and it has nothing to veto here. The fine print is drift, not
                # | consensus.
                feedback: "A dobra está certa e a precondição é a lição de guardrails lida ao contrário. Features do Cargo são aditivas, então LIGAR uma precisa só que a sua própria aresta peça por ela; a unificação é o que vetou a remoção do guardrails e ela não tem nada para vetar aqui. As letras miúdas são divergência, não consenso."  # @src=b74ea6ffd095
              a:
                # | It caches the `Rent` sysvar in a runtime static after the first
                # | `Rent::get()`, so every later account-creation CPI skips the sysvar
                # | read.
                label: "Ele faz cache do sysvar `Rent` num static de runtime depois do primeiro `Rent::get()`, então cada CPI de criação de conta posterior pula a leitura do sysvar."  # @src=4b4e57fd38c2
                # | A runtime cache is the wrong mental model: `const-rent` folds the
                # | rent-exempt minimum in at compile time, so nothing is memoized while the
                # | program runs. And it does carry a staleness risk: the frozen constant,
                # | not a cached read, is what can drift.
                feedback: "Um cache de runtime é o modelo mental errado: o `const-rent` dobra para dentro o mínimo isento de aluguel em tempo de compilação, então nada é memoizado enquanto o programa roda. E ele sim carrega um risco de obsolescência: a constante congelada, não uma leitura em cache, é o que pode divergir."  # @src=af19d6903f76
              b:
                # | It folds the rent-exempt minimum in at compile time, and that frozen
                # | constant drifts if the rent formula ever changes.
                label: "Ele dobra para dentro o mínimo isento de aluguel em tempo de compilação, e aquela constante congelada diverge se a fórmula de rent algum dia mudar."  # @src=c20ea6256ecc
                # | That constant was baked in at build time, so if the formula moves later,
                # | your binary keeps quoting the old number. And it only touches account
                # | creation, so profiling an unrelated handler was never going to show it.
                feedback: "Aquela constante foi embutida em tempo de build, então se a fórmula se mover depois, o seu binário continua citando o número velho. E ele só toca criação de conta, então perfilar um handler não relacionado nunca ia mostrar isso."  # @src=4faa0483386e
          one-change:
            # | You changed three things at once and total CU dropped nicely. Why is that
            # | still a failed optimization, in the loop's terms?
            prompt: "Você mudou três coisas de uma vez e a CU total caiu bonito. Por que isso ainda é uma otimização fracassada, nos termos do loop?"  # @src=6c69d1afb523
            # | The whole point of the measured loop is causal clarity: change exactly one
            # | thing between measurements so the delta is attributable. Three changes at
            # | once could hide a regression cancelled by a larger win, and you would ship
            # | all three blind and carry the regression forever. The fix is not a better
            # | profiler; it is going back and isolating the flags one build at a time.
            explanation: "O ponto inteiro do loop medido é clareza causal: mude exatamente uma coisa entre medições para o delta ser atribuível. Três mudanças de uma vez poderiam esconder uma regressão cancelada por uma vitória maior, e você entregaria as três no escuro e carregaria a regressão para sempre. A correção não é um profiler melhor; é voltar e isolar as flags um build por vez."  # @src=6d60f4187617
            options:                 # source order — keep it
              b:
                # | Mollusk's reading is only trustworthy when one change is compiled in,
                # | because the harness attributes CU per enabled feature flag.
                label: "A leitura do Mollusk só é confiável quando uma mudança está compilada dentro, porque a bancada de teste atribui CU por feature flag habilitada."  # @src=02d221d720bf
                # | Mollusk just totals the compute units the instruction consumed; it has
                # | no notion of feature flags and attributes nothing to them. The
                # | measurement was fine; the experiment design is what broke.
                feedback: "O Mollusk só totaliza as unidades de compute que a instrução consumiu; ele não tem noção de feature flags e não atribui nada a elas. A medição estava bem; o design do experimento é o que quebrou."  # @src=8925e8970117
              d:
                # | The delta is fine as long as you record which three changes produced it,
                # | which the loop does ask for.
                label: "O delta está bem desde que você registre quais três mudanças produziram ele, o que o loop pede sim."  # @src=8f212aeb45e2
                # | Writing the three down is bookkeeping, and bookkeeping is not
                # | attribution. The loop asks you to write down which *single* change
                # | caused a delta, because that is the only claim a two-number comparison
                # | can support. Three names beside one number still leaves you unable to
                # | say which of them was the regression.
                feedback: "Anotar as três é contabilidade, e contabilidade não é atribuição. O loop te pede para anotar qual mudança *única* causou um delta, porque essa é a única afirmação que uma comparação de dois números consegue sustentar. Três nomes do lado de um número ainda te deixa sem conseguir dizer qual delas era a regressão."  # @src=3a84fadb2b52
              a:
                # | Nothing failed: with all three changes shipping together, the net CU
                # | delta is in practice the number that reaches users.
                label: "Nada fracassou: com as três mudanças sendo entregues juntas, o delta líquido de CU é na prática o número que chega nos usuários."  # @src=574983ec221d
                # | Users do feel the net, but you now carry an unattributed change set: a
                # | regression cancelled out by two wins ships invisibly and stays forever,
                # | because you never isolated it.
                feedback: "Os usuários sentem sim o líquido, mas você agora carrega um conjunto de mudanças não atribuído: uma regressão cancelada por duas vitórias é entregue invisivelmente e fica para sempre, porque você nunca isolou ela."  # @src=73c5a4ca8bda
              c:
                # | The delta is a sum over three variables, so no single change owns it and
                # | a regression can hide inside the win.
                label: "O delta é uma soma sobre três variáveis, então nenhuma mudança única é dona dele e uma regressão consegue se esconder dentro da vitória."  # @src=025efff47191
                # | One net figure attributes to nothing. A regression covered by two wins
                # | ships invisibly and then lives there; no tool fixes that, because it's
                # | an experiment-design problem and the cure is one rebuild per variable.
                feedback: "Uma figura líquida só não atribui a nada. Uma regressão coberta por duas vitórias é entregue invisivelmente e depois mora ali; nenhuma ferramenta corrige isso, porque é um problema de design de experimento e a cura é um rebuild por variável."  # @src=4f7fb5598b0d
          range-not-digit:
            # | const-rent's saving is quoted as ~85-90 CU, not a single number. Why does
            # | the course refuse to freeze one digit here?
            prompt: "A economia do const-rent é citada como ~85-90 CU, não um número único. Por que o curso se recusa a congelar um dígito aqui?"  # @src=5a3e43a228ba
            # | Anchor's own sources give ~85 in one place and ~90 in another for the same
            # | const-rent saving, and the number can drift if the rent formula changes
            # | (SIMD-0194). Freezing one digit would be false precision, so the course
            # | prints the range with a re-verify note, the same reason it never froze the
            # | 8.8x benchmark multiplier. Read both citations before quoting either; they
            # | sit a few lines apart in a repo you already have checked out, one in
            # | `anchor-lang`'s Cargo.toml feature comment and one in the V2 changelog entry
            # | that introduced the flag.
            explanation: "As próprias fontes do Anchor dão ~85 num lugar e ~90 em outro para a mesma economia do const-rent, e o número pode divergir se a fórmula de rent mudar (SIMD-0194). Congelar um dígito seria falsa precisão, então o curso imprime a faixa com uma nota de re-verificação, a mesma razão por que ele nunca congelou o multiplicador de benchmark 8.8x. Leia as duas citações antes de citar qualquer uma; elas ficam a algumas linhas de distância num repositório que você já tem clonado, uma no comentário de feature do Cargo.toml do `anchor-lang` e uma na entrada de changelog do V2 que introduziu a flag."  # @src=ca52e7a85de3
            options:                 # source order — keep it
              c:
                # | The saving scales with the created account's byte size, so it is a range
                # | across the sizes a program can allocate.
                label: "A economia escala com o tamanho em bytes da conta criada, então ela é uma faixa ao longo dos tamanhos que um programa consegue alocar."  # @src=f34711d5dc65
                # | The rent-exempt minimum does depend on byte size, but the computation
                # | `const-rent` removes costs about the same whatever that size is, which
                # | is why the figure is quoted per account-creation CPI. The ~85 to ~90
                # | spread comes from two Anchor sources disagreeing, plus drift risk.
                feedback: "O mínimo isento de aluguel depende sim do tamanho em bytes, mas a computação que o `const-rent` remove custa mais ou menos o mesmo qualquer que seja aquele tamanho, que é por que a figura é citada por CPI de criação de conta. A diferença de ~85 a ~90 vem de duas fontes do Anchor discordando, mais o risco de divergência."  # @src=496ad70ac5ce
              a:
                # | Anchor's own sources quote it two ways, and the figure can drift if the
                # | rent formula moves.
                label: "As próprias fontes do Anchor citam ela de duas formas, e a figura pode divergir se a fórmula de rent se mover."  # @src=d0644a1a6b86
                # | Two maintainer-written places quote it differently, and the formula
                # | underneath may move besides, so a single digit printed across that would
                # | be precision the sources do not have.
                feedback: "Dois lugares escritos por mantenedores citam ela de forma diferente, e a fórmula embaixo pode se mover além disso, então um dígito único impresso em cima daquilo seria precisão que as fontes não têm."  # @src=89a8e55ed5de
              b:
                # | Mollusk's CU reading varies run to run with the fixture's account
                # | ordering, so no single value would hold.
                label: "A leitura de CU do Mollusk varia de uma rodada para outra com a ordenação de contas da fixture, então nenhum valor único valeria."  # @src=3694de5c697b
                # | CU is deterministic for a given program, input, and toolchain, so
                # | rerunning the same fixture gives you the same integer, which is what
                # | makes the whole measured loop work. The spread here is source
                # | disagreement plus drift risk, not run-to-run noise.
                feedback: "A CU é determinística para um dado programa, entrada, e toolchain, então re-rodar a mesma fixture te dá o mesmo inteiro, que é o que faz o loop medido inteiro funcionar. A diferença aqui é discordância de fontes mais risco de divergência, não ruído de uma rodada para outra."  # @src=3b9c41d3db89
              d:
                # | Each figure was measured on a different program, so neither one
                # | transfers to yours.
                label: "Cada figura foi medida num programa diferente, então nenhuma das duas transfere para o seu."  # @src=966cc68f5ed1
                # | Both numbers describe the same feature's saving on the same kind of
                # | call. One sits in the feature's own comment in anchor-lang's Cargo.toml,
                # | the other in the V2 changelog entry that introduced the flag, four lines
                # | apart in a repo you already have checked out. The spread is two
                # | maintainer-written sources disagreeing, plus the drift SIMD-0194 could
                # | cause.
                feedback: "Os dois números descrevem a economia da mesma feature no mesmo tipo de chamada. Um fica no próprio comentário da feature no Cargo.toml do anchor-lang, o outro na entrada de changelog do V2 que introduziu a flag, a quatro linhas de distância num repositório que você já tem clonado. A diferença é duas fontes escritas por mantenedores discordando, mais a divergência que a SIMD-0194 poderia causar."  # @src=fde6c8e02585
  m07-l1:
    # | What V2 kills at compile time
    title: "O que o V2 mata em tempo de compilação"  # @src=1718be062107
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | You mark two mutable Account<T> parameters in one instruction and spell the
            # | opt-out as plain `dup` (no `unsafe`), then run `anchor build` in V2. What
            # | happens?
            prompt: "Você marca dois parâmetros Account<T> mutáveis numa instrução e escreve o opt-out como `dup` simples (sem `unsafe`), e depois roda `anchor build` no V2. O que acontece?"  # @src=e1af38fd8c30
            # | In V2, opting out of duplicate-mutable protection is spelled `unsafe(dup)`;
            # | writing bare `dup` is a compile error that names the fix. The MUT_MASK
            # | bitset is computed at compile time; the duplicate check itself still runs in
            # | the dispatcher, but the compiler blocks the unsafe spelling before you ever
            # | get there.
            explanation: "No V2, optar por sair da proteção de duplicate-mutable se escreve `unsafe(dup)`; escrever `dup` puro é um erro de compilação que nomeia a correção. O bitset MUT_MASK é computado em tempo de compilação; a checagem de duplicata em si continua rodando no dispatcher, mas o compilador bloqueia a grafia unsafe antes de você chegar lá."  # @src=8489a291ceee
            options:                 # source order — keep it
              a:
                # | The program fails to compile: plain `dup` is rejected and the error
                # | tells you to write `unsafe(dup)`.
                label: "O programa falha em compilar: o `dup` simples é rejeitado e o erro te diz para escrever `unsafe(dup)`."  # @src=6ff9982ca148
                # | Mask and runtime walk are both still there. The build just never gets
                # | far enough to use either, and the diagnostic hands you the spelling,
                # | which is rather the point of demanding it.
                feedback: "A máscara e a varredura de runtime as duas continuam ali. O build só nunca chega longe o bastante para usar nenhuma das duas, e o diagnóstico te entrega a grafia, que é justamente o ponto de exigir ela."  # @src=bdd31ac431f4
              d:
                # | The build usually succeeds, because plain `dup` is accepted as an alias
                # | for the unsafe spelling.
                label: "O build em geral tem sucesso, porque o `dup` simples é aceito como um alias para a grafia unsafe."  # @src=eb188141c6d7
                # | The ugliness is the feature. If the safe-looking spelling built, you
                # | could opt out of duplicate-mutable protection by typo and never know,
                # | which is how v1 programs lost the check by accident. V2 refuses the
                # | short spelling outright so that a green build means nobody disabled this
                # | without writing the word unsafe.
                feedback: "A feiura é a feature. Se a grafia que parece segura compilasse, você poderia optar por sair da proteção de duplicate-mutable por typo e nunca saber, que é como programas do v1 perderam a checagem por acidente. O V2 recusa a grafia curta de cara para um build verde querer dizer que ninguém desligou isto sem escrever a palavra unsafe."  # @src=1a9125ced262
              c:
                # | It compiles with a warning, because MUT_MASK is computed only for
                # | `zero_copy` accounts and skips ordinary slots.
                label: "Compila com um aviso, porque o MUT_MASK é computado só para contas `zero_copy` e pula slots comuns."  # @src=49621bb6dd8b
                # | MUT_MASK is a compile-time const over every account the instruction
                # | declares, and on V2 defaults every `Account<T>` is already a Pod
                # | zero-copy view, so there is no ordinary slot for it to skip. The missing
                # | `unsafe` is a hard error, not a warning.
                feedback: "O MUT_MASK é um const de tempo de compilação sobre cada conta que a instrução declara, e nos defaults do V2 cada `Account<T>` já é uma view zero-copy Pod, então não tem slot comum para ele pular. O `unsafe` faltando é um erro duro, não um aviso."  # @src=25ca1a164691
              b:
                # | It compiles, and the duplicate-mutable check simply fires at runtime in
                # | the dispatcher, exactly as it did in v1.
                label: "Compila, e a checagem de duplicate-mutable simplesmente dispara em runtime no dispatcher, exatamente como disparava no v1."  # @src=f5e978778064
                # | Tempting because the dispatcher's runtime dup check really does still
                # | exist in V2, but you never reach it, because the bare-`dup` spelling
                # | fails the build before a binary exists.
                feedback: "Tentador porque a checagem de dup em runtime do dispatcher de fato continua existindo no V2, mas você nunca chega nela, porque a grafia de `dup` puro falha o build antes de um binário existir."  # @src=ca494442c372
          q2:
            # | You try the classic type-cosplay attack: load a Pool account's bytes as a
            # | FeeConfig in V2. Why does it no longer type-check?
            prompt: "Você tenta o ataque clássico de type cosplay: carregar os bytes de uma conta Pool como um FeeConfig no V2. Por que isso não passa mais na checagem de tipos?"  # @src=4e123f518f75
            # | V2's Account<T> is zero-copy and requires T: Pod; the bytes are cast to the
            # | declared type. Two clocks are running here, and the runtime one is what
            # | stops a smuggled account: at load, a Pool handed to an `Account<FeeConfig>`
            # | slot is still rejected by the runtime discriminator check exactly as in v1.
            # | What V2 adds is closing the byte-level escape hatch: with `Account<T>` as a
            # | Pod view there is no `try_from_slice` on a loose slice to reach for, and the
            # | deliberate `bytemuck::from_bytes::<FeeConfig>(&data[8..])` cast you would
            # | need instead is something a reviewer can grep for in one pass.
            explanation: "O Account<T> do V2 é zero-copy e exige T: Pod; os bytes são convertidos para o tipo declarado. Dois relógios estão rodando aqui, e o de runtime é o que para uma conta contrabandeada: no load, um Pool entregue para um slot `Account<FeeConfig>` continua sendo rejeitado pela checagem de discriminator em runtime exatamente como no v1. O que o V2 adiciona é fechar a saída de emergência no nível dos bytes: com o `Account<T>` como uma view Pod não tem `try_from_slice` num slice solto para recorrer, e o cast deliberado de `bytemuck::from_bytes::<FeeConfig>(&data[8..])` que você precisaria em vez disso é uma coisa que um revisor consegue grepar numa passada."  # @src=664e93e9bcae
            options:                 # source order — keep it
              b:
                # | `Account<T>` requires `T: Pod`, so the declared type fixes the layout
                # | and the types never interconvert.
                label: "O `Account<T>` exige `T: Pod`, então o tipo declarado fixa o layout e os tipos nunca se interconvertem."  # @src=92086d1bdbff
                # | At load the runtime tag check still rejects the swap, exactly as it
                # | always did. What the rewrite adds is closing the loose-slice route, so
                # | the only path left is a deliberate cast one grep away from any reviewer.
                feedback: "No load a checagem de tag em runtime continua rejeitando a troca, exatamente como ela sempre rejeitou. O que a reescrita adiciona é fechar a rota do slice solto, então o único caminho que resta é um cast deliberado a um grep de distância de qualquer revisor."  # @src=52cb56f91796
              c:
                # | `Account<T>` writes the type's name into the header and compares it
                # | against `T` on every load.
                label: "O `Account<T>` escreve o nome do tipo no header e compara ele com o `T` em cada load."  # @src=49494d8077ce
                # | This was one of the naive v1-era fixes the lesson rules out: it stores
                # | an extra field and still checks at runtime. V2 stores no type names.
                # | Discriminators remain the sha256 default, and the new guarantee is Pod
                # | typing at compile time.
                feedback: "Esta era uma das correções ingênuas da era v1 que a lição descarta: ela guarda um campo extra e ainda checa em runtime. O V2 não guarda nome de tipo nenhum. Os discriminators continuam sendo o default sha256, e a garantia nova é tipagem Pod em tempo de compilação."  # @src=a505ad451a7d
              a:
                # | V2 re-checks the discriminator on every field access, so the mismatch is
                # | caught as you read a field.
                label: "O V2 re-checa o discriminator em cada acesso a campo, então o descasamento é pego conforme você lê um campo."  # @src=0ea91e627449
                # | The block is at compile time, not a new per-field runtime check;
                # | discriminators are unchanged by default.
                feedback: "O bloqueio é em tempo de compilação, não uma checagem nova de runtime por campo; os discriminators estão inalterados por padrão."  # @src=de9b2f2361de
              d:
                # | V2 moved the discriminator check into the type system, so a mismatched
                # | account tag now fails the build instead of the load.
                label: "O V2 moveu a checagem de discriminator para dentro do sistema de tipos, então uma tag de conta descasada agora falha o build em vez do load."  # @src=bf9859b95eb4
                # | That is the overclaim this class invites. The discriminator is still a
                # | runtime check at load, and it still rejects a Pool handed to an
                # | `Account<FeeConfig>` slot exactly as v1 did. What moved to compile time
                # | is the Pod typing that closes the byte-level route around that check,
                # | not the check itself.
                feedback: "Esse é o exagero que esta classe convida. O discriminator continua sendo uma checagem de runtime no load, e ele continua rejeitando um Pool entregue para um slot `Account<FeeConfig>` exatamente como o v1 rejeitava. O que se moveu para tempo de compilação é a tipagem Pod que fecha a rota no nível dos bytes em volta daquela checagem, não a checagem em si."  # @src=bfce175130a9
          q3:
            # | You hold a typed reference to an account and try to read its fields while a
            # | `CpiHandle` for that account is still live. What does V2 do?
            prompt: "Você segura uma referência tipada para uma conta e tenta ler os campos dela enquanto um `CpiHandle` para aquela conta ainda está vivo. O que o V2 faz?"  # @src=8b16ca06b321
            # | A CpiHandle is a borrow-tracked handle; while it is alive it holds a Rust
            # | borrow that prevents typed access to the same data. The stale-after-CPI
            # | class that `.reload()` used to paper over is now a compile error.
            explanation: "Um CpiHandle é um handle com borrow rastreado; enquanto ele está vivo ele segura um borrow do Rust que impede acesso tipado aos mesmos dados. A classe de obsoleto-depois-de-CPI que o `.reload()` costumava remendar agora é um erro de compilação."  # @src=5d2a7ed18f0b
            options:                 # source order — keep it
              a:
                # | Runtime panic: V2 detects the aliasing borrow when the CPI returns and
                # | aborts before the stale read.
                label: "Panic em runtime: o V2 detecta o borrow com alias quando a CPI retorna e aborta antes da leitura obsoleta."  # @src=6d6ba3a7102f
                # | Plausible if you picture CpiHandle as a RefCell-style runtime guard like
                # | v1's account borrows. It is not: the borrow is an ordinary Rust borrow
                # | the compiler tracks, so the read is rejected at build time and no CPI
                # | ever runs.
                feedback: "Plausível se você imagina o CpiHandle como uma trava de runtime no estilo RefCell como os borrows de conta do v1. Ele não é: o borrow é um borrow comum do Rust que o compilador rastreia, então a leitura é rejeitada em tempo de build e CPI nenhuma chega a rodar."  # @src=66f03cd93012
              c:
                # | Compile error: the CpiHandle holds a Rust borrow that excludes typed
                # | data access until the handle is dropped.
                label: "Erro de compilação: o CpiHandle segura um borrow do Rust que exclui acesso tipado aos dados até o handle ser dropado."  # @src=1dd4a9514305
                # | An ordinary compile-time borrow, not a runtime cell. Nothing executes
                # | and no invocation is issued at all. A class that used to need a
                # | remembered call is simply not writable now.
                feedback: "Um borrow comum de tempo de compilação, não uma célula de runtime. Nada executa e invocação nenhuma é emitida. Uma classe que costumava precisar de uma chamada lembrada simplesmente não é escrevível agora."  # @src=4fb3405ce939
              b:
                # | It works, and as in v1 you must call `.reload()` on the account after
                # | the CPI to see the updated bytes.
                label: "Funciona, e como no v1 você tem que chamar `.reload()` na conta depois da CPI para ver os bytes atualizados."  # @src=02a2f74ea70b
                # | This is exactly the v1 muscle memory V2 retires. The stale read no
                # | longer compiles while the handle is live, and once the handle is dropped
                # | the typed view is already fresh, so there is no `.reload()` step to
                # | remember.
                feedback: "Esta é exatamente a memória muscular do v1 que o V2 aposenta. A leitura obsoleta não compila mais enquanto o handle está vivo, e depois de o handle ser dropado a view tipada já está fresca, então não tem passo de `.reload()` para lembrar."  # @src=225c774cc971
              d:
                # | It compiles: the handle is dropped when the CPI returns, and V2
                # | refreshes the typed account for you.
                label: "Compila: o handle é dropado quando a CPI retorna, e o V2 atualiza a conta tipada para você."  # @src=2497a8542f87
                # | Nothing gets refreshed on your behalf, and the read you wrote sits
                # | inside the handle's borrow window rather than after it. The class is not
                # | solved by the framework doing the reload silently; it is solved by the
                # | read not building until the handle is gone, at which point the typed
                # | view was never stale to begin with.
                feedback: "Nada é atualizado em seu nome, e a leitura que você escreveu fica dentro da janela de borrow do handle e não depois dela. A classe não é resolvida pelo framework fazendo o reload caladinho; ela é resolvida pela leitura não compilar até o handle ter ido, momento em que a view tipada nunca esteve obsoleta para começo de conversa."  # @src=d32a0f5ba4a8
          q4:
            # | A teammate concludes 'V2 is secure by default, so we can skip the audit.'
            # | Grounded in this lesson, what is the best response?
            prompt: "Um colega conclui 'o V2 é seguro por padrão, então a gente pode pular a auditoria'. Baseado nesta lição, qual é a melhor resposta?"  # @src=fa0de4a33c55
            # | V2 turns type cosplay, dup-mut, and CPI aliasing into compile errors, and
            # | leaves bump recalculation compiling but inert, a real gain. But it is an
            # | unaudited alpha, one whose own README leans the other way ('v2 is secure by
            # | default for users'), so the defaults-are-no-substitute-for-review discipline
            # | has to come from you, not the project, and whole classes (signer/owner,
            # | arithmetic, logic) survive. Compile-time wins narrow the attack surface;
            # | they do not retire the audit. Keep the ratio in view: four of the Solana
            # | Foundation's eleven taxonomy classes were re-run here, and the headline
            # | numbers from PR #4914 (94% bytecode, 8.8x compute, both revised down) are
            # | size-and-speed claims, never security ones. The second-order risk is worse
            # | than any single bug: a team that believes the compiler catches its security
            # | bugs reviews less precisely exactly where the compiler is silent, which is
            # | where the money leaves.
            explanation: "O V2 transforma type cosplay, dup-mut e aliasing de CPI em erros de compilação, e deixa o recálculo de bump compilando mas inerte, um ganho de verdade. Mas ele é um alpha não auditado, um cujo próprio README pende para o outro lado ('v2 is secure by default for users'), então a disciplina de defaults-não-são-substituto-para-revisão tem que vir de você, não do projeto, e classes inteiras (signer/owner, aritmética, lógica) sobrevivem. Ganhos de tempo de compilação estreitam a superfície de ataque; eles não aposentam a auditoria. Mantenha a razão à vista: quatro das onze classes da taxonomia da Solana Foundation foram re-rodadas aqui, e os números da manchete do PR #4914 (94% de bytecode, 8.8x de compute, os dois revisados para baixo) são afirmações de tamanho-e-velocidade, nunca de segurança. O risco de segunda ordem é pior que qualquer bug isolado: um time que acredita que o compilador pega os bugs de segurança dele revisa menos precisamente exatamente onde o compilador está calado, que é de onde o dinheiro sai."  # @src=b6f9d7c4fa9f
            options:                 # source order — keep it
              d:
                # | Agree in part: with those four classes dead, the audit can typically
                # | narrow to the arithmetic and logic bugs the compiler misses.
                label: "Concorde em parte: com aquelas quatro classes mortas, a auditoria tipicamente consegue estreitar para os bugs de aritmética e de lógica que o compilador não pega."  # @src=d6510ae307f3
                # | Narrowing is exactly the move that compounds the risk, and the
                # | arithmetic is off too: three classes are compile errors and the fourth
                # | still builds, out of eleven in the taxonomy. Signer and owner checks and
                # | account substitution are not on your shortlist and they are where
                # | escrows drain. Compile-time wins reallocate where you look; they do not
                # | license looking at less.
                feedback: "Estreitar é exatamente a jogada que compõe o risco, e a aritmética está errada também: três classes são erros de compilação e a quarta ainda compila, de onze na taxonomia. Checagens de signer e de owner e substituição de conta não estão na sua lista curta e são elas que drenam escrows. Ganhos de tempo de compilação realocam onde você olha; eles não licenciam olhar menos."  # @src=3aca9c14132f
              c:
                # | Wrong direction: V2 removes no vulnerability classes; the 8.8x figure in
                # | PR #4914 was a compute benchmark, not a security claim.
                label: "Direção errada: o V2 não remove classe de vulnerabilidade nenhuma; a cifra de 8.8x no PR #4914 era um benchmark de compute, não uma afirmação de segurança."  # @src=469c21be2ae1
                # | The 8.8x number really is a CU benchmark and should never be cited as
                # | security, which is what makes this tempting, but V2 does convert type
                # | cosplay, dup-mut, and CPI aliasing into compile errors. The point is
                # | that it does not convert all eleven classes.
                feedback: "O número de 8.8x de fato é um benchmark de CU e nunca deveria ser citado como segurança, que é o que deixa isto tentador, mas o V2 de fato converte type cosplay, dup-mut e aliasing de CPI em erros de compilação. O ponto é que ele não converte todas as onze classes."  # @src=65a9ad7039f4
              b:
                # | That is right: type cosplay, dup-mut, CPI aliasing, and bump recalc are
                # | all ruled out by the V2 defaults, so review adds little.
                label: "Está certo: type cosplay, dup-mut, aliasing de CPI e recálculo de bump são todos descartados pelos defaults do V2, então revisão adiciona pouco."  # @src=7d62d960b300
                # | Three of those are genuine compile errors and bump recalc merely
                # | re-derives the canonical bump the account stored, but missing
                # | signer/owner checks, account substitution, and arithmetic bugs all still
                # | compile and run, and the framework itself is unaudited.
                feedback: "Três desses são erros de compilação genuínos e o recálculo de bump só re-deriva o bump canônico que a conta guardou, mas checagens de signer/owner faltando, substituição de conta e bugs de aritmética todos ainda compilam e rodam, e o framework em si não é auditado."  # @src=43d91a55cee3
              a:
                # | Three of the four became compile errors and the fourth is inert, but V2
                # | is an unaudited alpha, so the audit stands.
                label: "Três dos quatro viraram erros de compilação e o quarto é inerte, mas o V2 é um alpha não auditado, então a auditoria fica de pé."  # @src=112097262282
                # | Four of eleven classes touched; the other seven compile and run exactly
                # | as before. What compounds is cultural: a compiler you trust thins review
                # | precisely where it cannot see.
                feedback: "Quatro de onze classes tocadas; as outras sete compilam e rodam exatamente como antes. O que se compõe é cultural: um compilador em que você confia afina a revisão precisamente onde ele não consegue ver."  # @src=a32bc204ecbb
  m07-l2:
    # | What still bites you (exploit then patch)
    title: "O que ainda te morde (explore e depois corrija)"  # @src=b96d31cb53a9
    blocks:
      patch-withdraw-guard:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Access control comes first: `settle_withdraw` already returns -1 when
          # | `is_authority` says no — make `is_authority` actually say no.
          0: "Controle de acesso vem primeiro: o `settle_withdraw` já retorna -1 quando o `is_authority` diz não — faça o `is_authority` de fato dizer não."  # @src=6956cf5d098c
          # | Unsigned subtraction underflows; in `checked_remaining`, `u64::checked_sub`
          # | returns None exactly when amount > balance.
          1: "Subtração sem sinal dá underflow; no `checked_remaining`, o `u64::checked_sub` retorna None exatamente quando amount > balance."  # @src=e8ce82ca738f
          # | An address is 32 bytes with no meaningful ordering: equality over ALL 32
          # | bytes, never a prefix, a single byte, or < / >. In a `const fn`, `==` on
          # | arrays is a trait call the compiler refuses — walk the bytes with a `while`
          # | loop.
          2: "Um endereço tem 32 bytes sem ordenação com significado nenhum: igualdade sobre TODOS os 32 bytes, nunca um prefixo, um byte só, ou < / >. Numa `const fn`, `==` em arrays é uma chamada de trait que o compilador recusa — percorra os bytes com um loop `while`."  # @src=8e4f9974e8a0
        tests:                      # keyed by test case id
          t1:
            # | The authority withdrawing within balance returns the new balance
            description: "A authority retirando dentro do saldo retorna o novo saldo"  # @src=36de04158d2b
          t2:
            # | A withdraw requested by a non-authority caller is rejected with -1
            description: "Um withdraw pedido por um chamador que não é a authority é rejeitado com -1"  # @src=a3a2a532afee
          t3:
            # | An over-withdraw that would underflow the balance is rejected with -2
            description: "Um over-withdraw que daria underflow no saldo é rejeitado com -2"  # @src=3982eb749058
          t4:
            # | An exact-balance withdraw by the authority returns zero
            description: "Um withdraw de saldo exato pela authority retorna zero"  # @src=36b3608a06df
          t5:
            # | A caller that sorts BELOW the authority is still not the authority: an
            # | ordering comparison passes t2 and fails here, because addresses have no
            # | order, only equality
            description: "Um chamador que ordena ABAIXO da authority continua não sendo a authority: uma comparação de ordenação passa no t2 e falha aqui, porque endereços não têm ordem, só igualdade"  # @src=30bd32d3ad45
          t6:
            # | Near-miss in the LAST byte: 31 of 32 bytes match. A gate that compares only
            # | the first byte (or any prefix) lets this address drain the vault
            description: "Quase-acerto no ÚLTIMO byte: 31 de 32 bytes casam. Uma trava que compara só o primeiro byte (ou qualquer prefixo) deixa este endereço drenar o vault"  # @src=c0e7f0d4b3b7
          t7:
            # | Near-miss in the FIRST byte, so the mirror of t6: a gate that compares only
            # | the last byte fails here. Only a full 32-byte equality passes both
            description: "Quase-acerto no PRIMEIRO byte, então o espelho do t6: uma trava que compara só o último byte falha aqui. Só uma igualdade completa de 32 bytes passa nos dois"  # @src=71fea5fecc3a
      check:                      # quiz
        questions:
          q1:
            # | You wrote `#[account(owner = expected @ MyOwnerError)] pub acct: Account<T>`
            # | expecting MyOwnerError on a bad owner, but the caller sees a different
            # | error. Why?
            prompt: "Você escreveu `#[account(owner = expected @ MyOwnerError)] pub acct: Account<T>` esperando MyOwnerError num owner errado, mas o chamador vê um erro diferente. Por quê?"  # @src=cdd22c90cd0d
            # | For Account<T>, owner and discriminator verification happens inside load,
            # | ahead of the constraint hooks, so a wrong owner short-circuits to
            # | ProgramError::IllegalOwner and your `@ MyOwnerError` never fires. If you
            # | need the custom error, take an UncheckedAccount and assert the owner
            # | explicitly. The `@ MyErr` spelling is not gone in V2; it simply cannot win a
            # | race it never enters, because the framework refuses to hand you a typed `T`
            # | it has not first verified is a `T`. Those two load-time checks are
            # | structural, not hooks, which is exactly why UncheckedAccount (no load-time
            # | owner check) is the type that lets you supply your own error.
            explanation: "Em Account<T>, a verificação de owner e de discriminator acontece dentro do carregamento, na frente dos hooks de constraint, então um owner errado dá curto-circuito para ProgramError::IllegalOwner e o seu `@ MyOwnerError` nunca dispara. Se você precisa do erro customizado, pegue um UncheckedAccount e afirme o owner explicitamente. A grafia `@ MyErr` não sumiu no V2; ela simplesmente não consegue ganhar uma corrida em que nunca entra, porque o framework se recusa a te entregar um `T` tipado que ele não verificou primeiro que é um `T`. Essas duas checagens em tempo de carregamento são estruturais, não hooks, que é exatamente por que o UncheckedAccount (sem checagem de owner em tempo de carregamento) é o tipo que te deixa fornecer o seu próprio erro."  # @src=21159d1ddc4a
            options:                 # source order — keep it
              b:
                # | `load` runs the owner and discriminator checks before any constraint
                # | hook, so `ProgramError::IllegalOwner` is returned first.
                label: "O `load` roda as checagens de owner e de discriminator antes de qualquer hook de constraint, então o `ProgramError::IllegalOwner` é retornado primeiro."  # @src=f30994bd1204
                # | Your annotation is intact. It just never enters a race it could not
                # | start, because a typed wrapper is never handed over unverified, and
                # | stripping the type leaves no gate in front at all.
                feedback: "A sua anotação está intacta. Ela só nunca entra numa corrida que não poderia começar, porque um wrapper tipado nunca é entregue sem verificação, e arrancar o tipo não deixa trava nenhuma na frente."  # @src=0a1a374d0cc8
              d:
                # | The Solana runtime rejects an account your program does not own before
                # | the instruction even starts, so in practice no hook runs.
                label: "O runtime da Solana rejeita uma conta de que o seu programa não é dono antes de a instrução sequer começar, então na prática nenhum hook roda."  # @src=ef231133f680
                # | Programs are handed accounts they do not own on every call, which is how
                # | a token account or a vault from another program ever reaches your
                # | handler at all. Nothing pre-screens ownership for you. The check that
                # | fired is Anchor's own, inside `load`, and it fired because a typed
                # | wrapper is never handed over unverified.
                feedback: "Programas recebem contas de que não são donos em toda chamada, que é como uma conta de token ou um vault de outro programa chega no seu handler, para começo de conversa. Nada pré-filtra ownership para você. A checagem que disparou é a do próprio Anchor, dentro do `load`, e ela disparou porque um wrapper tipado nunca é entregue sem verificação."  # @src=a973f5b3f1c1
              c:
                # | `Account<T>` ignores an explicit `owner` constraint, since the
                # | declaring-program owner is already implied by the typed wrapper.
                label: "O `Account<T>` ignora um constraint `owner` explícito, já que o owner do programa declarante já está implícito no wrapper tipado."  # @src=e02a40adb5e9
                # | The owner genuinely is checked, just inside `load`, ahead of your hook,
                # | which is why you get `IllegalOwner`. Put the same `owner = X @ MyErr` on
                # | an `UncheckedAccount` and the hook becomes the only owner check, so it
                # | carries your error.
                feedback: "O owner genuinamente é checado, só que dentro do `load`, na frente do seu hook, que é por que você recebe `IllegalOwner`. Ponha o mesmo `owner = X @ MyErr` num `UncheckedAccount` e o hook vira a única checagem de owner, então ele carrega o seu erro."  # @src=59226122c9e8
              a:
                # | The `@` custom-error form was removed in V2, so `address = ... @ MyErr`
                # | is now the only constraint that carries one.
                label: "A forma de erro customizado `@` foi removida no V2, então `address = ... @ MyErr` agora é o único constraint que carrega um."  # @src=1e4951ff7854
                # | The `@` form still exists in V2 and still works on `owner`; it was not
                # | narrowed to `address`. The problem is ordering: `load` rejects the
                # | account before any hook carrying your error gets to run.
                feedback: "A forma `@` continua existindo no V2 e continua funcionando em `owner`; ela não foi estreitada para `address`. O problema é a ordem: o `load` rejeita a conta antes de qualquer hook carregando o seu erro chegar a rodar."  # @src=7a4820b89350
          q2:
            # | Your escrow uses an `UncheckedAccount` for the payout destination. What must
            # | accompany it so it is not an exploit?
            prompt: "O seu escrow usa um `UncheckedAccount` para o destino do payout. O que tem que acompanhar ele para isso não ser um exploit?"  # @src=eb135be5ce0f
            # | UncheckedAccount opts out of all framework validation, so you must pair it
            # | with an explicit `address = ...`, `owner = ...`, or `constraint = ...`.
            # | Without one, an attacker substitutes their own account, the
            # | account-substitution class no compiler in any framework can catch for you.
            # | Pinning with `address = escrow.maker` is strictly stronger than `owner =
            # | ...`: owner admits any account from that program, address admits exactly the
            # | one the escrow recorded. Reach for owner only when any account from that
            # | program is genuinely acceptable.
            explanation: "UncheckedAccount opta por sair de toda validação do framework, então você tem que emparelhar ele com um `address = ...`, `owner = ...` ou `constraint = ...` explícito. Sem um deles, um atacante substitui a conta dele mesmo, a classe de substituição de conta que nenhum compilador em nenhum framework consegue pegar por você. Fixar com `address = escrow.maker` é estritamente mais forte que `owner = ...`: owner admite qualquer conta daquele programa, address admite exatamente a que o escrow registrou. Recorra a owner só quando qualquer conta daquele programa for genuinamente aceitável."  # @src=212014ed8a75
            options:                 # source order — keep it
              a:
                # | Nothing: in V2 the `/// CHECK:` doc comment the compiler demands is what
                # | validates an `UncheckedAccount`.
                label: "Nada: no V2 o doc comment `/// CHECK:` que o compilador exige é o que valida um `UncheckedAccount`."  # @src=aeae73bc1572
                # | The `/// CHECK:` comment is a lint requirement that forces you to
                # | document the risk in writing; nothing reads it at runtime.
                # | `UncheckedAccount` still performs no owner, discriminator, or identity
                # | check.
                feedback: "O comentário `/// CHECK:` é uma exigência de lint que te força a documentar o risco por escrito; nada lê ele em runtime. O `UncheckedAccount` continua não fazendo checagem nenhuma de owner, de discriminator ou de identidade."  # @src=d6f4a94fe02a
              b:
                # | Only a `mut` marker, so the runtime marks the account writable and
                # | rejects a substituted destination.
                label: "Só um marcador `mut`, para o runtime marcar a conta como gravável e rejeitar um destino substituído."  # @src=97bd3e04a348
                # | `mut` is about writability, not identity. The runtime happily writes to
                # | whichever account the caller passed, so an attacker still substitutes
                # | their own wallet and collects the rent from `close = maker`.
                feedback: "`mut` é sobre permissão de escrita, não identidade. O runtime felizmente escreve em qualquer conta que o chamador passar, então um atacante ainda substitui a carteira dele mesmo e recolhe o rent do `close = maker`."  # @src=e3218af5f8ca
              c:
                # | An explicit `address`, `owner`, or `constraint` check that pins which
                # | account is allowed here.
                label: "Uma checagem explícita de `address`, `owner` ou `constraint` que fixa qual conta tem permissão aqui."  # @src=31dda88c91eb
                # | An exact key beats a program id, which admits every account that program
                # | happens to own, and the broader form is only right where any of them
                # | would genuinely do in that slot.
                feedback: "Uma chave exata ganha de um id de programa, que admite toda conta de que aquele programa por acaso é dono, e a forma mais larga só está certa onde qualquer uma delas genuinamente serviria naquele slot."  # @src=3cdbfb06b86b
              d:
                # | Type it as `Account<T>` instead, so the framework's own owner and
                # | discriminator checks pin the account.
                label: "Tipe ele como `Account<T>` em vez disso, para as próprias checagens de owner e de discriminator do framework fixarem a conta."  # @src=c308752b7399
                # | A typed wrapper pins the shape and the owning program, never the
                # | identity, and identity is the whole class: the attacker's account has
                # | the same type and the same owner as the one you meant. It is also the
                # | wrong move for this field, since a payout destination or a vault from
                # | another program cannot load as a typed account inside yours at all.
                feedback: "Um wrapper tipado fixa o formato e o programa que é dono, nunca a identidade, e identidade é a classe inteira: a conta do atacante tem o mesmo tipo e o mesmo owner que a que você queria dizer. Também é a jogada errada para este campo, já que um destino de payout ou um vault de outro programa não consegue carregar como uma conta tipada dentro do seu, de jeito nenhum."  # @src=2c4a8600a7d0
          q3:
            # | A teammate assumes V2's `init_if_needed` is still feature-gated and
            # | inherently unsafe. What is actually true?
            prompt: "Um colega de time supõe que o `init_if_needed` do V2 ainda tem gate de feature e é inerentemente inseguro. O que é de fato verdade?"  # @src=4941486b3286
            # | V2 makes init_if_needed ungated and adds reuse-validation over space, owner,
            # | and discriminator. That closes the crudest reinit tricks, but the framework
            # | cannot judge whether re-initializing THIS account is semantically valid, so
            # | a reinit-over-live-state bug survives, so guard it. Concretely: the
            # | release's six feature flags do not include `init-if-needed`, and such
            # | accounts have been folded into the duplicate-mutable check since #4239, yet
            # | you still must check a stored flag or a nonzero field before letting the
            # | `init` branch run and reject when the account is already live.
            explanation: "O V2 deixa o init_if_needed sem gate e adiciona validação de reuso sobre space, owner e discriminator. Isso fecha os truques mais crus de reinit, mas o framework não consegue julgar se reinicializar ESTA conta é semanticamente válido, então um bug de reinit-sobre-estado-vivo sobrevive, então trave ele. Concretamente: as seis feature flags do release não incluem `init-if-needed`, e contas assim foram dobradas para dentro da checagem de duplicate-mutable desde o #4239, e mesmo assim você continua tendo que checar uma flag guardada ou um campo diferente de zero antes de deixar o branch `init` rodar e rejeitar quando a conta já estiver viva."  # @src=57816081f7c2
            options:                 # source order — keep it
              a:
                # | V2 ships it ungated with reuse-validation, but a re-init over live state
                # | is still your bug to guard.
                label: "O V2 entrega ele sem gate com validação de reuso, mas um re-init sobre estado vivo continua sendo o seu bug para travar."  # @src=e21aa7822612
                # | The structural side is solid and has been folded into the duplicate
                # | check for several releases now. Semantics are what is left over, and no
                # | framework can supply them; only your program knows that credit is
                # | somebody's money.
                feedback: "O lado estrutural é sólido e já foi dobrado para dentro da checagem de duplicata há vários releases. A semântica é o que sobra, e nenhum framework consegue fornecer ela; só o seu programa sabe que aquele credit é o dinheiro de alguém."  # @src=f29f9e33736b
              b:
                # | It is gated behind an `init-if-needed` feature flag exactly as in v1.
                label: "Ele tem gate atrás de uma feature flag `init-if-needed` exatamente como no v1."  # @src=ac8336206cbe
                # | V2 ships six feature flags, `alloc`, `guardrails`, `idl-build`,
                # | `compat`, `const-rent` and `testing`, and `init-if-needed` is not among
                # | them. It is ungated, and the residual risk is a re-initialization logic
                # | bug, not flipping a flag.
                feedback: "O V2 entrega seis feature flags, `alloc`, `guardrails`, `idl-build`, `compat`, `const-rent` e `testing`, e `init-if-needed` não está entre elas. Ele está sem gate, e o risco residual é um bug de lógica de reinicialização, não virar uma flag."  # @src=71aef39f74f7
              c:
                # | Reuse-validation covers space, owner, and discriminator, so reinit is
                # | impossible.
                label: "A validação de reuso cobre space, owner e discriminator, então reinit é impossível."  # @src=56f12ad62c14
                # | Those three checks are structural and they do close the crudest reinit
                # | tricks, but they cannot judge business intent: overwriting a funded
                # | escrow back to zeros passes space, owner, and discriminator alike.
                feedback: "Aquelas três checagens são estruturais e elas de fato fecham os truques mais crus de reinit, mas elas não conseguem julgar intenção de negócio: sobrescrever um escrow financiado de volta para zeros passa em space, owner e discriminator do mesmo jeito."  # @src=6335fc6936d2
              d:
                # | V2 ships it ungated because the duplicate-mutable check now covers
                # | reinit, so no extra guard is needed.
                label: "O V2 entrega ele sem gate porque a checagem de duplicate-mutable agora cobre reinit, então nenhuma trava extra é necessária."  # @src=963c54ea63ee
                # | Those accounts really have been folded into the duplicate-mutable check
                # | since #4239, and that is a different question from this one.
                # | Duplicate-mutable catches one account arriving in two writable slots.
                # | Nothing in it can tell that the account you are about to re-initialize
                # | is holding somebody's money.
                feedback: "Aquelas contas realmente foram dobradas para dentro da checagem de duplicate-mutable desde o #4239, e essa é uma pergunta diferente desta. Duplicate-mutable pega uma conta chegando em dois slots graváveis. Nada nela consegue dizer que a conta que você está prestes a reinicializar está guardando o dinheiro de alguém."  # @src=af3611a5de8a
          q4:
            # | You patched the escrow withdraw with `balance - amount` plus an authority
            # | equality check, but a fuzz seed where amount > balance still misbehaves. The
            # | real fix is:
            prompt: "Você corrigiu o withdraw do escrow com `balance - amount` mais uma checagem de igualdade de authority, mas uma seed de fuzz onde amount > balance ainda se comporta mal. A correção de verdade é:"  # @src=b700565a3ed7
            # | Access control answers 'who,' but the over-withdraw is an arithmetic bug:
            # | unsigned subtraction underflows (wraps in release, panics in debug).
            # | checked_sub returns None on underflow so you can reject the withdrawal, and
            # | the coding challenge for this lesson is exactly this patch plus the
            # | authority check. Note that the only correct outcome is a rejection, not a
            # | wrap and not a panic: Anchor's generated workspace sets `overflow-checks =
            # | true` on the release profile, so an untouched scaffold panics rather than
            # | wraps, but that is one Cargo edit away, and a guard that holds only because
            # | of a profile setting is not a guard.
            explanation: "Controle de acesso responde 'quem,' mas o over-withdraw é um bug aritmético: subtração sem sinal dá underflow (dá wrap em release, dá panic em debug). checked_sub retorna None no underflow para você poder rejeitar o withdrawal, e o challenge de código desta lição é exatamente este patch mais a checagem de authority. Note que o único resultado correto é uma rejeição, não um wrap e não um panic: o workspace gerado pelo Anchor põe `overflow-checks = true` no profile de release, então um scaffold intocado dá panic em vez de dar wrap, mas isso está a uma edição de Cargo de distância, e uma trava que se mantém só por causa de uma configuração de profile não é uma trava."  # @src=f35f898953f1
            options:                 # source order — keep it
              b:
                # | Use `checked_sub` and turn the `None` case into an error so the
                # | over-withdraw is rejected.
                label: "Use `checked_sub` e transforme o caso `None` num erro para o over-withdraw ser rejeitado."  # @src=74d79a01be15
                # | Rejection is the only acceptable outcome, and a panic only looks safer
                # | than a wrap; today's scaffold panics, but that's one Cargo line from
                # | wrapping. A profile setting was never the guard.
                feedback: "Rejeição é o único resultado aceitável, e um panic só parece mais seguro que um wrap; o scaffold de hoje dá panic, mas isso está a uma linha de Cargo de dar wrap. Uma configuração de profile nunca foi a trava."  # @src=4a1cc537cb48
              d:
                # | Use `saturating_sub` so the balance floors at zero instead of wrapping
                # | below it.
                label: "Use `saturating_sub` para o saldo parar em zero em vez de dar wrap abaixo dele."  # @src=70429f03b8ee
                # | It stops the wrap and it still settles the withdraw. The vault hands
                # | over more than the ledger said it had, then records a balance of zero,
                # | and nothing anywhere returns an error. Rejection is the only correct
                # | outcome here, which is what makes `checked_sub` plus a real error the
                # | fix rather than any arithmetic that quietly succeeds.
                feedback: "Ele para o wrap e ele continua acertando o withdraw. O vault entrega mais do que o livro-razão dizia que ele tinha, depois registra um saldo de zero, e nada em lugar nenhum retorna um erro. Rejeição é o único resultado correto aqui, que é o que faz `checked_sub` mais um erro de verdade ser a correção em vez de qualquer aritmética que tem sucesso caladamente."  # @src=9046621ce6df
              a:
                # | Add a second required `Signer` to `Withdraw` so no single caller moves
                # | funds out alone.
                label: "Adicione um segundo `Signer` obrigatório ao `Withdraw` para nenhum chamador único mover fundos para fora sozinho."  # @src=f004faaa4573
                # | Multisig is more access control, and you already pinned the caller with
                # | the authority check. The failing seed is arithmetic: a perfectly
                # | authorized player asking for more than the vault holds.
                feedback: "Multisig é mais controle de acesso, e você já fixou o chamador com a checagem de authority. A seed que falha é aritmética: um player perfeitamente autorizado pedindo mais do que o vault guarda."  # @src=1f6723e40343
              c:
                # | Widen the `balance` field to `u128` in the Pod account so the
                # | subtraction has enough headroom.
                label: "Alargue o campo `balance` para `u128` na conta Pod para a subtração ter folga suficiente."  # @src=6ff3f64222ac
                # | Headroom guards overflow, not underflow: every unsigned type wraps below
                # | zero, so `u128` produces a colossal bogus balance exactly as `u64` does.
                # | Only a checked operation rejects the case.
                feedback: "Folga trava overflow, não underflow: todo tipo sem sinal dá wrap abaixo de zero, então `u128` produz um saldo falso colossal exatamente como `u64` produz. Só uma operação checada rejeita o caso."  # @src=d0e5f2963af1
  m07-l3:
    # | The audit checklist as a lab; fuzz as the assessment
    title: "A checklist de auditoria como um lab; o fuzz como a avaliação"  # @src=0135e8a534d1
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | After hours of clean runs, `anchor fuzz` reports a crash on your swap. In
            # | this lesson's framing, what does that mean?
            prompt: "Depois de horas de rodadas limpas, o `anchor fuzz` reporta um crash no seu swap. No enquadramento desta lição, o que isso quer dizer?"  # @src=abe21fc5dba6
            # | In this course, a green fuzz case = you broke it: anchor fuzz (Crucible,
            # | LibAFL/LiteSVM with sBPF edge coverage) surfaced an input that violates an
            # | invariant. Replay the crash artifact, fix the bug, and re-fuzz: a crash is a
            # | success of the process. The order is load-bearing: crash, replay, patch,
            # | re-fuzz. Patch first and you throw away the artifact that proved the bug was
            # | real and deterministic.
            explanation: "Neste curso, um caso de fuzz verde = você quebrou: o anchor fuzz (Crucible, LibAFL/LiteSVM com cobertura de arestas sBPF) trouxe à tona uma entrada que viola um invariante. Dê replay no artefato de crash, conserte o bug, e re-fuzze: um crash é um sucesso do processo. A ordem é estrutural: crash, replay, patch, re-fuzz. Corrija primeiro e você joga fora o artefato que comprovou que o bug era real e determinístico."  # @src=ebba094a96e0
            options:                 # source order — keep it
              d:
                # | The chain reached a state your setup did not intend, so the fixture
                # | usually needs a reseed and a re-run.
                label: "A cadeia alcançou um estado que o seu setup não pretendia, então a fixture normalmente precisa de uma re-semeadura e de uma nova rodada."  # @src=1b558652c41c
                # | A state the fuzzer chained its way into out of otherwise-valid calls is
                # | a reachable state, and reachable is the only bar that matters: the
                # | attacker gets the same calls you gave the harness. Deep states are what
                # | `--stateful` exists to produce, not a fixture defect to reseed away.
                feedback: "Um estado no qual o fuzzer entrou encadeando chamadas por outro lado válidas é um estado alcançável, e alcançável é o único critério que importa: o atacante recebe as mesmas chamadas que você deu para a bancada de teste. Estados profundos são o que o `--stateful` existe para produzir, não um defeito de fixture que se resolve re-semeando."  # @src=0e60610c6eb7
              c:
                # | You broke it: the fuzzer found a concrete input for which your
                # | invariants do not hold.
                label: "Você quebrou: o fuzzer achou uma entrada concreta para a qual os seus invariantes não valem."  # @src=680e6d0d65d5
                # | Order matters as much as the finding: keep the artifact, replay it, and
                # | patch after. Go the other way and you have thrown out the one thing
                # | proving the input was real and repeatable.
                feedback: "A ordem importa tanto quanto o achado: fique com o artefato, dê replay nele, e corrija depois. Vá pelo outro caminho e você jogou fora a única coisa que comprova que a entrada era real e repetível."  # @src=00c4edb6916d
              b:
                # | sBPF edge coverage was still climbing, so the crash is a false positive
                # | from a half-explored branch.
                label: "A cobertura de arestas sBPF ainda estava subindo, então o crash é um falso positivo de um branch meio explorado."  # @src=a3df9a0887c5
                # | A crash artifact is a concrete failing input sequence you can replay;
                # | low coverage means you have not explored enough of the program yet, not
                # | that the crash you already have is fake.
                feedback: "Um artefato de crash é uma sequência de entradas concreta que falha e na qual você consegue dar replay; cobertura baixa quer dizer que você ainda não explorou o programa o bastante, não que o crash que você já tem é falso."  # @src=8d5c6bc55477
              a:
                # | Crucible's LibAFL mutator produced a malformed input; re-run the
                # | campaign until it comes back clean.
                label: "O mutador LibAFL do Crucible produziu uma entrada malformada; rode a campanha de novo até ela voltar limpa."  # @src=aba3917d52bf
                # | Crucible saves the failing sequence as a crash artifact and replays it
                # | deterministically with `--replay`, so a reproducible crash is a finding,
                # | not mutator noise, and that is the entire point of running it.
                feedback: "O Crucible salva a sequência que falha como um artefato de crash e dá replay nela de forma determinística com `--replay`, então um crash reproduzível é um achado, não ruído do mutador, e é esse o ponto inteiro de rodar ele."  # @src=22339c9cb34e
          q2:
            # | A teammate on an Anchor master build runs `anchor fuzz`. Which tool actually
            # | runs under the hood?
            prompt: "Um colega de time num build master do Anchor roda o `anchor fuzz`. Qual ferramenta de fato roda por baixo do capô?"  # @src=36faf32d554c
            # | anchor fuzz is Crucible (crucible-fuzz-cli), embedded in the CLI, using a
            # | LibAFL/LiteSVM backend with sBPF edge coverage. Trident (Ackee) is a
            # | one-paragraph alternative that has not cut a stable release since 0.12.0
            # | (2025-11-27) and is still on 0.13.0 release candidates; it is not the
            # | default. Checked 2026-09-07: it is the V1 line's CLI, released as anchor-cli
            # | 1.2.0 on 2026-09-04, that pins `crucible-fuzz-cli = "0.2.1"` and dispatches
            # | `Command::Fuzz` into it, while the 2.0.0-rc.1 CLI ships `anchor coverage`
            # | and has no `fuzz` subcommand at all.
            explanation: "o anchor fuzz é o Crucible (crucible-fuzz-cli), embutido na CLI, usando um backend LibAFL/LiteSVM com cobertura de arestas sBPF. O Trident (Ackee) é uma alternativa de um parágrafo que não corta um release stable desde o 0.12.0 (2025-11-27) e continua em release candidates do 0.13.0; ele não é o default. Checado em 2026-09-07: é a CLI da linha V1, lançada como anchor-cli 1.2.0 em 2026-09-04, que fixa `crucible-fuzz-cli = \"0.2.1\"` e despacha `Command::Fuzz` para lá, enquanto a CLI 2.0.0-rc.1 entrega `anchor coverage` e não tem subcomando `fuzz` nenhum."  # @src=5e46a3c64b07
            options:                 # source order — keep it
              c:
                # | cargo-fuzz with libFuzzer, over a native (non-sBPF) build.
                label: "cargo-fuzz com libFuzzer, sobre um build nativo (não-sBPF)."  # @src=d7260c035360
                # | anchor fuzz executes the compiled `.so` inside LiteSVM and traces sBPF
                # | edges; cargo-fuzz/libFuzzer would instrument a native host build, which
                # | is not the bytecode that runs on-chain.
                feedback: "o anchor fuzz executa o `.so` compilado dentro do LiteSVM e rastreia arestas sBPF; o cargo-fuzz/libFuzzer instrumentaria um build nativo de host, que não é o bytecode que roda on-chain."  # @src=1ef1a6ab69d8
              b:
                # | Trident (Ackee), wired in as the default `fuzz` backend.
                label: "Trident (Ackee), ligado como o backend `fuzz` default."  # @src=31de3d4cf7bf
                # | Trident is a real, maintained alternative, but it is not the built-in
                # | path: its last stable is 0.12.0 from 2025-11-27, with the 0.13.0 line
                # | still on release candidates (rc.4, 2026-05-14), and Anchor wired
                # | Crucible into the CLI instead.
                feedback: "O Trident é uma alternativa real e mantida, mas ele não é o caminho embutido: o último stable dele é o 0.12.0 de 2025-11-27, com a linha 0.13.0 ainda em release candidates (rc.4, 2026-05-14), e o Anchor ligou o Crucible na CLI em vez dele."  # @src=7fc987bd48ed
              e:
                # | A LibAFL engine driving a real solana-test-validator, for on-chain
                # | runtime fidelity.
                label: "Um motor LibAFL dirigindo um solana-test-validator de verdade, para fidelidade de runtime on-chain."  # @src=76f42457976c
                # | LibAFL is right and the runtime under it is not. Crucible drives LiteSVM
                # | in process, which is what makes a campaign of millions of iterations
                # | affordable and what lets it clone and keep whole program states in a
                # | pool. A real validator per iteration would cost more than the search is
                # | worth.
                feedback: "O LibAFL está certo e o runtime embaixo dele não está. O Crucible dirige o LiteSVM em processo, que é o que torna uma campanha de milhões de iterações acessível e o que deixa ele clonar e manter estados inteiros de programa num pool. Um validador de verdade por iteração custaria mais do que a busca vale."  # @src=3b2559b27e69
              a:
                # | Crucible (`crucible-fuzz-cli`), a LibAFL engine driving a LiteSVM
                # | runtime.
                label: "Crucible (`crucible-fuzz-cli`), um motor LibAFL dirigindo um runtime LiteSVM."  # @src=779b1b25b834
                # | Verified 2026-08-22: that subcommand lives on master, which pins the
                # | crate at 0.2.1; the RC branch's CLI has no fuzz command at all.
                feedback: "Verificado em 2026-08-22: aquele subcomando mora no master, que fixa o crate no 0.2.1; a CLI do branch do RC não tem comando fuzz nenhum."  # @src=e09a082d1cf0
              d:
                # | Anchor's own fuzz engine, added to the CLI beside `anchor coverage` and
                # | `anchor debugger`.
                label: "O motor de fuzz do próprio Anchor, acrescentado à CLI ao lado do `anchor coverage` e do `anchor debugger`."  # @src=6ad4d75d1c05
                # | The subcommand is Anchor's; the engine underneath is not. Crucible is
                # | built by Asymmetric Research and consumed as `crucible-fuzz-cli`, and
                # | the two CLI lines make the split visible: the V1 line's 1.2.0 pins
                # | Crucible and dispatches Fuzz into it, while the 2.0.0-rc.1 CLI is the
                # | one that ships `anchor coverage` and `anchor debugger` and has no fuzz
                # | subcommand at all.
                feedback: "O subcomando é do Anchor; o motor embaixo não é. O Crucible é construído pela Asymmetric Research e consumido como `crucible-fuzz-cli`, e as duas linhas de CLI deixam a divisão visível: o 1.2.0 da linha V1 fixa o Crucible e despacha Fuzz para lá, enquanto a CLI 2.0.0-rc.1 é a que entrega `anchor coverage` e `anchor debugger` e não tem subcomando fuzz nenhum."  # @src=7ba69644bc9e
          q3:
            # | Your audit checklist passes and fuzzing is clean. A stakeholder asks 'so it
            # | is proven secure?' What is the grounded answer?
            prompt: "A sua checklist de auditoria passa e o fuzzing está limpo. Um stakeholder pergunta 'então está comprovadamente seguro?' Qual é a resposta fundamentada?"  # @src=f191277f0d32
            # | Fuzzing found 4 correctness bugs in Anchor's OWN framework, which also
            # | carries Miri witnesses and Kani configs, and that record, not any hedging
            # | line in the project's docs (there is none; the README claims 'secure by
            # | default'), is why this course insists the defaults are no substitute for
            # | review. Testing and audit raise confidence; they never prove the absence of
            # | bugs. Of that toolchain only Miri (undefined behavior in unsafe code) and
            # | Kani (bounded model checking) make proof-shaped claims at all, and only
            # | about the narrow properties they model.
            explanation: "Fuzzing achou 4 bugs de corretude no framework do PRÓPRIO Anchor, que também carrega witnesses de Miri e configs de Kani, e é esse registro, não alguma linha de ressalva nos docs do projeto (não existe nenhuma; o README afirma 'secure by default'), que é a razão de este curso insistir que os defaults não são substituto para revisão. Testes e auditoria elevam a confiança; eles nunca comprovam a ausência de bugs. Daquele toolchain, só o Miri (comportamento indefinido em código unsafe) e o Kani (verificação de modelos limitada) fazem afirmações em formato de prova, e só sobre as propriedades estreitas que eles modelam."  # @src=09e78e062a62
            options:                 # source order — keep it
              d:
                # | Proven for the invariants you wrote, since a stateful run covers the
                # | reachable state space.
                label: "Comprovado para os invariantes que você escreveu, já que uma rodada stateful cobre o espaço de estados alcançável."  # @src=d02c8811ca01
                # | Stateful fuzzing reaches deeper than stateless, and reaching deeper is
                # | not the same as reaching everything: it keeps a coverage-keyed pool and
                # | grows chains toward whatever looks new, which narrows the gap without
                # | closing it. There is no run length that turns an average-case clean into
                # | a worst-case safe, for the invariants you wrote or any others.
                feedback: "Fuzzing stateful alcança mais fundo que stateless, e alcançar mais fundo não é o mesmo que alcançar tudo: ele mantém um pool chaveado por cobertura e cresce cadeias na direção do que parecer novo, o que estreita a lacuna sem fechar ela. Não existe duração de rodada que transforme um limpo de caso médio num seguro de pior caso, nem para os invariantes que você escreveu nem para nenhum outro."  # @src=ec2a7cf1f6e3
              a:
                # | Yes: a clean stateful fuzz run plus a fully green checklist is a proof
                # | of correctness.
                label: "Sim: uma rodada limpa de fuzz stateful mais uma checklist totalmente verde é uma prova de corretude."  # @src=de25f1911eaa
                # | A clean run is an average-case statement over the inputs and sequences
                # | the fuzzer happened to explore in the time you gave it; the bug that
                # | ships is usually a worst-case corner the search never reached.
                feedback: "Uma rodada limpa é uma afirmação de caso médio sobre as entradas e sequências que o fuzzer por acaso explorou no tempo que você deu a ele; o bug que é entregue normalmente é um canto de pior caso que a busca nunca alcançou."  # @src=1b30e967dc5b
              c:
                # | Yes, once you also run Trident, whose Ackee harness adds proof-grade
                # | coverage of the state space.
                label: "Sim, desde que você também rode o Trident, cuja bancada de teste da Ackee acrescenta cobertura de nível de prova do espaço de estados."  # @src=2b942e0e59cc
                # | No fuzzer is proof-grade. Trident is coverage-guided testing exactly
                # | like Crucible, it is not even the built-in path, and running a second
                # | fuzzer would not turn testing into proof.
                feedback: "Nenhum fuzzer é de nível de prova. O Trident é teste guiado por cobertura exatamente como o Crucible, ele nem é o caminho embutido, e rodar um segundo fuzzer não transformaria teste em prova."  # @src=0596f1bd534a
              b:
                # | No: a clean run means 'not found yet', confidence and never proof.
                label: "Não: uma rodada limpa quer dizer 'ainda não achado', confiança e nunca prova."  # @src=1e59a8122bf3
                # | The claim a clean campaign supports is average-case, over whatever the
                # | search reached in the time you gave it, and nothing more. Only the model
                # | checkers in that toolchain make proof-shaped claims, and only over
                # | narrow properties.
                feedback: "A afirmação que uma campanha limpa sustenta é de caso médio, sobre o que quer que a busca tenha alcançado no tempo que você deu a ela, e nada mais. Só os verificadores de modelos daquele toolchain fazem afirmações em formato de prova, e só sobre propriedades estreitas."  # @src=c9c3bb6f04ca
          q4:
            # | You want the fuzzer to explore state that only appears after several
            # | instructions run in sequence. Which run mode fits?
            prompt: "Você quer que o fuzzer explore estado que só aparece depois de várias instruções rodarem em sequência. Qual modo de rodada serve?"  # @src=472397bd4e5d
            # | anchor fuzz run ... --stateful chains instructions so the fuzzer can reach
            # | states that only exist after a sequence of calls, the ones a single-shot run
            # | never sees. Coverage (LCOV) is a separate readout, not the mode.
            # | Mechanically: stateful keeps a coverage-indexed pool of live program states
            # | (`--pool-size`, default 256,000) and applies one mutated action per
            # | iteration to a state drawn from that pool, growing chains to `--max-depth`
            # | (default 15), while the stateless default clones the post-setup snapshot,
            # | runs a mutated sequence up to `--max-actions` (default 8), and discards it.
            explanation: "anchor fuzz run ... --stateful encadeia instruções para que o fuzzer consiga alcançar estados que só existem depois de uma sequência de chamadas, os que uma rodada de tiro único nunca vê. Cobertura (LCOV) é uma leitura separada, não o modo. Mecanicamente: stateful mantém um pool indexado por cobertura de estados vivos do programa (`--pool-size`, default 256,000) e aplica uma ação mutada por iteração a um estado tirado daquele pool, crescendo as cadeias até `--max-depth` (default 15), enquanto o default stateless clona o snapshot pós-setup, roda uma sequência mutada até `--max-actions` (default 8), e descarta ele."  # @src=4698734beb76
            options:                 # source order — keep it
              a:
                # | The stateless default is enough, since depth accrues across runs that
                # | restart from setup.
                label: "O default stateless basta, já que profundidade se acumula ao longo de rodadas que recomeçam do setup."  # @src=29a2fb4dcc28
                # | Stateless clones the post-setup snapshot every iteration and throws the
                # | world away afterwards, so nothing accrues: every attempt re-pays for the
                # | first steps and stops at `--max-actions` (default 8).
                feedback: "Stateless clona o snapshot pós-setup a cada iteração e depois joga o mundo fora, então nada se acumula: cada tentativa re-paga os primeiros passos e para no `--max-actions` (default 8)."  # @src=0e9094471a17
              c:
                # | `anchor fuzz run` with `--stateful`, so mutated actions extend live
                # | states instead of restarting.
                label: "O `anchor fuzz run` com `--stateful`, para que ações mutadas estendam estados vivos em vez de recomeçar."  # @src=b60fa695c4f6
                # | It keeps a coverage-keyed pool of live states and applies one mutated
                # | action to a state drawn out of it, so chains deepen instead of
                # | resetting. Coverage is a readout; it was never a mode.
                feedback: "Ele mantém um pool de estados vivos chaveado por cobertura e aplica uma ação mutada a um estado tirado dele, então as cadeias aprofundam em vez de resetar. Cobertura é uma leitura; ela nunca foi um modo."  # @src=7f953174e1ba
              d:
                # | `anchor fuzz run` with a larger `--pool-size`, since the pool size is
                # | what deepens the chains.
                label: "O `anchor fuzz run` com um `--pool-size` maior, já que o tamanho do pool é o que aprofunda as cadeias."  # @src=16801b253bb6
                # | `--pool-size` describes the pool of live states that only exists in
                # | stateful mode, and it defaults to 256,000 already. Without the mode flag
                # | there is no pool to enlarge, and even inside it the knob that governs
                # | chain length is `--max-depth`. The mode is the decision; the sizes are
                # | tuning.
                feedback: "O `--pool-size` descreve o pool de estados vivos que só existe em modo stateful, e ele já é 256,000 por padrão. Sem a flag de modo não existe pool para aumentar, e mesmo dentro dele o botão que governa o comprimento da cadeia é o `--max-depth`. O modo é a decisão; os tamanhos são ajuste fino."  # @src=7e2354a8858f
              b:
                # | `anchor coverage`, since its LCOV export is what steers the fuzzer into
                # | deeper program states.
                label: "O `anchor coverage`, já que a exportação LCOV dele é o que direciona o fuzzer para estados mais profundos do programa."  # @src=25b9c461f25b
                # | anchor coverage is a readout over `anchor test` traces, and fuzz
                # | coverage comes from `run --coverage`. Either way coverage is the map,
                # | not the vehicle; `--stateful` is what actually gets you there.
                feedback: "o anchor coverage é uma leitura sobre os traces do `anchor test`, e a cobertura de fuzz vem do `run --coverage`. De qualquer jeito a cobertura é o mapa, não o veículo; o `--stateful` é o que de fato te leva lá."  # @src=ccfb2204725f
  m08-l1:
    # | Ship a client: the IDL, Program Metadata, and a Codama/kit client
    title: "Entregue um cliente: o IDL, o Program Metadata, e um cliente Codama/kit"  # @src=cb86eb39a49a
    blocks:
      wire-kit-swap-client:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The kit major comes from splPeer ('^7.0.0' -> 7), never from kitLatest.
          0: "O major do kit vem do splPeer ('^7.0.0' -> 7), nunca do kitLatest."  # @src=b8f8e1f857ac
          # | Don't rebuild the instruction — call the provided swapInstruction(owner,
          # | amountIn, minOut).
          1: "Não reconstrua a instrução — chame o swapInstruction(owner, amountIn, minOut) fornecido."  # @src=be1fed27e83e
        tests:                      # keyed by test case id
          t1:
            # | Subgoal 1: pin kit to the @solana-program peer major (^7.0.0 -> 7), not the
            # | latest kit (8.0.0)
            description: "Subobjetivo 1: fixe o kit no major de peer do @solana-program (^7.0.0 -> 7), não no kit latest (8.0.0)"  # @src=7aeaf16f9468
          t2:
            # | Subgoal 1 (robust): the pin follows splPeer even when a newer kit exists
            description: "Subobjetivo 1 (robusto): o pin segue o splPeer mesmo quando existe um kit mais novo"  # @src=e22e41e069b0
          t3:
            # | Subgoal 2: the fee payer is the owner
            description: "Subobjetivo 2: quem paga a taxa é o owner"  # @src=369a09fefa83
          t4:
            # | Subgoal 3: the transaction lifetime is the recent blockhash
            description: "Subobjetivo 3: o lifetime da transação é o blockhash recente"  # @src=9edef8518f59
          t5:
            # | Subgoal 4: exactly one instruction, the generated swap, with the owner
            # | signing first
            description: "Subobjetivo 4: exatamente uma instrução, o swap gerado, com o owner assinando primeiro"  # @src=b4d5975bc9fd
          t6:
            # | Subgoal 4: the swap instruction carries both amountIn and the slippage floor
            # | minOut
            description: "Subobjetivo 4: a instrução de swap carrega tanto o amountIn quanto o piso de slippage minOut"  # @src=ee1e2a188dbd
          t7:
            # | Subgoal 4 (no hand-rolling): the instruction is the generated builder's —
            # | swap program id, four accounts, both vaults, the token program
            description: "Subobjetivo 4 (sem fazer na mão): a instrução é a do builder gerado — id de programa do swap, quatro contas, os dois vaults, o token program"  # @src=ef8695a786ee
      check:                      # quiz
        questions:
          m08-l1-q1:
            # | You just generated the swap's kit client. Your package.json already has
            # | @solana-program/token@0.15.0 (which peers on ^7.0.0), and you're about to
            # | add @solana/kit. What do you pin?
            prompt: "Você acabou de gerar o cliente kit do swap. O seu package.json já tem o @solana-program/token@0.15.0 (que faz peer no ^7.0.0), e você está a ponto de adicionar o @solana/kit. O que você fixa?"  # @src=bc7dda290d9f
            # | The durable rule (CF4): pin @solana/kit to the major your @solana-program
            # | dependencies declare, never to 'latest'. Today that major is 7, even though
            # | kit 8.0.0 is the newest published version.
            explanation: "A regra durável (CF4): fixe o @solana/kit no major que as suas dependências de @solana-program declaram, nunca no 'latest'. Hoje aquele major é o 7, mesmo que o kit 8.0.0 seja a versão publicada mais nova."  # @src=0445c4cb4a9f
            options:                 # source order — keep it
              c:
                # | 'latest' so npm always resolves the newest kit for you
                label: "O 'latest', para o npm sempre resolver o kit mais novo para você"  # @src=ee036fe5dceb
                # | 'latest' is exactly what the durable rule forbids: a kit major bump can
                # | break your peers overnight — kit 8 became latest the day it shipped.
                feedback: "O 'latest' é exatamente o que a regra durável proíbe: uma subida de major do kit consegue quebrar os seus peers da noite para o dia — o kit 8 virou latest no dia em que foi entregue."  # @src=82eb4f245879
              e:
                # | >=7, so npm can be trusted to move up once @solana-program does
                label: "O >=7, para se poder confiar que o npm sobe quando o @solana-program subir"  # @src=aba1e22884c8
                # | An open-ended range resolves to the newest version that satisfies it,
                # | which today is kit 8.0.0, so `>=7` hits the same ERESOLVE that pinning
                # | 'latest' does. Moving a major is a decision you take after checking that
                # | the peer ranges moved too.
                feedback: "Uma faixa aberta resolve para a versão mais nova que satisfaz ela, que hoje é o kit 8.0.0, então o `>=7` bate no mesmo ERESOLVE que fixar no 'latest' bate. Mover um major é uma decisão que você toma depois de checar que as faixas de peer se moveram também."  # @src=6c0f9fc1d91a
              a:
                # | ^8 — pin the newest kit (8.0.0) so the client stays current
                label: "O ^8 — fixe o kit mais novo (8.0.0) para o cliente continuar atual"  # @src=d9ebf0c7786a
                # | kit 8.0.0 is npm latest, but @solana-program/token 0.15.0 peers on
                # | @solana/kit ^7.0.0; pinning ^8 breaks the peer graph and the install
                # | fails.
                feedback: "O kit 8.0.0 é o latest do npm, mas o @solana-program/token 0.15.0 faz peer no @solana/kit ^7.0.0; fixar no ^8 quebra o grafo de peers e a instalação falha."  # @src=b64164596e1c
              d:
                # | ^6, because one repo should settle on a single kit major
                label: "O ^6, porque um repositório deveria se assentar num major único de kit"  # @src=c4845e486d4c
                # | The pin is a property of the workspace's dependency graph, not of the
                # | repository. Two workspaces in one repo legitimately pin different kit
                # | majors, because each one matches the peers its own dependencies declare.
                feedback: "O pin é uma propriedade do grafo de dependências do workspace, não do repositório. Dois workspaces num repositório legitimamente fixam majors de kit diferentes, porque cada um casa com os peers que as dependências próprias dele declaram."  # @src=8f5577a3f957
              b:
                # | ^7 — match the major your @solana-program deps peer on
                label: "O ^7 — case com o major em que as suas dependências de @solana-program fazem peer"  # @src=6c4eef19d016
                # | Per workspace, not per repository: read the peer ranges your own
                # | dependencies declare and match that major. What npm calls latest has no
                # | bearing on whether the graph resolves.
                feedback: "Por workspace, não por repositório: leia as faixas de peer que as suas próprias dependências declaram e case com aquele major. O que o npm chama de latest não tem influência nenhuma sobre se o grafo resolve."  # @src=4a2c446bbd3f
          m08-l1-q2:
            # | A teammate says 'skip Codama — just import @anchor-lang/core for the V2
            # | client.' What's actually wrong with that?
            prompt: "Um colega diz 'pule o Codama — só importe o @anchor-lang/core para o cliente V2'. O que está de fato errado nisso?"  # @src=911ff694e482
            # | The honest TS state: no official V2 package exists. @anchor-lang/core (npm
            # | latest 1.1.2) is the v1-era client. The first-party path is anchor codama
            # | convert + generate -l js, which renders a typed @solana/kit client. Reaching
            # | for the package that looks official quietly pins you back to web3.js v1 —
            # | the exact SDK line V2 exists to move off of.
            explanation: "O estado honesto do TS: não existe pacote V2 oficial. O @anchor-lang/core (latest no npm 1.1.2) é o cliente da era v1. O caminho first-party é o anchor codama convert + generate -l js, que renderiza um cliente @solana/kit tipado. Recorrer ao pacote que parece oficial caladamente te fixa de volta no web3.js v1 — a linha de SDK exata da qual o V2 existe para sair."  # @src=128dd00b3ae7
            options:                 # source order — keep it
              d:
                # | It just needs @solana/kit installed next to it, which is what moves
                # | 1.1.2 onto the kit line
                label: "Ele só precisa do @solana/kit instalado ao lado dele, que é o que move o 1.1.2 para a linha do kit"  # @src=9703ce34dd8f
                # | Listing @solana/kit in your package.json does not change what
                # | @anchor-lang/core imports. At 1.1.2 it still pulls @solana/web3.js v1,
                # | so you would be shipping both SDK lines in one bundle rather than moving
                # | off one.
                feedback: "Listar o @solana/kit no seu package.json não muda o que o @anchor-lang/core importa. No 1.1.2 ele ainda puxa o @solana/web3.js v1, então você estaria entregando as duas linhas de SDK num bundle só em vez de sair de uma."  # @src=4977fe05e5d6
              b:
                # | It works, but only inside a bundler; Node send scripts need the Codama
                # | client instead
                label: "Funciona, mas só dentro de um bundler; scripts de send em Node precisam do cliente Codama em vez disso"  # @src=fa9d70486ee3
                # | Runtime environment isn't the issue — @anchor-lang/core imports fine in
                # | a Node script. The problem is the SDK line underneath it: web3.js v1,
                # | not @solana/kit.
                feedback: "Ambiente de runtime não é o problema — o @anchor-lang/core importa bem num script Node. O problema é a linha de SDK embaixo dele: web3.js v1, não @solana/kit."  # @src=267490ad42d1
              a:
                # | Nothing — @anchor-lang/core 1.1.2 is the official Anchor V2 client for
                # | @solana/kit
                label: "Nada — o @anchor-lang/core 1.1.2 é o cliente oficial do Anchor V2 para o @solana/kit"  # @src=2330a2ddd9fa
                # | @anchor-lang/core is real and official — it's the renamed successor to
                # | @coral-xyz/anchor — but npm latest 1.1.2 still depends on
                # | @solana/web3.js v1. It's the v1-era client wearing a new name, not a kit
                # | client.
                feedback: "O @anchor-lang/core é real e oficial — ele é o sucessor renomeado do @coral-xyz/anchor — mas o latest no npm 1.1.2 ainda depende do @solana/web3.js v1. Ele é o cliente da era v1 vestindo um nome novo, não um cliente de kit."  # @src=88e69edec533
              c:
                # | There's no official V2 TS package; @anchor-lang/core is still on the
                # | web3.js v1 line
                label: "Não existe pacote TS de V2 oficial; o @anchor-lang/core continua na linha do web3.js v1"  # @src=ef459e851321
                # | Two steps through Codama — convert, then generate — and you have a typed
                # | kit client off your own IDL. Pick the package whose name looks official
                # | instead and you are quietly back on the SDK line the rewrite exists to
                # | leave.
                feedback: "Dois passos através do Codama — convert, e depois generate — e você tem um cliente kit tipado saído do seu próprio IDL. Escolha o pacote cujo nome parece oficial em vez disso e você está caladamente de volta na linha de SDK da qual a reescrita existe para sair."  # @src=f5fbbca75ca2
          m08-l1-q3:
            # | You want any client — not just yours — to be able to read your program's
            # | interface on-chain. Which step does that?
            prompt: "Você quer que qualquer cliente — não só o seu — consiga ler a interface do seu programa on-chain. Qual passo faz isso?"  # @src=3f439749b9a6
            # | anchor idl init (and anchor idl upgrade for later edits) writes the IDL to
            # | the Program Metadata Program at the canonical [program, seed] PDA —
            # | permissionless to read, writable only by the program's upgrade authority —
            # | so any client can resolve your interface from the chain. Anchor removed its
            # | own built-in IDL instructions in 1.0 and V2 inherits that removal. The
            # | trade-off: the IDL account costs rent, and the on-chain copy is only as
            # | current as its last publish — which on this lab's `--no-idl` flow means your
            # | last `idl upgrade`, and on a plain `anchor deploy` means the deploy itself,
            # | because the RC uploads the IDL by default.
            explanation: "O anchor idl init (e o anchor idl upgrade para edições posteriores) escreve o IDL no Program Metadata Program no PDA canônico [program, seed] — sem permissão para ler, gravável só pela autoridade de upgrade do programa — então qualquer cliente consegue resolver a sua interface a partir da cadeia. O Anchor removeu as instruções de IDL embutidas dele no 1.0 e o V2 herda essa remoção. O trade-off: a conta de IDL custa aluguel, e a cópia on-chain é atual só na medida da última publicação dela — que no fluxo de `--no-idl` deste lab quer dizer o seu último `idl upgrade`, e num `anchor deploy` simples quer dizer o deploy em si, porque o RC sobe o IDL por padrão."  # @src=488776745a22
            options:                 # source order — keep it
              b:
                # | Commit target/idl/token_ticket_swap.json and serve it from GitHub
                label: "Commitar o target/idl/token_ticket_swap.json e servir ele do GitHub"  # @src=0120caa1fe37
                # | A repo file only serves people who already have your repo — a wallet or
                # | explorer holding nothing but a program id can't resolve it. The Program
                # | Metadata Program stores the IDL at a canonical PDA any client derives
                # | from the program id alone.
                feedback: "Um arquivo de repositório serve só as pessoas que já têm o seu repositório — uma carteira ou um explorador segurando nada além de um id de programa não consegue resolver ele. O Program Metadata Program guarda o IDL num PDA canônico que qualquer cliente deriva a partir do id do programa sozinho."  # @src=39ef3507f405
              e:
                # | Run anchor idl init from any funded wallet, since Program Metadata
                # | writes are permissionless
                label: "Rodar o anchor idl init de qualquer carteira financiada, já que escritas do Program Metadata são sem permissão"  # @src=7e0e719ba9e6
                # | Reading that account is permissionless; writing it is not. The Program
                # | Metadata entry is writable only by the program's upgrade authority, so
                # | signing with any other key fails on authority no matter how well funded
                # | it is.
                feedback: "Ler aquela conta é sem permissão; escrever nela não é. A entrada do Program Metadata é gravável só pela autoridade de upgrade do programa, então assinar com qualquer outra chave falha na autoridade não importa quão bem financiada ela esteja."  # @src=c478db2e7ec7
              d:
                # | Pass --no-idl to anchor deploy so the IDL ships with the program bytes
                label: "Passar o --no-idl para o anchor deploy para o IDL ser entregue junto com os bytes do programa"  # @src=0ff0b7a27686
                # | --no-idl does the opposite of that. The RC's deploy uploads
                # | target/idl/<name>.json by default, and the flag turns that upload off,
                # | which is precisely why this lab's publish stays an explicit `anchor idl
                # | init` two lines later.
                feedback: "O --no-idl faz o oposto disso. O deploy do RC sobe o target/idl/<name>.json por padrão, e a flag desliga aquela subida, que é precisamente por que a publicação deste lab continua sendo um `anchor idl init` explícito duas linhas depois."  # @src=1964d18fd118
              a:
                # | Publish it with anchor idl init through the Program Metadata Program
                label: "Publicar ele com o anchor idl init através do Program Metadata Program"  # @src=18da70a78b4f
                # | Worth knowing what you are signing up for: an account you now pay rent
                # | on, and a second copy of your interface that is only true for as long as
                # | somebody keeps republishing it. Which flow you are on decides who that
                # | somebody is — the RC's plain `anchor deploy` upserts the IDL for you, so
                # | the staleness bites on the explicit `--no-idl` flow this lab uses, where
                # | the re-publish is a step you have to remember.
                feedback: "Vale saber no que você está se inscrevendo: uma conta na qual você agora paga aluguel, e uma segunda cópia da sua interface que é verdadeira só enquanto alguém continuar republicando ela. Em qual fluxo você está decide quem é esse alguém — o `anchor deploy` simples do RC faz upsert do IDL para você, então a obsolescência morde no fluxo explícito de `--no-idl` que este lab usa, onde a re-publicação é um passo que você tem que lembrar."  # @src=bb6091770f3b
              c:
                # | Embed the IDL as a #[constant] so callers read it from the binary
                label: "Embutir o IDL como um #[constant] para quem chama ler ele do binário"  # @src=75d92884d444
                # | Nothing in v2 ships the IDL inside the executable — #[constant] only
                # | surfaces a value in the generated IDL JSON, it doesn't make the binary
                # | self-describing. The on-chain copy lives in a separate Program Metadata
                # | account.
                feedback: "Nada no v2 entrega o IDL dentro do executável — o #[constant] só traz um valor à superfície no JSON de IDL gerado, ele não deixa o binário auto-descritivo. A cópia on-chain mora numa conta separada de Program Metadata."  # @src=51fcd4f82709
  m08-l2:
    # | Prove it: a verifiable build on devnet, and the authority trust surface
    title: "Comprove: um build verificável na devnet, e a superfície de confiança da autoridade"  # @src=93f77743ffc1
    blocks:
      check:                      # quiz
        questions:
          m08-l2-q1:
            # | You ran solana-verify build, deployed to devnet, and verify-from-repo
            # | reports a match. What exactly have you proven?
            prompt: "Você rodou solana-verify build, fez deploy na devnet, e o verify-from-repo reporta um casamento. O que exatamente você comprovou?"  # @src=d7ef39cb263c
            # | A verifiable build is a source-to-bytes proof under a pinned, deterministic
            # | toolchain. It proves provenance, not safety, and not anything about who
            # | controls upgrades.
            explanation: "Um build verificável é uma prova de código-fonte para bytes sob um toolchain fixado e determinístico. Ele comprova procedência, não segurança, e nada sobre quem controla os upgrades."  # @src=bfc28951ad99
            options:                 # source order — keep it
              d:
                # | That the .so from your local build hashes the same as the deployed
                # | devnet bytes
                label: "Que o .so do seu build local dá o mesmo hash que os bytes de devnet que receberam deploy"  # @src=ee2c9c62dd89
                # | Your local artifact never enters the comparison. verify-from-repo clones
                # | the public repo, rebuilds it inside the pinned image, and puts that hash
                # | against the on-chain one, which is why the challenge's uncommitted
                # | one-line edit produces a mismatch while your laptop still holds a
                # | matching .so.
                feedback: "O seu artefato local nunca entra na comparação. O verify-from-repo clona o repo público, refaz o build dele dentro da imagem fixada, e põe esse hash contra o hash on-chain, que é por que a edição de uma linha não commitada do challenge produz um descasamento enquanto o seu laptop ainda segura um .so que casa."  # @src=56bb16682e2e
              b:
                # | That the deployed devnet bytes were built from exactly this source at
                # | the pinned toolchain
                label: "Que os bytes de devnet que receberam deploy foram construídos a partir exatamente deste código-fonte no toolchain fixado"  # @src=68cdec2d518e
                # | Provenance under a fixed toolchain — that's the entire claim. A
                # | faithfully reproduced program can still be a dangerous one, and who may
                # | swap those bytes tomorrow is a different question from whether these
                # | bytes match.
                feedback: "Procedência sob um toolchain fixo — é essa a afirmação inteira. Um programa fielmente reproduzido ainda pode ser um programa perigoso, e quem pode trocar esses bytes amanhã é uma pergunta diferente de se estes bytes casam."  # @src=55b636b09efb
              a:
                # | That the swap logic is free of exploitable bugs, because the verifier
                # | compiles and inspects the source
                label: "Que a lógica do swap está livre de bugs exploráveis, porque o verificador compila e inspeciona o código-fonte"  # @src=16a6acd82c0c
                # | The rebuild does compile your source, but it only hashes the output — it
                # | never reads the logic. A perfectly verifiable program can still drain
                # | its own vault; bug-freedom came from your audit and fuzz pass.
                feedback: "O rebuild de fato compila o seu código-fonte, mas ele só tira o hash da saída — ele nunca lê a lógica. Um programa perfeitamente verificável ainda consegue drenar o próprio vault; a ausência de bugs veio da sua auditoria e da sua passada de fuzz."  # @src=44eb3ceec315
              c:
                # | That the upgrade authority is locked, since a verified program's bytes
                # | can no longer be replaced
                label: "Que a autoridade de upgrade está travada, já que os bytes de um programa verificado não podem mais ser substituídos"  # @src=40ec8461466f
                # | Verification is orthogonal to authority: a verified program whose
                # | upgrade authority is still a hot keypair can be silently replaced
                # | tomorrow. Locking upgrades is a separate set-upgrade-authority or Squads
                # | step.
                feedback: "Verificação é ortogonal a autoridade: um programa verificado cuja autoridade de upgrade ainda é um keypair quente pode ser silenciosamente substituído amanhã. Travar upgrades é um passo separado de set-upgrade-authority ou de Squads."  # @src=afcbcb735c62
          m08-l2-q2:
            # | You try solana-verify remote submit-job for your devnet program and it won't
            # | produce a result. Why?
            prompt: "Você tenta o solana-verify remote submit-job para o seu programa de devnet e ele não produz resultado. Por quê?"  # @src=8357c3feb096
            # | The remote OtterSec submit-job path is mainnet-only. This course proves the
            # | build on devnet with the local verify-from-repo command; the remote flow is
            # | demonstrated and labelled beyond the course's cluster. What the registry
            # | adds is discoverability, not a stronger proof: OtterSec runs the build on
            # | their infrastructure and writes an on-chain record that explorers and
            # | wallets read for the verified badge. The trustless proof is the local one —
            # | you rebuild in the pinned image and compare the two hashes yourself.
            explanation: "O caminho de submit-job remoto da OtterSec é só de mainnet. Este curso comprova o build na devnet com o comando verify-from-repo local; o fluxo remoto é demonstrado e rotulado como além do cluster do curso. O que o registry acrescenta é visibilidade, não uma prova mais forte: a OtterSec roda o build na infraestrutura deles e escreve um registro on-chain que exploradores e carteiras leem para o selo de verificado. A prova que dispensa confiança é a local — você refaz o build na imagem fixada e compara os dois hashes você mesmo."  # @src=3012c097ccc5
            options:                 # source order — keep it
              b:
                # | The Docker daemon isn't running, so the pinned image can't start
                label: "O daemon do Docker não está rodando, então a imagem fixada não consegue iniciar"  # @src=45e5a9da507e
                # | Docker is required for your local solana-verify build, and it fails fast
                # | with a daemon error. The remote job rebuilds on OtterSec's workers
                # | instead, so your daemon is not what stops it — cluster scope is.
                feedback: "O Docker é obrigatório para o seu solana-verify build local, e ele falha rápido com um erro de daemon. O job remoto refaz o build nos workers da OtterSec em vez disso, então o seu daemon não é o que impede ele — o escopo de cluster é."  # @src=ef70f06c5d34
              d:
                # | The remote job typically takes thirty minutes; the result is not back
                # | yet
                label: "O job remoto tipicamente leva trinta minutos; o resultado ainda não voltou"  # @src=8cbda69f5e15
                # | That range is real for a mainnet job, and waiting is the reflex it
