            prompt: "No 0.32 você escrevia `CpiContext::new(ctx.accounts.token_program.to_account_info(), accounts)`. Por que a assinatura do 1.0 rejeita isso, e qual é a razão atrás da mudança?"  # @src=64bbe2a3e1d3
            # | Anchor 1.0 changed `CpiContext::new` to take the program as a `Pubkey`
            # | (#2762). The runtime identifies a program by its address, so passing the key
            # | rather than a full AccountInfo removes a redundant handle and is the shape
            # | V2 later builds on. The deeper motivation is type narrowing: the fat
            # | `AccountInfo` let you hand the constructor an account that was not the
            # | program at all and defer the mismatch to a runtime failure, while a `Pubkey`
            # | argument turns that class of mistake into a flat compile error. Riding along
            # | with it, plain `transfer` is deprecated for `transfer_checked`, so the
            # | mechanical edit is two moves: `.to_account_info()` -> `.key()`, and add the
            # | mint plus decimals. (The `CpiHandle` borrow model is a separate, later 2.0
            # | change -- don't conflate the two deltas.)
