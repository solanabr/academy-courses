            explanation: "Um PDA assina apresentando as seeds exatas das quais ele foi derivado mais o bump canônico dele. O Anchor pega aquele byte do `vault.bump` guardado para um esquema de seeds como este — o const de tempo de macro se aplica só quando cada seed é um literal de byte, e a chave de authority não é; nativo, você guarda ele e entrega as seeds + o slice de bump para o invoke_signed. No lab isso é `[Seed::from(b\"vault\"), Seed::from(self.authority.key().as_ref()), Seed::from(&bump)]`, com o `bump` lido de volta do `cfg[33]`. Erre o array em ordem ou em conteúdo e o runtime reconstrói um endereço diferente, recusa assinar, e retorna InvalidSeeds — não tem crédito parcial do runtime aqui."  # @src=4ddcd5034620
