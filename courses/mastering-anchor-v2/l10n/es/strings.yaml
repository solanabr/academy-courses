            # | unrelated exercise — it is hand-writing the exact foundation the framework
            # | sits on, which is why the resonance is the point of the module. V2's
            # | `lang-v2` crate depends on `pinocchio` and `pinocchio-system 0.6` directly;
            # | the crates you added by hand are that same foundation two minor lines back,
            # | on the 0.9 pins that still predate the 0.11 rename of `AccountInfo` to
            # | `AccountView` and `Pubkey` to `Address`.
            explanation: "V2 es una reescritura no_std sobre pinocchio. Reconstruir el vault nativamente no es un ejercicio sin relación — es escribir a mano exactamente la fundación sobre la que se sienta el framework, que es por lo que la resonancia es el punto del módulo. El crate `lang-v2` de V2 depende de `pinocchio` y de `pinocchio-system 0.6` directamente; los crates que agregaste a mano son esa misma fundación dos líneas de minor atrás, sobre los pins 0.9 que todavía anteceden el rename de 0.11 de `AccountInfo` a `AccountView` y de `Pubkey` a `Address`."  # @src=b93e9d025850
            options:                 # source order — keep it
              c:
                # | That native pinocchio programs need a real validator and cannot clear
                # | the same LiteSVM gate the framework vault cleared.
                label: "Que los programas pinocchio nativos necesitan un validador de verdad y no pueden pasar la misma barrera de LiteSVM que pasó el vault de framework."  # @src=7b6b258d0096
                # | They can, and yours did — the same in-process LiteSVM harness loads your
                # | `.so`, asserts the 500_000_000 lamport delta, and rejects the
                # | over-withdraw.
                feedback: "Pueden, y el tuyo pasó — el mismo banco de pruebas de LiteSVM in-process carga tu `.so`, hace la aserción del delta de 500_000_000 lamports, y rechaza el over-withdraw."  # @src=ff03a1b9e0c3
              b:
                # | That Anchor V2 is itself a no_std rewrite built on pinocchio — you
                # | hand-wrote the layer V2 now generates.
                label: "Que Anchor V2 es él mismo una reescritura no_std construida sobre pinocchio — escribiste a mano la capa que V2 ahora genera."  # @src=38c45010d413
                # | What you assembled by hand is the same foundation the framework's own
                # | crate depends on — a couple of minor versions back, before the account
                # | and address types were renamed.
                feedback: "Lo que armaste a mano es la misma fundación de la que depende el propio crate del framework — un par de versiones de minor atrás, antes de que se renombraran los tipos de cuenta y de dirección."  # @src=e81744d9dcdc
              a:
                # | That Anchor V2 keeps V1's std-linked runtime and changes only surface
                # | ergonomics like `.key()` becoming `.address()`.
                label: "Que Anchor V2 mantiene el runtime linkeado con std de V1 y cambia solo ergonomía de superficie como `.key()` volviéndose `.address()`."  # @src=2833400e870d
                # | The `.address()` rename is real, but it is a symptom, not the change. V2
                # | is a ground-up `no_std` rewrite: its `lang-v2` crate depends on
                # | `pinocchio` and `pinocchio-system 0.6` directly.
                feedback: "El rename de `.address()` es real, pero es un síntoma, no el cambio. V2 es una reescritura `no_std` desde cero: su crate `lang-v2` depende de `pinocchio` y de `pinocchio-system 0.6` directamente."  # @src=76bee3956319
              d:
                # | That Solana programs are no_std underneath either way, and the framework
                # | was hiding that ceremony.
                label: "Que los programas de Solana son no_std por debajo de cualquier forma, y el framework estaba escondiendo esa ceremonia."  # @src=e1af5b332fb2
                # | That is the folklore version, and it overreaches. The SBF toolchain
                # | ships a trimmed but working std, the stock entrypoint installs a bump
                # | allocator, and Anchor 1.x programs link against all of it. no_std is
                # | what V2 and pinocchio chose, not the mode the runtime imposes.
                feedback: "Esa es la versión del folclore, y exagera. El toolchain SBF entrega un std recortado pero funcional, el entrypoint de fábrica instala un asignador bump, y los programas Anchor 1.x linkean contra todo eso. no_std es lo que eligieron V2 y pinocchio, no el modo que impone el runtime."  # @src=f31fb26fa38f
  m09-l2:
    # | Strip the framework II: the diff, and what Anchor generates
    title: "Desmonta el framework II: el diff, y qué genera Anchor"  # @src=f480fcb9302b
    blocks:
      check:                      # quiz
        questions:
          m09-l2-q1:
            # | Diffing your native vault against the V2 expansion, you find the derive
            # | generated a MUT_MASK associated const plus a runtime duplicate-account walk.
            # | You wrote no such check natively. What class of bug does that generated code
            # | close?
            prompt: "Diffeando tu vault nativo contra la expansión de V2, encuentras que el derive generó un const asociado MUT_MASK más un recorrido de cuentas duplicadas en runtime. Nativamente no escribiste ninguna verificación así. ¿Qué clase de bug cierra ese código generado?"  # @src=9c71d2ed2f36
            # | MUT_MASK plus the runtime duplicate-account walk is Anchor's
            # | duplicate-mutable defense: it rejects the same writable account appearing
            # | twice in one instruction. Native, nothing stops it — which is exactly the
            # | kind of guard the framework makes impossible to forget. Note the difference
            # | in scope: your native gate 6 compared the one pair you happened to think of,
            # | while the derive's walk is exhaustive over every mutable pair the struct
            # | implies and merged across nested structs, so it grows when you add a field
            # | and your hand-written comparison does not.
            explanation: "MUT_MASK más el recorrido de cuentas duplicadas en runtime es la defensa de duplicate-mutable de Anchor: rechaza que la misma cuenta escribible aparezca dos veces en una sola instrucción. Nativo, nada lo detiene — que es exactamente el tipo de guarda que el framework vuelve imposible de olvidar. Nota la diferencia de alcance: tu barrera 6 nativa comparaba el único par que se te ocurrió, mientras el recorrido del derive es exhaustivo sobre cada par mutable que implica la struct y está fusionado a través de structs anidadas, así que crece cuando agregas un campo y tu comparación escrita a mano no."  # @src=966baaad6166
            options:                 # source order — keep it
              b:
                # | Reading a stale typed field after a CPI mutated the account underneath
                # | it.
                label: "Leer un campo tipado obsoleto después de que una CPI mutó la cuenta debajo de él."  # @src=40096ebcc0c0
                # | Real class, wrong guard: the stale post-CPI read is closed by the
                # | CpiHandle borrow model, a separate piece of the same expansion.
                feedback: "Clase real, guarda equivocada: la lectura obsoleta post-CPI la cierra el modelo de borrow de CpiHandle, una pieza separada de la misma expansión."  # @src=0a82ef216935
              a:
                # | Unchecked arithmetic overflowing the u64 balance field when a deposit is
                # | added.
                label: "Aritmética sin verificar desbordando el campo de saldo u64 cuando se suma un depósito."  # @src=e24229b7eaa1
                # | Overflow is closed by checked_add in the handler body, not by MUT_MASK
                # | or the duplicate-account walk.
                feedback: "El desborde lo cierra checked_add en el cuerpo del handler, no MUT_MASK ni el recorrido de cuentas duplicadas."  # @src=9c11e806a1fb
              c:
                # | Passing the same mutable account twice in one instruction
                # | (duplicate-mutable).
                label: "Pasar la misma cuenta mutable dos veces en una sola instrucción (duplicate-mutable)."  # @src=8b00d8728875
                # | Scope is the real difference: your hand-written gate covered whichever
                # | single pair occurred to you, while generated code enumerates every
                # | writable pair the struct implies and keeps doing so as fields are added.
                feedback: "El alcance es la diferencia de verdad: tu barrera escrita a mano cubría cualquier par único que se te ocurriera, mientras el código generado enumera cada par escribible que implica la struct y sigue haciéndolo a medida que se agregan campos."  # @src=9488e2688614
              d:
                # | A duplicate address in the account list, whether or not a field is
                # | writable.
                label: "Una dirección duplicada en la lista de cuentas, sea o no escribible un campo."  # @src=bf187bce93b1
                # | The mask marks writable fields, so an address arriving twice through two
                # | read-only slots is a legal call and nothing rejects it. What trips the
                # | walk is an alias landing where at least one of its slots is mutable.
                feedback: "La máscara marca campos escribibles, así que una dirección que llega dos veces a través de dos slots de solo lectura es una llamada legal y nada la rechaza. Lo que hace tropezar al recorrido es un alias que aterriza donde al menos uno de sus slots es mutable."  # @src=b1ed0e98c21c
          m09-l2-q2:
            # | The expansion shows typed account access is blocked while a CpiHandle is
            # | live — your native code has no such guard. Which v1-era footgun did that
            # | borrow model replace?
            prompt: "La expansión muestra que el acceso tipado a cuentas está bloqueado mientras un CpiHandle está vivo — tu código nativo no tiene ninguna guarda así. ¿Qué trampa de la era v1 reemplazó ese modelo de borrow?"  # @src=2e2ff4aadb58
            # | In v1 you could hold typed data across a CPI and read a stale copy unless
            # | you called .reload(). V2's CpiHandle holds Rust borrows so typed access
            # | during a live handle is a compile error — the footgun becomes
            # | unrepresentable.
            explanation: "En v1 podías sostener datos tipados a través de una CPI y leer una copia obsoleta a menos que llamaras .reload(). El CpiHandle de V2 sostiene borrows de Rust así que el acceso tipado durante un handle vivo es un error de compilación — la trampa se vuelve irrepresentable."  # @src=671edbd4c1bc
            options:                 # source order — keep it
              b:
                # | Signing a CPI with a re-derived bump instead of the stored canonical
                # | one.
                label: "Firmar una CPI con un bump re-derivado en vez del canónico guardado."  # @src=e4f2a3542863
                # | A real footgun, but a different guard: bump = state.bump re-derives
                # | against the stored canonical byte as a constraint hook, well before any
                # | CpiHandle exists.
                feedback: "Una trampa real, pero otra guarda: bump = state.bump re-deriva contra el byte canónico guardado como un hook de constraint, bastante antes de que exista cualquier CpiHandle."  # @src=d61a6971c772
              c:
                # | Hashing the wrong preimage namespace into an instruction discriminator.
                label: "Hashear el namespace de preimage equivocado dentro de un discriminator de instrucción."  # @src=ba3bbd689952
                # | That trap lives in the dispatcher — a tag built from the wrong namespace
                # | routes to nothing. The borrow model is about typed reads while a CPI is
                # | in flight.
                feedback: "Esa trampa vive en el dispatcher — una etiqueta armada desde el namespace equivocado rutea hacia nada. El modelo de borrow es sobre lecturas tipadas mientras una CPI está en vuelo."  # @src=09bd0d96f2f4
              d:
                # | Passing the same writable account twice, a check v1 left to you.
                label: "Pasar la misma cuenta escribible dos veces, una verificación que v1 te dejaba a ti."  # @src=f80d910c928b
                # | Also a v1-era gap, and also closed in this expansion, but by the other
                # | guard: MUT_MASK plus the duplicate walk. The borrow model is about what
                # | you may read while a CPI is still in flight, not about which addresses
                # | arrived.
                feedback: "También un hueco de la era v1, y también cerrado en esta expansión, pero por la otra guarda: MUT_MASK más el recorrido de duplicados. El modelo de borrow es sobre qué te está permitido leer mientras una CPI todavía está en vuelo, no sobre qué direcciones llegaron."  # @src=b234f2b5bf5b
              a:
                # | Reading stale account data after a CPI because you forgot to call
                # | .reload().
                label: "Leer datos de cuenta obsoletos después de una CPI porque te olvidaste de llamar .reload()."  # @src=60b5dc0aadb3
                # | Forgetting it raised nothing — no error, no warning, no panic — which is
                # | why it shipped as often as it did. A build failure does not restate the
                # | discipline; it retires the need for any.
                feedback: "Olvidarlo no levantaba nada — ningún error, ninguna advertencia, ningún panic — que es por lo que se entregaba tantas veces como se entregaba. Una falla de build no vuelve a enunciar la disciplina; retira la necesidad de cualquiera."  # @src=9d9be427cbf0
          m09-l2-q3:
            # | You take the one-beat asm-v2 peek at hand-written sBPF, then stop. Per this
            # | course's scope, where does the 'why the VM runs it that way' depth live?
            prompt: "Le das la mirada de un compás al asm-v2 con sBPF escrito a mano, y después paras. Según el alcance de este curso, ¿dónde vive la profundidad del 'por qué la VM lo corre de esa forma'?"  # @src=e22f9314401b
            # | This course stays framework-level: what the macro expands to. The sBPF peek
            # | is a single beat; the Low-Level Solana course owns loaders, sBPF, and
            # | syscalls, and it runs the same strip-the-framework mirror in the other
            # | direction on a counter — rebuilding it with no framework at all.
            explanation: "Este curso se queda al nivel del framework: en qué expande la macro. La mirada al sBPF es un solo compás; el curso de Low-Level Solana es dueño de loaders, sBPF y syscalls, y corre este mismo espejo de desmonta-el-framework en la otra dirección sobre un counter — reconstruyéndolo sin ningún framework."  # @src=cb0b4d13f6a7
            options:                 # source order — keep it
              d:
                # | In the Client-Side Mastery course, which owns the sBPF and wire depth
                # | under a send.
                label: "En el curso de Client-Side Mastery, que es dueño de la profundidad de sBPF y de wire debajo de un send."  # @src=dac468c0bbde
                # | That course picks up where a well-formed transaction ends: priority
                # | fees, retries, getting a send to land. What the VM does with the bytes
                # | once they arrive is the loader-and-syscall territory the boundary map
                # | routes elsewhere.
                feedback: "Ese curso agarra donde termina una transacción bien formada: tarifas de prioridad, reintentos, hacer que un send aterrice. Lo que hace la VM con los bytes una vez que llegan es el territorio de loader-y-syscall que el mapa de frontera rutea a otro lado."  # @src=3d16dfc87023
              b:
                # | In the Low-Level Solana course, which owns runtime, loader, and sBPF
                # | depth.
                label: "En el curso de Low-Level Solana, que es dueño de la profundidad de runtime, de loader y de sBPF."  # @src=51d89fc58916
                # | That course runs this same mirror in the opposite direction, rebuilding
                # | a counter with nothing underneath it. The peek here only establishes
                # | that a hand-written hot path can be linked in at all.
                feedback: "Ese curso corre este mismo espejo en la dirección opuesta, reconstruyendo un counter sin nada debajo. La mirada de acá solo establece que un camino caliente escrito a mano puede linkearse."  # @src=9f8b9c079615
              a:
                # | Here in the next module, since Anchor V2's asm-v2 hot path puts sBPF in
                # | scope.
                label: "Acá en el próximo módulo, ya que el camino caliente asm-v2 de Anchor V2 pone sBPF en alcance."  # @src=04320487d502
                # | asm-v2 only proves the escape hatch exists — you can link a hand-written
                # | hot path. Why the VM executes it that way is handed off by the boundary
                # | map, not taught here.
                feedback: "asm-v2 solo demuestra que la salida de emergencia existe — puedes linkear un camino caliente escrito a mano. Por qué la VM lo ejecuta de esa forma lo entrega el mapa de frontera, no se enseña acá."  # @src=43708f94585e
              c:
                # | In the Digital Assets course, next to token standards and the
                # | transfer-hook interface.
                label: "En el curso de Digital Assets, al lado de los estándares de token y de la interfaz de transfer hook."  # @src=adc7c7bf2940
                # | Digital Assets owns token standards and the transfer-hook interface,
                # | which are program-level concerns, not VM or loader internals.
                feedback: "Digital Assets es dueño de los estándares de token y de la interfaz de transfer hook, que son preocupaciones de nivel de programa, no internas de VM ni de loader."  # @src=95b37e74b8e6
  m09-l3:
    # | Capstone: run the whole arcade floor
    title: "Capstone: pon a correr el salón de arcade entero"  # @src=1cab25aaef9b
    blocks:
      check:                      # quiz
        questions:
          m09-l3-q1:
            # | Your floor-registry increments each cabinet's play counter by CPI-ing into
            # | the counter program from module 2. Why does the course insist this wiring be
            # | written as worked CPI steps rather than handed to you pre-built?
            prompt: "Tu floor-registry incrementa el contador de jugadas de cada cabinet haciéndole CPI al programa counter del módulo 2. ¿Por qué el curso insiste en que este cableado se escriba como pasos de CPI trabajados en vez de entregártelo prearmado?"  # @src=11407f1ca574
            # | The no-undemonstrated-accretion rule: the capstone gates on your producing
            # | the composition, so the CPI edges (including the counter increment) are
            # | worked steps you write, not a finished registry you receive. A pre-built
            # | wiring would prove nothing about your ability to compose the rungs — the
            # | wiring itself is the artifact under test, which is why R1 is worked in full
            # | as a template and R2, R3, and R4 are yours.
            explanation: "La regla de nada-de-acumulación-sin-demostrar: el capstone pone la barrera en que tú produzcas la composición, así que los bordes de CPI (incluido el incremento del counter) son pasos trabajados que escribes tú, no un registry terminado que recibes. Un cableado prearmado no demostraría nada sobre tu capacidad de componer los peldaños — el cableado mismo es el artefacto bajo prueba, que es por qué R1 está trabajado entero como plantilla y R2, R3 y R4 son tuyos."  # @src=5fca7960eb9a
            options:                 # source order — keep it
              c:
                # | Because the capstone gates on you producing the composition yourself —
                # | accretion is demonstrated, never handed over finished.
                label: "Porque el capstone pone la barrera en que produzcas la composición tú mismo — la acumulación se demuestra, nunca se entrega terminada."  # @src=d4687cf6a3e3
                # | The wiring is the artifact. Hand it over finished and there is nothing
                # | left to assess; one rung gets worked end to end as a template, and the
                # | other three are yours.
                feedback: "El cableado es el artefacto. Entrégalo terminado y no queda nada que evaluar; un peldaño queda trabajado de punta a punta como plantilla, y los otros tres son tuyos."  # @src=5847e1466dab
              d:
                # | Because a pre-built registry would hardcode the callee program ids, and
                # | each learner's rungs land at their own addresses.
                label: "Porque un registry prearmado hardcodearía los ids de programa del callee, y los peldaños de cada estudiante aterrizan en sus propias direcciones."  # @src=1e95133b5d59
                # | Nothing has to be hardcoded: `declare_program!` reads each rung's
                # | harvested JSON at expansion time, so the generated `Program<T>` marker
                # | carries that rung's own IDL_ADDRESS. Shipped source would compile
                # | against your ids perfectly well, which is why the reason is pedagogical
                # | rather than technical.
                feedback: "Nada tiene que estar hardcoded: `declare_program!` lee el JSON cosechado de cada peldaño en tiempo de expansión, así que el marcador `Program<T>` generado lleva el IDL_ADDRESS propio de ese peldaño. La fuente entregada compilaría contra tus ids perfectamente bien, que es por qué la razón es pedagógica y no técnica."  # @src=beae7981fa39
              a:
                # | Because exercising a CPI needs both programs actually deployed, so the
                # | wiring can only be checked once you are on devnet.
                label: "Porque ejercitar una CPI necesita los dos programas desplegados de verdad, así que el cableado solo se puede revisar una vez que estás en devnet."  # @src=1ab078cac162
                # | Tempting if you assume cross-program calls need a real validator, but
                # | they do not: LiteSVM runs the compiled programs in process, and the
                # | Surfpool localnet run in Step 8 stands the whole five-program floor up
                # | on your machine before devnet.
                feedback: "Tentador si asumes que las llamadas entre programas necesitan un validador de verdad, pero no: LiteSVM corre los programas compilados en proceso, y la corrida de localnet en Surfpool del Paso 8 levanta el salón entero de cinco programas en tu máquina antes de devnet."  # @src=ef584a923f6d
              b:
                # | Because turning on a rung's `cpi` feature changes its bytecode, so the
                # | counter must be redeployed to a fresh program id first.
                label: "Porque prender el feature `cpi` de un peldaño cambia su bytecode, así que el counter tiene que volver a desplegarse antes a un program id nuevo."  # @src=65acf59cba9d
                # | The registry never flips any feature on a rung at all — it consumes the
                # | counter through its IDL via `declare_program!` — and nothing a caller
                # | does can alter bytecode already deployed at an address. The counter
                # | keeps the program id from its own `declare_id!`, and the registry CPIs
                # | that already-deployed address.
                feedback: "El registry no prende ningún feature en un peldaño para nada — consume el counter a través de su IDL vía `declare_program!` — y nada de lo que haga quien llama puede alterar bytecode ya desplegado en una dirección. El counter se queda con el program id de su propio `declare_id!`, y el registry le hace CPI a esa dirección ya desplegada."  # @src=de1cb6ca7862
          m09-l3-q2:
            # | Before the devnet deploy, the capstone runs the five-program floor together
            # | on a Surfpool localnet via anchor test. What does that step catch that
            # | per-program unit tests do not?
            prompt: "Antes del deploy a devnet, el capstone corre el salón de cinco programas junto en un localnet de Surfpool vía anchor test. ¿Qué atrapa ese paso que las pruebas de unidad por programa no atrapan?"  # @src=4c2f9608b08a
            # | Unit tests prove each rung in isolation; the Surfpool localnet run stands up
            # | the whole floor so the registry's CPIs into every rung run together — the
            # | integration failures that only appear when programs compose are caught
            # | locally, before devnet. Concretely: the registry's CPIs into the counter,
            # | vault, escrow, and swap are never exercised together by isolated unit tests,
            # | so a seam bug like the registry deriving the escrow's vault from `[b"vault",
            # | escrow.key()]` while the test helper created it from `[b"vault",
            # | operator.key()]` passes every single-program suite and fails only when both
            # | programs sit on the same accounts.
            explanation: "Las pruebas de unidad demuestran cada peldaño por separado; la corrida de localnet en Surfpool levanta el salón entero para que las CPI del registry hacia cada peldaño corran juntas — las fallas de integración que solo aparecen cuando los programas componen se atrapan localmente, antes de devnet. Concretamente: las CPI del registry hacia el counter, el vault, el escrow y el swap nunca se ejercitan juntas con pruebas de unidad aisladas, así que un bug de costura como el registry derivando el vault del escrow desde `[b\"vault\", escrow.key()]` mientras el helper de prueba lo creó desde `[b\"vault\", operator.key()]` pasa cada suite de un solo programa y falla solo cuando los dos programas se sientan sobre las mismas cuentas."  # @src=4e2d879b1592
            options:                 # source order — keep it
              d:
                # | That the five-program floor still deploys together, since anchor test
                # | pushes the whole workspace up to devnet first.
                label: "Que el salón de cinco programas todavía se despliega junto, ya que anchor test sube el workspace entero a devnet primero."  # @src=adf3e327e84e
                # | It does deploy the whole workspace, but onto a Surfpool localnet on your
                # | machine, which is the point: the seam runs before a byte reaches the
                # | cluster. The devnet deploy is a later step you drive yourself.
                feedback: "Sí despliega el workspace entero, pero sobre un localnet de Surfpool en tu máquina, que es el punto: la costura corre antes de que un byte llegue al cluster. El deploy a devnet es un paso posterior que manejas tú."  # @src=42f6b4f33735
              c:
                # | Whether each rung's IDL was written to its on-chain metadata account,
                # | which clients need to decode the registry's accounts.
                label: "Si el IDL de cada peldaño se escribió en su cuenta de metadatos on-chain, que los clientes necesitan para decodificar las cuentas del registry."  # @src=cfb0b43370df
                # | IDL upload is a ship-module metadata step (Program Metadata), and a
                # | missing IDL breaks clients, not the programs. The localnet run exercises
                # | on-chain composition, which does not read the IDL at all.
                feedback: "Subir el IDL es un paso de metadatos en el módulo de entrega (Program Metadata), y un IDL faltante rompe clientes, no los programas. La corrida de localnet ejercita la composición on-chain, que no lee el IDL para nada."  # @src=b4b1ec4041d9
              a:
                # | Cross-program integration failures that only surface when all five
                # | programs run against the same accounts together.
                label: "Fallas de integración entre programas que solo salen a la superficie cuando los cinco programas corren juntos contra las mismas cuentas."  # @src=bd708324754d
                # | Seam bugs, mostly — two programs each deriving an address correctly by
                # | their own convention and disagreeing with each other. A single-program
                # | suite can't surface that; only one convention is in the room.
                feedback: "Bugs de costura, sobre todo — dos programas derivando cada uno una dirección correctamente según su propia convención y en desacuerdo entre sí. Una suite de un solo programa no puede sacar eso a la superficie; solo hay una convención en la sala."  # @src=54236af3f9a3
              b:
                # | Compile errors in a single instruction handler, such as a `CpiHandle`
