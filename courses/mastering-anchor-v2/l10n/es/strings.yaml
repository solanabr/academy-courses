            description: "Casi-coincidencia en el ÚLTIMO byte: 31 de 32 bytes coinciden. Una barrera que compara solo el primer byte (o cualquier prefijo) deja que esta dirección drene el vault"  # @src=c0e7f0d4b3b7
          t7:
