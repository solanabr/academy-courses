                feedback: "El tipo que genuinamente desapareció falla fuerte apenas lo llevas al otro lado. Un nombre que sobrevive con un significado nuevo compila, corre, y después se porta como algo que no pediste — mucho peor de los dos."  # @src=045a5158eed0
