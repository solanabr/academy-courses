            description: "un over-withdraw por exactamente 2 tiene que ser el centinela -1. Un (balance as i128) - (amount as i128) ingenuo da -2 acá, que es el código de MONTO CERO: los centinelas no son aritmética, son decisiones"  # @src=99066e04536c
