            description: "Casi-coincidencia en el PRIMER byte, o sea el espejo de t6: una barrera que compara solo el último byte falla acá. Solo una igualdad completa de 32 bytes pasa las dos"  # @src=71fea5fecc3a
      check:                      # quiz
        questions:
          q1:
            # | You wrote `#[account(owner = expected @ MyOwnerError)] pub acct: Account<T>`
            # | expecting MyOwnerError on a bad owner, but the caller sees a different
            # | error. Why?
            prompt: "Escribiste `#[account(owner = expected @ MyOwnerError)] pub acct: Account<T>` esperando MyOwnerError sobre un dueño malo, pero quien llama ve un error distinto. ¿Por qué?"  # @src=cdd22c90cd0d
            # | For Account<T>, owner and discriminator verification happens inside load,
            # | ahead of the constraint hooks, so a wrong owner short-circuits to
            # | ProgramError::IllegalOwner and your `@ MyOwnerError` never fires. If you
            # | need the custom error, take an UncheckedAccount and assert the owner
            # | explicitly. The `@ MyErr` spelling is not gone in V2; it simply cannot win a
            # | race it never enters, because the framework refuses to hand you a typed `T`
            # | it has not first verified is a `T`. Those two load-time checks are
            # | structural, not hooks, which is exactly why UncheckedAccount (no load-time
            # | owner check) is the type that lets you supply your own error.
            explanation: "Para Account<T>, la verificación de dueño y de discriminador pasa adentro de load, por delante de los hooks de constraint, así que un dueño equivocado cortocircuita hacia ProgramError::IllegalOwner y tu `@ MyOwnerError` nunca dispara. Si necesitas el error personalizado, toma un UncheckedAccount y afirma el dueño explícitamente. La forma de escribirlo `@ MyErr` no desapareció en V2; simplemente no puede ganar una carrera en la que nunca entra, porque el framework se niega a entregarte un `T` tipado que no verificó primero que sea un `T`. Esas dos verificaciones de tiempo de carga son estructurales, no hooks, que es exactamente por qué UncheckedAccount (sin verificación de dueño en tiempo de carga) es el tipo que te deja proveer tu propio error."  # @src=21159d1ddc4a
            options:                 # source order — keep it
              b:
                # | `load` runs the owner and discriminator checks before any constraint
                # | hook, so `ProgramError::IllegalOwner` is returned first.
                label: "`load` corre las verificaciones de dueño y de discriminador antes que cualquier hook de constraint, así que se devuelve primero `ProgramError::IllegalOwner`."  # @src=f30994bd1204
                # | Your annotation is intact. It just never enters a race it could not
                # | start, because a typed wrapper is never handed over unverified, and
                # | stripping the type leaves no gate in front at all.
                feedback: "Tu anotación está intacta. Solo que nunca entra en una carrera que no podía arrancar, porque un wrapper tipado nunca se entrega sin verificar, y sacarle el tipo no deja ninguna barrera adelante, para nada."  # @src=0a1a374d0cc8
              d:
                # | The Solana runtime rejects an account your program does not own before
                # | the instruction even starts, so in practice no hook runs.
                label: "El runtime de Solana rechaza una cuenta de la que tu programa no es dueño antes de que la instrucción siquiera arranque, así que en la práctica no corre ningún hook."  # @src=ef231133f680
                # | Programs are handed accounts they do not own on every call, which is how
                # | a token account or a vault from another program ever reaches your
                # | handler at all. Nothing pre-screens ownership for you. The check that
                # | fired is Anchor's own, inside `load`, and it fired because a typed
                # | wrapper is never handed over unverified.
                feedback: "A los programas se les entregan cuentas de las que no son dueños en cada llamada, que es la única forma en que una cuenta de token o un vault de otro programa llega a tu handler. Nada prefiltra al dueño por ti. La verificación que disparó es la propia de Anchor, adentro de `load`, y disparó porque un wrapper tipado nunca se entrega sin verificar."  # @src=a973f5b3f1c1
              c:
                # | `Account<T>` ignores an explicit `owner` constraint, since the
                # | declaring-program owner is already implied by the typed wrapper.
                label: "`Account<T>` ignora un constraint `owner` explícito, ya que el wrapper tipado ya implica al dueño del programa declarante."  # @src=e02a40adb5e9
                # | The owner genuinely is checked, just inside `load`, ahead of your hook,
                # | which is why you get `IllegalOwner`. Put the same `owner = X @ MyErr` on
                # | an `UncheckedAccount` and the hook becomes the only owner check, so it
                # | carries your error.
                feedback: "El dueño genuinamente se verifica, solo que adentro de `load`, por delante de tu hook, que es por qué recibes `IllegalOwner`. Pon el mismo `owner = X @ MyErr` sobre un `UncheckedAccount` y el hook pasa a ser la única verificación de dueño, así que lleva tu error."  # @src=59226122c9e8
              a:
                # | The `@` custom-error form was removed in V2, so `address = ... @ MyErr`
                # | is now the only constraint that carries one.
                label: "La forma `@` de error personalizado se sacó en V2, así que `address = ... @ MyErr` ahora es el único constraint que lleva uno."  # @src=1e4951ff7854
                # | The `@` form still exists in V2 and still works on `owner`; it was not
                # | narrowed to `address`. The problem is ordering: `load` rejects the
                # | account before any hook carrying your error gets to run.
                feedback: "La forma `@` sigue existiendo en V2 y sigue funcionando sobre `owner`; no se angostó a `address`. El problema es el orden: `load` rechaza la cuenta antes de que llegue a correr cualquier hook que lleve tu error."  # @src=7a4820b89350
          q2:
            # | Your escrow uses an `UncheckedAccount` for the payout destination. What must
            # | accompany it so it is not an exploit?
            prompt: "Tu escrow usa un `UncheckedAccount` para el destino del pago. ¿Qué lo tiene que acompañar para que no sea un exploit?"  # @src=eb135be5ce0f
            # | UncheckedAccount opts out of all framework validation, so you must pair it
            # | with an explicit `address = ...`, `owner = ...`, or `constraint = ...`.
            # | Without one, an attacker substitutes their own account, the
            # | account-substitution class no compiler in any framework can catch for you.
            # | Pinning with `address = escrow.maker` is strictly stronger than `owner =
            # | ...`: owner admits any account from that program, address admits exactly the
            # | one the escrow recorded. Reach for owner only when any account from that
