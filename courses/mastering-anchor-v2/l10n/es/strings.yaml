                feedback: "Lo que presentas es lo que se reconstruye en una dirección: el prefijo literal y el byte de bump del final cargan el mismo peso. Orden equivocado, elemento que falta, de cualquier forma obtienes otra dirección y una negativa."  # @src=87b838879750
