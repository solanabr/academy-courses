                feedback: "Están firmemente en el catálogo, solo no en ESTE curso: Digital Assets es dueño de la interfaz de transfer hook y Client-Side Mastery es dueño del aterrizaje de tx. La frontera es una entrega a un hermano nombrado, no una omisión del currículo."  # @src=470f2d141c67
