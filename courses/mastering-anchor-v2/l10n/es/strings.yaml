                # | to refresh is a method you delete.
                feedback: "El borrow se sienta sobre el wrapper tipado mismo, así que una invocación viva y una copia desactualizada no pueden solaparse en el tiempo — y un método al que no le queda nada que refrescar es un método que borras."  # @src=eb0a15c3ec37
