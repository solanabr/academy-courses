      check:                      # quiz
        questions:
          m09-l1-q1:
            # | In your native rebuild you added `if data[0] != VAULT_DISCRIMINATOR { return
            # | Err(...) }` inside TryFrom. Anchor V2 wrote that check for you. What did
            # | that one line replace, and why can't you drop it?
            prompt: "En tu reconstrucción nativa agregaste `if data[0] != VAULT_DISCRIMINATOR { return Err(...) }` adentro del TryFrom. Anchor V2 escribía esa verificación por ti. ¿Qué reemplazó esa única línea, y por qué no puedes soltarla?"  # @src=303ef9265544
            # | The discriminator is the account's type tag. Anchor generates the check that
            # | the tag matches the expected type before it hands you typed data; strip the
            # | framework and you must write that check yourself, or you have re-opened the
            # | type-cosplay class of bug. Concretely: if some other instruction in your
            # | program creates a 34-byte program-owned account for an unrelated purpose — a
            # | scoreboard row, say — the owner check (gate 2) passes because your program
            # | genuinely owns it, and the length check (gate 3) passes because it is 34
            # | bytes. Only `cfg[0] != VAULT_DISCRIMINATOR` stops those bytes from being
            # | read as an authority and a stored bump. (In this program the later
            # | signer-match gate happens to contain the damage — a usable row must name the
            # | signer, whose own vault she could already drain — but that containment is a
            # | coincidence of this seed scheme; the discriminator is what keeps it from
            # | being load-bearing.)
            explanation: "El discriminator es la etiqueta de tipo de la cuenta. Anchor genera la verificación de que la etiqueta coincide con el tipo esperado antes de entregarte datos tipados; desmonta el framework y tienes que escribir esa verificación tú mismo, o volviste a abrir la clase de bug de type cosplay. Concretamente: si alguna otra instrucción de tu programa crea una cuenta propiedad del programa de 34 bytes para un propósito sin relación — una fila del marcador, digamos — la verificación de dueño (barrera 2) pasa porque tu programa genuinamente es su dueño, y la verificación de largo (barrera 3) pasa porque tiene 34 bytes. Solo `cfg[0] != VAULT_DISCRIMINATOR` impide que esos bytes se lean como una authority y un bump guardado. (En este programa la barrera posterior de coincidencia de firmante por casualidad contiene el daño — una fila usable tiene que nombrar a quien firma, cuyo propio vault ya podía drenar — pero esa contención es una coincidencia de este esquema de seeds; el discriminator es lo que impide que sea estructural.)"  # @src=75f8e5ebc08b
            options:                 # source order — keep it
              a:
                # | It replaced the PDA re-derivation that `bump = vault.bump` performed;
                # | without it invoke_signed signs with an uncanonical bump.
                label: "Reemplazó la re-derivación del PDA que hacía `bump = vault.bump`; sin ella invoke_signed firma con un bump no canónico."  # @src=34e5d3302168
                # | The PDA address is confirmed by the seed set you hand to invoke_signed,
                # | not by byte 0 of the config. The discriminator tags the account's type,
                # | not its derivation.
                feedback: "La dirección del PDA la confirma el conjunto de seeds que le entregas a invoke_signed, no el byte 0 del config. El discriminator etiqueta el tipo de la cuenta, no su derivación."  # @src=2fea18571759
              c:
                # | It replaced the framework's account-type check; without it another
                # | program-owned account of the same length can be read as a vault config.
                label: "Reemplazó la verificación de tipo de cuenta del framework; sin ella otra cuenta propiedad del programa del mismo largo puede leerse como un config de vault."  # @src=4548d19e9938
                # | The ownership check passes — your program really did create that other
                # | account — and length passes by coincidence. One byte of type tag is all
                # | that stands between those bytes and a bad read.
                feedback: "La verificación de propiedad pasa — tu programa de verdad creó esa otra cuenta — y el largo pasa por coincidencia. Un byte de etiqueta de tipo es todo lo que hay entre esos bytes y una lectura mala."  # @src=0f0ce9b2e7c5
              b:
                # | It replaced the data-length check; without it a short config account
                # | causes an out-of-bounds read on the `cfg[1..33]` authority slice.
                label: "Reemplazó la verificación de largo de datos; sin ella una cuenta de config corta causa una lectura fuera de límites en el slice de authority `cfg[1..33]`."  # @src=f33fa29a8915
                # | Length and type are separate gates: gate 3 is `cfg.len() != CONFIG_LEN`,
                # | gate 4 is `cfg[0] != VAULT_DISCRIMINATOR`. A full-length account of the
                # | wrong type clears the length gate and is stopped only by the
                # | discriminator.
                feedback: "Largo y tipo son barreras separadas: la barrera 3 es `cfg.len() != CONFIG_LEN`, la barrera 4 es `cfg[0] != VAULT_DISCRIMINATOR`. Una cuenta de largo completo del tipo equivocado pasa la barrera de largo y la detiene solo el discriminator."  # @src=d7e5eeba0a92
              d:
