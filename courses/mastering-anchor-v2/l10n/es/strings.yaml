                feedback: "Una clave exacta le gana a un id de programa, que admite cada cuenta de la que ese programa resulta ser dueño, y la forma más amplia solo está bien donde cualquiera de ellas genuinamente sirviera en ese slot."  # @src=3cdbfb06b86b
              d:
                # | Type it as `Account<T>` instead, so the framework's own owner and
                # | discriminator checks pin the account.
                label: "Tiparlo como `Account<T>` en vez de eso, así las verificaciones propias de dueño y de discriminador del framework fijan la cuenta."  # @src=c308752b7399
                # | A typed wrapper pins the shape and the owning program, never the
