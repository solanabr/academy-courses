            prompt: "Tu withdraw nativo mueve lamports fuera del PDA de vault. Anchor guardaba ese bump canónico por ti y lo leía de vuelta a través de `bump = vault.bump`; en pinocchio le pasas las seeds a invoke_signed tú mismo. ¿Qué conjunto de seeds firma correctamente?"  # @src=092028d56e93
            # | A PDA signs by presenting the exact seeds it was derived from plus its
