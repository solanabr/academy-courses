          m10-l4-q2:
            # | The project's own benchmarks page says 'this version is alpha and exact
            # | values can move,' and a PR once revised the headline numbers DOWN from
            # | 95%/9.9x to 94%/8.8x. What is the right way to carry those figures into a
            # | decision?
            prompt: "La propia página de benchmarks del proyecto dice 'this version is alpha and exact values can move', y un PR una vez revisó los números del titular A LA BAJA de 95%/9.9x a 94%/8.8x. ¿Cuál es la forma correcta de cargar esas cifras hacia una decisión?"  # @src=4c94fe9936ee
            # | PR #4914 revised the headline claims down from 95%/9.9x to 94%/8.8x, and the
            # | page itself warns the values can move as codegen and pinocchio change. That
            # | self-correction is a credibility signal, not a weakness -- so the figures
            # | belong in a decision as caveated, re-verifiable directional evidence, never
            # | as a frozen boast. Unpacking the correct option: 'directional' means the
            # | defensible claim is 'V2 is dramatically leaner,' not any fixed multiplier;
            # | 'alpha-caveated' means you state that the values can still move; and
            # | 're-verify at decision time' means you go read the current benchmark page
            # | when the call is actually being made rather than quoting a number you
            # | memorized months earlier.
            explanation: "El PR #4914 revisó las afirmaciones del titular a la baja de 95%/9.9x a 94%/8.8x, y la página misma advierte que los valores pueden moverse a medida que cambian la generación de código y pinocchio. Esa auto-corrección es una señal de credibilidad, no una debilidad -- así que las cifras pertenecen a una decisión como evidencia direccional con reservas y re-verificable, nunca como un alardeo congelado. Desempacando la opción correcta: 'direccional' quiere decir que la afirmación defendible es 'V2 es dramáticamente más flaco', no un multiplicador fijo; 'con reservas de alpha' quiere decir que declaras que los valores todavía pueden moverse; y 're-verificar al momento de la decisión' quiere decir que vas a leer la página de benchmark actual cuando la decisión se esté tomando de verdad en vez de citar un número que memorizaste meses antes."  # @src=127d9551cdff
            options:                 # source order — keep it
              d:
                # | Treat 94% and 8.8x as a conservative floor, since a project that revises
                # | its own numbers down usually leaves margin.
                label: "Trata 94% y 8.8x como un piso conservador, ya que un proyecto que revisa sus propios números a la baja normalmente deja margen."  # @src=8915f2d9d2b8
                # | One correction downward says the measurement got more careful, not that
                # | the true figures sit above it. The page's own warning cuts both ways as
                # | codegen and the pinocchio runtime move, which is why the honest carry is
                # | directional plus a re-read at decision time.
                feedback: "Una corrección a la baja dice que la medición se volvió más cuidadosa, no que las cifras verdaderas quedan por encima de ella. La propia advertencia de la página corta para los dos lados a medida que se mueven la generación de código y el runtime pinocchio, que es por lo que la carga honesta es direccional más una re-lectura al momento de la decisión."  # @src=7cda42f8e3e3
              c:
                # | Drop the numbers from the decision entirely; benchmarks taken on alpha
                # | codegen over a moving pinocchio runtime cannot support any claim.
                label: "Deja de lado los números de la decisión por completo; benchmarks tomados sobre generación de código alpha encima de un runtime pinocchio en movimiento no pueden sostener ninguna afirmación."  # @src=e9178fb87d80
                # | A moving benchmark is still evidence of direction, and the maintainers
                # | revising their own boast downward makes it more trustworthy, not
                # | worthless. The right move is to carry the figures WITH the caveat, not
                # | to discard the strongest measured argument V2 has.
                feedback: "Un benchmark en movimiento sigue siendo evidencia de dirección, y los mantenedores revisando su propio alardeo a la baja lo vuelve más confiable, no sin valor. La jugada correcta es cargar las cifras CON la reserva, no descartar el argumento medido más fuerte que tiene V2."  # @src=8deede47094b
              b:
                # | Quote the pre-revision 95%/9.9x figures -- PR #4914 trimmed them by
                # | about a point, so the bigger numbers still argue the case fairly.
                label: "Cita las cifras pre-revisión de 95%/9.9x -- el PR #4914 las recortó en como un punto, así que los números más grandes todavía argumentan el caso de forma justa."  # @src=af1e7d7bdaeb
                # | PR #4914 superseded those numbers; reaching back for them because they
                # | read better is exactly the dishonesty the maintainers' own
                # | self-correction guards against. Cite the current 94%/8.8x figures and
                # | carry the caveat that they can move as codegen and pinocchio change.
                feedback: "El PR #4914 reemplazó esos números; volver atrás a buscarlos porque se leen mejor es exactamente la deshonestidad contra la que protege la auto-corrección de los propios mantenedores. Cita las cifras actuales de 94%/8.8x y carga la reserva de que pueden moverse a medida que cambian la generación de código y pinocchio."  # @src=dcdc4f546060
              a:
                # | Cite them as directional, alpha-caveated evidence that V2 is leaner, and
                # | re-verify the current figures at decision time.
                label: "Cítalas como evidencia direccional, con reservas de alpha, de que V2 es más flaco, y re-verifica las cifras actuales al momento de la decisión."  # @src=300cbd7b7053
                # | The awkward part is doing this in a document: a slide with 8.8x on it
                # | outlives the decision it was written for, so the caveat has to travel in
                # | the same sentence as the number, every time.
                feedback: "La parte incómoda es hacer esto en un documento: un slide con 8.8x sobrevive a la decisión para la que se escribió, así que la reserva tiene que viajar en la misma frase que el número, todas las veces."  # @src=2b5c46fb24f9
          m10-l4-q3:
            # | A reader finishing this course wants to add a Token-2022 transfer hook and,
            # | separately, tune priority fees so their transactions land. Where does this
            # | course send them, and why?
            prompt: "Un lector que termina este curso quiere agregar un transfer hook de Token-2022 y, por separado, ajustar tarifas de prioridad para que sus transacciones aterricen. ¿A dónde lo manda este curso, y por qué?"  # @src=1409ddd5cc65
            # | This course owns the framework layer and refuses two things by design:
            # | token/NFT standards depth (the transfer-hook interface belongs to the
            # | Digital Assets course, which walks it end to end) and client tx-landing /
            # | priority-fee science (the Client-Side Mastery course). The conclusion routes
            # | readers to the sibling that owns each -- the boundary map is a set of
            # | handoffs, not gaps. Behind the crisp routing sits the fourth misreading from
            # | this lesson: a topic this course skipped is not a topic that does not
            # | matter. Digital Assets walks the whole Token-2022 standard, and Client-Side
            # | Mastery teaches priority fees, Jito bundles, DEX aggregation, and DAS
            # | indexing -- each better than a bolted-on chapter here ever could.
            explanation: "Este curso es dueño de la capa de framework y rechaza dos cosas por diseño: profundidad de estándares de token/NFT (la interfaz de transfer hook le pertenece al curso de Digital Assets, que la recorre de punta a punta) y aterrizaje de tx del cliente / ciencia de tarifas de prioridad (el curso de Client-Side Mastery). La conclusión rutea a los lectores al hermano que es dueño de cada una -- el mapa de frontera es un conjunto de entregas, no de huecos. Detrás del ruteo seco está la cuarta lectura equivocada de esta lección: un tema que este curso se salteó no es un tema que no importa. Digital Assets recorre el estándar Token-2022 entero, y Client-Side Mastery enseña tarifas de prioridad, bundles de Jito, agregación de DEX e indexación DAS -- cada uno mejor de lo que jamás podría un capítulo atornillado acá."  # @src=c995d60264c3
            options:                 # source order — keep it
              c:
                # | Transfer hooks to the Digital Assets course; priority fees and
                # | tx-landing to the Client-Side course. This course owns the framework
                # | layer.
                label: "Transfer hooks al curso de Digital Assets; tarifas de prioridad y aterrizaje de tx al curso de Client-Side. Este curso es dueño de la capa de framework."  # @src=3e231d2dcbd2
                # | A handoff names the sibling that owns the topic end to end, which is not
                # | at all the same as the topic not mattering. One walks the token standard
                # | in full; the other gets transactions landed.
                feedback: "Una entrega nombra al hermano que es dueño del tema de punta a punta, que no es para nada lo mismo que el tema no importar. Uno recorre el estándar de token por completo; el otro hace que las transacciones aterricen."  # @src=674ba3471a39
              a:
                # | Both are covered here -- m05 walks the Token-2022 transfer-hook
                # | interface end to end, and m06 covers priority fees and transaction
                # | landing.
                label: "Los dos están cubiertos acá -- m05 recorre la interfaz de transfer hook de Token-2022 de punta a punta, y m06 cubre tarifas de prioridad y aterrizaje de transacciones."  # @src=8e72202cb29e
                # | m05 touches Token-2022 only from the program's seat and explicitly hands
                # | the transfer-hook interface to the Digital Assets course; there is no
                # | priority-fee module at all, because this course refuses client-side
                # | tx-landing entirely. Neither topic is owned here.
                feedback: "m05 toca Token-2022 solo desde el asiento del programa y explícitamente entrega la interfaz de transfer hook al curso de Digital Assets; no hay ningún módulo de tarifas de prioridad, porque este curso rechaza por completo el aterrizaje de tx del lado del cliente. Ninguno de los dos temas es propiedad de acá."  # @src=552149f6b275
              d:
                # | Transfer hooks to the Digital Assets course; priority fees and
                # | tx-landing to DeFi and RWA Engineering, which owns the real venue
                # | mechanics.
                label: "Transfer hooks al curso de Digital Assets; tarifas de prioridad y aterrizaje de tx a DeFi y RWA Engineering, que es dueño de la mecánica de venues de verdad."  # @src=14936cde8384
                # | Half right, and the half that is wrong costs you the reading list. DeFi
                # | and RWA owns protocol and venue design past the toy swap; what gets a
                # | transaction confirmed under load (fees, retries, bundles) is the
                # | Client-Side course's whole subject.
                feedback: "Medio correcto, y la mitad que está mal te cuesta la lista de lectura. DeFi y RWA es dueño del diseño de protocolo y de venues más allá del swap de juguete; lo que hace que una transacción se confirme bajo carga (tarifas, reintentos, bundles) es el asunto entero del curso de Client-Side."  # @src=1d3c9894d1cf
              b:
                # | Nowhere in the catalog -- transfer hooks and priority-fee science fall
