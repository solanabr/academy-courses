                # | a migration target. The v1 zero-copy role moves to `Account<T>`, while
                # | the `AccountLoader` name is repurposed.
                feedback: "`LazyAccount` es solo de v1 y no tiene ninguna ortografía en V2, así que no puede ser un destino de migración. El rol zero-copy de v1 se mueve a `Account<T>`, mientras que el nombre `AccountLoader` se repropone."  # @src=323e938cc9ab
              a:
                # | Because `AccountLoader` became the default V2 wrapper once zero-copy
                # | became the default model; rewrite every `Account<T>` in the port as
                # | `AccountLoader<T>`.
                label: "Porque `AccountLoader` se volvió el wrapper default de V2 una vez que zero-copy se volvió el modelo default; reescribe cada `Account<T>` del port como `AccountLoader<T>`."  # @src=e4fbf1804a83
                # | Zero-copy did become the default, but the default wrapper is
                # | `Account<T>` -- that is what carries the `T: Pod` view now.
                # | `AccountLoader` is a different, repurposed type in V2.
                feedback: "Zero-copy sí se volvió el default, pero el wrapper default es `Account<T>` -- eso es lo que carga la vista `T: Pod` ahora. `AccountLoader` es un tipo distinto y repropuesto en V2."  # @src=3cbe9b33c26e
              d:
                # | Because `AccountLoader` is deprecated rather than removed in V2, so it
                # | still loads zero-copy accounts until a later RC drops it.
                label: "Porque `AccountLoader` está deprecado en vez de removido en V2, así que todavía carga cuentas zero-copy hasta que una RC posterior lo saque."  # @src=d2647352618f
                # | That reading is the dangerous half of the false friend: same name, same
                # | assumed job, no warning. The zero-copy load moved to `Account<T>`, and
                # | what still answers to `AccountLoader` walks accounts in sequence
                # | instead.
                feedback: "Esa lectura es la mitad peligrosa del falso amigo: el mismo nombre, el mismo trabajo asumido, ninguna advertencia. La carga zero-copy se mudó a `Account<T>`, y lo que todavía responde a `AccountLoader` recorre cuentas en secuencia en cambio."  # @src=157e247e4353
  m10-l3:
    # | Migration capstone: port a 0.31/1.0 program to V2
    title: "Capstone de migración: porta un programa 0.31/1.0 a V2"  # @src=9a3f51e52473
    blocks:
      check:                      # quiz
        questions:
          m10-l3-q1:
            # | Your port compiles locally with `anchor build` and you assume it is
            # | V2-ready. Then it emits none of the V2 deprecations and behaves nothing like
            # | V2. What actually went wrong?
            prompt: "Tu port compila localmente con `anchor build` y asumes que está listo para V2. Después no emite ninguna de las deprecaciones de V2 y no se comporta en nada como V2. ¿Qué salió mal de verdad?"  # @src=265f2ee24408
            # | The framework major is selected by the `anchor-lang` dependency in
            # | Cargo.toml, and cargo resolves it identically under either CLI wrapper. The
            # | handed vault compiles on 1.x because it pins 1.x; leave that row alone and
            # | every build is a v1 build, whichever anchor-cli is on PATH — and once the
            # | row reads 2.0.0-rc.1, the deprecation warnings and the missing-method error
            # | appear under the old CLI too, because they come from the macros in the
            # | dependency graph. That is why step 1 of the port is a manifest edit before
            # | it is an install. The isolated, pinned RC CLI still matters — scaffolds, the
            # | test harness, and IDL handling ride the CLI line — but it is not what your
            # | compiled program behaves like. Two things that control nothing here:
            # | `CARGO_PROFILE_RELEASE_LTO=off` (a macOS build workaround) and any type name
            # | in your handlers. The switch that does control it sits in your source tree
            # | as a version row, which is exactly what m10-l1's recon (`rg
            # | "anchor_version|anchor-lang"`) taught you to read first.
            explanation: "El major del framework lo selecciona la dependencia `anchor-lang` del Cargo.toml, y cargo lo resuelve idénticamente bajo cualquiera de los dos wrappers de CLI. El vault entregado compila en 1.x porque fija 1.x; deja esa fila en paz y cada build es un build de v1, sin importar qué anchor-cli esté en el PATH — y una vez que la fila lee 2.0.0-rc.1, las advertencias de deprecación y el error de método que falta aparecen bajo el CLI viejo también, porque vienen de las macros del grafo de dependencias. Por eso el paso 1 del port es una edición de manifiesto antes de ser una instalación. El CLI de la RC aislado y fijado igual importa — los scaffolds, el banco de pruebas y el manejo de IDL viajan en la línea del CLI — pero no es a lo que se parece tu programa compilado. Dos cosas que no controlan nada acá: `CARGO_PROFILE_RELEASE_LTO=off` (un rodeo de build de macOS) y cualquier nombre de tipo de tus handlers. La llave que sí lo controla está en tu árbol de código como una fila de versión, que es exactamente lo que el reconocimiento de m10-l1 (`rg \"anchor_version|anchor-lang\"`) te enseñó a leer primero."  # @src=16a73f23c909
            options:                 # source order — keep it
              c:
                # | The `anchor-lang` pin in the program's `Cargo.toml` is still on the 1.x
                # | line — the dependency graph, not the CLI on your PATH, selects the
                # | framework major.
                label: "El pin de `anchor-lang` del `Cargo.toml` del programa sigue en la línea 1.x — el grafo de dependencias, no el CLI de tu PATH, selecciona el major del framework."  # @src=cbf154aac8b7
                # | Cargo resolves the crate graph identically under either CLI wrapper, so
                # | a 1.x pin builds a v1 artifact no matter which anchor-cli ran — and once
                # | the row reads 2.0.0-rc.1, even the old CLI surfaces the V2 deprecations
                # | and the missing-method error, because they come from the macros in the
                # | graph. m10-l1's recon grepped for exactly this row.
                feedback: "Cargo resuelve el grafo de crates idénticamente bajo cualquiera de los dos wrappers de CLI, así que un pin de 1.x construye un artefacto de v1 no importa qué anchor-cli corrió — y una vez que la fila lee 2.0.0-rc.1, hasta el CLI viejo saca a la superficie las deprecaciones de V2 y el error de método que falta, porque vienen de las macros del grafo. El reconocimiento de m10-l1 grepeó exactamente por esta fila."  # @src=855d5cde8a8d
              a:
                # | You omitted `CARGO_PROFILE_RELEASE_LTO=off` from the cargo install, so
                # | the CLI fell back to building the program with v1 codegen semantics.
                label: "Omitiste `CARGO_PROFILE_RELEASE_LTO=off` del cargo install, así que el CLI cayó de vuelta a construir el programa con semántica de generación de código de v1."  # @src=fdefb1c1b6fe
                # | `CARGO_PROFILE_RELEASE_LTO=off` is only a macOS workaround for the
                # | release build blowing up; it is not a version switch of any kind. What
                # | selects the framework line is the `anchor-lang` row in Cargo.toml.
                feedback: "`CARGO_PROFILE_RELEASE_LTO=off` es solo un rodeo de macOS para que el build de release no explote; no es ninguna clase de llave de versión. Lo que selecciona la línea del framework es la fila de `anchor-lang` del Cargo.toml."  # @src=ad560f110b17
              d:
                # | The `[toolchain]` block in `Anchor.toml` still names an `anchor_version`
                # | on the 1.x line, and it is that row, not the manifest, that the build
                # | resolves against.
                label: "El bloque `[toolchain]` del `Anchor.toml` sigue nombrando un `anchor_version` de la línea 1.x, y es esa fila, no el manifiesto, contra la que resuelve el build."  # @src=5fc3686cdf92
                # | That block steers the wrapper, the same job the CLI does: which binary
                # | runs, which harness scaffolds. Cargo never reads it when resolving your
                # | crate graph, so the framework you compile against is still whatever the
                # | `anchor-lang` row in Cargo.toml says.
                feedback: "Ese bloque guía al wrapper, el mismo trabajo que hace el CLI: qué binario corre, qué banco hace scaffold. Cargo nunca lo lee al resolver tu grafo de crates, así que el framework contra el que compilas sigue siendo lo que diga la fila de `anchor-lang` del Cargo.toml."  # @src=c49ec2e07941
              b:
                # | You compiled with the machine's ambient `anchor-cli 1.1.2` instead of
                # | the pinned V2 RC CLI, and the old binary silently built the old
                # | framework.
                label: "Compilaste con el `anchor-cli 1.1.2` ambiente de la máquina en vez del CLI de la RC V2 fijado, y el binario viejo calladamente construyó el framework viejo."  # @src=f70fa89a95e1
                # | The tempting answer — but `anchor build` is a wrapper, and which binary
                # | shelled out to cargo does not change which `anchor-lang` the graph
                # | resolves. An unflipped pin misbehaves identically under both CLIs, and a
                # | flipped pin surfaces the V2 diagnostics under both. The isolated CLI
                # | earns its keep on scaffold, test-harness, and IDL behavior — not as the
                # | major-version switch.
                feedback: "La respuesta tentadora — pero `anchor build` es un wrapper, y qué binario llamó a cargo no cambia qué `anchor-lang` resuelve el grafo. Un pin sin dar vuelta se porta mal idénticamente bajo los dos CLI, y un pin dado vuelta saca a la superficie los diagnósticos de V2 bajo los dos. El CLI aislado se gana su lugar en el comportamiento de scaffold, de banco de pruebas y de IDL — no como la llave de versión major."  # @src=6dfc5ba0a7ce
          m10-l3-q2:
            # | Mid-port, `cargo build` succeeds but prints a deprecation warning
            # | underlining `has_one` in a constraint you copied over. The test would still
            # | pass. Why resolve it anyway?
            prompt: "A mitad del port, `cargo build` tiene éxito pero imprime una advertencia de deprecación que subraya `has_one` en un constraint que copiaste. La prueba igual pasaría. ¿Por qué resolverlo de todos modos?"  # @src=7090b62399c1
            # | The has_one deprecation warning is the framework driving the migration: V2
            # | wants `address = parent.field`, and the parser stores the has_one span
            # | precisely so codegen can underline it. On an RC that is still changing,
            # | resolving deprecations to zero is how you keep the port building against the
            # | next version -- the warning is a checklist item, not noise. Concretely, the
            # | warning names its own replacement: move the check onto the sibling account
            # | as `#[account(address = state.authority)]`, then rebuild until the
            # | deprecation count is zero. Note also what the warning does not do — it never
            # | fails the build or the LiteSVM suite, and `has_one` keeps performing its
            # | equality check today, so the only thing pushing you to edit is the migration
            # | checklist itself.
            explanation: "La advertencia de deprecación de has_one es el framework manejando la migración: V2 quiere `address = parent.field`, y el parser guarda el span del has_one precisamente para que la generación de código pueda subrayarlo. Sobre una RC que sigue cambiando, resolver las deprecaciones hasta cero es cómo mantienes el port compilando contra la próxima versión -- la advertencia es un ítem de checklist, no ruido. Concretamente, la advertencia nombra su propio reemplazo: mueve la verificación a la cuenta hermana como `#[account(address = state.authority)]`, y después recompila hasta que el conteo de deprecaciones sea cero. Nota también lo que la advertencia no hace — nunca hace fallar el build ni la suite de LiteSVM, y `has_one` sigue haciendo su verificación de igualdad hoy, así que la única cosa que te empuja a editar es el propio checklist de migración."  # @src=4f7513fa65d6
            options:                 # source order — keep it
              d:
                # | Because `address = state.authority` adds a signer check that `has_one`
                # | skipped, so the rename closes a hole rather than restating one.
                label: "Porque `address = state.authority` agrega una verificación de firmante que `has_one` se salteaba, así que el rename cierra un agujero en vez de volver a enunciar uno."  # @src=46d48dfefc40
                # | `address` swaps the equality test and nothing else. The signer
                # | requirement was always declared separately, by the field's own `Signer`
                # | type, and it stays exactly where it was on both spellings.
                feedback: "`address` cambia el test de igualdad y nada más. El requisito de firmante siempre se declaró por separado, por el propio tipo `Signer` del campo, y se queda exactamente donde estaba en las dos escrituras."  # @src=c885eae3eebb
              a:
                # | Because `has_one` is deprecated in favor of `address = parent.field`,
                # | and on a moving RC deprecated syntax is what a later tag is most likely
                # | to remove.
                label: "Porque `has_one` está deprecado a favor de `address = parent.field`, y sobre una RC en movimiento la sintaxis deprecada es lo que un tag posterior tiene más probabilidad de sacar."  # @src=955de89079e3
                # | Mechanical, because the compiler spells out the replacement for you:
                # | shift the check onto the sibling and rebuild until nothing is
                # | underlined. Nothing fails today; the pressure is entirely about how long
                # | the port keeps building.
                feedback: "Mecánico, porque el compilador te escribe el reemplazo por completo: corre la verificación a la hermana y recompila hasta que nada esté subrayado. Nada falla hoy; la presión es enteramente sobre cuánto tiempo el port sigue compilando."  # @src=48dd821a1952
              c:
                # | Because in V2 `has_one` still parses but no longer emits the equality
                # | check, so the authority comparison is silently skipped at runtime.
                label: "Porque en V2 `has_one` todavía parsea pero ya no emite la verificación de igualdad, así que la comparación de authority se saltea calladamente en runtime."  # @src=b45f87343e98
                # | `has_one` still parses AND still performs the equality check in V2 — it
                # | is deprecated, not broken, which is exactly why the test passes. The
                # | reason to replace it is that a moving RC is likely to delete deprecated
                # | syntax.
                feedback: "`has_one` todavía parsea Y todavía hace la verificación de igualdad en V2 — está deprecado, no roto, que es exactamente por lo que la prueba pasa. La razón para reemplazarlo es que una RC en movimiento probablemente borre la sintaxis deprecada."  # @src=6bdd1e906a83
              b:
                # | Because `anchor test` promotes deprecation warnings to hard errors under
                # | V2's default profile, so the LiteSVM suite cannot go green until the
                # | warning is gone.
                label: "Porque `anchor test` promueve las advertencias de deprecación a errores duros bajo el profile default de V2, así que la suite de LiteSVM no puede ponerse verde hasta que la advertencia desaparezca."  # @src=90f113ba6997
                # | `anchor test` does not promote deprecation warnings to errors — the
                # | prompt itself says the test still passes. You resolve it for migration
                # | durability, not because it blocks the gate.
                feedback: "`anchor test` no promueve las advertencias de deprecación a errores — el propio enunciado dice que la prueba igual pasa. Lo resuelves por durabilidad de migración, no porque bloquee la barrera."  # @src=8925f3a896d5
          m10-l3-q3:
            # | You copy a v1 pattern that reads `vault.amount` right after a CPI that moved
            # | lamports, then calls `vault.reload()`. The V2 build fails. What does letting
            # | the compiler drive tell you to do?
            prompt: "Copias un patrón de v1 que lee `vault.amount` justo después de una CPI que movió lamports, y después llama `vault.reload()`. El build de V2 falla. ¿Qué te dice hacer dejar que el compilador maneje?"  # @src=a1ddd6e9d2d4
            # | V2 has no `.reload()`, and two things put it out of a job. Nothing changes
            # | underneath a loaded typed account without your say-so, so there is nothing
            # | for a re-deserialize call to re-read. And while a `CpiContext` is alive, the
            # | compiler holds one borrow per account handed to that CPI — so typed access
            # | to *those* accounts, the vault included here, will not compile. That is why
            # | (c) is the durable habit: delete the reload, keep the vault's typed data out
            # | of the CPI's span, and take a fresh borrow after the call. Be precise about
            # | what the build actually prints, though. On the copied v1 tail it is exactly
            # | one error, E0599 (no method named `reload`), which says delete that line.
            # | The lock falls on precisely the accounts the CPI can change and nothing
            # | wider, so a read of a disjoint account — this lab's `state` — compiles right
            # | beside it. You do still lift the scalars you need, the state address and the
            # | vault bump, into locals before you build the `CpiContext`, but for a plainer
            # | reason than a borrow error: `seeds` borrows `state_key`, so that local has
            # | to outlive the call that uses the signer.
            explanation: "V2 no tiene `.reload()`, y dos cosas lo dejan sin trabajo. Nada cambia debajo de una cuenta tipada cargada sin tu palabra, así que no hay nada que una llamada de re-deserializar pueda re-leer. Y mientras un `CpiContext` está vivo, el compilador sostiene un borrow por cuenta entregada a esa CPI — así que el acceso tipado a *esas* cuentas, el vault incluido acá, no va a compilar. Por eso (c) es el hábito durable: borra el reload, mantén los datos tipados del vault fuera del span de la CPI, y toma un borrow fresco después de la llamada. Sé preciso sobre lo que el build de verdad imprime, igual. Sobre la cola de v1 copiada es exactamente un error, E0599 (ningún método llamado `reload`), que dice que borres esa línea. El candado cae precisamente sobre las cuentas que la CPI puede cambiar y nada más ancho, así que una lectura de una cuenta disjunta — el `state` de este lab — compila justo al lado. Igual levantas los escalares que necesitas, la dirección de state y el bump del vault, hacia locales antes de armar el `CpiContext`, pero por una razón más simple que un error de borrow: `seeds` toma prestado `state_key`, así que ese local tiene que sobrevivir a la llamada que usa el firmante."  # @src=683336202519
            options:                 # source order — keep it
              d:
                # | Keep the read and hand-roll the refresh, re-decoding the vault from its
                # | AccountInfo where `.reload()` used to sit.
                label: "Mantén la lectura y haz el refresh a mano, re-decodificando el vault desde su AccountInfo donde estaba `.reload()`."  # @src=9f0fb15eef75
                # | There is nothing to refresh into. Once the call returns and its handles
                # | drop, the typed view is reading current bytes already, so a hand-rolled
                # | re-decode is the same work the removed method was doing pointlessly.
                feedback: "No hay nada hacia lo que hacer refresh. Una vez que la llamada retorna y sus handles se caen, la vista tipada ya está leyendo bytes actuales, así que un re-decode hecho a mano es el mismo trabajo que el método removido estaba haciendo sin sentido."  # @src=7bf58b345af6
              a:
                # | Add `unsafe(dup)` to the vault's `#[account(...)]` constraint, since
                # | that opt-out relaxes V2's account borrow checking for reads taken around
                # | a CPI.
                label: "Agrega `unsafe(dup)` al constraint `#[account(...)]` del vault, ya que ese opt-out relaja la verificación de borrow de cuentas de V2 para lecturas tomadas alrededor de una CPI."  # @src=71141b021aac
                # | `unsafe(dup)` is the opt-out for duplicate mutable accounts, and it is
                # | enforced at validation before your handler ever runs. It has nothing to
                # | do with a borrow held across a live `CpiContext` and will not clear this
                # | error.
                feedback: "`unsafe(dup)` es el opt-out para cuentas mutables duplicadas, y se impone en la validación antes de que tu handler siquiera corra. No tiene nada que ver con un borrow sostenido a través de un `CpiContext` vivo y no va a limpiar este error."  # @src=37ec9feb90c2
              c:
                # | Remove the `.reload()` call and restructure so no typed access to the
                # | vault is held while the `CpiContext` holds its borrow.
                label: "Saca la llamada a `.reload()` y reestructura para que ningún acceso tipado al vault quede sostenido mientras el `CpiContext` sostiene su borrow."  # @src=57eca4f47720
                # | One diagnostic comes back — E0599, a method that no longer exists — and
                # | that is the whole instruction for what to delete. The borrow only covers
                # | accounts you handed the call, so a disjoint read still builds.
                feedback: "Vuelve un diagnóstico — E0599, un método que ya no existe — y esa es la instrucción entera de qué borrar. El borrow cubre solo cuentas que le entregaste a la llamada, así que una lectura disjunta igual compila."  # @src=96e08263c240
              b:
                # | Re-enable `.reload()` through the `anchor-lang` compat feature and call
                # | it after `system_program::transfer` exactly as the v1 code did.
                label: "Vuelve a habilitar `.reload()` a través de la feature de compat de `anchor-lang` y llámalo después de `system_program::transfer` exactamente como lo hacía el código de v1."  # @src=452577a9ceb5
                # | There is no compat feature that restores `.reload()` — V2 removed the
                # | method outright. A loaded typed account cannot go out of date behind
                # | your back, and while a CPI holds a handle to one, typed access to it
                # | will not compile, so the stale read `.reload()` patched cannot be
                # | written in the first place.
                feedback: "No existe ninguna feature de compat que restaure `.reload()` — V2 sacó el método de entrada. Una cuenta tipada cargada no puede quedar desactualizada a tus espaldas, y mientras una CPI sostiene un handle a una, el acceso tipado a ella no va a compilar, así que la lectura obsoleta que parchaba `.reload()` no se puede escribir para empezar."  # @src=f1a5dc62be7b
  m10-l4:
    # | Conclusion: what you built, and should you move to V2 today?
    title: "Conclusión: qué construiste, y ¿deberías moverte a V2 hoy?"  # @src=e43ef7b7c545
    blocks:
      check:                      # quiz
        questions:
          m10-l4-q1:
            # | A team runs a live lending protocol holding user funds on a 1.1.2 Anchor
            # | build and asks whether to migrate to V2 now for the CU savings. Using the
            # | decision tree, what is the honest routing?
            prompt: "Un equipo corre un protocolo de lending vivo que sostiene fondos de usuario sobre un build 1.1.2 de Anchor y pregunta si migrar a V2 ahora por el ahorro de CU. Usando el árbol de decisión, ¿cuál es el ruteo honesto?"  # @src=52d5e819d65b
            # | The decision tree routes a live, value-at-risk protocol away from same-day
            # | V2 adoption: V2 labels itself both 'rc' and 'alpha,' the docs say it is not
            # | audited, and no RC->stable date is committed, while the v1 line (1.1.2) is
            # | still maintained. The CU win is real but does not outweigh putting user
            # | funds on unaudited alpha; the honest move is to wait for stability and an
            # | audit. Note that the correct option is a routing, not an argument: the
            # | reasoning behind it is that value-at-risk should not move onto code labeled
            # | both rc and alpha, and the two signals worth watching are precisely a
            # | committed stable date and a published audit -- neither the CU number nor a
            # | deploy trick substitutes for them. Waiting here is not stagnating, because
            # | the 1.1.2 line keeps shipping fixes and tracking the runtime underneath you.
            explanation: "El árbol de decisión rutea un protocolo vivo con valor en riesgo lejos de la adopción de V2 el mismo día: V2 se etiqueta a sí mismo tanto de 'rc' como de 'alpha', la documentación dice que no está auditado, y ninguna fecha de RC->estable está comprometida, mientras la línea v1 (1.1.2) sigue mantenida. La ganancia de CU es real pero no compensa poner fondos de usuario sobre alpha no auditado; la jugada honesta es esperar estabilidad y una auditoría. Nota que la opción correcta es un ruteo, no un argumento: el razonamiento detrás de ella es que el valor en riesgo no debería moverse a código etiquetado tanto de rc como de alpha, y las dos señales que vale vigilar son precisamente una fecha estable comprometida y una auditoría publicada -- ni el número de CU ni un truco de deploy las sustituyen. Esperar acá no es estancarse, porque la línea 1.1.2 sigue entregando arreglos y siguiéndole el paso al runtime que tienes debajo."  # @src=85d2c9f6bfa6
            options:                 # source order — keep it
              c:
                # | Stay on the maintained 1.1.2 line and watch for a committed stable date
                # | and a published audit before moving value onto V2.
                label: "Quédate en la línea 1.1.2 mantenida y vigila una fecha estable comprometida y una auditoría publicada antes de mover valor hacia V2."  # @src=16c8eb6f925c
                # | Waiting isn't stagnating — the maintained line goes on absorbing fixes
                # | and runtime churn on your behalf, so the wait costs you close to
                # | nothing. What you are watching for is two specific signals, not a vibe.
                feedback: "Esperar no es estancarse — la línea mantenida sigue absorbiendo arreglos y el vaivén del runtime en tu nombre, así que la espera te cuesta casi nada. Lo que estás vigilando son dos señales específicas, no una sensación."  # @src=49f01656f749
              b:
                # | Rewrite on V2 in a branch and ship it to mainnet behind a feature flag,
                # | so the 1.1.2 path stays live and V2 traffic can be rolled back
                # | instantly.
                label: "Reescribe en V2 en una rama y entrégalo a mainnet detrás de un feature flag, para que el camino 1.1.2 siga vivo y el tráfico de V2 se pueda revertir al instante."  # @src=cfecab37f37e
                # | A feature flag buys you a rollback switch, not an audit. Every
                # | transaction the flag routes to V2 still executes unaudited alpha code
                # | against real user funds, and a rollback only helps after the loss is
                # | visible. The flag hides the audit/stable-date risk rather than resolving
                # | it.
                feedback: "Un feature flag te compra un interruptor de rollback, no una auditoría. Cada transacción que el flag rutea a V2 sigue ejecutando código alpha no auditado contra fondos reales de usuario, y un rollback solo ayuda después de que la pérdida es visible. El flag esconde el riesgo de auditoría y de fecha estable en vez de resolverlo."  # @src=862d103ced8c
              a:
                # | Migrate immediately -- the ~94% bytecode drop and ~8.8x CU win, plus
                # | compile-time removal of the stale-after-CPI class, outweigh process
                # | concerns.
                label: "Migra de inmediato -- la caída de ~94% en bytecode y la ganancia de ~8.8x en CU, más la remoción en tiempo de compilación de la clase de obsoleto-después-de-CPI, compensan las preocupaciones de proceso."  # @src=abc2ba2c1299
                # | Those wins are real, but they sit on a different axis from readiness:
                # | the benchmarks are alpha-caveated and self-revised-down, and the code is
                # | an unaudited RC with no committed stable date. Speed argues for your
                # | next greenfield build, not for moving user funds this quarter.
                feedback: "Esas ganancias son reales, pero se apoyan en un eje distinto del de estar listo: los benchmarks tienen reservas de alpha y fueron auto-revisados a la baja, y el código es una RC no auditada sin fecha estable comprometida. La velocidad argumenta por tu próximo build greenfield, no por mover fondos de usuario este trimestre."  # @src=b7c1d9dae7c7
              d:
                # | Start the port now on the assumption the stable tag is close, since an
