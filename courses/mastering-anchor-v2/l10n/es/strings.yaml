                label: "En ningún lado del catálogo -- transfer hooks y ciencia de tarifas de prioridad caen fuera del currículo entero, así que los dos te mandan a documentación externa."  # @src=abd8826a5422
                # | They are firmly in the catalog, just not in THIS course: Digital Assets
                # | owns the transfer-hook interface and Client-Side Mastery owns
