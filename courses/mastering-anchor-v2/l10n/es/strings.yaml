            explanation: "Anchor 1.0 cambió `CpiContext::new` para que tome el programa como un `Pubkey` (#2762). El runtime identifica un programa por su dirección, así que pasar la clave en vez de un AccountInfo entero saca un handle redundante y es la forma sobre la que después construye V2. La motivación más profunda es el angostamiento de tipos: el `AccountInfo` gordo te dejaba entregarle al constructor una cuenta que no era el programa para nada y diferir el desajuste a una falla de runtime, mientras un argumento `Pubkey` convierte esa clase de error en un error de compilación seco. Viajando junto a eso, el `transfer` simple está deprecado a favor de `transfer_checked`, así que la edición mecánica son dos jugadas: `.to_account_info()` -> `.key()`, y agregar el mint más los decimals. (El modelo de borrow de `CpiHandle` es un cambio separado y posterior de 2.0 -- no confundas los dos deltas.)"  # @src=db438302d2ea
