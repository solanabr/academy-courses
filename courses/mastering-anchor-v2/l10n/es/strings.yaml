                label: "Nada: en V2 el comentario de doc `/// CHECK:` que exige el compilador es lo que valida un `UncheckedAccount`."  # @src=aeae73bc1572
                # | The `/// CHECK:` comment is a lint requirement that forces you to
                # | document the risk in writing; nothing reads it at runtime.
                # | `UncheckedAccount` still performs no owner, discriminator, or identity
                # | check.
                feedback: "El comentario `/// CHECK:` es un requisito de lint que te obliga a documentar el riesgo por escrito; nada lo lee en tiempo de ejecución. `UncheckedAccount` sigue sin hacer ninguna verificación de dueño, de discriminador ni de identidad."  # @src=d6f4a94fe02a
              b:
                # | Only a `mut` marker, so the runtime marks the account writable and
