            explanation: "V2 deja a init_if_needed sin feature gate y le agrega validación de reúso sobre espacio, dueño y discriminador. Eso cierra los trucos de reinit más crudos, pero el framework no puede juzgar si reinicializar ESTA cuenta es semánticamente válido, así que un bug de reinit-sobre-estado-vivo sobrevive, así que ponle una guarda. Concretamente: las seis feature flags de la release no incluyen `init-if-needed`, y esas cuentas están plegadas dentro de la verificación de duplicate-mutable desde #4239, y aun así tienes que verificar una flag guardada o un campo distinto de cero antes de dejar correr la rama `init` y rechazar cuando la cuenta ya está viva."  # @src=57816081f7c2
            options:                 # source order — keep it
              a:
                # | V2 ships it ungated with reuse-validation, but a re-init over live state
                # | is still your bug to guard.
                label: "V2 lo entrega sin feature gate con validación de reúso, pero un re-init sobre estado vivo sigue siendo tu bug para ponerle una guarda."  # @src=e21aa7822612
                # | The structural side is solid and has been folded into the duplicate
                # | check for several releases now. Semantics are what is left over, and no
                # | framework can supply them; only your program knows that credit is
                # | somebody's money.
                feedback: "El lado estructural es sólido y hace ya varios releases que está plegado dentro de la verificación de duplicados. La semántica es lo que sobra, y ningún framework la puede proveer; solo tu programa sabe que ese credit es la plata de alguien."  # @src=f29f9e33736b
              b:
                # | It is gated behind an `init-if-needed` feature flag exactly as in v1.
                label: "Está detrás de un feature flag `init-if-needed` exactamente como en v1."  # @src=ac8336206cbe
                # | V2 ships six feature flags, `alloc`, `guardrails`, `idl-build`,
                # | `compat`, `const-rent` and `testing`, and `init-if-needed` is not among
                # | them. It is ungated, and the residual risk is a re-initialization logic
                # | bug, not flipping a flag.
                feedback: "V2 entrega seis feature flags, `alloc`, `guardrails`, `idl-build`, `compat`, `const-rent` y `testing`, y `init-if-needed` no está entre ellos. No tiene feature gate, y el riesgo residual es un bug de lógica de reinicialización, no dar vuelta una flag."  # @src=71aef39f74f7
              c:
                # | Reuse-validation covers space, owner, and discriminator, so reinit is
                # | impossible.
                label: "La validación de reúso cubre espacio, dueño y discriminador, así que el reinit es imposible."  # @src=56f12ad62c14
                # | Those three checks are structural and they do close the crudest reinit
                # | tricks, but they cannot judge business intent: overwriting a funded
                # | escrow back to zeros passes space, owner, and discriminator alike.
                feedback: "Esas tres verificaciones son estructurales y sí cierran los trucos de reinit más crudos, pero no pueden juzgar la intención de negocio: sobrescribir un escrow fondeado de vuelta a ceros pasa espacio, dueño y discriminador por igual."  # @src=6335fc6936d2
              d:
                # | V2 ships it ungated because the duplicate-mutable check now covers
                # | reinit, so no extra guard is needed.
                label: "V2 lo entrega sin feature gate porque la verificación de duplicate-mutable ahora cubre el reinit, así que no hace falta ninguna guarda extra."  # @src=963c54ea63ee
                # | Those accounts really have been folded into the duplicate-mutable check
                # | since #4239, and that is a different question from this one.
                # | Duplicate-mutable catches one account arriving in two writable slots.
                # | Nothing in it can tell that the account you are about to re-initialize
                # | is holding somebody's money.
                feedback: "Esas cuentas de verdad están plegadas dentro de la verificación de duplicate-mutable desde #4239, y esa es una pregunta distinta de esta. Duplicate-mutable atrapa una cuenta llegando en dos slots escribibles. Nada adentro de eso puede decir que la cuenta que estás por reinicializar sostiene la plata de alguien."  # @src=af3611a5de8a
          q4:
            # | You patched the escrow withdraw with `balance - amount` plus an authority
            # | equality check, but a fuzz seed where amount > balance still misbehaves. The
            # | real fix is:
            prompt: "Parcheaste el withdraw del escrow con `balance - amount` más una verificación de igualdad de autoridad, pero una semilla de fuzz donde amount > balance igual se porta mal. El arreglo de verdad es:"  # @src=b700565a3ed7
            # | Access control answers 'who,' but the over-withdraw is an arithmetic bug:
            # | unsigned subtraction underflows (wraps in release, panics in debug).
            # | checked_sub returns None on underflow so you can reject the withdrawal, and
            # | the coding challenge for this lesson is exactly this patch plus the
            # | authority check. Note that the only correct outcome is a rejection, not a
            # | wrap and not a panic: Anchor's generated workspace sets `overflow-checks =
            # | true` on the release profile, so an untouched scaffold panics rather than
            # | wraps, but that is one Cargo edit away, and a guard that holds only because
            # | of a profile setting is not a guard.
            explanation: "El control de acceso responde 'quién,' pero el over-withdraw es un bug aritmético: la resta sin signo hace underflow (hace wrap en release, entra en panic en debug). checked_sub devuelve None en el underflow así que puedes rechazar el withdrawal, y el Challenge de código de esta lección es exactamente este parche más la verificación de autoridad. Fíjate que el único resultado correcto es un rechazo, ni un wrap ni un panic: el workspace que genera Anchor pone `overflow-checks = true` sobre el perfil de release, así que un scaffold sin tocar entra en panic en vez de hacer wrap, pero eso está a una edición de Cargo de distancia, y una guarda que se sostiene solo por un ajuste de perfil no es una guarda."  # @src=f35f898953f1
            options:                 # source order — keep it
              b:
                # | Use `checked_sub` and turn the `None` case into an error so the
                # | over-withdraw is rejected.
                label: "Usa `checked_sub` y convierte el caso `None` en un error así el over-withdraw queda rechazado."  # @src=74d79a01be15
                # | Rejection is the only acceptable outcome, and a panic only looks safer
                # | than a wrap; today's scaffold panics, but that's one Cargo line from
                # | wrapping. A profile setting was never the guard.
                feedback: "El rechazo es el único resultado aceptable, y un panic solo parece más seguro que un wrap; el scaffold de hoy entra en panic, pero eso está a una línea de Cargo de hacer wrap. Un ajuste de perfil nunca fue la guarda."  # @src=4a1cc537cb48
              d:
                # | Use `saturating_sub` so the balance floors at zero instead of wrapping
                # | below it.
                label: "Usa `saturating_sub` así el balance toca piso en cero en vez de hacer wrap por debajo."  # @src=70429f03b8ee
                # | It stops the wrap and it still settles the withdraw. The vault hands
                # | over more than the ledger said it had, then records a balance of zero,
                # | and nothing anywhere returns an error. Rejection is the only correct
                # | outcome here, which is what makes `checked_sub` plus a real error the
                # | fix rather than any arithmetic that quietly succeeds.
                feedback: "Detiene el wrap y liquida el withdraw igual. El vault entrega más de lo que el libro mayor decía que tenía, después registra un balance de cero, y nada en ninguna parte devuelve un error. El rechazo es el único resultado correcto acá, que es lo que hace del `checked_sub` más un error de verdad el arreglo, en vez de cualquier aritmética que tenga éxito calladamente."  # @src=9046621ce6df
              a:
                # | Add a second required `Signer` to `Withdraw` so no single caller moves
                # | funds out alone.
                label: "Agrega un segundo `Signer` requerido a `Withdraw` así quien llama no mueve fondos hacia afuera solo."  # @src=f004faaa4573
                # | Multisig is more access control, and you already pinned the caller with
                # | the authority check. The failing seed is arithmetic: a perfectly
                # | authorized player asking for more than the vault holds.
                feedback: "El multisig es más control de acceso, y ya fijaste a quien llama con la verificación de autoridad. La semilla que falla es aritmética: un jugador perfectamente autorizado pidiendo más de lo que el vault sostiene."  # @src=1f6723e40343
              c:
                # | Widen the `balance` field to `u128` in the Pod account so the
                # | subtraction has enough headroom.
                label: "Ensancha el campo `balance` a `u128` en la cuenta Pod así la resta tiene suficiente margen."  # @src=6ff3f64222ac
                # | Headroom guards overflow, not underflow: every unsigned type wraps below
                # | zero, so `u128` produces a colossal bogus balance exactly as `u64` does.
                # | Only a checked operation rejects the case.
                feedback: "El margen protege contra el overflow, no contra el underflow: todo tipo sin signo hace wrap por debajo de cero, así que `u128` produce un balance falso colosal exactamente igual que `u64`. Solo una operación verificada rechaza el caso."  # @src=d0e5f2963af1
  m07-l3:
    # | The audit checklist as a lab; fuzz as the assessment
    title: "La checklist de auditoría como lab; el fuzz como la evaluación"  # @src=0135e8a534d1
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | After hours of clean runs, `anchor fuzz` reports a crash on your swap. In
            # | this lesson's framing, what does that mean?
            prompt: "Después de horas de corridas limpias, `anchor fuzz` reporta un crash en tu swap. En el encuadre de esta lección, ¿qué quiere decir eso?"  # @src=abe21fc5dba6
            # | In this course, a green fuzz case = you broke it: anchor fuzz (Crucible,
            # | LibAFL/LiteSVM with sBPF edge coverage) surfaced an input that violates an
            # | invariant. Replay the crash artifact, fix the bug, and re-fuzz: a crash is a
            # | success of the process. The order is load-bearing: crash, replay, patch,
            # | re-fuzz. Patch first and you throw away the artifact that proved the bug was
            # | real and deterministic.
            explanation: "En este curso, un caso de fuzz verde = lo rompiste: anchor fuzz (Crucible, LibAFL/LiteSVM con cobertura de aristas sBPF) hizo aflorar un input que viola un invariante. Repite el artefacto de crash, arregla el bug, y vuelve a fuzzear: un crash es un éxito del proceso. El orden es estructural: crash, repetición, parche, re-fuzz. Parchea primero y tiras el artefacto que demostró que el bug era real y determinista."  # @src=ebba094a96e0
            options:                 # source order — keep it
              d:
                # | The chain reached a state your setup did not intend, so the fixture
                # | usually needs a reseed and a re-run.
                label: "La cadena llegó a un estado que tu setup no pretendía, así que la fixture normalmente necesita un resembrado y una nueva corrida."  # @src=1b558652c41c
                # | A state the fuzzer chained its way into out of otherwise-valid calls is
                # | a reachable state, and reachable is the only bar that matters: the
                # | attacker gets the same calls you gave the harness. Deep states are what
                # | `--stateful` exists to produce, not a fixture defect to reseed away.
                feedback: "Un estado al que el fuzzer se encadenó a partir de llamadas por lo demás válidas es un estado alcanzable, y alcanzable es el único criterio que importa: el atacante recibe las mismas llamadas que le diste al banco de pruebas. Los estados profundos son para lo que existe `--stateful`, no un defecto de la fixture que te saques de encima resembrando."  # @src=0e60610c6eb7
              c:
                # | You broke it: the fuzzer found a concrete input for which your
                # | invariants do not hold.
                label: "Lo rompiste: el fuzzer encontró un input concreto para el que tus invariantes no se sostienen."  # @src=680e6d0d65d5
                # | Order matters as much as the finding: keep the artifact, replay it, and
                # | patch after. Go the other way and you have thrown out the one thing
                # | proving the input was real and repeatable.
                feedback: "El orden importa tanto como el hallazgo: guarda el artefacto, repítelo, y parchea después. Ve al revés y tiraste lo único que demostraba que el input era real y repetible."  # @src=00c4edb6916d
              b:
                # | sBPF edge coverage was still climbing, so the crash is a false positive
                # | from a half-explored branch.
                label: "La cobertura de aristas sBPF todavía estaba subiendo, así que el crash es un falso positivo de una rama explorada a medias."  # @src=a3df9a0887c5
                # | A crash artifact is a concrete failing input sequence you can replay;
                # | low coverage means you have not explored enough of the program yet, not
                # | that the crash you already have is fake.
                feedback: "Un artefacto de crash es una secuencia de inputs concreta que falla y que puedes repetir; una cobertura baja quiere decir que todavía no exploraste suficiente del programa, no que el crash que ya tienes sea falso."  # @src=8d5c6bc55477
              a:
                # | Crucible's LibAFL mutator produced a malformed input; re-run the
                # | campaign until it comes back clean.
                label: "El mutador LibAFL de Crucible produjo un input malformado; vuelve a correr la campaña hasta que vuelva limpia."  # @src=aba3917d52bf
                # | Crucible saves the failing sequence as a crash artifact and replays it
                # | deterministically with `--replay`, so a reproducible crash is a finding,
                # | not mutator noise, and that is the entire point of running it.
                feedback: "Crucible guarda la secuencia que falla como un artefacto de crash y la repite de forma determinista con `--replay`, así que un crash reproducible es un hallazgo, no ruido del mutador, y ese es el punto entero de correrlo."  # @src=22339c9cb34e
          q2:
            # | A teammate on an Anchor master build runs `anchor fuzz`. Which tool actually
            # | runs under the hood?
            prompt: "Un compañero de equipo sobre un build master de Anchor corre `anchor fuzz`. ¿Qué herramienta corre de verdad debajo del capó?"  # @src=36faf32d554c
            # | anchor fuzz is Crucible (crucible-fuzz-cli), embedded in the CLI, using a
            # | LibAFL/LiteSVM backend with sBPF edge coverage. Trident (Ackee) is a
            # | one-paragraph alternative that has not cut a stable release since 0.12.0
            # | (2025-11-27) and is still on 0.13.0 release candidates; it is not the
            # | default. Checked 2026-09-07: it is the V1 line's CLI, released as anchor-cli
            # | 1.2.0 on 2026-09-04, that pins `crucible-fuzz-cli = "0.2.1"` and dispatches
            # | `Command::Fuzz` into it, while the 2.0.0-rc.1 CLI ships `anchor coverage`
            # | and has no `fuzz` subcommand at all.
            explanation: "anchor fuzz es Crucible (crucible-fuzz-cli), embebido en el CLI, usando un backend LibAFL/LiteSVM con cobertura de aristas sBPF. Trident (Ackee) es una alternativa de un párrafo que no ha cortado un release estable desde 0.12.0 (2025-11-27) y sigue en release candidates de 0.13.0; no es el default. Verificado el 2026-09-07: es el CLI de la línea V1, publicado como anchor-cli 1.2.0 el 2026-09-04, el que fija `crucible-fuzz-cli = \"0.2.1\"` y despacha `Command::Fuzz` hacia él, mientras que el CLI 2.0.0-rc.1 entrega `anchor coverage` y no tiene ningún subcomando `fuzz`."  # @src=5e46a3c64b07
            options:                 # source order — keep it
              c:
                # | cargo-fuzz with libFuzzer, over a native (non-sBPF) build.
                label: "cargo-fuzz con libFuzzer, sobre un build nativo (no sBPF)."  # @src=d7260c035360
                # | anchor fuzz executes the compiled `.so` inside LiteSVM and traces sBPF
                # | edges; cargo-fuzz/libFuzzer would instrument a native host build, which
                # | is not the bytecode that runs on-chain.
                feedback: "anchor fuzz ejecuta el `.so` compilado adentro de LiteSVM y traza aristas sBPF; cargo-fuzz/libFuzzer instrumentaría un build nativo del host, que no es el bytecode que corre on-chain."  # @src=1ef1a6ab69d8
              b:
                # | Trident (Ackee), wired in as the default `fuzz` backend.
                label: "Trident (Ackee), cableado como el backend `fuzz` default."  # @src=31de3d4cf7bf
                # | Trident is a real, maintained alternative, but it is not the built-in
                # | path: its last stable is 0.12.0 from 2025-11-27, with the 0.13.0 line
                # | still on release candidates (rc.4, 2026-05-14), and Anchor wired
                # | Crucible into the CLI instead.
                feedback: "Trident es una alternativa real y mantenida, pero no es el camino incorporado: su último estable es 0.12.0 del 2025-11-27, con la línea 0.13.0 todavía en release candidates (rc.4, 2026-05-14), y Anchor cableó Crucible en el CLI en su lugar."  # @src=7fc987bd48ed
              e:
                # | A LibAFL engine driving a real solana-test-validator, for on-chain
                # | runtime fidelity.
                label: "Un motor LibAFL que maneja un solana-test-validator real, para fidelidad de runtime on-chain."  # @src=76f42457976c
                # | LibAFL is right and the runtime under it is not. Crucible drives LiteSVM
                # | in process, which is what makes a campaign of millions of iterations
                # | affordable and what lets it clone and keep whole program states in a
                # | pool. A real validator per iteration would cost more than the search is
                # | worth.
                feedback: "LibAFL está bien y el runtime debajo no. Crucible maneja LiteSVM en proceso, que es lo que hace que una campaña de millones de iteraciones salga barata y lo que le deja clonar y mantener estados enteros del programa en un pool. Un validador real por iteración costaría más de lo que vale la búsqueda."  # @src=3b2559b27e69
              a:
                # | Crucible (`crucible-fuzz-cli`), a LibAFL engine driving a LiteSVM
                # | runtime.
                label: "Crucible (`crucible-fuzz-cli`), un motor LibAFL que maneja un runtime LiteSVM."  # @src=779b1b25b834
                # | Verified 2026-08-22: that subcommand lives on master, which pins the
                # | crate at 0.2.1; the RC branch's CLI has no fuzz command at all.
                feedback: "Verificado el 2026-08-22: ese subcomando vive en master, que fija el crate en 0.2.1; el CLI de la rama RC no tiene ningún comando fuzz."  # @src=e09a082d1cf0
              d:
                # | Anchor's own fuzz engine, added to the CLI beside `anchor coverage` and
                # | `anchor debugger`.
                label: "El motor de fuzz propio de Anchor, agregado al CLI al lado de `anchor coverage` y `anchor debugger`."  # @src=6ad4d75d1c05
                # | The subcommand is Anchor's; the engine underneath is not. Crucible is
                # | built by Asymmetric Research and consumed as `crucible-fuzz-cli`, and
                # | the two CLI lines make the split visible: the V1 line's 1.2.0 pins
                # | Crucible and dispatches Fuzz into it, while the 2.0.0-rc.1 CLI is the
                # | one that ships `anchor coverage` and `anchor debugger` and has no fuzz
                # | subcommand at all.
                feedback: "El subcomando es de Anchor; el motor de abajo no. Crucible está construido por Asymmetric Research y se consume como `crucible-fuzz-cli`, y las dos líneas de CLI hacen visible la división: el 1.2.0 de la línea V1 fija Crucible y despacha Fuzz hacia él, mientras que el CLI 2.0.0-rc.1 es el que entrega `anchor coverage` y `anchor debugger` y no tiene ningún subcomando fuzz."  # @src=7ba69644bc9e
          q3:
            # | Your audit checklist passes and fuzzing is clean. A stakeholder asks 'so it
            # | is proven secure?' What is the grounded answer?
            prompt: "Tu checklist de auditoría pasa y el fuzzing está limpio. Un stakeholder pregunta '¿entonces está demostrado que es seguro?' ¿Cuál es la respuesta fundamentada?"  # @src=f191277f0d32
            # | Fuzzing found 4 correctness bugs in Anchor's OWN framework, which also
            # | carries Miri witnesses and Kani configs, and that record, not any hedging
            # | line in the project's docs (there is none; the README claims 'secure by
            # | default'), is why this course insists the defaults are no substitute for
            # | review. Testing and audit raise confidence; they never prove the absence of
            # | bugs. Of that toolchain only Miri (undefined behavior in unsafe code) and
            # | Kani (bounded model checking) make proof-shaped claims at all, and only
            # | about the narrow properties they model.
            explanation: "El fuzzing encontró 4 bugs de corrección en el framework PROPIO de Anchor, que además lleva testigos de Miri y configs de Kani, y ese historial, no una línea de advertencia en los docs del proyecto (no hay ninguna; el README afirma 'secure by default'), es por lo que este curso insiste en que los defaults no son sustituto de la revisión. Las pruebas y la auditoría suben la confianza; nunca demuestran la ausencia de bugs. De ese toolchain solo Miri (comportamiento indefinido en código unsafe) y Kani (model checking acotado) hacen siquiera afirmaciones con forma de demostración, y solo sobre las propiedades angostas que modelan."  # @src=09e78e062a62
            options:                 # source order — keep it
              d:
                # | Proven for the invariants you wrote, since a stateful run covers the
                # | reachable state space.
                label: "Demostrado para los invariantes que escribiste, ya que una corrida stateful cubre el espacio de estados alcanzable."  # @src=d02c8811ca01
                # | Stateful fuzzing reaches deeper than stateless, and reaching deeper is
                # | not the same as reaching everything: it keeps a coverage-keyed pool and
                # | grows chains toward whatever looks new, which narrows the gap without
                # | closing it. There is no run length that turns an average-case clean into
                # | a worst-case safe, for the invariants you wrote or any others.
                feedback: "El fuzzing stateful llega más profundo que el stateless, y llegar más profundo no es lo mismo que llegar a todo: mantiene un pool con clave de cobertura y hace crecer cadenas hacia lo que sea que parezca nuevo, lo que angosta la brecha sin cerrarla. No hay largo de corrida que convierta un limpio de caso promedio en un seguro de peor caso, ni para los invariantes que escribiste ni para ningún otro."  # @src=ec2a7cf1f6e3
              a:
                # | Yes: a clean stateful fuzz run plus a fully green checklist is a proof
                # | of correctness.
                label: "Sí: una corrida de fuzz stateful limpia más una checklist completamente verde es una demostración de corrección."  # @src=de25f1911eaa
                # | A clean run is an average-case statement over the inputs and sequences
                # | the fuzzer happened to explore in the time you gave it; the bug that
                # | ships is usually a worst-case corner the search never reached.
                feedback: "Una corrida limpia es una afirmación de caso promedio sobre los inputs y las secuencias que el fuzzer llegó a explorar en el tiempo que le diste; el bug que se entrega normalmente es un rincón de peor caso al que la búsqueda nunca llegó."  # @src=1b30e967dc5b
              c:
                # | Yes, once you also run Trident, whose Ackee harness adds proof-grade
                # | coverage of the state space.
                label: "Sí, una vez que además corras Trident, cuyo banco de pruebas de Ackee agrega cobertura con grado de demostración del espacio de estados."  # @src=2b942e0e59cc
                # | No fuzzer is proof-grade. Trident is coverage-guided testing exactly
                # | like Crucible, it is not even the built-in path, and running a second
                # | fuzzer would not turn testing into proof.
                feedback: "Ningún fuzzer tiene grado de demostración. Trident es prueba guiada por cobertura exactamente igual que Crucible, ni siquiera es el camino incorporado, y correr un segundo fuzzer no convertiría las pruebas en una demostración."  # @src=0596f1bd534a
              b:
                # | No: a clean run means 'not found yet', confidence and never proof.
                label: "No: una corrida limpia quiere decir 'no encontrado todavía', confianza y nunca demostración."  # @src=1e59a8122bf3
                # | The claim a clean campaign supports is average-case, over whatever the
                # | search reached in the time you gave it, and nothing more. Only the model
                # | checkers in that toolchain make proof-shaped claims, and only over
                # | narrow properties.
                feedback: "La afirmación que sostiene una campaña limpia es de caso promedio, sobre lo que sea que la búsqueda alcanzó en el tiempo que le diste, y nada más. Solo los model checkers de ese toolchain hacen afirmaciones con forma de demostración, y solo sobre propiedades angostas."  # @src=c9c3bb6f04ca
          q4:
            # | You want the fuzzer to explore state that only appears after several
            # | instructions run in sequence. Which run mode fits?
            prompt: "Quieres que el fuzzer explore estado que solo aparece después de que varias instrucciones corren en secuencia. ¿Qué modo de corrida calza?"  # @src=472397bd4e5d
            # | anchor fuzz run ... --stateful chains instructions so the fuzzer can reach
            # | states that only exist after a sequence of calls, the ones a single-shot run
            # | never sees. Coverage (LCOV) is a separate readout, not the mode.
            # | Mechanically: stateful keeps a coverage-indexed pool of live program states
            # | (`--pool-size`, default 256,000) and applies one mutated action per
            # | iteration to a state drawn from that pool, growing chains to `--max-depth`
            # | (default 15), while the stateless default clones the post-setup snapshot,
            # | runs a mutated sequence up to `--max-actions` (default 8), and discards it.
            explanation: "anchor fuzz run ... --stateful encadena instrucciones para que el fuzzer pueda alcanzar estados que solo existen después de una secuencia de llamadas, los que una corrida de un solo tiro nunca ve. La cobertura (LCOV) es una lectura aparte, no el modo. Mecánicamente: stateful mantiene un pool indexado por cobertura de estados vivos del programa (`--pool-size`, default 256,000) y aplica una acción mutada por iteración a un estado sacado de ese pool, haciendo crecer las cadenas hasta `--max-depth` (default 15), mientras que el default stateless clona la instantánea posterior al setup, corre una secuencia mutada hasta `--max-actions` (default 8), y la descarta."  # @src=4698734beb76
            options:                 # source order — keep it
              a:
                # | The stateless default is enough, since depth accrues across runs that
                # | restart from setup.
                label: "El default stateless alcanza, ya que la profundidad se acumula a lo largo de corridas que vuelven a arrancar desde el setup."  # @src=29a2fb4dcc28
                # | Stateless clones the post-setup snapshot every iteration and throws the
                # | world away afterwards, so nothing accrues: every attempt re-pays for the
                # | first steps and stops at `--max-actions` (default 8).
                feedback: "Stateless clona la instantánea posterior al setup en cada iteración y después tira el mundo a la basura, así que no se acumula nada: cada intento vuelve a pagar los primeros pasos y se detiene en `--max-actions` (default 8)."  # @src=0e9094471a17
              c:
                # | `anchor fuzz run` with `--stateful`, so mutated actions extend live
                # | states instead of restarting.
                label: "`anchor fuzz run` con `--stateful`, para que las acciones mutadas extiendan estados vivos en vez de volver a arrancar."  # @src=b60fa695c4f6
                # | It keeps a coverage-keyed pool of live states and applies one mutated
                # | action to a state drawn out of it, so chains deepen instead of
                # | resetting. Coverage is a readout; it was never a mode.
                feedback: "Mantiene un pool con clave de cobertura de estados vivos y aplica una acción mutada a un estado sacado de él, así que las cadenas se hacen más profundas en vez de reiniciarse. La cobertura es una lectura; nunca fue un modo."  # @src=7f953174e1ba
              d:
                # | `anchor fuzz run` with a larger `--pool-size`, since the pool size is
                # | what deepens the chains.
                label: "`anchor fuzz run` con un `--pool-size` más grande, ya que el tamaño del pool es lo que hace más profundas las cadenas."  # @src=16801b253bb6
                # | `--pool-size` describes the pool of live states that only exists in
                # | stateful mode, and it defaults to 256,000 already. Without the mode flag
                # | there is no pool to enlarge, and even inside it the knob that governs
                # | chain length is `--max-depth`. The mode is the decision; the sizes are
                # | tuning.
                feedback: "`--pool-size` describe el pool de estados vivos que solo existe en modo stateful, y ya viene en 256,000 por defecto. Sin la flag de modo no hay ningún pool que agrandar, y aun adentro de él la perilla que gobierna el largo de la cadena es `--max-depth`. El modo es la decisión; los tamaños son ajuste fino."  # @src=7e2354a8858f
              b:
                # | `anchor coverage`, since its LCOV export is what steers the fuzzer into
                # | deeper program states.
                label: "`anchor coverage`, ya que su export de LCOV es lo que dirige al fuzzer hacia estados más profundos del programa."  # @src=25b9c461f25b
                # | anchor coverage is a readout over `anchor test` traces, and fuzz
                # | coverage comes from `run --coverage`. Either way coverage is the map,
                # | not the vehicle; `--stateful` is what actually gets you there.
                feedback: "anchor coverage es una lectura sobre las trazas de `anchor test`, y la cobertura de fuzz sale de `run --coverage`. De cualquier manera la cobertura es el mapa, no el vehículo; `--stateful` es lo que de verdad te lleva ahí."  # @src=ccfb2204725f
  m08-l1:
    # | Ship a client: the IDL, Program Metadata, and a Codama/kit client
    title: "Entrega un cliente: el IDL, Program Metadata, y un cliente Codama/kit"  # @src=cb86eb39a49a
    blocks:
      wire-kit-swap-client:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The kit major comes from splPeer ('^7.0.0' -> 7), never from kitLatest.
          0: "El major de kit viene de splPeer ('^7.0.0' -> 7), nunca de kitLatest."  # @src=b8f8e1f857ac
          # | Don't rebuild the instruction — call the provided swapInstruction(owner,
          # | amountIn, minOut).
          1: "No vuelvas a armar la instrucción — llama al swapInstruction(owner, amountIn, minOut) provisto."  # @src=be1fed27e83e
        tests:                      # keyed by test case id
          t1:
            # | Subgoal 1: pin kit to the @solana-program peer major (^7.0.0 -> 7), not the
            # | latest kit (8.0.0)
            description: "Subobjetivo 1: fija kit al major de peer de @solana-program (^7.0.0 -> 7), no al kit latest (8.0.0)"  # @src=7aeaf16f9468
          t2:
            # | Subgoal 1 (robust): the pin follows splPeer even when a newer kit exists
            description: "Subobjetivo 1 (robusto): el pin sigue a splPeer incluso cuando existe un kit más nuevo"  # @src=e22e41e069b0
          t3:
            # | Subgoal 2: the fee payer is the owner
            description: "Subobjetivo 2: quien paga la tarifa es el owner"  # @src=369a09fefa83
          t4:
            # | Subgoal 3: the transaction lifetime is the recent blockhash
            description: "Subobjetivo 3: el lifetime de la transacción es el blockhash reciente"  # @src=9edef8518f59
          t5:
            # | Subgoal 4: exactly one instruction, the generated swap, with the owner
            # | signing first
            description: "Subobjetivo 4: exactamente una instrucción, el swap generado, con el owner firmando primero"  # @src=b4d5975bc9fd
          t6:
            # | Subgoal 4: the swap instruction carries both amountIn and the slippage floor
            # | minOut
            description: "Subobjetivo 4: la instrucción de swap lleva tanto amountIn como el piso de slippage minOut"  # @src=ee1e2a188dbd
          t7:
            # | Subgoal 4 (no hand-rolling): the instruction is the generated builder's —
            # | swap program id, four accounts, both vaults, the token program
            description: "Subobjetivo 4 (sin hacerlo a mano): la instrucción es la del builder generado — id de programa del swap, cuatro cuentas, los dos vaults, el token program"  # @src=ef8695a786ee
      check:                      # quiz
        questions:
          m08-l1-q1:
            # | You just generated the swap's kit client. Your package.json already has
            # | @solana-program/token@0.15.0 (which peers on ^7.0.0), and you're about to
            # | add @solana/kit. What do you pin?
            prompt: "Acabas de generar el cliente kit del swap. Tu package.json ya tiene @solana-program/token@0.15.0 (que hace peer sobre ^7.0.0), y estás a punto de agregar @solana/kit. ¿Qué fijas?"  # @src=bc7dda290d9f
            # | The durable rule (CF4): pin @solana/kit to the major your @solana-program
            # | dependencies declare, never to 'latest'. Today that major is 7, even though
            # | kit 8.0.0 is the newest published version.
            explanation: "La regla durable (CF4): fija @solana/kit al major que declaran tus dependencias de @solana-program, nunca a 'latest'. Hoy ese major es 7, aunque kit 8.0.0 sea la versión publicada más nueva."  # @src=0445c4cb4a9f
            options:                 # source order — keep it
              c:
                # | 'latest' so npm always resolves the newest kit for you
                label: "'latest', para que npm siempre te resuelva el kit más nuevo"  # @src=ee036fe5dceb
                # | 'latest' is exactly what the durable rule forbids: a kit major bump can
                # | break your peers overnight — kit 8 became latest the day it shipped.
                feedback: "'latest' es exactamente lo que prohíbe la regla durable: una subida de major de kit puede romper tus peers de la noche a la mañana — kit 8 se volvió latest el día en que se entregó."  # @src=82eb4f245879
              e:
                # | >=7, so npm can be trusted to move up once @solana-program does
                label: ">=7, para poder confiar en que npm suba una vez que @solana-program suba"  # @src=aba1e22884c8
                # | An open-ended range resolves to the newest version that satisfies it,
                # | which today is kit 8.0.0, so `>=7` hits the same ERESOLVE that pinning
                # | 'latest' does. Moving a major is a decision you take after checking that
                # | the peer ranges moved too.
                feedback: "Un rango abierto resuelve a la versión más nueva que lo satisface, que hoy es kit 8.0.0, así que `>=7` pega en el mismo ERESOLVE que pegar fijando 'latest'. Mover un major es una decisión que tomas después de verificar que los rangos de peer también se movieron."  # @src=6c0f9fc1d91a
              a:
                # | ^8 — pin the newest kit (8.0.0) so the client stays current
                label: "^8 — fija el kit más nuevo (8.0.0) para que el cliente se mantenga actual"  # @src=d9ebf0c7786a
                # | kit 8.0.0 is npm latest, but @solana-program/token 0.15.0 peers on
                # | @solana/kit ^7.0.0; pinning ^8 breaks the peer graph and the install
                # | fails.
                feedback: "kit 8.0.0 es el latest de npm, pero @solana-program/token 0.15.0 hace peer sobre @solana/kit ^7.0.0; fijar ^8 rompe el grafo de peers y la instalación falla."  # @src=b64164596e1c
              d:
                # | ^6, because one repo should settle on a single kit major
                label: "^6, porque un repositorio debería asentarse en un único major de kit"  # @src=c4845e486d4c
                # | The pin is a property of the workspace's dependency graph, not of the
                # | repository. Two workspaces in one repo legitimately pin different kit
                # | majors, because each one matches the peers its own dependencies declare.
                feedback: "El pin es una propiedad del grafo de dependencias del workspace, no del repositorio. Dos workspaces de un mismo repositorio legítimamente fijan majors de kit distintos, porque cada uno coincide con los peers que declaran sus propias dependencias."  # @src=8f5577a3f957
              b:
                # | ^7 — match the major your @solana-program deps peer on
                label: "^7 — coincide con el major sobre el que hacen peer tus deps de @solana-program"  # @src=6c4eef19d016
                # | Per workspace, not per repository: read the peer ranges your own
                # | dependencies declare and match that major. What npm calls latest has no
                # | bearing on whether the graph resolves.
                feedback: "Por workspace, no por repositorio: lee los rangos de peer que declaran tus propias dependencias y coincide con ese major. Lo que npm llama latest no tiene ninguna influencia sobre si el grafo resuelve."  # @src=4a2c446bbd3f
          m08-l1-q2:
            # | A teammate says 'skip Codama — just import @anchor-lang/core for the V2
            # | client.' What's actually wrong with that?
            prompt: "Un compañero dice 'sáltate Codama — solo importa @anchor-lang/core para el cliente V2'. ¿Qué está de verdad mal en eso?"  # @src=911ff694e482
            # | The honest TS state: no official V2 package exists. @anchor-lang/core (npm
            # | latest 1.1.2) is the v1-era client. The first-party path is anchor codama
            # | convert + generate -l js, which renders a typed @solana/kit client. Reaching
            # | for the package that looks official quietly pins you back to web3.js v1 —
            # | the exact SDK line V2 exists to move off of.
            explanation: "El estado honesto de TS: no existe ningún paquete V2 oficial. @anchor-lang/core (latest en npm 1.1.2) es el cliente de la era v1. El camino first-party es anchor codama convert + generate -l js, que renderiza un cliente @solana/kit tipado. Recurrir al paquete que parece oficial calladamente te fija de vuelta a web3.js v1 — la línea de SDK exacta de la que V2 existe para salir."  # @src=128dd00b3ae7
            options:                 # source order — keep it
              d:
                # | It just needs @solana/kit installed next to it, which is what moves
                # | 1.1.2 onto the kit line
                label: "Solo necesita @solana/kit instalado al lado, que es lo que mueve 1.1.2 a la línea de kit"  # @src=9703ce34dd8f
                # | Listing @solana/kit in your package.json does not change what
                # | @anchor-lang/core imports. At 1.1.2 it still pulls @solana/web3.js v1,
                # | so you would be shipping both SDK lines in one bundle rather than moving
                # | off one.
                feedback: "Listar @solana/kit en tu package.json no cambia lo que @anchor-lang/core importa. En 1.1.2 todavía tira @solana/web3.js v1, así que estarías entregando las dos líneas de SDK en un solo bundle en vez de salir de una."  # @src=4977fe05e5d6
              b:
                # | It works, but only inside a bundler; Node send scripts need the Codama
                # | client instead
                label: "Funciona, pero solo adentro de un bundler; los scripts de send de Node necesitan el cliente Codama en cambio"  # @src=fa9d70486ee3
                # | Runtime environment isn't the issue — @anchor-lang/core imports fine in
                # | a Node script. The problem is the SDK line underneath it: web3.js v1,
                # | not @solana/kit.
                feedback: "El entorno de runtime no es el problema — @anchor-lang/core importa bien en un script de Node. El problema es la línea de SDK que tiene debajo: web3.js v1, no @solana/kit."  # @src=267490ad42d1
              a:
                # | Nothing — @anchor-lang/core 1.1.2 is the official Anchor V2 client for
                # | @solana/kit
                label: "Nada — @anchor-lang/core 1.1.2 es el cliente oficial de Anchor V2 para @solana/kit"  # @src=2330a2ddd9fa
                # | @anchor-lang/core is real and official — it's the renamed successor to
                # | @coral-xyz/anchor — but npm latest 1.1.2 still depends on
                # | @solana/web3.js v1. It's the v1-era client wearing a new name, not a kit
                # | client.
                feedback: "@anchor-lang/core es real y oficial — es el sucesor renombrado de @coral-xyz/anchor — pero el latest de npm 1.1.2 todavía depende de @solana/web3.js v1. Es el cliente de la era v1 vistiendo un nombre nuevo, no un cliente de kit."  # @src=88e69edec533
              c:
                # | There's no official V2 TS package; @anchor-lang/core is still on the
                # | web3.js v1 line
                label: "No existe ningún paquete TS de V2 oficial; @anchor-lang/core sigue en la línea de web3.js v1"  # @src=ef459e851321
                # | Two steps through Codama — convert, then generate — and you have a typed
                # | kit client off your own IDL. Pick the package whose name looks official
                # | instead and you are quietly back on the SDK line the rewrite exists to
                # | leave.
                feedback: "Dos pasos a través de Codama — convert, y después generate — y tienes un cliente kit tipado salido de tu propio IDL. Elige el paquete cuyo nombre parece oficial en cambio y estás calladamente de vuelta en la línea de SDK de la que la reescritura existe para salir."  # @src=f5fbbca75ca2
          m08-l1-q3:
            # | You want any client — not just yours — to be able to read your program's
            # | interface on-chain. Which step does that?
            prompt: "Quieres que cualquier cliente — no solo el tuyo — pueda leer la interfaz de tu programa on-chain. ¿Qué paso hace eso?"  # @src=3f439749b9a6
            # | anchor idl init (and anchor idl upgrade for later edits) writes the IDL to
            # | the Program Metadata Program at the canonical [program, seed] PDA —
            # | permissionless to read, writable only by the program's upgrade authority —
            # | so any client can resolve your interface from the chain. Anchor removed its
            # | own built-in IDL instructions in 1.0 and V2 inherits that removal. The
            # | trade-off: the IDL account costs rent, and the on-chain copy is only as
            # | current as its last publish — which on this lab's `--no-idl` flow means your
            # | last `idl upgrade`, and on a plain `anchor deploy` means the deploy itself,
            # | because the RC uploads the IDL by default.
            explanation: "anchor idl init (y anchor idl upgrade para ediciones posteriores) escribe el IDL en el Program Metadata Program en el PDA canónico [program, seed] — sin permiso para leer, escribible solo por la autoridad de upgrade del programa — así que cualquier cliente puede resolver tu interfaz desde la cadena. Anchor sacó sus propias instrucciones de IDL incorporadas en 1.0 y V2 hereda esa remoción. El trade-off: la cuenta de IDL cuesta alquiler, y la copia on-chain es actual solo en la medida de su última publicación — que en el flujo de `--no-idl` de este lab quiere decir tu último `idl upgrade`, y en un `anchor deploy` simple quiere decir el deploy en sí, porque la RC sube el IDL por defecto."  # @src=488776745a22
            options:                 # source order — keep it
              b:
                # | Commit target/idl/token_ticket_swap.json and serve it from GitHub
                label: "Commitear target/idl/token_ticket_swap.json y servirlo desde GitHub"  # @src=0120caa1fe37
                # | A repo file only serves people who already have your repo — a wallet or
                # | explorer holding nothing but a program id can't resolve it. The Program
                # | Metadata Program stores the IDL at a canonical PDA any client derives
                # | from the program id alone.
                feedback: "Un archivo de repositorio sirve solo a la gente que ya tiene tu repositorio — una billetera o un explorador que sostiene nada más que un id de programa no puede resolverlo. El Program Metadata Program guarda el IDL en un PDA canónico que cualquier cliente deriva desde el id del programa solo."  # @src=39ef3507f405
              e:
                # | Run anchor idl init from any funded wallet, since Program Metadata
                # | writes are permissionless
                label: "Correr anchor idl init desde cualquier billetera fondeada, ya que las escrituras de Program Metadata son sin permiso"  # @src=7e0e719ba9e6
                # | Reading that account is permissionless; writing it is not. The Program
                # | Metadata entry is writable only by the program's upgrade authority, so
                # | signing with any other key fails on authority no matter how well funded
                # | it is.
                feedback: "Leer esa cuenta es sin permiso; escribirla no. La entrada de Program Metadata es escribible solo por la autoridad de upgrade del programa, así que firmar con cualquier otra clave falla en la autoridad no importa qué tan bien fondeada esté."  # @src=c478db2e7ec7
              d:
                # | Pass --no-idl to anchor deploy so the IDL ships with the program bytes
                label: "Pasar --no-idl a anchor deploy para que el IDL se entregue con los bytes del programa"  # @src=0ff0b7a27686
                # | --no-idl does the opposite of that. The RC's deploy uploads
                # | target/idl/<name>.json by default, and the flag turns that upload off,
                # | which is precisely why this lab's publish stays an explicit `anchor idl
                # | init` two lines later.
                feedback: "--no-idl hace lo opuesto de eso. El deploy de la RC sube target/idl/<name>.json por defecto, y la flag apaga esa subida, que es precisamente por lo que la publicación de este lab sigue siendo un `anchor idl init` explícito dos líneas después."  # @src=1964d18fd118
              a:
                # | Publish it with anchor idl init through the Program Metadata Program
                label: "Publicarlo con anchor idl init a través del Program Metadata Program"  # @src=18da70a78b4f
                # | Worth knowing what you are signing up for: an account you now pay rent
                # | on, and a second copy of your interface that is only true for as long as
                # | somebody keeps republishing it. Which flow you are on decides who that
                # | somebody is — the RC's plain `anchor deploy` upserts the IDL for you, so
                # | the staleness bites on the explicit `--no-idl` flow this lab uses, where
                # | the re-publish is a step you have to remember.
                feedback: "Vale saber a qué te estás anotando: una cuenta por la que ahora pagas alquiler, y una segunda copia de tu interfaz que es verdadera solo mientras alguien siga republicándola. En qué flujo estás decide quién es ese alguien — el `anchor deploy` simple de la RC hace upsert del IDL por ti, así que la obsolescencia muerde en el flujo explícito de `--no-idl` que usa este lab, donde la re-publicación es un paso que tienes que recordar."  # @src=bb6091770f3b
              c:
                # | Embed the IDL as a #[constant] so callers read it from the binary
                label: "Embutir el IDL como un #[constant] para que quien llama lo lea del binario"  # @src=75d92884d444
                # | Nothing in v2 ships the IDL inside the executable — #[constant] only
                # | surfaces a value in the generated IDL JSON, it doesn't make the binary
                # | self-describing. The on-chain copy lives in a separate Program Metadata
                # | account.
                feedback: "Nada en v2 entrega el IDL adentro del ejecutable — #[constant] solo saca un valor a la superficie en el JSON de IDL generado, no vuelve al binario autodescriptivo. La copia on-chain vive en una cuenta separada de Program Metadata."  # @src=51fcd4f82709
  m08-l2:
    # | Prove it: a verifiable build on devnet, and the authority trust surface
    title: "Demuéstralo: un build verificable en devnet, y la superficie de confianza de la autoridad"  # @src=93f77743ffc1
    blocks:
      check:                      # quiz
        questions:
          m08-l2-q1:
            # | You ran solana-verify build, deployed to devnet, and verify-from-repo
            # | reports a match. What exactly have you proven?
            prompt: "Corriste solana-verify build, desplegaste a devnet, y verify-from-repo reporta una coincidencia. ¿Qué demostraste exactamente?"  # @src=d7ef39cb263c
            # | A verifiable build is a source-to-bytes proof under a pinned, deterministic
            # | toolchain. It proves provenance, not safety, and not anything about who
            # | controls upgrades.
            explanation: "Un build verificable es una demostración de código fuente a bytes bajo un toolchain fijado y determinista. Demuestra procedencia, no seguridad, y nada sobre quién controla los upgrades."  # @src=bfc28951ad99
            options:                 # source order — keep it
              d:
                # | That the .so from your local build hashes the same as the deployed
                # | devnet bytes
                label: "Que el .so de tu build local hashea igual que los bytes desplegados de devnet"  # @src=ee2c9c62dd89
                # | Your local artifact never enters the comparison. verify-from-repo clones
                # | the public repo, rebuilds it inside the pinned image, and puts that hash
                # | against the on-chain one, which is why the challenge's uncommitted
                # | one-line edit produces a mismatch while your laptop still holds a
                # | matching .so.
                feedback: "Tu artefacto local nunca entra en la comparación. verify-from-repo clona el repo público, lo vuelve a construir dentro de la imagen fijada, y pone ese hash contra el on-chain, que es por qué la edición de una línea sin commitear del challenge produce un desajuste mientras tu laptop todavía tiene un .so que coincide."  # @src=56bb16682e2e
              b:
                # | That the deployed devnet bytes were built from exactly this source at
                # | the pinned toolchain
                label: "Que los bytes desplegados de devnet se construyeron desde exactamente este código fuente con el toolchain fijado"  # @src=68cdec2d518e
                # | Provenance under a fixed toolchain — that's the entire claim. A
                # | faithfully reproduced program can still be a dangerous one, and who may
                # | swap those bytes tomorrow is a different question from whether these
                # | bytes match.
                feedback: "Procedencia con un toolchain fijo — esa es toda la afirmación. Un programa reproducido fielmente todavía puede ser peligroso, y quién puede cambiar esos bytes mañana es una pregunta distinta de si estos bytes coinciden."  # @src=55b636b09efb
              a:
                # | That the swap logic is free of exploitable bugs, because the verifier
                # | compiles and inspects the source
                label: "Que la lógica del swap está libre de bugs explotables, porque el verificador compila e inspecciona el código fuente"  # @src=16a6acd82c0c
                # | The rebuild does compile your source, but it only hashes the output — it
                # | never reads the logic. A perfectly verifiable program can still drain
                # | its own vault; bug-freedom came from your audit and fuzz pass.
                feedback: "El rebuild sí compila tu código fuente, pero solo le saca el hash a la salida — nunca lee la lógica. Un programa perfectamente verificable todavía puede drenar su propio vault; la ausencia de bugs vino de tu auditoría y tu pasada de fuzz."  # @src=44eb3ceec315
              c:
                # | That the upgrade authority is locked, since a verified program's bytes
                # | can no longer be replaced
                label: "Que la autoridad de upgrade está trabada, ya que los bytes de un programa verificado ya no se pueden reemplazar"  # @src=40ec8461466f
                # | Verification is orthogonal to authority: a verified program whose
                # | upgrade authority is still a hot keypair can be silently replaced
                # | tomorrow. Locking upgrades is a separate set-upgrade-authority or Squads
                # | step.
                feedback: "La verificación es ortogonal a la autoridad: un programa verificado cuya autoridad de upgrade todavía es un keypair caliente puede ser reemplazado silenciosamente mañana. Trabar los upgrades es un paso aparte de set-upgrade-authority o de Squads."  # @src=afcbcb735c62
          m08-l2-q2:
            # | You try solana-verify remote submit-job for your devnet program and it won't
            # | produce a result. Why?
            prompt: "Pruebas solana-verify remote submit-job para tu programa de devnet y no produce ningún resultado. ¿Por qué?"  # @src=8357c3feb096
            # | The remote OtterSec submit-job path is mainnet-only. This course proves the
            # | build on devnet with the local verify-from-repo command; the remote flow is
            # | demonstrated and labelled beyond the course's cluster. What the registry
            # | adds is discoverability, not a stronger proof: OtterSec runs the build on
            # | their infrastructure and writes an on-chain record that explorers and
            # | wallets read for the verified badge. The trustless proof is the local one —
            # | you rebuild in the pinned image and compare the two hashes yourself.
            explanation: "El camino del submit-job remoto de OtterSec es exclusivo de mainnet. Este curso demuestra el build en devnet con el comando local verify-from-repo; el flujo remoto se muestra y se etiqueta como más allá del cluster del curso. Lo que agrega el registry es descubribilidad, no una demostración más fuerte: OtterSec corre el build en su infraestructura y escribe un registro on-chain que los exploradores y las billeteras leen para la insignia de verificado. La demostración trustless es la local — vuelves a construir en la imagen fijada y comparas los dos hashes tú mismo."  # @src=3012c097ccc5
            options:                 # source order — keep it
              b:
                # | The Docker daemon isn't running, so the pinned image can't start
                label: "El daemon de Docker no está corriendo, así que la imagen fijada no puede arrancar"  # @src=45e5a9da507e
                # | Docker is required for your local solana-verify build, and it fails fast
                # | with a daemon error. The remote job rebuilds on OtterSec's workers
                # | instead, so your daemon is not what stops it — cluster scope is.
                feedback: "Docker hace falta para tu build local de solana-verify, y falla rápido con un error de daemon. El job remoto vuelve a construir en los workers de OtterSec en vez de eso, así que tu daemon no es lo que lo detiene — el alcance de cluster sí."  # @src=ef70f06c5d34
              d:
                # | The remote job typically takes thirty minutes; the result is not back
                # | yet
                label: "El job remoto normalmente toma treinta minutos; el resultado todavía no volvió"  # @src=8cbda69f5e15
                # | That range is real for a mainnet job, and waiting is the reflex it
                # | invites. On devnet there is nothing to wait for: no worker ever picks
                # | the job up, so the answer stays empty however long you leave it.
                feedback: "Ese rango es real para un job de mainnet, y esperar es el reflejo que invita. En devnet no hay nada que esperar: ningún worker toma nunca el job, así que la respuesta se queda vacía por más que lo dejes ahí."  # @src=bab4de8e2f99
              c:
                # | The remote OtterSec registry path is mainnet-only and does not cover
                # | devnet
                label: "El camino del registry remoto de OtterSec es exclusivo de mainnet y no cubre devnet"  # @src=61edaa14a928
                # | The registry buys discoverability — a badge an explorer can show — not a
