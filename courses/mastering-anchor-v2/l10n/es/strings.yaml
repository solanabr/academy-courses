locale: es

course:
  # | Master Anchor V2
  title: "Domina Anchor V2"  # @src=d66a12880c70
  # | Design, build, test, secure, and ship an Anchor V2 program to devnet against the
  # | 2.0.0-rc.1 release candidate, then migrate a 0.31/1.0 codebase to V2 with a map of
  # | what changed and why. This is a machine-on-your-desk course: you install and drive the
  # | V2 RC toolchain locally — anchor-cli via cargo and avm, rustup's Rust alongside it,
  # | and Docker for the solana-verify build — and you deploy to devnet. V2 is an unaudited
  # | RC, so the course ends by teaching you to decide honestly when it is the right call
  # | and when the maintained 1.x line still is. It does not teach Rust and it does not
  # | teach Anchor: it assumes you already ship Anchor programs and want the V2 delta.
  description: "Diseña, construye, prueba, asegura y entrega un programa de Anchor V2 a devnet contra la release candidate 2.0.0-rc.1, y después migra una base de código 0.31/1.0 a V2 con un mapa de qué cambió y por qué. Este es un curso de máquina en tu escritorio: instalas y manejas el toolchain de la RC de V2 localmente — anchor-cli vía cargo y avm, el Rust de rustup a su lado, y Docker para el build de solana-verify — y despliegas en devnet. V2 es una RC no auditada, así que el curso termina enseñándote a decidir con honestidad cuándo es la opción correcta y cuándo la línea 1.x mantenida sigue siéndolo. No enseña Rust y no enseña Anchor: asume que ya entregas programas de Anchor y quieres el delta de V2."  # @src=f0ddce3105eb
  modules:
    orientation-anatomy-macros:
      # | Orientation, anatomy & the macro expansion
      title: "Orientación, anatomía y la expansión de macro"  # @src=b78d879b2a38
    accounts-pod-data:
      # | Accounts & data modeling under Pod (the V2 thesis, applied)
      title: "Cuentas y modelado de datos bajo Pod (la tesis de V2, aplicada)"  # @src=47dbe83a9444
    pdas-constraints:
      # | PDAs, constraints & the extensible constraint system
      title: "PDAs, constraints y el sistema extensible de constraints"  # @src=75c1f0310e25
    cpi-composition:
      # | CPIs & composition: the CpiHandle borrow model
      title: "CPIs y composición: el modelo de borrow de CpiHandle"  # @src=cdc5bf1f7a9e
    tokens-framework-seat:
      # | Tokens from the framework's seat (mechanics only)
      title: "Tokens desde el asiento del framework (solo la mecánica)"  # @src=ddbdc7d79353
    observe-profile-debug:
      # | Observe your program: profile, debug, cover, optimize
      title: "Observa tu programa: perfila, depura, cubre, optimiza"  # @src=30087d53189c
    security-v2-defaults:
      # | Security under V2 defaults (the re-derivation)
      title: "Seguridad bajo los defaults de V2 (la re-derivación)"  # @src=c70a0fc46199
    ship-idl-verify:
      # | Ship it: IDL, clients, and a verifiable build
      title: "Entrégalo: IDL, clientes y un build verificable"  # @src=3ee991ed9abb
    peel-and-prove:
      # | Peel & prove
      title: "Quita capas y demuestra"  # @src=b6680f2e50ba
    migrate-and-conclude:
      # | Migrate & conclude
      title: "Migra y concluye"  # @src=a9fe978e4ff0

lessons:
  m01-l1:
    # | Your Account<T> is the slow path
    title: "Tu Account<T> es el camino lento"  # @src=3a40c0fd3943
    blocks:
      check:                      # quiz
        questions:
          m01-l1-q1:
            # | You invoked the v1 and v2 twins and watched v2 spend far fewer CUs on the
            # | same call. What root cause is V2's design actually targeting?
            prompt: "Invocaste los gemelos v1 y v2 y viste a v2 gastar muchas menos CU en la misma llamada. ¿A qué causa raíz le está apuntando de verdad el diseño de V2?"  # @src=7564b9118f90
            # | Issue #4390 names Account<T> the slow path: v1 copies bytes into a struct,
            # | V2 makes zero-copy Pod the default. Same safety checks, far fewer copies.
            # | Zero-copy means literally zero copies of the account buffer: V2 hands you a
            # | typed &Counter view laid over the account's own bytes, so reading a field is
            # | a pointer offset rather than a decode. The price is that account types must
            # | be Pod — flat, alignment-clean bytes with no Vec or String hiding a heap
            # | pointer inside.
            explanation: "El issue #4390 nombra a Account<T> el camino lento: v1 copia bytes en una struct, V2 hace de Pod zero-copy el valor por defecto. Las mismas verificaciones de seguridad, muchas menos copias. Zero-copy quiere decir literalmente cero copias del buffer de la cuenta: V2 te da una vista tipada &Counter puesta sobre los bytes propios de la cuenta, así que leer un campo es un offset de puntero en vez de una decodificación. El precio es que los tipos de cuenta deben ser Pod — bytes planos, con alineación limpia y sin ningún Vec ni String escondiendo un puntero al heap dentro."  # @src=3078b02750a2
            options:                 # source order — keep it
              b:
                # | V2 shrinks the 8-byte sha256 discriminator to a single-byte tag, so each
                # | account load compares fewer bytes
                label: "V2 encoge el discriminator sha256 de 8 bytes a una etiqueta de un solo byte, así que cada carga de cuenta compara menos bytes"  # @src=31dd641fdb49
                # | Tempting because pinocchio-style programs really do use one-byte tags,
                # | and V2 is built on pinocchio. But V2's discriminator is unchanged —
                # | still the 8-byte sha256 of "account:<Name>" — and a discriminator
                # | compare was never the expensive part. The copy was.
                feedback: "Tentador porque los programas estilo pinocchio de verdad usan etiquetas de un byte, y V2 está construido sobre pinocchio. Pero el discriminator de V2 no cambió — sigue siendo el sha256 de 8 bytes de \"account:<Name>\" — y comparar un discriminator nunca fue la parte cara. La copia sí."  # @src=5d5971bb7ab8
              a:
                # | v1's Account<T> deserializes the account bytes into an owned struct on
                # | every access; V2 casts them in place
                label: "el Account<T> de v1 deserializa los bytes de la cuenta en una struct propia en cada acceso; V2 los castea en el lugar"  # @src=1ad59ef08e26
                # | Fewer copies, identical checks — and because the saving tracks copy
                # | volume, two twins this small leave almost nothing on the table for you
                # | to measure.
                feedback: "Menos copias, verificaciones idénticas — y como el ahorro sigue el volumen de copia, dos gemelos tan chicos dejan casi nada sobre la mesa para que midas."  # @src=e39da1c5b69c
              d:
                # | V2 memoizes each account's deserialized struct after the first read, so
                # | later field accesses in the instruction are free
                label: "V2 memoiza la struct deserializada de cada cuenta después de la primera lectura, así que los accesos posteriores a campos en la instrucción son gratis"  # @src=dd407e23fab2
                # | The instinct is right that a copy paid once beats a copy paid many
                # | times, which is why caching is the first thing anyone reaches for. V2
                # | does not pay it at all: the wrapper is a typed view laid over the
                # | account's own bytes, so a field read is a pointer offset and there is no
                # | decoded struct anywhere to memoize.
                feedback: "El instinto tiene razón en que una copia pagada una vez le gana a una copia pagada muchas veces, que es por qué el caché es lo primero a lo que cualquiera recurre. V2 no la paga para nada: el wrapper es una vista tipada puesta sobre los bytes propios de la cuenta, así que leer un campo es un offset de puntero y no hay ninguna struct decodificada en ninguna parte para memoizar."  # @src=0e3a3542dafd
              c:
                # | V2 drops the owner and signer checks that v1 runs on every account,
                # | spending its compute on the read instead
                label: "V2 deja fuera las verificaciones de dueño y de signer que v1 corre en cada cuenta, gastando su cómputo en la lectura en cambio"  # @src=12a4f4c80b4c
                # | The exact misread the design was careful not to invite. Both twins run
                # | identical signer, owner, and discriminator validation; dropping any of
                # | it would be a security regression, not an optimization. The savings are
                # | copies that no longer happen.
                feedback: "Exactamente la mala lectura que el diseño tuvo cuidado de no invitar. Los dos gemelos corren validación idéntica de signer, dueño y discriminator; quitar cualquier parte sería una regresión de seguridad, no una optimización. Los ahorros son copias que ya no pasan."  # @src=bc06a676c8a3
          m01-l1-q2:
            # | A teammate cites the docs' '9.9x average CU improvement.' What is the
            # | accurate current figure, and what does the gap teach?
            prompt: "Un compañero de equipo cita la 'mejora promedio de CU de 9.9x' de los docs. ¿Cuál es la cifra actual exacta, y qué enseña la brecha?"  # @src=6170426ed58d
            # | The headline dropped 9.9x to 8.8x (and 95% to 94% bytecode) in one honest
            # | self-correction; the alpha caveat says values can still move. That is the
            # | lesson behind the number: a benchmark multiplier is a snapshot with a date
            # | on it, never a promise, and the win scales with how much copying a given
            # | program was doing — which is why the Lab has you measure the twins yourself
            # | instead of memorizing a figure.
            explanation: "El número de portada cayó de 9.9x a 8.8x (y de 95% a 94% de bytecode) en una autocorrección honesta; la advertencia alpha dice que los valores todavía pueden moverse. Esa es la lección detrás del número: un multiplicador de benchmark es una instantánea con la fecha encima, nunca una promesa, y la ganancia escala con cuánta copia estaba haciendo un programa dado — que es por qué el Lab te hace medir los gemelos tú mismo en vez de memorizar una cifra."  # @src=178ba30861e5
            options:                 # source order — keep it
              d:
                # | 9.9x is the CU figure and 8.8x the bytecode one, so quote whichever
                # | metric your claim needs
                label: "9.9x es la cifra de CU y 8.8x la de bytecode, así que cita la métrica que tu afirmación necesite"  # @src=c05a883b195f
                # | Two numbers moved in the same commit on 2026-08-13, and filing one under
                # | each metric is a tidy way to remember them wrongly. Both are
                # | before-and-after pairs: bytecode went 95% to 94%, and average CU went
                # | 9.9x to 8.8x. Neither figure belongs to the other metric.
                feedback: "Dos números se movieron en el mismo commit el 2026-08-13, y archivar uno bajo cada métrica es una manera ordenada de recordarlos mal. Los dos son pares de antes y después: el bytecode pasó de 95% a 94%, y la CU promedio pasó de 9.9x a 8.8x. Ninguna de las dos cifras pertenece a la otra métrica."  # @src=4caece3b4b85
              c:
                # | 50.4x — that is the average CU reduction across every program in the
                # | benchmark suite
                label: "50.4x — esa es la reducción promedio de CU sobre cada programa de la suite de benchmarks"  # @src=d7c867e02592
                # | 50.4x is real but it is the single LARGEST reduction in the set, not the
                # | average — quoting the best case as the typical case is precisely what PR
                # | #4914 was fixing. The current average is 8.8x.
                feedback: "50.4x es real pero es la reducción individual MÁS GRANDE del conjunto, no el promedio — citar el mejor caso como el caso típico es precisamente lo que el PR #4914 estaba arreglando. El promedio actual es 8.8x."  # @src=ba03ef1835f3
              a:
                # | 9.9x — the published docs are canonical, so quoting their headline
                # | figure is always safe
                label: "9.9x — los docs publicados son canónicos, así que citar su cifra de portada siempre es seguro"  # @src=98dcc81f97c7
                # | Reasonable-sounding, and wrong in the direction that bites: docs lag the
                # | benchmark source. Benchmark PR #4914 (2026-08-13) revised the headline
                # | DOWN to 8.8x, so 9.9x is a stale number still sitting in prose.
                feedback: "Suena razonable, y está equivocado en la dirección que muerde: los docs van detrás de la fuente del benchmark. El PR de benchmark #4914 (2026-08-13) revisó la cifra de portada HACIA ABAJO a 8.8x, así que 9.9x es un número viejo que sigue sentado en la prosa."  # @src=afc06cda2155
              b:
                # | 8.8x average — revised down from 9.9x in benchmark PR #4914; never
                # | freeze a multiplier
                label: "8.8x promedio — revisado hacia abajo desde 9.9x en el PR de benchmark #4914; nunca congeles un multiplicador"  # @src=c1ace9834326
                # | Nobody trims a marketing number downward by accident — that is the tell
                # | it was measured rather than chosen. Where it bites is your own prose six
                # | months on, still quoting the figure you wrote down today.
                feedback: "Nadie recorta un número de marketing hacia abajo por accidente — esa es la señal de que se midió en vez de elegirse. Donde muerde es en tu propia prosa seis meses después, todavía citando la cifra que anotaste hoy."  # @src=25059d2c2257
          m01-l1-q3:
            # | A colleague asks you where to learn V2 properly. What can you actually tell
            # | them?
            prompt: "Un colega te pregunta dónde aprender V2 como se debe. ¿Qué le puedes decir de verdad?"  # @src=e736ad79a5f7
            # | The survey found none (search-budget-bounded, phrased as a finding not an
            # | absolute); the corpus's universal version rot is exactly the moat. That gap
            # | is why this course exists: it is not competing with the official on-ramp, it
            # | is replacing one that stopped breathing.
            explanation: "El sondeo no encontró ninguno (acotado por presupuesto de búsqueda, formulado como un hallazgo y no como un absoluto); la podredumbre de versiones universal del corpus es exactamente el foso. Esa brecha es por qué existe este curso: no compite con la rampa de entrada oficial, está reemplazando una que dejó de respirar."  # @src=3e48e61c31fc
            options:                 # source order — keep it
              b:
                # | Helius's flagship Anchor intro now installs the 2.0.0-rc.1 toolchain and
                # | teaches V2
                label: "La intro de Anchor estrella de Helius ahora instala el toolchain 2.0.0-rc.1 y enseña V2"  # @src=11ddaeba2314
                # | Helius writes genuinely good Anchor material, so the guess is fair — but
                # | that intro's install block still pins 0.29.0 in 2026 and never touches
                # | 2.0.0-rc.1. Version rot, not V2 coverage.
                feedback: "Helius escribe material de Anchor genuinamente bueno, así que la adivinanza es justa — pero el bloque de instalación de esa intro todavía fija 0.29.0 en 2026 y nunca toca 2.0.0-rc.1. Podredumbre de versiones, no cobertura de V2."  # @src=9bb8c77473a4
              c:
                # | As of 2026-08, a search turned up no dedicated V2 course or long-form
                # | guide
                label: "A 2026-08, una búsqueda no encontró ningún curso dedicado a V2 ni guía extensa"  # @src=1353f3cf4e75
                # | A negative like this can't be proven, only bounded. The defensible
                # | sentence is 'a real search found nothing,' never 'none exists.'
                feedback: "Una negativa como esta no se puede demostrar, solo acotar. La oración defendible es 'una búsqueda real no encontró nada', nunca 'no existe ninguno'."  # @src=e480f3492f0e
              a:
                # | The official solana.com/developers/courses path already covers V2 end to
                # | end
                label: "La ruta oficial solana.com/developers/courses ya cubre V2 de punta a punta"  # @src=6c0d08955e6b
                # | It is the first place anyone looks, which is what makes it dangerous:
                # | the URL 308-redirects into an archived content repo frozen on
                # | 2025-01-24, roughly 0.30-era Anchor. A tombstone with a nice headstone,
                # | not V2 coverage.
                feedback: "Es el primer lugar donde cualquiera mira, que es lo que lo hace peligroso: la URL hace un 308-redirect a un repo de contenido archivado, congelado el 2025-01-24, Anchor de la era 0.30 más o menos. Una tumba con una lápida bonita, no cobertura de V2."  # @src=eafb58bfee91
              d:
                # | anchor-lang.com typically tracks the RC, so the V2 guide it ships is
                # | current
                label: "anchor-lang.com suele seguir la RC, así que la guía de V2 que entrega está al día"  # @src=8e7bee490398
                # | The project's own site is the reasonable next stop after the Foundation
                # | path, and it is the same site whose CPI page still shows the pre-1.0
                # | AccountInfo form. The survey turned up no long-form V2 guide there or
                # | anywhere else.
                feedback: "El sitio propio del proyecto es la siguiente parada razonable después de la ruta de la Foundation, y es el mismo sitio cuya página de CPI todavía muestra la forma AccountInfo de antes de 1.0. El sondeo no encontró ninguna guía extensa de V2 ahí ni en ningún otro lado."  # @src=5c531edd6bb1
  m01-l2:
    # | Two parallel lines, and the install that fights you
    title: "Dos líneas paralelas, y la instalación que te pelea"  # @src=eebf4eb225a2
    blocks:
      check:                      # quiz
        questions:
          m01-l2-q1:
            # | You try to install the V2 RC with avm and it fails. Why does avm choke, and
            # | what is the documented path?
            prompt: "Intentas instalar la RC de V2 con avm y falla. ¿Por qué se atraganta avm, y cuál es la vía documentada?"  # @src=2dcf6fef7616
            # | For any version at or above 0.31, avm install fetches a prebuilt binary from
            # | the tag's GitHub Release assets rather than building anything. No Release
            # | was ever cut for the v2 tag (/releases/tags/v2.0.0-rc.1 404s, and so does
            # | the asset URL under it), so the fetch fails with 'Failed to download the
            # | binary for version 2.0.0-rc.1 (status code: 404 Not Found)'. Nothing
            # | cryptographic is involved — avm does no attestation verification at all —
            # | and the documented channel is the anchor-next git install. Concretely: cargo
            # | install --git https://github.com/otter-sec/anchor.git --branch anchor-next
            # | anchor-cli --locked --force, where --branch pins the frontier source,
            # | --locked honors the committed Cargo.lock (reproducibility that matters on an
            # | RC), and --force overwrites any anchor-cli already in ~/.cargo/bin.
            explanation: "Para cualquier versión en 0.31 o más arriba, avm install baja un binario precompilado desde los assets del GitHub Release del tag en vez de construir nada. Nunca se cortó ningún Release para el tag v2 (/releases/tags/v2.0.0-rc.1 da 404, y también lo da la URL del asset que va debajo), así que la bajada falla con 'Failed to download the binary for version 2.0.0-rc.1 (status code: 404 Not Found)'. No hay nada criptográfico involucrado — avm no hace ninguna verificación de atestación — y el canal documentado es la instalación por git de anchor-next. Concretamente: cargo install --git https://github.com/otter-sec/anchor.git --branch anchor-next anchor-cli --locked --force, donde --branch fija el código fuente de frontera, --locked honra el Cargo.lock commiteado (reproducibilidad que importa en una RC), y --force sobrescribe cualquier anchor-cli que ya esté en ~/.cargo/bin."  # @src=ee8e138871e3
            options:                 # source order — keep it
              b:
                # | avm refuses prerelease version strings by policy; pass --force to avm
                # | install so it accepts the 2.0.0-rc.1 tag anyway
                label: "avm rechaza las cadenas de versión de prerelease por política; pásale --force a avm install para que acepte el tag 2.0.0-rc.1 de todas formas"  # @src=155cda7e4a60
                # | Both halves are wrong. avm parses prerelease strings fine — it even has
                # | an explicit latest-pre-release channel — and --force does exist; it just
                # | skips the already-installed check, which does not conjure a file nobody
                # | published. Nobody ever cut a Release object here, so the asset URL
                # | points at nothing and the download 404s.
                feedback: "Las dos mitades están mal. avm parsea las cadenas de prerelease sin problema — tiene incluso un canal latest-pre-release explícito — y --force sí existe; solo se salta la verificación de ya-instalado, que no conjura un archivo que nadie publicó. Acá nunca nadie cortó un Release object, así que la URL del asset no apunta a nada y la descarga da 404."  # @src=adba464b7bd1
              c:
                # | the CLI is published on npm as @anchor-lang/core@2, so you npm install
                # | that package before avm can resolve the version
                label: "el CLI se publica en npm como @anchor-lang/core@2, así que haces npm install de ese paquete antes de que avm pueda resolver la versión"  # @src=52e2a266c766
                # | Tempting because Anchor 1.0 really did rename the TS client to
                # | @anchor-lang/core — but that package is the JavaScript client, there is
                # | no v2 of it, and the CLI is a Rust binary cargo builds from the
                # | anchor-next branch.
                feedback: "Tentador porque Anchor 1.0 de verdad renombró el cliente de TS a @anchor-lang/core — pero ese paquete es el cliente de JavaScript, no existe un v2 de él, y el CLI es un binario de Rust que cargo construye desde la rama anchor-next."  # @src=7287fcf3c620
              d:
                # | avm's prerelease channel is the fix: avm install latest-pre-release
                # | usually resolves the 2.0.0-rc.1 tag and builds it from source for you
                label: "el canal de prerelease de avm es el arreglo: avm install latest-pre-release normalmente resuelve el tag 2.0.0-rc.1 y lo construye desde el código fuente por ti"  # @src=38a45458da55
                # | That channel is real, and reaching for it is the right instinct once you
                # | know the version string parses fine. It resolves to whatever prerelease
                # | has a Release object behind it, and it still downloads rather than
                # | builds, so it cannot conjure an asset nobody uploaded. The flag that
                # | does build is --from-source.
                feedback: "Ese canal es real, y echar mano de él es el instinto correcto una vez que sabes que la cadena de versión parsea sin problema. Resuelve a cualquier prerelease que tenga un Release object detrás, y sigue bajando en vez de construir, así que no puede conjurar un asset que nadie subió. El flag que sí construye es --from-source."  # @src=d2d871f289e0
              a:
                # | avm install fetches a prebuilt binary from the tag's GitHub Release;
                # | none was cut for v2, so it 404s and you build from anchor-next
                label: "avm install baja un binario precompilado desde el GitHub Release del tag; no se cortó ninguno para v2, así que da 404 y construyes desde anchor-next"  # @src=59346f22b817
                # | Worth being able to tell apart: a missing file and a refused signature
                # | look much the same in a terminal, and they call for completely different
                # | responses.
                feedback: "Vale la pena saber distinguirlos: un archivo que falta y una firma rechazada se ven bastante parecidos en una terminal, y piden respuestas completamente distintas."  # @src=ce3daf1fb384
          m01-l2-q2:
            # | On macOS the RC build dies during LTO. Which line belongs in your pins/setup
            # | notes as the fix?
            prompt: "En macOS el build de la RC muere durante el LTO. ¿Cuál línea pertenece a tus notas de pins/setup como el arreglo?"  # @src=037ab7516d41
            # | The documented macOS workaround disables release LTO via the cargo profile
            # | env var; record it with a freshness note in the central pins file. LTO is
            # | cargo's final cross-crate optimization pass, so the override is a standard
            # | CARGO_PROFILE_RELEASE_* variable — on Linux the same prefix is harmless,
            # | which lets one install command work everywhere.
            explanation: "La solución alternativa documentada para macOS desactiva el LTO de release a través de la variable de entorno de perfil de cargo; regístrala con una nota de frescura en el archivo central de pins. El LTO es el paso final de optimización entre crates de cargo, así que el override es una variable estándar CARGO_PROFILE_RELEASE_* — en Linux el mismo prefijo es inofensivo, lo que deja que un solo comando de instalación funcione en todas partes."  # @src=64446f7f34c6
            options:                 # source order — keep it
              a:
                # | rustup toolchain install nightly
                label: "rustup toolchain install nightly"  # @src=6010db8f80b8
                # | Tempting if you read an RC as needing nightly, but the RC pins a stable
                # | MSRV of 1.89.0 (the scaffold writes rust-toolchain.toml), and installing
                # | nightly does not disable the link-time optimization pass that is
                # | crashing.
                feedback: "Tentador si lees una RC como algo que necesita nightly, pero la RC fija un MSRV estable de 1.89.0 (el scaffold escribe rust-toolchain.toml), e instalar nightly no desactiva el paso de link-time optimization que está crasheando."  # @src=d979e3987257
              d:
                # | cargo clean && anchor build
                label: "cargo clean && anchor build"  # @src=7af9bf9de29e
                # | A stale-artifact hypothesis is the cheapest thing to try and costs
                # | nothing but a rebuild. The RC dies inside link-time optimization every
                # | run, on a clean tree too, so the pass has to be switched off rather than
                # | retried.
                feedback: "La hipótesis del artefacto viejo es la cosa más barata de probar y no cuesta más que un rebuild. La RC muere dentro de link-time optimization en cada corrida, también sobre un árbol limpio, así que el paso hay que apagarlo antes que reintentarlo."  # @src=8a3b6cc07941
              b:
                # | CARGO_PROFILE_RELEASE_LTO=off
                label: "CARGO_PROFILE_RELEASE_LTO=off"  # @src=61b23fd930a2
                # | Cargo owns that knob, not Anchor. Harmless on Linux, so one install line
                # | covers both platforms.
                feedback: "Esa perilla es de Cargo, no de Anchor. Inofensiva en Linux, así que una sola línea de instalación cubre las dos plataformas."  # @src=3264c333cdd7
              c:
                # | export ANCHOR_BUILD_LTO=false
                label: "export ANCHOR_BUILD_LTO=false"  # @src=4b726f812ee0
                # | Anchor exposes no LTO switch of its own; LTO is a cargo release-profile
                # | setting, so the knob is the CARGO_PROFILE_RELEASE_* env var cargo
                # | already reads.
                feedback: "Anchor no expone ningún switch de LTO propio; el LTO es una configuración del perfil de release de cargo, así que la perilla es la variable de entorno CARGO_PROFILE_RELEASE_* que cargo ya lee."  # @src=7d3a03baa3c0
              e:
                # | export CARGO_PROFILE_DEV_LTO=off
                label: "export CARGO_PROFILE_DEV_LTO=off"  # @src=7b85321b70d3
                # | The right variable family, the wrong profile. anchor build compiles the
                # | program under the release profile, so the knob that reaches it is
                # | CARGO_PROFILE_RELEASE_LTO; the dev-profile twin is read for debug builds
                # | and leaves the failing pass switched on.
                feedback: "La familia de variables correcta, el perfil equivocado. anchor build compila el programa bajo el perfil de release, así que la perilla que llega hasta ahí es CARGO_PROFILE_RELEASE_LTO; el gemelo del perfil dev se lee para los builds de debug y deja encendido el paso que falla."  # @src=27537fd83963
          m01-l2-q3:
            # | crates.io tags the release 'rc' while the project's own benchmarks page
            # | calls it 'alpha.' How should the course handle the mismatch?
            prompt: "crates.io etiqueta el release como 'rc' mientras que la propia página de benchmarks del proyecto lo llama 'alpha.' ¿Cómo debería manejar el curso el desajuste?"  # @src=f60c86666cfc
            # | The project labels it both 'rc' and 'alpha'; the course surfaces the
            # | conflict and pins-and-reverifies rather than laundering it. An 'rc' claims
            # | near-shippable and an 'alpha' claims expect-breakage, so when one build
            # | carries both words the honest read is 'somewhere in between' — which is why
            # | PINS.md carries a verified date column and why issue #4937 (anchor-lang
            # | pinning wincode 0.5 while solana-address had moved to wincode 0.6, breaking
            # | #[account(borsh)]) was caught by --locked plus a human re-check rather than
            # | by a label.
            explanation: "El proyecto lo etiqueta a la vez 'rc' y 'alpha'; el curso saca el conflicto a la superficie y fija-y-reverifica en vez de lavarlo. Un 'rc' afirma casi-entregable y un 'alpha' afirma espera-que-se-rompa, así que cuando un build carga las dos palabras la lectura honesta es 'en algún lugar en medio' — y por eso PINS.md lleva una columna de fecha verified y por eso el issue #4937 (anchor-lang fijando wincode 0.5 mientras solana-address se había movido a wincode 0.6, rompiendo #[account(borsh)]) lo agarró --locked más un re-chequeo humano antes que una etiqueta."  # @src=b99a9927c0c4
            options:                 # source order — keep it
              c:
                # | Teach the conflict verbatim, and pin the exact installed version with a
                # | re-verify date
                label: "Enseña el conflicto textual, y fija la versión exacta que instalaste con una fecha de reverificación"  # @src=a2e32a1deb97
                # | Two maintainer-written labels disagreeing is itself the maturity
                # | reading: pick one for the reader and you have deleted the signal. What
                # | goes in its place is a dated pin you re-check.
                feedback: "Dos etiquetas escritas por los mantenedores que no coinciden son en sí mismas la lectura de madurez: elige una por el lector y ya borraste la señal. Lo que va en su lugar es un pin fechado que vuelves a chequear."  # @src=da4dea7ca902
              d:
                # | Call it beta in your own notes, since the two labels typically bracket
                # | that
                label: "Llámalo beta en tus propias notas, ya que las dos etiquetas típicamente lo encierran"  # @src=f9b39b05c5d9
                # | Splitting the difference feels fairer than taking a side, and it is the
                # | same move wearing a friendlier hat. A third label nobody published still
                # | resolves a tension the project left open, and the reader loses the one
                # | fact that mattered: two maintainer-written labels disagree about this
                # | build.
                feedback: "Partir la diferencia se siente más justo que tomar un lado, y es la misma jugada con un sombrero más simpático. Una tercera etiqueta que nadie publicó igual resuelve una tensión que el proyecto dejó abierta, y el lector pierde el único hecho que importaba: dos etiquetas escritas por los mantenedores no coinciden sobre este build."  # @src=b223b442015f
              a:
                # | Pick 'rc' — crates.io is the canonical registry, so its label overrides
                # | the project's own docs
                label: "Elige 'rc' — crates.io es el registro canónico, así que su etiqueta sobrescribe los propios docs del proyecto"  # @src=8b3b1efce69c
                # | The registry is not an authority on maturity — the 2026-08-12 crates.io
                # | publish is itself undocumented and untested for CLI installs. Taking its
                # | word silently deletes the signal the reader needs.
                feedback: "El registro no es una autoridad sobre madurez — la publicación en crates.io del 2026-08-12 es en sí misma indocumentada y sin probar para instalar el CLI. Tomar su palabra borra en silencio la señal que el lector necesita."  # @src=0d54357f3adc
              b:
                # | Pick 'alpha' — the benchmarks page is maintainer-written, so it is the
                # | more accurate signal
                label: "Elige 'alpha' — la página de benchmarks la escriben los mantenedores, así que es la señal más precisa"  # @src=5cbaf4bfaef7
                # | Both labels are maintainer-written, which is exactly the problem.
                # | Picking the conservative one still resolves a tension the project never
                # | resolved, and the unresolved tension is the maturity signal.
                feedback: "Las dos etiquetas las escriben los mantenedores, que es exactamente el problema. Elegir la conservadora igual resuelve una tensión que el proyecto nunca resolvió, y la tensión sin resolver es la señal de madurez."  # @src=fd64786887d5
  m01-l3:
    # | Program anatomy: what declare_id! and #[program] expand to
    title: "Anatomía del programa: en qué se expanden declare_id! y #[program]"  # @src=1a4d2ff85c32
    blocks:
      check:                      # quiz
        questions:
          m01-l3-q1:
            # | Reading a V2 handler you see pub fn greet(ctx: &mut Context<Greet>). In v1
            # | this was Context<Greet> by value with <'info> everywhere. What did V2
            # | change?
            prompt: "Leyendo un handler de V2 ves pub fn greet(ctx: &mut Context<Greet>). En v1 esto era Context<Greet> por valor con <'info> en todas partes. ¿Qué cambió V2?"  # @src=1a3b24a8ca40
            # | V2's expansion takes &mut Context<T> and drops <'info> from the wrappers — a
            # | visibly cleaner surface than v1's by-value, lifetime-heavy shape. The
            # | reference also removes a move on every instruction: one borrowed context
            # | carries through validation, your handler, and the exit routine that persists
            # | account changes.
            explanation: "La expansión de V2 toma &mut Context<T> y elimina <'info> de los wrappers — una superficie visiblemente más limpia que la forma de v1, por valor y cargada de lifetimes. La referencia también elimina un movimiento en cada instrucción: un solo contexto prestado atraviesa la validación, tu handler, y la rutina de salida que escribe de vuelta los cambios de cuenta."  # @src=a2973a8dc398
            options:                 # source order — keep it
              c:
                # | The <'info> lifetime moved from the wrappers onto the #[program] module
                # | itself
                label: "El lifetime <'info> se movió de los wrappers al módulo #[program] mismo"  # @src=97a061b5480d
                # | The lifetime was removed from the surface you write, not relocated. The
                # | framework still tracks the underlying account data's lifetimes
                # | internally, but nothing on #[program] spells it out.
                feedback: "El lifetime se eliminó de la superficie que escribes, no se reubicó. El framework todavía rastrea internamente los lifetimes de los datos de cuenta que están debajo, pero nada en #[program] lo escribe explícitamente."  # @src=7571327fb0a0
              a:
                # | V2 handlers take &mut Context<T> and the account wrappers carry no
                # | <'info> lifetime
                label: "Los handlers de V2 toman &mut Context<T> y los wrappers de cuenta no cargan ningún lifetime <'info>"  # @src=9e7c25e7b0af
                # | One borrowed context now threads validation, your handler and the
                # | write-back at the end. The per-instruction move is simply gone.
                feedback: "Un solo contexto prestado ahora enhebra la validación, tu handler y la escritura de vuelta al final. El movimiento por instrucción simplemente desapareció."  # @src=f54d04277a1b
              b:
                # | V2 kept Context<T> by value and only dropped <'info> from Signer and
                # | Account<T>
                label: "V2 mantuvo Context<T> por valor y solo eliminó <'info> de Signer y Account<T>"  # @src=5270f1245d62
                # | Half right, and that half is the trap: the wrappers did lose <'info>,
                # | but the signature changed too. A handler written Context<T> by value
                # | will not compile against the RC.
                feedback: "A medias, y esa mitad es la trampa: los wrappers sí perdieron <'info>, pero la firma también cambió. Un handler escrito Context<T> por valor no va a compilar contra la RC."  # @src=c18591dc36cc
              d:
                # | V2 dropped Context<T> altogether; handlers now take &mut Greet, the
                # | accounts struct itself
                label: "V2 eliminó Context<T> por completo; ahora los handlers toman &mut Greet, el struct de cuentas mismo"  # @src=be68e15c41fa
                # | Plausible if you read the missing lifetimes as the whole wrapper going
                # | away, and the direction is right that V2 deleted surface here. Context
                # | survives: the signature is &mut Context<Greet>, and the context is what
                # | carries validation, your body, and the exit routine as one borrowed
                # | thing.
                feedback: "Plausible si lees los lifetimes que faltan como si todo el wrapper desapareciera, y la dirección es correcta en que V2 borró superficie acá. Context sobrevive: la firma es &mut Context<Greet>, y el contexto es lo que carga la validación, tu cuerpo, y la rutina de salida como una sola cosa prestada."  # @src=3ccb3b3590b1
          m01-l3-q2:
            # | Your v1 muscle memory writes ctx.accounts.vault.key() and the V2 compiler
            # | rejects it. The fix?
            prompt: "Tu memoria muscular de v1 escribe ctx.accounts.vault.key() y el compilador de V2 lo rechaza. ¿El arreglo?"  # @src=0fc25c2fa507
            # | V2 replaces Pubkey with Address (via the solana-address crate pinocchio
            # | pulls in) and .key() with .address(); the twin renames trip every migrator
            # | once. The accessor hands back a reference, so storing an owned copy needs a
            # | leading star, as in *ctx.accounts.payer.address(). There is no .pubkey() and
            # | no .to_address() on the V2 wrapper surface at all.
            explanation: "V2 reemplaza Pubkey con Address (vía el crate solana-address que trae pinocchio) y .key() con .address(); los renames gemelos hacen tropezar una vez a todo el que migra. El accesor devuelve una referencia, así que guardar una copia propia necesita un asterisco adelante, como en *ctx.accounts.payer.address(). No hay ningún .pubkey() ni ningún .to_address() en la superficie de los wrappers de V2."  # @src=16c74cd68638
            options:                 # source order — keep it
              e:
                # | ctx.accounts.vault.to_account_info().key
                label: "ctx.accounts.vault.to_account_info().key"  # @src=7acc58b2d67e
                # | Straight v1 muscle memory, and the shape it targets is real off-chain,
                # | where a Keypair still hands you a Pubkey. Inside a V2 program the
                # | wrapper's accessor is .address(), and that seam between the on-chain
                # | Address surface and the off-chain Pubkey one holds for the whole course.
                feedback: "Pura memoria muscular de v1, y la forma a la que apunta es real off-chain, donde un Keypair todavía te entrega un Pubkey. Adentro de un programa V2 el accesor del wrapper es .address(), y esa costura entre la superficie on-chain de Address y la off-chain de Pubkey vale para todo el curso."  # @src=8d2d4311a961
              a:
                # | ctx.accounts.vault.pubkey()
                label: "ctx.accounts.vault.pubkey()"  # @src=14796b44ce6e
                # | .pubkey() is the off-chain accessor — a Keypair in your LiteSVM test
                # | still hands you a Pubkey that way. On the V2 wrapper surface the type is
                # | Address and the accessor is .address().
                feedback: ".pubkey() es el accesor off-chain — un Keypair en tu prueba de LiteSVM todavía te entrega un Pubkey de esa forma. En la superficie de los wrappers de V2 el tipo es Address y el accesor es .address()."  # @src=4b065fe552aa
              b:
                # | ctx.accounts.vault.address()
                label: "ctx.accounts.vault.address()"  # @src=c7cea914f1e4
                # | It is not only a rename — Pubkey became Address, out of a crate the
                # | runtime layer already pulled in, so the type on the left of your let
                # | changes too.
                feedback: "No es solo un rename — Pubkey se volvió Address, salido de un crate que la capa de runtime ya traía, así que el tipo a la izquierda de tu let también cambia."  # @src=ee0e15089f61
              c:
                # | ctx.accounts.vault.to_address()
                label: "ctx.accounts.vault.to_address()"  # @src=3ea80754966b
                # | There is no to_ conversion here — nothing is being converted. The rename
                # | is a straight .key() to .address(), and it reads the address the wrapper
                # | already holds.
                feedback: "Acá no hay ninguna conversión to_ — no se está convirtiendo nada. El rename es un .key() a .address() directo, y lee la dirección que el wrapper ya guarda."  # @src=a31dfcde84d5
              d:
                # | ctx.accounts.vault.key().into()
                label: "ctx.accounts.vault.key().into()"  # @src=c3c7f03ad29c
                # | .key() is the name your fingers reach for and the one the compiler
                # | rejects first, so converting its result looks like the small fix. There
                # | is nothing to convert from: the V2 wrapper surface exposes .address()
                # | and no .key() at all.
                feedback: ".key() es el nombre al que echan mano tus dedos y el primero que el compilador rechaza, así que convertir su resultado parece el arreglo chico. No hay nada de lo que convertir: la superficie de los wrappers de V2 expone .address() y ningún .key()."  # @src=a19e916a8eab
          m01-l3-q3:
            # | You just ran the scaffolded test to invoke the greeter. Which invoke vehicle
            # | did anchor init generate by default in V2?
            prompt: "Acabas de correr la prueba del scaffold para invocar el greeter. ¿Qué vehículo de invocación generó anchor init por defecto en V2?"  # @src=ce4df5dae7f8
            # | anchor init offers Mocha, Jest, Rust, Mollusk, and Litesvm; Litesvm is the
            # | #[default], which closes the deploy-and-invoke loop in Rust without writing
            # | any TypeScript. The scaffolded test loads target/deploy/greeter.so with
            # | svm.add_program and sends a transaction in-process, so anchor test never
            # | starts a validator.
            explanation: "anchor init ofrece Mocha, Jest, Rust, Mollusk y Litesvm; Litesvm es el #[default], que cierra el loop de deploy e invocación en Rust sin escribir nada de TypeScript. La prueba del scaffold carga target/deploy/greeter.so con svm.add_program y manda una transacción en proceso, así que anchor test nunca arranca un validador."  # @src=696bcf973213
            options:                 # source order — keep it
              c:
                # | A LiteSVM Rust test running in an in-process VM
                label: "Una prueba de Rust con LiteSVM corriendo en una VM en proceso"  # @src=6c84a80df9b4
                # | Whichever template carries #[default] is the file you get, and no
                # | validator starts for any of them. The built .so goes straight into an
                # | in-process VM.
                feedback: "La plantilla que lleve #[default] es el archivo que recibes, y no arranca ningún validador para ninguna de ellas. El .so construido va derecho a una VM en proceso."  # @src=501a92e83feb
              b:
                # | A Mollusk Rust test running in an in-process VM
                label: "Una prueba de Rust con Mollusk corriendo en una VM en proceso"  # @src=52fd9b278a1b
                # | Also in-process, also validator-free — but only one of the five carries
                # | #[default], and it is not this one.
                feedback: "También en proceso, también libre de validador — pero solo una de las cinco lleva #[default], y no es esta."  # @src=5125a89d714a
              a:
                # | A Mocha TypeScript test wired to @coral-xyz/anchor
                label: "Una prueba de TypeScript con Mocha conectada a @coral-xyz/anchor"  # @src=4a15cf88f562
                # | Mocha is one of the five templates but not the default, and
                # | @coral-xyz/anchor is the v1 package name — there is no official V2
                # | TypeScript package to import yet.
                feedback: "Mocha es una de las cinco plantillas pero no la que viene por defecto, y @coral-xyz/anchor es el nombre del paquete de v1 — todavía no hay ningún paquete oficial de TypeScript para V2 que importar."  # @src=832ad63a6dcd
              d:
                # | A Jest TypeScript test run against Surfpool
                label: "Una prueba de TypeScript con Jest corrida contra Surfpool"  # @src=6434b56a33ee
                # | Jest is genuinely one of the five templates, and Surfpool is genuinely
                # | the validator behind anchor test, so both halves exist. Neither is what
                # | #[default] marks, and the template that carries it needs no validator at
                # | all.
                feedback: "Jest es genuinamente una de las cinco plantillas, y Surfpool es genuinamente el validador detrás de anchor test, así que las dos mitades existen. Ninguna de las dos es lo que marca #[default], y la plantilla que lo lleva no necesita ningún validador."  # @src=0d58daff187a
              e:
                # | A bare Rust test driving a local validator
                label: "Una prueba de Rust a secas manejando un validador local"  # @src=41cc39026051
                # | Rust is one of the five templates and this describes it accurately. The
                # | one carrying #[default] is Litesvm, which loads the built .so into an
                # | in-process VM rather than talking to a validator.
                feedback: "Rust es una de las cinco plantillas y esto la describe con precisión. La que lleva #[default] es Litesvm, que carga el .so construido en una VM en proceso en vez de hablarle a un validador."  # @src=07b18e965ffb
  m01-l4:
    # | #[derive(Accounts)], dispatch, discriminators & errors
    title: "#[derive(Accounts)], despacho, discriminadores y errores"  # @src=1ac4977d7f5b
    blocks:
      discriminator-preimage:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | An instruction handler is NOT hashed from "instruction:" — Anchor uses the
          # | "global:" namespace.
          0: "Un handler de instrucción NO se hashea desde \"instruction:\" — Anchor usa el namespace \"global:\"."  # @src=c0364acc64b4
          # | Fill in `namespace`: it is a `const fn`, and `match` cannot compare `&str`
          # | there (string equality is a trait call), so match on `item_kind.as_bytes()`
          # | with byte-string patterns like `b"instruction"`. `discriminator_preimage`
          # | already does the concatenation.
          1: "Completa `namespace`: es un `const fn`, y `match` no puede comparar `&str` ahí (la igualdad de cadenas es una llamada a trait), así que haz el match sobre `item_kind.as_bytes()` con patrones de byte-string como `b\"instruction\"`. `discriminator_preimage` ya hace la concatenación."  # @src=9cfd1ae450dc
        tests:                      # keyed by test case id
          t1:
            # | an account struct hashes from the account: namespace
            description: "un struct de cuenta hashea desde el namespace account:"  # @src=372314ad2abd
          t2:
            # | an instruction handler hashes from global:, not instruction:
            description: "un handler de instrucción hashea desde global:, no desde instruction:"  # @src=6e69969985bc
          t3:
            # | an event struct hashes from the event: namespace
            description: "un struct de evento hashea desde el namespace event:"  # @src=43c422808566
          t4:
            # | the SAME name under a different item kind takes a different namespace: the
            # | prefix comes from item_kind, never from the name
            description: "el MISMO nombre bajo un tipo de ítem distinto toma un namespace distinto: el prefijo viene de item_kind, nunca del nombre"  # @src=bb67499c1de5
          t5:
            # | a second instruction handler is also global:, so the mapping is on the kind
            # | rather than on one special-cased name
            description: "un segundo handler de instrucción también es global:, así que el mapeo está sobre el tipo y no sobre un nombre con caso especial"  # @src=70fecdf59d7f
      check:                      # quiz
        questions:
          m01-l4-q1:
            # | You pass the same account twice into one instruction, both marked mut,
            # | without unsafe(dup). What happens in V2, and where?
            prompt: "Pasas la misma cuenta dos veces a una instrucción, las dos marcadas con mut, sin unsafe(dup). ¿Qué pasa en V2, y dónde?"  # @src=2d39d3d0d03d
            # | MUT_MASK is a compile-time associated const, but the duplicate collision is
            # | walked and rejected at runtime in the dispatcher; the compile error is
            # | specifically about writing dup instead of unsafe(dup). Mechanically: the
            # | dispatcher walks the incoming account views, sets a bit for every slot whose
            # | address it has already seen, and ANDs that bitvec against the struct's
            # | 256-bit MUT_MASK in one four-word test. Any surviving bit returns
            # | ConstraintDuplicateMutableAccount from the dispatcher — before try_accounts
            # | loads a single field and long before your handler body runs.
            explanation: "MUT_MASK es una const asociada de tiempo de compilación, pero la colisión de duplicados se recorre y se rechaza en tiempo de ejecución, en el dispatcher; el error de compilación es específicamente sobre escribir dup en lugar de unsafe(dup). Mecánicamente: el dispatcher recorre las vistas de cuenta que entran, prende un bit para cada slot cuya dirección ya vio, y hace AND de ese bitvec contra el MUT_MASK de 256 bits del struct en una comprobación de cuatro palabras. Cualquier bit que sobreviva devuelve ConstraintDuplicateMutableAccount desde el dispatcher — antes de que try_accounts cargue un solo campo y mucho antes de que corra el cuerpo de tu handler."  # @src=3557d2d0efcf
            options:                 # source order — keep it
              d:
                # | Rejected inside try_accounts, at the point the second field's load finds
                # | its address already seen
                label: "Rechazada dentro de try_accounts, en el punto donde la carga del segundo campo encuentra que su dirección ya se vio"  # @src=edd8e8a9a16b
                # | Right that it is a runtime rejection and right that it lands before your
                # | handler, wrong about which floor it happens on. try_accounts loads and
                # | constrains fields one at a time and never sees the whole account list;
                # | the duplicate walk runs ahead of it in the dispatcher, so no field has
                # | loaded when the rejection fires.
                feedback: "Bien en que es un rechazo en tiempo de ejecución y bien en que aterriza antes de tu handler, mal en la planta donde pasa. try_accounts carga y aplica constraints a los campos uno por uno y nunca ve la lista completa de cuentas; el recorrido de duplicados corre por delante de él en el dispatcher, así que ningún campo cargó cuando se dispara el rechazo."  # @src=c5a282b851f9
              a:
                # | Rejected at runtime by the dispatcher's duplicate walk, before
                # | try_accounts loads any field
                label: "Rechazada en tiempo de ejecución por el recorrido de duplicados del dispatcher, antes de que try_accounts cargue algún campo"  # @src=b1b9ea1c09ff
                # | The two halves run on different clocks: writability is fixed when the
                # | struct compiles, addresses only become comparable when a call arrives.
                # | Nothing is deserialized before the walk says no.
                feedback: "Las dos mitades corren en relojes distintos: la escribibilidad queda fija cuando el struct compila, las direcciones solo se vuelven comparables cuando llega una llamada. Nada se deserializa antes de que el recorrido diga no."  # @src=67072137ea46
              b:
                # | It compiles and runs, and the second serialize-on-exit silently clobbers
                # | the first write
                label: "Compila y corre, y la segunda serialización al salir pisa en silencio la primera escritura"  # @src=d9b15736cf9b
                # | That silent clobber is exactly the aliasing bug V2 closes: duplicate
                # | mutables are disallowed by default, so the call is rejected rather than
                # | letting the second write win.
                feedback: "Ese pisotón silencioso es exactamente el bug de aliasing que V2 cierra: los mutables duplicados están prohibidos por defecto, así que la llamada se rechaza en vez de dejar ganar a la segunda escritura."  # @src=f1f35d348942
              c:
                # | It is a compile error: MUT_MASK detects that two fields of the same type
                # | are both marked mut
                label: "Es un error de compilación: MUT_MASK detecta que dos campos del mismo tipo están los dos marcados con mut"  # @src=b61e13bfdf67
                # | MUT_MASK only encodes shape — which slots are mut — and two mut fields
                # | of the same type are perfectly legal to declare. The compile error in V2
                # | is about writing plain dup instead of unsafe(dup), not about a
                # | collision.
                feedback: "MUT_MASK solo codifica la forma — qué slots son mut — y dos campos mut del mismo tipo son perfectamente legales de declarar. El error de compilación en V2 es sobre escribir dup a secas en lugar de unsafe(dup), no sobre una colisión."  # @src=41f968a74b91
          m01-l4-q2:
            # | Your program's custom #[error_code] enum's third variant fires (no offset
            # | override). What on-wire code do clients see?
            prompt: "Se dispara la tercera variante del enum #[error_code] propio de tu programa (sin sobrescritura de offset). ¿Qué código en el wire ven los clientes?"  # @src=c2e6839b3dec
            # | Framework constraint errors sit in the 2000s; custom #[error_code] starts at
            # | 6000, so the third variant (zero-based index 2) is 6002 unless offset is
            # | overridden.
            explanation: "Los errores de constraints del framework viven en los 2000; #[error_code] propio arranca en 6000, así que la tercera variante (índice 2 contado desde cero) es 6002 a menos que se sobrescriba offset."  # @src=e5c017e6a2c8
            options:                 # source order — keep it
              c:
                # | 6003 — the custom band starts at 6000 and numbers variants from 1
                label: "6003 — la banda propia arranca en 6000 y numera las variantes desde 1"  # @src=a45fb24929c7
                # | The base itself is the first variant: index 0 is 6000, so the third
                # | variant is 6002. Nothing counts from 1 unless you shift the base with
                # | #[error_code(offset = N)].
                feedback: "La base en sí es la primera variante: el índice 0 es 6000, así que la tercera variante es 6002. Nada cuenta desde 1 a menos que desplaces la base con #[error_code(offset = N)]."  # @src=633e603722a3
              b:
                # | 6002 — the custom band starts at 6000 and is zero-indexed by variant
                label: "6002 — la banda propia arranca en 6000 y está indexada desde cero por variante"  # @src=0ceb6574664a
                # | Counting starts at the base: variant one is 6000 flat, and nothing
                # | shifts unless you set an explicit offset. Four thousand below sits the
                # | framework's own constraint band.
                feedback: "La cuenta arranca en la base: la variante uno es 6000 pelado, y nada se desplaza a menos que fijes un offset explícito. Cuatro mil más abajo se sienta la banda de constraints propia del framework."  # @src=630fe1cd00a3
              e:
                # | 3 - the on-wire code is the variant index; 6000 is a display offset
                label: "3 - el código en el wire es el índice de la variante; 6000 es un offset de visualización"  # @src=ae539911ccfc
                # | It would be tidy if the base were only a rendering detail, and decoded
                # | errors really do get pretty-printed by clients. The base is part of the
                # | number that crosses the wire, which is precisely what keeps your codes
                # | from colliding with the framework's.
                feedback: "Sería prolijo que la base fuera solo un detalle de renderizado, y los errores decodificados de verdad los imprimen lindo los clientes. La base es parte del número que cruza el wire, que es precisamente lo que mantiene tus códigos sin chocar con los del framework."  # @src=af43d667a53e
              d:
                # | 6100 - the custom band starts at 6000 and steps by 100 per variant
                label: "6100 - la banda propia arranca en 6000 y avanza 100 por variante"  # @src=60225fdeef99
                # | Error classes do step in round numbers, which is where this comes from:
                # | 100 for instruction errors, 2000 for constraints, 6000 for yours. Inside
                # | the custom band the step is one, so variant zero is 6000, variant one
                # | 6001, variant two 6002.
                feedback: "Las clases de error sí avanzan en números redondos, que es de donde viene esto: 100 para los errores de instrucción, 2000 para los constraints, 6000 para los tuyos. Dentro de la banda propia el paso es uno, así que la variante cero es 6000, la variante uno 6001, la variante dos 6002."  # @src=76a7eedfeb42
              a:
                # | 2003 — custom #[error_code] variants land in the 2000s constraint band
                label: "2003 — las variantes de #[error_code] propio aterrizan en la banda de constraints de los 2000"  # @src=78ce1ab5bec5
                # | The 2000s are the framework's own constraint band (ConstraintHasOne =
                # | 2001, ConstraintDuplicateMutableAccount lives there too). Your declared
                # | errors never land there; they start at 6000.
                feedback: "Los 2000 son la banda de constraints propia del framework (ConstraintHasOne = 2001, ConstraintDuplicateMutableAccount también vive ahí). Tus errores declarados nunca aterrizan ahí; arrancan en 6000."  # @src=36dfd048db58
          m01-l4-q3:
            # | You just completed the discriminator-preimage challenge. Anchor hashes an
            # | INSTRUCTION handler's discriminator from which preimage namespace?
            prompt: "Acabas de completar el Challenge de la preimagen del discriminador. ¿Desde qué namespace de preimagen hashea Anchor el discriminador de un handler de INSTRUCCIÓN?"  # @src=e789b2eaf643
            # | Accounts hash from account:, events from event:, and instruction handlers
            # | from global: — the global namespace is the one that surprises people.
            explanation: "Las cuentas hashean desde account:, los eventos desde event:, y los handlers de instrucción desde global: — el namespace global es el que sorprende a la gente."  # @src=49c949b17429
            options:                 # source order — keep it
              e:
                # | "program:" - e.g. sha256("program:increment")
                label: "\"program:\" - p. ej. sha256(\"program:increment\")"  # @src=9e386d103125
                # | The handler does live inside the #[program] module, so naming its
                # | namespace after that module is a fair inference. The three are account:,
                # | event: and global:, and the handler one is global: for a historical
                # | reason rather than a structural one.
                feedback: "El handler sí vive dentro del módulo #[program], así que nombrar su namespace según ese módulo es una inferencia razonable. Los tres son account:, event: y global:, y el del handler es global: por una razón histórica y no estructural."  # @src=7463d36f85d8
              a:
                # | "instruction:" — e.g. sha256("instruction:increment")
                label: "\"instruction:\" — p. ej. sha256(\"instruction:increment\")"  # @src=6a538ea555b3
                # | This is the trap the challenge targets — Anchor uses the "global:"
                # | namespace for instruction handlers, not "instruction:".
                feedback: "Esta es la trampa a la que apunta el Challenge — Anchor usa el namespace \"global:\" para los handlers de instrucción, no \"instruction:\"."  # @src=90fd205ec54d
              c:
                # | "global:" — e.g. sha256("global:increment")[..8]
                label: "\"global:\" — p. ej. sha256(\"global:increment\")[..8]"  # @src=52cef50d5b90
                # | Three preimage namespaces exist and each is keyed to a different kind of
                # | declaration. The handler one surprises people because that word never
                # | appears anywhere in the source you actually wrote.
                feedback: "Existen tres namespaces de preimagen y cada uno está atado a un tipo distinto de declaración. El del handler sorprende a la gente porque esa palabra no aparece en ninguna parte del código que de verdad escribiste."  # @src=af5677368951
              d:
                # | "ix:" - e.g. sha256("ix:increment")[..8]
                label: "\"ix:\" - p. ej. sha256(\"ix:increment\")[..8]"  # @src=771af3f2ba15
                # | ix is the ecosystem's own shorthand for an instruction, so it reads like
                # | the obvious namespace to pick. Three namespaces exist and this is not
                # | among them; a handler hashes from global:.
                feedback: "ix es la abreviatura propia del ecosistema para una instrucción, así que se lee como el namespace obvio para elegir. Existen tres namespaces y este no está entre ellos; un handler hashea desde global:."  # @src=688d89cb1f36
              b:
                # | "handler:" — e.g. sha256("handler:increment")
                label: "\"handler:\" — p. ej. sha256(\"handler:increment\")"  # @src=7c63ba4e7e7c
                # | There is no "handler:" namespace; instruction handlers hash from
                # | "global:".
                feedback: "No hay ningún namespace \"handler:\"; los handlers de instrucción hashean desde \"global:\"."  # @src=af1e09a97238
          m01-l4-q4:
            # | You consider enabling #[discrim = N] compact discriminators to shrink your
            # | instruction tags. What is the honest trade-off?
            prompt: "Consideras activar los discriminadores compactos #[discrim = N] para encoger tus etiquetas de instrucción. ¿Cuál es el trade-off honesto?"  # @src=028d8f947ac6
            # | Discriminators are v1-compatible by default; #[discrim = N] is an
            # | all-or-nothing-per-program compaction with prefix-ambiguity validation,
            # | trading v1 wire-compat for smaller instruction tags. That extra validation
            # | exists because variable-width integer tags could otherwise alias each other
            # | by prefix, which fixed 8-byte sha256 tags never can.
            explanation: "Los discriminadores son compatibles con v1 por defecto; #[discrim = N] es una compactación todo-o-nada por programa con validación de ambigüedad de prefijos, que cambia la compatibilidad de wire con v1 por etiquetas de instrucción más chicas. Esa validación extra existe porque las etiquetas enteras de ancho variable podrían de otro modo hacer alias entre sí por prefijo, algo que las etiquetas sha256 fijas de 8 bytes nunca pueden."  # @src=46e1556ea850
            options:                 # source order — keep it
              a:
                # | It is per-instruction opt-in, so you can freely mix compact and default
                # | 8-byte discriminators in one program
                label: "Es opcional por instrucción, así que puedes mezclar libremente discriminadores compactos y los de 8 bytes por defecto en un mismo programa"  # @src=84b34898ff03
                # | Compaction is a program-wide switch: every handler's tag is compacted
                # | and prefix-ambiguity-validated together, so there is no per-instruction
                # | mix of compact and 8-byte sha256 tags.
                feedback: "La compactación es un interruptor para todo el programa: la etiqueta de cada handler se compacta y se valida contra la ambigüedad de prefijos en conjunto, así que no hay mezcla por instrucción de etiquetas compactas y etiquetas sha256 de 8 bytes."  # @src=136b59e4a95f
              d:
                # | Compaction is on by default in V2, and #[discrim = N] is usually how you
                # | opt back into 8-byte tags
                label: "La compactación está activada por defecto en V2, y #[discrim = N] es normalmente cómo vuelves a optar por las etiquetas de 8 bytes"  # @src=de0e99d24b27
                # | V2 flipped enough defaults that assuming it flipped this one too is a
                # | reasonable bet. It did not: the 8-byte sha256 tag stays the default
                # | precisely because it keeps v1 wire-compatibility for free, and #[discrim
                # | = N] is the opt-in that trades that away.
                feedback: "V2 dio vuelta suficientes valores por defecto como para que suponer que también dio vuelta este sea una apuesta razonable. No lo hizo: la etiqueta sha256 de 8 bytes sigue siendo el valor por defecto precisamente porque mantiene gratis la compatibilidad de wire con v1, y #[discrim = N] es la opción que entrega eso a cambio."  # @src=f4abbae52b1d
              c:
                # | It keeps the 8-byte width but swaps sha256 for a cheaper hash, so
                # | client-built tags stop matching
                label: "Mantiene el ancho de 8 bytes pero cambia sha256 por un hash más barato, así que las etiquetas armadas por el cliente dejan de calzar"  # @src=db5fda8e4582
                # | The compaction is not about the hash function: #[discrim = N] replaces
                # | the 8-byte sha256 prefix with a small literal integer tag — no hashing
                # | at all — so it is the width that changes, not the algorithm.
                feedback: "La compactación no es sobre la función de hash: #[discrim = N] reemplaza el prefijo sha256 de 8 bytes por una etiqueta entera literal pequeña — sin ningún hasheo — así que lo que cambia es el ancho, no el algoritmo."  # @src=90b1685b22a6
              b:
                # | It is all-or-nothing per program: you save instruction bytes and CU, but
                # | drop default v1 wire-compatibility
                label: "Es todo-o-nada por programa: ahorras bytes de instrucción y CU, pero dejas de lado la compatibilidad de wire con v1 por defecto"  # @src=52c659fecc14
                # | Small integer tags can alias by prefix, so the whole program's tag set
                # | has to be validated at once — a hazard fixed-width hashes never had,
                # | which is why nothing checks for it until you opt in.
                feedback: "Las etiquetas enteras pequeñas pueden hacer alias por prefijo, así que el conjunto de etiquetas de todo el programa hay que validarlo de una sola vez — un riesgo que los hashes de ancho fijo nunca tuvieron, que es por qué nada lo verifica hasta que optas por activarlo."  # @src=8f9a0bc56bf0
  m02-l1:
    # | Account<T> is zero-copy by default
    title: "Account<T> es zero-copy por defecto"  # @src=8eaaaf66147a
    blocks:
      check:                      # quiz
        questions:
          m02-l1-q1:
            # | You add a plain bool field to your Pod cabinet struct and the program
            # | suddenly won't compile. What's the real reason, and the fix?
            prompt: "Agregas un campo bool simple a tu struct Pod cabinet y de golpe el programa no compila. ¿Cuál es la razón real, y el arreglo?"  # @src=748f36f68ada
            # | Pod requires every possible bit pattern to be a valid value. bool has only
            # | two valid bytes (0 and 1), so bytemuck refuses to treat arbitrary bytes as a
            # | bool. PodBool wraps a u8 whose every pattern is defined, keeping the direct
            # | byte cast sound — the alignment/no-padding discipline in miniature.
            explanation: "Pod exige que todo patrón de bits posible sea un valor válido. bool tiene solo dos bytes válidos (0 y 1), así que bytemuck se niega a tratar bytes arbitrarios como un bool. PodBool envuelve un u8 cuyos patrones están todos definidos, y mantiene sólido el cast directo de bytes — la disciplina de alineación/sin-relleno en miniatura."  # @src=2f72711ab2d4
            options:                 # source order — keep it
              c:
                # | The 8-byte sha256 discriminator has to be re-derived by hand whenever a
                # | struct's field layout changes.
                label: "El discriminador sha256 de 8 bytes tiene que volver a derivarse a mano cada vez que cambia el layout de campos de un struct."  # @src=1d9acdf9d694
                # | The discriminator is derived from the type name, not from its fields,
                # | and it is a runtime tag on the first 8 bytes — it could never surface as
                # | a compile error about a field's type.
                feedback: "El discriminador se deriva del nombre del tipo, no de sus campos, y es una etiqueta en tiempo de ejecución sobre los primeros 8 bytes — nunca podría aparecer como un error de compilación sobre el tipo de un campo."  # @src=f9672d7b6ca8
              a:
                # | Account<T> = Slab<T, HeaderOnly> admits only fixed-width numeric fields,
                # | so a bool is banned outright.
                label: "Account<T> = Slab<T, HeaderOnly> admite solo campos numéricos de ancho fijo, así que un bool está prohibido de plano."  # @src=d8066ee6c4c7
                # | The bound is Pod-ness, not numeric-ness. Slab happily holds any Pod
                # | field, including the one-byte PodBool wrapper, so booleans are not
                # | banned — bare bool just isn't castable.
                feedback: "El bound es ser Pod, no ser numérico. Slab guarda con gusto cualquier campo Pod, incluido el wrapper PodBool de un byte, así que los booleanos no están prohibidos — el bool desnudo simplemente no se puede castear."  # @src=62b0724a1d19
              d:
                # | A 1-byte bool after a PodU64 usually opens 7 bytes of padding, and Pod
                # | forbids padding; reorder the fields
                label: "Un bool de 1 byte después de un PodU64 suele abrir 7 bytes de relleno, y Pod prohíbe el relleno; reordena los campos"  # @src=d4f03ba09d76
                # | Padding is a real Pod failure and field order is a real fix for it,
                # | which is exactly why this reads correctly. It is the wrong failure here:
                # | a bare bool is rejected because 254 of its 256 byte patterns are
                # | undefined, so no ordering makes it castable. PodBool does.
                feedback: "El relleno es una falla real de Pod y el orden de los campos es un arreglo real para ella, que es exactamente por lo que esto se lee bien. Es la falla equivocada aquí: un bool desnudo se rechaza porque 254 de sus 256 patrones de bytes son indefinidos, así que ningún orden logra que se pueda castear. PodBool sí."  # @src=75e90090d485
              b:
                # | bool isn't Pod because not every bit pattern is a valid bool, so
                # | bytemuck rejects it — use PodBool.
                label: "bool no es Pod porque no todo patrón de bits es un bool válido, así que bytemuck lo rechaza — usa PodBool."  # @src=074dd2143d42
                # | Two of 256 byte values are a legal bool, and Pod wants all 256 to mean
                # | something. Wrap it in a byte whose whole range is defined and the
                # | contract holds again. Booleans were never the problem.
                feedback: "Dos de 256 valores de byte son un bool legal, y Pod quiere que los 256 signifiquen algo. Envuélvelo en un byte cuyo rango entero está definido y el contrato se cumple otra vez. Los booleanos nunca fueron el problema."  # @src=b2ebc964bf9b
          m02-l1-q2:
            # | Your LiteSVM test reads account.data and the fields look shifted by 8 bytes
            # | from what you wrote. What happened?
            prompt: "Tu prueba de LiteSVM lee account.data y los campos se ven corridos 8 bytes respecto de lo que escribiste. ¿Qué pasó?"  # @src=dadd8315a636
            # | V2 keeps the sha256 discriminator unchanged and Account<T> = Slab<T,
            # | HeaderOnly> lays the Pod body immediately after that 8-byte header. Cast
            # | from data[8..] with bytemuck::from_bytes and the fields line up.
            explanation: "V2 deja el discriminador sha256 sin cambios y Account<T> = Slab<T, HeaderOnly> acomoda el cuerpo Pod inmediatamente después de ese header de 8 bytes. Haz el cast desde data[8..] con bytemuck::from_bytes y los campos se alinean."  # @src=b761b01c9289
            options:                 # source order — keep it
              a:
                # | bytemuck::from_bytes dropped the struct's first PodU64 field.
                label: "bytemuck::from_bytes descartó el primer campo PodU64 del struct."  # @src=b8d45171a99d
                # | from_bytes reinterprets a byte range in place; it never drops or
                # | reorders fields. Nothing was lost — you're just reading from the wrong
                # | offset.
                feedback: "from_bytes reinterpreta un rango de bytes en el lugar; nunca descarta ni reordena campos. Nada se perdió — solo estás leyendo desde el offset equivocado."  # @src=8670ac9eff96
              b:
                # | LiteSVM writes PodU64 fields big-endian; the runtime writes them
                # | little-endian.
                label: "LiteSVM escribe los campos PodU64 en big-endian; el runtime los escribe en little-endian."  # @src=c2d216c50286
                # | LiteSVM is the same SVM, byte for byte, and PodU64 stores little-endian
                # | in both. An endianness flip would scramble each value, not slide every
                # | field down by eight bytes.
                feedback: "LiteSVM es el mismo SVM, byte por byte, y PodU64 guarda en little-endian en los dos. Un cambio de endianness revolvería cada valor, no correría cada campo ocho bytes hacia abajo."  # @src=7a7ac32c035d
              c:
                # | The 8-byte discriminator still precedes the Pod body — you must cast
                # | from data[8..].
                label: "El discriminador de 8 bytes sigue precediendo al cuerpo Pod — tienes que hacer el cast desde data[8..]."  # @src=89707d831fd4
                # | The header survived the rewrite untouched, and the flat body begins
                # | immediately behind it. Skip those eight bytes on the test side and every
                # | offset realigns; nothing was dropped or reordered.
                feedback: "El header sobrevivió la reescritura intacto, y el cuerpo plano empieza inmediatamente detrás. Sáltate esos ocho bytes del lado de la prueba y cada offset se vuelve a alinear; nada se descartó ni se reordenó."  # @src=207946087733
              d:
                # | get_account hands back the runtime's own account header ahead of your
                # | data
                label: "get_account devuelve el propio header de cuenta del runtime adelante de tus datos"  # @src=d753e8a7d53f
                # | Account metadata and account data are easy to blur, and a fixed-size
                # | preamble is the right shape for the symptom you are seeing. The
                # | lamports, owner and executable flag ride outside .data; the eight bytes
                # | in front of your fields are the discriminator your own program wrote.
                feedback: "Los metadatos de la cuenta y los datos de la cuenta son fáciles de confundir, y un preámbulo de tamaño fijo es la forma correcta para el síntoma que estás viendo. Los lamports, el dueño y el flag de ejecutable viajan afuera de .data; los ocho bytes que están delante de tus campos son el discriminador que escribió tu propio programa."  # @src=e0ff5bf41805
          m02-l1-q3:
            # | A teammate says V2 made their two-field counter 8.8x cheaper. How should
            # | your own docs report that figure?
            prompt: "Un compañero de equipo dice que V2 hizo su contador de dos campos 8.8x más barato. ¿Cómo tendrían que reportar esa cifra tus propios docs?"  # @src=931c6a1f8350
            # | PR #4914 revised the headline down to 8.8x average CU and 94% bytecode, and
            # | the benchmark page warns the alpha values can move. Small programs see
            # | little benefit. Report it as an approximate, moving average — the same
            # | reason the course centralizes and freshness-notes every number. Concretely,
            # | in your own docs: cite it as an average across a benchmark family rather
            # | than a per-instruction promise, note that it was revised down from 9.9x, and
            # | never attach it to a specific program — least of all a two-field counter,
            # | which is the worst case for the gain.
            explanation: "El PR #4914 revisó el titular hacia abajo a 8.8x de CU promedio y 94% de bytecode, y la página del benchmark advierte que los valores alpha pueden moverse. Los programas chicos ven poco beneficio. Repórtalo como un promedio aproximado y en movimiento — la misma razón por la que el curso centraliza y le pone una freshness note a cada número. Concretamente, en tus propios docs: cítalo como un promedio sobre una familia de benchmarks en vez de una promesa por instrucción, anota que se revisó hacia abajo desde 9.9x, y nunca lo pegues a un programa específico — menos que nada a un contador de dos campos, que es el peor caso para la ganancia."  # @src=2361bbab72d0
            options:                 # source order — keep it
              c:
                # | As a figure that kicks in once the account exceeds the 10,240-byte
                # | zero-copy init limit.
                label: "Como una cifra que entra en juego una vez que la cuenta excede el límite de init zero-copy de 10,240 bytes."  # @src=5b82286bc29a
                # | That 10,240-byte limit governs how large an account init can create, not
                # | where CU savings appear. There is no size gate on the benchmark — tiny
                # | programs simply have the least deserialize cost to erase.
                feedback: "Ese límite de 10,240 bytes rige qué tan grande puede ser la cuenta que crea un init, no dónde aparecen los ahorros de CU. No hay ningún criterio de tamaño en el benchmark — los programas diminutos simplemente tienen el menor costo de deserialización que borrar."  # @src=85ff62128ed1
              d:
                # | As the 94% smaller-bytecode figure instead, since a size number does not
                # | drift the way a CU average does
                label: "Como la cifra de 94% menos bytecode en cambio, ya que un número de tamaño no deriva de la manera en que sí deriva un promedio de CU"  # @src=dce55578861b
                # | Reaching for the sturdier-looking metric is a sound instinct when a
                # | number keeps moving. Both numbers moved in the same commit, 95% to 94%
                # | alongside 9.9x to 8.8x, so the size figure needs the same date stamp and
                # | the same hedge the CU one does.
                feedback: "Recurrir a la métrica que se ve más robusta es un instinto sano cuando un número no deja de moverse. Los dos números se movieron en el mismo commit, 95% a 94% junto con 9.9x a 8.8x, así que la cifra de tamaño necesita el mismo sello de fecha y la misma cautela que la de CU."  # @src=35b5b9ee2deb
              b:
                # | As a guaranteed per-instruction speedup a V2 program inherits just by
                # | compiling on the RC.
                label: "Como una aceleración garantizada por instrucción que un programa de V2 hereda solo por compilar en la RC."  # @src=f2ef56ce016e
                # | It's an average across a benchmark family, not a per-program guarantee;
                # | the benchmark page itself warns the alpha values move as codegen
                # | changes, and a two-field counter is its worst case.
                feedback: "Es un promedio sobre una familia de benchmarks, no una garantía por programa; la propia página del benchmark advierte que los valores alpha se mueven cuando cambia el codegen, y un contador de dos campos es su peor caso."  # @src=2134c75e02df
              a:
                # | As an approximate benchmark-family average, already revised down once
                # | and expected to keep moving.
                label: "Como un promedio aproximado de la familia de benchmarks, ya revisado hacia abajo una vez y con la expectativa de que siga moviéndose."  # @src=d1f01ece83bf
                # | A number whose own authors have already trimmed it once should travel
                # | with that history attached. Pin it to one program and you will be wrong
                # | in the least forgiving direction: the leanest handlers gain least.
                feedback: "Un número que sus propios autores ya recortaron una vez tiene que viajar con esa historia pegada. Átalo a un programa y te vas a equivocar en la dirección menos indulgente: los handlers más livianos ganan menos."  # @src=58fbfa1406dc
  m02-l2:
    # | Pod data types, lists in an account, and zero-copy events
    title: "Tipos de datos Pod, listas en una cuenta y eventos zero-copy"  # @src=800d0e2fa5e3
    blocks:
      high-score-cutoff:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | While board.len() < cap, every score is admitted — no comparison needed.
          0: "Mientras board.len() < cap, todo puntaje se admite — no hace falta ninguna comparación."  # @src=99e8018d3372
          # | When the board is full, the decision is `beats_cutoff` — implement it
          # | (strictly greater gets in, ties do not) and route the full-board branch of
          # | `admit` through it.
          1: "Cuando el board está lleno, la decisión es `beats_cutoff` — impleméntala (estrictamente mayor entra, los empates no) y enruta por ella la rama de `admit` para board lleno."  # @src=7040a0497042
          # | Sort highest-first, truncate to cap, and return the last (smallest) retained
          # | score — the truncate matters even for a board that arrives over capacity.
          2: "Ordena de mayor a menor, trunca a cap, y devuelve el último puntaje retenido (el más chico) — el truncado importa incluso para un board que llega sobre capacidad."  # @src=3af55e17f97a
        tests:                      # keyed by test case id
          t1:
            # | a new high score evicts the lowest and becomes the new cutoff
            description: "un puntaje nuevo y más alto desaloja al más bajo y se vuelve el nuevo cutoff"  # @src=3988dce343b5
          t2:
            # | a score below the cutoff is rejected on a full board
            description: "un puntaje por debajo del cutoff se rechaza en un board lleno"  # @src=9a31c167660b
          t3:
            # | a score is admitted freely while the board is under capacity
            description: "un puntaje se admite libremente mientras el board está bajo capacidad"  # @src=29d4fdc7243f
          t4:
            # | the first score on an empty board is the cutoff
            description: "el primer puntaje en un board vacío es el cutoff"  # @src=34662de83279
          t5:
            # | a score that only ties the cutoff leaves the cutoff exactly where it was
            description: "un puntaje que solo empata el cutoff deja el cutoff exactamente donde estaba"  # @src=6476fe4e4ef4
          t6:
            # | an over-capacity board must be trimmed to cap: with 95 admitted the retained
            # | top 3 are 100/95/90, so the cutoff is 90 and not the 70 an untrimmed board
            # | would report
            description: "un board sobre capacidad tiene que recortarse a cap: con 95 admitido, el top 3 retenido es 100/95/90, así que el cutoff es 90 y no el 70 que reportaría un board sin recortar"  # @src=10d3100279da
          t7:
            # | the trim happens even when the new score is rejected: the retained top 3 are
            # | 100/90/80
            description: "el recorte pasa incluso cuando el puntaje nuevo se rechaza: el top 3 retenido es 100/90/80"  # @src=6d1465349f60
      check:                      # quiz
        questions:
          m02-l2-q1:
            # | Your high-score Slab has MAX = 10 and is full when a player posts an 11th,
            # | higher score. What does the Slab do on its own?
            prompt: "Tu Slab de puntajes tiene MAX = 10 y está lleno cuando un jugador publica un puntaje número 11, más alto. ¿Qué hace el Slab por su cuenta?"  # @src=a2239d87d471
            # | A Pod list has a compile-time capacity. You size for the worst case and
            # | manage insertion and eviction yourself; a write past MAX is a hard error.
            # | That fixed cap is exactly the price of a serialization-free list — the point
            # | of the high-score-cutoff challenge. The Slab does have one escape valve,
            # | resize_to_capacity(n), which reallocs the account and settles the rent
            # | difference — but it is an instruction you deliberately run, never a side
            # | effect of try_push, and nothing grows behind your back.
            explanation: "Una lista Pod tiene una capacidad en tiempo de compilación. Dimensionas para el peor caso y manejas la inserción y el desalojo tú mismo; una escritura más allá de MAX es un error duro. Ese tope fijo es exactamente el precio de una lista sin serialización — el punto del Challenge high-score-cutoff. El Slab sí tiene una válvula de escape, resize_to_capacity(n), que realoca la cuenta y liquida la diferencia de rent — pero es una instrucción que corres deliberadamente, nunca un efecto secundario de try_push, y nada crece a tus espaldas."  # @src=9cc6bbf61ae9
            options:                 # source order — keep it
              d:
                # | It wraps to slot 0 like a ring buffer, so the eleventh post overwrites
                # | the oldest one
                label: "Da la vuelta hasta el slot 0 como un ring buffer, así que la publicación número once sobrescribe la más vieja"  # @src=5a2a592529fa
                # | A fixed-capacity buffer that wraps is a familiar shape, and it would
                # | make try_push infallible, which is the tell that this is not it.
                # | try_push past capacity returns an Err, and which entry to drop is a
                # | policy the Slab has no opinion about.
                feedback: "Un buffer de capacidad fija que da la vuelta es una forma familiar, y haría que try_push fuera infalible, que es la señal de que no es esto. try_push más allá de la capacidad devuelve un Err, y cuál entrada descartar es una política sobre la que el Slab no tiene opinión."  # @src=7470c3c5342f
              a:
                # | It calls resize_to_capacity(11) for you, so try_push still succeeds on a
                # | full board.
                label: "Llama a resize_to_capacity(11) por ti, así que try_push igual tiene éxito en un board lleno."  # @src=77e8e7580a26
                # | resize_to_capacity(n) is a real Slab method, but it is an explicit call
                # | that reallocs the account and settles rent. try_push past capacity
                # | returns an Err; it never reallocs behind your back.
                feedback: "resize_to_capacity(n) es un método real del Slab, pero es una llamada explícita que realoca la cuenta y liquida rent. try_push más allá de la capacidad devuelve un Err; nunca realoca a tus espaldas."  # @src=9c11acc6a2a0
              b:
                # | Nothing automatic — you evict yourself; a write past MAX is an error,
                # | not a resize.
                label: "Nada automático — desalojas tú mismo; una escritura más allá de MAX es un error, no un resize."  # @src=09fc8c79a5ed
                # | Capacity is fixed when the type compiles, and the admission policy is
                # | yours. One method does grow the account, but it reallocs and settles
                # | rent, and you call it on purpose.
                feedback: "La capacidad queda fija cuando el tipo compila, y la política de admisión es tuya. Un método sí hace crecer la cuenta, pero realoca y liquida rent, y lo llamas a propósito."  # @src=75d4b15e1fa9
              c:
                # | It drops the oldest entry for you, using the Slab's live-length field to
                # | find the stalest slot.
                label: "Descarta la entrada más vieja por ti, usando el campo de longitud activa del Slab para encontrar el slot más rancio."  # @src=4a14ee855d8d
                # | There is no built-in eviction policy of any kind. The 4-byte length
                # | field tracks how many items are live, not how old they are — admitting
                # | and evicting is logic you write.
                feedback: "No hay ninguna política de desalojo incorporada de ningún tipo. El campo de longitud de 4 bytes lleva la cuenta de cuántos ítems están activos, no de cuán viejos son — admitir y desalojar es lógica que escribes tú."  # @src=af85d60fe98b
          m02-l2-q2:
            # | You emit a #[event(bytemuck)] high-score event, but a downstream indexer
            # | built for #[event] can't parse it. Why?
            prompt: "Emites un evento de puntaje #[event(bytemuck)], pero un indexador aguas abajo construido para #[event] no lo puede parsear. ¿Por qué?"  # @src=7d3209a51178
            # | #[event] is wincode/borsh-wire; #[event(bytemuck)] is a zero-copy memcpy —
            # | cheaper by mechanism, though the project publishes no number for that gap
            # | (its 3-10x CU figure compares the plain #[event] against v1's borsh events,
            # | not bytemuck against plain). Both go out via sol_log_data, but the bytes
            # | differ — every consumer must decode with the same variant the program emits.
            # | Both also prefix the payload with the same 8-byte event discriminator, so
            # | the tag match still succeeds and only the decode fails, which is why the
            # | symptom is garbage fields rather than a missing event.
            explanation: "#[event] es formato wincode/borsh; #[event(bytemuck)] es un memcpy zero-copy — más barato por mecanismo, aunque el proyecto no publica ningún número para esa brecha (su cifra de 3-10x en CU compara el #[event] simple contra los eventos borsh de v1, no bytemuck contra el simple). Las dos salen por sol_log_data, pero los bytes difieren — todo consumidor tiene que decodificar con la misma variante que emite el programa. Las dos también le ponen adelante al payload el mismo discriminador de evento de 8 bytes, así que la coincidencia del tag igual tiene éxito y solo falla la decodificación, que es por lo que el síntoma son campos basura en vez de un evento faltante."  # @src=1fe1007d918b
            options:                 # source order — keep it
              a:
                # | bytemuck events bypass sol_log_data and write to account data instead,
                # | so nothing lands in the logs.
                label: "Los eventos bytemuck se saltan sol_log_data y escriben en los datos de la cuenta en su lugar, así que nada aterriza en los logs."  # @src=d812a9111855
                # | Both variants lower to sol_log_data and show up as a `Program data:`
                # | line on the confirmed transaction. The event is genuinely in the logs —
                # | the reader just can't decode it.
                feedback: "Las dos variantes bajan a sol_log_data y aparecen como una línea `Program data:` en la transacción confirmada. El evento está genuinamente en los logs — el lector simplemente no lo puede decodificar."  # @src=703b51ff5f77
              d:
                # | Both variants write identical bytes; the reader fails because it decodes
                # | the payload before matching the tag
                label: "Las dos variantes escriben bytes idénticos; el lector falla porque decodifica el payload antes de comparar el tag"  # @src=bd78b6baff2b
                # | Blaming the reader's order of operations is a fair first theory when the
                # | tag matches and the fields come out wrong. The tag matches because both
                # | variants prefix the same 8 bytes; what differs is the payload behind it,
                # | wincode-serialized in one variant and a raw memcpy in the other.
                feedback: "Culpar al orden de operaciones del lector es una primera teoría razonable cuando el tag coincide y los campos salen mal. El tag coincide porque las dos variantes le ponen adelante los mismos 8 bytes; lo que difiere es el payload detrás, serializado con wincode en una variante y un memcpy crudo en la otra."  # @src=2fb80f339f23
              c:
                # | The two variants put different bytes on the wire: a raw memcpy versus
                # | wincode/borsh serialization.
                label: "Las dos variantes ponen bytes distintos en el cable: un memcpy crudo frente a serialización wincode/borsh."  # @src=c3be5033c91d
                # | Same syscall, same 8-byte tag: the reader matches the event and then
                # | mis-decodes it, which is why you get nonsense fields instead of silence.
                feedback: "Mismo syscall, mismo tag de 8 bytes: el lector hace coincidir el evento y después lo decodifica mal, que es por lo que sacas campos sin sentido en vez de silencio."  # @src=79b946a1e1ab
              b:
                # | #[event(bytemuck)] derives a different 8-byte discriminator, so the
                # | reader's tag match never fires.
                label: "#[event(bytemuck)] deriva un discriminador de 8 bytes distinto, así que la coincidencia de tag del lector nunca se dispara."  # @src=5e48db1efc67
                # | The discriminator is derived from the event type the same way in both
                # | variants, so the tag match succeeds. The mismatch is in the payload
                # | bytes that follow those 8 bytes.
                feedback: "El discriminador se deriva del tipo de evento de la misma forma en las dos variantes, así que la coincidencia del tag tiene éxito. El desajuste está en los bytes de payload que vienen después de esos 8 bytes."  # @src=e71423780f49
          m02-l2-q3:
            # | You store the board as a bare [Score; 10] and start getting
            # | misaligned-reference warnings when reading a field. What's the right fix?
            prompt: "Guardas el board como un [Score; 10] desnudo y empiezas a recibir advertencias de referencia desalineada al leer un campo. ¿Cuál es el arreglo correcto?"  # @src=3cb3392046b9
            # | Alignment discipline is the Pod tax. PodU64, #[derive(bytemuck::Pod)], and
            # | Nested<T> keep every field aligned so the direct byte cast is valid — PodU64
            # | stores the value as a [u8; 8] with alignment 1, so it reads correctly from
            # | any offset in the tail. repr(packed) creates the exact misaligned-reference
            # | hazard you're seeing, and dropping to BorshAccount<T> forfeits the whole
            # | reason you're using Pod: you'd be paying a whole-list serialize on every
            # | touch to solve a field-layout problem.
            explanation: "La disciplina de alineación es el impuesto de Pod. PodU64, #[derive(bytemuck::Pod)] y Nested<T> mantienen alineado cada campo para que el cast de bytes directo sea válido — PodU64 guarda el valor como un [u8; 8] con alineación 1, así que se lee correctamente desde cualquier offset de la cola. repr(packed) crea exactamente el peligro de referencia desalineada que estás viendo, y bajar a BorshAccount<T> renuncia a toda la razón por la que usas Pod: estarías pagando una serialización de toda la lista en cada toque para resolver un problema de layout de campos."  # @src=f24e026269fc
            options:                 # source order — keep it
              c:
                # | Move the account to BorshAccount<Cabinet> with a Vec<Score>, since borsh
                # | reads at any offset.
                label: "Pasa la cuenta a BorshAccount<Cabinet> con un Vec<Score>, ya que borsh lee en cualquier offset."  # @src=37eeb0fba528
                # | BorshAccount<T> is a real V2 escape hatch for genuinely variable-length
                # | data, but reaching for it here forfeits the byte cast to dodge an
                # | alignment issue the Pod wrappers solve directly.
                feedback: "BorshAccount<T> es una escotilla de escape real de V2 para datos genuinamente de largo variable, pero recurrir a ella acá renuncia al cast de bytes para esquivar un problema de alineación que los wrappers Pod resuelven directamente."  # @src=d8358dc4f53b
              a:
                # | Use PodU64 and Nested<T> so every field's alignment is defined and the
                # | byte cast stays sound.
                label: "Usa PodU64 y Nested<T> para que la alineación de cada campo quede definida y el cast de bytes siga siendo sólido."  # @src=7ed702bbb4bd
                # | The condition the cast needs is a defined alignment on every field.
                # | Packing removes it and manufactures the exact reference the warning is
                # | pointing at.
                feedback: "La condición que el cast necesita es una alineación definida en cada campo. Hacer packing la quita y fabrica exactamente la referencia a la que apunta la advertencia."  # @src=f11ef1f9a264
              b:
                # | Add #[repr(packed)] to the Score struct so the padding the cast is
                # | complaining about is removed.
                label: "Agrega #[repr(packed)] a la struct Score para que se quite el relleno del que el cast se está quejando."  # @src=f75163d1d1f1
                # | repr(packed) is what CREATES misaligned references — taking a reference
                # | to a packed field is the footgun, not the fix. It guarantees the exact
                # | hazard the warning is pointing at.
                feedback: "repr(packed) es lo que CREA referencias desalineadas — tomar una referencia a un campo packed es la trampa, no el arreglo. Garantiza exactamente el peligro al que apunta la advertencia."  # @src=79e106c52e54
              d:
                # | Add #[repr(align(8))] to Score so that each tail slot starts on an
                # | 8-byte boundary
                label: "Agrega #[repr(align(8))] a Score para que cada slot de cola empiece en un límite de 8 bytes"  # @src=795264a1c086
                # | Naming the alignment you want is a reasonable move, and it does change
                # | what the type demands. It does not change where the tail lands: an item
                # | sits at whatever offset the header and the 4-byte length field push it
                # | to, so raising the requirement makes more of those offsets illegal
                # | rather than fewer. Alignment-1 wrappers read correctly from any of them.
                feedback: "Nombrar la alineación que quieres es un movimiento razonable, y sí cambia lo que el tipo exige. No cambia dónde aterriza la cola: un ítem se sienta en el offset al que lo empujen el header y el campo de longitud de 4 bytes, así que subir el requisito hace ilegales más de esos offsets, no menos. Los wrappers de alineación 1 se leen correctamente desde cualquiera de ellos."  # @src=19f98cdf0e85
  m02-l3:
    # | The borsh escape hatch: when Pod isn't enough
    title: "La escotilla de escape de borsh: cuando Pod no alcanza"  # @src=188adf262d9a
    blocks:
      check:                      # quiz
        questions:
          m02-l3-q1:
            # | A cabinet field must hold an arbitrary-length player-supplied username. How
            # | do you model it?
            prompt: "Un campo de la máquina tiene que guardar un nombre de usuario de largo arbitrario que provee el jugador. ¿Cómo lo modelas?"  # @src=11d015c308da
            # | Pod means a fixed compile-time layout. Genuinely unbounded data needs
            # | BorshAccount<T>, which deserializes on read — you pay the cost V2 avoids by
            # | default, in exchange for variable length. A PodVec is only right if a fixed
            # | maximum is acceptable. The #[account(borsh)] attribute is what opts the type
            # | out of the T: Pod requirement and into that deserialize-on-read model;
            # | BorshAccount<T> is the wrapper you write in the accounts context where
            # | Account<T> would otherwise go.
            explanation: "Pod quiere decir un layout fijo de tiempo de compilación. Los datos genuinamente no acotados necesitan BorshAccount<T>, que deserializa al leer — pagas el costo que V2 evita por defecto, a cambio de largo variable. Un PodVec solo es correcto si un máximo fijo es aceptable. El atributo #[account(borsh)] es lo que saca al tipo del requisito T: Pod y lo mete en ese modelo de deserialización al leer; BorshAccount<T> es el wrapper que escribes en el contexto de cuentas donde si no iría Account<T>."  # @src=9c1e6c6d8fe1
            options:                 # source order — keep it
              d:
                # | Hash the name off-chain and keep just its 32-byte digest in the Pod
                # | header instead
                label: "Hashea el nombre off-chain y guarda solo su digest de 32 bytes en el header Pod"  # @src=0d26ec6e7fc8
                # | For a field you compare but never display this is a genuinely good
                # | design, and [u8; 32] really is Pod. The spec here says the account holds
                # | the name, and a digest does not hold it: you have solved a neighbouring
                # | problem and added an off-chain lookup to render anything.
                feedback: "Para un campo que comparas pero nunca muestras este es un diseño genuinamente bueno, y [u8; 32] de verdad es Pod. La especificación acá dice que la cuenta guarda el nombre, y un digest no lo guarda: resolviste un problema vecino y agregaste una búsqueda off-chain para poder renderizar cualquier cosa."  # @src=a2457fc1375c
              b:
                # | #[account(borsh)] + BorshAccount<T> — the escape hatch for unbounded
                # | data.
                label: "#[account(borsh)] + BorshAccount<T> — la escotilla de escape para datos no acotados."  # @src=63a8fa813830
                # | That attribute is what releases a type from the flat-layout bound:
                # | variable length, paid for on every read. A capped vector wins only where
                # | a fixed maximum genuinely satisfies the spec.
                feedback: "Ese atributo es lo que libera a un tipo del requisito de layout plano: largo variable, pagado en cada lectura. Un vector con tope gana solo donde un máximo fijo satisface de verdad la especificación."  # @src=e4ecdb6aa27a
              a:
                # | Pod with a PodVec<u8, 64> — cap the name at 64 bytes and stay on the
                # | direct cast.
                label: "Pod con un PodVec<u8, 64> — limita el nombre a 64 bytes y quédate en el cast directo."  # @src=9394725f655d
                # | That caps the name at 64 bytes. Fine IF you accept a fixed maximum, but
                # | the field is specified as arbitrary-length, which a PodVec cannot be.
                feedback: "Eso limita el nombre a 64 bytes. Está bien SI aceptas un máximo fijo, pero el campo está especificado como de largo arbitrario, que un PodVec no puede ser."  # @src=2aedb2b7c8a5
              c:
                # | Pod with a raw String field — Account<T> serializes the String behind
                # | the cast.
                label: "Pod con un campo String crudo — Account<T> serializa el String detrás del cast."  # @src=473e76c3f134
                # | Account<T> never serializes anything; it casts, which is exactly why it
                # | requires T: Pod. String is a heap pointer plus a length, not a run of
                # | bytes, so this fails with the trait-bound error that opened the lesson.
                feedback: "Account<T> nunca serializa nada; hace un cast, que es exactamente por qué exige T: Pod. String es un puntero al heap más un largo, no una corrida de bytes, así que esto falla con el error de trait bound que abrió la lección."  # @src=c2a77f918c3a
          m02-l3-q2:
            # | You move a struct with a HashMap field from borsh to V2's wincode and the
            # | on-chain bytes now differ run to run. Why?
            prompt: "Mueves un struct con un campo HashMap de borsh al wincode de V2 y ahora los bytes on-chain difieren de corrida en corrida. ¿Por qué?"  # @src=d575f7524acf
            # | wincode's BORSH_CONFIG is byte-identical to borsh EXCEPT for exactly two
            # | things: HashMap/HashSet ordering and f32/f64 NaN acceptance. Depend on map
            # | iteration order and you get non-deterministic wire — one of the two holes to
            # | know before you rely on borsh compatibility. The root cause is that a Rust
            # | HashMap has no defined iteration order at all: std deliberately randomizes
            # | it to defend against hash-flooding, so each encoder has to resolve that
            # | non-determinism itself, and the two resolved it differently.
            explanation: "El BORSH_CONFIG de wincode es idéntico byte a byte a borsh EXCEPTO en exactamente dos cosas: el ordenamiento de HashMap/HashSet y si f32/f64 aceptan NaN. Depende del orden de iteración del map y tienes un wire no determinista — uno de los dos agujeros que hay que conocer antes de apoyarte en la compatibilidad con borsh. La causa raíz es que un HashMap de Rust no tiene ningún orden de iteración definido: std lo aleatoriza a propósito para defenderse del hash-flooding, así que cada codificador tiene que resolver ese no determinismo por su cuenta, y los dos lo resolvieron distinto."  # @src=ce93254391f6
            options:                 # source order — keep it
              d:
                # | wincode writes a HashMap's length prefix as u64 where borsh uses u32
                label: "wincode escribe el prefijo de largo de un HashMap como u64 donde borsh usa u32"  # @src=c18a71bd09be
                # | Encoders really do disagree about prefix widths, so this is the right
                # | family of bug to suspect. wincode's BORSH_CONFIG is byte-identical to
                # | borsh on length prefixes and entry encoding; the two documented
                # | exceptions are map ordering and NaN.
                feedback: "Los codificadores de verdad discrepan sobre los anchos de prefijo, así que esta es la familia correcta de bug para sospechar. El BORSH_CONFIG de wincode es idéntico byte a byte a borsh en los prefijos de largo y en la codificación de entradas; las dos excepciones documentadas son el ordenamiento del map y NaN."  # @src=20072f67cdf4
              e:
                # | NaN acceptance differs between the two encoders, not map ordering
                label: "La aceptación de NaN difiere entre los dos codificadores, no el ordenamiento del map"  # @src=2a5ba337bcbd
                # | Half an answer: there are exactly two holes and this is the other one.
                # | NaN bites a struct carrying a float, and it would not produce different
                # | bytes run to run for the same logical state, which is the symptom in
                # | front of you.
                feedback: "Media respuesta: hay exactamente dos agujeros y este es el otro. NaN muerde a un struct que lleva un float, y no produciría bytes distintos de corrida en corrida para el mismo estado lógico, que es el síntoma que tienes delante."  # @src=651b871cfec2
              c:
                # | wincode and borsh resolve HashMap/HashSet iteration order differently.
                label: "wincode y borsh resuelven el orden de iteración de HashMap/HashSet de manera distinta."  # @src=2e14a9c0be63
                # | Nothing is unsupported and nothing is compressed — two encoders just
                # | answered a question the language leaves open. You'll only notice on a
                # | second run, which is what makes it a nasty one to catch.
                feedback: "Nada está sin soporte y nada está comprimido — dos codificadores simplemente respondieron una pregunta que el lenguaje deja abierta. Solo lo vas a notar en una segunda corrida, que es lo que lo vuelve uno feo de agarrar."  # @src=5b707eb2c742
              b:
                # | HashMap isn't serializable under wincode's BORSH_CONFIG at all.
                label: "HashMap no es serializable en absoluto bajo el BORSH_CONFIG de wincode."  # @src=1ac6d56fb1d7
                # | It serializes fine under BORSH_CONFIG — the type is fully supported. The
                # | hole is that std randomizes HashMap iteration order per run, so the
                # | order isn't pinned.
                feedback: "Se serializa bien bajo BORSH_CONFIG — el tipo está soportado por completo. El agujero es que std aleatoriza el orden de iteración de HashMap en cada corrida, así que el orden no queda fijado."  # @src=96bf5b6acf01
              a:
                # | wincode compresses map entries, so the encoded length varies per write.
                label: "wincode comprime las entradas del map, así que el largo codificado varía en cada escritura."  # @src=516dfdbf9a3e
                # | wincode compresses nothing — BORSH_CONFIG is byte-identical to borsh on
                # | length prefixes and entry encoding. What varies is the ORDER the entries
                # | land in, not their size.
                feedback: "wincode no comprime nada — BORSH_CONFIG es idéntico byte a byte a borsh en los prefijos de largo y en la codificación de entradas. Lo que varía es el ORDEN en que caen las entradas, no su tamaño."  # @src=9d10f30601bc
          m02-l3-q3:
            # | After bumping a dependency, your #[account(borsh)] code stops compiling with
            # | a trait-bound error. Which real RC-era incident does this echo?
            prompt: "Después de subir una dependencia, tu código #[account(borsh)] deja de compilar con un error de trait bound. ¿De qué incidente real de la era RC es esto un eco?"  # @src=1c93a42b160a
            # | Issue #4937 (filed 2026-08-16, closed 2026-08-20) is the RC's first war
            # | story: a mismatch between anchor-lang's wincode 0.5 pin and the wincode 0.6
            # | that solana-address 2.7.0 requires produced a trait-bound error that broke
            # | #[account(borsh)] until the pins were reconciled. It's exactly why the
            # | course centralizes pins with freshness notes. Note the failure mode — not a
            # | runtime bug and not a subtle wire mismatch, but a green build on Monday and
            # | a compile error on Tuesday in a feature you never touched, which is what
            # | floating a single crate looks like.
            explanation: "El issue #4937 (abierto el 2026-08-16, cerrado el 2026-08-20) es la primera historia de guerra de la RC: un desajuste entre el pin de wincode 0.5 de anchor-lang y el wincode 0.6 que exige solana-address 2.7.0 produjo un error de trait bound que rompió #[account(borsh)] hasta que los pins se reconciliaron. Es exactamente por qué el curso centraliza los pins con notas de frescura. Fíjate en el modo de falla — no un bug de runtime y no un desajuste sutil de wire, sino un build verde el lunes y un error de compilación el martes en un feature que nunca tocaste, que es cómo se ve dejar flotar un solo crate."  # @src=105218665f6b
            options:                 # source order — keep it
              b:
                # | The @coral-xyz/anchor → @anchor-lang/core rename.
                label: "El renombrado de @coral-xyz/anchor → @anchor-lang/core."  # @src=bfecd85b6d61
                # | That rename is an npm client-package story about download counts and
                # | import paths. It cannot produce a Rust trait-bound error, because the TS
                # | client isn't in the crate graph that compiles #[account(borsh)].
                feedback: "Ese renombrado es una historia de paquete cliente de npm sobre conteos de descargas y rutas de import. No puede producir un error de trait bound de Rust, porque el cliente TS no está en el grafo de crates que compila #[account(borsh)]."  # @src=8c6df3fe1666
              a:
                # | Issue #4937 — anchor's wincode 0.5 pin versus the wincode 0.6 that
                # | solana-address 2.7.0 requires.
                label: "El issue #4937 — el pin de wincode 0.5 de anchor contra el wincode 0.6 que solana-address 2.7.0 exige."  # @src=a8510027a33f
                # | Two majors of one crate in a single graph, and the trait bound stops
                # | resolving. Pins reconciled, issue closed, four days end to end. What you
                # | remember is the shape: green on Monday, broken on Tuesday, nothing of
                # | yours changed.
                feedback: "Dos mayores de un mismo crate en un solo grafo, y el trait bound deja de resolverse. Pins reconciliados, issue cerrado, cuatro días de punta a punta. Lo que recuerdas es la forma: verde el lunes, roto el martes, nada tuyo cambió."  # @src=dffa1c20425a
              e:
                # | The 2026-08-12 crates.io publish of 2.0.0-rc.1, which shipped
                # | undocumented and untested for installs
                label: "La publicación en crates.io del 2026-08-12 de 2.0.0-rc.1, que se entregó sin documentar y sin probar para instalaciones"  # @src=095c09e24691
                # | That publish is real and it is flagged as a red herring, so filing it
                # | under trouble is fair. Its risk is an install path nobody tests, not a
                # | type error: the compile break came from two wincode majors meeting in
                # | one dependency graph.
                feedback: "Esa publicación es real y está marcada como pista falsa, así que archivarla bajo problemas es justo. Su riesgo es un camino de instalación que nadie prueba, no un error de tipos: la rotura de compilación vino de dos mayores de wincode encontrándose en un mismo grafo de dependencias."  # @src=64c89c5bfbca
              c:
                # | The Cashio exploit — an unvalidated collateral account.
                label: "El exploit de Cashio — una cuenta de colateral sin validar."  # @src=1208a85afc12
                # | Cashio is a runtime security incident about a missing account check —
                # | territory for the DeFi & RWA Engineering course. A missing constraint
                # | fails on-chain at execution; it never breaks a build.
                feedback: "Cashio es un incidente de seguridad en runtime sobre una verificación de cuenta faltante — territorio del curso DeFi & RWA Engineering. Un constraint faltante falla on-chain en ejecución; nunca rompe un build."  # @src=bad494597f6e
              d:
                # | The litesvm 0.11-to-0.15 jump, where the harness's SVM major moves under
                # | a test suite that was green
                label: "El salto de litesvm 0.11 a 0.15 en el que el mayor de SVM del banco de pruebas se mueve debajo de una suite de pruebas que estaba verde"  # @src=a30e67160390
                # | The course warns about exactly that pin, so this is the right instinct
                # | pointed one layer off. A dev-dependency governs how your tests run and
                # | cannot break a trait bound inside the program crate; #4937 is a mismatch
                # | between two crates the program itself compiles against.
                feedback: "El curso advierte exactamente sobre ese pin, así que este es el instinto correcto apuntado una capa más allá. Una dev-dependency gobierna cómo corren tus pruebas y no puede romper un trait bound dentro del crate del programa; #4937 es un desajuste entre dos crates contra los que compila el programa mismo."  # @src=b9625af1f878
          m02-l3-q4:
            # | An account needs a fixed [u8; 32] key, a leaderboard of at most 10 scores,
            # | and a free-form description. What's the best modeling?
            prompt: "Una cuenta necesita una clave fija [u8; 32], una tabla de posiciones con 10 puntajes como máximo, y una descripción de formato libre. ¿Cuál es el mejor modelado?"  # @src=6c6df4a0fc16
            # | Model fixed and bounded state as Pod for the CU win and isolate the
            # | genuinely unbounded part behind the borsh escape hatch. That mixed-tier
            # | design is the whole point: borsh where Pod can't reach, Pod everywhere else.
            # | The payoff is scoped cost — a handler that only bumps the leaderboard
            # | touches the Pod core and never deserializes anything — plus scoped rent,
            # | since a borsh account must be sized for the largest string you will ever
            # | store and splitting keeps that worst case off the hot account.
            explanation: "Modela el estado fijo y acotado como Pod por la ganancia de CU y aísla la parte genuinamente no acotada detrás de la escotilla de escape de borsh. Ese diseño de niveles mixtos es todo el punto: borsh donde Pod no llega, Pod en todo el resto. La recompensa es un costo acotado — un handler que solo actualiza la tabla de posiciones toca el core Pod y nunca deserializa nada — más un rent acotado, ya que una cuenta borsh tiene que dimensionarse para la cadena más grande que vayas a guardar y dividir mantiene ese peor caso fuera de la cuenta caliente."  # @src=43e2ffadb543
            options:                 # source order — keep it
              c:
                # | Make all three Pod, with the description as a raw String in the same
                # | struct.
                label: "Hacer los tres Pod, con la descripción como un String crudo en el mismo struct."  # @src=b082defd4b85
                # | String isn't Pod, so the struct won't compile at all — and merging the
                # | unbounded field into the core struct is precisely the move that forces
                # | the split in the first place.
                feedback: "String no es Pod, así que el struct no va a compilar en absoluto — y fusionar el campo no acotado en el struct core es precisamente la jugada que fuerza la división en primer lugar."  # @src=90cecfdfca14
              a:
                # | Put all three in one BorshAccount<T> so the whole record deserializes at
                # | once.
                label: "Meter los tres en un solo BorshAccount<T> para que el registro entero se deserialice de una vez."  # @src=9f5cb0bca260
                # | Deserializing the whole record drops zero-copy on the fixed key and the
                # | bounded board for no reason, and the cost is proportional to the
                # | account's full size on EVERY touch — so the hot leaderboard path pays a
                # | tax two-thirds of the account never needed.
                feedback: "Deserializar el registro entero abandona el zero-copy en la clave fija y en la tabla acotada sin razón, y el costo es proporcional al tamaño completo de la cuenta en CADA toque — así que el camino caliente de la tabla de posiciones paga un impuesto que dos tercios de la cuenta nunca necesitaron."  # @src=3decf93cea52
              d:
                # | Split it in two and make both halves borsh, which generally reads
                # | simpler
                label: "Dividirla en dos y hacer borsh las dos mitades, que en general se lee más simple"  # @src=b365d0c81a65
                # | The split is the right half of the answer, and the reason for it is what
                # | the other half hangs on: you split so the hot fixed state keeps its byte
                # | cast. Make both halves borsh and a handler that only bumps the
                # | leaderboard pays a deserialize it never needed, which is the cost the
                # | split existed to avoid.
                feedback: "La división es la mitad correcta de la respuesta, y la razón de ella es de lo que cuelga la otra mitad: divides para que el estado fijo caliente conserve su cast de bytes. Haz borsh las dos mitades y un handler que solo actualiza la tabla de posiciones paga una deserialización que nunca necesitó, que es el costo que la división existía para evitar."  # @src=d7522c4f095a
              b:
                # | Pod core for the key and bounded board; borsh only for the description.
                label: "Core Pod para la clave y la tabla acotada; borsh solo para la descripción."  # @src=1ddb60fbd71a
                # | Splitting keeps the hot path off the deserializer: bump the board and
                # | you touch only the cast-in-place core. Rent falls out of it too, because
                # | the worst-case sizing now applies to one field instead of the whole
                # | record.
                feedback: "Dividir mantiene el camino caliente fuera del deserializador: actualiza la tabla y solo tocas el core casteado en el lugar. El rent también se desprende de ahí, porque el dimensionamiento del peor caso ahora aplica a un campo en vez de al registro entero."  # @src=e2ecf0c6e0ef
  m03-l1:
    # | PDAs & canonical bumps in V2
    title: "PDAs y bumps canónicos en V2"  # @src=672e7e297166
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | Your `init_vault` handler needs to sign a withdrawal CPI later as the vault
            # | PDA. To keep that cheap and correct, what do you do with the bump the macro
            # | hands you during validation?
            prompt: "Tu handler `init_vault` necesita firmar más adelante una CPI de withdraw como el PDA del vault. Para que eso salga barato y correcto, ¿qué haces con el bump que la macro te entrega durante la validación?"  # @src=2ccc034993e5
            # | The canonical bump is stable for a given seed set, so you read it once at
            # | init from the typed `ctx.bumps.vault` field, persist it in the account, and
            # | reuse it as `bump = vault.bump`. That is both the CU-cheap path and the safe
            # | one — no runtime search, no trusting client input. Be precise about what
            # | `ctx.bumps.vault` is: a generated struct field on every Anchor line since
            # | 0.29, not a V2 invention, and V2's macro-time const applies only to an
            # | all-literal seed scheme — not to this vault, whose seeds include the player
            # | key and therefore still derive during validation.
            explanation: "El bump canónico es estable para un conjunto de seeds dado, así que lo lees una vez en el init desde el campo tipado `ctx.bumps.vault`, lo persistes en la cuenta, y lo reutilizas como `bump = vault.bump`. Ese es a la vez el camino barato en CU y el seguro — ninguna búsqueda en tiempo de ejecución, ninguna confianza en la entrada del cliente. Sé preciso sobre qué es `ctx.bumps.vault`: un campo de struct generado en todas las líneas de Anchor desde la 0.29, no un invento de V2, y la const en tiempo de macro de V2 aplica solo a un esquema de seeds todo-literal — no a este vault, cuyos seeds incluyen la clave del jugador y por lo tanto siguen derivándose durante la validación."  # @src=401e64b6d61a
            options:                 # source order — keep it
              a:
                # | Call find_program_address again inside the withdraw handler so the bump
                # | is re-derived each call
                label: "Llamar a find_program_address otra vez dentro del handler de withdraw para que el bump se vuelva a derivar en cada llamada"  # @src=8cf861908a99
                # | That reintroduces the full runtime search on every call, and costs CU
                # | every time. Note which mechanism saves you here: V2's macro-time const
                # | only removes the search when every seed is a byte literal, and this
                # | vault's seeds carry the player key, so the stored bump — not the const —
                # | is what makes the withdraw cheap.
                feedback: "Eso reintroduce la búsqueda completa en tiempo de ejecución en cada llamada, y cuesta CU todas las veces. Fíjate en cuál mecanismo te salva acá: la const en tiempo de macro de V2 solo quita la búsqueda cuando cada seed es un literal de bytes, y los seeds de este vault llevan la clave del jugador, así que el bump guardado — no la const — es lo que hace barato el withdraw."  # @src=268737488c22
              d:
                # | Write a bare bump on withdraw; the macro typically finds it in one try
                label: "Escribir un bump desnudo en withdraw; la macro normalmente lo encuentra en un solo intento"  # @src=7d00622df71b
                # | Correct and idiomatic on the create path, which is what makes it look
                # | safe everywhere else. A bare bump asks the macro to search, and the
                # | search is priced per candidate it tries; bump = vault.bump validates
                # | against a byte you already stored and skips the walk.
                feedback: "Correcto e idiomático en el camino de creación, que es lo que lo hace parecer seguro en todos los demás lados. Un bump desnudo le pide a la macro que busque, y la búsqueda tiene precio por cada candidato que prueba; bump = vault.bump valida contra un byte que ya guardaste y se salta la caminata."  # @src=009b6a80d825
              b:
                # | Recompute the bump from the seeds on the client and pass it in each
                # | instruction
                label: "Recalcular el bump a partir de los seeds en el cliente y pasarlo en cada instrucción"  # @src=fde1c7c1f1c3
                # | A client-supplied bump is untrusted input; the program must
                # | derive/verify canonically, not trust a passed value.
                feedback: "Un bump provisto por el cliente es entrada no confiable; el programa tiene que derivar/verificar canónicamente, no confiar en un valor pasado."  # @src=80e5c89860e4
              c:
                # | Store the canonical bump in the vault's Pod state at init and reuse the
                # | stored value
                label: "Guardar el bump canónico en el estado Pod del vault en el init y reutilizar el valor guardado"  # @src=faf04f1958e5
                # | Derivation is deterministic for a fixed seed set, so one computation
                # | stored is every future computation skipped — and a byte you persisted
                # | yourself is a byte the caller can't influence.
                feedback: "La derivación es determinista para un conjunto de seeds fijo, así que un cómputo guardado es cada cómputo futuro saltado — y un byte que persististe tú mismo es un byte en el que quien llama no puede influir."  # @src=32db4b02dd8b
          q2:
            # | You seed the vault with [b"vault", player.address()] and it works. A
            # | teammate proposes dropping the second seed to 'keep it simple'. What breaks?
            prompt: "Siembras el vault con [b\"vault\", player.address()] y funciona. Un compañero de equipo propone quitar el segundo seed para 'mantenerlo simple'. ¿Qué se rompe?"  # @src=fe52f128e1f8
            # | The seed scheme IS the namespace. Dropping the player key makes the
            # | derivation identity-independent, so all players resolve to a single PDA.
            # | Per-entity data needs a per-entity seed — the seed design is a security
            # | boundary, not a formality.
            explanation: "El esquema de seeds ES el namespace. Quitar la clave del jugador vuelve la derivación independiente de la identidad, así que todos los jugadores resuelven a un único PDA. Los datos por entidad necesitan un seed por entidad — el diseño de seeds es una frontera de seguridad, no una formalidad."  # @src=5940b01f62f9
            options:                 # source order — keep it
              b:
                # | A bare `bump` cannot resolve a canonical value when no seed varies per
                # | caller
                label: "Un `bump` desnudo no puede resolver un valor canónico cuando ningún seed varía según quien llama"  # @src=86366cfb9bab
                # | Tempting because the bump feels tied to the player key, but a
                # | constant-only seed array derives a canonical bump fine — a global config
                # | PDA seeded with just [b"config"] does exactly that. The account derives;
                # | it is simply the same one for everybody.
                feedback: "Tentador porque el bump se siente atado a la clave del jugador, pero un array de seeds de solo constantes deriva un bump canónico sin problema — un PDA de config global sembrado con solo [b\"config\"] hace exactamente eso. La cuenta deriva; es simplemente la misma para todos."  # @src=b8a6f3af988b
              a:
                # | Every player collides on ONE shared vault address, so there is no
                # | per-player custody
                label: "Todos los jugadores colisionan en UNA sola dirección de vault compartida, así que no hay custodia por jugador"  # @src=6b369f0d986a
                # | Drop identity out of the seeds and the address stops depending on
                # | identity — that is the whole bug, and nothing anywhere raises so much as
                # | a warning about it.
                feedback: "Saca la identidad de los seeds y la dirección deja de depender de la identidad — ese es todo el bug, y nada en ningún lado levanta ni siquiera una advertencia al respecto."  # @src=057ca4934534
              d:
                # | Nothing: each player's canonical bump differs, so the vault address
                # | stays distinct
                label: "Nada: el bump canónico de cada jugador es distinto, así que la dirección del vault se mantiene distinta"  # @src=6216e22250a2
                # | The bump does vary from one seed set to the next, which is what makes
                # | this feel like enough separation. Derivation is a pure function of the
                # | seeds and the program id, so with the player key gone the inputs are
                # | identical for everyone and the same bump and the same 32 bytes come back
                # | out.
                feedback: "El bump sí varía de un conjunto de seeds al siguiente, que es lo que hace que esto se sienta como suficiente separación. La derivación es una función pura de los seeds y el id del programa, así que con la clave del jugador ya fuera las entradas son idénticas para todos y salen de vuelta el mismo bump y los mismos 32 bytes."  # @src=1959c5b07163
              c:
                # | Derivation aborts because find_program_address needs two seeds plus the
                # | program ID
                label: "La derivación aborta porque find_program_address necesita dos seeds más el ID del programa"  # @src=4b4ff1e3a8c5
                # | There is no two-seed minimum — up to 16 seeds of at most 32 bytes each
                # | are allowed, and zero or one is legal. The derivation succeeds; the
                # | failure is semantic, not a limit.
                feedback: "No hay ningún mínimo de dos seeds — se permiten hasta 16 seeds de a lo más 32 bytes cada uno, y cero o uno es legal. La derivación tiene éxito; la falla es semántica, no un límite."  # @src=2c6680ce006d
          q3:
            # | Porting an ancient 0.28-era snippet from an old tutorial, you see `let bump
            # | = ctx.bumps.get("vault").unwrap();`. What is the rewrite that builds on
            # | today's lines, and when did the change actually land?
            prompt: "Portando un snippet antiguo de la era 0.28 de un tutorial viejo, ves `let bump = ctx.bumps.get(\"vault\").unwrap();`. ¿Cuál es la reescritura que compila en las líneas de hoy, y cuándo aterrizó el cambio en realidad?"  # @src=b59231d65d40
            # | Anchor 0.29 — two majors before V2 — replaced the string-keyed bumps map
            # | with a generated typed struct, so on any modern line you read
            # | ctx.bumps.vault as a field: no string, no fallible unwrap, and a typo fails
            # | to compile. V2 keeps that idiom unchanged, so seeing .get("vault") dates a
            # | snippet to 0.28 or earlier; it is not "the v1 way." Be precise about what
            # | runs when: with a caller-keyed seed, the derivation itself still happens at
            # | runtime during account validation on every line. V2's only bump-time news is
            # | that an all-literal seed scheme gets its canonical bump precomputed as a
            # | macro-time const. The CU story lives elsewhere — bare `bump` runs the
            # | search, `bump = vault.bump` validates against a value you already stored.
            explanation: "Anchor 0.29 — dos majors antes de V2 — reemplazó el mapa de bumps indexado por cadena con un struct tipado generado, así que en cualquier línea moderna lees ctx.bumps.vault como un campo: ninguna cadena, ningún unwrap falible, y un typo no compila. V2 mantiene esa forma idiomática sin cambios, así que ver .get(\"vault\") fecha un snippet en 0.28 o anterior; no es \"la forma de v1.\" Sé preciso sobre qué corre cuándo: con un seed indexado por quien llama, la derivación misma sigue pasando en tiempo de ejecución durante la validación de cuentas en todas las líneas. La única novedad de V2 sobre el momento del bump es que un esquema de seeds todo-literal recibe su bump canónico precalculado como una const en tiempo de macro. La historia de CU vive en otra parte — un `bump` desnudo corre la búsqueda, `bump = vault.bump` valida contra un valor que ya guardaste."  # @src=32be9e91e1ef
            options:                 # source order — keep it
              a:
                # | Keep ctx.bumps.get("vault").unwrap(); modern Anchor keeps the string map
                # | behind a shim
                label: "Quedarse con ctx.bumps.get(\"vault\").unwrap(); el Anchor moderno mantiene el mapa de cadenas detrás de un shim"  # @src=4a70d5f11acc
                # | There is no compat shim: Anchor 0.29 removed the string-keyed map
                # | outright, and ctx.bumps has been a generated struct with one field per
                # | PDA account ever since — on the 1.x line and on V2 alike, .get() does
                # | not compile.
                feedback: "No hay ningún shim de compatibilidad: Anchor 0.29 quitó el mapa indexado por cadena de plano, y ctx.bumps ha sido un struct generado con un campo por cada cuenta PDA desde entonces — en la línea 1.x y en V2 por igual, .get() no compila."  # @src=c1cfbf3ddc57
              c:
                # | `find_program_address(seeds, id).1` recomputed inside the handler
                label: "`find_program_address(seeds, id).1` recalculado dentro del handler"  # @src=d0553c34eb5c
                # | That is a runtime search — the exact cost a stored bump exists to
                # | delete; it is neither idiomatic nor cheap on any Anchor line.
                feedback: "Eso es una búsqueda en tiempo de ejecución — el costo exacto que un bump guardado existe para borrar; no es ni idiomático ni barato en ninguna línea de Anchor."  # @src=43a3b23e7b68
              d:
                # | ctx.bumps.vault - but it is a V2 addition, so keep .get("vault") on the
                # | 1.x line and switch when the program moves to the RC
                label: "ctx.bumps.vault - pero es una adición de V2, así que quédate con .get(\"vault\") en la línea 1.x y cambia cuando el programa pase a la RC"  # @src=ff42b7b74324
                # | Right rewrite, wrong credit, and this is the exact half-truth the
                # | ecosystem's migration posts keep repeating. The typed bumps struct
                # | landed in Anchor 0.29, two majors before V2 existed, so .get("vault")
                # | does not build on the 1.x line either.
                feedback: "Reescritura correcta, crédito equivocado, y esta es exactamente la media verdad que los posts de migración del ecosistema siguen repitiendo. El struct de bumps tipado aterrizó en Anchor 0.29, dos majors antes de que V2 existiera, así que .get(\"vault\") tampoco compila en la línea 1.x."  # @src=106cb8793653
              b:
                # | `ctx.bumps.vault` — a field on the typed bumps struct the derive macro
                # | generates, the idiom since Anchor 0.29 and unchanged in V2
                label: "`ctx.bumps.vault` — un campo del struct de bumps tipado que genera la macro de derive, la forma idiomática desde Anchor 0.29 y sin cambios en V2"  # @src=517cce113757
                # | A field lookup that cannot miss replaces a string lookup that could: the
                # | compiler guarantees the name exists. The change is a 0.29 migration you
                # | are back-paying, not a V2 delta — and the derivation for runtime-keyed
                # | seeds still runs per call on every line.
                feedback: "Una búsqueda de campo que no puede fallar reemplaza una búsqueda de cadena que sí podía: el compilador garantiza que el nombre existe. El cambio es una migración de 0.29 que estás pagando con atraso, no un delta de V2 — y la derivación para seeds indexados en tiempo de ejecución sigue corriendo por llamada en todas las líneas."  # @src=a95edfc2ce51
  m03-l2:
    # | The constraint catalog (and init_if_needed, in situ)
    title: "El catálogo de constraints (y init_if_needed, in situ)"  # @src=0c4472a6a328
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | You wrote `#[account(owner = spl_token::ID @ VaultError::WrongOwner)]` on an
            # | `Account<T>` vault and expected WrongOwner on a bad account. The test
            # | instead sees a generic IllegalOwner. Why?
            prompt: "Escribiste `#[account(owner = spl_token::ID @ VaultError::WrongOwner)]` sobre un vault `Account<T>` y esperabas WrongOwner en una cuenta mala. La prueba en cambio ve un IllegalOwner genérico. ¿Por qué?"  # @src=f73afa51fd7c
            # | On Account<T>, owner/discriminator validation happens during load — earlier
            # | than the constraint-hook phase where your @ error would be raised. To
            # | surface a custom owner error, drop to UncheckedAccount and assert ownership
            # | with an explicit constraint that runs in the hook phase. Read it one step
            # | further: on Account<T> the typed wrapper has already pinned the owner to
            # | your own program, so `owner = <some other program>` there is not merely
            # | error-shadowed, it is unreachable — an account owned by anyone else can
            # | never load as that type in the first place.
            explanation: "Sobre Account<T>, la validación de dueño/discriminador pasa durante el load — antes que la fase de constraint hooks donde se levantaría tu error @. Para mostrar un error de owner propio, baja a UncheckedAccount y afirma la propiedad con un constraint explícito que corra en la fase de hooks. Léelo un paso más allá: sobre Account<T> el wrapper tipado ya fijó el dueño a tu propio programa, así que ahí `owner = <some other program>` no está meramente tapado por otro error, es inalcanzable — una cuenta cuyo dueño sea cualquier otro nunca puede cargar como ese tipo, de entrada."  # @src=84992dd1530f
            options:                 # source order — keep it
              c:
                # | `load` checks owner and discriminator before any constraint hook runs,
                # | so the built-in IllegalOwner fires first
                label: "El `load` verifica el dueño y el discriminador antes de que corra cualquier constraint hook, así que el IllegalOwner incorporado se dispara primero"  # @src=c408525e1238
                # | Take the account untyped and assert ownership in the hook phase, because
                # | that is where your error can still fire. On a typed wrapper the owner is
                # | already pinned to your own program, so naming a different one was never
                # | reachable.
                feedback: "Toma la cuenta sin tipar y afirma la propiedad en la fase de hooks, porque ahí es donde tu error todavía puede dispararse. En un wrapper tipado el dueño ya está fijado a tu propio programa, así que nombrar uno distinto nunca fue alcanzable."  # @src=b58a011dd9b4
              b:
                # | `owner` needs a literal `Address` constant, and `spl_token::ID` is a
                # | path the derive macro fails to resolve
                label: "El `owner` necesita una constante `Address` literal, y `spl_token::ID` es un path que la macro derive no logra resolver"  # @src=f778d63e2635
                # | `owner` accepts any expression that evaluates to an address,
                # | `spl_token::ID` included. The problem is phase ordering, not resolution.
                feedback: "El `owner` acepta cualquier expresión que evalúe a una dirección, `spl_token::ID` incluido. El problema es el orden de fases, no la resolución."  # @src=8a2e88529a35
              a:
                # | The `@` error binding is parsed on `constraint =` alone; on `address`
                # | and `owner` the macro silently drops it
                label: "La ligadura de error `@` se parsea solo sobre `constraint =`; sobre `address` y `owner` la macro la descarta en silencio"  # @src=4b3c12a59706
                # | `@` binds a custom error on `address` and `owner` too — the macro parses
                # | it fine here. The error never fires because `load` rejected the account
                # | before the hook that would raise it.
                feedback: "El `@` liga un error propio sobre `address` y `owner` también — la macro lo parsea bien acá. El error nunca se dispara porque `load` rechazó la cuenta antes del hook que lo levantaría."  # @src=62b6a48e1e87
              d:
                # | Constraint order inside #[account(...)] decides the phase, so listing
                # | owner above seeds makes it run during load
                label: "El orden de los constraints dentro de #[account(...)] decide la fase, así que listar owner arriba de seeds hace que corra durante el load"  # @src=72955d1191f4
                # | Field order really is load order, so carrying that instinct down into
                # | one field's attribute list is a fair inference. Every hook on a single
                # | field runs in the constraint phase whatever order you write them in;
                # | what runs first is the typed load, and no attribute can join it.
                feedback: "El orden de los campos de verdad es el orden en que se cargan, así que llevar ese instinto hacia abajo, a la lista de atributos de un campo, es una inferencia razonable. Cada hook de un mismo campo corre en la fase de constraints en el orden que sea que los escribas; lo que corre primero es el load tipado, y ningún atributo puede sumarse a él."  # @src=3c07b1bf3a98
          q2:
            # | You add `init_if_needed` so a player can 'top up or create' a vault in one
            # | instruction. What is the specific danger you must now guard, and what does
            # | V2's reuse-validation actually cover?
            prompt: "Agregas `init_if_needed` para que un jugador pueda 'recargar o crear' un vault en una sola instrucción. ¿Cuál es el peligro específico que ahora tienes que resguardar, y qué cubre en realidad la validación de reuso de V2?"  # @src=a3e0cd4126ed
            # | V2's reuse-validation re-checks structural properties (space, owner,
            # | discriminator) when the account already exists, but it does not know your
            # | invariants. The reinitialization attack — forcing the create-or-reuse branch
            # | to reset live state — survives, so you must guard the overwrite path
            # | yourself. Concretely: reuse-validation has no idea that `credit` is a
            # | balance a player funded, so branch on whether the account is fresh
            # | (`vault.owner == Address::default()`) before initializing any field, and
            # | only ever ADD to `credit` — never `vault.credit = amount`, which is the
            # | clobber.
            explanation: "La validación de reuso de V2 vuelve a verificar propiedades estructurales (space, dueño, discriminador) cuando la cuenta ya existe, pero no conoce tus invariantes. El ataque de reinicialización — forzar la rama de crear-o-reusar a resetear estado vivo — sobrevive, así que el camino de sobrescritura te toca resguardarlo a ti. Concretamente: la validación de reuso no tiene ni idea de que `credit` es un balance que fondeó un jugador, así que ramifica según si la cuenta es nueva (`vault.owner == Address::default()`) antes de inicializar cualquier campo, y solo SUMA a `credit` — nunca `vault.credit = amount`, que es la sobrescritura."  # @src=2e86d8395854
            options:                 # source order — keep it
              b:
                # | Nothing — V2's reuse-validation re-checks the existing account on the
                # | reuse branch, so init_if_needed is safe on its own
                label: "Nada — la validación de reuso de V2 vuelve a verificar la cuenta existente en la rama de reuso, así que init_if_needed es seguro por sí solo"  # @src=929b7f87e468
                # | Reuse-validation is real, but it only re-checks space, owner and
                # | discriminator. It has no notion of `credit` being a funded balance, so
                # | the overwrite risk is still yours to guard.
                feedback: "La validación de reuso es real, pero solo vuelve a verificar space, dueño y discriminador. No tiene noción de que `credit` sea un balance fondeado, así que el riesgo de sobrescritura te sigue tocando a ti resguardarlo."  # @src=c8c1c0873e42
              c:
                # | That `init_if_needed` sits behind a Cargo feature in V2, so the derive
                # | struct will not compile until you enable it
                label: "Que `init_if_needed` está detrás de una feature de Cargo en V2, así que el struct derive no va a compilar hasta que la habilites"  # @src=275dc418a5e1
                # | That was the v1 stance. In V2 the keyword ships with NO feature gate and
                # | compiles freely — which is exactly why the guard discipline matters
                # | more, not less.
                feedback: "En v1 esa era la postura. En V2 el keyword se entrega SIN feature gate y compila libremente — que es exactamente por qué la disciplina de la guarda importa más, no menos."  # @src=47bbc89b0843
              d:
                # | A different program creating the account first; reuse-validation covers
                # | the stored state, so your own credit field is safe
                label: "Que un programa distinto cree la cuenta primero; la validación de reuso cubre el estado guardado, así que tu propio campo credit está a salvo"  # @src=c234bea20011
                # | Exactly inverted, and the inversion is worth naming out loud: ownership
                # | is the part reuse-validation does do for you, alongside space and
                # | discriminator. What it has no view of is which field holds a player's
                # | balance, so the state is the half left to your guard.
                feedback: "Exactamente invertido, y vale la pena nombrar la inversión en voz alta: la propiedad es la parte que la validación de reuso sí hace por ti, junto con el space y el discriminador. Lo que no tiene a la vista es cuál campo guarda el balance de un jugador, así que el estado es la mitad que queda para tu guarda."  # @src=a645d0fdb679
              a:
                # | A reinitialization path that clobbers an existing vault's live `credit`;
                # | reuse-validation covers shape, not state
                label: "Un camino de reinicialización que sobrescribe el `credit` vivo de un vault existente; la validación de reuso cubre la forma, no el estado"  # @src=8c365a241bf4
                # | Structural re-checks have no idea which field holds a player's money, so
                # | a funded balance and a fresh one look identical to them, which is why
                # | the create branch needs a freshness test of your own, and a += where you
                # | were about to write =.
                feedback: "Las verificaciones estructurales no tienen ni idea de cuál campo guarda el dinero de un jugador, así que un balance fondeado y uno nuevo se les ven idénticos, y por eso la rama de creación necesita una verificación de frescura propia, y un += donde estabas por escribir =."  # @src=201051ad4126
          q3:
            # | Porting a v1 vault, the compiler rejects `realloc::payer = payer` and warns
            # | on `has_one = authority`. What are the correct V2 forms?
            prompt: "Estás portando un vault v1 y el compilador rechaza `realloc::payer = payer` y advierte sobre `has_one = authority`. ¿Cuáles son las formas correctas de V2?"  # @src=62b6e72b38eb
            # | V2 flattened the realloc sub-keywords to underscore forms (realloc_payer,
            # | realloc_zero) and deprecated has_one in favor of address = parent.field,
            # | which accepts any expression. has_one still compiles with a warning so
            # | migrations aren't blocked, but new code uses address=.
            explanation: "V2 aplanó los sub-keywords de realloc a formas con guion bajo (realloc_payer, realloc_zero) y deprecó has_one a favor de address = parent.field, que acepta cualquier expresión. El has_one todavía compila con una advertencia así las migraciones no quedan bloqueadas, pero el código nuevo usa address=."  # @src=1324801140a0
            options:                 # source order — keep it
              e:
                # | `realloc_zero = payer` and `address = <the authority expression>`
                label: "`realloc_zero = payer` y `address = <the authority expression>`"  # @src=5811eed34d92
                # | Both V2 spellings, wrong pairing, and the two flat names are easy to
                # | swap. realloc_zero takes a bool and decides whether the resized buffer
                # | is wiped; who funds the extra rent is realloc_payer.
                feedback: "Las dos son formas de V2 pero mal emparejadas, y los dos nombres planos son fáciles de intercambiar. realloc_zero toma un bool y decide si el buffer redimensionado queda borrado; quién fondea el rent extra es realloc_payer."  # @src=20960d013b62
              d:
                # | `realloc::payer = payer` and `address = <authority expression>`
                label: "`realloc::payer = payer` y `address = <authority expression>`"  # @src=03568da4cb93
                # | The has_one half is right, which is also the half the compiler nags you
                # | about, so it is the one people fix first. The colon-nested realloc
                # | sub-keywords do not survive the port: V2 spells them flat, and the old
                # | form fails to compile rather than warning.
                feedback: "La mitad de has_one está bien, que además es la mitad sobre la que el compilador te insiste, así que es la que la gente arregla primero. Los sub-keywords de realloc anidados con dos puntos no sobreviven a la migración: V2 los escribe planos, y la forma vieja falla al compilar en vez de advertir."  # @src=3610799dff8a
              c:
                # | `realloc_payer = payer` and keep `has_one = authority`
                label: "`realloc_payer = payer` y dejar `has_one = authority`"  # @src=a29302aa2734
                # | has_one still parses but is deprecated and warns; new V2 code should use
                # | address = parent.field.
                feedback: "El has_one todavía parsea pero está deprecado y advierte; el código V2 nuevo debería usar address = parent.field."  # @src=3e7cfb224116
              a:
                # | `realloc::payer` stays; has_one becomes `owner = authority`
                label: "`realloc::payer` se queda; has_one pasa a ser `owner = authority`"  # @src=061d142a4c6f
                # | realloc::payer is not the V2 spelling, and has_one's replacement is
                # | address=, not owner.
                feedback: "La forma de V2 no es realloc::payer, y el reemplazo de has_one es address=, no owner."  # @src=b1d735e46681
              b:
                # | `realloc_payer = payer` and `address = <the authority expression>`
                label: "`realloc_payer = payer` y `address = <the authority expression>`"  # @src=d7c391223134
                # | Colons out, underscores in, and field equality moved onto a keyword that
                # | takes any expression at all. The two old spellings exit differently:
                # | `realloc::payer` is a hard reject — the colon form does not compile in
                # | V2, which is exactly what the error you hit says — while `has_one` still
                # | builds and just arrives underlined. Either way the port is mechanical.
                feedback: "Los dos puntos afuera, los guiones bajos adentro, y la igualdad de campos mudada a un keyword que acepta cualquier expresión que sea. Las dos formas viejas salen distinto: `realloc::payer` es un rechazo duro — la forma con dos puntos no compila en V2, que es exactamente lo que dice el error con el que te topaste — mientras que `has_one` igual construye y solo llega subrayado. De cualquier manera la migración es mecánica."  # @src=28a020c64690
          q4:
            # | Your `close = player` handler runs with an empty body. What does the
            # | constraint itself accomplish, and why write it that way rather than by hand?
            prompt: "Tu handler de `close = player` corre con el cuerpo vacío. ¿Qué logra el constraint en sí, y por qué escribirlo así en vez de a mano?"  # @src=6daeba3465f5
            # | close = destination returns the account's rent-exempt reserve to the named
            # | destination and invalidates the account so it can't be silently revived, all
            # | inside the derive macro. Using the constraint (rather than hand-rolling the
            # | lamport move) keeps the close atomic and visible in the IDL. Three things
            # | happen together on success: the full lamport balance moves to the
            # | destination, the data is zeroed, and the discriminator is wiped — so there
            # | is no window in which a half-closed account could be mistaken for a live
            # | vault. The handler body can be empty, because the constraint carries the
            # | whole operation.
            explanation: "close = destination devuelve la reserva exenta de renta de la cuenta al destino nombrado e invalida la cuenta para que no pueda revivirse en silencio, todo adentro de la macro derive. Usar el constraint (en vez de armar a mano el movimiento de lamports) mantiene el close atómico y visible en el IDL. Tres cosas pasan juntas cuando tiene éxito: el balance completo de lamports se mueve al destino, los datos quedan en cero, y el discriminador queda borrado — así no hay ninguna ventana en la que una cuenta medio cerrada pudiera confundirse con un vault vivo. El cuerpo del handler puede estar vacío, porque el constraint carga con toda la operación."  # @src=36f1a1dbd95f
            options:                 # source order — keep it
              c:
                # | The rent-exempt lamports return to the player and the account is
                # | invalidated in one atomic step
                label: "Los lamports exentos de renta vuelven al jugador y la cuenta queda invalidada en un solo paso atómico"  # @src=6e972539652b
                # | Sweep, zero, invalidate: one step, with no half-closed state for anyone
                # | to mistake for a live account. Doing it through the constraint also puts
                # | it in the IDL, where a reader will actually find it.
                feedback: "Barrer, poner en cero, invalidar: un paso, sin ningún estado medio cerrado que alguien pueda confundir con una cuenta viva. Hacerlo a través del constraint además lo pone en el IDL, donde un lector de verdad lo va a encontrar."  # @src=845c06d978db
              a:
                # | The account's data is copied into the destination account before
                # | deletion, so no vault state is lost
                label: "Los datos de la cuenta se copian a la cuenta de destino antes de borrarla, así no se pierde nada del estado del vault"  # @src=87e0eeed2b15
                # | `close` archives nothing — it zeroes the data and wipes the
                # | discriminator. If you need the state, read it in the handler before the
                # | close takes effect.
                feedback: "El `close` no archiva nada — pone los datos en cero y borra el discriminador. Si necesitas el estado, léelo en el handler antes de que el close surta efecto."  # @src=6f4cb894b789
              b:
                # | Nothing moves; `close` only wipes the discriminator, and the rent-exempt
                # | reserve stays stranded in the PDA
                label: "Nada se mueve; el `close` solo borra el discriminador, y la reserva exenta de renta queda varada en el PDA"  # @src=dd3f88f8a8f9
                # | The discriminator wipe is real, but it is only one of three steps.
                # | `close` also sweeps every lamport to the destination — stranding the
                # | reserve is the exact failure it exists to prevent.
                feedback: "El borrado del discriminador es real, pero es solo uno de tres pasos. El `close` además barre cada lamport hacia el destino — dejar varada la reserva es exactamente la falla que existe para prevenir."  # @src=af05de3846f1
              d:
                # | The reserve returns to whoever funded the rent at init, whatever address
                # | close = names, and the data is zeroed
                label: "La reserva vuelve a quien haya fondeado el rent en el init, cualquiera sea la dirección que nombre close =, y los datos quedan en cero"  # @src=2302682d055f
                # | Runtimes that remember a rent payer do exist, and it would be a sensible
                # | protection to inherit. Solana records no payer on the account: close
                # | sweeps the whole lamport balance to the destination you name, which is
                # | what makes naming the wrong one a real mistake rather than a no-op.
                feedback: "Sí existen runtimes que recuerdan un pagador de rent, y sería una protección sensata de heredar. Solana no registra ningún pagador en la cuenta: close barre todo el balance de lamports hacia el destino que nombras, que es lo que hace que nombrar el equivocado sea un error real y no una operación nula."  # @src=dab6682beb2e
  m03-l3:
    # | Write your own constraint: the AccountConstraint trait
    title: "Escribe tu propio constraint: el trait AccountConstraint"  # @src=ce043620e3c1
    blocks:
      custom-min-balance-constraint:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The floor is inclusive: a balance equal to min passes.
          0: "El piso mínimo es inclusivo: un saldo igual a min pasa."  # @src=e3f8b25d307b
          # | The rule is one comparison in MinBalanceRule::meets_floor; check and
          # | run_constraint are already wired for you.
          1: "La regla es una sola comparación en MinBalanceRule::meets_floor; check y run_constraint ya te vienen cableados."  # @src=b9800129b175
          # | The verification harness is compile-time. If the build fails, read the
          # | assertion message: it names the case your comparison got wrong.
          2: "El banco de pruebas de verificación corre en tiempo de compilación. Si el build falla, lee el mensaje de la aserción: nombra el caso que tu comparación sacó mal."  # @src=6c8eb4146f89
        tests:                      # keyed by test case id
          t1:
            # | balance above the floor passes
            description: "un saldo por encima del piso mínimo pasa"  # @src=9c0be5ef0fc1
          t2:
            # | balance exactly at the floor passes
            description: "un saldo exactamente en el piso mínimo pasa"  # @src=f0e215cc9c95
          t3:
            # | balance below the floor is rejected
            description: "un saldo por debajo del piso mínimo es rechazado"  # @src=48f5cefba540
          t4:
            # | an empty account is rejected by a 1-lamport floor
            description: "una cuenta vacía es rechazada por un piso mínimo de 1 lamport"  # @src=edc1fb1f3cb7
          t5:
            # | a zero floor admits an empty account — a hook comparing against any positive
            # | constant instead of self.min fails here
            description: "un piso mínimo de cero admite una cuenta vacía — un hook que compara contra cualquier constante positiva en vez de self.min falla acá"  # @src=882b6b673772
          t6:
            # | the same balance that passed a 100 floor is rejected by a 200 floor: the
            # | threshold has to come from self.min
            description: "el mismo saldo que pasó un piso mínimo de 100 es rechazado por un piso mínimo de 200: el umbral tiene que venir de self.min"  # @src=23206d42c63e
      check:                      # quiz
        questions:
          q1:
            # | You want `#[account(quarters::min_balance = 100)]` to reject an underfunded
            # | vault. Which AccountConstraint hook does the rule belong in, and why?
            prompt: "Quieres que `#[account(quarters::min_balance = 100)]` rechace un vault subfinanciado. ¿En cuál hook de AccountConstraint va la regla, y por qué?"  # @src=d94fec2e5814
            # | check is the validation hook: it runs after load and before the handler, on
            # | every matching instruction, which is precisely where an invariant like a
            # | balance floor belongs. init is create-only and exit is post-handler, so
            # | neither gives you the up-front, every-call gate a min_balance constraint
            # | needs. Said the way the lesson argues it: the vault must ALREADY satisfy the
            # | invariant for the instruction to proceed, and that is re-verified each call,
            # | never cached and never one-time — which is the definition of a read-time
            # | gate. `update` is out too: it only fires inside an explicit `update(...)`
            # | clause, and a floor validates rather than mutates.
            explanation: "check es el hook de validación: corre después de la carga y antes del handler, en cada instrucción que calza, que es precisamente donde va un invariante como un piso mínimo de saldo. init es solo de creación y exit es post-handler, así que ninguno te da la barrera de entrada y en cada llamada que un constraint min_balance necesita. Dicho como lo argumenta la lección: el vault YA tiene que satisfacer el invariante para que la instrucción siga, y eso se vuelve a verificar en cada llamada, nunca cacheado y nunca una sola vez — que es la definición de una barrera en tiempo de lectura. `update` también queda afuera: solo se dispara dentro de una cláusula `update(...)` explícita, y un piso mínimo valida en vez de mutar."  # @src=f55cad00af53
            options:                 # source order — keep it
              a:
                # | check — a read-time gate on the loaded account, re-verified before every
                # | matching handler runs
                label: "check — una barrera en tiempo de lectura sobre la cuenta cargada, que se vuelve a verificar antes de que corra cada handler que calza"  # @src=177982671980
                # | Of the other three, one fires once at creation, one only for accounts
                # | that get written back out, and the last mutates instead of judging. A
                # | floor has to hold on every call — that rules out all three.
                feedback: "De los otros tres, uno se dispara una vez en la creación, otro solo para las cuentas que se escriben de vuelta, y el último muta en vez de juzgar. Un piso mínimo tiene que valer en cada llamada — eso descarta a los tres."  # @src=2344fbbd729d
              c:
                # | exit — the hook fires during account serialization, so it validates the
                # | final state written back out
                label: "exit — el hook se dispara durante la serialización de la cuenta, así que valida el estado final que se escribe de vuelta"  # @src=aecdad278719
                # | exit runs after the handler, and only for accounts that were mutated and
                # | serialize back out. The read-only vault in RequireFunded is not even
                # | `mut`, so exit never fires for it — and a post-hoc assertion is not the
                # | up-front gate a floor needs.
                feedback: "exit corre después del handler, y solo para las cuentas que fueron mutadas y se serializan de vuelta. El vault de solo lectura en RequireFunded ni siquiera es `mut`, así que exit nunca se dispara para él — y una aserción post-hoc no es la barrera de entrada que un piso mínimo necesita."  # @src=4f40ef9de490
              d:
                # | update - the hook fires whenever a constrained value is written, so the
                # | floor tracks changes
                label: "update - el hook se dispara cada vez que se escribe un valor con constraint, así que el piso mínimo sigue los cambios"  # @src=8a94a749e1b0
                # | The fourth hook, and the one whose name most suggests a live invariant
                # | that follows the account around. update fires only inside an explicit
                # | update(...) clause, and it exists for a constraint that mutates the
                # | account; a floor judges rather than writes.
                feedback: "El cuarto hook, y el que por su nombre más sugiere un invariante vivo que sigue a la cuenta a todas partes. update se dispara solo dentro de una cláusula update(...) explícita, y existe para un constraint que muta la cuenta; un piso mínimo juzga en vez de escribir."  # @src=a7e61f51165b
              b:
                # | init — the floor is a creation-time invariant, so it is enforced once
                # | after the account is allocated
                label: "init — el piso mínimo es un invariante de tiempo de creación, así que se aplica una sola vez después de que la cuenta se asigna"  # @src=d2da037ba970
                # | init fires only on the create path, and a balance floor has to hold on
                # | every instruction that loads the vault. Enforce it at birth alone and
                # | the very next set_credit can drop credit under the floor with nothing to
                # | catch it.
                feedback: "init se dispara solo en el camino de creación, y un piso mínimo de saldo tiene que valer en cada instrucción que carga el vault. Aplícalo solo al nacer y justo el siguiente set_credit puede bajar el crédito por debajo del piso mínimo sin que nada lo atrape."  # @src=6075320d04a2
          q2:
            # | Why does V2 dispatch namespaced constraints through an open
            # | AccountConstraint trait instead of just adding more built-in keywords?
            prompt: "¿Por qué V2 despacha los constraints con namespace a través de un trait AccountConstraint abierto en vez de simplemente agregar más keywords integrados?"  # @src=cde948f06e94
            # | No framework author can enumerate every program's invariants ahead of time.
            # | By routing ns::key = val through a trait you implement for a marker type, V2
            # | lets you (and any downstream crate) ship new, IDL-visible constraints
            # | without forking the framework — the same open-at-the-seams philosophy behind
            # | the public AnchorAccount/Id/Discriminator traits. The alternatives all fail
            # | on a specific axis: a handler `if` is invisible in the IDL and not inherited
            # | by the next call site, a fork is yours to re-merge every release, and an
            # | inline `constraint = <expr>` is an anonymous boolean you cannot name, reuse,
            # | or read off an interface.
            explanation: "Ningún autor de framework puede enumerar por adelantado los invariantes de cada programa. Al enrutar ns::key = val a través de un trait que implementas para un tipo marcador, V2 te deja (a ti y a cualquier crate downstream) entregar constraints nuevos y visibles en el IDL sin hacerle un fork al framework — la misma filosofía de abierto-en-las-costuras que hay detrás de los traits públicos AnchorAccount/Id/Discriminator. Las alternativas fallan todas en un eje específico: un `if` de handler es invisible en el IDL y no lo hereda el siguiente call site, un fork es tuyo para volver a mergearlo en cada release, y un `constraint = <expr>` inline es un booleano anónimo que no puedes nombrar, reusar ni leer de una interfaz."  # @src=c90c9a1a7a87
            options:                 # source order — keep it
              a:
                # | Trait dispatch monomorphizes at compile time, so the emitted check costs
                # | fewer compute units than a built-in keyword
                label: "El despacho por trait monomorfiza en tiempo de compilación, así que la verificación emitida cuesta menos unidades de cómputo que un keyword integrado"  # @src=97d3619ee260
                # | Both forms are resolved by the proc macro and expand to inline code in
                # | the same instruction, so there is no CU gap between a built-in keyword
                # | and a trait-dispatched one. The motivation is extensibility, not
                # | performance — and the lesson is explicit that the cost of a cheap check
                # | is a wash.
                feedback: "Las dos formas las resuelve la proc macro y se expanden a código inline en la misma instrucción, así que no hay brecha de CU entre un keyword integrado y uno despachado por trait. La motivación es la extensibilidad, no el rendimiento — y la lección es explícita en que el costo de una verificación barata es un empate."  # @src=e11a7b9515d9
              b:
                # | No framework author can enumerate every program's invariants, so the
                # | surface is left open to downstream crates
                label: "Ningún autor de framework puede enumerar los invariantes de cada programa, así que la superficie se deja abierta a los crates downstream"  # @src=c2f3a4c03a9b
                # | A handler branch never reaches the IDL, a fork is something you re-merge
                # | forever, and an inline boolean cannot be named or reused. Three
                # | different ways to lose, which is roughly the argument.
                feedback: "Una rama de handler nunca llega al IDL, un fork es algo que vuelves a mergear para siempre, y un booleano inline no se puede nombrar ni reusar. Tres maneras distintas de perder, que es más o menos el argumento."  # @src=e61563bed448
              c:
                # | The token::* namespace requires it, and every other namespace only
                # | reaches the trait as an accidental side effect
                label: "El namespace token::* lo exige, y todo otro namespace llega al trait solo como un efecto secundario accidental"  # @src=15736dc69c81
                # | This has the exception backwards. token::* is the ONE namespace the core
                # | derive still handles itself, for anchor-spl's sake; every other
                # | namespace routes through AccountConstraint deliberately, not
                # | incidentally.
                feedback: "Esto tiene la excepción al revés. token::* es EL ÚNICO namespace que el derive central todavía maneja él mismo, por el bien de anchor-spl; todo otro namespace se enruta por AccountConstraint deliberadamente, no incidentalmente."  # @src=9c3c8dfc0f4d
              d:
                # | Because a trait impl gets evaluated at compile time, while a built-in
                # | keyword has to fire at runtime
                label: "Porque un impl de trait se evalúa en tiempo de compilación, mientras que un keyword integrado tiene que dispararse en runtime"  # @src=ec5c4a70dbeb
                # | Traits do get resolved by the compiler, so the reasoning is not idle.
                # | Both forms are expanded by the proc macro into inline code in the same
                # | instruction, so a check hook runs at runtime and draws on the same
                # | compute budget your handler does. The motivation is extensibility, not
                # | speed.
                feedback: "Los traits sí los resuelve el compilador, así que el razonamiento no es ocioso. Las dos formas las expande la proc macro a código inline en la misma instrucción, así que un hook check corre en runtime y tira del mismo presupuesto de cómputo que tu handler. La motivación es la extensibilidad, no la velocidad."  # @src=75f0d830805e
          q3:
            # | Your min_balance check hook does a modest comparison, but a teammate
            # | proposes a version that re-reads and re-hashes a large slab on every call.
            # | What's the cost you just signed up for?
            prompt: "Tu hook check de min_balance hace una comparación modesta, pero un compañero de equipo propone una versión que vuelve a leer y a hashear un pedazo grande en cada llamada. ¿Cuál es el costo al que te acabas de anotar?"  # @src=f17fe7366beb
            # | A check hook executes each time the constraint matches, inside the
            # | instruction's compute budget. An expensive hook is CU you pay on every call
            # | to a hot path — and because the account then reads as 'valid', a heavy or
            # | wrong check can also hide logic bugs behind a passing constraint. Keep hooks
            # | cheap and correct. Note the asymmetry the lesson draws: against a handler
            # | `if` you wrote once, a cheap comparison in a hook is a wash, and the reuse
            # | plus IDL visibility are pure gain. It is the expensive hook and the subtly
            # | wrong hook that compound, because both now ride along on every instruction
            # | that declares the constraint.
            explanation: "Un hook check se ejecuta cada vez que el constraint calza, dentro del presupuesto de cómputo que tiene la instrucción. Un hook caro es CU que pagas en cada llamada a un camino caliente — y porque la cuenta entonces se lee como 'válida', una verificación pesada o equivocada también puede esconder bugs de lógica detrás de un constraint que pasa. Mantén los hooks baratos y correctos. Fíjate en la asimetría que traza la lección: contra un `if` de handler que escribiste una vez, una comparación barata en un hook es un empate, y la reutilización más la visibilidad en el IDL son ganancia pura. Son el hook caro y el hook sutilmente equivocado los que se acumulan, porque los dos ahora viajan de acompañantes en cada instrucción que declara el constraint."  # @src=3a3e11e2705f
            options:                 # source order — keep it
              c:
                # | The expensive check runs on every matching instruction, so you pay that
                # | CU on a hot path forever
                label: "La verificación cara corre en cada instrucción que calza, así que pagas esa CU en un camino caliente para siempre"  # @src=e77974c190d4
                # | Same budget as the handler, every call, forever. A cheap comparison is a
                # | wash; an expensive one is a tax you keep paying, and a wrong one reads
                # | as a passing constraint.
                feedback: "El mismo presupuesto que el handler, cada llamada, para siempre. Una comparación barata es un empate; una cara es un impuesto que sigues pagando, y una equivocada se lee como un constraint que pasa."  # @src=d8f9a380d743
              a:
                # | Nothing — constraint hooks are metered separately, outside the
                # | instruction's own compute budget
                label: "Nada — los hooks de constraint se miden aparte, fuera del presupuesto de cómputo propio que tiene la instrucción"  # @src=9cf9751cc8e4
                # | There is no separate meter. A check hook executes inside the same
                # | instruction as the handler and draws on the same compute budget, so
                # | every CU it burns is a CU the handler no longer has.
                feedback: "No hay un medidor aparte. Un hook check se ejecuta dentro de la misma instrucción que el handler y tira del mismo presupuesto de cómputo, así que cada CU que quema es una CU que el handler ya no tiene."  # @src=0fc46d9f77b0
              b:
                # | One time at init — codegen caches the check result on the account so
                # | later instructions skip the hook
                label: "Una sola vez en init — codegen cachea el resultado de la verificación en la cuenta, así las instrucciones posteriores se saltan el hook"  # @src=aa33fac00347
                # | Codegen caches nothing. `ns::key = value` routes to check, and check
                # | re-runs on every instruction that declares the constraint, so the cost
                # | recurs on each call rather than amortizing at creation.
                feedback: "Codegen no cachea nada. `ns::key = value` enruta a check, y check vuelve a correr en cada instrucción que declara el constraint, así que el costo se repite en cada llamada en vez de amortizarse en la creación."  # @src=e4a611a043c9
              d:
                # | Just the calls that take the vault as mut, since a load without mut
                # | usually skips hooks
                label: "Solo las llamadas que toman el vault como mut, ya que una carga sin mut normalmente se salta los hooks"  # @src=e5681276e34c
                # | A cost that scales with writes would be a comfortable rule, and exit
                # | really does behave that way. check does not: the vault on RequireFunded
                # | is not even mut, and the hook still runs on every instruction that
                # | declares the constraint.
                feedback: "Un costo que escala con las escrituras sería una regla cómoda, y exit sí se comporta así de verdad. check no: el vault en RequireFunded ni siquiera es mut, y el hook igual corre en cada instrucción que declara el constraint."  # @src=fc58dd33770e
  m04-l1:
    # | CPI basics and signing as a PDA
    title: "Fundamentos de CPI y la firma como PDA"  # @src=7824fe37f055
    blocks:
      resolve-withdrawal:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the three failure cases first, then compute the safe remainder.
          0: "Verifica primero los tres casos de falla, después calcula el resto seguro."  # @src=2bb71ee850b6
          # | The rent-exempt floor is what keeps the PDA alive; letting the balance fall
          # | below it can close the account.
          1: "El piso exento de renta es lo que mantiene vivo al PDA; dejar que el saldo caiga por debajo puede cerrar la cuenta."  # @src=d64f9c4c1205
        tests:                      # keyed by test case id
          t1:
            # | A withdrawal that leaves the vault rent-exempt returns the requested amount.
            description: "Un retiro que deja el vault exento de renta devuelve el monto solicitado."  # @src=6f153915b12e
          t2:
            # | A zero request is refused with -1.
            description: "Una solicitud de cero se rechaza con -1."  # @src=c9a891d4f577
          t3:
            # | An over-withdraw (requested > balance) is refused with -2 instead of
            # | underflowing.
            description: "Un retiro excesivo (requested > balance) se rechaza con -2 en vez de hacer underflow."  # @src=e3cb179796c7
          t4:
            # | A withdrawal that would drop the remainder below the rent-exempt minimum is
            # | refused with -3.
            description: "Un retiro que dejaría el resto por debajo del mínimo exento de renta se rechaza con -3."  # @src=86885b7d477f
          t5:
            # | The boundary is inclusive: a withdrawal leaving EXACTLY the rent-exempt
            # | minimum is allowed. A guard written `remaining <= rent_exempt_min` refuses
            # | this and passes every other case.
            description: "La frontera es inclusiva: un retiro que deja EXACTAMENTE el mínimo exento de renta se permite. Una guarda escrita `remaining <= rent_exempt_min` rechaza este y pasa todos los demás casos."  # @src=7f9c99c49b29
          t6:
            # | One lamport past the boundary: leaving rent_exempt_min - 1 is refused with
            # | -3.
            description: "Un lamport más allá de la frontera: dejar rent_exempt_min - 1 se rechaza con -3."  # @src=76f7b50a4efe
          t7:
            # | An over-withdraw that would ALSO breach the rent floor is still -2: the
            # | balance check is reached first.
            description: "Un retiro excesivo que ADEMÁS rompería el piso de rent sigue siendo -2: la verificación del saldo se alcanza primero."  # @src=93eaa2515df5
      check:                      # quiz
        questions:
          m04-l1-q1:
            # | You wired the vault's withdraw to sign as a PDA. What do you pass to
            # | invoke_signed as the signer seeds?
            prompt: "Cableaste el withdraw del vault para que firme como PDA. ¿Qué le pasas a invoke_signed como signer seeds?"  # @src=81e011a64271
            # | A PDA is off the ed25519 curve and has no private key, so the runtime lets
            # | the owning program sign for it by presenting the exact seeds plus the
            # | canonical bump. You stored that bump at initialization precisely so withdraw
            # | can rebuild the signer seeds cheaply and deterministically. Note whose seeds
            # | they are: withdraw moves lamports out of the zero-data SOL PDA, so the seeds
            # | are [b"sol", owner] with state.sol_bump, not the state PDA's own [b"vault",
            # | owner]. Re-derivation is bound to the calling program's ID, which is why no
            # | other program can present those seeds and sign for your vault.
            explanation: "Un PDA está fuera de la curva ed25519 y no tiene clave privada, así que el runtime deja que el programa dueño firme por él presentando los seeds exactos más el bump canónico. Guardaste ese bump en la inicialización precisamente para que withdraw pueda reconstruir los signer seeds de forma barata y determinista. Fíjate de quién son esos seeds: withdraw mueve lamports fuera del PDA de SOL sin datos, así que los seeds son [b\"sol\", owner] con state.sol_bump, no los propios [b\"vault\", owner] del PDA de estado. La re-derivación está atada al ID del programa que llama, y por eso ningún otro programa puede presentar esos seeds y firmar por tu vault."  # @src=6342a9a13c15
            options:                 # source order — keep it
              c:
                # | A bump recomputed by calling find_program_address for [b"sol", owner]
                # | inside the withdraw handler.
                label: "Un bump recalculado llamando a find_program_address para [b\"sol\", owner] dentro del handler withdraw."  # @src=5c00745fa674
                # | That compiles and usually works, which is what makes it tempting. But
                # | find_program_address walks bumps downward from 255 with a syscall per
                # | attempt, so you pay for the search on every withdraw, and a hand-rolled
                # | derivation can land on a non-canonical address. Store the bump at init
                # | and reuse it.
                feedback: "Eso compila y suele funcionar, que es lo que lo vuelve tentador. Pero find_program_address camina los bumps hacia abajo desde 255 con un syscall por intento, así que pagas la búsqueda en cada withdraw, y una derivación hecha a mano puede caer en una dirección no canónica. Guarda el bump en el init y reutilízalo."  # @src=d51b3289a8af
              a:
                # | The SOL vault's own seeds plus its stored canonical bump: [b"sol",
                # | owner.as_ref(), &[state.sol_bump]].
                label: "Los seeds propios del vault de SOL más su bump canónico guardado: [b\"sol\", owner.as_ref(), &[state.sol_bump]]."  # @src=b90e7b475be6
                # | Lamports leave the zero-data PDA, so it is that account's seed set you
                # | present, not the state account's. That is the easy slip here. Derivation
                # | is scoped to the invoking program id, so nobody else can present them.
                feedback: "Los lamports salen del PDA sin datos, así que es el conjunto de seeds de esa cuenta el que presentas, no el de la cuenta de estado. Ese es el resbalón fácil acá. La derivación está acotada al id del programa que invoca, así que nadie más puede presentarlos."  # @src=9911c712948f
              d:
                # | The state PDA's seeds plus its stored bump: [b"vault", owner.as_ref(),
                # | &[state.bump]].
                label: "Los seeds del PDA de estado más su bump guardado: [b\"vault\", owner.as_ref(), &[state.bump]]."  # @src=5d14817cee8d
                # | The commonest slip on this handler, because the state account is the one
                # | that feels like the vault. The lamports leave the zero-data SOL PDA, so
                # | the seeds you present are that account's, [b"sol", owner] with
                # | state.sol_bump; the state account is only the ledger and signs nothing.
                feedback: "El resbalón más común en este handler, porque la cuenta de estado es la que se siente como el vault. Los lamports salen del PDA de SOL sin datos, así que los seeds que presentas son los de esa cuenta, [b\"sol\", owner] con state.sol_bump; la cuenta de estado es solo el libro mayor y no firma nada."  # @src=9f00d7c97f97
              b:
                # | The authority's secret key bytes, read off the Signer account, since the
                # | authority owns the vault.
                label: "Los bytes de la clave secreta de la authority, leídos de la cuenta Signer, ya que la authority es dueña del vault."  # @src=a67e819deca3
                # | A Signer exposes no secret key to the program, and a PDA has no private
                # | key at all. PDA signing is a runtime permission granted from seeds plus
                # | the bump, never a keypair.
                feedback: "Un Signer no le expone ninguna clave secreta al programa, y un PDA no tiene ninguna clave privada. La firma por PDA es un permiso del runtime otorgado a partir de los seeds más el bump, nunca un par de claves."  # @src=8854c1b2370d
          m04-l1-q2:
            # | In Anchor V2, what does CpiContext::new take as its program argument, and
            # | how are the accounts passed?
            prompt: "En Anchor V2, ¿qué toma CpiContext::new como argumento de programa, y cómo se pasan las cuentas?"  # @src=8322a4ae55af
            # | V2's CpiContext::new(program: &Address, accounts) is the shape you will type
            # | all lesson. The accounts arrive as CpiHandle borrow-tracked handles,
            # | obtained with .cpi_handle() for a read and .cpi_handle_mut() for a write,
            # | which is the detail that makes the next lesson's compile-time safety
            # | possible. The PDA signer rides along separately through
            # | .with_signer(signer_seeds), the ergonomic wrapper over the raw invoke_signed
            # | syscall.
            explanation: "El CpiContext::new(program: &Address, accounts) de V2 es la forma que vas a escribir toda la lección. Las cuentas llegan como handles CpiHandle con seguimiento de borrow, que consigues con .cpi_handle() para una lectura y .cpi_handle_mut() para una escritura, que es el detalle que hace posible la seguridad en tiempo de compilación de la próxima lección. El signer del PDA viaja junto por separado a través de .with_signer(signer_seeds), el wrapper ergonómico sobre el syscall crudo invoke_signed."  # @src=cb2a3cae78a0
            options:                 # source order — keep it
              d:
                # | An &Address for the program, with accounts as an AccountInfo slice you
                # | assemble by hand
                label: "Un &Address para el programa, con las cuentas como un slice de AccountInfo que ensamblas a mano"  # @src=51dda89617da
                # | Right about the program argument, which is the half most migrations
                # | reach first. The accounts do not arrive as raw AccountInfos: each is a
                # | CpiHandle from .cpi_handle() or .cpi_handle_mut(), and that borrow is
                # | what the next lesson's compile-time safety rests on.
                feedback: "Correcto sobre el argumento de programa, que es la mitad a la que llegan primero la mayoría de las migraciones. Las cuentas no llegan como AccountInfos crudos: cada una es un CpiHandle de .cpi_handle() o .cpi_handle_mut(), y ese borrow es sobre lo que descansa la seguridad en tiempo de compilación de la próxima lección."  # @src=48794c73daab
              c:
                # | A Pubkey by value for the program, with accounts as plain &mut
                # | references.
                label: "Un Pubkey por valor para el programa, con las cuentas como referencias &mut planas."  # @src=1c64c0f92f66
                # | The Anchor 1.0 line did take the program as a Pubkey, so this is the
                # | natural half-migration guess. V2 takes a &Address and wraps each account
                # | in a CpiHandle instead of a bare mutable reference.
                feedback: "La línea Anchor 1.0 sí tomaba el programa como un Pubkey, así que esta es la conjetura natural de media migración. V2 toma un &Address y envuelve cada cuenta en un CpiHandle en vez de una referencia mutable pelada."  # @src=b6826697626e
              b:
                # | A &Address for the program, with accounts as CpiHandle borrow-tracked
                # | handles.
                label: "Un &Address para el programa, con las cuentas como handles CpiHandle con seguimiento de borrow."  # @src=92004846cc1b
                # | Read accessor or mutable one: that single distinction is the hinge
                # | everything in the next lesson turns on. Signer seeds do not ride in the
                # | constructor at all. They arrive through a separate wrapper.
                feedback: "Accesor de lectura o mutable: esa única distinción es la bisagra sobre la que gira todo en la próxima lección. Los signer seeds no viajan en el constructor para nada. Llegan a través de un wrapper aparte."  # @src=0ff4be96d0fe
              a:
                # | An AccountInfo for the target program, with accounts as plain typed
                # | structs.
                label: "Un AccountInfo para el programa de destino, con las cuentas como structs tipados planos."  # @src=5bc9607fcd36
                # | That is the pre-1.0 shape, and it is still what a lot of tutorials show.
                # | V2 changed both halves: the program argument type and the way accounts
                # | are handed over.
                feedback: "Esa es la forma pre-1.0, y sigue siendo lo que muestran un montón de tutoriales. V2 cambió las dos mitades: el tipo del argumento de programa y la forma en que se entregan las cuentas."  # @src=50dbcbbd6df1
          m04-l1-q3:
            # | Your withdraw debits state.credit after the transfer. Which line is safe
            # | under the house rules?
            prompt: "Tu withdraw debita state.credit después de la transferencia. ¿Qué línea es segura bajo las reglas de la casa?"  # @src=a4872ae391f3
            # | checked_sub returns None on underflow instead of panicking, and the ? turns
            # | that into a clean program error the caller can handle. On a custody path
            # | this is the difference between a rejected transaction and an aborted
            # | instruction with a confusing panic log. It also matters because atomicity
            # | only rewinds errors, not silent bugs: if the debit raises, the whole
            # | instruction aborts and the transfer that already ran unwinds with it, but a
            # | wrap never raises, so nothing rolls back and the vault is left believing it
            # | holds eighteen quintillion lamports. Make the bug an error.
            explanation: "checked_sub devuelve None en el underflow en vez de entrar en panic, y el ? convierte eso en un error de programa limpio que quien llama puede manejar. En un camino de custodia esta es la diferencia entre una transacción rechazada y una instrucción abortada con un log de panic confuso. También importa porque la atomicidad solo rebobina errores, no bugs silenciosos: si el débito levanta, toda la instrucción aborta y la transferencia que ya corrió se desenrolla con ella, pero un wrap nunca levanta, así que nada se revierte y el vault se queda creyendo que guarda dieciocho trillones de lamports. Convierte el bug en un error."  # @src=a043499db231
            options:                 # source order — keep it
              a:
                # | state.credit = state.credit - amount; // safe: rustc panics on underflow
                label: "state.credit = state.credit - amount; // seguro: rustc entra en panic en el underflow"  # @src=b9e5b6447c29
                # | A default debug build does panic, which is where that belief comes from.
                # | But whether an optimized build panics or wraps is a manifest setting,
                # | not a rustc constant: with overflow-checks off, the subtraction wraps
                # | silently to a value near u64::MAX. A flag someone can flip is no guard,
                # | and neither a panic nor a wrap is acceptable on a custody path.
                feedback: "Un build de debug por defecto sí entra en panic, que es de donde viene esa creencia. Pero si un build optimizado entra en panic o hace wrap es una configuración del manifiesto, no una constante de rustc: con overflow-checks apagado, la resta hace wrap en silencio hasta un valor cerca de u64::MAX. Un flag que alguien puede dar vuelta no es ninguna guarda, y ni un panic ni un wrap son aceptables en un camino de custodia."  # @src=468a4990370d
              b:
                # | state.credit -= amount; // safe: the require! above proved amount <=
                # | vault lamports
                label: "state.credit -= amount; // seguro: el require! de arriba demostró amount <= lamports del vault"  # @src=373add586b5c
                # | The guard proves the request fits the SOL vault's lamport balance.
                # | state.credit is the separate ledger figure, and the two can drift apart,
                # | so the debit can still underflow. Use checked_sub.
                feedback: "La guarda demuestra que la solicitud entra en el saldo de lamports del vault de SOL. state.credit es la cifra separada del libro mayor, y las dos se pueden separar, así que el débito igual puede hacer underflow. Usa checked_sub."  # @src=21b734856ac3
              c:
                # | state.credit =
                # | state.credit.checked_sub(amount).ok_or(VaultError::Underflow)?;
                label: "state.credit = state.credit.checked_sub(amount).ok_or(VaultError::Underflow)?;"  # @src=36e3c5ed9158
                # | Atomicity only rewinds what raises, and a wrap raises nothing: the
                # | transfer commits and the ledger quietly disagrees with it. Turning the
                # | None into an error is what gives atomicity something to catch.
                feedback: "La atomicidad solo rebobina lo que levanta, y un wrap no levanta nada: la transferencia se consuma y el libro mayor calladamente no coincide con ella. Convertir el None en un error es lo que le da a la atomicidad algo que atrapar."  # @src=e6d23d475131
              d:
                # | state.credit = state.credit.saturating_sub(amount); // safe: floors at
                # | zero, no wrap
                label: "state.credit = state.credit.saturating_sub(amount); // seguro: pone piso en cero, sin wrap"  # @src=ff264429e4aa
                # | It does remove the wrap, which is the failure this lesson opened on, so
                # | it reads like the safe pick. Flooring at zero is still a silent answer:
                # | an over-withdraw leaves the ledger reading zero and raises nothing, so
                # | nothing rolls back the transfer that already ran.
                feedback: "Sí elimina el wrap, que es la falla con la que abrió esta lección, así que se lee como la elección segura. Poner piso en cero sigue siendo una respuesta silenciosa: un retiro excesivo deja el libro mayor marcando cero y no levanta nada, así que nada revierte la transferencia que ya corrió."  # @src=ba4bd5277628
  m04-l2:
    # | The reload footgun is gone
    title: "La trampa del reload ya no existe"  # @src=318a41565a40
    blocks:
      settlement-receipt:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The handles do not die when the TransferChecked literal closes, and not when
          # | the let cpi statement ends. They die when transfer_checked takes the
          # | CpiContext by value, and that call is the boundary every read has to fall on
          # | one side of.
          0: "Los handles no mueren cuando se cierra el literal TransferChecked, ni cuando termina la sentencia let cpi. Mueren cuando transfer_checked toma el CpiContext por valor, y esa llamada es la frontera de la que toda lectura tiene que caer de un lado o del otro."  # @src=beb66ae5bba8
          # | Only the accounts the CPI was handed are locked, and only as hard as their
          # | handle: mint went in through a shared cpi_handle(), which is why reading
          # | mint.decimals() inside that same span is not the error and moving it will not
          # | help.
          1: "Solo las cuentas que se le entregaron a la CPI están bloqueadas, y solo tan fuerte como su handle: mint entró por un cpi_handle() compartido, y por eso leer mint.decimals() dentro de ese mismo tramo no es el error y moverlo no va a ayudar."  # @src=61e3b1b2f4dc
          # | Compiling is half the bar. Whenever amount is non-zero the two numbers in the
          # | receipt have to differ, so a fix that only silences E0502 can still report the
          # | same balance twice and be graded wrong.
          2: "Compilar es la mitad del criterio. Siempre que amount sea distinto de cero los dos números del recibo tienen que diferir, así que un arreglo que solo silencia E0502 igual puede reportar el mismo saldo dos veces y salir mal calificado."  # @src=b6669be16bbd
        tests:                      # keyed by test case id
          t1:
            # | A plain settlement: the receipt opens at 100 and closes at 60, so the two
            # | numbers must be read on opposite sides of the transfer.
            description: "Una liquidación simple: el recibo abre en 100 y cierra en 60, así que los dos números tienen que leerse en lados opuestos de la transferencia."  # @src=ce20046d127f
          t2:
            # | A full drain: closing is 0. Any implementation that reports the same balance
            # | twice fails here.
            description: "Un vaciado total: closing es 0. Cualquier implementación que reporte el mismo saldo dos veces falla acá."  # @src=205a2a75820e
          t3:
            # | A zero-amount settlement, where a stale read happens to be right: opening
            # | and closing coincide, so this is the one case a misplaced read still passes.
            # | That is the v1 footgun's whole disguise.
            description: "Una liquidación de monto cero, donde una lectura obsoleta da la casualidad de estar bien: opening y closing coinciden, así que este es el único caso en que una lectura mal ubicada igual pasa. Ese es todo el disfraz de la trampa de v1."  # @src=b31856440757
          t4:
            # | One token unit off a million: the two reads differ by the smallest possible
            # | margin, so a receipt that reports one number twice is still wrong here.
            description: "Una unidad de token por debajo del millón: las dos lecturas difieren por el margen más chico posible, así que un recibo que reporta un número dos veces sigue estando mal acá."  # @src=763d09614b5b
          t5:
            # | The vault empties into an already-large recipient: closing is read from the
            # | vault, never from the recipient.
            description: "El vault se vacía en un receptor que ya es grande: closing se lee del vault, nunca del receptor."  # @src=980b37047644
      check:                      # quiz
        questions:
          m04-l2-q1:
            # | You try to read ctx.accounts.vault's typed balance while a cpi_handle_mut
            # | taken from that same vault account is still in scope. What happens in V2?
            prompt: "Intentas leer el saldo tipado de ctx.accounts.vault mientras un cpi_handle_mut tomado de esa misma cuenta vault sigue en scope. ¿Qué pasa en V2?"  # @src=c2c836090456
            # | The CpiHandle is a Rust borrow of that one account. While it is alive the
            # | borrow checker will not let you also borrow the same account's typed data,
            # | so the classic read-during-a-live-CPI line cannot be written — and the lock
            # | is exact: accounts you did not hand the CPI stay readable the whole time.
            # | Safety here is a property of the type system, not a runtime check you might
            # | forget. Once the handle drops the read is legal and already fresh, because
            # | V2's Account<T> is a zero-copy view over the account's live buffer rather
            # | than a deserialized copy sitting on your stack.
            explanation: "El CpiHandle es un borrow de Rust sobre esa única cuenta. Mientras está vivo el borrow checker no te deja tomar prestados además los datos tipados de la misma cuenta, así que la clásica línea de lectura-durante-una-CPI-viva no se puede escribir — y el bloqueo es exacto: las cuentas que no le entregaste a la CPI siguen legibles todo el tiempo. La seguridad acá es una propiedad del sistema de tipos, no una verificación en tiempo de ejecución que te puedas olvidar. En cuanto el handle se suelta la lectura es legal y ya está fresca, porque el Account<T> de V2 es una vista zero-copy sobre el buffer vivo de la cuenta y no una copia deserializada sentada en tu stack."  # @src=147395ef5157
            options:                 # source order — keep it
              d:
                # | It compiles: a CpiHandle borrows the raw AccountInfo, and typed field
                # | reads take a separate path the borrow checker misses
                label: "Compila: un CpiHandle toma prestado el AccountInfo crudo, y las lecturas de campos tipados toman un camino aparte que el borrow checker se pierde"  # @src=5e823bb0c37a
                # | It would be a real hole if the handle and the typed read went through
                # | different borrows, and that is worth checking rather than assuming. They
                # | do not: a CpiHandle is an ordinary Rust borrow of that account field, so
                # | a typed read of the same field is the second conflicting borrow and the
                # | build stops.
                feedback: "Sería un agujero de verdad si el handle y la lectura tipada pasaran por borrows distintos, y eso vale la pena verificarlo en vez de asumirlo. No pasan: un CpiHandle es un borrow común de Rust sobre ese campo de la cuenta, así que una lectura tipada del mismo campo es el segundo borrow conflictivo y el build se detiene."  # @src=c0e0563a7e09
              a:
                # | It is a compile error: the live CpiHandle holds a mutable borrow of that
                # | account, which excludes typed reads of it.
                label: "Es un error de compilación: el CpiHandle vivo sostiene un borrow mutable de esa cuenta, lo que excluye las lecturas tipadas de ella."  # @src=4385fdcf9fce
                # | One account wide, no wider — hand the CPI a vault and the config beside
                # | it stays readable the whole time. When the handle goes, the read is
                # | legal again and already current, because there was never a copy to
                # | refresh.
                feedback: "Una cuenta de ancho, ni una más — entrégale a la CPI un vault y la config que está al lado sigue legible todo el tiempo. Cuando el handle se va, la lectura vuelve a ser legal y ya está al día, porque nunca hubo una copia que refrescar."  # @src=47ff70961b29
              b:
                # | It compiles and returns the pre-CPI value until you call
                # | ctx.accounts.vault.reload() to refresh the copy.
                label: "Compila y devuelve el valor pre-CPI hasta que llamas a ctx.accounts.vault.reload() para refrescar la copia."  # @src=fa26e41e6263
                # | That is the v1 behavior, and .reload() is a v1 API. V2 removes it and
                # | makes the stale read impossible to write in the first place.
                feedback: "Ese es el comportamiento de v1, y .reload() es una API de v1. V2 lo quita y de entrada vuelve imposible de escribir la lectura obsoleta."  # @src=d6d89f94d61d
              c:
                # | It compiles and returns the post-CPI value, because V2's Account<T> is a
                # | zero-copy view over live bytes.
                label: "Compila y devuelve el valor post-CPI, porque el Account<T> de V2 es una vista zero-copy sobre los bytes vivos."  # @src=f1359daabcbb
                # | Account<T> being a zero-copy view is why a read is fresh once the handle
                # | drops, but it does not make the read legal while the handle is live: the
                # | borrow checker rejects it, so the line never compiles.
                feedback: "Que Account<T> sea una vista zero-copy es la razón de que una lectura esté fresca en cuanto el handle se suelta, pero no vuelve legal la lectura mientras el handle está vivo: el borrow checker la rechaza, así que la línea nunca compila."  # @src=25b15083e6ab
          m04-l2-q2:
            # | How is this different from the v1 footgun it replaces?
            prompt: "¿En qué se diferencia esto de la trampa de v1 que reemplaza?"  # @src=f9fb6ac1b1cd
            # | The v1 hazard was invisible: your program compiled, ran, and acted on data
            # | from before the CPI, and only a careful test or an incident revealed it. V2
            # | moves the failure from runtime-and-silent to compile-time-and-loud, which is
            # | the entire point of the borrow model. v1's only defence was remembering to
            # | call .reload() after every mutating CPI — one cheap line whose omission
            # | produced no error, no warning, and no panic.
            explanation: "El peligro de v1 era invisible: tu programa compilaba, corría y actuaba sobre datos de antes de la CPI, y solo una prueba cuidadosa o un incidente lo revelaba. V2 mueve el fallo de tiempo-de-ejecución-y-silencioso a tiempo-de-compilación-y-ruidoso, que es el punto entero del modelo de borrow. La única defensa de v1 era acordarse de llamar a .reload() después de cada CPI que muta — una línea barata cuya omisión no producía ningún error, ninguna advertencia y ningún panic."  # @src=5b7ace36e01c
            options:                 # source order — keep it
              c:
                # | v1 panicked at runtime whenever a post-CPI read hit an invalidated copy.
                label: "v1 entraba en panic en tiempo de ejecución cada vez que una lectura post-CPI daba con una copia invalidada."  # @src=496b68035faf
                # | It did not panic. The deserialized copy was a perfectly valid struct
                # | holding an out-of-date number, so v1 quietly handed you old data —
                # | silent-and-wrong, which is worse than a panic because nothing points at
                # | it.
                feedback: "No entraba en panic. La copia deserializada era una struct perfectamente válida que guardaba un número desactualizado, así que v1 te entregaba datos viejos en silencio — silencioso-y-equivocado, que es peor que un panic porque nada lo señala."  # @src=1447d7450f9f
              b:
                # | In v1 the stale read compiled and returned the pre-CPI copy; V2 makes it
                # | a compile error.
                label: "En v1 la lectura obsoleta compilaba y devolvía la copia pre-CPI; V2 la vuelve un error de compilación."  # @src=c80dd1bb6d0c
                # | The v1 remedy was one line you had to remember, and forgetting it
                # | produced no diagnostic whatsoever — not an error, not a warning,
                # | nothing. Trading a silent wrong answer for a loud build failure is the
                # | whole of the deal.
                feedback: "El remedio de v1 era una línea que tenías que recordar, y olvidarla no producía absolutamente ningún diagnóstico — ni un error, ni una advertencia, nada. Canjear una respuesta silenciosa y equivocada por un fallo de build ruidoso es todo el trato."  # @src=d6c8924d7c87
              a:
                # | v1 also rejected the read at compile time; V2 merely renamed .reload()
                # | into an idiom.
                label: "v1 también rechazaba la lectura en tiempo de compilación; V2 nada más rebautizó .reload() como una forma idiomática."  # @src=b1d676524fa8
                # | v1 compiled the stale read just fine, which is why it shipped as a bug
                # | so often. And .reload() was a real runtime re-read of the account bytes,
                # | not an idiom V2 renamed — V2 deletes it because there is no copy left to
                # | refresh.
                feedback: "v1 compilaba la lectura obsoleta sin problema, que es por qué se entregaba como bug tan seguido. Y .reload() era una relectura real de los bytes de la cuenta en tiempo de ejecución, no una forma idiomática que V2 rebautizó — V2 lo borra porque no queda ninguna copia que refrescar."  # @src=3f56c6692d95
              d:
                # | v1 auto-reloaded each account after a CPI, and V2 dropped that to save
                # | the deserialize cost
                label: "v1 recargaba automáticamente cada cuenta después de una CPI, y V2 descartó eso para ahorrar el costo de deserialización"  # @src=1d2bc215aa96
                # | Auto-refresh was genuinely weighed for V2 and dropped on exactly that
                # | cost, so half of this is a real design note filed under the wrong
                # | version. v1 refreshed nothing on its own: .reload() was a call you had
                # | to remember, and forgetting it produced no diagnostic at all.
                feedback: "El auto-refresh se sopesó de verdad para V2 y se descartó exactamente por ese costo, así que la mitad de esto es una nota de diseño real archivada bajo la versión equivocada. v1 no refrescaba nada por su cuenta: .reload() era una llamada que tenías que recordar, y olvidarla no producía ningún diagnóstico."  # @src=5dc515711814
          m04-l2-q3:
            # | A teammate says the borrow model means you never have to think about account
            # | freshness again. Are they right?
            prompt: "Un compañero dice que el modelo de borrow quiere decir que nunca más tienes que pensar en la frescura de las cuentas. ¿Tiene razón?"  # @src=bd95bc7fcde9
            # | The guarantee is precise and worth stating precisely. The compiler stops you
            # | from reading typed account data while a handle is live, which kills the
            # | common footgun, but it does not refresh values and it does not cover raw
            # | lamport or byte-level reads. Knowing the edge of a safety guarantee is part
            # | of using it well. Silently re-deserializing every held account after every
            # | CPI was ruled out deliberately: eager Account<T> deserialization was the
            # | number-one performance complaint that motivated V2, so doing it more often
            # | would have reinstated the exact tax the redesign set out to abolish — and it
            # | would still miss raw byte reads.
            explanation: "La garantía es precisa y vale la pena enunciarla con precisión. El compilador te impide leer los datos tipados de una cuenta mientras un handle está vivo, lo que mata la trampa común, pero no refresca valores y no cubre las lecturas de lamports crudos ni las de nivel de bytes. Conocer el borde de una garantía de seguridad es parte de usarla bien. Volver a deserializar en silencio cada cuenta que sostienes después de cada CPI se descartó a propósito: la deserialización eager de Account<T> era la queja de rendimiento número uno que motivó V2, así que hacerlo más seguido habría restablecido el impuesto exacto que el rediseño se propuso abolir — y todavía se perdería las lecturas de bytes crudos."  # @src=70968212f009
            options:                 # source order — keep it
              a:
                # | Yes: dropping the CpiHandle re-deserializes the account, so every
                # | post-CPI read is refreshed.
                label: "Sí: soltar el CpiHandle vuelve a deserializar la cuenta, así que toda lectura post-CPI queda refrescada."  # @src=fb09fae42028
                # | Nothing is re-deserialized. Auto-refreshing accounts after every CPI was
                # | one of the designs V2 considered and rejected on cost; the handle only
                # | excludes typed access while it is live.
                feedback: "No se vuelve a deserializar nada. Auto-refrescar las cuentas después de cada CPI fue uno de los diseños que V2 consideró y rechazó por el costo; el handle solo excluye el acceso tipado mientras está vivo."  # @src=57c90ff94818
              c:
                # | No: it guards typed account access only, not raw AccountInfo lamports or
                # | manual byte reads.
                label: "No: protege solo el acceso tipado a las cuentas, no los lamports crudos de AccountInfo ni las lecturas manuales de bytes."  # @src=6890ea6815bf
                # | Auto-refreshing every held account was weighed and dropped: that
                # | deserialize cost is the exact thing the rewrite exists to remove. So
                # | lamport arithmetic and hand-rolled byte reads stay yours.
                feedback: "Auto-refrescar cada cuenta que sostienes se sopesó y se descartó: ese costo de deserialización es exactamente lo que la reescritura existe para eliminar. Así que la aritmética de lamports y las lecturas de bytes hechas a mano siguen siendo tuyas."  # @src=502b30d25e19
              b:
                # | Yes: the borrow held by a live CpiHandle covers raw AccountInfo lamports
                # | and hand-rolled byte reads too.
                label: "Sí: el borrow que sostiene un CpiHandle vivo cubre también los lamports crudos de AccountInfo y las lecturas de bytes hechas a mano."  # @src=ef032fa3e8b6
                # | The borrow model guards typed account access only. Raw AccountInfo
                # | lamports and manual reads out of the data buffer stay your
                # | responsibility, exactly as they were in v1.
                feedback: "El modelo de borrow protege solo el acceso tipado a las cuentas. Los lamports crudos de AccountInfo y las lecturas manuales del buffer de datos siguen siendo tu responsabilidad, exactamente como lo eran en v1."  # @src=20d47205a86f
              d:
                # | Yes, provided each account the instruction takes goes into the
                # | CpiContext, which the derive typically checks for you
                label: "Sí, siempre que cada cuenta que toma la instrucción entre al CpiContext, cosa que la macro de derive normalmente verifica por ti"  # @src=2b3f6e91b339
                # | Handing everything to the CPI would widen the lock, which is at least
                # | the right shape for a guarantee. Nothing checks that you did, and a CPI
                # | can touch none of the accounts it was not given, so the lock stays on
                # | the handles you actually built and raw lamport reads sit outside it
                # | either way.
                feedback: "Entregarle todo a la CPI ensancharía el bloqueo, que al menos es la forma correcta para una garantía. Nada verifica que lo hiciste, y una CPI no puede tocar ninguna de las cuentas que no le entregaron, así que el bloqueo se queda en los handles que de verdad construiste y las lecturas de lamports crudos quedan fuera de él de todos modos."  # @src=46eb28354737
          m04-l2-q4:
            # | The receipt needs the vault's typed balance once the transfer has landed.
            # | What is the V2 idiom?
            prompt: "El recibo necesita el saldo tipado del vault una vez que la transferencia aterrizó. ¿Cuál es la forma idiomática de V2?"  # @src=d0b94309018c
            # | The V2 idiom is scope discipline: the handle exists only for the CPI, and
            # | once it drops the borrow is released and the live typed data is readable
            # | again. Where v1 asked you to remember .reload(), V2 asks you to structure
            # | the borrow, and the compiler checks you did. Capturing a value into a local
            # | before any handle exists is the complementary idiom for the other direction
            # | — it gives you the pre-CPI value — so a post-CPI read must sit below the
            # | line that consumes the CpiContext.
            explanation: "La forma idiomática de V2 es disciplina de scope: el handle existe solo para la CPI, y en cuanto se suelta el borrow se libera y los datos tipados vivos vuelven a ser legibles. Donde v1 te pedía acordarte de .reload(), V2 te pide estructurar el borrow, y el compilador verifica que lo hiciste. Capturar un valor en un local antes de que exista ningún handle es la forma idiomática complementaria para la otra dirección — te da el valor pre-CPI — así que una lectura post-CPI tiene que quedar debajo de la línea que consume el CpiContext."  # @src=7d6217a89ae1
            options:                 # source order — keep it
              b:
                # | Call ctx.accounts.vault.reload() after the CPI to refresh the
                # | deserialized copy.
                label: "Llamar a ctx.accounts.vault.reload() después de la CPI para refrescar la copia deserializada."  # @src=3645050e0a2b
                # | .reload() is a v1 API that V2 removes, and there is no deserialized copy
                # | to refresh: Account<T> is a zero-copy view over the account's live
                # | bytes.
                feedback: ".reload() es una API de v1 que V2 quita, y no hay ninguna copia deserializada que refrescar: Account<T> es una vista zero-copy sobre los bytes vivos de la cuenta."  # @src=026266cb7186
              a:
                # | Let the cpi_handle_mut drop by ending its scope, then read the typed
                # | account.
                label: "Dejar que el cpi_handle_mut se suelte terminando su scope, y luego leer la cuenta tipada."  # @src=7f0d9aa85051
                # | Remembering a call became shaping a scope, and the compiler checks the
                # | shape. Snapshotting into a local is the opposite tool: it freezes the
                # | old value, so it can never show you the new one.
                feedback: "Acordarse de una llamada se volvió darle forma a un scope, y el compilador verifica la forma. Tomar una instantánea en un local es la herramienta opuesta: congela el valor viejo, así que nunca te puede mostrar el nuevo."  # @src=84ba3cb4157d
              c:
                # | Copy the field into a local before building the handle, then read that
                # | local after the CPI.
                label: "Copiar el campo a un local antes de construir el handle, y luego leer ese local después de la CPI."  # @src=6988c463f40b
                # | Capturing into a local up top is the right idiom when you need the
                # | pre-CPI value, and it is how the handler grabs sol_bump. But the local
                # | is frozen at the instant you copied it, so it can never show the
                # | post-CPI balance.
                feedback: "Capturar en un local arriba es la forma idiomática correcta cuando necesitas el valor pre-CPI, y es como el handler agarra sol_bump. Pero el local queda congelado en el instante en que lo copiaste, así que nunca puede mostrar el saldo post-CPI."  # @src=4073b3d99200
              d:
                # | Take a fresh cpi_handle() on the vault after the CPI and read through
                # | that one
                label: "Tomar un cpi_handle() nuevo sobre el vault después de la CPI y leer a través de ese"  # @src=e1b13f04a597
                # | A handle is how you hand an account to a CPI, not how you read one, and
                # | taking a second one is the move that keeps a borrow alive rather than
                # | ending it. The read you want is a plain typed field access below the
                # | line that consumes the CpiContext.
                feedback: "Un handle es cómo le entregas una cuenta a una CPI, no cómo lees una, y tomar un segundo es la jugada que mantiene vivo un borrow en vez de terminarlo. La lectura que quieres es un acceso simple a un campo tipado, debajo de la línea que consume el CpiContext."  # @src=ceafbfbb9686
  m04-l3:
    # | Composition: build the prize-escrow
    title: "Composición: construye el prize-escrow"  # @src=bca39d5aa21e
    blocks:
      check:                      # quiz
        questions:
          m04-l3-q1:
            # | Your escrow's redeem instruction takes the escrow record and its vault
            # | account, and marks them both mut. Does V2 accept this?
            prompt: "La instrucción redeem de tu escrow toma el registro del escrow y su cuenta de vault, y marca las dos como mut. ¿V2 acepta esto?"  # @src=c41a8ad459ea
            # | The default that V2 enforces is against duplicate mutable accounts, the
            # | aliasing hazard where one account is passed under two names and one write
            # | silently clobbers the other. Two different accounts, even both mutable, are
            # | exactly what composition needs and are allowed with no ceremony. The check
            # | is split across two moments: the derive macro bakes a compile-time 256-bit
            # | MUT_MASK of which fields are mut, and the dispatcher then walks that mask
            # | against a runtime bitvec of addresses seen so far, raising
            # | ConstraintDuplicateMutableAccount when an address collision touches the
            # | writable set — at least one of the colliding slots marked mut is enough, and
            # | only all-read-only aliases pass. The sanctioned escape for a genuine alias
            # | stays unsafe(dup) on the mut slot.
            explanation: "El default que V2 impone es contra las cuentas mutables duplicadas, el peligro de aliasing donde una cuenta se pasa bajo dos nombres y una escritura pisa en silencio la otra. Dos cuentas diferentes, incluso las dos mutables, son exactamente lo que la composición necesita y están permitidas sin ninguna ceremonia. La verificación está dividida en dos momentos: la macro derive cocina un MUT_MASK de 256 bits en tiempo de compilación con qué campos son mut, y el dispatcher después recorre esa máscara contra un bitvec en tiempo de ejecución de las direcciones vistas hasta ahí, levantando ConstraintDuplicateMutableAccount cuando una colisión de direcciones toca el conjunto escribible — alcanza con que aunque sea uno de los slots que colisionan esté marcado mut, y solo pasan los alias que son todos de solo lectura. La salida sancionada para un alias genuino sigue siendo unsafe(dup) en el slot mut."  # @src=6272670302c9
            options:                 # source order — keep it
              c:
                # | Yes, but only if both carry unsafe(dup), since the check counts mut
                # | fields, not addresses.
                label: "Sí, pero solo si las dos llevan unsafe(dup), ya que la verificación cuenta campos mut, no direcciones."  # @src=f2188fd39705
                # | Backwards: the check counts addresses, not fields. unsafe(dup) is the
                # | per-field opt-out for a genuine alias, and two distinct accounts never
                # | collide, so they need no opt-out.
                feedback: "Al revés: la verificación cuenta direcciones, no campos. unsafe(dup) es el opt-out por campo para un alias genuino, y dos cuentas distintas nunca colisionan, así que no necesitan ningún opt-out."  # @src=d00a286ef824
              d:
                # | No: both are PDAs derived by the same program, so the duplicate walk
                # | treats them as one slot
                label: "No: las dos son PDAs derivadas por el mismo programa, así que el recorrido de duplicados las trata como un solo slot"  # @src=bb72ff911eaf
                # | Sharing a deriving program makes two accounts feel related, and the seed
                # | scheme does put them in one namespace. The walk compares the addresses
                # | that actually arrived, not how they were derived, so two different
                # | addresses do not collide however alike their seeds look.
                feedback: "Compartir un programa que las deriva hace que dos cuentas se sientan relacionadas, y el esquema de seeds sí las pone en un mismo namespace. El recorrido compara las direcciones que de verdad llegaron, no cómo fueron derivadas, así que dos direcciones diferentes no colisionan por más parecidas que se vean sus seeds."  # @src=5750030705c4
              b:
                # | Yes: distinct mutable accounts are fine; only the SAME account passed
                # | twice needs unsafe(dup).
                label: "Sí: las cuentas mutables distintas están bien; solo la MISMA cuenta pasada dos veces necesita unsafe(dup)."  # @src=92b68056c0eb
                # | A compile-time mask records which fields are writable; a runtime walk
                # | compares the addresses that actually arrived. Neither alone raises
                # | anything — only an address collision touching the writable set does, and
                # | one colliding slot marked mut is already enough. The escape for a
                # | genuine alias is unsafe(dup) on the mut slot.
                feedback: "Una máscara de tiempo de compilación registra qué campos son escribibles; un recorrido en tiempo de ejecución compara las direcciones que de verdad llegaron. Ninguna de las dos sola levanta nada — solo lo hace una colisión de direcciones que toca el conjunto escribible, y con un solo slot que colisiona marcado mut ya alcanza. La salida para un alias genuino es unsafe(dup) en el slot mut."  # @src=5b71e064fa71
              a:
                # | No: V2's MUT_MASK check rejects any instruction carrying more than one
                # | mut account.
                label: "No: la verificación de MUT_MASK de V2 rechaza cualquier instrucción que lleve más de una cuenta mut."  # @src=6847dfe6ca92
                # | MUT_MASK records which fields are mut, but the dispatcher only fails on
                # | an address collision that touches the writable set — the same address
                # | arriving in two slots with at least one of them marked mut. A cap on the
                # | number of mutable accounts does not exist.
                feedback: "MUT_MASK registra qué campos son mut, pero el dispatcher solo falla ante una colisión de direcciones que toca el conjunto escribible — la misma dirección llegando a dos slots con aunque sea uno de ellos marcado mut. Un tope en la cantidad de cuentas mutables no existe."  # @src=a9d41fec41ea
          m04-l3-q2:
            # | You are migrating the escrow's authority check from has_one = maker. What is
            # | the V2 form?
            prompt: "Estás migrando la verificación de autoridad del escrow desde has_one = maker. ¿Cuál es la forma de V2?"  # @src=e28ca340d90e
            # | In V2 has_one is deprecated in favor of address = parent.field, which
            # | accepts any expression and reads as what it does: this account's key must
            # | equal that stored field. The compiler underlines the has_one deprecation for
            # | you, which makes this a mechanical, guided migration.
            explanation: "En V2 has_one está obsoleto a favor de address = parent.field, que acepta cualquier expresión y se lee como lo que hace: la clave de esta cuenta tiene que ser igual a ese campo almacenado. El compilador te subraya la obsolescencia de has_one, lo que hace de esto una migración mecánica y guiada."  # @src=038d9486027d
            options:                 # source order — keep it
              d:
                # | owner = escrow.maker, the constraint that replaced has_one
                label: "owner = escrow.maker, el constraint que reemplazó a has_one"  # @src=373c6fcc7a81
                # | The two keywords sit next to each other in the catalog and one of them
                # | did take over from has_one. owner asks which program owns the account,
                # | and on a typed wrapper that question is already settled during load; the
                # | key-equality check is address =.
                feedback: "Los dos keywords se sientan uno al lado del otro en el catálogo y uno de ellos sí tomó el relevo de has_one. owner pregunta qué programa es dueño de la cuenta, y en un wrapper tipado esa pregunta ya queda resuelta durante la carga; la verificación de igualdad de claves es address =."  # @src=bd604734569d
              b:
                # | constraint = escrow.maker == maker.key(), the only remaining form.
                label: "constraint = escrow.maker == maker.key(), la única forma que queda."  # @src=5a298c23a180
                # | A raw constraint does enforce the same equality, but it is not the only
                # | form left: address = escrow.maker is the idiomatic replacement, and V2
                # | structs spell the accessor .address() rather than V1's .key().
                feedback: "Un constraint crudo sí impone la misma igualdad, pero no es la única forma que queda: address = escrow.maker es el reemplazo idiomático, y los structs de V2 escriben el accessor .address() en vez del .key() de V1."  # @src=630f3cf58969
              c:
                # | address = escrow.maker, the direct replacement for has_one.
                label: "address = escrow.maker, el reemplazo directo de has_one."  # @src=8a104c4e1d6c
                # | It takes an arbitrary expression and can therefore say plainly what it
                # | does. The compiler underlines every site.
                feedback: "Toma una expresión arbitraria y por eso puede decir sin rodeos lo que hace. El compilador subraya cada sitio."  # @src=ae5a2714d1b0
              a:
                # | Keep has_one = maker; V2 left that constraint unchanged.
                label: "Conserva has_one = maker; V2 dejó ese constraint sin cambios."  # @src=06df43cc758b
                # | has_one still parses in V2, which is what makes this tempting, but the
                # | compiler underlines it as deprecated and points you at address =
                # | escrow.maker.
                feedback: "has_one todavía parsea en V2, que es lo que hace que esto sea tentador, pero el compilador lo subraya como obsoleto y te apunta a address = escrow.maker."  # @src=973773f551aa
              e:
                # | maker: Signer alone - a signature proves the maker's identity
                label: "maker: Signer a secas - una firma demuestra la identidad del maker"  # @src=414cc2e16add
                # | A signature does prove some key signed, which is why this feels like
                # | enough on a two-party instruction. It says nothing about whether that
                # | key is the one this escrow recorded, and closing that gap is the whole
                # | job address = escrow.maker does.
                feedback: "Una firma sí demuestra que alguna clave firmó, que es por lo que esto se siente suficiente en una instrucción de dos partes. No dice nada sobre si esa clave es la que este escrow registró, y cerrar ese hueco es todo el trabajo que hace address = escrow.maker."  # @src=a652324346b5
          m04-l3-q3:
            # | Where does the escrow check the win condition relative to the payout CPI?
            prompt: "¿Dónde verifica el escrow la condición de victoria en relación con la CPI del pago?"  # @src=7f0746385d6e
            # | A conditional release is only as safe as its ordering: the guard has to run
            # | and pass before a single lamport moves. Checking after the payout, or
            # | trusting that atomicity alone protects you, invites exactly the class of
            # | exploit escrows exist to prevent. Concretely, never pay first and check
            # | after: in redeem the require! lines come first and the
            # | quarter_vault::cpi::withdraw call comes last, so nothing moves until the
            # | caller constraint and the score check have both passed.
            explanation: "Una liberación condicional es apenas tan segura como su orden: la guarda tiene que correr y pasar antes de que se mueva un solo lamport. Verificar después del pago, o confiar en que la atomicidad sola te protege, invita exactamente a la clase de exploit que los escrows existen para prevenir. Concretamente, nunca pagues primero y verifiques después: en redeem las líneas require! van primero y la llamada quarter_vault::cpi::withdraw va al final, así que nada se mueve hasta que el constraint de quien llama y la verificación del puntaje hayan pasado los dos."  # @src=adc375fecf38
            options:                 # source order — keep it
              a:
                # | Before the CPI: the require! gate must pass before the withdraw runs.
                label: "Antes de la CPI: la barrera del require! tiene que pasar antes de que corra el withdraw."  # @src=aef45cc433a3
                # | Position is part of the audit trail: a reader should see the condition
                # | standing in front of the payout, not have to reason backwards about what
                # | a later revert would undo.
                feedback: "La posición es parte del rastro de auditoría: un lector debería ver la condición parada delante del pago, y no tener que razonar hacia atrás sobre qué desharía un revert posterior."  # @src=2e2998282946
              c:
                # | It does not matter: the transaction is atomic, so a failed check reverts
                # | the CPI.
                label: "No importa: la transacción es atómica, así que una verificación que falla revierte la CPI."  # @src=45f9a49e09ee
                # | Atomicity is real but it is not the guarantee you want to lean on. Order
                # | is also documentation: an auditor reading redeem should see the
                # | condition gate the payout by position, not have to prove some later
                # | revert saves you.
                feedback: "La atomicidad es real pero no es la garantía en la que quieres apoyarte. El orden también es documentación: un auditor que lee redeem debería ver la condición haciendo de barrera para el pago por posición, y no tener que demostrar que algún revert posterior te salva."  # @src=77de5558f774
              d:
                # | Inside the vault's withdraw handler, since that is where lamports move
                label: "Dentro del handler de withdraw del vault, ya que es ahí donde se mueven los lamports"  # @src=2a9815c1814d
                # | Putting the guard next to the movement is a tidy instinct, and the vault
                # | does guard what it can see. A win condition is the escrow's own business
                # | rule and is invisible to the vault, which validates its seeds and its
                # | balances; the caller keeps the one check only it can make.
                feedback: "Poner la guarda al lado del movimiento es un instinto ordenado, y el vault sí protege lo que puede ver. Una condición de victoria es la regla de negocio propia del escrow y es invisible para el vault, que valida sus seeds y sus balances; quien llama se queda con la única verificación que solo él puede hacer."  # @src=56e88525e6db
              b:
                # | After the CPI: withdraw first, then refund if the score fell short.
                label: "Después de la CPI: withdraw primero, y después reembolsa si el puntaje no alcanzó."  # @src=bb5da0a4b5ca
                # | Atomicity does revert the transfer when a later require! fails — nothing
                # | can partially commit inside a failed Solana transaction. What makes this
                # | wrong is fragility, not leakage: pay-then-check is only safe while the
                # | check stays fatal and stays in this instruction, and one refactor that
                # | softens the require! pays out on a false condition. Guard-first has
                # | nothing to maintain.
                feedback: "La atomicidad sí revierte la transferencia cuando un require! posterior falla — nada puede comprometerse parcialmente dentro de una transacción de Solana que falló. Lo que hace que esto esté mal es la fragilidad, no la fuga: pagar-y-después-verificar es seguro solo mientras la verificación siga siendo fatal y siga en esta instrucción, y un solo refactor que ablande el require! paga con una condición falsa. La guarda primero no tiene nada que mantener."  # @src=7bbafb166790
  m05-l1:
    # | token_interface & transfer_checked: upgrade the vault and escrow to SPL
    title: "token_interface y transfer_checked: actualiza el vault y el escrow a SPL"  # @src=051ec60c01b5
    blocks:
      check:                      # quiz
        questions:
          m05-l1-q1:
            # | You upgraded the quarter-vault from lamport custody to SPL and the withdraw
            # | test now fails to compile, pointing at your transfer CPI. What is the most
            # | likely cause in Anchor V2?
            prompt: "Actualizaste el quarter-vault de custodia en lamports a SPL y ahora la prueba de withdraw no compila, apuntando a tu CPI de transfer. ¿Cuál es la causa más probable en Anchor V2?"  # @src=7cab0faa400b
            # | The whole point of the upgrade lab is that the PDA/CPI skeleton is
            # | untouched: seeds, bump, and address auth stay. What changes is the custody
            # | layer: the system-program lamport transfer becomes a PDA-signed
            # | transfer_checked, which in V2 carries the mint account and decimals.
            # | Forgetting those is the classic first compile error.
            explanation: "Todo el punto del lab del upgrade es que el esqueleto de PDA/CPI queda sin tocar: los seeds, el bump y la auth de address se quedan. Lo que cambia es la capa de custodia: la transferencia de lamports del system-program se vuelve un transfer_checked firmado por el PDA, que en V2 lleva la cuenta del mint y los decimals. Olvidarlos es el clásico primer error de compilación."  # @src=1d5b802f3b20
            options:                 # source order — keep it
              d:
                # | Your mint is an InterfaceAccount<Mint> where the CPI wants a plain
                # | Account<Mint> for its decimals.
                label: "Tu mint es un InterfaceAccount<Mint> donde la CPI quiere un Account<Mint> simple para sus decimals."  # @src=ba7a87a933e9
                # | In V2 those two are the same type: InterfaceAccount<T> is literally an
                # | alias of Account<T>, so no wrapper swap could ever be the type error you
                # | are staring at. What decides program compatibility is the module T was
                # | imported from, and neither wrapper changes the arity of the call.
                feedback: "En V2 esos dos son el mismo tipo: InterfaceAccount<T> es literalmente un alias de Account<T>, así que ningún cambio de wrapper podría ser jamás el error de tipos que estás mirando. Lo que decide la compatibilidad de programas es el módulo del que se importó T, y ninguno de los dos wrappers cambia la aridad de la llamada."  # @src=57a6a6f996b8
              b:
                # | You called a bare transfer; V2's token seat expects transfer_checked,
                # | which needs the mint and its decimals.
                label: "Llamaste a un transfer pelado; el asiento de tokens de V2 espera transfer_checked, que necesita el mint y sus decimals."  # @src=8878c8e85e57
                # | Identity survives the upgrade intact: seeds, stored bump, authority
                # | constraint, all of it. Only the vehicle changes, and the checked variant
                # | wants two arguments the bare one never did.
                feedback: "La identidad sobrevive al upgrade intacta: seeds, bump guardado, constraint de autoridad, todo. Solo cambia el vehículo, y la variante checked quiere dos argumentos que la pelada nunca quiso."  # @src=8beeb88622ae
              c:
                # | You kept the [b"vault", authority] seeds, and a token account's
                # | authority PDA now derives under the token program's id.
                label: "Te quedaste con los seeds [b\"vault\", authority], y el PDA de autoridad de una cuenta de token ahora deriva bajo el id del token program."  # @src=392cf20cb9e2
                # | Tempting because seeds::program does exist for PDAs another program
                # | owns, but the vault's authority PDA still belongs to your program, so it
                # | derives under your id with the same seeds and stored bump. Custody
                # | changes; identity doesn't.
                feedback: "Tentador porque seeds::program sí existe para PDAs de las que otro programa es dueño, pero el PDA de autoridad del vault sigue siendo de tu programa, así que deriva bajo tu id con los mismos seeds y el mismo bump guardado. La custodia cambia; la identidad no."  # @src=8fa0fb335bde
              a:
                # | You signed with the vault PDA's seeds, and a token program honors
                # | keypair signatures, so custody needs an approve-and-delegate step.
                label: "Firmaste con los seeds del PDA del vault, y un token program honra firmas de keypair, así que la custodia necesita un paso de approve-and-delegate."  # @src=bc5664824c21
                # | PDA-signed token transfers are exactly how program-owned vaults move
                # | funds. .with_signer over the stored bump grants the PDA signer privilege
                # | for a token CPI the same way it did for the System Program transfer, and
                # | no approve/delegate step is involved.
                feedback: "Las transferencias de token firmadas por PDA son exactamente cómo los vaults que pertenecen a un programa mueven fondos. .with_signer sobre el bump guardado le otorga al PDA el privilegio de signer para una CPI de token igual que lo hacía para la transferencia del System Program, y no hay ningún paso de approve/delegate involucrado."  # @src=4deb75d21b8e
          m05-l1-q2:
            # | Why does the upgrade use InterfaceAccount<T> for the vault's token account
            # | instead of Account<TokenAccount>?
            prompt: "¿Por qué el upgrade usa InterfaceAccount<T> para la cuenta de token del vault en vez de Account<TokenAccount>?"  # @src=ea835eaa25d1
            # | token_interface exists so a single program works against both the SPL Token
            # | program and the Token-2022 program. InterfaceAccount<T>, an alias of
            # | Account<T>, is what lets the same account type validate either. Hardcoding
            # | Account<TokenAccount> to one program is the trap m05-l3 teaches you to
            # | diagnose from a live Token-2022 mint, the read that shows where a hardwired
            # | wrapper would refuse it. The payoff of the one code path is that your
            # | program is never hardcoded to a single token program: the same instruction
            # | takes a classic mint today and a Token-2022 mint tomorrow. And you pay
            # | nothing for the capability, because Account<T> is already the zero-copy fast
            # | path in V2, so the compatible path and the fast path are now the same path.
            # | Note the real mechanism is which module T came from, not the wrapper: the
            # | token_interface types accept either program, the plain token types pin the
            # | classic one.
            explanation: "token_interface existe para que un solo programa funcione contra el SPL Token program y el Token-2022 program a la vez. InterfaceAccount<T>, un alias de Account<T>, es lo que deja que el mismo tipo de cuenta valide cualquiera de los dos. Dejar Account<TokenAccount> hardcoded a un solo programa es la trampa que m05-l3 te enseña a diagnosticar desde un mint Token-2022 en vivo, la lectura que muestra dónde un wrapper cableado en duro lo rechazaría. La recompensa del camino de código único es que tu programa nunca queda hardcoded a un solo token program: la misma instrucción toma un mint clásico hoy y un mint Token-2022 mañana. Y no pagas nada por la capacidad, porque Account<T> ya es el camino rápido zero-copy en V2, así que el camino compatible y el camino rápido ahora son el mismo camino. Fíjate que el mecanismo de verdad es de qué módulo vino T, no el wrapper: los tipos de token_interface aceptan cualquiera de los dos programas, los tipos de token simples fijan el clásico."  # @src=dc6cfbfdf6e0
            options:                 # source order — keep it
              b:
                # | Account<TokenAccount> was removed in V2; InterfaceAccount<T> replaced
                # | it.
                label: "Account<TokenAccount> se quitó en V2; InterfaceAccount<T> lo reemplazó."  # @src=d67c7b3f57c0
                # | InterfaceAccount<T> is an alias of Account<T>, not a replacement for it;
                # | Account<T> is very much alive, and Account<TokenAccount> with a
                # | token_interface import behaves identically. The reason is program
                # | compatibility, not removal.
                feedback: "InterfaceAccount<T> es un alias de Account<T>, no un reemplazo suyo; Account<T> está bien vivo, y Account<TokenAccount> con un import de token_interface se comporta idéntico. La razón es la compatibilidad de programas, no una remoción."  # @src=5d84058a4823
              d:
                # | The wrapper is what makes ATA derivation program-aware, so a Token-2022
                # | ATA resolves correctly.
                label: "El wrapper es lo que hace que la derivación de la ATA sea consciente del programa, así que una ATA de Token-2022 resuelve bien."  # @src=a5f358985858
                # | The account wrapper has no say in where an ATA sits. What makes that
                # | derivation program-aware is the associated_token::token_program =
                # | token_program line reading an Interface-typed program account, so the
                # | address is computed against whichever token program actually owns the
                # | mint. Hardcode the classic program there and the derivation goes wrong
                # | no matter which wrapper the token account carries.
                feedback: "El wrapper de cuenta no tiene voz ni voto en dónde queda una ATA. Lo que hace consciente del programa a esa derivación es la línea associated_token::token_program = token_program leyendo una cuenta de programa tipada como Interface, así que la dirección se computa contra el token program que de verdad es dueño del mint. Deja hardcoded el programa clásico ahí y la derivación sale mal, no importa qué wrapper lleve la cuenta de token."  # @src=775c4e07e4e2
              a:
                # | InterfaceAccount<T> skips the owner check on load, so it costs fewer
                # | CUs.
                label: "InterfaceAccount<T> se saltea la verificación de dueño en la carga, así que cuesta menos CU."  # @src=4fd83d5ff391
                # | Owner and discriminator checks still run inside load either way. The V2
                # | speedup came from making Account<T> itself zero-copy, and
                # | InterfaceAccount<T> is an alias of it, so there is no CU difference to
                # | buy.
                feedback: "Las verificaciones de dueño y discriminador corren dentro de la carga de cualquier modo. La aceleración de V2 vino de hacer zero-copy a Account<T> mismo, y InterfaceAccount<T> es un alias suyo, así que no hay diferencia de CU que comprar."  # @src=0c0e320a829c
              c:
                # | InterfaceAccount<T> serves classic SPL Token and Token-2022 from one
                # | code path.
                label: "InterfaceAccount<T> sirve al SPL Token clásico y a Token-2022 desde un solo camino de código."  # @src=2a7767adebc7
                # | What admits both programs is the module the type was imported from, not
                # | the wrapper's name: the non-interface types stay hardwired to the
                # | classic program. The capability is free, since that wrapper is already
                # | the fast path.
                feedback: "Lo que admite los dos programas es el módulo del que se importó el tipo, no el nombre del wrapper: los tipos que no son de interface quedan cableados en duro al programa clásico. La capacidad es gratis, porque ese wrapper ya es el camino rápido."  # @src=e1d11b5d8ab0
          m05-l1-q3:
            # | You want a custom error when the escrow's authority account has the wrong
            # | owner, so you write address = maker @ EscrowErr::BadAuthority on an
            # | Account<T>. It returns a generic IllegalOwner instead of your error. Why?
            prompt: "Quieres un error propio cuando la cuenta de autoridad del escrow tiene el dueño equivocado, así que escribes address = maker @ EscrowErr::BadAuthority sobre un Account<T>. Devuelve un IllegalOwner genérico en vez de tu error. ¿Por qué?"  # @src=d49a15e86fe7
            # | Because those checks sit inside load, the generic owner error fires first
            # | and your custom message never gets a chance to surface. On Account<T>, load
            # | runs the owner and discriminator checks before any constraint hook, so an
            # | owner mismatch surfaces as ProgramError::IllegalOwner and your custom
            # | message never appears. When you need a custom owner error, drop to
            # | UncheckedAccount and assert owner explicitly, a footgun worth flagging
            # | inline while wiring escrow auth.
            explanation: "Porque esas verificaciones viven dentro de la carga, el error de dueño genérico se dispara primero y tu mensaje propio nunca tiene chance de aparecer. Sobre Account<T>, la carga corre las verificaciones de dueño y discriminador antes de cualquier constraint hook, así que un dueño que no calza aparece como ProgramError::IllegalOwner y tu mensaje propio nunca sale. Cuando necesitas un error de dueño propio, bajas a UncheckedAccount y afirmas el dueño de forma explícita, una trampa que vale la pena señalar en línea mientras cableas la auth del escrow."  # @src=6d62dc89cdd6
            options:                 # source order — keep it
              c:
                # | has_one replaced address in V2, so the constraint never compiled into
                # | the accounts struct.
                label: "has_one reemplazó a address en V2, así que el constraint nunca se compiló dentro del struct de cuentas."  # @src=d4570a099890
                # | It's the reverse: has_one is the deprecated spelling and address =
                # | parent.field is its V2 replacement. The constraint compiled and executed
                # | fine; a load-time owner check simply preceded it.
                feedback: "Es al revés: has_one es la forma deprecada de escribirlo y address = parent.field es su reemplazo en V2. El constraint compiló y se ejecutó bien; simplemente una verificación de dueño en tiempo de carga le pasó adelante."  # @src=e92932c39b88
              b:
                # | address = compares keys and has no @ error slot, so V2 substitutes its
                # | own built-in error.
                label: "address = compara claves y no tiene un espacio de error con @, así que V2 sustituye con su propio error incorporado."  # @src=27c1eda36ea5
                # | address = maker @ EscrowErr::BadAuthority compiles and does raise your
                # | error on a key mismatch, so the @ slot is real. The issue is ordering:
                # | the load-time owner check fires before the address comparison ever runs.
                feedback: "address = maker @ EscrowErr::BadAuthority compila y sí levanta tu error cuando la clave no calza, así que el espacio del @ es real. El problema es el orden: la verificación de dueño en tiempo de carga se dispara antes de que la comparación de address llegue a correr."  # @src=06a5831a8f45
              a:
                # | Owner and discriminator checks run inside load, ahead of any constraint
                # | hook.
                label: "Las verificaciones de dueño y discriminador corren dentro de la carga, antes de cualquier constraint hook."  # @src=4914656f7134
                # | Loading is not a hook; it happens first, and the account is refused
                # | before your annotation gets a look in. The way out is an untyped account
                # | and an ownership assertion you write.
                feedback: "La carga no es un hook; pasa primero, y la cuenta se rechaza antes de que tu anotación alcance a opinar. La salida es una cuenta sin tipo y una aserción de propiedad que escribes tú."  # @src=e87033526c57
              d:
                # | Your address constraint ran ahead of load, so the generic owner error
                # | came from a later step.
                label: "Tu constraint address corrió antes de la carga, así que el error de dueño genérico vino de un paso posterior."  # @src=61d002b5dd9e
                # | That is the ordering inverted. Load is not a hook and it does not queue
                # | behind one: reading the bytes, checking the owner, and checking the
                # | discriminator all happen first, and the account is refused there.
                # | Nothing you attach to the field runs until load has handed the typed
                # | account over.
                feedback: "Ese es el orden invertido. La carga no es un hook y no se pone en fila detrás de uno: leer los bytes, verificar el dueño y verificar el discriminador pasan todos primero, y la cuenta se rechaza ahí. Nada de lo que le pegues al campo corre hasta que la carga haya entregado la cuenta tipada."  # @src=cf076c05fc1e
  m05-l2:
    # | Build the token-ticket swap
    title: "Construye el swap de token-a-ticket"  # @src=03bea5a0290e
    blocks:
      cp-swap-out:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | amount_in_with_fee = amount_in * 997
          0: "amount_in_with_fee = amount_in * 997"  # @src=3ae74d2b7ef6
          # | out = (amount_in_with_fee * reserve_out) / (reserve_in * 1000 +
          # | amount_in_with_fee)
          1: "out = (amount_in_with_fee * reserve_out) / (reserve_in * 1000 + amount_in_with_fee)"  # @src=d51bf5de6b73
          # | promote to u128 before multiplying so u64 reserves can't overflow
          2: "promueve a u128 antes de multiplicar para que las reservas u64 no puedan hacer overflow"  # @src=f18d813804de
          # | u128 is headroom, not immunity: (u64::MAX)^2 fits u128 with under a bit to
          # | spare, and the x997 fee multiplier spends it — so keep the multiplies checked
          # | and degrade to 0
          3: "u128 es holgura, no inmunidad: (u64::MAX)^2 entra en u128 con menos de un bit de sobra, y el multiplicador de comisión x997 se lo gasta — así que mantén las multiplicaciones checked y degrada a 0"  # @src=d70e07c8ef33
        tests:                      # keyed by test case id
          t1:
            # | 0.3% fee plus the reserve shift on a shallow pool (naive ratio would say
            # | 100)
            description: "comisión de 0.3% más el corrimiento de la reserva en un pool poco profundo (la razón ingenua diría 100)"  # @src=e16d6c295f6c
          t2:
            # | deep pool, low slippage
            description: "pool profundo, slippage bajo"  # @src=2d07ede0eb41
          t3:
            # | asymmetric reserves
            description: "reservas asimétricas"  # @src=5a5fa8cdf56c
          t4:
            # | zero input yields zero output
            description: "una entrada en cero da una salida en cero"  # @src=0fda446db8b3
          t5:
            # | the lesson's worked example: 10k into a balanced 1M/1M pool at 0.3%
            description: "el ejemplo trabajado de la lección: 10k hacia un pool balanceado de 1M/1M al 0.3%"  # @src=6cf85d6cd1bc
          t6:
            # | empty reserve_in: without the guard the denominator collapses to
            # | amount_in_with_fee and the quote hands back the whole of reserve_out
            description: "reserve_in vacía: sin la guarda el denominador colapsa a amount_in_with_fee y la cotización devuelve todo el reserve_out"  # @src=13b5bc3dae05
          t7:
            # | u64::MAX everywhere: the numerator runs past u128, so the CHECKED multiply
            # | must degrade to 0 — a bare u128 `*` panics here
            description: "u64::MAX en todos lados: el numerador se pasa de u128, así que la multiplicación CHECKED tiene que degradar a 0 — un `*` de u128 pelado entra en panic acá"  # @src=0ffb3615fb65
          t8:
            # | 1e18 reserves, 1e12 in: comfortably inside u128 but far past a u64 multiply,
            # | so this is the case that forces the promotion
            description: "reservas de 1e18, 1e12 de entrada: cómodamente dentro de u128 pero muy pasado de una multiplicación u64, así que este es el caso que fuerza la promoción"  # @src=546b2b3b15ad
      check:                      # quiz
        questions:
          m05-l2-q1:
            # | Your swap quote multiplies amount_in_with_fee * reserve_out on its way to a
            # | fill, and it panics on a large trade against a deep pool. Every operand is
            # | u64. What's the fix?
            prompt: "Tu cotización de swap multiplica amount_in_with_fee * reserve_out camino a un fill, y entra en panic en un canje grande contra un pool profundo. Todos los operandos son u64. ¿Cuál es el arreglo?"  # @src=caa6640e3ff7
            # | Two u64 amounts multiplied can exceed u64. The house pattern (and rust.md)
            # | is a u128 intermediate plus checked_mul: promote, multiply, divide back down
            # | to u64. That's exactly what the swap_out coding challenge exercises. The
            # | final cast back to u64 is safe because the output can never exceed
            # | reserve_out, which is already a u64.
            explanation: "Dos cantidades u64 multiplicadas pueden exceder u64. El patrón de la casa (y rust.md) es un intermedio u128 más checked_mul: promueve, multiplica, divide de vuelta hacia abajo a u64. Eso es exactamente lo que ejercita el challenge de código de swap_out. El cast final de vuelta a u64 es seguro porque la salida nunca puede exceder reserve_out, que ya es un u64."  # @src=04a89d89357e
            options:                 # source order — keep it
              d:
                # | Promote both operands to u128 and multiply there, where the product has
                # | room and needs no check.
                label: "Promueve los dos operandos a u128 y multiplica ahí, donde el producto tiene lugar y no necesita ninguna verificación."  # @src=734162481424
                # | Promoting is necessary and it is still not sufficient. Two u64 factors
                # | fit u128 with under a bit to spare, and the x997 fee multiplier is a
                # | third factor that spends that sliver: a bare u128 multiply passes every
                # | reference row and dies on the u64::MAX one. Keep the multiply checked
                # | and degrade to a 0 quote.
                feedback: "Promover es necesario y aun así no es suficiente. Dos factores u64 entran en u128 con menos de un bit de sobra, y el multiplicador de comisión x997 es un tercer factor que se gasta esa astilla: una multiplicación u128 pelada pasa todas las filas de referencia y muere en la de u64::MAX. Mantén la multiplicación checked y degrada a una cotización de 0."  # @src=1c619e0c953c
              b:
                # | Cast to u128 before multiplying, use checked_mul, then divide back down.
                label: "Haz cast a u128 antes de multiplicar, usa checked_mul, y después divide de vuelta hacia abajo."  # @src=293c1ff450d4
                # | Widen the intermediate, not the stored fields, and keep it checked,
                # | because three factors is one more than u128 can absorb. Narrowing back
                # | down is safe: the output cannot exceed a value that already fit.
                feedback: "Ensancha el intermedio, no los campos guardados, y mantenlo checked, porque tres factores es uno más de lo que u128 puede absorber. Angostar de vuelta hacia abajo es seguro: la salida no puede exceder un valor que ya entraba."  # @src=81da2ac45852
              c:
                # | Switch reserve_in and reserve_out to i64 so an overflow wraps to a
                # | negative value you can test for.
                label: "Cambia reserve_in y reserve_out a i64 para que un overflow haga wrap a un valor negativo que puedas verificar."  # @src=7a58a393df7b
                # | Rust panics on overflow in debug and wraps in release, so there is no
                # | reliable negative to test for, and SPL token amounts are unsigned u64
                # | anyway. A u128 intermediate with checked_mul is the pattern the lesson
                # | freezes into swap_out.
                feedback: "Rust entra en panic en overflow en debug y hace wrap en release, así que no hay ningún negativo confiable que verificar, y las cantidades de token SPL son u64 sin signo de todos modos. Un intermedio u128 con checked_mul es el patrón que la lección congela dentro de swap_out."  # @src=df899c9a5f4f
              a:
                # | Cap each reserve at u32::MAX at init so the product of two reserves fits
                # | inside a u64.
                label: "Ponle tope a cada reserva en u32::MAX en el init para que el producto de dos reservas entre dentro de un u64."  # @src=8a8d2326a23a
                # | It guards the wrong product. Two reserves capped at u32::MAX multiply to
                # | 18,446,744,065,119,617,025, which does fit in a u64, so reserve_in *
                # | reserve_out was never the exposure. The multiply that panicked is
                # | amount_in_with_fee * reserve_out, and amount_in is the caller's and
                # | uncapped, so capping the reserves does nothing for it while buying you a
                # | pool-depth ceiling of about 4.3 billion base units. The defect is the
                # | width of the multiply, not the size of the reserves.
                feedback: "Resguarda el producto equivocado. Dos reservas con tope en u32::MAX multiplican a 18,446,744,065,119,617,025, que sí entra en un u64, así que reserve_in * reserve_out nunca fue la exposición. La multiplicación que entró en panic es amount_in_with_fee * reserve_out, y amount_in es del llamador y no tiene tope, así que ponerles tope a las reservas no hace nada por eso mientras te compra un techo de unas 4.3 mil millones de unidades base en profundidad de pool. El defecto es el ancho de la multiplicación, no el tamaño de las reservas."  # @src=1a98ef2684c1
          m05-l2-q2:
            # | A trader sees a quote of 906 tickets, but between quote and execution the
            # | reserves shift and they'd only get 880. Your program still fills the trade.
            # | What did you forget?
            prompt: "Un trader ve una cotización de 906 tickets, pero entre la cotización y la ejecución las reservas se mueven y solo sacaría 880. Tu programa igual llena el canje. ¿Qué te olvidaste?"  # @src=4caebf28a58a
            # | Without a min_out the trader accepts any fill, including one degraded by
            # | ordering (a sandwich). The slippage guard reverts when computed output <
            # | min_out; its shape reuses the escrow's conditional-release logic. It's the
            # | one piece of trader protection this teaching swap offers. Run it after the
            # | quote and before either CPI, not because a late check would let a bad fill
            # | stand (a failed require! reverts the transfers; atomicity holds), but
            # | because early is cheaper and reads as the protection it is.
            explanation: "Sin un min_out el trader acepta cualquier fill, incluido uno degradado por ordenamiento (un sandwich). La guarda de slippage revierte cuando la salida computada < min_out; su forma reutiliza la lógica de release condicional del escrow. Es la única pieza de protección del trader que ofrece este swap de enseñanza. Córrela después de la cotización y antes de cualquiera de las dos CPIs, no porque una verificación tardía dejaría en pie un fill malo (un require! que falla revierte las transferencias; la atomicidad se sostiene), sino porque temprano es más barato y se lee como la protección que es."  # @src=e0d07b6bff71
            options:                 # source order — keep it
              e:
                # | You read the reserves after the pull CPI, so the output came from stale
                # | balances.
                label: "Leíste las reservas después de la CPI de pull, así que la salida salió de balances obsoletos."  # @src=af550419f5cf
                # | The handler already reads both reserves up front, and it has to: a typed
                # | read while a cpi_handle_mut() is live does not compile. Read them after
                # | the transfer instead and the quote would be fresher, not staler. The
                # | reserves in this scenario moved before the transaction landed at all, so
                # | no read ordering inside the handler could have seen it coming.
                feedback: "El handler ya lee las dos reservas por adelantado, y tiene que hacerlo: una lectura tipada mientras un cpi_handle_mut() está vivo no compila. Léelas en cambio después de la transferencia y la cotización sería más fresca, no más obsoleta. Las reservas en este escenario se movieron antes de que la transacción llegara a aterrizar siquiera, así que ningún ordenamiento de lecturas dentro del handler podría haberlo visto venir."  # @src=288dfc4ed756
              a:
                # | A .reload() on both reserves after the input transfer.
                label: "Un .reload() sobre las dos reservas después de la transferencia de entrada."  # @src=a4b0a1595dd7
                # | This is 0.x muscle memory, and it fixes nothing here: the reserves moved
                # | before the transaction landed, so a fresh read still returns the
                # | degraded 880. V2 also holds a borrow through the live CpiHandle, so that
                # | typed read would not compile mid-CPI.
                feedback: "Esto es memoria muscular de 0.x, y acá no arregla nada: las reservas se movieron antes de que la transacción aterrizara, así que una lectura fresca igual devuelve los 880 degradados. V2 además sostiene un borrow a través del CpiHandle vivo, así que esa lectura tipada no compilaría a mitad de CPI."  # @src=327677fc51c6
              b:
                # | Marking both reserve accounts unsafe(dup) so the fill is not rejected.
                label: "Marcar las dos cuentas de reserva como unsafe(dup) para que el fill no sea rechazado."  # @src=dde1addec167
                # | unsafe(dup) is the escape hatch for genuinely duplicated mutable
                # | accounts. reserve_arcade and reserve_ticket are distinct accounts
                # | holding different mints, so the default is already satisfied, and
                # | account aliasing has nothing to do with the price a trader receives.
                feedback: "unsafe(dup) es la salida de emergencia para cuentas mutables genuinamente duplicadas. reserve_arcade y reserve_ticket son cuentas distintas que sostienen mints distintos, así que el default ya se satisface, y el aliasing de cuentas no tiene nada que ver con el precio que recibe un trader."  # @src=14458e92fa36
              c:
                # | The slippage guard: revert when output comes in below the trader's
                # | min_out.
                label: "La guarda de slippage: revertir cuando la salida entra por debajo del min_out del trader."  # @src=11c9f8927f84
                # | The guard belongs between the quote and the first transfer, though be
                # | precise about why: a failed require! after the CPIs still reverts both
                # | transfers, so a bad fill never settles regardless of position. Checking
                # | early spends zero CPI compute on a doomed fill and keeps the trader's
                # | one protection standing legibly in front of the money. It is also the
                # | only trader protection this swap offers.
                feedback: "La guarda va entre la cotización y la primera transferencia, aunque sé preciso sobre por qué: un require! que falla después de las CPIs igual revierte las dos transferencias, así que un fill malo nunca se liquida, sin importar la posición. Verificar temprano gasta cero cómputo de CPI en un fill condenado y deja la única protección del trader parada de forma legible delante del dinero. Es además la única protección para el trader que ofrece este swap."  # @src=ee3148ebc289
              d:
                # | Integer division rounds the output the trader's way, so the fill came up
                # | short.
                label: "La división entera redondea la salida a favor del trader, así que el fill quedó corto."  # @src=d0da419db205
                # | Rounding runs the other direction and at the wrong scale. Truncation
                # | drops the remainder in the pool's favor, never the trader's, and what it
                # | costs is dust rather than the 26 tickets in the scenario. That gap
                # | opened between the quote and the landing, which is a timing problem no
                # | rounding rule touches.
                feedback: "El redondeo corre en la otra dirección y a la escala equivocada. El truncamiento tira el resto a favor del pool, nunca del trader, y lo que cuesta es polvo y no los 26 tickets del escenario. Esa brecha se abrió entre la cotización y el aterrizaje, que es un problema de timing que ninguna regla de redondeo toca."  # @src=34b4f7382899
          m05-l2-q3:
            # | You route both swap directions through the same InterfaceAccount and the
            # | program rejects the instruction as a duplicate mutable account. What's the
            # | clean fix?
            prompt: "Ruteas las dos direcciones del swap a través del mismo InterfaceAccount y el programa rechaza la instrucción como cuenta mutable duplicada. ¿Cuál es el arreglo limpio?"  # @src=93299b182015
            # | A constant-product pool needs two separate reserves, so each side is its own
            # | token account, reserve_arcade and reserve_ticket, holding different mints,
            # | both with token::authority = pool, and the duplicate-mutable default is
            # | satisfied naturally. unsafe(dup) is only for deliberately duplicated
            # | accounts; reaching for it here would paper over a design error. Note the
            # | reserves are not R2 vault instances: a vault's ATA is owned by the vault
            # | PDA, while a reserve's authority must be the pool PDA.
            explanation: "Un pool de producto constante necesita dos reservas separadas, así que cada lado es su propia cuenta de token, reserve_arcade y reserve_ticket, que sostienen mints distintos, las dos con token::authority = pool, y el default de duplicate-mutable se satisface con naturalidad. unsafe(dup) es solo para cuentas duplicadas a propósito; recurrir a él acá taparía un error de diseño. Nota que las reservas no son instancias de vault de R2: la ATA de un vault es propiedad del PDA del vault, mientras que la autoridad de una reserva tiene que ser el PDA del pool."  # @src=5d4700064ed6
            options:                 # source order — keep it
              c:
                # | Turn off the duplicate-mutable default with an anchor-lang Cargo
                # | feature, keeping one shared reserve.
                label: "Apagar el default de duplicate-mutable con un feature de Cargo de anchor-lang, y quedarte con una reserva compartida."  # @src=9320fe4f89eb
                # | There is no anchor-lang feature that disables the duplicate-mutable
                # | default; V2 made it the default precisely to catch this class of
                # | aliasing bug at validation time, before your handler ever runs. Fix the
                # | account layout instead.
                feedback: "No existe ningún feature de anchor-lang que desactive el default de duplicate-mutable; V2 lo hizo el default precisamente para atrapar esta clase de bug de aliasing en tiempo de validación, antes de que tu handler llegue a correr. Arregla en cambio el layout de cuentas."  # @src=77d5f80c4bc7
              d:
                # | Make one of the pool's two slots immutable so one reserve token account
                # | satisfies it.
                label: "Hacer inmutable uno de los dos espacios del pool para que una sola cuenta de token de reserva lo satisfaga."  # @src=e5b772d2b11d
                # | That silences the checker rather than fixing the layout, and it breaks
                # | the trade: a constant-product swap debits one side and credits the
                # | other, so both reserves have to be writable. The check is not
                # | complaining that two slots are mut, it is complaining that one account
                # | arrived in both.
                feedback: "Eso calla la verificación en vez de arreglar el layout, y rompe el canje: un swap de producto constante debita un lado y acredita el otro, así que las dos reservas tienen que ser escribibles. La verificación no se está quejando de que dos espacios sean mut, se está quejando de que una sola cuenta llegó en los dos."  # @src=ec2ca8a2a895
              b:
                # | Add unsafe(dup) to the shared reserve field so V2 accepts one account
                # | serving both directions.
                label: "Agregar unsafe(dup) al campo de reserva compartido para que V2 acepte una sola cuenta sirviendo las dos direcciones."  # @src=911d2754e827
                # | unsafe(dup) is an escape hatch for when duplication is genuinely
                # | intended. Collapsing both reserves into one account aliases the two
                # | sides of the curve and corrupts the k accounting: that's a design bug,
                # | not a case for opting out of the check.
                feedback: "unsafe(dup) es una salida de emergencia para cuando la duplicación es genuinamente intencional. Colapsar las dos reservas en una sola cuenta les da alias a los dos lados de la curva y corrompe la contabilidad de k: eso es un bug de diseño, no un caso para hacer opt-out de la verificación."  # @src=72b954a78403
              a:
                # | Give each side of the pool its own distinct reserve token account so no
                # | real duplication exists.
                label: "Darle a cada lado del pool su propia cuenta de token de reserva distinta para que no exista ninguna duplicación real."  # @src=d51cbbd3c894
                # | One account per side, different mints, both under the pool's authority:
                # | the default is satisfied by the layout itself, with no opt-out anywhere.
                # | Not vault instances, though, because the authority differs.
                feedback: "Una cuenta por lado, mints distintos, las dos bajo la autoridad del pool: el default lo satisface el layout mismo, sin ningún opt-out en ningún lado. Aunque no son instancias de vault, porque la autoridad difiere."  # @src=3dd9e98512cb
          m05-l2-q4:
            # | Between the input transfer_checked CPI and reading the pool's new balance,
            # | you try to keep a typed reference to the vault account. V2 refuses to
            # | compile. Why is that a feature?
            prompt: "Entre la CPI de transfer_checked de entrada y leer el balance nuevo del pool, intentas quedarte con una referencia tipada a la cuenta del vault. V2 se niega a compilar. ¿Por qué eso es un feature?"  # @src=c856514d252f
            # | In v1, forgetting .reload() after a CPI meant acting on stale deserialized
            # | data. V2's CpiHandle holds a borrow, so the compiler rejects typed access
            # | during a live handle; the footgun becomes a compile error rather than a
            # | silent runtime bug that ships. You read reserves before you open the handle
            # | or after it closes, never during. That is why step 1 of the swap handler
            # | reads reserve_arcade.amount() and reserve_ticket.amount() into locals before
            # | any TransferChecked struct is built: the whole stale-read class is removed
            # | by the language, not by a call you must remember.
            explanation: "En v1, olvidarte de .reload() después de una CPI quería decir actuar sobre datos deserializados obsoletos. El CpiHandle de V2 sostiene un borrow, así que el compilador rechaza el acceso tipado durante un handle vivo; la trampa se vuelve un error de compilación en vez de un bug silencioso de runtime que se entrega. Lees las reservas antes de abrir el handle o después de que se cierra, nunca durante. Por eso el paso 1 del handler del swap lee reserve_arcade.amount() y reserve_ticket.amount() hacia locales antes de que se construya ningún struct TransferChecked: la clase entera de lectura obsoleta la quita el lenguaje, no una llamada que tengas que recordar."  # @src=9e50960f504f
            options:                 # source order — keep it
              b:
                # | transfer_checked consumes the InterfaceAccount wrapper, so the typed
                # | account is gone once the CPI returns.
                label: "transfer_checked consume el wrapper InterfaceAccount, así que la cuenta tipada desaparece en cuanto la CPI retorna."  # @src=7acfc202b878
                # | Nothing is consumed or destroyed. The handle borrows the wrapper for the
                # | length of the call and then gives it back; that same
                # | reserve_ticket.amount() compiles unchanged on the far side of
                # | transfer_checked.
                feedback: "Nada se consume ni se destruye. El handle toma prestado el wrapper mientras dura la llamada y después lo devuelve; ese mismo reserve_ticket.amount() compila sin cambios del otro lado de transfer_checked."  # @src=a2ffefe92b39
              c:
                # | V2 requires a .reload() call before any typed .amount read, and the
                # | compiler enforces that call ordering.
                label: "V2 exige una llamada a .reload() antes de cualquier lectura tipada de .amount, y el compilador hace cumplir ese orden de llamadas."  # @src=76f1f77684d3
                # | This inverts the change. .reload() was the 0.x remedy for stale
                # | deserialized data; V2 has no reload requirement and the compiler is
                # | enforcing a borrow, not a call ordering. The structural fix is to read
                # | both reserves up front, before any cpi_handle_mut() exists.
                feedback: "Esto invierte el cambio. .reload() era el remedio de 0.x para datos deserializados obsoletos; V2 no tiene ningún requisito de reload y el compilador está haciendo cumplir un borrow, no un orden de llamadas. El arreglo estructural es leer las dos reservas por adelantado, antes de que exista ningún cpi_handle_mut()."  # @src=1b56022c5245
              a:
                # | A live CpiHandle borrows the typed account, so a typed read during it
                # | cannot compile.
                label: "Un CpiHandle vivo toma prestada la cuenta tipada, así que una lectura tipada durante él no puede compilar."  # @src=ad37d23dc5cd
                # | Snapshot both balances into locals before any mutable handle exists, and
                # | the whole class stops being expressible: no remembered call, no
                # | discipline to keep.
                feedback: "Toma una foto de los dos balances hacia locales antes de que exista ningún handle mutable, y la clase entera deja de ser expresable: ninguna llamada que recordar, ninguna disciplina que mantener."  # @src=6248ef44101e
              d:
                # | It is the duplicate-mutable default firing, because the two live CPI
                # | handles alias the same reserve account.
                label: "Es el default de duplicate-mutable disparándose, porque los dos handles de CPI vivos le dan alias a la misma cuenta de reserva."  # @src=84a78d1b5402
                # | Two of V2's new defaults are being run together here. Duplicate-mutable
                # | is an account-validation rule about one account arriving in two writable
                # | slots, and it fires at runtime before the handler starts. What stopped
                # | this build is the borrow checker holding a typed read against a live
                # | handle, and the two handles in a swap point at different reserves
                # | anyway.
                feedback: "Acá se están corriendo juntos dos de los defaults nuevos de V2. Duplicate-mutable es una regla de validación de cuentas sobre una cuenta que llega en dos espacios escribibles, y se dispara en runtime antes de que arranque el handler. Lo que frenó este build es el borrow checker sosteniendo una lectura tipada contra un handle vivo, y de todos modos los dos handles de un swap apuntan a reservas distintas."  # @src=7105f6b2434d
  m05-l3:
    # | Token-2022 from the framework's seat
    title: "Token-2022 desde el asiento del framework"  # @src=a90b1e585687
    blocks:
      check:                      # quiz
        questions:
          m05-l3-q1:
            # | You read a Token-2022 token account and hardcoded its length to the classic
            # | SPL TokenAccount size. The read returns garbage for some accounts. Why?
            prompt: "Leíste una cuenta de token Token-2022 y dejaste su largo hardcoded al tamaño clásico del TokenAccount de SPL. La lectura devuelve basura para algunas cuentas. ¿Por qué?"  # @src=87a34ff12e1d
            # | A Token-2022 mint or token account carries optional TLV extensions after the
            # | base layout, so its length is not the classic constant. From the program's
            # | seat the fix is simple: read the actual account length rather than assuming
            # | a fixed size. That variable sizing is one of the two things this lesson
            # | makes you account for. Concretely, a Token-2022 mint keeps the classic
            # | 82-byte base, pads out to 165 bytes, carries a one-byte account-type tag at
            # | byte 165, and only then runs the TLV tail, which is why the live PYUSD mint
            # | reads 866 bytes. Nothing in the base is encrypted or re-ordered; it decodes
            # | with the same little-endian fields a classic mint uses.
            explanation: "Un mint o una cuenta de token Token-2022 lleva extensiones TLV opcionales después del layout base, así que su largo no es la constante clásica. Desde el asiento del programa el arreglo es simple: lee el largo real de la cuenta en vez de asumir un tamaño fijo. Ese dimensionamiento variable es una de las dos cosas que esta lección te hace tener en cuenta. Concretamente, un mint Token-2022 mantiene la base clásica de 82 bytes, rellena hasta 165 bytes, lleva una etiqueta de tipo de cuenta de un byte en el byte 165, y solo entonces corre la cola TLV, que es por lo que el mint PYUSD vivo lee 866 bytes. Nada de la base está cifrado ni reordenado; decodifica con los mismos campos little-endian que usa un mint clásico."  # @src=f65b66c807dd
            options:                 # source order — keep it
              c:
                # | Extensions append a TLV tail after the base layout, so the real length
                # | is data you must read, not a constant.
                label: "Las extensiones agregan una cola TLV después del layout base, así que el largo real es un dato que tienes que leer, no una constante."  # @src=b3389a1346aa
                # | The classic base is preserved and padded, then a type tag and whatever
                # | entries the issuer added, which is why a real mainnet mint measures far
                # | longer than the constant your parser is holding.
                feedback: "La base clásica se preserva y se rellena, después una etiqueta de tipo y las entradas que agregó quien emitió, que es por lo que un mint de mainnet de verdad mide mucho más que la constante que sostiene tu parser."  # @src=6016cf87c429
              b:
                # | Token-2022 stores its base fields in big-endian order, so a
                # | little-endian deserializer misreads supply and decimals.
                label: "Token-2022 guarda sus campos base en orden big-endian, así que un deserializador little-endian lee mal supply y decimals."  # @src=44b54dce4737
                # | Byte order is unchanged: Token-2022 kept the classic base layout
                # | precisely so existing parsers would not break. What breaks a
                # | fixed-length assumption is the TLV tail appended after that base.
                feedback: "El orden de los bytes está sin cambios: Token-2022 mantuvo el layout base clásico precisamente para que los parsers existentes no se rompieran. Lo que rompe una suposición de tamaño fijo es la cola TLV agregada después de esa base."  # @src=95ecbc3b9e80
              a:
                # | Token-2022 encrypts account data by default, so the base fields cannot
                # | be read without confidential-transfer keys.
                label: "Token-2022 cifra los datos de cuenta por defecto, así que los campos base no se pueden leer sin las claves de transferencia confidencial."  # @src=9200ed9d7a43
                # | Confidential transfer is one opt-in extension, not blanket encryption;
                # | the base fields of a Token-2022 account decode in the clear exactly like
                # | a classic one. The bug is the hardcoded length, not encryption.
                feedback: "La transferencia confidencial es una extensión opcional, no cifrado general; los campos base de una cuenta Token-2022 decodifican en claro exactamente como los de una clásica. El bug es el largo hardcoded, no el cifrado."  # @src=2ea86fce4ffa
              d:
                # | The extensions can sit ahead of the base layout, so a fixed offset lands
                # | on the wrong bytes.
                label: "Las extensiones pueden quedar delante del layout base, así que un offset fijo aterriza en los bytes equivocados."  # @src=a306e373e543
                # | The standard could not renumber a format the whole ecosystem was already
                # | parsing, so the base fields stayed exactly where they were and
                # | everything new was appended behind them. Extension data never moves in
                # | front of the base; what it does is make the total length something you
                # | read instead of something you assume.
                feedback: "El estándar no podía renumerar un formato que el ecosistema entero ya estaba parseando, así que los campos base quedaron exactamente donde estaban y todo lo nuevo se agregó detrás de ellos. El dato de extensión nunca se mueve delante de la base; lo que hace es volver el largo total algo que lees en vez de algo que asumes."  # @src=d015c19838f2
          m05-l3-q2:
            # | Your transfer_checked worked on a plain SPL mint but fails on a specific
            # | Token-2022 mint. What is the most likely program-seat cause?
            prompt: "Tu transfer_checked funcionó sobre un mint simple de SPL pero falla sobre un mint Token-2022 específico. ¿Cuál es la causa más probable desde el asiento del programa?"  # @src=53af22da3af2
            # | A mint with a TransferHook extension runs a hook program on every transfer,
            # | and that program needs its extra accounts forwarded in the instruction.
            # | transfer_checked itself is fine; a transfer against a hooked mint just won't
            # | complete unless you resolve and pass those accounts. Designing the hook is
            # | the Digital Assets course's job; noticing you must forward its accounts is
            # | yours. Note that the extension being present is not the trigger: the hook's
            # | programId is. An all-zero programId means the hook is declared but dormant,
            # | and the usual four accounts still suffice.
            explanation: "Un mint con una extensión TransferHook corre un programa de hook en cada transferencia, y ese programa necesita sus cuentas extra reenviadas en la instrucción. transfer_checked en sí está bien; una transferencia contra un mint con hook simplemente no se va a completar a menos que resuelvas y pases esas cuentas. Diseñar el hook es trabajo del curso de Digital Assets; notar que tienes que reenviar sus cuentas es tuyo. Nota que la extensión estando presente no es el disparador: el programId del hook lo es. Un programId de todos ceros quiere decir que el hook está declarado pero dormido, y las cuatro cuentas de siempre todavía alcanzan."  # @src=ef4bdf205954
            options:                 # source order — keep it
              b:
                # | Token-2022 needs its own transfer instruction, because transfer_checked
                # | exists only on the classic Token program.
                label: "Token-2022 necesita su propia instrucción de transferencia, porque transfer_checked existe solo en el programa Token clásico."  # @src=b360d42556e4
                # | transfer_checked is the one primitive that spans both programs, which is
                # | why the swap lesson built on it and why no branch was needed. The
                # | instruction name is right; the account list is short.
                feedback: "transfer_checked es la única primitiva que atraviesa los dos programas, que es por lo que la lección del swap construyó sobre ella y por lo que no se necesitó ninguna rama. El nombre de la instrucción está bien; la lista de cuentas está corta."  # @src=d8420e918574
              d:
                # | The mint declares a TransferFeeConfig extension, so the token program
                # | typically rejects a transfer it would shrink.
                label: "El mint declara una extensión TransferFeeConfig, así que el programa de token típicamente rechaza una transferencia que encogería."  # @src=421cab2a82a0
                # | A fee mint fails the other way, and that is the whole reason the two are
                # | worth separating. The transfer succeeds and less arrives than you sent,
                # | so nothing announces itself: your invariant is what eventually notices.
                # | A hook with a real programId is the one that stops the transfer
                # | outright.
                feedback: "Un mint con tarifa falla al revés, y esa es la razón entera por la que vale separar los dos. La transferencia tiene éxito y llega menos de lo que mandaste, así que nada se anuncia: tu invariante es lo que acaba notándolo. Un hook con un programId de verdad es el que detiene la transferencia de entrada."  # @src=00609d93726d
              c:
                # | InterfaceAccount<Mint> refuses Token-2022 mints, so you must hardcode
                # | the Token-2022 program id in the accounts struct.
                label: "InterfaceAccount<Mint> rechaza los mints Token-2022, así que tienes que dejar hardcoded el id del programa Token-2022 en la struct de cuentas."  # @src=feb82b2e2f9c
                # | That is Account<TokenAccount>, which pins the owner to the classic Token
                # | program. InterfaceAccount<T> accepts accounts owned by either program,
                # | which is exactly why hardcoding a program id is the footgun
                # | token_interface removes.
                feedback: "Ese es Account<TokenAccount>, que amarra el dueño al programa Token clásico. InterfaceAccount<T> acepta cuentas cuyo dueño es cualquiera de los dos programas, que es exactamente por lo que dejar hardcoded un id de programa es la trampa que token_interface saca."  # @src=bac424baac43
              a:
                # | The mint declares a TransferHook extension and you did not forward the
                # | hook program's extra accounts.
                label: "El mint declara una extensión TransferHook y no reenviaste las cuentas extra del programa de hook."  # @src=a6bf20a236a2
                # | Presence of the extension is not the question; the program id recorded
                # | inside it is. All zeroes and the hook is inert, so that mint transfers
                # | fine on the ordinary account list.
                feedback: "La presencia de la extensión no es la pregunta; el id de programa registrado adentro de ella lo es. Todo ceros y el hook está inerte, así que ese mint transfiere bien con la lista de cuentas común."  # @src=76b5bf830b1e
          m05-l3-q3:
            # | A teammate asks you to add full transfer-hook design, writing the hook
            # | program and its account-resolution interface, into this lesson's swap.
            # | What's the right call?
            prompt: "Un compañero te pide agregar diseño completo de transfer hook, escribiendo el programa de hook y su interfaz de resolución de cuentas, dentro del swap de esta lección. ¿Cuál es la decisión correcta?"  # @src=980a6f3dde59
            # | The boundary is explicit: this course teaches Token-2022 from the program's
            # | seat (account sizing, forwarding hook accounts), and the Digital Assets
            # | course owns extension-standards depth and walks the transfer-hook interface
            # | end to end. Keeping the line sharp is the lesson's job: mechanics here,
            # | standards there. Concretely, reading the extension-aware account length,
            # | detecting a TransferHook extension and reading its programId, and reasoning
            # | about whether a transfer must forward extra accounts belong here; designing
            # | extensions, writing a hook program, and wiring its account-resolution
            # | interface belong there.
            explanation: "La frontera es explícita: este curso enseña Token-2022 desde el asiento del programa (dimensionamiento de cuentas, reenviar cuentas de hook), y el curso de Digital Assets es dueño de la profundidad de estándares de extensión y recorre la interfaz de transfer hook de punta a punta. Mantener la línea nítida es el trabajo de la lección: mecánica acá, estándares allá. Concretamente, leer el largo de cuenta consciente de extensiones, detectar una extensión TransferHook y leer su programId, y razonar sobre si una transferencia tiene que reenviar cuentas extra pertenecen acá; diseñar extensiones, escribir un programa de hook y cablear su interfaz de resolución de cuentas pertenecen allá."  # @src=e567e36016f4
            options:                 # source order — keep it
              c:
                # | Split the difference: write a minimal hook program here and defer only
                # | the account-resolution interface to Digital Assets.
                label: "Divide la diferencia: escribe un programa de hook mínimo acá y posterga solo la interfaz de resolución de cuentas a Digital Assets."  # @src=e49c2288c8ec
                # | A partial re-teach is exactly the boundary creep the design forbids. It
                # | duplicates owned material and leaves learners unsure which course
                # | actually teaches the interface end to end.
                feedback: "Una re-enseñanza parcial es exactamente la invasión de frontera que el diseño prohíbe. Duplica material del que otro es dueño y deja a quien aprende sin saber qué curso enseña de verdad la interfaz de punta a punta."  # @src=7ebfd051f38f
              b:
                # | Decline: hook authoring is standards depth the Digital Assets course
                # | owns; this lesson stays at program-seat mechanics.
                label: "Recházalo: escribir el hook es profundidad de estándares de la que es dueño el curso de Digital Assets; esta lección se queda en la mecánica del asiento del programa."  # @src=5e3f5ea98865
                # | Sizing the account, spotting the extension, shipping the extra accounts
                # | along with the call: that's the program seat's work. Authoring the hook
                # | and its resolution interface is standards work, and it lives in one
                # | place.
                feedback: "Dimensionar la cuenta, encontrar la extensión, entregar las cuentas extra junto con la llamada: ese es el trabajo del asiento del programa. Escribir el hook y su interfaz de resolución es trabajo de estándares, y vive en un solo lugar."  # @src=51198b927c5b
              a:
                # | Add it here: the lesson already reads the TransferHook extension, so
                # | authoring the hook program is the natural next step.
                label: "Agrégalo acá: la lección ya lee la extensión TransferHook, así que escribir el programa de hook es el próximo paso natural."  # @src=8387f9a754bd
                # | Reading the extension's programId is a program-seat mechanic; authoring
                # | the hook and its account-resolution interface is standards depth that
                # | lives in one place by design. Detecting is not designing.
                feedback: "Leer el programId de la extensión es una mecánica del asiento del programa; escribir el hook y su interfaz de resolución de cuentas es profundidad de estándares que vive en un solo lugar por diseño. Detectar no es diseñar."  # @src=8d0e23b95cf2
              d:
                # | Tell them it is covered already: detecting the hook and authoring it are
                # | one skill from the program's seat.
                label: "Dile que ya está cubierto: detectar el hook y escribirlo son una sola habilidad desde el asiento del programa."  # @src=bb5452f10b83
                # | Reading a stored programId off a mint and writing the program that field
                # | points at are not the same job, and the lesson draws that line in as
                # | many words: noticing is mechanics, authoring is the standard. Collapsing
                # | them is how a course quietly grows a second syllabus it never planned to
                # | maintain.
                feedback: "Leer un programId almacenado de un mint y escribir el programa al que apunta ese campo no son el mismo trabajo, y la lección traza esa línea con todas las palabras: notar es mecánica, la autoría es el estándar. Colapsarlos es cómo un curso calladamente hace crecer un segundo currículo que nunca planeó mantener."  # @src=3cd96f920f67
          m05-l3-q4:
            # | Budgeting space for a Token-2022 mint, you reach for the account length a
            # | docs example printed for a similar mint and cite it as fixed. What does the
            # | lesson teach you to do instead?
            prompt: "Presupuestando espacio para un mint Token-2022, recurres al largo de cuenta que un ejemplo de la documentación imprimió para un mint parecido y lo citas como fijo. ¿Qué te enseña la lección a hacer en cambio?"  # @src=bb1f07ff340f
            # | PR #4914 revised Anchor's own headline benchmarks down (95% to 94%, 9.9x to
            # | 8.8x) with an explicit 'exact values can move' caveat. Extension-aware
            # | sizing is exactly that kind of moving cost, so the discipline is to read the
            # | live Token-2022 mint and reason from the observation rather than freeze a
            # | remembered number. The cost also moves per-mint, not just per-release: a
            # | different Token-2022 mint carries a different extension set and lands at a
            # | different length, and an authority can add an extension after issuance, so
            # | even one mint's number is not stable over time.
            explanation: "El PR #4914 revisó a la baja los benchmarks del propio titular de Anchor (95% a 94%, 9.9x a 8.8x) con una reserva explícita de 'exact values can move'. El dimensionamiento consciente de extensiones es exactamente ese tipo de costo en movimiento, así que la disciplina es leer el mint Token-2022 vivo y razonar desde la observación en vez de congelar un número recordado. El costo también se mueve por mint, no solo por release: un mint Token-2022 distinto lleva un conjunto de extensiones distinto y aterriza en un largo distinto, y una autoridad puede agregar una extensión después de la emisión, así que ni el número de un solo mint es estable a lo largo del tiempo."  # @src=500dd00da3ee
            options:                 # source order — keep it
              c:
                # | Read the live mint and reason from what you observe, because a
                # | remembered figure can already be stale.
                label: "Lee el mint vivo y razona desde lo que observas, porque una cifra recordada ya puede estar obsoleta."  # @src=d547850ef98a
                # | Per mint as much as per release, since each carries its own extension
                # | set. An authority can bolt one on after issuance too; even a single
                # | mint's measurement has a shelf life.
                feedback: "Por mint tanto como por release, ya que cada uno lleva su propio conjunto de extensiones. Una autoridad también puede atornillar una después de la emisión; hasta la medición de un solo mint tiene fecha de vencimiento."  # @src=3b3bd16ff2fe
              a:
                # | Cite the docs figure; a measurement published in official docs is a
                # | versioned guarantee.
                label: "Cita la cifra de la documentación; una medición publicada en documentación oficial es una garantía versionada."  # @src=93711d2444f2
                # | Anchor's own team revised its headline numbers down in PR #4914 and
                # | attached an explicit 'exact values can move' caveat, and a published
                # | benchmark is a snapshot, not a versioned guarantee.
                feedback: "El propio equipo de Anchor revisó a la baja los números de su titular en el PR #4914 y le adjuntó una reserva explícita de 'exact values can move', y un benchmark publicado es una foto, no una garantía versionada."  # @src=9b6e8230de04
              b:
                # | Average the figures quoted across several posts to smooth out
                # | per-release variation.
                label: "Promedia las cifras citadas en varios posts para suavizar la variación por release."  # @src=2aad7bad16f2
                # | Averaging stale figures does not make any of them current, and it hides
                # | which release each came from. The lesson's move is to read the live
                # | account and reason from the observation.
                feedback: "Promediar cifras obsoletas no vuelve actual a ninguna de ellas, y esconde de qué release vino cada una. La jugada de la lección es leer la cuenta viva y razonar desde la observación."  # @src=3b9721cd9308
              d:
                # | Use the 866 bytes the lab measured on PYUSD, since a live mainnet
                # | reading beats a published figure.
                label: "Usa los 866 bytes que el lab midió sobre PYUSD, ya que una lectura viva de mainnet le gana a una cifra publicada."  # @src=4be7b8d13acb
                # | A live reading does beat a docs figure, and 866 is still the wrong thing
                # | to carry forward: it is one mint's extension set on one day. Another
                # | Token-2022 mint carries different extensions and lands at a different
                # | length, and an authority can add one after issuance, so the number you
                # | want is the one you read from the mint in front of you.
                feedback: "Una lectura viva sí le gana a una cifra de documentación, y 866 sigue siendo la cosa equivocada para llevarse hacia adelante: es el conjunto de extensiones de un solo mint en un solo día. Otro mint Token-2022 lleva extensiones distintas y aterriza en un largo distinto, y una autoridad puede agregar una después de la emisión, así que el número que quieres es el que lees del mint que tienes enfrente."  # @src=7f23519b7927
  m06-l1:
    # | Turn the instruments on: profile, debug, and cover the swap
    title: "Prende los instrumentos: perfilar, depurar y cubrir el swap"  # @src=bd57362c0acc
    blocks:
      check:                      # quiz
        questions:
          profile-output:
            # | You ran `anchor test --profile` on the swap and the run finished green.
            # | Where do the per-test flamegraphs land, and what kind of build produced
            # | them?
            prompt: "Corriste `anchor test --profile` sobre el swap y la corrida terminó en verde. ¿Dónde aterrizan los flamegraphs por prueba, y qué tipo de build los produjo?"  # @src=9d1ddad26c06
            # | `anchor test --profile` compiles a debug build (for DWARF symbols) and emits
            # | one flamegraph SVG per test under target/anchor-v2-profile/. Because it is a
            # | debug build, treat the CU it shows as relative shape, not your release cost.
            # | DWARF is the debug-info format that maps compiled instructions back to your
            # | function names; without it the profiler would label every frame with a raw
            # | hex address instead of `swap_out`.
            explanation: "`anchor test --profile` compila un build de debug (por los símbolos DWARF) y emite un SVG de flamegraph por prueba dentro de target/anchor-v2-profile/. Como es un build de debug, trata la CU que muestra como forma relativa, no como tu costo de release. DWARF es el formato de debug-info que mapea instrucciones compiladas de vuelta a los nombres de tus funciones; sin él el profiler rotularía cada frame con una dirección hex cruda en vez de `swap_out`."  # @src=5b597149bdc8
            options:                 # source order — keep it
              e:
                # | Under target/anchor-v2-profile/, one SVG for the run, debug build.
                label: "Dentro de target/anchor-v2-profile/, un SVG para la corrida, build de debug."  # @src=f3d142d4ae7b
                # | One SVG for the whole run would fold every test's transactions into a
                # | single chart, which is exactly the confusion the per-test split avoids:
                # | your fixture's mint-and-fund transactions get their own roots, often
                # | fatter than the trade. The profiler writes one file per test so the
                # | roots you are ignoring are at least in someone else's file.
                feedback: "Un SVG para la corrida entera plegaría las transacciones de todas las pruebas en un solo gráfico, que es exactamente la confusión que evita la división por prueba: las transacciones de acuñar-y-fondear de tu fixture sacan sus propias raíces, muchas veces más gordas que el canje. El profiler escribe un archivo por prueba para que las raíces que estás ignorando queden al menos en el archivo de otro."  # @src=0f1a8eb13baf
              d:
                # | Under target/anchor-v2-profile/, one SVG per test, a release build.
                label: "Dentro de target/anchor-v2-profile/, un SVG por prueba, un build de release."  # @src=a98072089ee3
                # | Right path, right granularity, wrong build. A release build strips the
                # | DWARF symbols the profiler needs to name a frame, so `--profile`
                # | compiles in debug on purpose and you pay for it in inflated CU figures
                # | that are only good for comparing frames against each other.
                feedback: "Ruta correcta, granularidad correcta, build equivocado. Un build de release saca los símbolos DWARF que el profiler necesita para nombrar un frame, así que `--profile` compila en debug a propósito y lo pagas en cifras de CU infladas que solo sirven para comparar frames entre sí."  # @src=cd8efb8e9f7a
              b:
                # | Under target/deploy/, one SVG per program, from a release build.
                label: "Dentro de target/deploy/, un SVG por programa, de un build de release."  # @src=ebe837a34811
                # | target/deploy/ holds the compiled .so only. The profiler writes to its
                # | own directory, emits one SVG per test rather than per program, and
                # | builds in debug so DWARF survives.
                feedback: "target/deploy/ contiene solo el .so compilado. El profiler escribe en su propio directorio, emite un SVG por prueba y no por programa, y hace el build en debug para que DWARF sobreviva."  # @src=59ec12b62758
              a:
                # | Only as text tables in stdout, since V2 dropped the v1-era flamegraph
                # | SVGs.
                label: "Solo como tablas de texto en stdout, ya que V2 dejó de lado los SVG de flamegraph de la era v1."  # @src=5f4c76ff54b1
                # | Backwards: the flamegraph SVG is V2's addition, and `--profile` is the
                # | flag that writes it. There is no v1 SVG being retired here.
                feedback: "Al revés: el SVG de flamegraph es lo que V2 agrega, y `--profile` es la flag que lo escribe. Acá no se está retirando ningún SVG de v1."  # @src=3024f9e64efe
              c:
                # | Under target/anchor-v2-profile/, one SVG per test, a debug build.
                label: "Dentro de target/anchor-v2-profile/, un SVG por prueba, un build de debug."  # @src=4dc307964596
                # | Debug is chosen so symbols survive. Strip them and every frame reads as
                # | a hex address. The cost is that the CU numbers on it are relative shape,
                # | never the release figure you would ship.
                feedback: "Debug se elige para que los símbolos sobrevivan. Sácalos y cada frame se lee como una dirección hex. El costo es que las cifras de CU que trae son forma relativa, nunca el número de release que entregarías."  # @src=0b8adb6b604e
          step-instruction:
            # | One swap instruction fails and you want to walk it sBPF instruction by
            # | instruction, inspecting registers as you go. Which tool does that?
            prompt: "Una instrucción de swap falla y quieres caminarla instrucción sBPF por instrucción sBPF, inspeccionando registros a medida que avanzas. ¿Qué herramienta hace eso?"  # @src=f86103b724d7
            # | anchor debugger is the instruction-level ratatui TUI; it is the only one of
            # | the four that lets you step and inspect, while the others produce reports
            # | after the fact. It does not run your suite; it builds the named test,
            # | replays its transaction, and halts at your program's first instruction.
            # | Passing `--gdb` additionally exposes the solana-sbpf gdb stub on
            # | 127.0.0.1:9001, so you can attach real gdb and set breakpoints by symbol
            # | name.
            explanation: "anchor debugger es la TUI en ratatui al nivel de la instrucción; es la única de las cuatro que te deja dar step e inspeccionar, mientras las otras producen reportes después del hecho. No corre tu suite; hace el build de la prueba nombrada, repite su transacción, y se detiene en la primera instrucción de tu programa. Pasar `--gdb` además expone el gdb stub de solana-sbpf en 127.0.0.1:9001, así que puedes adjuntar gdb de verdad y poner breakpoints por nombre de símbolo."  # @src=dbf4a3e18038
            options:                 # source order — keep it
              d:
                # | gdb attached by hand to the built .so, since no Anchor subcommand shows
                # | sBPF registers.
                label: "gdb adjuntado a mano al .so compilado, ya que ningún subcomando de Anchor muestra registros sBPF."  # @src=bd182cc929ac
                # | Anchor does not leave you to wire this yourself. The debugger's TUI
                # | shows the registers changing as you step, and if you want gdb proper,
                # | `anchor debugger --gdb` exposes the solana-sbpf stub on 127.0.0.1:9001
                # | for you to attach to. Reaching for bare gdb means doing by hand what a
                # | subcommand already hosts.
                feedback: "Anchor no te deja cablear esto solo. La TUI del debugger muestra los registros cambiando a medida que das step, y si quieres gdb propiamente dicho, `anchor debugger --gdb` expone el stub de solana-sbpf en 127.0.0.1:9001 para que te adjuntes. Recurrir a gdb pelado quiere decir hacer a mano lo que un subcomando ya hospeda."  # @src=7a2a4ed366a5
              a:
                # | anchor debugger, a ratatui TUI that steps sBPF instructions and shows
                # | registers.
                label: "anchor debugger, una TUI en ratatui que da step a instrucciones sBPF y muestra registros."  # @src=d4f5b30a7a7c
                # | It doesn't run a suite: one named test is rebuilt, its transaction
                # | replayed, and you land on your program's first instruction. There is a
                # | gdb stub behind a flag too, if you would rather break on symbol names.
                feedback: "No corre una suite: una prueba nombrada se vuelve a compilar, su transacción se repite, y aterrizas en la primera instrucción de tu programa. También hay un gdb stub detrás de una flag, si prefieres parar en nombres de símbolo."  # @src=393561444d5e
              c:
