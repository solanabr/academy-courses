                feedback: "Tentador porque la cobertura sí apunta a código que tus pruebas nunca alcanzaron, pero nunca corre de forma interactiva: reconstruye aciertos de línea y de rama a partir de trazas de registros SBF y suelta un archivo LCOV. Nada se detiene, y no hay vista de registros."  # @src=41375d7a7d0e
          cu-precise-unit:
            # | You want CU-precise assertions on the trade instruction without standing up
            # | a validator, and you want to know how the testing thread escalates from
            # | here.
            prompt: "Quieres aserciones precisas en CU sobre la instrucción de canje sin levantar un validador, y quieres saber cómo escala el hilo de pruebas de acá en adelante."  # @src=bdb4a9108f90
            # | Mollusk gives CU-precise, in-process unit assertions on a single
            # | instruction. The module's testing thread escalates from the LiteSVM harness
            # | (m02) up to Mollusk here; Surfpool comes later for full-floor integration.
            # | Mollusk is a third-party crate with no Anchor affiliation, pinned at 0.15.1
            # | in this lab, and it runs one instruction with no validator, no localnet, and
            # | no async: you build the instruction, hand it accounts, and assert
            # | `Check::success()` plus `Check::compute_units(N)`.
            explanation: "Mollusk da aserciones de unidad precisas en CU e in-process sobre una sola instrucción. El hilo de pruebas del módulo escala desde el banco de pruebas de LiteSVM (m02) hasta Mollusk acá; Surfpool llega después para integración de salón entero. Mollusk es un crate de terceros sin ninguna afiliación con Anchor, fijado en 0.15.1 en este lab, y corre una instrucción sin validador, sin localnet y sin async: armas la instrucción, le entregas cuentas, y haces una aserción de `Check::success()` más `Check::compute_units(N)`."  # @src=dfa79b629ceb
            options:                 # source order — keep it
              a:
                # | Surfpool localnet: the CU-precise unit harness, no validator needed.
                label: "Surfpool localnet: el banco de unidad preciso en CU, sin necesidad de validador."  # @src=1162eaafc9da
                # | Surfpool is itself a localnet validator, forking real cluster state,
                # | which is exactly the stand-up this question rules out. It arrives later,
                # | at the capstone, for full-floor integration rather than per-instruction
                # | CU.
                feedback: "Surfpool es él mismo un validador de localnet, forkeando estado real de cluster, que es exactamente el montaje que esta pregunta descarta. Llega después, en el capstone, para integración de salón entero en vez de CU por instrucción."  # @src=70f1c8502492
              b:
                # | Mollusk (anza-xyz/mollusk): an in-process minified SVM with CU-precise
                # | checks.
                label: "Mollusk (anza-xyz/mollusk): una SVM minificada in-process con verificaciones precisas en CU."  # @src=98e5ca6ff54c
                # | Unaffiliated, third-party, pinned in this lab: one instruction, no
                # | validator, no async anywhere in it. The testing thread climbs here from
                # | the earlier harness, and localnet comes later.
                feedback: "Sin afiliación, de terceros, fijado en este lab: una instrucción, sin validador, sin async en ninguna parte. El hilo de pruebas sube hasta acá desde el banco anterior, y la localnet llega después."  # @src=ce589e91981f
              c:
                # | anchor coverage: its LCOV report carries CU per line to assert on.
                label: "anchor coverage: su reporte LCOV trae CU por línea para que hagas aserciones."  # @src=56b4a4957499
                # | LCOV records `DA:` line hits and `BRDA:` branch hits, counts of how
                # | often code ran rather than what it cost. Coverage also reports rather
                # | than gates, so there is nothing there to assert against.
                feedback: "LCOV registra aciertos de línea `DA:` y aciertos de rama `BRDA:`, conteos de cuántas veces corrió el código en vez de cuánto costó. La cobertura además reporta en vez de hacer de barrera, así que no hay nada ahí contra lo que hacer una aserción."  # @src=088e915b9443
              d:
                # | The LiteSVM harness from module 2, since it already reports compute
                # | units.
                label: "El banco de pruebas de LiteSVM del módulo 2, ya que él ya reporta unidades de cómputo."  # @src=233370e11567
                # | LiteSVM is the right shape and the wrong rung. It answers whether the
                # | instruction did the right thing, in process and fast, and this module
                # | escalates past it precisely because the next question is how many
                # | compute units the right thing took. That assertion is the one Mollusk
                # | adds.
                feedback: "LiteSVM es la forma correcta y el peldaño equivocado. Responde si la instrucción hizo lo correcto, in-process y rápido, y este módulo escala más allá de él precisamente porque la próxima pregunta es cuántas unidades de cómputo se llevó lo correcto. Esa aserción es la que agrega Mollusk."  # @src=24ab14b24703
          coverage-output:
            # | You ran `anchor coverage` on the swap to find untested branches. What does
            # | it produce, and from what?
            prompt: "Corriste `anchor coverage` sobre el swap para encontrar ramas sin prueba. ¿Qué produce, y a partir de qué?"  # @src=59d0a98dd6ab
            # | anchor coverage reconstructs line/branch coverage as LCOV from SBF register
            # | traces, so you can see which swap branches your tests never exercised. It
            # | reports; it does not decide or gate. The raw file at
            # | target/anchor-v2-coverage/lcov.info is a machine format of `DA:` and `BRDA:`
            # | records with no source in it, so render it with `genhtml` (or point an
            # | editor extension at it) to read the red branches against your own lib.rs.
            explanation: "anchor coverage reconstruye cobertura de línea/rama como LCOV a partir de trazas de registros SBF, así que puedes ver qué ramas del swap tus pruebas nunca ejercitaron. Reporta; no decide ni hace de barrera. El archivo crudo en target/anchor-v2-coverage/lcov.info es un formato de máquina de registros `DA:` y `BRDA:` sin nada de código adentro, así que renderízalo con `genhtml` (o apunta una extensión de editor a él) para leer las ramas rojas contra tu propio lib.rs."  # @src=840bcbfd04a1
            options:                 # source order — keep it
              d:
                # | An HTML site of line coverage, rendered from the swap's test run.
                label: "Un sitio HTML de cobertura de línea, renderizado a partir de la corrida de pruebas del swap."  # @src=0787610a2a76
                # | You can get that page, but not from this command. `anchor coverage`
                # | writes raw LCOV, a machine format of `DA:` and `BRDA:` records with no
                # | source in it, and turning that into something browsable is a second step
                # | you run yourself with genhtml or an editor extension.
                feedback: "Esa página la puedes conseguir, pero no de este comando. `anchor coverage` escribe LCOV crudo, un formato de máquina de registros `DA:` y `BRDA:` sin nada de código adentro, y convertir eso en algo navegable es un segundo paso que corres tú mismo con genhtml o una extensión de editor."  # @src=42d42a6ebb21
              a:
                # | A flamegraph SVG of CU cost per function, one per test, under
                # | target/deploy/.
                label: "Un SVG de flamegraph de costo en CU por función, uno por prueba, dentro de target/deploy/."  # @src=07af6b0b199a
                # | That describes `anchor test --profile`, and even then the SVGs land
                # | under target/anchor-v2-profile/, not target/deploy/. Coverage is about
                # | which code ran, not how expensive it was.
                feedback: "Eso describe `anchor test --profile`, y aun así los SVG aterrizan dentro de target/anchor-v2-profile/, no de target/deploy/. La cobertura es sobre qué código corrió, no sobre qué tan caro fue."  # @src=0cb4727f8452
              c:
                # | An LCOV report of line and branch coverage, from SBF register traces.
                label: "Un reporte LCOV de cobertura de línea y de rama, a partir de trazas de registros SBF."  # @src=1c3218c71fb7
                # | The artifact is a hit-count file with no source in it; something has to
                # | render it before you can read anything. Which lines ran, never what they
                # | cost.
                feedback: "El artefacto es un archivo de conteo de aciertos sin nada de código adentro; algo tiene que renderizarlo antes de que puedas leer cualquier cosa. Qué líneas corrieron, nunca cuánto costaron."  # @src=5a9b905e975f
              b:
                # | A hard gate that fails the build when coverage drops below a threshold.
                label: "Una barrera dura que hace fallar el build cuando la cobertura cae por debajo de un umbral."  # @src=a55bfe2278f5
                # | Coverage hands you a report and walks away; it never fails a build. A
                # | coverage floor is CI policy you write on top of the LCOV file yourself.
                feedback: "La cobertura te entrega un reporte y se va; nunca hace fallar un build. Un piso de cobertura es política de CI que escribes tú mismo encima del archivo LCOV."  # @src=7b2ac77bfdd9
  m06-l2:
    # | The measured loop: buy back CU one change at a time
    title: "El loop medido: recompra CU un cambio a la vez"  # @src=e91f150e883a
    blocks:
      optimize-swap-quote:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | amount_in_with_fee = amount_in * (10_000 - fee_bps)
          0: "amount_in_with_fee = amount_in * (10_000 - fee_bps)"  # @src=5bd35cd45d51
          # | out = (reserve_out * amount_in_with_fee) / (reserve_in * 10_000 +
          # | amount_in_with_fee)
          1: "out = (reserve_out * amount_in_with_fee) / (reserve_in * 10_000 + amount_in_with_fee)"  # @src=fd0024b321b0
          # | cast to u128 before the multiplies, cast back to u64 after the single division
          2: "castea a u128 antes de las multiplicaciones, castea de vuelta a u64 después de la única división"  # @src=cc94b74c5781
          # | guard before you compute: an empty reserve, or a fee_bps above 10_000, has no
          # | valid quote — return 0 rather than dividing by zero or underflowing the fee
          3: "pon la guarda antes de computar: una reserva vacía, o un fee_bps arriba de 10_000, no tiene cotización válida — devuelve 0 en vez de dividir por cero o hacer underflow de la comisión"  # @src=ba7fa9604198
        tests:                      # keyed by test case id
          t1:
            # | 0.3% fee (30 bps), equal 1M reserves, 10k in — fee-adjusted constant product
            description: "comisión de 0.3% (30 bps), reservas iguales de 1M, 10k de entrada — producto constante ajustado por comisión"  # @src=5509e89fb367
          t2:
            # | 0.3% fee, uneven reserves (5M in / 2M out), 100k in
            description: "comisión de 0.3%, reservas desparejas (5M de entrada / 2M de salida), 100k de entrada"  # @src=3aaffd812601
          t3:
            # | zero fee behaves like the plain constant product (starter and solution agree
            # | here)
            description: "comisión cero se comporta como el producto constante a secas (el starter y la solución coinciden acá)"  # @src=f8b45b4fdc79
          t4:
            # | 0.3% fee, large trade (500k into 1M/1M) where the missing fee is obvious
            description: "comisión de 0.3%, canje grande (500k sobre 1M/1M) donde la comisión faltante es obvia"  # @src=e1204f385366
          t5:
            # | empty reserve_in: the denominator collapses to amount_in_with_fee, so an
            # | unguarded quote hands back the entire reserve_out
            description: "reserve_in vacía: el denominador se colapsa a amount_in_with_fee, así que una cotización sin guarda devuelve el reserve_out entero"  # @src=93e2c5dad404
          t6:
            # | fully drained pool (both reserves empty) asked for a zero-size quote — an
            # | unguarded quote divides 0 by 0
            description: "pool completamente drenado (las dos reservas vacías) al que se le pide una cotización de tamaño cero — una cotización sin guarda divide 0 por 0"  # @src=ad13da64c3bd
          t7:
            # | fee above the 10_000 bps scale: 10_000 - fee_bps underflows unless it is
            # | guarded
            description: "comisión arriba de la escala de 10_000 bps: 10_000 - fee_bps hace underflow salvo que esté guardado"  # @src=b54f3e4247f5
          t8:
            # | fee_bps == 10_000 is the boundary, not an error: a 100% fee eats the whole
            # | input and 0 out is the arithmetic answer
            description: "fee_bps == 10_000 es el límite, no un error: una comisión del 100% se come la entrada entera y 0 de salida es la respuesta aritmética"  # @src=ca1ffbff80c8
          t9:
            # | u64::MAX reserves and input: the numerator exceeds u128, so the checked
            # | product must degrade to 0 instead of overflowing
            description: "reservas y entrada de u64::MAX: el numerador excede u128, así que el producto verificado tiene que degradar a 0 en vez de hacer overflow"  # @src=dc7311f145d6
          t10:
            # | 1e18 reserves, 1e12 in: fits u128 comfortably but overflows a u64 multiply,
            # | so this is the case that forces the promotion
            description: "reservas de 1e18, 1e12 de entrada: entra en u128 cómodamente pero hace overflow de una multiplicación u64, así que este es el caso que fuerza la promoción"  # @src=b093ed0695c6
      check:                      # quiz
        questions:
          guardrails-off:
            # | A crate whose graph holds just `anchor-lang`, with no `anchor-spl` edge
            # | re-adding the defaults, compiles with `guardrails` OFF and re-measures lower
            # | CU plus a smaller binary. Select the two statements that hold for that
            # | build.
            prompt: "Un crate cuyo grafo tiene solo `anchor-lang`, sin ningún borde de `anchor-spl` que vuelva a agregar los defaults, compila con `guardrails` APAGADO y vuelve a medir menos CU más un binario más chico. Selecciona las dos afirmaciones que se cumplen para ese build."  # @src=19a94cab3cdc
            # | Two statements hold and three do not, and the pair that holds is
            # | deliberately one fact plus one obligation: the checks really did leave the
            # | binary, and the argument they were making is now yours to write. guardrails
            # | is a default-on set of runtime safety nets. Where the flip lands, compiling
            # | it off buys back CU and ~300 bytes, but you have removed real checks, so it
            # | is only honest to ship once you can defend the invariants without them. Name
            # | the nets before you argue past them: that an account is owned by the program
            # | you think owns it, that a discriminator matches the type you deserialized
            # | as, that a wrapping arithmetic path is caught rather than silently
            # | truncating. Turning the feature off does not make a malformed call
            # | impossible; it makes the framework stop checking for one. And note the
            # | question's precondition, because on R4 itself the lab measured a zero:
            # | anchor-spl declares anchor-lang with its defaults on, and cargo's feature
            # | unification holds guardrails on for the whole graph no matter what your own
            # | row says, so the flip only lands on a crate whose graph does not re-add it.
            # | When it lands, this trade is what you signed, and if you cannot write the
            # | invariant paragraph for your own handler, revert.
            explanation: "Dos afirmaciones se cumplen y tres no, y el par que se cumple es deliberadamente un hecho más una obligación: las verificaciones de verdad se fueron del binario, y el argumento que estaban haciendo ahora es tuyo para escribir. guardrails es un conjunto de redes de seguridad de runtime prendidas por defecto. Donde el flip aterriza, compilarlo apagado recompra CU y ~300 bytes, pero sacaste verificaciones de verdad, así que solo es honesto entregarlo una vez que puedas defender los invariantes sin ellas. Nombra las redes antes de argumentar más allá de ellas: que una cuenta sea propiedad del programa que crees que es su dueño, que un discriminador coincida con el tipo como el que la deserializaste, que un camino aritmético que hace wrap quede cazado en vez de truncar en silencio. Apagar el feature no vuelve imposible una llamada malformada; hace que el framework deje de verificar una. Y fíjate en la precondición de la pregunta, porque sobre R4 mismo el lab midió un cero: anchor-spl declara anchor-lang con sus defaults prendidos, y la unificación de features de cargo mantiene guardrails prendido para todo el grafo no importa lo que diga tu propia fila, así que el flip solo aterriza sobre un crate cuyo grafo no lo vuelve a agregar. Cuando aterriza, este canje es el que firmaste, y si no puedes escribir el párrafo de invariantes para tu propio handler, revierte."  # @src=4a8b09d1446c
            options:                 # source order — keep it
              d:
                # | The malformed call did not become impossible; the framework stopped
                # | checking for it, so the invariant argument is now yours to write.
                label: "La llamada malformada no se volvió imposible; el framework dejó de verificarla, así que el argumento de invariantes ahora es tuyo para escribir."  # @src=9a1dc1eab91e
                # | This is the half people skip, and it is the half that decides whether
                # | the trade was defensible. Nothing about the caller changed. If you can
                # | say out loud that the reserves are distinct accounts, the fee scale is
                # | fixed, the output is bounded by reserve_out, and the quote returns 0 on
                # | an empty pool, you have made the argument the framework was making. If
                # | you cannot, revert.
                feedback: "Esta es la mitad que la gente se saltea, y es la mitad que decide si el canje era defendible. Nada de quien llama cambió. Si puedes decir en voz alta que las reservas son cuentas distintas, que la escala de la comisión es fija, que la salida está acotada por reserve_out, y que la cotización devuelve 0 en un pool vacío, hiciste el argumento que el framework estaba haciendo. Si no puedes, revierte."  # @src=928ebd44c615
              e:
                # | The framework still catches a malformed call and just reports it later,
                # | so in practice you traded error quality rather than a check.
                label: "El framework igual caza una llamada malformada y nada más la reporta más tarde, así que en la práctica cambiaste calidad de error y no una verificación."  # @src=9f348c60ed62
                # | There is no later. A check that was compiled out does not run at all, so
                # | nothing downgrades a clean rejection into a messy one: the call proceeds
                # | on bytes nobody verified. That is the whole reason the CU came back, and
                # | the whole reason the trade needs an argument behind it.
                feedback: "No hay más tarde. Una verificación que se compiló afuera no corre para nada, así que nada rebaja un rechazo limpio a uno sucio: la llamada sigue adelante sobre bytes que nadie verificó. Esa es toda la razón por la que la CU volvió, y toda la razón por la que el canje necesita un argumento detrás."  # @src=b853ad4c2cc4
              a:
                # | Real default-on runtime safety nets came out of the binary; the CU and
                # | roughly 300 bytes are what those checks cost to run.
                label: "Redes de seguridad de runtime de verdad, prendidas por defecto, salieron del binario; la CU y alrededor de 300 bytes son lo que costaba correr esas verificaciones."  # @src=99654c8b41c4
                # | Ownership matching, tag matching, arithmetic that raises instead of
                # | truncating: that is the list, and it is worth saying out loud before you
                # | argue past it. Anchor's own 300-byte figure is measured on its benchmark
                # | program, so treat it as an order of magnitude rather than your number.
                feedback: "Coincidencia de propiedad, coincidencia de tag, aritmética que levanta un error en vez de truncar: esa es la lista, y vale decirla en voz alta antes de argumentar más allá de ella. La propia cifra de 300 bytes de Anchor está medida sobre su programa de benchmark, así que trátala como un orden de magnitud y no como tu número."  # @src=89aeb94c1fd8
              c:
                # | The Mollusk harness is what changed: `guardrails` gates test-time
                # | account checks, so the deployed program still runs them at full cost.
                label: "El banco de pruebas de Mollusk es lo que cambió: `guardrails` le hace de barrera a las verificaciones de cuenta en tiempo de prueba, así que el programa desplegado igual las corre a costo completo."  # @src=1175b78e9273
                # | Mollusk has no `guardrails` knob; the feature belongs to `anchor-lang`
                # | and is forwarded through your program crate's `Cargo.toml`. It changes
                # | the compiled `.so` you deploy, not the harness that measures it, which
                # | is why the byte size on disk is part of the reading.
                feedback: "Mollusk no tiene ninguna perilla de `guardrails`; el feature pertenece a `anchor-lang` y se reenvía a través del `Cargo.toml` de tu crate de programa. Cambia el `.so` compilado que despliegas, no el banco de pruebas que lo mide, que es por lo que el tamaño en bytes en el disco es parte de la lectura."  # @src=1a596c9e83b8
              b:
                # | Debug assertions are what got stripped: `guardrails` gates a debug-build
                # | lint, so the release build was already running without those checks.
                label: "Las aserciones de debug son lo que se sacó: `guardrails` le hace de barrera a un lint de build de debug, así que el build de release ya estaba corriendo sin esas verificaciones."  # @src=7ab4c4d62fee
                # | Tempting because rustc's overflow checks do default to debug builds,
                # | though that is a per-profile manifest setting and this course's
                # | workspace pins them on for release too. `guardrails` is a different
                # | thing again: an Anchor V2 crate feature compiled into every profile. Had
                # | the release build already been skipping those checks, nothing could have
                # | shrunk when you turned the feature off.
                feedback: "Tentador porque las verificaciones de overflow de rustc sí vienen por defecto en los builds de debug, aunque eso es una configuración del manifest por perfil y el workspace de este curso las fija prendidas también para release. `guardrails` es otra cosa distinta: un feature de crate de Anchor V2 compilado en todos los perfiles. Si el build de release ya se hubiera estado salteando esas verificaciones, nada podría haberse encogido cuando apagaste el feature."  # @src=024cc04363fd
          const-rent:
            # | You enabled `const-rent` and account-creation got cheaper. What did it save,
            # | and what is the fine print you must carry?
            prompt: "Prendiste `const-rent` y la creación de cuentas salió más barata. ¿Qué ahorró, y cuál es la letra chica que tienes que cargar?"  # @src=00dbe7b21d6f
            # | const-rent folds the rent constant at compile time, saving ~85-90 CU per
            # | account-creation CPI. The catch, stated in Anchor's own Cargo.toml comment:
            # | the folded constant drifts if the rent formula changes, which is why it
            # | cites SIMD-0194 and why you carry a re-verify note. Note also which
            # | instruction the lever touches, account-creation CPIs like `init`, not the
            # | trade handler, so measuring the swap after flipping it shows a delta of zero
            # | and teaches you the wrong thing.
            explanation: "const-rent pliega la constante de rent en tiempo de compilación, y ahorra ~85-90 CU por CPI de creación de cuenta. El detalle, dicho en el propio comentario del Cargo.toml de Anchor: la constante plegada se va a la deriva si la fórmula de rent cambia, que es por lo que cita SIMD-0194 y por lo que cargas una nota de volver a verificar. Fíjate también en qué instrucción toca la palanca, las CPI de creación de cuenta como `init`, no el handler del canje, así que medir el swap después de voltearlo muestra un delta de cero y te enseña la cosa equivocada."  # @src=8d73fc5046ac
            options:                 # source order — keep it
              c:
                # | It marks created accounts rent-exempt without funding them, so the payer
                # | keeps the lamports that would have gone into the deposit.
                label: "Marca las cuentas creadas como exentas de alquiler sin fondearlas, así que quien paga se queda con los lamports que habrían ido al depósito."  # @src=172fee3e4187
                # | `const-rent` changes neither what rent is owed nor who funds it: the new
                # | account still needs its full rent-exempt deposit or it cannot survive.
                # | All it removes is the runtime work of deriving that minimum from the
                # | account's byte size.
                feedback: "`const-rent` no cambia ni cuánto rent se debe ni quién lo fondea: la cuenta nueva igual necesita su depósito exento de alquiler completo o no puede sobrevivir. Todo lo que quita es el trabajo de runtime de derivar ese mínimo a partir del tamaño en bytes de la cuenta."  # @src=f59d29ba9fac
              d:
                # | It folds the rent-exempt minimum at compile time, and in practice it
                # | lands once your whole graph opts into it.
                label: "Pliega el mínimo exento de alquiler en tiempo de compilación, y en la práctica aterriza una vez que todo tu grafo hace opt-in."  # @src=84e3b6f68ea1
                # | The fold is right and the precondition is the guardrails lesson read
                # | backwards. Cargo features are additive, so turning one ON needs only
                # | your own edge to ask for it; unification is what vetoed the guardrails
                # | removal and it has nothing to veto here. The fine print is drift, not
                # | consensus.
                feedback: "El plegado está bien y la precondición es la lección de guardrails leída al revés. Los features de Cargo son aditivos, así que prender uno solo necesita que tu propio borde lo pida; la unificación es lo que vetó la quita de guardrails y acá no tiene nada que vetar. La letra chica es deriva, no consenso."  # @src=b74ea6ffd095
              a:
                # | It caches the `Rent` sysvar in a runtime static after the first
                # | `Rent::get()`, so every later account-creation CPI skips the sysvar
                # | read.
                label: "Cachea el sysvar `Rent` en un static de runtime después del primer `Rent::get()`, así que cada CPI de creación de cuenta posterior se saltea la lectura del sysvar."  # @src=4b4e57fd38c2
                # | A runtime cache is the wrong mental model: `const-rent` folds the
                # | rent-exempt minimum in at compile time, so nothing is memoized while the
                # | program runs. And it does carry a staleness risk: the frozen constant,
                # | not a cached read, is what can drift.
                feedback: "Un cache de runtime es el modelo mental equivocado: `const-rent` pliega el mínimo exento de alquiler en tiempo de compilación, así que nada queda memoizado mientras el programa corre. Y sí carga un riesgo de obsolescencia: la constante congelada, no una lectura cacheada, es lo que puede irse a la deriva."  # @src=af19d6903f76
              b:
                # | It folds the rent-exempt minimum in at compile time, and that frozen
                # | constant drifts if the rent formula ever changes.
                label: "Pliega el mínimo exento de alquiler en tiempo de compilación, y esa constante congelada se va a la deriva si la fórmula de rent llega a cambiar."  # @src=c20ea6256ecc
                # | That constant was baked in at build time, so if the formula moves later,
                # | your binary keeps quoting the old number. And it only touches account
                # | creation, so profiling an unrelated handler was never going to show it.
                feedback: "Esa constante quedó incrustada en tiempo de build, así que si la fórmula se mueve después, tu binario sigue citando el número viejo. Y solo toca la creación de cuentas, así que perfilar un handler que no tiene nada que ver nunca iba a mostrarlo."  # @src=4faa0483386e
          one-change:
            # | You changed three things at once and total CU dropped nicely. Why is that
            # | still a failed optimization, in the loop's terms?
            prompt: "Cambiaste tres cosas a la vez y la CU total bajó lindo. ¿Por qué eso sigue siendo una optimización fallida, en los términos del loop?"  # @src=6c69d1afb523
            # | The whole point of the measured loop is causal clarity: change exactly one
            # | thing between measurements so the delta is attributable. Three changes at
            # | once could hide a regression cancelled by a larger win, and you would ship
            # | all three blind and carry the regression forever. The fix is not a better
            # | profiler; it is going back and isolating the flags one build at a time.
            explanation: "El punto entero del loop medido es la claridad causal: cambia exactamente una cosa entre mediciones para que el delta sea atribuible. Tres cambios a la vez podrían esconder una regresión cancelada por una ganancia más grande, y entregarías los tres a ciegas y cargarías la regresión para siempre. El arreglo no es un profiler mejor; es volver y aislar los flags un build a la vez."  # @src=6d60f4187617
            options:                 # source order — keep it
              b:
                # | Mollusk's reading is only trustworthy when one change is compiled in,
                # | because the harness attributes CU per enabled feature flag.
                label: "La lectura de Mollusk es confiable solo cuando hay un cambio compilado adentro, porque el banco de pruebas atribuye CU por feature flag prendido."  # @src=02d221d720bf
                # | Mollusk just totals the compute units the instruction consumed; it has
                # | no notion of feature flags and attributes nothing to them. The
                # | measurement was fine; the experiment design is what broke.
                feedback: "Mollusk nada más suma las unidades de cómputo que consumió la instrucción; no tiene noción de los feature flags y no les atribuye nada. La medición estuvo bien; el diseño del experimento es lo que se rompió."  # @src=8925e8970117
              d:
                # | The delta is fine as long as you record which three changes produced it,
                # | which the loop does ask for.
                label: "El delta está bien siempre que registres qué tres cambios lo produjeron, que es algo que el loop sí pide."  # @src=8f212aeb45e2
                # | Writing the three down is bookkeeping, and bookkeeping is not
                # | attribution. The loop asks you to write down which *single* change
                # | caused a delta, because that is the only claim a two-number comparison
                # | can support. Three names beside one number still leaves you unable to
                # | say which of them was the regression.
                feedback: "Anotar los tres es contabilidad, y la contabilidad no es atribución. El loop te pide anotar qué *único* cambio causó un delta, porque esa es la única afirmación que puede sostener una comparación de dos números. Tres nombres al lado de un número igual te deja sin poder decir cuál de ellos era la regresión."  # @src=3a84fadb2b52
              a:
                # | Nothing failed: with all three changes shipping together, the net CU
                # | delta is in practice the number that reaches users.
                label: "Nada falló: con los tres cambios entregándose juntos, el delta neto de CU es en la práctica el número que llega a los usuarios."  # @src=574983ec221d
                # | Users do feel the net, but you now carry an unattributed change set: a
                # | regression cancelled out by two wins ships invisibly and stays forever,
                # | because you never isolated it.
                feedback: "Los usuarios sí sienten el neto, pero ahora cargas un conjunto de cambios sin atribuir: una regresión cancelada por dos ganancias se entrega invisible y se queda para siempre, porque nunca la aislaste."  # @src=73c5a4ca8bda
              c:
                # | The delta is a sum over three variables, so no single change owns it and
                # | a regression can hide inside the win.
                label: "El delta es una suma sobre tres variables, así que ningún cambio solo es su dueño y una regresión puede esconderse adentro de la ganancia."  # @src=025efff47191
                # | One net figure attributes to nothing. A regression covered by two wins
                # | ships invisibly and then lives there; no tool fixes that, because it's
                # | an experiment-design problem and the cure is one rebuild per variable.
                feedback: "Una sola cifra neta no atribuye a nada. Una regresión tapada por dos ganancias se entrega invisible y después vive ahí; ninguna herramienta arregla eso, porque es un problema de diseño de experimento y la cura es un rebuild por variable."  # @src=4f7fb5598b0d
          range-not-digit:
            # | const-rent's saving is quoted as ~85-90 CU, not a single number. Why does
            # | the course refuse to freeze one digit here?
            prompt: "El ahorro de const-rent se cita como ~85-90 CU, no como un número solo. ¿Por qué el curso se niega a congelar un dígito acá?"  # @src=5a3e43a228ba
            # | Anchor's own sources give ~85 in one place and ~90 in another for the same
            # | const-rent saving, and the number can drift if the rent formula changes
            # | (SIMD-0194). Freezing one digit would be false precision, so the course
            # | prints the range with a re-verify note, the same reason it never froze the
            # | 8.8x benchmark multiplier. Read both citations before quoting either; they
            # | sit a few lines apart in a repo you already have checked out, one in
            # | `anchor-lang`'s Cargo.toml feature comment and one in the V2 changelog entry
            # | that introduced the flag.
            explanation: "Las propias fuentes de Anchor dan ~85 en un lugar y ~90 en otro para el mismo ahorro de const-rent, y el número puede irse a la deriva si la fórmula de rent cambia (SIMD-0194). Congelar un dígito sería falsa precisión, así que el curso imprime el rango con una nota de volver a verificar, por la misma razón por la que nunca congeló el multiplicador de benchmark de 8.8x. Lee las dos citas antes de citar cualquiera de ellas; están a unas pocas líneas de distancia en un repo del que ya tienes un checkout, una en el comentario del feature en el Cargo.toml de `anchor-lang` y otra en la entrada del changelog de V2 que introdujo el flag."  # @src=ca52e7a85de3
            options:                 # source order — keep it
              c:
                # | The saving scales with the created account's byte size, so it is a range
                # | across the sizes a program can allocate.
                label: "El ahorro escala con el tamaño en bytes de la cuenta creada, así que es un rango a lo largo de los tamaños que un programa puede asignar."  # @src=f34711d5dc65
                # | The rent-exempt minimum does depend on byte size, but the computation
                # | `const-rent` removes costs about the same whatever that size is, which
                # | is why the figure is quoted per account-creation CPI. The ~85 to ~90
                # | spread comes from two Anchor sources disagreeing, plus drift risk.
                feedback: "El mínimo exento de alquiler sí depende del tamaño en bytes, pero el cómputo que quita `const-rent` cuesta más o menos lo mismo sea cual sea ese tamaño, que es por lo que la cifra se cita por CPI de creación de cuenta. La diferencia de ~85 a ~90 viene de dos fuentes de Anchor que no coinciden, más el riesgo de deriva."  # @src=496ad70ac5ce
              a:
                # | Anchor's own sources quote it two ways, and the figure can drift if the
                # | rent formula moves.
                label: "Las propias fuentes de Anchor lo citan de dos maneras, y la cifra puede irse a la deriva si la fórmula de rent se mueve."  # @src=d0644a1a6b86
                # | Two maintainer-written places quote it differently, and the formula
                # | underneath may move besides, so a single digit printed across that would
                # | be precision the sources do not have.
                feedback: "Dos lugares escritos por los maintainers lo citan distinto, y además la fórmula de abajo puede moverse, así que un solo dígito impreso sobre todo eso sería precisión que las fuentes no tienen."  # @src=89a8e55ed5de
              b:
                # | Mollusk's CU reading varies run to run with the fixture's account
                # | ordering, so no single value would hold.
                label: "La lectura de CU de Mollusk varía de corrida a corrida con el orden de cuentas de la fixture, así que ningún valor solo se sostendría."  # @src=3694de5c697b
                # | CU is deterministic for a given program, input, and toolchain, so
                # | rerunning the same fixture gives you the same integer, which is what
                # | makes the whole measured loop work. The spread here is source
                # | disagreement plus drift risk, not run-to-run noise.
                feedback: "La CU es determinística para un programa, una entrada y un toolchain dados, así que volver a correr la misma fixture te da el mismo entero, que es lo que hace funcionar al loop medido entero. La diferencia acá es desacuerdo entre fuentes más riesgo de deriva, no ruido de corrida a corrida."  # @src=3b9c41d3db89
              d:
                # | Each figure was measured on a different program, so neither one
                # | transfers to yours.
                label: "Cada cifra se midió sobre un programa distinto, así que ninguna de las dos se transfiere a la tuya."  # @src=966cc68f5ed1
                # | Both numbers describe the same feature's saving on the same kind of
                # | call. One sits in the feature's own comment in anchor-lang's Cargo.toml,
                # | the other in the V2 changelog entry that introduced the flag, four lines
                # | apart in a repo you already have checked out. The spread is two
                # | maintainer-written sources disagreeing, plus the drift SIMD-0194 could
                # | cause.
                feedback: "Los dos números describen el ahorro del mismo feature sobre el mismo tipo de llamada. Uno está en el propio comentario del feature en el Cargo.toml de anchor-lang, el otro en la entrada del changelog de V2 que introdujo el flag, a cuatro líneas de distancia en un repo del que ya tienes un checkout. La diferencia es dos fuentes escritas por los maintainers que no coinciden, más la deriva que podría causar SIMD-0194."  # @src=fde6c8e02585
  m07-l1:
    # | What V2 kills at compile time
    title: "Qué mata V2 en tiempo de compilación"  # @src=1718be062107
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | You mark two mutable Account<T> parameters in one instruction and spell the
            # | opt-out as plain `dup` (no `unsafe`), then run `anchor build` in V2. What
            # | happens?
            prompt: "Marcas dos parámetros Account<T> mutables en una instrucción y escribes el opt-out como `dup` simple (sin `unsafe`), y después corres `anchor build` en V2. ¿Qué pasa?"  # @src=e1af38fd8c30
            # | In V2, opting out of duplicate-mutable protection is spelled `unsafe(dup)`;
            # | writing bare `dup` is a compile error that names the fix. The MUT_MASK
            # | bitset is computed at compile time; the duplicate check itself still runs in
            # | the dispatcher, but the compiler blocks the unsafe spelling before you ever
            # | get there.
            explanation: "En V2, salirse de la protección de duplicate-mutable se escribe `unsafe(dup)`; escribir `dup` pelado es un error de compilación que nombra el arreglo. El bitset MUT_MASK se computa en tiempo de compilación; la verificación de duplicados en sí sigue corriendo en el dispatcher, pero el compilador bloquea la escritura unsafe antes de que llegues ahí."  # @src=8489a291ceee
            options:                 # source order — keep it
              a:
                # | The program fails to compile: plain `dup` is rejected and the error
                # | tells you to write `unsafe(dup)`.
                label: "El programa falla al compilar: el `dup` simple se rechaza y el error te dice que escribas `unsafe(dup)`."  # @src=6ff9982ca148
                # | Mask and runtime walk are both still there. The build just never gets
                # | far enough to use either, and the diagnostic hands you the spelling,
                # | which is rather the point of demanding it.
                feedback: "La máscara y el recorrido de runtime los dos siguen ahí. El build simplemente nunca llega lo bastante lejos para usar ninguno de los dos, y el diagnóstico te entrega la escritura, que es justamente el punto de exigirla."  # @src=bdd31ac431f4
              d:
                # | The build usually succeeds, because plain `dup` is accepted as an alias
                # | for the unsafe spelling.
                label: "El build normalmente tiene éxito, porque el `dup` simple se acepta como un alias de la escritura unsafe."  # @src=eb188141c6d7
                # | The ugliness is the feature. If the safe-looking spelling built, you
                # | could opt out of duplicate-mutable protection by typo and never know,
                # | which is how v1 programs lost the check by accident. V2 refuses the
                # | short spelling outright so that a green build means nobody disabled this
                # | without writing the word unsafe.
                feedback: "La fealdad es la feature. Si la escritura que parece segura compilara, podrías salirte de la protección de duplicate-mutable por un typo y no saberlo nunca, que es cómo los programas de v1 perdieron la verificación por accidente. V2 rechaza la escritura corta de entrada para que un build verde quiera decir que nadie apagó esto sin escribir la palabra unsafe."  # @src=1a9125ced262
              c:
                # | It compiles with a warning, because MUT_MASK is computed only for
                # | `zero_copy` accounts and skips ordinary slots.
                label: "Compila con una advertencia, porque MUT_MASK se computa solo para cuentas `zero_copy` y se saltea los slots comunes."  # @src=49621bb6dd8b
                # | MUT_MASK is a compile-time const over every account the instruction
                # | declares, and on V2 defaults every `Account<T>` is already a Pod
                # | zero-copy view, so there is no ordinary slot for it to skip. The missing
                # | `unsafe` is a hard error, not a warning.
                feedback: "MUT_MASK es un const de tiempo de compilación sobre cada cuenta que declara la instrucción, y sobre los defaults de V2 cada `Account<T>` ya es una vista zero-copy Pod, así que no hay slot común que saltear. El `unsafe` que falta es un error duro, no una advertencia."  # @src=25ca1a164691
              b:
                # | It compiles, and the duplicate-mutable check simply fires at runtime in
                # | the dispatcher, exactly as it did in v1.
                label: "Compila, y la verificación de duplicate-mutable simplemente se dispara en runtime en el dispatcher, exactamente como lo hacía en v1."  # @src=f5e978778064
                # | Tempting because the dispatcher's runtime dup check really does still
                # | exist in V2, but you never reach it, because the bare-`dup` spelling
                # | fails the build before a binary exists.
                feedback: "Tentador porque la verificación de dup en runtime del dispatcher de verdad sigue existiendo en V2, pero nunca llegas a ella, porque la escritura de `dup` pelado hace fallar el build antes de que exista un binario."  # @src=ca494442c372
          q2:
            # | You try the classic type-cosplay attack: load a Pool account's bytes as a
            # | FeeConfig in V2. Why does it no longer type-check?
            prompt: "Intentas el ataque clásico de type cosplay: cargar los bytes de una cuenta Pool como un FeeConfig en V2. ¿Por qué ya no pasa la verificación de tipos?"  # @src=4e123f518f75
            # | V2's Account<T> is zero-copy and requires T: Pod; the bytes are cast to the
            # | declared type. Two clocks are running here, and the runtime one is what
            # | stops a smuggled account: at load, a Pool handed to an `Account<FeeConfig>`
            # | slot is still rejected by the runtime discriminator check exactly as in v1.
            # | What V2 adds is closing the byte-level escape hatch: with `Account<T>` as a
            # | Pod view there is no `try_from_slice` on a loose slice to reach for, and the
            # | deliberate `bytemuck::from_bytes::<FeeConfig>(&data[8..])` cast you would
            # | need instead is something a reviewer can grep for in one pass.
            explanation: "El Account<T> de V2 es zero-copy y exige T: Pod; los bytes se castean al tipo declarado. Acá corren dos relojes, y el de runtime es lo que detiene una cuenta de contrabando: en el load, un Pool entregado a un slot `Account<FeeConfig>` sigue siendo rechazado por la verificación del discriminator en runtime exactamente como en v1. Lo que V2 agrega es cerrar la salida de emergencia al nivel de los bytes: con `Account<T>` como una vista Pod no hay `try_from_slice` sobre un slice suelto al que recurrir, y el cast deliberado de `bytemuck::from_bytes::<FeeConfig>(&data[8..])` que necesitarías en cambio es algo que un revisor puede grepear en una sola pasada."  # @src=664e93e9bcae
            options:                 # source order — keep it
              b:
                # | `Account<T>` requires `T: Pod`, so the declared type fixes the layout
                # | and the types never interconvert.
                label: "`Account<T>` exige `T: Pod`, así que el tipo declarado fija el layout y los tipos nunca se interconvierten."  # @src=92086d1bdbff
                # | At load the runtime tag check still rejects the swap, exactly as it
                # | always did. What the rewrite adds is closing the loose-slice route, so
                # | the only path left is a deliberate cast one grep away from any reviewer.
                feedback: "En el load la verificación de la etiqueta en runtime sigue rechazando el cambiazo, exactamente como siempre lo hizo. Lo que agrega la reescritura es cerrar la ruta del slice suelto, así que el único camino que queda es un cast deliberado a un grep de distancia de cualquier revisor."  # @src=52cb56f91796
              c:
                # | `Account<T>` writes the type's name into the header and compares it
                # | against `T` on every load.
                label: "`Account<T>` escribe el nombre del tipo en el header y lo compara contra `T` en cada load."  # @src=49494d8077ce
                # | This was one of the naive v1-era fixes the lesson rules out: it stores
                # | an extra field and still checks at runtime. V2 stores no type names.
                # | Discriminators remain the sha256 default, and the new guarantee is Pod
                # | typing at compile time.
                feedback: "Este era uno de los arreglos ingenuos de la era v1 que la lección descarta: guarda un campo extra y sigue verificando en runtime. V2 no guarda ningún nombre de tipo. Los discriminators siguen siendo el default sha256, y la garantía nueva es tipado Pod en tiempo de compilación."  # @src=a505ad451a7d
              a:
                # | V2 re-checks the discriminator on every field access, so the mismatch is
                # | caught as you read a field.
                label: "V2 re-verifica el discriminator en cada acceso a un campo, así que el desajuste se agarra a medida que lees un campo."  # @src=0ea91e627449
                # | The block is at compile time, not a new per-field runtime check;
                # | discriminators are unchanged by default.
                feedback: "El bloqueo es en tiempo de compilación, no una verificación nueva de runtime por campo; los discriminators están sin cambios por defecto."  # @src=de9b2f2361de
              d:
                # | V2 moved the discriminator check into the type system, so a mismatched
                # | account tag now fails the build instead of the load.
                label: "V2 movió la verificación del discriminator hacia el sistema de tipos, así que una etiqueta de cuenta desajustada ahora hace fallar el build en vez del load."  # @src=bf9859b95eb4
                # | That is the overclaim this class invites. The discriminator is still a
                # | runtime check at load, and it still rejects a Pool handed to an
                # | `Account<FeeConfig>` slot exactly as v1 did. What moved to compile time
                # | is the Pod typing that closes the byte-level route around that check,
                # | not the check itself.
                feedback: "Esa es la exageración que invita esta clase. El discriminator sigue siendo una verificación de runtime en el load, y sigue rechazando un Pool entregado a un slot `Account<FeeConfig>` exactamente como lo hacía v1. Lo que se movió a tiempo de compilación es el tipado Pod que cierra la ruta al nivel de los bytes alrededor de esa verificación, no la verificación en sí."  # @src=bfce175130a9
          q3:
            # | You hold a typed reference to an account and try to read its fields while a
            # | `CpiHandle` for that account is still live. What does V2 do?
            prompt: "Sostienes una referencia tipada a una cuenta e intentas leer sus campos mientras un `CpiHandle` para esa cuenta todavía está vivo. ¿Qué hace V2?"  # @src=8b16ca06b321
            # | A CpiHandle is a borrow-tracked handle; while it is alive it holds a Rust
            # | borrow that prevents typed access to the same data. The stale-after-CPI
            # | class that `.reload()` used to paper over is now a compile error.
            explanation: "Un CpiHandle es un handle con borrow rastreado; mientras está vivo sostiene un borrow de Rust que impide el acceso tipado a esos mismos datos. La clase de obsoleto-después-de-CPI que `.reload()` solía tapar ahora es un error de compilación."  # @src=5d2a7ed18f0b
            options:                 # source order — keep it
              a:
                # | Runtime panic: V2 detects the aliasing borrow when the CPI returns and
                # | aborts before the stale read.
                label: "Panic en runtime: V2 detecta el borrow aliasado cuando la CPI retorna y aborta antes de la lectura obsoleta."  # @src=6d6ba3a7102f
                # | Plausible if you picture CpiHandle as a RefCell-style runtime guard like
                # | v1's account borrows. It is not: the borrow is an ordinary Rust borrow
                # | the compiler tracks, so the read is rejected at build time and no CPI
                # | ever runs.
                feedback: "Plausible si imaginas el CpiHandle como una guarda de runtime al estilo RefCell como los borrows de cuenta de v1. No lo es: el borrow es un borrow común de Rust que el compilador rastrea, así que la lectura se rechaza en tiempo de build y ninguna CPI llega a correr."  # @src=66f03cd93012
              c:
                # | Compile error: the CpiHandle holds a Rust borrow that excludes typed
                # | data access until the handle is dropped.
                label: "Error de compilación: el CpiHandle sostiene un borrow de Rust que excluye el acceso tipado a los datos hasta que el handle se dropea."  # @src=1dd4a9514305
                # | An ordinary compile-time borrow, not a runtime cell. Nothing executes
                # | and no invocation is issued at all. A class that used to need a
                # | remembered call is simply not writable now.
                feedback: "Un borrow común de tiempo de compilación, no una celda de runtime. Nada se ejecuta y no se emite ninguna invocación. Una clase que solía necesitar una llamada recordada simplemente ya no es escribible."  # @src=4fb3405ce939
              b:
                # | It works, and as in v1 you must call `.reload()` on the account after
                # | the CPI to see the updated bytes.
                label: "Funciona, y como en v1 tienes que llamar `.reload()` sobre la cuenta después de la CPI para ver los bytes actualizados."  # @src=02a2f74ea70b
                # | This is exactly the v1 muscle memory V2 retires. The stale read no
                # | longer compiles while the handle is live, and once the handle is dropped
                # | the typed view is already fresh, so there is no `.reload()` step to
                # | remember.
                feedback: "Esta es exactamente la memoria muscular de v1 que V2 retira. La lectura obsoleta ya no compila mientras el handle está vivo, y una vez que el handle se dropea la vista tipada ya está fresca, así que no hay paso de `.reload()` que recordar."  # @src=225c774cc971
              d:
                # | It compiles: the handle is dropped when the CPI returns, and V2
                # | refreshes the typed account for you.
                label: "Compila: el handle se dropea cuando la CPI retorna, y V2 refresca la cuenta tipada por ti."  # @src=2497a8542f87
                # | Nothing gets refreshed on your behalf, and the read you wrote sits
                # | inside the handle's borrow window rather than after it. The class is not
                # | solved by the framework doing the reload silently; it is solved by the
                # | read not building until the handle is gone, at which point the typed
                # | view was never stale to begin with.
                feedback: "Nada se refresca en tu nombre, y la lectura que escribiste queda adentro de la ventana de borrow del handle y no después de ella. La clase no se resuelve porque el framework haga el reload calladamente; se resuelve porque la lectura no compila hasta que el handle se fue, momento en el que la vista tipada nunca estuvo obsoleta para empezar."  # @src=d32a0f5ba4a8
          q4:
            # | A teammate concludes 'V2 is secure by default, so we can skip the audit.'
            # | Grounded in this lesson, what is the best response?
            prompt: "Un compañero concluye 'V2 es seguro por defecto, así que podemos saltarnos la auditoría'. Basado en esta lección, ¿cuál es la mejor respuesta?"  # @src=fa0de4a33c55
            # | V2 turns type cosplay, dup-mut, and CPI aliasing into compile errors, and
            # | leaves bump recalculation compiling but inert, a real gain. But it is an
            # | unaudited alpha, one whose own README leans the other way ('v2 is secure by
            # | default for users'), so the defaults-are-no-substitute-for-review discipline
            # | has to come from you, not the project, and whole classes (signer/owner,
            # | arithmetic, logic) survive. Compile-time wins narrow the attack surface;
            # | they do not retire the audit. Keep the ratio in view: four of the Solana
            # | Foundation's eleven taxonomy classes were re-run here, and the headline
            # | numbers from PR #4914 (94% bytecode, 8.8x compute, both revised down) are
            # | size-and-speed claims, never security ones. The second-order risk is worse
            # | than any single bug: a team that believes the compiler catches its security
            # | bugs reviews less precisely exactly where the compiler is silent, which is
            # | where the money leaves.
            explanation: "V2 convierte type cosplay, dup-mut y aliasing de CPI en errores de compilación, y deja el recálculo de bump compilando pero inerte, una ganancia de verdad. Pero es un alpha no auditado, uno cuyo propio README se inclina para el otro lado ('v2 is secure by default for users'), así que la disciplina de los-defaults-no-son-sustituto-de-la-revisión tiene que venir de ti, no del proyecto, y clases enteras (firmante/dueño, aritmética, lógica) sobreviven. Las ganancias de tiempo de compilación angostan la superficie de ataque; no retiran la auditoría. Mantén la razón a la vista: cuatro de las once clases de la taxonomía de la Solana Foundation se re-corrieron acá, y los números del titular del PR #4914 (94% de bytecode, 8.8x de compute, los dos revisados a la baja) son afirmaciones de tamaño-y-velocidad, nunca de seguridad. El riesgo de segundo orden es peor que cualquier bug aislado: un equipo que cree que el compilador agarra sus bugs de seguridad revisa menos precisamente exactamente donde el compilador está callado, que es de donde se va el dinero."  # @src=b6f9d7c4fa9f
            options:                 # source order — keep it
              d:
                # | Agree in part: with those four classes dead, the audit can typically
                # | narrow to the arithmetic and logic bugs the compiler misses.
                label: "Está de acuerdo en parte: con esas cuatro clases muertas, la auditoría típicamente puede angostarse a los bugs de aritmética y de lógica que el compilador se pierde."  # @src=d6510ae307f3
                # | Narrowing is exactly the move that compounds the risk, and the
                # | arithmetic is off too: three classes are compile errors and the fourth
                # | still builds, out of eleven in the taxonomy. Signer and owner checks and
                # | account substitution are not on your shortlist and they are where
                # | escrows drain. Compile-time wins reallocate where you look; they do not
                # | license looking at less.
                feedback: "Angostar es exactamente la jugada que compone el riesgo, y la aritmética también está mal: tres clases son errores de compilación y la cuarta todavía compila, de once en la taxonomía. Las verificaciones de firmante y de dueño y la sustitución de cuentas no están en tu lista corta y son las que drenan escrows. Las ganancias de tiempo de compilación reasignan dónde miras; no autorizan mirar menos."  # @src=3aca9c14132f
              c:
                # | Wrong direction: V2 removes no vulnerability classes; the 8.8x figure in
                # | PR #4914 was a compute benchmark, not a security claim.
                label: "Dirección equivocada: V2 no saca ninguna clase de vulnerabilidad; la cifra de 8.8x del PR #4914 era un benchmark de compute, no una afirmación de seguridad."  # @src=469c21be2ae1
                # | The 8.8x number really is a CU benchmark and should never be cited as
                # | security, which is what makes this tempting, but V2 does convert type
                # | cosplay, dup-mut, and CPI aliasing into compile errors. The point is
                # | that it does not convert all eleven classes.
                feedback: "El número de 8.8x de verdad es un benchmark de CU y nunca debería citarse como seguridad, que es lo que vuelve esto tentador, pero V2 sí convierte type cosplay, dup-mut y aliasing de CPI en errores de compilación. El punto es que no convierte las once clases."  # @src=65a9ad7039f4
              b:
                # | That is right: type cosplay, dup-mut, CPI aliasing, and bump recalc are
                # | all ruled out by the V2 defaults, so review adds little.
                label: "Eso es correcto: type cosplay, dup-mut, aliasing de CPI y recálculo de bump quedan todos descartados por los defaults de V2, así que la revisión agrega poco."  # @src=7d62d960b300
                # | Three of those are genuine compile errors and bump recalc merely
                # | re-derives the canonical bump the account stored, but missing
                # | signer/owner checks, account substitution, and arithmetic bugs all still
                # | compile and run, and the framework itself is unaudited.
                feedback: "Tres de esos son errores de compilación genuinos y el recálculo de bump solo re-deriva el bump canónico que guardó la cuenta, pero las verificaciones de firmante/dueño que faltan, la sustitución de cuentas y los bugs de aritmética todos siguen compilando y corriendo, y el framework en sí no está auditado."  # @src=43d91a55cee3
              a:
                # | Three of the four became compile errors and the fourth is inert, but V2
                # | is an unaudited alpha, so the audit stands.
                label: "Tres de los cuatro se volvieron errores de compilación y el cuarto es inerte, pero V2 es un alpha no auditado, así que la auditoría sigue en pie."  # @src=112097262282
                # | Four of eleven classes touched; the other seven compile and run exactly
                # | as before. What compounds is cultural: a compiler you trust thins review
                # | precisely where it cannot see.
                feedback: "Cuatro de once clases tocadas; las otras siete compilan y corren exactamente como antes. Lo que se compone es cultural: un compilador en el que confías adelgaza la revisión precisamente donde él no puede ver."  # @src=a32bc204ecbb
  m07-l2:
    # | What still bites you (exploit then patch)
    title: "Lo que todavía te muerde (explota y después parchea)"  # @src=b96d31cb53a9
    blocks:
      patch-withdraw-guard:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Access control comes first: `settle_withdraw` already returns -1 when
          # | `is_authority` says no — make `is_authority` actually say no.
          0: "El control de acceso viene primero: `settle_withdraw` ya devuelve -1 cuando `is_authority` dice que no — haz que `is_authority` de verdad diga que no."  # @src=6956cf5d098c
          # | Unsigned subtraction underflows; in `checked_remaining`, `u64::checked_sub`
          # | returns None exactly when amount > balance.
          1: "La resta sin signo hace underflow; en `checked_remaining`, `u64::checked_sub` devuelve None exactamente cuando amount > balance."  # @src=e8ce82ca738f
          # | An address is 32 bytes with no meaningful ordering: equality over ALL 32
          # | bytes, never a prefix, a single byte, or < / >. In a `const fn`, `==` on
          # | arrays is a trait call the compiler refuses — walk the bytes with a `while`
          # | loop.
          2: "Una dirección son 32 bytes sin ningún orden con significado: igualdad sobre LOS 32 bytes, nunca un prefijo, un solo byte, ni < / >. En una `const fn`, `==` sobre arrays es una llamada a trait que el compilador rechaza — recorre los bytes con un loop `while`."  # @src=8e4f9974e8a0
        tests:                      # keyed by test case id
          t1:
            # | The authority withdrawing within balance returns the new balance
            description: "La autoridad haciendo un withdraw dentro del balance devuelve el balance nuevo"  # @src=36de04158d2b
          t2:
            # | A withdraw requested by a non-authority caller is rejected with -1
            description: "Un withdraw pedido por quien llama sin ser la autoridad es rechazado con -1"  # @src=a3a2a532afee
          t3:
            # | An over-withdraw that would underflow the balance is rejected with -2
            description: "Un over-withdraw que haría underflow del balance es rechazado con -2"  # @src=3982eb749058
          t4:
            # | An exact-balance withdraw by the authority returns zero
            description: "Un withdraw de balance exacto hecho por la autoridad devuelve cero"  # @src=36b3608a06df
          t5:
            # | A caller that sorts BELOW the authority is still not the authority: an
            # | ordering comparison passes t2 and fails here, because addresses have no
