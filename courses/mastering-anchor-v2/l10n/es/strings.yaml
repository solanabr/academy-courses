            explanation: "Un PDA firma presentando las seeds exactas de las que fue derivado más su bump canónico. Anchor saca ese byte del `vault.bump` guardado para un esquema de seeds como este — el const de tiempo de macro se aplica solo cuando cada seed es un literal de byte, y la clave de authority no lo es; nativo, lo guardas y le entregas las seeds + el slice de bump a invoke_signed. En el lab eso es `[Seed::from(b\"vault\"), Seed::from(self.authority.key().as_ref()), Seed::from(&bump)]`, con el `bump` leído de vuelta de `cfg[33]`. Equivócate en el array en orden o en contenido y el runtime reconstruye otra dirección, se niega a firmar, y devuelve InvalidSeeds — acá no hay crédito parcial del runtime."  # @src=4ddcd5034620
