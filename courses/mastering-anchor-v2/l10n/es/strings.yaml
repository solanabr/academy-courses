                label: "Reemplazó la verificación de dueño; sin ella una cuenta de la que otro programa es dueño puede pasarse al slot de config y leerse como un vault."  # @src=e04d4a1c0102
                # | Ownership is gate 2, `config.is_owned_by(&crate::ID)`, and it is still
