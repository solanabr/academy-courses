                feedback: "El flamegraph es un SVG estático escrito después de que termina la corrida entera. El ancho del frame te dice dónde se acumuló el costo; no hay frame vivo para pausar y no se captura ningún estado de registros en el archivo."  # @src=254d2187bc04
              b:
