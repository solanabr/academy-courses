                feedback: "`mut` es sobre el permiso de escritura, no sobre la identidad. El runtime escribe felizmente sobre la cuenta que haya pasado quien llama, así que un atacante igual sustituye su propia billetera y cobra el rent de `close = maker`."  # @src=e3218af5f8ca
              c:
                # | An explicit `address`, `owner`, or `constraint` check that pins which
                # | account is allowed here.
                label: "Una verificación `address`, `owner` o `constraint` explícita que fije qué cuenta está permitida acá."  # @src=31dda88c91eb
                # | An exact key beats a program id, which admits every account that program
