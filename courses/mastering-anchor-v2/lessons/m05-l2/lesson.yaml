id: lesson-mav2-m05-l2
slug: m05-l2
title: "Build the token-ticket swap"
skills:
  - solana-programs
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: cp-swap-out
    type: code
    language: rust
    starter: cp-swap-out/starter.rs
    solution: cp-swap-out/solution.rs
    tests: cp-swap-out/tests.json
    hints:
      - "amount_in_with_fee = amount_in * 997"
      - "out = (amount_in_with_fee * reserve_out) / (reserve_in * 1000 + amount_in_with_fee)"
      - "promote to u128 before multiplying so u64 reserves can't overflow"
  - key: check
    type: quiz
    questions:
      - id: m05-l2-q1
        prompt: "Your swap quote computes reserve_in * reserve_out for the invariant, and it panics on a large trade against a deep pool. Both reserves are u64. What's the fix?"
        multiSelect: false
        options:
          - id: a
            label: "Cap every reserve at u32::MAX at init so the product of two reserves always fits inside a u64."
            correct: false
            feedback: "A u32::MAX cap does make that one product fit, but it caps pool depth at about 4.3 billion base units and still leaves amount_in_with_fee * reserve_out unguarded. The defect is the width of the multiply, not the size of the reserves."
          - id: b
            label: "Cast both reserves to u128 before multiplying and use checked_mul, then divide down."
            correct: true
          - id: c
            label: "Switch reserve_in and reserve_out to i64 so an overflow wraps to a negative value you can test for."
            correct: false
            feedback: "Rust panics on overflow in debug and wraps in release, so there is no reliable negative to test for, and SPL token amounts are unsigned u64 anyway. A u128 intermediate with checked_mul is the pattern the lesson freezes into swap_out."
        explanation: "Two u64 reserves multiplied can exceed u64. The house pattern (and rust.md) is a u128 intermediate plus checked_mul: promote, multiply, divide back down to u64. That's exactly what the swap_out coding challenge exercises. The final cast back to u64 is safe because the output can never exceed reserve_out, which is already a u64."
      - id: m05-l2-q2
        prompt: "A trader sees a quote of 906 tickets, but between quote and execution the reserves shift and they'd only get 880. Your program still fills the trade. What did you forget?"
        multiSelect: false
        options:
          - id: a
            label: "A .reload() on both reserves after the input transfer, so the quote reads post-transfer balances."
            correct: false
            feedback: "This is 0.x muscle memory, and it fixes nothing here: the reserves moved before the transaction landed, so a fresh read still returns the degraded 880. V2 also holds a borrow through the live CpiHandle, so that typed read would not compile mid-CPI."
          - id: b
            label: "Marking both reserve accounts unsafe(dup) so V2's duplicate-mutable default won't reject the fill."
            correct: false
            feedback: "unsafe(dup) is the escape hatch for genuinely duplicated mutable accounts. reserve_arcade and reserve_ticket are distinct accounts holding different mints, so the default is already satisfied — and account aliasing has nothing to do with the price a trader receives."
          - id: c
            label: "The slippage guard: revert when the computed output is below the trader's min_out."
            correct: true
        explanation: "Without a min_out the trader accepts any fill, including one degraded by ordering (a sandwich). The slippage guard reverts when computed output < min_out — its shape reuses the escrow's conditional-release logic. It's the one piece of trader protection this teaching swap offers. The guard has to run after the quote and before either CPI, so nothing settles at a price the trader never agreed to."
      - id: m05-l2-q3
        prompt: "You route both swap directions through the same InterfaceAccount and the program rejects the instruction as a duplicate mutable account. What's the clean fix?"
        multiSelect: false
        options:
          - id: a
            label: "Give each side of the pool its own distinct reserve token account so no real duplication exists."
            correct: true
          - id: b
            label: "Add unsafe(dup) to the shared reserve field so V2 accepts one account serving both directions."
            correct: false
            feedback: "unsafe(dup) is an escape hatch for when duplication is genuinely intended. Collapsing both reserves into one account aliases the two sides of the curve and corrupts the k accounting — that's a design bug, not a case for opting out of the check."
          - id: c
            label: "Turn off the duplicate-mutable default with an anchor-lang Cargo feature, keeping one shared reserve."
            correct: false
            feedback: "There is no anchor-lang feature that disables the duplicate-mutable default; V2 made it the default precisely to catch this class of aliasing bug at validation time, before your handler ever runs. Fix the account layout instead."
        explanation: "A constant-product pool needs two separate reserves, so each side is its own token account — reserve_arcade and reserve_ticket, holding different mints, both with token::authority = pool — and the duplicate-mutable default is satisfied naturally. unsafe(dup) is only for deliberately duplicated accounts; reaching for it here would paper over a design error. Note the reserves are not R2 vault instances: a vault's ATA is owned by the vault PDA, while a reserve's authority must be the pool PDA."
      - id: m05-l2-q4
        prompt: "Between the input transfer_checked CPI and reading the pool's new balance, you try to keep a typed reference to the vault account. V2 refuses to compile. Why is that a feature?"
        multiSelect: false
        options:
          - id: a
            label: "A live CpiHandle holds a Rust borrow of the typed account, so a typed read during it cannot compile."
            correct: true
          - id: b
            label: "transfer_checked consumes the InterfaceAccount wrapper, so the typed account is gone once the CPI returns."
            correct: false
            feedback: "Nothing is consumed or destroyed: the CpiHandle only borrows the wrapper for the duration of the call, and reserve_ticket.amount reads fine again once the handle drops. Move the read after the transfer_checked call and the build goes green."
          - id: c
            label: "V2 requires a .reload() call before any typed .amount read, and the compiler enforces that ordering."
            correct: false
            feedback: "This inverts the change. .reload() was the 0.x remedy for stale deserialized data; V2 has no reload requirement and the compiler is enforcing a borrow, not a call ordering. The structural fix is to read both reserves up front, before any cpi_handle_mut() exists."
        explanation: "In v1, forgetting .reload() after a CPI meant acting on stale deserialized data. V2's CpiHandle holds a borrow, so the compiler rejects typed access during a live handle — the footgun becomes a compile error rather than a silent runtime bug that ships. You read reserves before you open the handle or after it closes, never during. That is why step 1 of the swap handler reads reserve_arcade.amount and reserve_ticket.amount into locals before any TransferChecked struct is built: the whole stale-read class is removed by the language, not by a call you must remember."
