id: lesson-mav2-m08-l2
slug: m08-l2
title: "Prove it: a verifiable build on devnet, and the authority trust surface"
skills:
  - solana-kit
  - solana-programs
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m08-l2-q1
        prompt: "You ran solana-verify build, deployed to devnet, and verify-from-repo reports a match. What exactly have you proven?"
        multiSelect: false
        options:
          - id: a
            label: "That the swap logic is free of exploitable bugs, because the verifier compiles and inspects the source"
            correct: false
            feedback: "The rebuild does compile your source, but it only hashes the output — it never reads the logic. A perfectly verifiable program can still drain its own vault; bug-freedom came from your audit and fuzz pass."
          - id: b
            label: "That the deployed devnet bytes were built from exactly this source at the pinned toolchain"
            correct: true
          - id: c
            label: "That the upgrade authority is locked, since a verified program's bytes can no longer be replaced"
            correct: false
            feedback: "Verification is orthogonal to authority: a verified program whose upgrade authority is still a hot keypair can be silently replaced tomorrow. Locking upgrades is a separate set-upgrade-authority or Squads step."
        explanation: "A verifiable build is a source-to-bytes proof under a pinned, deterministic toolchain. It proves provenance, not safety, and not anything about who controls upgrades."
      - id: m08-l2-q2
        prompt: "You try solana-verify remote submit-job for your devnet program and it won't produce a result. Why?"
        multiSelect: false
        options:
          - id: a
            label: "The program was never deployed, so there are no on-chain bytes for the job to hash"
            correct: false
            feedback: "A missing deploy would break the local verify-from-repo too. Here the program is deployed and the job still returns nothing, because the constraint is cluster scope, not a missing program account."
          - id: b
            label: "The Docker daemon isn't running, so the pinned image can't start the rebuild"
            correct: false
            feedback: "Docker is required for your local solana-verify build, and it fails fast with a daemon error. The remote job rebuilds on OtterSec's workers instead, so your daemon is not what stops it — cluster scope is."
          - id: c
            label: "The remote OtterSec registry path is mainnet-only and does not cover devnet"
            correct: true
        explanation: "The remote OtterSec submit-job path is mainnet-only. This course proves the build on devnet with the local verify-from-repo command; the remote flow is demonstrated and labelled beyond the course's cluster. What the registry adds is discoverability, not a stronger proof: OtterSec runs the build on their infrastructure and writes an on-chain record that explorers and wallets read for the verified badge. The trustless proof is the local one — you rebuild in the pinned image and compare the two hashes yourself."
      - id: m08-l2-q3
        prompt: "You're about to move upgrade authority to a Squads v4 multisig on mainnet. What's the honest trust caveat to tell your team?"
        multiSelect: false
        options:
          - id: a
            label: "One steward sits under the whole verify chain, and Squads v4 is immutable, so the handoff cannot be undone"
            correct: true
          - id: b
            label: "Squads v4 is upgradeable, so a bad authority move can be rolled back later by patching the multisig program itself"
            correct: false
            feedback: "Squads v4 has been immutable since Nov 2024 — nobody can patch it, which is the feature and also the caveat. The multisig you hand authority to cannot be swapped out from under you, and cannot be fixed either."
          - id: c
            label: "Once verify-from-repo reports a match, the only trust left is in the multisig members' own keys"
            correct: false
            feedback: "A match removes your need to trust the builder of your program, not the builder of the framework. The pinned image, the anchor-lang crates, and the registry are all still trusted — and the match says nothing about irreversibility."
        explanation: "Two honest caveats stack: a single steward (OtterSec) spans the framework, crates, and registry; and Squads v4 immutability makes authority endgames irreversible. Verify twice before you commit. The steward claim is checkable, not a rumor: OtterSec builds the Anchor framework and GPG-signs the v2 tag under trixter-osec, publishes the anchor-lang crates on crates.io and @anchor-lang/core on npm (repository field pointing at otter-sec since v1.1.1), and runs the verified-builds registry Anchor verifies against."
      - id: m08-l2-q4
        prompt: "The pins table lists a Solana CLI version for the verifiable-build toolchain. A reader asks, 'is that the current Solana version?'"
        multiSelect: false
        options:
          - id: a
            label: "Yes — the pinned toolchain always tracks the newest stable Agave release at build time"
            correct: false
            feedback: "The build pin (Solana 3.1.10) and current stable (Agave v4.2.1 as of writing) drift apart on purpose. A pin that chased the newest release would be a moving toolchain, which is exactly the free variable that breaks the hash."
          - id: b
            label: "No — it's the local-CI/Docker toolchain pin, not a claim about the current release"
            correct: true
          - id: c
            label: "It's cosmetic — the Docker image ignores it and compiles against whatever toolchain your host has"
            correct: false
            feedback: "It's the opposite: solana-verify build compiles inside the image, so the hash is a function of the image plus your source, never of your host toolchain. That pin is what makes the bytes reproducible anywhere."
        explanation: "A verifiable build needs a pinned, deterministic toolchain, so the pins table records the local-CI/Docker version — never a claim about the current Solana release, which is tracked separately and re-verified at write."
