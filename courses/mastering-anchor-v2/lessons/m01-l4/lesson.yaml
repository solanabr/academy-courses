id: lesson-mav2-m01-l4
slug: m01-l4
title: "#[derive(Accounts)], dispatch, discriminators & errors"
skills:
  - anchor
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: discriminator-preimage
    type: code
    language: rust
    starter: discriminator-preimage/starter.rs
    solution: discriminator-preimage/solution.rs
    tests: discriminator-preimage/tests.json
    hints:
      - "An instruction handler is NOT hashed from \"instruction:\" — Anchor uses the \"global:\" namespace."
      - "Map the three item kinds to their prefixes, then concatenate the name."
  - key: check
    type: quiz
    questions:
      - id: m01-l4-q1
        prompt: "You pass the same account twice into one instruction, both marked mut, without unsafe(dup). What happens in V2, and where?"
        multiSelect: false
        options:
          - id: a
            label: "Rejected at runtime by the dispatcher's duplicate walk, before try_accounts loads any field"
            correct: true
            feedback: "The mask is static and the collision is not: which slots are writable is fixed when the struct compiles, but addresses only become comparable once a call arrives. Rejection lands before any field is deserialized."
          - id: b
            label: "It compiles and runs, and the second serialize-on-exit silently clobbers the first write"
            correct: false
            feedback: "That silent clobber is exactly the aliasing bug V2 closes: duplicate mutables are disallowed by default, so the call is rejected rather than letting the second write win."
          - id: c
            label: "It is a compile error: MUT_MASK detects that two fields of the same type are both marked mut"
            correct: false
            feedback: "MUT_MASK only encodes shape — which slots are mut — and two mut fields of the same type are perfectly legal to declare. The compile error in V2 is about writing plain dup instead of unsafe(dup), not about a collision."
        explanation: "MUT_MASK is a compile-time associated const, but the duplicate collision is walked and rejected at runtime in the dispatcher; the compile error is specifically about writing dup instead of unsafe(dup). Mechanically: the dispatcher walks the incoming account views, sets a bit for every slot whose address it has already seen, and ANDs that bitvec against the struct's 256-bit MUT_MASK in one four-word test. Any surviving bit returns ConstraintDuplicateMutableAccount from the dispatcher — before try_accounts loads a single field and long before your handler body runs."
      - id: m01-l4-q2
        prompt: "Your program's custom #[error_code] enum's third variant fires (no offset override). What on-wire code do clients see?"
        multiSelect: false
        options:
          - id: a
            label: "2003 — custom #[error_code] variants land in the 2000s constraint band"
            correct: false
            feedback: "The 2000s are the framework's own constraint band (ConstraintHasOne = 2001, ConstraintDuplicateMutableAccount lives there too). Your declared errors never land there; they start at 6000."
          - id: b
            label: "6002 — the custom band starts at 6000 and is zero-indexed by variant"
            correct: true
            feedback: "Counting starts at the base itself, so the first variant is 6000 and nothing shifts unless you set an explicit offset. The band an order of magnitude lower is reserved for the framework's own constraint failures."
          - id: c
            label: "6003 — the custom band starts at 6000 and numbers variants from 1"
            correct: false
            feedback: "The base itself is the first variant: index 0 is 6000, so the third variant is 6002. Nothing counts from 1 unless you shift the base with #[error_code(offset = N)]."
        explanation: "Framework constraint errors sit in the 2000s; custom #[error_code] starts at 6000, so the third variant (zero-based index 2) is 6002 unless offset is overridden."
      - id: m01-l4-q3
        prompt: "You just completed the discriminator-preimage challenge. Anchor hashes an INSTRUCTION handler's discriminator from which preimage namespace?"
        multiSelect: false
        options:
          - id: a
            label: "\"instruction:\" — e.g. sha256(\"instruction:increment\")"
            correct: false
            feedback: "This is the trap the challenge targets — Anchor uses the \"global:\" namespace for instruction handlers, not \"instruction:\"."
          - id: b
            label: "\"handler:\" — e.g. sha256(\"handler:increment\")"
            correct: false
            feedback: "There is no \"handler:\" namespace; instruction handlers hash from \"global:\"."
          - id: c
            label: "\"global:\" — e.g. sha256(\"global:increment\")[..8]"
            correct: true
            feedback: "Three preimage namespaces exist and each is keyed to a different kind of declaration. The handler one surprises people because that word never appears anywhere in the source you actually wrote."
        explanation: "Accounts hash from account:, events from event:, and instruction handlers from global: — the global namespace is the one that surprises people."
      - id: m01-l4-q4
        prompt: "You consider enabling #[discrim = N] compact discriminators to shrink accounts. What is the honest trade-off?"
        multiSelect: false
        options:
          - id: a
            label: "It is per-instruction opt-in, so you can freely mix compact and default 8-byte discriminators in one program"
            correct: false
            feedback: "Compaction is a program-wide switch: every handler's tag is compacted and prefix-ambiguity-validated together, so there is no per-instruction mix of compact and 8-byte sha256 tags."
          - id: b
            label: "It is all-or-nothing per program: you save instruction bytes and CU, but drop default v1 wire-compatibility"
            correct: true
            feedback: "Small integer tags can alias one another by prefix, which is why the whole program's tag set has to be validated together. Fixed-width hashes never had that hazard, so nothing checks for it until you opt in."
          - id: c
            label: "It keeps the 8-byte width but swaps sha256 for a cheaper hash, so client-built tags stop matching"
            correct: false
            feedback: "The compaction is not about the hash function: #[discrim = N] replaces the 8-byte sha256 prefix with a small literal integer tag — no hashing at all — so it is the width that changes, not the algorithm."
        explanation: "Discriminators are v1-compatible by default; #[discrim = N] is an all-or-nothing-per-program compaction with prefix-ambiguity validation, trading v1 wire-compat for smaller accounts. That extra validation exists because variable-width integer tags could otherwise alias each other by prefix, which fixed 8-byte sha256 tags never can."
