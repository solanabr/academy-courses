id: lesson-wci-toque-ao-pagamento
slug: do-toque-ao-pagamento-confirmado
title: Do toque no botão ao pagamento confirmado
skills:
- transactions
- confirmation
- transaction-fees
- signers
blocks:
- key: header
  type: prose
  src: header.md
- key: video
  type: video
  url: https://www.youtube.com/watch?v=PENDING-AULA-7
- key: content
  type: prose
  src: intro.md
- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: Dentro de uma transação, o que são as instruções?
    multiSelect: false
    options:
    - id: e
      label: O número de protocolo usado no explorador
      correct: false
      feedback: Esse papel é da assinatura da transação.
    - id: a
      label: O selo que comprova a sua autorização
      correct: false
      feedback: O selo é a assinatura digital. As instruções são as ordens.
    - id: c
      label: As ordens do envelope, como transferir
      correct: true
      feedback: 'Isso. Imagine um envelope com uma lista de tarefas: transfira o
        pagamento e registre o período comprado.'
    - id: b
      label: A prévia que a carteira mostra para você
      correct: false
      feedback: A prévia é o terceiro passo. Instruções são as tarefas do envelope.
    - id: d
      label: A taxa paga em SOL por cada assinatura
      correct: false
      feedback: A taxa é outro assunto. Instruções são as ordens dentro do pedido.
    explanation: A transação é o pedido, e dentro dela vão as ordens, chamadas instruções.
  - id: q2
    prompt: Quando você aprova o pagamento, o que a rede recebe?
    multiSelect: false
    options:
    - id: d
      label: Uma cópia da carteira, para simular a operação
      correct: false
      feedback: A simulação é um ensaio da prévia. A carteira não é enviada para
        a rede.
    - id: a
      label: A sua chave privada, para confirmar que é você
      correct: false
      feedback: Cuidado! Você autoriza o pagamento sem entregar o seu segredo.
    - id: e
      label: O login e a senha da conta em que você entrou
      correct: false
      feedback: Quem assina é a carteira, usando a chave privada. Login e senha
        não vão para a rede.
    - id: c
      label: A assinatura digital, sem receber a chave privada
      correct: true
      feedback: Isso. A rede verifica esse selo sem precisar receber a sua chave
        privada.
    - id: b
      label: A frase de recuperação, para refazer as chaves
      correct: false
      feedback: Jamais. A frase de recuperação nem entra nesse processo.
    explanation: A carteira usa a chave privada para criar a assinatura. A rede
      verifica o selo, e o seu segredo fica com você.
  - id: q3
    prompt: O pagamento do estacionamento apareceu como pendente. O que fazer primeiro?
    multiSelect: false
    options:
    - id: c
      label: Criar e autorizar um novo pagamento
      correct: false
      feedback: Se você criar e autorizar um novo pagamento, pode acontecer de os
        dois serem concluídos.
    - id: a
      label: Apertar enviar de novo para garantir
      correct: false
      feedback: Cuidado! Não aperte enviar várias vezes. Os dois pagamentos podem
        acabar sendo concluídos.
    - id: e
      label: Usar o botão geral de desfazer da rede
      correct: false
      feedback: Uma transferência realizada não tem um botão geral de desfazer.
    - id: d
      label: Pedir a um validador que desfaça tudo
      correct: false
      feedback: Validador executa regras, não desfaz pagamento a pedido de ninguém.
    - id: b
      label: Consultar a transação no explorador
      correct: true
      feedback: Isso. Primeiro, consulte a transação no explorador. Se a tela travar,
        consulte antes de pagar novamente.
    explanation: Antes de pagar, confira. Antes de assinar, entenda. E, depois de
      enviar, verifique.
  - id: q4
    prompt: Você paga 5 USDC ao estacionamento. Em que é paga a taxa da rede?
    multiSelect: false
    options:
    - id: e
      label: Em SOL, por você ou por um serviço em seu lugar
      correct: true
      feedback: Isso. O estacionamento recebe USDC, mas a taxa da rede é paga em
        SOL.
    - id: d
      label: Não há taxa quando o ativo enviado é USDC
      correct: false
      feedback: Existe uma taxa base relacionada às assinaturas exigidas.
    - id: c
      label: Em SOL, sempre por quem recebe o pagamento
      correct: false
      feedback: 'É em SOL, mas não por quem recebe: é por você ou por um serviço
        em seu lugar.'
    - id: a
      label: Em USDC, descontada dos 5 dólares digitais
      correct: false
      feedback: O estacionamento recebe USDC, mas a taxa da rede é outra conta,
        paga em SOL.
    - id: b
      label: Em reais, cobrada pelo aplicativo da cidade
      correct: false
      feedback: A taxa da rede é paga em SOL.
    explanation: O pagamento é em USDC, a taxa é em SOL, e existe uma taxa base
      relacionada às assinaturas exigidas.
  - id: q5
    prompt: Uma operação aparece como finalized. Isso prova que o pagamento teve
      sucesso?
    multiSelect: false
    options:
    - id: a
      label: 'Não: uma operação que falhou também pode ser finalizada'
      correct: true
      feedback: 'Isso. Confira duas coisas separadamente: o pagamento teve sucesso?
        O registro foi finalizado?'
    - id: e
      label: 'Não: finalized só existe na Devnet, não na Mainnet'
      correct: false
      feedback: Esses termos não são exclusivos de um ambiente. O ponto é separar
        sucesso e registro.
    - id: b
      label: 'Sim: finalized só aparece quando o pagamento é bem-sucedido'
      correct: false
      feedback: Cuidado. Uma operação que falhou também pode ter seu registro de
        erro finalizado.
    - id: c
      label: 'Sim: um registro finalizado sempre entrega os fundos a alguém'
      correct: false
      feedback: Finalized fala da força do registro, não do resultado do pagamento.
    - id: d
      label: 'Não: finalized quer dizer que o registro ainda muda'
      correct: false
      feedback: Quem ainda pode mudar é processed. Finalized é o nível mais forte
        de confirmação.
    explanation: Esses nomes falam do registro, e hoje confirmed e finalized descrevem
      o mesmo estado, como diz a nota da lição. O sucesso do pagamento é outra pergunta.
