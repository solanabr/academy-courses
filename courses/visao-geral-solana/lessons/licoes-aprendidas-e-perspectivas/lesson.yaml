id: lesson-vgs-licoes-aprendidas-e-perspectivas
slug: licoes-aprendidas-e-perspectivas
title: "Lições Aprendidas e Perspectivas"
skills:
- solana-fundamentals
blocks:
- key: header
  type: prose
  src: header.md
- key: video
  type: video
  url: https://www.youtube.com/watch?v=v5twkx98I_k
- key: content
  type: prose
  src: intro.md
- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: "No modelo mental \"arquitetura como ecossistema\" apresentado na lição, para que serve mapear as escolhas de design da rede?"
    multiSelect: false
    options:
    - id: b
      label: "Para calcular o preço de mercado do token nativo da rede."
      correct: false
      feedback: "A lição não trata de precificação de token; o modelo é sobre operadores e aplicações."
    - id: a
      label: "Para relacionar essas escolhas à ecologia de operadores e aplicações que se forma em torno delas."
      correct: true
      feedback: "Correto! O modelo liga decisões técnicas ao ecossistema de operadores e aplicações que elas produzem."
    - id: c
      label: "Para substituir a análise de sinais mensuráveis por uma avaliação puramente narrativa."
      correct: false
      feedback: "Ao contrário: a lição usa o modelo justamente para confrontar narrativas com evidências mensuráveis."
    explanation: "O modelo arquitetura-como-ecossistema serve para mapear escolhas de design à ecologia de operadores e aplicações que elas geram."
  - id: q2
    prompt: "Segundo a lição, quais sinais concretos devem ser observados ao avaliar a saúde e a trajetória de uma rede?"
    multiSelect: false
    options:
    - id: b
      label: "Apenas o número total de transações processadas desde o lançamento."
      correct: false
      feedback: "Um único número agregado não cobre diversidade, cadência de correções, concentração nem governança."
    - id: a
      label: "Diversidade de validadores, cadência de patches emergenciais, concentração de aplicações e mensagens de governança."
      correct: true
      feedback: "Correto! São exatamente os quatro sinais observáveis que a lição propõe."
    - id: c
      label: "Somente declarações oficiais publicadas pela equipe fundadora."
      correct: false
      feedback: "A lição pede evidência mensurável para checar narrativas, não apenas comunicação oficial."
    explanation: "Os sinais propostos são diversidade de validadores, cadência de patches emergenciais, concentração de apps e mensagens de governança."
  - id: q3
    prompt: "Qual é a função do checklist curto proposto ao final da lição?"
    multiSelect: false
    options:
    - id: b
      label: "Escolher qual linguagem de programação usar para escrever um programa on-chain."
      correct: false
      feedback: "A lição não trata de escolha de linguagem; o checklist é analítico."
    - id: c
      label: "Definir o preço de taxas de transação para operadores de nós."
      correct: false
      feedback: "O checklist não trata de política de taxas."
    - id: a
      label: "Avaliar narrativas retrospectivas confrontando-as com evidências mensuráveis."
      correct: true
      feedback: "Correto! O checklist existe para testar narrativas contra evidência observável."
    explanation: "O checklist serve para confrontar narrativas retrospectivas com evidências mensuráveis."
