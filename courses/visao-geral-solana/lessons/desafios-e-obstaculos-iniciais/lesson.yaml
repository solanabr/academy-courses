id: lesson-vgs-desafios-iniciais
slug: desafios-e-obstaculos-iniciais
title: "Desafios e Obstáculos Iniciais"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=XgeKLcVD3Os"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "Qual era a causa raiz predominante das interrupções e degradações de desempenho no início da mainnet beta da Solana?"
        multiSelect: false
        options:
          - id: a
            label: "Ataques de gasto duplo que corromperam o estado contábil da blockchain."
            correct: false
            feedback: "O consenso e a integridade criptográfica nunca foram violados; os problemas foram de saturação e esgotamento de recursos."
          - id: b
            label: "Inundação de transações (spam de bots) via UDP/TPU sem custos ou priorização, esgotando recursos dos nós validadores."
            correct: true
            feedback: "Correto! A ausência de taxas de priorização e o envio massivo de pacotes UDP por bots de arbitragem sobrecarregavam a memória e CPU dos validadores."
          - id: c
            label: "Falha criptográfica no algoritmo SHA-256 do Proof of History."
            correct: false
            feedback: "A matemática do Proof of History funcionou como projetada; o gargalo foi a camada de rede e ingestão de transações."
        explanation: "Sem mempool tradicional e com envio de pacotes UDP sem rate-limiting no nível de aplicação, picos de tráfego causavam perda massiva de pacotes e travamento de validadores por exaustão de memória."
      - id: q2
        prompt: "Como a resposta da comunidade de engenharia da Solana evoluiu diante dos incidentes operacionais?"
        multiSelect: false
        options:
          - id: a
            label: "Transição de mitigação emergencial para soluções estruturais duráveis como QUIC, Stake-Weighted QoS e Mercados de Taxas Localizadas."
            correct: true
            feedback: "Exato! A rede substituiu UDP por QUIC, implementou QoS ponderado por stake para proteger validadores honestos e criou taxas de prioridade por conta/estado."
          - id: b
            label: "Centralização permanente do sequenciamento de blocos em um único servidor da fundação."
            correct: false
            feedback: "A Solana manteve sua governança e liderança de blocos descentralizada entre milhares de validadores."
          - id: c
            label: "Aumento do tempo de bloco de 400ms para 15 minutos para reduzir o volume de dados."
            correct: false
            feedback: "O tempo de slot foi preservado em ~400ms, com aprimoramentos focados na camada de transporte e agendamento."
        explanation: "A engenharia tratou cada incidente como aprendizado para implementar defesas duráveis: QUIC para controle de fluxo, SWQoS para garantia de entrega proporcional e mercados de taxas localizadas para conter hotspots."
      - id: q3
        prompt: "Qual é a distinção entre uma mitigação de curto prazo e um patch arquitetural durável em resposta a um incidente de rede?"
        multiSelect: false
        options:
          - id: a
            label: "Mitigações são mudanças definitivas de código; patches duráveis são apenas reinicializações manuais de validadores."
            correct: false
            feedback: "É exatamente o inverso."
          - id: b
            label: "Mitigações estabilizam a rede temporariamente (ex: ajustes de buffer/filtros), enquanto patches duráveis corrigem o mecanismo estrutural (ex: QUIC e SWQoS)."
            correct: true
            feedback: "Perfeito! Mitigações restabelecem o liveness no curto prazo, enquanto patches arquiteturais eliminam a classe de falha de forma duradoura."
          - id: c
            label: "Não há distinção: toda intervenção em blockchain é considerada um patch permanente."
            correct: false
            feedback: "Na prática de engenharia de alta vazão, a separação clara entre resposta imediata e reengenharia estrutural é indispensável."
        explanation: "Durante um incidente, a prioridade imediata é restaurar o consenso com mitigações seguras, seguida pelo desenvolvimento, auditoria e implantação de patches arquiteturais duráveis."
