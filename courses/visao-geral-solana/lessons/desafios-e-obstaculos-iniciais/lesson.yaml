id: lesson-vgs-desafios-iniciais
slug: desafios-e-obstaculos-iniciais
title: "Desafios e Obstáculos Iniciais"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=XgeKLcVD3Os"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "Quais modos de falha operacionais surgiram quando a Solana passou do estágio de protótipo para a rede ativa em produção?"
        multiSelect: false
        options:
          - id: a
            label: "Esgotamento de recursos nos nós validadores, latência de agendamento e backpressure de I/O sob alta carga de mensagens."
            correct: true
            feedback: "Correto! O alto volume de tráfego expôs limites práticos de memória, filas de pacotes e agendamento nos validadores sob estresse de produção."
          - id: b
            label: "Erros de consenso que geraram gastos duplos e bifurcações irreversíveis no livro-razão contábil."
            correct: false
            feedback: "A integridade dos dados e o consenso criptográfico foram preservados; os desafios foram de saturação operacional e estabilidade de nós."
          - id: c
            label: "Falhas na função criptográfica SHA-256 utilizada no fluxo de Proof of History."
            correct: false
            feedback: "A matemática do Proof of History funcionou conforme esperado; os gargalos ocorreram no processamento de I/O e capacidade de ingestão de pacotes."
        explanation: "A transição para produção revelou que a busca por alta vazão gerava modos de falha operacionais práticos (esgotamento de recursos e backpressure), deslocando o foco da engenharia para previsibilidade e observabilidade."
      - id: q2
        prompt: "De acordo com a análise de logs de validadores abordada na lição, quais padrões de eventos sinalizam instabilidade operacional em um nó?"
        multiSelect: false
        options:
          - id: a
            label: "Mensagens frequentes de 'slot skipped', falhas repetidas de chamadas RPC e pausas anômalas no processamento."
            correct: true
            feedback: "Exato! Na telemetria de validadores, slots ignorados e pausas excessivas indicam que o validador não está conseguindo acompanhar o ritmo do líder ou responder a requisições."
          - id: b
            label: "Diminuição automática no tamanho dos blocos gerados pelo nó validador líder."
            correct: false
            feedback: "O tamanho do bloco não é reduzido dinamicamente por métricas de log de clientes individuais."
          - id: c
            label: "Rejeição de transações exclusivamente por ausência de assinaturas criptográficas válidas."
            correct: false
            feedback: "Assinaturas inválidas são descartadas no fluxo normal de verificação e não constituem sintoma primário de instabilidade de nó."
        explanation: "No código e nos exemplos de log analisados na lição, eventos como 'slot skipped', erros de RPC e pausas anômalas de processamento são os indicadores primários de degradação de performance."
      - id: q3
        prompt: "Qual é a relação entre mitigações de curto prazo e remediações duráveis no fluxo de resposta a incidentes de uma rede blockchain?"
        multiSelect: false
        options:
          - id: a
            label: "Mitigações de curto prazo substituem em definitivo a necessidade de desenvolver patches arquiteturais."
            correct: false
            feedback: "Mitigações temporárias apenas estabilizam o sistema para permitir que a equipe desenvolva correções definitivas com segurança."
          - id: b
            label: "Mitigações de curto prazo estabilizam a rede e restauram o consenso imediatamente, enquanto remediações duráveis corrigem a causa raiz arquitetural."
            correct: true
            feedback: "Perfeito! Durante um incidente, a prioridade é conter o dano e reestabelecer o liveness; em seguida, desenvolvem-se patches duráveis para eliminar a classe de falha."
          - id: c
            label: "Remediações duráveis devem ser aplicadas diretamente em produção sem fase prévia de contenção ou diagnóstico."
            correct: false
            feedback: "Alterações arquiteturais profundas exigem testes rigorosos e não devem ser improvisadas durante o calor do incidente sem contenção prévia."
        explanation: "O fluxo de incidentes separa claramente a contenção emergencial (mitigação de curto prazo para restaurar a rede) da solução de engenharia durável (patch que corrige a causa raiz)."
