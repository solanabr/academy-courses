id: lesson-vgs-marcos-e-adocao
slug: marcos-e-linha-do-tempo-de-adocao
title: "Marcos e Linha do Tempo de Adoção"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=OqgDtLY8ZAs"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "No modelo mental apresentado na lição, como as fases de evolução da rede são comparadas à construção de uma grande ponte?"
        multiSelect: false
        options:
          - id: a
            label: "A rede evolui em etapas sucessivas: assentamento de suportes fundamentais (consenso/runtime), testes sob estresse em testnets, abertura pública e expansão de capacidade."
            correct: true
            feedback: "Correto! Assim como uma ponte exige pilares sólidos antes de suportar tráfego pesado, a rede consolida suas primitivas de consenso antes de abrir para o ecossistema."
          - id: b
            label: "A rede é construída de forma instantânea e imutável, sem admitir fases de testes ou expansões graduais."
            correct: false
            feedback: "A lição enfatiza que o ciclo de vida da rede é progressivo e dividido em fases interdependentes de construção e teste."
          - id: c
            label: "A ponte representa um protocolo de transferência de arquivos entre sistemas operacionais isolados."
            correct: false
            feedback: "A metáfora é empregada para descrever as fases de engenharia e maturidade da rede, não uma ferramenta de arquivos."
        explanation: "A analogia da ponte explica que a rede precisa primeiro de suportes fundamentais sólidos (consenso e runtime), seguidos de testes de estresse em testnet, abertura controlada e expansão contínua."
      - id: q2
        prompt: "Qual é a distinção entre 'Releases Técnicos' e 'Eventos do Ecossistema' na análise de evolução de uma blockchain?"
        multiSelect: false
        options:
          - id: a
            label: "Releases técnicos alteram o comportamento, estabilidade e capacidade da rede; eventos do ecossistema expandem a atividade dos desenvolvedores, casos de uso e engajamento."
            correct: true
            feedback: "Exato! Releases técnicos afetam a operação e o desempenho do protocolo; eventos de ecossistema ampliam a base de desenvolvedores e a criação de aplicações."
          - id: b
            label: "Releases técnicos são voltados exclusivamente a usuários leigos, enquanto eventos do ecossistema são atualizações no código do protocolo."
            correct: false
            feedback: "É o oposto: releases técnicos são atualizações de software de rede; eventos do ecossistema envolvem comunidade e criadores de projetos."
          - id: c
            label: "Não existe distinção: ambos representam exatamente o mesmo tipo de atividade e geram as mesmas métricas."
            correct: false
            feedback: "A lição destaca que cada classe de marco possui objetivos diferentes e exige métricas de observação distintas."
        explanation: "A lição ensina a separar marcos de protocolo (que alteram performance e robustez técnica) de marcos de ecossistema (que impulsionam adoção e projetos práticos)."
      - id: q3
        prompt: "Por que a lição orienta a tratar os marcos históricos como 'transições funcionais' em vez de simples datas comemorativas?"
        multiSelect: false
        options:
          - id: a
            label: "Porque cada marco exercita um mecanismo técnico específico e gera indicadores mensuráveis no comportamento e na adoção da rede."
            correct: true
            feedback: "Perfeito! Avaliar marcos como transições funcionais permite associar melhorias técnicas a mudanças reais em métricas de rede e adesão de desenvolvedores."
          - id: b
            label: "Porque datas cronológicas são proibidas na documentação de projetos de tecnologia."
            correct: false
            feedback: "Datas são referências de ordenação úteis, mas o valor analítico está no mecanismo exercitado e no efeito mensurável gerado."
          - id: c
            label: "Porque cada marco histórico invalida e substitui todo o histórico de blocos anterior da blockchain."
            correct: false
            feedback: "A evolução da rede é contínua e cumulativa, preservando a integridade e a história do livro-razão."
        explanation: "Tratar marcos como transições funcionais transforma a cronologia em um modelo prático de análise: cada lançamento técnico é vinculado ao mecanismo exercitado e ao sinal de adoção gerado."
