id: lesson-vgs-marcos-e-adocao
slug: marcos-e-linha-do-tempo-de-adocao
title: "Marcos e Linha do Tempo de Adoção"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=OqgDtLY8ZAs"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "Por que a fase de 'Mainnet Beta' da Solana foi designada explicitamente com o rótulo 'Beta'?"
        multiSelect: false
        options:
          - id: a
            label: "Porque a rede ainda não processava transações com valor financeiro real."
            correct: false
            feedback: "A Mainnet Beta já transferia SOL real e ativos com valor econômico genuíno desde o primeiro dia."
          - id: b
            label: "Para sinalizar que o protocolo, embora funcional com valor real, continuaria recebendo otimizações e hardening sob estresse de produção."
            correct: true
            feedback: "Correto! O rótulo Beta comunicava transparência: a rede estava viva e auditada, mas sujeita a upgrades contínuos de estabilidade, recursos e maturidade de software."
          - id: c
            label: "Porque todos os nós validadores eram operados exclusivamente por uma única empresa."
            correct: false
            feedback: "A Mainnet Beta já contava com centenas de operadores independentes distribuídos globalmente."
        explanation: "A designação Mainnet Beta refletia a filosofia de testar e iterar em produção com transparência técnica sobre a evolução contínua das primitivas do protocolo."
      - id: q2
        prompt: "Qual é a principal diferença de impacto entre um 'Release Técnico de Protocolo' e um 'Evento do Ecossistema'?"
        multiSelect: false
        options:
          - id: a
            label: "Releases de protocolo alteram telemetria, vazão e capacidades do runtime; eventos do ecossistema expandem volume de usuários, liquidez e diversidade de dApps."
            correct: true
            feedback: "Exato! Releases técnicos afetam o comportamento do validador e a segurança da rede; eventos de ecossistema geram tração de mercado e adoção prática."
          - id: b
            label: "Eventos do ecossistema exigem hard forks da rede, enquanto releases de protocolo não requerem atualização de validadores."
            correct: false
            feedback: "Releases de software exigem que validadores atualizem seus binários; eventos de ecossistema são atividades dos desenvolvedores e usuários na camada de aplicação."
          - id: c
            label: "Não existe diferença prática: ambos medem apenas o número de commits no GitHub."
            correct: false
            feedback: "Métricas técnicas avaliam latência e TPS; métricas de ecossistema avaliam TVL, carteiras ativas diárias e volume de transações."
        explanation: "Releases técnicos expandem as capacidades fundamentais do sistema (capacidade de processamento e robustez), criando a base sobre a qual eventos de ecossistema (hackathons, DeFi, NFTs) constroem adoção sustentável."
      - id: q3
        prompt: "Como os Hackathons da Solana (ex: Ignition, Riptide, Grizzlython) impactaram o ciclo de desenvolvimento da rede?"
        multiSelect: false
        options:
          - id: a
            label: "Serviram apenas como eventos de marketing sem gerar novos produtos ou protocolos."
            correct: false
            feedback: "Muitos dos principais protocolos de DeFi, infraestrutura e pagamentos da Solana nasceram diretamente em seus hackathons."
          - id: b
            label: "Atuaram como catalisadores de inovação e stress-tests reais de demanda, trazendo novas equipes de desenvolvedores e gerando casos de uso nativos."
            correct: true
            feedback: "Perfeito! Os hackathons atraíram milhares de desenvolvedores globais, testando os limites da rede com casos de uso que impulsionaram melhorias técnicas e novos padrões de contratos."
          - id: c
            label: "Foram usados para substituir o desenvolvimento do cliente validador principal."
            correct: false
            feedback: "Os hackathons focam em aplicações e ferramentas de desenvolvedor, complementando o desenvolvimento do core protocol."
        explanation: "Hackathons globais funcionaram como motores de ecossistema, convertendo o throughput técnico da rede em valor de aplicação e acelerando o flywheel de adoção."
