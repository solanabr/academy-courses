id: lesson-vgs-marcos-e-adocao
slug: marcos-e-linha-do-tempo-de-adocao
title: "Marcos e Linha do Tempo de Adoção"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=OqgDtLY8ZAs"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "No modelo mental apresentado na lição, como o ciclo de vida dos releases da rede é comparado à construção de uma ponte?"
        multiSelect: false
        options:
          - id: a
            label: "A ponte representa uma ferramenta exclusiva para transferir tokens entre duas blockchains distintas."
            correct: false
            feedback: "A analogia da ponte é usada para descrever as fases de engenharia e sustentação de uma infraestrutura robusta, e não uma bridge de tokens."
          - id: b
            label: "A rede evolui em fases sucessivas: suportes fundamentais (consenso e runtime), testes sob estresse em testnets, abertura pública e expansão de capacidade."
            correct: true
            feedback: "Correto! Assim como uma ponte precisa de pilares sólidos antes de suportar tráfego pesado, a rede consolida suas primitivas de consenso antes de abrir para o ecossistema amplo."
          - id: c
            label: "A rede é considerada uma estrutura estática imutável que não admite novas fases de suporte após a implantação inicial."
            correct: false
            feedback: "A evolução de uma blockchain de alta performance é contínua e passa por sucessivas fases de release e aprimoramento."
        explanation: "A metáfora da ponte ilustra que a rede é construída em etapas interdependentes: fundação técnica, stress-tests, lançamento público e ampliação contínua da capacidade."
      - id: q2
        prompt: "Qual é a diferença fundamental entre 'Releases Técnicos' e 'Eventos do Ecossistema' na evolução de uma blockchain?"
        multiSelect: false
        options:
          - id: a
            label: "Releases técnicos alteram o desempenho e a estabilidade da rede; eventos do ecossistema expandem a atividade dos desenvolvedores, casos de uso e engajamento."
            correct: true
            feedback: "Exato! Releases de protocolo impactam a telemetria dos validadores e a capacidade do runtime; eventos de ecossistema impulsionam a camada de aplicação e a adoção."
          - id: b
            label: "Releases técnicos são conduzidos exclusivamente por usuários finais, enquanto eventos do ecossistema são atualizações de software nos nós."
            correct: false
            feedback: "É o inverso: releases técnicos são atualizações de protocolo para validadores; eventos de ecossistema envolvem a comunidade e desenvolvedores de dApps."
          - id: c
            label: "Não há distinção prática: ambos os tipos de marco são avaliados unicamente pela contagem de nós validadores."
            correct: false
            feedback: "A lição destaca que cada tipo de marco requer métricas distintas: telemetria técnica para releases e métricas de atividade de usuário/desenvolvedor para eventos."
        explanation: "Releases técnicos estabelecem as fundações operacionais e a capacidade da rede, enquanto eventos do ecossistema convertem essa capacidade em adoção real e atividade de mercado."
      - id: q3
        prompt: "Ao analisar a linha do tempo de adoção de uma blockchain, por que os marcos devem ser tratados como 'transições funcionais'?"
        multiSelect: false
        options:
          - id: a
            label: "Porque cada marco exercita um mecanismo técnico específico e gera indicadores observáveis mensuráveis no comportamento da rede."
            correct: true
            feedback: "Perfeito! Em vez de encarar marcos como simples datas no calendário, analisá-los como transições funcionais permite correlacionar melhorias técnicas a dados observáveis de adoção."
          - id: b
            label: "Porque marcos servem apenas como anúncios de marketing sem reflexo na operação ou métricas da rede."
            correct: false
            feedback: "Marcos funcionais reais geram mudanças observáveis na telemetria, volume de transações e comportamento dos contratos."
          - id: c
            label: "Porque cada novo marco exige que todo o protocolo seja reescrito do zero pelos desenvolvedores."
            correct: false
            feedback: "A evolução da rede é cumulativa e iterativa, construindo sobre as camadas de consenso e runtime consolidadas."
        explanation: "Tratar marcos como transições funcionais transforma uma cronologia histórica em um método rigoroso de análise técnica e de adoção de ecossistemas."
