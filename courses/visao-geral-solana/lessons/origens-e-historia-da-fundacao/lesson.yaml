id: lesson-vgs-origens-fundacao
slug: origens-e-historia-da-fundacao
title: "Origens e História da Fundação"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=kYZZsLzEwGg"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "Qual foi a principal percepção técnica (insight) de Anatoly Yakovenko na fundação da Solana?"
        multiSelect: false
        options:
          - id: a
            label: "Aumentar o tamanho do bloco para acomodar mais transações por segundo."
            correct: false
            feedback: "Aumentar o bloco isoladamente sobrecarrega a propagação de rede sem resolver o problema de sincronização de tempo."
          - id: b
            label: "Usar uma Função de Atraso Verificável (VDF/PoH) como um relógio global descentralizado antes do consenso."
            correct: true
            feedback: "Correto! Ao criar um fluxo sequencial e verificável de tempo via SHA-256 (Proof of History), os nós concordam com o tempo sem depender de comunicação de rede ponto a ponto constante."
          - id: c
            label: "Criar uma segunda camada (Layer 2) sobre o Bitcoin para liquidação instantânea."
            correct: false
            feedback: "A Solana foi projetada como uma blockchain Layer 1 de estado único e alta vazão, e não como uma Layer 2 do Bitcoin."
        explanation: "Anatoly Yakovenko percebeu que a falta de um relógio confiável era o principal gargalo de escalabilidade em sistemas distribuídos. O Proof of History introduziu uma referência de tempo criptográfica contínua antes do consenso."
      - id: q2
        prompt: "Como a formação da equipe inicial fundadora da Solana (ex-engenheiros da Qualcomm) influenciou sua arquitetura?"
        multiSelect: false
        options:
          - id: a
            label: "Trouxe experiência em sistemas embarcados, redes móveis e otimização em nível de hardware."
            correct: true
            feedback: "Exato! A equipe aplicou técnicas da indústria de telecomunicações e hardware, tratando o hardware moderno (CPUs multicore, GPUs, redes velozes) como recurso a ser totalmente utilizado."
          - id: b
            label: "Focou exclusivamente em linguagens interpretadas para facilitar o onboarding de desenvolvedores web."
            correct: false
            feedback: "A equipe escolheu Rust e BPF/SBF para garantir execução nativa de alto desempenho e controle rigoroso de memória."
          - id: c
            label: "Priorizou simplicidade de execução sequencial em nós de capacidade mínima de computação."
            correct: false
            feedback: "Pelo contrário: a Solana foi desenhada para escalar vertical e horizontalmente acompanhando a curva da Lei de Moore."
        explanation: "A bagagem da equipe na Qualcomm em processamento paralelo, modems e compressão de sinais direcionou o design da Solana para maximizar a eficiência do hardware moderno."
      - id: q3
        prompt: "Qual é a diferença fundamental de prioridade entre a Solana e o Bitcoin em relação ao tempo e execução?"
        multiSelect: false
        options:
          - id: a
            label: "O Bitcoin foca em maximizar transações por segundo enquanto a Solana foca em armazenamento de valor lento."
            correct: false
            feedback: "É o oposto: o Bitcoin prioriza verificação simples e auditabilidade em hardware básico, enquanto a Solana maximiza vazão e baixa latência."
          - id: b
            label: "O Bitcoin usa relógios atômicos centralizados e a Solana não usa nenhuma referência temporal."
            correct: false
            feedback: "O Bitcoin ordena eventos por blocos discretos minerados sem relógio contínuo; a Solana usa Proof of History como relógio criptográfico descentralizado."
          - id: c
            label: "O Bitcoin prioriza segurança e descentralização com blocos discretos de 10 min; a Solana integra tempo contínuo para viabilizar execução paralela em alta velocidade."
            correct: true
            feedback: "Perfeito! O Bitcoin usa intervalos de ~10 minutos para garantir que qualquer nó global sincronize; a Solana usa Proof of History para permitir slots de 400ms e processamento paralelo."
        explanation: "O Bitcoin foi projetado para maximizar a auditabilidade descentralizada com requisitos mínimos de hardware, enquanto a Solana foi desenhada para funcionar na velocidade da física e das redes modernas."
