id: lesson-vgs-origens-fundacao
slug: origens-e-historia-da-fundacao
title: "Origens e História da Fundação"
skills:
  - solana-fundamentals
blocks:
  - key: video
    type: video
    url: "https://www.youtube.com/watch?v=L65KvCbTqRo"
  - key: content
    type: prose
    src: intro.md
  - key: quiz
    type: quiz
    questions:
      - id: q1
        prompt: "Qual foi o insight central de Anatoly Yakovenko na concepção do Proof of History para a Solana?"
        multiSelect: false
        options:
          - id: a
            label: "Aumentar o tamanho do bloco para armazenar mais transações em cada intervalo de mineração."
            correct: false
            feedback: "Aumentar o tamanho do bloco não resolve o problema fundamental da falta de sincronização temporal entre os nós distribuídos."
          - id: b
            label: "Codificar a passagem do tempo em um fluxo de computação sequencial verificável (SHA-256), permitindo que os nós concordem com a ordem dos eventos sem comunicação constante."
            correct: true
            feedback: "Correto! Ao transformar o livro-razão em um relógio global via hashing sequencial, os nós verificam o tempo de forma independente e assíncrona."
          - id: c
            label: "Substituir a descentralização por um servidor centralizado fornecedor de carimbos de tempo (timestamp authority)."
            correct: false
            feedback: "A proposta do Proof of History é justamente prover uma fonte descentralizada e criptograficamente verificável de tempo sem autoridades centrais."
        explanation: "Anatoly percebeu que concordar com o tempo era o principal gargalo em sistemas distribuídos. O Proof of History introduziu um relógio criptográfico contínuo antes da camada de consenso."
      - id: q2
        prompt: "Como a experiência prévia da equipe fundadora na Qualcomm influenciou a abordagem técnica da arquitetura da Solana?"
        multiSelect: false
        options:
          - id: a
            label: "Direcionou o design para otimização de hardware moderno, processamento paralelo e paralelismo de rede, tratando o hardware como um recurso a ser totalmente utilizado."
            correct: true
            feedback: "Exato! A bagagem em sistemas embarcados e telecomunicações levou a equipe a projetar uma blockchain que escala acompanhando o avanço do hardware e da largura de banda."
          - id: b
            label: "Focou na criação de chips dedicados (ASICs) proprietários como requisito para a execução de nós validadores."
            correct: false
            feedback: "A Solana foi projetada para utilizar processadores multicore, GPUs e componentes de computação padrão de mercado de alto desempenho, e não ASICs proprietários."
          - id: c
            label: "Priorizou linguagens interpretadas de fácil aprendizado para simplificar o runtime em detrimento de performance."
            correct: false
            feedback: "A equipe priorizou controle de baixo nível e máxima eficiência de memória e processamento, escolhendo Rust e instruções nativas de máquina."
        explanation: "A vivência em modems, compressão de sinais e sistemas operacionais de tempo real na Qualcomm levou os fundadores a projetar um sistema altamente paralelo e sem gargalos de hardware desnecessários."
      - id: q3
        prompt: "Qual é a principal distinção de prioridade entre as escolhas de design da Solana e as do Bitcoin?"
        multiSelect: false
        options:
          - id: a
            label: "O Bitcoin prioriza contratos inteligentes complexos, enquanto a Solana foca apenas em pagamentos simples ponto a ponto."
            correct: false
            feedback: "O Bitcoin tem um modelo de scripting intencionalmente restrito, enquanto a Solana suporta contratos e execução paralela de alta complexidade."
          - id: b
            label: "O Bitcoin utiliza um relógio criptográfico contínuo, enquanto a Solana depende de blocos discretos minerados a cada dez minutos."
            correct: false
            feedback: "É exatamente o oposto: o Bitcoin opera com blocos discretos sem relógio, enquanto a Solana incorpora o Proof of History como relógio contínuo."
          - id: c
            label: "O Bitcoin prioriza validação em hardware mínimo e blocos discretos com intervalos longos; a Solana prioriza alta vazão e baixa latência integrando tempo contínuo ao fluxo de execução."
            correct: true
            feedback: "Perfeito! O Bitcoin foi projetado para maximizar a auditabilidade simples descentralizada, enquanto a Solana foi desenhada para operar na velocidade das redes e do hardware moderno."
        explanation: "As duas redes representam respostas fundamentais a prioridades distintas: o Bitcoin priorizou requisitos mínimos de nó e blocos discretos; a Solana priorizou vazão máxima e latência mínima com tempo integrado."
