id: lesson-spc-m03-l4
slug: m03-l4
title: "A blink for the drop: actions that execute anywhere (that renders them)"
skills:
  - transactions
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: action-post-response
    type: code
    language: typescript
    starter: action-post-response/starter.ts
    solution: action-post-response/solution.ts
    tests: action-post-response/tests.json
    hints:
      - "Always set type: 'transaction' and transaction from the first positional argument, transactionBase64."
      - "Add message only when the message argument is provided (not null or undefined)."
      - "Add links.next ({ type: 'post', href }) only when nextActionHref is provided; otherwise leave links off the object entirely."
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "You ship the drop blink and tweet the link, expecting it to unfurl into a buy button in the X feed. What is the honest 2026 reality you should design around?"
        multiSelect: false
        options:
          - id: a
            label: "It unfurls natively in X for every viewer, because X added first-class native blink rendering to the timeline."
            correct: false
            feedback: "Native X rendering is not established; the 'unfurl in the feed' claim is frozen at 2024 launch language and is not how it works now."
          - id: b
            label: "It renders only inside Phantom's in-app browser, so the working pattern is to post the link with an 'open in Phantom' instruction and accept that everyone else cannot buy."
            correct: false
            feedback: "That is an overly specific, unverified claim; the actual render-surface list for 2026 is uncertain and must be checked at write time."
          - id: c
            label: "X rendering is Chrome-extension-mediated, not native, and the 2026 surface list is uncertain, so you verify at write time and never promise 'renders everywhere.'"
            correct: true
        explanation: "The research confirms X rendering is Chrome-extension-mediated, and the 2026 native-wallet render list is unverified. The safe design is spec conformance plus a local blinks client for the lab, with any surface claim living in a verified-at-write box. Promising a feed render you cannot guarantee is the trap."
      - id: q2
        prompt: "Your blink's action endpoint works when you hit it directly, but wallets will not load it from your domain. Which two hosting rules did you most likely miss?"
        multiSelect: false
        options:
          - id: a
            label: "actions.json must sit at the domain root mapping the path, and actions must send CORS Access-Control-Allow-Origin: * including on actions.json itself."
            correct: true
          - id: b
            label: "The endpoint must be served over HTTP/2 with a preflight-exempt POST route, and it has to hand back the transaction as raw bytes rather than base64 for the wallet to parse it."
            correct: false
            feedback: "There is no HTTP/2, preflight-exemption, or raw-bytes requirement; the transaction is base64, and the loading failure is about discovery and CORS."
          - id: c
            label: "You must register the domain with your RPC provider and attach an API key header to every GET the wallet makes."
            correct: false
            feedback: "Wallets do not send your RPC API key; discovery is via actions.json plus CORS, not RPC registration."
        explanation: "Blinks are discovered through actions.json at the domain root and loaded cross-origin, so both the actions endpoints and actions.json must send Access-Control-Allow-Origin: *. Missing either one is the classic 'works in curl, dead in a wallet' failure."
      - id: q3
        prompt: "Picking dependencies for the blink, you reach for the latest @dialectlabs/blinks. What do you actually find, and how should you pin?"
        multiSelect: false
        options:
          - id: a
            label: "A fresh monthly release cadence, so you pin to the newest minor and turn on automatic updates to stay current."
            correct: false
            feedback: "There is no fresh cadence; the blinks tooling has been effectively frozen since 2025, so 'stay on latest' is a false comfort."
          - id: b
            label: "The tooling is frozen since 2025, so you pin @dialectlabs/blinks 0.22.5 and @solana/actions 1.6.6 and add a staleness note."
            correct: true
          - id: c
            label: "The package was renamed to @solana-commerce/blinks, so you migrate to that supported successor before building."
            correct: false
            feedback: "There is no such rename; @dialectlabs/blinks 0.22.5 and @solana/actions 1.6.6 remain the pins, frozen as they are."
        explanation: "@dialectlabs/blinks 0.22.5 (published 2025-04-04) and @solana/actions 1.6.6 (published 2024-11-05) are the newest versions that exist; no fresher ones have shipped. You pin them explicitly with a staleness note, because Dialect's investment moved to its hosted Standard Blinks Library rather than the core SDK."
      - id: q4
        prompt: "Building the featured-record blink, where does the transaction inside your ActionPostResponse come from, and what can you honestly claim about registry admission?"
        multiSelect: false
        options:
          - id: a
            label: "You author a brand-new blink-specific transaction builder because Actions need a different instruction shape, and admission is automatic the moment you POST your action to the registry endpoint."
            correct: false
            feedback: "Actions need no special instruction shape, so reuse the m03-l2 builder rather than rewriting it; registry admission is a manual review, not an automatic POST."
          - id: b
            label: "You reuse the m03-l2 builder, and blinks are admitted the instant you set an API key, since the enforcement date is public and fixed."
            correct: false
            feedback: "Reuse is right, but the enforcement date is unsourced and must never be cited; admission is not instant on setting a key."
          - id: c
            label: "You reuse the m03-l2 transaction-request builder (accretion), and registry admission is a manual Dialect review requiring API-key auth, so you cannot gate your lesson on it."
            correct: true
        explanation: "The blink's transaction is the same code path as the checkout: you reuse the m03-l2 builder, which is the accretion the ladder is showing. Registry admission is a manual Dialect review with API-key auth; only the API-key requirement is confirmed, the enforcement date is unsourced, so your lab gates on spec conformance plus a local client, not on registry status."
