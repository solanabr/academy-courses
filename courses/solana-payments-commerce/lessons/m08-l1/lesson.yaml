id: lesson-spc-m08-l1
slug: m08-l1
title: "Gasless with Kora: nobody brings SOL to a record fair"
skills:
  - transactions
  - solana-kit
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m08-l1-q1
        prompt: "You sponsored buyers' first purchases with Kora so they needed no SOL. A week later your sponsor wallet's SOL is lower than your fee math predicted. What most likely happened?"
        multiSelect: false
        options:
          - id: a
            label: "Kora attached a priority fee to every sponsored transaction on top of the 5000-lamport base, and congestion multiplied that surcharge."
            correct: false
            feedback: "Priority fees are optional and small; they cannot explain a rent-sized shortfall."
          - id: b
            label: "You paid ~0.00204 SOL of ATA-creation rent for buyers who later closed those accounts and kept the reclaim."
            correct: true
          - id: c
            label: "The base fee rose above 5000 lamports during the sale because the network was congested."
            correct: false
            feedback: "The 5000-lamport base fee is fixed; congestion changes optional priority fees, not the base fee."
        explanation: "Sponsored ATA rent is reclaimable: when Kora funds a new token account for a buyer, that ~0.00204 SOL is real spend, and the buyer can later close the account and keep the reclaimed rent. Budget sponsorship as a cost, never as a recoverable loan."
      - id: m08-l1-q2
        prompt: "A teammate suggests using Octane instead of Kora for fee sponsorship. What's the accurate state of things as of your build?"
        multiSelect: false
        options:
          - id: a
            label: "Octane is the current paymaster; Kora is an experimental fork that has not been audited yet."
            correct: false
            feedback: "Reversed: Octane is archived, and Kora is the audited successor."
          - id: b
            label: "Octane and Kora are both maintained; use Octane for SPL-token fees and Kora for SOL sponsorship."
            correct: false
            feedback: "Octane is archived, not maintained, and Kora covers SPL-token fee payment itself."
          - id: c
            label: "Octane was archived 2026-04-20 and points to Kora, which carries a Runtime Verification audit."
            correct: true
        explanation: "Octane's archival (2026-04-20, README pointing at Kora) is the signal that the paymaster torch passed. Kora's Runtime Verification audit is what makes it safe to place in the fee-payer seat."
      - id: m08-l1-q3
        prompt: "You copy the official facilitator-on-Kora guide and its imports read `x402` / `x402-express`, but your project uses `@x402/svm`. What's happening and what do you do?"
        multiSelect: false
        options:
          - id: a
            label: "The guide lags on v1 package names; the live SDK is the scoped @x402/* v2 line, so build v2."
            correct: true
          - id: b
            label: "The guide is canonical and the scoped @x402/* packages are an unofficial fork, so switch your imports back to x402 and x402-express."
            correct: false
            feedback: "The scoped @x402/* line is the current SDK; the guide's bare names are the lagging ones."
          - id: c
            label: "Kora only works with the v1 packages, so you must downgrade to keep sponsorship working."
            correct: false
            feedback: "Kora is a package-agnostic paymaster; the drift is naming, not a Kora requirement."
        explanation: "This is the documented v1/v2 naming drift: solana.com's facilitator guide still uses the bare x402 packages while the ecosystem moved to scoped @x402/* v2. Teach and build v2; recognize the guide's names as lag, not a constraint."
      - id: m08-l1-q4
        prompt: "A buyer asks Kora to sponsor an arbitrary transaction they assembled themselves. What is the right posture for your paymaster?"
        multiSelect: false
        options:
          - id: a
            label: "Sponsor it: the paymaster only pays fees, so the worst case is a single wasted base fee."
            correct: false
            feedback: "An unvalidated transaction can drain the sponsor via rent and abusive instructions; fees are not the only exposure."
          - id: b
            label: "Configure Kora's validation rules and allowlists so it only sponsors the instructions and programs your checkout actually uses."
            correct: true
          - id: c
            label: "Move the sponsor key into the browser so the buyer co-signs and you no longer trust the paymaster."
            correct: false
            feedback: "Exposing the sponsor key client-side is strictly worse; validation, not key exposure, is the control."
        explanation: "A paymaster with no validation is an open drain. Kora's allowlists and validation rules are the whole safety story: restrict sponsorship to the exact instructions and programs your checkout emits."
