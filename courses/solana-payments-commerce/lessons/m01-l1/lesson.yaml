id: lesson-spc-m01-l1
slug: m01-l1
title: "Watch a dollar settle: your first five minutes on Solana rails"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m01-l1-q1
        prompt: "Your first-five-minutes script decoded a live USDC transfer off mainnet with no wallet, no keys, and no signup. In card-rail terms, what did you actually just do?"
        multiSelect: false
        options:
          - id: a
            label: "You read a stranger's already-settled payment straight from the shared ledger, because settlement records here are public by default."
            correct: true
          - id: b
            label: "You issued a refund against someone else's charge, since the same public RPC that hands back a transfer also accepts reversal calls against the signature it returned."
            correct: false
            feedback: "Reading is not writing. The RPC returned an already-settled record, and no endpoint on it can move or reverse anyone's funds; only the holder's signature can spend from an account."
          - id: c
            label: "You re-authorized a new payment from the sender, because decoding a transfer re-broadcasts it to the network."
            correct: false
            feedback: "Decoding inspects a past transaction; it never re-submits or re-authorizes anything. That payment settled exactly once, when its sender signed it."
        explanation: "The demo needs zero setup because Solana's ledger is public and readable over any RPC. Every settled transfer (sender, amount, mint, memo) is queryable by anyone, which is the opposite of a card processor's private, permissioned dashboard. That public-by-default property is exactly what lets a merchant reconcile payments later without a PSP sitting in the middle."
      - id: m01-l1-q2
        prompt: "Installing @solana/pay also dropped a `pay` CLI binary on your PATH, and the canonical Solana Pay GitHub URL now redirects to a repo whose headline product is an agentic-payments CLI. What is the honest read of that?"
        multiSelect: false
        options:
          - id: a
            label: "Classic QR-based Solana Pay was deleted; only the new agentic CLI is supported from now on."
            correct: false
            feedback: "Classic Solana Pay is not gone. It lives on at typescript/packages/solana-pay in the very same repo, and you will build a checkout on it in module 3."
          - id: b
            label: "The Foundation's payments focus shifted toward agent and HTTP payments, while classic Solana Pay lives on as a subpackage."
            correct: true
          - id: c
            label: "Your npm package was hijacked; a surprise `pay` binary is a supply-chain compromise you should remove."
            correct: false
            feedback: "The binary is intentional: the package.json declares a `pay` bin entry. It is a documented feature of the official package, not a compromise."
        explanation: "The redirect and the bundled CLI are real signals that the Foundation's energy moved from QR checkout toward agent/HTTP payments, but 'moved energy' is not 'deleted.' The classic library is still shipped and maintained inside the same monorepo. Reading ecosystem shifts honestly (what changed versus what was actually removed) is a survival skill in a market this young."
      - id: m01-l1-q3
        prompt: "A skeptical teammate says 'stablecoin checkout is a toy, no real processor touches it.' Which fact from this lesson answers them most directly?"
        multiSelect: false
        options:
          - id: a
            label: "Solana's block time beats a card network's authorization round-trip, so it must be production-ready."
            correct: false
            feedback: "Speed is a property, not proof of adoption. It does not tell your teammate that a mainstream processor is actually in the market."
          - id: b
            label: "The bundled `pay` CLI can wrap any shell command and clear a 402 challenge automatically for you."
            correct: false
            feedback: "That is a neat capability, but it is a Foundation tool, not evidence that an incumbent payments company adopted these rails."
          - id: c
            label: "Stripe's 'Pay with crypto' accepts USDC on Solana at checkout and settles the merchant in fiat."
            correct: true
        explanation: "The strongest 'this is real' datum is an incumbent shipping it in production: Stripe accepts USDC-on-Solana at checkout and settles you in fiat. That is a mainstream PSP treating these rails as a first-class payment method, which is precisely the credibility signal the opener is built around."
