id: lesson-spc-m07-l2
slug: m07-l2
title: "Paywall the pressing-price API, then build the bot that pays it"
skills:
  - transactions
  - solana-kit
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: decide-payment
    type: code
    language: typescript
    starter: decide-payment/starter.ts
    solution: decide-payment/solution.ts
    tests: decide-payment/tests.json
    hints:
      - "Check in a fixed order so the decline reason is deterministic: scheme, network, asset, memo size, fee payer, then the USD cap."
      - "Known Solana CAIP-2 ids: mainnet solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp, devnet solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1."
      - "The USD cap comparison must use the decimals recorded for THIS asset in the allowlist, not USDC's familiar 6 - a bridged dollar with a different decimal count changes what the same atomic-unit amount is worth."
  - key: check-build
    type: quiz
    questions:
      - id: q5-lighthouse
        prompt: "Your server-side check rebuilds the expected payment transaction and compares it byte-for-byte to what the agent submitted through Phantom. Legitimate payments start failing the comparison. What is going on, and what does x402's SVM verifier do about it?"
        multiSelect: false
        options:
          - id: a
            label: "The agent is malicious; reject every transaction that does not match your rebuild exactly."
            correct: false
            feedback: "The mismatch is caused by the wallet, not the agent. Rejecting all of them blocks legitimate Phantom/Solflare users, which is why the verifier allowlists the guard program instead of banning it."
          - id: b
            label: "Phantom and Solflare inject Lighthouse guard instructions, so x402's SVM verifier allowlists that program and verifies what was actually signed."
            correct: true
          - id: c
            label: "The blockhash expired mid-flight, so the wallet rebuilt the transaction on a fresh one; widen the settlement-cache eviction window past the package's quoted 60-to-90-second lifetime range."
            correct: false
            feedback: "Blockhash expiry makes a transaction fail to land; it does not add instructions to an otherwise-valid payment. The settlement cache is a replay guard, not a verification path. The cause here is wallet-injected guard instructions."
        explanation: "Phantom and Solflare inject Lighthouse guard instructions into transactions to protect users, so a naive rebuild-and-compare check fails on legitimate payments. x402's SVM verifier hardcodes an allowlist for the Lighthouse guard program and verifies the transaction that was actually signed. The lesson: verify signed reality, not your idealized rebuild."
      - id: q6-memo-reconcile
        prompt: "Your paying agent pays three API calls but all three land in the backoffice ledger under the same order, so reconciliation reports one sale. You reused a single extra.memo string across calls. What is the correct fix?"
        multiSelect: false
        options:
          - id: a
            label: "Stop using memos for machine payments; reconcile x402 sales only by wallet address instead."
            correct: false
            feedback: "Wallet address is not an invoice id; two calls from the same agent share it. The memo IS the reconciliation key, exactly as Solana Pay reference keys are; it just has to be unique per call."
          - id: b
            label: "Give each call a unique extra.memo invoice id (at most 256 bytes) so each payment reconciles to its own order in the same ledger."
            correct: true
          - id: c
            label: "Widen the settlement-cache window so all three settlements are treated as one and dedup to a single order."
            correct: false
            feedback: "The settlement-cache is a replay guard against duplicate SETTLEMENT of one payment, not a reconciliation key. Collapsing three distinct sales into one is the bug, not the fix."
        explanation: "x402's extra.memo invoice id is the same reconciliation idea as a Solana Pay reference key: it must be unique per call so each payment maps to its own order in the shared backoffice ledger. Reusing one memo collapses distinct sales; the fix is a unique memo (within the 256-byte limit) per call."
  - key: check-guard
    type: quiz
    questions:
      - id: q7-spendcontrols
        prompt: "You ship the paying agent with default spendControls and point it at Wavelength's pressing-price API, whose calls cost $1.50 in USDC. The agent silently pays nothing and your fulfillment queue stays empty. Why?"
        multiSelect: false
        options:
          - id: a
            label: "The default spendControls cap is $1 per payment, so the agent declines a $1.50 call; raise the cap or price the call lower."
            correct: true
          - id: b
            label: "The x402.org devnet facilitator refuses to settle any payment above $1, so it rejects the call and the agent never receives a settlement receipt."
            correct: false
            feedback: "The cap lives on the CLIENT (the agent's spendControls), not the facilitator. The facilitator would happily settle a $1.50 call; the agent declines it before signing."
          - id: c
            label: "USDC is not a recognized pegged asset by default, so the agent refuses regardless of amount."
            correct: false
            feedback: "USDC is a recognized pegged asset; that is not the blocker. The blocker is the $1 per-payment cap the default spendControls enforce."
        explanation: "The @x402/core client spendControls default to recognized pegged assets with a $1 USD cap per payment unless overridden. A $1.50 call exceeds that cap, so the pre-flight guard declines it before signing, which reads as a silent no-op unless you log the reason. Raise the cap deliberately or price the call under it."
      - id: q8-facilitator-env
        prompt: "Your x402 labs pass against the x402.org facilitator on devnet. A teammate wants to point the same config at it for the mainnet launch. What is the right call?"
        multiSelect: false
        options:
          - id: a
            label: "Ship it; the x402.org facilitator is the reference facilitator and works identically on mainnet."
            correct: false
            feedback: "The x402.org facilitator is explicitly devnet/testnet only. Pointing production at it will not settle real payments."
          - id: b
            label: "Ship it, but swap the CAIP-2 network id to mainnet and add the Lighthouse allowlist first; those two are the only things that change when you leave devnet."
            correct: false
            feedback: "Swapping the network id is real work, but the allowlist already ships inside the SVM verifier. Neither change matters here, because the x402.org facilitator does not serve mainnet at all."
          - id: c
            label: "No; that facilitator is devnet/testnet only, so mainnet needs a production one such as Corbits, PayAI, or CDP."
            correct: true
        explanation: "The x402.org facilitator is devnet/testnet only, a deliberate reference deployment. A mainnet launch must swap the facilitator URL to a production one (Corbits, Dexter, PayAI, Solvador, or Coinbase CDP), which is a config change plus the trust and KYT considerations that come with picking a facilitator."
