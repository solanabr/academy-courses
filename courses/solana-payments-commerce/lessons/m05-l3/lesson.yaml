id: lesson-spc-m05-l3
slug: m05-l3
title: "Dunning, lifecycle, and who else does this"
skills:
  - account-model
  - solana-programs
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m05-l3-q1
        prompt: "A subscriber's ATA is empty when the monthly pull fires. Following the dunning policy Helius runs on its own bills, what happens to that renewal?"
        multiSelect: false
        options:
          - id: a
            label: "The renewal is not retried against the wallet; it becomes an ordinary open invoice the subscriber can settle later."
            correct: true
          - id: b
            label: "The crank retries the pull against the wallet on a backoff ladder, minutes apart and then daily, until it clears or the retry limit drops the plan."
            correct: false
            feedback: "There is nothing to auto-retry against a wallet you don't control, and the documented policy is explicitly NOT to retry against the wallet."
          - id: c
            label: "The subscription is cancelled immediately and its delegation PDA is closed on the spot."
            correct: false
            feedback: "A failure moves to an open-invoice/grace state, not immediate cancel-and-close; cancellation is a separate, explicit transition."
        explanation: "Retry-never: with no custody there is nothing to dun. The failed pull becomes an open invoice the subscriber settles when they top up, the exact opposite of card-rail auto-retry."
      - id: m05-l3-q2
        prompt: "A subscriber cancels for good and you want to stop paying rent on their now-dead subscription accounts. Which action recovers it?"
        multiSelect: false
        options:
          - id: a
            label: "Nothing; PDA rent is burned at account creation and is permanently unrecoverable."
            correct: false
            feedback: "The program exposes an explicit revoke-and-reclaim path; the rent is not burned."
          - id: b
            label: "A RevokeAbandoned instruction closes the abandoned subscription/delegation accounts and returns the rent lamports."
            correct: true
          - id: c
            label: "The subscriber must closeAccount on their ATA, which also frees the subscription PDAs."
            correct: false
            feedback: "Closing the user's ATA is a different account entirely and does not reclaim the program's subscription or delegation PDAs."
        explanation: "RevokeAbandoned* is the lifecycle exit that recovers rent from dead subscription/delegation PDAs, so you stop paying to keep cancelled arrangements on-chain."
      - id: m05-l3-q3
        prompt: "You're advising Wavelength on outsourcing recurring billing to a provider. Based on the 2026 landscape, which statement is accurate?"
        multiSelect: false
        options:
          - id: a
            label: "Sphere ships a drop-in recurring-billing product tuned for the Brazil/PIX corridor, so a subscription settles to BRL on the same rails as its one-off payments."
            correct: false
            feedback: "Sphere does payments, ramps, OTC, and PIX settlement, but it ships NO recurring product."
          - id: b
            label: "Stripe cannot bill stablecoin subscriptions; it only settles one-off crypto payments."
            correct: false
            feedback: "Stripe Billing does support stablecoin subscriptions; that is exactly its recurring product."
          - id: c
            label: "MoonPay Commerce pay links and Stripe Billing both support subscriptions, including stablecoin ones, while Sphere has none at all."
            correct: true
        explanation: "The useful intelligence is the negatives: MoonPay Commerce and Stripe Billing both do recurring, Sphere does not. Assuming every payments provider bills recurring is how you pick the wrong vendor."
      - id: m05-l3-q4
        prompt: "You model dunning as a state machine in the backoffice rather than as retries against the chain. Why is that the right shape for non-custodial recurring revenue?"
        multiSelect: false
        options:
          - id: a
            label: "Because a pull succeeds only when allowance and balance both cover it, so unrecoverable failures belong in your ledger, not in a retry loop you can't force."
            correct: true
          - id: b
            label: "Because the Subscriptions program falls back to billing the customer's card on file after three ledger failures."
            correct: false
            feedback: "There is no card on file. The primitive is a token-account delegate pull, not card billing."
          - id: c
            label: "Because the Subscriptions program escrows one billing period of funds when a subscriber accepts a plan, so a retried pull draws on that escrow and eventually clears."
            correct: false
            feedback: "Nothing escrows the subscriber's funds; an empty ATA simply cannot be pulled, no matter how many times you retry."
        explanation: "Non-custodial means you can't reach into the wallet. The only place you control state is your own ledger, so failure and lifecycle live there as an explicit state machine, which is exactly why retry-never is the honest policy."
