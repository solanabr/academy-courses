blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m09l1-q1-kit-pins
        prompt: "Assembling the stack, your wavelength-checkout workspace pins its kit-6 line (the @solana/pay peer) and your subscriptions workspace pins its kit-7 line (the @solana/subscriptions peer). A teammate proposes collapsing both into one workspace on a single kit version to simplify the monorepo. What is the right call?"
        multiSelect: false
        options:
          - id: a
            label: "Force the whole repo onto the kit-6 line and add an npm override so the subscriptions client accepts it, since one lockfile is easier to reason about than two resolution trees."
            correct: false
            feedback: "@solana/subscriptions 0.5.0 peers kit ^7, so the kit-6 line breaks its peer range, and an override only silences the warning while the client runs on a kit it was never built against. That is the seam m05-l2 already solved."
          - id: b
            label: "Force everything onto the npm-latest kit, since the newest release is the safest choice for a fresh capstone build."
            correct: false
            feedback: "@solana/pay peers the kit-6 line; jumping the wavelength-checkout workspace to the newest kit re-breaks its peer pair, and you pin exact per workspace, never to latest."
          - id: c
            label: "Keep the two workspace pins; @solana/pay and @solana/subscriptions sit on different kit peer ranges, which is the seam m05-l2 taught."
            correct: true
            feedback: "Peer ranges are constraints the packages publish, so resolution happens where each is installed. Two trees do cost you: values crossing between them are not the same types."
        explanation: "The kit v6/v7 fragmentation is real and load-bearing: @solana/pay peers the kit-6 line while @solana/subscriptions 0.5.0 peers kit ^7. The course monorepo keeps per-workspace pins precisely so each package gets a compatible kit. Collapsing the workspaces re-introduces the peer conflict you already resolved."
      - id: m09l1-q2-verify-leg
        prompt: "Your journey script runs the Kora-sponsored purchase leg for a SOL-less buyer. The buyer's wallet returns a success toast. How should the demo assert that this leg PASSED?"
        multiSelect: false
        options:
          - id: a
            label: "Re-fetch the transaction server-side with getTransaction and check the mint, the token program, and the store ATA's balance delta."
            correct: true
            feedback: "Only a ledger read your own server performs is unforgeable. Sponsorship changes nothing about proof: every leg asserts the same way."
          - id: b
            label: "Trust the wallet's success callback, since the Kora fee-payer already co-signed and submitted the transaction on the buyer's behalf and the RPC accepted it before the toast ever rendered."
            correct: false
            feedback: "Kora co-signing does not make a frontend confirmation trustworthy, and an accepted submission is not a verified transfer; the verifier still re-checks server-side. A success toast proves nothing about what actually landed on chain."
          - id: c
            label: "Poll the buyer's wallet balance from the client until it drops by the record's price, then mark the leg complete in the ledger."
            correct: false
            feedback: "Client-side balance polling is spoofable and unreliable; the course-wide gate is the m04 server-side verifier, not any client-read shortcut."
        explanation: "The m04 verifier is the whole course's acceptance harness for exactly this reason: frontend confirmations are spoofable. Every journey leg, sponsored or not, is asserted by re-fetching the transaction server-side and checking mint, token program, and balance deltas."
      - id: m09l1-q3-dunning-leg
        prompt: "The subscription leg of your journey deliberately forces a renewal to fail against an empty ATA. For the leg to assert PASS the way the course taught dunning, what must the assembled stack do?"
        multiSelect: false
        options:
          - id: a
            label: "Immediately retry the pull against the buyer's wallet up to three times and then cancel the subscription if all retries fail."
            correct: false
            feedback: "That is card-rail dunning, not the taught policy. The Helius model does NOT retry the failed renewal against the wallet."
          - id: b
            label: "Record the failed renewal as an open invoice in the backoffice ledger without retrying it against the wallet, matching the dunning policy from m05-l3."
            correct: true
            feedback: "With no way to force a pull, a ledger entry is the only durable outcome that failure produces. Give the state an exit too, or an invoice with no expiry accumulates forever."
          - id: c
            label: "Revoke the subscription authority PDA and reclaim its rent the moment the renewal fails, closing the account cleanly."
            correct: false
            feedback: "Rent recovery via RevokeAbandoned is the cancel path, not the failure path; a single failed renewal becomes an open invoice, it does not tear down the subscription."
        explanation: "The dunning case study (Helius dogfooding the official Subscriptions program) is explicit: a failed renewal is not retried against the wallet, it becomes an ordinary open invoice. The journey's forced failure asserts PASS when the backoffice ledger shows exactly that."
