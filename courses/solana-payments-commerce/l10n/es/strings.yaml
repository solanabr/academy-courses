                label: "Escribes un constructor de transacciones nuevecito específico para blinks porque las Actions necesitan una forma de instrucción distinta, y la admisión es automática en el momento en que haces POST de tu action al endpoint del registro."  # @src=86cee4f06675
                # | Actions need no special instruction shape, so reuse the m03-l2 builder
                # | rather than rewriting it; registry admission is a manual review, not an
                # | automatic POST.
                feedback: "Las Actions no necesitan ninguna forma de instrucción especial, así que reusa el constructor de m03-l2 en vez de reescribirlo; la admisión al registro es una revisión manual, no un POST automático."  # @src=5571583ad484
  m04-l1:
    # | Trust no frontend: confirmation policy and server-side verification
    title: "No confíes en ningún frontend: política de confirmación y verificación del lado del servidor"  # @src=25d6143c88db
    blocks:
      harden-verify:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the token program BEFORE trusting any transfer in the tx.
          0: "Revisa el programa de tokens ANTES de confiar en cualquier transferencia de la tx."  # @src=034740b71003
          # | Compute the amount from postAmount - preAmount on your own ATA, never from a
          # | client field.
          1: "Calcula el monto desde postAmount - preAmount en tu propia ATA, nunca desde un campo del cliente."  # @src=1b4f129d5d68
          # | Order matters: return the first failing reason so tests see exactly one.
          2: "El orden importa: devuelve la primera razón que falla para que las pruebas vean exactamente una."  # @src=2513218efacc
        tests:                      # keyed by test case id
          t1:
            # | A real, correct USDC payment for the order verifies.
            description: "Un pago real y correcto en USDC para el pedido verifica."  # @src=7497771a1ab2
          t2:
            # | A signature already fulfilled (webhook retry / replay) is rejected as
            # | duplicate.
            description: "Una firma ya despachada (reintento de webhook / repetición) se rechaza como duplicate."  # @src=b16bf67c7446
          t3:
            # | Right mint and amount but moved by the wrong token program is rejected.
            description: "Mint y monto correctos pero movidos por el programa de tokens equivocado se rechaza."  # @src=d98aec67f091
          t4:
            # | A different token (USDT) landing in the ATA is not USDC and is rejected.
            description: "Un token distinto (USDT) que aterriza en la ATA no es USDC y se rechaza."  # @src=da7818f13bd1
          t5:
            # | The balance delta on our own account is short of the order amount.
            description: "El delta de saldo en nuestra propia cuenta queda corto contra el monto del pedido."  # @src=ae5ee3d2fa6c
          t6:
            # | Correct payment but the memo ties it to a different order.
            description: "Pago correcto pero el memo lo ata a otro pedido."  # @src=6eb1af7eedc2
          t7:
            # | A transaction whose transfers never touch the recipient ATA (attacker paid
            # | their own account) is rejected as no-payment.
            description: "Una transacción cuyas transferencias nunca tocan la ATA del destinatario (el atacante le pagó a su propia cuenta) se rechaza como no-payment."  # @src=b1e9aa360d18
          t8:
            # | The fulfilled-signature set is non-empty but holds OTHER orders' signatures:
            # | this payment is new and must verify (a length check would reject every sale
            # | after the first).
            description: "El conjunto de firmas despachadas no está vacío pero tiene firmas de OTROS pedidos: este pago es nuevo y tiene que verificar (una comprobación de longitud rechazaría cada venta después de la primera)."  # @src=018b888f607a
          t9:
            # | A wholesale settlement one base unit short, above 2**53: exact with BigInt,
            # | invisible to Number() (both sides round to the same float).
            description: "Una liquidación mayorista corta por una unidad base, por encima de 2**53: exacta con BigInt, invisible para Number() (los dos lados redondean al mismo float)."  # @src=76c7bd829cf7
          t10:
            # | A debit OUT of our ATA (a clawback, post < pre) is a negative delta, never a
            # | payment: taking its absolute value would score it as a full credit.
            description: "Un débito que SALE de nuestra ATA (una reversión, post < pre) es un delta negativo, nunca un pago: tomar su valor absoluto lo puntuaría como un crédito completo."  # @src=053b33ebad56
          t11:
            # | A memo for order ORD-42710 must not fulfil ORD-4271: the reference check is
            # | equality, not containment.
            description: "Un memo para el pedido ORD-42710 no debe despachar ORD-4271: la comprobación de reference es igualdad, no contención."  # @src=e713763accd9
          t12:
            # | The other containment direction: a memo of ORD-427 is a prefix of the order
            # | ref and must still be rejected.
            description: "La otra dirección de la contención: un memo de ORD-427 es un prefijo de la reference del pedido e igual tiene que ser rechazado."  # @src=a804b9b7dec9
          t13:
            # | A look-alike mint sharing USDC's first forty characters is still the wrong
            # | mint: addresses compare whole, never by prefix.
            description: "Un mint imitación que comparte los primeros cuarenta caracteres de USDC sigue siendo el mint equivocado: las direcciones se comparan enteras, nunca por prefijo."  # @src=3e5bebaa9e6b
          t14:
            # | A settlement exactly at expectedAmount, both above 2**53: converting to
            # | Number() first rounds the delta down and a mixed number/bigint compare
            # | wrongly reads it as underpaid, even though BigInt subtraction shows it is
            # | exact.
            description: "Una liquidación exactamente en expectedAmount, las dos por encima de 2**53: convertir a Number() primero redondea el delta hacia abajo y una comparación mezclada de number/bigint lo lee mal como underpaid, aunque la resta con BigInt muestra que es exacto."  # @src=5dfeafbf6a57
      check-policy:                      # quiz
        questions:
          q1:
            # | Wavelength waits for the strongest commitment level on a $6 single-record
            # | checkout and settles for the middle one on a $6,000 wholesale invoice. Your
            # | lead says that is backwards. Which pairing matches the risk?
            prompt: "Wavelength espera el nivel de commitment más fuerte en un checkout de un solo disco de $6 y se conforma con el del medio en una factura mayorista de $6,000. Tu líder dice que eso está al revés. ¿Qué emparejamiento coincide con el riesgo?"  # @src=8cc6b494eeb0
            # | Commitment is a policy knob tied to the cost of a reversed payment.
            # | `confirmed` (about 1-2s, ecosystem estimate) fits low-value goods;
            # | `finalized` (roughly 31+ confirmations) earns its latency only when a
            # | fork-dropped payment would actually hurt. `processed` is UI-only.
            explanation: "El commitment es una perilla de política atada al costo de un pago revertido. `confirmed` (unos 1-2s, estimación del ecosistema) le queda bien a la mercancía de bajo valor; `finalized` (alrededor de 31+ confirmaciones) se gana su latencia solo cuando un pago descartado por un fork de verdad dolería. `processed` es solo para la UI."  # @src=ee4573f894ab
            options:                 # source order — keep it
              c:
                # | Gate both on `finalized`: waiting 31+ confirmations on every order gives
                # | ops one uniform rule instead of a judgement call.
                label: "Condiciona las dos a `finalized`: esperar 31+ confirmaciones en cada pedido le da a ops una regla uniforme en vez de una decisión de criterio."  # @src=8e0e64cebf2c
                # | A uniform rule is not free. Finalizing a $6 record adds about 10s of
                # | ecosystem-estimated latency for risk that rounds to zero, and commitment
                # | is a per-value decision, not a constant.
                feedback: "Una regla uniforme no es gratis. Finalizar un disco de $6 agrega unos 10s de latencia estimada por el ecosistema por un riesgo que redondea a cero, y el commitment es una decisión por valor, no una constante."  # @src=eeb2a7611df2
              a:
                # | Gate the $6 record on `confirmed` and the $6,000 invoice on `finalized`.
                label: "Condiciona el disco de $6 a `confirmed` y la factura de $6,000 a `finalized`."  # @src=2dfdf303de70
                # | Commitment trades latency for fork risk, and expected loss scales with
                # | the ticket; value is the input, not the product category.
                feedback: "El commitment cambia latencia por riesgo de fork, y la pérdida esperada escala con el ticket; el valor es la entrada, no la categoría de producto."  # @src=0f21dc75548a
              d:
                # | Gate both on `confirmed`; the wholesale invoice is a known account under
                # | contract, so that risk is covered.
                label: "Condiciona las dos a `confirmed`; la factura mayorista es una cuenta conocida bajo contrato, así que ese riesgo está cubierto."  # @src=e53b70f1ad27
                # | Commitment prices fork risk, and a fork does not care who the buyer is.
                # | Knowing the counterparty helps with collections and with fraud; it does
                # | nothing about a block being dropped after you shipped.
                feedback: "El commitment le pone precio al riesgo de fork, y a un fork no le importa quién es el comprador. Conocer a la contraparte ayuda con la cobranza y con el fraude; no hace nada contra que un bloque sea descartado después de que despachaste."  # @src=31e3ef45665e
              b:
                # | Keep both on `processed`, since it returns fastest and the wallet
                # | already showed the buyer a success screen.
                label: "Deja las dos en `processed`, ya que devuelve más rápido y la billetera ya le mostró al comprador una pantalla de éxito."  # @src=513f2b126529
                # | `processed` is UI-only and can be dropped in a fork; it is never a
                # | fulfillment source of truth for either amount.
                feedback: "`processed` es solo para la UI y puede ser descartado en un fork; nunca es una fuente de verdad para despachar, para ninguno de los dos montos."  # @src=cdd346732346
          q2:
            # | Compared to your card-rail integration, what does the no-chargeback
            # | asymmetry actually change?
            prompt: "Comparada con tu integración de rieles de tarjeta, ¿qué cambia de verdad la asimetría de no tener chargebacks?"  # @src=392b5f560f4d
            # | Cards give you a costly reversal path; these rails do not. That asymmetry is
            # | exactly why the server, not the wallet's green check, must be the source of
            # | truth, and why the refund flow two lessons later is original construction.
            explanation: "Las tarjetas te dan una ruta de reversión cara; estos rieles no. Esa asimetría es exactamente por qué el servidor, y no el check verde de la billetera, tiene que ser la fuente de verdad, y por qué el flujo de reembolso de dos lecciones más adelante es construcción original."  # @src=f98dd83b5c46
            options:                 # source order — keep it
              c:
                # | Refunds become automatic since disputes can't happen, so no refund code
                # | is needed.
                label: "Los reembolsos se vuelven automáticos porque las disputas no pueden pasar, así que no hace falta código de reembolso."  # @src=e0cd411d90bf
                # | Disputes-as-chargebacks vanish, but refunds are a separate thing you
                # | must build by hand; they are absent from every official doc.
                feedback: "Las disputas-como-chargebacks desaparecen, pero los reembolsos son otra cosa distinta que tienes que construir a mano; están ausentes de todos los docs oficiales."  # @src=fe6984892954
              a:
                # | Nothing operationally: you still rely on the network to reverse a bad
                # | payment, the way an issuer claws back a card charge.
                label: "Nada en lo operativo: sigues confiando en que la red revierta un pago malo, igual que un emisor revierte un cargo de tarjeta."  # @src=44807928fe45
                # | There is no dispute window and no reversal path; the network will not
                # | claw anything back for you the way an issuer does.
                feedback: "No hay ventana de disputa ni ruta de reversión; la red no va a revertir nada por ti como lo hace un emisor."  # @src=a10592a933d9
              b:
                # | Fulfillment mistakes are final, so server-side verification is your only
                # | backstop.
                label: "Los errores de despacho son definitivos, así que la verificación del lado del servidor es tu único respaldo."  # @src=184dc37abe7e
                # | With no reversal path, the only control point sits before you ship. What
                # | it backstops is a fake payment, not a buyer who's changed their mind.
                feedback: "Sin ruta de reversión, el único punto de control está antes de que despaches. De lo que te protege es de un pago falso, no de un comprador que cambió de opinión."  # @src=1a52acf84d46
              d:
                # | Fraud drops to zero: payments are final once they settle, so fulfillment
                # | needs no verifying beyond the wallet's own screen.
                label: "El fraude cae a cero: los pagos son definitivos una vez que liquidan, así que el despacho no necesita ninguna verificación más allá de la propia pantalla de la billetera."  # @src=f91d19efa48b
                # | One direction of fraud closes and another opens wider. Nobody can claw a
                # | payment out of your account, but a buyer who gets you to ship against a
                # | payment that was never yours keeps the goods, and no rail exists to undo
                # | that.
                feedback: "Una dirección del fraude se cierra y otra se abre más. Nadie puede revertir un pago para sacarlo de tu cuenta, pero un comprador que consigue que despaches contra un pago que nunca fue tuyo se queda con la mercancía, y no existe riel que deshaga eso."  # @src=91a694d3ea11
      check-verify:                      # quiz
        questions:
          q3:
            # | Your verifier confirms a transaction exists with the right signature and the
            # | right USDC amount into your ATA, and fulfills. A buyer drains inventory for
            # | free. What did the check miss?
            prompt: "Tu verificador confirma que existe una transacción con la firma correcta y el monto correcto de USDC hacia tu ATA, y despacha. Un comprador vacía el inventario gratis. ¿Qué se le escapó a la comprobación?"  # @src=9c73f905920e
            # | Validating the mint is not enough; you must validate the token PROGRAM too
            # | (Token vs Token-2022). The verifier checks program, then mint, then the
            # | on-chain balance delta on your own account, never a client-supplied number.
            explanation: "Validar el mint no alcanza; tienes que validar también el PROGRAMA de tokens (Token vs Token-2022). El verificador revisa el programa, después el mint, después el delta de saldo on-chain en tu propia cuenta, nunca un número provisto por el cliente."  # @src=b3f8d8851d76
            options:                 # source order — keep it
              c:
                # | It never checked the token program, so a Token-2022 look-alike mint
                # | passed as classic-Token USDC.
                label: "Nunca revisó el programa de tokens, así que un mint imitación de Token-2022 pasó como USDC de Token clásico."  # @src=1ed02c291e62
                # | An asset's identity is the owning program and the mint together, and a
                # | decoded amount names neither; even both are not the last check, since
                # | the delta on your own account decides.
                feedback: "La identidad de un activo es el programa dueño y el mint juntos, y un monto decodificado no nombra a ninguno de los dos; ni siquiera los dos son la última comprobación, porque decide el delta en tu propia cuenta."  # @src=1808afbce06e
              d:
                # | It fulfilled at `confirmed`, so a fork dropped that block minutes after
                # | the record shipped.
                label: "Despachó en `confirmed`, así que un fork descartó ese bloque minutos después de que se despachó el disco."  # @src=cf66aabc1ec9
                # | A dropped block leaves nothing behind: getTransaction stops answering
                # | for that signature, so the check would fail rather than pass. Repeatable
                # | free inventory means a payment that keeps passing your checks, not one
                # | that disappears.
                feedback: "Un bloque descartado no deja nada atrás: getTransaction deja de responder por esa firma, así que la comprobación fallaría en vez de pasar. Inventario gratis repetible quiere decir un pago que sigue pasando tus comprobaciones, no uno que desaparece."  # @src=5115e7027bd4
              a:
                # | The blockhash expired, so the amount it read was stale: getTransaction
                # | returned a pre-expiry snapshot of the ATA instead of the settled
                # | balance.
                label: "El blockhash venció, así que el monto que leyó estaba viejo: getTransaction devolvió una foto de la ATA anterior al vencimiento en vez del saldo liquidado."  # @src=6f153c8436b7
                # | An expired blockhash means the transaction never lands at all, and
                # | getTransaction reports the balances the runtime actually recorded; a
                # | landed transfer with a real delta is not stale.
                feedback: "Un blockhash vencido quiere decir que la transacción no aterriza en absoluto, y getTransaction reporta los saldos que el runtime de verdad registró; una transferencia que aterrizó con un delta real no está vieja."  # @src=b56a14e5d7a2
              b:
                # | It should have trusted the wallet's `paid: true` flag as a corroborating
                # | second signal.
                label: "Debería haber confiado en la bandera `paid: true` de la billetera como segunda señal que corrobora."  # @src=8d971b9e00db
                # | The frontend flag is the thing you must NOT trust; it is spoofable, and
                # | it is the whole reason server-side verification exists.
                feedback: "La bandera del frontend es justamente la cosa en la que NO tienes que confiar; es falsificable, y es toda la razón por la que existe la verificación del lado del servidor."  # @src=43a93ff060d4
          q4:
            # | Why does the verifier store every processed signature, and where does that
            # | bite?
            prompt: "¿Por qué el verificador guarda cada firma procesada, y dónde muerde eso?"  # @src=3560413de66c
            # | Signatures are deterministic, so a redelivered webhook produces the same
            # | signature, and storing processed ones makes fulfillment exactly-once. The
            # | cost is unbounded state, so you evict past a horizon (for example, beyond
            # | the blockhash lifetime plus a margin).
            explanation: "Las firmas son deterministas, así que un webhook reentregado produce la misma firma, y guardar las procesadas hace que el despacho sea exactamente-una-vez. El costo es estado sin límite, así que desalojas pasado un horizonte (por ejemplo, más allá del tiempo de vida del blockhash más un margen)."  # @src=665e7d88f379
            options:                 # source order — keep it
              a:
                # | To prevent double-fulfillment on webhook redelivery; the set grows
                # | unbounded, so it needs an eviction horizon.
                label: "Para evitar el doble despacho en la reentrega del webhook; el conjunto crece sin límite, así que necesita un horizonte de desalojo."  # @src=d001261b3235
                # | A redelivered event carries the same deterministic signature, which is
                # | what makes fulfillment exactly-once; a horizon shorter than blockhash
                # | lifetime plus retries reopens the hole.
                feedback: "Un evento reentregado lleva la misma firma determinista, que es lo que hace que el despacho sea exactamente-una-vez; un horizonte más corto que el tiempo de vida del blockhash más los reintentos vuelve a abrir el hueco."  # @src=f160fabbf769
              d:
                # | To prevent double-fulfillment on webhook redelivery; entries get evicted
                # | once the blockhash window closes about 45 seconds later.
                label: "Para evitar el doble despacho en la reentrega del webhook; las entradas se desalojan una vez que la ventana del blockhash se cierra unos 45 segundos después."  # @src=22bdd660340d
                # | Right reason, horizon too short. Blockhash expiry closes on-chain
                # | replay, but your webhook provider will happily redeliver long after
                # | that, so the entry has to outlive the retry window as well as the
                # | chain's.
                feedback: "Razón correcta, horizonte demasiado corto. El vencimiento del blockhash cierra la repetición on-chain, pero tu proveedor de webhooks va a reentregar alegremente mucho después de eso, así que la entrada tiene que sobrevivir a la ventana de reintentos además de a la de la blockchain."  # @src=b1bfb09aaed2
              c:
                # | To satisfy Alpenglow's finality requirement: a payment counts as trusted
                # | only once its signature has been retained across the finality window.
                label: "Para satisfacer el requisito de finality de Alpenglow: un pago cuenta como confiable solo una vez que su firma se retuvo a lo largo de la ventana de finality."  # @src=383898e036d0
                # | Alpenglow is a labeled roadmap flag here, not a live gate; today's dedup
                # | is about webhook retries, not finality mechanics.
                feedback: "Alpenglow aquí es una marca de roadmap etiquetada, no una barrera viva; el dedup de hoy se trata de reintentos de webhook, no de la mecánica de finality."  # @src=a80c8c61fd40
              b:
                # | To speed up getTransaction: a cached signature skips the RPC round-trip,
                # | so a redelivered event costs one local lookup instead of a fetch.
                label: "Para acelerar getTransaction: una firma cacheada se salta el viaje de ida y vuelta al RPC, así que un evento reentregado cuesta una búsqueda local en vez de un fetch."  # @src=367773e9518a
                # | The stored set is a dedup guard, not an RPC cache; verification still
                # | fetches the transaction to check it.
                feedback: "El conjunto guardado es una guarda de dedup, no un caché de RPC; la verificación igual trae la transacción para revisarla."  # @src=e88ad7a9172e
  m04-l2:
    # | Webhooks that lie: ingestion and idempotency
    title: "Webhooks que mienten: ingesta e idempotencia"  # @src=aa0d4a33fc70
    blocks:
      check:                      # quiz
        questions:
          q5:
            # | Helius redelivers your TRANSFER webhook three times for one real payment.
            # | Why, and what keeps you from shipping three records?
            prompt: "Helius reentrega tu webhook TRANSFER tres veces por un solo pago real. ¿Por qué, y qué te evita despachar tres discos?"  # @src=ed1e5e069f53
            # | Retries on unsuccessful (roughly non-2xx) responses mean duplicate events
            # | are normal. The transaction signature is deterministic and unique per
            # | payment, so keying idempotency on it makes fulfillment exactly-once. And
            # | this one you do not have to infer: Helius's own webhook best practices say
            # | to use the `signature` field to deduplicate.
            explanation: "Los reintentos ante respuestas sin éxito (a grandes rasgos, no-2xx) significan que los eventos duplicados son normales. La firma de la transacción es determinista y única por pago, así que indexar la idempotencia sobre ella hace que el despacho sea exactamente-una-vez. Y esta no la tienes que inferir: las propias buenas prácticas de webhooks de Helius dicen que uses el campo `signature` para deduplicar."  # @src=725ce4ce6f9d
            options:                 # source order — keep it
              c:
                # | It's a bug in helius-sdk 3.1.0's delivery retry loop; pin an older SDK
                # | version and the duplicate deliveries stop.
                label: "Es un bug en el loop de reintentos de entrega que tiene helius-sdk 3.1.0; fija una versión más vieja del SDK y las entregas duplicadas paran."  # @src=18087908aa31
                # | Redelivery on non-2xx is documented behavior, not a bug; the fix is
                # | idempotency, not a downgrade.
                feedback: "La reentrega ante un no-2xx es comportamiento documentado, no un bug; el arreglo es idempotencia, no un downgrade."  # @src=23bf414268af
              a:
                # | Three separate payments landed, so fulfill each: one delivery is emitted
                # | per settled transfer, and three deliveries mean three settled transfers.
                label: "Aterrizaron tres pagos separados, así que despacha cada uno: se emite una entrega por transferencia liquidada, y tres entregas significan tres transferencias liquidadas."  # @src=4e13fc52dda6
                # | One payment produces one signature no matter how many times the webhook
                # | is delivered; deliveries are not transfers, and treating them as
                # | payments over-fulfills.
                feedback: "Un pago produce una firma sin importar cuántas veces se entregue el webhook; las entregas no son transferencias, y tratarlas como pagos despacha de más."  # @src=8826ce35786f
              b:
                # | Helius retries any event your server didn't answer with a 2xx, so
                # | de-dupe on the transaction signature.
                label: "Helius reintenta cualquier evento que tu servidor no contestó con un 2xx, así que deduplica sobre la firma de la transacción."  # @src=1de4123566ad
                # | At-least-once delivery means the key has to come from the payment rather
                # | than the delivery; a per-delivery id changes on every retry and lets all
                # | three through.
                feedback: "La entrega al-menos-una-vez quiere decir que la clave tiene que venir del pago y no de la entrega; un id por entrega cambia en cada reintento y deja pasar a las tres."  # @src=fd6c6cd11816
              d:
                # | Helius retries on any non-2xx answer, so de-dupe on a per-delivery event
                # | id off the request rather than on anything in the payment.
                label: "Helius reintenta ante cualquier respuesta no-2xx, así que deduplica sobre un id de evento por entrega sacado de la petición y no sobre nada del payload."  # @src=bdd65d24f290
                # | The diagnosis is right and the key is wrong, and it fails before you
                # | even get to the key: the enhanced payload has no delivery or attempt id
                # | in it. Its fields are `signature`, `type`, `slot`, `timestamp`,
                # | `feePayer`, `tokenTransfers` and the rest of the parsed transaction, and
                # | the one header you control, `authHeader`, is a constant you chose. There
                # | is nothing per-delivery to key on — and anything that did vary per
                # | attempt would differ across all three retries and let all three through.
                # | Only something derived from the payment stays constant.
                feedback: "El diagnóstico está bien y la clave está mal, y falla antes de que siquiera llegues a la clave: el payload enhanced no tiene ningún id de entrega ni de intento adentro. Sus campos son `signature`, `type`, `slot`, `timestamp`, `feePayer`, `tokenTransfers` y el resto de la transacción parseada, y el único header que controlas, `authHeader`, es una constante que elegiste tú. No hay nada por entrega sobre lo que indexar — y cualquier cosa que sí variara por intento diferiría a lo largo de los tres reintentos y dejaría pasar a las tres. Solo algo derivado del pago se mantiene constante."  # @src=6fa3f5f6cde5
          q6:
            # | A webhook arrives with a valid-looking TRANSFER payload and a signature
            # | you've never seen. Before writing an order, what must happen?
            prompt: "Llega un webhook con un payload TRANSFER que se ve válido y una firma que nunca viste. Antes de escribir un pedido, ¿qué tiene que pasar?"  # @src=83ee32702425
            # | A webhook is a notification, not proof. Every event runs through the m04-l1
            # | verifier against on-chain state before fulfillment; a spoofed payload fails
            # | verification and never reaches the ledger.
            explanation: "Un webhook es una notificación, no una demostración. Cada evento pasa por el verificador de m04-l1 contra el estado on-chain antes del despacho; un payload falsificado falla la verificación y nunca llega al libro mayor."  # @src=579d1e49f7c0
            options:                 # source order — keep it
              d:
                # | Check the shared secret on the request header; once the payload proves
                # | it came from Helius, its parsed amount and mint are trustworthy.
                label: "Revisa el secreto compartido en el header de la petición; una vez que el payload demuestra que vino de Helius, su monto y su mint parseados son confiables."  # @src=32243abf5658
                # | The auth header is a bouncer, not proof. A shared secret leaks, sits in
                # | a config dump, or gets guessed, and even a genuine delivery only tells
                # | you Helius saw something, never that the something paid this order.
                feedback: "El header de auth es un portero, no una demostración. Un secreto compartido se filtra, queda en un volcado de config, o lo adivinan, y hasta una entrega genuina solo te dice que Helius vio algo, nunca que ese algo pagó este pedido."  # @src=4ebe65c69118
              c:
                # | Verify the signature on-chain with the server-side verifier (program,
                # | mint, delta, memo) before the ledger records any fulfillment.
                label: "Verifica la firma on-chain con el verificador del lado del servidor (programa, mint, delta, memo) antes de que el libro mayor registre cualquier despacho."  # @src=9ac46279ef07
                # | The only field a webhook can be trusted for is the pointer. The rest is
                # | decoration until chain state confirms it, and that goes for any push
                # | source, your own frontend included.
                feedback: "El único campo para el que se le puede confiar a un webhook es el puntero. El resto es decoración hasta que el estado de la blockchain lo confirme, y eso vale para cualquier fuente push, tu propio frontend incluido."  # @src=dc6cfdeb09ed
              b:
                # | Answer 2xx immediately and fulfill, then verify asynchronously later if
                # | you have time.
                label: "Contesta 2xx de inmediato y despacha, después verifica de forma asíncrona más tarde si tienes tiempo."  # @src=87a5dcd430e2
                # | Fulfilling before verification is the spoof's whole attack; verification
                # | gates fulfillment, not the other way round.
                feedback: "Despachar antes de la verificación es todo el ataque de la falsificación; la verificación le pone la barrera al despacho, no al revés."  # @src=825054333987
              a:
                # | Trust the enhanced payload's amount and mint, since Helius already
                # | parsed them and re-checking is wasted work.
                label: "Confía en el monto y el mint del payload enhanced, porque Helius ya los parseó y volver a revisarlos es trabajo desperdiciado."  # @src=f7e6078c4df2
                # | The payload can be spoofed or simply wrong; the m04-l1 verifier exists
                # | precisely so you never fulfill from a webhook's numbers.
                feedback: "El payload puede estar falsificado o simplemente mal; el verificador de m04-l1 existe precisamente para que nunca despaches a partir de los números de un webhook."  # @src=25e2d9bbe2ed
          q7:
            # | Your endpoint starts timing out under load and Helius auto-disables the
            # | webhook. What is the real lesson for scaling ingestion?
            prompt: "Tu endpoint empieza a expirar bajo carga y Helius deshabilita el webhook automáticamente. ¿Cuál es la lección de verdad para escalar la ingesta?"  # @src=20d958a9c587
            # | Auto-disable at sustained failure is a guardrail, not a bug. Webhooks fit
            # | merchant-ops volume; at indexing scale you move to Yellowstone gRPC, and
            # | this course hands that depth to Client-Side Mastery rather than teaching it
            # | here.
            explanation: "El auto-disable ante falla sostenida es una barrera de protección, no un bug. Los webhooks encajan con el volumen de merchant-ops; a escala de indexación pasas a Yellowstone gRPC, y este curso le entrega esa profundidad a Client-Side Mastery en vez de enseñarla acá."  # @src=b924b1df2c64
            options:                 # source order — keep it
              b:
                # | Raise the retry count and poll `getSignaturesForAddress` in a tight loop
                # | as the backup path, so no event is lost while the endpoint recovers
                # | under load.
                label: "Sube el conteo de reintentos y hazle polling a `getSignaturesForAddress` en un loop apretado como camino de respaldo, para que no se pierda ningún evento mientras el endpoint se recupera bajo carga."  # @src=ff3d5c085343
                # | RPC polling is exactly what the official guidance calls insufficient at
                # | scale; a tight loop worsens the load that disabled you rather than
                # | fixing it.
                feedback: "El polling por RPC es exactamente lo que la guía oficial llama insuficiente a escala; un loop apretado empeora la carga que te deshabilitó en vez de arreglarla."  # @src=7ce399766ce7
              c:
                # | Switch from Enhanced to Raw webhooks: Raw payloads are smaller, so your
                # | endpoint answers in time and never trips the auto-disable policy.
                label: "Cámbiate de webhooks Enhanced a Raw: los payloads Raw son más chicos, así que tu endpoint contesta a tiempo y nunca dispara la política de auto-disable."  # @src=f3776a19e01b
                # | Raw lowers latency but leaves the auto-disable-on-failure policy
                # | untouched; the failure is your endpoint, not the event type.
                feedback: "Raw baja la latencia pero deja intacta la política de auto-disable-ante-falla; la falla es tu endpoint, no el tipo de evento."  # @src=6dcce5d0fbda
              d:
                # | Shard the watch list across several webhooks pointing at the same
                # | endpoint, so no single one sustains enough failures to trip the
                # | guardrail.
                label: "Reparte la lista de vigilancia entre varios webhooks que apuntan al mismo endpoint, para que ninguno solo sostenga fallas suficientes como para disparar la barrera de protección."  # @src=c31ec3f66870
                # | Splitting the deliveries does not split the load: the same endpoint
                # | still receives every event and still times out, and now several webhooks
                # | accumulate failures instead of one. The bottleneck is handler capacity.
                feedback: "Dividir las entregas no divide la carga: el mismo endpoint igual recibe cada evento e igual expira, y ahora varios webhooks acumulan fallas en vez de uno. El cuello de botella es la capacidad del handler."  # @src=44b30447518d
              a:
                # | Webhooks disable at sustained failure by design; ingestion at volume
                # | belongs on Yellowstone gRPC indexing.
                label: "Los webhooks se deshabilitan ante falla sostenida por diseño; la ingesta a volumen le pertenece a la indexación con Yellowstone gRPC."  # @src=5be69390a60d
                # | Auto-disable is backpressure protecting the sender, and the fix is
                # | capacity, not a setting. A stream lifts the delivery ceiling but not the
                # | dedup requirement, since reconnects replay.
                feedback: "El auto-disable es backpressure protegiendo al que envía, y el arreglo es capacidad, no una configuración. Un stream sube el techo de entrega pero no el requisito de dedup, porque las reconexiones repiten."  # @src=6e6e9f77e38e
          q8:
            # | You've integrated Stripe before. Which mapping is the honest one for this
            # | webhook work?
            prompt: "Ya integraste Stripe antes. ¿Cuál mapeo es el honesto para este trabajo de webhooks?"  # @src=5c4a9e33e559
            # | The map-from-known: a Stripe integrator already de-dupes on idempotency keys
            # | and handles retries. Swap the idempotency key for the on-chain signature and
            # | the pattern transfers almost verbatim.
            explanation: "El mapa desde lo conocido: un integrador de Stripe ya deduplica sobre claves de idempotencia y maneja reintentos. Cambia la clave de idempotencia por la firma on-chain y el patrón se traslada casi textualmente."  # @src=6ec4a0ac5d2e
            options:                 # source order — keep it
              b:
                # | It's Stripe webhook hygiene with different keys: the transaction
                # | signature plays the idempotency key's role.
                label: "Es higiene de webhooks de Stripe con claves distintas: la firma de la transacción hace el papel de la clave de idempotencia."  # @src=9c20d8592085
                # | The delivery semantics are identical, and the hygiene ports over intact;
                # | Stripe signs its payloads, though, and here you re-read the chain
                # | instead.
                feedback: "La semántica de entrega es idéntica, y la higiene se traslada intacta; eso sí, Stripe firma sus payloads, y acá en cambio vuelves a leer la blockchain."  # @src=975bf167509d
              a:
                # | There's no analogy; chain webhooks are a brand-new discipline with
                # | nothing in a PSP integration to reuse.
                label: "No hay analogía; los webhooks de blockchain son una disciplina totalmente nueva sin nada que reusar de una integración con un PSP."  # @src=3cf52f377c8f
                # | It is largely the same discipline; pretending it's novel hides the reuse
                # | of hard-won PSP hygiene.
                feedback: "Es en gran medida la misma disciplina; fingir que es novedosa esconde la reutilización de higiene de PSP ganada con esfuerzo."  # @src=5b6846985584
              d:
                # | It's Stripe webhook hygiene with different keys, but re-reading the
                # | chain has no Stripe counterpart at all.
                label: "Es higiene de webhooks de Stripe con claves distintas, pero volver a leer la blockchain no tiene ninguna contraparte en Stripe."  # @src=40f07980454f
                # | That half ports over too. Retrieving the PaymentIntent before fulfilling
                # | is the Stripe habit the chain read replaces, and an integrator who
                # | already refuses to fulfil from a return URL is doing the same thing
                # | against a different source of truth.
                feedback: "Esa mitad también se traslada. Traer el PaymentIntent antes de despachar es el hábito de Stripe que la lectura de la blockchain viene a reemplazar, y un integrador que ya se niega a despachar a partir de una URL de retorno está haciendo lo mismo contra una fuente de verdad distinta."  # @src=0e0d13ff1f24
              c:
                # | It maps to Stripe's settlement report rather than its webhooks, since
                # | the shared discipline is end-of-day matching of payouts against orders,
                # | not event delivery.
                label: "Mapea al reporte de liquidación de Stripe y no a sus webhooks, porque la disciplina compartida es el cruce de fin de día de los desembolsos contra los pedidos, no la entrega de eventos."  # @src=78afd2db95a5
                # | End-of-day matching is a later lesson's reconciliation work; the direct
                # | map here is Stripe's webhook idempotency, not its settlement report.
                feedback: "El cruce de fin de día es el trabajo de conciliación de una lección posterior; el mapa directo acá es la idempotencia de webhooks de Stripe, no su reporte de liquidación."  # @src=cb55917c342b
  m04-l3:
    # | Reconciliation, refunds, and partial fills: the missing manual
    title: "Conciliación, reembolsos y pagos parciales: el manual que falta"  # @src=4ca154c18224
    blocks:
      check:                      # quiz
        questions:
          q9:
            # | You want one reconciler for both Solana Pay checkouts and (later) x402 API
            # | payments. What makes that possible?
            prompt: "Quieres un solo conciliador tanto para los checkouts de Solana Pay como para (más adelante) los pagos de API x402. ¿Qué hace eso posible?"  # @src=c5b1e81a9dd2
            # | Reconciliation converges: a Solana Pay `reference` and an x402 `extra.memo`
            # | invoice id both carry the order id in a searchable field, with no unique
            # | deposit address needed. One reconciler serves both, and the x402 half is
            # | seeded here and cashed in at module 7.
            explanation: "La conciliación converge: una `reference` de Solana Pay y un id de factura en el `extra.memo` de x402 llevan los dos el id de pedido en un campo buscable, sin necesidad de una dirección de depósito única. Un solo conciliador sirve a los dos, y la mitad de x402 se siembra aquí y se cobra en el módulo 7."  # @src=09c0cf6b07fb
            options:                 # source order — keep it
              c:
                # | Solana Pay reference keys and x402 extra.memo invoice ids are the same
                # | idea: one order-id-in-a-field pattern reconciles both.
                label: "Las reference keys de Solana Pay y los ids de factura en extra.memo de x402 son la misma idea: un solo patrón de id-de-pedido-en-un-campo concilia los dos."  # @src=39287646688d
                # | Both rails let you choose the order id up front and put it somewhere
                # | searchable, which is all a reconciler needs. The lookup differs, since
                # | an account key is not queried like a memo.
                feedback: "Los dos rieles te dejan elegir el id de pedido de entrada y ponerlo en algún lugar buscable, que es todo lo que necesita un conciliador. La búsqueda difiere, porque una clave de cuenta no se consulta como un memo."  # @src=86996cd677c4
              d:
                # | x402 payments settle through a facilitator ledger, so a second
                # | reconciler tracks those invoices and you join both nightly.
                label: "Los pagos x402 se liquidan a través de un libro mayor de facilitador, así que un segundo conciliador rastrea esas facturas y unes los dos cada noche."  # @src=6995f223b4f0
                # | Two ledgers joined nightly is the thing the convergence saves you from.
                # | Both rails hand you an order id in a searchable field, so both settle
                # | into one ledger and one matcher reads them.
                feedback: "Tener dos libros mayores unidos cada noche es de lo que te salva la convergencia. Los dos rieles te entregan un id de pedido en un campo buscable, así que los dos se liquidan en un solo libro mayor y un solo emparejador los lee."  # @src=2e857ed55456
              b:
                # | They share a mint, so matching on the USDC mint uniquely identifies each
                # | order.
                label: "Comparten un mint, así que emparejar por el mint de USDC identifica de forma única cada pedido."  # @src=f01a198ae429
                # | Many orders share one mint; the mint can't identify an individual
                # | invoice; the reference/memo does.
                feedback: "Muchos pedidos comparten un mint; el mint no puede identificar una factura individual; la reference/memo sí."  # @src=e049354eaa95
              a:
                # | Both rails require a unique deposit address per order, so you match on
                # | the address.
                label: "Los dos rieles requieren una dirección de depósito única por pedido, así que emparejas por la dirección."  # @src=1d9ec367653e
                # | The whole point is that you do NOT need unique deposit addresses;
                # | matching is by reference/memo, not by address.
                feedback: "Todo el punto es que NO necesitas direcciones de depósito únicas; el emparejamiento es por reference/memo, no por dirección."  # @src=4601794d1337
          q10:
            # | There is no refunds page anywhere in Solana's payments docs. What does that
            # | tell you about how to build one?
            prompt: "En los docs de pagos de Solana no hay página de reembolsos en ninguna parte. ¿Qué te dice eso sobre cómo construir una?"  # @src=649b7d66986d
            # | Chargebacks were designed out, so there's no refunds doc, and the reversal
            # | is yours. You push stablecoins back to the originating wallet (Stripe's own
            # | model) and record the refund against the origin signature so it's auditable.
            explanation: "Los chargebacks se diseñaron fuera, así que no hay doc de reembolsos, y la reversión es tuya. Empujas stablecoins de vuelta a la billetera de origen (el modelo propio de Stripe) y registras el reembolso contra la firma de origen para que sea auditable."  # @src=5603a29cf04c
            options:                 # source order — keep it
              d:
                # | You reverse it with a second transfer signed by the buyer, since the
                # | original payment left you authorized to pull it back.
                label: "Lo reviertes con una segunda transferencia firmada por el comprador, porque el pago original te dejó autorizado para sacarlo de vuelta."  # @src=19e9f4f3f4b0
                # | Paying you authorizes one transfer and nothing more. You hold no
                # | standing permission over the buyer's account, so the money can only go
                # | back the way it came: a fresh push that you fund and you sign.
                feedback: "Pagarte autoriza una transferencia y nada más. No tienes ningún permiso permanente sobre la cuenta del comprador, así que el dinero solo puede volver por donde vino: un push nuevo que financias tú y firmas tú."  # @src=582c8f2da2ff
              b:
                # | Refunds are impossible on these rails by design, so you must direct
                # | buyers to file a chargeback.
                label: "Los reembolsos son imposibles en estos rieles por diseño, así que tienes que dirigir a los compradores a presentar un chargeback."  # @src=3ba8717a1bf3
                # | Chargebacks don't exist here; refunds are absolutely possible, and you
                # | build them yourself as push payments.
                feedback: "Los chargebacks no existen aquí; los reembolsos son absolutamente posibles, y los construyes tú mismo como pagos push."  # @src=c64c63f61b79
              c:
                # | The omission means refunds ride the network's dispute system
                # | automatically, the way a card network resolves a claim with no merchant
                # | code involved.
                label: "La omisión quiere decir que los reembolsos van automáticamente sobre el sistema de disputas de la red, como una red de tarjetas resuelve una reclamación sin ningún código del comercio involucrado."  # @src=63b6a47a1771
                # | There is no network dispute system and no claim to resolve; the absence
                # | means you own the flow, not that it's automated for you.
                feedback: "No hay sistema de disputas de red ni ninguna reclamación que resolver; la ausencia quiere decir que el flujo es tuyo, no que esté automatizado para ti."  # @src=22769b64ade0
              a:
                # | Refunds are original construction here: a reverse push-payment linked in
                # | the ledger to its origin signature.
                label: "Los reembolsos aquí son construcción original: un pago push inverso enlazado en el libro mayor a su firma de origen."  # @src=9905f9aee43c
                # | A reversal the protocol does not provide is just another payment, which
                # | means it needs the same idempotency: a retried refund pays twice.
                feedback: "Una reversión que el protocolo no provee es solo otro pago, lo que quiere decir que necesita la misma idempotencia: un reembolso reintentado paga dos veces."  # @src=b0504bc8d982
          q11:
            # | Before pushing a refund for a returned record, what must you confirm, and
            # | why?
            prompt: "Antes de empujar un reembolso por un disco devuelto, ¿qué tienes que confirmar, y por qué?"  # @src=a2040e17b2cb
            # | No chargeback protects you either. A refund lands irreversibly, so verify
            # | the origin payment reached finality before reversing it. Otherwise a payment
            # | a fork dropped becomes a genuine refund you funded for nothing.
            explanation: "Ningún chargeback te protege tampoco. Un reembolso aterriza de forma irreversible, así que verifica que el pago de origen haya alcanzado finality antes de revertirlo. Si no, un pago que un fork descartó se vuelve un reembolso genuino que financiaste para nada."  # @src=cb46e206a2c4
            options:                 # source order — keep it
              d:
                # | That the origin payment reached `confirmed`, the checkout gate.
                label: "Que el pago de origen alcanzó `confirmed`, la barrera del checkout."  # @src=2ec2adcef0e7
                # | `confirmed` is the right gate for handing over a record you could ask
                # | for back. Sending money out is the one direction with no recovery, so it
                # | buys the level above: a fork that drops the origin leaves your refund
                # | standing alone.
                feedback: "`confirmed` es la barrera correcta para entregar un disco que podrías pedir de vuelta. Sacar dinero es la única dirección sin recuperación, así que eso compra el nivel de arriba: un fork que descarta el origen deja tu reembolso en pie y solo."  # @src=856a7f8a6e61
              a:
                # | That the buyer's wallet is still online, so the refund doesn't bounce.
                label: "Que la billetera del comprador sigue en línea, para que el reembolso no rebote."  # @src=471a223c446c
                # | A push payment to a wallet address doesn't require the buyer online;
                # | that's not the risk here.
                feedback: "Un pago push a una dirección de billetera no requiere que el comprador esté en línea; ese no es el riesgo aquí."  # @src=929312901a43
              c:
                # | That ~150 blocks have passed and the origin blockhash expired, so no
                # | replay can reach your treasury.
                label: "Que pasaron ~150 bloques y el blockhash de origen venció, así que ninguna repetición puede llegar a tu tesorería."  # @src=3a9ca4bf322b
                # | Blockhash expiry governs whether a transaction can still land, and a
                # | landed transfer cannot be replayed; finality, not expiry, is the
                # | guarantee that makes a refund safe.
                feedback: "El vencimiento del blockhash gobierna si una transacción todavía puede aterrizar, y una transferencia que ya aterrizó no se puede repetir; la finality, no el vencimiento, es la garantía que hace seguro un reembolso."  # @src=1a634a130a86
              b:
                # | That the origin payment finalized; a push refund is irreversible.
                label: "Que el pago de origen alcanzó finality; un reembolso push es irreversible."  # @src=d73ebcd77999
                # | Reversing a payment that a fork can still drop hands the buyer a gift
                # | you cannot claw back; finality is necessary but not sufficient, since an
                # | earlier reversal on that signature pays twice.
                feedback: "Revertir un pago que un fork todavía puede descartar le entrega al comprador un regalo que no puedes recuperar; la finality es necesaria pero no suficiente, porque una reversión anterior sobre esa firma paga dos veces."  # @src=8a842f1ab6c4
          q12:
            # | A buyer sends 0.4 of a record's price. Which is a defensible partial-fill
            # | policy, stated as a trade-off?
            prompt: "Un comprador manda 0.4 del precio de un disco. ¿Cuál es una política de pago parcial defendible, declarada como contrapartida?"  # @src=1feff706e626
            # | Overpay/underpay/partial-fill are policy trade-offs, not defaults. Holding
            # | an underpaid order and routing it to an explicit, stated resolution keeps
            # | fulfillment auditable and defensible; silent fulfillment and ungated
            # | auto-refunds each fail a different way.
            explanation: "El pago de más / el pago de menos / el pago parcial son contrapartidas de política, no valores por defecto. Retener un pedido underpaid y rutearlo a una resolución explícita y declarada mantiene el despacho auditable y defendible; el despacho silencioso y los auto-reembolsos sin barrera fallan cada uno de una manera distinta."  # @src=d74b67e70f17
            options:                 # source order — keep it
              a:
                # | Silently fulfill the order anyway, since the buyer clearly intended to
                # | pay in full.
                label: "Despacha el pedido en silencio de todas formas, porque el comprador claramente tenía la intención de pagar completo."  # @src=1f70bea3d69f
                # | Silent fulfillment on underpayment invites abuse and disputes; intent is
                # | not a payment.
                feedback: "El despacho silencioso ante un pago de menos invita al abuso y a las disputas; la intención no es un pago."  # @src=5fc88b177652
              c:
                # | Hold the order as underpaid and route it to a stated policy: a top-up
                # | window or refund-minus-fee.
                label: "Retén el pedido como underpaid y rutéalo a una política declarada: una ventana para completar el pago o reembolso menos comisión."  # @src=8d84d604367b
                # | An explicit underpaid state keeps the ledger auditable and the
                # | resolution reviewable; a policy published after the fact is how
                # | underpayment turns into a dispute.
                feedback: "Un estado underpaid explícito mantiene el libro mayor auditable y la resolución revisable; una política publicada después de los hechos es cómo un pago de menos se vuelve una disputa."  # @src=f38c89a6804f
              b:
                # | Auto-refund every overpayment and underpayment instantly with no guard,
                # | so the ledger always returns to a clean paid-or-refunded binary.
                label: "Auto-reembolsa al instante cada pago de más y cada pago de menos sin guarda, así el libro mayor siempre vuelve a un binario limpio de pagado-o-reembolsado."  # @src=085110e1142e
                # | That clean binary is bought with a griefing loop: an attacker churns
                # | your refund path at will, so the policy needs a guard.
                feedback: "Ese binario limpio se compra con un loop de griefing: un atacante hace girar tu camino de reembolso a su antojo, así que la política necesita una guarda."  # @src=b7fbc2256a07
              d:
                # | Ship the record now and invoice the buyer for the remaining 60%, since a
                # | partial payment shows intent to pay in full.
                label: "Despacha el disco ahora y factúrale al comprador el 60% restante, porque un pago parcial muestra la intención de pagar completo."  # @src=e104258aa080
                # | That is extending credit on a rail with no collections arm. Once the
                # | record leaves, your only lever is asking nicely, and the balance you are
                # | owed has no dispute path, no reversal and no acquirer behind it.
                feedback: "Eso es dar crédito en un riel sin brazo de cobranzas. Una vez que el disco se va, tu única palanca es pedir amablemente, y el saldo que te deben no tiene camino de disputa, ni reversión, ni adquirente detrás."  # @src=d606f5058891
  m05-l1:
    # | The delegate primitive: approve once, pull on schedule
    title: "La primitiva del delegado: aprueba una vez, haz el pull según el calendario"  # @src=b6811d646c7c
    blocks:
      check:                      # quiz
        questions:
          m05-l1-q1:
            # | Your crank is approved as delegate for 60 USDC on a subscriber's token
            # | account. Later, wanting a second service, the subscriber runs ApproveChecked
            # | approving a DIFFERENT backend as delegate on the same token account. What
            # | happens to your crank's approval?
            prompt: "Tu crank está aprobado como delegado por 60 USDC en la cuenta de token de un suscriptor. Más tarde, queriendo un segundo servicio, el suscriptor corre ApproveChecked aprobando a un backend DISTINTO como delegado en la misma cuenta de token. ¿Qué le pasa a la aprobación de tu crank?"  # @src=1b34148479dd
            # | One active delegate per token account. Approving a new delegate
            # | automatically revokes the previous one, which is why the raw primitive
            # | supports only a single live subscription per (user, mint).
            explanation: "Un delegado activo por cuenta de token. Aprobar un delegado nuevo revoca automáticamente al anterior, que es la razón por la que la primitiva cruda soporta solo una única suscripción viva por (usuario, mint)."  # @src=33382790eaf1
            options:                 # source order — keep it
              d:
                # | The second ApproveChecked revokes your delegate, but the Token program
                # | notifies your crank first.
                label: "El segundo ApproveChecked revoca a tu delegado, pero el programa Token le notifica primero a tu crank."  # @src=eb6b689f9194
                # | The overwrite is silent. Nothing on-chain tells the evicted merchant it
                # | lost the slot, which is why the crank re-reads the account before every
                # | pull instead of trusting the approval it saw at signup.
                feedback: "La sobrescritura es silenciosa. Nada on-chain le dice al comercio desalojado que perdió el slot, que es la razón por la que el crank vuelve a leer la cuenta antes de cada pull en vez de confiar en la aprobación que vio en el alta."  # @src=24553783ca19
              b:
                # | The second ApproveChecked revokes your delegate entirely; your crank can
                # | no longer pull from that account.
                label: "El segundo ApproveChecked revoca a tu delegado por completo; tu crank ya no puede hacer pulls desde esa cuenta."  # @src=dc554fecdb05
                # | The account has one delegate field, and a new approval overwrites it,
                # | which is why the crank re-reads the delegate every cycle instead of
                # | trusting the one it saw last.
                feedback: "La cuenta tiene un campo de delegado, y una aprobación nueva lo sobrescribe, que es la razón por la que el crank vuelve a leer el delegado cada ciclo en vez de confiar en el último que vio."  # @src=b80c20a0fa30
              a:
                # | Both delegates coexist; each keeps its own separate 60-USDC allowance on
                # | the account.
                label: "Los dos delegados coexisten; cada uno conserva su propio límite separado de 60 USDC en la cuenta."  # @src=b660d7f2320f
                # | A token account has exactly one delegate slot, and there is no
                # | per-delegate ledger for a second approval to occupy.
                feedback: "Una cuenta de token tiene exactamente un slot de delegado, y no hay libro mayor por delegado que una segunda aprobación pueda ocupar."  # @src=802d40fa817c
              c:
                # | Your delegate keeps its 60 USDC but is paused until the second delegate
                # | is revoked.
                label: "Tu delegado conserva sus 60 USDC pero queda pausado hasta que el segundo delegado sea revocado."  # @src=b4102af168b6
                # | There is no pause state; the previous approval is overwritten, not
                # | suspended.
                feedback: "No hay estado de pausa; la aprobación anterior se sobrescribe, no se suspende."  # @src=23d63abe22a6
          m05-l1-q2:
            # | Your crank pulls 15 USDC per cycle via delegate-signed TransferChecked
            # | against a single 60-USDC ApproveChecked. After the third successful pull,
            # | what is the state of the allowance and what bounds a fourth pull?
            prompt: "Tu crank hace pulls de 15 USDC por ciclo vía TransferChecked firmado por el delegado contra un único ApproveChecked de 60 USDC. Después del tercer pull exitoso, ¿cuál es el estado del límite y qué acota un cuarto pull?"  # @src=413f741f2f1e
            # | The approved amount decrements per transfer: 60 → 45 → 30 → 15. The fourth
            # | pull empties it; the fifth reverts unless the owner signs a new
            # | ApproveChecked.
            explanation: "El monto aprobado se decrementa por transferencia: 60 → 45 → 30 → 15. El cuarto pull lo vacía; el quinto revierte a menos que el dueño firme un ApproveChecked nuevo."  # @src=a82effbef611
            options:                 # source order — keep it
              c:
                # | 15 USDC remains; a fourth 15-USDC pull exhausts the approval and clears
                # | the delegate, so a fifth fails with the delegate already revoked.
                label: "Quedan 15 USDC; un cuarto pull de 15 USDC agota la aprobación y limpia el delegado, así que un quinto falla con el delegado ya revocado."  # @src=56ab04b2edad
                # | The Token program sets the delegate to None at zero, freeing the slot by
                # | itself; the allowance is what does not come back, and only a fresh
                # | owner-signed ApproveChecked restores it.
                feedback: "El programa Token pone el delegado en None al llegar a cero, liberando el slot por sí mismo; el límite es lo que no vuelve, y solo un ApproveChecked fresco firmado por el dueño lo restaura."  # @src=a50e73529119
              a:
                # | 60 USDC remains; the approved amount is a standing per-transfer ceiling,
                # | so any number of 15-USDC pulls fit under it until the owner signs a
                # | Revoke.
                label: "Quedan 60 USDC; el monto aprobado es un techo permanente por transferencia, así que cualquier cantidad de pulls de 15 USDC entra por debajo hasta que el dueño firme un Revoke."  # @src=5ba5db19b479
                # | The approved amount is decremented on every delegate transfer, so it is
                # | a running balance rather than a standing ceiling.
                feedback: "El monto aprobado se decrementa en cada transferencia del delegado, así que es un saldo corriente y no un techo permanente."  # @src=9b0a4d3f79af
              b:
                # | 15 USDC remains, and the program automatically re-approves the crank at
                # | the start of each cycle.
                label: "Quedan 15 USDC, y el programa reaprueba automáticamente al crank al comienzo de cada ciclo."  # @src=32c61720d769
                # | Nothing re-approves automatically; a new approval is always a fresh
                # | signed action by the token-account owner.
                feedback: "Nada reaprueba automáticamente; una aprobación nueva es siempre una acción firmada fresca del dueño de la cuenta de token."  # @src=277e878091ca
              d:
                # | 15 USDC remains; the fourth pull empties the allowance, but the delegate
                # | slot stays yours until the owner signs a Revoke.
                label: "Quedan 15 USDC; el cuarto pull vacía el límite, pero el slot de delegado sigue siendo tuyo hasta que el dueño firme un Revoke."  # @src=7d9937be5de2
                # | The arithmetic is right and the ending is not. The decrement that lands
                # | on exactly zero clears the delegate field in the same instruction, so
                # | nobody has to sign anything for the slot to empty.
                feedback: "La aritmética está bien y el final no. El decremento que cae en exactamente cero limpia el campo de delegado en la misma instrucción, así que nadie tiene que firmar nada para que el slot se vacíe."  # @src=9ea2df6a43fe
          m05-l1-q3:
            # | A subscriber asks: 'If I approve your backend as a delegate, can you drain
            # | my whole wallet?' What is the honest, technically correct answer about the
            # | non-custodial guarantee?
            prompt: "Un suscriptor pregunta: 'Si apruebo tu backend como delegado, ¿pueden vaciarme toda la billetera?' ¿Cuál es la respuesta honesta y técnicamente correcta sobre la garantía no custodial?"  # @src=ebf150c055be
            # | The bound is on-chain: approved amount, specific mint, single account,
            # | revocable. That is the whole non-custodial promise: no custody of keys or
            # | funds, just a capped, revocable pull permission.
            explanation: "El límite está on-chain: monto aprobado, mint específico, una sola cuenta, revocable. Esa es toda la promesa no custodial: ninguna custodia de claves ni de fondos, solo un permiso de pull con tope y revocable."  # @src=e6480f83bda8
            options:                 # source order — keep it
              a:
                # | No. The delegate can move at most the approved amount of the approved
                # | mint from that one account, and you can revoke at any time.
                label: "No. El delegado puede mover como máximo el monto aprobado del mint aprobado desde esa única cuenta, y puedes revocar en cualquier momento."  # @src=a62f86207753
                # | The cap is the Token program's doing, not the merchant's restraint;
                # | inside it nothing asks the owner again, which makes bounded and harmless
                # | different claims.
                feedback: "El tope es obra del programa Token, no de la contención del comercio; dentro de él nada le vuelve a preguntar al dueño, lo que hace de acotado e inofensivo afirmaciones distintas."  # @src=0cea18e4e870
              b:
                # | Yes. A delegate holds signer authority over the token account, so every
                # | balance sitting in it, plus anything that lands there later, is
                # | reachable until you revoke.
                label: "Sí. Un delegado tiene autoridad de firmante sobre la cuenta de token, así que cada saldo que está ahí, más cualquier cosa que aterrice ahí después, es alcanzable hasta que revoques."  # @src=71ae4cd14ffc
                # | Delegate authority is bounded on-chain by the approved amount and mint;
                # | it is not full control of the account.
                feedback: "La autoridad del delegado está acotada on-chain por el monto aprobado y el mint; no es control total de la cuenta."  # @src=bdfd3e5f946a
              c:
                # | No, but only because the crank chooses to self-limit its withdrawals to
                # | the plan amount; the approval itself would let it take the whole
                # | balance.
                label: "No, pero solo porque el crank elige autolimitar sus retiros al monto del plan; la aprobación misma lo dejaría tomar todo el saldo."  # @src=43510d51d30e
                # | The limit is enforced by the Token program via the approved amount, not
                # | by the crank's goodwill.
                feedback: "El límite lo hace cumplir el programa Token vía el monto aprobado, no la buena voluntad del crank."  # @src=49ebae4f2d8e
              d:
                # | No. The approval carries the plan's term, so it lapses on its own once
                # | the subscription period ends, with nothing left for you to revoke.
                label: "No. La aprobación lleva el plazo del plan, así que caduca por sí sola una vez que termina el período de la suscripción, sin nada que te quede por revocar."  # @src=78cc97a3867f
                # | Nothing on the account records a term or a date. An approval sits there
                # | until it is spent to zero or the owner signs Revoke, which is how
                # | churned subscribers end up holding live allowances they forgot about.
                feedback: "Nada en la cuenta registra un plazo ni una fecha. Una aprobación se queda ahí hasta que se gasta a cero o el dueño firma Revoke, que es como los suscriptores dados de baja terminan con límites vivos que se olvidaron."  # @src=badb175f4336
          m05-l1-q4:
            # | Why does the single-delegate-slot rule push you toward the official
            # | Subscriptions program rather than shipping the raw crank to production?
            prompt: "¿Por qué la regla del slot único de delegado te empuja hacia el programa oficial de Subscriptions en vez de entregar el crank crudo a producción?"  # @src=4402414249f5
            # | One slot means one live subscription per (user, mint). To let one token
            # | account back many billing arrangements you need a program that occupies the
            # | slot once and multiplexes real limits behind PDAs. That is the next lesson.
            explanation: "Un slot quiere decir una suscripción viva por (usuario, mint). Para que una cuenta de token respalde muchos acuerdos de facturación necesitas un programa que ocupe el slot una vez y multiplexe límites reales detrás de PDAs. Esa es la próxima lección."  # @src=ae2fe897d022
            options:                 # source order — keep it
              a:
                # | Because a delegate expires after exactly one transfer, so multi-cycle
                # | billing is impossible with the raw primitive.
                label: "Porque un delegado expira después de exactamente una transferencia, así que la facturación multiciclo es imposible con la primitiva cruda."  # @src=a38e3ebcbfde
                # | The approval persists and covers multiple pulls until the allowance is
                # | exhausted; expiry-per-transfer is not how it works.
                feedback: "La aprobación persiste y cubre múltiples pulls hasta que el límite se agota; la expiración por transferencia no es como funciona."  # @src=a190b6139a9a
              d:
                # | Because the delegate slot belongs to the wallet, so a subscriber's
                # | second subscription evicts the first even in a different mint.
                label: "Porque el slot de delegado pertenece a la billetera, así que la segunda suscripción de un suscriptor desaloja a la primera incluso en un mint distinto."  # @src=42430d6bc571
                # | The slot lives on a token account, and a token account is per mint. A
                # | club billing in USDC and one billing in EURC sit on separate accounts
                # | with separate slots; the collision only happens when both bill the same
                # | mint.
                feedback: "El slot vive en una cuenta de token, y una cuenta de token es por mint. Un club que factura en USDC y otro que factura en EURC están en cuentas separadas con slots separados; la colisión solo pasa cuando los dos facturan el mismo mint."  # @src=e870f5858e16
              b:
                # | Because a subscriber who joins two merchants can grant only one live
                # | delegate, so the second merchant's approval silently evicts the first.
                label: "Porque un suscriptor que se suma a dos comercios puede otorgar solo un delegado vivo, así que la aprobación del segundo comercio desaloja en silencio a la primera."  # @src=56a2dc317cc1
                # | One slot per token account means merchants compete for the same field
                # | rather than coexisting; the slot is per (owner, mint), and a second mint
                # | has its own. A workaround, not a model.
                feedback: "Un slot por cuenta de token quiere decir que los comercios compiten por el mismo campo en vez de coexistir; el slot es por (dueño, mint), y un segundo mint tiene el suyo. Un rodeo, no un modelo."  # @src=066e8c6af2b8
              c:
                # | Because delegate-signed transfers cannot carry a memo, so reconciliation
                # | into the orders ledger breaks.
                label: "Porque las transferencias firmadas por el delegado no pueden llevar un memo, así que la conciliación en el libro mayor de pedidos se rompe."  # @src=7dc5a55c959a
                # | A delegate TransferChecked can be paired with a memo/reference; the memo
                # | is not what the single slot limits.
                feedback: "Un TransferChecked de delegado puede ir en pareja con un memo/reference; el memo no es lo que limita el slot único."  # @src=8ec3f8e05f45
  m05-l2:
    # | The official Subscriptions program: plans, PDAs, and the kit-7 seam
    title: "El programa oficial Subscriptions: planes, PDAs y la costura de kit-7"  # @src=56446aedc1c6
    blocks:
      period-window-check:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | At the exact instant now equals expiresAtTs, the subscription is already
          # | lapsed; the last chargeable second is expiresAtTs - 1, not expiresAtTs itself.
          0: "En el instante exacto en que now iguala a expiresAtTs, la suscripción ya está caducada; el último segundo cobrable es expiresAtTs - 1, no expiresAtTs en sí."  # @src=e506cce8d13d
          # | expiresAtTs of 0 means 'no expiry'; do not treat it as 'expired at epoch 0'.
          1: "expiresAtTs en 0 quiere decir 'sin vencimiento'; no lo trates como 'vencido en la epoch 0'."  # @src=dfcb6397366e
          # | Order matters: canceled first, then expiry, then the period window.
          2: "El orden importa: primero la cancelación, después el vencimiento, después la ventana de período."  # @src=855abd4e288b
        tests:                      # keyed by test case id
          t1-due-after-full-period:
            # | A day-cadence sub whose 24h window has fully elapsed is due; the next window
            # | is measured in seconds.
            description: "A una suscripción con cadencia de un día cuya ventana de 24h transcurrió por completo le toca; la siguiente ventana se mide en segundos."  # @src=558de6f87439
          t2-too-early-hours-not-seconds:
            # | Only ~13.9h since the last pull: a correct seconds-based window holds the
            # | charge (the ×3600 bug would fire early).
            description: "Solo ~13.9h desde el último pull: una ventana correcta basada en segundos retiene el cargo (el bug de ×3600 se dispararía temprano)."  # @src=23c2b70c37c8
          t3-expired-never-charges:
            # | The sub is past its expiresAtTs, so it is never pulled even though its
            # | period window is open.
            description: "La suscripción está pasada su expiresAtTs, así que nunca se le hace un pull aunque su ventana de período esté abierta."  # @src=2b6c7a090281
          t4-canceled:
            # | An inactive (cancelled) subscription is never pulled.
            description: "A una suscripción inactiva (cancelada) nunca se le hace un pull."  # @src=341ef5317a58
          t5-zero-expiry-is-not-expired:
            # | expiresAtTs of 0 means no expiry, so the decision falls through to the
            # | seconds-based window (here, too early).
            description: "expiresAtTs en 0 quiere decir sin vencimiento, así que la decisión cae hasta la ventana basada en segundos (acá, demasiado temprano)."  # @src=1614292ba8d3
          t6-boundary-is-due:
            # | At exactly lastChargedTs + period the window is open and the pull fires.
            description: "Justo en lastChargedTs + period la ventana está abierta y el pull se dispara."  # @src=c5643f6f015a
          t7-future-expiry-still-due:
            # | A sub whose expiresAtTs is still in the future is not expired: a non-zero
            # | expiry alone must never hold a charge.
            description: "Una suscripción cuyo expiresAtTs todavía está en el futuro no está vencida: un vencimiento distinto de cero por sí solo nunca debe retener un cargo."  # @src=81f8c3c53894
          t8-expiry-boundary-is-expired:
            # | At exactly expiresAtTs the subscription has lapsed: the last chargeable
            # | second is expiresAtTs - 1.
            description: "Justo en expiresAtTs la suscripción ya caducó: el último segundo cobrable es expiresAtTs - 1."  # @src=6e8a79b43cc3
          t9-canceled-outranks-expired:
            # | A sub that was cancelled AND has since lapsed reports 'canceled': a canceled
            # | subscription's expiry is meaningless, so the cancellation check runs first.
            description: "Una suscripción que fue cancelada Y desde entonces caducó reporta 'canceled': el vencimiento de una suscripción cancelada no tiene sentido, así que la comprobación de cancelación corre primero."  # @src=3a6fe813a22a
          t10-backwards-clock-holds:
            # | Chain time reading BEFORE the last successful pull (clock skew, or a crank
            # | replaying an old slot) is too early, never due: the window is a direction,
            # | not a distance.
            description: "Un tiempo on-chain que lee ANTES del último pull exitoso (desfase de reloj, o un crank reproduciendo un slot viejo) es demasiado temprano, nunca le toca: la ventana es una dirección, no una distancia."  # @src=a81b64de9171
      check-overview:                      # quiz
        questions:
          m05-l2-q1:
            # | A subscriber needs several independent billing arrangements, but their token
            # | account has exactly one delegate slot. How does the Subscriptions program
            # | reconcile that?
            prompt: "Un suscriptor necesita varios acuerdos de facturación independientes, pero su cuenta de token tiene exactamente un slot de delegado. ¿Cómo reconcilia eso el programa Subscriptions?"  # @src=f55bd86f2f13
            # | The SA PDA occupies the one slot with an unlimited approval; the actual,
            # | bounded limits live in delegation PDAs (fixed / recurring / plan). That is
            # | how one token account backs many subscriptions non-custodially.
            explanation: "La PDA de SA ocupa el único slot con una aprobación ilimitada; los límites reales y acotados viven en PDAs de delegación (fixed / recurring / plan). Así es como una sola cuenta de token respalda muchas suscripciones de forma no custodial."  # @src=ad946c9bfc28
            options:                 # source order — keep it
              b:
                # | It creates a fresh token account per subscription and asks the
                # | subscriber to fund each one, so every merchant ends up with its own
                # | account and its own delegate slot.
                label: "Crea una cuenta de token nueva por suscripción y le pide al suscriptor fondear cada una, así cada comercio termina con su propia cuenta y su propio slot de delegado."  # @src=089727cfc6a9
                # | It does not multiply the user's token accounts; the ATA and its single
                # | slot stay put, and the program works within that one slot.
                feedback: "No multiplica las cuentas de token del usuario; la ATA y su único slot se quedan donde están, y el programa trabaja dentro de ese único slot."  # @src=61c5b420d7f5
              c:
                # | A Subscription Authority PDA per (user, mint) takes the single slot with
                # | a u64::MAX approval; delegation PDAs carry the real limits.
                label: "Una PDA de Subscription Authority por (usuario, mint) toma el único slot con una aprobación de u64::MAX; las PDAs de delegación cargan los límites reales."  # @src=f39f13ecb4a0
                # | Indirection turns one scarce slot into many arrangements. The holder is
                # | unlimited and the real limits live in program state, which moves the
                # | bound off the Token program onto that logic.
                feedback: "La indirección convierte un slot escaso en muchos acuerdos. El que lo tiene es ilimitado y los límites reales viven en el estado del programa, lo que mueve el límite del programa Token hacia esa lógica."  # @src=e2aeac116f3c
              d:
                # | A Subscription Authority PDA takes the slot with an approval sized to
                # | the sum of the plans, re-approved on each new subscription.
                label: "Una PDA de Subscription Authority toma el slot con una aprobación dimensionada a la suma de los planes, re-aprobada en cada suscripción nueva."  # @src=33fef947b0f3
                # | Re-approving on every join puts the slot back in play and drags the
                # | subscriber into a signature per merchant. The authority takes the slot
                # | once, at u64::MAX, and is never touched again; the sums that matter live
                # | in the delegation accounts.
                feedback: "Re-aprobar en cada ingreso vuelve a poner el slot en juego y arrastra al suscriptor a una firma por comercio. La autoridad toma el slot una vez, en u64::MAX, y nunca se vuelve a tocar; las sumas que importan viven en las cuentas de delegación."  # @src=52fa21f2dc1a
              a:
                # | It stores each allowance in the merchant's own database and signs every
                # | pull with the merchant's key, so the single on-chain delegate slot never
                # | has to be shared.
                label: "Guarda cada asignación en la base de datos propia del comercio y firma cada pull con la clave del comercio, así el único slot de delegado on-chain nunca tiene que compartirse."  # @src=7dadcf94d2c0
                # | Pulls are on-chain delegate transfers, and the enforced limits live in
                # | program accounts rather than off-chain; that is what keeps it
                # | non-custodial.
                feedback: "Los pulls son transferencias de delegado on-chain, y los límites exigidos viven en cuentas de programa y no off-chain; eso es lo que lo mantiene no custodial."  # @src=86824d22c3c4
          m05-l2-q2:
            # | That delegate slot is held by a PDA rather than a keypair the merchant
            # | controls. Cashing in the ATA seed from module 2, why does a PDA holding the
            # | slot keep the arrangement non-custodial?
            prompt: "Ese slot de delegado lo tiene una PDA y no un keypair que el comercio controla. Haciendo efectivo el seed de la ATA del módulo 2, ¿por qué una PDA que tiene el slot mantiene el acuerdo no custodial?"  # @src=0de999ce4c9c
            # | No private key exists for a PDA, so there is no merchant secret to leak or
            # | abuse; the program's code is the only thing that can move funds, and only
            # | inside the delegation's declared limits.
            explanation: "No existe clave privada para una PDA, así que no hay secreto del comercio que filtrar ni del que abusar; el código del programa es lo único que puede mover fondos, y solo dentro de los límites declarados de la delegación."  # @src=6fd4443a8fb2
            options:                 # source order — keep it
              b:
                # | The PDA is derived from and owned by the subscriber's wallet, so the
                # | subscriber's key must co-sign every individual pull before the crank can
                # | move funds.
                label: "La PDA se deriva de la billetera del suscriptor y es de su propiedad, así que la clave del suscriptor debe co-firmar cada pull individual antes de que el crank pueda mover fondos."  # @src=d6c5fa6f2a8f
                # | A PDA is not owned by the user's wallet, and the subscriber does not
                # | co-sign each pull; cadenced pulls without per-charge signatures are the
                # | point of delegation.
                feedback: "Una PDA no es propiedad de la billetera del usuario, y el suscriptor no co-firma cada pull; los pulls cadenciados sin firmas por cargo son el punto de la delegación."  # @src=999ca0315a21
              c:
                # | The merchant holds the PDA's private key in a hardware escrow and signs
                # | each pull with it, contractually agreeing to stay inside the plan's
                # | declared limits.
                label: "El comercio tiene la clave privada de la PDA en un escrow de hardware y firma cada pull con ella, y acuerda contractualmente quedarse dentro de los límites declarados del plan."  # @src=407b218fdd45
                # | PDAs have no private key to hold, and custody-by-promise is exactly what
                # | this design removes.
                feedback: "Las PDAs no tienen clave privada que tener, y la custodia-por-promesa es exactamente lo que este diseño elimina."  # @src=d87085ca5ea5
              d:
                # | The program's upgrade authority holds the PDA's key and signs on its
                # | behalf, so custody sits with the Foundation rather than you.
                label: "La upgrade authority del programa tiene la clave de la PDA y firma en su nombre, así que la custodia queda con la Foundation y no contigo."  # @src=dfe71dd440a8
                # | An upgrade authority replaces code; it cannot sign as a PDA, because no
                # | signature over a PDA exists to produce. That authority is a real
                # | residual trust worth naming in a security review, and it is not custody
                # | of anybody's funds.
                feedback: "Una upgrade authority reemplaza código; no puede firmar como una PDA, porque no existe ninguna firma sobre una PDA que producir. Esa autoridad es una confianza residual real que vale nombrar en una revisión de seguridad, y no es custodia de los fondos de nadie."  # @src=a96c55981e2f
              a:
                # | A PDA is deterministic and program-owned with no private key, so only
                # | program logic, never a merchant key, can authorize a pull.
                label: "Una PDA es determinista y propiedad del programa, sin clave privada, así que solo la lógica del programa, nunca una clave de comercio, puede autorizar un pull."  # @src=c40fbc7e9650
                # | With no key to hold there is no merchant secret to leak; the trust moves
                # | rather than vanishing, and the upgrade authority is where it lands.
                feedback: "Sin ninguna clave que tener no hay secreto del comercio que filtrar; la confianza se mueve en vez de desaparecer, y la upgrade authority es donde aterriza."  # @src=38a6a0803807
      check-lab:                      # quiz
        questions:
          m05-l2-q3:
            # | Your crank dispatched a second pull for the same subscriber an hour after
            # | the first, and the program refused it. The plan's cadence is periodHours:
            # | 24. Reading your billing-window check, what is the most likely bug?
            prompt: "Tu crank lanzó un segundo pull para el mismo suscriptor una hora después del primero, y el programa lo rechazó. La cadencia del plan es periodHours: 24. Leyendo tu comprobación de la ventana de facturación, ¿cuál es el bug más probable?"  # @src=71627574138e
            # | periodHours (plans) and periodLengthS (delegations) are the documented unit
            # | trap. Compare seconds against Unix chain time; 24 hours is 86,400 seconds,
            # | not 24.
            explanation: "periodHours (planes) y periodLengthS (delegaciones) son la trampa de unidades documentada. Compara segundos contra el tiempo on-chain Unix; 24 horas son 86,400 segundos, no 24."  # @src=fc42f1f5772c
            options:                 # source order — keep it
              c:
                # | You forgot to store processed signatures, so a webhook retry
                # | re-triggered the pull.
                label: "Se te olvidó guardar las firmas procesadas, así que un reintento de webhook volvió a activar el pull."  # @src=491fc5163800
                # | A delegate pull is initiated by your crank, not by a webhook retry;
                # | signature dedup guards fulfillment, not pull cadence.
                feedback: "Un pull de delegado lo inicia tu crank, no un reintento de webhook; el dedup de firmas protege el despacho, no la cadencia del pull."  # @src=272bcb11224a
              d:
                # | Your window check reads the delegation's periodLengthS, which the
                # | program stores in hours like a plan does.
                label: "Tu comprobación de la ventana lee el periodLengthS de la delegación, que el programa guarda en horas como lo hace un plan."  # @src=7ce6f3459ac7
                # | The two fields disagree on purpose: a plan publishes periodHours, a
                # | recurring delegation stores periodLengthS in seconds. Assuming they
                # | share a unit is the same trap read from the other end.
                feedback: "Los dos campos no coinciden a propósito: un plan publica periodHours, una delegación recurring guarda periodLengthS en segundos. Suponer que comparten una unidad es la misma trampa leída desde el otro extremo."  # @src=f20fff900ca3
              a:
                # | You compared expiresAtTs against the current block height instead of
                # | Unix time.
                label: "Comparaste expiresAtTs contra la altura de bloque actual en vez del tiempo Unix."  # @src=eb45513e2fa0
                # | An expiry-vs-height mix-up would misfire on expiry, not collapse a
                # | 24-hour window down to minutes.
                feedback: "Una confusión de vencimiento-contra-altura fallaría en el vencimiento, no colapsaría una ventana de 24 horas a minutos."  # @src=407965ba0665
              b:
                # | You used the plan's periodHours value directly as seconds instead of
                # | multiplying by 3600, so the window is ~3600x too short.
                label: "Usaste el valor periodHours del plan directamente como segundos en vez de multiplicar por 3600, así que la ventana es ~3600x demasiado corta."  # @src=d5f4dbd43d05
                # | Chain time is Unix seconds while the plan field counts hours, and the
                # | comparison silently shrinks the window; blanket-multiplying overshoots,
                # | since a delegation's period is already seconds.
                feedback: "El tiempo on-chain son segundos Unix mientras que el campo del plan cuenta horas, y la comparación encoge la ventana en silencio; multiplicar a lo bruto se pasa, porque el período de una delegación ya está en segundos."  # @src=6e3cef6e90aa
          m05-l2-q4:
            # | A subscriber's plan lapsed last week, yet your crank still dispatched a pull
            # | for them today — refused on-chain, one base fee gone — because the
            # | delegation account is still there. Which guard check is missing, and why
            # | does the account persist?
            prompt: "El plan de un suscriptor caducó la semana pasada, y aun así tu crank lanzó hoy un pull para él — rechazado on-chain, una comisión base perdida — porque la cuenta de delegación todavía está ahí. ¿Qué comprobación de la guarda falta, y por qué persiste la cuenta?"  # @src=95d952540345
            # | These accounts stay on-chain until a revoke instruction closes them, and the
            # | program — not account existence — enforces the expiry bound, refusing a
            # | lapsed pull before any token moves. Your crank mirrors that check
            # | (expiresAtTs vs chain time, 0 meaning 'never expires') so the refusal costs
            # | nothing instead of a base fee per tick.
            explanation: "Estas cuentas se quedan on-chain hasta que una instrucción de revoke las cierra, y el programa — no la existencia de la cuenta — exige el límite de vencimiento, rechazando un pull caducado antes de que se mueva ningún token. Tu crank replica esa comprobación (expiresAtTs contra el tiempo on-chain, con 0 queriendo decir 'nunca vence') así el rechazo no cuesta nada en vez de una comisión base por tick."  # @src=20b85259f529
            options:                 # source order — keep it
              c:
                # | The expiresAtTs-vs-chain-time check: these accounts persist until
                # | revoked, so existence proves nothing, and a guard that skips the expiry
                # | mirror pays for an on-chain refusal every tick.
                label: "La comprobación de expiresAtTs-contra-tiempo-on-chain: estas cuentas persisten hasta que se revocan, así que la existencia no demuestra nada, y una guarda que se salta la réplica del vencimiento paga un rechazo on-chain en cada tick."  # @src=41653e17edb3
                # | Nothing on-chain reaps an account on a schedule. The program refuses the
                # | lapsed pull before a token moves; your guard's job is to refuse it
                # | before a fee is spent. And 0 is the sentinel for never expires, which a
                # | naive now-greater-than test rejects outright.
                feedback: "Nada on-chain cosecha una cuenta según un calendario. El programa rechaza el pull caducado antes de que se mueva un token; el trabajo de tu guarda es rechazarlo antes de que se gaste una comisión. Y 0 es el centinela de nunca vence, que una prueba ingenua de now-mayor-que rechaza de plano."  # @src=44b8c57ed1ca
              d:
                # | The expiresAtTs-vs-chain-time check, and a plain
                # | now-greater-than-expiresAtTs comparison covers it, since these accounts
                # | persist until revoked and a zero expiry marks one already lapsed.
                label: "La comprobación de expiresAtTs-contra-tiempo-on-chain, y una comparación simple de now-mayor-que-expiresAtTs la cubre, porque estas cuentas persisten hasta que se revocan y un vencimiento en cero marca una como ya caducada."  # @src=012f677cd602
                # | Right field, inverted sentinel. Zero means never expires, so that
                # | comparison treats every open-ended subscriber as expired at the epoch
                # | and quietly bills nobody at all.
                feedback: "Campo correcto, centinela invertido. Cero quiere decir nunca vence, así que esa comparación trata a cada suscriptor sin fecha de fin como vencido en la epoch y en silencio no le factura a nadie en absoluto."  # @src=b0c09270a4fc
              a:
                # | The active-flag check: the program clears a delegation's active flag and
                # | closes its account the moment a plan's term ends, so only a stale flag
                # | lets a pull get dispatched.
                label: "La comprobación de la bandera active: el programa limpia la bandera active de una delegación y cierra su cuenta en el momento en que el término de un plan termina, así que solo una bandera vieja deja que un pull se lance."  # @src=347c3196f21c
                # | Ending a term does not delete the account, and an active flag alone does
                # | not encode a time-based lapse.
                feedback: "Terminar un término no borra la cuenta, y una bandera active por sí sola no codifica una caducidad basada en tiempo."  # @src=dc046e269267
              b:
                # | A balance check: the Token program zeroes the approval once the
                # | allowance is exhausted, and the delegation account it belongs to is
                # | reaped in that very same instruction.
                label: "Una comprobación de saldo: el programa Token pone en cero la aprobación una vez que la asignación se agota, y la cuenta de delegación a la que pertenece se cosecha en esa misma instrucción."  # @src=4c2bb7c6aa56
                # | A zero allowance does not close the account, and it would not represent
                # | elapsed time either.
                feedback: "Una asignación en cero no cierra la cuenta, y tampoco representaría tiempo transcurrido."  # @src=e425a6bb78df
  m05-l3:
    # | Dunning, lifecycle, and who else does this
    title: "Dunning, ciclo de vida, y quién más hace esto"  # @src=a4620fe9104a
    blocks:
      check:                      # quiz
        questions:
          m05-l3-q1:
            # | A subscriber's ATA is empty when the monthly pull fires. Following the
            # | dunning policy Helius runs on its own bills, what happens to that renewal?
            prompt: "La ATA de un suscriptor está vacía cuando dispara el pull mensual. Siguiendo la política de dunning que Helius corre en sus propias facturas, ¿qué le pasa a esa renovación?"  # @src=0a1c3074dce0
            # | Retry-never: with no custody there is nothing to dun. The failed pull
            # | becomes an open invoice the subscriber settles when they top up, the exact
            # | opposite of card-rail auto-retry.
            explanation: "Retry-never: sin custodia no hay nada a lo que hacerle dunning. El pull fallido se vuelve una factura abierta que el suscriptor liquida cuando recarga, el opuesto exacto del auto-reintento de los rieles de tarjetas."  # @src=01db5d6afc18
            options:                 # source order — keep it
              a:
                # | The renewal is not retried against the wallet; it becomes an ordinary
                # | open invoice the subscriber can settle later.
                label: "La renovación no se reintenta contra la billetera; se vuelve una factura abierta ordinaria que el suscriptor puede liquidar después."  # @src=3d1e58a3a280
                # | An empty account cannot be pulled harder, and retrying just burns fees
                # | against a balance you do not control; it isn't no-dunning either, since
                # | reminders and grace move into your backoffice.
                feedback: "A una cuenta vacía no se le puede hacer un pull más fuerte, y reintentar solo quema comisiones contra un saldo que no controlas; tampoco es no-dunning, ya que los recordatorios y la gracia se mudan a tu backoffice."  # @src=4f0625258df4
              c:
                # | The subscription is cancelled immediately and its delegation PDA is
                # | closed on the spot, refunding the rent to the subscriber who paid it.
                label: "La suscripción se cancela inmediatamente y su PDA de delegación se cierra en el acto, reembolsando el rent al suscriptor que lo pagó."  # @src=76bec28b8960
                # | A failure moves to an open-invoice/grace state, not immediate
                # | cancel-and-close; cancellation is a separate, explicit transition.
                feedback: "Una falla mueve a un estado de open-invoice/gracia, no a un cancela-y-cierra inmediato; la cancelación es una transición separada y explícita."  # @src=d39820c242cb
              b:
                # | The crank retries the pull against the wallet on a backoff ladder,
                # | minutes apart and then daily, until it clears or the retry limit drops
                # | the plan.
                label: "El crank reintenta el pull contra la billetera en una escalera de backoff, con minutos de separación y después a diario, hasta que pase o el tope de reintentos descarte el plan."  # @src=397912b35824
                # | There is nothing to auto-retry against a wallet you don't control, and
                # | the documented policy is explicitly NOT to retry against the wallet.
                feedback: "No hay nada a lo que auto-reintentar contra una billetera que no controlas, y la política documentada es explícitamente NO reintentar contra la billetera."  # @src=8c5d9072aa46
              d:
                # | The renewal is dropped, and the crank simply bills the subscriber again
                # | on the next scheduled cycle.
                label: "La renovación se descarta, y el crank simplemente le vuelve a facturar al suscriptor en el próximo ciclo agendado."  # @src=c975a543ec62
                # | Dropping it loses the receivable. The missed period stays owed, and the
                # | state machine refuses a pull against an open invoice outright, so the
                # | next cycle is not where that money comes back.
                feedback: "Descartarla pierde la cuenta por cobrar. El período perdido sigue debiéndose, y la máquina de estados rechaza de plano un pull contra una factura abierta, así que el próximo ciclo no es donde vuelve ese dinero."  # @src=c3c0991efa69
          m05-l3-q2:
            # | A subscriber cancels for good and you want to stop paying rent on their
            # | now-dead subscription accounts. Which action recovers it?
            prompt: "Un suscriptor cancela para siempre y quieres dejar de pagar rent por sus cuentas de suscripción ahora muertas. ¿Qué acción lo recupera?"  # @src=1b37e68ef66e
            # | RevokeAbandoned* is the lifecycle exit that recovers rent from dead
            # | subscription/delegation PDAs, so you stop paying to keep cancelled
            # | arrangements on-chain.
            explanation: "RevokeAbandoned* es la salida de ciclo de vida que recupera el rent de las PDAs muertas de suscripción/delegación, así que dejas de pagar por mantener acuerdos cancelados on-chain."  # @src=114fa0bcafbd
            options:                 # source order — keep it
              d:
                # | Nothing to do: the subscriber's cancel already closed both accounts and
                # | returned every lamport of rent.
                label: "Nada que hacer: el cancel del suscriptor ya cerró las dos cuentas y devolvió cada lamport de rent."  # @src=4ac90fa811cd
                # | Unsubscribing does close the delegation account and refund it. Revoking
                # | the authority only vacates the delegate slot, so the subscription PDA is
                # | still sitting there on your rent until a RevokeAbandoned call closes it.
                feedback: "Darse de baja sí cierra la cuenta de delegación y la reembolsa. Revocar la autoridad solo desocupa el slot de delegado, así que la PDA de suscripción sigue ahí sentada sobre tu rent hasta que una llamada a RevokeAbandoned la cierre."  # @src=c9de377c62c9
              a:
                # | Nothing; PDA rent is burned at account creation and is permanently
                # | unrecoverable.
                label: "Nada; el rent de las PDAs se quema en la creación de la cuenta y es permanentemente irrecuperable."  # @src=727680ccdc62
                # | The program exposes an explicit revoke-and-reclaim path; the rent is not
                # | burned.
                feedback: "El programa expone un camino explícito de revocar-y-reclamar; el rent no se quema."  # @src=a3a4e47b6ca4
              c:
                # | The subscriber must closeAccount on their ATA, which also frees the
                # | subscription PDAs.
                label: "El suscriptor tiene que hacer closeAccount en su ATA, lo que también libera las PDAs de suscripción."  # @src=6ab1ab653fc7
                # | Closing the user's ATA is a different account entirely and does not
                # | reclaim the program's subscription or delegation PDAs.
                feedback: "Cerrar la ATA del usuario es una cuenta completamente distinta y no reclama las PDAs de suscripción ni de delegación del programa."  # @src=88e26ae151d1
              b:
                # | A RevokeAbandoned instruction closes the abandoned
                # | subscription/delegation accounts and returns the rent lamports.
                label: "Una instrucción RevokeAbandoned cierra las cuentas abandonadas de suscripción/delegación y devuelve los lamports de rent."  # @src=13567a9732af
                # | Rent is a deposit that comes back only on an explicit close, and
                # | cancelling does not call one.
                feedback: "El rent es un depósito que vuelve solo con un cierre explícito, y cancelar no llama a ninguno."  # @src=6d792286d448
          m05-l3-q3:
            # | You're advising Wavelength on outsourcing recurring billing to a provider.
            # | Based on the 2026 landscape, which statement is accurate?
            prompt: "Estás asesorando a Wavelength sobre tercerizar la facturación recurrente a un proveedor. Según el panorama de 2026, ¿qué afirmación es exacta?"  # @src=7b248a5c5e09
            # | The useful intelligence is the negatives: MoonPay Commerce and Stripe
            # | Billing both do recurring, Sphere does not. Assuming every payments provider
            # | bills recurring is how you pick the wrong vendor.
            explanation: "La inteligencia útil son los negativos: MoonPay Commerce y Stripe Billing los dos hacen recurrente, Sphere no. Suponer que todo proveedor de pagos factura recurrente es como eliges al proveedor equivocado."  # @src=181e26551327
            options:                 # source order — keep it
              a:
                # | Sphere ships a drop-in recurring-billing product tuned for the
                # | Brazil/PIX corridor, so a subscription settles to BRL on the same rails
                # | as its one-off payments.
                label: "Sphere entrega un producto de facturación recurrente listo para usar, afinado para el corredor Brasil/PIX, así que una suscripción liquida a BRL sobre los mismos rieles que sus pagos de una sola vez."  # @src=c873e40c495c
                # | Sphere does payments, ramps, OTC, and PIX settlement, but it ships NO
                # | recurring product.
                feedback: "Sphere hace pagos, ramps, OTC y liquidación PIX, pero NO entrega ningún producto recurrente."  # @src=2556923aa79a
              d:
                # | All three ship recurring billing, so the choice comes down to corridor
                # | coverage, payout speed and per-charge price rather than capability.
                label: "Los tres entregan facturación recurrente, así que la elección se reduce a la cobertura de corredores, la velocidad de payout y el precio por cargo, y no a la capacidad."  # @src=5ccc9e7faf53
                # | Assuming every payments vendor also bills recurring is how the wrong one
                # | gets picked. Sphere is strong on payments, ramps and PIX settlement and
                # | ships no recurring product at all, so capability is the first filter,
                # | not the last.
                feedback: "Suponer que todo proveedor de pagos también factura recurrente es como se elige al equivocado. Sphere es fuerte en pagos, ramps y liquidación PIX y no entrega ningún producto recurrente, así que la capacidad es el primer filtro, no el último."  # @src=71eb830417e2
              c:
                # | MoonPay Commerce pay links and Stripe Billing both support
                # | subscriptions, including stablecoin ones, while Sphere has none at all.
                label: "Los pay links de MoonPay Commerce y Stripe Billing los dos soportan suscripciones, incluidas las de stablecoin, mientras que Sphere no tiene ninguna."  # @src=be27b5f3d5df
                # | Recurring is a separate product line from payments, and a strong
                # | payments vendor can simply not ship it; support is not coverage either,
                # | and the corridor is where that gap shows.
                feedback: "Lo recurrente es una línea de producto separada de los pagos, y un proveedor de pagos fuerte simplemente puede no entregarlo; el soporte tampoco es cobertura, y el corredor es donde se ve ese hueco."  # @src=66e786e37f4f
              b:
                # | Stripe cannot bill stablecoin subscriptions; its crypto support stops at
                # | one-off checkout payments, so recurring stablecoin billing has to run on
                # | MoonPay Commerce.
                label: "Stripe no puede facturar suscripciones en stablecoin; su soporte cripto se detiene en los pagos de checkout de una sola vez, así que la facturación recurrente en stablecoin tiene que correr sobre MoonPay Commerce."  # @src=49b4c68396cf
                # | Stripe Billing does support stablecoin subscriptions; that is exactly
                # | its recurring product.
                feedback: "Stripe Billing sí soporta suscripciones en stablecoin; ese es exactamente su producto recurrente."  # @src=85526eceb682
          m05-l3-q4:
            # | You model dunning as a state machine in the backoffice rather than as
            # | retries against the chain. Why is that the right shape for non-custodial
            # | recurring revenue?
            prompt: "Modelas el dunning como una máquina de estados en el backoffice y no como reintentos contra la blockchain. ¿Por qué esa es la forma correcta para los ingresos recurrentes no custodiales?"  # @src=20e04ca83858
            # | Non-custodial means you can't reach into the wallet. The only place you
            # | control state is your own ledger, so failure and lifecycle live there as an
            # | explicit state machine, which is exactly why retry-never is the honest
            # | policy.
            explanation: "No custodial quiere decir que no puedes meter la mano en la billetera. El único lugar donde controlas el estado es tu propio libro mayor, así que la falla y el ciclo de vida viven ahí como una máquina de estados explícita, que es exactamente por qué retry-never es la política honesta."  # @src=a19a43acb834
            options:                 # source order — keep it
              d:
                # | Because the ledger is where a retry loop belongs: it holds the failures
                # | and re-attempts the pull on a backoff until the balance covers it.
                label: "Porque el libro mayor es donde va un loop de reintentos: guarda las fallas y vuelve a intentar el pull en un backoff hasta que el saldo lo cubra."  # @src=ebbb668b280b
                # | Moving the loop into the ledger keeps the loop. A pull against an open
                # | invoice is refused as an invariant, precisely so nobody reinvents
                # | backoff against a wallet that only its owner can refill.
                feedback: "Mover el loop al libro mayor mantiene el loop. Un pull contra una factura abierta se rechaza como invariante, precisamente para que nadie reinvente el backoff contra una billetera que solo su dueño puede rellenar."  # @src=d44e23153a85
              a:
                # | Because a pull succeeds only when allowance and balance both cover it,
                # | so unrecoverable failures belong in your ledger, not in a retry loop you
                # | can't force.
                label: "Porque un pull tiene éxito solo cuando el límite y el saldo lo cubren los dos, así que las fallas irrecuperables van en tu libro mayor, no en un loop de reintentos que no puedes forzar."  # @src=edbc1b41cfa6
                # | Both preconditions sit in the subscriber's control, and repeating the
                # | call changes nothing. An RPC timeout is a different animal, worth the
                # | retry an empty balance never earns.
                feedback: "Las dos precondiciones están bajo el control del suscriptor, y repetir la llamada no cambia nada. Un timeout de RPC es otro animal, que vale el reintento que un saldo vacío nunca se gana."  # @src=35499d4aa39c
              c:
                # | Because the Subscriptions program escrows one billing period of funds
                # | when a subscriber accepts a plan, so a retried pull draws on that escrow
                # | and eventually clears.
                label: "Porque el programa Subscriptions pone en escrow los fondos de un período de facturación cuando un suscriptor acepta un plan, así que un pull reintentado tira de ese escrow y acaba pasando."  # @src=1284dc5775a2
                # | Nothing escrows the subscriber's funds; an empty ATA simply cannot be
                # | pulled, no matter how many times you retry.
                feedback: "Nada pone en escrow los fondos del suscriptor; a una ATA vacía simplemente no se le puede hacer un pull, no importa cuántas veces reintentes."  # @src=7eb8cc232d91
              b:
                # | Because the Subscriptions program falls back to billing the customer's
                # | card on file after three ledger failures.
                label: "Porque el programa Subscriptions recurre a facturar la tarjeta guardada del cliente después de tres fallas del libro mayor."  # @src=1636f3f75bb0
                # | There is no card on file. The primitive is a token-account delegate
                # | pull, not card billing.
                feedback: "No hay tarjeta guardada. La primitiva es un pull de delegado sobre cuenta de token, no facturación con tarjeta."  # @src=56899e2d1d3f
  m06-l1:
    # | Onramps, and the way back out
    title: "Onramps, y el camino de vuelta"  # @src=c8eb212ecf38
    blocks:
      headless-onramp-session:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The session request binds the address; the client URL carries the token. Keep
          # | them separate.
          0: "El request de sesión vincula la dirección; la URL del cliente lleva el token. Mantenlos separados."  # @src=d94bed2f095d
          # | Default the network to solana and the asset to USDC in the URL, and pass the
          # | sessionToken, not the address.
          1: "Pon por defecto la red en solana y el activo en USDC en la URL, y pasa el sessionToken, no la dirección."  # @src=933af9765526
        tests:                      # keyed by test case id
          t1:
            # | the session request binds the destination on Solana, not Ethereum
            description: "el request de sesión vincula el destino en Solana, no en Ethereum"  # @src=030d9d1d4492
          t2:
            # | the client URL carries the session token
            description: "la URL del cliente lleva el session token"  # @src=afc5ec6905d9
          t3:
            # | the client URL defaults the network to Solana
            description: "la URL del cliente pone la red por defecto en Solana"  # @src=9e69e2456374
          t4:
            # | the raw wallet address must never appear in the client URL
            description: "la dirección de billetera cruda nunca puede aparecer en la URL del cliente"  # @src=89099cf7dc19
          t5:
            # | the destination address is bound in the server-side session request
            description: "la dirección de destino está vinculada en el request de sesión del lado del servidor"  # @src=a3ea5c51d283
          t6:
            # | the preset fiat amount is carried into the onramp URL
            description: "el monto fiat preestablecido se lleva hasta la URL del onramp"  # @src=1e2efea75b34
          t7:
            # | a second customer's session request binds THEIR address on Solana (nothing
            # | about the first buyer may be baked in)
            description: "el request de sesión de un segundo cliente vincula SU dirección en Solana (nada del primer comprador puede quedar metido adentro)"  # @src=cd350ba1b244
          t8:
            # | the second customer's URL carries their own session token and preset amount
            description: "la URL del segundo cliente lleva su propio session token y su monto preestablecido"  # @src=ac739648c58e
          t9:
            # | the client URL leaks the address in no form: not verbatim, not reversed, and
            # | no query parameter beyond the five the flow defines
            description: "la URL del cliente no filtra la dirección de ninguna forma: ni textual, ni invertida, y ningún parámetro de consulta más allá de los cinco que define el flujo"  # @src=dc6e3affe735
      check:                      # quiz
        questions:
          q1:
            # | You wired Coinbase Onramp's headless flow into Wavelength's checkout. A
            # | teammate proposes building the onramp URL on the client by appending the
            # | buyer's wallet address and your app ID as query params. Why does the
            # | session-token flow exist instead?
            prompt: "Cableaste el flujo headless de Coinbase Onramp dentro del checkout de Wavelength. Un compañero de equipo propone construir la URL del onramp en el cliente agregando la dirección de billetera del comprador y tu app ID como parámetros de consulta. ¿Por qué existe en cambio el flujo de session-token?"  # @src=28213a196e5e
            # | The headless flow mints a one-time session token on the server, binding the
            # | destination address and receivable assets. The client then opens a URL
            # | carrying only that token. A tampered client URL cannot redirect the funded
            # | USDC, because the address never travels in the query string. That is the
            # | exact property your coding challenge enforces: bind server-side, never leak.
            explanation: "El flujo headless acuña en el servidor un session token de un solo uso, vinculando la dirección de destino y los activos por cobrar. Después el cliente abre una URL que lleva solo ese token. Una URL de cliente manipulada no puede redirigir el USDC fondeado, porque la dirección nunca viaja en el query string. Esa es exactamente la propiedad que impone tu desafío de código: vincula del lado del servidor, nunca filtres."  # @src=430e4d713f58
            options:                 # source order — keep it
              c:
                # | The address and asset are bound to a server-minted token, so the client
                # | URL cannot redirect the funds.
                label: "La dirección y el activo están vinculados a un token acuñado en el servidor, así que la URL del cliente no puede redirigir los fondos."  # @src=fb8783e246fa
                # | Whatever the client can edit, an attacker can edit; the token is a
                # | bearer credential, which is why it is minted one-time and short-lived.
                feedback: "Lo que el cliente puede editar, un atacante lo puede editar; el token es una credencial al portador, que es la razón por la que se acuña de un solo uso y de vida corta."  # @src=c60aee98a1c7
              a:
                # | App IDs are rotated hourly, so a client-built URL would stop working
                # | within the hour anyway.
                label: "Los app IDs se rotan cada hora, así que una URL construida en el cliente dejaría de funcionar dentro de la hora de todos modos."  # @src=c392bbc9fdd9
                # | App IDs are not rotated hourly; that is not the reason the token flow
                # | exists.
                feedback: "Los app IDs no se rotan cada hora; esa no es la razón por la que existe el flujo del token."  # @src=cc272c001e48
              d:
                # | It also proves the buyer authorized that destination, so a tampered POST
                # | body cannot redirect the funds.
                label: "También demuestra que el comprador autorizó ese destino, así que un cuerpo POST manipulado no puede redirigir los fondos."  # @src=e9d4d1433666
                # | The token binds a destination; it says nothing about who asked for it.
                # | The lab's /session route still takes the address from a client POST, and
                # | closing that hop takes a logged-in session or a wallet signature your
                # | app owns.
                feedback: "El token vincula un destino; no dice nada sobre quién lo pidió. La ruta /session del lab sigue tomando la dirección de un POST del cliente, y cerrar ese salto requiere una sesión logueada o una firma de billetera que sea de tu app."  # @src=b6a915ad5cd2
              b:
                # | Onramp URLs cannot encode a base58 Solana address in a query param, so a
                # | session token is the only way to name a non-EVM destination.
                label: "Las URLs de Onramp no pueden codificar una dirección base58 de Solana en un parámetro de consulta, así que un session token es la única manera de nombrar un destino no-EVM."  # @src=e59b85bf0f7e
                # | A base58 address encodes into a query param without trouble; the token
                # | exists so the destination cannot be tampered with in transit, not
                # | because Solana addresses are unrepresentable.
                feedback: "Una dirección base58 se codifica en un parámetro de consulta sin problema; el token existe para que el destino no se pueda manipular en tránsito, no porque las direcciones de Solana sean irrepresentables."  # @src=efaa4b991ccd
          q2:
            # | A SOL-less buyer uses the embedded Stripe onramp to fund a purchase. Days
            # | later a dispute is filed on the card. Who eats the loss and handles the
            # | chargeback?
            prompt: "Un comprador sin SOL usa el onramp embebido de Stripe para fondear una compra. Días después se presenta una disputa sobre la tarjeta. ¿Quién se come la pérdida y maneja el chargeback?"  # @src=a5fc43f2d30d
            # | Stripe runs its fiat-to-crypto onramp as merchant-of-record: it handles KYC
            # | and absorbs fraud and disputes. That is precisely what you are buying by
            # | embedding a ramp instead of taking cards yourself. The tradeoff is that
            # | Stripe, not you, owns the geo and asset coverage and the preview-status
            # | limits.
            explanation: "Stripe corre su onramp de fiat a cripto como merchant-of-record: maneja el KYC y absorbe el fraude y las disputas. Eso es precisamente lo que estás comprando al embeber una rampa en vez de tomar tarjetas tú mismo. La contrapartida es que Stripe, y no tú, es dueño de la cobertura geográfica y de activos y de los límites del estado de preview."  # @src=eba8fc5d8e28
            options:                 # source order — keep it
              b:
                # | Wavelength, because the funds landed in the buyer's wallet under your
                # | checkout, so the liability follows the goods.
                label: "Wavelength, porque los fondos aterrizaron en la billetera del comprador bajo tu checkout, así que la responsabilidad sigue a la mercancía."  # @src=309774e8bcf1
                # | The onramp settles crypto to the buyer, not to you; as
                # | merchant-of-record for the onramp, Stripe carries the card-side
                # | liability, not the store.
                feedback: "El onramp liquida cripto al comprador, no a ti; como merchant-of-record del onramp, Stripe carga con la responsabilidad del lado de la tarjeta, no la tienda."  # @src=e415bbbcaedc
              c:
                # | The buyer's card issuer, since onramp purchases are treated as cash
                # | advances with no recourse.
                label: "El emisor de la tarjeta del comprador, ya que las compras por onramp se tratan como adelantos de efectivo sin recurso."  # @src=48fcf8546597
                # | Onramp buys are not cash advances, and the merchant-of-record is Stripe,
                # | not the issuer.
                feedback: "Las compras por onramp no son adelantos de efectivo, y el merchant-of-record es Stripe, no el emisor."  # @src=fd239b6e1083
              a:
                # | Stripe, which is the merchant-of-record for its onramp and absorbs
                # | fraud, disputes, and KYC.
                label: "Stripe, que es el merchant-of-record de su onramp y absorbe el fraude, las disputas y el KYC."  # @src=76c8c5775277
                # | Liability follows the merchant-of-record on the card leg, and that leg
                # | ends when the buyer receives crypto. Your own sale, downstream of it,
                # | has no dispute backstop at all.
                feedback: "La responsabilidad sigue al merchant-of-record en el tramo de la tarjeta, y ese tramo termina cuando el comprador recibe cripto. Tu propia venta, aguas abajo de él, no tiene ningún respaldo de disputa."  # @src=0efe38274544
              d:
                # | No one: the USDC leg settled with finality, so the card dispute has
                # | nowhere to land.
                label: "Nadie: el tramo de USDC se liquidó con finality, así que la disputa de la tarjeta no tiene dónde aterrizar."  # @src=f969c3f6ff7c
                # | Finality settles the USDC leg, not the card leg. The charge stays
                # | disputable for months, and the dispute lands on whoever is
                # | merchant-of-record for it.
                feedback: "La finality liquida el tramo de USDC, no el tramo de la tarjeta. El cargo sigue siendo disputable durante meses, y la disputa aterriza en quien sea merchant-of-record de ella."  # @src=083f15df1d47
          q3:
            # | Wavelength wants an artist to cash USDC royalties out to a bank, so you
            # | reach for Coinbase Offramp. What constraint shapes the integration compared
            # | with the onramp you just embedded?
            prompt: "Wavelength quiere que un artista retire regalías en USDC a un banco, así que echas mano de Coinbase Offramp. ¿Qué restricción le da forma a la integración comparada con el onramp que acabas de embeber?"  # @src=e514022e0ca7
            # | The onramp can be embedded headlessly; the offramp is hosted-only, so the
            # | way out is a redirect into Coinbase's own flow, with ACH or PayPal as the
            # | payout rails. You give up embedded UX for the exit and, in exchange, keep
            # | the payout KYC off your plate.
            explanation: "El onramp se puede embeber de forma headless; el offramp es solo alojado, así que el camino de salida es una redirección al flujo propio de Coinbase, con ACH o PayPal como los rieles de payout. Cedes la UX embebida para la salida y, a cambio, mantienes el KYC del payout fuera de tu plato."  # @src=678d994bb8ca
            options:                 # source order — keep it
              d:
                # | The hosted exit needs no session token: you redirect with a
                # | partnerUserRef and a redirectUrl, and Coinbase signs the artist in.
                label: "La salida alojada no necesita ningún session token: rediriges con un partnerUserRef y un redirectUrl, y Coinbase inicia la sesión del artista."  # @src=3c13093a481b
                # | Both directions have been session-token-initialized since July 2025, so
                # | the sell URL carries a sessionToken alongside partnerUserRef and
                # | redirectUrl. Hosting changes where the screens live, not how the session
                # | is bound.
                feedback: "Las dos direcciones se inicializan con session token desde julio de 2025, así que la URL de venta lleva un sessionToken junto a partnerUserRef y redirectUrl. El alojamiento cambia dónde viven las pantallas, no cómo se vincula la sesión."  # @src=1027286458bc
              a:
                # | Offramp exposes the same headless session-token endpoint as the onramp,
                # | so you reuse the embedded component and flip its direction flag.
                label: "Offramp expone el mismo endpoint headless de session-token que el onramp, así que reutilizas el componente embebido y das vuelta su bandera de dirección."  # @src=c7f8fac09555
                # | There is no headless offramp endpoint and no direction flag to flip;
                # | Offramp is hosted-only, so the way out is a redirect.
                feedback: "No hay endpoint headless de offramp ni bandera de dirección que dar vuelta; Offramp es solo alojado, así que el camino de salida es una redirección."  # @src=31990f1accb7
              c:
                # | Offramp requires you to become the merchant-of-record, taking on the
                # | payout KYC yourself.
                label: "Offramp requiere que te conviertas en el merchant-of-record, tomando el KYC del payout tú mismo."  # @src=64a9fe592e60
                # | The hosted flow keeps KYC with Coinbase; the point of a hosted offramp
                # | is that you do not take on the payout compliance.
                feedback: "El flujo alojado mantiene el KYC con Coinbase; el punto de un offramp alojado es que no tomas el compliance del payout."  # @src=7f0dcbbee80d
              b:
                # | Offramp is hosted-only, so you redirect rather than embed, and the
                # | payout runs over ACH or PayPal.
                label: "Offramp es solo alojado, así que rediriges en vez de embeber, y el payout corre sobre ACH o PayPal."  # @src=76794730de52
                # | With no headless endpoint published, the exit has to leave your UI, and
                # | the payout runs at bank speed; what you buy for that is the payout KYC
                # | staying off your plate.
                feedback: "Sin ningún endpoint headless publicado, la salida tiene que irse de tu UI, y el payout corre a velocidad de banco; lo que compras a cambio es que el KYC del payout se quede fuera de tu plato."  # @src=60e4c65c49a7
          q4:
            # | Two flows in this lesson both cross between fiat and crypto: a processor
            # | settling your card sales to a fiat balance, and a user off-ramping their own
            # | USDC to a bank. Why does the course insist these are different?
            prompt: "Dos flujos de esta lección cruzan entre fiat y cripto: un procesador que liquida tus ventas con tarjeta a un saldo fiat, y un usuario que hace el off-ramp de su propio USDC a un banco. ¿Por qué el curso insiste en que son distintos?"  # @src=b1631c41e362
            # | Merchant fiat settlement is the processor acting for you, the merchant; a
            # | user off-ramp is the buyer or artist acting for themselves. Different actor,
            # | different KYC surface, different merchant-of-record. The dev's compliance
            # | job is not to run either flow but to know which is which at every seam,
            # | which is exactly what the assessment asks you to state in one line.
            explanation: "La liquidación fiat del comercio es el procesador actuando por ti, el comercio; un off-ramp de usuario es el comprador o el artista actuando por sí mismos. Distinto actor, distinta superficie de KYC, distinto merchant-of-record. El trabajo de compliance del dev no es correr ninguno de los dos flujos sino saber cuál es cuál en cada costura, que es exactamente lo que la evaluación te pide que digas en una línea."  # @src=8b72a5357a03
            options:                 # source order — keep it
              a:
                # | They run on different blockchains, so the KYC provider differs by the
                # | chain used.
                label: "Corren sobre blockchains distintas, así que el proveedor de KYC difiere según la blockchain usada."  # @src=4575a87e38f1
                # | Same chain in both cases; the difference is the actor and the direction,
                # | not the chain.
                feedback: "La misma blockchain en los dos casos; la diferencia es el actor y la dirección, no la blockchain."  # @src=a45d4c4fd983
              b:
                # | Merchant settlement is off-ramping wearing a processor's branding, so
                # | one KYC registration at the processor covers both directions.
                label: "La liquidación del comercio es off-ramping con la marca de un procesador puesta, así que un solo registro de KYC en el procesador cubre las dos direcciones."  # @src=c2c07edb4eea
                # | One registration does not cover both: different actors, different KYC
                # | surfaces, and collapsing them hides who is liable where.
                feedback: "Un solo registro no cubre las dos: distintos actores, distintas superficies de KYC, y colapsarlas esconde quién es responsable dónde."  # @src=7620b5773513
              d:
                # | One moves money out and the other moves it in, so KYC attaches to the
                # | direction of the transfer.
                label: "Uno mueve dinero para afuera y el otro lo mueve para adentro, así que el KYC se pega a la dirección de la transferencia."  # @src=66ce6f96182a
                # | Both of these carry value from crypto to fiat, so direction does not
                # | tell them apart. What tells them apart is who is transacting: your
                # | business at the processor, or the artist at the ramp.
                feedback: "Los dos llevan valor de cripto a fiat, así que la dirección no los distingue. Lo que los distingue es quién está transando: tu negocio en el procesador, o el artista en la rampa."  # @src=26195727d017
              c:
                # | They involve different actors, so the KYC surface and the
                # | merchant-of-record sit in different places for each.
                label: "Involucran actores distintos, así que la superficie de KYC y el merchant-of-record están en lugares distintos para cada uno."  # @src=5ae55cec5eb5
                # | Compliance follows whoever is legally transacting, not the direction the
                # | money moves, so the actor at each seam is yours to keep track of.
                feedback: "El cumplimiento sigue a quien esté transando legalmente, no a la dirección en la que se mueve el dinero, así que el actor en cada costura es tuyo para seguirle la pista."  # @src=92c3074b8d5e
  m06-l2:
    # | Acceptance and corridors: Stripe, MoonPay Commerce, and PIX
    title: "Aceptación y corredores: Stripe, MoonPay Commerce y PIX"  # @src=65b69c87c113
    blocks:
      check:                      # quiz
        questions:
          q5:
            # | A US buyer pays Wavelength for a record with USDC on Solana through Stripe's
            # | pay-with-crypto. You check the Stripe dashboard the next morning. What did
            # | you receive, and what is the refund path?
            prompt: "Un comprador de EE. UU. le paga a Wavelength un disco con USDC en Solana a través del pay-with-crypto de Stripe. Compruebas el dashboard de Stripe a la mañana siguiente. ¿Qué recibiste, y cuál es el camino del reembolso?"  # @src=9ca68350be89
            # | Stripe pay-with-crypto accepts USDC on Solana but settles to your fiat
            # | Stripe balance, so you are not holding crypto. Refunds are push payments of
            # | stablecoins back to the originating wallet, the same reverse-transfer shape
            # | you built in the reconciliation lesson. There is no chargeback and no
            # | on-chain reversal.
            explanation: "Stripe pay-with-crypto acepta USDC en Solana pero liquida a tu saldo fiat de Stripe, así que no tienes cripto. Los reembolsos son pagos push de stablecoins de vuelta a la billetera de origen, la misma forma de transferencia inversa que construiste en la lección de conciliación. No hay chargeback y no hay reversión on-chain."  # @src=3a30a6437cf2
            options:                 # source order — keep it
              b:
                # | USDC in a Stripe-custodied wallet you withdraw on-chain, with refunds
                # | issued as on-chain reversals of the original transfer.
                label: "USDC en una billetera custodiada por Stripe que retiras on-chain, con reembolsos emitidos como reversiones on-chain de la transferencia original."  # @src=2d16aed46c9c
                # | Settlement is to a fiat balance, and on-chain transfers are not
                # | reversible; refunds are push payments as stablecoins.
                feedback: "La liquidación es a un saldo fiat, y las transferencias on-chain no son reversibles; los reembolsos son pagos push como stablecoins."  # @src=d498b37417e2
              c:
                # | Nothing until a 24-hour finalization clears, after which the buyer must
                # | re-initiate any refund from their wallet.
                label: "Nada hasta que se libere una finalization de 24 horas, después de lo cual el comprador tiene que volver a iniciar cualquier reembolso desde su billetera."  # @src=3fd570c82a35
                # | Settlement is to your fiat balance, and refunds are merchant-initiated
                # | push payments, not a buyer re-initiation.
                feedback: "La liquidación es a tu saldo fiat, y los reembolsos son pagos push iniciados por el comercio, no una re-iniciación del comprador."  # @src=afef4a3c11cb
              d:
                # | A fiat balance, with refunds pushed as stablecoins to whichever wallet
                # | the buyer nominates at refund time rather than the originating one.
                label: "Un saldo fiat, con reembolsos enviados por push como stablecoins a la billetera que el comprador nomine al momento del reembolso y no a la de origen."  # @src=eda26ae0e19f
                # | The settlement half is right and the return address is not: the
                # | stablecoin goes back to the wallet the payment came from. Letting a
                # | payer nominate a fresh destination for a refund is how refund flows get
                # | farmed, which is why the originating-wallet rule shows up on every push
                # | rail in this course.
                feedback: "La mitad de la liquidación está bien y la dirección de retorno no: la stablecoin vuelve a la billetera de la que vino el pago. Dejar que un pagador nomine un destino nuevo para un reembolso es cómo se cultivan los flujos de reembolso, que es por qué la regla de billetera de origen aparece en todos los rieles push de este curso."  # @src=82e522f40694
              a:
                # | A fiat balance: Stripe settles the sale in fiat, and refunds go back as
                # | stablecoins to the originating wallet.
                label: "Un saldo fiat: Stripe liquida la venta en fiat, y los reembolsos vuelven como stablecoins a la billetera de origen."  # @src=fdc5f7cd7b31
                # | The legs are not symmetric; you receive a currency you never converted,
                # | while the return leg has to be a stablecoin push because the chain
                # | issues no reversal. Two units, one order.
                feedback: "Los tramos no son simétricos; recibes una moneda que nunca convertiste, mientras que el tramo de retorno tiene que ser un push de stablecoin porque la blockchain no emite ninguna reversión. Dos unidades, una sola orden."  # @src=87b6684df629
          q6:
            # | A wave of Brazilian buyers expects to pay Wavelength with PIX. Which
            # | corridor choice matches the research, and what is the settlement
            # | expectation?
            prompt: "Una ola de compradores brasileños espera pagarle a Wavelength con PIX. ¿Qué elección de corredor coincide con la investigación, y cuál es la expectativa de liquidación?"  # @src=b68ced6e6c30
            # | Sphere is the Brazil corridor anchor: its rails include PIX alongside SEPA
            # | and ACH, with settlement quoted under 30 minutes. That is exactly why a
            # | corridor decision is a per-geography table rather than one processor: Sphere
            # | wins Brazil and would do nothing for your US card buyer.
            explanation: "Sphere es el ancla del corredor de Brasil: sus rieles incluyen PIX junto a SEPA y ACH, con liquidación cotizada en menos de 30 minutos. Eso es exactamente por qué una decisión de corredor es una tabla por geografía y no un solo procesador: Sphere gana Brasil y no haría nada por tu comprador con tarjeta de EE. UU."  # @src=048ad50586a1
            options:                 # source order — keep it
              d:
                # | Sphere, whose public page confirms BRL settlement for PIX buyers, same
                # | business day.
                label: "Sphere, cuya página pública confirma liquidación en BRL para compradores PIX, el mismo día hábil."  # @src=e578a7fab541
                # | Sphere is the right row for the wrong reason. Its public page quotes
                # | settlement timing, under 30 minutes, and never states the settlement
                # | asset, so BRL is your assumption and not its claim. That cell stays
                # | marked confirm-with-vendor.
                feedback: "Sphere es la fila correcta por la razón equivocada. Su página pública cotiza el plazo de liquidación, menos de 30 minutos, y nunca declara el activo de liquidación, así que BRL es tu suposición y no su afirmación. Esa celda sigue marcada confirm-with-vendor."  # @src=9080d494a1ba
              c:
                # | MoonPay Commerce, the only processor in the roster offering a PIX
                # | payout.
                label: "MoonPay Commerce, el único procesador del roster que ofrece un payout PIX."  # @src=b5e9a824a304
                # | Sphere is the PIX anchor in the research; MoonPay Commerce is not the
                # | PIX choice here.
                feedback: "Sphere es el ancla PIX en la investigación; MoonPay Commerce no es la elección PIX aquí."  # @src=fda0c106afde
              a:
                # | Stripe pay-with-crypto, which lists PIX among its supported settlement
                # | rails for Brazil.
                label: "Stripe pay-with-crypto, que lista PIX entre sus rieles de liquidación soportados para Brasil."  # @src=3cbbd55fa340
                # | Stripe's crypto acceptance is stablecoin-network-based; PIX is Sphere's
                # | rail, not Stripe's.
                feedback: "La aceptación cripto de Stripe está basada en redes de stablecoins; PIX es el riel de Sphere, no el de Stripe."  # @src=711987204c6b
              b:
                # | Sphere, whose rails include PIX alongside SEPA and ACH, with settlement
                # | quoted under 30 minutes.
                label: "Sphere, cuyos rieles incluyen PIX junto a SEPA y ACH, con liquidación cotizada en menos de 30 minutos."  # @src=24a431929c41
                # | A corridor turns on which local rail a provider touches, not on size.
                feedback: "Un corredor depende de qué riel local toca un proveedor, no del tamaño."  # @src=68bfff1ea3ec
          q7:
            # | Wavelength puts a $30 sticker on the August pressing and takes payment in a
            # | USD-pegged stablecoin. A buyer asks why the figure they are charged is not
            # | rounded off a live market rate. How should the storefront set that number,
            # | and where does price-feed depth belong?
            prompt: "Wavelength le pone una etiqueta de $30 al prensado de agosto y cobra en una stablecoin con peg a USD. Un comprador pregunta por qué la cifra que le cobran no está redondeada a partir de una tasa de mercado viva. ¿Cómo debería fijar ese número la tienda, y a dónde pertenece la profundidad de price feed?"  # @src=cd8f76daccd9
            # | Because USDC is a USD peg, a USD-priced record is charged as the same number
            # | of USDC, 1:1, with no oracle needed. Display pricing only gets interesting
            # | for volatile assets, and that oracle-based pricing depth is deliberately out
            # | of scope here — DeFi and RWA Engineering territory, not a payments-course
            # | skill. Building a price feed for a pegged stablecoin is wasted work.
            explanation: "Como USDC es un peg a USD, un disco con precio en USD se cobra como el mismo número de USDC, 1:1, sin necesitar ningún oráculo. El precio de exhibición solo se pone interesante para activos volátiles, y esa profundidad de precio basado en oráculos queda deliberadamente fuera de alcance aquí — territorio de DeFi and RWA Engineering, no una habilidad de curso de pagos. Construir un price feed para una stablecoin con peg es trabajo desperdiciado."  # @src=55fd6ce76d4d
            options:                 # source order — keep it
              c:
                # | USD-priced records are charged in exact USDC 1:1; oracle pricing belongs
                # | to volatile assets and stays out of this course's scope.
                label: "Los discos con precio en USD se cobran en USDC exacto 1:1; el precio por oráculo pertenece a los activos volátiles y se queda fuera del alcance de este curso."  # @src=593a8ddb14c1
                # | A USD-pegged unit needs no conversion, leaving no rate to fetch and no
                # | spread to carry. The peg is an assumption, though, and on a Token-2022
                # | mint (not classic USDC) a transfer fee can still change what lands,
                # | which is why the roster check stays.
                feedback: "Una unidad con peg a USD no necesita ninguna conversión, así que no queda ninguna tasa que buscar ni ningún spread que cargar. Eso sí, el peg es una suposición, y en un mint Token-2022 (no el USDC clásico) una comisión de transferencia igual puede cambiar lo que aterriza, que es por qué la comprobación del roster se queda."  # @src=01b070c3fd2b
              b:
                # | You must run your own price feed for every record, since oracle
                # | integration is a core payments-course skill.
                label: "Tienes que correr tu propio price feed para cada disco, ya que la integración de oráculos es una habilidad central de un curso de pagos."  # @src=1acbf77f4f87
                # | For a USD-pegged stablecoin the display price is 1:1; oracle depth is
                # | handed off, not a core skill here.
                feedback: "Para una stablecoin con peg a USD el precio de exhibición es 1:1; la profundidad de oráculos se traspasa, no es una habilidad central aquí."  # @src=84e99f5ff50e
              a:
                # | USDC floats against USD like any other token, so you quote a mid-price
                # | off an oracle, eat the spread, and wire that feed here in full.
                label: "USDC flota contra USD como cualquier otro token, así que cotizas un precio medio a partir de un oráculo, te comes el spread, y cableas ese feed aquí por completo."  # @src=63cb5ad80128
                # | USDC is a USD peg charged 1:1, so there is no spread to eat, and deep
                # | oracle pricing is not taught in this course.
                feedback: "USDC es un peg a USD cobrado 1:1, así que no hay ningún spread que comerse, y el precio profundo por oráculo no se enseña en este curso."  # @src=254fe6bdb5d3
              d:
                # | Charge 1:1 now, and treat oracle pricing for volatile assets, with its
                # | staleness and spread rules, as work this course still owes you.
                label: "Cobra 1:1 ahora, y trata el precio por oráculo para activos volátiles, con sus reglas de obsolescencia y spread, como trabajo que este curso todavía te debe."  # @src=d173a7b68119
                # | The 1:1 half is right; the promissory note is not one this course wrote.
                # | Staleness windows, confidence intervals and spread policy are handed off
                # | to DeFi and RWA Engineering by name, and the corridor record notes the
                # | handoff rather than teaching a quarter of it.
                feedback: "La mitad del 1:1 está bien; el pagaré no es uno que este curso haya escrito. Las ventanas de obsolescencia, los intervalos de confianza y la política de spread se traspasan a DeFi and RWA Engineering por nombre, y el registro de corredores anota el traspaso en vez de enseñar un cuarto de ello."  # @src=bf624f88c6e0
          q8:
            # | Writing Wavelength's corridor decision record, you cite MoonPay Commerce.
            # | What is the accurate framing of what it is and how you cite its volume?
            prompt: "Escribiendo el registro de decisión de corredores de Wavelength, citas MoonPay Commerce. ¿Cuál es la lectura precisa de lo que es y de cómo citas su volumen?"  # @src=b040d082f4d0
            # | MoonPay Commerce is the former Helio: hel.io redirects into MoonPay's
            # | commerce arm. Its marketed volume, over $40M in single-payment volume since
            # | the October 2025 launch with 88% on Solana, is a moving figure, so the
            # | decision record cites it with source and date. Treating any marketed volume
            # | number as a fixed constant is the footgun the whole numbers-discipline rule
            # | guards against.
            explanation: "MoonPay Commerce es el antiguo Helio: hel.io redirige al brazo de comercio de MoonPay. Su volumen comercializado, más de $40M en volumen single-payment desde el lanzamiento de octubre de 2025 con 88% en Solana, es una cifra en movimiento, así que el registro de decisión lo cita con fuente y fecha. Tratar cualquier número de volumen comercializado como una constante fija es la trampa contra la que protege toda la regla de disciplina numérica."  # @src=a911827558d8
            options:                 # source order — keep it
              d:
                # | It is ex-Helio, and the $40M figure comes via Solana's ecosystem
                # | roundup, so it is third-party verified.
                label: "Es ex-Helio, y la cifra de $40M viene vía el resumen de ecosistema de Solana, así que está verificada por un tercero."  # @src=647f67f84e6b
                # | The roundup reports MoonPay reporting itself, so the chain has two links
                # | and the number is still the vendor's chosen one. Publication elsewhere
                # | changes who repeated a figure, not who measured it, and a flow figure
                # | for a young product decays whoever prints it.
                feedback: "El resumen reporta a MoonPay reportándose a sí mismo, así que la cadena tiene dos eslabones y el número sigue siendo el que eligió el proveedor. Publicarlo en otro lado cambia quién repitió una cifra, no quién la midió, y una cifra de flujo de un producto joven se degrada sin importar quién la imprima."  # @src=83b7d545ef8f
              c:
                # | It is the Solana Foundation's official acceptance processor, and its
                # | volume comes from verifiable on-chain reads.
                label: "Es el procesador de aceptación oficial de la Solana Foundation, y su volumen viene de lecturas on-chain verificables."  # @src=335008a5e1b3
                # | It is a MoonPay product, not a Foundation processor, and the figure is a
                # | marketed dated number, not an on-chain read.
                feedback: "Es un producto de MoonPay, no un procesador de la Foundation, y la cifra es un número comercializado y fechado, no una lectura on-chain."  # @src=c9eb173b4950
              b:
                # | It is a Stripe competitor built from scratch in 2026, and its $40M
                # | single-payment volume is an audited constant you can quote flat in the
                # | record.
                label: "Es un competidor de Stripe construido desde cero en 2026, y su volumen single-payment de $40M es una constante auditada que puedes citar plana en el registro."  # @src=7db5aec6f459
                # | It is ex-Helio rather than a from-scratch build, and marketed volume is
                # | a moving figure, not an audited constant.
                feedback: "Es ex-Helio y no una construcción desde cero, y el volumen comercializado es una cifra en movimiento, no una constante auditada."  # @src=17e1e49676e9
              a:
                # | It is ex-Helio (hel.io redirects into MoonPay), and volume figures carry
                # | a source and date because the number moves.
                label: "Es ex-Helio (hel.io redirige a MoonPay), y las cifras de volumen llevan una fuente y una fecha porque el número se mueve."  # @src=e0bb76cf3d74
                # | A redirect is the evidence of who owns the product now; a marketed
                # | figure is live.
                feedback: "Una redirección es la evidencia de quién es dueño del producto ahora; una cifra comercializada está viva."  # @src=387853fb8f43
          q9:
            # | Wavelength's BR corridor is live. A São Paulo buyer pays in USDC out of a
            # | wallet whose keys they hold, routed through the corridor's Brazilian
            # | intermediary, and Wavelength sits in Brazil too. Run the boundary section's
            # | five questions: where does this movement land as of mid-2026, and what do
            # | you ask next?
            prompt: "El corredor BR de Wavelength está vivo. Un comprador de São Paulo paga en USDC desde una billetera cuyas claves tiene él, ruteado a través del intermediario brasileño del corredor, y Wavelength también se sienta en Brasil. Corre las cinco preguntas de la sección de la frontera: ¿dónde aterriza este movimiento a mediados de 2026, y qué preguntas después?"  # @src=c2abefc124ed
            # | The perimeter test is art. 76-A of Resolução BCB 277, inserted by Res. 521
            # | and in force for that article since 2026-02-02, and its third bucket is
            # | expressly the non-international one: transfers to or from a self-custodied
            # | wallet that involve no international payment. This flow crosses no border
            # | anywhere and sits inside anyway; put a border in it and it moves to the
            # | first bucket rather than out of the perimeter. 76-B only defines the
            # | international bucket, and is itself broader than resident-to-non-resident;
            # | PL 4.308 is a bill about issuance, not classification. The next check is the
            # | provider's authorization, which is question 2 of the method.
            explanation: "La prueba de perímetro es el art. 76-A de la Resolução BCB 277, insertado por la Res. 521 y en vigor para ese artículo desde el 2026-02-02, y su tercer grupo es expresamente el no internacional: transferencias hacia o desde una billetera autocustodiada que no involucran ningún pago internacional. Este flujo no cruza ninguna frontera en ningún lado y aun así se sienta adentro; ponle una frontera y se mueve al primer grupo en vez de salir del perímetro. 76-B solo define el grupo internacional, y es en sí mismo más ancho que residente-a-no-residente; PL 4.308 es un proyecto de ley sobre emisión, no sobre clasificación. La siguiente comprobación es la autorización del proveedor, que es la pregunta 2 del método."  # @src=22b01ce4e8da
            options:                 # source order — keep it
              a:
                # | Inside the FX perimeter: art. 76-A III reaches self-custody transfers
                # | with a PSAV leg and no border, so check the provider's licence.
                label: "Dentro del perímetro de cambio: el art. 76-A III alcanza transferencias de autocustodia con un tramo PSAV y sin frontera, así que comprueba la licencia del proveedor."  # @src=cb0a953b98ac
                # | The perimeter test is 76-A, whose third bucket pulls purely domestic
                # | self-custody flows in whenever a PSAV is a leg. In force since
                # | 2026-02-02, and dated: re-pull the text first.
                feedback: "La prueba de perímetro es 76-A, cuyo tercer grupo mete adentro flujos de autocustodia puramente domésticos cada vez que un PSAV es un tramo. En vigor desde el 2026-02-02, y fechado: vuelve a consultar el texto primero."  # @src=4d7cd0b1944e
              d:
                # | Outside the perimeter for now: the rules reaching a self-custody leg
                # | through a PSAV are Res. 561's eFX articles, which take force on
                # | 2026-10-01.
                label: "Fuera del perímetro por ahora: las reglas que alcanzan un tramo de autocustodia a través de un PSAV son los artículos eFX de la Res. 561, que entran en vigor el 2026-10-01."  # @src=55bbf5e118ea
                # | Two texts, two clocks. Res. 561 governs the settlement leg between an
                # | eFX provider and a foreign counterparty and commences 2026-10-01; the
                # | perimeter test that catches this domestic flow is art. 76-A of Res. 277,
                # | in force since 2026-02-02. Citing the wrong normativo is its own failure
                # | mode.
                feedback: "Dos textos, dos relojes. La Res. 561 gobierna el tramo de liquidación entre un proveedor eFX y una contraparte extranjera y entra en vigor el 2026-10-01; la prueba de perímetro que atrapa este flujo doméstico es el art. 76-A de la Res. 277, en vigor desde el 2026-02-02. Citar el normativo equivocado es su propio modo de falla."  # @src=9ac37807149a
              b:
                # | Outside it: art. 76-B defines an international payment as resident to
                # | non-resident, and two Brazilian residents never satisfy that test.
                label: "Fuera de él: el art. 76-B define un pago internacional como residente a no residente, y dos residentes brasileños nunca satisfacen esa prueba."  # @src=6e292d6ebc48
                # | 76-B only defines the international bucket, one of four, and is itself
                # | broader than that; a domestic flow still enters the perimeter through
                # | the self-custody reach of 76-A III.
                feedback: "76-B solo define el grupo internacional, uno de cuatro, y es en sí mismo más ancho que eso; un flujo doméstico igual entra al perímetro por el alcance de autocustodia de 76-A III."  # @src=ca01bf893902
              c:
                # | Outside it until PL 4.308 passes, since only that bill's
                # | reclassification of stablecoins as foreign currency triggers the FX
                # | rules.
                label: "Fuera de él hasta que pase el PL 4.308, ya que solo la reclasificación de stablecoins como moneda extranjera que hace ese proyecto de ley dispara las reglas de cambio."  # @src=3874b21758fe
                # | PL 4.308 is still a bill, and neither version reclassifies stablecoins:
                # | both keep them virtual assets and touch issuance and distribution. Res.
                # | 277's perimeter already applies.
                feedback: "PL 4.308 sigue siendo un proyecto de ley, y ninguna de las dos versiones reclasifica las stablecoins: las dos las mantienen como activos virtuales y tocan la emisión y la distribución. El perímetro de la Res. 277 ya aplica."  # @src=c43a7f74efc0
  m07-l1:
    # | HTTP 402, revived: the x402 protocol
    title: "HTTP 402, revivido: el protocolo x402"  # @src=c50137898009
    blocks:
      check-concept:                      # quiz
        questions:
          q1-who-signs:
            # | In the exact-SVM flow you just traced, a paying agent gets a 402 with
            # | PaymentRequirements. It builds and partially signs a versioned transaction
            # | and hands it to the facilitator. Whose signature is still missing, and who
            # | adds it?
            prompt: "En el flujo exact-SVM que acabas de rastrear, un agente que paga recibe un 402 con PaymentRequirements. Construye y firma parcialmente una transacción versionada y se la entrega al facilitador. ¿De quién es la firma que todavía falta, y quién la agrega?"  # @src=394163a4f4be
            # | The whole point of the exact-SVM scheme is fee sponsorship: the agent signs
            # | everything except the fee-payer slot, and the facilitator's /settle adds the
            # | fee-payer signature and broadcasts. /verify also fills that slot, but on a
            # | scratch copy and only to simulate the completed transaction; it never
            # | submits, so /settle stays the only step that moves money.
            explanation: "El punto entero del esquema exact-SVM es el patrocinio de comisiones: el agente firma todo excepto el slot de fee payer, y el /settle del facilitador agrega la firma de fee payer y hace el broadcast. /verify también llena ese slot, pero en una copia de prueba y solo para simular la transacción completada; nunca envía, así que /settle sigue siendo el único paso que mueve dinero."  # @src=221f66ebaa9d
            options:                 # source order — keep it
              a:
                # | The fee payer's signature is missing; the facilitator adds it at /settle
                # | and submits the transaction.
                label: "Falta la firma del fee payer; el facilitador la agrega en /settle y envía la transacción."  # @src=ccdf9f230cfe
                # | Leaving one slot unsigned is what makes sponsorship possible, the payer
                # | authorizing the transfer without funding it. Until the sponsor
                # | broadcasts, that intent is not yet a payment.
                feedback: "Dejar un slot sin firmar es lo que hace posible el patrocinio, con el pagador autorizando la transferencia sin fondearla. Hasta que el patrocinador haga el broadcast, esa intención todavía no es un pago."  # @src=f5bcd6eb9277
              d:
                # | The fee payer's signature is missing; /verify adds it and /settle
                # | broadcasts what verify signed.
                label: "Falta la firma del fee payer; /verify la agrega y /settle hace el broadcast de lo que verify firmó."  # @src=aa320fe38a24
                # | Right slot, wrong step. The fee-payer signature /verify adds lives on a
                # | scratch copy it simulates and then discards; the signature that goes out
                # | is the one /settle puts on the real transaction. One of those two steps
                # | can move money, and it is not the rehearsal.
                feedback: "Slot correcto, paso equivocado. La firma de fee payer que agrega /verify vive en una copia de prueba que simula y después descarta; la firma que sale es la que /settle le pone a la transacción real. Uno de esos dos pasos puede mover dinero, y no es el ensayo."  # @src=d109d104dbf6
              b:
                # | The merchant's signature is missing; the merchant adds it at /verify
                # | before the agent pays.
                label: "Falta la firma del comercio; el comercio la agrega en /verify antes de que el agente pague."  # @src=023382ac32d1
                # | The merchant runs the API and 402s the request, but it does not co-sign
                # | the payment transaction. Signing and submitting is the facilitator's
                # | job, and it happens at /settle, not /verify.
                feedback: "El comercio corre la API y le responde 402 a la petición, pero no co-firma la transacción de pago. Firmar y enviar es trabajo del facilitador, y pasa en /settle, no en /verify."  # @src=302c1f508829
              c:
                # | No signature is missing; the agent fully signs and submits, and the
                # | facilitator only reads the result.
                label: "No falta ninguna firma; el agente firma completamente y envía, y el facilitador solo lee el resultado."  # @src=982e34282470
                # | The agent PARTIALLY signs on purpose so the facilitator can sponsor
                # | fees. If the agent fully signed and submitted, there would be no
                # | facilitator-as-fee-payer role at all.
                feedback: "El agente firma PARCIALMENTE a propósito para que el facilitador pueda patrocinar las comisiones. Si el agente firmara completamente y enviara, no habría ningún rol de facilitador-como-fee-payer."  # @src=37dc05553a74
          q2-cu-figure:
            # | A teammate writing your API docs wants to state 'each x402 settle costs
            # | about 20,000 compute units' so buyers can budget. What should you tell them?
            prompt: "Un compañero de equipo que escribe tus docs de API quiere declarar que 'cada settle de x402 cuesta alrededor de 20,000 unidades de cómputo' para que los compradores puedan presupuestar. ¿Qué deberías decirle?"  # @src=dd4c36d80bcd
            # | The x402 v2 spec mandates ComputeBudget SetLimit/SetPrice with a bounded CU
            # | PRICE, but it never states a CU count for a settlement. Any absolute you
            # | print needs an independent, dated source, or it should not be printed.
            explanation: "La spec de x402 v2 exige ComputeBudget SetLimit/SetPrice con un PRECIO de CU acotado, pero nunca declara un conteo de CU para una liquidación. Cualquier absoluto que imprimas necesita una fuente independiente y fechada, o no debería imprimirse."  # @src=aa7d7f98dafe
            options:                 # source order — keep it
              a:
                # | Keep it; 20k CU is the spec's stated cost for a single exact-SVM
                # | settlement.
                label: "Déjalo; 20k CU es el costo que declara la spec para una sola liquidación exact-SVM."  # @src=a8ba40321f02
                # | The spec states no CU figure at all. The '20k CU' number was refuted in
                # | research; it roughly equals a transfer plus an ATA creation, not a
                # | mandated cost.
                feedback: "La spec no declara ninguna cifra de CU. El número de '20k CU' se refutó en la investigación; equivale aproximadamente a una transferencia más una creación de ATA, no a un costo exigido."  # @src=eae9127c6d4c
              d:
                # | Drop it from the docs but keep 20k internally, since the spec itself
                # | states it.
                label: "Quítalo de los docs pero quédate con 20k internamente, dado que la spec misma lo declara."  # @src=34f494c5966c
                # | The 20,000 is real and the spec is not where it comes from: it is
                # | DEFAULT_COMPUTE_UNIT_LIMIT in the reference SDK, the ceiling the client
                # | asks for when it prepends SetComputeUnitLimit. Budgeting against a
                # | requested limit is fine as long as you never call it a spec figure or a
                # | cost.
                feedback: "Los 20,000 son reales y la spec no es de donde vienen: es DEFAULT_COMPUTE_UNIT_LIMIT en el SDK de referencia, el techo que el cliente pide cuando antepone SetComputeUnitLimit. Presupuestar contra un límite pedido está bien siempre y cuando nunca lo llames una cifra de la spec ni un costo."  # @src=c0c613b8fbac
              c:
                # | Change it to 4,600 CU, since a settle is just an SPL transfer and the
                # | ComputeBudget instructions the spec mandates cost nothing.
                label: "Cámbialo a 4,600 CU, dado que un settle es solo una transferencia SPL y las instrucciones de ComputeBudget que la spec exige no cuestan nada."  # @src=fbeb6995f3d2
                # | About 4.6k CU is a bare SPL transfer. A settle also carries the mandated
                # | ComputeBudget instructions, which are not free, and it may create an
                # | ATA. The spec pins no absolute, so do not print one.
                feedback: "Alrededor de 4.6k CU es una transferencia SPL pelada. Un settle también lleva las instrucciones exigidas de ComputeBudget, que no son gratis, y puede crear una ATA. La spec no fija ningún absoluto, así que no imprimas uno."  # @src=20f8da23ba56
              b:
                # | Drop the number; the spec states no CU figure, and an unsourced one is
                # | unsupported.
                label: "Quita el número; la spec no declara ninguna cifra de CU, y una sin fuente no tiene sustento."  # @src=7af31bc7ce1b
                # | It bounds the CU price and never the count, so there is no absolute in
                # | it to quote; unstated is not unmeasurable, though, and your own dated
                # | measurement is a citable number.
                feedback: "Acota el precio de CU y nunca el conteo, así que no hay ningún absoluto ahí que citar; no declarado no es no medible, eso sí, y tu propia medición fechada es un número citable."  # @src=cd35be1ec274
          q5-where-terms-live:
            # | You curl an unpaid endpoint. Back comes `HTTP/1.1 402`, a `Content-Length:
            # | 2`, and a body of exactly `{}`. Your client throws immediately, because the
            # | terms array it expected to parse is not there. What is actually wrong?
            prompt: "Le haces curl a un endpoint sin pagar. Vuelve un `HTTP/1.1 402`, un `Content-Length: 2`, y un cuerpo de exactamente `{}`. Tu cliente lanza un error de inmediato, porque el array de términos que esperaba parsear no está ahí. ¿Qué está mal en realidad?"  # @src=d8657987f974
            # | In x402 v2 the challenge travels as base64 JSON in the PAYMENT-REQUIRED
            # | response header, and the 402's body is the two bytes `{}` on the opening
            # | challenge, on a rejected payment, and on a failed settlement alike. Decoding
            # | that header yields `x402Version`, `error` (the failure reason), `resource`,
            # | and the `accepts` array of PaymentRequirements. v1 was the version that
            # | carried its challenge in the body; read the body of a v2 402 and you find an
            # | empty object every time.
            explanation: "En x402 v2 el desafío viaja como JSON en base64 en el header de respuesta PAYMENT-REQUIRED, y el cuerpo del 402 son los dos bytes `{}` igual en el desafío inicial, en un pago rechazado y en una liquidación fallida. Decodificar ese header te da `x402Version`, `error` (la razón de la falla), `resource` y el array `accepts` de PaymentRequirements. v1 era la versión que llevaba su desafío en el cuerpo; lee el cuerpo de un 402 de v2 y encuentras un objeto vacío todas las veces."  # @src=394be127b2c9
            options:                 # source order — keep it
              c:
                # | The 402 is malformed: a spec-conformant challenge must carry `accepts`
                # | in its JSON body, so this response was truncated in transit.
                label: "El 402 está mal formado: un desafío conforme a la spec tiene que llevar `accepts` en su cuerpo JSON, así que esta respuesta se truncó en tránsito."  # @src=2f1b27ab45bc
                # | `Content-Length: 2` matching the two bytes `{}` is not truncation; it is
                # | the specified v2 body. The challenge is complete, and it lives in the
                # | PAYMENT-REQUIRED header your client never decoded.
                feedback: "Que `Content-Length: 2` coincida con los dos bytes `{}` no es truncamiento; es el cuerpo de v2 especificado. El desafío está completo, y vive en el header PAYMENT-REQUIRED que tu cliente nunca decodificó."  # @src=caa2afe192b1
              a:
                # | Nothing on the server: v2 carries the whole challenge in a base64
                # | PAYMENT-REQUIRED response header, so decode that header and read
                # | `accepts` out of it.
                label: "Nada en el servidor: v2 lleva el desafío entero en un header de respuesta PAYMENT-REQUIRED en base64, así que decodifica ese header y lee `accepts` de ahí."  # @src=89d8d51458ba
                # | The `{}` is the specified body, not a truncated one; the boundary is the
                # | version, since a v1 counterparty really does put its challenge in the
                # | body, which is why `x402Version` is the first field worth reading.
                feedback: "El `{}` es el cuerpo especificado, no uno truncado; la frontera es la versión, dado que una contraparte v1 de verdad pone su desafío en el cuerpo, que es la razón de que `x402Version` sea el primer campo que vale leer."  # @src=70fd01e797ce
              b:
                # | The server speaks x402 v1 and is waiting for you to negotiate a version
                # | upward; send the request again with a version header and the body will
                # | fill in.
                label: "El servidor habla x402 v1 y está esperando a que negocies una versión hacia arriba; manda la petición otra vez con un header de versión y el cuerpo se va a llenar."  # @src=7318d88dbd57
                # | There is no version-negotiation retry, and a v1 server is the one case
                # | where the body would NOT be empty: v1 carries its challenge in the body.
                # | The two-byte `{}` is the v2 signature, not a v1 symptom.
                feedback: "No hay ningún reintento de negociación de versión, y un servidor v1 es el único caso en que el cuerpo NO estaría vacío: v1 lleva su desafío en el cuerpo. El `{}` de dos bytes es la marca distintiva de v2, no un síntoma de v1."  # @src=2588c21cf3a9
              d:
                # | Nothing on the server, but your client should read the body once it
                # | pays: rejections and failed settlements put their reason in the JSON
                # | body.
                label: "Nada en el servidor, pero tu cliente debería leer el cuerpo una vez que pague: los rechazos y las liquidaciones fallidas ponen su razón en el cuerpo JSON."  # @src=f1e5fdd4e8ce
                # | The empty body is not a property of unpaid requests; it holds on the
                # | opening challenge, on a payment the facilitator rejected, and on a
                # | settlement that failed alike. The reason a request failed rides in the
                # | challenge header's `error` field every time, which is why read the
                # | header, never the body survives contact with production.
                feedback: "El cuerpo vacío no es una propiedad de las peticiones sin pagar; se sostiene igual en el desafío inicial, en un pago que el facilitador rechazó y en una liquidación que falló. La razón por la que una petición falló viaja en el campo `error` del header del desafío todas las veces, que es la razón de que lee el header, nunca el cuerpo sobreviva al contacto con producción."  # @src=8350ef9b92c8
      check-landscape:                      # quiz
        questions:
          q3-facilitator:
            # | You are choosing a Solana x402 facilitator for a metered API. A colleague
            # | says 'just use Helius, we already use them for webhooks.' What is the
            # | accurate response?
            prompt: "Estás eligiendo un facilitador de x402 en Solana para una API medida. Un colega dice 'usa Helius nomás, ya los usamos para los webhooks.' ¿Cuál es la respuesta correcta?"  # @src=06c35d5f1d2d
            # | The research corrected the charter's guess: Helius is not a facilitator. The
            # | real Solana options are Corbits, Dexter (free), PayAI, Solvador, Coinbase's
            # | hosted CDP (with KYT/OFAC), and Faremeter as an OSS framework; the x402.org
            # | facilitator is devnet/testnet only.
            explanation: "La investigación corrigió la suposición del charter: Helius no es un facilitador. Las opciones reales de Solana son Corbits, Dexter (gratis), PayAI, Solvador, el CDP alojado de Coinbase (con KYT/OFAC) y Faremeter como framework OSS; el facilitador de x402.org es solo devnet/testnet."  # @src=f5c266a88548
            options:                 # source order — keep it
              a:
                # | Good call; Helius is the default Solana facilitator and handles /verify
                # | and /settle.
                label: "Buena idea; Helius es el facilitador de Solana por defecto y maneja /verify y /settle."  # @src=1a9e5feb36a8
                # | Helius is not on any facilitator list. Its roles in this course are
                # | webhooks/RPC and dogfooding the Subscriptions program, not x402
                # | settlement.
                feedback: "Helius no está en ninguna lista de facilitadores. Sus roles en este curso son webhooks/RPC y hacerle dogfooding al programa Subscriptions, no la liquidación de x402."  # @src=f6c64a394e1d
              c:
                # | Helius is not a facilitator; pick Corbits, Dexter, PayAI, Solvador, or
                # | CDP.
                label: "Helius no es un facilitador; elige Corbits, Dexter, PayAI, Solvador o CDP."  # @src=56725ce386af
                # | Facilitator is a protocol role that a vendor relationship never confers,
                # | and the roster of who holds it moves, so this list is a snapshot to
                # | re-check at integration time.
                feedback: "Facilitador es un rol de protocolo que una relación de proveedor nunca confiere, y el roster de quién lo ocupa se mueve, así que esta lista es una captura para volver a comprobar al momento de integrar."  # @src=3cda5602f15d
              b:
                # | Helius can do it in devnet only; for mainnet you must switch to Coinbase
                # | CDP.
                label: "Helius puede hacerlo solo en devnet; para mainnet tienes que cambiarte al CDP de Coinbase."  # @src=0c8ef530b0fa
                # | Helius is not a facilitator on any network. The devnet-only caveat
                # | belongs to the x402.org facilitator, not to Helius.
                feedback: "Helius no es un facilitador en ninguna red. La advertencia de solo-devnet le pertenece al facilitador de x402.org, no a Helius."  # @src=48505d4c8d60
              d:
                # | Helius is not a facilitator; use Faremeter instead, the hosted mainnet
                # | option that also auto-negotiates v1 and v2 for mixed counterparties.
                label: "Helius no es un facilitador; usa Faremeter en su lugar, la opción alojada de mainnet que además auto-negocia v1 y v2 para contrapartes mezcladas."  # @src=2d87a8a0a86b
                # | The first half lands and the second swaps one category error for
                # | another. Faremeter is an open-source framework rather than a hosted
                # | facilitator: it negotiates dialects in front of whichever facilitator
                # | actually runs /verify and /settle, so you still have to name that one.
                feedback: "La primera mitad acierta y la segunda cambia un error de categoría por otro. Faremeter es un framework de código abierto y no un facilitador alojado: negocia dialectos delante de cualquier facilitador que de verdad corra /verify y /settle, así que todavía tienes que nombrar ese."  # @src=8bdb32c32a92
          q4-traffic-windows:
            # | Your landing page needs a credibility stat for x402. You have '75.41M
            # | transactions / $24.24M in 30 days' (x402.org) and '37M+ transactions, 70% of
            # | monthly volume on Solana' (solana.com/x402). How do you present them?
            prompt: "Tu landing page necesita una estadística de credibilidad para x402. Tienes '75.41M transacciones / $24.24M en 30 días' (x402.org) y '37M+ transacciones, 70% del volumen mensual en Solana' (solana.com/x402). ¿Cómo las presentas?"  # @src=d4bed1db7586
            # | The two published numbers use different windows and metrics. The research
            # | rule is explicit: cite each with its own source and fetch date, and never
            # | combine them into one derived statistic, especially because live dashboard
            # | numbers drift daily.
            explanation: "Los dos números publicados usan ventanas y métricas distintas. La regla de la investigación es explícita: cita cada uno con su propia fuente y su propia fecha de obtención, y nunca los combines en una sola estadística derivada, sobre todo porque los números vivos de dashboard derivan a diario."  # @src=9f89e25ba0ca
            options:                 # source order — keep it
              a:
                # | Quote each figure separately with its own source and date; never add or
                # | blend them into one number.
                label: "Cita cada cifra por separado con su propia fuente y su propia fecha; nunca las sumes ni las mezcles en un solo número."  # @src=f3b22de15b84
                # | Different windows and scopes share no denominator, and arithmetic across
                # | them manufactures a statistic nobody published; they may overlap, too,
                # | which leaves neither one a safe floor.
                feedback: "Ventanas y alcances distintos no comparten ningún denominador, y la aritmética entre ellos fabrica una estadística que nadie publicó; además se pueden traslapar, lo que deja que ninguno sea un piso seguro."  # @src=406e536aeaa6
              c:
                # | Use only the bigger one, 75.41M, dated to its fetch, and drop the Solana
                # | figure as redundant.
                label: "Usa solo la más grande, 75.41M, fechada a su obtención, y quita la cifra de Solana por redundante."  # @src=05993fe669a7
                # | Dating what you keep is the right instinct applied to the wrong
                # | survivor. The two measure different things, a 30-day rolling total
                # | against a cumulative-on-Solana snapshot with a share claim, so neither
                # | makes the other redundant; keeping both attributed is the fix.
                feedback: "Fechar lo que te quedas es el instinto correcto aplicado al sobreviviente equivocado. Las dos miden cosas distintas, un total móvil de 30 días contra una captura acumulada en Solana con una afirmación de participación, así que ninguna vuelve redundante a la otra; quedarte con las dos atribuidas es el arreglo."  # @src=52233c798cdc
              b:
                # | Add them, flagged as approximate: 75.41M plus 37M is roughly a 112M
                # | transaction headline, and both pages count x402 transactions.
                label: "Súmalas, marcadas como aproximadas: 75.41M más 37M es más o menos un titular de 112M transacciones, y las dos páginas cuentan transacciones de x402."  # @src=a2389111c5a0
                # | Both pages do count x402 transactions, over different windows and
                # | different scopes, and calling the sum approximate does not repair it. A
                # | 30-day rolling total added to a cumulative-on-Solana snapshot invents a
                # | number no source supports, and the hedge only makes the invention sound
                # | measured.
                feedback: "Las dos páginas sí cuentan transacciones de x402, sobre ventanas distintas y alcances distintos, y llamarle aproximada a la suma no la repara. Un total móvil de 30 días sumado a una captura acumulada en Solana inventa un número que ninguna fuente sostiene, y la cobertura solo hace que la invención suene medida."  # @src=90b0404b6814
              d:
                # | Divide one by the other for a Solana share, roughly 49 percent, dated to
                # | both fetches.
                label: "Divide una entre la otra para sacar una participación de Solana, más o menos 49 por ciento, fechada a las dos obtenciones."  # @src=41563fec4544
                # | Two dates on a ratio still leave the windows mismatched, and a derived
                # | share is exactly the arithmetic the rule forbids: a rolling 30-day
                # | denominator under a cumulative numerator yields a percentage neither
                # | page measured. Note that solana.com already publishes a share figure,
                # | and it is not this one.
                feedback: "Dos fechas sobre un cociente siguen dejando las ventanas desalineadas, y una participación derivada es exactamente la aritmética que la regla prohíbe: un denominador móvil de 30 días debajo de un numerador acumulado da un porcentaje que ninguna de las dos páginas midió. Fíjate en que solana.com ya publica una cifra de participación, y no es esta."  # @src=f11389d6cb64
  m07-l2:
    # | Paywall the pressing-price API, then build the bot that pays it
    title: "Ponle un paywall a la API de precios de prensado y después construye el bot que la paga"  # @src=48b75c6342e8
    blocks:
      decide-payment:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check in a fixed order so the decline reason is deterministic: scheme,
          # | network, asset, memo size, fee payer, then the USD cap.
          0: "Comprueba en un orden fijo para que la razón del rechazo sea determinista: esquema, red, activo, tamaño del memo, fee payer, y después el tope en USD."  # @src=db784f4077a1
          # | Known Solana CAIP-2 ids: mainnet solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp,
          # | devnet solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1.
          1: "Ids CAIP-2 de Solana conocidos: mainnet solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp, devnet solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1."  # @src=adbace0e11cb
          # | The USD cap comparison must use the decimals recorded for THIS asset in the
          # | allowlist, not USDC's familiar 6 - a bridged dollar with a different decimal
          # | count changes what the same atomic-unit amount is worth.
          2: "La comparación del tope en USD tiene que usar los decimales registrados para ESTE activo en la allowlist, no los 6 familiares de USDC - un dólar bridgeado con una cantidad de decimales distinta cambia lo que vale el mismo monto en unidades atómicas."  # @src=d1a18cd48f2b
        tests:                      # keyed by test case id
          t1-pays-within-cap:
            # | A 0.5 USDC call under the $1 cap is paid; fee payer and memo pass through.
            description: "Una llamada de 0.5 USDC por debajo del tope de $1 se paga; el fee payer y el memo pasan."  # @src=1fe3d2ffe78a
          t2-over-cap-declined:
            # | A 1.5 USDC call exceeds the $1 cap and is declined.
            description: "Una llamada de 1.5 USDC excede el tope de $1 y se rechaza."  # @src=a92563ad9eaf
          t3-asset-not-allowed:
            # | An asset outside the pegged allowlist is declined.
            description: "Un activo fuera de la allowlist de anclados al dólar se rechaza."  # @src=8dea19c68c11
          t4-wrong-scheme:
            # | A non-exact scheme is not auto-paid.
            description: "Un esquema que no es exact no se paga automáticamente."  # @src=b4dfbd951e94
          t5-memo-too-large:
            # | An invoice-id memo over 256 bytes is rejected before payment.
            description: "Un memo de id de factura de más de 256 bytes se rechaza antes del pago."  # @src=3ee43a53f855
          t6-devnet-accepted:
            # | The devnet CAIP-2 id is a known network and pays under cap.
            description: "El id CAIP-2 de devnet es una red conocida y paga por debajo del tope."  # @src=4dc0741e0ff9
          t7-unknown-chain-declined:
            # | A non-Solana CAIP-2 id (Ethereum mainnet) is not a network this agent pays
            # | on.
            description: "Un id CAIP-2 que no es de Solana (mainnet de Ethereum) no es una red en la que este agente pague."  # @src=d64f96739026
          t8-solana-prefixed-lookalike-declined:
            # | A solana:-prefixed id one character off mainnet's genesis hash is still an
            # | unknown network: the check is membership in the two known ids, not a prefix.
            description: "Un id con prefijo solana: que está a un carácter del hash génesis de mainnet sigue siendo una red desconocida: la comprobación es la pertenencia a los dos ids conocidos, no un prefijo."  # @src=a74c611b6eda
          t9-missing-fee-payer-declined:
            # | Terms that name no fee payer are unpayable: the agent holds no SOL and
            # | cannot sponsor itself.
            description: "Unos términos que no nombran ningún fee payer son impagables: el agente no tiene SOL y no puede patrocinarse a sí mismo."  # @src=80c935a78ff1
          t10-memo-multibyte-over-limit:
            # | A 200-character invoice id of two-byte accented characters is 400 UTF-8
            # | BYTES: over the 256-byte ceiling even though its string length is 200.
            description: "Un id de factura de 200 caracteres hecho de caracteres acentuados de dos bytes son 400 BYTES UTF-8: por encima del techo de 256 bytes aunque el largo de su string sea 200."  # @src=4a2cd30326c6
          t11-decimals-come-from-the-allowlist:
            # | A pegged dollar whose mint carries 8 decimals: 50,000,000 atomic units is
            # | $0.50 and pays. Assuming 6 decimals would read it as $50 and decline.
            description: "Un dólar anclado cuyo mint lleva 8 decimales: 50,000,000 unidades atómicas son $0.50 y paga. Asumir 6 decimales lo leería como $50 y lo rechazaría."  # @src=eb47812704c4
          t12-decimals-still-enforce-the-cap:
            # | The same 8-decimal asset at 250,000,000 atomic units is $2.50 and breaks the
            # | $1 cap: the allowlist supplies the decimals, the cap is still enforced.
            description: "El mismo activo de 8 decimales a 250,000,000 unidades atómicas son $2.50 y rompe el tope de $1: la allowlist aporta los decimales, el tope se sigue haciendo cumplir."  # @src=36ba6c41af01
      check-build:                      # quiz
        questions:
          q5-lighthouse:
            # | Your server-side check rebuilds the expected payment transaction and
            # | compares it byte-for-byte to what the agent submitted from a mainstream
            # | wallet. Legitimate payments start failing the comparison. What is going on,
            # | and what does the SVM verifier do about it?
            prompt: "Tu comprobación del lado del servidor reconstruye la transacción de pago esperada y la compara byte por byte con lo que mandó el agente desde una billetera mayoritaria. Los pagos legítimos empiezan a fallar la comparación. ¿Qué está pasando, y qué hace el verificador de SVM al respecto?"  # @src=531068fad22b
            # | Phantom and Solflare inject Lighthouse guard instructions into transactions
            # | to protect users, so a naive rebuild-and-compare check fails on legitimate
            # | payments. x402's SVM verifier hardcodes an allowlist for the Lighthouse
            # | guard program and verifies the transaction that was actually signed. The
            # | lesson: verify signed reality, not your idealized rebuild.
            explanation: "Phantom y Solflare inyectan instrucciones de guarda de Lighthouse en las transacciones para proteger a los usuarios, así que una comprobación ingenua de reconstruir-y-comparar falla en pagos legítimos. El verificador de SVM de x402 hardcodea una allowlist para el programa de guarda de Lighthouse y verifica la transacción que de verdad se firmó. La lección: verifica la realidad firmada, no tu reconstrucción idealizada."  # @src=776009c41688
            options:                 # source order — keep it
              b:
                # | Phantom and Solflare inject Lighthouse guard instructions, so x402's SVM
                # | verifier allowlists that program and verifies what was actually signed.
                label: "Phantom y Solflare inyectan instrucciones de guarda de Lighthouse, así que el verificador de SVM de x402 pone ese programa en su allowlist y verifica lo que de verdad se firmó."  # @src=8cd48f2e55fe
                # | Wallets legitimately add instructions, and byte-equality against your
                # | rebuild is the wrong invariant; what was actually signed is the thing to
                # | check, and an allowlist stays narrow by design.
                feedback: "Las billeteras agregan instrucciones legítimamente, y la igualdad byte a byte contra tu reconstrucción es el invariante equivocado; lo que de verdad se firmó es lo que hay que comprobar, y una allowlist se mantiene angosta por diseño."  # @src=a6121e98e77f
              d:
                # | Wallets add guard instructions, so the verifier stops reading the
                # | instruction list at all and checks only the transfer amount, the mint,
                # | and the memo.
                label: "Las billeteras agregan instrucciones de guarda, así que el verificador deja de leer la lista de instrucciones por completo y comprueba solo el monto de la transferencia, el mint y el memo."  # @src=f1db682d7903
                # | Property-based verification is not the same as looking away. The
                # | verifier walks the instructions that were actually signed, checks the
                # | transfer, the memo and the fee-payer isolation, and tolerates additions
                # | from one allowlisted guard program while rejecting every other one. An
                # | allowlist of one is still an allowlist.
                feedback: "La verificación basada en propiedades no es lo mismo que mirar para otro lado. El verificador recorre las instrucciones que de verdad se firmaron, comprueba la transferencia, el memo y el aislamiento del fee payer, y tolera adiciones de un único programa de guarda de la allowlist mientras rechaza todos los demás. Una allowlist de uno sigue siendo una allowlist."  # @src=9af0a9f00a12
              a:
                # | The agent is malicious: it appended its own instructions to the quote
                # | you issued, so treat any deviation from your server-side rebuild as
                # | tampering and reject the payment.
                label: "El agente es malicioso: le agregó sus propias instrucciones a la cotización que emitiste, así que trata cualquier desviación de tu reconstrucción del lado del servidor como manipulación y rechaza el pago."  # @src=1481b552df2e
                # | The mismatch is caused by the wallet, not the agent. Rejecting all of
                # | them blocks legitimate Phantom/Solflare users, which is why the verifier
                # | allowlists the guard program instead of banning it.
                feedback: "El desajuste lo causa la billetera, no el agente. Rechazarlos a todos bloquea a usuarios legítimos de Phantom/Solflare, y por eso el verificador pone el programa de guarda en su allowlist en vez de prohibirlo."  # @src=e40da552c870
              c:
                # | The blockhash expired mid-flight, so the wallet rebuilt the transaction
                # | on a fresh one; widen the settlement-cache eviction window past the
                # | package's quoted 60-to-90-second lifetime range.
                label: "El blockhash venció en pleno vuelo, así que la billetera reconstruyó la transacción sobre uno fresco; ensancha la ventana de desalojo de la caché de liquidación más allá del rango de tiempo de vida de 60 a 90 segundos que cita el paquete."  # @src=335171f06626
                # | Blockhash expiry makes a transaction fail to land; it does not add
                # | instructions to an otherwise-valid payment. The settlement cache is a
                # | replay guard, not a verification path. The cause here is wallet-injected
                # | guard instructions.
                feedback: "El vencimiento del blockhash hace que una transacción no logre aterrizar; no le agrega instrucciones a un pago que por lo demás es válido. La caché de liquidación es una guarda de repetición, no un camino de verificación. La causa aquí son instrucciones de guarda inyectadas por la billetera."  # @src=e87ef2fd2953
          q6-memo-reconcile:
            # | Your paying agent settles three API calls, and all three land in the
            # | backoffice ledger under one order, so the fulfillment queue shows a single
            # | sale. The invoice string you stamped into every challenge was the same one.
            # | What repairs this?
            prompt: "Tu agente que paga liquida tres llamadas a la API, y las tres aterrizan en el libro mayor de backoffice bajo un solo pedido, así que la fila de despacho muestra una sola venta. El string de factura que estampaste en cada desafío era el mismo. ¿Qué repara esto?"  # @src=d86d92c124df
            # | x402's extra.memo invoice id is the same reconciliation idea as a Solana Pay
            # | reference key: it must be unique per call so each payment maps to its own
            # | order in the shared backoffice ledger. Reusing one memo collapses distinct
            # | sales; the fix is a unique memo (within the 256-byte limit) per call.
            explanation: "El id de factura extra.memo de x402 es la misma idea de conciliación que una reference key de Solana Pay: tiene que ser único por llamada para que cada pago mapee a su propio pedido en el libro mayor de backoffice compartido. Reusar un memo colapsa ventas distintas; el arreglo es un memo único (dentro del límite de 256 bytes) por llamada."  # @src=086957bb0e10
            options:                 # source order — keep it
              d:
                # | Mint a fresh random invoice id on the server for each 402 challenge, so
                # | uniqueness does not depend on the caller.
                label: "Acuñar un id de factura aleatorio y fresco en el servidor para cada desafío 402, para que la unicidad no dependa de quien llama."  # @src=473cbb8f1a21
                # | Unique, and unusable. The challenge and the paid retry are two requests,
                # | and on the retry the middleware rebuilds the terms and compares them; a
                # | server-minted random id differs the second time, the comparison misses,
                # | and the agent loops on 402s forever. The one thing both requests share
                # | byte for byte is the URL, which is why the caller mints the id and
                # | carries it there.
                feedback: "Único, e inutilizable. El desafío y el reintento pagado son dos peticiones, y en el reintento el middleware reconstruye los términos y los compara; un id aleatorio acuñado en el servidor difiere la segunda vez, la comparación falla, y el agente entra en loop de 402s para siempre. La única cosa que las dos peticiones comparten byte por byte es la URL, y por eso quien llama acuña el id y lo lleva ahí."  # @src=175506037bab
              b:
                # | Give each call a unique extra.memo invoice id (at most 256 bytes) so
                # | each payment reconciles to its own order in the same ledger.
                label: "Darle a cada llamada un id de factura extra.memo único (de a lo sumo 256 bytes) para que cada pago se concilie con su propio pedido en el mismo libro mayor."  # @src=f034ed82199a
                # | A reconciliation key must be one-to-one with orders, since reuse
                # | collapses rows; unique is not private, though, and the memo is
                # | world-readable.
                feedback: "Una llave de conciliación tiene que ser uno a uno con los pedidos, porque reusarla colapsa filas; único no es privado, eso sí, y el memo lo puede leer todo el mundo."  # @src=48f12468f6c8
              a:
                # | Stop using memos for machine payments; reconcile x402 sales only by
                # | wallet address instead.
                label: "Dejar de usar memos para los pagos entre máquinas; en su lugar conciliar las ventas de x402 solo por dirección de billetera."  # @src=cf13aab99d42
                # | Wallet address is not an invoice id; two calls from the same agent share
                # | it. The memo IS the reconciliation key, exactly as Solana Pay reference
                # | keys are; it just has to be unique per call.
                feedback: "Una dirección de billetera no es un id de factura; dos llamadas del mismo agente la comparten. El memo ES la llave de conciliación, exactamente como lo son las reference keys de Solana Pay; solo tiene que ser único por llamada."  # @src=2c5cf4794442
              c:
                # | Widen the settlement-cache window so all three settlements are treated
                # | as one payment and dedup down to a single order id in the ledger.
                label: "Ensanchar la ventana de la caché de liquidación para que las tres liquidaciones se traten como un solo pago y se deduplicen hasta un único id de pedido en el libro mayor."  # @src=a37b0e753fee
                # | The settlement-cache is a replay guard against duplicate SETTLEMENT of
                # | one payment, not a reconciliation key. Collapsing three distinct sales
                # | into one is the bug, not the fix.
                feedback: "La caché de liquidación es una guarda de repetición contra la LIQUIDACIÓN duplicada de un solo pago, no una llave de conciliación. Colapsar tres ventas distintas en una es el bug, no el arreglo."  # @src=773760e81316
      check-guard:                      # quiz
        questions:
          q7-spendcontrols:
            # | You ship the paying agent with its client defaults untouched and point it at
            # | Wavelength's rush quote, which costs $1.50 in USDC. The agent silently pays
            # | nothing and your fulfillment queue stays empty. Why?
            prompt: "Entregas el agente que paga con los valores por defecto de su cliente sin tocar y lo apuntas a la cotización rush de Wavelength, que cuesta $1.50 en USDC. El agente no paga nada en silencio y tu fila de despacho se queda vacía. ¿Por qué?"  # @src=078d288487e3
            # | The @x402/core client spendControls default to recognized pegged assets with
            # | a $1 USD cap per payment unless overridden. A $1.50 call exceeds that cap,
            # | so the pre-flight guard declines it before signing, which reads as a silent
            # | no-op unless you log the reason. Raise the cap deliberately or price the
            # | call under it.
            explanation: "Los spendControls del cliente de @x402/core vienen por defecto con activos anclados al dólar reconocidos y un tope de $1 USD por pago, a menos que se sobrescriban. Una llamada de $1.50 excede ese tope, así que la guarda pre-vuelo la rechaza antes de firmar, lo que se lee como un no-op silencioso a menos que loguees la razón. Sube el tope deliberadamente o ponle a la llamada un precio por debajo de él."  # @src=00d8516e5ef0
            options:                 # source order — keep it
              d:
                # | The agent's wallet holds no SOL for the network fee, so signing fails
                # | and the loop gives up quietly before it ever builds the payment header.
                label: "La billetera del agente no tiene SOL para la comisión de red, así que la firma falla y el loop se rinde calladito antes de siquiera construir el header de pago."  # @src=8d6f1af16aa4
                # | This agent is designed never to hold SOL: the facilitator named in
                # | extra.feePayer sponsors the fee, which is why the wallet carries devnet
                # | USDC and nothing else. A gasless buyer is the whole economic point of
                # | exact-SVM, so a missing SOL balance is not what stopped this call.
                feedback: "Este agente está diseñado para no tener SOL nunca: el facilitador nombrado en extra.feePayer patrocina la comisión, y por eso la billetera lleva USDC de devnet y nada más. Un comprador gasless es el punto económico entero de exact-SVM, así que un balance de SOL faltante no es lo que detuvo esta llamada."  # @src=cb85e7ad52ae
              a:
                # | The default spendControls cap is $1 per payment, so the agent declines a
                # | $1.50 call; raise the cap or price the call lower.
                label: "El tope por defecto de spendControls es $1 por pago, así que el agente rechaza una llamada de $1.50; sube el tope o ponle a la llamada un precio más bajo."  # @src=d0f5d0ae207b
                # | A client-side pre-flight guard refuses before signing; nothing reaches
                # | the network and your server sees no error, and lifting the cap removes
                # | the protection an unlogged decline hid.
                feedback: "Una guarda pre-vuelo del lado del cliente se niega antes de firmar; nada llega a la red y tu servidor no ve ningún error, y levantar el tope saca la protección que escondía un rechazo sin loguear."  # @src=32c07717229d
              c:
                # | USDC is not a recognized pegged asset by default, so the agent refuses
                # | regardless of amount.
                label: "USDC no es un activo anclado al dólar reconocido por defecto, así que el agente se niega sin importar el monto."  # @src=3790c4ef35ca
                # | USDC is a recognized pegged asset; that is not the blocker. The blocker
                # | is the $1 per-payment cap the default spendControls enforce.
                feedback: "USDC sí es un activo anclado al dólar reconocido; ese no es el bloqueo. El bloqueo es el tope de $1 por pago que hacen cumplir los spendControls por defecto."  # @src=c215747ab608
              b:
                # | The x402.org devnet facilitator refuses to settle any payment above $1,
                # | so it rejects the call and the agent never receives a settlement
                # | receipt.
                label: "El facilitador de devnet de x402.org se niega a liquidar cualquier pago por encima de $1, así que rechaza la llamada y el agente nunca recibe un comprobante de liquidación."  # @src=2c2d72c07d1d
                # | The cap lives on the CLIENT (the agent's spendControls), not the
                # | facilitator. The facilitator would happily settle a $1.50 call; the
                # | agent declines it before signing.
                feedback: "El tope vive en el CLIENTE (los spendControls del agente), no en el facilitador. El facilitador liquidaría tan feliz una llamada de $1.50; el agente la rechaza antes de firmar."  # @src=0d1b8c05acab
          q8-facilitator-env:
            # | Your x402 labs pass against the x402.org facilitator on devnet. A teammate
            # | wants to point the same config at it for the mainnet launch. What is the
            # | right call?
            prompt: "Tus labs de x402 pasan contra el facilitador de x402.org en devnet. Un compañero de equipo quiere apuntarle la misma config para el lanzamiento en mainnet. ¿Cuál es la decisión correcta?"  # @src=7e5ea781df7f
            # | The x402.org facilitator is devnet/testnet only, a deliberate reference
            # | deployment. A mainnet launch must swap the facilitator URL to a production
            # | one (Corbits, Dexter, PayAI, Solvador, or Coinbase CDP), which is a config
            # | change plus the trust and KYT considerations that come with picking a
            # | facilitator.
            explanation: "El facilitador de x402.org es solo devnet/testnet, un despliegue de referencia deliberado. Un lanzamiento en mainnet tiene que cambiar la URL del facilitador a una de producción (Corbits, Dexter, PayAI, Solvador o el CDP de Coinbase), que es un cambio de config más las consideraciones de confianza y KYT que vienen con elegir un facilitador."  # @src=33dd61aaa452
            options:                 # source order — keep it
              b:
                # | Ship it, but swap the CAIP-2 network id to mainnet and add the
                # | Lighthouse allowlist first; those two are the only things that change
                # | when you leave devnet.
                label: "Entrégalo, pero primero cambia el id de red CAIP-2 a mainnet y agrega la allowlist de Lighthouse; esas dos son las únicas cosas que cambian cuando te vas de devnet."  # @src=3936a0f26ffc
                # | Swapping the network id is real work, but the allowlist already ships
                # | inside the SVM verifier. Neither change matters here, because the
                # | x402.org facilitator does not serve mainnet at all.
                feedback: "Cambiar el id de red es trabajo de verdad, pero la allowlist ya viene dentro del verificador de SVM. Ninguno de los dos cambios importa aquí, porque el facilitador de x402.org no sirve mainnet para nada."  # @src=51fac2dedcd9
              d:
                # | No; on mainnet the resource server signs and submits for itself, so you
                # | drop the facilitator URL and keep the rest of the config as it is.
                label: "No; en mainnet el servidor de recursos firma y envía por su cuenta, así que descartas la URL del facilitador y dejas el resto de la config como está."  # @src=0570d119325f
                # | Right verdict on the URL, wrong replacement. Your merchant server never
                # | touches the chain and never holds a fee-payer key: it learns the sponsor
                # | address from a facilitator at boot, which is what initialize() is for.
                # | Removing the facilitator removes the account that pays the fee.
                feedback: "Veredicto correcto sobre la URL, reemplazo equivocado. Tu servidor de comercio nunca toca la blockchain y nunca tiene una llave de fee payer: aprende la dirección del patrocinador de un facilitador al arrancar, que es para lo que está initialize(). Sacar el facilitador saca la cuenta que paga la comisión."  # @src=f3ef8107bc87
              a:
                # | Ship it; the x402.org facilitator is the reference facilitator and works
                # | identically on mainnet.
                label: "Entrégalo; el facilitador de x402.org es el facilitador de referencia y funciona idéntico en mainnet."  # @src=9f74fee74965
                # | The x402.org facilitator is explicitly devnet/testnet only. Pointing
                # | production at it will not settle real payments.
                feedback: "El facilitador de x402.org es explícitamente solo devnet/testnet. Apuntarle producción no va a liquidar pagos reales."  # @src=7aaad1117064
              c:
                # | No; that facilitator is devnet/testnet only, so mainnet needs a
                # | production one such as Corbits, PayAI, or CDP.
                label: "No; ese facilitador es solo devnet/testnet, así que mainnet necesita uno de producción como Corbits, PayAI o CDP."  # @src=9f2bfeacff8d
                # | A reference deployment is scoped to the networks it serves, which makes
                # | the URL part of the network binding. Swapping it is the easy half, with
                # | trust, KYT, and fee terms riding along.
                feedback: "Un despliegue de referencia está acotado a las redes que sirve, lo que hace que la URL sea parte del binding de red. Cambiarla es la mitad fácil, con la confianza, el KYT y los términos de comisiones viajando encima."  # @src=d331977b09c0
  m07-l3:
    # | MPP, AP2, ACP: the standards war (and gating the API with pay)
    title: "MPP, AP2, ACP: la guerra de estándares (y ponerle gate a la API con pay)"  # @src=d0130bdf6800
    blocks:
      check-standards:                      # quiz
        questions:
          q9-mor:
            # | A merchant asks which agentic-payment standard keeps them as
            # | merchant-of-record, the same role they hold with a card processor today.
            # | Which answer is accurate?
            prompt: "Un comercio pregunta qué estándar de pagos agénticos lo mantiene como merchant-of-record, el mismo rol que tiene hoy con un procesador de tarjetas. ¿Qué respuesta es correcta?"  # @src=ff9f1000a11b
            # | ACP, the Stripe-and-OpenAI Agentic Commerce Protocol, is built around the
            # | merchant staying merchant-of-record with a Shared Payment Token. That
            # | framing, familiar from card rails, is a real differentiator when you place
            # | the four standards, and it is exactly the lens the course uses at every
            # | payment seam.
            explanation: "ACP, el Agentic Commerce Protocol de Stripe-y-OpenAI, está construido alrededor de que el comercio siga siendo merchant-of-record con un Shared Payment Token. Ese planteo, familiar por los rieles de tarjeta, es un diferenciador real cuando ubicas los cuatro estándares, y es exactamente el lente que el curso usa en cada costura de pago."  # @src=7b9d5ea43055
            options:                 # source order — keep it
              d:
                # | x402, since the facilitator that settles each call takes the
                # | merchant-of-record seat.
                label: "x402, dado que el facilitador que liquida cada llamada se queda con el asiento de merchant-of-record."  # @src=ca44bf135d13
                # | A facilitator is a settlement intermediary, not a seller. Under x402 you
                # | are selling directly to the agent and the facilitator's power is over
                # | whether a transaction gets submitted, which is a censorship surface
                # | rather than a change of counterparty. Confusing the two is the same blur
                # | the fiat seam map refused.
                feedback: "Un facilitador es un intermediario de liquidación, no un vendedor. Bajo x402 le estás vendiendo directamente al agente y el poder del facilitador es sobre si una transacción se envía o no, que es una superficie de censura y no un cambio de contraparte. Confundir los dos es la misma confusión que el mapa de costuras de fiat rechazó."  # @src=270c99499e95
              a:
                # | MPP, because a Solana-native draft always leaves the merchant as
                # | merchant-of-record by design.
                label: "MPP, porque un borrador nativo de Solana siempre deja al comercio como merchant-of-record por diseño."  # @src=9faab2ef7827
                # | MPP is a payment-authentication draft; 'merchant-of-record' is not its
                # | framing, and being Solana-native says nothing about who bears that role.
                # | The standard that explicitly keeps the merchant as merchant-of-record is
                # | ACP.
                feedback: "MPP es un borrador de autenticación de pagos; 'merchant-of-record' no es su planteo, y ser nativo de Solana no dice nada sobre quién carga con ese rol. El estándar que explícitamente mantiene al comercio como merchant-of-record es ACP."  # @src=3b9278646672
              b:
                # | AP2, because Google and the FIDO Alliance take on merchant-of-record for
                # | every AP2 payment.
                label: "AP2, porque Google y la FIDO Alliance asumen el merchant-of-record de cada pago con AP2."  # @src=4ee0a8e47d6e
                # | AP2 is cards-first with verifiable credentials and mandates; it does not
                # | make Google the merchant-of-record. ACP is the one that explicitly
                # | leaves the merchant as merchant-of-record.
                feedback: "AP2 va primero por tarjetas, con credenciales verificables y mandatos; no convierte a Google en el merchant-of-record. ACP es el que explícitamente deja al comercio como merchant-of-record."  # @src=f51bf94a14d8
              c:
                # | ACP (Stripe and OpenAI), which is explicitly designed so the merchant
                # | stays merchant-of-record.
                label: "ACP (Stripe y OpenAI), que está diseñado explícitamente para que el comercio siga siendo merchant-of-record."  # @src=08e38fe47cc1
                # | Its shared-token design keeps the charge on the merchant's own
                # | processor: that role is a liability as much as a status, since disputes
                # | and tax come with it.
                feedback: "Su diseño de token compartido mantiene el cargo en el procesador propio del comercio: ese rol es tanto una responsabilidad como un estatus, dado que las disputas y los impuestos vienen con él."  # @src=9b5b1f75e860
          q10-mpp-dated:
            # | You want to document Wavelength's MPP support. What is the honest way to
            # | state the standard's status, given draft-solana-charge-00?
            prompt: "Quieres documentar el soporte de MPP de Wavelength. ¿Cuál es la manera honesta de declarar el estado del estándar, dado draft-solana-charge-00?"  # @src=88cc7aac5b05
            # | MPP is two layers. draft-httpauth-payment-00, the 'Payment' HTTP
            # | authentication scheme from Tempo Labs and Stripe, is the document with an
            # | IETF registration and a genuine expiry. draft-solana-charge-00 is a
            # | payment-method spec registered under it, authored at the Solana Foundation,
            # | sitting in specs/methods/ beside tempo/charge and stripe/charge, and never
            # | submitted to the datatracker at all. Honest documentation names both layers
            # | and dates the Solana half from its commit log, never from the expiry its
            # | rendered page prints.
            explanation: "MPP son dos capas. draft-httpauth-payment-00, el esquema de autenticación HTTP 'Payment' de Tempo Labs y Stripe, es el documento con un registro en la IETF y un vencimiento genuino. draft-solana-charge-00 es una spec de método de pago registrada bajo él, escrita en la Solana Foundation, que vive en specs/methods/ al lado de tempo/charge y stripe/charge, y que nunca se presentó al datatracker para nada. La documentación honesta nombra las dos capas y le pone fecha a la mitad de Solana desde su log de commits, nunca desde el vencimiento que imprime su página renderizada."  # @src=6d84a6c03ffa
            options:                 # source order — keep it
              a:
                # | Two documents, two standings: draft-solana-charge-00 is a method spec
                # | registered under draft-httpauth-payment-00, the IETF draft expiring
                # | 2026-12-21.
                label: "Dos documentos, dos posiciones: draft-solana-charge-00 es una spec de método registrada bajo draft-httpauth-payment-00, el borrador de la IETF que vence el 2026-12-21."  # @src=834f9db012d6
                # | The registration and the real expiry belong to the base scheme; the
                # | method spec only defines solana/charge underneath it, and documenting
                # | one layer's status as the other's promises stability neither offers.
                feedback: "El registro y el vencimiento real le pertenecen al esquema base; la spec de método solo define solana/charge por debajo de él, y documentar el estado de una capa como si fuera el de la otra promete una estabilidad que ninguna de las dos ofrece."  # @src=9bc8dc7a107e
              d:
                # | Two documents, with the datatracker registration on
                # | draft-solana-charge-00, and the base scheme dated from its commit
                # | history.
                label: "Dos documentos, con el registro del datatracker sobre draft-solana-charge-00, y el esquema base fechado desde su historial de commits."  # @src=49fb5f58f951
                # | The layers are the right frame and they are the wrong way up. Searching
                # | the datatracker for draft-solana- returns zero documents: the base
                # | scheme is the one on the IETF's clock, and the Solana method spec is the
                # | one you date from its git history.
                feedback: "Las capas son el marco correcto y están al revés. Buscar draft-solana- en el datatracker devuelve cero documentos: el esquema base es el que está en el reloj de la IETF, y la spec de método de Solana es la que fechas desde su historial de git."  # @src=e8b13fa6d3e6
              b:
                # | One dated Internet-Draft snapshot, quoting the publication and expiry
                # | dates printed at the top of draft-solana-charge-00's rendered spec page.
                label: "Una sola captura fechada de Internet-Draft, citando las fechas de publicación y de vencimiento impresas arriba en la página de spec renderizada de draft-solana-charge-00."  # @src=9656c5fcb84a
                # | Those dates are generated by the spec site's build rather than
                # | registered anywhere, and they move on every rebuild; the datatracker
                # | returns zero documents for draft-solana-, and commits are what you
                # | quote.
                feedback: "Esas fechas las genera el build del sitio de specs en vez de estar registradas en alguna parte, y se mueven en cada reconstrucción; el datatracker devuelve cero documentos para draft-solana-, y los commits son lo que citas."  # @src=78ae15b44799
              c:
                # | A ratified Solana Foundation standard, since the Foundation wrote it and
                # | ships client tooling against it, so apps and docs can depend on it
                # | long-term.
                label: "Un estándar ratificado de la Solana Foundation, dado que la Foundation lo escribió y entrega tooling de cliente contra él, así que las apps y los docs pueden depender de él a largo plazo."  # @src=cbc0b0cdcc3f
                # | Nothing here is ratified; the base scheme is an Internet-Draft with an
                # | expiry and the method spec has no standards-body status at all.
                # | Foundation authorship says who maintains one method.
                feedback: "Aquí nada está ratificado; el esquema base es un Internet-Draft con vencimiento y la spec de método no tiene ningún estatus de organismo de estándares. La autoría de la Foundation dice quién mantiene un método."  # @src=f97f873acb7e
          q11-pay-gate:
            # | You ran `pay gate api paywall.yml` on the pressing-price API, then `pay
            # | curl` completed a paid call. What did gating with the CLI actually buy you
            # | versus hand-writing an x402 middleware and an MPP handler yourself?
            prompt: "Corriste `pay gate api paywall.yml` sobre la API de precios de prensado, y después `pay curl` completó una llamada pagada. ¿Qué te compró de verdad ponerle gate con la CLI frente a escribir a mano un middleware de x402 y un handler de MPP tú mismo?"  # @src=b935ae7770ba
            # | `pay gate api paywall.yml` lets one API answer both x402 and MPP, and `pay
            # | curl` auto-negotiates the 402 on whichever protocol the caller speaks. That
            # | is the hands-on payoff: instead of betting on a single standard in a
            # | fast-moving field, you gate once and let the CLI negotiate, accepting a
            # | churn-prone CLI dependency as the cost.
            explanation: "`pay gate api paywall.yml` deja que una sola API responda tanto x402 como MPP, y `pay curl` auto-negocia el 402 en el protocolo que hable el llamador. Ese es el pago práctico: en vez de apostarle a un solo estándar en un campo que se mueve rápido, pones el gate una vez y dejas que la CLI negocie, aceptando como costo una dependencia de CLI propensa a cambiar sin parar."  # @src=600a85a18ccb
            options:                 # source order — keep it
              d:
                # | One gate answers both protocols, and its pooled accounting writes each
                # | settled call into the backoffice ledger under its own invoice id.
                label: "Un solo gate responde los dos protocolos, y su contabilidad pooled escribe cada llamada liquidada en el libro mayor del back office bajo su propio id de factura."  # @src=ed4b6ed62388
                # | The first half is what you bought; the second half is the seam the
                # | lesson leaves open on purpose. There is no memo field in paywall.yml and
                # | the gate's pooled accounting hands back no per-call id, so gate-routed
                # | sales appear on the explorer and in your transcript, never in
                # | orders.jsonl. Middleware-routed sales still reconcile, because you wired
                # | that hook yourself.
                feedback: "La primera mitad es lo que compraste; la segunda mitad es la costura que la lección deja abierta a propósito. No hay ningún campo de memo en paywall.yml y la contabilidad pooled del gate no devuelve ningún id por llamada, así que las ventas ruteadas por el gate aparecen en el explorador y en tu transcripción, nunca en orders.jsonl. Las ventas ruteadas por el middleware sí se concilian, porque cableaste ese hook tú mismo."  # @src=9d3cc11cd96a
              b:
                # | One gate makes the same API answer both x402 and MPP, and `pay curl`
                # | negotiates whichever the caller speaks.
                label: "Un solo gate hace que la misma API responda tanto x402 como MPP, y `pay curl` negocia el que hable el llamador."  # @src=d3c4f142b85e
                # | Emitting both challenges moves the protocol choice to the caller, which
                # | is the optionality you buy; the price is a churn-prone CLI sitting in
                # | the request path.
                feedback: "Emitir los dos desafíos mueve la elección de protocolo hacia el llamador, que es la opcionalidad que compras; el precio es una CLI propensa a cambiar sin parar sentada en el camino de la petición."  # @src=68f1ff8375c0
              a:
                # | Nothing structural; `pay gate` only emits the x402 402 challenge, so an
                # | MPP caller still needs the WWW-Authenticate: Payment handler you write
                # | yourself.
                label: "Nada estructural; `pay gate` solo emite el desafío 402 de x402, así que un llamador de MPP todavía necesita el handler WWW-Authenticate: Payment que escribes tú mismo."  # @src=75e42552f664
                # | One gate makes the SAME API answer both, WWW-Authenticate: Payment
                # | challenge included. If it only served x402, gating would not be worth
                # | the CLI dependency.
                feedback: "Un solo gate hace que la MISMA API responda los dos, desafío WWW-Authenticate: Payment incluido. Si solo sirviera x402, ponerle gate no valdría la dependencia de la CLI."  # @src=9a6a9ae4beb9
              c:
                # | It moves settlement fully on-chain, so neither the x402 facilitator nor
                # | MPP's co-signing server sits in the payment path any more.
                label: "Mueve la liquidación completamente on-chain, así que ni el facilitador de x402 ni el servidor co-firmante de MPP siguen sentados en el camino del pago."  # @src=a156a744d1a3
                # | Gating does not remove the facilitator/co-signer role; x402 still
                # | settles through a facilitator and MPP's pull mode still has the server
                # | co-sign. What gating buys is one API serving both protocols, not the
                # | elimination of that role.
                feedback: "Ponerle gate no elimina el rol de facilitador/co-firmante; x402 todavía liquida a través de un facilitador y el modo pull de MPP todavía hace que el servidor co-firme. Lo que compra ponerle gate es una sola API sirviendo los dos protocolos, no la eliminación de ese rol."  # @src=d78fe0d42409
          q12-bet:
            # | An integrator asks for your honest 2026 recommendation on which single
            # | agentic-payment standard to build on exclusively. What is the defensible
            # | answer this lesson lands on?
            prompt: "Un integrador te pide tu recomendación honesta de 2026 sobre qué único estándar de pagos agénticos usar como base en exclusiva. ¿Cuál es la respuesta defendible a la que llega esta lección?"  # @src=e0d160e7ad58
            # | The lesson's honest 2026 position is that the standards war is unsettled:
            # | x402 has traffic but a facilitator trust boundary, MPP is a Solana method
            # | spec riding a base draft that expires, and AP2/ACP are cards-first with
            # | different merchant-of-record models. Gating once and negotiating (the `pay
            # | gate` beat) beats an exclusive early bet, at the cost of a CLI dependency.
            explanation: "La posición honesta de 2026 de la lección es que la guerra de estándares no está resuelta: x402 tiene tráfico pero una frontera de confianza en el facilitador, MPP es una spec de método de Solana que viaja sobre un borrador base que vence, y AP2/ACP van primero por tarjetas con modelos distintos de merchant-of-record. Ponerle gate una vez y negociar (el momento de `pay gate`) le gana a una apuesta exclusiva y temprana, al costo de una dependencia de CLI."  # @src=3d3476f7c326
            options:                 # source order — keep it
              a:
                # | Commit fully to AP2 now; Google plus FIDO backing, and a mandate model
                # | that already covers agent authorization, makes it the safe single bet.
                label: "Comprométete del todo con AP2 ahora; el respaldo de Google más FIDO, y un modelo de mandatos que ya cubre la autorización de agentes, lo vuelve la única apuesta segura."  # @src=fb9047fb9076
                # | No standard is guaranteed to win, and AP2 is cards-first, a poor fit for
                # | Solana-native metered APIs. Picking one exclusively is the premature bet
                # | the lesson argues against.
                feedback: "Ningún estándar tiene garantizado ganar, y AP2 va primero por tarjetas, un mal encaje para APIs nativas de Solana con medición de consumo. Elegir uno en exclusiva es la apuesta prematura contra la que argumenta la lección."  # @src=9fe2ef2204eb
              d:
                # | Do not bet yet and do not gate either: wait until one standard wins,
                # | then integrate that one.
                label: "No apuestes todavía y tampoco pongas el gate: espera hasta que un estándar gane, y después integra ese."  # @src=561e87ccee46
                # | This is the 1949 record buyer's move, and it is the one the story
                # | singles out as the loser: the buyers who waited out the speed war bought
                # | nothing while the turntable makers who shipped multi-speed players sold
                # | through it. Waiting is not neutral here, it is declining every agent
                # | that knocks in the meantime.
                feedback: "Esta es la jugada del comprador de discos de 1949, y es la que la historia señala como la perdedora: los compradores que esperaron a que pasara la guerra de las velocidades no compraron nada mientras los fabricantes de tocadiscos que entregaron reproductores multivelocidad vendieron a través de ella. Esperar no es neutral aquí, es rechazar a cada agente que golpee mientras tanto."  # @src=fcc9d45a86b7
              b:
                # | Commit fully to MPP now; the Solana Foundation authored the draft, and
                # | pull-mode fee sponsorship already covers the Solana-native case end to
                # | end.
                label: "Comprométete del todo con MPP ahora; la Solana Foundation escribió el borrador, y el patrocinio de comisiones del modo pull ya cubre el caso nativo de Solana de punta a punta."  # @src=2544d945c329
                # | Fee sponsorship is not unique to MPP, since x402's facilitator plays the
                # | same role; and the Foundation authored only the method spec, while the
                # | base scheme it plugs into is a Tempo Labs and Stripe draft.
                feedback: "El patrocinio de comisiones no es exclusivo de MPP, dado que el facilitador de x402 juega el mismo rol; y la Foundation escribió solo la spec de método, mientras que el esquema base al que se enchufa es un borrador de Tempo Labs y Stripe."  # @src=83c918ce0dfc
              c:
                # | Do not bet exclusively yet; gate once (with the pay CLI, say) and
                # | negotiate, since the field is unsettled.
                label: "No apuestes en exclusiva todavía; pon el gate una vez (con la CLI de pay, por ejemplo) y negocia, dado que el campo no está resuelto."  # @src=93b607fcd5ef
                # | When adoption is undecided, the cheap move is the reversible one;
                # | deferring isn't free, though, since you now carry two protocols'
                # | semantics.
                feedback: "Cuando la adopción está sin decidir, la jugada barata es la reversible; postergar no es gratis, eso sí, dado que ahora cargas con la semántica de dos protocolos."  # @src=ce9b19178dbc
  m08-l1:
    # | Gasless with Kora: nobody brings SOL to a record fair
    title: "Gasless con Kora: nadie trae SOL a una feria de discos"  # @src=52b7d165124a
    blocks:
      check:                      # quiz
        questions:
          m08-l1-q1:
            # | You sponsored buyers' first purchases with Kora so they needed no SOL. A
            # | week later your sponsor wallet's SOL is lower than your fee math predicted.
            # | What most likely happened?
            prompt: "Patrocinaste las primeras compras de los compradores con Kora para que no necesitaran SOL. Una semana después el SOL de tu billetera de patrocinador está más bajo de lo que predijo tu aritmética de comisiones. ¿Qué es lo más probable que haya pasado?"  # @src=692cf859cc33
            # | Sponsored ATA rent is reclaimable: when Kora funds a new token account for a
            # | buyer, that deposit is real spend, and the buyer can later close the account
            # | and keep the reclaimed rent. Size it from a live
            # | getMinimumBalanceForRentExemption(165) read rather than a remembered
            # | constant, since SIMD-0437 keeps stepping the rate down, and budget
            # | sponsorship as a cost, never as a recoverable loan.
            explanation: "El rent de ATA patrocinado es reclamable: cuando Kora fondea una cuenta de token nueva para un comprador, ese depósito es gasto de verdad, y el comprador puede después cerrar la cuenta y quedarse con el rent reclamado. Dimensiónalo desde una lectura viva de getMinimumBalanceForRentExemption(165) y no desde una constante recordada, ya que SIMD-0437 sigue bajando la tasa por escalones, y presupuesta el patrocinio como un costo, nunca como un préstamo recuperable."  # @src=242b1df5c61e
            options:                 # source order — keep it
              a:
                # | Kora attached a priority fee to every sponsored transaction on top of
                # | the 5000-lamport base, and congestion multiplied that surcharge.
                label: "Kora le agregó una priority fee a cada transacción patrocinada encima de la base de 5000 lamports, y la congestión multiplicó ese recargo."  # @src=c1523b2d99cd
                # | Priority fees are optional and small; they cannot explain a rent-sized
                # | shortfall.
                feedback: "Las priority fees son opcionales y chicas; no pueden explicar un faltante del tamaño del rent."  # @src=9d39cfdde0b1
              d:
                # | You paid ATA-creation rent, but it is a deposit: those lamports come
                # | back to the sponsor when buyers close the accounts.
                label: "Pagaste rent de creación de ATA, pero es un depósito: esos lamports le vuelven al patrocinador cuando los compradores cierran las cuentas."  # @src=37ccf6db7e15
                # | Rent is refundable to whoever closes the account, and that is its owner,
                # | the buyer. No mechanism routes it back to the wallet that funded it,
                # | which is why the lesson insists you book sponsored rent as spend rather
                # | than as a loan you expect to be repaid.
                feedback: "El rent es reembolsable a quien cierra la cuenta, y ese es su dueño, el comprador. Ningún mecanismo lo rutea de vuelta a la billetera que lo fondeó, que es por lo que la lección insiste en que anotes el rent patrocinado en los libros como gasto y no como un préstamo que esperas que te devuelvan."  # @src=c10fa6ba0ad6
              c:
                # | The base fee rose above 5000 lamports during the sale because the
                # | network was congested.
                label: "La comisión base subió por encima de 5000 lamports durante la venta porque la red estaba congestionada."  # @src=0ab67f696f6a
                # | The 5000-lamport base fee is fixed; congestion changes optional priority
                # | fees, not the base fee.
                feedback: "La comisión base de 5000 lamports es fija; la congestión cambia las priority fees opcionales, no la comisión base."  # @src=747932df5606
              b:
                # | You paid the 165-byte ATA-creation rent for buyers who later closed
                # | those accounts and kept the reclaim.
                label: "Pagaste el rent de creación de ATA de 165 bytes para compradores que después cerraron esas cuentas y se quedaron con lo reclamado."  # @src=2782a2458132
                # | A rent deposit returns to whoever closes the account, not whoever funded
                # | it; that makes sponsorship an acquisition cost rather than a recoverable
                # | loan.
                feedback: "Un depósito de rent le vuelve a quien cierra la cuenta, no a quien lo fondeó; eso hace del patrocinio un costo de adquisición y no un préstamo recuperable."  # @src=8733318ec36f
          m08-l1-q2:
            # | A teammate suggests using Octane instead of Kora for fee sponsorship. What's
            # | the accurate state of things as of your build?
            prompt: "Un compañero de equipo sugiere usar Octane en vez de Kora para el patrocinio de comisiones. ¿Cuál es el estado preciso de las cosas al día de tu build?"  # @src=d47fee43019e
            # | Octane's archival (2026-04-20, README pointing at Kora) is the signal that
            # | the paymaster torch passed. Kora's Runtime Verification audit is what makes
            # | it safe to place in the fee-payer seat.
            explanation: "El archivado de Octane (2026-04-20, el README apuntando a Kora) es la señal de que la antorcha del paymaster pasó de manos. La auditoría de Runtime Verification de Kora es lo que hace seguro ponerlo en el asiento de fee payer."  # @src=547e55231c2a
            options:                 # source order — keep it
              c:
                # | Octane was archived 2026-04-20 and points to Kora, which carries a
                # | Runtime Verification audit.
                label: "Octane fue archivado el 2026-04-20 y apunta a Kora, que lleva una auditoría de Runtime Verification."  # @src=746512d7e41c
                # | An archived repo pointing at a successor is the maintainers' own
                # | handoff, which beats guessing from commit dates. An audit covers one
                # | commit, though, and yours may not be that one.
                feedback: "Un repo archivado que apunta a un sucesor es el traspaso que hacen los mantenedores mismos, que le gana a adivinar por fechas de commit. Una auditoría cubre un commit, eso sí, y el tuyo puede no ser ese."  # @src=be7d8f73e9a5
              d:
                # | Octane is archived and Kora succeeded it, and the Runtime Verification
                # | audit covers your config too.
                label: "Octane está archivado y Kora lo sucedió, y la auditoría de Runtime Verification cubre tu config también."  # @src=124c20e74251
                # | The handoff half is right. The audit covers Kora's code, and nothing
                # | audits your kora.toml but you: the allowlists, the caps and the
                # | fee-payer policy are yours, which is why an omitted policy block
                # | defaulting to deny is a security decision rather than a formality.
                feedback: "La mitad del traspaso está bien. La auditoría cubre el código de Kora, y nada audita tu kora.toml más que tú: las allowlists, los topes y la política de fee payer son tuyos, que es por lo que un bloque de política omitido que por defecto niega es una decisión de seguridad y no una formalidad."  # @src=d58bfe022897
              b:
                # | Octane and Kora are both maintained; use Octane for SPL-token fees and
                # | Kora for SOL sponsorship.
                label: "Octane y Kora están mantenidos los dos; usa Octane para las comisiones en tokens SPL y Kora para el patrocinio de SOL."  # @src=3aaf0a03de4b
                # | Octane is archived, not maintained, and Kora covers SPL-token fee
                # | payment itself.
                feedback: "Octane está archivado, no mantenido, y Kora cubre él mismo el pago de comisiones en tokens SPL."  # @src=886df73ebe48
              a:
                # | Octane is the current paymaster; Kora is an experimental fork that has
                # | not been audited yet.
                label: "Octane es el paymaster actual; Kora es un fork experimental que todavía no fue auditado."  # @src=80fd0f1961b9
                # | Reversed: Octane is archived, and Kora is the audited successor.
                feedback: "Al revés: Octane está archivado, y Kora es el sucesor auditado."  # @src=22c211db53bf
          m08-l1-q3:
            # | You copy the official facilitator-on-Kora guide and its imports read `x402`
            # | / `x402-express`, but your project uses `@x402/svm`. What's happening and
            # | what do you do?
            prompt: "Copias la guía oficial de facilitador-sobre-Kora y sus imports dicen `x402` / `x402-express`, pero tu proyecto usa `@x402/svm`. ¿Qué está pasando y qué haces?"  # @src=435c958dfae1
            # | This is the documented v1/v2 naming drift: solana.com's facilitator guide
            # | still uses the bare x402 packages while the ecosystem moved to scoped
            # | @x402/* v2. Teach and build v2; recognize the guide's names as lag, not a
            # | constraint.
            explanation: "Esta es la deriva de nombres v1/v2 documentada: la guía de facilitador de solana.com todavía usa los paquetes x402 pelados mientras el ecosistema se movió a @x402/* v2 con scope. Enseña y construye v2; reconoce los nombres de la guía como rezago, no como una restricción."  # @src=a58b9e6e2df3
            options:                 # source order — keep it
              d:
                # | Both lines are live: bare x402 on the facilitator side, scoped @x402/*
                # | on the client.
                label: "Las dos líneas están vivas: x402 pelado del lado del facilitador, @x402/* con scope del lado del cliente."  # @src=adbb162e1920
                # | Splitting the difference keeps you on the stale half. The scoped @x402/*
                # | v2 line is the live SDK on both sides of the exchange, and it is the one
                # | you already built the paywall and the paying agent against; the bare
                # | names in the guide are lag, not a division of labor.
                feedback: "Partir la diferencia te deja en la mitad obsoleta. La línea @x402/* v2 con scope es el SDK vivo en los dos lados del intercambio, y es contra la que ya construiste el paywall y el agente pagador; los nombres pelados de la guía son rezago, no una división del trabajo."  # @src=dcc20ce52f12
              c:
                # | Kora only works with the v1 packages, so you must downgrade to keep
                # | sponsorship working.
                label: "Kora solo funciona con los paquetes v1, así que tienes que bajar de versión para que el patrocinio siga funcionando."  # @src=7e441fe439d5
                # | Kora is a package-agnostic paymaster; the drift is naming, not a Kora
                # | requirement.
                feedback: "Kora es un paymaster agnóstico de paquetes; la deriva es de nombres, no un requisito de Kora."  # @src=aff1afc1adf5
              a:
                # | The guide lags on v1 package names; the live SDK is the scoped @x402/*
                # | v2 line, so build v2.
                label: "La guía va rezagada en los nombres de paquete v1; el SDK vivo es la línea @x402/* v2 con scope, así que construye v2."  # @src=6187f4a0cc0c
                # | Docs and registries ship on separate clocks; npm is the fresher truth,
                # | and the drift usually runs deeper than package names, so the package's
                # | own docs outrank the guide's.
                feedback: "Los docs y los registries salen en relojes separados; npm es la verdad más fresca, y la deriva normalmente va más profundo que los nombres de paquete, así que los docs del paquete mismo pesan más que los de la guía."  # @src=5ac5a958cac7
              b:
                # | The guide is canonical and the scoped @x402/* packages are an unofficial
                # | fork, so switch your imports back to x402 and x402-express.
                label: "La guía es canónica y los paquetes @x402/* con scope son un fork no oficial, así que vuelve a cambiar tus imports a x402 y x402-express."  # @src=9d552c7c86b0
                # | The scoped @x402/* line is the current SDK; the guide's bare names are
                # | the lagging ones.
                feedback: "La línea @x402/* con scope es el SDK actual; los nombres pelados de la guía son los rezagados."  # @src=ac76868f643d
          m08-l1-q4:
            # | A buyer asks Kora to sponsor an arbitrary transaction they assembled
            # | themselves. What is the right posture for your paymaster?
            prompt: "Un comprador le pide a Kora que patrocine una transacción arbitraria que armó él mismo. ¿Cuál es la postura correcta para tu paymaster?"  # @src=4d822ab25fea
            # | A paymaster with no validation is an open drain. Kora's allowlists and
            # | validation rules are the whole safety story: restrict sponsorship to the
            # | exact instructions and programs your checkout emits.
            explanation: "Un paymaster sin validación es un drenaje abierto. Las allowlists de Kora y sus reglas de validación son la historia de seguridad entera: restringe el patrocinio a las instrucciones y los programas exactos que emite tu checkout."  # @src=5e9299f91296
            options:                 # source order — keep it
              c:
                # | Move the sponsor key into the browser bundle so the buyer's wallet
                # | co-signs locally and there is no paymaster left in the path to trust.
                label: "Mueve la llave del patrocinador al bundle del navegador para que la billetera del comprador co-firme localmente y no quede ningún paymaster en el camino al que tenerle confianza."  # @src=a5432014d6cb
                # | Exposing the sponsor key client-side is strictly worse; validation, not
                # | key exposure, is the control.
                feedback: "Exponer la llave del patrocinador en el lado del cliente es estrictamente peor; la validación, no la exposición de la llave, es el control."  # @src=1b12cda4ef6b
              d:
                # | Allowlist the programs your checkout calls and stop there, since a
                # | program allowlist already bounds which instructions get sponsored.
                label: "Ponle allowlist a los programas que llama tu checkout y detente ahí, ya que una allowlist de programas ya acota qué instrucciones se patrocinan."  # @src=3eeeab574b80
                # | A program allowlist is the outer wall, not the whole building. One
                # | allowed program carries many instructions, which is why the config also
                # | caps signatures and lamports and why fee_payer_policy exists: it is what
                # | stops a transaction whose inner instruction moves lamports out of the
                # | sponsor account signing it.
                feedback: "Una allowlist de programas es la pared exterior, no el edificio entero. Un solo programa permitido lleva muchas instrucciones, que es por lo que la config también le pone tope a las firmas y a los lamports y por lo que existe fee_payer_policy: es lo que detiene una transacción cuya instrucción interna mueve lamports fuera de la cuenta del patrocinador que la está firmando."  # @src=b3363228335f
              a:
                # | Sponsor it: the paymaster only pays fees, so the worst case is a single
                # | wasted base fee.
                label: "Patrocínala: el paymaster solo paga comisiones, así que el peor caso es una sola comisión base desperdiciada."  # @src=10ece0f1ade8
                # | An unvalidated transaction can drain the sponsor via rent and abusive
                # | instructions; fees are not the only exposure.
                feedback: "Una transacción sin validar puede drenar al patrocinador vía rent e instrucciones abusivas; las comisiones no son la única exposición."  # @src=a2078f6b9948
              b:
                # | Configure Kora's validation rules and allowlists so it only sponsors the
                # | instructions and programs your checkout actually uses.
                label: "Configura las reglas de validación y las allowlists de Kora para que solo patrocine las instrucciones y los programas que tu checkout usa de verdad."  # @src=446ffd31bb2a
                # | A fee payer signs and a signature is authorization, which leaves an
                # | allowlist as the only thing bounding what you fund; program-level
                # | scoping stays coarse, since one program carries many instructions.
                feedback: "Un fee payer firma y una firma es autorización, que deja a una allowlist como lo único que acota lo que fondeas; el alcance a nivel de programa se queda de grano grueso, ya que un solo programa lleva muchas instrucciones."  # @src=dcf8bd0aed74
  m08-l2:
    # | Deferred payments: durable nonces at the fair (and the outage that scarred them)
    title: "Pagos diferidos: nonces durables en la feria (y el apagón que los dejó marcados)"  # @src=f00eb03e4953
    blocks:
      nonce-queue-drain:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Branch on item.kind before doing any age math.
          0: "Ramifica sobre item.kind antes de hacer cualquier matemática de edad."  # @src=1002b923127a
          # | Whether a nonce tx belongs in the unsafe bucket depends only on nonceAdvanced,
          # | never on how old it is; that decision must never touch nowSeconds or
          # | windowSeconds.
          1: "Que una tx de nonce pertenezca al grupo unsafe depende solo de nonceAdvanced, nunca de lo vieja que sea; esa decisión no puede tocar nunca nowSeconds ni windowSeconds."  # @src=1909dc87af3a
          # | At the boundary, an item exactly windowSeconds old is still submittable; only
          # | strictly older than that expires.
          2: "En el límite, un ítem con exactamente windowSeconds de edad todavía es enviable; solo vence lo estrictamente más viejo que eso."  # @src=8ad586beb19f
        tests:                      # keyed by test case id
          t1:
            # | A fresh blockhash tx submits; a durable-nonce tx submits even though it is
            # | old.
            description: "Una tx con blockhash fresco se envía; una tx con nonce durable se envía aunque sea vieja."  # @src=c02dd6050aae
          t2:
            # | A stale blockhash tx (past the ~45s window) is expired, not submitted.
            description: "Una tx con blockhash rancio (pasada la ventana de ~45s) queda expired, no submitted."  # @src=face71a4f4ce
          t3:
            # | A spent (already advanced) nonce tx is unsafe and must not be resubmitted.
            description: "Una tx con nonce gastado (ya avanzado) es unsafe y no debe reenviarse."  # @src=2eb5535f6fa4
          t4:
            # | Durable-nonce txs never expire by wall clock: all unspent nonces submit even
            # | when very old.
            description: "Las txs con nonce durable nunca vencen por reloj de pared: todos los nonces sin gastar se envían incluso cuando son muy viejos."  # @src=c50defee5557
          t5:
            # | Mixed queue, input order preserved across all three buckets.
            description: "Fila mezclada, orden de entrada preservado en los tres grupos."  # @src=3dd1f78425ee
          t6:
            # | The window boundary: at exactly windowSeconds the blockhash is still inside
            # | its 150-block life and submits; one second past it expires.
            description: "El límite de la ventana: en exactamente windowSeconds el blockhash todavía está dentro de su vida de 150 bloques y se envía; un segundo después vence."  # @src=4e534f35daa7
      check:                      # quiz
        questions:
          m08-l2-q1:
            # | A sale signed at your stall is submitted 4 minutes after signing and the RPC
            # | rejects it as an expired blockhash. At ~300ms slots, roughly how long was
            # | your submit window, and what takes the deadline away?
            prompt: "Una venta firmada en tu puesto se envía 4 minutos después de firmarla y el RPC la rechaza por blockhash vencido. Con slots de ~300ms, ¿aproximadamente de cuánto era tu ventana de envío, y qué le quita el plazo?"  # @src=cd970114bb8e
            # | A blockhash is valid for 150 blocks; at the current 300ms target slot time
            # | that is roughly 45 seconds, and each staged cut shrinks it further, so
            # | derive the window, never memorize it. No amount of retrying extends it. A
            # | durable nonce swaps the blockhash for a stored value that only moves when
            # | you advance it, so the transaction has no wall-clock deadline.
            explanation: "Un blockhash es válido por 150 bloques; al tiempo de slot objetivo actual de 300ms eso son aproximadamente 45 segundos, y cada corte por etapas lo encoge más, así que deriva la ventana, nunca la memorices. Ninguna cantidad de reintentos la extiende. Un nonce durable cambia el blockhash por un valor guardado que solo se mueve cuando tú lo avanzas, así que la transacción no tiene ningún plazo de reloj de pared."  # @src=5939be5b57ed
            options:                 # source order — keep it
              d:
                # | About 45 seconds, and a durable nonce stretches the deadline to a few
                # | hours.
                label: "Alrededor de 45 segundos, y un nonce durable estira el plazo a unas pocas horas."  # @src=216cca031fc4
                # | The arithmetic is right and the fix is stronger than a longer lease. A
                # | nonce transaction has no wall-clock deadline at all: the docs put it as
                # | no restrictions on how old the nonce is, and the bytes stay submittable
                # | until someone advances that nonce. Which is also why the queue file is a
                # | drawer of bearer paper rather than a log.
                feedback: "La aritmética está bien y el arreglo es más fuerte que un plazo más largo. Una transacción con nonce no tiene ningún plazo de reloj de pared: los docs lo ponen como que no hay restricciones sobre qué tan viejo es el nonce, y los bytes siguen siendo enviables hasta que alguien avance ese nonce. Que es también la razón de que el archivo de fila sea un cajón de papel al portador y no un log."  # @src=4d35528addc0
              c:
                # | About 45 seconds (150 blocks at 300ms); a durable nonce removes the
                # | wall-clock deadline.
                label: "Alrededor de 45 segundos (150 bloques a 300ms); un nonce durable quita el plazo de reloj de pared."  # @src=1869917aefd1
                # | The window is counted in blocks, and its wall-clock length follows the
                # | current slot time; every staged cut shortens the same 150 blocks, which
                # | is why the number is derived, not memorised.
                feedback: "La ventana se cuenta en bloques, y su largo de reloj de pared sigue al tiempo de slot actual; cada corte por etapas acorta los mismos 150 bloques, que es la razón de que el número se derive y no se memorice."  # @src=28e96bfb1c5b
              a:
                # | About 5 minutes, since the 150-block window runs on 400ms slots plus
                # | confirmation lag, so the RPC must be misconfigured.
                label: "Alrededor de 5 minutos, dado que la ventana de 150 bloques corre sobre slots de 400ms más el retraso de confirmación, así que el RPC tiene que estar mal configurado."  # @src=9583f039811f
                # | At 300ms slots the 150-block window is far under 5 minutes; the
                # | rejection is expected, not an RPC bug.
                feedback: "Con slots de 300ms la ventana de 150 bloques está muy por debajo de 5 minutos; el rechazo es lo esperado, no un bug del RPC."  # @src=a9eda2cefe6e
              b:
                # | About 2 minutes; widen it by raising maxRetries so the client keeps
                # | rebroadcasting.
                label: "Alrededor de 2 minutos; ensánchala subiendo maxRetries para que el cliente siga retransmitiendo."  # @src=b86d1fe0e466
                # | Retries do not extend a blockhash's validity; the hash is simply too old
                # | to accept.
                feedback: "Los reintentos no extienden la validez de un blockhash; el hash simplemente es demasiado viejo para aceptarse."  # @src=fb3411a540e5
          m08-l2-q2:
            # | You're assembling a durable-nonce transaction for an offline sale. Which
            # | condition is required for it to be valid?
            prompt: "Estás armando una transacción con nonce durable para una venta offline. ¿Qué condición se requiere para que sea válida?"  # @src=a77e5910420e
            # | Durable-nonce transactions are only valid when AdvanceNonceAccount is
            # | instruction 0; that ordering is what consumes and rolls the stored nonce.
            # | The nonce account itself is System-owned and rent-exempt.
            explanation: "Las transacciones con nonce durable solo son válidas cuando AdvanceNonceAccount es la instrucción 0; ese orden es lo que consume y rueda el nonce guardado. La cuenta de nonce misma es propiedad del System y está exenta de rent."  # @src=23519a0f98b7
            options:                 # source order — keep it
              b:
                # | The nonce account must be program-owned and non-rent-exempt to keep it
                # | cheap.
                label: "La cuenta de nonce tiene que ser propiedad de un programa y no estar exenta de rent para mantenerla barata."  # @src=94d63d9bf098
                # | A nonce account is System-owned and MUST be rent-exempt; both parts of
                # | this are wrong.
                feedback: "Una cuenta de nonce es propiedad del System y TIENE QUE estar exenta de rent; las dos partes de esto están mal."  # @src=b10ef10cbf90
              a:
                # | AdvanceNonceAccount must be the first instruction (instruction 0) in the
                # | transaction.
                label: "AdvanceNonceAccount tiene que ser la primera instrucción (la instrucción 0) de la transacción."  # @src=81977af3a12d
                # | The runtime reads position zero to decide whether a nonce is the
                # | lifetime, which makes ordering the signal; necessary, not sufficient,
                # | since the account must also be System-owned and rent-exempt.
                feedback: "El runtime lee la posición cero para decidir si un nonce es el lifetime, lo que hace del orden la señal; necesario, no suficiente, dado que la cuenta también tiene que ser propiedad del System y estar exenta de rent."  # @src=0c2d262498d5
              c:
                # | The transfer must come before the advance so the payment settles first.
                label: "La transferencia tiene que venir antes del advance para que el pago se liquide primero."  # @src=2a73456218c6
                # | The advance has to be instruction 0; putting the transfer first makes
                # | the durable-nonce transaction invalid.
                feedback: "El advance tiene que ser la instrucción 0; poner la transferencia primero vuelve inválida la transacción con nonce durable."  # @src=e3be4d929697
              d:
                # | The nonce account's own keypair must co-sign each sale it backs.
                label: "El keypair propio de la cuenta de nonce tiene que co-firmar cada venta que respalda."  # @src=2285e9aa4a69
                # | That keypair signs once, at creation, and is never needed again. Control
                # | of the account lives with the authority named at initialization, which
                # | is why the pool's throwaway keypairs can be discarded while the merchant
                # | key keeps advancing every slot in it.
                feedback: "Ese keypair firma una vez, en la creación, y nunca se vuelve a necesitar. El control de la cuenta vive con la autoridad nombrada en la inicialización, que es la razón de que los keypairs desechables del pool se puedan descartar mientras la llave del comercio sigue avanzando cada slot que hay en él."  # @src=2be1983dd900
          m08-l2-q3:
            # | Your notes on the fair queue need to say something about this primitive's
            # | two scars. What is the accurate pair to record?
            prompt: "Tus notas sobre la fila de la feria necesitan decir algo sobre las dos cicatrices de esta primitiva. ¿Cuál es el par correcto que hay que registrar?"  # @src=d617a9f73bc3
            # | Both caveats are mandatory canon: the official docs' own may-be-deprecated
            # | warning and the 2022-06-01 double-processing halt. You use durable nonces
            # | anyway, but you build the queue knowing both risks.
            explanation: "Las dos advertencias son canon obligatorio: la propia advertencia de puede-quedar-deprecada de los docs oficiales y la detención por doble procesamiento del 2022-06-01. Usas nonces durables de todos modos, pero construyes la fila conociendo los dos riesgos."  # @src=4c6970635e8e
            options:                 # source order — keep it
              a:
                # | They're historical trivia; durable nonces are now formally guaranteed
                # | stable, so the caveats are obsolete.
                label: "Son trivia histórica; los nonces durables ahora tienen garantía formal de ser estables, así que las advertencias están obsoletas."  # @src=9a473af0cfc2
                # | The may-be-deprecated warning is still live, and the 2022 halt is why
                # | the primitive is treated carefully to this day. The runtime bug itself
                # | was fixed, but nothing about that fix made the deprecation risk or the
                # | re-signing double-charge go away.
                feedback: "La advertencia de puede-quedar-deprecada sigue viva, y la detención de 2022 es la razón de que la primitiva se trate con cuidado hasta el día de hoy. El bug del runtime mismo se arregló, pero nada de ese arreglo hizo desaparecer el riesgo de deprecación ni el cargo doble por re-firma."  # @src=23d9be1c9fe3
              d:
                # | The docs caveat is live, and the 2022 double-processing path still is
                # | too, so rebroadcasting spent bytes can charge a buyer twice.
                label: "La advertencia de los docs está viva, y el camino del doble procesamiento de 2022 también sigue estándolo, así que retransmitir bytes gastados puede cobrarle dos veces a un comprador."  # @src=48d5879cd194
                # | Half a scar. The deprecation caveat is live; the double-processing path
                # | is not, because the 2022 repair separated the two validation domains and
                # | a conforming validator now rejects bytes whose nonce has advanced.
                # | Rebroadcasting them wastes a send and smudges the ledger. The
                # | double-charge still on the table is yours: re-signing the same sale
                # | against a fresh nonce.
                feedback: "Media cicatriz. La advertencia de deprecación está viva; el camino del doble procesamiento no, porque la reparación de 2022 separó los dos dominios de validación y un validador conforme ahora rechaza los bytes cuyo nonce ha avanzado. Retransmitirlos desperdicia un envío y deja un borrón en el libro mayor. El cargo doble que sigue sobre la mesa es tuyo: re-firmar la misma venta contra un nonce fresco."  # @src=1e8b1a794917
              c:
                # | The outage proved the primitive is unsafe under load, so the queue
                # | should hold each sale unsigned and build a fresh-blockhash transaction
                # | once connectivity returns.
                label: "El apagón demostró que la primitiva es insegura bajo carga, así que la fila debería sostener cada venta sin firmar y construir una transacción con blockhash fresco una vez que vuelva la conectividad."  # @src=ac56ec788655
                # | That defers the buyer's signature until after they have walked away;
                # | offline signing is the whole point, and careful nonce handling is the
                # | fix rather than abandoning the primitive.
                feedback: "Eso posterga la firma del comprador hasta después de que ya se fue; firmar offline es el punto entero, y el manejo cuidadoso del nonce es el arreglo, no abandonar la primitiva."  # @src=9716779aac63
              b:
                # | The docs' may-be-deprecated warning is live, and nonce double-processing
                # | caused a ~4.5-hour mainnet halt in 2022; both are risks you design
                # | around.
                label: "La advertencia de puede-quedar-deprecada de los docs está viva, y el doble procesamiento de nonces causó una detención de mainnet de ~4.5 horas en 2022; los dos son riesgos que rodeas al diseñar."  # @src=e6aa29a6715e
                # | Two risks of different kinds: one on the roadmap, one operational;
                # | neither argues for avoiding the primitive, because offline signing has
                # | no substitute.
                feedback: "Dos riesgos de clases distintas: uno en el roadmap, uno operativo; ninguno argumenta a favor de evitar la primitiva, porque firmar offline no tiene sustituto."  # @src=7591cad53e2d
          m08-l2-q4:
            # | Your queue holds a durable-nonce sale whose nonce has ALREADY advanced (it
            # | was consumed by an earlier successful submit). What must the drain step do
            # | with it?
            prompt: "Tu fila sostiene una venta con nonce durable cuyo nonce YA avanzó (lo consumió un envío exitoso anterior). ¿Qué tiene que hacer con ella el paso del drain?"  # @src=3f008ce17489
            # | A spent nonce ends the transaction's life: once advanced, the stored value
            # | no longer matches and a conforming validator rejects the bytes outright.
            # | 'Never expires' is not 'always resubmittable'. The drain excludes it and
            # | reconciles instead — and the double-charge that is still possible on these
            # | rails is re-signing the same sale against a fresh nonce, the human decision
            # | your classifier's `unsafe` bucket exists to force into the open.
            explanation: "Un nonce gastado termina la vida de la transacción: una vez avanzado, el valor guardado ya no coincide y un validador conforme rechaza los bytes de plano. 'Nunca vence' no es 'siempre reenviable'. El drain la excluye y concilia en su lugar — y el cargo doble que todavía es posible en estos rieles es re-firmar la misma venta contra un nonce fresco, la decisión humana que el grupo `unsafe` de tu clasificador existe para forzar a la luz."  # @src=fc2d6fde13af
            options:                 # source order — keep it
              a:
                # | Resubmit it: durable nonces never expire, so it is always safe to
                # | broadcast them again.
                label: "Reenviarla: los nonces durables nunca vencen, así que siempre es seguro volver a transmitirlos."  # @src=26080f2dab0c
                # | Once the nonce advanced, the stored value no longer matches and the
                # | runtime deterministically rejects those bytes; resubmitting cannot land,
                # | it just burns sends and muddies the ledger the drain depends on.
                feedback: "Una vez que el nonce avanzó, el valor guardado ya no coincide y el runtime rechaza determinísticamente esos bytes; reenviar no puede aterrizar, solo quema envíos y enturbia el libro mayor del que depende el drain."  # @src=c1893961a605
              b:
                # | Re-sign it against the same stored nonce and submit; the cluster dedupes
                # | on signature, so a duplicate is simply dropped.
                label: "Re-firmarla contra el mismo nonce guardado y enviarla; el cluster deduplica por firma, así que un duplicado simplemente se descarta."  # @src=e50941ce4670
                # | The nonce already advanced, so a re-signed transaction is a fresh
                # | authorization, not a dedupe.
                feedback: "El nonce ya avanzó, así que una transacción re-firmada es una autorización nueva, no un dedup."  # @src=efb96e1b7fb5
              c:
                # | Exclude it from submission: the nonce is spent, the runtime will refuse
                # | the bytes, and the sale needs reconciliation, not another broadcast.
                label: "Excluirla del envío: el nonce está gastado, el runtime va a rechazar los bytes, y la venta necesita conciliación, no otra transmisión."  # @src=00792c4684ee
                # | Once the stored value has rolled, those bytes can never land again; what
                # | remains is bookkeeping. Dropping it is not resolving it, and that sale
                # | still needs a ledger state: landed earlier (RECONCILED) or lost (UNSAFE,
                # | a human decision).
                feedback: "Una vez que el valor guardado rodó, esos bytes no pueden aterrizar nunca más; lo que queda es contabilidad. Descartarla no es resolverla, y esa venta todavía necesita un estado en el libro mayor: aterrizó antes (RECONCILED) o se perdió (UNSAFE, una decisión humana)."  # @src=a7618a2cb6a3
              d:
                # | Re-sign the sale against a fresh nonce and submit that, since the
                # | original bytes are dead anyway.
                label: "Re-firmar la venta contra un nonce fresco y enviar eso, dado que los bytes originales están muertos de todos modos."  # @src=1aa53e2c9393
                # | This is the live double-charge on these rails, and it is the one the
                # | runtime cannot stop for you. A nonce that advanced usually advanced
                # | because the sale landed, so re-signing bills the buyer a second time for
                # | one record. Check the signature first: confirmed means RECONCILED,
                # | absent means UNSAFE and a human decides.
                feedback: "Este es el cargo doble vivo en estos rieles, y es el que el runtime no puede detener por ti. Un nonce que avanzó normalmente avanzó porque la venta aterrizó, así que re-firmar le factura al comprador una segunda vez por un solo disco. Comprueba primero la firma: confirmada quiere decir RECONCILED, ausente quiere decir UNSAFE y decide un humano."  # @src=bf878440902c
  m08-l3:
    # | The production gate: a go-live checklist that means it
    title: "El gate de producción: una checklist de salida al aire que va en serio"  # @src=b2bda5ab6dc0
    blocks:
      check:                      # quiz
        questions:
          m08-l3-q1:
            # | Your fair-queue drain runs at closing time, settling transactions buyers
            # | signed hours ago at the stall, one of them a bulk order big enough to
            # | matter. What does your commitment policy owe that drained sale?
            prompt: "Tu drain de fair-queue corre a la hora del cierre, liquidando transacciones que los compradores firmaron hace horas en el puesto, una de ellas un pedido a granel lo bastante grande para importar. ¿Qué le debe tu política de commitment a esa venta drenada?"  # @src=ab4b448b28a1
            # | Commitment binds to the moment you decide money arrived, not to how the
            # | checkout felt, so a deferred drain enforces the same value-scaled rule the
            # | live path does, and with the buyer long gone, a payment reversed there has
            # | nobody to re-charge. `processed` is never that gate, and the 500 USDC figure
            # | in the sample verdicts is one build's choice rather than a documented
            # | threshold.
            explanation: "El commitment se ata al momento en que decides que el dinero llegó, no a cómo se sintió el checkout, así que un drain diferido hace cumplir la misma regla escalada al valor que hace cumplir el camino en vivo, y con el comprador hace mucho ido, un pago revertido ahí no tiene a quién volver a cobrarle. `processed` nunca es ese gate, y la cifra de 500 USDC de los veredictos de muestra es la elección de una construcción y no un umbral documentado."  # @src=1de901ce5661
            options:                 # source order — keep it
              b:
                # | `confirmed` covers the whole drain, because the buyer already authorized
                # | the payment when they signed it back at the fair.
                label: "`confirmed` cubre el drain entero, porque el comprador ya autorizó el pago cuando lo firmó allá en la feria."  # @src=c76658750ed2
                # | Signing is authorization, not settlement. Commitment prices the chance
                # | that the block carrying the transfer gets dropped, and that chance does
                # | not shrink because the signature is hours old.
                feedback: "Firmar es autorización, no liquidación. El commitment le pone precio a la probabilidad de que el bloque que lleva la transferencia se caiga, y esa probabilidad no se encoge porque la firma tenga horas de vieja."  # @src=da420d14f27e
              c:
                # | `processed`, since the drain is a batch job and its own retry loop will
                # | pick up anything the network happens to drop.
                label: "`processed`, dado que el drain es un trabajo por lotes y su propio loop de reintentos va a recoger cualquier cosa que la red se llegue a caer."  # @src=bb745fdc8e85
                # | `processed` can vanish in a fork, so it is never the gate that releases
                # | goods; and a retry loop still has to pick some commitment before it can
                # | believe the answer it re-reads.
                feedback: "`processed` puede desvanecerse en un fork, así que nunca es el gate que libera la mercancía; y un loop de reintentos todavía tiene que elegir algún commitment antes de poder creerle a la respuesta que vuelve a leer."  # @src=76d1cb81c58a
              d:
                # | Escalate every drained sale to `finalized` regardless of size, since the
                # | documented 500 USDC line applies once settlement is deferred.
                label: "Escala cada venta drenada a `finalized` sin importar el tamaño, dado que la línea documentada de 500 USDC aplica una vez que la liquidación se difiere."  # @src=0b058c3588d4
                # | No document names that figure. The 500 USDC in this lesson's sample
                # | verdicts is one reference build's choice, flagged as such. The line
                # | stays yours to derive, and it keys off what a reversal would cost you,
                # | not off whether the sale sat in a queue.
                feedback: "Ningún documento nombra esa cifra. Los 500 USDC de los veredictos de muestra de esta lección son la elección de una construcción de referencia, marcada como tal. La línea sigue siendo tuya para derivarla, y se indexa sobre lo que una reversión te costaría, no sobre si la venta estuvo sentada en una fila."  # @src=7a923a749d8c
              a:
                # | The same escalation the live path gets: hold it to `finalized` before
                # | marking it fulfilled if it crosses your threshold, because no buyer is
                # | standing there to re-run.
                label: "La misma escalada que recibe el camino en vivo: sosténla en `finalized` antes de marcarla como despachada si cruza tu umbral, porque no hay ningún comprador parado ahí para volver a pasar la tarjeta."  # @src=acea3344eaf4
                # | A drain is a settlement path like any other, so the rule has to reach it
                # | too. Write the row so it forces you to grep every commitment argument in
                # | the codebase, not just the ones you remember writing.
                feedback: "Un drain es un camino de liquidación como cualquier otro, así que la regla también tiene que alcanzarlo. Escribe la fila de modo que te fuerce a hacer grep de cada argumento de commitment en el código, no solo de los que te acuerdas de haber escrito."  # @src=798843b00c13
          m08-l3-q2:
            # | The gate asks how you set priority fees on the transactions your store
            # | sends. How deep should this lesson go?
            prompt: "El gate pregunta cómo fijas las priority fees en las transacciones que manda tu tienda. ¿Qué tan profundo debería llegar esta lección?"  # @src=74c67c6a6374
            # | This is a boundary the course keeps honest: a one-box priority-fee recipe
            # | lands payment transactions reliably, and the deep landing strategy belongs
            # | to Client-Side Mastery. The gate names the handoff rather than faking depth.
            explanation: "Esta es una frontera que el curso mantiene honesta: una receta de priority fees de una sola caja aterriza transacciones de pago de forma confiable, y la estrategia profunda de aterrizaje le pertenece a Client-Side Mastery. El gate nombra el traspaso en vez de fingir profundidad."  # @src=312f9396a93c
            options:                 # source order — keep it
              c:
                # | Skip priority fees: payments are small and low-value, so the base
                # | 5000-lamport fee is enough to land them even in a congested slot.
                label: "Sáltate las priority fees: los pagos son pequeños y de bajo valor, así que la comisión base de 5000 lamports alcanza para aterrizarlos incluso en un slot congestionado."  # @src=97eef991d3c3
                # | Under congestion a bare base-fee tx can be dropped; a practical
                # | priority-fee floor still matters.
                feedback: "Bajo congestión una tx con solo la comisión base puede caerse; un piso práctico de priority fee sigue importando."  # @src=74f9246d360b
              a:
                # | Build a full fee-estimation service that samples recent prioritization
                # | fees per writable account and retunes the micro-lamport bid every slot.
                label: "Construye un servicio completo de estimación de comisiones que muestree las comisiones de priorización recientes por cuenta escribible y reajuste la puja en micro-lamports cada slot."  # @src=8593e4b3e309
                # | That's landing science this course hands off; the gate wants a practical
                # | recipe, not a tuning engine.
                feedback: "Esa es ciencia del aterrizaje que este curso traspasa; el gate quiere una receta práctica, no un motor de afinado."  # @src=e6c88e117711
              d:
                # | Ship the one-box recipe and then the landing depth too, retry curves and
                # | Jito bundles included, since payments is where landing belongs.
                label: "Entrega la receta de una sola caja y después también la profundidad del aterrizaje, curvas de reintento y bundles de Jito incluidos, dado que los pagos son donde pertenece el aterrizaje."  # @src=4396530aa0af
                # | Landing is a discipline of its own: per-account fee estimation, retry
                # | curves, Jito bundles, compute-budget science, and Client-Side Mastery
                # | owns it end to end the way this course owns commerce. A quarter-taught
                # | version of it is the quarter that loses money, which is why the box
                # | overpays slightly and stops.
                feedback: "El aterrizaje es una disciplina propia: estimación de comisiones por cuenta, curvas de reintento, bundles de Jito, ciencia del compute budget, y Client-Side Mastery es dueño de eso de punta a punta del mismo modo que este curso es dueño del comercio. Una versión enseñada a un cuarto es el cuarto que pierde dinero, que es la razón de que la caja pague un poco de más y se detenga."  # @src=963879180c4c
              b:
                # | State a one-box practical recipe for payment txs and hand
                # | transaction-landing depth to the Client-Side Mastery course.
                label: "Declara una receta práctica de una sola caja para las txs de pago y traspásale la profundidad del aterrizaje de transacciones al curso Client-Side Mastery."  # @src=6609ad413b7b
                # | A payment needs a fee floor that lands rather than an optimiser, and
                # | depth here is scope you could not maintain. Naming a handoff is not
                # | skipping it, and the box holds a default that works.
                feedback: "Un pago necesita un piso de comisión que aterrice y no un optimizador, y la profundidad aquí es alcance que no podrías mantener. Nombrar un traspaso no es saltárselo, y la caja sostiene un default que funciona."  # @src=48a11c711df4
          m08-l3-q3:
            # | Your webhook worker has been quietly failing for days and orders aren't
            # | being fulfilled. Which gate row is designed to catch this?
            prompt: "Tu worker del webhook lleva días fallando calladamente y los pedidos no se están despachando. ¿Qué fila del gate está diseñada para atrapar esto?"  # @src=d5ae601f9572
            # | Silent webhook failure stops fulfillment without an obvious error, and a
            # | Helius webhook can auto-disable itself after sustained failure. The
            # | monitoring row exists precisely to alert on the failure rate before orders
            # | quietly stop.
            explanation: "La falla silenciosa del webhook detiene el despacho sin ningún error obvio, y un webhook de Helius puede desactivarse a sí mismo después de una falla sostenida. La fila de monitoreo existe precisamente para alertar sobre la tasa de fallas antes de que los pedidos se detengan calladamente."  # @src=43c4310e1a0e
            options:                 # source order — keep it
              c:
                # | The webhook-failure-monitoring row: Helius auto-disables a webhook after
                # | sustained failure, so alert on failure rate.
                label: "La fila de monitoreo de fallas del webhook: Helius desactiva automáticamente un webhook después de una falla sostenida, así que alerta sobre la tasa de fallas."  # @src=58489baf3061
                # | The failure mode is silence; nothing on your side errors, and only a
                # | monitor watching the sender catches it before orders stop.
                feedback: "El modo de falla es el silencio; nada de tu lado da error, y solo un monitor que vigile al emisor lo atrapa antes de que los pedidos se detengan."  # @src=dd5a3538bb15
              d:
                # | The reconciliation-export row, since its dated CSV is where a
                # | fulfillment gap gets caught before buyers notice.
                label: "La fila de la exportación de conciliación, dado que su CSV fechado es donde se atrapa un hueco de despacho antes de que los compradores lo noten."  # @src=53176ed1b8c0
                # | The export is an accounting artifact you run on a cadence, so it finds
                # | the gap long after the buyer did; in the story that opens this family
                # | the first signal was a customer DM two days in. Catching it early takes
                # | something watching the sender, plus the polling fallback that degrades a
                # | dead webhook into slow fulfillment.
                feedback: "La exportación es un artefacto contable que corres con una cadencia, así que encuentra el hueco mucho después que el comprador; en la historia que abre esta familia la primera señal fue el DM de un cliente a los dos días. Atraparlo temprano requiere algo que vigile al emisor, más el respaldo por sondeo que degrada un webhook muerto a despacho lento."  # @src=b4ad7c20b41d
              a:
                # | The commitment-policy row, because the worker releases orders only at
                # | `confirmed` and these payments never reached that level.
                label: "La fila de la política de commitment, porque el worker libera pedidos solo en `confirmed` y estos pagos nunca alcanzaron ese nivel."  # @src=f1f94a917999
                # | The transactions confirmed fine; the failure is in ingestion, not
                # | commitment.
                feedback: "Las transacciones confirmaron bien; la falla está en la ingesta, no en el commitment."  # @src=37bac2834a2f
              b:
                # | The idempotency row, because duplicate events are piling up unprocessed
                # | on the queue.
                label: "La fila de la idempotencia, porque los eventos duplicados se están apilando sin procesar en la fila."  # @src=37655e9d322e
                # | Idempotency guards against double-fulfillment, not silent non-delivery.
                feedback: "La idempotencia protege contra el doble despacho, no contra la no-entrega silenciosa."  # @src=c74403d2d189
          m08-l3-q4:
            # | You go looking for a Solana-native merchant accounting/reporting SaaS to
            # | close the books and find nothing purpose-built. What's the honest gate
            # | posture?
            prompt: "Vas a buscar un SaaS nativo de Solana de contabilidad/reportes para comercios para cerrar los libros y no encuentras nada hecho para ese propósito. ¿Cuál es la postura honesta del gate?"  # @src=c9f576bef1b6
            # | Honest gaps are teaching content in a young market: with no purpose-built
            # | Solana merchant-accounting SaaS at build time, you state the gap with its
            # | date and lean on your own reference/memo reconciliation export until one
            # | exists.
            explanation: "Los huecos honestos son contenido didáctico en un mercado joven: sin ningún SaaS de contabilidad para comercios de Solana hecho para ese propósito al momento de la construcción, declaras el hueco con su fecha y te apoyas en tu propia exportación de conciliación por reference/memo hasta que exista uno."  # @src=7b60ee41e987
            options:                 # source order — keep it
              d:
                # | State it as a market gap and ship the export, but leave off the date,
                # | since gaps like this typically hold for years.
                label: "Decláralo como un hueco de mercado y entrega la exportación, pero omite la fecha, dado que los huecos así normalmente se sostienen por años."  # @src=e6bc44c7cfc5
                # | The date is the part that makes it a finding rather than an opinion
                # | about the world forever. Young markets move, and an undated gap is the
                # | claim that ages into next year's emergency; write down when you looked,
                # | and what you would replace the export with once somebody builds the
                # | thing.
                feedback: "La fecha es la parte que lo vuelve un hallazgo y no una opinión sobre el mundo para siempre. Los mercados jóvenes se mueven, y un hueco sin fecha es la afirmación que envejece hasta ser la emergencia del año que viene; anota cuándo buscaste, y con qué reemplazarías la exportación una vez que alguien construya la cosa."  # @src=9ed7184e3fda
              b:
                # | Block go-live until a vendor exists, since you can't operate a store
                # | without accounting software.
                label: "Bloquea la salida al aire hasta que exista un proveedor, dado que no puedes operar una tienda sin software de contabilidad."  # @src=90c892064683
                # | You already have reference/memo reconciliation; the missing SaaS is a
                # | note, not a blocker.
                feedback: "Ya tienes la conciliación por reference/memo; el SaaS que falta es una nota, no un bloqueador."  # @src=f57efc6f96a3
              a:
                # | State it as an observed market gap as of your build date and ship your
                # | own reconciliation export as the interim answer.
                label: "Decláralo como un hueco de mercado observado a la fecha de tu construcción y entrega tu propia exportación de conciliación como la respuesta intermedia."  # @src=af07e28c75d1
                # | Dating an observation makes it falsifiable rather than a claim about the
                # | world forever, and the export keeps you unblocked; a format accountants
                # | read is what keeps it replaceable.
                feedback: "Fechar una observación la vuelve falsable y no una afirmación sobre el mundo para siempre, y la exportación te mantiene sin bloqueos; un formato que los contadores leen es lo que la mantiene reemplazable."  # @src=9d1acc58a89c
              c:
                # | Assume Stripe's dashboard covers it, since Stripe settles some of the
                # | crypto payments.
                label: "Supón que el dashboard de Stripe lo cubre, dado que Stripe liquida algunos de los pagos en cripto."  # @src=623179d0d544
                # | Stripe's dashboard covers its own rails, not your on-chain Solana Pay
                # | and x402 ledger.
                feedback: "El dashboard de Stripe cubre sus propios rieles, no tu libro mayor on-chain de Solana Pay y x402."  # @src=ff1d105a005e
  m09-l1:
    # | Assembly: one store, every rail
    title: "Ensamblaje: una tienda, todos los rieles"  # @src=aebb9607be36
    blocks:
      check:                      # quiz
        questions:
          m09l1-q1-kit-pins:
            # | Assembling the stack, one workspace is held to the kit-6 line by its
            # | checkout dependency and another to the kit-7 line by its billing client. A
            # | teammate proposes collapsing both into one workspace on a single kit version
            # | to simplify the monorepo. What is the right call?
            prompt: "Ensamblando el stack, un workspace está retenido en la línea kit-6 por su dependencia de checkout y otro en la línea kit-7 por su cliente de facturación. Un compañero propone colapsar los dos en un solo workspace sobre una sola versión de kit para simplificar el monorepo. ¿Cuál es la decisión correcta?"  # @src=979d41fb0499
            # | The kit v6/v7 fragmentation is real and load-bearing: @solana/pay peers the
            # | kit-6 line while @solana/subscriptions 0.5.0 peers kit ^7. The course
            # | monorepo keeps per-workspace pins precisely so each package gets a
            # | compatible kit. Collapsing the workspaces re-introduces the peer conflict
            # | you already resolved.
            explanation: "La fragmentación de kit v6/v7 es real y estructural: @solana/pay tiene como peer la línea kit-6 mientras que @solana/subscriptions 0.5.0 tiene como peer a kit ^7. El monorepo del curso mantiene pins por workspace precisamente para que cada paquete reciba un kit compatible. Colapsar los workspaces re-introduce el conflicto de peers que ya resolviste."  # @src=4cb3073efd70
            options:                 # source order — keep it
              d:
                # | Keep both pins and register both workspaces; the workspace boundary is
                # | what holds the two kit majors apart.
                label: "Mantén los dos pins y registra los dos workspaces; la frontera del workspace es lo que mantiene separados a los dos majors de kit."  # @src=48aef6cac4a7
                # | Registered workspaces are not isolation: npm hoists them into one shared
                # | root resolution, which is why registering subscriptions is what finally
                # | produces the ERESOLVE. What holds at runtime is that npm parks one major
                # | under subscriptions/node_modules and the crank's entry file lives there,
                # | so Node resolves its imports from inside the island. The address of the
                # | file does the work, not the boundary.
                feedback: "Los workspaces registrados no son aislamiento: npm les hace hoisting hacia una única resolución compartida en la raíz, que es por lo que registrar subscriptions es lo que finalmente produce el ERESOLVE. Lo que se sostiene en runtime es que npm estaciona un major bajo subscriptions/node_modules y el archivo de entrada del crank vive ahí, así que Node resuelve sus imports desde adentro de la isla. La dirección del archivo hace el trabajo, no la frontera."  # @src=7554da26950d
              b:
                # | Force everything onto the npm-latest kit, since the newest release is
                # | the safest choice for a fresh capstone build.
                label: "Fuerza todo hacia el kit npm-latest, ya que el release más nuevo es la elección más segura para un build de capstone fresco."  # @src=89dbcf107349
                # | @solana/pay peers the kit-6 line; jumping the wavelength-checkout
                # | workspace to the newest kit re-breaks its peer pair, and you pin exact
                # | per workspace, never to latest.
                feedback: "@solana/pay tiene como peer la línea kit-6; saltar el workspace wavelength-checkout al kit más nuevo vuelve a romper su par de peers, y tú fijas exacto por workspace, nunca a latest."  # @src=615a6fb9903c
              c:
                # | Keep the two workspace pins; @solana/pay and @solana/subscriptions sit
                # | on different kit peer ranges, which is the seam m05-l2 taught.
                label: "Mantén los dos pins de workspace; @solana/pay y @solana/subscriptions están sobre rangos de peers de kit distintos, que es la costura que enseñó m05-l2."  # @src=41841dda69e9
                # | Peer ranges are constraints the packages publish, and keeping both means
                # | keeping two resolutions, which registration alone will not give you,
                # | since npm hoists registered workspaces into one shared root tree. Two
                # | trees do cost you, since values crossing between them are not the same
                # | types.
                feedback: "Los rangos de peers son restricciones que los paquetes publican, y mantener los dos quiere decir mantener dos resoluciones, que el registro por sí solo no te va a dar, ya que npm les hace hoisting a los workspaces registrados hacia un único árbol raíz compartido. Dos árboles sí te cuestan, ya que los valores que cruzan entre ellos no son los mismos tipos."  # @src=156db3f049db
              a:
                # | Force the whole repo onto the kit-6 line and add an npm override so the
                # | subscriptions client accepts it, since one lockfile is easier to reason
                # | about than two resolution trees.
                label: "Fuerza el repo entero hacia la línea kit-6 y agrega un override de npm para que el cliente de subscriptions lo acepte, ya que un solo lockfile es más fácil de razonar que dos árboles de resolución."  # @src=a9c0626de004
                # | @solana/subscriptions 0.5.0 peers kit ^7, so the kit-6 line breaks its
                # | peer range, and an override only silences the warning while the client
                # | runs on a kit it was never built against. That is the seam m05-l2
                # | already solved.
                feedback: "@solana/subscriptions 0.5.0 tiene como peer a kit ^7, así que la línea kit-6 rompe su rango de peers, y un override solo silencia la advertencia mientras el cliente corre sobre un kit contra el que nunca fue construido. Esa es la costura que m05-l2 ya resolvió."  # @src=c83104c80fdb
          m09l1-q2-verify-leg:
            # | Your journey script runs the Kora-sponsored purchase leg for a SOL-less
            # | buyer. The buyer's wallet returns a success toast. How should the demo
            # | assert that this leg PASSED?
            prompt: "Tu script de journey corre el tramo de compra patrocinada por Kora para un comprador sin SOL. La billetera del comprador devuelve un toast de éxito. ¿Cómo debería afirmar la demo que este tramo PASÓ?"  # @src=f7ae5b21926e
            # | The m04 verifier is the whole course's acceptance harness for exactly this
            # | reason: frontend confirmations are spoofable. Every journey leg, sponsored
            # | or not, is asserted by re-fetching the transaction server-side and checking
            # | mint, token program, and balance deltas.
            explanation: "El verificador de m04 es el harness de aceptación de todo el curso exactamente por esta razón: las confirmaciones del frontend son falsificables. Cada tramo del journey, patrocinado o no, se afirma volviendo a traer la transacción del lado del servidor y comprobando el mint, el programa de tokens y los deltas de saldo."  # @src=ca859c3c6654
            options:                 # source order — keep it
              b:
                # | Trust the wallet's success callback, since the Kora fee-payer already
                # | co-signed and submitted the transaction on the buyer's behalf and the
                # | RPC accepted it before the toast ever rendered.
                label: "Confía en el callback de éxito de la billetera, ya que el fee-payer de Kora ya co-firmó y envió la transacción en nombre del comprador y el RPC la aceptó antes de que el toast siquiera se renderizara."  # @src=f2b432c87048
                # | Kora co-signing does not make a frontend confirmation trustworthy, and
                # | an accepted submission is not a verified transfer; the verifier still
                # | re-checks server-side. A success toast proves nothing about what
                # | actually landed on chain.
                feedback: "La co-firma de Kora no vuelve confiable una confirmación del frontend, y un envío aceptado no es una transferencia verificada; el verificador igual vuelve a comprobar del lado del servidor. Un toast de éxito no demuestra nada sobre lo que de verdad aterrizó en la blockchain."  # @src=cc41e0d6b258
              a:
                # | Re-fetch the transaction server-side with getTransaction and check the
                # | mint, the token program, and the balance delta on the merchant-owned
                # | token account.
                label: "Vuelve a traer la transacción del lado del servidor con getTransaction y comprueba el mint, el programa de tokens y el delta de saldo en la cuenta de token propiedad del comercio."  # @src=46056b04923e
                # | Only a ledger read your own server performs is unforgeable; sponsorship
                # | changes nothing about proof, and every leg asserts the same way.
                feedback: "Solo una lectura del libro mayor que hace tu propio servidor es infalsificable; el patrocinio no cambia nada sobre la prueba, y cada tramo afirma de la misma manera."  # @src=32eb8cdf9c1c
              d:
                # | Check the landed transaction for the two sponsored facts, the fee payer
                # | being the Kora signer and the buyer's lamport delta being zero, since a
                # | co-signed purchase proves itself that way.
                label: "Comprueba en la transacción aterrizada los dos hechos del patrocinio, que el fee payer sea el firmante de Kora y que el delta de lamports del comprador sea cero, ya que una compra co-firmada se demuestra a sí misma de esa manera."  # @src=c16dcf35cfe1
                # | Those two reads are additions to the verifier verdict, not a replacement
                # | for it. They prove the sponsorship worked; they say nothing about which
                # | mint moved, which token program moved it, or whether the merchant-owned
                # | account was credited the record's price. A sponsored transaction earns
                # | the same treatment as a plain one.
                feedback: "Esas dos lecturas son agregados al veredicto del verificador, no un reemplazo de él. Demuestran que el patrocinio funcionó; no dicen nada sobre qué mint se movió, qué programa de tokens lo movió, ni sobre si la cuenta propiedad del comercio fue acreditada con el precio del disco. Una transacción patrocinada se gana el mismo trato que una común."  # @src=7a67b864da4f
              c:
                # | Poll the buyer's wallet balance from the client until it drops by the
                # | record's price, then mark the leg complete in the ledger.
                label: "Hazle polling al saldo de la billetera del comprador desde el cliente hasta que baje por el precio del disco, y después marca el tramo como completo en el libro mayor."  # @src=5c213e34d72e
                # | Client-side balance polling is spoofable and unreliable; the course-wide
                # | gate is the m04 server-side verifier, not any client-read shortcut.
                feedback: "El polling de saldo del lado del cliente es falsificable y no confiable; la barrera de todo el curso es el verificador de m04 del lado del servidor, no ningún atajo de lectura del cliente."  # @src=272060bc0d91
          m09l1-q3-dunning-leg:
            # | The subscription leg of your journey deliberately forces a renewal to fail
            # | against an empty ATA. For the leg to assert PASS the way the course taught
            # | dunning, what must the assembled stack do?
            prompt: "El tramo de suscripción de tu journey fuerza deliberadamente a que una renovación falle contra una ATA vacía. Para que el tramo afirme PASS como el curso enseñó dunning, ¿qué tiene que hacer el stack ensamblado?"  # @src=3b51ab3074c8
            # | The dunning case study (Helius dogfooding the official Subscriptions
            # | program) is explicit: a failed renewal is not retried against the wallet, it
            # | becomes an ordinary open invoice. The journey's forced failure asserts PASS
            # | when the backoffice ledger shows exactly that.
            explanation: "El caso de estudio de dunning (Helius haciendo dogfooding del programa oficial de Subscriptions) es explícito: una renovación fallida no se reintenta contra la billetera, se vuelve una factura abierta común. La falla forzada del journey afirma PASS cuando el libro mayor del back office muestra exactamente eso."  # @src=a25e4dd6910e
            options:                 # source order — keep it
              a:
                # | Immediately retry the pull against the buyer's wallet up to three times
                # | and then cancel the subscription if all retries fail.
                label: "Reintenta inmediatamente el pull contra la billetera del comprador hasta tres veces y después cancela la suscripción si todos los reintentos fallan."  # @src=8daabd45b661
                # | That is card-rail dunning, not the taught policy. The Helius model does
                # | NOT retry the failed renewal against the wallet.
                feedback: "Eso es dunning de rieles de tarjeta, no la política enseñada. El modelo de Helius NO reintenta la renovación fallida contra la billetera."  # @src=7d23e71f9ede
              c:
                # | Revoke the subscription authority PDA and reclaim its rent the moment
                # | the renewal fails, closing the account cleanly.
                label: "Revoca la PDA de autoridad de la suscripción y reclama su rent en el momento en que la renovación falla, cerrando la cuenta limpiamente."  # @src=5d0ca55d9d7f
                # | Rent recovery via RevokeAbandoned is the cancel path, not the failure
                # | path; a single failed renewal becomes an open invoice, it does not tear
                # | down the subscription.
                feedback: "La recuperación de rent vía RevokeAbandoned es el camino de cancelación, no el camino de falla; una sola renovación fallida se vuelve una factura abierta, no desarma la suscripción."  # @src=2d1f5e1f689a
              b:
                # | Record the failed renewal as an open invoice in the ledger, without
                # | retrying it against the wallet.
                label: "Registra la renovación fallida como una factura abierta en el libro mayor, sin reintentarla contra la billetera."  # @src=46ad9af21a5e
                # | With no way to force a pull, a ledger entry is the only durable outcome
                # | that failure produces; a state with no exit, though, is how open
                # | invoices accumulate forever.
                feedback: "Sin ninguna manera de forzar un pull, una entrada en el libro mayor es el único resultado durable que produce esa falla; un estado sin salida, eso sí, es la manera en que las facturas abiertas se acumulan para siempre."  # @src=e064c47f8e42
              d:
                # | Have the crank log the failed renewal and let the journey assert on that
                # | log line, since a failure produces no transaction to verify and no
                # | ledger row to read.
                label: "Haz que el crank loguee la renovación fallida y deja que el journey afirme sobre esa línea de log, ya que una falla no produce ninguna transacción que verificar ni ninguna fila del libro mayor que leer."  # @src=436bc4bdaad6
                # | The first half of the reasoning is right: there is no transaction, which
                # | is exactly why this leg's assertion is a ledger read rather than a
                # | verifier call. The second half is not, because the failure's whole
                # | output is a row: an open invoice in the backoffice ledger, plus the
                # | absence of any retry against the wallet. A log line is not an outcome
                # | anyone can reconcile.
                feedback: "La primera mitad del razonamiento está bien: no hay transacción, que es exactamente por lo que la afirmación de este tramo es una lectura del libro mayor y no una llamada al verificador. La segunda mitad no, porque la salida entera de esa falla es una fila: una factura abierta en el libro mayor del back office, más la ausencia de cualquier reintento contra la billetera. Una línea de log no es un resultado que alguien pueda conciliar."  # @src=30a3d9d67445
  m09-l2:
    # | Where the rails go from here
    title: "Hacia dónde van los rieles desde aquí"  # @src=a6754945a639
    blocks:
      check:                      # quiz
        questions:
          m09l2-q1-frozen-moving:
            # | You are handing this stack to a colleague in three months. Which part of
            # | what you built is MOST likely to have changed its pins or behavior by then?
            prompt: "Le vas a pasar este stack a un colega en tres meses. ¿Qué parte de lo que construiste tiene MÁS probabilidad de haber cambiado sus pins o su comportamiento para entonces?"  # @src=3fa9c04a36d4
            # | The course drew the frozen/moving line on purpose. Frozen surfaces (the
            # | Solana Pay v1 spec, the blinks tooling) are safe precisely because they are
            # | stable. The young pieces, the Subscriptions program client and the MPP
            # | specs, are the ones to re-verify before you trust their pins.
            explanation: "El curso trazó la línea congelado/móvil a propósito. Las superficies congeladas (la spec v1 de Solana Pay, el tooling de blinks) son seguras precisamente porque son estables. Las piezas jóvenes, el cliente del programa Subscriptions y las specs de MPP, son las que hay que re-verificar antes de confiarte de sus pins."  # @src=81eef4b25ad5
            options:                 # source order — keep it
              a:
                # | The Solana Pay v1 transfer-request URL format, whose spec page is
                # | visibly 2023-vintage and still names FTX and Slope in its wallet
                # | examples, so a rewrite must be overdue.
                label: "El formato de URL de transfer-request de Solana Pay v1, cuya página de spec es visiblemente de cosecha 2023 y todavía nombra a FTX y a Slope en sus ejemplos de billeteras, así que una reescritura ya debe estar atrasada."  # @src=f6db12f4ba7b
                # | The v1 spec is frozen, and frozen means stable, not stale-and-changing;
                # | the URL format is one of the LEAST likely things to move.
                feedback: "La spec v1 está congelada, y congelado quiere decir estable, no obsoleto-y-cambiante; el formato de URL es una de las cosas con MENOS probabilidad de moverse."  # @src=60c8435933a4
              c:
                # | The Subscriptions program client and MPP, since @solana/subscriptions
                # | was days old on mainnet and MPP's Solana method spec moves in a git repo
                # | with no standards-body clock on it.
                label: "El cliente del programa Subscriptions y MPP, dado que @solana/subscriptions tenía días de vida en mainnet y la spec del método de Solana de MPP se mueve en un repo de git sin ningún reloj de organismo de estándares encima."  # @src=49fb7c35ed57
                # | Churn tracks age and governance, not how dated a page looks: an
                # | unmaintained dependency stops surprising you and still accrues unfixed
                # | bugs.
                feedback: "El ritmo de cambio sigue a la edad y a la gobernanza, no a lo anticuada que parezca una página: una dependencia sin mantenimiento deja de sorprenderte y de todos modos acumula bugs sin arreglar."  # @src=97b84a6cc3f9
              d:
                # | The @solana/kit pins, since npm's latest tag already sits two majors
                # | past the 6.10 line and one past the 7.1 line you hold, and a pinned
                # | major stops resolving once the registry moves on.
                label: "Los pins de @solana/kit, dado que el tag latest de npm ya está sentado dos majors más allá de la línea 6.10 y uno más allá de la línea 7.1 que sostienes, y un major fijado deja de resolverse una vez que el registro sigue adelante."  # @src=842d62a0124e
                # | Published versions do not expire: 6.10.0 installs exactly as well the
                # | day kit 9 ships. Kit does move fast, which is why the repo pins per
                # | workspace and records why, and that is the piece you have already
                # | learned to hold still. What moves under you is the young end of the
                # | stack, where the client and the spec themselves change.
                feedback: "Las versiones publicadas no vencen: 6.10.0 se instala exactamente igual de bien el día en que se entregue kit 9. Kit sí se mueve rápido, que es la razón de que el repo fije por workspace y registre por qué, y esa es la pieza que ya aprendiste a mantener quieta. Lo que se mueve debajo de ti es el extremo joven del stack, donde cambian el cliente y la spec mismos."  # @src=fec5f58e316e
              b:
                # | The blinks Actions spec fields, since the blinks tooling was described
                # | as frozen and effectively unpublished since 2025.
                label: "Los campos de la spec de Actions de blinks, dado que el tooling de blinks se describió como congelado y efectivamente sin publicar desde 2025."  # @src=fb69876b9097
                # | Frozen tooling is the opposite of fast-moving; the blinks lane is among
                # | the LEAST likely to shift pins in three months.
                feedback: "El tooling congelado es lo opuesto a moverse rápido; el carril de blinks está entre los que tienen MENOS probabilidad de correr pins en tres meses."  # @src=77bf7cc6a6e3
          m09l2-q2-where-next:
            # | Your colleague wants to squeeze more transactions to land under load during
            # | a hot drop by tuning priority fees and Jito bundles. Which course did this
            # | one explicitly defer that depth to?
            prompt: "Tu colega quiere lograr que más transacciones aterricen bajo carga durante un drop caliente, ajustando priority fees y bundles de Jito. ¿A qué curso postergó este explícitamente esa profundidad?"  # @src=779efd4143b9
            # | This course states its boundary out loud: it gives the one-box priority-fee
            # | recipe and hands landing science, Jito, compute-budget tuning, and indexing
            # | at scale to the client-side course. The internals-why belongs to Low-Level
            # | Solana; the token internals belong to Digital Assets.
            explanation: "Este curso declara su límite en voz alta: da la receta de priority fees de una sola caja y le pasa la ciencia del aterrizaje, Jito, el ajuste del compute budget y la indexación a escala al curso de client-side. El por-qué de los internals le pertenece a Low-Level Solana; los internals de tokens le pertenecen a Digital Assets."  # @src=06fddf8c6105
            options:                 # source order — keep it
              a:
                # | The Master Solana Frontend and Client-Side Development course, which
                # | owns transaction-landing strategy.
                label: "El curso Master Solana Frontend and Client-Side Development, que es dueño de la estrategia de aterrizaje de transacciones."  # @src=748f7fb028a8
                # | The split is practice against internals, not depth against shallowness.
                feedback: "La división es práctica contra internals, no profundidad contra superficialidad."  # @src=8fc962cb67f7
              b:
                # | The Digital Assets, Tokenization and Token Extensions course, which owns
                # | the Token-2022 extensions PYUSD showed off.
                label: "El curso Digital Assets, Tokenization and Token Extensions, que es dueño de las extensiones de Token-2022 que PYUSD lucía."  # @src=008f3cfb8d6d
                # | Digital Assets owns token internals, not tx-landing; priority fees and
                # | Jito were handed to the client-side course.
                feedback: "Digital Assets es dueño de los internals de tokens, no del aterrizaje de tx; las priority fees y Jito se le pasaron al curso de client-side."  # @src=d12eee51aa0d
              c:
                # | The Low-Level Solana course, which covers the scheduler, QoS, and the
                # | leader pipeline that decide whether a transaction reaches a block at
                # | all.
                label: "El curso Low-Level Solana, que cubre el scheduler, QoS y el pipeline del líder, que deciden si una transacción llega siquiera a un bloque."  # @src=5db650c2ddc5
                # | Low-Level Solana explains WHY the runtime behaves as it does; the
                # | practical what-to-do for landing was deferred to the client-side course,
                # | not the internals course.
                feedback: "Low-Level Solana explica POR QUÉ el runtime se comporta como se comporta; el qué-hacer práctico del aterrizaje se postergó al curso de client-side, no al curso de internals."  # @src=9e77f0930882
              d:
                # | Master Anchor V2, since compute budgets and CU limits are decided in the
                # | program you deploy.
                label: "Master Anchor V2, dado que los compute budgets y los límites de CU se deciden en el programa que despliegas."  # @src=2b5e4014aa95
                # | Compute-budget instructions ride on the transaction the client builds,
                # | which is why this course's one-box recipe lives in the checkout builder
                # | and never in a program. Anchor V2 is the program-authoring door, and
                # | Wavelength shipped without a line of Rust.
                feedback: "Las instrucciones de compute budget viajan sobre la transacción que construye el cliente, que es la razón de que la receta de una sola caja de este curso viva en el constructor del checkout y nunca en un programa. Anchor V2 es la puerta de la autoría de programas, y Wavelength se entregó sin una línea de Rust."  # @src=2c622c0ac792
          m09l2-q3-frame:
            # | The course opened by decoding a dollar on mainnet and closes on the repo
            # | that changed sides. What is the single structural difference from card rails
            # | that shaped every ops decision you made, from verification to refunds?
            prompt: "El curso abrió decodificando un dólar en mainnet y cierra en el repo que cambió de bando. ¿Cuál es la única diferencia estructural con los rieles de tarjeta que le dio forma a cada decisión de operación que tomaste, desde la verificación hasta los reembolsos?"  # @src=d0ca5bb1f17e
            # | The no-chargeback asymmetry is the through-line: it is why refunds became
            # | original-construction push payments, why verification is server-side and
            # | final, and why the dispute posture differs from every card integration your
            # | colleague has done. Fast settlement and low fees are features; the missing
            # | chargeback is the structural fact.
            explanation: "La asimetría del no-chargeback es el hilo conductor: es la razón de que los reembolsos se volvieran pagos push de construcción original, de que la verificación sea del lado del servidor y definitiva, y de que la postura ante disputas se diferencie de cada integración con tarjeta que tu colega haya hecho. La liquidación rápida y las comisiones bajas son características; el chargeback ausente es el hecho estructural."  # @src=0be4eb8a9ef0
            options:                 # source order — keep it
              d:
                # | There are no chargebacks, so the risk sits with the buyer and a
                # | merchant's checks can safely run after fulfillment.
                label: "No hay chargebacks, así que el riesgo se queda con el comprador y las comprobaciones de un comercio pueden correr con seguridad después del despacho."  # @src=ecedcaebffcb
                # | The first clause is the fact and the second inverts what it implies.
                # | With no reversal to fall back on, every control moves earlier: the
                # | verifier reads the chain before an order is fulfilled, not after, and
                # | the whole back office exists because a check that runs after the record
                # | ships has nothing left to protect.
                feedback: "La primera cláusula es el hecho y la segunda invierte lo que implica. Sin ninguna reversión a la que recurrir, cada control se mueve más temprano: el verificador lee la blockchain antes de que una orden se despache, no después, y todo el back office existe porque una comprobación que corre después de que el disco se despacha no tiene nada que proteger."  # @src=cda6ec42f56c
              a:
                # | Fees are far lower on Solana, so you can afford to retry transactions
                # | much more aggressively than on card rails.
                label: "Las comisiones son mucho más bajas en Solana, así que te puedes permitir reintentar transacciones mucho más agresivamente que en los rieles de tarjeta."  # @src=d87413b33200
                # | Low fees are real but they did not shape verification, reconciliation,
                # | or refunds; the asymmetry that did was the absence of chargebacks.
                feedback: "Las comisiones bajas son reales pero no le dieron forma a la verificación, a la conciliación ni a los reembolsos; la asimetría que sí lo hizo fue la ausencia de chargebacks."  # @src=d3cf21a7c642
              c:
                # | Settlement is fast enough to be effectively instant, so reconciliation
                # | and idempotency stop mattering to a merchant.
                label: "La liquidación es lo bastante rápida para ser efectivamente instantánea, así que la conciliación y la idempotencia dejan de importarle a un comercio."  # @src=22f0eb893c1a
                # | Settlement is fast but not free of the retry-and-duplicate problem;
                # | idempotency and reconciliation mattered throughout precisely because
                # | webhooks still lie and blockhashes still expire.
                feedback: "La liquidación es rápida pero no está libre del problema de reintento-y-duplicado; la idempotencia y la conciliación importaron todo el tiempo precisamente porque los webhooks siguen mintiendo y los blockhashes siguen venciendo."  # @src=83fe26c7f96c
              b:
                # | There are no chargebacks by construction, so refunds are push payments
                # | you originate and disputes have no bank-mediated reversal.
                label: "No hay chargebacks por construcción, así que los reembolsos son pagos push que tú originas y las disputas no tienen ninguna reversión mediada por un banco."  # @src=32ef056223db
                # | Take away the reversal primitive and every control moves earlier in the
                # | flow; the risk does not vanish, it relocates, and the loss an issuer
                # | used to absorb now lands on you.
                feedback: "Quítale la primitiva de reversión y cada control se mueve más temprano en el flujo; el riesgo no se desvanece, se reubica, y la pérdida que antes absorbía un emisor ahora te aterriza a ti."  # @src=fd358eee0e58
