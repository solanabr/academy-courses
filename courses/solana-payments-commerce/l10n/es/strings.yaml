                label: "El renderizado en X está mediado por una extensión de Chrome, no es nativo, y la lista de superficies de 2026 es incierta, así que verifica al momento de escribir y nunca prometas 'se renderiza en todos lados'."  # @src=6975f32e1b7f
                # | Rendering lives in a client you do not control, and an
                # | extension-mediated unfurl reaches only the viewers who installed it.
                # | Everyone else needs the link to still open a page.
                feedback: "El renderizado vive en un cliente que no controlas, y un renderizado mediado por una extensión solo llega a los que la instalaron. Todos los demás necesitan que el link igual abra una página."  # @src=85b4e5140e9f
          q2:
            # | Your blink's action endpoint works when you hit it directly, but wallets
            # | will not load it from your domain. Which two hosting rules did you most
            # | likely miss?
            prompt: "El endpoint de action de tu blink funciona cuando lo golpeas directo, pero las billeteras no lo cargan desde tu dominio. ¿Cuáles dos reglas de hosting te saltaste, muy probablemente?"  # @src=0fd6dfc0df6c
            # | Blinks are discovered through actions.json at the domain root and loaded
            # | cross-origin, so both the actions endpoints and actions.json must send
            # | Access-Control-Allow-Origin: *. Missing either one is the classic 'works in
            # | curl, dead in a wallet' failure.
            explanation: "Los blinks se descubren a través de actions.json en la raíz del dominio y se cargan cross-origin, así que tanto los endpoints de actions como actions.json tienen que mandar Access-Control-Allow-Origin: *. Que falte cualquiera de los dos es la falla clásica de 'funciona en curl, muerta en una billetera'."  # @src=2503fdcf69ba
            options:                 # source order — keep it
              d:
                # | actions.json has to sit at the domain root, but
                # | Access-Control-Allow-Origin belongs on the action routes alone, since
                # | the discovery file is plain static JSON a browser reads without a
                # | preflight.
                label: "actions.json tiene que sentarse en la raíz del dominio, pero Access-Control-Allow-Origin le pertenece solo a las rutas de action, ya que el archivo de descubrimiento es JSON estático pelado que un navegador lee sin preflight."  # @src=832c63b38e9b
                # | The discovery fetch is cross-origin like every other one, and preflight
                # | is beside the point: a browser will not hand the response to the client
                # | without the header, whatever the method was. This is the half of the
                # | rule everyone misses.
                feedback: "El fetch de descubrimiento es cross-origin como todos los demás, y el preflight no viene al caso: un navegador no le va a entregar la respuesta al cliente sin el header, sea cual sea el método. Esta es la mitad de la regla que todo el mundo se salta."  # @src=41af3742d882
              c:
                # | You must register the domain with your RPC provider and have the wallet
                # | attach your API key header to every GET it makes, or the provider
                # | refuses the fetch.
                label: "Tienes que registrar el dominio con tu proveedor de RPC y hacer que la billetera adjunte el header de tu API key a cada GET que hace, o el proveedor rechaza el fetch."  # @src=7f889e327388
                # | Wallets do not send your RPC API key; discovery is via actions.json plus
                # | CORS, not RPC registration.
                feedback: "Las billeteras no mandan tu API key de RPC; el descubrimiento es vía actions.json más CORS, no registro de RPC."  # @src=71e6fc89b0e1
              a:
                # | actions.json must sit at the domain root mapping the path, and actions
                # | must send CORS Access-Control-Allow-Origin: * including on actions.json
                # | itself.
                label: "actions.json tiene que sentarse en la raíz del dominio mapeando la ruta, y las actions tienen que mandar CORS Access-Control-Allow-Origin: * incluido en actions.json mismo."  # @src=1512f25133c0
                # | Wallets fetch from a browser context, and a missing header makes the
                # | browser discard a reply your server sent fine; curl enforces none of
                # | that, which is why the terminal says it works.
                feedback: "Las billeteras hacen fetch desde un contexto de navegador, y un header que falta hace que el navegador descarte una respuesta que tu servidor mandó bien; curl no hace cumplir nada de eso, que es por qué la terminal dice que funciona."  # @src=ef6a3d2a79c1
              b:
                # | The endpoint must be served over HTTP/2 with a preflight-exempt POST
                # | route, and it has to hand back the transaction as raw bytes rather than
                # | base64 for the wallet to parse it.
                label: "El endpoint tiene que servirse sobre HTTP/2 con una ruta POST exenta de preflight, y tiene que devolver la transacción como bytes crudos en vez de base64 para que la billetera la parsee."  # @src=09fda7b5d33f
                # | There is no HTTP/2, preflight-exemption, or raw-bytes requirement; the
                # | transaction is base64, and the loading failure is about discovery and
                # | CORS.
                feedback: "No hay ningún requisito de HTTP/2, de exención de preflight ni de bytes crudos; la transacción es base64, y la falla de carga es sobre el descubrimiento y CORS."  # @src=3ae916e9968b
          q3:
