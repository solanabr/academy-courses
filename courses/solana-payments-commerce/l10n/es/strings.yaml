                label: "El renderizado nativo en billeteras quedó confirmado desde la ola de lanzamiento de 2024, así que el link se renderiza para cualquiera que tenga una billetera de Solana, corra o no la extensión."  # @src=3a23fcbcecb2
                # | The ecosystem pages naming specific wallets do date from that launch
