            prompt: "Entregas el drop blink y tuiteas el link, esperando que se expanda en un botón de compra en el feed de X. ¿Cuál es la realidad honesta de 2026 para diseñar a su alrededor?"  # @src=c6d9d78034c7
            # | The research confirms X rendering is Chrome-extension-mediated, and the 2026
            # | native-wallet render list is unverified. The safe design is spec conformance
            # | plus a local blinks client for the lab, with any surface claim living in a
            # | verified-at-write box. Promising a feed render you cannot guarantee is the
            # | trap.
            explanation: "La investigación confirma que el renderizado en X está mediado por una extensión de Chrome, y la lista de 2026 de renderizado nativo en billeteras está sin verificar. El diseño seguro es la conformidad con el spec más un cliente de blinks local para el lab, con cualquier afirmación sobre superficies viviendo en una caja de verificado-al-escribir. Prometer un render en el feed que no puedes garantizar es la trampa."  # @src=37710f207754
            options:                 # source order — keep it
