                label: "Solo se renderiza adentro del navegador in-app de Phantom, así que el patrón que funciona es publicar el link con una instrucción de 'ábrelo en Phantom' y aceptar que todos los demás no pueden comprar."  # @src=9924db9c75c2
                # | That is an overly specific, unverified claim; the actual render-surface
