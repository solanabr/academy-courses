locale: es

course:
  # | Solana Payments & Commerce
  title: "Pagos y comercio en Solana"  # @src=3295f0e5577a
  # | By the end you can take real money on Solana end to end, a stablecoin Solana Pay
  # | checkout and POS, a webhook-driven back office with reconciliation and refunds,
  # | non-custodial subscriptions with dunning, on/off ramps, and x402/MPP machine payments,
  # | assembled into one running commerce stack on devnet — where the course touches
  # | regulation, it is an engineering framing of the seams, not legal advice. This is a
  # | local-toolchain course from the first lab: module one already needs Node 24 and
  # | installs packages on your machine, module two adds the Anza Agave CLI (`solana` plus
  # | `spl-token`), and from there every lab runs npm workspaces locally against devnet; one
  # | step in module eight — `cargo install kora-cli` — additionally needs a Rust toolchain.
  description: "Al terminar puedes cobrar dinero de verdad en Solana de punta a punta, un checkout y una terminal (POS) de Solana Pay en stablecoin, un back office impulsado por webhooks con conciliación y reembolsos, suscripciones no custodiales con dunning, on/off ramps y pagos entre máquinas x402/MPP, todo ensamblado en un solo stack de comercio corriendo en devnet — donde el curso toca la regulación, es una lectura de ingeniería sobre las costuras, no asesoría legal. Este es un curso de toolchain local desde el primer lab: el módulo uno ya necesita Node 24 e instala paquetes en tu máquina, el módulo dos agrega la CLI de Anza Agave (`solana` más `spl-token`), y de ahí en adelante cada lab corre npm workspaces localmente contra devnet; un paso del módulo ocho — `cargo install kora-cli` — necesita además un toolchain de Rust."  # @src=3f72835ec89f
  modules:
    rails-mental-model:
      # | The rails you're switching to
      title: "Los rieles a los que te pasas"  # @src=b0dd33d75215
    stablecoin-transfers:
      # | Stablecoin transfers, down to the decimal
      title: "Transferencias de stablecoin, hasta el decimal"  # @src=a0d24a3c831e
    checkout-surfaces:
      # | Checkout surfaces: Solana Pay, the record fair, and blinks
      title: "Superficies de checkout: Solana Pay, la feria de discos y los blinks"  # @src=3476220583b0
    back-office:
      # | The back office: verify, ingest, reconcile, refund
      title: "El back office: verificar, ingestar, conciliar, reembolsar"  # @src=850433db218d
    recurring-revenue:
      # | Recurring revenue without custody
      title: "Ingresos recurrentes sin custodia"  # @src=00d1c92c3aac
    fiat-edge:
      # | The fiat edge
      title: "La frontera fiat"  # @src=893fdd4bc35b
    machine-customers:
      # | Machine customers: x402 and the agentic turn
      title: "Clientes máquina: x402 y el giro agéntico"  # @src=7cc07ca9885d
    fees-offline-golive:
      # | Fees, offline, and going live
      title: "Comisiones, offline y salir al aire"  # @src=3db42f81696e
    capstone-assembly:
      # | Capstone: Wavelength, open for business
      title: "Capstone: Wavelength, con las puertas abiertas"  # @src=cf0b9097e9f7

lessons:
  m01-l1:
    # | Watch a dollar settle: your first five minutes on Solana rails
    title: "Mira cómo se liquida un dólar: tus primeros cinco minutos en los rieles de Solana"  # @src=919f9b242170
    blocks:
      check:                      # quiz
        questions:
          m01-l1-q1:
            # | Your first-five-minutes script decoded a live USDC transfer off mainnet with
            # | no wallet, no keys, and no signup. In card-rail terms, what did you actually
            # | just do?
            prompt: "Tu script de los primeros cinco minutos decodificó una transferencia de USDC en vivo desde mainnet sin billetera, sin claves y sin registro. En términos de rieles de tarjeta, ¿qué acabas de hacer realmente?"  # @src=cfe0e269a3b9
            # | The demo needs zero setup because Solana's ledger is public and readable
            # | over any RPC. Every settled transfer (sender, amount, mint, memo) is
            # | queryable by anyone, which is the opposite of a card processor's private,
            # | permissioned dashboard. That public-by-default property is exactly what lets
            # | a merchant reconcile payments later without a PSP sitting in the middle.
            explanation: "La demo no necesita nada de configuración porque el libro mayor de Solana es público y legible sobre cualquier RPC. Cada transferencia liquidada (remitente, monto, mint, memo) es consultable por cualquiera, que es lo opuesto al panel privado y con permisos de un procesador de tarjetas. Esa propiedad de ser público por defecto es exactamente lo que le deja a un comercio conciliar pagos después sin un PSP sentado en el medio."  # @src=c7c0d4748e90
            options:                 # source order — keep it
              b:
                # | You issued a refund against someone else's charge, since the same public
                # | RPC that hands back a transfer also accepts reversal calls against the
                # | signature it returned.
                label: "Emitiste un reembolso contra el cargo de otra persona, ya que el mismo RPC público que te devuelve una transferencia también acepta llamadas de reversión contra la firma que devolvió."  # @src=aec64684cbce
                # | Reading is not writing. The RPC returned an already-settled record, and
                # | no endpoint on it can move or reverse anyone's funds; only the holder's
                # | signature can spend from an account.
                feedback: "Leer no es escribir. El RPC devolvió un registro ya liquidado, y ningún endpoint suyo puede mover ni revertir los fondos de nadie; solo la firma del titular puede gastar desde una cuenta."  # @src=cea0e19c21ac
              d:
                # | You queried a node operator's private developer mirror, so what came
                # | back is a courtesy copy of the record, not the ledger.
                label: "Consultaste el espejo privado de desarrollo de un operador de nodo, así que lo que volvió es una copia de cortesía del registro, no el libro mayor."  # @src=59cffe61eb07
                # | There is no separate reporting copy to drift out of sync with. Every
                # | node replicates the same ledger, so the record that endpoint handed you
                # | is the settlement record.
                feedback: "No hay una copia de reportes aparte con la que desincronizarse. Cada nodo replica el mismo libro mayor, así que el registro que te entregó ese endpoint es el registro de liquidación."  # @src=4156489d602e
              a:
                # | You read a stranger's already-settled payment straight from the shared
                # | ledger, because settlement records here are public by default.
                label: "Leíste el pago ya liquidado de un desconocido directo desde el libro mayor compartido, porque aquí los registros de liquidación son públicos por defecto."  # @src=3eba4bc42c48
                # | Reading needs no key because every RPC serves the same replicated
                # | ledger; the same openness puts your own sales in public view too.
                feedback: "Leer no necesita clave porque cada RPC sirve el mismo libro mayor replicado; esa misma apertura pone también tus propias ventas a la vista de todos."  # @src=19c029f711f3
              c:
                # | You re-authorized a new payment from the sender, because decoding a
                # | transfer re-broadcasts it and the network settles that same transfer
                # | again.
                label: "Volviste a autorizar un pago nuevo del remitente, porque decodificar una transferencia la vuelve a difundir y la red liquida esa misma transferencia otra vez."  # @src=caeb12862378
                # | Decoding inspects a past transaction; it never re-submits or
                # | re-authorizes anything. That payment settled exactly once, when its
                # | sender signed it.
                feedback: "Decodificar inspecciona una transacción pasada; nunca vuelve a enviar ni a autorizar nada. Ese pago se liquidó exactamente una vez, cuando su remitente lo firmó."  # @src=d0170c322e4f
          m01-l1-q2:
            # | Installing @solana/pay also dropped a `pay` CLI executable into
            # | node_modules/.bin (found by npx, never on your global PATH), and the
            # | canonical Solana Pay GitHub URL now redirects to a repo whose headline
            # | product is an agentic-payments CLI. What is the honest read of that?
            prompt: "Instalar @solana/pay también dejó un ejecutable de CLI `pay` en node_modules/.bin (que npx encuentra, nunca en tu PATH global), y la URL canónica de Solana Pay en GitHub ahora redirige a un repo cuyo producto de portada es una CLI de pagos agénticos. ¿Cuál es la lectura honesta de eso?"  # @src=64e92cd6f2ad
            # | The redirect and the bundled CLI are real signals that the Foundation's
            # | energy moved from QR checkout toward agent/HTTP payments, but 'moved energy'
            # | is not 'deleted.' The classic library is still shipped and maintained inside
            # | the same monorepo. Reading ecosystem shifts honestly (what changed versus
            # | what was actually removed) is a survival skill in a market this young.
            explanation: "El redirect y la CLI incluida son señales reales de que la energía de la Foundation se movió del checkout con código QR hacia los pagos de agentes/HTTP, pero 'energía movida' no es 'borrado'. La biblioteca clásica se sigue publicando y manteniendo dentro del mismo monorepo. Leer los giros del ecosistema con honestidad (qué cambió frente a qué se removió de verdad) es una habilidad de supervivencia en un mercado tan joven."  # @src=b427d476bd90
            options:                 # source order — keep it
              c:
                # | Your npm package was hijacked; a surprise `pay` binary is a supply-chain
                # | compromise you should remove.
                label: "Tu paquete de npm fue secuestrado; un binario `pay` sorpresa es un compromiso de cadena de suministro que deberías quitar."  # @src=d1cf68c468e3
                # | The binary is intentional: the package.json declares a `pay` bin entry.
                # | It is a documented feature of the official package, not a compromise.
                feedback: "El binario es intencional: el package.json declara una entrada bin `pay`. Es una característica documentada del paquete oficial, no un compromiso."  # @src=fafeee2499b9
              d:
                # | The package is CLI-first now: the binary replaced its TypeScript
                # | exports, so there is nothing left to import.
                label: "El paquete ahora es CLI-first: el binario reemplazó sus exports de TypeScript, así que no queda nada que importar."  # @src=714e07962338
                # | Both surfaces ship together. Step 6 of the lab imports `encodeURL` from
                # | the very package that dropped the executable into node_modules/.bin.
                feedback: "Las dos superficies se publican juntas. El paso 6 del lab importa `encodeURL` del mismísimo paquete que dejó el ejecutable en node_modules/.bin."  # @src=11dfdb0e7d07
              b:
                # | The Foundation's payments focus shifted toward agent and HTTP payments,
                # | while classic Solana Pay lives on as a subpackage.
                label: "El foco de pagos de la Foundation se corrió hacia los pagos de agentes y HTTP, mientras que el Solana Pay clásico sigue vivo como subpaquete."  # @src=5d699edc662b
                # | A redirect moves attention, not code; your package still publishes from
                # | that monorepo, and shifted attention is where maintenance eventually
                # | follows.
                feedback: "Un redirect mueve la atención, no el código; tu paquete sigue publicándose desde ese monorepo, y la atención corrida es a donde el mantenimiento termina yendo."  # @src=0cd198f3a794
              a:
                # | Classic QR-based Solana Pay was deleted; only the new agentic CLI is
                # | supported from now on.
                label: "El Solana Pay clásico basado en código QR fue borrado; de ahora en adelante solo se soporta la nueva CLI agéntica."  # @src=e1f8645bccf0
                # | Classic Solana Pay is not gone. It lives on at
                # | typescript/packages/solana-pay in the very same repo, and you will build
                # | a checkout on it in module 3.
                feedback: "El Solana Pay clásico no se fue. Sigue vivo en typescript/packages/solana-pay en el mismísimo repo, y vas a construir un checkout sobre él en el módulo 3."  # @src=8b83471d6e6b
          m01-l1-q3:
            # | A skeptical teammate says 'stablecoin payments are a toy, no mainstream
            # | payments company will touch them.' Which fact from this lesson speaks to
            # | that objection most directly?
            prompt: "Un compañero de equipo escéptico dice 'los pagos con stablecoins son un juguete, ninguna empresa de pagos masiva los va a tocar'. ¿Qué dato de esta lección responde a esa objeción más directamente?"  # @src=d1c4b5e776e7
            # | The strongest 'this is real' datum is an incumbent shipping it in
            # | production: Stripe accepts USDC-on-Solana at checkout and settles you in
            # | fiat. That is a mainstream PSP treating these rails as a first-class payment
            # | method, which is precisely the credibility signal the opener is built
            # | around.
            explanation: "El dato más fuerte de 'esto es real' es un actor establecido publicándolo en producción: Stripe acepta USDC-en-Solana en el checkout y te liquida en fiat. Eso es un PSP masivo tratando estos rieles como un método de pago de primera clase, que es precisamente la señal de credibilidad alrededor de la cual está construida la apertura."  # @src=3a7235399752
            options:                 # source order — keep it
              a:
                # | Solana's block time beats a card network's authorization round-trip, so
                # | it must be production-ready.
                label: "El tiempo de bloque de Solana le gana al viaje de ida y vuelta de autorización de una red de tarjetas, así que tiene que estar listo para producción."  # @src=96521ca06a77
                # | Speed is a property, not proof of adoption. It does not tell your
                # | teammate that a mainstream processor is actually in the market.
                feedback: "La velocidad es una propiedad, no una demostración de adopción. No le dice a tu compañero de equipo que un procesador masivo esté de verdad en el mercado."  # @src=7132fc95c013
              b:
                # | The bundled `pay` CLI wraps any shell command and clears a 402 payment
                # | challenge on your behalf.
                label: "La CLI `pay` incluida envuelve cualquier comando de shell y resuelve un desafío de pago 402 en tu nombre."  # @src=8c960cef9910
                # | That is a neat capability, but it is a Foundation tool, not evidence
                # | that an incumbent payments company adopted these rails.
                feedback: "Esa es una capacidad linda, pero es una herramienta de la Foundation, no evidencia de que una empresa de pagos establecida haya adoptado estos rieles."  # @src=a0b8b7f18e30
              d:
                # | Stablecoin float on Solana climbed from about $1.5B in December 2023 to
                # | roughly $15.87B by August 2026.
                label: "El float de stablecoins en Solana subió de alrededor de $1.5B en diciembre de 2023 a unos $15.87B para agosto de 2026."  # @src=a2fdd73c3a2c
                # | That figure is real and it is in the lesson, but float measures dollars
                # | sitting on the rails, not a payments company deciding to integrate them.
                feedback: "Esa cifra es real y está en la lección, pero el float mide dólares sentados en los rieles, no una empresa de pagos decidiendo integrarlos."  # @src=2216f6f6a61b
              c:
                # | Stripe's 'Pay with crypto' accepts USDC on Solana at checkout and
                # | settles the merchant in fiat.
                label: "El 'Pay with crypto' de Stripe acepta USDC en Solana en el checkout y liquida al comercio en fiat."  # @src=4a4a6d13b0b0
                # | An incumbent settling merchants in fiat is the evidence a skeptic
                # | accepts; it proves the rail is real, not that buyers will choose it.
                feedback: "Un actor establecido liquidando a comercios en fiat es la evidencia que un escéptico acepta; demuestra que el riel es real, no que los compradores lo vayan a elegir."  # @src=4976552d055c
  m01-l2:
    # | Finality vs the card stack: the payments mental model
    title: "Finality vs. el stack de tarjetas: el modelo mental de los pagos"  # @src=4780bf4b9f8f
    blocks:
      check:                      # quiz
        questions:
          m01-l2-q1:
            # | You are porting your card mental model. A $2,000 electronics order arrives
            # | and you must decide when to release the goods, knowing there is no
            # | chargeback path to undo the shipment. Which commitment level is the right
            # | default for a sale of that value?
            prompt: "Estás portando tu modelo mental de tarjetas. Llega un pedido de electrónica de $2,000 y tienes que decidir cuándo liberar la mercancía, sabiendo que no hay ninguna ruta de chargeback para deshacer el envío. ¿Qué nivel de commitment es la opción por defecto correcta para una venta de ese valor?"  # @src=d3b221f9d9ff
            # | Official guidance is qualitative: `confirmed` for most payments, `finalized`
            # | for high-value or compliance-sensitive ones, `processed` for UI only. The
            # | card analogy helps (finalized is like settled funds) but breaks in one
            # | direction: there is no chargeback path at any commitment level, so the only
            # | thing you are pricing with this choice is fork risk. That is why value, not
            # | disputability, is the axis — a bigger ticket makes a rare dropped block more
            # | expensive, and the extra seconds cheap by comparison.
            explanation: "La guía oficial es cualitativa: `confirmed` para la mayoría de los pagos, `finalized` para los de alto valor o sensibles a compliance, `processed` solo para la UI. La analogía de tarjeta ayuda (finalized es como fondos liquidados) pero se rompe en una dirección: no hay ninguna ruta de chargeback en ningún nivel de commitment, así que lo único a lo que le pones precio con esta elección es el riesgo de fork. Por eso el eje es el valor y no la disputabilidad — un ticket más grande hace más caro un bloque descartado raro, y los segundos extra baratos en comparación."  # @src=b280d261b952
            options:                 # source order — keep it
              d:
                # | Release once six blocks sit on top of the payment, the confirmation
                # | depth other chains taught you.
                label: "Libera una vez que seis bloques se apilen encima del pago, la profundidad de confirmación que te enseñaron otras blockchains."  # @src=d1c71225198b
                # | Solana exposes stake-weighted vote levels, not a block-depth counter,
                # | and six blocks is under two seconds at a 300ms slot. Your own ladder
                # | probe put finality some 25 to 40 slots back, so a depth heuristic
                # | borrowed from elsewhere lands well short of it.
                feedback: "Solana expone niveles de voto ponderados por stake, no un contador de profundidad de bloques, y seis bloques son menos de dos segundos a un slot de 300ms. Tu propia sonda de la escalera puso la finality unos 25 a 40 slots atrás, así que una heurística de profundidad prestada de otro lado se queda bastante corta."  # @src=a485fcf015d0
              b:
                # | Release on `processed`, treating it as the authorization hold: the RPC
                # | hands back a signature in well under a second, which is enough to print
                # | the packing slip.
                label: "Libera en `processed`, tratándolo como la retención de autorización: el RPC te devuelve una firma en bastante menos de un segundo, lo que alcanza para imprimir la nota de empaque."  # @src=e2f0ef1b8221
                # | The fast signature is real, but `processed` is UI-only and can be
                # | dropped during a fork; releasing $2,000 of goods on it is like shipping
                # | on an unconfirmed auth. Ecosystem guidance reserves it for optimistic
                # | display.
                feedback: "La firma rápida es real, pero `processed` es solo para la UI y puede ser descartado durante un fork; liberar $2,000 de mercancía sobre eso es como despachar con una autorización sin confirmar. La guía del ecosistema lo reserva para visualización optimista."  # @src=fc2f68dd3e2d
              c:
                # | Release on `confirmed` (the captured-charge equivalent), and claw the
                # | funds back later if the buyer disputes.
                label: "Libera en `confirmed` (el equivalente del cargo capturado), y revierte los fondos después si el comprador disputa."  # @src=43fa9ae1c62e
                # | `confirmed` is the sensible default for MOST payments, but the guidance
                # | reserves `finalized` for high-value and compliance-sensitive orders, and
                # | $2,000 of electronics is squarely the first. The clawback half is the
                # | card metaphor leaking: there is no later reversal on this rail, which is
                # | exactly why the decision has to be made before the goods leave.
                feedback: "`confirmed` es la opción por defecto sensata para la MAYORÍA de los pagos, pero la guía reserva `finalized` para pedidos de alto valor y sensibles a compliance, y $2,000 de electrónica es de lleno el primero. La mitad de revertir los fondos es la metáfora de tarjeta filtrándose: no hay reversión posterior en este riel, que es exactamente por qué la decisión tiene que tomarse antes de que la mercancía se vaya."  # @src=70d38efba259
              a:
                # | Wait for `finalized`: the settled-funds equivalent, since a finalized
                # | block cannot be dropped by a fork.
                label: "Espera `finalized`: el equivalente de los fondos liquidados, ya que un bloque finalized no puede ser descartado por un fork."  # @src=9d74f9fec420
                # | Right, and be precise about what those seconds buy: fork risk is the
                # | only thing a commitment level controls. It does not protect you from a
                # | dishonest buyer — nothing on this rail does — but at $2,000 the residual
                # | chance of a dropped block is worth ten seconds you would not spend on a
                # | small ticket.
                feedback: "Correcto, y sé preciso sobre qué compran esos segundos: el riesgo de fork es lo único que controla un nivel de commitment. No te protege de un comprador deshonesto — nada en este riel lo hace — pero a $2,000 la probabilidad residual de un bloque descartado vale diez segundos que no gastarías en un ticket pequeño."  # @src=45fb43f73cb8
          m01-l2-q2:
            # | A customer buys a $12 record. On card rails you would budget roughly 2.9%
            # | plus 30 cents in processor fees. What does the base network fee look like on
            # | these rails?
            prompt: "Un cliente compra un disco de $12. En los rieles de tarjeta presupuestarías alrededor de 2.9% más 30 centavos en comisiones del procesador. ¿Cómo se ve la comisión base de red en estos rieles?"  # @src=69b6c7b14d62
            # | The base fee is a flat 5000 lamports per signature, so a typical payment
            # | costs a small fraction of one cent ($0.00075 at $150 per SOL, $0.0015 at
            # | $300 — quote the band, not a baked-in dollar figure), orders of magnitude
            # | below card interchange and, more to the point, flat rather than
            # | percentage-based. That flips the economics for small-ticket sales, and it
            # | deletes the float: nothing is held back on a schedule, so there is nothing
            # | to anticipate. Account creation has its own one-time rent cost, which you
            # | meet next module where token accounts appear.
            explanation: "La comisión base es de 5000 lamports planos por firma, así que un pago típico cuesta una fracción pequeña de un centavo ($0.00075 a $150 por SOL, $0.0015 a $300 — cita la banda, no una cifra en dólares incrustada), órdenes de magnitud por debajo del intercambio de tarjeta y, más al punto, plana y no basada en porcentaje. Eso da vuelta la economía de las ventas de ticket pequeño, y borra el float: nada se retiene en un calendario, así que no hay nada que anticipar. La creación de cuentas tiene su propio costo único de rent, que conoces el próximo módulo donde aparecen las cuentas de token."  # @src=32ed615423d6
            options:                 # source order — keep it
              d:
                # | A flat fee, but netted out of the USDC itself, so the customer's $12
                # | arrives as a little less than $12.
                label: "Una comisión plana, pero descontada del propio USDC, así que los $12 del cliente llegan como un poco menos de $12."  # @src=37d7ad1c0af9
                # | The card habit of netting the cut out of the sale does not port. Fees
                # | are paid in SOL by whoever signs, and the USDC leg moves the exact
                # | amount the transfer names, so your $12 arrives as $12.
                feedback: "La costumbre de tarjeta de descontar la tajada de la venta no se porta. Las comisiones las paga en SOL quien firma, y la pata de USDC mueve el monto exacto que nombra la transferencia, así que tus $12 llegan como $12."  # @src=4b988045fe66
              b:
                # | A flat 5000-lamport base fee, so a typical payment costs a small
                # | fraction of a cent whatever the size.
                label: "Una comisión base plana de 5000 lamports, así que un pago típico cuesta una fracción pequeña de centavo sea cual sea el tamaño."  # @src=89ca7ffbc76c
                # | Fees price signatures, not value; ticket size drops out of the math.
                feedback: "Las comisiones le ponen precio a las firmas, no al valor; el tamaño del ticket sale de la cuenta."  # @src=995e369c9027
              c:
                # | Nothing at all: Solana transfers are free, and the SOL you hold pays for
                # | account creation rather than for sends.
                label: "Nada en absoluto: las transferencias de Solana son gratis, y el SOL que tienes paga la creación de cuentas y no los envíos."  # @src=3465a3761648
                # | Not free: every transaction pays a base fee of 5000 lamports plus any
                # | priority fee. It is tiny, but budgeting it as literally zero will bite
                # | you at scale and on account creation.
                feedback: "No es gratis: cada transacción paga una comisión base de 5000 lamports más cualquier comisión de prioridad. Es diminuta, pero presupuestarla como literalmente cero te va a morder a escala y en la creación de cuentas."  # @src=ca26d7c5c374
              a:
                # | A percentage of the sale skimmed by validators, in the low tenths of a
                # | percent, so a $1,200 order costs a hundred times what a $12 one does to
                # | move on-chain.
                label: "Un porcentaje de la venta que se llevan los validadores, en las décimas bajas de un por ciento, así que un pedido de $1,200 cuesta cien veces lo que cuesta uno de $12 mover on-chain."  # @src=22e2baae38b2
                # | Network fees here are not a percentage of value, and validators take no
                # | cut of the amount transferred. The base fee is flat per signature and
                # | independent of the sum moved.
                feedback: "Las comisiones de red aquí no son un porcentaje del valor, y los validadores no se llevan ninguna tajada del monto transferido. La comisión base es plana por firma e independiente de la suma movida."  # @src=dd27794e08cf
          m01-l2-q3:
            # | Your finance lead loves that 'chargebacks don't exist' on these rails. What
            # | is the honest other half of that trade you should tell them?
            prompt: "A tu líder de finanzas le encanta que 'los chargebacks no existen' en estos rieles. ¿Cuál es la otra mitad honesta de ese canje que deberías contarle?"  # @src=862e406c5cbe
            # | No chargebacks is a genuine merchant win, but it is an asymmetry, not a free
            # | lunch. Because settled transfers are irreversible, refunds become push
            # | payments you construct yourself (there is no refunds page in the official
            # | docs; you build that logic in module 4), and an erroneous payment has no
            # | bank to call. Naming both halves is the entire point of a payments mental
            # | model.
            explanation: "No tener chargebacks es una ganancia genuina para el comercio, pero es una asimetría, no un almuerzo gratis. Como las transferencias liquidadas son irreversibles, los reembolsos se vuelven pagos push que construyes tú mismo (no hay página de reembolsos en la documentación oficial; esa lógica la construyes en el módulo 4), y un pago erróneo no tiene banco al que llamar. Nombrar las dos mitades es todo el punto de un modelo mental de pagos."  # @src=a2fc6ab820ac
            options:                 # source order — keep it
              c:
                # | Reversibility is now yours: refunds are push payments you build, and a
                # | mis-send has no institutional undo.
                label: "La reversibilidad ahora es tuya: los reembolsos son pagos push que construyes, y un envío equivocado no tiene marcha atrás institucional."  # @src=dd3353ddd2f5
                # | Settlement finality moves the reversal function out of the network and
                # | into your application code; a refund you can rebuild, a mis-send you
                # | cannot.
                feedback: "La finality de la liquidación saca la función de reversión de la red y la mete en el código de tu aplicación; un reembolso lo puedes reconstruir, un envío equivocado no."  # @src=de9972d6af3f
              b:
                # | The network auto-reverses fraudulent transfers, so you still get
                # | card-style protection at no cost.
                label: "La red revierte automáticamente las transferencias fraudulentas, así que todavía consigues protección estilo tarjeta sin costo."  # @src=469a04707d10
                # | The network never reverses a settled transfer. There is no automatic
                # | clawback; anyone promising card-style protection 'for free' is
                # | misreading the rails.
                feedback: "La red nunca revierte una transferencia liquidada. No hay reversión automática; cualquiera que prometa protección estilo tarjeta 'gratis' está leyendo mal los rieles."  # @src=40af0e577a77
              a:
                # | Nothing much; no chargebacks just means lower risk, with no offsetting
                # | downside for the merchant.
                label: "Nada importante; no tener chargebacks solo quiere decir menos riesgo, sin ninguna desventaja que lo compense para el comercio."  # @src=f10757d81787
                # | There is a downside: the same finality that removes chargeback fraud
                # | also removes the institutional safety net customers may expect, and
                # | shifts all refund logic onto you.
                feedback: "Hay una desventaja: la misma finality que quita el fraude por chargeback también quita la red de seguridad institucional que los clientes pueden esperar, y traslada toda la lógica de reembolsos hacia ti."  # @src=b0e9d3e87e97
              d:
                # | Your customers lose their safety net, but that is between them and their
                # | wallet, not a merchant concern.
                label: "Tus clientes pierden su red de seguridad, pero eso es entre ellos y su billetera, no un asunto del comercio."  # @src=59a4e742fa69
                # | The lost safety net lands on your support queue, not theirs. Buyers will
                # | still demand refunds, and since the rails hand you no reversal path,
                # | satisfying them is work you schedule and fund.
                feedback: "La red de seguridad perdida cae en tu fila de soporte, no en la de ellos. Los compradores van a seguir exigiendo reembolsos, y como los rieles no te entregan ninguna ruta de reversión, satisfacerlos es trabajo que programas y financias."  # @src=961faef108d8
          m01-l2-q4:
            # | Given everything in this lesson, which sale is the WEAKEST fit for
            # | stablecoin rails today?
            prompt: "Dado todo lo de esta lección, ¿cuál venta es el encaje MÁS DÉBIL para los rieles de stablecoins hoy?"  # @src=37548aa1c497
            # | The rails shine for low-fee, instant-settlement flows, which is why 2025 saw
            # | over $1 trillion in stablecoin volume on Solana. They fit worst where the
            # | buyer's core expectation is bank-backed reversibility and dispute rights,
            # | because no-chargeback finality removes exactly that. 'When not to use it' is
            # | a feature of an honest mental model, not a hedge.
            explanation: "Los rieles brillan en flujos de comisión baja y liquidación instantánea, que es por qué 2025 vio más de $1 billón en volumen de stablecoins en Solana. Encajan peor donde la expectativa central del comprador es reversibilidad y derechos de disputa respaldados por el banco, porque la finality sin chargebacks quita exactamente eso. 'Cuándo no usarlo' es un feature de un modelo mental honesto, no una evasiva."  # @src=e1227c83d318
            options:                 # source order — keep it
              d:
                # | A B2B invoice where both sides sign a contract that carries the dispute
                # | rather than the network.
                label: "Una factura B2B donde las dos partes firman un contrato que carga la disputa en lugar de la red."  # @src=2f1f17c8dff3
                # | Ticket size is not what makes a sale a poor fit. When a signed contract
                # | already carries the dispute process, nothing is depending on the
                # | bank-backed undo that finality removes.
                feedback: "El tamaño del ticket no es lo que hace de una venta un mal encaje. Cuando un contrato firmado ya carga el proceso de disputa, nada depende de la marcha atrás respaldada por el banco que la finality quita."  # @src=87d43884c7b3
              b:
                # | A small-ticket sale where percentage-based card interchange eats most of
                # | the ticket and the acquirer sits on the money for a month.
                label: "Una venta de ticket pequeño donde el intercambio de tarjeta basado en porcentaje se come la mayor parte del ticket y el adquirente se sienta sobre el dinero un mes."  # @src=c4af3b874836
                # | This is a strong fit, not a weak one; flat sub-cent fees are exactly
                # | where these rails beat percentage-based interchange, and settling in
                # | seconds deletes both the D+30 wait and the fee for escaping it.
                feedback: "Este es un encaje fuerte, no uno débil; las comisiones planas por debajo del centavo son exactamente donde estos rieles le ganan al intercambio basado en porcentaje, y liquidar en segundos borra tanto la espera D+30 como la comisión por escapar de ella."  # @src=1599ba3afa92
              a:
                # | A high-fraud consumer buy where the shopper expects bank-backed dispute
                # | rights and reversal on demand.
                label: "Una compra de consumo con mucho fraude donde el comprador espera derechos de disputa respaldados por el banco y reversión a pedido."  # @src=c1bcd26563ff
                # | The poor fit is the shopper's expectation of an institutional undo,
                # | which finality removes by design. High value alone is not the problem,
                # | since a contract can carry the dispute.
                feedback: "El mal encaje es la expectativa del comprador de una marcha atrás institucional, que la finality quita por diseño. El valor alto por sí solo no es el problema, ya que un contrato puede cargar la disputa."  # @src=ca1f6ed133eb
              c:
                # | A merchant who wants instant, low-fee settlement with no multi-day
                # | holding periods on funds.
                label: "Un comercio que quiere liquidación instantánea y de comisión baja sin períodos de retención de varios días sobre los fondos."  # @src=fbdee31a5352
                # | Also a strong fit: instant settlement with no holding times is a
                # | headline advantage of these rails, not a reason to avoid them.
                feedback: "También un encaje fuerte: la liquidación instantánea sin tiempos de retención es una ventaja de titular de estos rieles, no una razón para evitarlos."  # @src=a490cb1f2571
  m02-l1:
    # | Anatomy of a USDC payment: mints, ATAs, and the transfer-kit
    title: "Anatomía de un pago en USDC: mints, ATAs y el transfer-kit"  # @src=7285070e092f
    blocks:
      decimals-safe-base-units:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Split the string on '.' and pad or read the fractional part to exactly
          # | `decimals` digits.
          0: "Parte el string en '.' y rellena o lee la parte fraccionaria a exactamente `decimals` dígitos."  # @src=5d7cc0365503
          # | Scale the whole part into the same units as the padded fraction, then add them
          # | as two bigints; a single float step anywhere in that combination reintroduces
          # | the exact rounding bug this challenge kills.
          1: "Escala la parte entera a las mismas unidades que la fracción rellenada, después súmalas como dos bigints; un solo paso con float en cualquier parte de esa combinación reintroduce exactamente el bug de redondeo que este desafío mata."  # @src=feed1f2c4142
        tests:                      # keyed by test case id
          t1:
            # | 12.5 USDC becomes 12,500,000 base units
            description: "12.5 USDC se vuelven 12,500,000 unidades base"  # @src=02c633ebd236
          t2:
            # | one micro-USDC is the smallest representable unit
            description: "un micro-USDC es la unidad más pequeña representable"  # @src=6f8bc3cedc8e
          t3:
            # | a whole amount with no decimal point
            description: "un monto entero sin punto decimal"  # @src=13b30eab1f07
          t4:
            # | a large amount stays exact past the float safe-integer ceiling
            description: "un monto grande se mantiene exacto más allá del techo de enteros seguros del float"  # @src=35a46479ebb9
          t5:
            # | a 2-decimal mint scales by 100: the exponent comes from the decimals
            # | argument, never from USDC's 6
            description: "un mint de 2 decimales escala por 100: el exponente viene del argumento decimals, nunca del 6 de USDC"  # @src=a4376353d7b3
          t6:
            # | a 0-decimal mint has no fractional part at all and base units equal the
            # | whole amount
            description: "un mint de 0 decimales no tiene ninguna parte fraccionaria y las unidades base son iguales al monto entero"  # @src=12b25e52bbd3
      parse-checkout-amount:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The five reasons are not independent: an amount can be both too-precise and
          # | too-large at once, and the contract's listed order (empty, malformed,
          # | negative, too-precise, too-large) decides which one is reported.
          0: "Las cinco razones no son independientes: un monto puede ser a la vez too-precise y too-large, y el orden listado del contrato (empty, malformed, negative, too-precise, too-large) decide cuál se reporta."  # @src=f35337d72edb
          # | The u64 ceiling applies to the assembled integer, not to the string. A short
          # | string can still exceed 2**64 - 1 base units once the mint's decimals scale
          # | it.
          1: "El techo de u64 aplica al entero ensamblado, no al string. Un string corto todavía puede exceder 2**64 - 1 unidades base una vez que los decimals del mint lo escalan."  # @src=48b9993cb492
          # | The exact conversion is the rung you already cleared. The new work here is
          # | deciding which of the five reasons applies.
          2: "La conversión exacta es el peldaño que ya superaste. El trabajo nuevo aquí es decidir cuál de las cinco razones aplica."  # @src=89fdb1d2e26c
        tests:                      # keyed by test case id
          t1-canonical:
            # | The everyday case: 12.5 USDC is 12,500,000 base units.
            description: "El caso de todos los días: 12.5 USDC son 12,500,000 unidades base."  # @src=9809415aa663
          t2-no-decimal-point:
            # | A whole amount with no decimal point at all still scales by the mint's
            # | decimals.
            description: "Un monto entero sin ningún punto decimal todavía escala por los decimals del mint."  # @src=8a3ebafeaf67
          t3-smallest-unit:
            # | One micro-USDC is the smallest representable amount and must survive the
            # | parse.
            description: "Un micro-USDC es el monto más pequeño representable y tiene que sobrevivir el parseo."  # @src=f5db91ce9173
          t4-leading-and-trailing-zeros:
            # | Leading zeros and a trailing zero inside the mint's precision are ugly, not
            # | wrong.
            description: "Los ceros al inicio y un cero al final dentro de la precisión del mint son feos, no incorrectos."  # @src=fd15ed8ed531
          t5-surrounding-whitespace:
            # | Whitespace around a pasted amount is an artifact of the paste, not an error.
            description: "El espacio en blanco alrededor de un monto pegado es un artefacto del pegado, no un error."  # @src=b2501e635979
          t6-two-decimal-mint:
            # | 7.07 on a 2-decimal mint is 707 base units: the scale comes from the mint,
            # | never from USDC's 6.
            description: "7.07 en un mint de 2 decimales son 707 unidades base: la escala viene del mint, nunca del 6 de USDC."  # @src=ff4ff9a68bce
          t7-past-the-float-ceiling:
            # | A base-unit value above 2**53 stays exact to the last digit; any float step
            # | rounds it.
            description: "Un valor en unidades base por encima de 2**53 se mantiene exacto hasta el último dígito; cualquier paso con float lo redondea."  # @src=4b0c172843a5
          t8-trailing-zeros-past-decimals-are-not-precision:
            # | Seven fraction digits, but the seventh is a zero: 1.5000000 is exactly
            # | 1500000 base units and parses. Counting the fraction's LENGTH rejects a
            # | representable amount.
            description: "Siete dígitos de fracción, pero el séptimo es un cero: 1.5000000 son exactamente 1500000 unidades base y parsea. Contar la LONGITUD de la fracción rechaza un monto representable."  # @src=ed92c7f69324
          t9-zero-parses:
            # | Zero is a successful parse, not a failure: 0n is falsy, and a truthiness
            # | test on the amount turns a valid parse into a refusal.
            description: "El cero es un parseo exitoso, no una falla: 0n es falsy, y una prueba de veracidad sobre el monto convierte un parseo válido en una negativa."  # @src=1990c8973b85
          t10-u64-ceiling-is-payable:
            # | 18446744073709.551615 at 6 decimals is exactly u64::MAX base units: the
            # | largest amount a transfer can carry, and it must parse.
            description: "18446744073709.551615 con 6 decimals son exactamente u64::MAX unidades base: el monto más grande que una transferencia puede llevar, y tiene que parsear."  # @src=fdcbbc4f662d
          t11-over-precision-rejected:
            # | A non-zero seventh digit on a 6-decimal mint is unrepresentable. Truncating
            # | or rounding it invents sub-cent money and reconciles wrong forever.
            description: "Un séptimo dígito distinto de cero en un mint de 6 decimales es irrepresentable. Truncarlo o redondearlo inventa dinero de sub-centavo y concilia mal para siempre."  # @src=cde38c7770d4
          t12-over-precision-is-per-mint:
            # | Three fraction digits on a 2-decimal mint is over-precise, even though the
            # | same string is fine on USDC.
            description: "Tres dígitos de fracción en un mint de 2 decimales es exceso de precisión, aunque el mismo string esté bien en USDC."  # @src=dda2b7ed10b5
          t13-one-unit-past-u64:
            # | One base unit above u64::MAX cannot be carried by an SPL transfer, so the
            # | parse refuses it rather than handing the chain an amount that overflows.
            description: "Una unidad base por encima de u64::MAX no puede ser llevada por una transferencia SPL, así que el parseo la rechaza en vez de entregarle a la blockchain un monto que hace overflow."  # @src=24301ee7a631
          t14-negative:
            # | A well-formed amount with a leading minus is refused as negative: a checkout
            # | never charges below zero.
            description: "Un monto bien formado con un menos al inicio se rechaza como negative: un checkout nunca cobra por debajo de cero."  # @src=519c7058e4fd
          t15-currency-symbol:
            # | A pasted currency symbol is malformed input, not an amount to be salvaged.
            description: "Un símbolo de moneda pegado es entrada malformed, no un monto que haya que rescatar."  # @src=b238627f6426
          t16-digits-then-garbage:
            # | A string that merely STARTS with digits is malformed; a parse that reads the
            # | leading number and ignores the rest charges 12 for '12abc'.
            description: "Un string que apenas EMPIEZA con dígitos es malformed; un parseo que lee el número inicial e ignora el resto cobra 12 por '12abc'."  # @src=23cdb4d2deb6
          t17-empty-field:
            # | An untouched field is empty, a distinct reason from malformed, so the form
            # | can say 'enter an amount'.
            description: "Un campo sin tocar es empty, una razón distinta de malformed, para que el formulario pueda decir 'ingresa un monto'."  # @src=60761ea183db
          t18-whitespace-only-field:
            # | A field holding only spaces is also empty: trim first, then decide.
            description: "Un campo que solo tiene espacios también es empty: recorta primero, después decide."  # @src=c87e5f38ddf4
          t19-bare-decimal-point:
            # | A lone decimal point has no digits on either side: malformed, never zero.
            description: "Un punto decimal solitario no tiene dígitos a ninguno de los dos lados: malformed, nunca cero."  # @src=0ce853567607
          t20-negative-precedence:
            # | A leading minus followed by non-digit garbage is malformed, not negative: an
            # | implementation that decides negative from a startsWith('-') check before
            # | confirming the rest is a well-formed decimal misreads it.
            description: "Un menos al inicio seguido de basura que no son dígitos es malformed, no negative: una implementación que decide negative a partir de una comprobación startsWith('-') antes de confirmar que el resto es un decimal bien formado lo lee mal."  # @src=54efeecf49c1
      check:                      # quiz
        questions:
          m02l1-q1:
            # | You compute a 12,500-USDC transfer in the browser as `amount * 10 ** 6`
            # | using ordinary JavaScript numbers. Small test payments look perfect. What
            # | actually happens at scale?
            prompt: "Calculas una transferencia de 12,500 USDC en el navegador como `amount * 10 ** 6` usando números ordinarios de JavaScript. Los pagos de prueba pequeños se ven perfectos. ¿Qué pasa de verdad a escala?"  # @src=ab7056f93b7f
            # | Money math must be exact. Base units are integers, and a mint balance can
            # | exceed JavaScript's 2**53 safe-integer ceiling, so any float step can round
            # | a transfer off by cents without any error. Parse the decimal string directly
            # | into a bigint, which is exactly what toBaseUnits does.
            explanation: "La matemática de dinero tiene que ser exacta. Las unidades base son enteros, y un saldo de mint puede exceder el techo de enteros seguros de 2**53 de JavaScript, así que cualquier paso con float puede redondear una transferencia y desviarla por centavos sin ningún error. Parsea el string decimal directamente a un bigint, que es exactamente lo que hace toBaseUnits."  # @src=77819784fc12
            options:                 # source order — keep it
              c:
                # | It throws a TypeError as soon as the product crosses
                # | Number.MAX_SAFE_INTEGER, so the failure surfaces loudly in staging.
                label: "Lanza un TypeError en cuanto el producto cruza Number.MAX_SAFE_INTEGER, así que la falla sale a la superficie en voz alta en staging."  # @src=b487221d4443
                # | `10 ** 6` evaluates fine with ordinary numbers and nothing throws at
                # | MAX_SAFE_INTEGER; the bug is silent precision loss, not a raised error.
                feedback: "`10 ** 6` evalúa bien con números ordinarios y nada lanza en MAX_SAFE_INTEGER; el bug es pérdida silenciosa de precisión, no un error levantado."  # @src=e8752cec1b00
              d:
                # | Rounding with Math.round fixes it: the error is always sub-unit, so the
                # | integer is recoverable.
                label: "Redondear con Math.round lo arregla: el error es siempre sub-unidad, así que el entero es recuperable."  # @src=9da54f70b607
                # | Math.round buys you a passing test suite and a time bomb. Past 2 to the
                # | 53rd a double cannot represent every integer, so the drift becomes whole
                # | base units and there is no nearest-integer to round back to.
                feedback: "Math.round te compra una suite de pruebas que pasa y una bomba de tiempo. Más allá de 2 a la 53ª un double no puede representar cada entero, así que la deriva se vuelve unidades base enteras y no hay ningún entero más cercano al que redondear de vuelta."  # @src=501b66660d8e
              b:
                # | It silently rounds past 2**53, so large transfers send the wrong number
                # | of cents and nothing throws.
                label: "Redondea en silencio más allá de 2**53, así que las transferencias grandes mandan el número equivocado de centavos y nada lanza."  # @src=c0ed416c3a84
                # | Doubles are exact only to 2**53, and the product gets rounded rather
                # | than rejected. A rounding helper cannot repair what a bigint parse would
                # | have prevented.
                feedback: "Los doubles son exactos solo hasta 2**53, y el producto se redondea en vez de rechazarse. Un helper de redondeo no puede reparar lo que un parseo con bigint habría prevenido."  # @src=cb09064811c3
              a:
                # | It is fine because JavaScript numbers are 64-bit and cover every USDC
                # | amount exactly.
                label: "Está bien porque los números de JavaScript son de 64 bits y cubren cada monto de USDC exactamente."  # @src=38ab7813dd9b
                # | 64-bit doubles are only exact for integers up to 2**53; base-unit values
                # | above that (about 9 billion USDC) start rounding.
                feedback: "Los doubles de 64 bits solo son exactos para enteros hasta 2**53; los valores en unidades base por encima de eso (alrededor de 9 mil millones de USDC) empiezan a redondear."  # @src=ba445bef521c
          m02l1-q2:
            # | Bob has never held USDC. You want to send him some from transfer-kit. What
            # | must happen first, and who pays for it?
            prompt: "Bob nunca ha tenido USDC. Le quieres mandar algo desde transfer-kit. ¿Qué tiene que pasar primero, y quién lo paga?"  # @src=04cb28bd8e40
            # | An ATA is the deterministic per-(owner, mint) account that holds a token
            # | balance. A first-time holder has none, so the payment transaction (or a
            # | prior one) must create and rent-fund it at the rent-exempt minimum for 165
            # | bytes. Ask the cluster for that number rather than memorizing one: SIMD-0437
            # | is stepping the per-byte rate down, so it differs between mainnet and devnet
            # | today and falls again on each step. That is a real cost and an extra failure
            # | mode on every new customer.
            explanation: "Una ATA es la cuenta determinista por (dueño, mint) que guarda un saldo de token. Quien lo tiene por primera vez no tiene ninguna, así que la transacción de pago (o una anterior) tiene que crearla y financiarle el rent al mínimo exento de rent de 165 bytes. Pídele ese número al clúster en vez de memorizar uno: SIMD-0437 está bajando por pasos la tasa por byte, así que hoy difiere entre mainnet y devnet y vuelve a caer en cada paso. Ese es un costo real y un modo de falla extra en cada cliente nuevo."  # @src=c04d289233f6
            options:                 # source order — keep it
              c:
                # | His associated token account for the USDC mint must be created and
                # | rent-funded, at whatever getMinimumBalanceForRentExemption(165)
                # | currently returns, by whoever includes the create instruction.
                label: "Su associated token account para el mint de USDC tiene que ser creada y financiada con rent, a lo que sea que getMinimumBalanceForRentExemption(165) devuelva actualmente, por quien sea que incluya la instrucción de creación."  # @src=3cb0e167ae02
                # | Once per buyer per mint, and it is usually you who funds the rent.
                feedback: "Una vez por comprador por mint, y por lo general eres tú quien financia el rent."  # @src=064120bc458f
              b:
                # | Bob must first call approve on the USDC mint to authorize your wallet as
                # | a delegate, and he signs and pays for that approval transaction before
                # | any transfer to him can succeed.
                label: "Bob tiene que llamar primero a approve en el mint de USDC para autorizar tu billetera como delegado, y él firma y paga esa transacción de aprobación antes de que cualquier transferencia hacia él pueda tener éxito."  # @src=6b6647f54128
                # | Approve delegates a balance the signer already holds; a first-time
                # | receiver has nothing to delegate, and receiving needs no authorization
                # | from Bob at all.
                feedback: "Approve delega un saldo que el firmante ya tiene; quien recibe por primera vez no tiene nada que delegar, y recibir no necesita ninguna autorización de Bob."  # @src=2d0ececbd46f
              d:
                # | Bob has to open his own USDC account and fund the rent himself first, so
                # | your checkout has to send him through a wallet flow and wait for him to
                # | finish before it can charge him.
                label: "Bob tiene que abrir su propia cuenta de USDC y financiar el rent él mismo primero, así que tu checkout tiene que mandarlo por un flujo de billetera y esperar a que termine antes de poder cobrarle."  # @src=feda472934fc
                # | Anyone can open an ATA for anyone, and the idempotent create instruction
                # | rides in the same transaction as the transfer. Bob never has to do
                # | anything, which is the whole reason a first-time buyer can pay you in
                # | one scan.
                feedback: "Cualquiera puede abrir una ATA para cualquiera, y la instrucción de creación idempotente viaja en la misma transacción que la transferencia. Bob nunca tiene que hacer nada, que es toda la razón por la que un comprador que llega por primera vez te puede pagar en un solo escaneo."  # @src=26ad4628db8d
              a:
                # | Nothing extra: the token program credits his wallet address directly, so
                # | the balance simply appears there the moment your transfer lands, the
                # | same way a SOL transfer does.
                label: "Nada extra: el token program le acredita su dirección de billetera directamente, así que el saldo simplemente aparece ahí en el momento en que tu transferencia aterriza, igual que lo hace una transferencia de SOL."  # @src=27935efeb902
                # | A wallet cannot hold an SPL token directly; tokens live in a per-mint
                # | token account, which must exist first.
                feedback: "Una billetera no puede guardar un token SPL directamente; los tokens viven en una token account por mint, que tiene que existir primero."  # @src=c4f3aea160c2
          m02l1-q3:
            # | Your kit sends with TransferChecked and attaches a reference key. What do
            # | those two choices buy you?
            prompt: "Tu kit manda con TransferChecked y adjunta una reference key. ¿Qué te compran esas dos decisiones?"  # @src=2d7c0193df31
            # | TransferChecked pins the mint and decimals so a mismatched transfer is
            # | rejected rather than silently mis-sent. A reference key is an extra
            # | non-signer account you include purely so reconciliation can locate the
            # | payment later by searching signatures for that key, the pattern the whole
            # | back office will lean on.
            explanation: "TransferChecked fija el mint y los decimals para que una transferencia con discrepancia se rechace en vez de mandarse mal en silencio. Una reference key es una cuenta extra no firmante que incluyes puramente para que la conciliación pueda ubicar el pago después buscando firmas para esa clave, el patrón en el que se va a apoyar todo el back office."  # @src=31775c6c8db5
            options:                 # source order — keep it
              b:
                # | TransferChecked encrypts the transfer amount on-chain, and the reference
                # | key is the payer's signature over the transfer.
                label: "TransferChecked cifra el monto de la transferencia on-chain, y la reference key es la firma del payer sobre la transferencia."  # @src=69a58874551b
                # | TransferChecked does not encrypt anything (that is a
                # | confidential-transfer extension), and a reference key is an unrelated
                # | non-signer marker, not a signature.
                feedback: "TransferChecked no cifra nada (eso es una extensión de transferencia confidencial), y una reference key es un marcador no firmante sin relación, no una firma."  # @src=7dd702262420
              c:
                # | TransferChecked is required only for Token-2022 mints, so a classic USDC
                # | send can skip it, and the reference key names the account that pays the
                # | transaction fee instead of the sender's wallet.
                label: "TransferChecked solo se requiere para mints de Token-2022, así que un envío de USDC clásico puede saltárselo, y la reference key nombra la cuenta que paga la comisión de la transacción en vez de la billetera del que manda."  # @src=d3b171dd43b6
                # | TransferChecked works for classic Token mints too, and the fee payer is
                # | whichever signer the transaction names as fee payer, never a reference
                # | key.
                feedback: "TransferChecked funciona también para mints de Token clásico, y el fee payer es el firmante que sea que la transacción nombre como fee payer, nunca una reference key."  # @src=77d0d6431b4c
              a:
                # | TransferChecked verifies the mint and decimals inside the instruction,
                # | and the reference key is a non-signer address you attach so
                # | reconciliation can find the payment later.
                label: "TransferChecked verifica el mint y los decimals dentro de la instrucción, y la reference key es una dirección no firmante que adjuntas para que la conciliación pueda encontrar el pago después."  # @src=a30623023335
                # | Account keys are indexed, which is why the marker is findable and also
                # | why it isn't secret; anyone can attach the same one, and the fields are
                # | what decide.
                feedback: "Las claves de cuenta están indexadas, que es por lo que el marcador es localizable y también por lo que no es secreto; cualquiera puede adjuntar la misma, y los campos son los que deciden."  # @src=3bc195344d1a
              d:
                # | TransferChecked proves the sender actually owns the funds, and the
                # | reference key is a private marker your checkout alone knows, so a match
                # | proves the payment came from your form.
                label: "TransferChecked demuestra que el que manda de verdad es dueño de los fondos, y la reference key es un marcador privado que solo tu checkout conoce, así que una coincidencia demuestra que el pago vino de tu formulario."  # @src=93bf229dc0f5
                # | A reference key is an ordinary account address riding in a public
                # | transaction, so anyone reading the ledger can see it and reuse it. It
                # | tells you where to look for a payment; the amount, mint and destination
                # | are what tell you the payment is yours.
                feedback: "Una reference key es una dirección de cuenta ordinaria que viaja en una transacción pública, así que cualquiera que lea el libro mayor puede verla y reusarla. Te dice dónde buscar un pago; el monto, el mint y el destino son los que te dicen que el pago es tuyo."  # @src=3bd7fc831c33
          m02l1-q4:
            # | Your send times out with no confirmation. You are not sure it landed. What
            # | is the safe move?
            prompt: "A tu envío se le vence el tiempo sin confirmación. No estás seguro de que aterrizó. ¿Cuál es la movida segura?"  # @src=01da5e191af0
            # | The same signed transaction always hashes to the same signature, and the
            # | network rejects a duplicate signature, so resubmitting identical bytes is
            # | idempotent and lands at most once while the blockhash is valid (~150
            # | blocks). Send with maxRetries 0 and manage retries yourself with the same
            # | bytes; rebuild only after the blockhash truly expires and
            # | getSignatureStatuses (with searchTransactionHistory) confirms the original
            # | never landed.
            explanation: "La misma transacción firmada siempre hashea a la misma firma, y la red rechaza una firma duplicada, así que reenviar bytes idénticos es idempotente y aterriza como máximo una vez mientras el blockhash sea válido (~150 bloques). Manda con maxRetries 0 y administra los reintentos tú mismo con los mismos bytes; reconstruye solo después de que el blockhash venza de verdad y getSignatureStatuses (con searchTransactionHistory) confirme que el original nunca aterrizó."  # @src=119b7aee11b6
            options:                 # source order — keep it
              b:
                # | Resubmit the exact same signed transaction; identical bytes produce the
                # | same signature, so it can land at most once within the ~150-block
                # | window.
                label: "Reenvía exactamente la misma transacción firmada; los bytes idénticos producen la misma firma, así que puede aterrizar como máximo una vez dentro de la ventana de ~150 bloques."  # @src=8367317a2712
                # | Duplicate signatures are rejected by the network, which is what makes
                # | resending idempotent; the guarantee dies with the blockhash, and only
                # | after it expires is rebuilding safe.
                feedback: "Las firmas duplicadas son rechazadas por la red, que es lo que hace idempotente el reenvío; la garantía muere con el blockhash, y solo después de que venza es seguro reconstruir."  # @src=439e7f826559
              a:
                # | Rebuild the payment with a fresh blockhash and send again; a new
                # | signature guarantees it cannot double-charge.
                label: "Reconstruye el pago con un blockhash nuevo y manda otra vez; una firma nueva garantiza que no puede cobrar doble."  # @src=fb35aa6d1960
                # | A fresh blockhash produces a NEW signature, so if the first one also
                # | lands you have paid twice; this is the double-pay trap.
                feedback: "Un blockhash nuevo produce una firma NUEVA, así que si la primera también aterriza has pagado dos veces; esta es la trampa del pago doble."  # @src=367cfad50775
              c:
                # | Wait for the ~150-block window to fully expire and then send a brand-new
                # | transaction to be safe.
                label: "Espera a que la ventana de ~150 bloques venza por completo y después manda una transacción completamente nueva para estar seguro."  # @src=9ac945a19b1c
                # | Rebuilding after verified expiry is the lesson's own fallback, but
                # | expiry alone is not the whole check: if the first send actually landed
                # | during the window, a fresh signature pays the customer's bill twice.
                # | Confirm the original never landed before rebuilding — and notice what
                # | this answer costs even then: you sit out the whole window when resending
                # | the identical bytes immediately is just as safe and far faster.
                feedback: "Reconstruir después de un vencimiento verificado es el plan B de la propia lección, pero el vencimiento solo no es toda la verificación: si el primer envío de verdad aterrizó durante la ventana, una firma nueva paga la factura del cliente dos veces. Confirma que el original nunca aterrizó antes de reconstruir — y fíjate en lo que cuesta esta respuesta incluso entonces: te quedas esperando toda la ventana cuando reenviar los bytes idénticos de inmediato es igual de seguro y mucho más rápido."  # @src=3b1270c0c0a7
              d:
                # | Call getSignatureStatuses once; a null there means the payment did not
                # | land, so rebuild against a fresh blockhash and send that instead.
                label: "Llama a getSignatureStatuses una vez; un null ahí quiere decir que el pago no aterrizó, así que reconstruye contra un blockhash nuevo y manda eso en su lugar."  # @src=44ab5d81bd59
                # | A null is a snapshot, and while the blockhash is still alive your
                # | original bytes can land the second after you read it. Expiry has to be
                # | checked first, and the status lookup needs searchTransactionHistory
                # | before its null means anything.
                feedback: "Un null es una foto instantánea, y mientras el blockhash siga vivo tus bytes originales pueden aterrizar el segundo después de que lo leas. El vencimiento tiene que comprobarse primero, y la búsqueda de estado necesita searchTransactionHistory antes de que su null quiera decir algo."  # @src=08cb485f2a22
  m02-l2:
    # | The 2026 stablecoin roster: PYUSD, Token-2022, and how USDC travels
    title: "El roster de stablecoins de 2026: PYUSD, Token-2022 y cómo viaja USDC"  # @src=5c73d748c17b
    blocks:
      check:                      # quiz
        questions:
          m02l2-q1:
            # | A customer pays in PYUSD and your kit's send is refused before it ever
            # | reaches the chain. What is the actual cause?
            prompt: "Un cliente paga en PYUSD y el envío de tu kit es rechazado antes de llegar siquiera a la blockchain. ¿Cuál es la causa real?"  # @src=69177b148381
            # | A mint is owned by exactly one token program, and PYUSD is a Token-2022
            # | mint. An instruction built for the classic Token program targets the wrong
            # | program id, so it cannot succeed. The fix is detectTokenProgram: read the
            # | mint's owner and route the transfer to it.
            explanation: "Un mint es propiedad de exactamente un programa de tokens, y PYUSD es un mint Token-2022. Una instrucción construida para el programa Token clásico apunta al id de programa equivocado, así que no puede tener éxito. El arreglo es detectTokenProgram: lee el dueño del mint y enruta la transferencia hacia él."  # @src=ae573c45fbac
            options:                 # source order — keep it
              a:
                # | PYUSD uses a different decimals count than USDC, so the base-unit amount
                # | your kit computes overflows the u64 the transfer instruction expects and
                # | the build throws before it sends.
                label: "PYUSD usa una cantidad de decimales distinta a USDC, así que el monto en unidades base que calcula tu kit desborda el u64 que espera la instrucción de transferencia y el build lanza antes de enviar."  # @src=5c83b48efaf3
                # | PYUSD is also 6 decimals, and overflow is not the issue; the transfer
                # | fails because it is aimed at the wrong owner program.
                feedback: "PYUSD también es de 6 decimales, y el overflow (desbordamiento) no es el problema; la transferencia falla porque apunta al programa dueño equivocado."  # @src=7d37ce45164e
              b:
                # | PYUSD's transferFeeConfig makes a fee account and a withheld-amount
                # | argument mandatory on every send, and your TransferChecked supplies
                # | neither, so the program rejects the instruction.
                label: "El transferFeeConfig de PYUSD vuelve obligatorios una cuenta de comisión y un argumento de monto retenido en cada envío, y tu TransferChecked no provee ninguno de los dos, así que el programa rechaza la instrucción."  # @src=8a16e14fc73b
                # | TransferChecked takes no fee account or withheld-amount argument, and
                # | PYUSD's configured fee is currently 0; the send fails because the mint
                # | is owned by a different program.
                feedback: "TransferChecked no toma ninguna cuenta de comisión ni argumento de monto retenido, y la comisión configurada de PYUSD es actualmente 0; el envío falla porque el mint es propiedad de un programa distinto."  # @src=e6d4bffe125c
              d:
                # | The recipient holds no PYUSD account yet, and the kit's idempotent
                # | create instruction does not open one on a Token-2022 mint.
                label: "El destinatario todavía no tiene ninguna cuenta de PYUSD, y la instrucción de creación idempotente del kit no abre una en un mint Token-2022."  # @src=c8ff6fd6898e
                # | The idempotent create works on both programs once it is told which one
                # | owns the mint, and a missing account is the case it exists to absorb.
                # | The refusal fires earlier than that, on the mint's owner field.
                feedback: "La creación idempotente funciona en los dos programas una vez que se le dice cuál es dueño del mint, y una cuenta faltante es justo el caso que existe para absorber. El rechazo se dispara antes que eso, en el campo owner del mint."  # @src=0d26370cc427
              c:
                # | PYUSD is owned by the Token-2022 program, so the transfer must be built
                # | against the mint's owner program, not a hardcoded classic Token program.
                label: "PYUSD es propiedad del programa Token-2022, así que la transferencia tiene que construirse contra el programa dueño del mint, no contra un programa Token clásico hardcodeado."  # @src=c5060bf6ad15
                # | The owner is a field you read at runtime, not a symbol you look up: a
                # | hardcoded allowlist stays right until the next mint arrives.
                feedback: "El owner es un campo que lees en runtime, no un símbolo que buscas: una allowlist hardcodeada se mantiene correcta hasta que llega el siguiente mint."  # @src=1cef3b11ed1a
          m02l2-q2:
            # | You read PYUSD's mint live and see a permanentDelegate configured. What does
            # | that mean for you as the merchant integrating it?
            prompt: "Lees el mint de PYUSD en vivo y ves un permanentDelegate configurado. ¿Qué quiere decir eso para ti como el comercio que lo integra?"  # @src=cfefa2fedf58
            # | A permanent delegate is a Token-2022 extension granting a standing authority
            # | (here, the issuer) power to move tokens from any holder, effectively a
            # | seizure capability. It is a property of the mint you accept knowingly; your
            # | integration does not add or remove it, but a merchant should understand it
            # | before pricing in the asset.
            explanation: "Un delegado permanente es una extensión de Token-2022 que le otorga a una autoridad permanente (aquí, el emisor) el poder de mover tokens de cualquier tenedor, en efecto una capacidad de incautación. Es una propiedad del mint que aceptas a sabiendas; tu integración no la agrega ni la quita, pero un comercio debería entenderla antes de poner precios en el activo."  # @src=fe92757e48d1
            options:                 # source order — keep it
              c:
                # | The permanent delegate freezes every PYUSD balance by default, so each
                # | holder's token account stays frozen until the issuer thaws it and signs
                # | off on that individual spend.
                label: "El delegado permanente congela cada saldo de PYUSD por defecto, así que la cuenta de token de cada tenedor se queda congelada hasta que el emisor la descongela y aprueba ese gasto individual."  # @src=f1159d91a9fc
                # | That describes a frozen default-account state, not a permanent delegate;
                # | ordinary PYUSD balances are spendable and need no per-spend issuer
                # | approval.
                feedback: "Eso describe un estado de cuenta congelada por defecto, no un delegado permanente; los saldos ordinarios de PYUSD se pueden gastar y no necesitan ninguna aprobación del emisor por gasto."  # @src=c3a348595430
              a:
                # | The issuer holds a standing delegate that can move PYUSD out of any
                # | holder's account, a seizure power set by issuer policy that your
                # | transfer does not change.
                label: "El emisor tiene un delegado permanente que puede sacar PYUSD de la cuenta de cualquier tenedor, un poder de incautación fijado por la política del emisor que tu transferencia no cambia."  # @src=997bf2223bde
                # | Because the authority lives on the mint itself, every account of that
                # | mint is in reach and no per-account setting opts out; that is a risk to
                # | price in, not a defect to integrate around.
                feedback: "Como la autoridad vive en el propio mint, cada cuenta de ese mint está a su alcance y ninguna configuración por cuenta te deja salirte; eso es un riesgo que hay que meter en el precio, no un defecto que haya que esquivar en la integración."  # @src=ea3d54761342
              d:
                # | The delegate reaches the buyer's wallet but stops at your merchant
                # | account, so funds you have received are out of its scope.
                label: "El delegado alcanza la billetera del comprador pero se detiene en tu cuenta de comercio, así que los fondos que ya recibiste quedan fuera de su alcance."  # @src=046afff2b8a9
                # | The authority sits on the mint, so it reaches whichever account holds
                # | that mint, yours included. Receiving PYUSD puts your own balance inside
                # | the same reach the buyer's was in.
                feedback: "La autoridad se asienta en el mint, así que alcanza cualquier cuenta que tenga ese mint, la tuya incluida. Recibir PYUSD pone tu propio saldo dentro del mismo alcance en el que estaba el del comprador."  # @src=3b222abf1812
              b:
                # | Every PYUSD transfer you send is automatically co-signed by the
                # | delegate, adding a second required signature to each payment.
                label: "Cada transferencia de PYUSD que envías es cofirmada automáticamente por el delegado, agregando una segunda firma requerida a cada pago."  # @src=a4ffaa1723af
                # | The permanent delegate is a standing authority the issuer can use, not
                # | an automatic co-signer on ordinary transfers.
                feedback: "El delegado permanente es una autoridad permanente que el emisor puede usar, no un cofirmante automático en las transferencias ordinarias."  # @src=bcff91cb27ee
          m02l2-q3:
            # | PYUSD's mint carries a transferFeeConfig extension. How should your kit
            # | decide what fee, if any, applies when you send it?
            prompt: "El mint de PYUSD carga una extensión transferFeeConfig. ¿Cómo debería decidir tu kit qué comisión aplica, si aplica alguna, cuando lo envías?"  # @src=65fba6999980
            # | The presence of transferFeeConfig does not tell you the rate. Read the basis
            # | points live from the mint, because the fee can be nonzero and can be changed
            # | by its authority. PYUSD's is 0 today, but reading it is the only
            # | integration-safe habit, which is exactly why the lab reads rather than
            # | asserts it.
            explanation: "La presencia de transferFeeConfig no te dice la tasa. Lee los centésimos de punto porcentual en vivo desde el mint, porque la comisión puede ser distinta de cero y su autoridad puede cambiarla. La de PYUSD es 0 hoy, pero leerla es el único hábito seguro para una integración, que es exactamente por qué el lab la lee en vez de afirmarla."  # @src=3520780ac164
            options:                 # source order — keep it
              d:
                # | Read the basis points once at startup and cache them for the process
                # | lifetime, since a fee change typically waits for an epoch boundary.
                label: "Lee los centésimos de punto porcentual una vez al arrancar y cachéalos por el tiempo de vida del proceso, ya que un cambio de comisión típicamente espera un límite de epoch."  # @src=d32d2e1ffbf4
                # | An epoch boundary is roughly a day and a half at the current slot time,
                # | and a checkout process outlives many of them. Caching for the life of
                # | the process is the same stale-rate bug, just slower to show up.
                feedback: "Un límite de epoch es alrededor de un día y medio al tiempo de slot actual, y un proceso de checkout sobrevive a muchos de ellos. Cachear por el tiempo de vida del proceso es el mismo bug de tasa vieja, solo más lento en aparecer."  # @src=47de430e73bd
              c:
                # | Ignore it as a sender: any Token-2022 transfer fee is charged to the
                # | recipient as a separate deduction after settlement, so the amount you
                # | send and the amount invoiced always match.
                label: "Ignórala como remitente: cualquier comisión de transferencia de Token-2022 se le cobra al destinatario como una deducción separada después de la liquidación, así que el monto que envías y el monto facturado siempre coinciden."  # @src=c0f34926e8e1
                # | A transfer fee is withheld from the transferred amount and is very much
                # | the sender's concern; you cannot ignore it.
                feedback: "Una comisión de transferencia se retiene del monto transferido y es muy claramente asunto del remitente; no puedes ignorarla."  # @src=e5cd9640fd18
              b:
                # | Read the current basis points from the mint account at runtime, because
                # | a configured fee can be nonzero and can change; PYUSD's is currently 0.
                label: "Lee los centésimos de punto porcentual actuales desde la cuenta del mint en runtime, porque una comisión configurada puede ser distinta de cero y puede cambiar; la de PYUSD es actualmente 0."  # @src=152a583c08c2
                # | Reading it once at boot is the same bug slowed down; the rate can move
                # | between your read and the transfer that pays it.
                feedback: "Leerla una sola vez al arrancar es el mismo bug pero más lento; la tasa puede moverse entre tu lectura y la transferencia que la paga."  # @src=6a0955708252
              a:
                # | Assume the rate published in the issuer's docs, because a Token-2022
                # | transferFeeConfig is written at mint creation and its basis points are
                # | immutable afterward, so one constant in the kit covers every send.
                label: "Supón la tasa publicada en los docs del emisor, porque un transferFeeConfig de Token-2022 se escribe al crear el mint y sus centésimos de punto porcentual son inmutables después, así que una sola constante en el kit cubre cada envío."  # @src=81b2dd9ac36f
                # | The basis points are not immutable: a Token-2022 fee can be updated by
                # | its fee authority, so a constant copied from docs can be wrong tomorrow.
                feedback: "Los centésimos de punto porcentual no son inmutables: una comisión de Token-2022 puede ser actualizada por su autoridad de comisión, así que una constante copiada de los docs puede estar mal mañana."  # @src=fb489d0d26bb
          m02l2-q4:
            # | A buyer bridges USDC from Ethereum to pay you in the store. Using CCTP, how
            # | does that USDC arrive on Solana and how fast?
            prompt: "Un comprador trae USDC por puente desde Ethereum para pagarte en la tienda. Usando CCTP, ¿cómo llega ese USDC a Solana y qué tan rápido?"  # @src=ee5caa069d7a
            # | CCTP is burn-and-mint: the USDC is burned on the source chain and freshly,
            # | natively minted on the destination, so there is no wrapped IOU and no pool.
            # | Solana is domain 5. Fast Transfer timing is keyed to the SOURCE chain,
            # | because what is being waited on is the burn becoming irreversible where it
            # | happened — the widely-quoted ~8 seconds is Solana as source, and a buyer
            # | bridging in from Ethereum waits longer than that while still beating
            # | Ethereum's ~15 to 19 minute standard path. Every one of these numbers is a
            # | per-source-chain row in Circle's table, never a property of CCTP: standard
            # | out of Solana is ~25 seconds against Ethereum's 15 to 19 minutes. Quote the
            # | row for your buyers' source chain.
            explanation: "CCTP es burn-and-mint: el USDC se quema en la blockchain de origen y se acuña fresco, de forma nativa, en la de destino, así que no hay ningún IOU wrapped y ningún pool. Solana es el dominio 5. El tiempo de Fast Transfer está atado a la blockchain de ORIGEN, porque lo que se está esperando es que la quema se vuelva irreversible donde ocurrió — los tan citados ~8 segundos son Solana como origen, y un comprador que cruza por puente desde Ethereum espera más que eso, aunque igual le gana a la ruta estándar de ~15 a 19 minutos de Ethereum. Cada uno de estos números es una fila por blockchain de origen en la tabla de Circle, nunca una propiedad de CCTP: la estándar saliendo de Solana son ~25 segundos contra los 15 a 19 minutos de Ethereum. Cita la fila que corresponde a la blockchain de origen de tus compradores."  # @src=e5db123f1339
            options:                 # source order — keep it
              c:
                # | It is burned on the source domain and natively minted on Solana (domain
                # | 5), with a Fast Transfer landing well inside the standard route's
                # | window.
                label: "Se quema en el dominio de origen y se acuña de forma nativa en Solana (dominio 5), con un Fast Transfer aterrizando bien dentro de la ventana de la ruta estándar."  # @src=9289e0c66354
                # | Burn-and-mint means what arrives is the canonical asset, with no pool
                # | behind it to run dry. Fast Transfer waits on the SOURCE chain's
                # | finality, so an Ethereum-sourced transfer is slower than the ~8 seconds
                # | quoted for Solana-as-source, and the standard route out of Ethereum
                # | still runs 15 to 19 minutes.
                feedback: "Burn-and-mint quiere decir que lo que llega es el activo canónico, sin ningún pool detrás que se pueda secar. Fast Transfer espera a la finality de la blockchain de ORIGEN, así que una transferencia originada en Ethereum es más lenta que los ~8 segundos citados para Solana-como-origen, y la ruta estándar saliendo de Ethereum sigue tardando 15 a 19 minutos."  # @src=4212dda14434
              d:
                # | It is burned on Ethereum and minted natively on Solana in about 8
                # | seconds, since Solana's finality is what a Fast Transfer waits on.
                label: "Se quema en Ethereum y se acuña de forma nativa en Solana en alrededor de 8 segundos, ya que la finality de Solana es lo que espera un Fast Transfer."  # @src=f03c0f2b4388
                # | The mechanism is right and the direction is backwards, which is how most
                # | summaries of CCTP get it wrong. What has to become irreversible is the
                # | burn, and the burn happened on Ethereum, so an inbound buyer waits out
                # | Ethereum.
                feedback: "El mecanismo está bien y la dirección está al revés, que es como la mayoría de los resúmenes de CCTP se equivocan. Lo que tiene que volverse irreversible es la quema, y la quema ocurrió en Ethereum, así que un comprador que entra espera a Ethereum."  # @src=f341836806ae
              a:
                # | It is locked in a pool on Ethereum and a wrapped IOU token is minted on
                # | Solana, redeemable back later.
                label: "Se bloquea en un pool en Ethereum y se acuña un token IOU wrapped en Solana, rescatable de vuelta después."  # @src=67da60112265
                # | That is the lock-and-wrap bridge model; CCTP does not use pools or
                # | wrapped IOUs, it burns and natively mints.
                feedback: "Ese es el modelo de puente lock-and-wrap; CCTP no usa pools ni IOUs wrapped, quema y acuña de forma nativa."  # @src=bb4fdbbebe85
              b:
                # | It moves over a shared liquidity network in roughly 15 to 19 minutes,
                # | with the depth of that shared pool on each side setting the pace.
                label: "Se mueve sobre una red de liquidez compartida en alrededor de 15 a 19 minutos, con la profundidad de ese pool compartido en cada lado marcando el ritmo."  # @src=9673d89721f6
                # | The number is in the right neighborhood for this route and the mechanism
                # | is wrong, which is the trap: CCTP has no shared pool to be deep or
                # | shallow, it burns and natively mints. And that number is Ethereum's
                # | standard-route row, not a CCTP constant — with Solana as the source,
                # | standard is 32 confirmations, about 25 seconds.
                feedback: "El número está en el vecindario correcto para esta ruta y el mecanismo está mal, que es la trampa: CCTP no tiene ningún pool compartido que pueda ser profundo o superficial, quema y acuña de forma nativa. Y ese número es la fila de ruta estándar de Ethereum, no una constante de CCTP — con Solana como origen, la estándar son 32 confirmaciones, alrededor de 25 segundos."  # @src=ca313f3432ea
  m03-l1:
    # | Checkout with a QR: the Solana Pay spec, live
    title: "Checkout con un código QR: el spec de Solana Pay, en vivo"  # @src=f247b9719ca3
    blocks:
      check-overview:                      # quiz
        questions:
          q1:
            # | You build a Solana Pay transfer request to charge 12.50 USDC and, because
            # | USDC has 6 decimals, you write amount=12500000 in the URL. Your test wallet
            # | asks the customer to pay 12,500,000 USDC. What went wrong?
            prompt: "Construyes un transfer request de Solana Pay para cobrar 12.50 USDC y, como USDC tiene 6 decimales, escribes amount=12500000 en la URL. Tu billetera de prueba le pide al cliente que pague 12,500,000 USDC. ¿Qué salió mal?"  # @src=7800fe867052
            # | The Solana Pay spec defines amount as a UI (decimal) quantity of the token,
            # | and the wallet multiplies by the mint's decimals to get base units. Writing
            # | base units in the URL charges the customer that many whole tokens. This is
            # | the single most common Solana Pay checkout bug.
            explanation: "El spec de Solana Pay define amount como una cantidad de UI (decimal) del token, y la billetera multiplica por los decimales del mint para obtener unidades base. Escribir unidades base en la URL le cobra al cliente esa cantidad de tokens enteros. Este es el bug más común que existe en un checkout de Solana Pay."  # @src=7213e1188f90
            options:                 # source order — keep it
              b:
                # | validateTransfer rejects base-unit amounts, so you have to call
                # | findReference first and let it normalize the URL's decimals.
                label: "validateTransfer rechaza los montos en unidades base, así que tienes que llamar a findReference primero y dejar que normalice los decimales de la URL."  # @src=eb4d4d49c3d3
                # | validateTransfer runs later, server-side, against the settled transfer;
                # | it is not why the URL charged the wrong amount.
                feedback: "validateTransfer corre después, del lado del servidor, contra la transferencia liquidada; no es la razón por la que la URL cobró el monto equivocado."  # @src=2d4710be554d
              c:
                # | A Solana Pay amount is in decimal token units, not base units: write
                # | amount=12.5 and the wallet applies mint decimals.
                label: "Un amount de Solana Pay va en unidades decimales del token, no en unidades base: escribe amount=12.5 y la billetera aplica los decimales del mint."  # @src=b3bac01d80d7
                # | The URL carries a human quantity because the wallet scales by the mint's
                # | decimals; one layer down, the instruction still wants base units.
                feedback: "La URL lleva una cantidad humana porque la billetera escala por los decimales del mint; una capa más abajo, la instrucción sigue queriendo unidades base."  # @src=d48d4dbb0556
              d:
                # | Your test wallet is scaling by the mint's decimals a second time; a
                # | compliant wallet would charge the customer 12.5 USDC.
                label: "Tu billetera de prueba está escalando por los decimales del mint una segunda vez; una billetera que cumple le cobraría al cliente 12.5 USDC."  # @src=fb18a8406b59
                # | The wallet scaled exactly once, which is what the spec asks of it. The
                # | doubling happened in your URL, where you converted to base units before
                # | handing the number to a field that wants human units.
                feedback: "La billetera escaló exactamente una vez, que es lo que el spec le pide. La duplicación pasó en tu URL, donde convertiste a unidades base antes de pasarle el número a un campo que quiere unidades humanas."  # @src=22d65e9a71a5
              a:
                # | The spl-token parameter has to come before amount in the query string,
                # | otherwise the wallet falls back to native SOL and scales your number by
                # | nine decimals instead of six.
                label: "El parámetro spl-token tiene que venir antes de amount en la cadena de consulta, si no la billetera cae de vuelta a SOL nativo y escala tu número por nueve decimales en vez de seis."  # @src=3dd7b56421fa
                # | Query-parameter order is irrelevant to how the amount is interpreted;
                # | the mint is set by spl-token wherever it appears, and there is no silent
                # | SOL fallback.
                feedback: "El orden de los parámetros de consulta es irrelevante para cómo se interpreta el monto; el mint lo fija spl-token donde sea que aparezca, y no hay ningún fallback silencioso a SOL."  # @src=900c4b24f9cc
          q2:
            # | A teammate puts the customer's email in the checkout URL's `memo` and the
            # | SKU in `message`, reasoning that both are just labels the wallet passes
            # | along. What is wrong with that?
            prompt: "Un compañero de equipo pone el correo del cliente en el `memo` de la URL de checkout y el SKU en `message`, razonando que los dos son solo etiquetas que la billetera pasa adelante. ¿Qué tiene eso de malo?"  # @src=5e6f757a7a43
            # | `message` and `memo` sound alike and run in opposite directions. `message`
            # | is display-only: the wallet shows it at approval time and it never touches
            # | the chain. `memo` is written into the transaction by the memo program, so it
            # | settles publicly and permanently beside the payment. Human-facing text goes
            # | in `message`, reconciliation keys go in `memo`, and personal data goes in
            # | neither.
            explanation: "`message` y `memo` suenan parecido y corren en direcciones opuestas. `message` es solo de pantalla: la billetera lo muestra al momento de aprobar y nunca toca la blockchain. `memo` lo escribe el programa memo dentro de la transacción, así que se liquida pública y permanentemente al lado del pago. El texto que ve el humano va en `message`, las claves de conciliación van en `memo`, y los datos personales no van en ninguno de los dos."  # @src=88522bb6d34e
            options:                 # source order — keep it
              d:
                # | The SKU is misplaced, but a memo is readable by the payer and the payee
                # | alone, so the customer's email stays between them.
                label: "El SKU está mal puesto, pero un memo solo lo pueden leer el pagador y el beneficiario, así que el correo del cliente queda entre ellos."  # @src=e4f2b75445c1
                # | Nothing on this ledger is scoped to the parties. The same
                # | unauthenticated RPC read you ran in module 1 returns a stranger's memo,
                # | which is why the rule is to put nothing in one you would not print on a
                # | public receipt.
                feedback: "Nada en este libro mayor está acotado a las partes. La misma lectura RPC sin autenticar que corriste en el módulo 1 devuelve el memo de un desconocido, y por eso la regla es no poner nada en uno que no imprimirías en un comprobante público."  # @src=6d0ced6974cf
              b:
                # | The two are simply swapped: `message` is what settles on-chain, and
                # | `memo` is the one the customer sees and the wallet discards.
                label: "Los dos están simplemente intercambiados: `message` es lo que se liquida on-chain, y `memo` es el que ve el cliente y la billetera descarta."  # @src=6d85b9c05975
                # | The direction is backwards. The wallet writes `memo` into the
                # | transaction through the memo program, while `message` is rendered for
                # | the human approving and then discarded.
                feedback: "La dirección está al revés. La billetera escribe `memo` dentro de la transacción a través del programa memo, mientras que `message` se renderiza para el humano que aprueba y después se descarta."  # @src=54ab7af88142
              a:
                # | `memo` settles on-chain in public, so the email is exposed forever, and
                # | `message` is gone once the customer approves.
                label: "`memo` se liquida on-chain en público, así que el correo queda expuesto para siempre, y `message` desaparece en cuanto el cliente aprueba."  # @src=b3abefff3cf2
                # | Both halves cost you something: a public ledger entry you cannot
                # | retract, and a SKU that never leaves the approval screen, so the sale
                # | lands with nothing to reconcile against.
                feedback: "Las dos mitades te cuestan algo: una entrada en un libro mayor público que no puedes retirar, y un SKU que nunca sale de la pantalla de aprobación, así que la venta aterriza sin nada contra qué conciliar."  # @src=dbc746aa016e
              c:
                # | Nothing is wrong, because both are query parameters the wallet renders
                # | on its approval screen, and a transfer request writes neither of them
                # | into the transaction it builds.
                label: "No hay nada malo, porque los dos son parámetros de consulta que la billetera renderiza en su pantalla de aprobación, y un transfer request no escribe ninguno de los dos en la transacción que construye."  # @src=fdabb5355c6b
                # | A transfer request does write one of them: `memo` becomes a memo-program
                # | instruction riding beside the transfer, which is how a SKU can still be
                # | read off the chain months later.
                feedback: "Un transfer request sí escribe uno de los dos: `memo` se vuelve una instrucción del programa memo que viaja al lado de la transferencia, y así es como un SKU todavía se puede leer de la blockchain meses después."  # @src=a732929be9f3
      check-lab:                      # quiz
        questions:
          q3:
            # | Your checkout page shows the QR. Server-side, how does your watcher learn
            # | the customer actually paid, and what does it match on?
            prompt: "Tu página de checkout muestra el código QR. Del lado del servidor, ¿cómo se entera tu watcher de que el cliente realmente pagó, y contra qué hace el emparejamiento?"  # @src=4cb44943273f
            # | You chose the reference key before the payment existed, so you can search
            # | for a transfer carrying it. watchReference opens a WebSocket subscription
            # | that fires when a matching transfer appears, and validateTransfer then
            # | confirms the amount, recipient, and mint are what you expected. The browser
            # | is never the source of truth.
            explanation: "Elegiste la clave de reference antes de que el pago existiera, así que puedes buscar una transferencia que la lleve. watchReference abre una suscripción WebSocket que se dispara cuando aparece una transferencia que coincide, y validateTransfer confirma después que el monto, el destinatario y el mint son los que esperabas. El navegador nunca es la fuente de la verdad."  # @src=544086af04ca
            options:                 # source order — keep it
              a:
                # | It trusts the wallet's success callback in the browser and records the
                # | sale as soon as the page reports done.
                label: "Confía en el callback de éxito de la billetera en el navegador y registra la venta apenas la página reporta que terminó."  # @src=f2237a3fe2ae
                # | Frontend confirmations are spoofable; trusting the browser is the exact
                # | anti-pattern the back-office module (m04) exists to fix.
                feedback: "Las confirmaciones del frontend son falsificables; confiar en el navegador es exactamente el antipatrón que el módulo del back office (m04) existe para arreglar."  # @src=7a010817db55
              b:
                # | It subscribes with watchReference (a WebSocket subscription) on the
                # | reference key you embedded, then confirms the transfer with
                # | validateTransfer.
                label: "Se suscribe con watchReference (una suscripción WebSocket) sobre la clave de reference que incrustaste, y después confirma la transferencia con validateTransfer."  # @src=66b18d937b0d
                # | A subscription only proves that something carrying your key landed;
                # | amount, mint, and payee are still yours to check against the order.
                feedback: "Una suscripción solo demuestra que aterrizó algo que lleva tu clave; el monto, el mint y el beneficiario todavía te toca revisarlos contra el pedido."  # @src=502a6cf2944f
              c:
                # | It periodically re-reads the QR image and decodes the resulting
                # | signature once the wallet stamps it back onto the code.
                label: "Vuelve a leer periódicamente la imagen del código QR y decodifica la firma resultante una vez que la billetera la estampa de vuelta en el código."  # @src=6929209cebd3
                # | The QR is a static payment request; the signature is never written back
                # | to the image. Detection happens on-chain by reference, not by re-reading
                # | the QR.
                feedback: "El código QR es una solicitud de pago estática; la firma nunca se escribe de vuelta en la imagen. La detección pasa on-chain por reference, no por volver a leer el código QR."  # @src=137d58a0829f
              d:
                # | It arms a watchReference subscription on the reference key and books the
                # | sale the moment it resolves, since only a matching transfer can resolve
                # | it.
                label: "Arma una suscripción de watchReference sobre la clave de reference y da la venta por hecha en el momento en que se resuelve, ya que solo una transferencia que coincida puede resolverla."  # @src=f0e41e589e62
                # | The subscription half is right and the booking is premature. Resolving
                # | proves a transaction mentioning your key landed, and a reference is a
                # | public account key anyone can attach, so validateTransfer is what turns
                # | a doorbell into a payment.
                feedback: "La mitad de la suscripción está bien y darla por hecha es prematuro. Que se resuelva demuestra que aterrizó una transacción que menciona tu clave, y una reference es una clave de cuenta pública que cualquiera puede adjuntar, así que validateTransfer es lo que convierte un timbre en un pago."  # @src=433c611800f7
          q4:
            # | You mint a fresh random 32-byte key for every checkout, before anyone has
            # | paid a cent. Every settled payment already carries a globally unique id of
            # | its own. So why bother with the extra key?
            prompt: "Acuñas una clave aleatoria nueva de 32 bytes para cada checkout, antes de que nadie haya pagado un centavo. Cada pago liquidado ya lleva un id único a nivel global propio. Entonces, ¿para qué molestarse con la clave extra?"  # @src=d3ecd579edc0
            # | The signature only exists after the payment lands, so you cannot
            # | pre-register it against an order. The reference is a value you pick up front
            # | and embed, letting findReference/watchReference locate the exact transfer
            # | for a given order without unique deposit addresses. It is the join key
            # | between your ledger and the chain.
            explanation: "La firma solo existe después de que el pago aterriza, así que no puedes preregistrarla contra un pedido. La reference es un valor que eliges por adelantado y que incrustas, lo que le deja a findReference/watchReference ubicar la transferencia exacta de un pedido dado sin direcciones de depósito únicas. Es la clave de unión entre tu libro mayor y la blockchain."  # @src=5796dfb26fa3
            options:                 # source order — keep it
              a:
                # | The reference is derived from the customer's wallet address at scan
                # | time, so it doubles as a refund handle and lets you push money back
                # | later without ever asking them for an address.
                label: "La reference se deriva de la dirección de la billetera del cliente al momento del escaneo, así que sirve también como identificador de reembolso y te deja empujar dinero de vuelta después sin pedirles nunca una dirección."  # @src=ed68390f6bda
                # | You generate the reference yourself, before the customer has scanned
                # | anything; it is random bytes carrying no wallet identity, so it cannot
                # | serve as a refund handle.
                feedback: "La reference la generas tú mismo, antes de que el cliente haya escaneado nada; son bytes aleatorios que no llevan ninguna identidad de billetera, así que no puede servir como identificador de reembolso."  # @src=3cea89f3e3e3
              d:
                # | The wallet hands the transfer's signature back to your page at approval,
                # | so you can join it to the order then and the reference is just
                # | insurance.
                label: "La billetera le pasa de vuelta la firma de la transferencia a tu página al momento de aprobar, así que puedes unirla al pedido ahí mismo y la reference es solo un seguro."  # @src=618ae310b275
                # | On a scanned QR the paying wallet is a different device from your
                # | checkout page, so there is no callback to hand anything back. Even where
                # | one exists the browser is not evidence, which is why the server needs a
                # | handle it chose itself.
                feedback: "En un código QR escaneado, la billetera que paga es un dispositivo distinto del de tu página de checkout, así que no hay ningún callback que devuelva nada. Incluso donde existe uno, el navegador no es evidencia, y por eso el servidor necesita un identificador que haya elegido él mismo."  # @src=bbdc18cb97b2
              b:
                # | The reference encrypts the amount and the recipient in the URL, so the
                # | wallet decrypts them at scan time and the customer cannot edit the price
                # | before paying.
                label: "La reference cifra el monto y el destinatario en la URL, así que la billetera los descifra al momento del escaneo y el cliente no puede editar el precio antes de pagar."  # @src=bee216866758
                # | References do not encrypt anything; the amount is plainly in the URL.
                # | Tamper-resistance is exactly why the next lesson moves pricing
                # | server-side.
                feedback: "Los references no cifran nada; el monto está a la vista en la URL. La resistencia a la manipulación es exactamente por lo que la próxima lección mueve el precio al lado del servidor."  # @src=8896b38ec8b3
              c:
                # | You cannot know the signature in advance, but you did choose the
                # | reference, so it is the join key that ties one on-chain transfer to one
                # | order.
                label: "No puedes conocer la firma de antemano, pero la reference sí la elegiste tú, así que es la clave de unión que ata una transferencia on-chain a un pedido."  # @src=7046e80bfe43
                # | It joins, but it never authenticates: the reference is public.
                feedback: "Une, pero nunca autentica: la reference es pública."  # @src=f0fa8d981af3
  m03-l2:
    # | Transaction requests: the server builds the transaction
    title: "Transaction requests: el servidor construye la transacción"  # @src=3f6255a50020
    blocks:
      check-overview:                      # quiz
        questions:
          q1:
            # | Your transaction-request server returns a base64 transaction to the wallet.
            # | In review, a teammate builds a hostile server that returns a transaction
            # | requiring a signature from an account the customer never submitted. What
            # | should a correct wallet do?
            prompt: "Tu servidor de transaction request le devuelve una transacción en base64 a la billetera. En una revisión, un compañero de equipo construye un servidor hostil que devuelve una transacción que exige la firma de una cuenta que el cliente nunca envió. ¿Qué debería hacer una billetera correcta?"  # @src=feca058ad321
            # | Because the server hands the wallet a fully built transaction, the wallet is
            # | the only thing standing between the user and an unexpected signature. The
            # | Solana Pay spec makes this explicit: a request that demands a signature from
            # | an account the user did not submit is malicious and must be rejected. That
            # | trust boundary is the price of server-side control.
            explanation: "Como el servidor le entrega a la billetera una transacción completamente construida, la billetera es lo único que se interpone entre el usuario y una firma inesperada. El spec de Solana Pay lo dice explícito: una solicitud que exige la firma de una cuenta que el usuario no envió es maliciosa y debe rechazarse. Esa frontera de confianza es el precio del control del lado del servidor."  # @src=b7232d30b29c
            options:                 # source order — keep it
              d:
                # | Sign for the extra account when the customer's wallet holds its key; the
                # | spec calls a request malicious when nobody controls it.
                label: "Firmar por la cuenta extra cuando la billetera del cliente tiene su clave; el spec llama maliciosa a una solicitud cuando nadie la controla."  # @src=e245105b4013
                # | An account the customer controls is exactly what a hostile server hopes
                # | to get rubber-stamped: a treasury key, a multisig seat. The wallet knows
                # | one account was volunteered, and every other demanded signer is one
                # | nobody agreed to.
                feedback: "Una cuenta que el cliente controla es exactamente lo que un servidor hostil espera que se apruebe sin mirar: una clave de tesorería, un asiento de multisig. La billetera sabe que se ofreció una cuenta, y todo otro firmante exigido es uno que nadie aceptó."  # @src=444255d6f11f
              a:
                # | Treat it as malicious and refuse; the spec says a request demanding a
                # | signature from a non-submitted account must be rejected outright.
                label: "Tratarla como maliciosa y negarse; el spec dice que una solicitud que exige la firma de una cuenta no enviada debe rechazarse de plano."  # @src=b5005cd9d059
                # | The wallet is the only party inspecting the transaction before a key
                # | touches it, which is why refusal belongs there. Your server is still
                # | unauditable by the customer.
                feedback: "La billetera es la única parte que inspecciona la transacción antes de que una clave la toque, que es por lo que la negativa vive ahí. Tu servidor sigue siendo inauditable para el cliente."  # @src=31579f1f3c62
              c:
                # | Sign it but surface a warning afterward and log the extra signer so the
                # | merchant can review the anomaly later.
                label: "Firmarla pero sacar una advertencia después y loguear el firmante extra para que el comercio pueda revisar la anomalía más tarde."  # @src=4f234995c341
                # | Signing first and warning later has already exposed the account; the
                # | spec rule is to refuse before signing, not to audit after.
                feedback: "Firmar primero y advertir después ya expuso la cuenta; la regla del spec es negarse antes de firmar, no auditar después."  # @src=f971bc2f2a3c
              b:
                # | Sign it as long as the fee is low, since the customer already trusted
                # | the domain by opening the payment link in the first place.
                label: "Firmarla mientras la comisión sea baja, ya que el cliente ya confió en el dominio al abrir el link de pago en primer lugar."  # @src=a94c2bc3612b
                # | Opening a link is not consent to sign for arbitrary accounts; a low fee
                # | does not make an unexpected signer safe. The wallet must reject it.
                feedback: "Abrir un link no es consentimiento para firmar por cuentas arbitrarias; una comisión baja no hace seguro a un firmante inesperado. La billetera debe rechazarla."  # @src=8c1442a7306c
          q2:
            # | You are moving from the QR transfer-request checkout to transaction
            # | requests. What actually changes about who builds the transaction, and how is
            # | the URL different?
            prompt: "Estás pasando del checkout de transfer request por QR a los transaction requests. ¿Qué cambia en realidad sobre quién construye la transacción, y en qué se diferencia la URL?"  # @src=18e99530792a
            # | A transfer request (solana:<recipient>?...) has the wallet assemble a
            # | transfer from URL parameters. A transaction request (solana:<https-link>)
            # | inverts that: the wallet GETs display metadata, POSTs the paying account,
            # | and your server returns a complete base64 transaction. Moving construction
            # | server-side is what unlocks cart logic, memos, and references you control.
            explanation: "Un transfer request (solana:<recipient>?...) hace que la billetera ensamble una transferencia a partir de parámetros de la URL. Un transaction request (solana:<https-link>) invierte eso: la billetera hace GET de los metadatos de pantalla, hace POST de la cuenta que paga, y tu servidor devuelve una transacción completa en base64. Mover la construcción al lado del servidor es lo que destraba la lógica de carrito, los memos y las references que controlas tú."  # @src=1bde7a014cdb
            options:                 # source order — keep it
              c:
                # | The customer's wallet builds a smart-contract call instead of a plain
                # | transfer, and your server's HTTPS endpoint only co-signs the result
                # | after the wallet has assembled and signed it.
                label: "La billetera del cliente construye una llamada a un contrato inteligente en vez de una transferencia pelada, y el endpoint HTTPS de tu servidor solo cofirma el resultado después de que la billetera lo ensambló y lo firmó."  # @src=ae51d2d6dc7b
                # | The wallet does not author the transaction here; your server does. There
                # | is no separate client-built contract call for the server to co-sign.
                feedback: "La billetera no es la autora de la transacción acá; lo es tu servidor. No hay ninguna llamada a contrato aparte construida por el cliente para que el servidor la cofirme."  # @src=100a41c764ac
              b:
                # | The server now builds the transaction: the URL is solana:<https-link>,
                # | and the wallet GETs a label and icon, then POSTs {account} to receive a
                # | base64 transaction to sign.
                label: "Ahora el servidor construye la transacción: la URL es solana:<https-link>, y la billetera hace GET de un label y un icon, después hace POST de {account} para recibir una transacción en base64 para firmar."  # @src=d809abc2ed21
                # | Inverting who assembles the transaction puts pricing and memos out of
                # | the customer's reach; the cost is the offline property, since a live
                # | HTTPS endpoint is now a checkout dependency.
                feedback: "Invertir quién ensambla la transacción pone el precio y los memos fuera del alcance del cliente; el costo es la propiedad offline, ya que ahora un endpoint HTTPS vivo es una dependencia del checkout."  # @src=15b80c6b4b27
              a:
                # | Nothing changes about who builds it: the wallet still assembles the
                # | transfer from parameters, and the only real difference is that
                # | solana:<https-link> encodes into a denser QR than solana:<recipient>
                # | does.
                label: "No cambia nada sobre quién la construye: la billetera sigue ensamblando la transferencia a partir de parámetros, y la única diferencia real es que solana:<https-link> codifica en un QR más denso que solana:<recipient>."  # @src=f4ef48083594
                # | Who builds the transaction is precisely what changes; QR density is a
                # | rendering detail with no bearing on it.
                feedback: "Quién construye la transacción es precisamente lo que cambia; la densidad del QR es un detalle de renderizado que no tiene nada que ver."  # @src=807378cabda3
              d:
                # | The wallet POSTs the cart contents alongside the account, and your
                # | server prices whatever line items the wallet sends it, then returns a
                # | transaction for the customer to sign.
                label: "La billetera hace POST del contenido del carrito junto con la cuenta, y tu servidor le pone precio a las líneas de artículo que sea que la billetera le mande, después devuelve una transacción para que el cliente la firme."  # @src=2edcd516e60c
                # | The spec's POST body is {account} and nothing else, which is the
                # | constraint doing the work. Anything else the build needs rides the URL
                # | you minted, so the cart stays state your server already holds.
                feedback: "El body del POST del spec es {account} y nada más, que es la restricción haciendo el trabajo. Cualquier otra cosa que el build necesite viaja en la URL que acuñaste, así que el carrito se queda como estado que tu servidor ya tiene."  # @src=029298d039e4
      check-lab:                      # quiz
        questions:
          q3:
            # | Marketing wants a coupon that takes 10% off a multi-item cart, plus an order
            # | id stamped on-chain. Why does the transaction-request path make this
            # | possible where the plain QR transfer request did not?
            prompt: "Marketing quiere un cupón que saque 10% de un carrito de varios artículos, más un id de pedido estampado on-chain. ¿Por qué el camino del transaction request hace esto posible donde el transfer request por QR pelado no podía?"  # @src=d27c0578b636
            # | The whole reason to move to transaction requests is that construction
            # | happens on your backend. The server applies the coupon, computes the final
            # | total, and stamps the order id into a memo plus a reference before returning
            # | the built transaction. None of it is exposed in a URL the customer could
            # | edit.
            explanation: "La razón entera para pasarse a los transaction requests es que la construcción pasa en tu backend. El servidor aplica el cupón, calcula el total final y estampa el id de pedido adentro de un memo más una reference antes de devolver la transacción construida. Nada de eso queda expuesto en una URL que el cliente podría editar."  # @src=c6964a23b5ac
            options:                 # source order — keep it
              b:
                # | The wallet computes the discount locally from extra URL fields such as
                # | coupon and subtotal, so any pricing rule can be expressed client-side as
                # | long as you document the parameters you added.
                label: "La billetera calcula el descuento localmente a partir de campos extra de la URL como coupon y subtotal, así que cualquier regla de precios se puede expresar del lado del cliente mientras documentes los parámetros que agregaste."  # @src=ad5cea585dcb
                # | There are no coupon or subtotal fields in the spec, and client-computed
                # | pricing is exactly the tamper risk you are escaping; the wallet never
                # | runs your discount logic.
                feedback: "No hay campos coupon ni subtotal en el spec, y el precio calculado del lado del cliente es exactamente el riesgo de manipulación del que te estás escapando; la billetera nunca corre tu lógica de descuento."  # @src=adb066117adb
              c:
                # | Because your server builds the transaction, it computes the discounted
                # | total and injects the memo and reference itself, so pricing never lives
                # | in a customer-edited URL.
                label: "Como tu servidor construye la transacción, calcula el total con descuento e inyecta el memo y la reference él mismo, así que el precio nunca vive en una URL editada por el cliente."  # @src=7748539d715b
                # | Backend-computed values are out of the payer's reach, which stops
                # | tampering but does nothing about replay; a single-use coupon still needs
                # | state on your side.
                feedback: "Los valores calculados en el backend quedan fuera del alcance del pagador, lo que frena la manipulación pero no hace nada contra el replay; un cupón de un solo uso igual necesita estado de tu lado."  # @src=a8dcb04a8e0b
              d:
                # | Because the transaction request runs your discount inside an on-chain
                # | program, so the total is computed by the chain and no query string a
                # | customer edits can change it.
                label: "Como el transaction request corre tu descuento adentro de un programa on-chain, el total lo calcula la blockchain y ninguna query string que un cliente edite puede cambiarlo."  # @src=fdc5745925bd
                # | Nothing custom runs on-chain here. What comes back is a plain v0
                # | transaction holding a memo and a TransferChecked, and the discount was
                # | arithmetic your server did before it built either one.
                feedback: "Acá no corre nada custom on-chain. Lo que vuelve es una transacción v0 pelada que tiene un memo y un TransferChecked, y el descuento fue aritmética que tu servidor hizo antes de construir cualquiera de los dos."  # @src=61ded4cb4114
              a:
                # | Transaction requests add a dedicated coupon query parameter to the
                # | solana: URL, which transfer requests do not expose, so the discount
                # | travels inside the link the customer scans.
                label: "Los transaction requests agregan un parámetro de consulta coupon dedicado a la URL solana:, que los transfer requests no exponen, así que el descuento viaja adentro del link que el cliente escanea."  # @src=5923c743828a
                # | There is no coupon parameter; discount logic is code you run, not a URL
                # | field. This misses why server construction matters.
                feedback: "No hay ningún parámetro coupon; la lógica de descuento es código que corres tú, no un campo de la URL. Esto se pierde por qué importa la construcción del lado del servidor."  # @src=74bf90285658
          q4:
            # | A wallet hits your transaction-request endpoint with a GET before any
            # | purchase happens. What are you expected to return, and why does it come
            # | before the POST?
            prompt: "Una billetera golpea tu endpoint de transaction request con un GET antes de que pase ninguna compra. ¿Qué se espera que devuelvas, y por qué viene antes del POST?"  # @src=fa366b24ade6
            # | The GET is the display step: it returns a label and icon so the wallet can
            # | tell the user who they are paying. Only on the POST, once the wallet sends
            # | {account}, can the server build the transaction for that specific payer.
            # | Splitting the two is what lets the wallet show trustworthy context before
            # | anything is signed.
            explanation: "El GET es el paso de pantalla: devuelve un label y un icon para que la billetera pueda decirle al usuario a quién le está pagando. Recién en el POST, una vez que la billetera manda {account}, el servidor puede construir la transacción para ese pagador específico. Partir los dos es lo que le deja a la billetera mostrar contexto confiable antes de que se firme nada."  # @src=4bafd2a11483
            options:                 # source order — keep it
              c:
                # | The customer's current token balance, so the wallet can decide locally
                # | whether to enable the pay button.
                label: "El saldo de token actual del cliente, para que la billetera pueda decidir localmente si habilita el botón de pagar."  # @src=ad52d23d4098
                # | The endpoint returns merchant display metadata, not the customer's
                # | balance; the wallet already knows its own balances.
                feedback: "El endpoint devuelve los metadatos de pantalla del comercio, no el saldo del cliente; la billetera ya conoce sus propios saldos."  # @src=5e071f270b2a
              b:
                # | The fully built base64 transaction immediately, so the wallet can
                # | preview and prepare the signature without a second round trip.
                label: "La transacción en base64 completamente construida de inmediato, para que la billetera pueda previsualizar y preparar la firma sin un segundo viaje de ida y vuelta."  # @src=b077c222802f
                # | The built transaction is the POST response; you cannot build it on GET
                # | because you do not yet know the paying account.
                feedback: "La transacción construida es la respuesta del POST; no puedes construirla en el GET porque todavía no sabes cuál es la cuenta que paga."  # @src=10963fdf7500
              a:
                # | A label and icon, so the wallet can show the customer who they are about
                # | to pay before it POSTs {account} to fetch the actual transaction.
                label: "Un label y un icon, para que la billetera pueda mostrarle al cliente a quién está a punto de pagarle antes de hacer POST de {account} para buscar la transacción de verdad."  # @src=0aa2e7775cdf
                # | The GET arrives before any payer is known; only payer-independent data
                # | exists yet, and it is self-asserted besides, a wallet rendering whatever
                # | the endpoint claims. Context, not proof.
                feedback: "El GET llega antes de que se conozca ningún pagador; todavía solo existen datos independientes del pagador, y además son autodeclarados, una billetera renderizando lo que sea que el endpoint afirme. Contexto, no demostración."  # @src=8cd566460eff
              d:
                # | A label, an icon, and the order total in USDC, so the wallet can render
                # | the price on its screen before it POSTs {account} for the transaction.
                label: "Un label, un icon y el total del pedido en USDC, para que la billetera pueda renderizar el precio en su pantalla antes de hacer POST de {account} por la transacción."  # @src=cac645623911
                # | Three quarters right and one field too many. The GET response the spec
                # | defines is label and icon; a total you bolt on is a field no wallet
                # | reads, and the price the customer actually sees comes back with the
                # | POST.
                feedback: "Tres cuartos correcto y un campo de más. La respuesta del GET que define el spec es label e icon; un total que le atornilles encima es un campo que ninguna billetera lee, y el precio que el cliente ve de verdad vuelve con el POST."  # @src=35d9c2161aec
  m03-l3:
    # | The record fair: POS, and the mobile-hardware reality
    title: "La feria de discos: la terminal (POS), y la realidad del hardware móvil"  # @src=886741c2bdb9
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | At the record fair a vendor asks if buyers can tap their phone to pay, like
            # | a contactless card terminal. What is the honest answer for Solana Pay today?
            prompt: "En la feria de discos un vendedor pregunta si los compradores pueden apoyar el teléfono para pagar, como en una terminal de tarjetas sin contacto. ¿Cuál es la respuesta honesta para Solana Pay hoy?"  # @src=6d15037a16fd
            # | The research is blunt here: no primary spec or docs support NFC anywhere in
            # | Solana Pay or Solana Mobile. QR is the checkout surface. Promising
            # | tap-to-pay to a vendor would be selling a capability that does not exist, so
            # | the honest build is a QR POS.
            explanation: "La investigación acá es contundente: ningún spec ni documentación primaria respalda NFC en ninguna parte de Solana Pay ni de Solana Mobile. El código QR es la superficie de checkout. Prometerle pago sin contacto a un vendedor sería vender una capacidad que no existe, así que la construcción honesta es un POS de QR."  # @src=ac73a4059228
            options:                 # source order — keep it
              d:
                # | Yes; the spec itself says a Solana Pay URL may be encoded in QR codes or
                # | NFC tags, so a tap flow is defined.
                label: "Sí; el propio spec dice que una URL de Solana Pay puede ir codificada en códigos QR o etiquetas NFC, así que hay un flujo de tap definido."  # @src=9ed0a374a889
                # | That sentence is about transport, not a tap flow. A tag holding the same
                # | solana: string is a QR code you cannot see; the spec defines no reader
                # | protocol, no handshake and no secure element.
                feedback: "Esa oración es sobre transporte, no sobre un flujo de tap. Una etiqueta que lleva la misma cadena solana: es un código QR que no puedes ver; el spec no define ningún protocolo de lector, ningún handshake ni ningún elemento seguro."  # @src=df458e22236a
              b:
                # | No; there is no NFC or tap-to-pay primitive on Solana, and QR remains
                # | the standard checkout surface.
                label: "No; no hay primitiva de NFC ni de pago sin contacto en Solana, y el código QR sigue siendo la superficie estándar de checkout."  # @src=c8cd0ca33020
                # | Nothing in the spec or the mobile stack exposes an NFC path; what you
                # | can offer the vendor is the ergonomics rather than the gesture, since
                # | scanning is also one motion.
                feedback: "Nada en el spec ni en el stack móvil expone un camino de NFC; lo que puedes ofrecerle al vendedor es la ergonomía en vez del gesto, ya que escanear también es un solo movimiento."  # @src=06700a25d265
              c:
                # | Only for Token-2022 mints, whose transfer-hook can carry the tap-to-pay
                # | handshake between the phone and the reader.
                label: "Solo para mints de Token-2022, cuyo transfer-hook puede llevar el handshake de pago sin contacto entre el teléfono y el lector."  # @src=f5372fc93004
                # | Transfer hooks have nothing to do with NFC; there is no tap-to-pay path
                # | on any mint type.
                feedback: "Los transfer hooks no tienen nada que ver con NFC; no hay camino de pago sin contacto en ningún tipo de mint."  # @src=2eac56bf29c2
              a:
                # | Yes, through the Seed Vault NFC extension available on Seeker devices,
                # | which brings tap-to-pay to any stall using one.
                label: "Sí, a través de la extensión NFC de Seed Vault disponible en los dispositivos Seeker, que le trae pago sin contacto a cualquier puesto que use uno."  # @src=ded958702596
                # | There is no Seed Vault NFC payments feature; Seed Vault is hardware key
                # | custody, and no tap-to-pay primitive exists.
                feedback: "No existe ninguna función de pagos por NFC en Seed Vault; Seed Vault es custodia de claves en hardware, y no existe ninguna primitiva de pago sin contacto."  # @src=c9ec244b0410
          q2:
            # | You look for a plug-and-play Solana POS terminal vendor and land on Decaf,
            # | which used to run festival POS. What do you find now, and what is the
            # | takeaway?
            prompt: "Buscas un proveedor de terminales POS plug-and-play para Solana y caes en Decaf, que antes corría el POS de festivales. ¿Qué encuentras ahora, y cuál es la conclusión?"  # @src=ff041e2aa3dd
            # | Decaf's site now sells payment links, invoicing, and remittances across 180+
            # | countries, with the Solana POS past gone. The honest read is that in-store
            # | crypto POS demand was thinner than payout and remittance demand. With no
            # | vendor catalog to lean on, you build the stall on the pay repo's first-party
            # | POS example.
            explanation: "El sitio de Decaf ahora vende links de pago, facturación y remesas en más de 180 países, sin rastro de su pasado de POS en Solana. La lectura honesta es que la demanda de POS de crypto en tienda era más delgada que la demanda de desembolsos y remesas. Sin catálogo de proveedores en el que apoyarte, construyes el puesto sobre el ejemplo de POS propio del repo pay."  # @src=89fd0c78e7bf
            options:                 # source order — keep it
              a:
                # | Decaf now sells a Solana-native card terminal with a merchant dashboard,
                # | so the fastest path is buying their hardware and skipping the QR
                # | checkout entirely.
                label: "Decaf ahora vende una terminal de tarjetas nativa de Solana con un panel de control para el comercio, así que el camino más rápido es comprar su hardware y saltarse el checkout de QR por completo."  # @src=ae02dbbcee7a
                # | Decaf sells no Solana POS hardware; assuming a terminal vendor exists is
                # | exactly the premise the pivot kills.
                feedback: "Decaf no vende ningún hardware de POS de Solana; asumir que existe un proveedor de terminales es exactamente la premisa que mata el giro."  # @src=991a9ad5bfb7
              b:
                # | Decaf was acquired by Solana Mobile and folded into Seeker, so POS now
                # | ships built into the device.
                label: "Decaf fue adquirido por Solana Mobile y absorbido dentro de Seeker, así que el POS ahora viene integrado en el dispositivo."  # @src=c3c87eb16a7a
                # | No such acquisition; Decaf pivoted its own product, and Seeker does not
                # | ship a POS terminal.
                feedback: "No hubo tal adquisición; Decaf le dio un giro a su propio producto, y Seeker no trae ninguna terminal POS."  # @src=c66c92ec7936
              c:
                # | Decaf pivoted to global payment links and remittances, so you build QR
                # | checkout on the pay repo's own examples/point-of-sale instead of buying
                # | a terminal.
                label: "Decaf giró hacia los links de pago globales y las remesas, así que construyes el checkout de QR sobre el propio examples/point-of-sale del repo pay en vez de comprar una terminal."  # @src=b35cd9680ce0
                # | With no terminal vendor in the market, a first-party example is the only
                # | maintained base; an example is not a product, and the upkeep is yours.
                feedback: "Sin ningún proveedor de terminales en el mercado, un ejemplo propio del repo es la única base mantenida; un ejemplo no es un producto, y el mantenimiento es tuyo."  # @src=2b768ffa0527
              d:
                # | Decaf left the Solana POS market for payment links, and the honest read
                # | is that in-store crypto checkout does not work, so tell the vendor to
                # | skip the stall.
                label: "Decaf dejó el mercado de POS de Solana por los links de pago, y la lectura honesta es que el checkout de crypto en tienda no funciona, así que dile al vendedor que se salte el puesto."  # @src=b04ce33afc9c
                # | The pivot says in-store demand was thinner than payout demand, which is
                # | a market fact about vendors rather than a verdict on your table. What it
                # | costs you is the vendor catalog, not the sale.
                feedback: "El giro dice que la demanda en tienda era más delgada que la demanda de desembolsos, que es un dato de mercado sobre los proveedores y no un veredicto sobre tu mesa. Lo que te cuesta es el catálogo de proveedores, no la venta."  # @src=9664dbf97549
          q3:
            # | You need the stall's checkout screen working by Saturday. Which foundation
            # | do you build on, and what should it talk to?
            prompt: "Necesitas la pantalla de checkout del puesto funcionando para el sábado. ¿Sobre qué base construyes, y con qué debería hablar?"  # @src=155ca8212d67
            # | The pay repo ships examples/point-of-sale (a Next.js POS) as a first-party
            # | base. Configuring it to hit your transaction-request endpoint reuses the
            # | server-built pricing you already have. Commerce Kit is beta and blinks are a
            # | different surface, so neither is the stall's foundation.
            explanation: "El repo pay trae examples/point-of-sale (un POS de Next.js) como base propia. Configurarlo para que apunte a tu endpoint de transaction request reusa la lógica de precios del lado del servidor que ya tienes. Commerce Kit está en beta y los blinks son otra superficie, así que ninguno es la base del puesto."  # @src=f6b2f1a9baf1
            options:                 # source order — keep it
              b:
                # | The Commerce Kit PaymentButton component, which ships a hosted merchant
                # | dashboard and is the production-supported POS surface for stalls.
                label: "El componente PaymentButton de Commerce Kit, que trae un panel de control alojado para el comercio y es la superficie de POS soportada en producción para puestos."  # @src=48dffed3f8e9
                # | Commerce Kit is beta ('APIs may change') and ships no hosted dashboard;
                # | it is a mention, not the base for a stall you depend on.
                feedback: "Commerce Kit está en beta ('APIs may change') y no trae ningún panel alojado; es una mención, no la base para un puesto del que dependes."  # @src=09b03df742c0
              a:
                # | The pay repo's first-party examples/point-of-sale, configured to point
                # | at the transaction-request endpoint you built in m03-l2.
                label: "El examples/point-of-sale propio del repo pay, configurado para apuntar al endpoint de transaction request que construiste en m03-l2."  # @src=6867c38df66d
                # | The first-party example is the sanctioned base, and it does more than
                # | display: it finds the payment by reference and validates the transfer
                # | before flipping to confirmed. It still only vouches for the payment it
                # | was watching — the server-side verification discipline arrives in module
                # | 4.
                feedback: "El ejemplo propio del repo es la base sancionada, y hace más que mostrar: encuentra el pago por reference y valida la transferencia antes de saltar a confirmado. Igual solo responde por el pago que estaba mirando — la disciplina de verificación del lado del servidor llega en el módulo 4."  # @src=0017f36360b8
              d:
                # | The pay repo's examples/point-of-sale, left aimed at its own bundled API
                # | route, which already prices the cart and stamps the order id.
                label: "El examples/point-of-sale del repo pay, dejado apuntando a su propia ruta de API empaquetada, que ya le pone precio al carrito y estampa el id de pedido."  # @src=46ff1eef75fb
                # | Right base, wrong target. The bundled route is the example's own demo
                # | endpoint: it holds no catalog, stamps no order id, and knows nothing
                # | about the cart, so aiming the link there throws away three lessons of
                # | pricing you already own.
                feedback: "Base correcta, objetivo equivocado. La ruta empaquetada es el propio endpoint de demo del ejemplo: no tiene ningún catálogo, no estampa ningún id de pedido y no sabe nada del carrito, así que apuntar el link ahí tira a la basura tres lecciones de precios que ya son tuyas."  # @src=00a56054fdd3
              c:
                # | A freshly authored blink, since blinks are the POS-native surface on
                # | mobile at a fair.
                label: "Un blink recién escrito, ya que los blinks son la superficie nativa de POS en móvil en una feria."  # @src=974a1aedce6c
                # | Blinks are a social/link surface, not a POS terminal; that is the next
                # | lesson, and it does not replace the stall.
                feedback: "Los blinks son una superficie social/de link, no una terminal POS; esa es la próxima lección, y no reemplaza al puesto."  # @src=42dd9122aba5
          q4:
            # | A slide for the fair cites 'Seeker has 150,000+ users' and '0% dApp Store
            # | fees.' How should you treat these when advising the vendor?
            prompt: "Una diapositiva para la feria cita 'Seeker has 150,000+ users' y '0% dApp Store fees.' ¿Cómo deberías tratarlas cuando asesoras al vendedor?"  # @src=9e8c2009aa66
            # | Seeker's homepage makes claims (a '150,000+ users' figure with an unclear
            # | referent, a dApp Store '0% platform fees' line) but shipped-unit numbers are
            # | undisclosed. The honest move is homepage-claims phrasing without presenting
            # | the numbers as verified, while still giving the vendor the mobile context.
            explanation: "La página de inicio de Seeker hace afirmaciones (una cifra de '150,000+ users' con un referente poco claro, una línea de '0% platform fees' de la dApp Store) pero los números de unidades despachadas no están divulgados. La jugada honesta es hablar de ellas como afirmaciones de página de inicio, sin presentar los números como verificados y sin dejar de darle al vendedor el contexto móvil."  # @src=ce236394a0c8
            options:                 # source order — keep it
              a:
                # | Cite them as verified adoption metrics, since they appear directly on
                # | Solana Mobile's official site.
                label: "Cítalas como métricas de adopción verificadas, ya que aparecen directamente en el sitio oficial de Solana Mobile."  # @src=e0554f01b993
