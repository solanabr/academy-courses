                # | extension installed.
                label: "Se despliega de forma nativa en X para todos los que lo ven, porque X entregó renderizado de blinks de primera clase dentro del timeline, así que la tarjeta se dibuja sin ninguna extensión instalada."  # @src=38bb08e21b30
                # | Native X rendering is not established; the 'unfurl in the feed' claim is
