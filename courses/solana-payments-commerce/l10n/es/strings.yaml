                label: "Reusas el constructor de m03-l2, y los blinks quedan admitidos en el instante en que pones una API key, ya que la fecha de aplicación es pública y fija."  # @src=040c26c9191a
                # | Reuse is right, but the enforcement date is unsourced and must never be
