            explanation: "@dialectlabs/blinks 0.22.5 (publicado em 2025-04-04) e @solana/actions 1.6.6 (publicado em 2024-11-05) são as versões mais novas que existem; nenhuma mais fresca foi publicada. Este curso não instala nenhum dos dois — ele constrói contra o @solana/actions-spec 2.4.2 e o contrato de wire — mas se algum projeto seu de fato adotar eles, fixe exatamente essas versões com uma nota de obsolescência, porque o investimento da Dialect foi para a Standard Blinks Library hospedada dela em vez do SDK central."  # @src=7ea4be2474ef
            options:                 # source order — keep it
