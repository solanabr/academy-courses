            prompt: "Você entrega o blink do drop e tuita o link, esperando que ele se desdobre em um botão de compra no feed do X. Qual é a realidade honesta de 2026 em torno da qual você deveria projetar?"  # @src=c6d9d78034c7
            # | The research confirms X rendering is Chrome-extension-mediated, and the 2026
            # | native-wallet render list is unverified. The safe design is spec conformance
            # | plus a local blinks client for the lab, with any surface claim living in a
            # | verified-at-write box. Promising a feed render you cannot guarantee is the
            # | trap.
            explanation: "A pesquisa confirma que a renderização no X é mediada por extensão do Chrome, e a lista de 2026 de renderização nativa em carteiras não é verificada. O design seguro é conformidade com a spec mais um client local de blinks para o lab, com qualquer afirmação sobre superfícies morando numa caixa de \"verificado na escrita\". Prometer uma renderização no feed que você não consegue garantir é a armadilha."  # @src=37710f207754
            options:                 # source order — keep it
