                # | commitment, and drop the user numbers.
                label: "Apresente a linha de 0% de taxa como verificada, já que uma afirmação de preço numa homepage é um compromisso, e descarte os números de usuários."  # @src=b66489be0a85
                # | A fee line on a homepage is a pricing claim, which is a thing the vendor
