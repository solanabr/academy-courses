                feedback: "A atenção da Dialect de fato foi para a biblioteca hospedada, mas a 0.22.5 continua publicada e instalável. Congelado e deprecated são estados diferentes, e o congelado dá para fixar, que é o que faz a nota de obsolescência valer a pena escrever."  # @src=be40d5844c17
              c:
