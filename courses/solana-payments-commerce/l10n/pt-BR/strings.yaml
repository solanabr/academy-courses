                label: "O ferramental está congelado desde 2025, então SE você adotar eles, você fixa @dialectlabs/blinks 0.22.5 e @solana/actions 1.6.6 e adiciona uma nota de obsolescência."  # @src=b8f07478839e
                # | Frozen is not broken, just yours to carry; an explicit pin is what makes
