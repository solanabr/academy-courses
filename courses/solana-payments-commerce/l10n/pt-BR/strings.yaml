                label: "A renderização no X é mediada por extensão do Chrome, não nativa, e a lista de superfícies de 2026 é incerta, então verifique no momento da escrita e nunca prometa 'renderiza em todo lugar'."  # @src=6975f32e1b7f
                # | Rendering lives in a client you do not control, and an
                # | extension-mediated unfurl reaches only the viewers who installed it.
                # | Everyone else needs the link to still open a page.
                feedback: "A renderização vive em um client que você não controla, e um desdobramento mediado por extensão alcança só quem instalou ela. Todo mundo mais precisa que o link ainda abra uma página."  # @src=85b4e5140e9f
          q2:
            # | Your blink's action endpoint works when you hit it directly, but wallets
            # | will not load it from your domain. Which two hosting rules did you most
            # | likely miss?
            prompt: "O endpoint de action do seu blink funciona quando você bate nele direto, mas as carteiras não carregam ele do seu domínio. Quais duas regras de hospedagem você mais provavelmente esqueceu?"  # @src=0fd6dfc0df6c
            # | Blinks are discovered through actions.json at the domain root and loaded
            # | cross-origin, so both the actions endpoints and actions.json must send
            # | Access-Control-Allow-Origin: *. Missing either one is the classic 'works in
            # | curl, dead in a wallet' failure.
            explanation: "Blinks são descobertos através do actions.json na raiz do domínio e carregados cross-origin, então tanto os endpoints de actions quanto o actions.json precisam mandar Access-Control-Allow-Origin: *. Esquecer qualquer um dos dois é a falha clássica de 'funciona no curl, morto numa carteira'."  # @src=2503fdcf69ba
            options:                 # source order — keep it
              d:
                # | actions.json has to sit at the domain root, but
                # | Access-Control-Allow-Origin belongs on the action routes alone, since
                # | the discovery file is plain static JSON a browser reads without a
                # | preflight.
                label: "O actions.json tem que ficar na raiz do domínio, mas o Access-Control-Allow-Origin pertence só às rotas de action, já que o arquivo de descoberta é JSON estático puro que um navegador lê sem preflight."  # @src=832c63b38e9b
                # | The discovery fetch is cross-origin like every other one, and preflight
                # | is beside the point: a browser will not hand the response to the client
                # | without the header, whatever the method was. This is the half of the
                # | rule everyone misses.
                feedback: "O fetch de descoberta é cross-origin como todos os outros, e preflight não vem ao caso: um navegador não vai entregar a resposta ao client sem o header, seja qual for o método. Essa é a metade da regra que todo mundo esquece."  # @src=41af3742d882
              c:
                # | You must register the domain with your RPC provider and have the wallet
                # | attach your API key header to every GET it makes, or the provider
                # | refuses the fetch.
                label: "Você precisa registrar o domínio no seu provedor de RPC e fazer a carteira anexar o header da sua chave de API em todo GET que ela faz, ou o provedor recusa o fetch."  # @src=7f889e327388
                # | Wallets do not send your RPC API key; discovery is via actions.json plus
                # | CORS, not RPC registration.
                feedback: "Carteiras não mandam a sua chave de API de RPC; a descoberta é via actions.json mais CORS, não registro no RPC."  # @src=71e6fc89b0e1
              a:
                # | actions.json must sit at the domain root mapping the path, and actions
                # | must send CORS Access-Control-Allow-Origin: * including on actions.json
                # | itself.
                label: "O actions.json precisa ficar na raiz do domínio mapeando o caminho, e as actions precisam mandar CORS Access-Control-Allow-Origin: * inclusive no próprio actions.json."  # @src=1512f25133c0
                # | Wallets fetch from a browser context, and a missing header makes the
                # | browser discard a reply your server sent fine; curl enforces none of
                # | that, which is why the terminal says it works.
                feedback: "Carteiras buscam a partir de um contexto de navegador, e um header faltando faz o navegador descartar uma resposta que o seu servidor mandou direitinho; o curl não impõe nada disso, que é por que o terminal diz que funciona."  # @src=ef6a3d2a79c1
              b:
                # | The endpoint must be served over HTTP/2 with a preflight-exempt POST
                # | route, and it has to hand back the transaction as raw bytes rather than
                # | base64 for the wallet to parse it.
                label: "O endpoint precisa ser servido sobre HTTP/2 com uma rota POST isenta de preflight, e ele tem que devolver a transação como bytes crus em vez de base64 para a carteira conseguir fazer o parse."  # @src=09fda7b5d33f
                # | There is no HTTP/2, preflight-exemption, or raw-bytes requirement; the
                # | transaction is base64, and the loading failure is about discovery and
                # | CORS.
                feedback: "Não existe exigência de HTTP/2, de isenção de preflight nem de bytes crus; a transação é base64, e a falha de carregamento é sobre descoberta e CORS."  # @src=3ae916e9968b
          q3:
