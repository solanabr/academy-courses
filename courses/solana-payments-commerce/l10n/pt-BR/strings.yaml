                label: "Ele renderiza só dentro do navegador in-app da Phantom, então o padrão que funciona é postar o link com uma instrução de 'abrir na Phantom' e aceitar que todo mundo mais não consegue comprar."  # @src=9924db9c75c2
                # | That is an overly specific, unverified claim; the actual render-surface
                # | list for 2026 is uncertain and must be checked at write time.
                feedback: "Essa é uma afirmação específica demais e não verificada; a lista real de superfícies de renderização para 2026 é incerta e precisa ser checada no momento da escrita."  # @src=b4dc1ca362d9
              a:
                # | It unfurls natively in X for every viewer, because X shipped first-class
