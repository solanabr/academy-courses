                label: "Ele se desdobra nativamente no X para todo mundo que vê, porque o X entregou renderização de blink de primeira classe na timeline, então o card desenha sem nenhuma extensão instalada."  # @src=38bb08e21b30
                # | Native X rendering is not established; the 'unfurl in the feed' claim is
                # | frozen at 2024 launch language and is not how it works now.
                feedback: "Renderização nativa no X não está estabelecida; a afirmação de 'desdobrar no feed' está congelada na linguagem de lançamento de 2024 e não é como funciona hoje."  # @src=d78a613f896d
              c:
