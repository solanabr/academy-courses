                feedback: "Congelado não é quebrado, é só seu para carregar; um pin explícito é o que torna essa herança visível para quem ler o manifesto depois."  # @src=21e7a3c8fffd
              a:
                # | A fresh monthly release cadence, so you pin to the newest minor and turn
