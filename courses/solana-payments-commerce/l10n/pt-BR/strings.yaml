                label: "Uma cadência fresca de releases mensais, então você fixa no minor mais novo e liga atualizações automáticas para ficar em dia."  # @src=be4ff02faea7
                # | There is no fresh cadence; the blinks tooling has been effectively
                # | frozen since 2025, so 'stay on latest' is a false comfort.
                feedback: "Não existe cadência fresca; o ferramental de blinks está efetivamente congelado desde 2025, então 'ficar no latest' é um falso conforto."  # @src=38fad5d2c17a
          q4:
            # | Building the featured-record blink, where does the transaction inside your
            # | ActionPostResponse come from, and what can you honestly claim about registry
            # | admission?
            prompt: "Construindo o blink do disco em destaque, de onde vem a transação dentro do seu ActionPostResponse, e o que você pode afirmar com honestidade sobre a admissão no registro?"  # @src=94644c953db2
            # | The blink's transaction is the same code path as the checkout: you reuse the
            # | m03-l2 builder, which is the accretion the ladder is showing. Registry
            # | admission is a manual Dialect review entered by an emailed submission; the
            # | API key gates only the per-URL lookup endpoint, and the enforcement date is
            # | unsourced, so your lab gates on spec conformance plus a local client, not on
            # | registry status.
            explanation: "A transação do blink é o mesmo caminho de código do checkout: você reusa o builder da m03-l2, que é o acúmulo que a escada está mostrando. A admissão no registro é uma revisão manual da Dialect em que se entra por um envio por e-mail; a chave de API só faz gate do endpoint de consulta por URL, e a data de imposição não tem fonte, então o gate do seu lab é conformidade com a spec mais um client local, não o status no registro."  # @src=d952f26353d5
            options:                 # source order — keep it
              d:
                # | You reuse the m03-l2 transaction-request builder, but the
                # | action-identity memo has to ride each transaction, and the registry will
                # | not list an action whose transactions leave that memo out.
                label: "Você reusa o builder de transaction request da m03-l2, mas o memo de action identity tem que viajar em cada transação, e o registro não lista uma action cujas transações deixam esse memo de fora."  # @src=3a05739f0742
                # | Action identity exists so indexers can attribute a transaction back to
                # | the action that produced it, not as an admission ticket. Registration is
                # | an emailed submission into a manual queue, memo or no memo.
                feedback: "Action identity existe para que indexadores consigam atribuir uma transação de volta à action que produziu ela, não como ingresso de admissão. O registro é um envio por e-mail para uma fila manual, com memo ou sem memo."  # @src=f4f1c3d80fdc
              b:
                # | You reuse the m03-l2 builder, and blinks are admitted the instant you
                # | set an API key, since the enforcement date is public and fixed.
                label: "Você reusa o builder da m03-l2, e blinks são admitidos no instante em que você define uma chave de API, já que a data de imposição é pública e fixa."  # @src=040c26c9191a
                # | Reuse is right, but the enforcement date is unsourced and must never be
                # | cited; admission is not instant on setting a key.
                feedback: "Reusar está certo, mas a data de imposição não tem fonte e nunca deve ser citada; a admissão não é instantânea ao definir uma chave."  # @src=92fe951577ad
              c:
                # | You reuse the m03-l2 transaction-request builder (accretion), and
                # | registry admission is a manual Dialect review entered by an emailed
                # | submission, so you cannot gate your lesson on it.
                label: "Você reusa o builder de transaction request da m03-l2 (acúmulo), e a admissão no registro é uma revisão manual da Dialect em que se entra por um envio por e-mail, então você não pode pôr o gate da sua lição nela."  # @src=4127b6d87e92
                # | An Action returns an ordinary transaction, which is why one builder
                # | serves both surfaces. Anything gated on human review has no schedule,
                # | and an unsourced enforcement date is a guess.
                feedback: "Uma Action devolve uma transação comum, que é por que um builder só serve as duas superfícies. Qualquer coisa com gate em revisão humana não tem cronograma, e uma data de imposição sem fonte é um chute."  # @src=7291c87d9a92
              a:
                # | You author a brand-new blink-specific transaction builder because
                # | Actions need a different instruction shape, and admission is automatic
                # | the moment you POST your action to the registry endpoint.
                label: "Você escreve um builder de transação novo em folha, específico de blink, porque Actions precisam de um formato de instrução diferente, e a admissão é automática no momento em que você dá POST da sua action no endpoint do registro."  # @src=86cee4f06675
                # | Actions need no special instruction shape, so reuse the m03-l2 builder
                # | rather than rewriting it; registry admission is a manual review, not an
                # | automatic POST.
                feedback: "Actions não precisam de nenhum formato de instrução especial, então reuse o builder da m03-l2 em vez de reescrever ele; a admissão no registro é uma revisão manual, não um POST automático."  # @src=5571583ad484
  m04-l1:
    # | Trust no frontend: confirmation policy and server-side verification
    title: "Não confie em frontend nenhum: política de confirmação e verificação no servidor"  # @src=25d6143c88db
    blocks:
      harden-verify:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check the token program BEFORE trusting any transfer in the tx.
          0: "Cheque o programa de token ANTES de confiar em qualquer transferência da tx."  # @src=034740b71003
          # | Compute the amount from postAmount - preAmount on your own ATA, never from a
          # | client field.
          1: "Compute o valor a partir de postAmount - preAmount na sua própria ATA, nunca a partir de um campo do cliente."  # @src=1b4f129d5d68
          # | Order matters: return the first failing reason so tests see exactly one.
          2: "A ordem importa: devolva o primeiro motivo que falhar para que os testes vejam exatamente um."  # @src=2513218efacc
        tests:                      # keyed by test case id
          t1:
            # | A real, correct USDC payment for the order verifies.
            description: "Um pagamento em USDC real e correto para o pedido verifica."  # @src=7497771a1ab2
          t2:
            # | A signature already fulfilled (webhook retry / replay) is rejected as
            # | duplicate.
            description: "Uma signature já cumprida (retry de webhook / replay) é rejeitada como duplicate."  # @src=b16bf67c7446
          t3:
            # | Right mint and amount but moved by the wrong token program is rejected.
            description: "Mint e valor certos mas movidos pelo programa de token errado é rejeitado."  # @src=d98aec67f091
          t4:
            # | A different token (USDT) landing in the ATA is not USDC and is rejected.
            description: "Um token diferente (USDT) aterrissando na ATA não é USDC e é rejeitado."  # @src=da7818f13bd1
          t5:
            # | The balance delta on our own account is short of the order amount.
            description: "O delta de saldo na nossa própria conta fica abaixo do valor do pedido."  # @src=ae5ee3d2fa6c
          t6:
            # | Correct payment but the memo ties it to a different order.
            description: "Pagamento correto mas o memo amarra ele a outro pedido."  # @src=6eb1af7eedc2
          t7:
            # | A transaction whose transfers never touch the recipient ATA (attacker paid
            # | their own account) is rejected as no-payment.
            description: "Uma transação cujas transferências nunca encostam na ATA do destinatário (o atacante pagou a própria conta) é rejeitada como no-payment."  # @src=b1e9aa360d18
          t8:
            # | The fulfilled-signature set is non-empty but holds OTHER orders' signatures:
            # | this payment is new and must verify (a length check would reject every sale
            # | after the first).
            description: "O conjunto de signatures cumpridas não está vazio mas guarda signatures de OUTROS pedidos: este pagamento é novo e tem que verificar (uma checagem de tamanho rejeitaria toda venda depois da primeira)."  # @src=018b888f607a
          t9:
            # | A wholesale settlement one base unit short, above 2**53: exact with BigInt,
            # | invisible to Number() (both sides round to the same float).
            description: "Uma liquidação de atacado uma unidade base a menos, acima de 2**53: exata com BigInt, invisível para Number() (os dois lados arredondam para o mesmo float)."  # @src=76c7bd829cf7
          t10:
            # | A debit OUT of our ATA (a clawback, post < pre) is a negative delta, never a
            # | payment: taking its absolute value would score it as a full credit.
            description: "Um débito SAINDO da nossa ATA (um clawback, post < pre) é um delta negativo, nunca um pagamento: tirar o valor absoluto dele contaria como crédito integral."  # @src=053b33ebad56
          t11:
            # | A memo for order ORD-42710 must not fulfil ORD-4271: the reference check is
            # | equality, not containment.
            description: "Um memo para o pedido ORD-42710 não pode cumprir ORD-4271: a checagem de reference é igualdade, não contenção."  # @src=e713763accd9
          t12:
            # | The other containment direction: a memo of ORD-427 is a prefix of the order
            # | ref and must still be rejected.
            description: "A outra direção de contenção: um memo de ORD-427 é prefixo da ref do pedido e mesmo assim tem que ser rejeitado."  # @src=a804b9b7dec9
          t13:
            # | A look-alike mint sharing USDC's first forty characters is still the wrong
            # | mint: addresses compare whole, never by prefix.
            description: "Um mint sósia que compartilha os quarenta primeiros caracteres do USDC continua sendo o mint errado: endereços se comparam inteiros, nunca por prefixo."  # @src=3e5bebaa9e6b
          t14:
            # | A settlement exactly at expectedAmount, both above 2**53: converting to
            # | Number() first rounds the delta down and a mixed number/bigint compare
            # | wrongly reads it as underpaid, even though BigInt subtraction shows it is
            # | exact.
            description: "Uma liquidação exatamente em expectedAmount, os dois acima de 2**53: converter para Number() primeiro arredonda o delta para baixo e uma comparação mista de number/bigint lê ele erroneamente como underpaid, mesmo a subtração com BigInt mostrando que é exato."  # @src=5dfeafbf6a57
      check-policy:                      # quiz
        questions:
          q1:
            # | Wavelength waits for the strongest commitment level on a $6 single-record
            # | checkout and settles for the middle one on a $6,000 wholesale invoice. Your
            # | lead says that is backwards. Which pairing matches the risk?
            prompt: "A Wavelength espera pelo commitment level mais forte num checkout de um disco só de US$ 6 e se contenta com o do meio numa fatura de atacado de US$ 6,000. O seu líder diz que isso está invertido. Qual emparelhamento combina com o risco?"  # @src=8cc6b494eeb0
            # | Commitment is a policy knob tied to the cost of a reversed payment.
            # | `confirmed` (about 1-2s, ecosystem estimate) fits low-value goods;
            # | `finalized` (roughly 31+ confirmations) earns its latency only when a
            # | fork-dropped payment would actually hurt. `processed` is UI-only.
            explanation: "Commitment é um botão de política amarrado ao custo de um pagamento revertido. `confirmed` (mais ou menos 1-2s, estimativa do ecossistema) cabe em mercadoria de valor baixo; `finalized` (mais ou menos 31+ confirmações) só merece a latência dele quando um pagamento derrubado por fork realmente doeria. `processed` é só para UI."  # @src=ee4573f894ab
            options:                 # source order — keep it
              c:
                # | Gate both on `finalized`: waiting 31+ confirmations on every order gives
                # | ops one uniform rule instead of a judgement call.
                label: "Condicione os dois a `finalized`: esperar 31+ confirmações em todo pedido dá ao time de ops uma regra uniforme em vez de uma decisão de julgamento."  # @src=8e0e64cebf2c
                # | A uniform rule is not free. Finalizing a $6 record adds about 10s of
                # | ecosystem-estimated latency for risk that rounds to zero, and commitment
                # | is a per-value decision, not a constant.
                feedback: "Uma regra uniforme não sai de graça. Finalizar um disco de US$ 6 adiciona mais ou menos 10s de latência estimada pelo ecossistema por um risco que arredonda para zero, e commitment é uma decisão por valor, não uma constante."  # @src=eeb2a7611df2
              a:
                # | Gate the $6 record on `confirmed` and the $6,000 invoice on `finalized`.
                label: "Condicione o disco de US$ 6 a `confirmed` e a fatura de US$ 6,000 a `finalized`."  # @src=2dfdf303de70
                # | Commitment trades latency for fork risk, and expected loss scales with
                # | the ticket; value is the input, not the product category.
                feedback: "Commitment troca latência por risco de fork, e a perda esperada escala com o ticket; o valor é a entrada, não a categoria do produto."  # @src=0f21dc75548a
              d:
                # | Gate both on `confirmed`; the wholesale invoice is a known account under
                # | contract, so that risk is covered.
                label: "Condicione os dois a `confirmed`; a fatura de atacado é uma conta conhecida sob contrato, então esse risco está coberto."  # @src=e53b70f1ad27
                # | Commitment prices fork risk, and a fork does not care who the buyer is.
                # | Knowing the counterparty helps with collections and with fraud; it does
                # | nothing about a block being dropped after you shipped.
                feedback: "Commitment precifica risco de fork, e um fork não está nem aí para quem é o comprador. Conhecer a contraparte ajuda na cobrança e na fraude; não faz nada contra um bloco ser descartado depois de você ter despachado."  # @src=31e3ef45665e
              b:
                # | Keep both on `processed`, since it returns fastest and the wallet
                # | already showed the buyer a success screen.
                label: "Mantenha os dois em `processed`, já que ele retorna mais rápido e a carteira já mostrou uma tela de sucesso para o comprador."  # @src=513f2b126529
                # | `processed` is UI-only and can be dropped in a fork; it is never a
                # | fulfillment source of truth for either amount.
                feedback: "`processed` é só para UI e pode ser descartado num fork; ele nunca é fonte da verdade de cumprimento para nenhum dos dois valores."  # @src=cdd346732346
          q2:
            # | Compared to your card-rail integration, what does the no-chargeback
            # | asymmetry actually change?
            prompt: "Comparado com a sua integração de trilho de cartão, o que a assimetria do sem-chargeback muda de fato?"  # @src=392b5f560f4d
            # | Cards give you a costly reversal path; these rails do not. That asymmetry is
            # | exactly why the server, not the wallet's green check, must be the source of
            # | truth, and why the refund flow two lessons later is original construction.
            explanation: "Cartões te dão um caminho de reversão caro; estes trilhos não. Essa assimetria é exatamente por que o servidor, e não o check verde da carteira, tem que ser a fonte da verdade, e por que o fluxo de reembolso duas lições adiante é construção original."  # @src=f98dd83b5c46
            options:                 # source order — keep it
              c:
                # | Refunds become automatic since disputes can't happen, so no refund code
                # | is needed.
                label: "Reembolsos viram automáticos já que disputas não podem acontecer, então não precisa de código de reembolso."  # @src=e0cd411d90bf
                # | Disputes-as-chargebacks vanish, but refunds are a separate thing you
                # | must build by hand; they are absent from every official doc.
                feedback: "Disputas-como-chargebacks somem, mas reembolsos são outra coisa que você tem que construir na mão; eles estão ausentes de toda documentação oficial."  # @src=fe6984892954
              a:
                # | Nothing operationally: you still rely on the network to reverse a bad
                # | payment, the way an issuer claws back a card charge.
                label: "Nada operacionalmente: você continua contando com a rede para reverter um pagamento ruim, do jeito que um emissor estorna uma cobrança de cartão."  # @src=44807928fe45
                # | There is no dispute window and no reversal path; the network will not
                # | claw anything back for you the way an issuer does.
                feedback: "Não existe janela de disputa nem caminho de reversão; a rede não vai estornar nada para você do jeito que um emissor faz."  # @src=a10592a933d9
              b:
                # | Fulfillment mistakes are final, so server-side verification is your only
                # | backstop.
                label: "Erros de cumprimento são definitivos, então verificação no servidor é a sua única linha de defesa."  # @src=184dc37abe7e
                # | With no reversal path, the only control point sits before you ship. What
                # | it backstops is a fake payment, not a buyer who's changed their mind.
                feedback: "Sem caminho de reversão, o único ponto de controle fica antes de você despachar. O que ela segura é um pagamento falso, não um comprador que mudou de ideia."  # @src=1a52acf84d46
              d:
                # | Fraud drops to zero: payments are final once they settle, so fulfillment
                # | needs no verifying beyond the wallet's own screen.
                label: "A fraude cai a zero: pagamentos são definitivos assim que liquidam, então cumprimento não precisa de verificação além da própria tela da carteira."  # @src=f91d19efa48b
                # | One direction of fraud closes and another opens wider. Nobody can claw a
                # | payment out of your account, but a buyer who gets you to ship against a
                # | payment that was never yours keeps the goods, and no rail exists to undo
                # | that.
                feedback: "Uma direção de fraude fecha e outra abre mais. Ninguém consegue estornar um pagamento da sua conta, mas um comprador que te faz despachar contra um pagamento que nunca foi seu fica com a mercadoria, e não existe trilho para desfazer isso."  # @src=91a694d3ea11
      check-verify:                      # quiz
        questions:
          q3:
            # | Your verifier confirms a transaction exists with the right signature and the
            # | right USDC amount into your ATA, and fulfills. A buyer drains inventory for
            # | free. What did the check miss?
            prompt: "O seu verifier confirma que existe uma transação com a signature certa e o valor certo de USDC entrando na sua ATA, e cumpre. Um comprador drena o estoque de graça. O que a checagem deixou passar?"  # @src=9c73f905920e
            # | Validating the mint is not enough; you must validate the token PROGRAM too
            # | (Token vs Token-2022). The verifier checks program, then mint, then the
            # | on-chain balance delta on your own account, never a client-supplied number.
            explanation: "Validar o mint não basta; você tem que validar o PROGRAMA de token também (Token vs Token-2022). O verifier checa programa, depois mint, depois o delta de saldo on-chain na sua própria conta, nunca um número fornecido pelo cliente."  # @src=b3f8d8851d76
            options:                 # source order — keep it
              c:
                # | It never checked the token program, so a Token-2022 look-alike mint
                # | passed as classic-Token USDC.
                label: "Ela nunca checou o programa de token, então um mint sósia Token-2022 passou como USDC do Token clássico."  # @src=1ed02c291e62
                # | An asset's identity is the owning program and the mint together, and a
                # | decoded amount names neither; even both are not the last check, since
                # | the delta on your own account decides.
                feedback: "A identidade de um ativo é o programa dono e o mint juntos, e um valor decodificado não nomeia nenhum dos dois; e mesmo os dois não são a última checagem, já que quem decide é o delta na sua própria conta."  # @src=1808afbce06e
              d:
                # | It fulfilled at `confirmed`, so a fork dropped that block minutes after
                # | the record shipped.
                label: "Ela cumpriu em `confirmed`, então um fork descartou aquele bloco minutos depois de o disco ser despachado."  # @src=cf66aabc1ec9
                # | A dropped block leaves nothing behind: getTransaction stops answering
                # | for that signature, so the check would fail rather than pass. Repeatable
                # | free inventory means a payment that keeps passing your checks, not one
                # | that disappears.
                feedback: "Um bloco descartado não deixa nada para trás: getTransaction para de responder por aquela signature, então a checagem falharia em vez de passar. Estoque de graça repetível quer dizer um pagamento que continua passando pelas suas checagens, não um que desaparece."  # @src=5115e7027bd4
              a:
                # | The blockhash expired, so the amount it read was stale: getTransaction
                # | returned a pre-expiry snapshot of the ATA instead of the settled
                # | balance.
                label: "O blockhash expirou, então o valor que ela leu estava velho: getTransaction devolveu uma foto da ATA anterior à expiração em vez do saldo liquidado."  # @src=6f153c8436b7
                # | An expired blockhash means the transaction never lands at all, and
                # | getTransaction reports the balances the runtime actually recorded; a
                # | landed transfer with a real delta is not stale.
                feedback: "Um blockhash expirado quer dizer que a transação simplesmente nunca aterrissa, e getTransaction reporta os saldos que o runtime de fato registrou; uma transferência que aterrissou com um delta real não está velha."  # @src=b56a14e5d7a2
              b:
                # | It should have trusted the wallet's `paid: true` flag as a corroborating
                # | second signal.
                label: "Ela deveria ter confiado na flag `paid: true` da carteira como segundo sinal de corroboração."  # @src=8d971b9e00db
                # | The frontend flag is the thing you must NOT trust; it is spoofable, and
                # | it is the whole reason server-side verification exists.
                feedback: "A flag do frontend é justamente a coisa em que você NÃO pode confiar; ela é falsificável, e é a razão inteira de a verificação no servidor existir."  # @src=43a93ff060d4
          q4:
            # | Why does the verifier store every processed signature, and where does that
            # | bite?
            prompt: "Por que o verifier guarda toda signature processada, e onde isso morde?"  # @src=3560413de66c
            # | Signatures are deterministic, so a redelivered webhook produces the same
            # | signature, and storing processed ones makes fulfillment exactly-once. The
            # | cost is unbounded state, so you evict past a horizon (for example, beyond
            # | the blockhash lifetime plus a margin).
            explanation: "Signatures são determinísticas, então um webhook reentregue produz a mesma signature, e guardar as processadas torna o cumprimento exactly-once. O custo é estado ilimitado, então você descarta passado um horizonte (por exemplo, além do tempo de vida do blockhash mais uma margem)."  # @src=665e7d88f379
            options:                 # source order — keep it
              a:
                # | To prevent double-fulfillment on webhook redelivery; the set grows
                # | unbounded, so it needs an eviction horizon.
                label: "Para impedir cumprimento duplo na reentrega de webhook; o conjunto cresce sem limite, então ele precisa de um horizonte de descarte."  # @src=d001261b3235
                # | A redelivered event carries the same deterministic signature, which is
                # | what makes fulfillment exactly-once; a horizon shorter than blockhash
                # | lifetime plus retries reopens the hole.
                feedback: "Um evento reentregue carrega a mesma signature determinística, que é o que torna o cumprimento exactly-once; um horizonte mais curto que o tempo de vida do blockhash mais os retries reabre o buraco."  # @src=f160fabbf769
              d:
                # | To prevent double-fulfillment on webhook redelivery; entries get evicted
                # | once the blockhash window closes about 45 seconds later.
                label: "Para impedir cumprimento duplo na reentrega de webhook; as entradas são descartadas assim que a janela do blockhash fecha, mais ou menos 45 segundos depois."  # @src=22bdd660340d
                # | Right reason, horizon too short. Blockhash expiry closes on-chain
                # | replay, but your webhook provider will happily redeliver long after
                # | that, so the entry has to outlive the retry window as well as the
                # | chain's.
                feedback: "Motivo certo, horizonte curto demais. A expiração do blockhash fecha o replay on-chain, mas o seu provedor de webhook vai reentregar alegremente muito depois disso, então a entrada tem que sobreviver à janela de retry além da janela da blockchain."  # @src=b1bfb09aaed2
              c:
                # | To satisfy Alpenglow's finality requirement: a payment counts as trusted
                # | only once its signature has been retained across the finality window.
                label: "Para satisfazer o requisito de finality do Alpenglow: um pagamento só conta como confiável depois de a signature dele ter sido retida ao longo da janela de finality."  # @src=383898e036d0
                # | Alpenglow is a labeled roadmap flag here, not a live gate; today's dedup
                # | is about webhook retries, not finality mechanics.
                feedback: "O Alpenglow aqui é uma bandeira de roadmap rotulada, não um gate ativo; o dedup de hoje é sobre retries de webhook, não sobre mecânica de finality."  # @src=a80c8c61fd40
              b:
                # | To speed up getTransaction: a cached signature skips the RPC round-trip,
                # | so a redelivered event costs one local lookup instead of a fetch.
                label: "Para acelerar o getTransaction: uma signature em cache pula a ida e volta ao RPC, então um evento reentregue custa uma consulta local em vez de um fetch."  # @src=367773e9518a
                # | The stored set is a dedup guard, not an RPC cache; verification still
                # | fetches the transaction to check it.
                feedback: "O conjunto guardado é uma guarda de dedup, não um cache de RPC; a verificação ainda busca a transação para checar ela."  # @src=e88ad7a9172e
  m04-l2:
    # | Webhooks that lie: ingestion and idempotency
    title: "Webhooks que mentem: ingestão e idempotência"  # @src=aa0d4a33fc70
    blocks:
      check:                      # quiz
        questions:
          q5:
            # | Helius redelivers your TRANSFER webhook three times for one real payment.
            # | Why, and what keeps you from shipping three records?
            prompt: "A Helius reentrega o seu webhook TRANSFER três vezes para um pagamento real. Por quê, e o que te impede de despachar três discos?"  # @src=ed1e5e069f53
            # | Retries on unsuccessful (roughly non-2xx) responses mean duplicate events
            # | are normal. The transaction signature is deterministic and unique per
            # | payment, so keying idempotency on it makes fulfillment exactly-once. And
            # | this one you do not have to infer: Helius's own webhook best practices say
            # | to use the `signature` field to deduplicate.
            explanation: "Retries em respostas sem sucesso (grosso modo, não-2xx) querem dizer que eventos duplicados são normais. A signature da transação é determinística e única por pagamento, então chavear a idempotência nela torna o fulfillment exatamente-uma-vez. E esta aqui você não precisa inferir: as próprias boas práticas de webhook da Helius dizem para usar o campo `signature` para deduplicar."  # @src=725ce4ce6f9d
            options:                 # source order — keep it
              c:
                # | It's a bug in helius-sdk 3.1.0's delivery retry loop; pin an older SDK
                # | version and the duplicate deliveries stop.
                label: "É um bug no loop de retry de entrega do helius-sdk 3.1.0; fixe uma versão mais antiga do SDK e as entregas duplicadas param."  # @src=18087908aa31
                # | Redelivery on non-2xx is documented behavior, not a bug; the fix is
                # | idempotency, not a downgrade.
                feedback: "Reentrega em não-2xx é comportamento documentado, não um bug; a correção é idempotência, não um downgrade."  # @src=23bf414268af
              a:
                # | Three separate payments landed, so fulfill each: one delivery is emitted
                # | per settled transfer, and three deliveries mean three settled transfers.
                label: "Três pagamentos separados aterrissaram, então atenda cada um: uma entrega é emitida por transferência liquidada, e três entregas querem dizer três transferências liquidadas."  # @src=4e13fc52dda6
                # | One payment produces one signature no matter how many times the webhook
                # | is delivered; deliveries are not transfers, and treating them as
                # | payments over-fulfills.
                feedback: "Um pagamento produz uma signature não importa quantas vezes o webhook seja entregue; entregas não são transferências, e tratar elas como pagamentos leva a atender demais."  # @src=8826ce35786f
              b:
                # | Helius retries any event your server didn't answer with a 2xx, so
                # | de-dupe on the transaction signature.
                label: "A Helius reenvia qualquer evento que o seu servidor não respondeu com um 2xx, então deduplique pela signature da transação."  # @src=1de4123566ad
                # | At-least-once delivery means the key has to come from the payment rather
                # | than the delivery; a per-delivery id changes on every retry and lets all
                # | three through.
                feedback: "Entrega pelo-menos-uma-vez quer dizer que a chave tem que vir do pagamento e não da entrega; um id por entrega muda a cada retry e deixa os três passarem."  # @src=fd6c6cd11816
              d:
                # | Helius retries on any non-2xx answer, so de-dupe on a per-delivery event
                # | id off the request rather than on anything in the payment.
                label: "A Helius reenvia em qualquer resposta não-2xx, então deduplique por um id de evento por entrega tirado da requisição em vez de por qualquer coisa do pagamento."  # @src=bdd65d24f290
                # | The diagnosis is right and the key is wrong, and it fails before you
                # | even get to the key: the enhanced payload has no delivery or attempt id
                # | in it. Its fields are `signature`, `type`, `slot`, `timestamp`,
                # | `feePayer`, `tokenTransfers` and the rest of the parsed transaction, and
                # | the one header you control, `authHeader`, is a constant you chose. There
                # | is nothing per-delivery to key on — and anything that did vary per
                # | attempt would differ across all three retries and let all three through.
                # | Only something derived from the payment stays constant.
                feedback: "O diagnóstico está certo e a chave está errada, e isso falha antes mesmo de você chegar na chave: o payload enhanced não tem id de entrega nem de tentativa dentro dele. Os campos dele são `signature`, `type`, `slot`, `timestamp`, `feePayer`, `tokenTransfers` e o resto da transação parseada, e o único header que você controla, `authHeader`, é uma constante que você escolheu. Não existe nada por entrega para chavear — e qualquer coisa que de fato variasse por tentativa seria diferente nos três retries e deixaria os três passarem. Só algo derivado do pagamento fica constante."  # @src=6fa3f5f6cde5
          q6:
            # | A webhook arrives with a valid-looking TRANSFER payload and a signature
            # | you've never seen. Before writing an order, what must happen?
            prompt: "Um webhook chega com um payload TRANSFER de aparência válida e uma signature que você nunca viu. Antes de escrever um pedido, o que tem que acontecer?"  # @src=83ee32702425
            # | A webhook is a notification, not proof. Every event runs through the m04-l1
            # | verifier against on-chain state before fulfillment; a spoofed payload fails
            # | verification and never reaches the ledger.
            explanation: "Um webhook é uma notificação, não uma prova. Todo evento passa pelo verificador de m04-l1 contra o estado on-chain antes do fulfillment; um payload spoofado falha na verificação e nunca chega no livro-razão."  # @src=579d1e49f7c0
            options:                 # source order — keep it
              d:
                # | Check the shared secret on the request header; once the payload proves
                # | it came from Helius, its parsed amount and mint are trustworthy.
                label: "Cheque o segredo compartilhado no header da requisição; assim que o payload provar que veio da Helius, o valor e o mint parseados dele são confiáveis."  # @src=32243abf5658
                # | The auth header is a bouncer, not proof. A shared secret leaks, sits in
                # | a config dump, or gets guessed, and even a genuine delivery only tells
                # | you Helius saw something, never that the something paid this order.
                feedback: "O header de auth é um segurança de porta, não uma prova. Um segredo compartilhado vaza, fica num dump de configuração ou é adivinhado, e mesmo uma entrega genuína só te diz que a Helius viu alguma coisa, nunca que essa alguma coisa pagou este pedido."  # @src=4ebe65c69118
              c:
                # | Verify the signature on-chain with the server-side verifier (program,
                # | mint, delta, memo) before the ledger records any fulfillment.
                label: "Verifique a signature on-chain com o verificador do lado do servidor (programa, mint, delta, memo) antes de o livro-razão registrar qualquer fulfillment."  # @src=9ac46279ef07
                # | The only field a webhook can be trusted for is the pointer. The rest is
                # | decoration until chain state confirms it, and that goes for any push
                # | source, your own frontend included.
                feedback: "O único campo para o qual dá para confiar num webhook é o ponteiro. O resto é decoração até o estado da blockchain confirmar, e isso vale para qualquer fonte de push, incluindo o seu próprio frontend."  # @src=dc6cfdeb09ed
              b:
                # | Answer 2xx immediately and fulfill, then verify asynchronously later if
                # | you have time.
                label: "Responda 2xx imediatamente e atenda, depois verifique de forma assíncrona mais tarde se tiver tempo."  # @src=87a5dcd430e2
                # | Fulfilling before verification is the spoof's whole attack; verification
                # | gates fulfillment, not the other way round.
                feedback: "Atender antes da verificação é o ataque inteiro do spoof; a verificação é o portão do fulfillment, não o contrário."  # @src=825054333987
              a:
                # | Trust the enhanced payload's amount and mint, since Helius already
                # | parsed them and re-checking is wasted work.
                label: "Confie no valor e no mint do payload enhanced, já que a Helius já parseou eles e rechecar é trabalho desperdiçado."  # @src=f7e6078c4df2
                # | The payload can be spoofed or simply wrong; the m04-l1 verifier exists
                # | precisely so you never fulfill from a webhook's numbers.
                feedback: "O payload pode ser spoofado ou simplesmente estar errado; o verificador de m04-l1 existe precisamente para você nunca atender a partir dos números de um webhook."  # @src=25e2d9bbe2ed
          q7:
            # | Your endpoint starts timing out under load and Helius auto-disables the
            # | webhook. What is the real lesson for scaling ingestion?
            prompt: "O seu endpoint começa a dar timeout sob carga e a Helius desativa o webhook automaticamente. Qual é a lição de verdade para escalar ingestão?"  # @src=20d958a9c587
            # | Auto-disable at sustained failure is a guardrail, not a bug. Webhooks fit
            # | merchant-ops volume; at indexing scale you move to Yellowstone gRPC, and
            # | this course hands that depth to Client-Side Mastery rather than teaching it
            # | here.
            explanation: "A desativação automática em falha sustentada é um guarda-corpo, não um bug. Webhooks servem para volume de operações de lojista; em escala de indexação você migra para Yellowstone gRPC, e este curso entrega essa profundidade ao Client-Side Mastery em vez de ensinar ela aqui."  # @src=b924b1df2c64
            options:                 # source order — keep it
              b:
                # | Raise the retry count and poll `getSignaturesForAddress` in a tight loop
                # | as the backup path, so no event is lost while the endpoint recovers
                # | under load.
                label: "Aumente a contagem de retries e faça polling de `getSignaturesForAddress` num loop apertado como caminho reserva, para nenhum evento se perder enquanto o endpoint se recupera sob carga."  # @src=ff3d5c085343
                # | RPC polling is exactly what the official guidance calls insufficient at
                # | scale; a tight loop worsens the load that disabled you rather than
                # | fixing it.
                feedback: "Polling de RPC é exatamente o que a orientação oficial chama de insuficiente em escala; um loop apertado piora a carga que te desativou em vez de consertar."  # @src=7ce399766ce7
              c:
                # | Switch from Enhanced to Raw webhooks: Raw payloads are smaller, so your
                # | endpoint answers in time and never trips the auto-disable policy.
                label: "Troque webhooks Enhanced por Raw: payloads Raw são menores, então o seu endpoint responde a tempo e nunca dispara a política de desativação automática."  # @src=f3776a19e01b
                # | Raw lowers latency but leaves the auto-disable-on-failure policy
                # | untouched; the failure is your endpoint, not the event type.
                feedback: "O Raw baixa a latência mas deixa a política de desativação automática por falha intocada; a falha é o seu endpoint, não o tipo de evento."  # @src=6dcce5d0fbda
              d:
                # | Shard the watch list across several webhooks pointing at the same
                # | endpoint, so no single one sustains enough failures to trip the
                # | guardrail.
                label: "Divida a lista de observação entre vários webhooks apontando para o mesmo endpoint, para nenhum deles sozinho sustentar falhas suficientes para disparar o guarda-corpo."  # @src=c31ec3f66870
                # | Splitting the deliveries does not split the load: the same endpoint
                # | still receives every event and still times out, and now several webhooks
                # | accumulate failures instead of one. The bottleneck is handler capacity.
                feedback: "Dividir as entregas não divide a carga: o mesmo endpoint continua recebendo todo evento e continua dando timeout, e agora vários webhooks acumulam falhas em vez de um. O gargalo é a capacidade do handler."  # @src=44b30447518d
              a:
                # | Webhooks disable at sustained failure by design; ingestion at volume
                # | belongs on Yellowstone gRPC indexing.
                label: "Webhooks desativam em falha sustentada por design; ingestão em volume pertence à indexação com Yellowstone gRPC."  # @src=5be69390a60d
                # | Auto-disable is backpressure protecting the sender, and the fix is
                # | capacity, not a setting. A stream lifts the delivery ceiling but not the
                # | dedup requirement, since reconnects replay.
                feedback: "A desativação automática é backpressure protegendo quem envia, e a correção é capacidade, não uma configuração. Um stream levanta o teto de entrega mas não a exigência de dedup, já que reconexões dão replay."  # @src=6e6e9f77e38e
          q8:
            # | You've integrated Stripe before. Which mapping is the honest one for this
            # | webhook work?
            prompt: "Você já integrou a Stripe antes. Qual mapeamento é o honesto para este trabalho de webhook?"  # @src=5c4a9e33e559
            # | The map-from-known: a Stripe integrator already de-dupes on idempotency keys
            # | and handles retries. Swap the idempotency key for the on-chain signature and
            # | the pattern transfers almost verbatim.
            explanation: "O mapa a partir do conhecido: um integrador da Stripe já deduplica por chaves de idempotência e lida com retries. Troque a chave de idempotência pela signature on-chain e o padrão se transfere quase ao pé da letra."  # @src=6ec4a0ac5d2e
            options:                 # source order — keep it
              b:
                # | It's Stripe webhook hygiene with different keys: the transaction
                # | signature plays the idempotency key's role.
                label: "É higiene de webhook da Stripe com chaves diferentes: a signature da transação faz o papel da chave de idempotência."  # @src=9c20d8592085
                # | The delivery semantics are identical, and the hygiene ports over intact;
                # | Stripe signs its payloads, though, and here you re-read the chain
                # | instead.
                feedback: "A semântica de entrega é idêntica, e a higiene se transfere intacta; a Stripe assina os payloads dela, porém, e aqui você relê a blockchain em vez disso."  # @src=975bf167509d
              a:
                # | There's no analogy; chain webhooks are a brand-new discipline with
                # | nothing in a PSP integration to reuse.
                label: "Não existe analogia; webhooks de blockchain são uma disciplina totalmente nova sem nada de uma integração de PSP para reaproveitar."  # @src=3cf52f377c8f
                # | It is largely the same discipline; pretending it's novel hides the reuse
                # | of hard-won PSP hygiene.
                feedback: "É em grande parte a mesma disciplina; fingir que é inédita esconde o reaproveitamento da higiene de PSP conquistada a duras penas."  # @src=5b6846985584
              d:
                # | It's Stripe webhook hygiene with different keys, but re-reading the
                # | chain has no Stripe counterpart at all.
                label: "É higiene de webhook da Stripe com chaves diferentes, mas reler a blockchain não tem contrapartida nenhuma na Stripe."  # @src=40f07980454f
                # | That half ports over too. Retrieving the PaymentIntent before fulfilling
                # | is the Stripe habit the chain read replaces, and an integrator who
                # | already refuses to fulfil from a return URL is doing the same thing
                # | against a different source of truth.
                feedback: "Essa metade também se transfere. Buscar o PaymentIntent antes de atender é o hábito da Stripe que a leitura da blockchain substitui, e um integrador que já se recusa a atender a partir de uma URL de retorno está fazendo a mesma coisa contra uma fonte de verdade diferente."  # @src=0e0d13ff1f24
              c:
                # | It maps to Stripe's settlement report rather than its webhooks, since
                # | the shared discipline is end-of-day matching of payouts against orders,
                # | not event delivery.
                label: "Mapeia para o relatório de liquidação da Stripe e não para os webhooks dela, já que a disciplina compartilhada é o casamento de fim de dia de repasses contra pedidos, não entrega de eventos."  # @src=78afd2db95a5
                # | End-of-day matching is a later lesson's reconciliation work; the direct
                # | map here is Stripe's webhook idempotency, not its settlement report.
                feedback: "Casamento de fim de dia é o trabalho de conciliação de uma lição posterior; o mapa direto aqui é a idempotência de webhook da Stripe, não o relatório de liquidação dela."  # @src=cb55917c342b
  m04-l3:
    # | Reconciliation, refunds, and partial fills: the missing manual
    title: "Conciliação, reembolsos e pagamentos parciais: o manual que falta"  # @src=4ca154c18224
    blocks:
      check:                      # quiz
        questions:
          q9:
            # | You want one reconciler for both Solana Pay checkouts and (later) x402 API
            # | payments. What makes that possible?
            prompt: "Você quer um conciliador só para checkouts do Solana Pay e (mais adiante) pagamentos de API via x402. O que torna isso possível?"  # @src=c5b1e81a9dd2
            # | Reconciliation converges: a Solana Pay `reference` and an x402 `extra.memo`
            # | invoice id both carry the order id in a searchable field, with no unique
            # | deposit address needed. One reconciler serves both, and the x402 half is
            # | seeded here and cashed in at module 7.
            explanation: "A conciliação converge: uma `reference` do Solana Pay e um id de fatura no `extra.memo` do x402 carregam, os dois, o id do pedido num campo pesquisável, sem precisar de endereço de depósito único. Um conciliador serve os dois, e a metade do x402 é semeada aqui e descontada no módulo 7."  # @src=09c0cf6b07fb
            options:                 # source order — keep it
              c:
                # | Solana Pay reference keys and x402 extra.memo invoice ids are the same
                # | idea: one order-id-in-a-field pattern reconciles both.
                label: "As reference keys do Solana Pay e os ids de fatura no extra.memo do x402 são a mesma ideia: um padrão de id-de-pedido-num-campo concilia os dois."  # @src=39287646688d
                # | Both rails let you choose the order id up front and put it somewhere
                # | searchable, which is all a reconciler needs. The lookup differs, since
                # | an account key is not queried like a memo.
                feedback: "Os dois trilhos deixam você escolher o id do pedido de antemão e colocar ele em algum lugar pesquisável, que é tudo o que um conciliador precisa. A consulta difere, já que uma chave de conta não é consultada como um memo."  # @src=86996cd677c4
              d:
                # | x402 payments settle through a facilitator ledger, so a second
                # | reconciler tracks those invoices and you join both nightly.
                label: "Pagamentos x402 liquidam por um livro-razão de facilitador, então um segundo conciliador acompanha essas faturas e você junta os dois toda noite."  # @src=6995f223b4f0
                # | Two ledgers joined nightly is the thing the convergence saves you from.
                # | Both rails hand you an order id in a searchable field, so both settle
                # | into one ledger and one matcher reads them.
                feedback: "Dois livros-razão juntados toda noite é exatamente o que a convergência te poupa. Os dois trilhos te entregam um id de pedido num campo pesquisável, então os dois liquidam num livro-razão só e um casador só lê eles."  # @src=2e857ed55456
              b:
                # | They share a mint, so matching on the USDC mint uniquely identifies each
                # | order.
                label: "Eles compartilham um mint, então casar pelo mint do USDC identifica cada pedido de forma única."  # @src=f01a198ae429
                # | Many orders share one mint; the mint can't identify an individual
                # | invoice; the reference/memo does.
                feedback: "Muitos pedidos compartilham um mint; o mint não consegue identificar uma fatura individual; a reference/memo consegue."  # @src=e049354eaa95
              a:
                # | Both rails require a unique deposit address per order, so you match on
                # | the address.
                label: "Os dois trilhos exigem um endereço de depósito único por pedido, então você casa pelo endereço."  # @src=1d9ec367653e
                # | The whole point is that you do NOT need unique deposit addresses;
                # | matching is by reference/memo, not by address.
                feedback: "O ponto inteiro é que você NÃO precisa de endereços de depósito únicos; o casamento é por reference/memo, não por endereço."  # @src=4601794d1337
          q10:
            # | There is no refunds page anywhere in Solana's payments docs. What does that
            # | tell you about how to build one?
            prompt: "Não existe página de reembolsos em lugar nenhum da documentação de pagamentos da Solana. O que isso te diz sobre como construir um?"  # @src=649b7d66986d
            # | Chargebacks were designed out, so there's no refunds doc, and the reversal
            # | is yours. You push stablecoins back to the originating wallet (Stripe's own
            # | model) and record the refund against the origin signature so it's auditable.
            explanation: "Os chargebacks foram projetados para fora, então não existe documentação de reembolsos, e a reversão é sua. Você empurra stablecoins de volta para a carteira de origem (o próprio modelo da Stripe) e registra o reembolso contra a signature de origem para ele ser auditável."  # @src=5603a29cf04c
            options:                 # source order — keep it
              d:
                # | You reverse it with a second transfer signed by the buyer, since the
                # | original payment left you authorized to pull it back.
                label: "Você reverte com uma segunda transferência assinada pelo comprador, já que o pagamento original te deixou autorizado a puxar ele de volta."  # @src=19e9f4f3f4b0
                # | Paying you authorizes one transfer and nothing more. You hold no
                # | standing permission over the buyer's account, so the money can only go
                # | back the way it came: a fresh push that you fund and you sign.
                feedback: "Te pagar autoriza uma transferência e nada além disso. Você não tem permissão permanente nenhuma sobre a conta do comprador, então o dinheiro só pode voltar pelo caminho por onde veio: um push novo que você financia e você assina."  # @src=582c8f2da2ff
              b:
                # | Refunds are impossible on these rails by design, so you must direct
                # | buyers to file a chargeback.
                label: "Reembolsos são impossíveis nestes trilhos por design, então você tem que orientar os compradores a abrir um chargeback."  # @src=3ba8717a1bf3
                # | Chargebacks don't exist here; refunds are absolutely possible, and you
                # | build them yourself as push payments.
                feedback: "Chargebacks não existem aqui; reembolsos são absolutamente possíveis, e você mesmo constrói eles como pagamentos push."  # @src=c64c63f61b79
              c:
                # | The omission means refunds ride the network's dispute system
                # | automatically, the way a card network resolves a claim with no merchant
                # | code involved.
                label: "A omissão quer dizer que reembolsos andam no sistema de disputas da rede automaticamente, do jeito que uma bandeira resolve uma reclamação sem código nenhum do lojista envolvido."  # @src=63b6a47a1771
                # | There is no network dispute system and no claim to resolve; the absence
                # | means you own the flow, not that it's automated for you.
                feedback: "Não existe sistema de disputas da rede e não existe reclamação para resolver; a ausência quer dizer que o fluxo é seu, não que ele é automatizado para você."  # @src=22769b64ade0
              a:
                # | Refunds are original construction here: a reverse push-payment linked in
                # | the ledger to its origin signature.
                label: "Reembolsos são construção original aqui: um pagamento push reverso ligado no livro-razão à signature de origem dele."  # @src=9905f9aee43c
                # | A reversal the protocol does not provide is just another payment, which
                # | means it needs the same idempotency: a retried refund pays twice.
                feedback: "Uma reversão que o protocolo não fornece é só mais um pagamento, o que quer dizer que ela precisa da mesma idempotência: um reembolso retentado paga duas vezes."  # @src=b0504bc8d982
          q11:
            # | Before pushing a refund for a returned record, what must you confirm, and
            # | why?
            prompt: "Antes de empurrar um reembolso por um disco devolvido, o que você tem que confirmar, e por quê?"  # @src=a2040e17b2cb
            # | No chargeback protects you either. A refund lands irreversibly, so verify
            # | the origin payment reached finality before reversing it. Otherwise a payment
            # | a fork dropped becomes a genuine refund you funded for nothing.
            explanation: "Nenhum chargeback protege você também. Um reembolso aterrissa de forma irreversível, então verifique que o pagamento de origem alcançou finality antes de reverter ele. Caso contrário um pagamento que um fork descartou vira um reembolso genuíno que você financiou à toa."  # @src=cb46e206a2c4
            options:                 # source order — keep it
              d:
                # | That the origin payment reached `confirmed`, the checkout gate.
                label: "Que o pagamento de origem alcançou `confirmed`, a trava do checkout."  # @src=2ec2adcef0e7
                # | `confirmed` is the right gate for handing over a record you could ask
                # | for back. Sending money out is the one direction with no recovery, so it
                # | buys the level above: a fork that drops the origin leaves your refund
                # | standing alone.
                feedback: "`confirmed` é a trava certa para entregar um disco que você poderia pedir de volta. Mandar dinheiro para fora é a única direção sem recuperação, então ela compra o nível acima: um fork que descarta a origem deixa o seu reembolso sozinho de pé."  # @src=856a7f8a6e61
              a:
                # | That the buyer's wallet is still online, so the refund doesn't bounce.
                label: "Que a carteira do comprador ainda está online, para o reembolso não quicar."  # @src=471a223c446c
                # | A push payment to a wallet address doesn't require the buyer online;
                # | that's not the risk here.
                feedback: "Um pagamento push para um endereço de carteira não exige o comprador online; não é esse o risco aqui."  # @src=929312901a43
              c:
                # | That ~150 blocks have passed and the origin blockhash expired, so no
                # | replay can reach your treasury.
                label: "Que ~150 blocos passaram e o blockhash de origem expirou, então nenhum replay consegue chegar na sua tesouraria."  # @src=3a9ca4bf322b
                # | Blockhash expiry governs whether a transaction can still land, and a
                # | landed transfer cannot be replayed; finality, not expiry, is the
                # | guarantee that makes a refund safe.
                feedback: "A expiração do blockhash governa se uma transação ainda consegue aterrissar, e uma transferência que aterrissou não pode ser reenviada; finality, não expiração, é a garantia que torna um reembolso seguro."  # @src=1a634a130a86
              b:
                # | That the origin payment finalized; a push refund is irreversible.
                label: "Que o pagamento de origem finalizou; um reembolso push é irreversível."  # @src=d73ebcd77999
                # | Reversing a payment that a fork can still drop hands the buyer a gift
                # | you cannot claw back; finality is necessary but not sufficient, since an
                # | earlier reversal on that signature pays twice.
                feedback: "Reverter um pagamento que um fork ainda pode descartar entrega ao comprador um presente que você não tem como reaver; finality é necessária mas não suficiente, já que uma reversão anterior naquela signature paga duas vezes."  # @src=8a842f1ab6c4
          q12:
            # | A buyer sends 0.4 of a record's price. Which is a defensible partial-fill
            # | policy, stated as a trade-off?
            prompt: "Um comprador manda 0.4 do preço de um disco. Qual é uma política de pagamento parcial defensável, declarada como um trade-off?"  # @src=1feff706e626
            # | Overpay/underpay/partial-fill are policy trade-offs, not defaults. Holding
            # | an underpaid order and routing it to an explicit, stated resolution keeps
            # | fulfillment auditable and defensible; silent fulfillment and ungated
            # | auto-refunds each fail a different way.
            explanation: "Pagar a mais/pagar a menos/pagamento parcial são trade-offs de política, não padrões. Segurar um pedido underpaid e encaminhar ele para uma resolução explícita e declarada mantém o fulfillment auditável e defensável; fulfillment silencioso e auto-reembolsos sem guarda falham cada um de um jeito diferente."  # @src=d74b67e70f17
            options:                 # source order — keep it
              a:
                # | Silently fulfill the order anyway, since the buyer clearly intended to
                # | pay in full.
                label: "Faça o fulfillment do pedido em silêncio mesmo assim, já que o comprador claramente pretendia pagar por inteiro."  # @src=1f70bea3d69f
                # | Silent fulfillment on underpayment invites abuse and disputes; intent is
                # | not a payment.
                feedback: "Fulfillment silencioso sobre pagamento a menor convida abuso e disputas; intenção não é pagamento."  # @src=5fc88b177652
              c:
                # | Hold the order as underpaid and route it to a stated policy: a top-up
                # | window or refund-minus-fee.
                label: "Segure o pedido como underpaid e encaminhe ele para uma política declarada: uma janela para completar o pagamento ou reembolso-menos-taxa."  # @src=8d84d604367b
                # | An explicit underpaid state keeps the ledger auditable and the
                # | resolution reviewable; a policy published after the fact is how
                # | underpayment turns into a dispute.
                feedback: "Um estado underpaid explícito mantém o livro-razão auditável e a resolução revisável; uma política publicada depois do fato é como pagamento a menor vira disputa."  # @src=f38c89a6804f
              b:
                # | Auto-refund every overpayment and underpayment instantly with no guard,
                # | so the ledger always returns to a clean paid-or-refunded binary.
                label: "Auto-reembolse todo pagamento a maior e a menor na hora, sem guarda, para o livro-razão sempre voltar a um binário limpo de pago-ou-reembolsado."  # @src=085110e1142e
                # | That clean binary is bought with a griefing loop: an attacker churns
                # | your refund path at will, so the policy needs a guard.
                feedback: "Esse binário limpo é comprado com um loop de griefing: um atacante faz o seu caminho de reembolso girar à vontade, então a política precisa de uma guarda."  # @src=b7fbc2256a07
              d:
                # | Ship the record now and invoice the buyer for the remaining 60%, since a
                # | partial payment shows intent to pay in full.
                label: "Mande o disco agora e emita uma fatura para o comprador pelos 60% restantes, já que um pagamento parcial mostra intenção de pagar por inteiro."  # @src=e104258aa080
                # | That is extending credit on a rail with no collections arm. Once the
                # | record leaves, your only lever is asking nicely, and the balance you are
                # | owed has no dispute path, no reversal and no acquirer behind it.
                feedback: "Isso é conceder crédito num trilho sem braço de cobrança. Uma vez que o disco sai, a sua única alavanca é pedir com jeitinho, e o saldo que te devem não tem caminho de disputa, nem reversão, nem adquirente por trás."  # @src=d606f5058891
  m05-l1:
    # | The delegate primitive: approve once, pull on schedule
    title: "A primitiva de delegado: aprove uma vez, puxe no cronograma"  # @src=b6811d646c7c
    blocks:
      check:                      # quiz
        questions:
          m05-l1-q1:
            # | Your crank is approved as delegate for 60 USDC on a subscriber's token
            # | account. Later, wanting a second service, the subscriber runs ApproveChecked
            # | approving a DIFFERENT backend as delegate on the same token account. What
            # | happens to your crank's approval?
            prompt: "O seu crank está aprovado como delegado para 60 USDC na conta de token de um assinante. Depois, querendo um segundo serviço, o assinante roda ApproveChecked aprovando um backend DIFERENTE como delegado na mesma conta de token. O que acontece com a aprovação do seu crank?"  # @src=1b34148479dd
            # | One active delegate per token account. Approving a new delegate
            # | automatically revokes the previous one, which is why the raw primitive
            # | supports only a single live subscription per (user, mint).
            explanation: "Um delegado ativo por conta de token. Aprovar um delegado novo revoga automaticamente o anterior, que é por que a primitiva crua suporta só uma única assinatura viva por (usuário, mint)."  # @src=33382790eaf1
            options:                 # source order — keep it
              d:
                # | The second ApproveChecked revokes your delegate, but the Token program
                # | notifies your crank first.
                label: "O segundo ApproveChecked revoga o seu delegado, mas o Token program notifica o seu crank antes."  # @src=eb6b689f9194
                # | The overwrite is silent. Nothing on-chain tells the evicted merchant it
                # | lost the slot, which is why the crank re-reads the account before every
                # | pull instead of trusting the approval it saw at signup.
                feedback: "A sobrescrita é silenciosa. Nada on-chain avisa o lojista despejado que ele perdeu o slot, que é por que o crank relê a conta antes de todo pull em vez de confiar na aprovação que viu no cadastro."  # @src=24553783ca19
              b:
                # | The second ApproveChecked revokes your delegate entirely; your crank can
                # | no longer pull from that account.
                label: "O segundo ApproveChecked revoga o seu delegado inteiramente; o seu crank não consegue mais puxar daquela conta."  # @src=dc554fecdb05
                # | The account has one delegate field, and a new approval overwrites it,
                # | which is why the crank re-reads the delegate every cycle instead of
                # | trusting the one it saw last.
                feedback: "A conta tem um campo de delegado, e uma aprovação nova sobrescreve ele, que é por que o crank relê o delegado todo ciclo em vez de confiar no último que viu."  # @src=b80c20a0fa30
              a:
                # | Both delegates coexist; each keeps its own separate 60-USDC allowance on
                # | the account.
                label: "Os dois delegados coexistem; cada um mantém o próprio limite separado de 60 USDC na conta."  # @src=b660d7f2320f
                # | A token account has exactly one delegate slot, and there is no
                # | per-delegate ledger for a second approval to occupy.
                feedback: "Uma conta de token tem exatamente um slot de delegado, e não existe livro-razão por delegado para uma segunda aprovação ocupar."  # @src=802d40fa817c
              c:
                # | Your delegate keeps its 60 USDC but is paused until the second delegate
                # | is revoked.
                label: "O seu delegado mantém os 60 USDC dele mas fica pausado até o segundo delegado ser revogado."  # @src=b4102af168b6
                # | There is no pause state; the previous approval is overwritten, not
                # | suspended.
                feedback: "Não existe estado de pausa; a aprovação anterior é sobrescrita, não suspensa."  # @src=23d63abe22a6
          m05-l1-q2:
            # | Your crank pulls 15 USDC per cycle via delegate-signed TransferChecked
            # | against a single 60-USDC ApproveChecked. After the third successful pull,
            # | what is the state of the allowance and what bounds a fourth pull?
            prompt: "O seu crank puxa 15 USDC por ciclo via TransferChecked assinado pelo delegado contra um único ApproveChecked de 60 USDC. Depois do terceiro pull bem-sucedido, qual é o estado do limite e o que delimita um quarto pull?"  # @src=413f741f2f1e
            # | The approved amount decrements per transfer: 60 → 45 → 30 → 15. The fourth
            # | pull empties it; the fifth reverts unless the owner signs a new
            # | ApproveChecked.
            explanation: "O valor aprovado decrementa por transferência: 60 → 45 → 30 → 15. O quarto pull esvazia ele; o quinto reverte a não ser que o dono assine um ApproveChecked novo."  # @src=a82effbef611
            options:                 # source order — keep it
              c:
                # | 15 USDC remains; a fourth 15-USDC pull exhausts the approval and clears
                # | the delegate, so a fifth fails with the delegate already revoked.
                label: "Restam 15 USDC; um quarto pull de 15 USDC esgota a aprovação e limpa o delegado, então um quinto falha com o delegado já revogado."  # @src=56ab04b2edad
                # | The Token program sets the delegate to None at zero, freeing the slot by
                # | itself; the allowance is what does not come back, and only a fresh
                # | owner-signed ApproveChecked restores it.
                feedback: "O Token program põe o delegado em None no zero, liberando o slot sozinho; o limite é o que não volta, e só um ApproveChecked novo assinado pelo dono restaura ele."  # @src=a50e73529119
              a:
                # | 60 USDC remains; the approved amount is a standing per-transfer ceiling,
                # | so any number of 15-USDC pulls fit under it until the owner signs a
                # | Revoke.
                label: "Restam 60 USDC; o valor aprovado é um teto permanente por transferência, então qualquer quantidade de pulls de 15 USDC cabe embaixo dele até o dono assinar um Revoke."  # @src=5ba5db19b479
                # | The approved amount is decremented on every delegate transfer, so it is
                # | a running balance rather than a standing ceiling.
                feedback: "O valor aprovado é decrementado em toda transferência de delegado, então ele é um saldo corrente e não um teto permanente."  # @src=9b0a4d3f79af
              b:
                # | 15 USDC remains, and the program automatically re-approves the crank at
                # | the start of each cycle.
                label: "Restam 15 USDC, e o programa reaprova o crank automaticamente no começo de cada ciclo."  # @src=32c61720d769
                # | Nothing re-approves automatically; a new approval is always a fresh
                # | signed action by the token-account owner.
                feedback: "Nada reaprova automaticamente; uma aprovação nova é sempre uma ação assinada nova do dono da conta de token."  # @src=277e878091ca
              d:
                # | 15 USDC remains; the fourth pull empties the allowance, but the delegate
                # | slot stays yours until the owner signs a Revoke.
                label: "Restam 15 USDC; o quarto pull esvazia o limite, mas o slot de delegado continua seu até o dono assinar um Revoke."  # @src=7d9937be5de2
                # | The arithmetic is right and the ending is not. The decrement that lands
                # | on exactly zero clears the delegate field in the same instruction, so
                # | nobody has to sign anything for the slot to empty.
                feedback: "A aritmética está certa e o final não. O decremento que cai em exatamente zero limpa o campo de delegado na mesma instrução, então ninguém precisa assinar nada para o slot esvaziar."  # @src=9ea2df6a43fe
          m05-l1-q3:
            # | A subscriber asks: 'If I approve your backend as a delegate, can you drain
            # | my whole wallet?' What is the honest, technically correct answer about the
            # | non-custodial guarantee?
            prompt: "Um assinante pergunta: 'Se eu aprovar o backend de vocês como delegado, vocês conseguem drenar a minha carteira inteira?' Qual é a resposta honesta e tecnicamente correta sobre a garantia não custodial?"  # @src=ebf150c055be
            # | The bound is on-chain: approved amount, specific mint, single account,
            # | revocable. That is the whole non-custodial promise: no custody of keys or
            # | funds, just a capped, revocable pull permission.
            explanation: "A fronteira é on-chain: valor aprovado, mint específico, conta única, revogável. Essa é a promessa não custodial inteira: nenhuma custódia de chaves ou de fundos, só uma permissão de pull com teto e revogável."  # @src=e6480f83bda8
            options:                 # source order — keep it
              a:
                # | No. The delegate can move at most the approved amount of the approved
                # | mint from that one account, and you can revoke at any time.
                label: "Não. O delegado consegue mover no máximo o valor aprovado do mint aprovado daquela única conta, e você pode revogar a qualquer momento."  # @src=a62f86207753
                # | The cap is the Token program's doing, not the merchant's restraint;
                # | inside it nothing asks the owner again, which makes bounded and harmless
                # | different claims.
                feedback: "O teto é obra do Token program, não contenção do lojista; dentro dele nada pergunta ao dono de novo, o que faz de delimitado e inofensivo afirmações diferentes."  # @src=0cea18e4e870
              b:
                # | Yes. A delegate holds signer authority over the token account, so every
                # | balance sitting in it, plus anything that lands there later, is
                # | reachable until you revoke.
                label: "Sim. Um delegado segura autoridade de signatário sobre a conta de token, então todo saldo parado nela, mais qualquer coisa que aterrissar lá depois, fica alcançável até você revogar."  # @src=71ae4cd14ffc
                # | Delegate authority is bounded on-chain by the approved amount and mint;
                # | it is not full control of the account.
                feedback: "A autoridade de delegado é delimitada on-chain pelo valor aprovado e pelo mint; ela não é controle total da conta."  # @src=bdfd3e5f946a
              c:
                # | No, but only because the crank chooses to self-limit its withdrawals to
                # | the plan amount; the approval itself would let it take the whole
                # | balance.
                label: "Não, mas só porque o crank escolhe autolimitar os saques dele ao valor do plano; a aprovação em si deixaria ele levar o saldo inteiro."  # @src=43510d51d30e
                # | The limit is enforced by the Token program via the approved amount, not
                # | by the crank's goodwill.
                feedback: "O limite é imposto pelo Token program via o valor aprovado, não pela boa vontade do crank."  # @src=49ebae4f2d8e
              d:
                # | No. The approval carries the plan's term, so it lapses on its own once
                # | the subscription period ends, with nothing left for you to revoke.
                label: "Não. A aprovação carrega o prazo do plano, então ela vence sozinha assim que o período da assinatura termina, sem sobrar nada para você revogar."  # @src=78cc97a3867f
                # | Nothing on the account records a term or a date. An approval sits there
                # | until it is spent to zero or the owner signs Revoke, which is how
                # | churned subscribers end up holding live allowances they forgot about.
                feedback: "Nada na conta registra um prazo ou uma data. Uma aprovação fica ali até ser gasta até zero ou o dono assinar Revoke, que é como assinantes que cancelaram acabam segurando limites vivos dos quais se esqueceram."  # @src=badb175f4336
          m05-l1-q4:
            # | Why does the single-delegate-slot rule push you toward the official
            # | Subscriptions program rather than shipping the raw crank to production?
            prompt: "Por que a regra de slot único de delegado te empurra para o programa oficial de Subscriptions em vez de mandar o crank cru para produção?"  # @src=4402414249f5
            # | One slot means one live subscription per (user, mint). To let one token
            # | account back many billing arrangements you need a program that occupies the
            # | slot once and multiplexes real limits behind PDAs. That is the next lesson.
            explanation: "Um slot quer dizer uma assinatura viva por (usuário, mint). Para deixar uma conta de token bancar muitos arranjos de cobrança você precisa de um programa que ocupa o slot uma vez e multiplexa limites reais atrás de PDAs. Essa é a próxima lição."  # @src=ae2fe897d022
            options:                 # source order — keep it
              a:
                # | Because a delegate expires after exactly one transfer, so multi-cycle
                # | billing is impossible with the raw primitive.
                label: "Porque um delegado expira depois de exatamente uma transferência, então cobrança de múltiplos ciclos é impossível com a primitiva crua."  # @src=a38e3ebcbfde
                # | The approval persists and covers multiple pulls until the allowance is
                # | exhausted; expiry-per-transfer is not how it works.
                feedback: "A aprovação persiste e cobre vários pulls até o limite se esgotar; expiração por transferência não é como funciona."  # @src=a190b6139a9a
              d:
                # | Because the delegate slot belongs to the wallet, so a subscriber's
                # | second subscription evicts the first even in a different mint.
                label: "Porque o slot de delegado pertence à carteira, então a segunda assinatura de um assinante despeja a primeira mesmo em um mint diferente."  # @src=42430d6bc571
                # | The slot lives on a token account, and a token account is per mint. A
                # | club billing in USDC and one billing in EURC sit on separate accounts
                # | with separate slots; the collision only happens when both bill the same
                # | mint.
                feedback: "O slot mora numa conta de token, e uma conta de token é por mint. Um clube que cobra em USDC e outro que cobra em EURC ficam em contas separadas com slots separados; a colisão só acontece quando os dois cobram no mesmo mint."  # @src=e870f5858e16
              b:
                # | Because a subscriber who joins two merchants can grant only one live
                # | delegate, so the second merchant's approval silently evicts the first.
                label: "Porque um assinante que entra em dois lojistas consegue conceder só um delegado vivo, então a aprovação do segundo lojista despeja o primeiro em silêncio."  # @src=56a2dc317cc1
                # | One slot per token account means merchants compete for the same field
                # | rather than coexisting; the slot is per (owner, mint), and a second mint
                # | has its own. A workaround, not a model.
                feedback: "Um slot por conta de token quer dizer que os lojistas competem pelo mesmo campo em vez de coexistir; o slot é por (dono, mint), e um segundo mint tem o próprio. Uma solução de contorno, não um modelo."  # @src=066e8c6af2b8
              c:
                # | Because delegate-signed transfers cannot carry a memo, so reconciliation
                # | into the orders ledger breaks.
                label: "Porque transferências assinadas pelo delegado não conseguem carregar um memo, então a conciliação no livro-razão de pedidos quebra."  # @src=7dc5a55c959a
                # | A delegate TransferChecked can be paired with a memo/reference; the memo
                # | is not what the single slot limits.
                feedback: "Um TransferChecked de delegado pode ser pareado com um memo/reference; o memo não é o que o slot único limita."  # @src=8ec3f8e05f45
  m05-l2:
    # | The official Subscriptions program: plans, PDAs, and the kit-7 seam
    title: "O programa oficial Subscriptions: planos, PDAs e a costura do kit 7"  # @src=56446aedc1c6
    blocks:
      period-window-check:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | At the exact instant now equals expiresAtTs, the subscription is already
          # | lapsed; the last chargeable second is expiresAtTs - 1, not expiresAtTs itself.
          0: "No instante exato em que now é igual a expiresAtTs, a assinatura já está vencida; o último segundo cobrável é expiresAtTs - 1, não o próprio expiresAtTs."  # @src=e506cce8d13d
          # | expiresAtTs of 0 means 'no expiry'; do not treat it as 'expired at epoch 0'.
          1: "expiresAtTs de 0 quer dizer 'sem expiração'; não trate isso como 'expirado no epoch 0'."  # @src=dfcb6397366e
          # | Order matters: canceled first, then expiry, then the period window.
          2: "A ordem importa: canceled primeiro, depois a expiração, depois a janela de período."  # @src=855abd4e288b
        tests:                      # keyed by test case id
          t1-due-after-full-period:
            # | A day-cadence sub whose 24h window has fully elapsed is due; the next window
            # | is measured in seconds.
            description: "Uma assinatura com cadência diária cuja janela de 24h decorreu por inteiro está devida; a próxima janela é medida em segundos."  # @src=558de6f87439
          t2-too-early-hours-not-seconds:
            # | Only ~13.9h since the last pull: a correct seconds-based window holds the
            # | charge (the ×3600 bug would fire early).
            description: "Só ~13.9h desde o último pull: uma janela correta baseada em segundos segura a cobrança (o bug do ×3600 dispararia cedo)."  # @src=23c2b70c37c8
          t3-expired-never-charges:
            # | The sub is past its expiresAtTs, so it is never pulled even though its
            # | period window is open.
            description: "A assinatura passou do expiresAtTs dela, então ela nunca é puxada mesmo com a janela de período dela aberta."  # @src=2b6c7a090281
          t4-canceled:
            # | An inactive (cancelled) subscription is never pulled.
            description: "Uma assinatura inativa (cancelada) nunca é puxada."  # @src=341ef5317a58
          t5-zero-expiry-is-not-expired:
            # | expiresAtTs of 0 means no expiry, so the decision falls through to the
            # | seconds-based window (here, too early).
            description: "expiresAtTs de 0 quer dizer nenhuma expiração, então a decisão cai para a janela baseada em segundos (aqui, cedo demais)."  # @src=1614292ba8d3
          t6-boundary-is-due:
            # | At exactly lastChargedTs + period the window is open and the pull fires.
            description: "Em exatamente lastChargedTs + period a janela está aberta e o pull dispara."  # @src=c5643f6f015a
          t7-future-expiry-still-due:
            # | A sub whose expiresAtTs is still in the future is not expired: a non-zero
            # | expiry alone must never hold a charge.
            description: "Uma assinatura cujo expiresAtTs ainda está no futuro não está expirada: uma expiração diferente de zero, sozinha, nunca pode segurar uma cobrança."  # @src=81f8c3c53894
          t8-expiry-boundary-is-expired:
            # | At exactly expiresAtTs the subscription has lapsed: the last chargeable
            # | second is expiresAtTs - 1.
            description: "Em exatamente expiresAtTs a assinatura já venceu: o último segundo cobrável é expiresAtTs - 1."  # @src=6e8a79b43cc3
          t9-canceled-outranks-expired:
            # | A sub that was cancelled AND has since lapsed reports 'canceled': a canceled
            # | subscription's expiry is meaningless, so the cancellation check runs first.
            description: "Uma assinatura que foi cancelada E desde então venceu reporta 'canceled': a expiração de uma assinatura cancelada não tem sentido, então a checagem de cancelamento roda primeiro."  # @src=3a6fe813a22a
          t10-backwards-clock-holds:
            # | Chain time reading BEFORE the last successful pull (clock skew, or a crank
            # | replaying an old slot) is too early, never due: the window is a direction,
            # | not a distance.
            description: "Tempo da blockchain lendo ANTES do último pull bem-sucedido (desvio de relógio, ou um crank reprocessando um slot antigo) é cedo demais, nunca devido: a janela é uma direção, não uma distância."  # @src=a81b64de9171
      check-overview:                      # quiz
        questions:
          m05-l2-q1:
            # | A subscriber needs several independent billing arrangements, but their token
            # | account has exactly one delegate slot. How does the Subscriptions program
            # | reconcile that?
            prompt: "Um assinante precisa de vários arranjos de cobrança independentes, mas a conta de token dele tem exatamente um slot de delegado. Como o programa Subscriptions concilia isso?"  # @src=f55bd86f2f13
            # | The SA PDA occupies the one slot with an unlimited approval; the actual,
            # | bounded limits live in delegation PDAs (fixed / recurring / plan). That is
            # | how one token account backs many subscriptions non-custodially.
            explanation: "O PDA de SA ocupa o único slot com uma aprovação ilimitada; os limites de verdade, com teto, moram em PDAs de delegação (fixed / recurring / plan). É assim que uma conta de token sustenta muitas assinaturas de forma não custodial."  # @src=ad946c9bfc28
            options:                 # source order — keep it
              b:
                # | It creates a fresh token account per subscription and asks the
                # | subscriber to fund each one, so every merchant ends up with its own
                # | account and its own delegate slot.
                label: "Ele cria uma conta de token nova por assinatura e pede ao assinante para pôr saldo em cada uma, então todo lojista acaba com a própria conta e o próprio slot de delegado."  # @src=089727cfc6a9
                # | It does not multiply the user's token accounts; the ATA and its single
                # | slot stay put, and the program works within that one slot.
                feedback: "Ele não multiplica as contas de token do usuário; a ATA e o slot único dela ficam onde estão, e o programa trabalha dentro desse slot só."  # @src=61c5b420d7f5
              c:
                # | A Subscription Authority PDA per (user, mint) takes the single slot with
                # | a u64::MAX approval; delegation PDAs carry the real limits.
                label: "Um PDA de Subscription Authority por (usuário, mint) toma o slot único com uma aprovação de u64::MAX; PDAs de delegação carregam os limites de verdade."  # @src=f39f13ecb4a0
                # | Indirection turns one scarce slot into many arrangements. The holder is
                # | unlimited and the real limits live in program state, which moves the
                # | bound off the Token program onto that logic.
                feedback: "A indireção transforma um slot escasso em muitos arranjos. Quem segura o slot é ilimitado e os limites de verdade moram no estado do programa, o que tira o limite do Token program e põe nessa lógica."  # @src=e2aeac116f3c
              d:
                # | A Subscription Authority PDA takes the slot with an approval sized to
                # | the sum of the plans, re-approved on each new subscription.
                label: "Um PDA de Subscription Authority toma o slot com uma aprovação dimensionada pela soma dos planos, reaprovada a cada nova assinatura."  # @src=33fef947b0f3
                # | Re-approving on every join puts the slot back in play and drags the
                # | subscriber into a signature per merchant. The authority takes the slot
                # | once, at u64::MAX, and is never touched again; the sums that matter live
                # | in the delegation accounts.
                feedback: "Reaprovar a cada entrada põe o slot de volta em jogo e arrasta o assinante para uma signature por lojista. A autoridade toma o slot uma vez, em u64::MAX, e nunca mais é tocada; as somas que importam moram nas contas de delegação."  # @src=52fa21f2dc1a
              a:
                # | It stores each allowance in the merchant's own database and signs every
                # | pull with the merchant's key, so the single on-chain delegate slot never
                # | has to be shared.
                label: "Ele armazena cada limite no banco de dados do próprio lojista e assina todo pull com a chave do lojista, então o slot de delegado único on-chain nunca precisa ser compartilhado."  # @src=7dadcf94d2c0
                # | Pulls are on-chain delegate transfers, and the enforced limits live in
                # | program accounts rather than off-chain; that is what keeps it
                # | non-custodial.
                feedback: "Pulls são transferências de delegado on-chain, e os limites aplicados moram em contas de programa, não off-chain; é isso que mantém tudo não custodial."  # @src=86824d22c3c4
          m05-l2-q2:
            # | That delegate slot is held by a PDA rather than a keypair the merchant
            # | controls. Cashing in the ATA seed from module 2, why does a PDA holding the
            # | slot keep the arrangement non-custodial?
            prompt: "Esse slot de delegado é segurado por um PDA, e não por um par de chaves que o lojista controla. Cobrando a promessa sobre ATA do módulo 2, por que um PDA segurando o slot mantém o arranjo não custodial?"  # @src=0de999ce4c9c
            # | No private key exists for a PDA, so there is no merchant secret to leak or
            # | abuse; the program's code is the only thing that can move funds, and only
            # | inside the delegation's declared limits.
            explanation: "Não existe chave privada para um PDA, então não existe segredo de lojista para vazar ou abusar; o código do programa é a única coisa que consegue mover fundos, e só dentro dos limites declarados da delegação."  # @src=6fd4443a8fb2
            options:                 # source order — keep it
              b:
                # | The PDA is derived from and owned by the subscriber's wallet, so the
                # | subscriber's key must co-sign every individual pull before the crank can
                # | move funds.
                label: "O PDA é derivado da carteira do assinante e pertence a ela, então a chave do assinante precisa coassinar cada pull individual antes de o crank conseguir mover fundos."  # @src=d6c5fa6f2a8f
                # | A PDA is not owned by the user's wallet, and the subscriber does not
                # | co-sign each pull; cadenced pulls without per-charge signatures are the
                # | point of delegation.
                feedback: "Um PDA não pertence à carteira do usuário, e o assinante não coassina cada pull; pulls cadenciados sem signatures por cobrança são o ponto da delegação."  # @src=999ca0315a21
              c:
                # | The merchant holds the PDA's private key in a hardware escrow and signs
                # | each pull with it, contractually agreeing to stay inside the plan's
                # | declared limits.
                label: "O lojista mantém a chave privada do PDA num escrow de hardware e assina cada pull com ela, concordando contratualmente em ficar dentro dos limites declarados do plano."  # @src=407b218fdd45
                # | PDAs have no private key to hold, and custody-by-promise is exactly what
                # | this design removes.
                feedback: "PDAs não têm chave privada para segurar, e custódia por promessa é exatamente o que este design remove."  # @src=d87085ca5ea5
              d:
                # | The program's upgrade authority holds the PDA's key and signs on its
                # | behalf, so custody sits with the Foundation rather than you.
                label: "A autoridade de upgrade do programa segura a chave do PDA e assina em nome dele, então a custódia fica com a Foundation em vez de ficar com você."  # @src=dfe71dd440a8
                # | An upgrade authority replaces code; it cannot sign as a PDA, because no
                # | signature over a PDA exists to produce. That authority is a real
                # | residual trust worth naming in a security review, and it is not custody
                # | of anybody's funds.
                feedback: "Uma autoridade de upgrade substitui código; ela não consegue assinar como um PDA, porque não existe signature sobre um PDA para produzir. Essa autoridade é uma confiança residual real que vale nomear numa revisão de segurança, e ela não é custódia do dinheiro de ninguém."  # @src=a96c55981e2f
              a:
                # | A PDA is deterministic and program-owned with no private key, so only
                # | program logic, never a merchant key, can authorize a pull.
                label: "Um PDA é determinístico e pertence ao programa, sem chave privada, então só a lógica do programa, nunca uma chave de lojista, consegue autorizar um pull."  # @src=c40fbc7e9650
                # | With no key to hold there is no merchant secret to leak; the trust moves
                # | rather than vanishing, and the upgrade authority is where it lands.
                feedback: "Sem chave para segurar não existe segredo de lojista para vazar; a confiança se muda em vez de sumir, e a autoridade de upgrade é onde ela aterrissa."  # @src=38a6a0803807
      check-lab:                      # quiz
        questions:
          m05-l2-q3:
            # | Your crank dispatched a second pull for the same subscriber an hour after
            # | the first, and the program refused it. The plan's cadence is periodHours:
            # | 24. Reading your billing-window check, what is the most likely bug?
            prompt: "O seu crank despachou um segundo pull para o mesmo assinante uma hora depois do primeiro, e o programa recusou. A cadência do plano é periodHours: 24. Lendo a sua checagem de janela de cobrança, qual é o bug mais provável?"  # @src=71627574138e
            # | periodHours (plans) and periodLengthS (delegations) are the documented unit
            # | trap. Compare seconds against Unix chain time; 24 hours is 86,400 seconds,
            # | not 24.
            explanation: "periodHours (planos) e periodLengthS (delegações) são a cilada de unidade documentada. Compare segundos contra o tempo Unix da blockchain; 24 horas são 86,400 segundos, não 24."  # @src=fc42f1f5772c
            options:                 # source order — keep it
              c:
                # | You forgot to store processed signatures, so a webhook retry
                # | re-triggered the pull.
                label: "Você esqueceu de armazenar as signatures já processadas, então um retry de webhook disparou o pull de novo."  # @src=491fc5163800
                # | A delegate pull is initiated by your crank, not by a webhook retry;
                # | signature dedup guards fulfillment, not pull cadence.
                feedback: "Um pull de delegado é iniciado pelo seu crank, não por um retry de webhook; a deduplicação por signature protege o fulfillment, não a cadência de pull."  # @src=272bcb11224a
              d:
                # | Your window check reads the delegation's periodLengthS, which the
                # | program stores in hours like a plan does.
                label: "A sua checagem de janela lê o periodLengthS da delegação, que o programa armazena em horas igual a um plano faz."  # @src=7ce6f3459ac7
                # | The two fields disagree on purpose: a plan publishes periodHours, a
                # | recurring delegation stores periodLengthS in seconds. Assuming they
                # | share a unit is the same trap read from the other end.
                feedback: "Os dois campos discordam de propósito: um plano publica periodHours, uma delegação recurring armazena periodLengthS em segundos. Supor que eles compartilham uma unidade é a mesma cilada lida pela outra ponta."  # @src=f20fff900ca3
              a:
                # | You compared expiresAtTs against the current block height instead of
                # | Unix time.
                label: "Você comparou expiresAtTs contra a altura do bloco atual em vez do tempo Unix."  # @src=eb45513e2fa0
                # | An expiry-vs-height mix-up would misfire on expiry, not collapse a
                # | 24-hour window down to minutes.
                feedback: "Uma confusão entre expiração e altura erraria na expiração, não colapsaria uma janela de 24 horas para minutos."  # @src=407965ba0665
              b:
                # | You used the plan's periodHours value directly as seconds instead of
                # | multiplying by 3600, so the window is ~3600x too short.
                label: "Você usou o valor periodHours do plano direto como segundos em vez de multiplicar por 3600, então a janela fica ~3600x curta demais."  # @src=d5f4dbd43d05
                # | Chain time is Unix seconds while the plan field counts hours, and the
                # | comparison silently shrinks the window; blanket-multiplying overshoots,
                # | since a delegation's period is already seconds.
                feedback: "O tempo da blockchain é em segundos Unix enquanto o campo do plano conta horas, e a comparação encolhe a janela em silêncio; multiplicar tudo passa do ponto, já que o período de uma delegação já está em segundos."  # @src=6e3cef6e90aa
          m05-l2-q4:
            # | A subscriber's plan lapsed last week, yet your crank still dispatched a pull
            # | for them today — refused on-chain, one base fee gone — because the
            # | delegation account is still there. Which guard check is missing, and why
            # | does the account persist?
            prompt: "O plano de um assinante venceu semana passada, e mesmo assim o seu crank despachou um pull para ele hoje — recusado on-chain, uma taxa base a menos — porque a conta de delegação ainda está lá. Qual checagem da guarda está faltando, e por que a conta persiste?"  # @src=95d952540345
            # | These accounts stay on-chain until a revoke instruction closes them, and the
            # | program — not account existence — enforces the expiry bound, refusing a
            # | lapsed pull before any token moves. Your crank mirrors that check
            # | (expiresAtTs vs chain time, 0 meaning 'never expires') so the refusal costs
            # | nothing instead of a base fee per tick.
            explanation: "Essas contas ficam on-chain até uma instrução de revoke fechar elas, e o programa — não a existência da conta — aplica o limite de expiração, recusando um pull vencido antes de qualquer token se mover. O seu crank espelha essa checagem (expiresAtTs contra o tempo da blockchain, com 0 querendo dizer 'nunca expira') para que a recusa não custe nada em vez de uma taxa base por tick."  # @src=20b85259f529
            options:                 # source order — keep it
              c:
                # | The expiresAtTs-vs-chain-time check: these accounts persist until
                # | revoked, so existence proves nothing, and a guard that skips the expiry
                # | mirror pays for an on-chain refusal every tick.
                label: "A checagem de expiresAtTs contra o tempo da blockchain: essas contas persistem até serem revogadas, então existência não prova nada, e uma guarda que pula o espelho da expiração paga por uma recusa on-chain a cada tick."  # @src=41653e17edb3
                # | Nothing on-chain reaps an account on a schedule. The program refuses the
                # | lapsed pull before a token moves; your guard's job is to refuse it
                # | before a fee is spent. And 0 is the sentinel for never expires, which a
                # | naive now-greater-than test rejects outright.
                feedback: "Nada on-chain colhe uma conta por agendamento. O programa recusa o pull vencido antes de um token se mover; o trabalho da sua guarda é recusar ele antes de uma taxa ser gasta. E 0 é a sentinela de nunca expira, que um teste ingênuo de now-maior-que rejeita de cara."  # @src=44b8c57ed1ca
              d:
                # | The expiresAtTs-vs-chain-time check, and a plain
                # | now-greater-than-expiresAtTs comparison covers it, since these accounts
                # | persist until revoked and a zero expiry marks one already lapsed.
                label: "A checagem de expiresAtTs contra o tempo da blockchain, e uma comparação simples de now-maior-que-expiresAtTs resolve, já que essas contas persistem até serem revogadas e uma expiração zero marca uma que já venceu."  # @src=012f677cd602
                # | Right field, inverted sentinel. Zero means never expires, so that
                # | comparison treats every open-ended subscriber as expired at the epoch
                # | and quietly bills nobody at all.
                feedback: "Campo certo, sentinela invertida. Zero quer dizer nunca expira, então essa comparação trata todo assinante sem prazo como expirado no epoch e, em silêncio, não cobra de ninguém."  # @src=b0c09270a4fc
              a:
                # | The active-flag check: the program clears a delegation's active flag and
                # | closes its account the moment a plan's term ends, so only a stale flag
                # | lets a pull get dispatched.
                label: "A checagem da flag active: o programa limpa a flag active de uma delegação e fecha a conta dela no instante em que o prazo de um plano termina, então só uma flag velha deixa um pull ser despachado."  # @src=347c3196f21c
                # | Ending a term does not delete the account, and an active flag alone does
                # | not encode a time-based lapse.
                feedback: "Terminar um prazo não apaga a conta, e uma flag active sozinha não codifica um vencimento baseado em tempo."  # @src=dc046e269267
              b:
                # | A balance check: the Token program zeroes the approval once the
                # | allowance is exhausted, and the delegation account it belongs to is
                # | reaped in that very same instruction.
                label: "Uma checagem de saldo: o Token program zera a aprovação assim que o limite se esgota, e a conta de delegação a que ela pertence é colhida nessa mesma instrução."  # @src=4c2bb7c6aa56
                # | A zero allowance does not close the account, and it would not represent
                # | elapsed time either.
                feedback: "Um limite zerado não fecha a conta, e também não representaria tempo decorrido."  # @src=e425a6bb78df
  m05-l3:
    # | Dunning, lifecycle, and who else does this
    title: "Dunning, ciclo de vida e quem mais faz isso"  # @src=a4620fe9104a
    blocks:
      check:                      # quiz
        questions:
          m05-l3-q1:
            # | A subscriber's ATA is empty when the monthly pull fires. Following the
            # | dunning policy Helius runs on its own bills, what happens to that renewal?
            prompt: "A ATA de um assinante está vazia quando o pull mensal dispara. Seguindo a política de dunning que a Helius roda nas próprias faturas, o que acontece com essa renovação?"  # @src=0a1c3074dce0
            # | Retry-never: with no custody there is nothing to dun. The failed pull
            # | becomes an open invoice the subscriber settles when they top up, the exact
            # | opposite of card-rail auto-retry.
            explanation: "Retry-never: sem custódia não há o que cobrar. O pull que falhou vira uma fatura em aberto que o assinante liquida quando coloca saldo, exatamente o oposto da retentativa automática dos trilhos de cartão."  # @src=01db5d6afc18
            options:                 # source order — keep it
              a:
                # | The renewal is not retried against the wallet; it becomes an ordinary
                # | open invoice the subscriber can settle later.
                label: "A renovação não é tentada de novo contra a carteira; ela vira uma fatura em aberto comum que o assinante pode liquidar depois."  # @src=3d1e58a3a280
                # | An empty account cannot be pulled harder, and retrying just burns fees
                # | against a balance you do not control; it isn't no-dunning either, since
                # | reminders and grace move into your backoffice.
                feedback: "Uma conta vazia não pode sofrer um pull mais forte, e tentar de novo só queima taxas contra um saldo que você não controla; e também não é dunning nenhum, já que lembretes e carência se mudam para o seu back office."  # @src=4f0625258df4
              c:
                # | The subscription is cancelled immediately and its delegation PDA is
                # | closed on the spot, refunding the rent to the subscriber who paid it.
                label: "A assinatura é cancelada imediatamente e o PDA de delegação dela é fechado na hora, reembolsando o rent para o assinante que pagou."  # @src=76bec28b8960
                # | A failure moves to an open-invoice/grace state, not immediate
                # | cancel-and-close; cancellation is a separate, explicit transition.
                feedback: "Uma falha move para um estado de open-invoice/carência, não para um cancelar-e-fechar imediato; o cancelamento é uma transição separada e explícita."  # @src=d39820c242cb
              b:
                # | The crank retries the pull against the wallet on a backoff ladder,
                # | minutes apart and then daily, until it clears or the retry limit drops
                # | the plan.
                label: "O crank tenta o pull de novo contra a carteira numa escada de backoff, com minutos de intervalo e depois diariamente, até passar ou o limite de retentativas derrubar o plano."  # @src=397912b35824
                # | There is nothing to auto-retry against a wallet you don't control, and
                # | the documented policy is explicitly NOT to retry against the wallet.
                feedback: "Não há nada para tentar de novo automaticamente contra uma carteira que você não controla, e a política documentada é explicitamente NÃO tentar de novo contra a carteira."  # @src=8c5d9072aa46
              d:
                # | The renewal is dropped, and the crank simply bills the subscriber again
                # | on the next scheduled cycle.
                label: "A renovação é descartada, e o crank simplesmente cobra o assinante de novo no próximo ciclo agendado."  # @src=c975a543ec62
                # | Dropping it loses the receivable. The missed period stays owed, and the
                # | state machine refuses a pull against an open invoice outright, so the
                # | next cycle is not where that money comes back.
                feedback: "Descartar ela perde o recebível. O período perdido continua devido, e a máquina de estados recusa de cara um pull contra uma fatura em aberto, então o próximo ciclo não é onde esse dinheiro volta."  # @src=c3c0991efa69
          m05-l3-q2:
            # | A subscriber cancels for good and you want to stop paying rent on their
            # | now-dead subscription accounts. Which action recovers it?
            prompt: "Um assinante cancela de vez e você quer parar de pagar rent nas contas de assinatura dele, agora mortas. Qual ação recupera ele?"  # @src=1b37e68ef66e
            # | RevokeAbandoned* is the lifecycle exit that recovers rent from dead
            # | subscription/delegation PDAs, so you stop paying to keep cancelled
            # | arrangements on-chain.
            explanation: "RevokeAbandoned* é a saída de ciclo de vida que recupera rent de PDAs mortos de assinatura/delegação, então você para de pagar para manter arranjos cancelados on-chain."  # @src=114fa0bcafbd
            options:                 # source order — keep it
              d:
                # | Nothing to do: the subscriber's cancel already closed both accounts and
                # | returned every lamport of rent.
                label: "Nada a fazer: o cancel do assinante já fechou as duas contas e devolveu cada lamport de rent."  # @src=4ac90fa811cd
                # | Unsubscribing does close the delegation account and refund it. Revoking
                # | the authority only vacates the delegate slot, so the subscription PDA is
                # | still sitting there on your rent until a RevokeAbandoned call closes it.
                feedback: "Dar unsubscribe fecha sim a conta de delegação e reembolsa ela. Revogar a autoridade só desocupa o slot de delegado, então o PDA da assinatura continua lá parado no seu rent até uma chamada de RevokeAbandoned fechar ele."  # @src=c9de377c62c9
              a:
                # | Nothing; PDA rent is burned at account creation and is permanently
                # | unrecoverable.
                label: "Nada; o rent do PDA é queimado na criação da conta e é permanentemente irrecuperável."  # @src=727680ccdc62
                # | The program exposes an explicit revoke-and-reclaim path; the rent is not
                # | burned.
                feedback: "O programa expõe um caminho explícito de revogar-e-recuperar; o rent não é queimado."  # @src=a3a4e47b6ca4
              c:
                # | The subscriber must closeAccount on their ATA, which also frees the
                # | subscription PDAs.
                label: "O assinante tem que fazer closeAccount na ATA dele, o que também libera os PDAs da assinatura."  # @src=6ab1ab653fc7
                # | Closing the user's ATA is a different account entirely and does not
                # | reclaim the program's subscription or delegation PDAs.
                feedback: "Fechar a ATA do usuário é uma conta completamente diferente e não recupera os PDAs de assinatura nem de delegação do programa."  # @src=88e26ae151d1
              b:
                # | A RevokeAbandoned instruction closes the abandoned
                # | subscription/delegation accounts and returns the rent lamports.
                label: "Uma instrução RevokeAbandoned fecha as contas abandonadas de assinatura/delegação e devolve os lamports de rent."  # @src=13567a9732af
                # | Rent is a deposit that comes back only on an explicit close, and
                # | cancelling does not call one.
                feedback: "Rent é um depósito que só volta num fechamento explícito, e cancelar não chama nenhum."  # @src=6d792286d448
          m05-l3-q3:
            # | You're advising Wavelength on outsourcing recurring billing to a provider.
            # | Based on the 2026 landscape, which statement is accurate?
            prompt: "Você está aconselhando a Wavelength sobre terceirizar a cobrança recorrente para um provedor. Com base no cenário de 2026, qual afirmação está correta?"  # @src=7b248a5c5e09
            # | The useful intelligence is the negatives: MoonPay Commerce and Stripe
            # | Billing both do recurring, Sphere does not. Assuming every payments provider
            # | bills recurring is how you pick the wrong vendor.
            explanation: "A inteligência útil são as negativas: MoonPay Commerce e Stripe Billing fazem recorrente, a Sphere não. Supor que todo provedor de pagamentos cobra recorrente é como você escolhe o fornecedor errado."  # @src=181e26551327
            options:                 # source order — keep it
              a:
                # | Sphere ships a drop-in recurring-billing product tuned for the
                # | Brazil/PIX corridor, so a subscription settles to BRL on the same rails
                # | as its one-off payments.
                label: "A Sphere entrega um produto de cobrança recorrente plug-and-play afinado para o corredor Brasil/PIX, então uma assinatura liquida em BRL nos mesmos trilhos dos pagamentos avulsos dela."  # @src=c873e40c495c
                # | Sphere does payments, ramps, OTC, and PIX settlement, but it ships NO
                # | recurring product.
                feedback: "A Sphere faz pagamentos, ramps, OTC e liquidação PIX, mas NÃO entrega produto recorrente nenhum."  # @src=2556923aa79a
              d:
                # | All three ship recurring billing, so the choice comes down to corridor
                # | coverage, payout speed and per-charge price rather than capability.
                label: "Os três entregam cobrança recorrente, então a escolha se resume a cobertura de corredor, velocidade de repasse e preço por cobrança em vez de capacidade."  # @src=5ccc9e7faf53
                # | Assuming every payments vendor also bills recurring is how the wrong one
                # | gets picked. Sphere is strong on payments, ramps and PIX settlement and
                # | ships no recurring product at all, so capability is the first filter,
                # | not the last.
                feedback: "Supor que todo fornecedor de pagamentos também cobra recorrente é como o errado acaba escolhido. A Sphere é forte em pagamentos, ramps e liquidação PIX e não entrega produto recorrente nenhum, então capacidade é o primeiro filtro, não o último."  # @src=71eb830417e2
              c:
                # | MoonPay Commerce pay links and Stripe Billing both support
                # | subscriptions, including stablecoin ones, while Sphere has none at all.
                label: "Os pay links da MoonPay Commerce e o Stripe Billing suportam assinaturas, inclusive em stablecoin, enquanto a Sphere não tem nenhuma."  # @src=be27b5f3d5df
                # | Recurring is a separate product line from payments, and a strong
                # | payments vendor can simply not ship it; support is not coverage either,
                # | and the corridor is where that gap shows.
                feedback: "Recorrente é uma linha de produto separada de pagamentos, e um fornecedor forte em pagamentos pode simplesmente não entregar isso; suporte também não é cobertura, e o corredor é onde essa lacuna aparece."  # @src=66e786e37f4f
              b:
                # | Stripe cannot bill stablecoin subscriptions; its crypto support stops at
                # | one-off checkout payments, so recurring stablecoin billing has to run on
                # | MoonPay Commerce.
                label: "O Stripe não consegue cobrar assinaturas em stablecoin; o suporte a cripto dele para em pagamentos avulsos de checkout, então cobrança recorrente em stablecoin tem que rodar na MoonPay Commerce."  # @src=49b4c68396cf
                # | Stripe Billing does support stablecoin subscriptions; that is exactly
                # | its recurring product.
                feedback: "O Stripe Billing suporta sim assinaturas em stablecoin; é exatamente o produto recorrente dele."  # @src=85526eceb682
          m05-l3-q4:
            # | You model dunning as a state machine in the backoffice rather than as
            # | retries against the chain. Why is that the right shape for non-custodial
            # | recurring revenue?
            prompt: "Você modela dunning como uma máquina de estados no back office em vez de retentativas contra a blockchain. Por que esse é o formato certo para receita recorrente não custodial?"  # @src=20e04ca83858
            # | Non-custodial means you can't reach into the wallet. The only place you
            # | control state is your own ledger, so failure and lifecycle live there as an
            # | explicit state machine, which is exactly why retry-never is the honest
            # | policy.
            explanation: "Não custodial quer dizer que você não consegue alcançar dentro da carteira. O único lugar em que você controla estado é o seu próprio livro-razão, então falha e ciclo de vida moram lá como uma máquina de estados explícita, que é exatamente por que retry-never é a política honesta."  # @src=a19a43acb834
            options:                 # source order — keep it
              d:
                # | Because the ledger is where a retry loop belongs: it holds the failures
                # | and re-attempts the pull on a backoff until the balance covers it.
                label: "Porque o livro-razão é onde um loop de retentativas pertence: ele guarda as falhas e tenta o pull de novo num backoff até o saldo cobrir ele."  # @src=ebbb668b280b
                # | Moving the loop into the ledger keeps the loop. A pull against an open
                # | invoice is refused as an invariant, precisely so nobody reinvents
                # | backoff against a wallet that only its owner can refill.
                feedback: "Mover o loop para dentro do livro-razão mantém o loop. Um pull contra uma fatura em aberto é recusado como invariante, precisamente para que ninguém reinvente backoff contra uma carteira que só o dono dela consegue reabastecer."  # @src=d44e23153a85
              a:
                # | Because a pull succeeds only when allowance and balance both cover it,
                # | so unrecoverable failures belong in your ledger, not in a retry loop you
                # | can't force.
                label: "Porque um pull só tem sucesso quando limite e saldo cobrem ele, então falhas irrecuperáveis pertencem ao seu livro-razão, não a um loop de retentativas que você não consegue forçar."  # @src=edbc1b41cfa6
                # | Both preconditions sit in the subscriber's control, and repeating the
                # | call changes nothing. An RPC timeout is a different animal, worth the
                # | retry an empty balance never earns.
                feedback: "As duas precondições ficam sob controle do assinante, e repetir a chamada não muda nada. Um timeout de RPC é outro bicho, que merece a retentativa que um saldo vazio nunca ganha."  # @src=35499d4aa39c
              c:
                # | Because the Subscriptions program escrows one billing period of funds
                # | when a subscriber accepts a plan, so a retried pull draws on that escrow
                # | and eventually clears.
                label: "Porque o programa Subscriptions coloca em escrow os fundos de um período de cobrança quando um assinante aceita um plano, então um pull tentado de novo saca desse escrow e no fim passa."  # @src=1284dc5775a2
                # | Nothing escrows the subscriber's funds; an empty ATA simply cannot be
                # | pulled, no matter how many times you retry.
                feedback: "Nada coloca os fundos do assinante em escrow; uma ATA vazia simplesmente não pode sofrer pull, não importa quantas vezes você tente de novo."  # @src=7eb8cc232d91
              b:
                # | Because the Subscriptions program falls back to billing the customer's
                # | card on file after three ledger failures.
                label: "Porque o programa Subscriptions cai para cobrar o cartão em arquivo do cliente depois de três falhas no livro-razão."  # @src=1636f3f75bb0
                # | There is no card on file. The primitive is a token-account delegate
                # | pull, not card billing.
                feedback: "Não existe cartão em arquivo. A primitiva é um pull de delegado de conta de token, não cobrança de cartão."  # @src=56899e2d1d3f
  m06-l1:
    # | Onramps, and the way back out
    title: "Onramps, e o caminho de volta"  # @src=c8eb212ecf38
    blocks:
      headless-onramp-session:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The session request binds the address; the client URL carries the token. Keep
          # | them separate.
          0: "A requisição de sessão vincula o endereço; a URL do cliente carrega o token. Mantenha os dois separados."  # @src=d94bed2f095d
          # | Default the network to solana and the asset to USDC in the URL, and pass the
          # | sessionToken, not the address.
          1: "Coloque solana como network padrão e USDC como ativo padrão na URL, e passe o sessionToken, não o endereço."  # @src=933af9765526
        tests:                      # keyed by test case id
          t1:
            # | the session request binds the destination on Solana, not Ethereum
            description: "a requisição de sessão vincula o destino na Solana, não na Ethereum"  # @src=030d9d1d4492
          t2:
            # | the client URL carries the session token
            description: "a URL do cliente carrega o session token"  # @src=afc5ec6905d9
          t3:
            # | the client URL defaults the network to Solana
            description: "a URL do cliente usa a Solana como network padrão"  # @src=9e69e2456374
          t4:
            # | the raw wallet address must never appear in the client URL
            description: "o endereço de carteira cru nunca pode aparecer na URL do cliente"  # @src=89099cf7dc19
          t5:
            # | the destination address is bound in the server-side session request
            description: "o endereço de destino é vinculado na requisição de sessão do lado do servidor"  # @src=a3ea5c51d283
          t6:
            # | the preset fiat amount is carried into the onramp URL
            description: "o valor de fiat pré-definido é carregado para dentro da URL do onramp"  # @src=1e2efea75b34
          t7:
            # | a second customer's session request binds THEIR address on Solana (nothing
            # | about the first buyer may be baked in)
            description: "a requisição de sessão de um segundo cliente vincula o endereço DELE na Solana (nada do primeiro comprador pode estar cravado)"  # @src=cd350ba1b244
          t8:
            # | the second customer's URL carries their own session token and preset amount
            description: "a URL do segundo cliente carrega o próprio session token e o próprio valor pré-definido"  # @src=ac739648c58e
          t9:
            # | the client URL leaks the address in no form: not verbatim, not reversed, and
            # | no query parameter beyond the five the flow defines
            description: "a URL do cliente não vaza o endereço de forma nenhuma: nem na íntegra, nem invertido, e nenhum query parameter além dos cinco que o fluxo define"  # @src=dc6e3affe735
      check:                      # quiz
        questions:
          q1:
            # | You wired Coinbase Onramp's headless flow into Wavelength's checkout. A
            # | teammate proposes building the onramp URL on the client by appending the
            # | buyer's wallet address and your app ID as query params. Why does the
            # | session-token flow exist instead?
            prompt: "Você ligou o fluxo headless do Coinbase Onramp no checkout da Wavelength. Um colega de time propõe montar a URL do onramp no cliente, anexando o endereço de carteira do comprador e o seu app ID como query params. Por que o fluxo de session token existe em vez disso?"  # @src=28213a196e5e
            # | The headless flow mints a one-time session token on the server, binding the
            # | destination address and receivable assets. The client then opens a URL
            # | carrying only that token. A tampered client URL cannot redirect the funded
            # | USDC, because the address never travels in the query string. That is the
            # | exact property your coding challenge enforces: bind server-side, never leak.
            explanation: "O fluxo headless emite no servidor um session token de uso único, vinculando o endereço de destino e os ativos a receber. O cliente então abre uma URL carregando só esse token. Uma URL de cliente adulterada não consegue redirecionar o USDC financiado, porque o endereço nunca viaja na query string. Essa é exatamente a propriedade que o seu desafio de código impõe: vincule no servidor, nunca vaze."  # @src=430e4d713f58
            options:                 # source order — keep it
              c:
                # | The address and asset are bound to a server-minted token, so the client
                # | URL cannot redirect the funds.
                label: "O endereço e o ativo ficam vinculados a um token emitido no servidor, então a URL do cliente não consegue redirecionar o dinheiro."  # @src=fb8783e246fa
                # | Whatever the client can edit, an attacker can edit; the token is a
                # | bearer credential, which is why it is minted one-time and short-lived.
                feedback: "Tudo que o cliente pode editar, um atacante pode editar; o token é uma credencial ao portador, e é por isso que ele é emitido de uso único e com vida curta."  # @src=c60aee98a1c7
              a:
                # | App IDs are rotated hourly, so a client-built URL would stop working
                # | within the hour anyway.
                label: "App IDs são rotacionados de hora em hora, então uma URL montada no cliente pararia de funcionar dentro de uma hora de qualquer jeito."  # @src=c392bbc9fdd9
                # | App IDs are not rotated hourly; that is not the reason the token flow
                # | exists.
                feedback: "App IDs não são rotacionados de hora em hora; não é esse o motivo de o fluxo de token existir."  # @src=cc272c001e48
              d:
                # | It also proves the buyer authorized that destination, so a tampered POST
                # | body cannot redirect the funds.
                label: "Ele também prova que o comprador autorizou aquele destino, então um corpo de POST adulterado não consegue redirecionar o dinheiro."  # @src=e9d4d1433666
                # | The token binds a destination; it says nothing about who asked for it.
                # | The lab's /session route still takes the address from a client POST, and
                # | closing that hop takes a logged-in session or a wallet signature your
                # | app owns.
                feedback: "O token vincula um destino; ele não diz nada sobre quem pediu por ele. A rota /session do lab ainda pega o endereço de um POST do cliente, e fechar esse salto exige uma sessão logada ou uma signature de carteira que o seu app controla."  # @src=b6a915ad5cd2
              b:
                # | Onramp URLs cannot encode a base58 Solana address in a query param, so a
                # | session token is the only way to name a non-EVM destination.
                label: "URLs de onramp não conseguem codificar um endereço base58 da Solana num query param, então um session token é o único jeito de nomear um destino não-EVM."  # @src=e59b85bf0f7e
                # | A base58 address encodes into a query param without trouble; the token
                # | exists so the destination cannot be tampered with in transit, not
                # | because Solana addresses are unrepresentable.
                feedback: "Um endereço base58 codifica num query param sem problema nenhum; o token existe para que o destino não possa ser adulterado em trânsito, não porque endereços da Solana sejam irrepresentáveis."  # @src=efaa4b991ccd
          q2:
            # | A SOL-less buyer uses the embedded Stripe onramp to fund a purchase. Days
            # | later a dispute is filed on the card. Who eats the loss and handles the
            # | chargeback?
            prompt: "Um comprador sem SOL usa o onramp embutido da Stripe para financiar uma compra. Dias depois uma disputa é aberta no cartão. Quem engole o prejuízo e cuida do chargeback?"  # @src=a5fc43f2d30d
            # | Stripe runs its fiat-to-crypto onramp as merchant-of-record: it handles KYC
            # | and absorbs fraud and disputes. That is precisely what you are buying by
            # | embedding a ramp instead of taking cards yourself. The tradeoff is that
            # | Stripe, not you, owns the geo and asset coverage and the preview-status
            # | limits.
            explanation: "A Stripe toca o onramp fiat-para-cripto dela como merchant-of-record: ela cuida do KYC e absorve fraude e disputas. É exatamente isso que você está comprando ao embutir um ramp em vez de aceitar cartões você mesmo. A contrapartida é que a Stripe, e não você, é dona da cobertura geográfica e de ativos e dos limites do status de preview."  # @src=eba8fc5d8e28
            options:                 # source order — keep it
              b:
                # | Wavelength, because the funds landed in the buyer's wallet under your
                # | checkout, so the liability follows the goods.
                label: "A Wavelength, porque o dinheiro caiu na carteira do comprador dentro do seu checkout, então a responsabilidade segue a mercadoria."  # @src=309774e8bcf1
                # | The onramp settles crypto to the buyer, not to you; as
                # | merchant-of-record for the onramp, Stripe carries the card-side
                # | liability, not the store.
                feedback: "O onramp liquida cripto para o comprador, não para você; como merchant-of-record do onramp, a Stripe carrega a responsabilidade do lado do cartão, não a loja."  # @src=e415bbbcaedc
              c:
                # | The buyer's card issuer, since onramp purchases are treated as cash
                # | advances with no recourse.
                label: "O emissor do cartão do comprador, já que compras de onramp são tratadas como saques em dinheiro sem direito a recurso."  # @src=48fcf8546597
                # | Onramp buys are not cash advances, and the merchant-of-record is Stripe,
                # | not the issuer.
                feedback: "Compras de onramp não são saques em dinheiro, e o merchant-of-record é a Stripe, não o emissor."  # @src=fd239b6e1083
              a:
                # | Stripe, which is the merchant-of-record for its onramp and absorbs
                # | fraud, disputes, and KYC.
                label: "A Stripe, que é o merchant-of-record do onramp dela e absorve fraude, disputas e KYC."  # @src=76c8c5775277
                # | Liability follows the merchant-of-record on the card leg, and that leg
                # | ends when the buyer receives crypto. Your own sale, downstream of it,
                # | has no dispute backstop at all.
                feedback: "A responsabilidade segue o merchant-of-record na perna do cartão, e essa perna termina quando o comprador recebe a cripto. A sua própria venda, rio abaixo dela, não tem rede de proteção de disputa nenhuma."  # @src=0efe38274544
              d:
                # | No one: the USDC leg settled with finality, so the card dispute has
                # | nowhere to land.
                label: "Ninguém: a perna do USDC liquidou com finality, então a disputa do cartão não tem onde cair."  # @src=f969c3f6ff7c
                # | Finality settles the USDC leg, not the card leg. The charge stays
                # | disputable for months, and the dispute lands on whoever is
                # | merchant-of-record for it.
                feedback: "A finality liquida a perna do USDC, não a perna do cartão. A cobrança continua contestável por meses, e a disputa cai em quem for o merchant-of-record dela."  # @src=083f15df1d47
          q3:
            # | Wavelength wants an artist to cash USDC royalties out to a bank, so you
            # | reach for Coinbase Offramp. What constraint shapes the integration compared
            # | with the onramp you just embedded?
            prompt: "A Wavelength quer que um artista saque royalties em USDC para um banco, então você recorre ao Coinbase Offramp. Que restrição molda a integração em comparação com o onramp que você acabou de embutir?"  # @src=e514022e0ca7
            # | The onramp can be embedded headlessly; the offramp is hosted-only, so the
            # | way out is a redirect into Coinbase's own flow, with ACH or PayPal as the
            # | payout rails. You give up embedded UX for the exit and, in exchange, keep
            # | the payout KYC off your plate.
            explanation: "O onramp pode ser embutido de forma headless; o offramp é hosted-only, então o caminho de saída é um redirecionamento para o fluxo da própria Coinbase, com ACH ou PayPal como trilhos de payout. Você abre mão da UX embutida na saída e, em troca, mantém o KYC do payout fora do seu colo."  # @src=678d994bb8ca
            options:                 # source order — keep it
              d:
                # | The hosted exit needs no session token: you redirect with a
                # | partnerUserRef and a redirectUrl, and Coinbase signs the artist in.
                label: "A saída hospedada não precisa de session token: você redireciona com um partnerUserRef e uma redirectUrl, e a Coinbase faz o login do artista."  # @src=3c13093a481b
                # | Both directions have been session-token-initialized since July 2025, so
                # | the sell URL carries a sessionToken alongside partnerUserRef and
                # | redirectUrl. Hosting changes where the screens live, not how the session
                # | is bound.
                feedback: "As duas direções são inicializadas por session token desde julho de 2025, então a URL de venda carrega um sessionToken ao lado de partnerUserRef e redirectUrl. Hospedar muda onde as telas moram, não como a sessão é vinculada."  # @src=1027286458bc
              a:
                # | Offramp exposes the same headless session-token endpoint as the onramp,
                # | so you reuse the embedded component and flip its direction flag.
                label: "O Offramp expõe o mesmo endpoint headless de session token que o onramp, então você reusa o componente embutido e inverte a flag de direção dele."  # @src=c7f8fac09555
                # | There is no headless offramp endpoint and no direction flag to flip;
                # | Offramp is hosted-only, so the way out is a redirect.
                feedback: "Não existe endpoint headless de offramp nem flag de direção para inverter; o Offramp é hosted-only, então o caminho de saída é um redirecionamento."  # @src=31990f1accb7
              c:
                # | Offramp requires you to become the merchant-of-record, taking on the
                # | payout KYC yourself.
                label: "O Offramp exige que você vire o merchant-of-record, assumindo o KYC do payout você mesmo."  # @src=64a9fe592e60
                # | The hosted flow keeps KYC with Coinbase; the point of a hosted offramp
                # | is that you do not take on the payout compliance.
                feedback: "O fluxo hospedado mantém o KYC com a Coinbase; o ponto de um offramp hospedado é que você não assume o compliance do payout."  # @src=7f0dcbbee80d
              b:
                # | Offramp is hosted-only, so you redirect rather than embed, and the
                # | payout runs over ACH or PayPal.
                label: "O Offramp é hosted-only, então você redireciona em vez de embutir, e o payout corre sobre ACH ou PayPal."  # @src=76794730de52
                # | With no headless endpoint published, the exit has to leave your UI, and
                # | the payout runs at bank speed; what you buy for that is the payout KYC
                # | staying off your plate.
                feedback: "Sem nenhum endpoint headless publicado, a saída tem que sair da sua UI, e o payout corre na velocidade de banco; o que você compra com isso é o KYC do payout ficando fora do seu colo."  # @src=60e4c65c49a7
          q4:
            # | Two flows in this lesson both cross between fiat and crypto: a processor
            # | settling your card sales to a fiat balance, and a user off-ramping their own
            # | USDC to a bank. Why does the course insist these are different?
            prompt: "Dois fluxos desta lição cruzam entre fiat e cripto: uma processadora liquidando as suas vendas de cartão num saldo em fiat, e um usuário fazendo offramp do próprio USDC para um banco. Por que o curso insiste que eles são diferentes?"  # @src=b1631c41e362
            # | Merchant fiat settlement is the processor acting for you, the merchant; a
            # | user off-ramp is the buyer or artist acting for themselves. Different actor,
            # | different KYC surface, different merchant-of-record. The dev's compliance
            # | job is not to run either flow but to know which is which at every seam,
            # | which is exactly what the assessment asks you to state in one line.
            explanation: "Liquidação em fiat do lojista é a processadora agindo por você, o lojista; um offramp de usuário é o comprador ou o artista agindo por conta própria. Ator diferente, superfície de KYC diferente, merchant-of-record diferente. O trabalho de compliance do dev não é tocar nenhum dos dois fluxos, e sim saber qual é qual em cada costura, que é exatamente o que a avaliação pede para você declarar em uma linha."  # @src=8b72a5357a03
            options:                 # source order — keep it
              a:
                # | They run on different blockchains, so the KYC provider differs by the
                # | chain used.
                label: "Eles rodam em blockchains diferentes, então o provedor de KYC muda conforme a blockchain usada."  # @src=4575a87e38f1
                # | Same chain in both cases; the difference is the actor and the direction,
                # | not the chain.
                feedback: "A mesma blockchain nos dois casos; a diferença é o ator e a direção, não a blockchain."  # @src=a45d4c4fd983
              b:
                # | Merchant settlement is off-ramping wearing a processor's branding, so
                # | one KYC registration at the processor covers both directions.
                label: "Liquidação do lojista é offramp vestindo a marca de uma processadora, então um cadastro de KYC na processadora cobre as duas direções."  # @src=c2c07edb4eea
                # | One registration does not cover both: different actors, different KYC
                # | surfaces, and collapsing them hides who is liable where.
                feedback: "Um cadastro não cobre os dois: atores diferentes, superfícies de KYC diferentes, e juntar os dois esconde quem é responsável onde."  # @src=7620b5773513
              d:
                # | One moves money out and the other moves it in, so KYC attaches to the
                # | direction of the transfer.
                label: "Um move dinheiro para fora e o outro move para dentro, então o KYC se prende à direção da transferência."  # @src=66ce6f96182a
                # | Both of these carry value from crypto to fiat, so direction does not
                # | tell them apart. What tells them apart is who is transacting: your
                # | business at the processor, or the artist at the ramp.
                feedback: "Os dois carregam valor de cripto para fiat, então a direção não separa eles. O que separa eles é quem está transacionando: o seu negócio na processadora, ou o artista no ramp."  # @src=26195727d017
              c:
                # | They involve different actors, so the KYC surface and the
                # | merchant-of-record sit in different places for each.
                label: "Eles envolvem atores diferentes, então a superfície de KYC e o merchant-of-record ficam em lugares diferentes para cada um."  # @src=5ae55cec5eb5
                # | Compliance follows whoever is legally transacting, not the direction the
                # | money moves, so the actor at each seam is yours to keep track of.
                feedback: "O compliance segue quem está legalmente transacionando, não a direção em que o dinheiro se move, então o ator em cada costura é seu para acompanhar."  # @src=92c3074b8d5e
  m06-l2:
    # | Acceptance and corridors: Stripe, MoonPay Commerce, and PIX
    title: "Aceitação e corredores: Stripe, MoonPay Commerce e PIX"  # @src=65b69c87c113
    blocks:
      check:                      # quiz
        questions:
          q5:
            # | A US buyer pays Wavelength for a record with USDC on Solana through Stripe's
            # | pay-with-crypto. You check the Stripe dashboard the next morning. What did
            # | you receive, and what is the refund path?
            prompt: "Um comprador nos EUA paga um disco para a Wavelength com USDC na Solana pelo Stripe pay-with-crypto. Você confere o dashboard da Stripe na manhã seguinte. O que você recebeu, e qual é o caminho de reembolso?"  # @src=9ca68350be89
            # | Stripe pay-with-crypto accepts USDC on Solana but settles to your fiat
            # | Stripe balance, so you are not holding crypto. Refunds are push payments of
            # | stablecoins back to the originating wallet, the same reverse-transfer shape
            # | you built in the reconciliation lesson. There is no chargeback and no
            # | on-chain reversal.
            explanation: "Stripe pay-with-crypto aceita USDC na Solana mas liquida no seu saldo em fiat da Stripe, então você não está segurando cripto. Reembolsos são pagamentos de push de stablecoins de volta para a carteira de origem, o mesmo formato de transferência ao contrário que você construiu na lição de conciliação. Não existe chargeback nem reversão on-chain."  # @src=3a30a6437cf2
            options:                 # source order — keep it
              b:
                # | USDC in a Stripe-custodied wallet you withdraw on-chain, with refunds
                # | issued as on-chain reversals of the original transfer.
                label: "USDC numa carteira sob custódia da Stripe que você saca on-chain, com reembolsos emitidos como reversões on-chain da transferência original."  # @src=2d16aed46c9c
                # | Settlement is to a fiat balance, and on-chain transfers are not
                # | reversible; refunds are push payments as stablecoins.
                feedback: "A liquidação vai para um saldo em fiat, e transferências on-chain não são reversíveis; reembolsos são pagamentos de push em stablecoins."  # @src=d498b37417e2
              c:
                # | Nothing until a 24-hour finalization clears, after which the buyer must
                # | re-initiate any refund from their wallet.
                label: "Nada até uma finalização de 24 horas ser concluída, depois da qual o comprador precisa reiniciar qualquer reembolso a partir da carteira dele."  # @src=3fd570c82a35
                # | Settlement is to your fiat balance, and refunds are merchant-initiated
                # | push payments, not a buyer re-initiation.
                feedback: "A liquidação vai para o seu saldo em fiat, e reembolsos são pagamentos de push iniciados pelo lojista, não uma reiniciação pelo comprador."  # @src=afef4a3c11cb
              d:
                # | A fiat balance, with refunds pushed as stablecoins to whichever wallet
                # | the buyer nominates at refund time rather than the originating one.
                label: "Um saldo em fiat, com reembolsos empurrados como stablecoins para qualquer carteira que o comprador indicar na hora do reembolso, e não para a de origem."  # @src=eda26ae0e19f
                # | The settlement half is right and the return address is not: the
                # | stablecoin goes back to the wallet the payment came from. Letting a
                # | payer nominate a fresh destination for a refund is how refund flows get
                # | farmed, which is why the originating-wallet rule shows up on every push
                # | rail in this course.
                feedback: "A metade da liquidação está certa e o endereço de volta não: a stablecoin volta para a carteira de onde o pagamento veio. Deixar um pagador indicar um destino novo para um reembolso é como fluxos de reembolso viram farm de fraude, que é por que a regra da carteira de origem aparece em todo trilho de push deste curso."  # @src=82e522f40694
              a:
                # | A fiat balance: Stripe settles the sale in fiat, and refunds go back as
                # | stablecoins to the originating wallet.
                label: "Um saldo em fiat: a Stripe liquida a venda em fiat, e reembolsos voltam como stablecoins para a carteira de origem."  # @src=fdc5f7cd7b31
                # | The legs are not symmetric; you receive a currency you never converted,
                # | while the return leg has to be a stablecoin push because the chain
                # | issues no reversal. Two units, one order.
                feedback: "As pernas não são simétricas; você recebe uma moeda que nunca converteu, enquanto a perna de volta tem que ser um push de stablecoin porque a blockchain não emite reversão. Duas unidades, um pedido."  # @src=87b6684df629
          q6:
            # | A wave of Brazilian buyers expects to pay Wavelength with PIX. Which
            # | corridor choice matches the research, and what is the settlement
            # | expectation?
            prompt: "Uma onda de compradores brasileiros espera pagar a Wavelength com PIX. Qual escolha de corredor bate com a pesquisa, e qual é a expectativa de liquidação?"  # @src=b68ced6e6c30
            # | Sphere is the Brazil corridor anchor: its rails include PIX alongside SEPA
            # | and ACH, with settlement quoted under 30 minutes. That is exactly why a
            # | corridor decision is a per-geography table rather than one processor: Sphere
            # | wins Brazil and would do nothing for your US card buyer.
            explanation: "Sphere é a âncora do corredor Brasil: os trilhos dela incluem PIX ao lado de SEPA e ACH, com liquidação cotada em menos de 30 minutos. É exatamente por isso que uma decisão de corredor é uma tabela por geografia em vez de um processador só: a Sphere ganha o Brasil e não faria nada pelo seu comprador de cartão nos EUA."  # @src=048ad50586a1
            options:                 # source order — keep it
              d:
                # | Sphere, whose public page confirms BRL settlement for PIX buyers, same
                # | business day.
                label: "Sphere, cuja página pública confirma liquidação em reais para compradores de PIX, no mesmo dia útil."  # @src=e578a7fab541
                # | Sphere is the right row for the wrong reason. Its public page quotes
                # | settlement timing, under 30 minutes, and never states the settlement
                # | asset, so BRL is your assumption and not its claim. That cell stays
                # | marked confirm-with-vendor.
                feedback: "Sphere é a linha certa pelo motivo errado. A página pública dela cota prazo de liquidação, menos de 30 minutos, e nunca declara o ativo de liquidação, então o real é a sua suposição e não a afirmação dela. Essa célula continua marcada como confirmar-com-fornecedor."  # @src=9080d494a1ba
              c:
                # | MoonPay Commerce, the only processor in the roster offering a PIX
                # | payout.
                label: "MoonPay Commerce, o único processador do elenco que oferece repasse por PIX."  # @src=b5e9a824a304
                # | Sphere is the PIX anchor in the research; MoonPay Commerce is not the
                # | PIX choice here.
                feedback: "Sphere é a âncora de PIX na pesquisa; MoonPay Commerce não é a escolha de PIX aqui."  # @src=fda0c106afde
              a:
                # | Stripe pay-with-crypto, which lists PIX among its supported settlement
                # | rails for Brazil.
                label: "Stripe pay-with-crypto, que lista PIX entre os trilhos de liquidação suportados dela para o Brasil."  # @src=3cbbd55fa340
                # | Stripe's crypto acceptance is stablecoin-network-based; PIX is Sphere's
                # | rail, not Stripe's.
                feedback: "A aceitação em cripto da Stripe é baseada em rede de stablecoin; PIX é o trilho da Sphere, não da Stripe."  # @src=711987204c6b
              b:
                # | Sphere, whose rails include PIX alongside SEPA and ACH, with settlement
                # | quoted under 30 minutes.
                label: "Sphere, cujos trilhos incluem PIX ao lado de SEPA e ACH, com liquidação cotada em menos de 30 minutos."  # @src=24a431929c41
                # | A corridor turns on which local rail a provider touches, not on size.
                feedback: "Um corredor se decide por qual trilho local um provedor toca, não por tamanho."  # @src=68bfff1ea3ec
          q7:
            # | Wavelength puts a $30 sticker on the August pressing and takes payment in a
            # | USD-pegged stablecoin. A buyer asks why the figure they are charged is not
            # | rounded off a live market rate. How should the storefront set that number,
            # | and where does price-feed depth belong?
            prompt: "A Wavelength põe uma etiqueta de US$ 30 na prensagem de agosto e recebe pagamento numa stablecoin atrelada ao dólar. Um comprador pergunta por que o valor cobrado dele não é arredondado a partir de uma cotação de mercado ao vivo. Como a vitrine deve fixar esse número, e onde mora a profundidade de price feed?"  # @src=cd8f76daccd9
            # | Because USDC is a USD peg, a USD-priced record is charged as the same number
            # | of USDC, 1:1, with no oracle needed. Display pricing only gets interesting
            # | for volatile assets, and that oracle-based pricing depth is deliberately out
            # | of scope here — DeFi and RWA Engineering territory, not a payments-course
            # | skill. Building a price feed for a pegged stablecoin is wasted work.
            explanation: "Como o USDC tem paridade com o dólar, um disco precificado em dólar é cobrado como o mesmo número de USDC, 1:1, sem precisar de oráculo. Precificação de exibição só fica interessante para ativos voláteis, e essa profundidade de precificação baseada em oráculo está de propósito fora de escopo aqui — território de DeFi e RWA Engineering, não uma habilidade de curso de pagamentos. Construir um price feed para uma stablecoin atrelada é trabalho jogado fora."  # @src=55fd6ce76d4d
            options:                 # source order — keep it
              c:
                # | USD-priced records are charged in exact USDC 1:1; oracle pricing belongs
                # | to volatile assets and stays out of this course's scope.
                label: "Discos precificados em dólar são cobrados em USDC exato 1:1; precificação por oráculo pertence a ativos voláteis e fica fora do escopo deste curso."  # @src=593a8ddb14c1
                # | A USD-pegged unit needs no conversion, leaving no rate to fetch and no
                # | spread to carry. The peg is an assumption, though, and on a Token-2022
                # | mint (not classic USDC) a transfer fee can still change what lands,
                # | which is why the roster check stays.
                feedback: "Uma unidade atrelada ao dólar não precisa de conversão, então não sobra cotação para buscar nem spread para carregar. A paridade é uma suposição, porém, e num mint Token-2022 (não o USDC clássico) uma taxa de transferência ainda pode mudar o que aterrissa, que é por que a checagem do elenco continua."  # @src=01b070c3fd2b
              b:
                # | You must run your own price feed for every record, since oracle
                # | integration is a core payments-course skill.
                label: "Você tem que rodar o seu próprio price feed para cada disco, já que integração de oráculo é uma habilidade central de curso de pagamentos."  # @src=1acbf77f4f87
                # | For a USD-pegged stablecoin the display price is 1:1; oracle depth is
                # | handed off, not a core skill here.
                feedback: "Para uma stablecoin atrelada ao dólar o preço de exibição é 1:1; a profundidade de oráculo é repassada, não é uma habilidade central aqui."  # @src=84e99f5ff50e
              a:
                # | USDC floats against USD like any other token, so you quote a mid-price
                # | off an oracle, eat the spread, and wire that feed here in full.
                label: "O USDC flutua contra o dólar como qualquer outro token, então você cota um preço médio a partir de um oráculo, come o spread e liga esse feed aqui por inteiro."  # @src=63cb5ad80128
                # | USDC is a USD peg charged 1:1, so there is no spread to eat, and deep
                # | oracle pricing is not taught in this course.
                feedback: "O USDC tem paridade com o dólar e é cobrado 1:1, então não existe spread para comer, e precificação por oráculo em profundidade não é ensinada neste curso."  # @src=254fe6bdb5d3
              d:
                # | Charge 1:1 now, and treat oracle pricing for volatile assets, with its
                # | staleness and spread rules, as work this course still owes you.
                label: "Cobre 1:1 agora, e trate precificação por oráculo para ativos voláteis, com as regras de defasagem e de spread dela, como trabalho que este curso ainda te deve."  # @src=d173a7b68119
                # | The 1:1 half is right; the promissory note is not one this course wrote.
                # | Staleness windows, confidence intervals and spread policy are handed off
                # | to DeFi and RWA Engineering by name, and the corridor record notes the
                # | handoff rather than teaching a quarter of it.
                feedback: "A metade do 1:1 está certa; a nota promissória não é uma que este curso assinou. Janelas de defasagem, intervalos de confiança e política de spread são repassados nominalmente para DeFi e RWA Engineering, e o registro de corredores anota o repasse em vez de ensinar um quarto dele."  # @src=bf624f88c6e0
          q8:
            # | Writing Wavelength's corridor decision record, you cite MoonPay Commerce.
            # | What is the accurate framing of what it is and how you cite its volume?
            prompt: "Escrevendo o registro de decisão de corredores da Wavelength, você cita a MoonPay Commerce. Qual é o enquadramento preciso do que ela é e de como você cita o volume dela?"  # @src=b040d082f4d0
            # | MoonPay Commerce is the former Helio: hel.io redirects into MoonPay's
            # | commerce arm. Its marketed volume, over $40M in single-payment volume since
            # | the October 2025 launch with 88% on Solana, is a moving figure, so the
            # | decision record cites it with source and date. Treating any marketed volume
            # | number as a fixed constant is the footgun the whole numbers-discipline rule
            # | guards against.
            explanation: "MoonPay Commerce é a antiga Helio: hel.io redireciona para o braço de comércio da MoonPay. O volume divulgado dela, mais de US$ 40 milhões em volume de single-payment desde o lançamento em outubro de 2025 com 88% na Solana, é um número em movimento, então o registro de decisão cita ele com fonte e data. Tratar qualquer número de volume divulgado como constante fixa é a cilada contra a qual a regra inteira de disciplina de números protege."  # @src=a911827558d8
            options:                 # source order — keep it
              d:
                # | It is ex-Helio, and the $40M figure comes via Solana's ecosystem
                # | roundup, so it is third-party verified.
                label: "Ela é ex-Helio, e o número de US$ 40 milhões vem pelo roundup de ecossistema da Solana, então é verificado por terceiro."  # @src=647f67f84e6b
                # | The roundup reports MoonPay reporting itself, so the chain has two links
                # | and the number is still the vendor's chosen one. Publication elsewhere
                # | changes who repeated a figure, not who measured it, and a flow figure
                # | for a young product decays whoever prints it.
                feedback: "O roundup reporta a MoonPay reportando a si mesma, então a cadeia tem dois elos e o número continua sendo o escolhido pelo fornecedor. Publicação em outro lugar muda quem repetiu um número, não quem mediu ele, e um número de fluxo de um produto jovem decai seja quem for que imprima."  # @src=83b7d545ef8f
              c:
                # | It is the Solana Foundation's official acceptance processor, and its
                # | volume comes from verifiable on-chain reads.
                label: "Ela é o processador de aceitação oficial da Solana Foundation, e o volume dela vem de leituras on-chain verificáveis."  # @src=335008a5e1b3
                # | It is a MoonPay product, not a Foundation processor, and the figure is a
                # | marketed dated number, not an on-chain read.
                feedback: "Ela é um produto da MoonPay, não um processador da Foundation, e o número é um número divulgado e datado, não uma leitura on-chain."  # @src=c9eb173b4950
              b:
                # | It is a Stripe competitor built from scratch in 2026, and its $40M
                # | single-payment volume is an audited constant you can quote flat in the
                # | record.
                label: "Ela é uma concorrente da Stripe construída do zero em 2026, e o volume de single-payment de US$ 40 milhões dela é uma constante auditada que você pode citar seca no registro."  # @src=7db5aec6f459
                # | It is ex-Helio rather than a from-scratch build, and marketed volume is
                # | a moving figure, not an audited constant.
                feedback: "Ela é ex-Helio e não uma construção do zero, e volume divulgado é um número em movimento, não uma constante auditada."  # @src=17e1e49676e9
              a:
                # | It is ex-Helio (hel.io redirects into MoonPay), and volume figures carry
                # | a source and date because the number moves.
                label: "Ela é ex-Helio (hel.io redireciona para a MoonPay), e números de volume carregam fonte e data porque o número se mexe."  # @src=e0bb76cf3d74
                # | A redirect is the evidence of who owns the product now; a marketed
                # | figure is live.
                feedback: "Um redirect é a evidência de quem é dono do produto agora; um número divulgado é vivo."  # @src=387853fb8f43
          q9:
            # | Wavelength's BR corridor is live. A São Paulo buyer pays in USDC out of a
            # | wallet whose keys they hold, routed through the corridor's Brazilian
            # | intermediary, and Wavelength sits in Brazil too. Run the boundary section's
            # | five questions: where does this movement land as of mid-2026, and what do
            # | you ask next?
            prompt: "O corredor BR da Wavelength está no ar. Um comprador em São Paulo paga em USDC de uma carteira cujas chaves ele mesmo guarda, roteado pelo intermediário brasileiro do corredor, e a Wavelength também fica no Brasil. Rode as cinco perguntas da seção da fronteira: onde este movimento aterrissa em meados de 2026, e o que você pergunta em seguida?"  # @src=c2abefc124ed
            # | The perimeter test is art. 76-A of Resolução BCB 277, inserted by Res. 521
            # | and in force for that article since 2026-02-02, and its third bucket is
            # | expressly the non-international one: transfers to or from a self-custodied
            # | wallet that involve no international payment. This flow crosses no border
            # | anywhere and sits inside anyway; put a border in it and it moves to the
            # | first bucket rather than out of the perimeter. 76-B only defines the
            # | international bucket, and is itself broader than resident-to-non-resident;
            # | PL 4.308 is a bill about issuance, not classification. The next check is the
            # | provider's authorization, which is question 2 of the method.
            explanation: "O teste de perímetro é o art. 76-A da Resolução BCB 277, inserido pela Res. 521 e em vigor para aquele artigo desde 2026-02-02, e o terceiro grupo dele é expressamente o não internacional: transferências de ou para carteira de autocustódia que não envolvem nenhum pagamento internacional. Este fluxo não cruza fronteira nenhuma e fica dentro mesmo assim; ponha uma fronteira nele e ele se move para o primeiro grupo em vez de sair do perímetro. O 76-B só define o grupo internacional, e é ele próprio mais largo do que residente-para-não-residente; o PL 4.308 é um projeto de lei sobre emissão, não sobre classificação. A checagem seguinte é a autorização do provedor, que é a pergunta 2 do método."  # @src=22b01ce4e8da
            options:                 # source order — keep it
              a:
                # | Inside the FX perimeter: art. 76-A III reaches self-custody transfers
                # | with a PSAV leg and no border, so check the provider's licence.
                label: "Dentro do perímetro do câmbio: o art. 76-A III alcança transferências de autocustódia com uma perna de PSAV e sem fronteira, então confira a licença do provedor."  # @src=cb0a953b98ac
                # | The perimeter test is 76-A, whose third bucket pulls purely domestic
                # | self-custody flows in whenever a PSAV is a leg. In force since
                # | 2026-02-02, and dated: re-pull the text first.
                feedback: "O teste de perímetro é o 76-A, cujo terceiro grupo puxa para dentro fluxos de autocustódia puramente domésticos sempre que um PSAV é uma perna. Em vigor desde 2026-02-02, e datado: puxe o texto de novo primeiro."  # @src=4d7cd0b1944e
              d:
                # | Outside the perimeter for now: the rules reaching a self-custody leg
                # | through a PSAV are Res. 561's eFX articles, which take force on
                # | 2026-10-01.
                label: "Fora do perímetro por enquanto: as regras que alcançam uma perna de autocustódia através de um PSAV são os artigos de eFX da Res. 561, que entram em vigor em 2026-10-01."  # @src=55bbf5e118ea
                # | Two texts, two clocks. Res. 561 governs the settlement leg between an
                # | eFX provider and a foreign counterparty and commences 2026-10-01; the
                # | perimeter test that catches this domestic flow is art. 76-A of Res. 277,
                # | in force since 2026-02-02. Citing the wrong normativo is its own failure
                # | mode.
                feedback: "Dois textos, dois relógios. A Res. 561 rege a perna de liquidação entre um provedor de eFX e uma contraparte estrangeira e entra em vigor em 2026-10-01; o teste de perímetro que pega este fluxo doméstico é o art. 76-A da Res. 277, em vigor desde 2026-02-02. Citar o normativo errado é um modo de falha por si só."  # @src=9ac37807149a
              b:
                # | Outside it: art. 76-B defines an international payment as resident to
                # | non-resident, and two Brazilian residents never satisfy that test.
                label: "Fora dele: o art. 76-B define pagamento internacional como residente para não residente, e dois residentes brasileiros nunca satisfazem esse teste."  # @src=6e292d6ebc48
                # | 76-B only defines the international bucket, one of four, and is itself
                # | broader than that; a domestic flow still enters the perimeter through
                # | the self-custody reach of 76-A III.
                feedback: "O 76-B só define o grupo internacional, um de quatro, e é ele próprio mais largo do que isso; um fluxo doméstico ainda entra no perímetro pelo alcance de autocustódia do 76-A III."  # @src=ca01bf893902
              c:
                # | Outside it until PL 4.308 passes, since only that bill's
                # | reclassification of stablecoins as foreign currency triggers the FX
                # | rules.
                label: "Fora dele até o PL 4.308 passar, já que só a reclassificação de stablecoins como moeda estrangeira desse projeto de lei aciona as regras de câmbio."  # @src=3874b21758fe
                # | PL 4.308 is still a bill, and neither version reclassifies stablecoins:
                # | both keep them virtual assets and touch issuance and distribution. Res.
                # | 277's perimeter already applies.
                feedback: "O PL 4.308 ainda é um projeto de lei, e nenhuma das versões reclassifica stablecoins: as duas mantêm elas como ativos virtuais e tocam emissão e distribuição. O perímetro da Res. 277 já se aplica."  # @src=c43a7f74efc0
  m07-l1:
    # | HTTP 402, revived: the x402 protocol
    title: "HTTP 402, revivido: o protocolo x402"  # @src=c50137898009
    blocks:
      check-concept:                      # quiz
        questions:
          q1-who-signs:
            # | In the exact-SVM flow you just traced, a paying agent gets a 402 with
            # | PaymentRequirements. It builds and partially signs a versioned transaction
            # | and hands it to the facilitator. Whose signature is still missing, and who
            # | adds it?
            prompt: "No fluxo exact-SVM que você acabou de traçar, um agente pagador recebe um 402 com PaymentRequirements. Ele constrói e assina parcialmente uma transação versionada e entrega ela ao facilitador. Qual signature ainda está faltando, e quem acrescenta ela?"  # @src=394163a4f4be
            # | The whole point of the exact-SVM scheme is fee sponsorship: the agent signs
            # | everything except the fee-payer slot, and the facilitator's /settle adds the
            # | fee-payer signature and broadcasts. /verify also fills that slot, but on a
            # | scratch copy and only to simulate the completed transaction; it never
            # | submits, so /settle stays the only step that moves money.
            explanation: "O ponto inteiro do esquema exact-SVM é o patrocínio de taxa: o agente assina tudo menos o slot do fee payer, e o /settle do facilitador acrescenta a signature de fee payer e transmite. O /verify também preenche esse slot, mas numa cópia de rascunho e só para simular a transação completa; ele nunca submete, então o /settle continua sendo o único passo que move dinheiro."  # @src=221f66ebaa9d
            options:                 # source order — keep it
              a:
                # | The fee payer's signature is missing; the facilitator adds it at /settle
                # | and submits the transaction.
                label: "Está faltando a signature do fee payer; o facilitador acrescenta ela no /settle e submete a transação."  # @src=ccdf9f230cfe
                # | Leaving one slot unsigned is what makes sponsorship possible, the payer
                # | authorizing the transfer without funding it. Until the sponsor
                # | broadcasts, that intent is not yet a payment.
                feedback: "Deixar um slot sem assinar é o que torna o patrocínio possível, com o pagador autorizando a transferência sem bancá-la. Até o patrocinador transmitir, essa intenção ainda não é um pagamento."  # @src=f5bcd6eb9277
              d:
                # | The fee payer's signature is missing; /verify adds it and /settle
                # | broadcasts what verify signed.
                label: "Está faltando a signature do fee payer; o /verify acrescenta ela e o /settle transmite o que o verify assinou."  # @src=aa320fe38a24
                # | Right slot, wrong step. The fee-payer signature /verify adds lives on a
                # | scratch copy it simulates and then discards; the signature that goes out
                # | is the one /settle puts on the real transaction. One of those two steps
                # | can move money, and it is not the rehearsal.
                feedback: "Slot certo, passo errado. A signature de fee payer que o /verify acrescenta vive numa cópia de rascunho que ele simula e depois descarta; a signature que sai é a que o /settle põe na transação de verdade. Um desses dois passos consegue mover dinheiro, e não é o ensaio."  # @src=d109d104dbf6
              b:
                # | The merchant's signature is missing; the merchant adds it at /verify
                # | before the agent pays.
                label: "Está faltando a signature do lojista; o lojista acrescenta ela no /verify antes de o agente pagar."  # @src=023382ac32d1
                # | The merchant runs the API and 402s the request, but it does not co-sign
                # | the payment transaction. Signing and submitting is the facilitator's
                # | job, and it happens at /settle, not /verify.
                feedback: "O lojista roda a API e devolve 402 na requisição, mas não cossina a transação de pagamento. Assinar e submeter é trabalho do facilitador, e acontece no /settle, não no /verify."  # @src=302c1f508829
              c:
                # | No signature is missing; the agent fully signs and submits, and the
                # | facilitator only reads the result.
                label: "Não está faltando signature nenhuma; o agente assina por completo e submete, e o facilitador só lê o resultado."  # @src=982e34282470
                # | The agent PARTIALLY signs on purpose so the facilitator can sponsor
                # | fees. If the agent fully signed and submitted, there would be no
                # | facilitator-as-fee-payer role at all.
                feedback: "O agente assina PARCIALMENTE de propósito para que o facilitador possa patrocinar as taxas. Se o agente assinasse por completo e submetesse, não existiria papel nenhum de facilitador-como-fee-payer."  # @src=37dc05553a74
          q2-cu-figure:
            # | A teammate writing your API docs wants to state 'each x402 settle costs
            # | about 20,000 compute units' so buyers can budget. What should you tell them?
            prompt: "Um colega de time escrevendo a documentação da sua API quer afirmar que 'cada settle de x402 custa mais ou menos 20,000 compute units' para os compradores conseguirem se orçar. O que você deve dizer para ele?"  # @src=dd4c36d80bcd
            # | The x402 v2 spec mandates ComputeBudget SetLimit/SetPrice with a bounded CU
            # | PRICE, but it never states a CU count for a settlement. Any absolute you
            # | print needs an independent, dated source, or it should not be printed.
            explanation: "A spec do x402 v2 obriga SetLimit/SetPrice do ComputeBudget com um PREÇO de CU limitado, mas ela nunca declara uma contagem de CU para uma liquidação. Qualquer absoluto que você imprime precisa de uma fonte independente e datada, ou não deveria ser impresso."  # @src=aa7d7f98dafe
            options:                 # source order — keep it
              a:
                # | Keep it; 20k CU is the spec's stated cost for a single exact-SVM
                # | settlement.
                label: "Mantenha; 20k CU é o custo declarado pela spec para uma única liquidação exact-SVM."  # @src=a8ba40321f02
                # | The spec states no CU figure at all. The '20k CU' number was refuted in
                # | research; it roughly equals a transfer plus an ATA creation, not a
                # | mandated cost.
                feedback: "A spec não declara cifra nenhuma de CU. O número de '20k CU' foi refutado na pesquisa; ele equivale mais ou menos a uma transferência mais a criação de uma ATA, não a um custo obrigatório."  # @src=eae9127c6d4c
              d:
                # | Drop it from the docs but keep 20k internally, since the spec itself
                # | states it.
                label: "Tire da documentação mas guarde os 20k internamente, já que a própria spec declara isso."  # @src=34f494c5966c
                # | The 20,000 is real and the spec is not where it comes from: it is
                # | DEFAULT_COMPUTE_UNIT_LIMIT in the reference SDK, the ceiling the client
                # | asks for when it prepends SetComputeUnitLimit. Budgeting against a
                # | requested limit is fine as long as you never call it a spec figure or a
                # | cost.
                feedback: "Os 20,000 são reais e não é da spec que eles vêm: é o DEFAULT_COMPUTE_UNIT_LIMIT no SDK de referência, o teto que o cliente pede quando prefixa SetComputeUnitLimit. Orçar contra um limite pedido é aceitável desde que você nunca chame isso de cifra da spec nem de custo."  # @src=c0c613b8fbac
              c:
                # | Change it to 4,600 CU, since a settle is just an SPL transfer and the
                # | ComputeBudget instructions the spec mandates cost nothing.
                label: "Mude para 4,600 CU, já que um settle é só uma transferência SPL e as instruções de ComputeBudget que a spec obriga não custam nada."  # @src=fbeb6995f3d2
                # | About 4.6k CU is a bare SPL transfer. A settle also carries the mandated
                # | ComputeBudget instructions, which are not free, and it may create an
                # | ATA. The spec pins no absolute, so do not print one.
                feedback: "Uns 4.6k CU são uma transferência SPL pelada. Um settle também carrega as instruções de ComputeBudget obrigatórias, que não são de graça, e ele pode criar uma ATA. A spec não fixa absoluto nenhum, então não imprima um."  # @src=20f8da23ba56
              b:
                # | Drop the number; the spec states no CU figure, and an unsourced one is
                # | unsupported.
                label: "Tire o número; a spec não declara cifra nenhuma de CU, e uma cifra sem fonte não se sustenta."  # @src=7af31bc7ce1b
                # | It bounds the CU price and never the count, so there is no absolute in
                # | it to quote; unstated is not unmeasurable, though, and your own dated
                # | measurement is a citable number.
                feedback: "Ela limita o preço da CU e nunca a contagem, então não existe absoluto nela para citar; mas não declarado não é o mesmo que não mensurável, e a sua própria medição datada é um número citável."  # @src=cd35be1ec274
          q5-where-terms-live:
            # | You curl an unpaid endpoint. Back comes `HTTP/1.1 402`, a `Content-Length:
            # | 2`, and a body of exactly `{}`. Your client throws immediately, because the
            # | terms array it expected to parse is not there. What is actually wrong?
            prompt: "Você dá curl num endpoint não pago. Volta um `HTTP/1.1 402`, um `Content-Length: 2` e um corpo de exatamente `{}`. O seu cliente lança um erro na hora, porque o array de termos que ele esperava parsear não está lá. O que está errado de verdade?"  # @src=d8657987f974
            # | In x402 v2 the challenge travels as base64 JSON in the PAYMENT-REQUIRED
            # | response header, and the 402's body is the two bytes `{}` on the opening
            # | challenge, on a rejected payment, and on a failed settlement alike. Decoding
            # | that header yields `x402Version`, `error` (the failure reason), `resource`,
            # | and the `accepts` array of PaymentRequirements. v1 was the version that
            # | carried its challenge in the body; read the body of a v2 402 and you find an
            # | empty object every time.
            explanation: "No x402 v2 o desafio viaja como JSON em base64 no header de resposta PAYMENT-REQUIRED, e o corpo do 402 são os dois bytes `{}` tanto no desafio de abertura quanto num pagamento rejeitado quanto numa liquidação que falhou. Decodificar esse header entrega `x402Version`, `error` (o motivo da falha), `resource` e o array `accepts` de PaymentRequirements. A v1 era a versão que carregava o desafio dela no corpo; leia o corpo de um 402 v2 e você encontra um objeto vazio toda vez."  # @src=394be127b2c9
            options:                 # source order — keep it
              c:
                # | The 402 is malformed: a spec-conformant challenge must carry `accepts`
                # | in its JSON body, so this response was truncated in transit.
                label: "O 402 está malformado: um desafio conforme a spec precisa carregar `accepts` no corpo JSON dele, então esta resposta foi truncada no caminho."  # @src=2f1b27ab45bc
                # | `Content-Length: 2` matching the two bytes `{}` is not truncation; it is
                # | the specified v2 body. The challenge is complete, and it lives in the
                # | PAYMENT-REQUIRED header your client never decoded.
                feedback: "`Content-Length: 2` batendo com os dois bytes `{}` não é truncamento; é o corpo v2 especificado. O desafio está completo, e ele vive no header PAYMENT-REQUIRED que o seu cliente nunca decodificou."  # @src=caa2afe192b1
              a:
                # | Nothing on the server: v2 carries the whole challenge in a base64
                # | PAYMENT-REQUIRED response header, so decode that header and read
                # | `accepts` out of it.
                label: "Nada no servidor: a v2 carrega o desafio inteiro num header de resposta PAYMENT-REQUIRED em base64, então decodifique esse header e leia o `accepts` de dentro dele."  # @src=89d8d51458ba
                # | The `{}` is the specified body, not a truncated one; the boundary is the
                # | version, since a v1 counterparty really does put its challenge in the
                # | body, which is why `x402Version` is the first field worth reading.
                feedback: "O `{}` é o corpo especificado, não um truncado; a fronteira é a versão, já que uma contraparte v1 realmente põe o desafio dela no corpo, e é por isso que `x402Version` é o primeiro campo que vale ler."  # @src=70fd01e797ce
              b:
                # | The server speaks x402 v1 and is waiting for you to negotiate a version
                # | upward; send the request again with a version header and the body will
                # | fill in.
                label: "O servidor fala x402 v1 e está esperando você negociar uma versão para cima; mande a requisição de novo com um header de versão e o corpo vai se preencher."  # @src=7318d88dbd57
                # | There is no version-negotiation retry, and a v1 server is the one case
                # | where the body would NOT be empty: v1 carries its challenge in the body.
                # | The two-byte `{}` is the v2 signature, not a v1 symptom.
                feedback: "Não existe retry de negociação de versão, e um servidor v1 é justamente o caso em que o corpo NÃO estaria vazio: a v1 carrega o desafio dela no corpo. O `{}` de dois bytes é a marca da v2, não um sintoma de v1."  # @src=2588c21cf3a9
              d:
                # | Nothing on the server, but your client should read the body once it
                # | pays: rejections and failed settlements put their reason in the JSON
                # | body.
                label: "Nada no servidor, mas o seu cliente deveria ler o corpo depois que pagar: rejeições e liquidações que falharam põem o motivo delas no corpo JSON."  # @src=f1e5fdd4e8ce
                # | The empty body is not a property of unpaid requests; it holds on the
                # | opening challenge, on a payment the facilitator rejected, and on a
                # | settlement that failed alike. The reason a request failed rides in the
                # | challenge header's `error` field every time, which is why read the
                # | header, never the body survives contact with production.
                feedback: "O corpo vazio não é uma propriedade de requisições não pagas; ele vale no desafio de abertura, num pagamento que o facilitador rejeitou e numa liquidação que falhou, igualmente. O motivo de uma requisição ter falhado viaja no campo `error` do header do desafio toda vez, que é por que leia o header, nunca o corpo sobrevive ao contato com a produção."  # @src=8350ef9b92c8
      check-landscape:                      # quiz
        questions:
          q3-facilitator:
            # | You are choosing a Solana x402 facilitator for a metered API. A colleague
            # | says 'just use Helius, we already use them for webhooks.' What is the
            # | accurate response?
            prompt: "Você está escolhendo um facilitador x402 na Solana para uma API medida. Um colega diz 'usa a Helius mesmo, a gente já usa eles para webhooks.' Qual é a resposta correta?"  # @src=06c35d5f1d2d
            # | The research corrected the charter's guess: Helius is not a facilitator. The
            # | real Solana options are Corbits, Dexter (free), PayAI, Solvador, Coinbase's
            # | hosted CDP (with KYT/OFAC), and Faremeter as an OSS framework; the x402.org
            # | facilitator is devnet/testnet only.
            explanation: "A pesquisa corrigiu o chute do charter: a Helius não é facilitadora. As opções reais na Solana são Corbits, Dexter (de graça), PayAI, Solvador, o CDP hospedado da Coinbase (com KYT/OFAC) e o Faremeter como framework OSS; o facilitador do x402.org é só devnet/testnet."  # @src=f5c266a88548
            options:                 # source order — keep it
              a:
                # | Good call; Helius is the default Solana facilitator and handles /verify
                # | and /settle.
                label: "Boa; a Helius é a facilitadora padrão na Solana e cuida de /verify e /settle."  # @src=1a9e5feb36a8
                # | Helius is not on any facilitator list. Its roles in this course are
                # | webhooks/RPC and dogfooding the Subscriptions program, not x402
                # | settlement.
                feedback: "A Helius não está em lista nenhuma de facilitadores. Os papéis dela neste curso são webhooks/RPC e fazer dogfooding do programa Subscriptions, não liquidação de x402."  # @src=f6c64a394e1d
              c:
                # | Helius is not a facilitator; pick Corbits, Dexter, PayAI, Solvador, or
                # | CDP.
                label: "A Helius não é facilitadora; escolha Corbits, Dexter, PayAI, Solvador ou CDP."  # @src=56725ce386af
                # | Facilitator is a protocol role that a vendor relationship never confers,
                # | and the roster of who holds it moves, so this list is a snapshot to
                # | re-check at integration time.
                feedback: "Facilitador é um papel de protocolo que uma relação de fornecedor nunca confere, e a lista de quem ocupa esse papel se mexe, então esta lista é uma foto para reconferir na hora de integrar."  # @src=3cda5602f15d
              b:
                # | Helius can do it in devnet only; for mainnet you must switch to Coinbase
                # | CDP.
                label: "A Helius consegue fazer isso só na devnet; para mainnet você precisa trocar para o Coinbase CDP."  # @src=0c8ef530b0fa
                # | Helius is not a facilitator on any network. The devnet-only caveat
                # | belongs to the x402.org facilitator, not to Helius.
                feedback: "A Helius não é facilitadora em rede nenhuma. A ressalva de só-devnet pertence ao facilitador do x402.org, não à Helius."  # @src=48505d4c8d60
              d:
                # | Helius is not a facilitator; use Faremeter instead, the hosted mainnet
                # | option that also auto-negotiates v1 and v2 for mixed counterparties.
                label: "A Helius não é facilitadora; use o Faremeter no lugar, a opção hospedada de mainnet que também negocia v1 e v2 automaticamente para contrapartes misturadas."  # @src=2d87a8a0a86b
                # | The first half lands and the second swaps one category error for
                # | another. Faremeter is an open-source framework rather than a hosted
                # | facilitator: it negotiates dialects in front of whichever facilitator
                # | actually runs /verify and /settle, so you still have to name that one.
                feedback: "A primeira metade acerta e a segunda troca um erro de categoria por outro. O Faremeter é um framework open-source e não um facilitador hospedado: ele negocia dialetos na frente de qualquer facilitador que de fato rode /verify e /settle, então você ainda tem que nomear esse."  # @src=8bdb32c32a92
          q4-traffic-windows:
            # | Your landing page needs a credibility stat for x402. You have '75.41M
            # | transactions / $24.24M in 30 days' (x402.org) and '37M+ transactions, 70% of
            # | monthly volume on Solana' (solana.com/x402). How do you present them?
            prompt: "A sua landing page precisa de uma estatística de credibilidade para o x402. Você tem '75.41M de transações / US$ 24.24M em 30 dias' (x402.org) e '37M+ de transações, 70% do volume mensal na Solana' (solana.com/x402). Como você apresenta as duas?"  # @src=d4bed1db7586
            # | The two published numbers use different windows and metrics. The research
            # | rule is explicit: cite each with its own source and fetch date, and never
            # | combine them into one derived statistic, especially because live dashboard
            # | numbers drift daily.
            explanation: "Os dois números publicados usam janelas e métricas diferentes. A regra da pesquisa é explícita: cite cada um com a fonte dele e a data de consulta dele, e nunca combine os dois numa estatística derivada, ainda mais porque números de painel ao vivo variam diariamente."  # @src=9f89e25ba0ca
            options:                 # source order — keep it
              a:
                # | Quote each figure separately with its own source and date; never add or
                # | blend them into one number.
                label: "Cite cada cifra separadamente com a fonte dela e a data dela; nunca some nem misture as duas num número só."  # @src=f3b22de15b84
                # | Different windows and scopes share no denominator, and arithmetic across
                # | them manufactures a statistic nobody published; they may overlap, too,
                # | which leaves neither one a safe floor.
                feedback: "Janelas e escopos diferentes não dividem denominador nenhum, e fazer aritmética entre eles fabrica uma estatística que ninguém publicou; e os dois ainda podem se sobrepor, o que não deixa nenhum deles ser um piso seguro."  # @src=406e536aeaa6
              c:
                # | Use only the bigger one, 75.41M, dated to its fetch, and drop the Solana
                # | figure as redundant.
                label: "Use só o maior, 75.41M, datado pela consulta dele, e descarte a cifra da Solana como redundante."  # @src=05993fe669a7
                # | Dating what you keep is the right instinct applied to the wrong
                # | survivor. The two measure different things, a 30-day rolling total
                # | against a cumulative-on-Solana snapshot with a share claim, so neither
                # | makes the other redundant; keeping both attributed is the fix.
                feedback: "Datar o que você mantém é o instinto certo aplicado ao sobrevivente errado. Os dois medem coisas diferentes, um total móvel de 30 dias contra uma foto acumulada na Solana com uma afirmação de participação, então nenhum torna o outro redundante; manter os dois com atribuição é a correção."  # @src=52233c798cdc
              b:
                # | Add them, flagged as approximate: 75.41M plus 37M is roughly a 112M
                # | transaction headline, and both pages count x402 transactions.
                label: "Some os dois, sinalizados como aproximados: 75.41M mais 37M dá mais ou menos uma manchete de 112M de transações, e as duas páginas contam transações de x402."  # @src=a2389111c5a0
                # | Both pages do count x402 transactions, over different windows and
                # | different scopes, and calling the sum approximate does not repair it. A
                # | 30-day rolling total added to a cumulative-on-Solana snapshot invents a
                # | number no source supports, and the hedge only makes the invention sound
                # | measured.
                feedback: "As duas páginas contam transações de x402, sim, sobre janelas diferentes e escopos diferentes, e chamar a soma de aproximada não conserta isso. Um total móvel de 30 dias somado a uma foto acumulada na Solana inventa um número que fonte nenhuma sustenta, e a ressalva só faz a invenção soar medida."  # @src=90b0404b6814
              d:
                # | Divide one by the other for a Solana share, roughly 49 percent, dated to
                # | both fetches.
                label: "Divida um pelo outro para achar uma participação da Solana, uns 49 por cento, datada pelas duas consultas."  # @src=41563fec4544
                # | Two dates on a ratio still leave the windows mismatched, and a derived
                # | share is exactly the arithmetic the rule forbids: a rolling 30-day
                # | denominator under a cumulative numerator yields a percentage neither
                # | page measured. Note that solana.com already publishes a share figure,
                # | and it is not this one.
                feedback: "Duas datas numa razão continuam deixando as janelas descasadas, e uma participação derivada é exatamente a aritmética que a regra proíbe: um denominador móvel de 30 dias sob um numerador acumulado dá uma porcentagem que página nenhuma mediu. Repare que o solana.com já publica uma cifra de participação, e não é esta."  # @src=f11389d6cb64
  m07-l2:
    # | Paywall the pressing-price API, then build the bot that pays it
    title: "Ponha um paywall na API de preço de prensagem, depois construa o bot que paga por ela"  # @src=48b75c6342e8
    blocks:
      decide-payment:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Check in a fixed order so the decline reason is deterministic: scheme,
          # | network, asset, memo size, fee payer, then the USD cap.
          0: "Cheque numa ordem fixa para o motivo da recusa ser determinístico: scheme, network, ativo, tamanho do memo, fee payer, e então o teto em USD."  # @src=db784f4077a1
          # | Known Solana CAIP-2 ids: mainnet solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp,
          # | devnet solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1.
          1: "Ids CAIP-2 conhecidos da Solana: mainnet solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp, devnet solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1."  # @src=adbace0e11cb
          # | The USD cap comparison must use the decimals recorded for THIS asset in the
          # | allowlist, not USDC's familiar 6 - a bridged dollar with a different decimal
          # | count changes what the same atomic-unit amount is worth.
          2: "A comparação com o teto em USD tem que usar os decimais registrados para ESTE ativo na allowlist, não os 6 familiares do USDC - um dólar que veio por bridge com uma contagem de decimais diferente muda quanto vale o mesmo valor em unidades atômicas."  # @src=d1a18cd48f2b
        tests:                      # keyed by test case id
          t1-pays-within-cap:
            # | A 0.5 USDC call under the $1 cap is paid; fee payer and memo pass through.
            description: "Uma chamada de 0.5 USDC abaixo do teto de US$ 1 é paga; fee payer e memo passam adiante."  # @src=1fe3d2ffe78a
          t2-over-cap-declined:
            # | A 1.5 USDC call exceeds the $1 cap and is declined.
            description: "Uma chamada de 1.5 USDC excede o teto de US$ 1 e é recusada."  # @src=a92563ad9eaf
          t3-asset-not-allowed:
            # | An asset outside the pegged allowlist is declined.
            description: "Um ativo fora da allowlist de atrelados ao dólar é recusado."  # @src=8dea19c68c11
          t4-wrong-scheme:
            # | A non-exact scheme is not auto-paid.
            description: "Um scheme não-exact não é pago automaticamente."  # @src=b4dfbd951e94
          t5-memo-too-large:
            # | An invoice-id memo over 256 bytes is rejected before payment.
            description: "Um memo de id de fatura acima de 256 bytes é rejeitado antes do pagamento."  # @src=3ee43a53f855
          t6-devnet-accepted:
            # | The devnet CAIP-2 id is a known network and pays under cap.
            description: "O id CAIP-2 da devnet é uma network conhecida e paga abaixo do teto."  # @src=4dc0741e0ff9
          t7-unknown-chain-declined:
            # | A non-Solana CAIP-2 id (Ethereum mainnet) is not a network this agent pays
            # | on.
            description: "Um id CAIP-2 que não é da Solana (mainnet da Ethereum) não é uma network na qual este agente paga."  # @src=d64f96739026
          t8-solana-prefixed-lookalike-declined:
            # | A solana:-prefixed id one character off mainnet's genesis hash is still an
            # | unknown network: the check is membership in the two known ids, not a prefix.
            description: "Um id com prefixo solana: a um caractere de distância do hash de gênese da mainnet ainda é uma network desconhecida: a checagem é pertencer aos dois ids conhecidos, não um prefixo."  # @src=a74c611b6eda
          t9-missing-fee-payer-declined:
            # | Terms that name no fee payer are unpayable: the agent holds no SOL and
            # | cannot sponsor itself.
            description: "Termos que não nomeiam nenhum fee payer são impagáveis: o agente não segura SOL e não consegue patrocinar a si mesmo."  # @src=80c935a78ff1
          t10-memo-multibyte-over-limit:
            # | A 200-character invoice id of two-byte accented characters is 400 UTF-8
            # | BYTES: over the 256-byte ceiling even though its string length is 200.
            description: "Um id de fatura de 200 caracteres feito de caracteres acentuados de dois bytes tem 400 BYTES UTF-8: acima do teto de 256 bytes mesmo com comprimento de string de 200."  # @src=4a2cd30326c6
          t11-decimals-come-from-the-allowlist:
            # | A pegged dollar whose mint carries 8 decimals: 50,000,000 atomic units is
            # | $0.50 and pays. Assuming 6 decimals would read it as $50 and decline.
            description: "Um dólar atrelado cujo mint carrega 8 decimais: 50,000,000 de unidades atômicas dão US$ 0.50 e a chamada passa. Assumir 6 decimais leria isso como US$ 50 e recusaria."  # @src=eb47812704c4
          t12-decimals-still-enforce-the-cap:
            # | The same 8-decimal asset at 250,000,000 atomic units is $2.50 and breaks the
            # | $1 cap: the allowlist supplies the decimals, the cap is still enforced.
            description: "O mesmo ativo de 8 decimais a 250,000,000 de unidades atômicas dá US$ 2.50 e estoura o teto de US$ 1: a allowlist fornece os decimais, o teto continua sendo imposto."  # @src=36ba6c41af01
      check-build:                      # quiz
        questions:
          q5-lighthouse:
            # | Your server-side check rebuilds the expected payment transaction and
            # | compares it byte-for-byte to what the agent submitted from a mainstream
            # | wallet. Legitimate payments start failing the comparison. What is going on,
            # | and what does the SVM verifier do about it?
            prompt: "A sua checagem do lado do servidor reconstrói a transação de pagamento esperada e compara ela byte a byte com o que o agente submeteu de uma carteira popular. Pagamentos legítimos começam a falhar na comparação. O que está acontecendo, e o que o verificador SVM faz a respeito?"  # @src=531068fad22b
            # | Phantom and Solflare inject Lighthouse guard instructions into transactions
            # | to protect users, so a naive rebuild-and-compare check fails on legitimate
            # | payments. x402's SVM verifier hardcodes an allowlist for the Lighthouse
            # | guard program and verifies the transaction that was actually signed. The
            # | lesson: verify signed reality, not your idealized rebuild.
            explanation: "Phantom e Solflare injetam instruções de guarda do Lighthouse nas transações para proteger os usuários, então uma checagem ingênua de reconstruir-e-comparar falha em pagamentos legítimos. O verificador SVM do x402 deixa hardcoded uma allowlist para o programa de guarda Lighthouse e verifica a transação que foi de fato assinada. A lição: verifique a realidade assinada, não a sua reconstrução idealizada."  # @src=776009c41688
            options:                 # source order — keep it
              b:
                # | Phantom and Solflare inject Lighthouse guard instructions, so x402's SVM
                # | verifier allowlists that program and verifies what was actually signed.
                label: "Phantom e Solflare injetam instruções de guarda do Lighthouse, então o verificador SVM do x402 põe esse programa na allowlist e verifica o que foi de fato assinado."  # @src=8cd48f2e55fe
                # | Wallets legitimately add instructions, and byte-equality against your
                # | rebuild is the wrong invariant; what was actually signed is the thing to
                # | check, and an allowlist stays narrow by design.
                feedback: "Carteiras adicionam instruções legitimamente, e igualdade de bytes contra a sua reconstrução é o invariante errado; o que foi de fato assinado é a coisa a checar, e uma allowlist se mantém estreita por design."  # @src=a6121e98e77f
              d:
                # | Wallets add guard instructions, so the verifier stops reading the
                # | instruction list at all and checks only the transfer amount, the mint,
                # | and the memo.
                label: "Carteiras adicionam instruções de guarda, então o verificador para de ler a lista de instruções de vez e checa só o valor da transferência, o mint e o memo."  # @src=f1db682d7903
                # | Property-based verification is not the same as looking away. The
                # | verifier walks the instructions that were actually signed, checks the
                # | transfer, the memo and the fee-payer isolation, and tolerates additions
                # | from one allowlisted guard program while rejecting every other one. An
                # | allowlist of one is still an allowlist.
                feedback: "Verificação por propriedades não é a mesma coisa que olhar para o outro lado. O verificador percorre as instruções que foram de fato assinadas, checa a transferência, o memo e o isolamento do fee payer, e tolera adições de um único programa de guarda na allowlist enquanto rejeita todos os outros. Uma allowlist de um só ainda é uma allowlist."  # @src=9af0a9f00a12
              a:
                # | The agent is malicious: it appended its own instructions to the quote
                # | you issued, so treat any deviation from your server-side rebuild as
                # | tampering and reject the payment.
                label: "O agente é malicioso: ele acrescentou instruções próprias à cotação que você emitiu, então trate qualquer desvio da sua reconstrução no servidor como adulteração e rejeite o pagamento."  # @src=1481b552df2e
                # | The mismatch is caused by the wallet, not the agent. Rejecting all of
                # | them blocks legitimate Phantom/Solflare users, which is why the verifier
                # | allowlists the guard program instead of banning it.
                feedback: "A divergência é causada pela carteira, não pelo agente. Rejeitar todas bloqueia usuários legítimos de Phantom/Solflare, que é por que o verificador põe o programa de guarda na allowlist em vez de banir ele."  # @src=e40da552c870
              c:
                # | The blockhash expired mid-flight, so the wallet rebuilt the transaction
                # | on a fresh one; widen the settlement-cache eviction window past the
                # | package's quoted 60-to-90-second lifetime range.
                label: "O blockhash expirou no meio do voo, então a carteira reconstruiu a transação em cima de um novo; alargue a janela de despejo do cache de liquidação para além da faixa de tempo de vida de 60 a 90 segundos que o pacote cita."  # @src=335171f06626
                # | Blockhash expiry makes a transaction fail to land; it does not add
                # | instructions to an otherwise-valid payment. The settlement cache is a
                # | replay guard, not a verification path. The cause here is wallet-injected
                # | guard instructions.
                feedback: "A expiração do blockhash faz uma transação não aterrissar; ela não adiciona instruções a um pagamento que de resto é válido. O cache de liquidação é uma guarda contra replay, não um caminho de verificação. A causa aqui são instruções de guarda injetadas pela carteira."  # @src=e87ef2fd2953
          q6-memo-reconcile:
            # | Your paying agent settles three API calls, and all three land in the
            # | backoffice ledger under one order, so the fulfillment queue shows a single
            # | sale. The invoice string you stamped into every challenge was the same one.
            # | What repairs this?
            prompt: "O seu agente pagador liquida três chamadas de API, e as três caem no livro-razão do back office sob um único pedido, então a fila de fulfillment mostra uma venda só. A string de fatura que você carimbou em todo desafio era a mesma. O que conserta isso?"  # @src=d86d92c124df
            # | x402's extra.memo invoice id is the same reconciliation idea as a Solana Pay
            # | reference key: it must be unique per call so each payment maps to its own
            # | order in the shared backoffice ledger. Reusing one memo collapses distinct
            # | sales; the fix is a unique memo (within the 256-byte limit) per call.
            explanation: "O id de fatura em extra.memo do x402 é a mesma ideia de conciliação que uma reference key do Solana Pay: ele tem que ser único por chamada para cada pagamento mapear para o pedido dele no livro-razão compartilhado do back office. Reusar um memo desaba vendas distintas; a correção é um memo único (dentro do limite de 256 bytes) por chamada."  # @src=086957bb0e10
            options:                 # source order — keep it
              d:
                # | Mint a fresh random invoice id on the server for each 402 challenge, so
                # | uniqueness does not depend on the caller.
                label: "Cunhar um id de fatura aleatório novo no servidor para cada desafio 402, para a unicidade não depender de quem chama."  # @src=473cbb8f1a21
                # | Unique, and unusable. The challenge and the paid retry are two requests,
                # | and on the retry the middleware rebuilds the terms and compares them; a
                # | server-minted random id differs the second time, the comparison misses,
                # | and the agent loops on 402s forever. The one thing both requests share
                # | byte for byte is the URL, which is why the caller mints the id and
                # | carries it there.
                feedback: "Único, e inutilizável. O desafio e o retry pago são duas requisições, e no retry o middleware reconstrói os termos e compara eles; um id aleatório cunhado no servidor sai diferente na segunda vez, a comparação erra, e o agente fica em loop em 402s para sempre. A única coisa que as duas requisições compartilham byte a byte é a URL, que é por que quem chama cunha o id e carrega ele ali."  # @src=175506037bab
              b:
                # | Give each call a unique extra.memo invoice id (at most 256 bytes) so
                # | each payment reconciles to its own order in the same ledger.
                label: "Dar a cada chamada um id de fatura único em extra.memo (no máximo 256 bytes) para cada pagamento se conciliar com o pedido dele no mesmo livro-razão."  # @src=f034ed82199a
                # | A reconciliation key must be one-to-one with orders, since reuse
                # | collapses rows; unique is not private, though, and the memo is
                # | world-readable.
                feedback: "Uma chave de conciliação tem que ser um-para-um com os pedidos, já que reusar desaba linhas; único não é privado, porém, e o memo é legível pelo mundo inteiro."  # @src=48f12468f6c8
              a:
                # | Stop using memos for machine payments; reconcile x402 sales only by
                # | wallet address instead.
                label: "Parar de usar memos em pagamentos entre máquinas; conciliar vendas x402 só pelo endereço de carteira."  # @src=cf13aab99d42
                # | Wallet address is not an invoice id; two calls from the same agent share
                # | it. The memo IS the reconciliation key, exactly as Solana Pay reference
                # | keys are; it just has to be unique per call.
                feedback: "Endereço de carteira não é um id de fatura; duas chamadas do mesmo agente compartilham ele. O memo É a chave de conciliação, exatamente como as reference keys do Solana Pay são; ele só tem que ser único por chamada."  # @src=2c5cf4794442
              c:
                # | Widen the settlement-cache window so all three settlements are treated
                # | as one payment and dedup down to a single order id in the ledger.
                label: "Alargar a janela do cache de liquidação para as três liquidações serem tratadas como um pagamento só e deduplicadas para um único id de pedido no livro-razão."  # @src=a37b0e753fee
                # | The settlement-cache is a replay guard against duplicate SETTLEMENT of
                # | one payment, not a reconciliation key. Collapsing three distinct sales
                # | into one is the bug, not the fix.
                feedback: "O cache de liquidação é uma guarda contra replay da LIQUIDAÇÃO duplicada de um pagamento, não uma chave de conciliação. Desabar três vendas distintas numa só é o bug, não a correção."  # @src=773760e81316
      check-guard:                      # quiz
        questions:
          q7-spendcontrols:
            # | You ship the paying agent with its client defaults untouched and point it at
            # | Wavelength's rush quote, which costs $1.50 in USDC. The agent silently pays
            # | nothing and your fulfillment queue stays empty. Why?
            prompt: "Você sobe o agente pagador com os padrões de cliente dele intocados e aponta ele para a cotação expressa da Wavelength, que custa US$ 1.50 em USDC. O agente silenciosamente não paga nada e a sua fila de fulfillment fica vazia. Por quê?"  # @src=078d288487e3
            # | The @x402/core client spendControls default to recognized pegged assets with
            # | a $1 USD cap per payment unless overridden. A $1.50 call exceeds that cap,
            # | so the pre-flight guard declines it before signing, which reads as a silent
            # | no-op unless you log the reason. Raise the cap deliberately or price the
            # | call under it.
            explanation: "Os spendControls do cliente @x402/core têm como padrão ativos atrelados ao dólar reconhecidos com teto de US$ 1 por pagamento, a menos que sejam sobrescritos. Uma chamada de US$ 1.50 excede esse teto, então a guarda pre-flight recusa ela antes de assinar, o que se lê como um no-op silencioso a menos que você logue o motivo. Levante o teto de propósito ou precifique a chamada abaixo dele."  # @src=00d8516e5ef0
            options:                 # source order — keep it
              d:
                # | The agent's wallet holds no SOL for the network fee, so signing fails
                # | and the loop gives up quietly before it ever builds the payment header.
                label: "A carteira do agente não segura SOL para a taxa de rede, então assinar falha e o loop desiste quietinho antes mesmo de construir o header de pagamento."  # @src=8d6f1af16aa4
                # | This agent is designed never to hold SOL: the facilitator named in
                # | extra.feePayer sponsors the fee, which is why the wallet carries devnet
                # | USDC and nothing else. A gasless buyer is the whole economic point of
                # | exact-SVM, so a missing SOL balance is not what stopped this call.
                feedback: "Este agente foi projetado para nunca segurar SOL: o facilitador nomeado em extra.feePayer patrocina a taxa, que é por que a carteira carrega USDC de devnet e mais nada. Um comprador sem gas é o ponto econômico inteiro do exact-SVM, então um saldo de SOL faltando não é o que parou esta chamada."  # @src=cb85e7ad52ae
              a:
                # | The default spendControls cap is $1 per payment, so the agent declines a
                # | $1.50 call; raise the cap or price the call lower.
                label: "O teto padrão dos spendControls é de US$ 1 por pagamento, então o agente recusa uma chamada de US$ 1.50; levante o teto ou precifique a chamada mais baixo."  # @src=d0f5d0ae207b
                # | A client-side pre-flight guard refuses before signing; nothing reaches
                # | the network and your server sees no error, and lifting the cap removes
                # | the protection an unlogged decline hid.
                feedback: "Uma guarda pre-flight do lado do cliente recusa antes de assinar; nada chega à rede e o seu servidor não vê erro nenhum, e levantar o teto remove a proteção que uma recusa não logada escondeu."  # @src=32c07717229d
              c:
                # | USDC is not a recognized pegged asset by default, so the agent refuses
                # | regardless of amount.
                label: "USDC não é um ativo atrelado ao dólar reconhecido por padrão, então o agente recusa independentemente do valor."  # @src=3790c4ef35ca
                # | USDC is a recognized pegged asset; that is not the blocker. The blocker
                # | is the $1 per-payment cap the default spendControls enforce.
                feedback: "USDC é um ativo atrelado ao dólar reconhecido; não é isso que trava. O que trava é o teto de US$ 1 por pagamento que os spendControls padrão impõem."  # @src=c215747ab608
              b:
                # | The x402.org devnet facilitator refuses to settle any payment above $1,
                # | so it rejects the call and the agent never receives a settlement
                # | receipt.
                label: "O facilitador de devnet x402.org se recusa a liquidar qualquer pagamento acima de US$ 1, então ele rejeita a chamada e o agente nunca recebe um recibo de liquidação."  # @src=2c2d72c07d1d
                # | The cap lives on the CLIENT (the agent's spendControls), not the
                # | facilitator. The facilitator would happily settle a $1.50 call; the
                # | agent declines it before signing.
                feedback: "O teto mora no CLIENTE (nos spendControls do agente), não no facilitador. O facilitador liquidaria uma chamada de US$ 1.50 numa boa; o agente recusa ela antes de assinar."  # @src=0d1b8c05acab
          q8-facilitator-env:
            # | Your x402 labs pass against the x402.org facilitator on devnet. A teammate
            # | wants to point the same config at it for the mainnet launch. What is the
            # | right call?
            prompt: "Os seus labs de x402 passam contra o facilitador x402.org na devnet. Uma pessoa do time quer apontar a mesma config para ele no lançamento em mainnet. Qual é a decisão certa?"  # @src=7e5ea781df7f
            # | The x402.org facilitator is devnet/testnet only, a deliberate reference
            # | deployment. A mainnet launch must swap the facilitator URL to a production
            # | one (Corbits, Dexter, PayAI, Solvador, or Coinbase CDP), which is a config
            # | change plus the trust and KYT considerations that come with picking a
            # | facilitator.
            explanation: "O facilitador x402.org é só de devnet/testnet, um deployment de referência deliberado. Um lançamento em mainnet tem que trocar a URL do facilitador por uma de produção (Corbits, Dexter, PayAI, Solvador ou CDP da Coinbase), o que é uma mudança de config mais as considerações de confiança e KYT que vêm junto com escolher um facilitador."  # @src=33dd61aaa452
            options:                 # source order — keep it
              b:
                # | Ship it, but swap the CAIP-2 network id to mainnet and add the
                # | Lighthouse allowlist first; those two are the only things that change
                # | when you leave devnet.
                label: "Pode subir, mas troque antes o id de network CAIP-2 para mainnet e adicione a allowlist do Lighthouse; essas duas são as únicas coisas que mudam quando você sai da devnet."  # @src=3936a0f26ffc
                # | Swapping the network id is real work, but the allowlist already ships
                # | inside the SVM verifier. Neither change matters here, because the
                # | x402.org facilitator does not serve mainnet at all.
                feedback: "Trocar o id de network é trabalho de verdade, mas a allowlist já vem embarcada dentro do verificador SVM. Nenhuma das duas mudanças importa aqui, porque o facilitador x402.org não serve mainnet de jeito nenhum."  # @src=51fac2dedcd9
              d:
                # | No; on mainnet the resource server signs and submits for itself, so you
                # | drop the facilitator URL and keep the rest of the config as it is.
                label: "Não; na mainnet o resource server assina e submete por conta própria, então você tira a URL do facilitador e mantém o resto da config como está."  # @src=0570d119325f
                # | Right verdict on the URL, wrong replacement. Your merchant server never
                # | touches the chain and never holds a fee-payer key: it learns the sponsor
                # | address from a facilitator at boot, which is what initialize() is for.
                # | Removing the facilitator removes the account that pays the fee.
                feedback: "Veredito certo sobre a URL, substituição errada. O seu servidor de lojista nunca toca na blockchain e nunca segura uma chave de fee payer: ele aprende o endereço de patrocinador com um facilitador no boot, que é para isso que initialize() serve. Remover o facilitador remove a conta que paga a taxa."  # @src=f3ef8107bc87
              a:
                # | Ship it; the x402.org facilitator is the reference facilitator and works
                # | identically on mainnet.
                label: "Pode subir; o facilitador x402.org é o facilitador de referência e funciona igualzinho na mainnet."  # @src=9f74fee74965
                # | The x402.org facilitator is explicitly devnet/testnet only. Pointing
                # | production at it will not settle real payments.
                feedback: "O facilitador x402.org é explicitamente só de devnet/testnet. Apontar produção para ele não vai liquidar pagamentos de verdade."  # @src=7aaad1117064
              c:
                # | No; that facilitator is devnet/testnet only, so mainnet needs a
                # | production one such as Corbits, PayAI, or CDP.
                label: "Não; aquele facilitador é só de devnet/testnet, então a mainnet precisa de um de produção como Corbits, PayAI ou CDP."  # @src=9f2bfeacff8d
                # | A reference deployment is scoped to the networks it serves, which makes
                # | the URL part of the network binding. Swapping it is the easy half, with
                # | trust, KYT, and fee terms riding along.
                feedback: "Um deployment de referência tem escopo nas redes que ele serve, o que torna a URL parte do vínculo com a rede. Trocar ela é a metade fácil, com confiança, KYT e termos de taxa pegando carona."  # @src=d331977b09c0
  m07-l3:
    # | MPP, AP2, ACP: the standards war (and gating the API with pay)
    title: "MPP, AP2, ACP: a guerra dos padrões (e pondo o gate na API com o pay)"  # @src=d0130bdf6800
    blocks:
      check-standards:                      # quiz
        questions:
          q9-mor:
            # | A merchant asks which agentic-payment standard keeps them as
            # | merchant-of-record, the same role they hold with a card processor today.
            # | Which answer is accurate?
            prompt: "Um lojista pergunta qual padrão de pagamento agêntico mantém ele como merchant-of-record, o mesmo papel que ele tem hoje com uma processadora de cartão. Qual resposta está correta?"  # @src=ff9f1000a11b
            # | ACP, the Stripe-and-OpenAI Agentic Commerce Protocol, is built around the
            # | merchant staying merchant-of-record with a Shared Payment Token. That
            # | framing, familiar from card rails, is a real differentiator when you place
            # | the four standards, and it is exactly the lens the course uses at every
            # | payment seam.
            explanation: "O ACP, o Agentic Commerce Protocol da dupla Stripe-e-OpenAI, é construído em torno de o lojista continuar sendo merchant-of-record com um Shared Payment Token. Essa leitura, familiar dos trilhos de cartão, é um diferencial de verdade quando você posiciona os quatro padrões, e é exatamente a lente que o curso usa em cada costura de pagamento."  # @src=7b9d5ea43055
            options:                 # source order — keep it
              d:
                # | x402, since the facilitator that settles each call takes the
                # | merchant-of-record seat.
                label: "x402, já que o facilitador que liquida cada chamada ocupa a cadeira de merchant-of-record."  # @src=ca44bf135d13
                # | A facilitator is a settlement intermediary, not a seller. Under x402 you
                # | are selling directly to the agent and the facilitator's power is over
                # | whether a transaction gets submitted, which is a censorship surface
                # | rather than a change of counterparty. Confusing the two is the same blur
                # | the fiat seam map refused.
                feedback: "Um facilitador é um intermediário de liquidação, não um vendedor. Sob x402 você está vendendo diretamente para o agente e o poder do facilitador é sobre se uma transação é submetida ou não, o que é uma superfície de censura e não uma troca de contraparte. Confundir os dois é o mesmo borrão que o mapa de costuras do fiat recusou."  # @src=270c99499e95
              a:
                # | MPP, because a Solana-native draft always leaves the merchant as
                # | merchant-of-record by design.
                label: "MPP, porque um draft nativo da Solana sempre deixa o lojista como merchant-of-record por design."  # @src=9faab2ef7827
                # | MPP is a payment-authentication draft; 'merchant-of-record' is not its
                # | framing, and being Solana-native says nothing about who bears that role.
                # | The standard that explicitly keeps the merchant as merchant-of-record is
                # | ACP.
                feedback: "O MPP é um draft de autenticação de pagamento; 'merchant-of-record' não é a leitura dele, e ser nativo da Solana não diz nada sobre quem carrega esse papel. O padrão que explicitamente mantém o lojista como merchant-of-record é o ACP."  # @src=3b9278646672
              b:
                # | AP2, because Google and the FIDO Alliance take on merchant-of-record for
                # | every AP2 payment.
                label: "AP2, porque o Google e a FIDO Alliance assumem merchant-of-record em todo pagamento AP2."  # @src=4ee0a8e47d6e
                # | AP2 is cards-first with verifiable credentials and mandates; it does not
                # | make Google the merchant-of-record. ACP is the one that explicitly
                # | leaves the merchant as merchant-of-record.
                feedback: "O AP2 é centrado em cartão, com credenciais verificáveis e mandatos; ele não faz do Google o merchant-of-record. O ACP é o que explicitamente deixa o lojista como merchant-of-record."  # @src=f51bf94a14d8
              c:
                # | ACP (Stripe and OpenAI), which is explicitly designed so the merchant
                # | stays merchant-of-record.
                label: "ACP (Stripe e OpenAI), que é explicitamente projetado para que o lojista continue sendo merchant-of-record."  # @src=08e38fe47cc1
                # | Its shared-token design keeps the charge on the merchant's own
                # | processor: that role is a liability as much as a status, since disputes
                # | and tax come with it.
                feedback: "O design de token compartilhado dele mantém a cobrança na processadora do próprio lojista: esse papel é tanto um passivo quanto um status, já que disputas e impostos vêm junto."  # @src=9b5b1f75e860
          q10-mpp-dated:
            # | You want to document Wavelength's MPP support. What is the honest way to
            # | state the standard's status, given draft-solana-charge-00?
            prompt: "Você quer documentar o suporte a MPP da Wavelength. Qual é a forma honesta de declarar o status do padrão, dado o draft-solana-charge-00?"  # @src=88cc7aac5b05
            # | MPP is two layers. draft-httpauth-payment-00, the 'Payment' HTTP
            # | authentication scheme from Tempo Labs and Stripe, is the document with an
            # | IETF registration and a genuine expiry. draft-solana-charge-00 is a
            # | payment-method spec registered under it, authored at the Solana Foundation,
            # | sitting in specs/methods/ beside tempo/charge and stripe/charge, and never
            # | submitted to the datatracker at all. Honest documentation names both layers
            # | and dates the Solana half from its commit log, never from the expiry its
            # | rendered page prints.
            explanation: "O MPP são duas camadas. O draft-httpauth-payment-00, o esquema de autenticação HTTP 'Payment' da Tempo Labs e da Stripe, é o documento com registro na IETF e uma expiração de verdade. O draft-solana-charge-00 é uma spec de método de pagamento registrada sob ele, escrita na Solana Foundation, que fica em specs/methods/ ao lado de tempo/charge e stripe/charge, e nunca foi submetida ao datatracker. Documentação honesta nomeia as duas camadas e data a metade Solana pelo log de commits dela, nunca pela expiração que a página renderizada dela imprime."  # @src=6d84a6c03ffa
            options:                 # source order — keep it
              a:
                # | Two documents, two standings: draft-solana-charge-00 is a method spec
                # | registered under draft-httpauth-payment-00, the IETF draft expiring
                # | 2026-12-21.
                label: "Dois documentos, dois pesos: o draft-solana-charge-00 é uma spec de método registrada sob o draft-httpauth-payment-00, o draft da IETF que expira em 2026-12-21."  # @src=834f9db012d6
                # | The registration and the real expiry belong to the base scheme; the
                # | method spec only defines solana/charge underneath it, and documenting
                # | one layer's status as the other's promises stability neither offers.
                feedback: "O registro e a expiração real pertencem ao esquema base; a spec de método só define solana/charge debaixo dele, e documentar o status de uma camada como se fosse o da outra promete uma estabilidade que nenhuma das duas oferece."  # @src=9bc8dc7a107e
              d:
                # | Two documents, with the datatracker registration on
                # | draft-solana-charge-00, and the base scheme dated from its commit
                # | history.
                label: "Dois documentos, com o registro no datatracker no draft-solana-charge-00, e o esquema base datado pelo histórico de commits dele."  # @src=49fb5f58f951
                # | The layers are the right frame and they are the wrong way up. Searching
                # | the datatracker for draft-solana- returns zero documents: the base
                # | scheme is the one on the IETF's clock, and the Solana method spec is the
                # | one you date from its git history.
                feedback: "As camadas são a leitura certa e estão de cabeça para baixo. Buscar draft-solana- no datatracker devolve zero documentos: o esquema base é o que está no relógio da IETF, e a spec de método da Solana é a que você data pelo histórico do git dela."  # @src=e8b13fa6d3e6
              b:
                # | One dated Internet-Draft snapshot, quoting the publication and expiry
                # | dates printed at the top of draft-solana-charge-00's rendered spec page.
                label: "Um snapshot datado de Internet-Draft, citando as datas de publicação e de expiração impressas no topo da página de spec renderizada do draft-solana-charge-00."  # @src=9656c5fcb84a
                # | Those dates are generated by the spec site's build rather than
                # | registered anywhere, and they move on every rebuild; the datatracker
                # | returns zero documents for draft-solana-, and commits are what you
                # | quote.
                feedback: "Essas datas são geradas pelo build do site da spec e não registradas em lugar nenhum, e elas mudam a cada rebuild; o datatracker devolve zero documentos para draft-solana-, e commits são o que você cita."  # @src=78ae15b44799
              c:
                # | A ratified Solana Foundation standard, since the Foundation wrote it and
                # | ships client tooling against it, so apps and docs can depend on it
                # | long-term.
                label: "Um padrão ratificado da Solana Foundation, já que a Foundation escreveu ele e entrega ferramental de client contra ele, então apps e docs podem depender dele no longo prazo."  # @src=cbc0b0cdcc3f
                # | Nothing here is ratified; the base scheme is an Internet-Draft with an
                # | expiry and the method spec has no standards-body status at all.
                # | Foundation authorship says who maintains one method.
                feedback: "Nada aqui é ratificado; o esquema base é um Internet-Draft com uma expiração e a spec de método não tem status nenhum em corpo de padronização. Autoria da Foundation diz quem mantém um método."  # @src=f97f873acb7e
          q11-pay-gate:
            # | You ran `pay gate api paywall.yml` on the pressing-price API, then `pay
            # | curl` completed a paid call. What did gating with the CLI actually buy you
            # | versus hand-writing an x402 middleware and an MPP handler yourself?
            prompt: "Você rodou `pay gate api paywall.yml` na API de preço de prensagem, e aí o `pay curl` completou uma chamada paga. O que pôr o gate com a CLI de fato te comprou em vez de escrever na mão um middleware x402 e um handler MPP você mesmo?"  # @src=b935ae7770ba
            # | `pay gate api paywall.yml` lets one API answer both x402 and MPP, and `pay
            # | curl` auto-negotiates the 402 on whichever protocol the caller speaks. That
            # | is the hands-on payoff: instead of betting on a single standard in a
            # | fast-moving field, you gate once and let the CLI negotiate, accepting a
            # | churn-prone CLI dependency as the cost.
            explanation: "O `pay gate api paywall.yml` deixa uma API só atender x402 e MPP, e o `pay curl` negocia sozinho o 402 em qualquer protocolo que o chamador fale. Esse é o retorno prático: em vez de apostar num único padrão num campo que se move rápido, você põe o gate uma vez e deixa a CLI negociar, aceitando como custo uma dependência de CLI propensa a mudar."  # @src=600a85a18ccb
            options:                 # source order — keep it
              d:
                # | One gate answers both protocols, and its pooled accounting writes each
                # | settled call into the backoffice ledger under its own invoice id.
                label: "Um gate atende os dois protocolos, e a contabilidade pooled dele escreve cada chamada liquidada no livro-razão do back office sob o próprio id de fatura."  # @src=ed4b6ed62388
                # | The first half is what you bought; the second half is the seam the
                # | lesson leaves open on purpose. There is no memo field in paywall.yml and
                # | the gate's pooled accounting hands back no per-call id, so gate-routed
                # | sales appear on the explorer and in your transcript, never in
                # | orders.jsonl. Middleware-routed sales still reconcile, because you wired
                # | that hook yourself.
                feedback: "A primeira metade é o que você comprou; a segunda metade é a costura que a lição deixa aberta de propósito. Não existe campo de memo no paywall.yml e a contabilidade pooled do gate não devolve nenhum id por chamada, então as vendas roteadas pelo gate aparecem no explorer e na sua transcrição, nunca no orders.jsonl. As vendas roteadas pelo middleware ainda se conciliam, porque você ligou esse hook você mesmo."  # @src=9d3cc11cd96a
              b:
                # | One gate makes the same API answer both x402 and MPP, and `pay curl`
                # | negotiates whichever the caller speaks.
                label: "Um gate faz a mesma API atender x402 e MPP, e o `pay curl` negocia qualquer um que o chamador fale."  # @src=d3c4f142b85e
                # | Emitting both challenges moves the protocol choice to the caller, which
                # | is the optionality you buy; the price is a churn-prone CLI sitting in
                # | the request path.
                feedback: "Emitir os dois desafios move a escolha de protocolo para o chamador, que é a opcionalidade que você compra; o preço é uma CLI propensa a mudar sentada no caminho da requisição."  # @src=68f1ff8375c0
              a:
                # | Nothing structural; `pay gate` only emits the x402 402 challenge, so an
                # | MPP caller still needs the WWW-Authenticate: Payment handler you write
                # | yourself.
                label: "Nada estrutural; o `pay gate` só emite o desafio 402 do x402, então um chamador MPP ainda precisa do handler WWW-Authenticate: Payment que você escreve você mesmo."  # @src=75e42552f664
                # | One gate makes the SAME API answer both, WWW-Authenticate: Payment
                # | challenge included. If it only served x402, gating would not be worth
                # | the CLI dependency.
                feedback: "Um gate faz a MESMA API atender os dois, desafio WWW-Authenticate: Payment incluído. Se ele só servisse x402, pôr o gate não valeria a dependência da CLI."  # @src=9a6a9ae4beb9
              c:
                # | It moves settlement fully on-chain, so neither the x402 facilitator nor
                # | MPP's co-signing server sits in the payment path any more.
                label: "Ele move a liquidação inteiramente para on-chain, então nem o facilitador do x402 nem o servidor que co-assina do MPP ficam mais no caminho do pagamento."  # @src=a156a744d1a3
                # | Gating does not remove the facilitator/co-signer role; x402 still
                # | settles through a facilitator and MPP's pull mode still has the server
                # | co-sign. What gating buys is one API serving both protocols, not the
                # | elimination of that role.
                feedback: "Pôr o gate não remove o papel de facilitador/co-signatário; o x402 continua liquidando através de um facilitador e o pull mode do MPP continua fazendo o servidor co-assinar. O que pôr o gate compra é uma API servindo os dois protocolos, não a eliminação desse papel."  # @src=d78fe0d42409
          q12-bet:
            # | An integrator asks for your honest 2026 recommendation on which single
            # | agentic-payment standard to build on exclusively. What is the defensible
            # | answer this lesson lands on?
            prompt: "Um integrador pede a sua recomendação honesta de 2026 sobre em qual único padrão de pagamento agêntico construir exclusivamente. Qual é a resposta defensável em que esta lição aterrissa?"  # @src=e0d160e7ad58
            # | The lesson's honest 2026 position is that the standards war is unsettled:
            # | x402 has traffic but a facilitator trust boundary, MPP is a Solana method
            # | spec riding a base draft that expires, and AP2/ACP are cards-first with
            # | different merchant-of-record models. Gating once and negotiating (the `pay
            # | gate` beat) beats an exclusive early bet, at the cost of a CLI dependency.
            explanation: "A posição honesta de 2026 da lição é que a guerra dos padrões não está resolvida: o x402 tem tráfego mas uma fronteira de confiança no facilitador, o MPP é uma spec de método da Solana montada num draft base que expira, e AP2/ACP são centrados em cartão com modelos diferentes de merchant-of-record. Pôr o gate uma vez e negociar (a parte do `pay gate`) ganha de uma aposta exclusiva precoce, ao custo de uma dependência de CLI."  # @src=3d3476f7c326
            options:                 # source order — keep it
              a:
                # | Commit fully to AP2 now; Google plus FIDO backing, and a mandate model
                # | that already covers agent authorization, makes it the safe single bet.
                label: "Comprometa-se totalmente com o AP2 agora; o respaldo do Google mais FIDO, e um modelo de mandatos que já cobre autorização de agentes, fazem dele a aposta única segura."  # @src=fb9047fb9076
                # | No standard is guaranteed to win, and AP2 is cards-first, a poor fit for
                # | Solana-native metered APIs. Picking one exclusively is the premature bet
                # | the lesson argues against.
                feedback: "Nenhum padrão tem vitória garantida, e o AP2 é centrado em cartão, um encaixe ruim para APIs nativas da Solana medidas por chamada. Escolher um exclusivamente é a aposta prematura contra a qual a lição argumenta."  # @src=9fe2ef2204eb
              d:
                # | Do not bet yet and do not gate either: wait until one standard wins,
                # | then integrate that one.
                label: "Não aposte ainda e não ponha gate também: espere até um padrão vencer, e aí integre esse."  # @src=561e87ccee46
                # | This is the 1949 record buyer's move, and it is the one the story
                # | singles out as the loser: the buyers who waited out the speed war bought
                # | nothing while the turntable makers who shipped multi-speed players sold
                # | through it. Waiting is not neutral here, it is declining every agent
                # | that knocks in the meantime.
                feedback: "Essa é a jogada do comprador de discos de 1949, e é a que a história aponta como perdedora: os compradores que esperaram a guerra das velocidades passar não compraram nada enquanto os fabricantes de toca-discos que entregaram aparelhos de várias velocidades venderam através dela. Esperar não é neutro aqui, é recusar todo agente que bate à porta nesse meio-tempo."  # @src=fcc9d45a86b7
              b:
                # | Commit fully to MPP now; the Solana Foundation authored the draft, and
                # | pull-mode fee sponsorship already covers the Solana-native case end to
                # | end.
                label: "Comprometa-se totalmente com o MPP agora; a Solana Foundation escreveu o draft, e o patrocínio de taxa do pull mode já cobre o caso nativo da Solana de ponta a ponta."  # @src=2544d945c329
                # | Fee sponsorship is not unique to MPP, since x402's facilitator plays the
                # | same role; and the Foundation authored only the method spec, while the
                # | base scheme it plugs into is a Tempo Labs and Stripe draft.
                feedback: "O patrocínio de taxa não é exclusivo do MPP, já que o facilitador do x402 faz o mesmo papel; e a Foundation escreveu só a spec de método, enquanto o esquema base em que ela se encaixa é um draft da Tempo Labs e da Stripe."  # @src=83c918ce0dfc
              c:
                # | Do not bet exclusively yet; gate once (with the pay CLI, say) and
                # | negotiate, since the field is unsettled.
                label: "Não aposte exclusivamente ainda; ponha o gate uma vez (com a CLI pay, digamos) e negocie, já que o campo não está resolvido."  # @src=93b607fcd5ef
                # | When adoption is undecided, the cheap move is the reversible one;
                # | deferring isn't free, though, since you now carry two protocols'
                # | semantics.
                feedback: "Quando a adoção está indefinida, a jogada barata é a reversível; adiar não é de graça, porém, já que agora você carrega a semântica de dois protocolos."  # @src=ce9b19178dbc
  m08-l1:
    # | Gasless with Kora: nobody brings SOL to a record fair
    title: "Gasless com Kora: ninguém leva SOL para uma feira de discos"  # @src=52b7d165124a
    blocks:
      check:                      # quiz
        questions:
          m08-l1-q1:
            # | You sponsored buyers' first purchases with Kora so they needed no SOL. A
            # | week later your sponsor wallet's SOL is lower than your fee math predicted.
            # | What most likely happened?
            prompt: "Você patrocinou as primeiras compras dos compradores com Kora para eles não precisarem de SOL. Uma semana depois o SOL da sua carteira de patrocínio está mais baixo do que a sua conta de taxa previa. O que mais provavelmente aconteceu?"  # @src=692cf859cc33
            # | Sponsored ATA rent is reclaimable: when Kora funds a new token account for a
            # | buyer, that deposit is real spend, and the buyer can later close the account
            # | and keep the reclaimed rent. Size it from a live
            # | getMinimumBalanceForRentExemption(165) read rather than a remembered
            # | constant, since SIMD-0437 keeps stepping the rate down, and budget
            # | sponsorship as a cost, never as a recoverable loan.
            explanation: "O rent de ATA patrocinado é reavível: quando o Kora custeia uma conta de token nova para um comprador, aquele depósito é gasto de verdade, e o comprador pode depois fechar a conta e ficar com o rent reavido. Dimensione ele por uma leitura ao vivo de getMinimumBalanceForRentExemption(165) em vez de uma constante lembrada de cabeça, já que o SIMD-0437 continua descendo a alíquota em degraus, e orce o patrocínio como custo, nunca como um empréstimo recuperável."  # @src=242b1df5c61e
            options:                 # source order — keep it
              a:
                # | Kora attached a priority fee to every sponsored transaction on top of
                # | the 5000-lamport base, and congestion multiplied that surcharge.
                label: "O Kora anexou uma taxa de prioridade a toda transação patrocinada em cima da base de 5000 lamports, e o congestionamento multiplicou essa sobretaxa."  # @src=c1523b2d99cd
                # | Priority fees are optional and small; they cannot explain a rent-sized
                # | shortfall.
                feedback: "Taxas de prioridade são opcionais e pequenas; elas não explicam um rombo do tamanho de um rent."  # @src=9d39cfdde0b1
              d:
                # | You paid ATA-creation rent, but it is a deposit: those lamports come
                # | back to the sponsor when buyers close the accounts.
                label: "Você pagou o rent de criação de ATA, mas é um depósito: aqueles lamports voltam para o patrocinador quando os compradores fecham as contas."  # @src=37ccf6db7e15
                # | Rent is refundable to whoever closes the account, and that is its owner,
                # | the buyer. No mechanism routes it back to the wallet that funded it,
                # | which is why the lesson insists you book sponsored rent as spend rather
                # | than as a loan you expect to be repaid.
                feedback: "O rent é reembolsável para quem fecha a conta, e esse alguém é o dono dela, o comprador. Nenhum mecanismo devolve ele para a carteira que custeou, que é por que a lição insiste que você lance o rent patrocinado como gasto em vez de como um empréstimo que você espera receber de volta."  # @src=c10fa6ba0ad6
              c:
                # | The base fee rose above 5000 lamports during the sale because the
                # | network was congested.
                label: "A taxa base subiu acima de 5000 lamports durante a venda porque a rede estava congestionada."  # @src=0ab67f696f6a
                # | The 5000-lamport base fee is fixed; congestion changes optional priority
                # | fees, not the base fee.
                feedback: "A taxa base de 5000 lamports é fixa; o congestionamento muda as taxas de prioridade opcionais, não a taxa base."  # @src=747932df5606
              b:
                # | You paid the 165-byte ATA-creation rent for buyers who later closed
                # | those accounts and kept the reclaim.
                label: "Você pagou o rent de criação de ATA de 165 bytes para compradores que depois fecharam aquelas contas e ficaram com o que foi reavido."  # @src=2782a2458132
                # | A rent deposit returns to whoever closes the account, not whoever funded
                # | it; that makes sponsorship an acquisition cost rather than a recoverable
                # | loan.
                feedback: "Um depósito de rent volta para quem fecha a conta, não para quem custeou; isso faz do patrocínio um custo de aquisição em vez de um empréstimo recuperável."  # @src=8733318ec36f
          m08-l1-q2:
            # | A teammate suggests using Octane instead of Kora for fee sponsorship. What's
            # | the accurate state of things as of your build?
            prompt: "Um colega de time sugere usar Octane em vez de Kora para patrocínio de taxa. Qual é o estado exato das coisas na data do seu build?"  # @src=d47fee43019e
            # | Octane's archival (2026-04-20, README pointing at Kora) is the signal that
            # | the paymaster torch passed. Kora's Runtime Verification audit is what makes
            # | it safe to place in the fee-payer seat.
            explanation: "O arquivamento do Octane (2026-04-20, README apontando para o Kora) é o sinal de que a tocha do paymaster foi passada. A auditoria da Runtime Verification no Kora é o que torna seguro colocar ele no assento de fee payer."  # @src=547e55231c2a
            options:                 # source order — keep it
              c:
                # | Octane was archived 2026-04-20 and points to Kora, which carries a
                # | Runtime Verification audit.
                label: "O Octane foi arquivado em 2026-04-20 e aponta para o Kora, que carrega uma auditoria da Runtime Verification."  # @src=746512d7e41c
                # | An archived repo pointing at a successor is the maintainers' own
                # | handoff, which beats guessing from commit dates. An audit covers one
                # | commit, though, and yours may not be that one.
                feedback: "Um repo arquivado apontando para um sucessor é a passagem de bastão dos próprios mantenedores, o que vale mais do que adivinhar por datas de commit. Só que uma auditoria cobre um commit, e o seu pode não ser aquele."  # @src=be7d8f73e9a5
              d:
                # | Octane is archived and Kora succeeded it, and the Runtime Verification
                # | audit covers your config too.
                label: "O Octane está arquivado e o Kora sucedeu ele, e a auditoria da Runtime Verification cobre a sua config também."  # @src=124c20e74251
                # | The handoff half is right. The audit covers Kora's code, and nothing
                # | audits your kora.toml but you: the allowlists, the caps and the
                # | fee-payer policy are yours, which is why an omitted policy block
                # | defaulting to deny is a security decision rather than a formality.
                feedback: "A metade da passagem de bastão está certa. A auditoria cobre o código do Kora, e ninguém audita o seu kora.toml além de você: as allowlists, os tetos e a política de fee payer são seus, que é por que um bloco de política omitido assumindo negar é uma decisão de segurança e não uma formalidade."  # @src=d58bfe022897
              b:
                # | Octane and Kora are both maintained; use Octane for SPL-token fees and
                # | Kora for SOL sponsorship.
                label: "O Octane e o Kora são os dois mantidos; use Octane para taxas em tokens SPL e Kora para patrocínio em SOL."  # @src=3aaf0a03de4b
                # | Octane is archived, not maintained, and Kora covers SPL-token fee
                # | payment itself.
                feedback: "O Octane está arquivado, não mantido, e o Kora cobre o pagamento de taxa em tokens SPL ele mesmo."  # @src=886df73ebe48
              a:
                # | Octane is the current paymaster; Kora is an experimental fork that has
                # | not been audited yet.
                label: "O Octane é o paymaster atual; o Kora é um fork experimental que ainda não foi auditado."  # @src=80fd0f1961b9
                # | Reversed: Octane is archived, and Kora is the audited successor.
                feedback: "Invertido: o Octane está arquivado, e o Kora é o sucessor auditado."  # @src=22c211db53bf
          m08-l1-q3:
            # | You copy the official facilitator-on-Kora guide and its imports read `x402`
            # | / `x402-express`, but your project uses `@x402/svm`. What's happening and
            # | what do you do?
            prompt: "Você copia o guia oficial de facilitador em cima do Kora e os imports dele dizem `x402` / `x402-express`, mas o seu projeto usa `@x402/svm`. O que está acontecendo e o que você faz?"  # @src=435c958dfae1
            # | This is the documented v1/v2 naming drift: solana.com's facilitator guide
            # | still uses the bare x402 packages while the ecosystem moved to scoped
            # | @x402/* v2. Teach and build v2; recognize the guide's names as lag, not a
            # | constraint.
            explanation: "Esta é a deriva de nomes v1/v2 documentada: o guia de facilitador do solana.com ainda usa os pacotes x402 pelados enquanto o ecossistema migrou para o @x402/* v2 com escopo. Ensine e construa v2; reconheça os nomes do guia como atraso, não como restrição."  # @src=a58b9e6e2df3
            options:                 # source order — keep it
              d:
                # | Both lines are live: bare x402 on the facilitator side, scoped @x402/*
                # | on the client.
                label: "As duas linhas estão vivas: x402 pelado do lado do facilitador, @x402/* com escopo no client."  # @src=adbb162e1920
                # | Splitting the difference keeps you on the stale half. The scoped @x402/*
                # | v2 line is the live SDK on both sides of the exchange, and it is the one
                # | you already built the paywall and the paying agent against; the bare
                # | names in the guide are lag, not a division of labor.
                feedback: "Rachar a diferença te deixa na metade velha. A linha v2 com escopo @x402/* é o SDK vivo dos dois lados da troca, e é contra ela que você já construiu o paywall e o agente pagador; os nomes pelados do guia são atraso, não divisão de trabalho."  # @src=dcc20ce52f12
              c:
                # | Kora only works with the v1 packages, so you must downgrade to keep
                # | sponsorship working.
                label: "O Kora só funciona com os pacotes v1, então você precisa fazer downgrade para manter o patrocínio funcionando."  # @src=7e441fe439d5
                # | Kora is a package-agnostic paymaster; the drift is naming, not a Kora
                # | requirement.
                feedback: "O Kora é um paymaster agnóstico de pacote; a deriva é de nomes, não uma exigência do Kora."  # @src=aff1afc1adf5
              a:
                # | The guide lags on v1 package names; the live SDK is the scoped @x402/*
                # | v2 line, so build v2.
                label: "O guia está atrasado nos nomes de pacote v1; o SDK vivo é a linha v2 com escopo @x402/*, então construa v2."  # @src=6187f4a0cc0c
                # | Docs and registries ship on separate clocks; npm is the fresher truth,
                # | and the drift usually runs deeper than package names, so the package's
                # | own docs outrank the guide's.
                feedback: "Documentação e registries saem em relógios separados; o npm é a verdade mais fresca, e a deriva costuma ir mais fundo do que os nomes de pacote, então a documentação do próprio pacote vale mais que a do guia."  # @src=5ac5a958cac7
              b:
                # | The guide is canonical and the scoped @x402/* packages are an unofficial
                # | fork, so switch your imports back to x402 and x402-express.
                label: "O guia é canônico e os pacotes @x402/* com escopo são um fork não oficial, então volte os seus imports para x402 e x402-express."  # @src=9d552c7c86b0
                # | The scoped @x402/* line is the current SDK; the guide's bare names are
                # | the lagging ones.
                feedback: "A linha @x402/* com escopo é o SDK atual; os nomes pelados do guia é que estão atrasados."  # @src=ac76868f643d
          m08-l1-q4:
            # | A buyer asks Kora to sponsor an arbitrary transaction they assembled
            # | themselves. What is the right posture for your paymaster?
            prompt: "Um comprador pede ao Kora para patrocinar uma transação arbitrária que ele mesmo montou. Qual é a postura certa para o seu paymaster?"  # @src=4d822ab25fea
            # | A paymaster with no validation is an open drain. Kora's allowlists and
            # | validation rules are the whole safety story: restrict sponsorship to the
            # | exact instructions and programs your checkout emits.
            explanation: "Um paymaster sem validação é um ralo aberto. As allowlists e as regras de validação do Kora são a história de segurança inteira: restrinja o patrocínio às instruções e aos programas exatos que o seu checkout emite."  # @src=5e9299f91296
            options:                 # source order — keep it
              c:
                # | Move the sponsor key into the browser bundle so the buyer's wallet
                # | co-signs locally and there is no paymaster left in the path to trust.
                label: "Mova a chave de patrocínio para o bundle do browser para que a carteira do comprador co-assine local e não sobre paymaster nenhum no caminho para confiar."  # @src=a5432014d6cb
                # | Exposing the sponsor key client-side is strictly worse; validation, not
                # | key exposure, is the control.
                feedback: "Expor a chave de patrocínio no lado do client é estritamente pior; o controle é a validação, não a exposição da chave."  # @src=1b12cda4ef6b
              d:
                # | Allowlist the programs your checkout calls and stop there, since a
                # | program allowlist already bounds which instructions get sponsored.
                label: "Ponha na allowlist os programas que o seu checkout chama e pare por aí, já que uma allowlist de programas já limita quais instruções são patrocinadas."  # @src=3eeeab574b80
                # | A program allowlist is the outer wall, not the whole building. One
                # | allowed program carries many instructions, which is why the config also
                # | caps signatures and lamports and why fee_payer_policy exists: it is what
                # | stops a transaction whose inner instruction moves lamports out of the
                # | sponsor account signing it.
                feedback: "Uma allowlist de programas é o muro externo, não o prédio inteiro. Um programa permitido carrega muitas instruções, que é por que a config também limita signatures e lamports e por que o fee_payer_policy existe: é ele que barra uma transação cuja instrução interna move lamports para fora da conta de patrocínio que está assinando ela."  # @src=b3363228335f
              a:
                # | Sponsor it: the paymaster only pays fees, so the worst case is a single
                # | wasted base fee.
                label: "Patrocine: o paymaster só paga taxas, então o pior caso é uma única taxa base desperdiçada."  # @src=10ece0f1ade8
                # | An unvalidated transaction can drain the sponsor via rent and abusive
                # | instructions; fees are not the only exposure.
                feedback: "Uma transação não validada pode drenar o patrocinador via rent e instruções abusivas; as taxas não são a única exposição."  # @src=a2078f6b9948
              b:
                # | Configure Kora's validation rules and allowlists so it only sponsors the
                # | instructions and programs your checkout actually uses.
                label: "Configure as regras de validação e as allowlists do Kora para que ele só patrocine as instruções e os programas que o seu checkout de fato usa."  # @src=446ffd31bb2a
                # | A fee payer signs and a signature is authorization, which leaves an
                # | allowlist as the only thing bounding what you fund; program-level
                # | scoping stays coarse, since one program carries many instructions.
                feedback: "Um fee payer assina e uma signature é autorização, o que deixa uma allowlist como a única coisa limitando o que você banca; o escopo por programa continua grosso, já que um programa carrega muitas instruções."  # @src=dcf8bd0aed74
  m08-l2:
    # | Deferred payments: durable nonces at the fair (and the outage that scarred them)
    title: "Pagamentos diferidos: durable nonces na feira (e a queda que deixou cicatrizes neles)"  # @src=f00eb03e4953
    blocks:
      nonce-queue-drain:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Branch on item.kind before doing any age math.
          0: "Ramifique por item.kind antes de fazer qualquer matemática de idade."  # @src=1002b923127a
          # | Whether a nonce tx belongs in the unsafe bucket depends only on nonceAdvanced,
          # | never on how old it is; that decision must never touch nowSeconds or
          # | windowSeconds.
          1: "Se uma tx de nonce pertence ao bucket unsafe depende só de nonceAdvanced, nunca de quão velha ela é; essa decisão nunca pode tocar em nowSeconds nem em windowSeconds."  # @src=1909dc87af3a
          # | At the boundary, an item exactly windowSeconds old is still submittable; only
          # | strictly older than that expires.
          2: "Na fronteira, um item com exatamente windowSeconds de idade ainda é enviável; só o estritamente mais velho que isso expira."  # @src=8ad586beb19f
        tests:                      # keyed by test case id
          t1:
            # | A fresh blockhash tx submits; a durable-nonce tx submits even though it is
            # | old.
            description: "Uma tx de blockhash fresca entra em submit; uma tx de durable nonce entra em submit mesmo sendo velha."  # @src=c02dd6050aae
          t2:
            # | A stale blockhash tx (past the ~45s window) is expired, not submitted.
            description: "Uma tx de blockhash velha (passada a janela de ~45s) fica expired, não é enviada."  # @src=face71a4f4ce
          t3:
            # | A spent (already advanced) nonce tx is unsafe and must not be resubmitted.
            description: "Uma tx de nonce gasto (já avançado) é unsafe e não pode ser reenviada."  # @src=2eb5535f6fa4
          t4:
            # | Durable-nonce txs never expire by wall clock: all unspent nonces submit even
            # | when very old.
            description: "Txs de durable nonce nunca expiram por relógio: todos os nonces não gastos entram em submit mesmo bem velhos."  # @src=c50defee5557
          t5:
            # | Mixed queue, input order preserved across all three buckets.
            description: "Fila mista, ordem de entrada preservada nos três buckets."  # @src=3dd1f78425ee
          t6:
            # | The window boundary: at exactly windowSeconds the blockhash is still inside
            # | its 150-block life and submits; one second past it expires.
            description: "A fronteira da janela: em exatamente windowSeconds o blockhash ainda está dentro da vida de 150 blocos dele e entra em submit; um segundo além disso ele expira."  # @src=4e534f35daa7
      check:                      # quiz
        questions:
          m08-l2-q1:
            # | A sale signed at your stall is submitted 4 minutes after signing and the RPC
            # | rejects it as an expired blockhash. At ~300ms slots, roughly how long was
            # | your submit window, and what takes the deadline away?
            prompt: "Uma venda assinada na sua barraca é enviada 4 minutos depois de assinada e o RPC rejeita ela como blockhash expirado. Em slots de ~300ms, mais ou menos quanto durava a sua janela de submit, e o que tira o prazo do caminho?"  # @src=cd970114bb8e
            # | A blockhash is valid for 150 blocks; at the current 300ms target slot time
            # | that is roughly 45 seconds, and each staged cut shrinks it further, so
            # | derive the window, never memorize it. No amount of retrying extends it. A
            # | durable nonce swaps the blockhash for a stored value that only moves when
            # | you advance it, so the transaction has no wall-clock deadline.
            explanation: "Um blockhash vale por 150 blocos; no tempo de slot alvo atual de 300ms isso dá uns 45 segundos, e cada corte em etapas encolhe ele mais, então derive a janela, nunca decore ela. Nenhuma quantidade de retry estende ela. Um durable nonce troca o blockhash por um valor guardado que só se mexe quando você avança ele, então a transação não tem prazo de relógio."  # @src=5939be5b57ed
            options:                 # source order — keep it
              d:
                # | About 45 seconds, and a durable nonce stretches the deadline to a few
                # | hours.
                label: "Uns 45 segundos, e um durable nonce estica o prazo para algumas horas."  # @src=216cca031fc4
                # | The arithmetic is right and the fix is stronger than a longer lease. A
                # | nonce transaction has no wall-clock deadline at all: the docs put it as
                # | no restrictions on how old the nonce is, and the bytes stay submittable
                # | until someone advances that nonce. Which is also why the queue file is a
                # | drawer of bearer paper rather than a log.
                feedback: "A aritmética está certa e a correção é mais forte que um prazo maior. Uma transação de nonce não tem prazo de relógio nenhum: a documentação põe isso como não existe restrição nenhuma sobre quão velho o nonce é, e os bytes continuam enviáveis até alguém avançar aquele nonce. O que também é por que o arquivo de fila é uma gaveta de papel ao portador e não um log."  # @src=4d35528addc0
              c:
                # | About 45 seconds (150 blocks at 300ms); a durable nonce removes the
                # | wall-clock deadline.
                label: "Uns 45 segundos (150 blocos a 300ms); um durable nonce remove o prazo de relógio."  # @src=1869917aefd1
                # | The window is counted in blocks, and its wall-clock length follows the
                # | current slot time; every staged cut shortens the same 150 blocks, which
                # | is why the number is derived, not memorised.
                feedback: "A janela é contada em blocos, e o comprimento de relógio dela segue o tempo de slot atual; cada corte em etapas encurta os mesmos 150 blocos, que é por que o número é derivado, não decorado."  # @src=28e96bfb1c5b
              a:
                # | About 5 minutes, since the 150-block window runs on 400ms slots plus
                # | confirmation lag, so the RPC must be misconfigured.
                label: "Uns 5 minutos, já que a janela de 150 blocos roda em slots de 400ms mais o atraso de confirmação, então o RPC deve estar mal configurado."  # @src=9583f039811f
                # | At 300ms slots the 150-block window is far under 5 minutes; the
                # | rejection is expected, not an RPC bug.
                feedback: "Em slots de 300ms a janela de 150 blocos fica muito abaixo de 5 minutos; a rejeição é esperada, não um bug de RPC."  # @src=a9eda2cefe6e
              b:
                # | About 2 minutes; widen it by raising maxRetries so the client keeps
                # | rebroadcasting.
                label: "Uns 2 minutos; alargue ela aumentando maxRetries para o client continuar retransmitindo."  # @src=b86d1fe0e466
                # | Retries do not extend a blockhash's validity; the hash is simply too old
                # | to accept.
                feedback: "Retries não estendem a validade de um blockhash; o hash simplesmente é velho demais para ser aceito."  # @src=fb3411a540e5
          m08-l2-q2:
            # | You're assembling a durable-nonce transaction for an offline sale. Which
            # | condition is required for it to be valid?
            prompt: "Você está montando uma transação de durable nonce para uma venda offline. Qual condição é obrigatória para ela ser válida?"  # @src=a77e5910420e
            # | Durable-nonce transactions are only valid when AdvanceNonceAccount is
            # | instruction 0; that ordering is what consumes and rolls the stored nonce.
            # | The nonce account itself is System-owned and rent-exempt.
            explanation: "Transações de durable nonce só são válidas quando AdvanceNonceAccount é a instrução 0; essa ordenação é o que consome e rola o nonce guardado. A conta de nonce em si é de propriedade do System e isenta de aluguel."  # @src=23519a0f98b7
            options:                 # source order — keep it
              b:
                # | The nonce account must be program-owned and non-rent-exempt to keep it
                # | cheap.
                label: "A conta de nonce precisa ser de propriedade de programa e não isenta de aluguel, para sair barata."  # @src=94d63d9bf098
                # | A nonce account is System-owned and MUST be rent-exempt; both parts of
                # | this are wrong.
                feedback: "Uma conta de nonce é de propriedade do System e PRECISA ser isenta de aluguel; as duas partes disto estão erradas."  # @src=b10ef10cbf90
              a:
                # | AdvanceNonceAccount must be the first instruction (instruction 0) in the
                # | transaction.
                label: "AdvanceNonceAccount precisa ser a primeira instrução (instrução 0) da transação."  # @src=81977af3a12d
                # | The runtime reads position zero to decide whether a nonce is the
                # | lifetime, which makes ordering the signal; necessary, not sufficient,
                # | since the account must also be System-owned and rent-exempt.
                feedback: "O runtime lê a posição zero para decidir se um nonce é o lifetime, o que faz da ordenação o sinal; necessário, não suficiente, já que a conta também precisa ser de propriedade do System e isenta de aluguel."  # @src=0c2d262498d5
              c:
                # | The transfer must come before the advance so the payment settles first.
                label: "A transferência precisa vir antes do advance para o pagamento liquidar primeiro."  # @src=2a73456218c6
                # | The advance has to be instruction 0; putting the transfer first makes
                # | the durable-nonce transaction invalid.
                feedback: "O advance tem que ser a instrução 0; pôr a transferência primeiro torna a transação de durable nonce inválida."  # @src=e3be4d929697
              d:
                # | The nonce account's own keypair must co-sign each sale it backs.
                label: "O keypair da própria conta de nonce precisa co-assinar cada venda que ela sustenta."  # @src=2285e9aa4a69
                # | That keypair signs once, at creation, and is never needed again. Control
                # | of the account lives with the authority named at initialization, which
                # | is why the pool's throwaway keypairs can be discarded while the merchant
                # | key keeps advancing every slot in it.
                feedback: "Esse keypair assina uma vez, na criação, e nunca mais é necessário. O controle da conta mora com a autoridade nomeada na inicialização, que é por que os keypairs descartáveis do pool podem ser jogados fora enquanto a chave do lojista continua avançando cada slot dele."  # @src=2be1983dd900
          m08-l2-q3:
            # | Your notes on the fair queue need to say something about this primitive's
            # | two scars. What is the accurate pair to record?
            prompt: "As suas anotações sobre a fila da feira precisam dizer alguma coisa sobre as duas cicatrizes desta primitiva. Qual é o par correto a registrar?"  # @src=d617a9f73bc3
            # | Both caveats are mandatory canon: the official docs' own may-be-deprecated
            # | warning and the 2022-06-01 double-processing halt. You use durable nonces
            # | anyway, but you build the queue knowing both risks.
            explanation: "As duas ressalvas são cânone obrigatório: o aviso de pode-ser-depreciado da própria documentação oficial e a parada por processamento duplo de 2022-06-01. Você usa durable nonces mesmo assim, mas constrói a fila sabendo dos dois riscos."  # @src=4c6970635e8e
            options:                 # source order — keep it
              a:
                # | They're historical trivia; durable nonces are now formally guaranteed
                # | stable, so the caveats are obsolete.
                label: "São curiosidade histórica; durable nonces agora têm estabilidade formalmente garantida, então as ressalvas estão obsoletas."  # @src=9a473af0cfc2
                # | The may-be-deprecated warning is still live, and the 2022 halt is why
                # | the primitive is treated carefully to this day. The runtime bug itself
                # | was fixed, but nothing about that fix made the deprecation risk or the
                # | re-signing double-charge go away.
                feedback: "O aviso de pode-ser-depreciado continua vivo, e a parada de 2022 é por que a primitiva é tratada com cuidado até hoje. O bug de runtime em si foi consertado, mas nada nessa correção fez o risco de depreciação nem a cobrança dupla do re-assinar sumirem."  # @src=23d9be1c9fe3
              d:
                # | The docs caveat is live, and the 2022 double-processing path still is
                # | too, so rebroadcasting spent bytes can charge a buyer twice.
                label: "A ressalva da documentação está viva, e o caminho de processamento duplo de 2022 também ainda está, então retransmitir bytes gastos pode cobrar de um comprador duas vezes."  # @src=48d5879cd194
                # | Half a scar. The deprecation caveat is live; the double-processing path
                # | is not, because the 2022 repair separated the two validation domains and
                # | a conforming validator now rejects bytes whose nonce has advanced.
                # | Rebroadcasting them wastes a send and smudges the ledger. The
                # | double-charge still on the table is yours: re-signing the same sale
                # | against a fresh nonce.
                feedback: "Meia cicatriz. A ressalva de depreciação está viva; o caminho de processamento duplo não está, porque o reparo de 2022 separou os dois domínios de validação e um validador em conformidade agora rejeita bytes cujo nonce avançou. Retransmitir eles desperdiça um envio e borra o livro-razão. A cobrança dupla que continua na mesa é a sua: re-assinar a mesma venda contra um nonce novo."  # @src=1e8b1a794917
              c:
                # | The outage proved the primitive is unsafe under load, so the queue
                # | should hold each sale unsigned and build a fresh-blockhash transaction
                # | once connectivity returns.
                label: "A queda provou que a primitiva é insegura sob carga, então a fila deveria segurar cada venda sem assinar e montar uma transação com blockhash novo quando a conectividade voltar."  # @src=ac56ec788655
                # | That defers the buyer's signature until after they have walked away;
                # | offline signing is the whole point, and careful nonce handling is the
                # | fix rather than abandoning the primitive.
                feedback: "Isso adia a signature do comprador para depois de ele ter ido embora; assinar offline é o ponto inteiro, e tratar nonce com cuidado é a correção, não abandonar a primitiva."  # @src=9716779aac63
              b:
                # | The docs' may-be-deprecated warning is live, and nonce double-processing
                # | caused a ~4.5-hour mainnet halt in 2022; both are risks you design
                # | around.
                label: "O aviso de pode-ser-depreciado da documentação está vivo, e o processamento duplo de nonce causou uma parada de mainnet de ~4.5 horas em 2022; os dois são riscos em torno dos quais você projeta."  # @src=e6aa29a6715e
                # | Two risks of different kinds: one on the roadmap, one operational;
                # | neither argues for avoiding the primitive, because offline signing has
                # | no substitute.
                feedback: "Dois riscos de tipos diferentes: um no roadmap, um operacional; nenhum dos dois é argumento para evitar a primitiva, porque assinar offline não tem substituto."  # @src=7591cad53e2d
          m08-l2-q4:
            # | Your queue holds a durable-nonce sale whose nonce has ALREADY advanced (it
            # | was consumed by an earlier successful submit). What must the drain step do
            # | with it?
            prompt: "A sua fila segura uma venda de durable nonce cujo nonce JÁ avançou (ele foi consumido por um envio bem-sucedido anterior). O que o passo de drain precisa fazer com ela?"  # @src=3f008ce17489
            # | A spent nonce ends the transaction's life: once advanced, the stored value
            # | no longer matches and a conforming validator rejects the bytes outright.
            # | 'Never expires' is not 'always resubmittable'. The drain excludes it and
            # | reconciles instead — and the double-charge that is still possible on these
            # | rails is re-signing the same sale against a fresh nonce, the human decision
            # | your classifier's `unsafe` bucket exists to force into the open.
            explanation: "Um nonce gasto encerra a vida da transação: uma vez avançado, o valor guardado não bate mais e um validador em conformidade rejeita os bytes de cara. 'Nunca expira' não é 'sempre reenviável'. O drain exclui ela e concilia em vez disso — e a cobrança dupla que ainda é possível nestes trilhos é re-assinar a mesma venda contra um nonce novo, a decisão humana que o bucket `unsafe` do seu classificador existe para forçar para o aberto."  # @src=fc2d6fde13af
            options:                 # source order — keep it
              a:
                # | Resubmit it: durable nonces never expire, so it is always safe to
                # | broadcast them again.
                label: "Reenvie ela: durable nonces nunca expiram, então é sempre seguro transmitir eles de novo."  # @src=26080f2dab0c
                # | Once the nonce advanced, the stored value no longer matches and the
                # | runtime deterministically rejects those bytes; resubmitting cannot land,
                # | it just burns sends and muddies the ledger the drain depends on.
                feedback: "Uma vez que o nonce avançou, o valor guardado não bate mais e o runtime rejeita deterministicamente aqueles bytes; reenviar não consegue aterrissar, só queima envios e enlameia o livro-razão de que o drain depende."  # @src=c1893961a605
              b:
                # | Re-sign it against the same stored nonce and submit; the cluster dedupes
                # | on signature, so a duplicate is simply dropped.
                label: "Re-assine ela contra o mesmo nonce guardado e envie; o cluster deduplica por signature, então uma duplicata é simplesmente descartada."  # @src=e50941ce4670
                # | The nonce already advanced, so a re-signed transaction is a fresh
                # | authorization, not a dedupe.
                feedback: "O nonce já avançou, então uma transação re-assinada é uma autorização nova, não uma deduplicação."  # @src=efb96e1b7fb5
              c:
                # | Exclude it from submission: the nonce is spent, the runtime will refuse
                # | the bytes, and the sale needs reconciliation, not another broadcast.
                label: "Exclua ela do envio: o nonce está gasto, o runtime vai recusar os bytes, e a venda precisa de conciliação, não de outra transmissão."  # @src=00792c4684ee
                # | Once the stored value has rolled, those bytes can never land again; what
                # | remains is bookkeeping. Dropping it is not resolving it, and that sale
                # | still needs a ledger state: landed earlier (RECONCILED) or lost (UNSAFE,
                # | a human decision).
                feedback: "Uma vez que o valor guardado rolou, aqueles bytes nunca mais conseguem aterrissar; o que sobra é escrituração. Descartar ela não é resolver ela, e aquela venda ainda precisa de um estado no livro-razão: aterrissou antes (RECONCILED) ou se perdeu (UNSAFE, uma decisão humana)."  # @src=a7618a2cb6a3
              d:
                # | Re-sign the sale against a fresh nonce and submit that, since the
                # | original bytes are dead anyway.
                label: "Re-assine a venda contra um nonce novo e envie isso, já que os bytes originais estão mortos de qualquer jeito."  # @src=1aa53e2c9393
                # | This is the live double-charge on these rails, and it is the one the
                # | runtime cannot stop for you. A nonce that advanced usually advanced
                # | because the sale landed, so re-signing bills the buyer a second time for
                # | one record. Check the signature first: confirmed means RECONCILED,
                # | absent means UNSAFE and a human decides.
                feedback: "Esta é a cobrança dupla viva nestes trilhos, e é a única que o runtime não consegue barrar por você. Um nonce que avançou em geral avançou porque a venda aterrissou, então re-assinar cobra do comprador uma segunda vez por um único registro. Cheque a signature primeiro: confirmada significa RECONCILED, ausente significa UNSAFE e um humano decide."  # @src=bf878440902c
  m08-l3:
    # | The production gate: a go-live checklist that means it
    title: "O gate de produção: um checklist de entrada no ar que fala sério"  # @src=b2bda5ab6dc0
    blocks:
      check:                      # quiz
        questions:
          m08-l3-q1:
            # | Your fair-queue drain runs at closing time, settling transactions buyers
            # | signed hours ago at the stall, one of them a bulk order big enough to
            # | matter. What does your commitment policy owe that drained sale?
            prompt: "O drain do seu fair-queue roda na hora de fechar, liquidando transações que compradores assinaram horas atrás na barraca, uma delas um pedido em volume grande o suficiente para importar. O que a sua política de commitment deve àquela venda que sai no drain?"  # @src=ab4b448b28a1
            # | Commitment binds to the moment you decide money arrived, not to how the
            # | checkout felt, so a deferred drain enforces the same value-scaled rule the
            # | live path does, and with the buyer long gone, a payment reversed there has
            # | nobody to re-charge. `processed` is never that gate, and the 500 USDC figure
            # | in the sample verdicts is one build's choice rather than a documented
            # | threshold.
            explanation: "O commitment se prende ao momento em que você decide que o dinheiro chegou, não a como o checkout pareceu, então um drain adiado impõe a mesma regra escalada ao valor que o caminho ao vivo impõe, e com o comprador longe faz tempo, um pagamento revertido ali não tem ninguém para cobrar de novo. `processed` nunca é esse gate, e o número de 500 USDC nos vereditos de amostra é a escolha de um build, não um limiar documentado."  # @src=1de901ce5661
            options:                 # source order — keep it
              b:
                # | `confirmed` covers the whole drain, because the buyer already authorized
                # | the payment when they signed it back at the fair.
                label: "`confirmed` cobre o drain inteiro, porque o comprador já autorizou o pagamento quando assinou lá na feira."  # @src=c76658750ed2
                # | Signing is authorization, not settlement. Commitment prices the chance
                # | that the block carrying the transfer gets dropped, and that chance does
                # | not shrink because the signature is hours old.
                feedback: "Assinar é autorização, não liquidação. O commitment precifica a chance de o bloco que carrega a transferência ser descartado, e essa chance não encolhe porque a signature tem horas de idade."  # @src=da420d14f27e
              c:
                # | `processed`, since the drain is a batch job and its own retry loop will
                # | pick up anything the network happens to drop.
                label: "`processed`, já que o drain é um job em lote e o loop de retry dele mesmo vai pegar qualquer coisa que a rede por acaso descarte."  # @src=bb745fdc8e85
                # | `processed` can vanish in a fork, so it is never the gate that releases
                # | goods; and a retry loop still has to pick some commitment before it can
                # | believe the answer it re-reads.
                feedback: "`processed` pode sumir num fork, então nunca é o gate que libera mercadoria; e um loop de retry ainda tem que escolher algum commitment antes de poder acreditar na resposta que relê."  # @src=76d1cb81c58a
              d:
                # | Escalate every drained sale to `finalized` regardless of size, since the
                # | documented 500 USDC line applies once settlement is deferred.
                label: "Escalar toda venda que sai no drain para `finalized` independente do tamanho, já que a linha documentada de 500 USDC vale assim que a liquidação é adiada."  # @src=0b058c3588d4
                # | No document names that figure. The 500 USDC in this lesson's sample
                # | verdicts is one reference build's choice, flagged as such. The line
                # | stays yours to derive, and it keys off what a reversal would cost you,
                # | not off whether the sale sat in a queue.
                feedback: "Documento nenhum nomeia esse número. Os 500 USDC nos vereditos de amostra desta lição são a escolha de um build de referência, sinalizada como tal. A linha continua sendo sua para derivar, e ela se apoia no que uma reversão te custaria, não em se a venda ficou parada numa fila."  # @src=7a923a749d8c
              a:
                # | The same escalation the live path gets: hold it to `finalized` before
                # | marking it fulfilled if it crosses your threshold, because no buyer is
                # | standing there to re-run.
                label: "A mesma escalada que o caminho ao vivo recebe: segurar ela no `finalized` antes de marcar como atendida se cruzar o seu limiar, porque não tem comprador nenhum ali para passar de novo."  # @src=acea3344eaf4
                # | A drain is a settlement path like any other, so the rule has to reach it
                # | too. Write the row so it forces you to grep every commitment argument in
                # | the codebase, not just the ones you remember writing.
                feedback: "Um drain é um caminho de liquidação como qualquer outro, então a regra tem que alcançar ele também. Escreva a linha de um jeito que te obrigue a dar grep em todo argumento de commitment no código, não só nos que você lembra de ter escrito."  # @src=798843b00c13
          m08-l3-q2:
            # | The gate asks how you set priority fees on the transactions your store
            # | sends. How deep should this lesson go?
            prompt: "O gate pergunta como você define taxas de prioridade nas transações que a sua loja manda. Quão fundo esta lição deve ir?"  # @src=74c67c6a6374
            # | This is a boundary the course keeps honest: a one-box priority-fee recipe
            # | lands payment transactions reliably, and the deep landing strategy belongs
            # | to Client-Side Mastery. The gate names the handoff rather than faking depth.
            explanation: "Esta é uma fronteira que o curso mantém honesta: uma receita de taxa de prioridade de uma caixa só faz as transações de pagamento entrarem com confiabilidade, e a estratégia profunda de landing pertence ao Client-Side Mastery. O gate nomeia o repasse em vez de fingir profundidade."  # @src=312f9396a93c
            options:                 # source order — keep it
              c:
                # | Skip priority fees: payments are small and low-value, so the base
                # | 5000-lamport fee is enough to land them even in a congested slot.
                label: "Pular as taxas de prioridade: pagamentos são pequenos e de baixo valor, então a taxa base de 5000 lamports basta para fazer eles entrarem mesmo num slot congestionado."  # @src=97eef991d3c3
                # | Under congestion a bare base-fee tx can be dropped; a practical
                # | priority-fee floor still matters.
                feedback: "Sob congestionamento uma tx só com taxa base pode ser descartada; um piso prático de taxa de prioridade continua importando."  # @src=74f9246d360b
              a:
                # | Build a full fee-estimation service that samples recent prioritization
                # | fees per writable account and retunes the micro-lamport bid every slot.
                label: "Construir um serviço completo de estimativa de taxa que amostra taxas de priorização recentes por conta gravável e reajusta o lance em micro-lamports a cada slot."  # @src=8593e4b3e309
                # | That's landing science this course hands off; the gate wants a practical
                # | recipe, not a tuning engine.
                feedback: "Isso é ciência de landing que este curso repassa; o gate quer uma receita prática, não um motor de ajuste fino."  # @src=e6c88e117711
              d:
                # | Ship the one-box recipe and then the landing depth too, retry curves and
                # | Jito bundles included, since payments is where landing belongs.
                label: "Entregar a receita de uma caixa só e depois a profundidade de landing também, curvas de retry e bundles da Jito inclusive, já que pagamentos é onde landing pertence."  # @src=4396530aa0af
                # | Landing is a discipline of its own: per-account fee estimation, retry
                # | curves, Jito bundles, compute-budget science, and Client-Side Mastery
                # | owns it end to end the way this course owns commerce. A quarter-taught
                # | version of it is the quarter that loses money, which is why the box
                # | overpays slightly and stops.
                feedback: "Landing é uma disciplina própria: estimativa de taxa por conta, curvas de retry, bundles da Jito, ciência de compute-budget, e o Client-Side Mastery é dono disso de ponta a ponta do jeito que este curso é dono de comércio. Uma versão disso ensinada só um quarto é o trimestre que perde dinheiro, que é por que a caixa paga um pouquinho a mais e para por aí."  # @src=963879180c4c
              b:
                # | State a one-box practical recipe for payment txs and hand
                # | transaction-landing depth to the Client-Side Mastery course.
                label: "Declarar uma receita prática de uma caixa só para txs de pagamento e passar a profundidade de landing de transação para o curso Client-Side Mastery."  # @src=6609ad413b7b
                # | A payment needs a fee floor that lands rather than an optimiser, and
                # | depth here is scope you could not maintain. Naming a handoff is not
                # | skipping it, and the box holds a default that works.
                feedback: "Um pagamento precisa de um piso de taxa que entre, não de um otimizador, e profundidade aqui é escopo que você não conseguiria manter. Nomear um repasse não é pular ele, e a caixa guarda um padrão que funciona."  # @src=48a11c711df4
          m08-l3-q3:
            # | Your webhook worker has been quietly failing for days and orders aren't
            # | being fulfilled. Which gate row is designed to catch this?
            prompt: "O seu worker de webhook vem falhando quietinho há dias e os pedidos não estão sendo atendidos. Qual linha do gate foi projetada para pegar isso?"  # @src=d5ae601f9572
            # | Silent webhook failure stops fulfillment without an obvious error, and a
            # | Helius webhook can auto-disable itself after sustained failure. The
            # | monitoring row exists precisely to alert on the failure rate before orders
            # | quietly stop.
            explanation: "Falha silenciosa de webhook para o fulfillment sem erro óbvio, e um webhook da Helius pode se desativar sozinho depois de falha sustentada. A linha de monitoramento existe exatamente para alertar na taxa de falha antes de os pedidos pararem quietos."  # @src=43c4310e1a0e
            options:                 # source order — keep it
              c:
                # | The webhook-failure-monitoring row: Helius auto-disables a webhook after
                # | sustained failure, so alert on failure rate.
                label: "A linha de monitoramento de falha de webhook: a Helius desativa um webhook automaticamente depois de falha sustentada, então alerte na taxa de falha."  # @src=58489baf3061
                # | The failure mode is silence; nothing on your side errors, and only a
                # | monitor watching the sender catches it before orders stop.
                feedback: "O modo de falha é o silêncio; nada do seu lado dá erro, e só um monitor olhando o remetente pega isso antes de os pedidos pararem."  # @src=dd5a3538bb15
              d:
                # | The reconciliation-export row, since its dated CSV is where a
                # | fulfillment gap gets caught before buyers notice.
                label: "A linha de exportação de conciliação, já que o CSV datado dela é onde um buraco de fulfillment é pego antes de os compradores notarem."  # @src=53176ed1b8c0
                # | The export is an accounting artifact you run on a cadence, so it finds
                # | the gap long after the buyer did; in the story that opens this family
                # | the first signal was a customer DM two days in. Catching it early takes
                # | something watching the sender, plus the polling fallback that degrades a
                # | dead webhook into slow fulfillment.
                feedback: "A exportação é um artefato contábil que você roda numa cadência, então ela acha o buraco muito depois do comprador; na história que abre esta família o primeiro sinal foi uma DM de cliente com dois dias de atraso. Pegar cedo exige algo olhando o remetente, mais o fallback de polling que degrada um webhook morto em fulfillment lento."  # @src=b4ad7c20b41d
              a:
                # | The commitment-policy row, because the worker releases orders only at
                # | `confirmed` and these payments never reached that level.
                label: "A linha de política de commitment, porque o worker libera pedidos só no `confirmed` e estes pagamentos nunca chegaram nesse nível."  # @src=f1f94a917999
                # | The transactions confirmed fine; the failure is in ingestion, not
                # | commitment.
                feedback: "As transações confirmaram numa boa; a falha é na ingestão, não no commitment."  # @src=37bac2834a2f
              b:
                # | The idempotency row, because duplicate events are piling up unprocessed
                # | on the queue.
                label: "A linha de idempotência, porque eventos duplicados estão se empilhando sem processar na fila."  # @src=37655e9d322e
                # | Idempotency guards against double-fulfillment, not silent non-delivery.
                feedback: "Idempotência protege contra atender em dobro, não contra não entregar em silêncio."  # @src=c74403d2d189
          m08-l3-q4:
            # | You go looking for a Solana-native merchant accounting/reporting SaaS to
            # | close the books and find nothing purpose-built. What's the honest gate
            # | posture?
            prompt: "Você vai procurar um SaaS nativo de Solana para contabilidade/relatórios de lojista para fechar os livros e não acha nada feito para isso. Qual é a postura honesta do gate?"  # @src=c9f576bef1b6
            # | Honest gaps are teaching content in a young market: with no purpose-built
            # | Solana merchant-accounting SaaS at build time, you state the gap with its
            # | date and lean on your own reference/memo reconciliation export until one
            # | exists.
            explanation: "Lacunas honestas são conteúdo de ensino num mercado jovem: sem SaaS de contabilidade de lojista feito para Solana na data do build, você declara a lacuna com a data dela e se apoia na sua própria exportação de conciliação por reference/memo até existir um."  # @src=7b60ee41e987
            options:                 # source order — keep it
              d:
                # | State it as a market gap and ship the export, but leave off the date,
                # | since gaps like this typically hold for years.
                label: "Declarar como lacuna de mercado e entregar a exportação, mas deixar a data de fora, já que lacunas assim normalmente duram anos."  # @src=e6bc44c7cfc5
                # | The date is the part that makes it a finding rather than an opinion
                # | about the world forever. Young markets move, and an undated gap is the
                # | claim that ages into next year's emergency; write down when you looked,
                # | and what you would replace the export with once somebody builds the
                # | thing.
                feedback: "A data é a parte que faz disso um achado em vez de uma opinião sobre o mundo para sempre. Mercados jovens se mexem, e uma lacuna sem data é a afirmação que envelhece virando a emergência do ano que vem; anote quando você olhou, e por o que você trocaria a exportação assim que alguém construir a coisa."  # @src=9ed7184e3fda
              b:
                # | Block go-live until a vendor exists, since you can't operate a store
                # | without accounting software.
                label: "Travar a entrada no ar até existir um fornecedor, já que você não consegue operar uma loja sem software de contabilidade."  # @src=90c892064683
                # | You already have reference/memo reconciliation; the missing SaaS is a
                # | note, not a blocker.
                feedback: "Você já tem conciliação por reference/memo; o SaaS que falta é uma nota, não um bloqueio."  # @src=f57efc6f96a3
              a:
                # | State it as an observed market gap as of your build date and ship your
                # | own reconciliation export as the interim answer.
                label: "Declarar como lacuna de mercado observada na data do seu build e entregar a sua própria exportação de conciliação como resposta provisória."  # @src=af07e28c75d1
                # | Dating an observation makes it falsifiable rather than a claim about the
                # | world forever, and the export keeps you unblocked; a format accountants
                # | read is what keeps it replaceable.
                feedback: "Datar uma observação faz dela algo falsificável em vez de uma afirmação sobre o mundo para sempre, e a exportação te mantém desbloqueado; um formato que contadores leem é o que a mantém substituível."  # @src=9d1acc58a89c
              c:
                # | Assume Stripe's dashboard covers it, since Stripe settles some of the
                # | crypto payments.
                label: "Supor que o dashboard da Stripe cobre isso, já que a Stripe liquida alguns dos pagamentos em cripto."  # @src=623179d0d544
                # | Stripe's dashboard covers its own rails, not your on-chain Solana Pay
                # | and x402 ledger.
                feedback: "O dashboard da Stripe cobre os trilhos dela, não o seu livro-razão on-chain de Solana Pay e x402."  # @src=ff1d105a005e
  m09-l1:
    # | Assembly: one store, every rail
    title: "Montagem: uma loja, todos os trilhos"  # @src=aebb9607be36
    blocks:
      check:                      # quiz
        questions:
          m09l1-q1-kit-pins:
            # | Assembling the stack, one workspace is held to the kit-6 line by its
            # | checkout dependency and another to the kit-7 line by its billing client. A
            # | teammate proposes collapsing both into one workspace on a single kit version
            # | to simplify the monorepo. What is the right call?
            prompt: "Montando a stack, um workspace é preso à linha kit-6 pela dependência de checkout dele e outro à linha kit-7 pelo client de cobrança dele. Um colega de time propõe colapsar os dois num workspace só numa versão de kit só para simplificar o monorepo. Qual é a decisão certa?"  # @src=979d41fb0499
            # | The kit v6/v7 fragmentation is real and load-bearing: @solana/pay peers the
            # | kit-6 line while @solana/subscriptions 0.5.0 peers kit ^7. The course
            # | monorepo keeps per-workspace pins precisely so each package gets a
            # | compatible kit. Collapsing the workspaces re-introduces the peer conflict
            # | you already resolved.
            explanation: "A fragmentação kit v6/v7 é real e estrutural: o @solana/pay tem peer na linha kit-6 enquanto o @solana/subscriptions 0.5.0 tem peer em kit ^7. O monorepo do curso mantém pins por workspace precisamente para que cada pacote ganhe um kit compatível. Colapsar os workspaces reintroduz o conflito de peer que você já resolveu."  # @src=4cb3073efd70
            options:                 # source order — keep it
              d:
                # | Keep both pins and register both workspaces; the workspace boundary is
                # | what holds the two kit majors apart.
                label: "Mantenha os dois pins e registre os dois workspaces; a fronteira do workspace é o que mantém os dois majors de kit separados."  # @src=48aef6cac4a7
                # | Registered workspaces are not isolation: npm hoists them into one shared
                # | root resolution, which is why registering subscriptions is what finally
                # | produces the ERESOLVE. What holds at runtime is that npm parks one major
                # | under subscriptions/node_modules and the crank's entry file lives there,
                # | so Node resolves its imports from inside the island. The address of the
                # | file does the work, not the boundary.
                feedback: "Workspaces registrados não são isolamento: o npm faz hoist deles para uma única resolução de raiz compartilhada, que é por que registrar subscriptions é o que finalmente produz o ERESOLVE. O que se sustenta em tempo de execução é que o npm estaciona um major sob subscriptions/node_modules e o arquivo de entrada do crank mora ali, então o Node resolve os imports dele de dentro da ilha. O endereço do arquivo faz o trabalho, não a fronteira."  # @src=7554da26950d
              b:
                # | Force everything onto the npm-latest kit, since the newest release is
                # | the safest choice for a fresh capstone build.
                label: "Force tudo para o kit npm-latest, já que o release mais novo é a escolha mais segura para um build de capstone fresco."  # @src=89dbcf107349
                # | @solana/pay peers the kit-6 line; jumping the wavelength-checkout
                # | workspace to the newest kit re-breaks its peer pair, and you pin exact
                # | per workspace, never to latest.
                feedback: "O @solana/pay tem peer na linha kit-6; pular o workspace wavelength-checkout para o kit mais novo quebra de novo o par de peer dele, e você fixa exato por workspace, nunca em latest."  # @src=615a6fb9903c
              c:
                # | Keep the two workspace pins; @solana/pay and @solana/subscriptions sit
                # | on different kit peer ranges, which is the seam m05-l2 taught.
                label: "Mantenha os dois pins de workspace; o @solana/pay e o @solana/subscriptions ficam em peer ranges de kit diferentes, que é a costura que o m05-l2 ensinou."  # @src=41841dda69e9
                # | Peer ranges are constraints the packages publish, and keeping both means
                # | keeping two resolutions, which registration alone will not give you,
                # | since npm hoists registered workspaces into one shared root tree. Two
                # | trees do cost you, since values crossing between them are not the same
                # | types.
                feedback: "Peer ranges são restrições que os pacotes publicam, e manter os dois quer dizer manter duas resoluções, que só o registro não vai te dar, já que o npm faz hoist de workspaces registrados para uma única árvore de raiz compartilhada. Duas árvores te custam algo, sim, já que valores que cruzam entre elas não são os mesmos tipos."  # @src=156db3f049db
              a:
                # | Force the whole repo onto the kit-6 line and add an npm override so the
                # | subscriptions client accepts it, since one lockfile is easier to reason
                # | about than two resolution trees.
                label: "Force o repositório inteiro para a linha kit-6 e adicione um override do npm para o client de subscriptions aceitar ela, já que um lockfile só é mais fácil de raciocinar sobre que duas árvores de resolução."  # @src=a9c0626de004
                # | @solana/subscriptions 0.5.0 peers kit ^7, so the kit-6 line breaks its
                # | peer range, and an override only silences the warning while the client
                # | runs on a kit it was never built against. That is the seam m05-l2
                # | already solved.
                feedback: "O @solana/subscriptions 0.5.0 tem peer em kit ^7, então a linha kit-6 quebra o peer range dele, e um override só silencia o aviso enquanto o client roda num kit contra o qual ele nunca foi construído. Essa é a costura que o m05-l2 já resolveu."  # @src=c83104c80fdb
          m09l1-q2-verify-leg:
            # | Your journey script runs the Kora-sponsored purchase leg for a SOL-less
            # | buyer. The buyer's wallet returns a success toast. How should the demo
            # | assert that this leg PASSED?
            prompt: "O seu script da jornada roda a perna de compra patrocinada pela Kora para um comprador sem SOL. A carteira do comprador devolve um toast de sucesso. Como a demo deve afirmar que essa perna PASSOU?"  # @src=f7ae5b21926e
            # | The m04 verifier is the whole course's acceptance harness for exactly this
            # | reason: frontend confirmations are spoofable. Every journey leg, sponsored
            # | or not, is asserted by re-fetching the transaction server-side and checking
            # | mint, token program, and balance deltas.
            explanation: "O verificador do m04 é a bancada de aceitação do curso inteiro exatamente por este motivo: confirmações de frontend são falsificáveis. Toda perna da jornada, patrocinada ou não, é afirmada buscando a transação de novo do lado do servidor e checando mint, programa de token e deltas de saldo."  # @src=ca859c3c6654
            options:                 # source order — keep it
              b:
                # | Trust the wallet's success callback, since the Kora fee-payer already
                # | co-signed and submitted the transaction on the buyer's behalf and the
                # | RPC accepted it before the toast ever rendered.
                label: "Confie no callback de sucesso da carteira, já que o fee payer da Kora já co-assinou e submeteu a transação em nome do comprador e o RPC aceitou ela antes de o toast sequer renderizar."  # @src=f2b432c87048
                # | Kora co-signing does not make a frontend confirmation trustworthy, and
                # | an accepted submission is not a verified transfer; the verifier still
                # | re-checks server-side. A success toast proves nothing about what
                # | actually landed on chain.
                feedback: "A Kora co-assinar não torna uma confirmação de frontend confiável, e uma submissão aceita não é uma transferência verificada; o verificador ainda recheca do lado do servidor. Um toast de sucesso não prova nada sobre o que de fato aterrissou na blockchain."  # @src=cc41e0d6b258
              a:
                # | Re-fetch the transaction server-side with getTransaction and check the
                # | mint, the token program, and the balance delta on the merchant-owned
                # | token account.
                label: "Busque a transação de novo do lado do servidor com getTransaction e cheque o mint, o programa de token e o delta de saldo na conta de token pertencente ao lojista."  # @src=46056b04923e
                # | Only a ledger read your own server performs is unforgeable; sponsorship
                # | changes nothing about proof, and every leg asserts the same way.
                feedback: "Só uma leitura de livro-razão que o seu próprio servidor faz é infalsificável; patrocínio não muda nada sobre prova, e toda perna afirma do mesmo jeito."  # @src=32eb8cdf9c1c
              d:
                # | Check the landed transaction for the two sponsored facts, the fee payer
                # | being the Kora signer and the buyer's lamport delta being zero, since a
                # | co-signed purchase proves itself that way.
                label: "Cheque na transação que aterrissou os dois fatos de patrocínio, o fee payer ser o signer da Kora e o delta de lamports do comprador ser zero, já que uma compra co-assinada se prova assim."  # @src=c16dcf35cfe1
                # | Those two reads are additions to the verifier verdict, not a replacement
                # | for it. They prove the sponsorship worked; they say nothing about which
                # | mint moved, which token program moved it, or whether the merchant-owned
                # | account was credited the record's price. A sponsored transaction earns
                # | the same treatment as a plain one.
                feedback: "Essas duas leituras são adições ao veredito do verificador, não um substituto dele. Elas provam que o patrocínio funcionou; não dizem nada sobre qual mint se moveu, qual programa de token moveu ele, ou se a conta pertencente ao lojista foi creditada com o preço do disco. Uma transação patrocinada merece o mesmo tratamento que uma comum."  # @src=7a67b864da4f
              c:
                # | Poll the buyer's wallet balance from the client until it drops by the
                # | record's price, then mark the leg complete in the ledger.
                label: "Faça polling do saldo da carteira do comprador a partir do client até ele cair pelo preço do disco, depois marque a perna como completa no livro-razão."  # @src=5c213e34d72e
                # | Client-side balance polling is spoofable and unreliable; the course-wide
                # | gate is the m04 server-side verifier, not any client-read shortcut.
                feedback: "Polling de saldo do lado do client é falsificável e não confiável; a trava do curso inteiro é o verificador do lado do servidor do m04, não algum atalho de leitura no client."  # @src=272060bc0d91
          m09l1-q3-dunning-leg:
            # | The subscription leg of your journey deliberately forces a renewal to fail
            # | against an empty ATA. For the leg to assert PASS the way the course taught
            # | dunning, what must the assembled stack do?
            prompt: "A perna de assinatura da sua jornada força deliberadamente uma renovação a falhar contra uma ATA vazia. Para a perna afirmar PASS do jeito que o curso ensinou dunning, o que a stack montada precisa fazer?"  # @src=3b51ab3074c8
            # | The dunning case study (Helius dogfooding the official Subscriptions
            # | program) is explicit: a failed renewal is not retried against the wallet, it
            # | becomes an ordinary open invoice. The journey's forced failure asserts PASS
            # | when the backoffice ledger shows exactly that.
            explanation: "O estudo de caso de dunning (a Helius fazendo dogfooding do programa oficial de Subscriptions) é explícito: uma renovação que falha não é repetida contra a carteira, ela vira uma fatura em aberto comum. A falha forçada da jornada afirma PASS quando o livro-razão do back office mostra exatamente isso."  # @src=a25e4dd6910e
            options:                 # source order — keep it
              a:
                # | Immediately retry the pull against the buyer's wallet up to three times
                # | and then cancel the subscription if all retries fail.
                label: "Repita o pull imediatamente contra a carteira do comprador até três vezes e depois cancele a assinatura se todas as tentativas falharem."  # @src=8daabd45b661
                # | That is card-rail dunning, not the taught policy. The Helius model does
                # | NOT retry the failed renewal against the wallet.
                feedback: "Isso é dunning de trilho de cartão, não a política ensinada. O modelo da Helius NÃO repete a renovação que falhou contra a carteira."  # @src=7d23e71f9ede
              c:
                # | Revoke the subscription authority PDA and reclaim its rent the moment
                # | the renewal fails, closing the account cleanly.
                label: "Revogue o PDA de autoridade da assinatura e recupere o rent dele no momento em que a renovação falha, fechando a conta de forma limpa."  # @src=5d0ca55d9d7f
                # | Rent recovery via RevokeAbandoned is the cancel path, not the failure
                # | path; a single failed renewal becomes an open invoice, it does not tear
                # | down the subscription.
                feedback: "Recuperação de rent via RevokeAbandoned é o caminho de cancelamento, não o de falha; uma única renovação que falha vira uma fatura em aberto, ela não desmonta a assinatura."  # @src=2d1f5e1f689a
              b:
                # | Record the failed renewal as an open invoice in the ledger, without
                # | retrying it against the wallet.
                label: "Registre a renovação que falhou como uma fatura em aberto no livro-razão, sem repetir ela contra a carteira."  # @src=46ad9af21a5e
                # | With no way to force a pull, a ledger entry is the only durable outcome
                # | that failure produces; a state with no exit, though, is how open
                # | invoices accumulate forever.
                feedback: "Sem jeito de forçar um pull, uma entrada no livro-razão é o único desfecho durável que essa falha produz; um estado sem saída, no entanto, é como faturas em aberto se acumulam para sempre."  # @src=e064c47f8e42
              d:
                # | Have the crank log the failed renewal and let the journey assert on that
                # | log line, since a failure produces no transaction to verify and no
                # | ledger row to read.
                label: "Faça o crank logar a renovação que falhou e deixe a jornada afirmar em cima dessa linha de log, já que uma falha não produz transação para verificar nem linha de livro-razão para ler."  # @src=436bc4bdaad6
                # | The first half of the reasoning is right: there is no transaction, which
                # | is exactly why this leg's assertion is a ledger read rather than a
                # | verifier call. The second half is not, because the failure's whole
                # | output is a row: an open invoice in the backoffice ledger, plus the
                # | absence of any retry against the wallet. A log line is not an outcome
                # | anyone can reconcile.
                feedback: "A primeira metade do raciocínio está certa: não existe transação, que é exatamente por que a afirmação desta perna é uma leitura de livro-razão em vez de uma chamada do verificador. A segunda metade não está, porque a saída inteira da falha é uma linha: uma fatura em aberto no livro-razão do back office, mais a ausência de qualquer nova tentativa contra a carteira. Uma linha de log não é um desfecho que alguém consiga conciliar."  # @src=30a3d9d67445
  m09-l2:
    # | Where the rails go from here
    title: "Para onde os trilhos vão daqui"  # @src=a6754945a639
    blocks:
      check:                      # quiz
        questions:
          m09l2-q1-frozen-moving:
            # | You are handing this stack to a colleague in three months. Which part of
            # | what you built is MOST likely to have changed its pins or behavior by then?
            prompt: "Você vai entregar esta stack para um colega daqui a três meses. Qual parte do que você construiu tem MAIS chance de ter mudado os pins ou o comportamento até lá?"  # @src=3fa9c04a36d4
            # | The course drew the frozen/moving line on purpose. Frozen surfaces (the
            # | Solana Pay v1 spec, the blinks tooling) are safe precisely because they are
            # | stable. The young pieces, the Subscriptions program client and the MPP
            # | specs, are the ones to re-verify before you trust their pins.
            explanation: "O curso riscou a linha congelado/em movimento de propósito. Superfícies congeladas (a spec v1 do Solana Pay, o ferramental de blinks) são seguras exatamente porque são estáveis. As peças novas, o client do programa Subscriptions e as specs do MPP, são as que você reverifica antes de confiar nos pins delas."  # @src=81eef4b25ad5
            options:                 # source order — keep it
              a:
                # | The Solana Pay v1 transfer-request URL format, whose spec page is
                # | visibly 2023-vintage and still names FTX and Slope in its wallet
                # | examples, so a rewrite must be overdue.
                label: "O formato de URL de transfer request do Solana Pay v1, cuja página de spec é visivelmente safra 2023 e ainda nomeia FTX e Slope nos exemplos de carteira, então uma reescrita tem que estar atrasada."  # @src=f6db12f4ba7b
                # | The v1 spec is frozen, and frozen means stable, not stale-and-changing;
                # | the URL format is one of the LEAST likely things to move.
                feedback: "A spec v1 está congelada, e congelado quer dizer estável, não velho-e-mudando; o formato de URL é uma das coisas com MENOS chance de se mexer."  # @src=60c8435933a4
              c:
                # | The Subscriptions program client and MPP, since @solana/subscriptions
                # | was days old on mainnet and MPP's Solana method spec moves in a git repo
                # | with no standards-body clock on it.
                label: "O client do programa Subscriptions e o MPP, já que o @solana/subscriptions tinha dias de vida na mainnet e a spec de método Solana do MPP se mexe em um repo git sem nenhum relógio de órgão de padronização em cima."  # @src=49fb7c35ed57
                # | Churn tracks age and governance, not how dated a page looks: an
                # | unmaintained dependency stops surprising you and still accrues unfixed
                # | bugs.
                feedback: "A rotatividade acompanha idade e governança, não o quanto uma página parece datada: uma dependência sem manutenção para de te surpreender e mesmo assim acumula bugs não corrigidos."  # @src=97b84a6cc3f9
              d:
                # | The @solana/kit pins, since npm's latest tag already sits two majors
                # | past the 6.10 line and one past the 7.1 line you hold, and a pinned
                # | major stops resolving once the registry moves on.
                label: "Os pins do @solana/kit, já que a tag latest do npm já está dois majors à frente da linha 6.10 e um à frente da linha 7.1 que você segura, e um major fixado para de resolver quando o registro segue em frente."  # @src=842d62a0124e
                # | Published versions do not expire: 6.10.0 installs exactly as well the
                # | day kit 9 ships. Kit does move fast, which is why the repo pins per
                # | workspace and records why, and that is the piece you have already
                # | learned to hold still. What moves under you is the young end of the
                # | stack, where the client and the spec themselves change.
                feedback: "Versões publicadas não expiram: a 6.10.0 instala exatamente igual no dia em que o kit 9 sair. O kit se mexe rápido mesmo, e é por isso que o repo fixa por workspace e registra o porquê, e essa é a peça que você já aprendeu a segurar parada. O que se mexe debaixo de você é a ponta nova da stack, onde o client e a própria spec mudam."  # @src=fec5f58e316e
              b:
                # | The blinks Actions spec fields, since the blinks tooling was described
                # | as frozen and effectively unpublished since 2025.
                label: "Os campos da spec Actions dos blinks, já que o ferramental de blinks foi descrito como congelado e efetivamente sem publicação desde 2025."  # @src=fb69876b9097
                # | Frozen tooling is the opposite of fast-moving; the blinks lane is among
                # | the LEAST likely to shift pins in three months.
                feedback: "Ferramental congelado é o oposto de se mexer rápido; a pista dos blinks está entre as com MENOS chance de trocar pins em três meses."  # @src=77bf7cc6a6e3
          m09l2-q2-where-next:
            # | Your colleague wants to squeeze more transactions to land under load during
            # | a hot drop by tuning priority fees and Jito bundles. Which course did this
            # | one explicitly defer that depth to?
            prompt: "O seu colega quer espremer mais transações para aterrissarem sob carga durante um drop quente ajustando taxas de prioridade e bundles da Jito. Para qual curso este aqui adiou explicitamente essa profundidade?"  # @src=779efd4143b9
            # | This course states its boundary out loud: it gives the one-box priority-fee
            # | recipe and hands landing science, Jito, compute-budget tuning, and indexing
            # | at scale to the client-side course. The internals-why belongs to Low-Level
            # | Solana; the token internals belong to Digital Assets.
            explanation: "Este curso diz o limite dele em voz alta: ele dá a receita de taxa de prioridade de uma caixa só e entrega a ciência de landing, a Jito, o ajuste fino de compute budget e a indexação em escala ao curso client-side. O porquê das entranhas pertence a Low-Level Solana; as entranhas de token pertencem a Digital Assets."  # @src=06fddf8c6105
            options:                 # source order — keep it
              a:
                # | The Master Solana Frontend and Client-Side Development course, which
                # | owns transaction-landing strategy.
                label: "O curso Master Solana Frontend and Client-Side Development, que é dono da estratégia de landing de transação."  # @src=748f7fb028a8
                # | The split is practice against internals, not depth against shallowness.
                feedback: "A divisão é prática contra entranhas, não profundidade contra superficialidade."  # @src=8fc962cb67f7
              b:
                # | The Digital Assets, Tokenization and Token Extensions course, which owns
                # | the Token-2022 extensions PYUSD showed off.
                label: "O curso Digital Assets, Tokenization and Token Extensions, que é dono das extensões Token-2022 que o PYUSD exibiu."  # @src=008f3cfb8d6d
                # | Digital Assets owns token internals, not tx-landing; priority fees and
                # | Jito were handed to the client-side course.
                feedback: "Digital Assets é dono das entranhas de token, não de landing de tx; taxas de prioridade e Jito foram entregues ao curso client-side."  # @src=d12eee51aa0d
              c:
                # | The Low-Level Solana course, which covers the scheduler, QoS, and the
                # | leader pipeline that decide whether a transaction reaches a block at
                # | all.
                label: "O curso Low-Level Solana, que cobre o scheduler, o QoS e o pipeline de leader que decidem se uma transação chega a um bloco."  # @src=5db650c2ddc5
                # | Low-Level Solana explains WHY the runtime behaves as it does; the
                # | practical what-to-do for landing was deferred to the client-side course,
                # | not the internals course.
                feedback: "Low-Level Solana explica POR QUE o runtime se comporta como se comporta; o que-fazer prático para landing foi adiado para o curso client-side, não para o curso de entranhas."  # @src=9e77f0930882
              d:
                # | Master Anchor V2, since compute budgets and CU limits are decided in the
                # | program you deploy.
                label: "Master Anchor V2, já que compute budgets e limites de CU são decididos no programa de que você faz deploy."  # @src=2b5e4014aa95
                # | Compute-budget instructions ride on the transaction the client builds,
                # | which is why this course's one-box recipe lives in the checkout builder
                # | and never in a program. Anchor V2 is the program-authoring door, and
                # | Wavelength shipped without a line of Rust.
                feedback: "Instruções de compute budget pegam carona na transação que o client monta, e é por isso que a receita de uma caixa só deste curso mora no montador de checkout e nunca em um programa. Anchor V2 é a porta de autoria de programas, e a Wavelength foi entregue sem uma linha de Rust."  # @src=2c622c0ac792
          m09l2-q3-frame:
            # | The course opened by decoding a dollar on mainnet and closes on the repo
            # | that changed sides. What is the single structural difference from card rails
            # | that shaped every ops decision you made, from verification to refunds?
            prompt: "O curso abriu decodificando um dólar na mainnet e fecha no repo que mudou de lado. Qual é a única diferença estrutural em relação aos trilhos de cartão que moldou toda decisão de operação que você tomou, da verificação aos reembolsos?"  # @src=d0ca5bb1f17e
            # | The no-chargeback asymmetry is the through-line: it is why refunds became
            # | original-construction push payments, why verification is server-side and
            # | final, and why the dispute posture differs from every card integration your
            # | colleague has done. Fast settlement and low fees are features; the missing
            # | chargeback is the structural fact.
            explanation: "A assimetria do sem-chargeback é o fio condutor: é por isso que reembolsos viraram pagamentos de push originados do zero, que a verificação é no servidor e final, e que a postura de disputa difere de toda integração de cartão que o seu colega já fez. Liquidação rápida e taxas baixas são recursos; o chargeback que falta é o fato estrutural."  # @src=0be4eb8a9ef0
            options:                 # source order — keep it
              d:
                # | There are no chargebacks, so the risk sits with the buyer and a
                # | merchant's checks can safely run after fulfillment.
                label: "Não existem chargebacks, então o risco fica com o comprador e as checagens de um lojista podem rodar com segurança depois do fulfillment."  # @src=ecedcaebffcb
                # | The first clause is the fact and the second inverts what it implies.
                # | With no reversal to fall back on, every control moves earlier: the
                # | verifier reads the chain before an order is fulfilled, not after, and
                # | the whole back office exists because a check that runs after the record
                # | ships has nothing left to protect.
                feedback: "A primeira oração é o fato e a segunda inverte o que ele implica. Sem reversão para se apoiar, todo controle se move para mais cedo: o verificador lê a blockchain antes de um pedido ser atendido, não depois, e o back office inteiro existe porque uma checagem que roda depois de o disco ser enviado não tem mais nada para proteger."  # @src=cda6ec42f56c
              a:
                # | Fees are far lower on Solana, so you can afford to retry transactions
                # | much more aggressively than on card rails.
                label: "As taxas são bem mais baixas na Solana, então você pode se dar ao luxo de tentar transações de novo de forma muito mais agressiva do que em trilhos de cartão."  # @src=d87413b33200
                # | Low fees are real but they did not shape verification, reconciliation,
                # | or refunds; the asymmetry that did was the absence of chargebacks.
                feedback: "Taxas baixas são reais, mas não foram elas que moldaram verificação, conciliação ou reembolsos; a assimetria que moldou foi a ausência de chargebacks."  # @src=d3cf21a7c642
              c:
                # | Settlement is fast enough to be effectively instant, so reconciliation
                # | and idempotency stop mattering to a merchant.
                label: "A liquidação é rápida o bastante para ser efetivamente instantânea, então conciliação e idempotência param de importar para um lojista."  # @src=22f0eb893c1a
                # | Settlement is fast but not free of the retry-and-duplicate problem;
                # | idempotency and reconciliation mattered throughout precisely because
                # | webhooks still lie and blockhashes still expire.
                feedback: "A liquidação é rápida, mas não está livre do problema de tentar de novo e duplicar; idempotência e conciliação importaram o curso inteiro exatamente porque webhooks ainda mentem e blockhashes ainda expiram."  # @src=83fe26c7f96c
              b:
                # | There are no chargebacks by construction, so refunds are push payments
                # | you originate and disputes have no bank-mediated reversal.
                label: "Não existem chargebacks por construção, então reembolsos são pagamentos de push que você origina e disputas não têm reversão mediada por banco."  # @src=32ef056223db
                # | Take away the reversal primitive and every control moves earlier in the
                # | flow; the risk does not vanish, it relocates, and the loss an issuer
                # | used to absorb now lands on you.
                feedback: "Tire a primitiva de reversão e todo controle se move para mais cedo no fluxo; o risco não some, ele muda de lugar, e a perda que um emissor costumava absorver agora aterrissa em você."  # @src=fd358eee0e58
