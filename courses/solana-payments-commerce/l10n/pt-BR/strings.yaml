                feedback: "As páginas de ecossistema que nomeiam carteiras específicas de fato datam daquela onda de lançamento, que é exatamente por que elas não podem sustentar uma afirmação de 2026. O comportamento atual de qualquer carteira é não testado até você testar, naquela semana."  # @src=41499a60b20e
              b:
