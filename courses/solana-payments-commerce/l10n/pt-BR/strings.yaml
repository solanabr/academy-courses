locale: pt-BR

course:
  # | Solana Payments & Commerce
  title: "Pagamentos e comércio na Solana"  # @src=3295f0e5577a
  # | By the end you can take real money on Solana end to end, a stablecoin Solana Pay
  # | checkout and POS, a webhook-driven back office with reconciliation and refunds,
  # | non-custodial subscriptions with dunning, on/off ramps, and x402/MPP machine payments,
  # | assembled into one running commerce stack on devnet — where the course touches
  # | regulation, it is an engineering framing of the seams, not legal advice. This is a
  # | local-toolchain course from the first lab: module one already needs Node 24 and
  # | installs packages on your machine, module two adds the Anza Agave CLI (`solana` plus
  # | `spl-token`), and from there every lab runs npm workspaces locally against devnet; one
  # | step in module eight — `cargo install kora-cli` — additionally needs a Rust toolchain.
  description: "No fim, você consegue receber dinheiro de verdade na Solana de ponta a ponta, um checkout e uma maquininha (POS) em stablecoin com Solana Pay, um back office movido a webhooks com conciliação e reembolsos, assinaturas não custodiais com dunning, on/off ramps e pagamentos entre máquinas x402/MPP, tudo montado numa única stack de comércio rodando na devnet — onde o curso toca em regulação, é uma leitura de engenharia das costuras, não aconselhamento jurídico. Este é um curso de toolchain local desde o primeiro lab: o módulo um já precisa do Node 24 e instala pacotes na sua máquina, o módulo dois adiciona a CLI Anza Agave (`solana` e `spl-token`), e daí em diante todo lab roda npm workspaces localmente contra a devnet; um passo do módulo oito — `cargo install kora-cli` — precisa também de um toolchain Rust."  # @src=3f72835ec89f
  modules:
    rails-mental-model:
      # | The rails you're switching to
      title: "Os trilhos para onde você está mudando"  # @src=b0dd33d75215
    stablecoin-transfers:
      # | Stablecoin transfers, down to the decimal
      title: "Transferências de stablecoin, até o último decimal"  # @src=a0d24a3c831e
    checkout-surfaces:
      # | Checkout surfaces: Solana Pay, the record fair, and blinks
      title: "Superfícies de checkout: Solana Pay, a feira de discos e blinks"  # @src=3476220583b0
    back-office:
      # | The back office: verify, ingest, reconcile, refund
      title: "O back office: verificar, ingerir, conciliar, reembolsar"  # @src=850433db218d
    recurring-revenue:
      # | Recurring revenue without custody
      title: "Receita recorrente sem custódia"  # @src=00d1c92c3aac
    fiat-edge:
      # | The fiat edge
      title: "A fronteira fiat"  # @src=893fdd4bc35b
    machine-customers:
      # | Machine customers: x402 and the agentic turn
      title: "Clientes máquina: x402 e a virada agêntica"  # @src=7cc07ca9885d
    fees-offline-golive:
      # | Fees, offline, and going live
      title: "Taxas, offline e entrar no ar"  # @src=3db42f81696e
    capstone-assembly:
      # | Capstone: Wavelength, open for business
      title: "Capstone: Wavelength, de portas abertas"  # @src=cf0b9097e9f7

lessons:
  m01-l1:
    # | Watch a dollar settle: your first five minutes on Solana rails
    title: "Veja um dólar liquidar: seus primeiros cinco minutos nos trilhos da Solana"  # @src=919f9b242170
    blocks:
      check:                      # quiz
        questions:
          m01-l1-q1:
            # | Your first-five-minutes script decoded a live USDC transfer off mainnet with
            # | no wallet, no keys, and no signup. In card-rail terms, what did you actually
            # | just do?
            prompt: "O seu script dos primeiros cinco minutos decodificou uma transferência de USDC ao vivo da mainnet sem carteira, sem chaves e sem cadastro. Em termos de trilhos de cartão, o que você de fato acabou de fazer?"  # @src=cfe0e269a3b9
            # | The demo needs zero setup because Solana's ledger is public and readable
            # | over any RPC. Every settled transfer (sender, amount, mint, memo) is
            # | queryable by anyone, which is the opposite of a card processor's private,
            # | permissioned dashboard. That public-by-default property is exactly what lets
            # | a merchant reconcile payments later without a PSP sitting in the middle.
            explanation: "A demo não precisa de nenhum setup porque o livro-razão da Solana é público e legível por qualquer RPC. Toda transferência liquidada (remetente, valor, mint, memo) pode ser consultada por qualquer um, o que é o oposto do painel privado e com permissão de um processador de cartão. Essa propriedade de público por padrão é exatamente o que deixa um lojista conciliar pagamentos depois sem um PSP sentado no meio."  # @src=c7c0d4748e90
            options:                 # source order — keep it
              b:
                # | You issued a refund against someone else's charge, since the same public
                # | RPC that hands back a transfer also accepts reversal calls against the
                # | signature it returned.
                label: "Você emitiu um reembolso contra a cobrança de outra pessoa, já que o mesmo RPC público que devolve uma transferência também aceita chamadas de reversão contra a signature que ele retornou."  # @src=aec64684cbce
                # | Reading is not writing. The RPC returned an already-settled record, and
                # | no endpoint on it can move or reverse anyone's funds; only the holder's
                # | signature can spend from an account.
                feedback: "Ler não é escrever. O RPC devolveu um registro já liquidado, e nenhum endpoint nele consegue mover ou reverter os fundos de ninguém; só a signature do holder consegue gastar de uma conta."  # @src=cea0e19c21ac
              d:
                # | You queried a node operator's private developer mirror, so what came
                # | back is a courtesy copy of the record, not the ledger.
                label: "Você consultou o espelho privado de desenvolvedor de um operador de nó, então o que voltou é uma cópia de cortesia do registro, não o livro-razão."  # @src=59cffe61eb07
                # | There is no separate reporting copy to drift out of sync with. Every
                # | node replicates the same ledger, so the record that endpoint handed you
                # | is the settlement record.
                feedback: "Não existe uma cópia de relatório separada para sair de sincronia. Todo nó replica o mesmo livro-razão, então o registro que aquele endpoint te entregou é o registro de liquidação."  # @src=4156489d602e
              a:
                # | You read a stranger's already-settled payment straight from the shared
                # | ledger, because settlement records here are public by default.
                label: "Você leu o pagamento já liquidado de um estranho direto do livro-razão compartilhado, porque registros de liquidação aqui são públicos por padrão."  # @src=3eba4bc42c48
                # | Reading needs no key because every RPC serves the same replicated
                # | ledger; the same openness puts your own sales in public view too.
                feedback: "Ler não precisa de chave porque todo RPC serve o mesmo livro-razão replicado; essa mesma abertura também coloca as suas próprias vendas em exposição pública."  # @src=19c029f711f3
              c:
                # | You re-authorized a new payment from the sender, because decoding a
                # | transfer re-broadcasts it and the network settles that same transfer
                # | again.
                label: "Você reautorizou um novo pagamento do remetente, porque decodificar uma transferência retransmite ela e a rede liquida aquela mesma transferência de novo."  # @src=caeb12862378
                # | Decoding inspects a past transaction; it never re-submits or
                # | re-authorizes anything. That payment settled exactly once, when its
                # | sender signed it.
                feedback: "Decodificar inspeciona uma transação passada; nunca reenvia nem reautoriza nada. Aquele pagamento liquidou exatamente uma vez, quando o remetente dele assinou."  # @src=d0170c322e4f
          m01-l1-q2:
            # | Installing @solana/pay also dropped a `pay` CLI executable into
            # | node_modules/.bin (found by npx, never on your global PATH), and the
            # | canonical Solana Pay GitHub URL now redirects to a repo whose headline
            # | product is an agentic-payments CLI. What is the honest read of that?
            prompt: "Instalar o @solana/pay também largou um executável de CLI `pay` em node_modules/.bin (encontrado pelo npx, nunca no seu PATH global), e a URL canônica do Solana Pay no GitHub agora redireciona para um repo cujo produto de destaque é um CLI de agentic payments. Qual é a leitura honesta disso?"  # @src=64e92cd6f2ad
            # | The redirect and the bundled CLI are real signals that the Foundation's
            # | energy moved from QR checkout toward agent/HTTP payments, but 'moved energy'
            # | is not 'deleted.' The classic library is still shipped and maintained inside
            # | the same monorepo. Reading ecosystem shifts honestly (what changed versus
            # | what was actually removed) is a survival skill in a market this young.
            explanation: "O redirect e o CLI empacotado junto são sinais reais de que a energia da Foundation se moveu do checkout por QR para pagamentos de agente/HTTP, mas 'energia que se moveu' não é 'deletado.' A biblioteca clássica continua publicada e mantida dentro do mesmo monorepo. Ler mudanças de ecossistema com honestidade (o que mudou versus o que foi de fato removido) é uma habilidade de sobrevivência num mercado tão novo assim."  # @src=b427d476bd90
            options:                 # source order — keep it
              c:
                # | Your npm package was hijacked; a surprise `pay` binary is a supply-chain
                # | compromise you should remove.
                label: "O seu pacote npm foi sequestrado; um binário `pay` surpresa é um comprometimento de cadeia de suprimentos que você deveria remover."  # @src=d1cf68c468e3
                # | The binary is intentional: the package.json declares a `pay` bin entry.
                # | It is a documented feature of the official package, not a compromise.
                feedback: "O binário é intencional: o package.json declara uma entrada `pay` em bin. É uma feature documentada do pacote oficial, não um comprometimento."  # @src=fafeee2499b9
              d:
                # | The package is CLI-first now: the binary replaced its TypeScript
                # | exports, so there is nothing left to import.
                label: "O pacote agora é CLI-first: o binário substituiu os exports de TypeScript dele, então não sobrou nada para importar."  # @src=714e07962338
                # | Both surfaces ship together. Step 6 of the lab imports `encodeURL` from
                # | the very package that dropped the executable into node_modules/.bin.
                feedback: "As duas superfícies são publicadas juntas. O passo 6 do laboratório importa `encodeURL` do mesmo pacote que largou o executável em node_modules/.bin."  # @src=11dfdb0e7d07
              b:
                # | The Foundation's payments focus shifted toward agent and HTTP payments,
                # | while classic Solana Pay lives on as a subpackage.
                label: "O foco de pagamentos da Foundation se deslocou para pagamentos de agente e HTTP, enquanto o Solana Pay clássico segue vivo como subpacote."  # @src=5d699edc662b
                # | A redirect moves attention, not code; your package still publishes from
                # | that monorepo, and shifted attention is where maintenance eventually
                # | follows.
                feedback: "Um redirect move atenção, não código; o seu pacote continua publicando daquele monorepo, e a atenção deslocada é para onde a manutenção acaba indo."  # @src=0cd198f3a794
              a:
                # | Classic QR-based Solana Pay was deleted; only the new agentic CLI is
                # | supported from now on.
                label: "O Solana Pay clássico baseado em QR foi deletado; só o novo CLI agentic tem suporte daqui para frente."  # @src=e1f8645bccf0
                # | Classic Solana Pay is not gone. It lives on at
                # | typescript/packages/solana-pay in the very same repo, and you will build
                # | a checkout on it in module 3.
                feedback: "O Solana Pay clássico não sumiu. Ele segue vivo em typescript/packages/solana-pay no mesmíssimo repo, e você vai construir um checkout em cima dele no módulo 3."  # @src=8b83471d6e6b
          m01-l1-q3:
            # | A skeptical teammate says 'stablecoin payments are a toy, no mainstream
            # | payments company will touch them.' Which fact from this lesson speaks to
            # | that objection most directly?
            prompt: "Um colega de time cético diz 'pagamentos em stablecoin são brinquedo, nenhuma empresa de pagamentos mainstream vai encostar neles.' Qual fato desta lição responde a essa objeção de forma mais direta?"  # @src=d1c4b5e776e7
            # | The strongest 'this is real' datum is an incumbent shipping it in
            # | production: Stripe accepts USDC-on-Solana at checkout and settles you in
            # | fiat. That is a mainstream PSP treating these rails as a first-class payment
            # | method, which is precisely the credibility signal the opener is built
            # | around.
            explanation: "O dado mais forte de 'isto é real' é um incumbente rodando isso em produção: a Stripe aceita USDC-na-Solana no checkout e te liquida em moeda fiduciária. É um PSP mainstream tratando estes trilhos como método de pagamento de primeira classe, que é precisamente o sinal de credibilidade em torno do qual a abertura foi construída."  # @src=3a7235399752
            options:                 # source order — keep it
              a:
                # | Solana's block time beats a card network's authorization round-trip, so
                # | it must be production-ready.
                label: "O tempo de bloco da Solana ganha do round-trip de autorização de uma bandeira, então tem que estar pronto para produção."  # @src=96521ca06a77
                # | Speed is a property, not proof of adoption. It does not tell your
                # | teammate that a mainstream processor is actually in the market.
                feedback: "Velocidade é uma propriedade, não prova de adoção. Não diz ao seu colega de time que um processador mainstream está de fato no mercado."  # @src=7132fc95c013
              b:
                # | The bundled `pay` CLI wraps any shell command and clears a 402 payment
                # | challenge on your behalf.
                label: "O CLI `pay` empacotado junto embrulha qualquer comando de shell e resolve um desafio de pagamento 402 em seu nome."  # @src=8c960cef9910
                # | That is a neat capability, but it is a Foundation tool, not evidence
                # | that an incumbent payments company adopted these rails.
                feedback: "Essa é uma capacidade bacana, mas é uma ferramenta da Foundation, não evidência de que uma empresa de pagamentos incumbente adotou estes trilhos."  # @src=a0b8b7f18e30
              d:
                # | Stablecoin float on Solana climbed from about $1.5B in December 2023 to
                # | roughly $15.87B by August 2026.
                label: "O float de stablecoin na Solana subiu de cerca de US$ 1.5 bi em dezembro de 2023 para aproximadamente US$ 15.87 bi em agosto de 2026."  # @src=a2fdd73c3a2c
                # | That figure is real and it is in the lesson, but float measures dollars
                # | sitting on the rails, not a payments company deciding to integrate them.
                feedback: "Esse número é real e está na lição, mas float mede dólares parados nos trilhos, não uma empresa de pagamentos decidindo integrá-los."  # @src=2216f6f6a61b
              c:
                # | Stripe's 'Pay with crypto' accepts USDC on Solana at checkout and
                # | settles the merchant in fiat.
                label: "O 'Pay with crypto' da Stripe aceita USDC na Solana no checkout e liquida o lojista em moeda fiduciária."  # @src=4a4a6d13b0b0
                # | An incumbent settling merchants in fiat is the evidence a skeptic
                # | accepts; it proves the rail is real, not that buyers will choose it.
                feedback: "Um incumbente liquidando lojistas em moeda fiduciária é a evidência que um cético aceita; prova que o trilho é real, não que os compradores vão escolher ele."  # @src=4976552d055c
  m01-l2:
    # | Finality vs the card stack: the payments mental model
    title: "Finality vs. a pilha de cartões: o modelo mental de pagamentos"  # @src=4780bf4b9f8f
    blocks:
      check:                      # quiz
        questions:
          m01-l2-q1:
            # | You are porting your card mental model. A $2,000 electronics order arrives
            # | and you must decide when to release the goods, knowing there is no
            # | chargeback path to undo the shipment. Which commitment level is the right
            # | default for a sale of that value?
            prompt: "Você está portando o seu modelo mental de cartão. Chega um pedido de eletrônicos de US$ 2,000 e você precisa decidir quando liberar a mercadoria, sabendo que não existe caminho de chargeback para desfazer o envio. Qual commitment level é o padrão certo para uma venda desse valor?"  # @src=d3b221f9d9ff
            # | Official guidance is qualitative: `confirmed` for most payments, `finalized`
            # | for high-value or compliance-sensitive ones, `processed` for UI only. The
            # | card analogy helps (finalized is like settled funds) but breaks in one
            # | direction: there is no chargeback path at any commitment level, so the only
            # | thing you are pricing with this choice is fork risk. That is why value, not
            # | disputability, is the axis — a bigger ticket makes a rare dropped block more
            # | expensive, and the extra seconds cheap by comparison.
            explanation: "A orientação oficial é qualitativa: `confirmed` para a maioria dos pagamentos, `finalized` para os de valor alto ou sensíveis a compliance, `processed` só para UI. A analogia de cartão ajuda (finalized é como fundos liquidados) mas quebra numa direção: não existe caminho de chargeback em nenhum commitment level, então a única coisa que você está precificando com essa escolha é risco de fork. É por isso que o eixo é valor, e não contestabilidade — um ticket maior deixa um bloco descartado raro mais caro, e os segundos a mais baratos em comparação."  # @src=b280d261b952
            options:                 # source order — keep it
              d:
                # | Release once six blocks sit on top of the payment, the confirmation
                # | depth other chains taught you.
                label: "Libere assim que seis blocos estiverem em cima do pagamento, a profundidade de confirmação que outras blockchains te ensinaram."  # @src=d1c71225198b
                # | Solana exposes stake-weighted vote levels, not a block-depth counter,
                # | and six blocks is under two seconds at a 300ms slot. Your own ladder
                # | probe put finality some 25 to 40 slots back, so a depth heuristic
                # | borrowed from elsewhere lands well short of it.
                feedback: "A Solana expõe níveis de voto ponderados por stake, não um contador de profundidade de blocos, e seis blocos dão menos de dois segundos num slot de 300ms. A sua própria sondagem da escada colocou a finality a uns 25 a 40 slots atrás, então uma heurística de profundidade emprestada de outro lugar fica bem aquém dela."  # @src=a485fcf015d0
              b:
                # | Release on `processed`, treating it as the authorization hold: the RPC
                # | hands back a signature in well under a second, which is enough to print
                # | the packing slip.
                label: "Libere no `processed`, tratando-o como a retenção da autorização: o RPC devolve uma signature em bem menos de um segundo, o que basta para imprimir o romaneio."  # @src=e2f0ef1b8221
                # | The fast signature is real, but `processed` is UI-only and can be
                # | dropped during a fork; releasing $2,000 of goods on it is like shipping
                # | on an unconfirmed auth. Ecosystem guidance reserves it for optimistic
                # | display.
                feedback: "A signature rápida é real, mas `processed` é só de UI e pode ser descartado durante um fork; liberar US$ 2,000 de mercadoria em cima dele é como despachar numa autorização não confirmada. A orientação do ecossistema o reserva para exibição otimista."  # @src=fc2f68dd3e2d
              c:
                # | Release on `confirmed` (the captured-charge equivalent), and claw the
                # | funds back later if the buyer disputes.
                label: "Libere no `confirmed` (o equivalente da cobrança capturada), e estorne os fundos depois se o comprador contestar."  # @src=43fa9ae1c62e
                # | `confirmed` is the sensible default for MOST payments, but the guidance
                # | reserves `finalized` for high-value and compliance-sensitive orders, and
                # | $2,000 of electronics is squarely the first. The clawback half is the
                # | card metaphor leaking: there is no later reversal on this rail, which is
                # | exactly why the decision has to be made before the goods leave.
                feedback: "`confirmed` é o padrão sensato para a MAIORIA dos pagamentos, mas a orientação reserva `finalized` para pedidos de valor alto e sensíveis a compliance, e US$ 2,000 de eletrônicos é exatamente o primeiro caso. A metade do estorno é a metáfora de cartão vazando: não existe reversão posterior neste trilho, que é exatamente por que a decisão tem que ser tomada antes de a mercadoria sair."  # @src=70d38efba259
              a:
                # | Wait for `finalized`: the settled-funds equivalent, since a finalized
                # | block cannot be dropped by a fork.
                label: "Espere pelo `finalized`: o equivalente de fundos liquidados, já que um bloco finalized não pode ser descartado por um fork."  # @src=9d74f9fec420
                # | Right, and be precise about what those seconds buy: fork risk is the
                # | only thing a commitment level controls. It does not protect you from a
                # | dishonest buyer — nothing on this rail does — but at $2,000 the residual
                # | chance of a dropped block is worth ten seconds you would not spend on a
                # | small ticket.
                feedback: "Certo, e seja preciso sobre o que esses segundos compram: risco de fork é a única coisa que um commitment level controla. Ele não te protege de um comprador desonesto — nada neste trilho protege — mas em US$ 2,000 a chance residual de um bloco descartado vale dez segundos que você não gastaria num ticket pequeno."  # @src=45fb43f73cb8
          m01-l2-q2:
            # | A customer buys a $12 record. On card rails you would budget roughly 2.9%
            # | plus 30 cents in processor fees. What does the base network fee look like on
            # | these rails?
            prompt: "Um cliente compra um disco de US$ 12. Nos trilhos de cartão você orçaria mais ou menos 2.9% mais 30 centavos em taxas do processador. Como é a taxa base de rede nestes trilhos?"  # @src=69b6c7b14d62
            # | The base fee is a flat 5000 lamports per signature, so a typical payment
            # | costs a small fraction of one cent ($0.00075 at $150 per SOL, $0.0015 at
            # | $300 — quote the band, not a baked-in dollar figure), orders of magnitude
            # | below card interchange and, more to the point, flat rather than
            # | percentage-based. That flips the economics for small-ticket sales, and it
            # | deletes the float: nothing is held back on a schedule, so there is nothing
            # | to anticipate. Account creation has its own one-time rent cost, which you
            # | meet next module where token accounts appear.
            explanation: "A taxa base é de 5000 lamports por signature, fixos, então um pagamento típico custa uma pequena fração de um centavo (US$ 0.00075 a US$ 150 por SOL, US$ 0.0015 a US$ 300 — cite a faixa, não um número em dólar cravado), ordens de grandeza abaixo do intercâmbio de cartão e, mais ao ponto, fixa em vez de baseada em porcentagem. Isso vira a economia das vendas de ticket pequeno, e apaga o float: nada fica retido num cronograma, então não há nada para antecipar. A criação de conta tem o próprio custo de rent de uma vez só, que você conhece no próximo módulo, onde aparecem as contas de token."  # @src=32ed615423d6
            options:                 # source order — keep it
              d:
                # | A flat fee, but netted out of the USDC itself, so the customer's $12
                # | arrives as a little less than $12.
                label: "Uma taxa fixa, mas descontada do próprio USDC, então os US$ 12 do cliente chegam como um pouco menos de US$ 12."  # @src=37d7ad1c0af9
                # | The card habit of netting the cut out of the sale does not port. Fees
                # | are paid in SOL by whoever signs, and the USDC leg moves the exact
                # | amount the transfer names, so your $12 arrives as $12.
                feedback: "O hábito de cartão de descontar o corte da venda não porta. As taxas são pagas em SOL por quem assina, e a perna de USDC move exatamente o valor que a transferência nomeia, então os seus US$ 12 chegam como US$ 12."  # @src=4b988045fe66
              b:
                # | A flat 5000-lamport base fee, so a typical payment costs a small
                # | fraction of a cent whatever the size.
                label: "Uma taxa base fixa de 5000 lamports, então um pagamento típico custa uma pequena fração de centavo, qualquer que seja o tamanho."  # @src=89ca7ffbc76c
                # | Fees price signatures, not value; ticket size drops out of the math.
                feedback: "As taxas precificam signatures, não valor; o tamanho do ticket some da conta."  # @src=995e369c9027
              c:
                # | Nothing at all: Solana transfers are free, and the SOL you hold pays for
                # | account creation rather than for sends.
                label: "Nada: transferências na Solana são de graça, e o SOL que você tem paga pela criação de conta e não pelos envios."  # @src=3465a3761648
                # | Not free: every transaction pays a base fee of 5000 lamports plus any
                # | priority fee. It is tiny, but budgeting it as literally zero will bite
                # | you at scale and on account creation.
                feedback: "Não é de graça: toda transação paga uma taxa base de 5000 lamports mais qualquer taxa de prioridade. É minúscula, mas orçá-la como literalmente zero vai te morder em escala e na criação de conta."  # @src=ca26d7c5c374
              a:
                # | A percentage of the sale skimmed by validators, in the low tenths of a
                # | percent, so a $1,200 order costs a hundred times what a $12 one does to
                # | move on-chain.
                label: "Uma porcentagem da venda raspada pelos validadores, na casa dos décimos baixos de por cento, então um pedido de US$ 1,200 custa cem vezes o que um de US$ 12 custa para mover on-chain."  # @src=22e2baae38b2
                # | Network fees here are not a percentage of value, and validators take no
                # | cut of the amount transferred. The base fee is flat per signature and
                # | independent of the sum moved.
                feedback: "As taxas de rede aqui não são uma porcentagem do valor, e os validadores não ficam com corte nenhum do montante transferido. A taxa base é fixa por signature e independente da soma movida."  # @src=dd27794e08cf
          m01-l2-q3:
            # | Your finance lead loves that 'chargebacks don't exist' on these rails. What
            # | is the honest other half of that trade you should tell them?
            prompt: "O seu líder de finanças adora que 'chargebacks não existem' nestes trilhos. Qual é a outra metade honesta dessa troca que você deveria contar para ele?"  # @src=862e406c5cbe
            # | No chargebacks is a genuine merchant win, but it is an asymmetry, not a free
            # | lunch. Because settled transfers are irreversible, refunds become push
            # | payments you construct yourself (there is no refunds page in the official
            # | docs; you build that logic in module 4), and an erroneous payment has no
            # | bank to call. Naming both halves is the entire point of a payments mental
            # | model.
            explanation: "Sem chargebacks é um ganho genuíno do lojista, mas é uma assimetria, não almoço grátis. Como transferências liquidadas são irreversíveis, reembolsos viram pagamentos de push que você mesmo constrói (não existe página de reembolsos na documentação oficial; você constrói essa lógica no módulo 4), e um pagamento equivocado não tem banco para ligar. Nomear as duas metades é o ponto inteiro de um modelo mental de pagamentos."  # @src=a2fc6ab820ac
            options:                 # source order — keep it
              c:
                # | Reversibility is now yours: refunds are push payments you build, and a
                # | mis-send has no institutional undo.
                label: "A reversibilidade agora é sua: reembolsos são pagamentos de push que você constrói, e um envio errado não tem desfazer institucional."  # @src=dd3353ddd2f5
                # | Settlement finality moves the reversal function out of the network and
                # | into your application code; a refund you can rebuild, a mis-send you
                # | cannot.
                feedback: "A finality da liquidação tira a função de reversão da rede e a joga no código da sua aplicação; um reembolso você consegue reconstruir, um envio errado não."  # @src=de9972d6af3f
              b:
                # | The network auto-reverses fraudulent transfers, so you still get
                # | card-style protection at no cost.
                label: "A rede reverte automaticamente transferências fraudulentas, então você continua tendo proteção no estilo cartão sem custo nenhum."  # @src=469a04707d10
                # | The network never reverses a settled transfer. There is no automatic
                # | clawback; anyone promising card-style protection 'for free' is
                # | misreading the rails.
                feedback: "A rede nunca reverte uma transferência liquidada. Não existe estorno automático; quem promete proteção no estilo cartão 'de graça' está lendo os trilhos errado."  # @src=40af0e577a77
              a:
                # | Nothing much; no chargebacks just means lower risk, with no offsetting
                # | downside for the merchant.
                label: "Nada de mais; sem chargebacks quer dizer só risco menor, sem nenhuma desvantagem compensatória para o lojista."  # @src=f10757d81787
                # | There is a downside: the same finality that removes chargeback fraud
                # | also removes the institutional safety net customers may expect, and
                # | shifts all refund logic onto you.
                feedback: "Existe uma desvantagem: a mesma finality que remove a fraude de chargeback também remove a rede de proteção institucional que os clientes podem esperar, e joga toda a lógica de reembolso em cima de você."  # @src=b0e9d3e87e97
              d:
                # | Your customers lose their safety net, but that is between them and their
                # | wallet, not a merchant concern.
                label: "Os seus clientes perdem a rede de proteção deles, mas isso é entre eles e a carteira deles, não uma preocupação do lojista."  # @src=59a4e742fa69
                # | The lost safety net lands on your support queue, not theirs. Buyers will
                # | still demand refunds, and since the rails hand you no reversal path,
                # | satisfying them is work you schedule and fund.
                feedback: "A rede de proteção perdida aterrissa na sua fila de suporte, não na deles. Os compradores vão continuar exigindo reembolsos, e como os trilhos não te entregam caminho de reversão nenhum, atendê-los é trabalho que você agenda e financia."  # @src=961faef108d8
          m01-l2-q4:
            # | Given everything in this lesson, which sale is the WEAKEST fit for
            # | stablecoin rails today?
            prompt: "Dado tudo o que tem nesta lição, qual venda é o encaixe MAIS FRACO para trilhos de stablecoin hoje?"  # @src=37548aa1c497
            # | The rails shine for low-fee, instant-settlement flows, which is why 2025 saw
            # | over $1 trillion in stablecoin volume on Solana. They fit worst where the
            # | buyer's core expectation is bank-backed reversibility and dispute rights,
            # | because no-chargeback finality removes exactly that. 'When not to use it' is
            # | a feature of an honest mental model, not a hedge.
            explanation: "Os trilhos brilham em fluxos de taxa baixa e liquidação instantânea, que é por que 2025 viu mais de US$ 1 trilhão em volume de stablecoin na Solana. Eles se encaixam pior onde a expectativa central do comprador é reversibilidade e direitos de contestação garantidos por banco, porque a finality sem chargeback remove exatamente isso. 'Quando não usar' é uma funcionalidade de um modelo mental honesto, não uma hesitação."  # @src=e1227c83d318
            options:                 # source order — keep it
              d:
                # | A B2B invoice where both sides sign a contract that carries the dispute
                # | rather than the network.
                label: "Uma fatura B2B em que os dois lados assinam um contrato que carrega a disputa em vez da rede."  # @src=2f1f17c8dff3
                # | Ticket size is not what makes a sale a poor fit. When a signed contract
                # | already carries the dispute process, nothing is depending on the
                # | bank-backed undo that finality removes.
                feedback: "O tamanho do ticket não é o que faz de uma venda um encaixe ruim. Quando um contrato assinado já carrega o processo de disputa, nada está dependendo do desfazer garantido por banco que a finality remove."  # @src=87d43884c7b3
              b:
                # | A small-ticket sale where percentage-based card interchange eats most of
                # | the ticket and the acquirer sits on the money for a month.
                label: "Uma venda de ticket pequeno em que o intercâmbio de cartão baseado em porcentagem come a maior parte do ticket e o adquirente senta em cima do dinheiro por um mês."  # @src=c4af3b874836
                # | This is a strong fit, not a weak one; flat sub-cent fees are exactly
                # | where these rails beat percentage-based interchange, and settling in
                # | seconds deletes both the D+30 wait and the fee for escaping it.
                feedback: "Este é um encaixe forte, não fraco; taxas fixas abaixo de um centavo são exatamente onde estes trilhos ganham do intercâmbio baseado em porcentagem, e liquidar em segundos apaga tanto a espera de D+30 quanto a taxa para escapar dela."  # @src=1599ba3afa92
              a:
                # | A high-fraud consumer buy where the shopper expects bank-backed dispute
                # | rights and reversal on demand.
                label: "Uma compra de consumo com muita fraude em que o comprador espera direitos de contestação garantidos por banco e reversão sob demanda."  # @src=c1bcd26563ff
                # | The poor fit is the shopper's expectation of an institutional undo,
                # | which finality removes by design. High value alone is not the problem,
                # | since a contract can carry the dispute.
                feedback: "O encaixe ruim é a expectativa do comprador de um desfazer institucional, que a finality remove por projeto. Valor alto sozinho não é o problema, já que um contrato pode carregar a disputa."  # @src=ca1f6ed133eb
              c:
                # | A merchant who wants instant, low-fee settlement with no multi-day
                # | holding periods on funds.
                label: "Um lojista que quer liquidação instantânea e de taxa baixa, sem períodos de retenção de vários dias sobre os fundos."  # @src=fbdee31a5352
                # | Also a strong fit: instant settlement with no holding times is a
                # | headline advantage of these rails, not a reason to avoid them.
                feedback: "Também um encaixe forte: liquidação instantânea sem tempos de retenção é uma vantagem de manchete destes trilhos, não um motivo para evitá-los."  # @src=a490cb1f2571
  m02-l1:
    # | Anatomy of a USDC payment: mints, ATAs, and the transfer-kit
    title: "Anatomia de um pagamento em USDC: mints, ATAs e o transfer-kit"  # @src=7285070e092f
    blocks:
      decimals-safe-base-units:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | Split the string on '.' and pad or read the fractional part to exactly
          # | `decimals` digits.
          0: "Separe a string no '.' e preencha ou leia a parte fracionária com exatamente `decimals` dígitos."  # @src=5d7cc0365503
          # | Scale the whole part into the same units as the padded fraction, then add them
          # | as two bigints; a single float step anywhere in that combination reintroduces
          # | the exact rounding bug this challenge kills.
          1: "Escale a parte inteira para as mesmas unidades da fração preenchida, depois some as duas como dois bigints; um único passo em float em qualquer lugar dessa combinação reintroduz exatamente o bug de arredondamento que este desafio mata."  # @src=feed1f2c4142
        tests:                      # keyed by test case id
          t1:
            # | 12.5 USDC becomes 12,500,000 base units
            description: "12.5 USDC vira 12,500,000 unidades base"  # @src=02c633ebd236
          t2:
            # | one micro-USDC is the smallest representable unit
            description: "um micro-USDC é a menor unidade representável"  # @src=6f8bc3cedc8e
          t3:
            # | a whole amount with no decimal point
            description: "um valor inteiro sem ponto decimal"  # @src=13b30eab1f07
          t4:
            # | a large amount stays exact past the float safe-integer ceiling
            description: "um valor grande continua exato além do teto de inteiro seguro do float"  # @src=35a46479ebb9
          t5:
            # | a 2-decimal mint scales by 100: the exponent comes from the decimals
            # | argument, never from USDC's 6
            description: "um mint de 2 decimais escala por 100: o expoente vem do argumento decimals, nunca do 6 do USDC"  # @src=a4376353d7b3
          t6:
            # | a 0-decimal mint has no fractional part at all and base units equal the
            # | whole amount
            description: "um mint de 0 decimais não tem parte fracionária nenhuma e as unidades base são iguais ao valor inteiro"  # @src=12b25e52bbd3
      parse-checkout-amount:                      # code
        hints:                     # keyed by ARRAY INDEX
          # | The five reasons are not independent: an amount can be both too-precise and
          # | too-large at once, and the contract's listed order (empty, malformed,
          # | negative, too-precise, too-large) decides which one is reported.
          0: "Os cinco motivos não são independentes: um valor pode ser too-precise e too-large ao mesmo tempo, e a ordem listada no contrato (empty, malformed, negative, too-precise, too-large) decide qual é reportado."  # @src=f35337d72edb
          # | The u64 ceiling applies to the assembled integer, not to the string. A short
          # | string can still exceed 2**64 - 1 base units once the mint's decimals scale
          # | it.
          1: "O teto do u64 se aplica ao inteiro montado, não à string. Uma string curta ainda pode passar de 2**64 - 1 unidades base depois que os decimais do mint escalam ela."  # @src=48b9993cb492
          # | The exact conversion is the rung you already cleared. The new work here is
          # | deciding which of the five reasons applies.
          2: "A conversão exata é o degrau que você já passou. O trabalho novo aqui é decidir qual dos cinco motivos se aplica."  # @src=89fdb1d2e26c
        tests:                      # keyed by test case id
          t1-canonical:
            # | The everyday case: 12.5 USDC is 12,500,000 base units.
            description: "O caso do dia a dia: 12.5 USDC são 12,500,000 unidades base."  # @src=9809415aa663
          t2-no-decimal-point:
            # | A whole amount with no decimal point at all still scales by the mint's
            # | decimals.
            description: "Um valor inteiro sem ponto decimal nenhum ainda escala pelos decimais do mint."  # @src=8a3ebafeaf67
          t3-smallest-unit:
            # | One micro-USDC is the smallest representable amount and must survive the
            # | parse.
            description: "Um micro-USDC é o menor valor representável e precisa sobreviver ao parse."  # @src=f5db91ce9173
          t4-leading-and-trailing-zeros:
            # | Leading zeros and a trailing zero inside the mint's precision are ugly, not
            # | wrong.
            description: "Zeros à esquerda e um zero à direita dentro da precisão do mint são feios, não errados."  # @src=fd15ed8ed531
          t5-surrounding-whitespace:
            # | Whitespace around a pasted amount is an artifact of the paste, not an error.
            description: "Espaço em branco em volta de um valor colado é artefato da colagem, não erro."  # @src=b2501e635979
          t6-two-decimal-mint:
            # | 7.07 on a 2-decimal mint is 707 base units: the scale comes from the mint,
            # | never from USDC's 6.
            description: "7.07 em um mint de 2 decimais são 707 unidades base: a escala vem do mint, nunca do 6 do USDC."  # @src=ff4ff9a68bce
          t7-past-the-float-ceiling:
            # | A base-unit value above 2**53 stays exact to the last digit; any float step
            # | rounds it.
            description: "Um valor em unidades base acima de 2**53 continua exato até o último dígito; qualquer passo em float arredonda ele."  # @src=4b0c172843a5
          t8-trailing-zeros-past-decimals-are-not-precision:
            # | Seven fraction digits, but the seventh is a zero: 1.5000000 is exactly
            # | 1500000 base units and parses. Counting the fraction's LENGTH rejects a
            # | representable amount.
            description: "Sete dígitos de fração, mas o sétimo é um zero: 1.5000000 são exatamente 1500000 unidades base e passa no parse. Contar o COMPRIMENTO da fração rejeita um valor representável."  # @src=ed92c7f69324
          t9-zero-parses:
            # | Zero is a successful parse, not a failure: 0n is falsy, and a truthiness
            # | test on the amount turns a valid parse into a refusal.
            description: "Zero é um parse bem-sucedido, não uma falha: 0n é falsy, e um teste de veracidade sobre o valor transforma um parse válido em uma recusa."  # @src=1990c8973b85
          t10-u64-ceiling-is-payable:
            # | 18446744073709.551615 at 6 decimals is exactly u64::MAX base units: the
            # | largest amount a transfer can carry, and it must parse.
            description: "18446744073709.551615 com 6 decimais são exatamente u64::MAX unidades base: o maior valor que uma transferência consegue carregar, e ele precisa passar no parse."  # @src=fdcbbc4f662d
          t11-over-precision-rejected:
            # | A non-zero seventh digit on a 6-decimal mint is unrepresentable. Truncating
            # | or rounding it invents sub-cent money and reconciles wrong forever.
            description: "Um sétimo dígito diferente de zero em um mint de 6 decimais não é representável. Truncar ou arredondar ele inventa dinheiro de sub-centavo e concilia errado para sempre."  # @src=cde38c7770d4
          t12-over-precision-is-per-mint:
            # | Three fraction digits on a 2-decimal mint is over-precise, even though the
            # | same string is fine on USDC.
            description: "Três dígitos de fração em um mint de 2 decimais é precisão demais, mesmo que a mesma string seja válida no USDC."  # @src=dda2b7ed10b5
          t13-one-unit-past-u64:
            # | One base unit above u64::MAX cannot be carried by an SPL transfer, so the
            # | parse refuses it rather than handing the chain an amount that overflows.
            description: "Uma unidade base acima de u64::MAX não pode ser carregada por uma transferência SPL, então o parse recusa em vez de entregar à blockchain um valor que dá overflow."  # @src=24301ee7a631
          t14-negative:
            # | A well-formed amount with a leading minus is refused as negative: a checkout
            # | never charges below zero.
            description: "Um valor bem formado com um sinal de menos na frente é recusado como negative: um checkout nunca cobra abaixo de zero."  # @src=519c7058e4fd
          t15-currency-symbol:
            # | A pasted currency symbol is malformed input, not an amount to be salvaged.
            description: "Um símbolo de moeda colado é entrada malformed, não um valor a ser salvo."  # @src=b238627f6426
          t16-digits-then-garbage:
            # | A string that merely STARTS with digits is malformed; a parse that reads the
            # | leading number and ignores the rest charges 12 for '12abc'.
            description: "Uma string que meramente COMEÇA com dígitos é malformed; um parse que lê o número da frente e ignora o resto cobra 12 por '12abc'."  # @src=23cdb4d2deb6
          t17-empty-field:
            # | An untouched field is empty, a distinct reason from malformed, so the form
            # | can say 'enter an amount'.
            description: "Um campo intocado é empty, um motivo distinto de malformed, para que o formulário consiga dizer 'digite um valor'."  # @src=60761ea183db
          t18-whitespace-only-field:
            # | A field holding only spaces is also empty: trim first, then decide.
            description: "Um campo que só tem espaços também é empty: dê trim primeiro, depois decida."  # @src=c87e5f38ddf4
          t19-bare-decimal-point:
            # | A lone decimal point has no digits on either side: malformed, never zero.
            description: "Um ponto decimal sozinho não tem dígito nenhum dos dois lados: malformed, nunca zero."  # @src=0ce853567607
          t20-negative-precedence:
            # | A leading minus followed by non-digit garbage is malformed, not negative: an
            # | implementation that decides negative from a startsWith('-') check before
            # | confirming the rest is a well-formed decimal misreads it.
            description: "Um menos na frente seguido de lixo que não é dígito é malformed, não negative: uma implementação que decide negative a partir de uma checagem startsWith('-') antes de confirmar que o resto é um decimal bem formado lê errado."  # @src=54efeecf49c1
      check:                      # quiz
        questions:
          m02l1-q1:
            # | You compute a 12,500-USDC transfer in the browser as `amount * 10 ** 6`
            # | using ordinary JavaScript numbers. Small test payments look perfect. What
            # | actually happens at scale?
            prompt: "Você calcula uma transferência de 12,500 USDC no navegador como `amount * 10 ** 6` usando números comuns do JavaScript. Pagamentos de teste pequenos parecem perfeitos. O que acontece de verdade em escala?"  # @src=ab7056f93b7f
            # | Money math must be exact. Base units are integers, and a mint balance can
            # | exceed JavaScript's 2**53 safe-integer ceiling, so any float step can round
            # | a transfer off by cents without any error. Parse the decimal string directly
            # | into a bigint, which is exactly what toBaseUnits does.
            explanation: "Matemática de dinheiro tem que ser exata. Unidades base são inteiros, e o saldo de um mint pode passar do teto de inteiro seguro de 2**53 do JavaScript, então qualquer passo em float pode errar uma transferência por centavos sem nenhum erro. Interprete a string decimal direto para um bigint, que é exatamente o que toBaseUnits faz."  # @src=77819784fc12
            options:                 # source order — keep it
              c:
                # | It throws a TypeError as soon as the product crosses
                # | Number.MAX_SAFE_INTEGER, so the failure surfaces loudly in staging.
                label: "Ele lança um TypeError assim que o produto passa de Number.MAX_SAFE_INTEGER, então a falha aparece em alto e bom som no staging."  # @src=b487221d4443
                # | `10 ** 6` evaluates fine with ordinary numbers and nothing throws at
                # | MAX_SAFE_INTEGER; the bug is silent precision loss, not a raised error.
                feedback: "`10 ** 6` avalia normalmente com números comuns e nada lança em MAX_SAFE_INTEGER; o bug é perda silenciosa de precisão, não um erro levantado."  # @src=e8752cec1b00
              d:
                # | Rounding with Math.round fixes it: the error is always sub-unit, so the
                # | integer is recoverable.
                label: "Arredondar com Math.round resolve: o erro é sempre sub-unitário, então o inteiro é recuperável."  # @src=9da54f70b607
                # | Math.round buys you a passing test suite and a time bomb. Past 2 to the
                # | 53rd a double cannot represent every integer, so the drift becomes whole
                # | base units and there is no nearest-integer to round back to.
                feedback: "Math.round te compra uma suíte de testes passando e uma bomba-relógio. Passando de 2 elevado a 53, um double não consegue representar todo inteiro, então a deriva vira unidades base inteiras e não existe inteiro-mais-próximo para onde arredondar de volta."  # @src=501b66660d8e
              b:
                # | It silently rounds past 2**53, so large transfers send the wrong number
                # | of cents and nothing throws.
                label: "Ele arredonda em silêncio passando de 2**53, então transferências grandes mandam o número errado de centavos e nada lança."  # @src=c0ed416c3a84
                # | Doubles are exact only to 2**53, and the product gets rounded rather
                # | than rejected. A rounding helper cannot repair what a bigint parse would
                # | have prevented.
                feedback: "Doubles são exatos só até 2**53, e o produto é arredondado em vez de rejeitado. Um helper de arredondamento não conserta o que um parse com bigint teria evitado."  # @src=cb09064811c3
              a:
                # | It is fine because JavaScript numbers are 64-bit and cover every USDC
                # | amount exactly.
                label: "Está tudo bem porque os números do JavaScript são de 64 bits e cobrem todo valor de USDC de forma exata."  # @src=38ab7813dd9b
                # | 64-bit doubles are only exact for integers up to 2**53; base-unit values
                # | above that (about 9 billion USDC) start rounding.
                feedback: "Doubles de 64 bits só são exatos para inteiros até 2**53; valores em unidades base acima disso (cerca de 9 bilhões de USDC) começam a arredondar."  # @src=ba445bef521c
          m02l1-q2:
            # | Bob has never held USDC. You want to send him some from transfer-kit. What
            # | must happen first, and who pays for it?
            prompt: "O Bob nunca teve USDC. Você quer mandar um pouco para ele a partir do transfer-kit. O que precisa acontecer primeiro, e quem paga por isso?"  # @src=04cb28bd8e40
            # | An ATA is the deterministic per-(owner, mint) account that holds a token
            # | balance. A first-time holder has none, so the payment transaction (or a
            # | prior one) must create and rent-fund it at the rent-exempt minimum for 165
            # | bytes. Ask the cluster for that number rather than memorizing one: SIMD-0437
            # | is stepping the per-byte rate down, so it differs between mainnet and devnet
            # | today and falls again on each step. That is a real cost and an extra failure
            # | mode on every new customer.
            explanation: "Uma ATA é a conta determinística por (dono, mint) que guarda um saldo de token. Quem tem pela primeira vez não tem nenhuma, então a transação de pagamento (ou uma anterior) precisa criar e custear o rent dela no mínimo isento de aluguel para 165 bytes. Peça esse número ao cluster em vez de decorar um: o SIMD-0437 vem baixando a alíquota por byte em degraus, então ele difere entre mainnet e devnet hoje e cai de novo a cada degrau. Isso é um custo real e um modo de falha a mais em todo cliente novo."  # @src=c04d289233f6
            options:                 # source order — keep it
              c:
                # | His associated token account for the USDC mint must be created and
                # | rent-funded, at whatever getMinimumBalanceForRentExemption(165)
                # | currently returns, by whoever includes the create instruction.
                label: "A conta de token associada dele para o mint do USDC precisa ser criada e ter o rent custeado, no que quer que getMinimumBalanceForRentExemption(165) devolva agora, por quem incluir a instrução de criação."  # @src=3cb0e167ae02
                # | Once per buyer per mint, and it is usually you who funds the rent.
                feedback: "Uma vez por comprador por mint, e normalmente é você quem custeia o rent."  # @src=064120bc458f
              b:
                # | Bob must first call approve on the USDC mint to authorize your wallet as
                # | a delegate, and he signs and pays for that approval transaction before
                # | any transfer to him can succeed.
                label: "O Bob precisa primeiro chamar approve no mint do USDC para autorizar a sua carteira como delegado, e ele assina e paga por essa transação de autorização antes que qualquer transferência para ele possa funcionar."  # @src=6b6647f54128
                # | Approve delegates a balance the signer already holds; a first-time
                # | receiver has nothing to delegate, and receiving needs no authorization
                # | from Bob at all.
                feedback: "Approve delega um saldo que o signatário já tem; quem recebe pela primeira vez não tem nada para delegar, e receber não precisa de autorização nenhuma do Bob."  # @src=2d0ececbd46f
              d:
                # | Bob has to open his own USDC account and fund the rent himself first, so
                # | your checkout has to send him through a wallet flow and wait for him to
                # | finish before it can charge him.
                label: "O Bob tem que abrir a própria conta de USDC e custear o rent ele mesmo primeiro, então o seu checkout tem que mandar ele por um fluxo de carteira e esperar ele terminar antes de conseguir cobrar."  # @src=feda472934fc
                # | Anyone can open an ATA for anyone, and the idempotent create instruction
                # | rides in the same transaction as the transfer. Bob never has to do
                # | anything, which is the whole reason a first-time buyer can pay you in
                # | one scan.
                feedback: "Qualquer um pode abrir uma ATA para qualquer um, e a instrução de criação idempotente viaja na mesma transação que a transferência. O Bob nunca precisa fazer nada, que é a razão inteira de um comprador de primeira viagem conseguir te pagar em um único scan."  # @src=26ad4628db8d
              a:
                # | Nothing extra: the token program credits his wallet address directly, so
                # | the balance simply appears there the moment your transfer lands, the
                # | same way a SOL transfer does.
                label: "Nada a mais: o token program credita o endereço de carteira dele direto, então o saldo simplesmente aparece ali no momento em que a sua transferência aterrissa, do mesmo jeito que uma transferência de SOL faz."  # @src=27935efeb902
                # | A wallet cannot hold an SPL token directly; tokens live in a per-mint
                # | token account, which must exist first.
                feedback: "Uma carteira não consegue guardar um token SPL direto; tokens moram em uma conta de token por mint, que precisa existir primeiro."  # @src=c4f3aea160c2
          m02l1-q3:
            # | Your kit sends with TransferChecked and attaches a reference key. What do
            # | those two choices buy you?
            prompt: "Seu kit manda com TransferChecked e anexa uma reference key. O que essas duas escolhas te compram?"  # @src=2d7c0193df31
            # | TransferChecked pins the mint and decimals so a mismatched transfer is
            # | rejected rather than silently mis-sent. A reference key is an extra
            # | non-signer account you include purely so reconciliation can locate the
            # | payment later by searching signatures for that key, the pattern the whole
            # | back office will lean on.
            explanation: "TransferChecked fixa o mint e os decimais para que uma transferência divergente seja rejeitada em vez de mandada errada em silêncio. Uma reference key é uma conta extra não signatária que você inclui puramente para que a conciliação consiga localizar o pagamento depois, buscando signatures por essa chave, o padrão em que o back office inteiro vai se apoiar."  # @src=31775c6c8db5
            options:                 # source order — keep it
              b:
                # | TransferChecked encrypts the transfer amount on-chain, and the reference
                # | key is the payer's signature over the transfer.
                label: "TransferChecked criptografa o valor da transferência on-chain, e a reference key é a signature do payer sobre a transferência."  # @src=69a58874551b
                # | TransferChecked does not encrypt anything (that is a
                # | confidential-transfer extension), and a reference key is an unrelated
                # | non-signer marker, not a signature.
                feedback: "TransferChecked não criptografa nada (isso é uma extensão de confidential transfer), e uma reference key é um marcador não signatário sem relação com isso, não uma signature."  # @src=7dd702262420
              c:
                # | TransferChecked is required only for Token-2022 mints, so a classic USDC
                # | send can skip it, and the reference key names the account that pays the
                # | transaction fee instead of the sender's wallet.
                label: "TransferChecked só é obrigatório para mints Token-2022, então um envio clássico de USDC pode pular, e a reference key nomeia a conta que paga a taxa da transação em vez da carteira de quem envia."  # @src=d3b171dd43b6
                # | TransferChecked works for classic Token mints too, and the fee payer is
                # | whichever signer the transaction names as fee payer, never a reference
                # | key.
                feedback: "TransferChecked funciona para mints do Token clássico também, e o fee payer é o signatário que a transação nomear como fee payer, nunca uma reference key."  # @src=77d0d6431b4c
              a:
                # | TransferChecked verifies the mint and decimals inside the instruction,
                # | and the reference key is a non-signer address you attach so
                # | reconciliation can find the payment later.
                label: "TransferChecked verifica o mint e os decimais dentro da instrução, e a reference key é um endereço não signatário que você anexa para que a conciliação consiga achar o pagamento depois."  # @src=a30623023335
                # | Account keys are indexed, which is why the marker is findable and also
                # | why it isn't secret; anyone can attach the same one, and the fields are
                # | what decide.
                feedback: "As chaves de conta são indexadas, que é por que o marcador é encontrável e também por que ele não é secreto; qualquer um pode anexar o mesmo, e são os campos que decidem."  # @src=3bc195344d1a
              d:
                # | TransferChecked proves the sender actually owns the funds, and the
                # | reference key is a private marker your checkout alone knows, so a match
                # | proves the payment came from your form.
                label: "TransferChecked prova que quem envia de fato é dono dos fundos, e a reference key é um marcador privado que só o seu checkout conhece, então uma correspondência prova que o pagamento veio do seu formulário."  # @src=93bf229dc0f5
                # | A reference key is an ordinary account address riding in a public
                # | transaction, so anyone reading the ledger can see it and reuse it. It
                # | tells you where to look for a payment; the amount, mint and destination
                # | are what tell you the payment is yours.
                feedback: "Uma reference key é um endereço de conta comum viajando em uma transação pública, então qualquer um que leia o livro-razão consegue ver e reusar. Ela te diz onde procurar um pagamento; o valor, o mint e o destino é que te dizem que o pagamento é seu."  # @src=3bd7fc831c33
          m02l1-q4:
            # | Your send times out with no confirmation. You are not sure it landed. What
            # | is the safe move?
            prompt: "O seu envio dá timeout sem confirmação. Você não tem certeza se ele aterrissou. Qual é o movimento seguro?"  # @src=01da5e191af0
            # | The same signed transaction always hashes to the same signature, and the
            # | network rejects a duplicate signature, so resubmitting identical bytes is
            # | idempotent and lands at most once while the blockhash is valid (~150
            # | blocks). Send with maxRetries 0 and manage retries yourself with the same
            # | bytes; rebuild only after the blockhash truly expires and
            # | getSignatureStatuses (with searchTransactionHistory) confirms the original
            # | never landed.
            explanation: "A mesma transação assinada sempre gera a mesma signature no hash, e a rede rejeita uma signature duplicada, então reenviar bytes idênticos é idempotente e aterrissa no máximo uma vez enquanto o blockhash for válido (~150 blocos). Mande com maxRetries 0 e gerencie os retries você mesmo com os mesmos bytes; só remonte depois que o blockhash expirar de verdade e o getSignatureStatuses (com searchTransactionHistory) confirmar que o original nunca aterrissou."  # @src=119b7aee11b6
            options:                 # source order — keep it
              b:
                # | Resubmit the exact same signed transaction; identical bytes produce the
                # | same signature, so it can land at most once within the ~150-block
                # | window.
                label: "Reenvie exatamente a mesma transação assinada; bytes idênticos produzem a mesma signature, então ela pode aterrissar no máximo uma vez dentro da janela de ~150 blocos."  # @src=8367317a2712
                # | Duplicate signatures are rejected by the network, which is what makes
                # | resending idempotent; the guarantee dies with the blockhash, and only
                # | after it expires is rebuilding safe.
                feedback: "Signatures duplicadas são rejeitadas pela rede, que é o que torna o reenvio idempotente; a garantia morre com o blockhash, e só depois que ele expira é que remontar é seguro."  # @src=439e7f826559
              a:
                # | Rebuild the payment with a fresh blockhash and send again; a new
                # | signature guarantees it cannot double-charge.
                label: "Remonte o pagamento com um blockhash novo e mande de novo; uma signature nova garante que não tem como cobrar em dobro."  # @src=fb35aa6d1960
                # | A fresh blockhash produces a NEW signature, so if the first one also
                # | lands you have paid twice; this is the double-pay trap.
                feedback: "Um blockhash novo produz uma signature NOVA, então se a primeira também aterrissar você pagou duas vezes; esta é a armadilha do pagamento duplo."  # @src=367cfad50775
              c:
                # | Wait for the ~150-block window to fully expire and then send a brand-new
                # | transaction to be safe.
                label: "Espere a janela de ~150 blocos expirar por completo e só então mande uma transação totalmente nova, por segurança."  # @src=9ac945a19b1c
                # | Rebuilding after verified expiry is the lesson's own fallback, but
                # | expiry alone is not the whole check: if the first send actually landed
                # | during the window, a fresh signature pays the customer's bill twice.
                # | Confirm the original never landed before rebuilding — and notice what
                # | this answer costs even then: you sit out the whole window when resending
                # | the identical bytes immediately is just as safe and far faster.
                feedback: "Remontar depois de uma expiração verificada é o fallback da própria lição, mas expiração sozinha não é a checagem inteira: se o primeiro envio de fato aterrissou durante a janela, uma signature nova paga a fatura do cliente duas vezes. Confirme que o original nunca aterrissou antes de remontar — e repare no que esta resposta custa mesmo assim: você fica de fora da janela inteira quando reenviar os bytes idênticos na hora é igualmente seguro e muito mais rápido."  # @src=3b1270c0c0a7
              d:
                # | Call getSignatureStatuses once; a null there means the payment did not
                # | land, so rebuild against a fresh blockhash and send that instead.
                label: "Chame getSignatureStatuses uma vez; um null ali quer dizer que o pagamento não aterrissou, então remonte contra um blockhash novo e mande esse no lugar."  # @src=44ab5d81bd59
                # | A null is a snapshot, and while the blockhash is still alive your
                # | original bytes can land the second after you read it. Expiry has to be
                # | checked first, and the status lookup needs searchTransactionHistory
                # | before its null means anything.
                feedback: "Um null é um retrato instantâneo, e enquanto o blockhash ainda estiver vivo os seus bytes originais podem aterrissar no segundo depois de você ler. A expiração tem que ser checada primeiro, e a consulta de status precisa de searchTransactionHistory antes de o null dela querer dizer alguma coisa."  # @src=08cb485f2a22
  m02-l2:
    # | The 2026 stablecoin roster: PYUSD, Token-2022, and how USDC travels
    title: "O elenco de stablecoins de 2026: PYUSD, Token-2022 e como o USDC viaja"  # @src=5c73d748c17b
    blocks:
      check:                      # quiz
        questions:
          m02l2-q1:
            # | A customer pays in PYUSD and your kit's send is refused before it ever
            # | reaches the chain. What is the actual cause?
            prompt: "Um cliente paga em PYUSD e o envio do seu kit é recusado antes mesmo de chegar na blockchain. Qual é a causa real?"  # @src=69177b148381
            # | A mint is owned by exactly one token program, and PYUSD is a Token-2022
            # | mint. An instruction built for the classic Token program targets the wrong
            # | program id, so it cannot succeed. The fix is detectTokenProgram: read the
            # | mint's owner and route the transfer to it.
            explanation: "Um mint tem exatamente um token program como dono, e o PYUSD é um mint Token-2022. Uma instrução montada para o Token program clássico mira no id de programa errado, então ela não tem como dar certo. O conserto é detectTokenProgram: leia o dono do mint e roteie a transferência para ele."  # @src=ae573c45fbac
            options:                 # source order — keep it
              a:
                # | PYUSD uses a different decimals count than USDC, so the base-unit amount
                # | your kit computes overflows the u64 the transfer instruction expects and
                # | the build throws before it sends.
                label: "O PYUSD usa uma contagem de decimais diferente da do USDC, então o valor em unidades base que o seu kit calcula estoura o u64 que a instrução de transferência espera e a montagem lança erro antes de mandar."  # @src=5c83b48efaf3
                # | PYUSD is also 6 decimals, and overflow is not the issue; the transfer
                # | fails because it is aimed at the wrong owner program.
                feedback: "O PYUSD também tem 6 decimais, e o estouro não é o problema; a transferência falha porque está mirada no programa dono errado."  # @src=7d37ce45164e
              b:
                # | PYUSD's transferFeeConfig makes a fee account and a withheld-amount
                # | argument mandatory on every send, and your TransferChecked supplies
                # | neither, so the program rejects the instruction.
                label: "O transferFeeConfig do PYUSD torna obrigatórios uma conta de taxa e um argumento de valor retido em todo envio, e o seu TransferChecked não fornece nenhum dos dois, então o programa rejeita a instrução."  # @src=8a16e14fc73b
                # | TransferChecked takes no fee account or withheld-amount argument, and
                # | PYUSD's configured fee is currently 0; the send fails because the mint
                # | is owned by a different program.
                feedback: "O TransferChecked não recebe conta de taxa nem argumento de valor retido, e a taxa configurada do PYUSD está atualmente em 0; o envio falha porque o mint tem um programa diferente como dono."  # @src=e6d4bffe125c
              d:
                # | The recipient holds no PYUSD account yet, and the kit's idempotent
                # | create instruction does not open one on a Token-2022 mint.
                label: "O destinatário ainda não tem conta de PYUSD, e a instrução de criação idempotente do kit não abre uma em um mint Token-2022."  # @src=c8ff6fd6898e
                # | The idempotent create works on both programs once it is told which one
                # | owns the mint, and a missing account is the case it exists to absorb.
                # | The refusal fires earlier than that, on the mint's owner field.
                feedback: "A criação idempotente funciona nos dois programas assim que ela é informada de qual deles é dono do mint, e uma conta faltando é justamente o caso que ela existe para absorver. A recusa dispara antes disso, no campo de dono do mint."  # @src=0d26370cc427
              c:
                # | PYUSD is owned by the Token-2022 program, so the transfer must be built
                # | against the mint's owner program, not a hardcoded classic Token program.
                label: "O PYUSD tem o programa Token-2022 como dono, então a transferência precisa ser montada contra o programa dono do mint, não contra um Token program clássico cravado no código."  # @src=c5060bf6ad15
                # | The owner is a field you read at runtime, not a symbol you look up: a
                # | hardcoded allowlist stays right until the next mint arrives.
                feedback: "O dono é um campo que você lê em tempo de execução, não um símbolo que você consulta: uma allowlist cravada no código continua certa até o próximo mint chegar."  # @src=1cef3b11ed1a
          m02l2-q2:
            # | You read PYUSD's mint live and see a permanentDelegate configured. What does
            # | that mean for you as the merchant integrating it?
            prompt: "Você lê o mint do PYUSD ao vivo e vê um permanentDelegate configurado. O que isso significa para você, o lojista que está integrando ele?"  # @src=cfefa2fedf58
            # | A permanent delegate is a Token-2022 extension granting a standing authority
            # | (here, the issuer) power to move tokens from any holder, effectively a
            # | seizure capability. It is a property of the mint you accept knowingly; your
            # | integration does not add or remove it, but a merchant should understand it
            # | before pricing in the asset.
            explanation: "Um delegado permanente é uma extensão do Token-2022 que concede a uma autoridade permanente (aqui, o emissor) o poder de mover tokens de qualquer holder, na prática uma capacidade de confisco. É uma propriedade do mint que você aceita conscientemente; a sua integração não adiciona nem remove ela, mas um lojista deveria entender isso antes de precificar no ativo."  # @src=fe92757e48d1
            options:                 # source order — keep it
              c:
                # | The permanent delegate freezes every PYUSD balance by default, so each
                # | holder's token account stays frozen until the issuer thaws it and signs
                # | off on that individual spend.
                label: "O delegado permanente congela todo saldo de PYUSD por padrão, então a conta de token de cada holder fica congelada até o emissor descongelar ela e aprovar aquele gasto individual."  # @src=f1159d91a9fc
                # | That describes a frozen default-account state, not a permanent delegate;
                # | ordinary PYUSD balances are spendable and need no per-spend issuer
                # | approval.
                feedback: "Isso descreve um estado padrão de conta congelada, não um delegado permanente; saldos comuns de PYUSD são gastáveis e não precisam de aprovação do emissor a cada gasto."  # @src=c3a348595430
              a:
                # | The issuer holds a standing delegate that can move PYUSD out of any
                # | holder's account, a seizure power set by issuer policy that your
                # | transfer does not change.
                label: "O emissor detém um delegado permanente que consegue tirar PYUSD da conta de qualquer holder, um poder de confisco definido por política do emissor que a sua transferência não muda."  # @src=997bf2223bde
                # | Because the authority lives on the mint itself, every account of that
                # | mint is in reach and no per-account setting opts out; that is a risk to
                # | price in, not a defect to integrate around.
                feedback: "Porque a autoridade mora no próprio mint, toda conta desse mint está ao alcance e nenhuma configuração por conta escapa disso; isso é um risco para precificar, não um defeito para contornar na integração."  # @src=ea3d54761342
              d:
                # | The delegate reaches the buyer's wallet but stops at your merchant
                # | account, so funds you have received are out of its scope.
                label: "O delegado alcança a carteira do comprador mas para na sua conta de lojista, então os fundos que você recebeu estão fora do escopo dele."  # @src=046afff2b8a9
                # | The authority sits on the mint, so it reaches whichever account holds
                # | that mint, yours included. Receiving PYUSD puts your own balance inside
                # | the same reach the buyer's was in.
                feedback: "A autoridade fica no mint, então ela alcança qualquer conta que tenha esse mint, a sua inclusive. Receber PYUSD coloca o seu próprio saldo dentro do mesmo alcance em que o do comprador estava."  # @src=3b222abf1812
              b:
                # | Every PYUSD transfer you send is automatically co-signed by the
                # | delegate, adding a second required signature to each payment.
                label: "Toda transferência de PYUSD que você manda é automaticamente cossinada pelo delegado, adicionando uma segunda signature exigida a cada pagamento."  # @src=a4ffaa1723af
                # | The permanent delegate is a standing authority the issuer can use, not
                # | an automatic co-signer on ordinary transfers.
                feedback: "O delegado permanente é uma autoridade permanente que o emissor pode usar, não um cossignatário automático em transferências comuns."  # @src=bcff91cb27ee
          m02l2-q3:
            # | PYUSD's mint carries a transferFeeConfig extension. How should your kit
            # | decide what fee, if any, applies when you send it?
            prompt: "O mint do PYUSD carrega uma extensão transferFeeConfig. Como o seu kit deveria decidir qual taxa, se alguma, se aplica quando você manda ele?"  # @src=65fba6999980
            # | The presence of transferFeeConfig does not tell you the rate. Read the basis
            # | points live from the mint, because the fee can be nonzero and can be changed
            # | by its authority. PYUSD's is 0 today, but reading it is the only
            # | integration-safe habit, which is exactly why the lab reads rather than
            # | asserts it.
            explanation: "A presença do transferFeeConfig não te diz a alíquota. Leia os centésimos de ponto percentual ao vivo a partir do mint, porque a taxa pode ser diferente de zero e pode ser mudada pela autoridade dela. A do PYUSD está em 0 hoje, mas ler é o único hábito seguro para integração, que é exatamente por que o lab lê em vez de afirmar."  # @src=3520780ac164
            options:                 # source order — keep it
              d:
                # | Read the basis points once at startup and cache them for the process
                # | lifetime, since a fee change typically waits for an epoch boundary.
                label: "Leia os centésimos de ponto percentual uma vez na inicialização e cacheie eles pelo tempo de vida do processo, já que uma mudança de taxa tipicamente espera uma virada de epoch."  # @src=d32d2e1ffbf4
                # | An epoch boundary is roughly a day and a half at the current slot time,
                # | and a checkout process outlives many of them. Caching for the life of
                # | the process is the same stale-rate bug, just slower to show up.
                feedback: "Uma virada de epoch é mais ou menos um dia e meio no tempo de slot atual, e um processo de checkout sobrevive a muitas delas. Cachear pela vida do processo é o mesmo bug de alíquota velha, só mais lento para aparecer."  # @src=47de430e73bd
              c:
                # | Ignore it as a sender: any Token-2022 transfer fee is charged to the
                # | recipient as a separate deduction after settlement, so the amount you
                # | send and the amount invoiced always match.
                label: "Ignore isso como remetente: qualquer taxa de transferência do Token-2022 é cobrada do destinatário como uma dedução separada depois da liquidação, então o valor que você manda e o valor faturado sempre batem."  # @src=c0f34926e8e1
                # | A transfer fee is withheld from the transferred amount and is very much
                # | the sender's concern; you cannot ignore it.
                feedback: "Uma taxa de transferência é retida do valor transferido e é muito sim problema do remetente; você não pode ignorar ela."  # @src=e5cd9640fd18
              b:
                # | Read the current basis points from the mint account at runtime, because
                # | a configured fee can be nonzero and can change; PYUSD's is currently 0.
                label: "Leia os centésimos de ponto percentual atuais da conta do mint em tempo de execução, porque uma taxa configurada pode ser diferente de zero e pode mudar; a do PYUSD está atualmente em 0."  # @src=152a583c08c2
                # | Reading it once at boot is the same bug slowed down; the rate can move
                # | between your read and the transfer that pays it.
                feedback: "Ler uma vez no boot é o mesmo bug em câmera lenta; a alíquota pode se mexer entre a sua leitura e a transferência que paga ela."  # @src=6a0955708252
              a:
                # | Assume the rate published in the issuer's docs, because a Token-2022
                # | transferFeeConfig is written at mint creation and its basis points are
                # | immutable afterward, so one constant in the kit covers every send.
                label: "Assuma a alíquota publicada na documentação do emissor, porque um transferFeeConfig do Token-2022 é escrito na criação do mint e os centésimos de ponto percentual dele são imutáveis depois disso, então uma constante no kit cobre todo envio."  # @src=81b2dd9ac36f
                # | The basis points are not immutable: a Token-2022 fee can be updated by
                # | its fee authority, so a constant copied from docs can be wrong tomorrow.
                feedback: "Os centésimos de ponto percentual não são imutáveis: uma taxa do Token-2022 pode ser atualizada pela autoridade de taxa dela, então uma constante copiada da documentação pode estar errada amanhã."  # @src=fb489d0d26bb
          m02l2-q4:
            # | A buyer bridges USDC from Ethereum to pay you in the store. Using CCTP, how
            # | does that USDC arrive on Solana and how fast?
            prompt: "Um comprador traz USDC da Ethereum por uma ponte para te pagar na loja. Usando CCTP, como esse USDC chega na Solana e com que rapidez?"  # @src=ee5caa069d7a
            # | CCTP is burn-and-mint: the USDC is burned on the source chain and freshly,
            # | natively minted on the destination, so there is no wrapped IOU and no pool.
            # | Solana is domain 5. Fast Transfer timing is keyed to the SOURCE chain,
            # | because what is being waited on is the burn becoming irreversible where it
            # | happened — the widely-quoted ~8 seconds is Solana as source, and a buyer
            # | bridging in from Ethereum waits longer than that while still beating
            # | Ethereum's ~15 to 19 minute standard path. Every one of these numbers is a
            # | per-source-chain row in Circle's table, never a property of CCTP: standard
            # | out of Solana is ~25 seconds against Ethereum's 15 to 19 minutes. Quote the
            # | row for your buyers' source chain.
            explanation: "O CCTP é burn-and-mint: o USDC é queimado na blockchain de origem e cunhado de forma nova e nativa no destino, então não existe IOU wrapped nem pool. A Solana é o domínio 5. O tempo do Fast Transfer é atrelado à blockchain de ORIGEM, porque o que está sendo esperado é a queima se tornar irreversível onde ela aconteceu — os amplamente citados ~8 segundos são a Solana como origem, e um comprador vindo da Ethereum espera mais que isso e ainda assim ganha do caminho padrão de ~15 a 19 minutos da Ethereum. Cada um desses números é uma linha por blockchain de origem na tabela da Circle, nunca uma propriedade do CCTP: o padrão saindo da Solana é ~25 segundos contra os 15 a 19 minutos da Ethereum. Cite a linha da blockchain de origem dos seus compradores."  # @src=e5db123f1339
            options:                 # source order — keep it
              c:
                # | It is burned on the source domain and natively minted on Solana (domain
                # | 5), with a Fast Transfer landing well inside the standard route's
                # | window.
                label: "Ele é queimado no domínio de origem e cunhado nativamente na Solana (domínio 5), com um Fast Transfer aterrissando bem dentro da janela da rota padrão."  # @src=9289e0c66354
                # | Burn-and-mint means what arrives is the canonical asset, with no pool
                # | behind it to run dry. Fast Transfer waits on the SOURCE chain's
                # | finality, so an Ethereum-sourced transfer is slower than the ~8 seconds
                # | quoted for Solana-as-source, and the standard route out of Ethereum
                # | still runs 15 to 19 minutes.
                feedback: "Burn-and-mint quer dizer que o que chega é o ativo canônico, sem nenhum pool atrás dele para secar. O Fast Transfer espera a finality da blockchain de ORIGEM, então uma transferência com origem na Ethereum é mais lenta que os ~8 segundos citados para a Solana como origem, e a rota padrão saindo da Ethereum ainda leva 15 a 19 minutos."  # @src=4212dda14434
              d:
                # | It is burned on Ethereum and minted natively on Solana in about 8
                # | seconds, since Solana's finality is what a Fast Transfer waits on.
                label: "Ele é queimado na Ethereum e cunhado nativamente na Solana em cerca de 8 segundos, já que a finality da Solana é o que um Fast Transfer espera."  # @src=f03c0f2b4388
                # | The mechanism is right and the direction is backwards, which is how most
                # | summaries of CCTP get it wrong. What has to become irreversible is the
                # | burn, and the burn happened on Ethereum, so an inbound buyer waits out
                # | Ethereum.
                feedback: "O mecanismo está certo e a direção está ao contrário, que é como a maioria dos resumos do CCTP erra. O que tem que se tornar irreversível é a queima, e a queima aconteceu na Ethereum, então um comprador que está chegando espera a Ethereum passar."  # @src=f341836806ae
              a:
                # | It is locked in a pool on Ethereum and a wrapped IOU token is minted on
                # | Solana, redeemable back later.
                label: "Ele é travado num pool na Ethereum e um token IOU wrapped é cunhado na Solana, resgatável de volta depois."  # @src=67da60112265
                # | That is the lock-and-wrap bridge model; CCTP does not use pools or
                # | wrapped IOUs, it burns and natively mints.
                feedback: "Esse é o modelo de ponte lock-and-wrap; o CCTP não usa pools nem IOUs wrapped, ele queima e cunha nativamente."  # @src=bb4fdbbebe85
              b:
                # | It moves over a shared liquidity network in roughly 15 to 19 minutes,
                # | with the depth of that shared pool on each side setting the pace.
                label: "Ele se move por uma rede de liquidez compartilhada em uns 15 a 19 minutos, com a profundidade desse pool compartilhado de cada lado ditando o ritmo."  # @src=9673d89721f6
                # | The number is in the right neighborhood for this route and the mechanism
                # | is wrong, which is the trap: CCTP has no shared pool to be deep or
                # | shallow, it burns and natively mints. And that number is Ethereum's
                # | standard-route row, not a CCTP constant — with Solana as the source,
                # | standard is 32 confirmations, about 25 seconds.
                feedback: "O número está na vizinhança certa para esta rota e o mecanismo está errado, que é a armadilha: o CCTP não tem pool compartilhado para ser fundo ou raso, ele queima e cunha nativamente. E esse número é a linha da rota padrão da Ethereum, não uma constante do CCTP — com a Solana como origem, o padrão é 32 confirmações, cerca de 25 segundos."  # @src=ca313f3432ea
  m03-l1:
    # | Checkout with a QR: the Solana Pay spec, live
    title: "Checkout com um QR: a spec do Solana Pay, ao vivo"  # @src=f247b9719ca3
    blocks:
      check-overview:                      # quiz
        questions:
          q1:
            # | You build a Solana Pay transfer request to charge 12.50 USDC and, because
            # | USDC has 6 decimals, you write amount=12500000 in the URL. Your test wallet
            # | asks the customer to pay 12,500,000 USDC. What went wrong?
            prompt: "Você constrói um transfer request do Solana Pay para cobrar 12.50 USDC e, porque o USDC tem 6 decimais, você escreve amount=12500000 na URL. A sua carteira de teste pede ao cliente para pagar 12,500,000 USDC. O que deu errado?"  # @src=7800fe867052
            # | The Solana Pay spec defines amount as a UI (decimal) quantity of the token,
            # | and the wallet multiplies by the mint's decimals to get base units. Writing
            # | base units in the URL charges the customer that many whole tokens. This is
            # | the single most common Solana Pay checkout bug.
            explanation: "A spec do Solana Pay define amount como uma quantidade de UI (decimal) do token, e a carteira multiplica pelas casas decimais do mint para chegar às unidades base. Escrever unidades base na URL cobra do cliente essa quantidade de tokens inteiros. Este é o bug de checkout do Solana Pay mais comum que existe."  # @src=7213e1188f90
            options:                 # source order — keep it
              b:
                # | validateTransfer rejects base-unit amounts, so you have to call
                # | findReference first and let it normalize the URL's decimals.
                label: "validateTransfer rejeita valores em unidades base, então você tem que chamar findReference primeiro e deixar ele normalizar os decimais da URL."  # @src=eb4d4d49c3d3
                # | validateTransfer runs later, server-side, against the settled transfer;
                # | it is not why the URL charged the wrong amount.
                feedback: "validateTransfer roda depois, do lado do servidor, contra a transferência liquidada; não é por causa dele que a URL cobrou o valor errado."  # @src=2d4710be554d
              c:
                # | A Solana Pay amount is in decimal token units, not base units: write
                # | amount=12.5 and the wallet applies mint decimals.
                label: "Um amount do Solana Pay é em unidades decimais do token, não unidades base: escreva amount=12.5 e a carteira aplica as casas decimais do mint."  # @src=b3bac01d80d7
                # | The URL carries a human quantity because the wallet scales by the mint's
                # | decimals; one layer down, the instruction still wants base units.
                feedback: "A URL carrega uma quantidade humana porque a carteira escala pelas casas decimais do mint; uma camada abaixo, a instrução ainda quer unidades base."  # @src=d48d4dbb0556
              d:
                # | Your test wallet is scaling by the mint's decimals a second time; a
                # | compliant wallet would charge the customer 12.5 USDC.
                label: "A sua carteira de teste está escalando pelas casas decimais do mint uma segunda vez; uma carteira compatível cobraria 12.5 USDC do cliente."  # @src=fb18a8406b59
                # | The wallet scaled exactly once, which is what the spec asks of it. The
                # | doubling happened in your URL, where you converted to base units before
                # | handing the number to a field that wants human units.
                feedback: "A carteira escalou exatamente uma vez, que é o que a spec pede dela. A duplicação aconteceu na sua URL, onde você converteu para unidades base antes de entregar o número a um campo que quer unidades humanas."  # @src=22d65e9a71a5
              a:
                # | The spl-token parameter has to come before amount in the query string,
                # | otherwise the wallet falls back to native SOL and scales your number by
                # | nine decimals instead of six.
                label: "O parâmetro spl-token tem que vir antes de amount na query string, senão a carteira cai de volta para SOL nativo e escala o seu número por nove casas decimais em vez de seis."  # @src=3dd7b56421fa
                # | Query-parameter order is irrelevant to how the amount is interpreted;
                # | the mint is set by spl-token wherever it appears, and there is no silent
                # | SOL fallback.
                feedback: "A ordem dos parâmetros de query é irrelevante para como o amount é interpretado; o mint é definido por spl-token onde quer que ele apareça, e não existe fallback silencioso para SOL."  # @src=900c4b24f9cc
          q2:
            # | A teammate puts the customer's email in the checkout URL's `memo` and the
            # | SKU in `message`, reasoning that both are just labels the wallet passes
            # | along. What is wrong with that?
            prompt: "Um colega de time põe o e-mail do cliente no `memo` da URL de checkout e o SKU em `message`, raciocinando que os dois são só rótulos que a carteira repassa. O que está errado nisso?"  # @src=5e6f757a7a43
            # | `message` and `memo` sound alike and run in opposite directions. `message`
            # | is display-only: the wallet shows it at approval time and it never touches
            # | the chain. `memo` is written into the transaction by the memo program, so it
            # | settles publicly and permanently beside the payment. Human-facing text goes
            # | in `message`, reconciliation keys go in `memo`, and personal data goes in
            # | neither.
            explanation: "`message` e `memo` soam parecidos e correm em direções opostas. `message` é só de exibição: a carteira mostra ele na hora da aprovação e ele nunca toca na blockchain. `memo` é escrito na transação pelo memo program, então ele liquida de forma pública e permanente ao lado do pagamento. Texto voltado ao humano vai em `message`, chaves de conciliação vão em `memo`, e dado pessoal não vai em nenhum dos dois."  # @src=88522bb6d34e
            options:                 # source order — keep it
              d:
                # | The SKU is misplaced, but a memo is readable by the payer and the payee
                # | alone, so the customer's email stays between them.
                label: "O SKU está no lugar errado, mas um memo é legível só pelo pagador e pelo recebedor, então o e-mail do cliente fica entre eles."  # @src=e4f2b75445c1
                # | Nothing on this ledger is scoped to the parties. The same
                # | unauthenticated RPC read you ran in module 1 returns a stranger's memo,
                # | which is why the rule is to put nothing in one you would not print on a
                # | public receipt.
                feedback: "Nada neste livro-razão é escopado às partes. A mesma leitura de RPC não autenticada que você rodou no módulo 1 devolve o memo de um estranho, que é por isso que a regra é não pôr em um deles nada que você não imprimiria num recibo público."  # @src=6d0ced6974cf
              b:
                # | The two are simply swapped: `message` is what settles on-chain, and
                # | `memo` is the one the customer sees and the wallet discards.
                label: "Os dois estão simplesmente trocados: `message` é o que liquida on-chain, e `memo` é o que o cliente vê e a carteira descarta."  # @src=6d85b9c05975
                # | The direction is backwards. The wallet writes `memo` into the
                # | transaction through the memo program, while `message` is rendered for
                # | the human approving and then discarded.
                feedback: "A direção está invertida. A carteira escreve `memo` na transação através do memo program, enquanto `message` é renderizado para o humano que aprova e depois descartado."  # @src=54ab7af88142
              a:
                # | `memo` settles on-chain in public, so the email is exposed forever, and
                # | `message` is gone once the customer approves.
                label: "`memo` liquida on-chain em público, então o e-mail fica exposto para sempre, e `message` some assim que o cliente aprova."  # @src=b3abefff3cf2
                # | Both halves cost you something: a public ledger entry you cannot
                # | retract, and a SKU that never leaves the approval screen, so the sale
                # | lands with nothing to reconcile against.
                feedback: "As duas metades te custam alguma coisa: uma entrada de livro-razão pública que você não consegue retratar, e um SKU que nunca sai da tela de aprovação, então a venda aterrissa sem nada contra o que conciliar."  # @src=dbc746aa016e
              c:
                # | Nothing is wrong, because both are query parameters the wallet renders
                # | on its approval screen, and a transfer request writes neither of them
                # | into the transaction it builds.
                label: "Nada está errado, porque os dois são parâmetros de query que a carteira renderiza na tela de aprovação dela, e um transfer request não escreve nenhum dos dois na transação que ele constrói."  # @src=fdabb5355c6b
                # | A transfer request does write one of them: `memo` becomes a memo-program
                # | instruction riding beside the transfer, which is how a SKU can still be
                # | read off the chain months later.
                feedback: "Um transfer request escreve sim um deles: `memo` vira uma instrução do memo program viajando ao lado da transferência, que é como um SKU ainda consegue ser lido da blockchain meses depois."  # @src=a732929be9f3
      check-lab:                      # quiz
        questions:
          q3:
            # | Your checkout page shows the QR. Server-side, how does your watcher learn
            # | the customer actually paid, and what does it match on?
            prompt: "A sua página de checkout mostra o QR. Do lado do servidor, como o seu watcher fica sabendo que o cliente de fato pagou, e com o que ele casa?"  # @src=4cb44943273f
            # | You chose the reference key before the payment existed, so you can search
            # | for a transfer carrying it. watchReference opens a WebSocket subscription
            # | that fires when a matching transfer appears, and validateTransfer then
            # | confirms the amount, recipient, and mint are what you expected. The browser
            # | is never the source of truth.
            explanation: "Você escolheu a reference key antes de o pagamento existir, então você consegue buscar uma transferência que a carregue. watchReference abre uma inscrição de WebSocket que dispara quando uma transferência correspondente aparece, e validateTransfer então confirma que o valor, o destinatário e o mint são o que você esperava. O navegador nunca é a fonte da verdade."  # @src=544086af04ca
            options:                 # source order — keep it
              a:
                # | It trusts the wallet's success callback in the browser and records the
                # | sale as soon as the page reports done.
                label: "Ele confia no callback de sucesso da carteira no navegador e registra a venda assim que a página reporta concluído."  # @src=f2237a3fe2ae
                # | Frontend confirmations are spoofable; trusting the browser is the exact
                # | anti-pattern the back-office module (m04) exists to fix.
                feedback: "Confirmações de frontend são falsificáveis; confiar no navegador é exatamente o anti-padrão que o módulo de back office (m04) existe para consertar."  # @src=7a010817db55
              b:
                # | It subscribes with watchReference (a WebSocket subscription) on the
                # | reference key you embedded, then confirms the transfer with
                # | validateTransfer.
                label: "Ele se inscreve com watchReference (uma inscrição de WebSocket) na reference key que você embutiu, e depois confirma a transferência com validateTransfer."  # @src=66b18d937b0d
                # | A subscription only proves that something carrying your key landed;
                # | amount, mint, and payee are still yours to check against the order.
                feedback: "Uma inscrição só prova que algo carregando a sua chave aterrissou; valor, mint e recebedor continuam sendo seus para checar contra o pedido."  # @src=502a6cf2944f
              c:
                # | It periodically re-reads the QR image and decodes the resulting
                # | signature once the wallet stamps it back onto the code.
                label: "Ele relê periodicamente a imagem do QR e decodifica a signature resultante assim que a carteira carimba ela de volta no código."  # @src=6929209cebd3
                # | The QR is a static payment request; the signature is never written back
                # | to the image. Detection happens on-chain by reference, not by re-reading
                # | the QR.
                feedback: "O QR é uma solicitação de pagamento estática; a signature nunca é escrita de volta na imagem. A detecção acontece on-chain pela reference, não relendo o QR."  # @src=137d58a0829f
              d:
                # | It arms a watchReference subscription on the reference key and books the
                # | sale the moment it resolves, since only a matching transfer can resolve
                # | it.
                label: "Ele arma uma inscrição watchReference na reference key e contabiliza a venda no momento em que ela resolve, já que só uma transferência correspondente consegue resolver ela."  # @src=f0e41e589e62
                # | The subscription half is right and the booking is premature. Resolving
                # | proves a transaction mentioning your key landed, and a reference is a
                # | public account key anyone can attach, so validateTransfer is what turns
                # | a doorbell into a payment.
                feedback: "A metade da inscrição está certa e a contabilização é prematura. Resolver prova que uma transação mencionando a sua chave aterrissou, e uma reference é uma chave de conta pública que qualquer um consegue anexar, então validateTransfer é o que transforma uma campainha em um pagamento."  # @src=433c611800f7
          q4:
            # | You mint a fresh random 32-byte key for every checkout, before anyone has
            # | paid a cent. Every settled payment already carries a globally unique id of
            # | its own. So why bother with the extra key?
            prompt: "Você cunha uma chave aleatória nova de 32 bytes para todo checkout, antes de alguém ter pago um centavo. Todo pagamento liquidado já carrega um id globalmente único próprio. Então por que se dar ao trabalho da chave extra?"  # @src=d3ecd579edc0
            # | The signature only exists after the payment lands, so you cannot
            # | pre-register it against an order. The reference is a value you pick up front
            # | and embed, letting findReference/watchReference locate the exact transfer
            # | for a given order without unique deposit addresses. It is the join key
            # | between your ledger and the chain.
            explanation: "A signature só existe depois de o pagamento aterrissar, então você não consegue pré-registrar ela contra um pedido. A reference é um valor que você escolhe de antemão e embute, deixando findReference/watchReference localizar a transferência exata de um dado pedido sem endereços de depósito únicos. Ela é a chave de junção entre o seu livro-razão e a blockchain."  # @src=5796dfb26fa3
            options:                 # source order — keep it
              a:
                # | The reference is derived from the customer's wallet address at scan
                # | time, so it doubles as a refund handle and lets you push money back
                # | later without ever asking them for an address.
                label: "A reference é derivada do endereço da carteira do cliente na hora do escaneamento, então ela serve também como identificador de reembolso e te deixa empurrar dinheiro de volta depois sem nunca pedir um endereço a ele."  # @src=ed68390f6bda
                # | You generate the reference yourself, before the customer has scanned
                # | anything; it is random bytes carrying no wallet identity, so it cannot
                # | serve as a refund handle.
                feedback: "Você gera a reference você mesmo, antes de o cliente ter escaneado qualquer coisa; são bytes aleatórios que não carregam identidade de carteira nenhuma, então ela não consegue servir como identificador de reembolso."  # @src=3cea89f3e3e3
              d:
                # | The wallet hands the transfer's signature back to your page at approval,
                # | so you can join it to the order then and the reference is just
                # | insurance.
                label: "A carteira devolve a signature da transferência para a sua página na aprovação, então você consegue juntar ela ao pedido naquele momento e a reference é só um seguro."  # @src=618ae310b275
                # | On a scanned QR the paying wallet is a different device from your
                # | checkout page, so there is no callback to hand anything back. Even where
                # | one exists the browser is not evidence, which is why the server needs a
                # | handle it chose itself.
                feedback: "Num QR escaneado a carteira que paga é um dispositivo diferente da sua página de checkout, então não existe callback para devolver coisa nenhuma. Mesmo onde existe um, o navegador não é evidência, que é por isso que o servidor precisa de um identificador que ele mesmo escolheu."  # @src=bbdc18cb97b2
              b:
                # | The reference encrypts the amount and the recipient in the URL, so the
                # | wallet decrypts them at scan time and the customer cannot edit the price
                # | before paying.
                label: "A reference criptografa o valor e o destinatário na URL, então a carteira descriptografa eles na hora do escaneamento e o cliente não consegue editar o preço antes de pagar."  # @src=bee216866758
                # | References do not encrypt anything; the amount is plainly in the URL.
                # | Tamper-resistance is exactly why the next lesson moves pricing
                # | server-side.
                feedback: "References não criptografam nada; o valor está às claras na URL. Resistência a adulteração é exatamente o motivo de a próxima lição mover a precificação para o servidor."  # @src=8896b38ec8b3
              c:
                # | You cannot know the signature in advance, but you did choose the
                # | reference, so it is the join key that ties one on-chain transfer to one
                # | order.
                label: "Você não consegue saber a signature de antemão, mas você escolheu a reference, então ela é a chave de junção que amarra uma transferência on-chain a um pedido."  # @src=7046e80bfe43
                # | It joins, but it never authenticates: the reference is public.
                feedback: "Ela junta, mas nunca autentica: a reference é pública."  # @src=f0fa8d981af3
  m03-l2:
    # | Transaction requests: the server builds the transaction
    title: "Transaction requests: o servidor constrói a transação"  # @src=3f6255a50020
    blocks:
      check-overview:                      # quiz
        questions:
          q1:
            # | Your transaction-request server returns a base64 transaction to the wallet.
            # | In review, a teammate builds a hostile server that returns a transaction
            # | requiring a signature from an account the customer never submitted. What
            # | should a correct wallet do?
            prompt: "O seu servidor de transaction request devolve uma transação base64 para a carteira. Numa revisão, um colega de time constrói um servidor hostil que devolve uma transação exigindo uma signature de uma conta que o cliente nunca submeteu. O que uma carteira correta deveria fazer?"  # @src=feca058ad321
            # | Because the server hands the wallet a fully built transaction, the wallet is
            # | the only thing standing between the user and an unexpected signature. The
            # | Solana Pay spec makes this explicit: a request that demands a signature from
            # | an account the user did not submit is malicious and must be rejected. That
            # | trust boundary is the price of server-side control.
            explanation: "Como o servidor entrega à carteira uma transação completamente construída, a carteira é a única coisa entre o usuário e uma signature inesperada. A spec do Solana Pay deixa isso explícito: uma requisição que exige uma signature de uma conta que o usuário não submeteu é maliciosa e precisa ser rejeitada. Essa fronteira de confiança é o preço do controle do lado do servidor."  # @src=b7232d30b29c
            options:                 # source order — keep it
              d:
                # | Sign for the extra account when the customer's wallet holds its key; the
                # | spec calls a request malicious when nobody controls it.
                label: "Assinar pela conta extra quando a carteira do cliente tem a chave dela; a spec chama uma requisição de maliciosa quando ninguém a controla."  # @src=e245105b4013
                # | An account the customer controls is exactly what a hostile server hopes
                # | to get rubber-stamped: a treasury key, a multisig seat. The wallet knows
                # | one account was volunteered, and every other demanded signer is one
                # | nobody agreed to.
                feedback: "Uma conta que o cliente controla é exatamente o que um servidor hostil torce para ser aprovada no automático: uma chave de tesouraria, um assento de multisig. A carteira sabe que uma conta foi oferecida, e todo outro signatário exigido é um com que ninguém concordou."  # @src=444255d6f11f
              a:
                # | Treat it as malicious and refuse; the spec says a request demanding a
                # | signature from a non-submitted account must be rejected outright.
                label: "Tratar como maliciosa e recusar; a spec diz que uma requisição exigindo uma signature de uma conta não submetida precisa ser rejeitada de cara."  # @src=b5005cd9d059
                # | The wallet is the only party inspecting the transaction before a key
                # | touches it, which is why refusal belongs there. Your server is still
                # | unauditable by the customer.
                feedback: "A carteira é a única parte que inspeciona a transação antes de uma chave tocar nela, que é por que a recusa mora ali. O seu servidor continua não auditável pelo cliente."  # @src=31579f1f3c62
              c:
                # | Sign it but surface a warning afterward and log the extra signer so the
                # | merchant can review the anomaly later.
                label: "Assinar mas mostrar um aviso depois e logar o signatário extra para o lojista poder revisar a anomalia mais tarde."  # @src=4f234995c341
                # | Signing first and warning later has already exposed the account; the
                # | spec rule is to refuse before signing, not to audit after.
                feedback: "Assinar primeiro e avisar depois já expôs a conta; a regra da spec é recusar antes de assinar, não auditar depois."  # @src=f971bc2f2a3c
              b:
                # | Sign it as long as the fee is low, since the customer already trusted
                # | the domain by opening the payment link in the first place.
                label: "Assinar desde que a taxa seja baixa, já que o cliente confiou no domínio ao abrir o link de pagamento em primeiro lugar."  # @src=a94c2bc3612b
                # | Opening a link is not consent to sign for arbitrary accounts; a low fee
                # | does not make an unexpected signer safe. The wallet must reject it.
                feedback: "Abrir um link não é consentimento para assinar por contas arbitrárias; uma taxa baixa não torna um signatário inesperado seguro. A carteira precisa rejeitar."  # @src=8c1442a7306c
          q2:
            # | You are moving from the QR transfer-request checkout to transaction
            # | requests. What actually changes about who builds the transaction, and how is
            # | the URL different?
            prompt: "Você está migrando do checkout por QR com transfer request para transaction requests. O que de fato muda sobre quem constrói a transação, e como a URL é diferente?"  # @src=18e99530792a
            # | A transfer request (solana:<recipient>?...) has the wallet assemble a
            # | transfer from URL parameters. A transaction request (solana:<https-link>)
            # | inverts that: the wallet GETs display metadata, POSTs the paying account,
            # | and your server returns a complete base64 transaction. Moving construction
            # | server-side is what unlocks cart logic, memos, and references you control.
            explanation: "Uma transfer request (solana:<recipient>?...) faz a carteira montar uma transferência a partir de parâmetros da URL. Uma transaction request (solana:<https-link>) inverte isso: a carteira faz um GET de metadados de exibição, faz um POST da conta pagadora, e o seu servidor devolve uma transação base64 completa. Mover a construção para o lado do servidor é o que destrava lógica de carrinho, memos e references que você controla."  # @src=1bde7a014cdb
            options:                 # source order — keep it
              c:
                # | The customer's wallet builds a smart-contract call instead of a plain
                # | transfer, and your server's HTTPS endpoint only co-signs the result
                # | after the wallet has assembled and signed it.
                label: "A carteira do cliente constrói uma chamada de smart contract em vez de uma transferência simples, e o endpoint HTTPS do seu servidor só coassina o resultado depois que a carteira montou e assinou."  # @src=ae51d2d6dc7b
                # | The wallet does not author the transaction here; your server does. There
                # | is no separate client-built contract call for the server to co-sign.
                feedback: "A carteira não escreve a transação aqui; o seu servidor escreve. Não existe uma chamada de contrato separada construída no cliente para o servidor coassinar."  # @src=100a41c764ac
              b:
                # | The server now builds the transaction: the URL is solana:<https-link>,
                # | and the wallet GETs a label and icon, then POSTs {account} to receive a
                # | base64 transaction to sign.
                label: "O servidor agora constrói a transação: a URL é solana:<https-link>, e a carteira faz um GET de label e icon, depois faz um POST de {account} para receber uma transação base64 para assinar."  # @src=d809abc2ed21
                # | Inverting who assembles the transaction puts pricing and memos out of
                # | the customer's reach; the cost is the offline property, since a live
                # | HTTPS endpoint is now a checkout dependency.
                feedback: "Inverter quem monta a transação põe a precificação e os memos fora do alcance do cliente; o custo é a propriedade offline, já que um endpoint HTTPS no ar agora é uma dependência do checkout."  # @src=15b80c6b4b27
              a:
                # | Nothing changes about who builds it: the wallet still assembles the
                # | transfer from parameters, and the only real difference is that
                # | solana:<https-link> encodes into a denser QR than solana:<recipient>
                # | does.
                label: "Nada muda sobre quem constrói: a carteira ainda monta a transferência a partir de parâmetros, e a única diferença real é que solana:<https-link> codifica num QR mais denso do que solana:<recipient>."  # @src=f4ef48083594
                # | Who builds the transaction is precisely what changes; QR density is a
                # | rendering detail with no bearing on it.
                feedback: "Quem constrói a transação é precisamente o que muda; densidade de QR é um detalhe de renderização sem relação nenhuma com isso."  # @src=807378cabda3
              d:
                # | The wallet POSTs the cart contents alongside the account, and your
                # | server prices whatever line items the wallet sends it, then returns a
                # | transaction for the customer to sign.
                label: "A carteira faz um POST do conteúdo do carrinho junto com a conta, e o seu servidor precifica os itens de linha que a carteira mandar, depois devolve uma transação para o cliente assinar."  # @src=2edcd516e60c
                # | The spec's POST body is {account} and nothing else, which is the
                # | constraint doing the work. Anything else the build needs rides the URL
                # | you minted, so the cart stays state your server already holds.
                feedback: "O corpo do POST da spec é {account} e nada mais, e é essa restrição que faz o trabalho. Qualquer outra coisa de que o build precise viaja na URL que você cunhou, então o carrinho continua estado que o seu servidor já guarda."  # @src=029298d039e4
      check-lab:                      # quiz
        questions:
          q3:
            # | Marketing wants a coupon that takes 10% off a multi-item cart, plus an order
            # | id stamped on-chain. Why does the transaction-request path make this
            # | possible where the plain QR transfer request did not?
            prompt: "O marketing quer um cupom que tira 10% de um carrinho de vários itens, mais um id de pedido carimbado on-chain. Por que o caminho da transaction request torna isso possível onde a transfer request por QR pura não tornava?"  # @src=d27c0578b636
            # | The whole reason to move to transaction requests is that construction
            # | happens on your backend. The server applies the coupon, computes the final
            # | total, and stamps the order id into a memo plus a reference before returning
            # | the built transaction. None of it is exposed in a URL the customer could
            # | edit.
            explanation: "A razão inteira para migrar para transaction requests é que a construção acontece no seu backend. O servidor aplica o cupom, calcula o total final e carimba o id do pedido num memo mais uma reference antes de devolver a transação construída. Nada disso fica exposto numa URL que o cliente pudesse editar."  # @src=c6964a23b5ac
            options:                 # source order — keep it
              b:
                # | The wallet computes the discount locally from extra URL fields such as
                # | coupon and subtotal, so any pricing rule can be expressed client-side as
                # | long as you document the parameters you added.
                label: "A carteira calcula o desconto localmente a partir de campos extras da URL como coupon e subtotal, então qualquer regra de precificação pode ser expressa no lado do cliente desde que você documente os parâmetros que adicionou."  # @src=ad5cea585dcb
                # | There are no coupon or subtotal fields in the spec, and client-computed
                # | pricing is exactly the tamper risk you are escaping; the wallet never
                # | runs your discount logic.
                feedback: "Não existem campos coupon nem subtotal na spec, e precificação calculada no cliente é exatamente o risco de adulteração de que você está escapando; a carteira nunca roda a sua lógica de desconto."  # @src=adb066117adb
              c:
                # | Because your server builds the transaction, it computes the discounted
                # | total and injects the memo and reference itself, so pricing never lives
                # | in a customer-edited URL.
                label: "Porque o seu servidor constrói a transação, ele calcula o total com desconto e injeta o memo e a reference ele mesmo, então a precificação nunca mora numa URL editada pelo cliente."  # @src=7748539d715b
                # | Backend-computed values are out of the payer's reach, which stops
                # | tampering but does nothing about replay; a single-use coupon still needs
                # | state on your side.
                feedback: "Valores calculados no backend estão fora do alcance do pagador, o que barra adulteração mas não faz nada contra replay; um cupom de uso único ainda precisa de estado do seu lado."  # @src=a8dcb04a8e0b
              d:
                # | Because the transaction request runs your discount inside an on-chain
                # | program, so the total is computed by the chain and no query string a
                # | customer edits can change it.
                label: "Porque a transaction request roda o seu desconto dentro de um programa on-chain, então o total é calculado pela cadeia e nenhuma query string que um cliente edite consegue mudar ele."  # @src=fdc5745925bd
                # | Nothing custom runs on-chain here. What comes back is a plain v0
                # | transaction holding a memo and a TransferChecked, and the discount was
                # | arithmetic your server did before it built either one.
                feedback: "Nada customizado roda on-chain aqui. O que volta é uma transação v0 simples segurando um memo e um TransferChecked, e o desconto foi aritmética que o seu servidor fez antes de construir qualquer um dos dois."  # @src=61ded4cb4114
              a:
                # | Transaction requests add a dedicated coupon query parameter to the
                # | solana: URL, which transfer requests do not expose, so the discount
                # | travels inside the link the customer scans.
                label: "Transaction requests adicionam um parâmetro de query coupon dedicado à URL solana:, que transfer requests não expõem, então o desconto viaja dentro do link que o cliente escaneia."  # @src=5923c743828a
                # | There is no coupon parameter; discount logic is code you run, not a URL
                # | field. This misses why server construction matters.
                feedback: "Não existe parâmetro coupon; lógica de desconto é código que você roda, não um campo de URL. Isso perde por que a construção no servidor importa."  # @src=74bf90285658
          q4:
            # | A wallet hits your transaction-request endpoint with a GET before any
            # | purchase happens. What are you expected to return, and why does it come
            # | before the POST?
            prompt: "Uma carteira bate no seu endpoint de transaction request com um GET antes de qualquer compra acontecer. O que se espera que você devolva, e por que isso vem antes do POST?"  # @src=fa366b24ade6
            # | The GET is the display step: it returns a label and icon so the wallet can
            # | tell the user who they are paying. Only on the POST, once the wallet sends
            # | {account}, can the server build the transaction for that specific payer.
            # | Splitting the two is what lets the wallet show trustworthy context before
            # | anything is signed.
            explanation: "O GET é o passo de exibição: ele devolve um label e um icon para a carteira poder dizer ao usuário para quem ele está pagando. Só no POST, depois que a carteira manda {account}, é que o servidor consegue construir a transação para aquele pagador específico. Separar os dois é o que deixa a carteira mostrar contexto confiável antes de qualquer coisa ser assinada."  # @src=4bafd2a11483
            options:                 # source order — keep it
              c:
                # | The customer's current token balance, so the wallet can decide locally
                # | whether to enable the pay button.
                label: "O saldo de token atual do cliente, para a carteira poder decidir localmente se habilita o botão de pagar."  # @src=ad52d23d4098
                # | The endpoint returns merchant display metadata, not the customer's
                # | balance; the wallet already knows its own balances.
                feedback: "O endpoint devolve metadados de exibição do lojista, não o saldo do cliente; a carteira já conhece os próprios saldos."  # @src=5e071f270b2a
              b:
                # | The fully built base64 transaction immediately, so the wallet can
                # | preview and prepare the signature without a second round trip.
                label: "A transação base64 completamente construída na hora, para a carteira poder pré-visualizar e preparar a signature sem uma segunda ida e volta."  # @src=b077c222802f
                # | The built transaction is the POST response; you cannot build it on GET
                # | because you do not yet know the paying account.
                feedback: "A transação construída é a resposta do POST; você não consegue construir ela no GET porque ainda não sabe qual é a conta pagadora."  # @src=10963fdf7500
              a:
                # | A label and icon, so the wallet can show the customer who they are about
                # | to pay before it POSTs {account} to fetch the actual transaction.
                label: "Um label e um icon, para a carteira poder mostrar ao cliente para quem ele está prestes a pagar antes de fazer o POST de {account} para buscar a transação de verdade."  # @src=0aa2e7775cdf
                # | The GET arrives before any payer is known; only payer-independent data
                # | exists yet, and it is self-asserted besides, a wallet rendering whatever
                # | the endpoint claims. Context, not proof.
                feedback: "O GET chega antes de qualquer pagador ser conhecido; só existe ainda dado independente de pagador, e ele é autodeclarado ainda por cima, uma carteira renderizando o que quer que o endpoint afirme. Contexto, não prova."  # @src=8cd566460eff
              d:
                # | A label, an icon, and the order total in USDC, so the wallet can render
                # | the price on its screen before it POSTs {account} for the transaction.
                label: "Um label, um icon e o total do pedido em USDC, para a carteira poder renderizar o preço na tela dela antes de fazer o POST de {account} atrás da transação."  # @src=cac645623911
                # | Three quarters right and one field too many. The GET response the spec
                # | defines is label and icon; a total you bolt on is a field no wallet
                # | reads, and the price the customer actually sees comes back with the
                # | POST.
                feedback: "Três quartos certo e um campo a mais. A resposta do GET que a spec define é label e icon; um total que você parafusa nela é um campo que carteira nenhuma lê, e o preço que o cliente de fato vê volta com o POST."  # @src=35d9c2161aec
  m03-l3:
    # | The record fair: POS, and the mobile-hardware reality
    title: "A feira de discos: maquininha (POS) e a realidade do hardware mobile"  # @src=886741c2bdb9
    blocks:
      check:                      # quiz
        questions:
          q1:
            # | At the record fair a vendor asks if buyers can tap their phone to pay, like
            # | a contactless card terminal. What is the honest answer for Solana Pay today?
            prompt: "Na feira de discos, um vendedor pergunta se os compradores podem aproximar o celular para pagar, como numa maquininha de cartão por aproximação. Qual é a resposta honesta para o Solana Pay hoje?"  # @src=6d15037a16fd
            # | The research is blunt here: no primary spec or docs support NFC anywhere in
            # | Solana Pay or Solana Mobile. QR is the checkout surface. Promising
            # | tap-to-pay to a vendor would be selling a capability that does not exist, so
            # | the honest build is a QR POS.
            explanation: "A pesquisa é seca aqui: nenhuma spec primária ou documentação sustenta NFC em lugar nenhum do Solana Pay ou da Solana Mobile. QR é a superfície de checkout. Prometer pagamento por aproximação para um vendedor seria vender uma capacidade que não existe, então a construção honesta é uma maquininha de QR."  # @src=ac73a4059228
            options:                 # source order — keep it
              d:
                # | Yes; the spec itself says a Solana Pay URL may be encoded in QR codes or
                # | NFC tags, so a tap flow is defined.
                label: "Sim; a própria spec diz que uma URL de Solana Pay pode ser codificada em QR codes ou tags NFC, então um fluxo de aproximação está definido."  # @src=9ed0a374a889
                # | That sentence is about transport, not a tap flow. A tag holding the same
                # | solana: string is a QR code you cannot see; the spec defines no reader
                # | protocol, no handshake and no secure element.
                feedback: "Essa frase é sobre transporte, não sobre um fluxo de aproximação. Uma tag carregando a mesma string solana: é um QR code que você não consegue ver; a spec não define protocolo de leitor, nem handshake, nem secure element."  # @src=df458e22236a
              b:
                # | No; there is no NFC or tap-to-pay primitive on Solana, and QR remains
                # | the standard checkout surface.
                label: "Não; não existe primitivo de NFC nem de pagamento por aproximação na Solana, e o QR continua sendo a superfície de checkout padrão."  # @src=c8cd0ca33020
                # | Nothing in the spec or the mobile stack exposes an NFC path; what you
                # | can offer the vendor is the ergonomics rather than the gesture, since
                # | scanning is also one motion.
                feedback: "Nada na spec nem na stack mobile expõe um caminho de NFC; o que você pode oferecer ao vendedor é a ergonomia, e não o gesto, já que escanear também é um movimento só."  # @src=06700a25d265
              c:
                # | Only for Token-2022 mints, whose transfer-hook can carry the tap-to-pay
                # | handshake between the phone and the reader.
                label: "Só para mints Token-2022, cujo transfer-hook consegue carregar o handshake de pagamento por aproximação entre o celular e o leitor."  # @src=f5372fc93004
                # | Transfer hooks have nothing to do with NFC; there is no tap-to-pay path
                # | on any mint type.
                feedback: "Transfer hooks não têm nada a ver com NFC; não existe caminho de pagamento por aproximação em nenhum tipo de mint."  # @src=2eac56bf29c2
              a:
                # | Yes, through the Seed Vault NFC extension available on Seeker devices,
                # | which brings tap-to-pay to any stall using one.
                label: "Sim, através da extensão NFC do Seed Vault disponível em aparelhos Seeker, que traz pagamento por aproximação para qualquer barraca que use um."  # @src=ded958702596
                # | There is no Seed Vault NFC payments feature; Seed Vault is hardware key
                # | custody, and no tap-to-pay primitive exists.
                feedback: "Não existe funcionalidade de pagamentos NFC no Seed Vault; o Seed Vault é custódia de chave em hardware, e não existe primitivo de pagamento por aproximação."  # @src=c9ec244b0410
          q2:
            # | You look for a plug-and-play Solana POS terminal vendor and land on Decaf,
            # | which used to run festival POS. What do you find now, and what is the
            # | takeaway?
            prompt: "Você procura um fornecedor de maquininha Solana plug-and-play e cai na Decaf, que antes rodava maquininha de festival. O que você encontra agora, e qual é a lição?"  # @src=ff041e2aa3dd
            # | Decaf's site now sells payment links, invoicing, and remittances across 180+
            # | countries, with the Solana POS past gone. The honest read is that in-store
            # | crypto POS demand was thinner than payout and remittance demand. With no
            # | vendor catalog to lean on, you build the stall on the pay repo's first-party
            # | POS example.
            explanation: "O site da Decaf hoje vende links de pagamento, faturamento e remessas em mais de 180 países, com o passado de maquininha Solana apagado. A leitura honesta é que a demanda por maquininha cripto em loja física era mais fina do que a demanda por repasse e remessa. Sem catálogo de fornecedores em que se apoiar, você constrói a barraca em cima do exemplo de maquininha de primeira parte do repo do pay."  # @src=89fd0c78e7bf
            options:                 # source order — keep it
              a:
                # | Decaf now sells a Solana-native card terminal with a merchant dashboard,
                # | so the fastest path is buying their hardware and skipping the QR
                # | checkout entirely.
                label: "A Decaf hoje vende uma maquininha de cartão nativa da Solana com um painel de lojista, então o caminho mais rápido é comprar o hardware deles e pular o checkout por QR inteiramente."  # @src=ae02dbbcee7a
                # | Decaf sells no Solana POS hardware; assuming a terminal vendor exists is
                # | exactly the premise the pivot kills.
                feedback: "A Decaf não vende hardware de maquininha Solana nenhum; presumir que existe um fornecedor de terminal é exatamente a premissa que o pivô mata."  # @src=991a9ad5bfb7
              b:
                # | Decaf was acquired by Solana Mobile and folded into Seeker, so POS now
                # | ships built into the device.
                label: "A Decaf foi adquirida pela Solana Mobile e incorporada ao Seeker, então a maquininha agora vem embutida no aparelho."  # @src=c3c87eb16a7a
                # | No such acquisition; Decaf pivoted its own product, and Seeker does not
                # | ship a POS terminal.
                feedback: "Aquisição nenhuma dessas; a Decaf pivotou o próprio produto, e o Seeker não vem com terminal de maquininha."  # @src=c66c92ec7936
              c:
                # | Decaf pivoted to global payment links and remittances, so you build QR
                # | checkout on the pay repo's own examples/point-of-sale instead of buying
                # | a terminal.
                label: "A Decaf pivotou para links de pagamento globais e remessas, então você constrói o checkout por QR em cima do próprio examples/point-of-sale do repo do pay em vez de comprar um terminal."  # @src=b35cd9680ce0
                # | With no terminal vendor in the market, a first-party example is the only
                # | maintained base; an example is not a product, and the upkeep is yours.
                feedback: "Sem fornecedor de terminal no mercado, um exemplo de primeira parte é a única base mantida; um exemplo não é um produto, e a manutenção é sua."  # @src=2b768ffa0527
              d:
                # | Decaf left the Solana POS market for payment links, and the honest read
                # | is that in-store crypto checkout does not work, so tell the vendor to
                # | skip the stall.
                label: "A Decaf saiu do mercado de maquininha Solana para links de pagamento, e a leitura honesta é que checkout cripto em loja física não funciona, então diga ao vendedor para pular a barraca."  # @src=b04ce33afc9c
                # | The pivot says in-store demand was thinner than payout demand, which is
                # | a market fact about vendors rather than a verdict on your table. What it
                # | costs you is the vendor catalog, not the sale.
                feedback: "O pivô diz que a demanda em loja física era mais fina do que a demanda por repasse, o que é um fato de mercado sobre fornecedores, não um veredito sobre a sua mesa. O que isso te custa é o catálogo de fornecedores, não a venda."  # @src=9664dbf97549
          q3:
            # | You need the stall's checkout screen working by Saturday. Which foundation
            # | do you build on, and what should it talk to?
            prompt: "Você precisa da tela de checkout da barraca funcionando até sábado. Em que base você constrói, e com o que ela deve conversar?"  # @src=155ca8212d67
            # | The pay repo ships examples/point-of-sale (a Next.js POS) as a first-party
            # | base. Configuring it to hit your transaction-request endpoint reuses the
            # | server-built pricing you already have. Commerce Kit is beta and blinks are a
            # | different surface, so neither is the stall's foundation.
            explanation: "O repo do pay traz examples/point-of-sale (uma maquininha Next.js) como base de primeira parte. Configurar ela para bater no seu endpoint de transaction request reusa o preço montado no servidor que você já tem. O Commerce Kit é beta e blinks são outra superfície, então nenhum dos dois é a base da barraca."  # @src=f6b2f1a9baf1
            options:                 # source order — keep it
              b:
                # | The Commerce Kit PaymentButton component, which ships a hosted merchant
                # | dashboard and is the production-supported POS surface for stalls.
                label: "O componente PaymentButton do Commerce Kit, que vem com um painel de lojista hospedado e é a superfície de maquininha com suporte em produção para barracas."  # @src=48dffed3f8e9
                # | Commerce Kit is beta ('APIs may change') and ships no hosted dashboard;
                # | it is a mention, not the base for a stall you depend on.
                feedback: "O Commerce Kit é beta ('as APIs podem mudar') e não vem com painel hospedado nenhum; ele é uma menção, não a base para uma barraca da qual você depende."  # @src=09b03df742c0
              a:
                # | The pay repo's first-party examples/point-of-sale, configured to point
                # | at the transaction-request endpoint you built in m03-l2.
                label: "O examples/point-of-sale de primeira parte do repo do pay, configurado para apontar para o endpoint de transaction request que você construiu em m03-l2."  # @src=6867c38df66d
                # | The first-party example is the sanctioned base, and it does more than
                # | display: it finds the payment by reference and validates the transfer
                # | before flipping to confirmed. It still only vouches for the payment it
                # | was watching — the server-side verification discipline arrives in module
                # | 4.
                feedback: "O exemplo de primeira parte é a base sancionada, e ele faz mais do que exibir: ele encontra o pagamento pela reference e valida a transferência antes de virar para confirmed. Ele ainda só responde pelo pagamento que estava observando — a disciplina de verificação no servidor chega no módulo 4."  # @src=0017f36360b8
              d:
                # | The pay repo's examples/point-of-sale, left aimed at its own bundled API
                # | route, which already prices the cart and stamps the order id.
                label: "O examples/point-of-sale do repo do pay, deixado mirando na própria rota de API empacotada dele, que já precifica o carrinho e carimba o order id."  # @src=46ff1eef75fb
                # | Right base, wrong target. The bundled route is the example's own demo
                # | endpoint: it holds no catalog, stamps no order id, and knows nothing
                # | about the cart, so aiming the link there throws away three lessons of
                # | pricing you already own.
                feedback: "Base certa, alvo errado. A rota empacotada é o endpoint de demo do próprio exemplo: ela não guarda catálogo, não carimba order id e não sabe nada sobre o carrinho, então mirar o link ali joga fora três lições de precificação que você já tem."  # @src=00a56054fdd3
              c:
                # | A freshly authored blink, since blinks are the POS-native surface on
                # | mobile at a fair.
                label: "Um blink escrito na hora, já que blinks são a superfície nativa de maquininha no mobile numa feira."  # @src=974a1aedce6c
                # | Blinks are a social/link surface, not a POS terminal; that is the next
                # | lesson, and it does not replace the stall.
                feedback: "Blinks são uma superfície de social/link, não um terminal de maquininha; isso é a próxima lição, e não substitui a barraca."  # @src=42dd9122aba5
          q4:
            # | A slide for the fair cites 'Seeker has 150,000+ users' and '0% dApp Store
            # | fees.' How should you treat these when advising the vendor?
            prompt: "Um slide para a feira cita 'o Seeker tem 150,000+ usuários' e '0% de taxas da dApp Store'. Como você deve tratar isso ao aconselhar o vendedor?"  # @src=9e8c2009aa66
            # | Seeker's homepage makes claims (a '150,000+ users' figure with an unclear
            # | referent, a dApp Store '0% platform fees' line) but shipped-unit numbers are
            # | undisclosed. The honest move is homepage-claims phrasing without presenting
            # | the numbers as verified, while still giving the vendor the mobile context.
            explanation: "A homepage do Seeker faz afirmações (um número de '150,000+ usuários' com referente pouco claro, uma linha de '0% de taxas de plataforma' da dApp Store), mas os números de unidades vendidas não são divulgados. O movimento honesto é a formulação de afirmações-de-homepage sem apresentar os números como verificados, e ainda assim dar ao vendedor o contexto de mobile."  # @src=ce236394a0c8
            options:                 # source order — keep it
              a:
                # | Cite them as verified adoption metrics, since they appear directly on
                # | Solana Mobile's official site.
