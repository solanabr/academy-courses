                feedback: "Uma linha de taxa numa homepage é uma afirmação de preço, que é uma coisa que o fornecedor pode revisar, não uma divulgação auditada. As duas linhas viajam com a mesma atribuição, e nenhuma delas vira fato por ser mais fácil de conferir."  # @src=69a6f6a76a29
              b:
