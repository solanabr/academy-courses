                label: "A renderização nativa em carteira foi confirmada na onda de lançamento de 2024, então o link renderiza para qualquer um que tenha uma carteira Solana, rodando a extensão ou não."  # @src=3a23fcbcecb2
                # | The ecosystem pages naming specific wallets do date from that launch
