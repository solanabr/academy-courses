id: lesson-iwb-por-que-solana
slug: por-que-a-solana
title: Por que a Solana?
skills:
- solana-fundamentals
- spl-tokens
blocks:
- key: header
  type: prose
  src: header.md
- key: video
  type: video
  url: https://www.youtube.com/watch?v=PENDING-AULA-10
- key: content
  type: prose
  src: intro.md
- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: O que é uma stablecoin?
    multiSelect: false
    options:
    - id: d
      label: Uma criptomoeda que paga juros fixos ao dono
      correct: false
      feedback: Stablecoin não é promessa de rendimento. É um token atrelado a uma
        referência.
    - id: a
      label: O token nativo que paga as taxas da rede
      correct: false
      feedback: Esse é o SOL. A stablecoin é atrelada a uma referência, como o dólar.
    - id: b
      label: Um token atrelado a um valor de referência
      correct: true
      feedback: Isso. A de dólar, por exemplo, busca acompanhar o valor do dólar.
    - id: c
      label: Um token de teste, sem valor econômico
      correct: false
      feedback: Token de teste é coisa de Devnet. A stablecoin circula para valer.
    - id: e
      label: Uma moeda digital emitida pelo banco central
      correct: false
      feedback: Quem emite, no exemplo da aula, é uma empresa que guarda reservas.
    explanation: Stablecoin é uma moeda digital atrelada a um valor de referência,
      como o dólar.
  - id: q2
    prompt: Na explicação simplificada de Kuka, de onde vem o lastro de uma stablecoin
      de dólar?
    multiSelect: false
    options:
    - id: a
      label: A rede Solana garante o resgate em dólar
      correct: false
      feedback: A rede registra o token. Quem guarda as reservas e emite é uma empresa.
    - id: c
      label: O código do token proíbe o preço de mudar
      correct: false
      feedback: Nenhum código segura preço sozinho. O lastro vem das reservas do
        emissor.
    - id: b
      label: Os validadores fixam o preço a cada bloco
      correct: false
      feedback: Validadores conferem transações. O lastro está nas reservas de quem
        emite.
    - id: e
      label: Cada unidade é trocada por SOL na emissão
      correct: false
      feedback: O lastro do exemplo é em dólares guardados, não em SOL.
    - id: d
      label: O emissor guarda dólares em reserva
      correct: true
      feedback: Isso. A empresa recebe dólares, guarda em reserva e emite a mesma
        quantidade em tokens.
    explanation: De forma simplificada, uma empresa recebe dólares, guarda em reserva
      e emite a mesma quantidade de dólares digitais.
  - id: q3
    prompt: Um token foi programado para só chegar a endereços de uma lista. Alguém
      de fora da lista tenta receber. O que acontece?
    multiSelect: false
    options:
    - id: e
      label: A carteira escolhe se aplica a regra
      correct: false
      feedback: A regra não fica na carteira. Ela está no código do próprio token.
    - id: a
      label: A transação não chega a se completar
      correct: true
      feedback: 'Isso. A regra está no código: sem cumprir a condição, não importa
        quantas vezes se tente.'
    - id: c
      label: A transação passa se a taxa for maior
      correct: false
      feedback: Pagar mais não muda a regra programada no token.
    - id: d
      label: A transação passa e o emissor revisa depois
      correct: false
      feedback: A regra vale antes, não depois. Sem cumprir a condição, a transação
        não acontece.
    - id: b
      label: Um validador avalia e pode liberar
      correct: false
      feedback: Validador não abre exceção. Ele aplica as regras que estão no código.
    explanation: Dinheiro programável é como vários Pix, cada um com regras próprias
      gravadas no código.
  - id: q4
    prompt: Por que a rede privada de um banco traz de volta o problema da confiança?
    multiSelect: false
    options:
    - id: e
      label: Ela expõe os dados de todos ao público
      correct: false
      feedback: Uma rede privada faz o oposto. O problema é depender de quem a mantém.
    - id: b
      label: Ela não permite programar regras nos ativos
      correct: false
      feedback: Dá para programar regras também ali. A questão é quem controla a
        rede.
    - id: c
      label: Ela é lenta demais para uso financeiro
      correct: false
      feedback: Muitas funcionaram tecnicamente. O ponto levantado é a confiança
        entre instituições.
    - id: d
      label: Ela só aceita pagamentos em stablecoin
      correct: false
      feedback: Não é uma questão de qual ativo circula, e sim de quem mantém a
        rede.
    - id: a
      label: Os outros dependem de quem mantém a rede
      correct: true
      feedback: Isso. Alguém mantém a rede e coordena os acessos, e os demais precisam
        confiar nele.
    explanation: Uma rede institucional precisa funcionar entre instituições. Se
      uma só a mantém, as outras dependem dela.
  - id: q5
    prompt: O que uma pessoa precisa para enviar tokens em uma blockchain como a
      Solana?
    multiSelect: false
    options:
    - id: b
      label: Uma conta aberta em um validador da rede
      correct: false
      feedback: Validador não abre conta para usuário. Você interage pela carteira.
    - id: e
      label: Uma conta em um banco parceiro do protocolo
      correct: false
      feedback: Não é preciso banco no meio. A carteira é o que permite interagir.
    - id: d
      label: Uma carteira digital para autorizar o envio
      correct: true
      feedback: Isso. Pode ser um aplicativo instalado ou uma carteira embutida
        no próprio serviço.
    - id: a
      label: Um computador rodando um nó da rede
      correct: false
      feedback: Rodar um nó é para quem mantém a rede. Para usar, basta a carteira.
    - id: c
      label: Uma permissão concedida pela dona da rede
      correct: false
      feedback: 'A rede é aberta: ninguém precisa pedir permissão para usar.'
    explanation: Para interagir com a blockchain, por exemplo enviando tokens, a
      pessoa usa uma carteira digital.
