- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: How does the lesson distinguish validators, nodes, and clients?
    multiSelect: false
    options:
    - id: b
      label: All three are synonyms for a machine running the Solana software, differing
        only in how operators refer to them.
      correct: false
      feedback: The lesson separates consensus actor, running process, and submitting
        software as distinct roles.
    - id: c
      label: Clients are the consensus actors, validators are SDKs, and nodes are
        the wallets that hold user balances.
      correct: false
      feedback: 'Each role is swapped: validators vote, clients submit, and nodes
        are the running processes.'
    - id: a
      label: Validators are consensus actors; nodes are running processes and RPC
        endpoints; clients are SDKs or programs that submit transactions.
      correct: true
      feedback: Correct! Each term names a different position in the system.
    explanation: Validators take part in consensus, nodes are running processes and
      RPC endpoints, and clients are SDKs or programs submitting transactions.
  - id: q2
    prompt: What does a transaction declare, according to the lesson?
    multiSelect: false
    options:
    - id: a
      label: The market price of SOL at submission time.
      correct: false
      feedback: That is not part of a transaction's declaration.
    - id: b
      label: Which accounts it reads or writes.
      correct: true
      feedback: Correct! That declaration is what makes conflict detection possible.
    - id: c
      label: The exact validator that must execute it.
      correct: false
      feedback: Transactions do not choose their executing validator.
    explanation: Programs execute logic, accounts store state and lamports, and transactions
      declare which accounts are read or written.
  - id: q3
    prompt: What should you use an explorer for when diagnosing behaviour?
    multiSelect: false
    options:
    - id: a
      label: To edit account balances directly when a transfer settles for the wrong
        amount on a user's account.
      correct: false
      feedback: Explorers are read-only views of chain state; they cannot write to
        accounts.
    - id: b
      label: To re-sign a failed transaction on the user's behalf so it can be retried
        without opening the wallet.
      correct: false
      feedback: Signing requires the keypair and happens in the wallet, never in an
        explorer.
    - id: c
      label: To find signatures, status, fees, account pre/post balances, and program
        logs.
      correct: true
      feedback: Correct! Those fields are the diagnostic surface.
    explanation: Explorers expose signatures, status, fees, account pre/post balances,
      and program logs for diagnosis.
