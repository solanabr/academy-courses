- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: Which mental model does the lesson prescribe for the capstone?
    multiSelect: false
    options:
    - id: a
      label: The timeline plus architecture map, used to link events to system changes.
      correct: true
      feedback: Correct! The model connects history to the system it changed.
    - id: b
      label: A pure chronology with no architectural component.
      correct: false
      feedback: The architecture map is half of the model.
    - id: c
      label: A financial model of token emissions.
      correct: false
      feedback: That is not the capstone's mental model.
    explanation: The timeline + architecture map model links historical events to
      system changes.
  - id: q2
    prompt: What is the workflow the lesson defines?
    multiSelect: false
    options:
    - id: a
      label: Validate → Research → Publish.
      correct: false
      feedback: Research comes first and validation last.
    - id: b
      label: Research → Source → Structure → Validate, meeting exit criteria before
        moving on.
      correct: true
      feedback: Correct! Each stage has exit criteria you must satisfy.
    - id: c
      label: Draft → Publish → Revise, with no sourcing stage.
      correct: false
      feedback: Sourcing and validation are explicit stages.
    explanation: Follow Research → Source → Structure → Validate and meet each stage's
      exit criteria.
  - id: q3
    prompt: How should diagrams be annotated?
    multiSelect: false
    options:
    - id: a
      label: With decorative icons to improve readability.
      correct: false
      feedback: The annotation requirement is evidentiary, not aesthetic.
    - id: b
      label: With the author's personal opinion of each event.
      correct: false
      feedback: Annotations should carry artefacts and confidence, not opinion.
    - id: c
      label: With primary artefacts and confidence levels, so claims are auditable.
      correct: true
      feedback: Correct! Auditability is the goal of the annotation.
    explanation: Annotate diagrams with primary artefacts and confidence levels so
      claims can be audited.
