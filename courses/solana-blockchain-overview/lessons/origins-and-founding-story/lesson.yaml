- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: According to the lesson, what did Solana's origin story centre on?
    multiSelect: false
    options:
    - id: b
      label: Maximising anonymity by removing all timestamps from the ledger, so that
        ordering cannot be reconstructed by observers.
      correct: false
      feedback: The lesson describes adding a verifiable time primitive, not removing
        the ability to order events.
    - id: a
      label: Reducing coordination overhead by introducing a verifiable network time
        primitive, optimising for throughput and low latency.
      correct: true
      feedback: Correct! The verifiable time primitive is what lowers coordination
        overhead.
    - id: c
      label: Replicating Bitcoin's design exactly, keeping the same block cadence
        and hardware assumptions rather than changing priorities.
      correct: false
      feedback: The lesson contrasts Solana's founding priorities with Bitcoin's foundations
        instead of reproducing them.
    explanation: Solana's origin centred on reducing coordination overhead via a verifiable
      network time primitive, optimising for throughput and low latency.
  - id: q2
    prompt: How does the lesson describe the role of early funding and public milestones?
    multiSelect: false
    options:
    - id: a
      label: As a replacement for running public testnets, since committed capital
        already demonstrated the design worked.
      correct: false
      feedback: Testnets and benchmarks are described separately as the way prototypes
        became public artefacts.
    - id: b
      label: As coordination mechanisms that validated technical assumptions and attracted
        developer participation.
      correct: true
      feedback: Correct! They functioned as coordination signals, not just financial
        events.
    - id: c
      label: As purely financial events, recorded in the timeline but with no effect
        on technical direction or developer interest.
      correct: false
      feedback: The lesson presents them as validating technical assumptions and drawing
        developers in.
    explanation: Early funding and public milestones acted as coordination mechanisms
      validating assumptions and attracting developers.
  - id: q3
    prompt: What combination of founding roles does the lesson identify?
    multiSelect: false
    options:
    - id: c
      label: Protocol architecture, systems engineering, and developer outreach.
      correct: true
      feedback: Correct! Together they converted prototypes into public testnets and
        benchmarks.
    - id: a
      label: Marketing, legal, and compliance only.
      correct: false
      feedback: Those are not the founding roles the lesson names.
    - id: b
      label: A single founder handling every responsibility alone.
      correct: false
      feedback: The lesson describes a combination of distinct roles.
    explanation: Founding roles combined protocol architecture, systems engineering
      and developer outreach.
