- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: How does the lesson say milestones should be treated?
    multiSelect: false
    options:
    - id: b
      label: As calendar entries whose only value is chronological ordering, with
        no mechanism or measurable signal attached to them.
      correct: false
      feedback: Ordering alone does not tell you which mechanism the milestone exercised
        or what it changed.
    - id: c
      label: As marketing announcements with no technical content, useful for tracking
        public attention but not network behaviour.
      correct: false
      feedback: The lesson treats milestones as functional transitions with observable
        effects on the network.
    - id: a
      label: As functional transitions that map implementation steps to measurable
        adoption signals, not mere dates.
      correct: true
      feedback: Correct! A milestone is a change in what you can measure, not a calendar
        entry.
    explanation: Milestones map implementation steps to measurable adoption signals;
      they are functional transitions, not mere dates.
  - id: q2
    prompt: Which metrics does the lesson pair with each milestone type?
    multiSelect: false
    options:
    - id: a
      label: Social media follower counts for both.
      correct: false
      feedback: Those are not the metrics the lesson pairs with milestones.
    - id: b
      label: Telemetry for protocol releases, developer activity for ecosystem events.
      correct: true
      feedback: Correct! The metric must match the type of milestone being assessed.
    - id: c
      label: Token price for both protocol releases and ecosystem events.
      correct: false
      feedback: Price is not one of the signals the lesson proposes.
    explanation: Use telemetry for protocol releases and developer activity for ecosystem
      events.
  - id: q3
    prompt: What annotation turns a historical timeline into analysis?
    multiSelect: false
    options:
    - id: c
      label: Recording the mechanism exercised and the immediate observable indicator
        for each milestone.
      correct: true
      feedback: Correct! Mechanism plus observable indicator is what converts history
        into analysis.
    - id: a
      label: Recording the announcement date and its author for each entry, so the
        timeline stays verifiable and consistently sourced.
      correct: false
      feedback: Date and authorship make the timeline citable, but they do not turn
        it into analysis.
    - id: b
      label: Recording the number of press articles published about each entry, as
        a proxy for how important the milestone was.
      correct: false
      feedback: Press volume measures attention, not the mechanism a milestone exercised.
    explanation: Annotate each milestone with the mechanism exercised and its immediate
      observable indicator.
