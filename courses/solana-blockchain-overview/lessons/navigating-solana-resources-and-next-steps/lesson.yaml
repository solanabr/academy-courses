- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: What is the layered-evidence rule the lesson introduces?
    multiSelect: false
    options:
    - id: a
      label: Use docs, repo, on-chain data, and community — and require two signals
        to confirm a claim.
      correct: true
      feedback: Correct! One source alone is not confirmation.
    - id: b
      label: Trust the project's own documentation as the single source of truth.
      correct: false
      feedback: The lesson requires corroboration across layers.
    - id: c
      label: Accept any claim repeated by three community members.
      correct: false
      feedback: Community is one layer, not a substitute for the others.
    explanation: Use layered evidence across docs, repo, on-chain data and community,
      requiring two signals to confirm a claim.
  - id: q2
    prompt: Which artefacts should be prioritised when judging whether a project is
      maintained?
    multiSelect: false
    options:
    - id: a
      label: The visual polish of the marketing site.
      correct: false
      feedback: Presentation is not evidence of maintenance.
    - id: b
      label: Cryptographic and version artefacts such as release tags and CI.
      correct: true
      feedback: Correct! These are harder to fake than prose.
    - id: c
      label: The number of stars on the repository.
      correct: false
      feedback: Stars are not the artefacts the lesson prioritises.
    explanation: Prioritise cryptographic and version artefacts — release tags, CI
      — when judging maintenance.
  - id: q3
    prompt: What should you record for each project you review?
    multiSelect: false
    options:
    - id: a
      label: A full transcript of every community chat message.
      correct: false
      feedback: The lesson asks for concise comparison rows, not transcripts.
    - id: b
      label: Only the project's name and website.
      correct: false
      feedback: That would not support the later analysis.
    - id: c
      label: Concise comparison rows that support later incentive and architecture
        analysis.
      correct: true
      feedback: Correct! The rows feed the analysis that comes next.
    explanation: Record concise comparison rows per project to support incentive and
      architecture analysis later.
