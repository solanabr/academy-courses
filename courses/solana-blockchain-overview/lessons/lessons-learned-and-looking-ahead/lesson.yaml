- key: quiz
  type: quiz
  questions:
  - id: q1
    prompt: Which recurring themes does the lesson identify across Solana's history?
    multiSelect: false
    options:
    - id: a
      label: Throughput-first design, rapid iteration, tooling-driven concentration,
        and narrative framing.
      correct: true
      feedback: Correct! These four themes recur across the period studied.
    - id: b
      label: Privacy-first design, slow release cadence, and hardware neutrality.
      correct: false
      feedback: Those are not the themes the lesson identifies.
    - id: c
      label: Regulatory compliance, token buybacks, and exchange listings.
      correct: false
      feedback: The lesson's themes are technical and ecological, not market-oriented.
    explanation: The recurring themes are throughput-first design, rapid iteration,
      tooling-driven concentration, and narrative framing.
  - id: q2
    prompt: Which concrete signals does the lesson tell you to watch?
    multiSelect: false
    options:
    - id: a
      label: Conference attendance and podcast downloads, taken together as a proxy
        for how healthy the network has become.
      correct: false
      feedback: Attention metrics say nothing about validator diversity or patch cadence.
    - id: b
      label: Validator diversity, emergency patch cadence, app concentration, and
        governance messages.
      correct: true
      feedback: Correct! These are measurable and expose the health behind the narrative.
    - id: c
      label: Token price, trading volume, and market capitalisation, read as the fastest
        summary of the network's trajectory.
      correct: false
      feedback: The lesson asks for operational and governance signals rather than
        market ones.
    explanation: Watch validator diversity, emergency patch cadence, app concentration,
      and governance messages.
  - id: q3
    prompt: According to the lesson, which signal indicates that application concentration
      on a network is rising?
    multiSelect: false
    options:
    - id: a
      label: The number of programming languages supported by the network's official
        SDKs grows with each release.
      correct: false
      feedback: SDK breadth describes the tooling surface, not where real activity
        is concentrated.
    - id: c
      label: A few programs and a few RPC providers account for most of the network's
        transactions and reads.
      correct: true
      feedback: Correct! Concentration is measured by how much of the total activity
        a small set of actors carries.
    - id: b
      label: The average transaction fee paid by users falls steadily over a sustained
        period of time.
      correct: false
      feedback: Lower fees indicate spare capacity or a pricing change, not which
        applications hold the activity.
    explanation: Concentration shows up when a small number of programs and infrastructure
      providers account for most of the network's activity — a few applications carrying
      most transactions, and a few RPC providers serving most reads.
