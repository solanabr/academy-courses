# list is the full C2 vocabulary rather than a subset — it is what the lesson
# actually re-tests. Keep it in sync with the q1–q25 mapping in the quiz block.
skills:
  - account-layout
  - anchor
  - borsh-serialization
  - build-server
  - checked-arithmetic
  - compiler-errors
  - debugging
  - error-handling
  - pdas
  - program-security
  - rust
  - rust-borrowing
  - rust-control-flow
  - rust-enums
  - rust-lifetimes
  - rust-modules
  - rust-move-semantics
  - rust-option
  - rust-ownership
