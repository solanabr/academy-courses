id: course-solana-for-web-devs
slug: solana-for-web-devs
title: Solana for Web Devs
description: >-
  You already write JavaScript or TypeScript. That is the whole prerequisite —
  no blockchain, no cryptography, no Rust, nothing installed. This course runs
  entirely in your browser against a real, frozen program on Solana's devnet.
  You start by reading its live vault account in an explorer, then decode its
  49 raw bytes by hand — discriminator, owner, balance, bump — then reproduce
  its address from seeds, so an on-chain account stops being a mystery and
  becomes a byte layout you own. Then you sign: transaction anatomy with the
  exact fee arithmetic, a funded devnet wallet of your own, and a real deposit
  into the vault, confirmed on-chain with the signature to prove it. You finish
  by assembling everything into a working account inspector — paste any devnet
  address, get type, SOL, owner, rent-exemption, and decoded vault fields with
  every failure path handled. Everything is taught against `@solana/kit` 7.0.0,
  the current stack; one lesson maps it against the legacy web3.js v1 code you
  will still meet in the wild, with dates and download counts, so you can read
  old codebases without writing like them. Version stamp — kit 7.0.0, devnet,
  authored 2026-07-28.
difficulty: beginner
duration: 6
xpPerLesson: 10
xpReward: 500
creatorRewardXp: 30
minCompletionsForReward: 10
trackId: 1
trackLevel: 1
creator: B7o8NfV81HzjuZFWQTTx3Xdvh77Dqoajwib3kWEnvzJF
modules:
  - key: sfwd-read-the-chain
    title: Read the Chain
    description: >-
      Point at a real devnet program and take its state apart. You read the
      live vault in an explorer without writing a line of code, then fetch the
      same account over RPC and decode its 49 bytes by hand — 8-byte
      discriminator, 32-byte owner, little-endian u64 balance, bump — and then
      reproduce the vault's address from its seeds and watch a wrong seed
      order produce a different address. You end holding a working
      `decodeVault` you wrote yourself, over bytes recorded from the real
      account. That decoder is the core of the inspector you ship in module 3,
      and the exact layout that becomes a Rust struct in Course 2.
    lessons:
      - lesson-sfwd-see-a-live-vault
      - lesson-sfwd-accounts-are-just-bytes
      - lesson-sfwd-derive-the-vault-pda
  - key: sfwd-sign-your-own-transaction
    title: Sign Your Own Transaction
    description: >-
      Stop reading and start writing. You take a complete Kit transaction
      apart and predict its exact cost before it runs — 5,000 lamports per
      signature plus price times the REQUESTED compute-unit limit — then map
      the current stack against the legacy web3.js v1 code that still floods
      npm and every old codebase, so you can read the wild without importing
      it. Then the real thing: connect a wallet through Wallet Standard, fund
      it on devnet, and sign a deposit into the very vault you spent module 1
      decoding — accounts in IDL order, discriminator plus little-endian
      amount, confirmed on-chain with an explorer signature on your profile.
    lessons:
      - lesson-sfwd-anatomy-of-a-transaction
      - lesson-sfwd-kit-or-legacy
      - lesson-sfwd-connect-fund-and-send
  - key: sfwd-publish-the-inspector
    title: Publish the Inspector
    description: >-
      Assemble RPC read, byte decode, and PDA derivation into one working
      inspector: give it any devnet address and it answers — account type,
      SOL, owner, rent-exemption, and decoded vault fields when the owner and
      discriminator check out. The grade lives in the failure paths: accounts
      that do not exist, accounts with no data, accounts that only look like
      vaults. Two graded rungs — first complete the branch table, then write
      the decode path unaided against fixtures recorded from real devnet
      accounts. Close by naming every artifact you built and exactly which one
      Course 2 picks up.
    lessons:
      - lesson-sfwd-ship-the-inspector
      - lesson-sfwd-what-you-built
