<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../_brand.css">
<link rel="stylesheet" href="../_render.css">
<style>
  @page { size: 1600px 900px; margin: 0; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; display: flex; align-items: center;
         justify-content: center; background: var(--surface-page); padding: 72px; }
  .viz { position: relative; width: 100%; }
</style></head>
<body>
<!-- diagram: O que acabou de acontecer
     purpose: Fechar o loop mostrando que o claim gratuito rodou na mesma infra das instituições e apontar o próximo passo
     data: Seu cNFT vive na mainnet real; a taxa foi patrocinada pelo evento (modelo fee-payer padrão da Solana); é a mesma infraestrutura que instituições como a BlackRock usam; próximo passo: stand de onramp para guardar dólar digital que rende
     prompt: Diagrama mobile-first para celular, tipografia grande, alto contraste, no máximo 3 elementos, um card central "seu cNFT na mainnet" com dois selos (taxa patrocinada, mesma infra das instituições) e uma seta apontando para o stand de onramp
     BUILD .viz as on-brand HTML per skills/content-gen/references/visual-rendering.md.
     Header: <div class="stbr-eyebrow">..</div> + <h2 class="viz-title">..</h2>.
     Leave the .stbr-decor block untouched (per-asset brand decoration).
     WeasyPrint-safe CSS only: flexbox/grid/borders/gradients; NO box-shadow, NO
     background-image url(), NO JS. Use brand tokens (--surface-*, --text-*, --stbr-*). -->
<div class="stbr-decor" aria-hidden="true">
  <div style="position:absolute;width:588px;height:552px;top:-338px;right:-338px;border-radius:54% 64% 46% 47% / 52% 47% 64% 56%;background:#008b4c;opacity:0.5;"></div>
  <div style="position:absolute;width:454px;height:436px;bottom:-248px;left:-248px;border-radius:48% 47% 36% 54% / 40% 52% 53% 61%;background:#306c40;opacity:0.5;"></div>
</div>
<div class="viz">
<style>
  .dg { display:flex; align-items:center; gap:0; margin-top:34px; }
  .hero { flex:0 0 760px; background:var(--surface-brand); color:var(--text-on-brand);
    border-radius:var(--radius-2xl); padding:44px 46px; }
  .hero .k { font-family:var(--font-body); font-weight:800; font-size:16px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--stbr-yellow); margin-bottom:14px; }
  .hero .name { font-family:var(--font-display); font-weight:900; font-size:52px;
    line-height:1.06; color:var(--text-on-brand); }
  .seals { display:flex; gap:20px; margin-top:32px; }
  .seal { flex:1 1 0; background:rgba(245,232,202,0.12);
    border:1.5px solid var(--border-on-dark); border-radius:var(--radius-lg); padding:22px 22px; }
  .seal .st { font-family:var(--font-body); font-weight:800; font-size:15px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--stbr-yellow); margin-bottom:8px; }
  .seal .sb { font-family:var(--font-body); font-weight:600; font-size:22px;
    line-height:1.25; color:var(--stbr-cream); }
  .arrow { flex:0 0 92px; align-self:center; display:flex; align-items:center;
    justify-content:center; color:var(--stbr-emerald); font-size:60px; font-weight:900; }
  .cta { flex:1 1 auto; align-self:center; background:var(--surface-accent);
    border-radius:var(--radius-2xl); padding:44px 40px; }
  .cta .k { font-family:var(--font-body); font-weight:800; font-size:15px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--stbr-green-800); margin:0 0 14px; }
  .cta .name { font-family:var(--font-display); font-weight:900; font-size:40px;
    line-height:1.1; color:var(--stbr-dark); margin:0; }
  .cta .sub { font-family:var(--font-body); font-weight:600; font-size:21px;
    line-height:1.3; color:var(--stbr-green-800); margin:18px 0 0; }
</style>
  <div class="stbr-eyebrow">o que acabou de acontecer</div>
  <h2 class="viz-title">de graça, na infra de verdade</h2>
  <div class="dg">
    <div class="hero">
      <div class="k">seu cNFT agora vive</div>
      <div class="name">na mainnet real da Solana</div>
      <div class="seals">
        <div class="seal">
          <div class="st">taxa patrocinada</div>
          <div class="sb">o evento pagou por você (modelo fee-payer da Solana)</div>
        </div>
        <div class="seal">
          <div class="st">mesma infra</div>
          <div class="sb">a rede que instituições como a BlackRock usam</div>
        </div>
      </div>
    </div>
    <div class="arrow">&rarr;</div>
    <div class="cta">
      <div class="k">próximo passo &rarr;</div>
      <div class="name">stand de onramp</div>
      <div class="sub">guarde dólar digital que rende</div>
    </div>
  </div>
</div>
</body></html>
