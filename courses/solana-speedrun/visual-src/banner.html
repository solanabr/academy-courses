<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<link rel="stylesheet" href="_render.css">
<style>
  @page { size: 1600px 900px; margin: 0; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; position: relative; overflow: hidden;
         background: var(--stbr-dark); font-family: var(--font-body); }
  .bg { position: absolute; top: 0; left: 0; width: 1600px; height: 900px;
        object-fit: cover; }
  .glass { background-color: rgba(20,26,21,0.52);
           background-image: linear-gradient(155deg, rgba(255,255,255,0.14) 0%,
               rgba(255,255,255,0.04) 35%, rgba(255,255,255,0.00) 60%,
               rgba(0,0,0,0.06) 100%);
           border: 1.5px solid rgba(245,232,202,0.32); }
  .eyebrow { font-family: var(--font-display); font-weight: var(--weight-bold);
             font-size: 24px; letter-spacing: 0.15em; text-transform: uppercase;
             color: var(--stbr-yellow); }
  /* inline-BLOCK, not inline-flex: WeasyPrint double-draws borders on inline-flex */
  .pill { display: inline-block; padding: 13px 28px;
          border-radius: var(--radius-pill); font-family: var(--font-display);
          font-weight: var(--weight-bold); font-size: 23px; letter-spacing: 0.08em;
          text-transform: uppercase; white-space: nowrap; }
  .pill svg { vertical-align: -4px; margin-right: 8px; }
  .pill--level { background: var(--stbr-emerald); color: var(--text-on-brand); }
  .pill--xp    { background: var(--stbr-yellow); color: var(--text-on-accent); }
  .pill--glass { background-color: rgba(20,26,21,0.45);
                 border: 1.5px solid rgba(245,232,202,0.45); color: var(--stbr-cream); }
  .shade { position: absolute; top: 0; left: 0; width: 1600px; height: 900px;
           background: linear-gradient(180deg, rgba(17,22,15,0.42) 0%,
               rgba(17,22,15,0.05) 26%, rgba(17,22,15,0.00) 44%,
               rgba(17,22,15,0.58) 74%, rgba(17,22,15,0.92) 100%); }
  .top { position: absolute; top: 52px; left: 88px; right: 88px; z-index: 1;
         display: flex; justify-content: space-between; align-items: center; }
  .lockup { position: absolute; left: 88px; right: 88px; bottom: 56px; z-index: 1; }
  .lockup .title { font-family: var(--font-display); font-weight: var(--weight-black);
                   color: var(--stbr-cream); font-size: 84px; line-height: 1.06;
                   letter-spacing: var(--tracking-tight); margin: 0 0 30px; }
  .lockup .meta { display: flex; gap: 16px; align-items: center; }
  .lockup .meta .pill--xp { margin-left: auto; }
</style></head>
<body>
<!-- banner-bg: blur=0.0 brightness=1.0 file=banner-bg-sharp.png -->
<img class="bg" src="banner-bg-sharp.png" alt="">
<div class="shade"></div>
<div class="top">
  <div class="eyebrow">// EVENTO &middot; SOLANA SPEEDRUN</div>
  <img src="logo-cream.svg" style="height: 42px;" alt="">
</div>
<div class="lockup">
  <h1 class="title">Solana <span style="border-bottom: 6px solid var(--stbr-yellow); padding-bottom: 2px;">Speedrun</span>:<br>Inicie sua jornada<br>onchain em minutos</h1>
  <div class="meta">
    <span class="pill pill--level">INICIANTE</span>
    <span class="pill pill--glass">4 LI&Ccedil;&Otilde;ES &middot; 15 MIN</span>
    <span class="pill pill--xp"><svg width="18" height="26" viewBox="0 0 16 24"><polygon points="9,0 0,14 6,14 5,24 16,9 9,9" fill="#1b231d"/></svg>80 XP</span>
  </div>
</div>
</body></html>
